# lem:pushup_local with absolute minimality in place of causal arc-connectedness, at the price of T1.
# Read 2026-11-21 (`#check`, lake env lean on a file outside the tree): {M} [TopologicalSpace M]
# {C : Causality M} [T1Space M], C.AbsolutelyMinimal → C.LocallyPushUp → C.PushUp, no other premise;
# T1 in `standing` (ambient). With push_up ⇒ locally_push_up it makes push_up ⇔ locally_push_up on
# absolutely minimal T1 spacetimes (Causal.Causality.AbsolutelyMinimal.pushUp_iff_locallyPushUp). The
# edge above stays: it is the printed form, and asks no T1. Sharp in all three hypotheses: absolute
# minimality (the gated line, no-gluing only, locally
# push-up without push-up: Causal.gateLine_separates_pushUp), local push-up (the half-chronological
# line, causally arc-connected without it: Causal.halfChronoLine_separates_pushUp; both [[fails]]
