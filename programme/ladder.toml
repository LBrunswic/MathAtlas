# ---- consequences at is_causal and causally_compact (T-lad-gh-causal, 2026-11-21). Both read ≤_M
# only: they pass to C.dual and along a homeomorphism carrying ≤_M onto ≤_N (Causal.LeTopIso, which a
# causal isomorphism is: Causal.IsCausalIso.leTopIso). The LeTopIso transport holds also of
# globally_hyperbolic, strongly_causal, strongly_causal_open and tarentin (Causal.LeTopIso.*_iff,
# Causal/CausalIsoInvariance.lean), and IsCausalIso transports every causality-sort node: a fact
# about the ladder, not listed node by node.
[[consequence]]
at = "is_causal"
statement = "causality is invariant under time reversal: C.dual is causal iff C is"
witness = "Causal.Causality.dual_isCausal"
status = "checked"

[[consequence]]
at = "is_causal"
statement = "causality is transported by a homeomorphism e : M ≃ₜ N carrying ≤_M onto ≤_N (x ≤_M y ⇔ e x ≤_N e y), in particular by a causal isomorphism"
witness = "Causal.LeTopIso.isCausal_iff"
under = "the homeomorphism e with Causal.LeTopIso C D e"
status = "checked"

[[consequence]]
at = "causally_compact"
statement = "causal compactness is invariant under time reversal: C.dual is causally compact iff C is"
witness = "Causal.Causality.dual_causallyCompact"
status = "checked"

[[consequence]]
