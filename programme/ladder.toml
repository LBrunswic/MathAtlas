# The causality ladder of ETT: a DAG of causal-topological properties, with consequences at every level.
#
# Checked by `python3 tools/ladder.py check`; Lean automation generated from it by
# `python3 tools/ladder.py emit-lean` (Causal/Ladder/Rules.lean, the `causal_ladder` tactic's rules).
#
# [[property]]  id, lean (the Causal definition), label (ETT ledger label, if any), what (one line),
#               sort (optional: "geometry" or "pair"; absent means "causality", see below)
# [[implies]]   from (list of ids, read as a conjunction), to (id), witness (Lean theorem),
#               under (side conditions that are not ladder nodes, in words), status seed|checked
# [[fails]]     from, to, witness (a Lean counterexample: a space with `from` and not `to`), status
# [[consequence]] at (id), statement (one line), witness (Lean theorem),
#               under (the witness's other hypotheses, ladder ids named as such, in words), status
# [[open]]      from, to, note: a pair whose implication is neither proved nor refuted
#
# status `seed`: the witness name exists, but its side conditions have not been read against the edge;
# the ladder-keeper reads them and turns the edge `checked` (or fixes `under`).
#
# Names are written fully qualified (`Causal.Causality.…`, `Causal.Precausality.…`), as the ETT ledger
# lists its declarations; each was resolved by the Lean elaborator (`#check`) on 2026-11-20.
#
# `under` is NOT read by the closure (`check`, `matrix`): it chains an edge with `under` as if it were
# unconditional; emit-lean reads `under` only to skip such an edge (no rule). Two kinds of side
# condition occur below. (1) Separation (T1, Hausdorff): ETT's topological spacetimes are second
# countable Hausdorff (def:category_topological_spacetimes, ETT.tex:255), so these are standing
# assumptions of the paper; a non-Hausdorff counterexample (branching spaces) must not be read against
# such an edge. (2) Localisation hypotheses (local push-up, local causal openness, chronal neighbours
# in every open set): these are substantive, and the closure through them overstates what is proved
# until they are ladder nodes with Lean definitions (see the comments at those edges).
#
# Three sorts of property (T-lad-cbg-geometry-nodes, T-lad-nested-nodes, 2026-11-20); `pair` is
# described after `geometry`, and what is said here of two sorts holds of any two. A property of sort
# `causality` (the default: no `sort` field) has a Lean definition that is a predicate on one
# causality C on a topological space M; implications, counterexamples, `open` entries and the matrix
# are about these.
# A property of sort `geometry` (`sort = "geometry"`) has a Lean definition that is a predicate on the
# structures and morphisms of a geometry, Causal.CBG.Geometry (Level A) or Causal.CBG.LocalModel
# (Level B), not on one causality: `rigid` (A1: a predicate on a class of morphisms), `germ_extension`
# (A3) and `cauchy_slice` (A4), the localisation properties of Sbierski's MGHD argument
# (lean-causal/docs/CBG-DESIGN.md §2). They are [[property]] entries because tools/binder.py takes the
# ids a binder may name from [[property]] only.
# * `check` and `matrix` do not read `sort` (they ignore keys they do not know); emit-lean does (last
#   item). `matrix` therefore lists every pair joining the two sorts as `unknown`: such a pair is
#   ill-typed (neither implication is a statement), it is neither open nor a gap. Read the matrix
#   within one sort; `check`'s "k of n ordered pairs classified" counts n over all ordered pairs, the
#   ill-typed ones included.
# * No [[implies]], [[fails]] or [[open]] entry joins two sorts. A property of one sort enters an
#   edge or a consequence of another only through `under`, in words.
# * Within the geometry sort a pair is read at Level B (a local model 𝔐; `rigid` then means
#   IsRigidFor (𝔐.IsMor s t) for all structures s, t with Hausdorff target). At Level A all three
#   are fields of Causal.CBG.Geometry and hold outright.
# * A consequence at a geometry property is a theorem over a Causal.CBG.Geometry, whose fields carry
#   all three (and the A2 causal facts); it is listed at the property whose field its proof consumes.
# * No geometry-sort [[implies]] is recorded. At Level B, `germ_extension` ⇒ `rigid` and
#   `cauchy_slice` ⇒ `rigid` hold with the premise unused: every local model is rigid
#   (Causal.CBG.eqOn_of_liftPropOn, from the field LocalModel.rigid). A premise-free fact is not an
#   edge, so these two pairs stay `unknown`. emit-lean reads `sort`: an edge joining a property not of
#   the sort `causality` is never a CausalLadder rule (the rules are about one causality), only a
#   skipped-edge comment line in Rules.lean.
#
# A property of sort `pair` (`sort = "pair"`, T-lad-nested-nodes) has a Lean definition that is a
# predicate on TWO causalities C, C' of one topological space M, a nesting: "C is nested in C'", C the
# narrower causality, C' the wider (Causal/NestedCausalities.lean). Sub- and superluminality are
# nestings (ERS 1802.03020 §4: the cone of g(u, du) inside Minkowski's, or T timelike for every
# g(u, du)); so is Reall 2101.11623's effective-metric cone inside the causal cone. A nesting is a
# relation between two spacetime structures on M, the localisation property programme/README.md calls
# "a nesting of two causalities", and a predicate on neither one causality nor a geometry.
# * `le_nested` is Causal.Causality.LeNested C C' (≤_U of C inside ≤_U of C', every open U).
#   `curve_nested` is Causal.Causality.CurveNestedOn C C' W, read at the open W its entry names (W = M
#   when none is named); it passes to every open V ⊆ W (consequence Causal.Causality.CurveNestedOn.mono),
#   so at W = M it is curve nesting on every open.
# * Within the pair sort an entry keeps C and C' fixed: `le_nested ⇒ curve_nested` reads
#   LeNested C C' ⇒ CurveNestedOn C C' W for every open W.
# * A causality-sort property in a pair-sort entry is asked of ONE of the two causalities, and `under`
#   says which ("of C", the narrower; "of C'", the wider). What a nesting does is transfer: a
#   consequence at a pair property takes causality-sort properties of one causality to the other,
#   typically from the wider C' to the narrower C. When the transfer is sharp (it fails without its
#   extra hypothesis) the counterexample cannot be a [[fails]] entry, which would join two sorts: it is
#   named in the comment above the consequence.
# * emit-lean makes no CausalLadder rule of a pair-sort edge (emitted() skips any edge with a property
#   not of the sort `causality`; a skipped-edge comment line in Rules.lean), and asks `lean_form` of no
#   pair property (emit_test keeps the sort `causality` only; LeNested's binder `C C' : Causality M`
#   would otherwise be misread as one causality).
# * Not nodes: Causal.Causality.LtNested (≪-nesting; no theorem of the library uses it) and
#   Causal.Causality.InextensibleNestedOn, whose node waits on OQ-41 (b) (T-lad-nested-inextensible);
#   the latter appears below in words only, as the conclusion of a consequence at `curve_nested`.
#
# The names added on 2026-11-20 by T-lad-cbg-geometry-nodes and by T-lad-nested-nodes were resolved by
# `#check` against the library as built that day (lake env lean, no build).

[[property]]
id = "is_causal"
lean = "Causal.Causality.IsCausal"
label = "def:causal_spacetime"
what = "≤_M is antisymmetric (an order, reflexivity and transitivity being axioms): no closed causal loops in M"

[[property]]
id = "strongly_causal"
lean = "Causal.Causality.StronglyCausal"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains a neighbourhood, not necessarily open, causally convex in M (the definition, DEC-7)"

[[property]]
id = "strongly_causal_open"
lean = "Causal.Causality.StronglyCausalOpen"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains an OPEN neighbourhood causally convex in M (the literal reading through defi:convexite_causale; auxiliary since DEC-7)"

[[property]]
id = "globally_hyperbolic"
lean = "Causal.Causality.GloballyHyperbolic"
label = "def:globally_hyperbolic"
what = "causal, and every full diamond J_M(p,q) is compact"

[[property]]
id = "push_up"
lean = "Causal.Causality.PushUp"
label = "defi:pushup"
what = "in every open U: x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z"

[[property]]
id = "causally_open"
lean = "Causal.Causality.CausallyOpen"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) and J⁻_U(V) are open (the definition read with J±, DEC-8)"

[[property]]
id = "causally_open_future"
lean = "Causal.Causality.CausallyOpenFuture"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) is open (the definition as printed, J⁺ alone; auxiliary since DEC-8)"

[[property]]
id = "absolutely_minimal"
lean = "Causal.Precausality.AbsolutelyMinimal"
label = "def:topological_space_causality_absolutely"
what = "for every open cover, the precausality generated by the restrictions to its members is the given one"

[[property]]
id = "causally_arc_connected"
lean = "Causal.Causality.CausallyArcConnected"
label = "def:causal_arc_connectedness"
what = "in every open U, p ≤_U q (resp. p ≪_U q) iff a causal (resp. chronal) curve in U joins p to q"

[[property]]
id = "causally_plain"
lean = "Causal.Causality.CausallyPlain"
label = "defi:causalement_plat"
what = "for every open U and A ⊂ M, Int J±_U(A) ⊂ closure I±_U(A): no open set of causal, non-chronological points (no bubbles)"

[[property]]
id = "tarentin"
lean = "Causal.Causality.Tarentin"
label = "def:tarentin_spacetime"
what = "every neighbourhood of every x contains p, q with x ∈ Int J_M(p,q)"

# Defined in Causal/CBG/Pgcd.lean (the hypothesis form of curvesExtend_of_timeFunction and of
# Sbierski Lemma 3.3), so downstream of CBG modules that import models (T-abs-hoist-cbg-cores).
# No ETT label: ETT's time function (defi:fonction_temps) is Causal.Causality.IsTimeFunction, a
# morphism to the timelike line, open under DEC-10 — stronger, and not this node.
[[property]]
id = "time_function"
lean = "Causal.Causality.HasTimeFunction"
what = "there is a continuous T : M → ℝ with T x < T y whenever x ≤_M y and x ≠ y (Sbierski Lemma 3.3's hypothesis; not ETT's defi:fonction_temps, which asks a morphism to the timelike line)"

# A named model fact (kb/0012, Causal/CauchyExtension.lean); no ETT label.
[[property]]
id = "curves_extend"
lean = "Causal.Causality.CurvesExtend"
what = "every causal curve of M over a segment [a, b] lies on an inextensible causal curve of M (over some interval)"

# ------------------------------------------------------------------ properties of a geometry
# Sort `geometry` (header): Sbierski 1309.7591's A1, A3, A4 in lean-causal's CBG interface, the fields
# `rigid`, `germExt_future`/`germExt_past`, `slice_future`/`slice_past` of Causal.CBG.Geometry
# (Causal/CBG/Geometry.lean); their Level B forms in Causal/CBG/FromModel.lean.

# A1. Not the causal rigidity Causal.IsRigid C D (abstract 𝕄≥0-morphisms, Causal/SubExtension.lean),
# false on the timelike line (Causal.timelikeLine_not_isRigid) and the wrong hypothesis for CBG
# (CBG-DESIGN §2). IsRigidFor fails into a non-Hausdorff target (Causal.CBG.not_isRigidFor_branchingLine),
# whence the Hausdorff target. At Level B every local model is rigid: Causal.CBG.eqOn_of_liftPropOn
# derives A1 from the field B1 (LocalModel.rigid, rigidity of the groupoid G) and local connectedness
# of the model space. rem:CBG_analytique asserts it for 𝕄≥0-morphisms; the ETT ledger's finding: it
# holds for structure morphisms with Hausdorff target only.
[[property]]
id = "rigid"
lean = "Causal.CBG.IsRigidFor"
label = "rem:CBG_analytique"
sort = "geometry"
what = "A1: for structures s, t with Hausdorff target, IsRigidFor (IsMor s t): two morphisms on a connected open V agreeing on a non-empty open O ⊆ V agree on V (Sbierski Lemma 3.1, Cor 3.2)"

# A3, one id for both time directions (no time reversal: the reverse of an E₀-manifold is not one,
# CBG-DESIGN §2); `lean` names the future form, the past form is Causal.CBG.LocalModel.GermExtPast.
# At Level B both are derived off the BTZ locus (Causal.CBG.LocalModel.germExtFuture_of,
# germExtPast_of): the residual is LocalModel.GermExtFutureBTZ and GermExtPastBTZ, owed by gx for E₀
# and vacuous without BTZ points (germExtFutureBTZ_of_singY_zero, germExtPastBTZ_of_singY_zero). Flat
# model: Causal.CBG.flatModelOf_germExtFuture, flatModelOf_germExtPast. ETT reaches it through
# cor:ext_continue (consequence below), whose printed proof the ETT ledger flags; no label.
[[property]]
id = "germ_extension"
lean = "Causal.CBG.LocalModel.GermExtFuture"
sort = "geometry"
what = "A3, both time directions (with Causal.CBG.LocalModel.GermExtPast): ψ an injective morphism on a common Cauchy sub-development U (M, N, U, ψ(U) globally hyperbolic; Σ ⊆ U Cauchy in M and U, ψ(Σ) in N and ψ(U)); for p ∈ ∂U ∩ J⁺(Σ) (resp. J⁻(Σ)) at which ψ clusters at q along U, there are an open O ∋ p and a morphism φ on O with φ p = q and φ = ψ on O ∩ U; M, N Hausdorff, connected, second countable (Sbierski Lemma 3.8)"

# A4, one id for both time directions; `lean` names the future form, the past form is
# Causal.CBG.LocalModel.SlicePast. At Level B SlicePast holds for every local model
# (Causal.CBG.LocalModel.slicePast, from the cone-slice field) and SliceFuture off the BTZ locus
# (LocalModel.sliceFuture_of): the residual is LocalModel.SliceFutureBTZ, owed by gx for E₀. Flat
# model: Causal.CBG.flatModelOf_sliceFuture, flatModelOf_slicePast. ETT uses it in
# prop:Cauchy_non_max (consequence below); no label.
[[property]]
id = "cauchy_slice"
lean = "Causal.CBG.LocalModel.SliceFuture"
sort = "geometry"
what = "A4, both time directions (with Causal.CBG.LocalModel.SlicePast): U globally hyperbolic with Σ ⊆ U a Cauchy surface of M and of U, p ∈ ∂U ∩ J⁺(Σ) with J⁻(p) ∩ ∂U ∩ J⁺(Σ) = {p} (resp. the past form): inside every open O ∋ p, U enlarges to a globally hyperbolic open U' ⊆ U ∪ O of which Σ is a Cauchy surface (Sbierski Thm 3.6's slice, Lemma 3.11)"

# ------------------------------------------------------------------ properties of a pair of causalities
# Sort `pair` (header): C nested in C' on one space M, Causal/NestedCausalities.lean (layer 1, no
# model imported). No ETT label: ETT has one causality per space; the sources are ERS 1802.03020 §4
# and Reall 2101.11623. The ERS binder (papers/ers-predictability/certificate/binder.toml) proposed
# both ids (T-lad-nested-nodes).

# The basic notion: what Reall's "effective-metric cone inside the causal cone" gives, and what makes
# C' a better a-priori bound in ERS Remark 4.74 (transitivity, consequence below).
[[property]]
id = "le_nested"
lean = "Causal.Causality.LeNested"
sort = "pair"
what = "C is ≤-nested in C': for every open U, x ≤_U y for C implies x ≤_U y for C' (C the narrower causality, C' the wider)"

# Subluminality as ERS's Lemma 4.72 uses it (CurveNestedOn C₂ C_m U₂: the cone of g(u₂, du₂) inside
# Minkowski's, on the development's domain U₂), and (4.87) of Lemma 4.86 (the slope-δ cone inside
# g's). Implied by le_nested; the converse is open (below).
[[property]]
id = "curve_nested"
lean = "Causal.Causality.CurveNestedOn"
sort = "pair"
what = "C is curve-nested in C' on an open W: every future causal curve of W for C, over a segment, is one for C' (W = M unless an entry names W; at M it holds on every open)"

# ------------------------------------------------------------------ implications

# rem:topological_spacetime_strongly_causal. Side condition: T1 (the paper has Hausdorff).
[[implies]]
from = ["strongly_causal"]
to = "is_causal"
witness = "Causal.Causality.StronglyCausal.isCausal"
under = "M is T1 ([T1Space M]); ETT's spacetimes are Hausdorff"
status = "checked"

# Fixed 2026-11-20 (T-lad-seed-check): the seed had `from = ["strongly_causal"]`; the witness also
# assumes tarentin and two-sided causal openness, which are ladder nodes, so they join `from`.
[[implies]]
from = ["strongly_causal", "tarentin", "causally_open"]
to = "strongly_causal_open"
witness = "Causal.Causality.StronglyCausal.stronglyCausalOpen"
status = "checked"

# The converse, with no hypothesis: strongly_causal_open ⇔ strongly_causal on tarentin causally
# open spacetimes.
[[implies]]
from = ["strongly_causal_open"]
to = "strongly_causal"
witness = "Causal.Causality.StronglyCausalOpen.stronglyCausal"
status = "checked"

# prop:GH_fortement_causal (DEC-7). Fixed 2026-11-20 (T-lad-seed-check): the seed had
# `from = ["globally_hyperbolic"]`; the witness also assumes tarentin (a ladder node, joins `from`)
# and Hausdorff (`under`), exactly the paper's hypotheses.
[[implies]]
from = ["globally_hyperbolic", "tarentin"]
to = "strongly_causal"
witness = "Causal.Causality.GloballyHyperbolic.stronglyCausal"
under = "M Hausdorff ([T2Space M])"
status = "checked"

# cor:causalement_connexe_minimal. No side condition.
[[implies]]
from = ["causally_arc_connected"]
to = "absolutely_minimal"
witness = "Causal.Causality.CausallyArcConnected.absolutelyMinimal"
status = "checked"

# lem:pushup_local: push-up is local on a causally arc-connected spacetime. The side condition is a
# localisation property (local push-up) with no Lean definition of its own yet; until it is a node,
# the closure reads this edge as causally_arc_connected ⇒ push_up outright, which the witness does
# not prove.
[[implies]]
from = ["causally_arc_connected"]
to = "push_up"
witness = "Causal.Causality.CausallyArcConnected.pushUp"
under = "M is covered by open sets O i each having push-up as a spacetime (∀ i, C.PushUpOn (O i)): push-up holds locally"
status = "checked"

# Lemma K's route to causal openness (Causal.LemmaK, DEC-93; no ETT label). The side condition is a
# localisation property with no Lean definition of its own yet (chronal neighbours in every open
# set, chronology of that open set).
[[implies]]
from = ["push_up"]
to = "causally_open"
witness = "Causal.Causality.causallyOpen_of_pushUp"
under = "for every open V and v ∈ V there are p, p' ∈ V with p ≪_V v and v ≪_V p' (chronology taken in V)"
status = "checked"

# prop:topological_spacetime_absolutely_minimal, as printed (J⁺ only). The side condition is local
# causal openness, with no Lean definition of its own yet.
[[implies]]
from = ["absolutely_minimal"]
to = "causally_open_future"
witness = "Causal.Causality.AbsolutelyMinimal.causallyOpenFuture"
under = "every point has an open neighbourhood W with C.CausallyOpenFutureOn W: causal openness in the future holds locally"
status = "checked"

# prop:topological_spacetime_absolutely_minimal in the DEC-8 reading (J±).
[[implies]]
from = ["absolutely_minimal"]
to = "causally_open"
witness = "Causal.Causality.AbsolutelyMinimal.causallyOpen"
under = "every point has an open neighbourhood W with C.CausallyOpenFutureOn W, and one with C.dual.CausallyOpenFutureOn W: two-sided causal openness holds locally"
status = "checked"

# DEC-8: the two-sided definition implies the printed one. No side condition.
[[implies]]
from = ["causally_open"]
to = "causally_open_future"
witness = "Causal.Causality.CausallyOpen.future"
status = "checked"

# The statement is model-free (Zorn on time graphs), but the witness lives in Causal/CurvesExtend.lean,
# which imports Causal.Minkowski, so emit-lean skips this edge (layer rule) until it is hoisted
# (T-abs-hoist-model-free / T-abs-hoist-cbg-cores). The witness takes the two components of
# HasTimeFunction's existential (Continuous T; x ≤ y, x ≠ y ⇒ T x < T y) and nothing else: no
# separation, no countability, no causality. Its hypotheses are unpacked rather than the predicate:
# a wrapper Causality.HasTimeFunction.curvesExtend is proposed for emit-lean.
[[implies]]
from = ["time_function"]
to = "curves_extend"
witness = "Causal.Causality.curvesExtend_of_timeFunction"
status = "checked"

# Levin's theorem (Causal/LevinUtility.lean), no measure. The witness's conclusion is HasTimeFunction's
# body with monotonicity along ≤ added. Composed with the edge above it is
# Causal.Causality.curvesExtend_of_secondCountable (not recorded separately). The Geroch route,
# Causal.Causality.geroch_i_imp_ii (a Cauchy time function, under causal arc-connectedness,
# admissible measures, J±(p) ≠ {p}, first countability), asks more and is not recorded.
[[implies]]
from = ["globally_hyperbolic", "tarentin"]
to = "time_function"
witness = "Causal.Causality.exists_timeFunction_of_secondCountable"
under = "M Hausdorff and second countable ([T2Space M] [SecondCountableTopology M]); ETT's spacetimes are both (ETT.tex:255)"
status = "checked"

# ---- implications of the pair sort (header): C and C' fixed.

# LeNested C C' → ∀ W, CurveNestedOn C C' W (a curve's local ≤-steps are carried over one by one).
# No side condition, no separation. Not a CausalLadder rule: sort `pair` (emit-lean skips it).
[[implies]]
from = ["le_nested"]
to = "curve_nested"
witness = "Causal.Causality.LeNested.curveNestedOn"
status = "checked"

# ------------------------------------------------------------------ counterexamples

# The gated line (Causal.gateLine, Causal/CBG/CausalConvex.lean): the timelike line plus an isolated
# point ⋆, with a ≤ ⋆ for a ≤ 10 in every open set containing a, ⋆ and the gate 5; Hausdorff and
# second countable (ℝ ⊕ Unit). The witness conjoins IsCausal, CurvesExtend, ¬ CausallyArcConnected
# and ¬ AbsolutelyMinimalOn ⊤, which is ¬ AbsolutelyMinimal by
# Causal.Precausality.absolutelyMinimal_iff. Through the closure (causally_arc_connected ⇒
# absolutely_minimal) each entry also refutes `from` ⇒ causally_arc_connected.
[[fails]]
from = "curves_extend"
to = "absolutely_minimal"
witness = "Causal.gateLine_cauchyInclusion_not_causallyConvex"
status = "checked"

[[fails]]
from = "is_causal"
to = "absolutely_minimal"
witness = "Causal.gateLine_cauchyInclusion_not_causallyConvex"
status = "checked"

# The gated line is also globally hyperbolic: Causal.gateLine_globallyHyperbolicOn at U = ⊤
# (`Or.inl rfl`), which is GloballyHyperbolic by Causal.Causality.globallyHyperbolicOn_top (Iff.rfl).
# The witness below is the other half: not absolutely minimal.
[[fails]]
from = "globally_hyperbolic"
to = "absolutely_minimal"
witness = "Causal.gateLine_not_absolutelyMinimalOn"
status = "checked"

# ------------------------------------------------------------------ consequences

# prop:GH_Jferme, first step. Fixed 2026-11-20 (T-lad-seed-check): the seed's statement claimed
# J⁻(p) too, which this witness does not give (its companion is the next entry), and named no
# hypothesis beyond global hyperbolicity.
[[consequence]]
at = "globally_hyperbolic"
statement = "J⁺(p) is closed for every p"
witness = "Causal.Causality.GloballyHyperbolic.isClosed_Jplus_singleton"
under = "tarentin (ladder node); M Hausdorff"
status = "checked"

[[consequence]]
at = "globally_hyperbolic"
statement = "J⁻(p) is closed for every p"
witness = "Causal.Causality.GloballyHyperbolic.isClosed_Jminus_singleton"
under = "tarentin (ladder node); M Hausdorff"
status = "checked"

# prop:GH_Jferme.
[[consequence]]
at = "globally_hyperbolic"
statement = "≤_M is closed in M × M, and J±(K) is closed for every compact K"
witness = "Causal.Causality.GloballyHyperbolic.isClosed_le_and_isClosed_J"
under = "tarentin (ladder node); M Hausdorff"
status = "checked"

# Lemma K of record (DEC-93; no ETT label).
[[consequence]]
at = "globally_hyperbolic"
statement = "Lemma K: a compact connected locally Cauchy set is a Cauchy surface"
witness = "Causal.Causality.isCauchySurface_of_isLocallyCauchy_of_causallyOpen"
under = "tarentin, causally_arc_connected, causally_open (ladder nodes); M Hausdorff, second countable, connected; J⁺(p) ≠ {p} and J⁻(p) ≠ {p} for every p"
status = "checked"

# prop:FZenon_injectif, future (the past form is Causal.Causality.Iminus_injOn_Zminus).
[[consequence]]
at = "strongly_causal"
statement = "x ↦ I⁺(x) is injective on Z⁺(M)"
witness = "Causal.Causality.Iplus_injOn_Zplus"
