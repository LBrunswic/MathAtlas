statement = "precompact chart diamonds (Sbierski 1507.00601 Thm 3.1 Step 1.2): inside every neighbourhood N of every point p there are an open Ũ ∋ p, strongly causal as a spacetime, and a neighbourhood V of p such that for all x, y ∈ V the closure in M of I⁺(x, Ũ) ∩ I⁻(y, Ũ) is compact and lies in Ũ"
witness = "Causal.Causality.LocallyStronglyCausal.exists_isCompact_closure"
standing = ["locally_compact", "R1"]
