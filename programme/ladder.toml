# ¬ lightlikeLine.HasChronalNeighbourEverywhere (a closed statement, no instance argument; its
# chronology is empty, so no point has a chronal neighbour, Causal.Precausality.mem_Iplus_singleton
# read at 0). Every id of `from` in one statement; NoCausalEndpoint is no node. Through the closure on
# ℝ also locally_push_up, causally_open_future and the two local forms, is_causal, causally_compact,
# absolutely_minimal, strongly_causal (globally_hyperbolic ∧ tarentin ⇒ strongly_causal, T2),
# strongly_causal_open, time_function (Levin, T2, second countable) and curves_extend (the [[fact]]):
# 16 pairs X → has_chronal_neighbour refuted, every causality-sort X but causally_plain (the lightlike
# line is not plain, Causal.lightlikeLine_not_causallyPlain: the isolated line's entry) and
# chronal_neighbours (implied). What it carries: no causality-sort property but chronal_neighbours
# gives a chronal neighbour anywhere, not even push-up, two-sided causal openness, global
# hyperbolicity, tarentin and causal arc-connectedness together, so Lemma 2.17's localisation
# hypothesis is not supplied by the rest of the ladder (Causal.lightlikeLine_futureBoundary: no
# chronal curve leaves any set).
# Reading: either (causally arc-connected, hence absolutely minimal; OQ-18 does not touch it).
[[fails]]
from = ["push_up", "causally_open", "globally_hyperbolic", "causally_arc_connected", "tarentin"]
to = "has_chronal_neighbour"
witness = "Causal.lightlikeLine_separates_hasChronalNeighbour"
status = "checked"

# The closed half-line (Causal.closedHalfLine on Causal.ClosedHalfLine = Ici (0 : ℝ),
# Causal/LocateExtension.lean: the timelike line's causality on [0, ∞), x ≤_U y iff x ≤ y and
# [x, y] ⊆ U, x ≪_U y iff moreover x < y; its endpoint has a chronological future and no
# chronological past, as a BTZ point, Causal.closedHalfLine_oneSided).
# Causal.closedHalfLine_separates_chronalNeighbours (Causal/ChronalNeighbourBridge.lean) :
# T1Space ClosedHalfLine ∧ PreconnectedSpace ClosedHalfLine ∧ closedHalfLine.CausallyArcConnected ∧
# closedHalfLine.AbsolutelyMinimal ∧ closedHalfLine.HasChronalNeighbourEverywhere ∧
# ¬ closedHalfLine.NonemptyChronalCones ∧ ¬ closedHalfLine.ChronalNeighbours (a closed statement, no
# instance argument; I⁻(0) = ∅, Causal.closedHalfLine_Iminus_zero; bare form
# Causal.not_chronalNeighbours_of_hasChronalNeighbourEverywhere_bare). The carrier is a subtype of ℝ,
# Hausdorff and second countable by mathlib's instances (the witness states T1 only), so it is one of
# ETT's spacetimes and no `space` is written. It settles has_chronal_neighbour → chronal_neighbours:
# the edge chronal_neighbours ⇒ has_chronal_neighbour does not reverse, even on a causally
# arc-connected spacetime, and the two notions do not meet under absolute minimality
# (Causal.Causality.AbsolutelyMinimal.chronalNeighbours_iff asks both cones). The half-line is
# argued to be tarentin, push-up, causally open, plain and globally hyperbolic too, none of it in
# Lean; as entries those would move no pair (it lacks only chronal_neighbours, and every pair
# X → chronal_neighbours is refuted already, has_chronal_neighbour's by this entry).
# Reading: either (causally arc-connected, hence absolutely minimal on every open set; OQ-18 does not
# touch it).
[[fails]]
from = ["has_chronal_neighbour", "causally_arc_connected", "absolutely_minimal"]
to = "chronal_neighbours"
witness = "Causal.closedHalfLine_separates_chronalNeighbours"
status = "checked"

# The notched plane (above, T-lad-record-plain-chronal), on its ¬ Tarentin.
# Causal.notchedCausality_separates (quoted above: T2Space ∧ SecondCountableTopology of
# notchedPlane ∧ AbsolutelyMinimal ∧ CausallyArcConnected ∧ CausallyPlain ∧ PushUp ∧ LocallyPushUp ∧
# CausallyOpenFuture ∧ LocallyCausallyOpenFuture ∧ IsCausal ∧ CausallyCompact ∧ GloballyHyperbolic ∧
# StronglyCausalOpen ∧ StronglyCausal ∧ HasTimeFunction ∧ CurvesExtend ∧ ¬ CausallyOpen ∧
# ¬ LocallyCausallyOpen ∧ ¬ ChronalNeighbours ∧ ¬ Tarentin). Its has_chronal_neighbour is the other
# half, split as the gated line's global hyperbolicity is: every point has chronal past neighbours in
# every open set, v − (ε, ε) ≪_V v (Causal.notchedCausality_chronalPastNeighbours,
# Causal/NotchedPlane.lean), hence a chronological past in M
# (Causal.Causality.ChronalPastNeighbours.Iminus_nonempty), the past side of HasChronalNeighbour:
# fun x => Or.inr (notchedCausality_chronalPastNeighbours.Iminus_nonempty x).
# The corner (0, 0) has no chronal future and lies in no open diamond
# (Causal.notchedCorner_notMem_openDiamond), whence ¬ Tarentin there. It settles
# has_chronal_neighbour → tarentin: a chronal neighbour at every point, one-sided, does not give
# the tarentin property, even with absolute minimality on every open set, causal plainness, push-up,
# causal openness in the future and global hyperbolicity; so the edge chronal_neighbours ⇒ tarentin
# needs both sides in every open set, not one side in M (bare form
# Causal.not_tarentin_of_hasChronalNeighbourEverywhere_bare). The conjoined statement the keeper
# proposed is the witness since T-lad-record-direct-witnesses (2026-11-27), read from the source
# (Causal/ChronalNeighbourConjoined.lean:152, T-abs-chronal-neighbour-conjoined), with no build:
# Causal.notchedCausality_separates_hasChronalNeighbour, every conjunct of
# Causal.notchedCausality_separates (the witness until then) with HasChronalNeighbourEverywhere
# (through Causal.Causality.ChronalPastNeighbours.hasChronalNeighbourEverywhere), ∀ W,
# AbsolutelyMinimalOn W, ChronalPastNeighbours and ¬ ChronalFutureNeighbours (no instance argument):
# every id of `from` and ¬ Tarentin in one statement. Lacking tarentin, it lacks chronal_neighbours
# (chronal_neighbours ⇒ tarentin, read backwards; its witness states it), so it is a second witness
# of has_chronal_neighbour → chronal_neighbours beside the closed half-line. Its time reversal has
# the node too, through Causal.Causality.dual_hasChronalNeighbourEverywhere, and refutes nothing
# more.
# Reading: either (absolutely minimal on every open set for every cover,
# Causal.notchedCausality_absolutelyMinimalOn; OQ-18 does not touch it).
[[fails]]
from = ["has_chronal_neighbour", "absolutely_minimal", "causally_arc_connected", "causally_plain", "push_up", "locally_push_up", "causally_open_future", "locally_causally_open_future", "is_causal", "causally_compact", "globally_hyperbolic", "strongly_causal_open", "strongly_causal", "time_function", "curves_extend"]
to = "tarentin"
witness = "Causal.notchedCausality_separates_hasChronalNeighbour"
status = "checked"

# ---- off the ambient (T-lad-record-dual-vee, 2026-11-21): counterexamples whose space is not one of
# ETT's spacetimes, each with a `space` key listing what its Lean witness states of the space. Since
# T-tool-ladder-space (599b0b0) refuted() and `matrix` count a [[fails]] only when its space, closed
# under the vocabulary, contains the ambient's words (T2, second_countable): a pair such an entry alone
# refutes is `fails-off`, not counted as classified, and an [[open]] entry for it stays legal. `check`
# still reads the entry on its own space: it may not have its `to` by the edges valid there.
#
# The vee (Causal.Vee, Causal.veeCausality, Causal/PushUpOfMinimalLocal.lean,
# T-abs-pushup-of-minimal-local, strict since 4e06808; ETT layer, no model): three points left, mid,
# right, a set open iff it contains mid as soon as it contains left or right (T0, not T1: {mid} is not
# closed); x ≤_U y iff x, y ∈ U and x ≤ y in left < mid < right; x ≪_U y iff left ∈ U, x ≠ right and
# y = mid. Read by `#check` (2026-11-21): Causal.veeCausality_separates_pushUp : T0Space Vee ∧
# ¬ T1Space Vee ∧ veeCausality.AbsolutelyMinimal ∧ veeCausality.LocallyPushUp ∧ ¬ veeCausality.PushUp
# (a closed statement; bare form Causal.not_pushUp_of_absolutelyMinimal_of_locallyPushUp_T0 : ¬ ∀ (X :
# Type) [TopologicalSpace X] [T0Space X] (C : Causality X), C.AbsolutelyMinimal → C.LocallyPushUp →
# C.PushUp). So `space = ["T0"]`, what the witness states: the vee is finite, hence second countable,
# which its witness does not state and no edge's standing would use (Levin's asks T2 besides). What
# it carries: the T1 of absolutely_minimal ∧ locally_push_up ⇒ push_up (its `standing`, the instance
# binder of Causal.Causality.AbsolutelyMinimal.pushUp_of_locallyPushUp) cannot be weakened to T0; a
# sharpness of the standing only, since ETT's spacetimes are Hausdorff. On its space only the edges
# without standing chain: its `from` reaches nothing more, and it lacks push_up and nothing else (no
# single premise reaches push_up there). So it refutes absolutely_minimal → push_up and
# locally_push_up → push_up off the ambient; both are refuted on the ambient already, the first in
# either reading (the half-chronological line), the second in the no-gluing reading only (the gated
# line, not absolutely minimal; in a gluing reading it holds on ETT's spacetimes, header), so `matrix`
# shows no `fails-off` pair from it (computed 2026-11-21). `check` reads it against that edge: the
# edge asks T1, not valid on {T0}, so no contradiction.
# Reading: moot: the vee is off ETT's spacetimes in either reading of defi:causalite (the witness gives
# absolute minimality on M; on every open set, the gluing reading's form, is not stated).
[[fails]]
from = ["absolutely_minimal", "locally_push_up"]
to = "push_up"
witness = "Causal.veeCausality_separates_pushUp"
space = ["T0"]
status = "checked"

