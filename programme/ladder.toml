statement = "the diamond identification near every point (Sbierski 1507.00601 Thm 3.1 Steps 1.2 and 3, (1.2) with equality): inside every neighbourhood of every point p, an open Ũ ∋ p and a neighbourhood V of p such that for all x, y ∈ V the closure of I⁺(x, Ũ) ∩ I⁻(y, Ũ) is compact and in Ũ, and for every open W causally arc-connected and future one-connected as a spacetime and every chronal curve of W from x to y over [0, 1] lying in Ũ, I⁺(x, W) ∩ I⁻(y, W) = I⁺(x, W ⊓ Ũ) ∩ I⁻(y, W ⊓ Ũ)"
