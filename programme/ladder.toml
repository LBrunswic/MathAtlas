# → absolutely_minimal
[[open]]
from = "chronal_neighbours"
to = "absolutely_minimal"
note = "False, argued, in the no-gluing reading only: Galileo's spacetime Causal.galileo n, n ≥ 1, has chronal neighbours and is not absolutely minimal (on a U-shaped open, x ≪_U y across the bend is generated by no chain of small steps); wants Causal.galileoOn_chronalNeighbours, Causal.galileo_not_absolutelyMinimal; or Causal.timelikeLineTop (≤_ℝ total; a causality without gluing only, OQ-18, OQ-39) has chronal neighbours and is not absolutely minimal; wants Causal.timelikeLineTop_chronalNeighbours. In the gluing reading of defi:causalite every causality is absolutely minimal (OQ-18), so there the pair holds and no witness can refute it. The ladder's Lean models with chronal neighbours are all absolutely minimal: the half-plane, the flat time cylinder and the timelike circle, the chronal membrane and its time reversal, and the rational-jump plane, which is not causally arc-connected (Causal.halfPlane_separates, Causal.Flat.timeCylinder_separates, Causal.Flat.timeCylinder_zero_separates, Causal.chronalMembrane_separates, Causal.chronalMembrane_dual_separates, Causal.rationalJumpPlane_separates)"


# → curves_extend: none since T-lad-record-curves-fact (2026-11-21). The 15 entries that stood here
# (from absolutely_minimal, causally_arc_connected, causally_compact, causally_open,
# causally_open_future, causally_plain, chronal_neighbours, is_causal, locally_causally_open,
# locally_causally_open_future, locally_push_up, push_up, strongly_causal, strongly_causal_open,
# tarentin; the sixteenth, from globally_hyperbolic, stood above) said "no Lean model lacks
