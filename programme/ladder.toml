# (p : M) {N : Set M} (hN : N ∈ 𝓝 p) ⊢ ∃ Ũ : Opens M, p ∈ Ũ ∧ (Ũ : Set M) ⊆ N ∧ C.StronglyCausalOn Ũ ∧
# ∃ V ∈ 𝓝 p, ∀ x ∈ V, ∀ y ∈ V, IsCompact (closure (C.Iplus Ũ {x} ∩ C.Iminus Ũ {y})) ∧
# closure (C.Iplus Ũ {x} ∩ C.Iminus Ũ {y}) ⊆ Ũ. Through
# Causal.Causality.StronglyCausalOn.exists_isCompact_closure (a compact neighbourhood K of p inside Ũ,
# and V ⊆ K causally convex in W, whose diamonds lie in V); on a regular space the closure inside Ũ
