# ---- T-lad-classify-core (2026-11-21): counterexamples with a conjunctive `from` (the counterexample
# has every id; through the closure valid on its space, everything they chain). Each witness and each
# other half named was read with the Lean elaborator on 2026-11-21 (typed `example`s and `#check`,
# lake env lean on a file outside the tree; statements quoted in the comments); every space is ℝ or
# ℝ × ℝⁿ, Hausdorff and second countable, so no `space` is written.

# The rational line (Causal.rationalLine, Causal/NestedConverse.lean: x ≤_U y iff x = y ∈ U, or
# x < y both rational with [x, y] ⊆ U; ≪ empty). Causal.rationalLine_separates_absolutelyMinimal
# conjoins AbsolutelyMinimal ∧ IsCausal ∧ PushUp ∧ ¬ CausallyArcConnected ∧ ¬ CausallyOpenFuture ∧
# ¬ CausallyOpen: one statement, three entries (the third, causally_open, is also reached through
# causally_open ⇒ causally_open_future, and is kept because the witness states it). The first Lean
# model that is absolutely minimal and not causally open: it settles the [[open]] entries
# absolutely_minimal → causally_open_future, → causally_open and push_up → causally_open_future,
# → causally_open (removed), and through push_up ⇒ locally_push_up refutes locally_push_up ⇒
# causally_arc_connected, causally_open_future, causally_open. By the edge absolutely_minimal ∧
# locally_causally_open_future ⇒ causally_open_future the rational line is not locally causally
# open in the future either; the matrix does not read an edge backwards through a conjunction and no
# Lean name states it, so absolutely_minimal → locally_causally_open_future is an [[open]] entry (end
# of the file) that wants Causal.rationalLine_not_locallyCausallyOpenFuture.
[[fails]]
from = ["absolutely_minimal", "is_causal", "push_up"]
to = "causally_arc_connected"
witness = "Causal.rationalLine_separates_absolutelyMinimal"
status = "checked"

[[fails]]
from = ["absolutely_minimal", "is_causal", "push_up"]
to = "causally_open_future"
witness = "Causal.rationalLine_separates_absolutelyMinimal"
status = "checked"

[[fails]]
from = ["absolutely_minimal", "is_causal", "push_up"]
to = "causally_open"
witness = "Causal.rationalLine_separates_absolutelyMinimal"
status = "checked"

# The spacelike line (Causal.spacelikeLine, Causal/Lines.lean: ≤_U the diagonal of U, ≪ empty), the
# first globally hyperbolic model of the library that is not tarentin (every open diamond is empty,
# Causal.spacelikeLine_openDiamond). Causal.spacelikeLine_separates_tarentin_full (Causal/
# NestedTransfer.lean) conjoins GloballyHyperbolic ∧ StronglyCausalOpen ∧ PushUp ∧ CausallyOpen ∧
# AbsolutelyMinimal ∧ HasTimeFunction ∧ ¬ Tarentin. Through the closure also is_causal,
# causally_compact, strongly_causal, causally_open_future, the three local forms and curves_extend
# ⇏ tarentin. The pair causally_arc_connected → tarentin is the isolated line's entry below (the
# spacelike line is causally arc-connected too, Causal.spacelikeLine_causallyArcConnected, but not
# in this conjunction).
[[fails]]
from = ["globally_hyperbolic", "strongly_causal_open", "push_up", "causally_open", "absolutely_minimal", "time_function"]
to = "tarentin"
witness = "Causal.spacelikeLine_separates_tarentin_full"
status = "checked"

# The spacelike line is not causally plain (Causal.spacelikeLine_not_causallyPlain,
# Causal/Lines.lean, rem:droites_pas_plates: J⁺(M) = M while I⁺(M) = ∅). Split as for the gated
# line: the witness is the half ¬ CausallyPlain, the other halves
# Causal.spacelikeLine_globallyHyperbolic, spacelikeLine_stronglyCausalOpen, spacelikeLine_pushUp,
# spacelikeLine_causallyOpen, spacelikeLine_absolutelyMinimal, spacelikeLine_hasTimeFunction (the
# conjuncts of spacelikeLine_separates_tarentin_full) and spacelikeLine_causallyArcConnected
# (Causal/NestedConverse.lean). Beside the lightlike line's last entry below, a second witness of
# strongly_causal_open, time_function, curves_extend ⇏ causally_plain, and one that needs no edge
# with a standing.
[[fails]]
from = ["globally_hyperbolic", "strongly_causal_open", "push_up", "causally_open", "absolutely_minimal", "time_function", "causally_arc_connected"]
to = "causally_plain"
witness = "Causal.spacelikeLine_not_causallyPlain"
status = "checked"

# The line with a chronologically isolated origin (Causal.isolatedLine, Causal/LocateExtension.lean:
# the timelike line of ℝ ∖ {0}, 0 related to itself only). Causal.tarentin_and_plain_needed conjoins,
# in its second component, isolatedLine.CausallyArcConnected ∧ isolatedLine.CausallyPlain ∧
# ¬ isolatedLine.Tarentin. Through causally_arc_connected ⇒ absolutely_minimal also absolutely_minimal
# ⇏ tarentin. It is causally open too (Causal.isolatedLine_causallyOpen), not conjoined; the
# spacelike line's entry above already refutes causally_open ⇒ tarentin.
[[fails]]
from = ["causally_arc_connected", "causally_plain"]
to = "tarentin"
witness = "Causal.tarentin_and_plain_needed"
status = "checked"

# The lightlike line once more, with every property the Lean gives it: globally hyperbolic, push-up
# and causally open (conjoined in Causal.lightlikeLine_separates_chronalNeighbours with
# ¬ ChronalNeighbours), tarentin (Causal.lightlikeLine_tarentin) and causally arc-connected
# (Causal.lightlikeLine_causallyArcConnected). On ℝ, through the edges valid there, it is also
# strongly causal (globally_hyperbolic ∧ tarentin ⇒ strongly_causal, T2; stated besides as a conjunct
# of Causal.CBG.lightlikeLine_sbierski_prop_3_7_iii_fails, Causal/SbierskiProp37.lean), strongly
# causal in the open form, with a time function (Levin) and curves_extend. These two entries
# subsume the single-premise lightlike-line entries above and add strongly_causal,
# strongly_causal_open, time_function, curves_extend ⇏ chronal_neighbours, causally_plain. Witnesses
# split as above: ¬ ChronalNeighbours in the conjoined statement, ¬ CausallyPlain in
# Causal.lightlikeLine_not_causallyPlain.
[[fails]]
from = ["globally_hyperbolic", "push_up", "causally_open", "tarentin", "causally_arc_connected"]
to = "chronal_neighbours"
witness = "Causal.lightlikeLine_separates_chronalNeighbours"
status = "checked"

[[fails]]
from = ["globally_hyperbolic", "push_up", "causally_open", "tarentin", "causally_arc_connected"]
to = "causally_plain"
witness = "Causal.lightlikeLine_not_causallyPlain"
status = "checked"

# Galileo's spacetime (Causal.galileo n = Causal.galileoOn (Fin n → ℝ) on ℝ × ℝⁿ,
# rem:galileo_spacetime_not_strongly, ex:causalities_lines item 4): causal
# (Causal.galileoOn_isCausal) and, for n ≥ 1, not strongly causal (Causal.galileo_not_stronglyCausal,
# the witness; split as above). The converse of rem:topological_spacetime_strongly_causal fails;
# through strongly_causal_open ⇒ strongly_causal also is_causal ⇏ strongly_causal_open. Its other
# properties (a time function T = fst, push-up, tarentin, causal openness) are not stated in Lean.
[[fails]]
from = "is_causal"
to = "strongly_causal"
witness = "Causal.galileo_not_stronglyCausal"
status = "checked"

# ---- pair sort (C, C' fixed, header): T-abs-nested-converse (2026-11-21).

# The pointed line (Causal.pointedLine, Causal/LinesReachable.lean: 0 ≤ y for y > 0) is curve-nested
# in the spacelike line on every open (its causal curves are constant,
# Causal.pointedLine_causalCurveOn_eq) and not ≤-nested in it (0 ≤ 1 in the first only).
# Causal.pointedLine_separates_curveNested conjoins (∀ W, CurveNestedOn pointedLine spacelikeLine W)
# ∧ ¬ LeNested pointedLine spacelikeLine with ¬ pointedLine.CausallyArcConnected,
# pointedLine.IsCausal, pointedLine.PushUp and spacelikeLine.CausallyArcConnected. Replaces the
# [[open]] entry for this pair. The converse holds when the narrower C is causally arc-connected
# (consequence at curve_nested below), and not with C' causally arc-connected instead
# (Causal.not_leNested_of_curveNested_wider_bare, this very pair) nor with C only absolutely minimal
# (Causal.not_leNested_of_curveNested_absolutelyMinimal_bare, the rational line in the spacelike
# line, Causal.rationalLine_separates_curveNested).
[[fails]]
from = "curve_nested"
to = "le_nested"
witness = "Causal.pointedLine_separates_curveNested"
status = "checked"

