# → locally_push_up
[[open]]
from = "causally_plain"
to = "locally_push_up"
note = "Open, in the no-gluing reading only: the Lean models without local push-up, the half-chronological line and the chronal membrane and its time reversal, are not causally plain (Causal.halfChronoLine_separates_pushUp, Causal.halfChronoLine_not_causallyPlain, Causal.chronalMembrane_separates, Causal.chronalMembrane_dual_separates), nor is the rational-jump plane, push-up in no open set (Causal.rationalJumpPlane_separates, Causal.rationalJumpPlane_not_pushUpOn); deuxPushup and the gated line are locally push-up (Causal.gateLine_separates_pushUp), failing push-up only in opens containing a given pair (deuxPushup plain, Causal.deux_pushup); the ladder's other plain models are absolutely minimal, hence push-up: the isolated line, the flat time cylinder and the timelike circle, the notched plane and its time reversal (Causal.tarentin_and_plain_needed, Causal.Flat.timeCylinder_separates, Causal.Flat.timeCylinder_zero_separates, Causal.notchedCausality_separates, Causal.notchedCausality_dual_separates). True in the gluing reading on ETT's spacetimes: there every causality is absolutely minimal (OQ-18), and absolutely_minimal ∧ causally_plain ⇒ push_up (T1) gives push-up; so a counterexample is not absolutely minimal, a causality without gluing only, plain and push-up in no neighbourhood of some point"


# → strongly_causal_open
[[open]]
from = "strongly_causal"
to = "strongly_causal_open"
note = "Open: with causally_open it holds, no tarentin asked (the edge, Causal.Causality.StronglyCausal.stronglyCausalOpen_of_causallyOpen, T-lad-record-sc-open-edge); no Lean model is strongly causal without an open causally convex basis (the fork is strongly causal in both forms, the loop fan in neither: Causal.fork_separates, Causal.loopFan_separates). A counterexample is not causally open, not even at M: J⁺_M(O) or J⁻_M(O) is not open for some open O (Causal.Causality.StronglyCausal.not_causallyOpen_of_not_stronglyCausalOpen). More, it has a point p and a neighbourhood N of p such that some open O ∋ p has its hull J⁺_M(O) ∩ J⁻_M(O) inside N, the hull of every such O is not open, and no open W ∋ p inside N contains its own hull (Causal.Causality.StronglyCausal.exists_not_isOpen_hull). The future half alone does not open the hull: the one-way membrane, causally open in the future, strongly causal and not causally open, has a neighbourhood of (0, 1) causally convex in M whose interior has a hull that is not open (Causal.oneWayMembrane_hull_not_isOpen); it is strongly causal in the open form all the same (Causal.oneWayMembrane_stronglyCausalOpen), so this refutes the hull argument, not the pair, and whether strongly_causal ∧ causally_open_future ⇒ strongly_causal_open holds is open as well (a counterexample to it would settle this pair). Among the Lean models without two-sided causal openness, the notched plane and its time reversal (not tarentin either) and the one-way membrane and its reversal are strongly causal in both forms (Causal.notchedCausality_separates, Causal.notchedCausality_dual_separates, Causal.oneWayMembrane_separates, Causal.oneWayMembrane_dual_separates). Under DEC-167 (defi:causalite read with gluing) a counterexample must be absolutely minimal besides"


