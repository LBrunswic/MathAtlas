# T-abs-nested-causalities/2-dod, the Cauchy transfer. Read 2026-11-22 by `#check`:
# {C C' : Causality M} {W : Opens M} {S : Set M}, C.InextensibleNestedOn C' W →
# C'.IsCauchySurfaceOn W S → C.IsCauchySurfaceOn W S, no instance (a one-line proof: a C-inextensible
# curve of W is C'-inextensible, so it meets S exactly once). Not at le_nested nor curve_nested: the
# line cut at 1 (Causal.not_isCauchySurface_of_nested_bare, the transfer's bare form; the [[fails]]
# le_nested ⇏ inextensible_nested, Causal.cutLine_separates_inextensibleNested). At M it is what
# Causal.Causality.GloballyHyperbolic.isCauchySurface_of_nested (consequence at curve_nested)
# composes with the curve-nested form of the nesting; at the domain of every solution it is ERS Thm
# 4.79's non-emptiness (next entry but one).
[[consequence]]
at = "inextensible_nested"
statement = "the Cauchy transfer: on the open W of the nesting, every Cauchy surface of W for the wider C' is a Cauchy surface of W for the narrower C"
witness = "Causal.Causality.IsCauchySurfaceOn.of_nested"
under = "inextensible nesting on W; nothing else (no instance)"
status = "checked"

# T-abs-nested-causalities/2-dod, nested domains of dependence (two-sided, as the library's:
