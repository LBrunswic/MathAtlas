[[property]]
id = "is_causal"
lean = "Causal.Causality.IsCausal"
label = "def:causal_spacetime"
what = "≤_M is antisymmetric (an order, reflexivity and transitivity being axioms): no closed causal loops in M"

[[property]]
id = "strongly_causal"
lean = "Causal.Causality.StronglyCausal"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains a neighbourhood, not necessarily open, causally convex in M (the definition, DEC-7)"

[[property]]
id = "strongly_causal_open"
lean = "Causal.Causality.StronglyCausalOpen"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains an OPEN neighbourhood causally convex in M (the literal reading through defi:convexite_causale; auxiliary since DEC-7)"

[[property]]
id = "globally_hyperbolic"
lean = "Causal.Causality.GloballyHyperbolic"
label = "def:globally_hyperbolic"
what = "causal, and every full diamond J_M(p,q) is compact (is_causal ∧ causally_compact: Causal.Causality.globallyHyperbolic_iff, Iff.rfl)"

# T-lad-gh-causal (2026-11-21). The second conjunct of def:globally_hyperbolic, which the Lean
# writes out rather than naming (Properties.lean:144); the three edges below make
# globally_hyperbolic ⇔ is_causal ∧ causally_compact. Reads ≤_M only, like is_causal: invariant
# under time reversal and under any homeomorphism carrying ≤_M onto ≤_N (consequences below).
[[property]]
id = "causally_compact"
lean = "Causal.Causality.CausallyCompact"
label = "def:causally_compact"
what = "every full diamond J_M(p,q) = J⁻(q) ∩ J⁺(p) is compact (no causality asked: a closed causal loop is allowed)"

[[property]]
id = "push_up"
lean = "Causal.Causality.PushUp"
label = "defi:pushup"
what = "in every open U: x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z"

# ---- def:causally_open_spacetime_open: two nodes of record (DEC-163, 2026-11-22; OQ-67, OQ-69,
# OQ-80; T-lad-record-rulings). DEC-8 reads the definition with J± (causally_open,
# Causal.Causality.CausallyOpen); the printed J⁺-only form (causally_open_future,
# Causal.Causality.CausallyOpenFuture) is no longer auxiliary: both are ladder nodes, and each theorem
# says which it uses. Every entry names the node its witness takes, read from the witness's
# signature (C.CausallyOpen or C.CausallyOpenFuture). In this file's comments an unqualified "causally
# open" or "causal openness" is causally_open; the printed form is always said "in the future"; and
# "causal openness, global or local, in the future or two-sided" means the four nodes causally_open,
# causally_open_future, locally_causally_open, locally_causally_open_future. Between the two:
# causally_open ⇒ causally_open_future (Causal.Causality.CausallyOpen.future, an edge below), strict.
# The separating edge of record, causally_open_future ⇏ causally_open, is the one-way membrane's
# [[fails]] entry (Causal.oneWayMembrane_separates: to = locally_causally_open, hence not causally
# open through causally_open ⇒ locally_causally_open): absolutely minimal on every open set (either
# reading of defi:causalite, OQ-80), tarentin, push-up, strongly causal, causally open in the future,
# so it meets every printed hypothesis of prop:tarentin_topological_spacetime_causality, and it is the
# ladder's only separation of the two with tarentin and push-up. The pair is refuted besides by the
# half-lit line (Causal.halfLightLine_separates_causallyOpen; either reading, not tarentin), the
# chronal membrane (Causal.chronalMembrane_separates; either reading, no push-up), the notched plane
# (Causal.notchedCausality_separates; either reading, not tarentin) and the gated line
# (Causal.gateLine_separates_causallyOpen; no-gluing only, removed by T-lad-gluing-reading under
# DEC-167). Which theorem takes which node, from the witnesses: causally_open, Lemma K (DEC-93; both
# consequences), strongly_causal ∧ causally_open ⇒ strongly_causal_open (tarentin dropped by
# T-lad-record-sc-open-edge), push_up ∧ chronal_neighbours ⇒ causally_open (its conclusion),
# prop:topological_spacetime_absolutely_minimal in the DEC-8 reading, the causal convexity of open
# diamonds and prop:tarentin_topological_spacetime_causality (ii)⇒(i) (consequences at causally_open);
# causally_open_future, prop:topological_spacetime_absolutely_minimal as printed; neither,
# prop:tarentin_topological_spacetime_causality (i)⇒(ii) (the consequence at strongly_causal).
[[property]]
id = "causally_open"
lean = "Causal.Causality.CausallyOpen"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) and J⁻_U(V) are open (the definition read with J±, DEC-8; a node of record, DEC-163)"

[[property]]
id = "causally_open_future"
lean = "Causal.Causality.CausallyOpenFuture"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) is open (the definition as printed, J⁺ alone; a node of record beside causally_open since DEC-163, strictly weaker: the one-way membrane)"

[[property]]
id = "absolutely_minimal"
lean = "Causal.Precausality.AbsolutelyMinimal"
label = "def:topological_space_causality_absolutely"
what = "for every open cover, the precausality generated by the restrictions to its members is the given one"

[[property]]
id = "causally_arc_connected"
lean = "Causal.Causality.CausallyArcConnected"
label = "def:causal_arc_connectedness"
what = "in every open U, p ≤_U q (resp. p ≪_U q) iff a causal (resp. chronal) curve in U joins p to q"

[[property]]
id = "causally_plain"
lean = "Causal.Causality.CausallyPlain"
label = "defi:causalement_plat"
what = "for every open U and A ⊂ M, Int J±_U(A) ⊂ closure I±_U(A): no open set of causal, non-chronological points (no bubbles)"

[[property]]
id = "tarentin"
lean = "Causal.Causality.Tarentin"
label = "def:tarentin_spacetime"
what = "every neighbourhood of every x contains p, q with x ∈ Int J_M(p,q)"

# Defined in Causal/CurvesExtend.lean (ETT layer: no model imported), beside the theorem whose
# hypothesis it is (curvesExtend_of_timeFunction; also Sbierski Lemma 3.3's), moved there verbatim,
# same full name, from the model-reaching Causal/CBG/Pgcd.lean by T-abs-hoist-time-function
# (2026-11-21); so emit-lean gives it a Lean form in Causal.Ladder.Test. No ETT label: ETT's time function (defi:fonction_temps) is Causal.Causality.IsTimeFunction, a
# morphism to the timelike line, open under DEC-10, and not this node. Not stronger: it is
# non-decreasing along ≤, not strictly increasing, and does not make the causality causal (the
# doubled line has one and is not causal, Causal.exists_isTimeFunction_not_isCausal), while this node
# does (time_function ⇒ is_causal, below); so IsTimeFunction does not give HasTimeFunction
# (T-lad-time-function-causal, 2026-11-21).
[[property]]
id = "time_function"
lean = "Causal.Causality.HasTimeFunction"
what = "there is a continuous T : M → ℝ with T x < T y whenever x ≤_M y and x ≠ y (Sbierski Lemma 3.3's hypothesis; not ETT's defi:fonction_temps, which asks a morphism to the timelike line)"

# Defined in Causal/CauchyExtension.lean; no ETT label. Carried until 7923138 as a named model fact
# (kb/0012: "the library does not prove it for topological spacetimes"), it is a theorem since
# T-abs-curves-extend-second-countable on every T1, second countable space, for every causality: the
# [[fact]] below (T-lad-record-curves-fact, 2026-11-21). ETT's spacetimes are Hausdorff and second
# countable (ETT.tex:255), so on the ambient the node is the ladder's bottom: every causality-sort
# property implies it (through the fact; time_function also through its edge), and it implies none
# (every curves_extend → X is refuted). DEC-190 (OQ-86, 2026-11-22): CurvesExtend is dropped
# everywhere, being a theorem on every ETT spacetime, and is recorded in the ladder as a consequence:
# the [[fact]] below carries it on the ambient, and a consequence whose witness took it (or a
# through-every-point clause it discharges) as a hypothesis takes the second countable form as its
# witness where one exists (T-lad-record-curves-corollaries: ERS Lemmas 4.70 and 4.72,
# lem:C_ext_connexe). It stays a node: the consequences below name it, Lemma K's
# second-countability-free form asks it where no countability is assumed, and Causal.CBG.Geometry's
# A2 and LocalModel's B3 fields carry it (T-loc-cbg-curves-default). Off second countability it may fail:
# the long ray with its order causality is the conjectured counterexample (Hausdorff, locally the
# timelike line, not second countable; argued: globally hyperbolic and tarentin, with no inextensible
# causal curve, since a curve over a real interval has a bounded image and extends above it, so
# CurvesExtend fails at a constant curve; Causal/CurvesExtend.lean SCOPE), not in Lean, and not one
# of ETT's spacetimes: a [[fails]] entry for it would say space = ["T2"], on which the fact's
# standing does not hold, so it would contradict nothing, and the matrix would keep every
# X → curves_extend implied, as it is on ETT's spacetimes (simulated on a /tmp copy, 2026-11-21).
[[property]]
id = "curves_extend"
lean = "Causal.Causality.CurvesExtend"
what = "every causal curve of M over a segment [a, b] lies on an inextensible causal curve of M (over some interval)"

# Premise-free on every T1, second countable space (T-abs-curves-extend-second-countable, 7923138;
# recorded by T-lad-record-curves-fact, 2026-11-21). Causal.Causality.curvesExtend_of_t1_secondCountable
# (Causal/CurvesExtendSecondCountable.lean, ETT layer: it imports Causal.AbstractDev,
# Causal.OmegaOneConstant, Causal.CBG.CausalConvex, no model; Causal.MaximalZorn in place of the first
# until T-tac-curves-fact-rule), read by `#check` on 2026-11-21:
# ∀ {M} [TopologicalSpace M] [T1Space M] [SecondCountableTopology M] (C : Causality M), C.CurvesExtend;
# `#print axioms` propext, Classical.choice, Quot.sound. No other hypothesis: no T2, no causality, no
# time function, no causal arc-connectedness. Its two instance binders are the standing, both ambient
# (T2 ⇒ T1), so the fact holds on ETT's spacetimes and makes the 16 pairs X → curves_extend implied
# (their [[open]] entries removed), in either reading of defi:causalite (OQ-18): the witness asks
# nothing of C. The proof is Zorn on towers of tail-free causal curves (no constant end piece), a
# coherent chain bounded by a direct limit (countable cofinality) or by one of its members
# (uncountable cofinality: the ω₁ lemma, Causal.OmegaOneConstant, where second countability enters);
# a maximal curve is inextensible. The open-set form is
# Causal.Causality.curvesExtendOn_of_t1_secondCountable (CurvesExtendOn W for every open W), the
# general one Causal.Causality.exists_inextensible_of_t1_secondCountable (a causal curve of W over any
# interval, not only a segment, lies on an inextensible one). The edge time_function ⇒ curves_extend
# stays: it asks no standing (it holds on every space with a time function, T1 and second countable
# or not), and Causal.Ladder.Rules carries it as a safe forward rule. Since T-tac-ladder-integration
# (1735598) emit-lean also makes rules of checked causality-sort facts (`safe apply`, with the
# standing synthesised), and since T-tac-curves-fact-rule (7a62073) Rules carries this fact's: a
# safe apply rule, Causal.Causality.curvesExtend_of_t1_secondCountable under the standing T1,
# second_countable, by which causal_ladder closes C.CurvesExtend (and C.dual.CurvesExtend) for any
# causality on a [T1Space M] [SecondCountableTopology M] space, with no hypothesis on C (Rules.lean's
# `-- fact: curves_extend` line; checked 2026-11-27 by reading the file). Until then emit-lean skipped
# it as an import cycle, the witness's module reaching Rules (Causal.CurvesExtendSecondCountable →
# Causal.MaximalZorn → Causal.ErsMughd → Causal.Ladder.Rules), with a `-- skipped fact` line in
# Rules.lean and the rule registered locally in Causal.Ladder.Test's last section. The cycle was
# broken by splitting the abstract Zorn theory (namespace Causal.AbstractDev, Mathlib imports only)
# out of Causal/MaximalZorn.lean into Causal/AbstractDev.lean, which the witness's module imports
# instead. kb/0221's constraint follows: Rules imports Causal.CurvesExtendSecondCountable, so no
# module of its import closure (Causal.AbstractDev, Causal.OmegaOneConstant, Causal.CBG.CausalConvex
# and the modules below them) may use causal_ladder or import Causal.Ladder.*, which would be an
# import cycle that Lake refuses. Sharpness is not
# formalised: off second countability the long ray (the property's comment); whether T1 weakens to
# T0 is not examined (a finite space has curves_extend trivially, a curve of maximal image being
# inextensible: argued in the witness's SCOPE; so the vee, space = ["T0"], the one counterexample to
# which the fact does not apply, is finite and not expected to lack it).
[[fact]]
property = "curves_extend"
witness = "Causal.Causality.curvesExtend_of_t1_secondCountable"
standing = ["T1", "second_countable"]
status = "checked"
note = "every causality on a T1, second countable space has curves_extend (Zorn on towers; the ω₁ lemma for uncountable cofinality); on every open set too, Causal.Causality.curvesExtendOn_of_t1_secondCountable. DEC-190 (OQ-86): CurvesExtend is dropped everywhere, a theorem on every ETT spacetime, recorded as a consequence in the ladder: this fact on the ambient, and the second countable witnesses of the consequences that took it"

# ---- localisation properties (T-lad-local-nodes, 2026-11-21): the side conditions of four edges,
# defined in Causal/LadderLocal.lean (T-abs-ladder-local-defs, ETT layer, no model imported). No ETT
# label: ETT states them inline, as hypotheses of lem:pushup_local (ETT.tex:557) and of
# prop:topological_spacetime_absolutely_minimal (ETT.tex:698); chronal_neighbours has no paper
# sentence (hZm, hZp of Lemma K's causallyOpen_of_pushUp, DEC-93). "Local" is "every point has an
# open neighbourhood with the property"; for push-up and future causal openness, which pass to
# smaller opens, it is the arbitrarily-small form (Causal.Causality.locallyPushUp_iff_nhds,
# locallyCausallyOpenFuture_iff_nhds). Each global property implies its local form (edges below).
# The one-sided ChronalFutureNeighbours is not a node, nor its past form ChronalPastNeighbours
# (C.dual.ChronalFutureNeighbours): since T-abs-one-sided-future-base (1cef44b, DEC-166 (a), OQ-52 (a))
# the future form is the library's base and the past form its dual (the header's "One-sided
# notions"). The fifth localisation node, has_chronal_neighbour (DEC-159, T-lad-has-chronal-neighbour,
# 2026-11-23), is one-sided in another sense, at one point and on either side, chronology in M; its
# entry follows chronal_neighbours' below, its Lean definition is in Causal/ChronalNeighbourBridge.lean.
# OneSidedBoundary, OQ-52's other notion, is an edge hypothesis only (DEC-166 (b)): no node, named in
# the `under` of its consequence (ERS Thm 4.82, at is_causal).

# The cover (O i) of lem:pushup_local is this, up to `choose` (Causal.Causality.locallyPushUp_of_cover).
[[property]]
id = "locally_push_up"
lean = "Causal.Causality.LocallyPushUp"
what = "every point has an open neighbourhood W having push-up as a spacetime (PushUpOn W: in every open U ⊆ W, x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z)"

# The hypothesis of prop:topological_spacetime_absolutely_minimal as printed (J⁺ alone).
[[property]]
id = "locally_causally_open_future"
lean = "Causal.Causality.LocallyCausallyOpenFuture"
what = "every point has an open neighbourhood W causally open in the future as a spacetime (CausallyOpenFutureOn W: J⁺_U(V) open for all opens V ⊆ U ⊆ W)"

# The same in the DEC-8 reading (J±). The Lean is the conjunction of the future form for C and for
# C.dual; one neighbourhood for both sides is equivalent (Causal.Causality.locallyCausallyOpen_iff).
[[property]]
id = "locally_causally_open"
lean = "Causal.Causality.LocallyCausallyOpen"
what = "local causal openness in the future and in the past: every point has an open neighbourhood W with J⁺_U(V) and J⁻_U(V) open for all opens V ⊆ U ⊆ W"

# Two-sided: ChronalFutureNeighbours of C.dual (the past side, `.1`, which is
# Causal.Causality.ChronalPastNeighbours by definition since T-abs-one-sided-future-base, 1cef44b,
# DEC-166 (a)) and of C (the future side, `.2`): Causal.Causality.chronalNeighbours_iff_future.
# Chronology is taken in V, not in M; it makes every point strongly tarentin
# (Causal.Causality.ChronalNeighbours.mem_Zplus; one side each,
# Causal.Causality.ChronalFutureNeighbours.mem_Zplus and its dual
# Causal.Causality.ChronalPastNeighbours.mem_Zminus), and under absolute minimality on a T1 space it
# is I^±(x) ≠ ∅ for every x (Causal.Causality.AbsolutelyMinimal.chronalNeighbours_iff; one side each,
# Causal.Causality.AbsolutelyMinimal.chronalFutureNeighbours_iff and its dual
# chronalPastNeighbours_iff).
[[property]]
id = "chronal_neighbours"
lean = "Causal.Causality.ChronalNeighbours"
what = "in every open V, every v ∈ V has p, p' ∈ V with p ≪_V v ≪_V p' (chronology taken in V)"

# ---- has_chronal_neighbour (T-lad-has-chronal-neighbour, 2026-11-23; DEC-159, OQ-51): the
# localisation property of locating an extension (Sbierski 1507.00601 Lemma 2.17, Grant–Kunzinger–
# Sämann 1804.10423 Lemma 3.8; no ETT label). Causal.Causality.HasChronalNeighbourEverywhere
# (Causal/ChronalNeighbourBridge.lean, ETT layer: it imports Causal.LocateExtension and
# Causal.LadderLocal, no model) is ∀ p, C.HasChronalNeighbour p; Causal.Causality.HasChronalNeighbour p
# (Causal/LocateExtension.lean) is (C.Iplus ⊤ {p}).Nonempty ∨ (C.Iminus ⊤ {p}).Nonempty: one point,
# one side, chronology in M. It is what both Lorentzian proofs take from the metric (Sbierski's
# "let q̃ ∈ I⁻(p̃, Ũ)", GKS's Ĩ±(p̃) ∩ Ω̃ ≠ ∅), made one-sided so that a BTZ point (I⁻ = ∅ ≠ I⁺,
# rem:btz_pas_tarentin) qualifies. Without it at the boundary Lemma 2.17 is false in ETT
# (Causal.not_exists_leaving_bare: the isolated line, OQ-51). The form, the keeper's choice:
# * Everywhere, not the point predicate. A node is a predicate on one causality. The point
#   predicate at the frontier points of one open set, which is all Lemma 2.17 asks, is an edge
#   hypothesis: written in words in the `under` of the boundary form
#   (Causal.Causality.exists_leaving_of_isOpenEmbedding, a consequence at causally_arc_connected
#   below), as one_sided_boundary and slice_restart are (DEC-166 (b), DEC-162). The node gives it at
#   every frontier point of every open set.
# * One node: Causal.Causality.NonemptyChronalCones (I⁺(x) and I⁻(x) both non-empty for every x) is
#   not added. It lies between chronal_neighbours and this node
#   (Causal.Causality.ChronalNeighbours.nonemptyChronalCones,
#   Causal.Causality.NonemptyChronalCones.hasChronalNeighbourEverywhere), and it is chronal_neighbours
#   on every absolutely minimal spacetime on a T1 space
#   (Causal.Causality.AbsolutelyMinimal.chronalNeighbours_iff_nonemptyChronalCones) and on every
#   causally arc-connected one, with no separation
#   (Causal.Causality.CausallyArcConnected.chronalNeighbours_iff).
#   Under DEC-167 (gluing: every ETT causality absolutely minimal) it is therefore chronal_neighbours
#   on every ETT spacetime, a second name for one notion: only the global line separates the two in
#   Lean (Causal.globalLine_separates), and it is no causality with gluing. Every theorem of the
#   library that takes it also takes absolute minimality (T1) or causal arc-connectedness
#   (Causal.Causality.K_lorentzien, Causal.Causality.Zplus_Zminus_eq_univ,
#   Causal.Causality.IsCauchySurface.sigma_separe_of_nonemptyChronalCones, a consequence at
#   is_causal ∧ causally_arc_connected since T-lad-record-cauchy-separation), where it is
#   chronal_neighbours. This node is not chronal_neighbours under any hypothesis of the library: the
#   closed half-line, causally arc-connected, has it and lacks chronal neighbours (a [[fails]] below).
# * Invariant under time reversal (Causal.Causality.dual_hasChronalNeighbourEverywhere), so it needs
#   no future and past pair, unlike the one-sided ChronalFutureNeighbours (no node).
# Characterisations (consequences below): under causal arc-connectedness with no separation
# (Causal.Causality.CausallyArcConnected.hasChronalNeighbour_iff), or under absolute minimality on a
# T1 space (Causal.Causality.AbsolutelyMinimal.hasChronalNeighbour_iff), a point has a chronal
# neighbour iff it lies in Z⁺(M) ∪ Z⁻(M): there the node is Z⁺ ∪ Z⁻ = M.
# Layer 3 per model: a model with chronal neighbours has it through chronal_neighbours ⇒
# has_chronal_neighbour (the timelike line, the static spacetimes and the half-plane, E_α's massive
# and cosmic-string causalities, the flat time cylinders: Causal.timelikeLine_chronalNeighbours,
# Causal.staticCausality.chronalNeighbours, Causal.massive_chronalNeighbours,
# Causal.cosmicString_chronalNeighbours, Causal.Flat.timeCylinder_chronalNeighbours); Schwarzschild's
# comes through T-loc-smooth-causal-ladder's chronal_neighbours. E₀ has it without chronal_neighbours
# (T-loc-e0-has-chronal-neighbour; recorded by T-lad-record-direct-witnesses, 2026-11-27):
# Causal.E0.hasChronalNeighbourEverywhere (Causal/Model/E0ChronalNeighbour.lean:147), the future
# disjunct I⁺(p) ≠ ∅ at every point, BTZ points included, the past one failing exactly on the axis
# (Causal.E0.Iminus_nonempty_iff; defi:causal_E0's I⁻(p) = ∅); so E₀ has chronal future neighbours
# and neither chronal past neighbours nor chronal neighbours (Causal.E0.chronalFutureNeighbours,
# Causal.E0.not_chronalNeighbours). It is the instance at E₀ of
# Causal.Causality.SingularFlatAxioms.hasChronalNeighbourEverywhere (:107: every causality with
# SingularFlatAxioms, from the field Causal.Causality.SingularFlatAxioms.mem_Zplus read at U = M,
# rem:btz_pas_tarentin; no instance argument). Every E_{≥0}-manifold has it too, for every causality
# with an isomorphic chart at each point and no absolute minimality, separation or countability
# (Causal.SFALocal.hasChronalNeighbourEverywhere; its natural causality,
# Causal.SFALocal.hasChronalNeighbourEverywhere_of_isAtlasCausalityDEC25; E₀-manifolds,
# Causal.SFALocalE0.hasChronalNeighbourEverywhere). Causal.E0.separates_chronalNeighbours bundles E₀'s
# node with causal arc-connectedness, absolute minimality, causality, push-up, tarentin, plainness,
# global hyperbolicity, strong causality in both forms and curves_extend, and ¬ ChronalNeighbours: a
# model, beside the model-free closed half-line, that separates the node from chronal_neighbours.
# Not entered as a [[fails]]: every pair X → chronal_neighbours is refuted already, so it would move
# none. The binder of papers/sbierski-schwarzschild binds Lemma 2.17 to it (T-bind-sbierski-schwarzschild).
[[property]]
id = "has_chronal_neighbour"
lean = "Causal.Causality.HasChronalNeighbourEverywhere"
what = "every point p has a chronal neighbour in M, on one side at least: I⁺(p) or I⁻(p) non-empty, chronology taken in M (Causal.Causality.HasChronalNeighbour at every point; the endpoint of the closed half-line, I⁻ = ∅ ≠ I⁺, qualifies)"

# ------------------------------------------------------------------ properties of a geometry
# Sort `geometry` (header): Sbierski 1309.7591's A1, A3, A4 in lean-causal's CBG interface, the fields
# `rigid`, `germExt_future`/`germExt_past`, `slice_future`/`slice_past` of Causal.CBG.Geometry
# (Causal/CBG/Geometry.lean); their Level B forms in Causal/CBG/FromModel.lean.

# A1. Not the causal rigidity Causal.IsRigid C D (abstract 𝕄≥0-morphisms, Causal/SubExtension.lean),
# false on the timelike line (Causal.timelikeLine_not_isRigid) and the wrong hypothesis for CBG
# (CBG-DESIGN §2). IsRigidFor fails into a non-Hausdorff target (Causal.CBG.not_isRigidFor_branchingLine),
# whence the Hausdorff target. At Level B every local model is rigid: Causal.CBG.eqOn_of_liftPropOn
# derives A1 from the field B1 (LocalModel.rigid, rigidity of the groupoid G) and local connectedness
# of the model space. rem:CBG_analytique asserts it for 𝕄≥0-morphisms; the ETT ledger's finding: it
# holds for structure morphisms with Hausdorff target only.
[[property]]
id = "rigid"
lean = "Causal.CBG.IsRigidFor"
label = "rem:CBG_analytique"
sort = "geometry"
what = "A1: for structures s, t with Hausdorff target, IsRigidFor (IsMor s t): two morphisms on a connected open V agreeing on a non-empty open O ⊆ V agree on V (Sbierski Lemma 3.1, Cor 3.2)"

# A3, one id for both time directions (no time reversal: the reverse of an E₀-manifold is not one,
# CBG-DESIGN §2); `lean` names the future form, the past form is Causal.CBG.LocalModel.GermExtPast.
# At Level B both are derived off the BTZ locus (Causal.CBG.LocalModel.germExtFuture_of,
# germExtPast_of): the residual is LocalModel.GermExtFutureBTZ and GermExtPastBTZ, owed by gx for E₀
# and vacuous without BTZ points (germExtFutureBTZ_of_singY_zero, germExtPastBTZ_of_singY_zero). Flat
# model: Causal.CBG.flatModelOf_germExtFuture, flatModelOf_germExtPast. ETT reaches it through
# cor:ext_continue (consequence below), whose printed proof the ETT ledger flags; no label.
[[property]]
id = "germ_extension"
lean = "Causal.CBG.LocalModel.GermExtFuture"
sort = "geometry"
what = "A3, both time directions (with Causal.CBG.LocalModel.GermExtPast): ψ an injective morphism on a common Cauchy sub-development U (M, N, U, ψ(U) globally hyperbolic; Σ ⊆ U Cauchy in M and U, ψ(Σ) in N and ψ(U)); for p ∈ ∂U ∩ J⁺(Σ) (resp. J⁻(Σ)) at which ψ clusters at q along U, there are an open O ∋ p and a morphism φ on O with φ p = q and φ = ψ on O ∩ U; M, N Hausdorff, connected, second countable (Sbierski Lemma 3.8)"

# A4, one id for both time directions; `lean` names the future form, the past form is
# Causal.CBG.LocalModel.SlicePast. At Level B SlicePast holds for every local model
# (Causal.CBG.LocalModel.slicePast, from the cone-slice field) and SliceFuture off the BTZ locus
# (LocalModel.sliceFuture_of): the residual is LocalModel.SliceFutureBTZ, owed by gx for E₀. Flat
# model: Causal.CBG.flatModelOf_sliceFuture, flatModelOf_slicePast. ETT uses it in
# prop:Cauchy_non_max (consequence below); no label.
[[property]]
id = "cauchy_slice"
lean = "Causal.CBG.LocalModel.SliceFuture"
sort = "geometry"
what = "A4, both time directions (with Causal.CBG.LocalModel.SlicePast): U globally hyperbolic with Σ ⊆ U a Cauchy surface of M and of U, p ∈ ∂U ∩ J⁺(Σ) with J⁻(p) ∩ ∂U ∩ J⁺(Σ) = {p} (resp. the past form): inside every open O ∋ p, U enlarges to a globally hyperbolic open U' ⊆ U ∪ O of which Σ is a Cauchy surface (Sbierski Thm 3.6's slice, Lemma 3.11)"

# Premise-free (T-tool-ladder-py-2): every Level-B local model is rigid. Causal.CBG.eqOn_of_liftPropOn
# is A1 for the structure morphisms of a local model (LiftPropOn of its groupoid G), from the field
# B1 (LocalModel.rigid) and local connectedness of the model space, into a Hausdorff target; it is
# the `rigid` field of every geometry built from a local model (Causal/CBG/FromModel.lean, the
# geometry of ofLocalModelOfGermSlice), whatever its A3 and A4. So germ_extension, cauchy_slice ⇒
# rigid at Level B with the premise unused.
[[fact]]
property = "rigid"
witness = "Causal.CBG.eqOn_of_liftPropOn"
status = "checked"
note = "every local model is rigid (Level B; Hausdorff target)"

# ------------------------------------------------------------------ properties of a pair of causalities
# Sort `pair` (header): C nested in C' on one space M, Causal/NestedCausalities.lean (layer 1, no
# model imported). No ETT label: ETT has one causality per space; the sources are ERS 1802.03020 §4
# and Reall 2101.11623. The ERS binder (papers/ers-predictability/certificate/binder.toml) proposed
# both ids (T-lad-nested-nodes).

# The basic notion: what Reall's "effective-metric cone inside the causal cone" gives, and what makes
# C' a better a-priori bound in ERS Remark 4.74 (transitivity, consequence below).
[[property]]
id = "le_nested"
lean = "Causal.Causality.LeNested"
sort = "pair"
what = "C is ≤-nested in C': for every open U, x ≤_U y for C implies x ≤_U y for C' (C the narrower causality, C' the wider)"

# Subluminality as ERS's Lemma 4.72 uses it (CurveNestedOn C₂ C_m U₂: the cone of g(u₂, du₂) inside
# Minkowski's, on the development's domain U₂), and (4.87) of Lemma 4.86 (the slope-δ cone inside
# g's). Implied by le_nested and, on a T1, second countable M, by inextensible_nested (edges below);
# the converse le_nested fails (the pointed line, [[fails]] below) and holds when the narrower C is
# causally arc-connected (a consequence below).
[[property]]
id = "curve_nested"
lean = "Causal.Causality.CurveNestedOn"
sort = "pair"
what = "C is curve-nested in C' on an open W: every future causal curve of W for C, over a segment, is one for C' (W = M unless an entry names W; at M it holds on every open)"

# T-lad-nested-inextensible (2026-11-22), DEC-161 (b): the nesting of record for ERS Lemma 4.70
# ((4.62), "T is timelike with respect to g(u, du)": Causal.Causality.ers_lemma_4_70's hn₁, hn₂, Cτ
# the causality of the field T nested in each development's) and for item 2 of
# T-abs-nested-causalities (nested domains of dependence, the Cauchy transfer: consequences below);
# also the `hinext` of ERS Thms 4.79, 4.80 (Causal.ers_theorem_4_79, ers_theorem_4_80: S, m-Cauchy in
# D_m(S) ∩ U₁, is g(u₁)-Cauchy there) and the hn₁, hn₂ of Cor 4.71 (Causal.Causality.ers_corollary_4_71).
# Read 2026-11-22 by `#check`: InextensibleNestedOn : Causality M → Causality M → Opens M → Prop,
# ∀ ⦃I c⦄, C.Inextensible W I c → C'.Inextensible W I c (Causal/NestedCausalities.lean:135). The ERS
# binder (papers/ers-predictability/certificate/binder.toml) proposed the id (rows 4.70, 4.71, 4.77,
# 4.79, 4.80). Implied by neither le_nested nor curve_nested ([[fails]] below). It implies
# curve_nested at the same open W on a T1, second countable M (edge below:
# Causal.Causality.InextensibleNestedOn.curveNestedOn_of_t1_secondCountable); whether it implies
# le_nested is open (end of file). Since T-lad-record-direct-witnesses (2026-11-27,
# T-abs-inextensible-nested-basics) it is reflexive, transitive and invariant under time reversal with
# no hypothesis, and passes to a smaller open V ⊆ W under a condition in words (consequences below,
# Causal/InextensibleNestedBasics.lean); not in general: Causal.not_inextensibleNestedOn_mono refutes
# the bare monotonicity on a space that is not T1 (the note beside the consequences).
[[property]]
id = "inextensible_nested"
lean = "Causal.Causality.InextensibleNestedOn"
sort = "pair"
what = "C is inextensibly nested in C' on an open W: every inextensible causal curve of W for C is an inextensible causal curve of W for C' (W = M unless an entry names W; it does not pass to a smaller open in general, Causal.not_inextensibleNestedOn_mono)"

