# The causality ladder of ETT: a DAG of causal-topological properties, with consequences at every level.
#
# Checked by `python3 tools/ladder.py check`; Lean automation generated from it by
# `python3 tools/ladder.py emit-lean` (Causal/Ladder/Rules.lean, the `causal_ladder` tactic's rules).
#
# [[property]]  id, lean (the Causal definition), label (ETT ledger label, if any), what (one line)
# [[implies]]   from (list of ids, read as a conjunction), to (id), witness (Lean theorem),
#               under (side conditions that are not ladder nodes, in words), status seed|checked
# [[fails]]     from, to, witness (a Lean counterexample: a space with `from` and not `to`), status
# [[consequence]] at (id), statement (one line), witness (Lean theorem), status
# [[open]]      from, to, note: a pair whose implication is neither proved nor refuted
#
# status `seed`: the witness name exists, but its side conditions have not been read against the edge;
# the ladder-keeper reads them and turns the edge `checked` (or fixes `under`).

[[property]]
id = "is_causal"
lean = "Causality.IsCausal"
what = "no closed causal loops: ≤ is antisymmetric"

[[property]]
id = "strongly_causal"
lean = "Causality.StronglyCausal"
label = "def:strongly_causal_spacetime"
what = "every point has arbitrarily small causally convex neighbourhoods"

[[property]]
id = "strongly_causal_open"
lean = "Causality.StronglyCausalOpen"
label = "def:strongly_causal_spacetime"
what = "the literal reading: arbitrarily small causally convex OPEN neighbourhoods"

[[property]]
id = "globally_hyperbolic"
lean = "Causality.GloballyHyperbolic"
label = "def:globally_hyperbolic"
what = "causal and every causal diamond compact"

[[property]]
id = "push_up"
lean = "Causality.PushUp"
label = "defi:pushup"
what = "x ≤ y ≪ z or x ≪ y ≤ z implies x ≪ z"

[[property]]
id = "causally_open"
lean = "Causality.CausallyOpen"
what = "I± of points are open (two-sided)"

[[property]]
id = "causally_open_future"
lean = "Causality.CausallyOpenFuture"
what = "I⁺ of points is open"

[[property]]
id = "absolutely_minimal"
lean = "Causality.AbsolutelyMinimal"
what = "the causality is the one generated by its restrictions to small opens"

[[property]]
id = "causally_arc_connected"
lean = "Causality.CausallyArcConnected"
what = "x ≤ y is realised by a causal curve"

[[property]]
id = "causally_plain"
lean = "Causality.CausallyPlain"
label = "defi:causalement_plat"
what = "no causal bubbles: J⁺(p) ∖ I⁺(p) has empty interior"

[[property]]
id = "tarentin"
lean = "Causality.Tarentin"
label = "def:tarentin_spacetime"
what = "Tarentin spacetime (ETT)"

[[implies]]
from = ["strongly_causal"]
to = "is_causal"
witness = "StronglyCausal.isCausal"
status = "seed"

[[implies]]
from = ["strongly_causal"]
to = "strongly_causal_open"
witness = "StronglyCausal.stronglyCausalOpen"
status = "seed"

[[implies]]
from = ["globally_hyperbolic"]
to = "strongly_causal"
witness = "GloballyHyperbolic.stronglyCausal"
status = "seed"

[[implies]]
from = ["causally_arc_connected"]
to = "absolutely_minimal"
witness = "CausallyArcConnected.absolutelyMinimal"
status = "seed"

[[implies]]
from = ["causally_arc_connected"]
to = "push_up"
witness = "CausallyArcConnected.pushUp"
status = "seed"

[[implies]]
from = ["push_up"]
to = "causally_open"
witness = "causallyOpen_of_pushUp"
status = "seed"

[[implies]]
from = ["absolutely_minimal"]
to = "causally_open_future"
witness = "AbsolutelyMinimal.causallyOpenFuture"
status = "seed"

[[consequence]]
at = "globally_hyperbolic"
statement = "J⁺(p) and J⁻(p) are closed"
witness = "GloballyHyperbolic.isClosed_Jplus_singleton"
status = "seed"
