# The causality ladder of ETT: a DAG of causal-topological properties, with consequences at every level.
#
# Checked by `python3 tools/ladder.py check`, classified by `python3 tools/ladder.py matrix`; Lean
# automation generated from it by `python3 tools/ladder.py emit-lean` (Causal/Ladder/Rules.lean, the
# `causal_ladder` tactic's rules, and its tests Causal/Ladder/Test.lean). The schema of record is the
# docstring of tools/ladder.py (T-tool-ladder-py, 2026-11-21): a key or table it does not list is a
# violation. In short:
#
# [[property]]    id, lean (the Causal definition), what (one line); label (an ETT ledger label, if
#                 any); sort ("causality", the default when absent; "geometry"; "pair": below)
# [[implies]]     from (an id or a list, read as a conjunction), to, witness (a Lean theorem), status;
#                 standing (words for hypotheses on M that are no ladder node: below); under (a side
#                 condition in words: none is left, below)
# [[fails]]       from (an id or a list: the counterexample has every one), to, witness (a Lean
#                 counterexample: a space with `from` and not `to`), status; space (the words its
#                 space satisfies; absent: the ambient, i.e. it is one of ETT's spacetimes)
# [[consequence]] at (an id or a list, read as a conjunction, of one sort), statement (one line),
#                 witness, status; under (the witness's other hypotheses in words, ladder ids named as
#                 such); standing
# [[transfer]]    pair (a pair-sort id: C nested in C', C the narrower), property (a causality-sort
#                 id), direction (to_narrower: C' has it, hence C; to_wider: C has it, hence C'),
#                 narrower and wider (causality-sort ids asked besides of C and of C'), exactly one of
#                 witness (with standing) or counterexample (with space), status; under
# [[open]]        from, to, note: a pair whose implication is neither proved nor refuted in Lean
# [[fact]]        property (an id: it holds outright on every object of its sort, no premise), witness,
#                 status; standing; note (T-tool-ladder-py-2). Two: rigid (every Level-B local model)
#                 and curves_extend (every causality on a T1, second countable space)
#
# status `seed`: the witness name exists, but its hypotheses have not been read against the entry;
# the ladder-keeper reads them and turns it `checked` (or fixes `from`, `standing`, `under`).
#
# Names. Every Lean name (a property's `lean`, a witness, a counterexample) is the FULL name of a
# declaration of lean-causal/Causal, written fully qualified (`Causal.Causality.…`,
# `Causal.Precausality.…`) as the ETT ledger lists its declarations. tools/ladder.py resolves it
# namespace-exactly, by reading the sources (namespace and section blocks, comments blanked): a dotted
# suffix of a full name is not enough. Each `label` is checked against papers/ett/ledger/ledger.json.
#
# The ambient and `standing`. ETT's topological spacetimes are Hausdorff and second countable
# (def:category_topological_spacetimes, ETT.tex:255): with no [ambient] table the ladder is read on
# the spaces with T2 and second_countable, closed under the vocabulary's implications (T0, T1, T2,
# second_countable, first_countable, separable). `standing` lists the hypotheses on M that are not
# ladder nodes, each a word of tools/ladder.py's vocabulary for a Mathlib class that the witness takes
# as an instance argument (T1 [T1Space M], T2 [T2Space M], second_countable
# [SecondCountableTopology M], connected [ConnectedSpace M], …). The closure chains an edge exactly
# where its standing holds: on the ambient for `matrix`; on a counterexample's `space` for that
# counterexample, so a non-Hausdorff counterexample (branching spaces) says `space = ["T1"]` or less
# and is not read against an edge asking T2. A pair reached only through an edge whose standing
# exceeds the ambient (e.g. connected) is `implied-standing`, not counted as classified. emit-lean
# makes a CausalLadder rule of an edge with standing (aesop synthesises the instances, and the rule
# does not fire where they are not in context), and its Test.lean derives such a pair with exactly
# those instances and checks it is not derived without them: Lean checks each `standing` against
# its witness.
#
# `under`. On an [[implies]] `under` is a side condition in words that is no ladder node: the closure
# does NOT read it (an edge with `under` and no `standing` is chained as unconditional) and emit-lean
# skips the edge. So no [[implies]] carries one. Until T-lad-local-nodes (2026-11-21) it held
# localisation hypotheses (local push-up, local causal openness in the future and two-sided, chronal
# neighbours in every open set), which are ladder nodes since, defined in Causal/LadderLocal.lean,
# and stand in `from`; until T-lad-classify-core (2026-11-21) it held the four separation and
# countability hypotheses, which are `standing` since (strongly_causal ⇒ is_causal and
# absolutely_minimal ∧ causally_plain ⇒ push_up: T1; globally_hyperbolic ∧ tarentin ⇒
# strongly_causal: T2; Levin, globally_hyperbolic ∧ tarentin ⇒ time_function: T2, second_countable).
# All four are ambient, so the closure through them is exact on ETT's spacetimes. On a
# [[consequence]] `under` keeps the witness's other hypotheses in words (a consequence chains nothing;
# its separation words may move to `standing`, a later pass). A [[transfer]] with `under` is
# conditional: proved only under a condition in words, it is kept out of the contradiction check (a
# counterexample need not meet the condition), so a conditional transfer is a [[transfer]], not a
# [[consequence]] (T-tool-ladder-py-2; e.g. globally_hyperbolic along le_nested, with closed diamonds,
# Causal.Causality.globallyHyperbolic_iff_of_nested, may move here).
#
# Sorts and the matrix. `check` and `matrix` read `sort`. A pair joining two sorts is ill-typed
# (neither implication is a statement): it is not counted among the pairs to classify, and no
# [[implies]], [[fails]], [[open]] entry or consequence joins two sorts. Within one sort every ordered
# pair (a, b) is implied (b in the closure of a), fails (a counterexample has a, through the closure
# valid on its space, and lacks b, i.e. lacks an id b implies), open, implied-standing or unknown.
# A conjunctive `from` of a [[fails]] refutes each single id its counterexample has. A conjunctive
# premise of an [[implies]] chains only when all its ids hold, and the matrix asks single premises:
# such an edge classifies a pair only through a property implying all its premises (the edge
# absolutely_minimal ∧ causally_plain ⇒ push_up classifies none). A counterexample IS read backwards
# through one, to a fixpoint (T-tool-ladder-py-2): lacking the conclusion and having every premise
# but one, it lacks that one, and every id implying it (the rational line, absolutely minimal and not
# causally open in the future, is not locally causally open in the future by absolutely_minimal ∧
# locally_causally_open_future ⇒ causally_open_future; its entry also states it, since
# T-abs-rational-line-extras, as Causal.rationalLine_separates). Until T-lad-record-separators the
# backward reading settled no further pair on this ladder (the closers state the backward-read
# conjuncts in Lean); since then it settles 3, chronal_neighbours → push_up, locally_push_up,
# causally_plain, through the chronal membrane's time reversal, recorded by its one entry to
# locally_causally_open_future: having chronal neighbours and lacking causal openness, it lacks
# push-up by push_up ∧ chronal_neighbours ⇒ causally_open, then local push-up and plainness by
# absolutely_minimal ∧ locally_push_up ⇒ push_up and absolutely_minimal ∧ causally_plain ⇒ push_up
# (T1); its Lean witness states all three. Every negation the backward reading gives the entries of
# that section is a conjunct of their witnesses (the fork's and the loop fan's ¬ tarentin, by Levin's
# edge and prop:GH_fortement_causal's, read backwards); so the entries a witness would state beside
# its carrying one are left out there. It finds no contradiction the forward reading misses. A
# [[fact]] (a property holding outright on its sort's
# objects, no premise) is had by every space of its sort on which its standing holds: every property
# of the sort implies it.
