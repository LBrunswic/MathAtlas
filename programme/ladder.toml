# The causality ladder of ETT: a DAG of causal-topological properties, with consequences at every level.
#
# Checked by `python3 tools/ladder.py check`, classified by `python3 tools/ladder.py matrix`; Lean
# automation generated from it by `python3 tools/ladder.py emit-lean` (Causal/Ladder/Rules.lean, the
# `causal_ladder` tactic's rules, and its tests Causal/Ladder/Test.lean). The schema of record is the
# docstring of tools/ladder.py (T-tool-ladder-py, 2026-11-21): a key or table it does not list is a
# violation. In short:
#
# [[property]]    id, lean (the Causal definition), what (one line); label (an ETT ledger label, if
#                 any); sort ("causality", the default when absent; "geometry"; "pair": below)
# [[implies]]     from (an id or a list, read as a conjunction), to, witness (a Lean theorem), status;
#                 standing (words for hypotheses on M that are no ladder node: below); under (a side
#                 condition in words: none is left, below)
# [[fails]]       from (an id or a list: the counterexample has every one), to, witness (a Lean
#                 counterexample: a space with `from` and not `to`), status; space (the words its
#                 space satisfies; absent: the ambient, i.e. it is one of ETT's spacetimes)
# [[consequence]] at (an id or a list, read as a conjunction, of one sort), statement (one line),
#                 witness, status; under (the witness's other hypotheses in words, ladder ids named as
#                 such); standing
# [[transfer]]    pair (a pair-sort id: C nested in C', C the narrower), property (a causality-sort
#                 id), direction (to_narrower: C' has it, hence C; to_wider: C has it, hence C'),
#                 narrower and wider (causality-sort ids asked besides of C and of C'), exactly one of
#                 witness (with standing) or counterexample (with space), status; under
# [[open]]        from, to, note: a pair whose implication is neither proved nor refuted in Lean
#
# status `seed`: the witness name exists, but its hypotheses have not been read against the entry;
# the ladder-keeper reads them and turns it `checked` (or fixes `from`, `standing`, `under`).
#
# Names. Every Lean name (a property's `lean`, a witness, a counterexample) is the FULL name of a
# declaration of lean-causal/Causal, written fully qualified (`Causal.Causality.…`,
# `Causal.Precausality.…`) as the ETT ledger lists its declarations. tools/ladder.py resolves it
# namespace-exactly, by reading the sources (namespace and section blocks, comments blanked): a dotted
# suffix of a full name is not enough. Each `label` is checked against papers/ett/ledger/ledger.json.
#
# The ambient and `standing`. ETT's topological spacetimes are Hausdorff and second countable
# (def:category_topological_spacetimes, ETT.tex:255): with no [ambient] table the ladder is read on
# the spaces with T2 and second_countable, closed under the vocabulary's implications (T0, T1, T2,
# second_countable, first_countable, separable). `standing` lists the hypotheses on M that are not
# ladder nodes, each a word of tools/ladder.py's vocabulary for a Mathlib class that the witness takes
# as an instance argument (T1 [T1Space M], T2 [T2Space M], second_countable
# [SecondCountableTopology M], connected [ConnectedSpace M], …). The closure chains an edge exactly
# where its standing holds: on the ambient for `matrix`; on a counterexample's `space` for that
# counterexample, so a non-Hausdorff counterexample (branching spaces) says `space = ["T1"]` or less
# and is not read against an edge asking T2. A pair reached only through an edge whose standing
# exceeds the ambient (e.g. connected) is `implied-standing`, not counted as classified. emit-lean
# makes a CausalLadder rule of an edge with standing (aesop synthesises the instances, and the rule
# does not fire where they are not in context), and its Test.lean derives such a pair with exactly
# those instances and checks it is not derived without them: Lean checks each `standing` against
# its witness.
#
# `under`. On an [[implies]] `under` is a side condition in words that is no ladder node: the closure
# does NOT read it (an edge with `under` and no `standing` is chained as unconditional) and emit-lean
# skips the edge. So no [[implies]] carries one. Until T-lad-local-nodes (2026-11-21) it held
# localisation hypotheses (local push-up, local causal openness in the future and two-sided, chronal
# neighbours in every open set), which are ladder nodes since, defined in Causal/LadderLocal.lean,
# and stand in `from`; until T-lad-classify-core (2026-11-21) it held the four separation and
# countability hypotheses, which are `standing` since (strongly_causal ⇒ is_causal and
# absolutely_minimal ∧ causally_plain ⇒ push_up: T1; globally_hyperbolic ∧ tarentin ⇒
# strongly_causal: T2; Levin, globally_hyperbolic ∧ tarentin ⇒ time_function: T2, second_countable).
# All four are ambient, so the closure through them is exact on ETT's spacetimes. On a
# [[consequence]] `under` keeps the witness's other hypotheses in words (a consequence chains nothing;
# its separation words may move to `standing`, a later pass). On a [[transfer]] `under` is read as on
# an [[implies]]: the contradiction check does not see it, so a transfer proved only under a condition
# in words that a recorded counterexample lacks stays a [[consequence]] (globally_hyperbolic along
# le_nested, with closed diamonds).
#
# Sorts and the matrix. `check` and `matrix` read `sort`. A pair joining two sorts is ill-typed
# (neither implication is a statement): it is not counted among the pairs to classify, and no
# [[implies]], [[fails]], [[open]] entry or consequence joins two sorts. Within one sort every ordered
# pair (a, b) is implied (b in the closure of a), fails (a counterexample has a, through the closure
# valid on its space, and lacks b, i.e. lacks an id b implies), open, implied-standing or unknown.
# A conjunctive `from` of a [[fails]] refutes each single id its counterexample has. A conjunctive
# premise of an [[implies]] chains only when all its ids hold, and the matrix asks single premises:
# such an edge classifies a pair only through a property implying all its premises (the edge
# absolutely_minimal ∧ causally_plain ⇒ push_up classifies none), and a counterexample is never read
# backwards through one (the rational line, absolutely minimal and not causally open in the future,
# is not locally causally open in the future by absolutely_minimal ∧ locally_causally_open_future ⇒
# causally_open_future, which the matrix does not see: an [[open]] entry wants that Lean statement).
# Classified pairs, within one sort since T-tool-ladder-py: 98 of 314 (92 of the 306 causality-sort
# pairs) after T-lad-plain-separations; 312 of 314 after T-lad-classify-core, of which 131 implied or
# refuted and 181 [[open]] causality-sort entries with what each is missing (the end of the file);
# the 2 left are the geometry-sort pairs germ_extension, cauchy_slice → rigid (below).
#
# Three sorts of property (T-lad-cbg-geometry-nodes, T-lad-nested-nodes, 2026-11-20); `pair` is
# described after `geometry`. A property of sort `causality` (the default: no `sort` field) has a Lean
# definition that is a predicate on one causality C on a topological space M; most entries are about
# these.
# A property of sort `geometry` (`sort = "geometry"`) has a Lean definition that is a predicate on the
# structures and morphisms of a geometry, Causal.CBG.Geometry (Level A) or Causal.CBG.LocalModel
# (Level B), not on one causality: `rigid` (A1: a predicate on a class of morphisms), `germ_extension`
# (A3) and `cauchy_slice` (A4), the localisation properties of Sbierski's MGHD argument
# (lean-causal/docs/CBG-DESIGN.md §2). They are [[property]] entries because tools/binder.py takes the
# ids a binder may name from [[property]] only.
# * A property of one sort enters an edge or a consequence of another only through `under`, in words.
# * Within the geometry sort a pair is read at Level B (a local model 𝔐; `rigid` then means
#   IsRigidFor (𝔐.IsMor s t) for all structures s, t with Hausdorff target). At Level A all three
#   are fields of Causal.CBG.Geometry and hold outright.
# * A consequence at a geometry property is a theorem over a Causal.CBG.Geometry, whose fields carry
#   all three (and the A2 causal facts); it is listed at the property whose field its proof consumes.
# * No geometry-sort [[implies]] is recorded. At Level B, `germ_extension` ⇒ `rigid` and
#   `cauchy_slice` ⇒ `rigid` hold with the premise unused: every local model is rigid
#   (Causal.CBG.eqOn_of_liftPropOn, from the field LocalModel.rigid). A premise-free fact is not an
#   edge, so these two pairs stay `unknown` (neither open nor a gap). emit-lean makes no CausalLadder
#   rule of an edge joining a property not of the sort `causality` (the rules are about one
#   causality), only a skipped-edge comment line in Rules.lean.
#
# A property of sort `pair` (`sort = "pair"`, T-lad-nested-nodes) has a Lean definition that is a
# predicate on TWO causalities C, C' of one topological space M, a nesting: "C is nested in C'", C the
# narrower causality, C' the wider (Causal/NestedCausalities.lean). Sub- and superluminality are
# nestings (ERS 1802.03020 §4: the cone of g(u, du) inside Minkowski's, or T timelike for every
# g(u, du)); so is Reall 2101.11623's effective-metric cone inside the causal cone. A nesting is a
# relation between two spacetime structures on M, the localisation property programme/README.md calls
# "a nesting of two causalities", and a predicate on neither one causality nor a geometry.
# * `le_nested` is Causal.Causality.LeNested C C' (≤_U of C inside ≤_U of C', every open U).
#   `curve_nested` is Causal.Causality.CurveNestedOn C C' W, read at the open W its entry names (W = M
#   when none is named); it passes to every open V ⊆ W (consequence Causal.Causality.CurveNestedOn.mono),
#   so at W = M it is curve nesting on every open.
# * Within the pair sort an entry keeps C and C' fixed: `le_nested ⇒ curve_nested` reads
#   LeNested C C' ⇒ CurveNestedOn C C' W for every open W, and the [[fails]] curve_nested ⇏ le_nested
#   is a pair (C, C') curve-nested and not ≤-nested.
# * What a nesting does is transfer: a causality-sort property of one causality passes to the other.
#   Since T-lad-classify-core a transfer with no condition in words is a [[transfer]] entry (direction,
#   the ids asked besides of each causality, a witness or a counterexample; `check` refuses a
#   counterexample that satisfies the hypotheses of a proved transfer of the same property and
#   direction along a nesting it implies). A transfer under a condition that is no node, and every
#   other theorem about a nesting, is a consequence at the pair property, its `under` saying of which
#   causality each ladder id is asked ("of C", the narrower; "of C'", the wider).
# * emit-lean makes no CausalLadder rule of a pair-sort edge (emitted() skips any edge with a property
#   not of the sort `causality`; a skipped-edge comment line in Rules.lean), asks `lean_form` of no
#   pair property (emit_test keeps the sort `causality` only; LeNested's binder `C C' : Causality M`
#   would otherwise be misread as one causality), and reads no [[transfer]].
# * Not nodes: Causal.Causality.LtNested (≪-nesting; no theorem of the library uses it) and
#   Causal.Causality.InextensibleNestedOn, whose node waits on OQ-41 (b) (T-lad-nested-inextensible);
#   the latter appears below in words only, as the conclusion of a consequence at `curve_nested`.
#
# Provenance of the names. Those added on 2026-11-20 by T-lad-cbg-geometry-nodes and by
# T-lad-nested-nodes were resolved by `#check` against the library as built that day (lake env lean,
# no build); so were those added on 2026-11-21 by T-lad-local-nodes (the four localisation nodes,
# their eight edges, the lightlike line's counterexamples), with their signatures: none takes a
# separation instance; by T-lad-gh-causal (the node causally_compact, its three edges, time_function
# ⇒ is_causal, the half-plane's counterexamples, the consequences at is_causal and causally_compact),
# with their signatures: no edge witness takes a separation instance; the two witnesses switched for
# T-abs-hoist-time-function (Causal.Causality.HasTimeFunction.curvesExtend, .isCausal: each
# {M} [TopologicalSpace M] {C : Causality M}, C.HasTimeFunction → …, no other premise); those of
# T-lad-plain-separations (the edge absolutely_minimal ∧ causally_plain ⇒ push_up, whose witness takes
# [T1Space M]; seven counterexamples, closed statements about Causal.lightlikeLine and
# Causal.deuxPushup, and the split halves named beside them); and those of T-lad-classify-core
# (2026-11-21: the counterexamples on the rational, spacelike, isolated and lightlike lines and
# Galileo's spacetime, the pointed line's pair-sort counterexample, the seven transfers, the three
# consequences at curve_nested, and every Lean name its comments cite), from Causal.NestedConverse,
# Causal.NestedTransfer (strict library since 8044439, f868749) and older modules; the four
# standings were read against their witnesses' instance binders, and the dry run of emit-lean
# (Rules and Test compiled from one /tmp file) checks them.

[[property]]
id = "is_causal"
lean = "Causal.Causality.IsCausal"
label = "def:causal_spacetime"
what = "≤_M is antisymmetric (an order, reflexivity and transitivity being axioms): no closed causal loops in M"

[[property]]
id = "strongly_causal"
lean = "Causal.Causality.StronglyCausal"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains a neighbourhood, not necessarily open, causally convex in M (the definition, DEC-7)"

[[property]]
id = "strongly_causal_open"
lean = "Causal.Causality.StronglyCausalOpen"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains an OPEN neighbourhood causally convex in M (the literal reading through defi:convexite_causale; auxiliary since DEC-7)"

[[property]]
id = "globally_hyperbolic"
lean = "Causal.Causality.GloballyHyperbolic"
label = "def:globally_hyperbolic"
what = "causal, and every full diamond J_M(p,q) is compact (is_causal ∧ causally_compact: Causal.Causality.globallyHyperbolic_iff, Iff.rfl)"

# T-lad-gh-causal (2026-11-21). The second conjunct of def:globally_hyperbolic, which the Lean
# writes out rather than naming (Properties.lean:144); the three edges below make
# globally_hyperbolic ⇔ is_causal ∧ causally_compact. Reads ≤_M only, like is_causal: invariant
# under time reversal and under any homeomorphism carrying ≤_M onto ≤_N (consequences below).
[[property]]
id = "causally_compact"
lean = "Causal.Causality.CausallyCompact"
label = "def:causally_compact"
what = "every full diamond J_M(p,q) = J⁻(q) ∩ J⁺(p) is compact (no causality asked: a closed causal loop is allowed)"

[[property]]
id = "push_up"
lean = "Causal.Causality.PushUp"
label = "defi:pushup"
what = "in every open U: x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z"

[[property]]
id = "causally_open"
lean = "Causal.Causality.CausallyOpen"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) and J⁻_U(V) are open (the definition read with J±, DEC-8)"

[[property]]
id = "causally_open_future"
lean = "Causal.Causality.CausallyOpenFuture"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) is open (the definition as printed, J⁺ alone; auxiliary since DEC-8)"

[[property]]
id = "absolutely_minimal"
lean = "Causal.Precausality.AbsolutelyMinimal"
label = "def:topological_space_causality_absolutely"
what = "for every open cover, the precausality generated by the restrictions to its members is the given one"

[[property]]
id = "causally_arc_connected"
lean = "Causal.Causality.CausallyArcConnected"
label = "def:causal_arc_connectedness"
what = "in every open U, p ≤_U q (resp. p ≪_U q) iff a causal (resp. chronal) curve in U joins p to q"

[[property]]
id = "causally_plain"
lean = "Causal.Causality.CausallyPlain"
label = "defi:causalement_plat"
what = "for every open U and A ⊂ M, Int J±_U(A) ⊂ closure I±_U(A): no open set of causal, non-chronological points (no bubbles)"

[[property]]
id = "tarentin"
lean = "Causal.Causality.Tarentin"
label = "def:tarentin_spacetime"
what = "every neighbourhood of every x contains p, q with x ∈ Int J_M(p,q)"

# Defined in Causal/CurvesExtend.lean (ETT layer: no model imported), beside the theorem whose
# hypothesis it is (curvesExtend_of_timeFunction; also Sbierski Lemma 3.3's), moved there verbatim,
# same full name, from the model-reaching Causal/CBG/Pgcd.lean by T-abs-hoist-time-function
# (2026-11-21); so emit-lean gives it a Lean form in Causal.Ladder.Test. No ETT label: ETT's time function (defi:fonction_temps) is Causal.Causality.IsTimeFunction, a
# morphism to the timelike line, open under DEC-10, and not this node. Not stronger: it is
# non-decreasing along ≤, not strictly increasing, and does not make the causality causal (the
# doubled line has one and is not causal, Causal.exists_isTimeFunction_not_isCausal), while this node
# does (time_function ⇒ is_causal, below); so IsTimeFunction does not give HasTimeFunction
# (T-lad-time-function-causal, 2026-11-21).
[[property]]
id = "time_function"
lean = "Causal.Causality.HasTimeFunction"
what = "there is a continuous T : M → ℝ with T x < T y whenever x ≤_M y and x ≠ y (Sbierski Lemma 3.3's hypothesis; not ETT's defi:fonction_temps, which asks a morphism to the timelike line)"

# A named model fact (kb/0012, Causal/CauchyExtension.lean); no ETT label.
[[property]]
id = "curves_extend"
lean = "Causal.Causality.CurvesExtend"
what = "every causal curve of M over a segment [a, b] lies on an inextensible causal curve of M (over some interval)"

# ---- localisation properties (T-lad-local-nodes, 2026-11-21): the side conditions of four edges,
# defined in Causal/LadderLocal.lean (T-abs-ladder-local-defs, ETT layer, no model imported). No ETT
# label: ETT states them inline, as hypotheses of lem:pushup_local (ETT.tex:557) and of
# prop:topological_spacetime_absolutely_minimal (ETT.tex:698); chronal_neighbours has no paper
# sentence (hZm, hZp of Lemma K's causallyOpen_of_pushUp, DEC-93). "Local" is "every point has an
# open neighbourhood with the property"; for push-up and future causal openness, which pass to
# smaller opens, it is the arbitrarily-small form (Causal.Causality.locallyPushUp_iff_nhds,
# locallyCausallyOpenFuture_iff_nhds). Each global property implies its local form (edges below).
# The one-sided ChronalPastNeighbours is not a node (OQ-52 (a), the past base of the one-sided notions).

# The cover (O i) of lem:pushup_local is this, up to `choose` (Causal.Causality.locallyPushUp_of_cover).
[[property]]
id = "locally_push_up"
lean = "Causal.Causality.LocallyPushUp"
what = "every point has an open neighbourhood W having push-up as a spacetime (PushUpOn W: in every open U ⊆ W, x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z)"

# The hypothesis of prop:topological_spacetime_absolutely_minimal as printed (J⁺ alone).
[[property]]
id = "locally_causally_open_future"
lean = "Causal.Causality.LocallyCausallyOpenFuture"
what = "every point has an open neighbourhood W causally open in the future as a spacetime (CausallyOpenFutureOn W: J⁺_U(V) open for all opens V ⊆ U ⊆ W)"

# The same in the DEC-8 reading (J±). The Lean is the conjunction of the future form for C and for
# C.dual; one neighbourhood for both sides is equivalent (Causal.Causality.locallyCausallyOpen_iff).
[[property]]
id = "locally_causally_open"
lean = "Causal.Causality.LocallyCausallyOpen"
what = "local causal openness in the future and in the past: every point has an open neighbourhood W with J⁺_U(V) and J⁻_U(V) open for all opens V ⊆ U ⊆ W"

# Two-sided (ChronalPastNeighbours of C and of C.dual). Chronology is taken in V, not in M; it makes
# every point strongly tarentin (Causal.Causality.ChronalNeighbours.mem_Zplus, ChronalPastNeighbours.
# mem_Zminus), and under absolute minimality on a T1 space it is I^±(x) ≠ ∅ for every x
# (Causal.Causality.AbsolutelyMinimal.chronalPastNeighbours_iff, past side).
[[property]]
id = "chronal_neighbours"
lean = "Causal.Causality.ChronalNeighbours"
what = "in every open V, every v ∈ V has p, p' ∈ V with p ≪_V v ≪_V p' (chronology taken in V)"

# ------------------------------------------------------------------ properties of a geometry
# Sort `geometry` (header): Sbierski 1309.7591's A1, A3, A4 in lean-causal's CBG interface, the fields
# `rigid`, `germExt_future`/`germExt_past`, `slice_future`/`slice_past` of Causal.CBG.Geometry
# (Causal/CBG/Geometry.lean); their Level B forms in Causal/CBG/FromModel.lean.

# A1. Not the causal rigidity Causal.IsRigid C D (abstract 𝕄≥0-morphisms, Causal/SubExtension.lean),
# false on the timelike line (Causal.timelikeLine_not_isRigid) and the wrong hypothesis for CBG
# (CBG-DESIGN §2). IsRigidFor fails into a non-Hausdorff target (Causal.CBG.not_isRigidFor_branchingLine),
# whence the Hausdorff target. At Level B every local model is rigid: Causal.CBG.eqOn_of_liftPropOn
# derives A1 from the field B1 (LocalModel.rigid, rigidity of the groupoid G) and local connectedness
# of the model space. rem:CBG_analytique asserts it for 𝕄≥0-morphisms; the ETT ledger's finding: it
# holds for structure morphisms with Hausdorff target only.
[[property]]
id = "rigid"
lean = "Causal.CBG.IsRigidFor"
label = "rem:CBG_analytique"
sort = "geometry"
what = "A1: for structures s, t with Hausdorff target, IsRigidFor (IsMor s t): two morphisms on a connected open V agreeing on a non-empty open O ⊆ V agree on V (Sbierski Lemma 3.1, Cor 3.2)"

# A3, one id for both time directions (no time reversal: the reverse of an E₀-manifold is not one,
# CBG-DESIGN §2); `lean` names the future form, the past form is Causal.CBG.LocalModel.GermExtPast.
# At Level B both are derived off the BTZ locus (Causal.CBG.LocalModel.germExtFuture_of,
# germExtPast_of): the residual is LocalModel.GermExtFutureBTZ and GermExtPastBTZ, owed by gx for E₀
# and vacuous without BTZ points (germExtFutureBTZ_of_singY_zero, germExtPastBTZ_of_singY_zero). Flat
# model: Causal.CBG.flatModelOf_germExtFuture, flatModelOf_germExtPast. ETT reaches it through
# cor:ext_continue (consequence below), whose printed proof the ETT ledger flags; no label.
[[property]]
id = "germ_extension"
lean = "Causal.CBG.LocalModel.GermExtFuture"
sort = "geometry"
what = "A3, both time directions (with Causal.CBG.LocalModel.GermExtPast): ψ an injective morphism on a common Cauchy sub-development U (M, N, U, ψ(U) globally hyperbolic; Σ ⊆ U Cauchy in M and U, ψ(Σ) in N and ψ(U)); for p ∈ ∂U ∩ J⁺(Σ) (resp. J⁻(Σ)) at which ψ clusters at q along U, there are an open O ∋ p and a morphism φ on O with φ p = q and φ = ψ on O ∩ U; M, N Hausdorff, connected, second countable (Sbierski Lemma 3.8)"

# A4, one id for both time directions; `lean` names the future form, the past form is
# Causal.CBG.LocalModel.SlicePast. At Level B SlicePast holds for every local model
# (Causal.CBG.LocalModel.slicePast, from the cone-slice field) and SliceFuture off the BTZ locus
# (LocalModel.sliceFuture_of): the residual is LocalModel.SliceFutureBTZ, owed by gx for E₀. Flat
# model: Causal.CBG.flatModelOf_sliceFuture, flatModelOf_slicePast. ETT uses it in
# prop:Cauchy_non_max (consequence below); no label.
[[property]]
id = "cauchy_slice"
lean = "Causal.CBG.LocalModel.SliceFuture"
sort = "geometry"
what = "A4, both time directions (with Causal.CBG.LocalModel.SlicePast): U globally hyperbolic with Σ ⊆ U a Cauchy surface of M and of U, p ∈ ∂U ∩ J⁺(Σ) with J⁻(p) ∩ ∂U ∩ J⁺(Σ) = {p} (resp. the past form): inside every open O ∋ p, U enlarges to a globally hyperbolic open U' ⊆ U ∪ O of which Σ is a Cauchy surface (Sbierski Thm 3.6's slice, Lemma 3.11)"

# ------------------------------------------------------------------ properties of a pair of causalities
# Sort `pair` (header): C nested in C' on one space M, Causal/NestedCausalities.lean (layer 1, no
# model imported). No ETT label: ETT has one causality per space; the sources are ERS 1802.03020 §4
# and Reall 2101.11623. The ERS binder (papers/ers-predictability/certificate/binder.toml) proposed
# both ids (T-lad-nested-nodes).

# The basic notion: what Reall's "effective-metric cone inside the causal cone" gives, and what makes
# C' a better a-priori bound in ERS Remark 4.74 (transitivity, consequence below).
[[property]]
id = "le_nested"
lean = "Causal.Causality.LeNested"
sort = "pair"
what = "C is ≤-nested in C': for every open U, x ≤_U y for C implies x ≤_U y for C' (C the narrower causality, C' the wider)"

# Subluminality as ERS's Lemma 4.72 uses it (CurveNestedOn C₂ C_m U₂: the cone of g(u₂, du₂) inside
# Minkowski's, on the development's domain U₂), and (4.87) of Lemma 4.86 (the slope-δ cone inside
# g's). Implied by le_nested; the converse is open (below).
[[property]]
id = "curve_nested"
lean = "Causal.Causality.CurveNestedOn"
sort = "pair"
what = "C is curve-nested in C' on an open W: every future causal curve of W for C, over a segment, is one for C' (W = M unless an entry names W; at M it holds on every open)"

