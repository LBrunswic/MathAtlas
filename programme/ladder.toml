# ---- off the ambient (T-lad-record-dual-vee, 2026-11-21): counterexamples whose space is not one of
# ETT's spacetimes, each with a `space` key listing what its Lean witness states of the space. Since
# T-tool-ladder-space (599b0b0) refuted() and `matrix` count a [[fails]] only when its space, closed
# under the vocabulary, contains the ambient's words (T2, second_countable): a pair such an entry alone
# refutes is `fails-off`, not counted as classified, and an [[open]] entry for it stays legal. `check`
# still reads the entry on its own space: it may not have its `to` by the edges valid there.
#
# The vee (Causal.Vee, Causal.veeCausality, Causal/PushUpOfMinimalLocal.lean,
# T-abs-pushup-of-minimal-local, strict since 4e06808; ETT layer, no model): three points left, mid,
# right, a set open iff it contains mid as soon as it contains left or right (T0, not T1: {mid} is not
# closed); x ≤_U y iff x, y ∈ U and x ≤ y in left < mid < right; x ≪_U y iff left ∈ U, x ≠ right and
# y = mid. Read by `#check` (2026-11-21): Causal.veeCausality_separates_pushUp : T0Space Vee ∧
# ¬ T1Space Vee ∧ veeCausality.AbsolutelyMinimal ∧ veeCausality.LocallyPushUp ∧ ¬ veeCausality.PushUp
# (a closed statement; bare form Causal.not_pushUp_of_absolutelyMinimal_of_locallyPushUp_T0 : ¬ ∀ (X :
# Type) [TopologicalSpace X] [T0Space X] (C : Causality X), C.AbsolutelyMinimal → C.LocallyPushUp →
# C.PushUp). So `space = ["T0"]`, what the witness states: the vee is finite, hence second countable,
# which its witness does not state and no edge's standing would use (Levin's asks T2 besides). What
# it carries: the T1 of absolutely_minimal ∧ locally_push_up ⇒ push_up (its `standing`, the instance
# binder of Causal.Causality.AbsolutelyMinimal.pushUp_of_locallyPushUp) cannot be weakened to T0; a
# sharpness of the standing only, since ETT's spacetimes are Hausdorff. On its space only the edges
# without standing chain: its `from` reaches nothing more, and it lacks push_up and nothing else (no
# single premise reaches push_up there). So it refutes absolutely_minimal → push_up and
# locally_push_up → push_up off the ambient; both are refuted on the ambient already, the first in
# either reading (the half-chronological line), the second in the no-gluing reading only (the gated
# line, not absolutely minimal; in a gluing reading it holds on ETT's spacetimes, header), so `matrix`
# shows no `fails-off` pair from it (computed 2026-11-21). `check` reads it against that edge: the
# edge asks T1, not valid on {T0}, so no contradiction.
# Reading: moot: the vee is off ETT's spacetimes in either reading of defi:causalite (the witness gives
# absolute minimality on M; on every open set, the gluing reading's form, is not stated).
[[fails]]
from = ["absolutely_minimal", "locally_push_up"]
to = "push_up"
witness = "Causal.veeCausality_separates_pushUp"
space = ["T0"]
status = "checked"

