# causality is absolutely minimal, so the premise absolutely_minimal is had by every causality and the
# edge reads locally_push_up ⇒ push_up on T1 spaces; the ladder says so once T-lad-gluing-reading
# makes absolutely_minimal a [[fact]] (until then the gated line, not absolutely minimal, refutes
# locally_push_up → push_up in the no-gluing reading).
