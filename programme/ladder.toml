# ---- the density causality (T-abs-dens-separates, 82a2f330; ETT layer; recorded by
# T-lad-record-dens-prop-4-63, 2026-11-27). Causal.DensWitness.densCausality
# (Causal/CBG/SubExtensionAbstract.lean:213), on ℝ: x ≤_U y iff x ≤ y, x, y ∈ U and
# y − x ≤ 2 |U ∩ ]x, y]|, and x ≪_U y likewise with strict inequalities. So U fills at least half of
# ]x, y], and the causality relates points across gaps of U. Causal.densCausality_separates
# (Causal/DensSeparates.lean:192), read from the source with no build, is a closed statement on ℝ
# with no instance argument:
#   GloballyHyperbolic ∧ Tarentin ∧ IsCausal ∧ CausallyCompact ∧ StronglyCausal ∧ HasTimeFunction ∧
#   CurvesExtend ∧ StronglyCausalOpen ∧ PushUp ∧ LocallyPushUp ∧ CausallyOpen ∧ CausallyOpenFuture ∧
#   LocallyCausallyOpenFuture ∧ LocallyCausallyOpen ∧ CausallyPlain ∧ ChronalNeighbours ∧
#   HasChronalNeighbourEverywhere ∧ FutureOneConnected ∧ (∀ W, FutureOneConnectedOn W) ∧
#   ¬ CausallyArcConnected ∧ ¬ AbsolutelyMinimal ∧ ¬ ∀ W, AbsolutelyMinimalOn W.
# Where each conjunct comes from:
# * global hyperbolicity: Causal.DensWitness.densCausality_globallyHyperbolic;
# * tarentin: the second conjunct of Causal.ErsNoArcWitness.data;
# * push-up, new: Causal.DensWitness.densCausality_pushUp (the measure adds over the middle point);
# * chronal neighbours, new: Causal.DensWitness.chronalNeighbours_of_timelike (the density causality
#   contains the timelike line's chronology);
# * future one-connectedness on every open, new: Causal.DensWitness.futureOneConnectedOn_of_timelike
#   (its chronal curves are the timelike line's, Causal.DensWitness.chronalCurveOn_iff_timelike);
# * ¬ CausallyArcConnected: the first conjunct of
#   Causal.densCausality_ers_theorem_4_64_of_isCauchySurfaceOn_secondCountable_noArc;
# * ¬ AbsolutelyMinimal: Causal.GluingModels.densCausality_not_minimal (0 ≤ 1 in
#   ]−1/4, 1/4[ ∪ ]1/2, 5/4[);
# * the rest: causal_ladder on ℝ.
# It is the conjoined witness that the comment of T-lad-record-ers-cauchy-forms (the header) asked
# for. Two entries.
# * The first, from = [globally_hyperbolic, tarentin], to = causally_arc_connected, records the
#   separation that comment names. The trade forms of ERS Thm 4.64 ask U₁ causally arc-connected
#   beyond globally hyperbolic and tarentin, and their `_noArc` forms drop that binder. Before it no
#   counterexample on the ladder had the two premises together; each single premise was refuted, by
#   different models. Simulated in memory, its closure on the ambient is is_causal, causally_compact,
#   strongly_causal, locally_strongly_causal, time_function and curves_extend, it lacks
#   causally_arc_connected only, and it moves no pair.
# * The second has the 18 positive nodes the witness states as `from` and to = absolutely_minimal.
#   Lacking that, it lacks causally_arc_connected too (causally_arc_connected ⇒ absolutely_minimal).
#   It settles chronal_neighbours → absolutely_minimal, whose first Lean witness it is; the [[open]]
#   entry is removed in the same edit. That note had argued Galileo's spacetime and timelikeLineTop,
#   whose chronal neighbours are in Lean for neither (timelikeLineTop's non-minimality is:
#   Causal.timelikeLineTop_not_absolutelyMinimal). Its future_one_connected → absolutely_minimal and
#   → causally_arc_connected were refuted already, by the jump line (no-gluing) and the rational line
#   (either reading).
# locally_strongly_causal is in neither `from`. The witness does not state it, and the closure gives
# it (strongly_causal ⇒ locally_strongly_causal, no standing), as for the other strongly causal
# counterexamples.
# Whether [globally_hyperbolic, tarentin] ⇏ causally_arc_connected holds among absolutely minimal
# spacetimes, i.e. in the gluing reading, is not settled. The rational-jump plane is tarentin,
# absolutely minimal and not causally arc-connected, but it is not causally compact. No absolutely
# minimal Lean model is at hand (the REPORT of T-abs-dens-separates, its question 4).
# Reading: no-gluing only (kb/0014, OQ-18, DEC-167). ¬ AbsolutelyMinimal and ¬ ∀ W, AbsolutelyMinimalOn W
# are conjuncts, so the density causality is no causality under DEC-167's gluing, where every
# X → absolutely_minimal holds. T-lad-gluing-reading removes both entries with the other non-minimal ones.
[[fails]]
from = ["globally_hyperbolic", "tarentin"]
to = "causally_arc_connected"
witness = "Causal.densCausality_separates"
status = "checked"

