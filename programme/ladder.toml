# [T2Space M] [SecondCountableTopology M] (hC : C.IsCausal) {T : Set M} (hT : C.IsCauchySurface T)
# {A B : Opens M} (hTA : C.IsCauchySurfaceOn A T) (hTB : C.IsCauchySurfaceOn B T) :
# C.IsCauchySurfaceOn (A ⊓ B) T. The proof is an end-point argument the paper does not give
# (Causal.Causality.exists_mem_inf_of_isCauchySurfaceOn, the same binders and an inextensible curve of
# A ∩ B, which meets T): T2 for the uniqueness of the common end point, second countability through
# the curves theorem in its sub-arc form (Causal.Causality.exists_subArc_of_tailFree). Applied to φ(Σ)
# in N it is Causal.IsCauchyEmbedding.isCauchySurfaceOn_inf_of_secondCountable ('φ(Σ) is a Cauchy
# surface of A ∩ B', ETT.tex:1940–1941; N causal from φ a Cauchy embedding).
[[consequence]]
at = "is_causal"
statement = "a Cauchy surface T of M that is a Cauchy surface of two open sets A and B is a Cauchy surface of A ∩ B"
witness = "Causal.Causality.isCauchySurfaceOn_inf_of_secondCountable"
under = "nothing else (T a Cauchy surface of M, of A and of B)"
standing = ["T2", "second_countable"]
status = "checked"

# ---- lem:Sigma_separe's ETT-layer forms (ETT.tex:2062–2069; T-lad-record-cauchy-separation,
# 2026-11-23). Causal/CauchySeparation.lean (T-abs-hoist-dual-cover, a295191) holds the model-free
# steps of the « In particular » (J±(Σ) closed, J⁺(Σ) ∩ J⁻(Σ) = Σ, J⁺(Σ) a neighbourhood of its
# points outside Σ), moved verbatim from Causal.SingularCauchy, ETT layer (it imports
# Causal.CurvesExtendSecondCountable, Causal.CauchyDual, Causal.ChronalNeighbourBridge; no model).
# Read from the source, with no build; each signature is quoted in its entry's comment. Step (1), the
# cover, is the entry at curves_extend above. Not entries, named here: step (3),
# Causal.Causality.IsCauchySurface.isOpen_Jplus_diff_of_Iminus_nonempty ([T2Space M]
# [SecondCountableTopology M], Cauchy S, IsCausal, CausallyArcConnected, S chronological at its
# points, a chronological past at every point of J⁺(S) ∖ S ⊢ J⁺(S) ∖ S open) and its pointwise form
# IsCauchySurface.exists_isOpen_of_Iminus_nonempty, through which the regular case below goes; and
# the connectedness step Causal.Causality.CausalCurveIn.mem_image_of_between (T2, causal). The
# singular case, at BTZ points too, is Causal.Causality.SingularFlatAxioms.sigma_separe_of_isCausal
# (Causal.SingularCauchy, model layer: under SingularFlatAxioms, causal only), through the assembly
# below. The equalities J±(Σ) = ψ(Σ × ℝ±) need the splitting ψ of theo:geroch_sing, named: the last
# entry of this block.

# Step (2) (Causal/CauchySeparation.lean:112): (hc : C.IsCausal) (hS : C.IsAcausal S) ⊢
# C.Jplus ⊤ S ∩ C.Jminus ⊤ S = S. No separation, no instance binder. Cited for J⁺(Σ) ∩ J⁻(Σ) = Σ in
# place of its model-layer twin Causal.Causality.Jplus_inter_Jminus_eq (Causal/CBG/Ppcm.lean:184,
# which imports a model; kb/0256), as the module's SCOPE says. A Cauchy surface is acausal under
# causally_arc_connected (the entry at causally_arc_connected above), whence the clause at
# is_causal ∧ causally_arc_connected in the two entries after this one.
[[consequence]]
at = "is_causal"
statement = "an acausal set S is J⁺(S) ∩ J⁻(S)"
witness = "Causal.Causality.IsAcausal.Jplus_inter_Jminus"
under = "S acausal (Causal.Causality.IsAcausal); nothing else"
status = "checked"

# Step (5), the assembly (Causal/CauchySeparation.lean:235): [T1Space M] [SecondCountableTopology M]
# (hS : C.IsCauchySurface S) (hc : C.IsCausal) (hac : C.CausallyArcConnected)
# (hP : IsOpen (C.Jplus ⊤ S \ S)) (hM : IsOpen (C.Jminus ⊤ S \ S)) ⊢ J±(S) closed, J⁺(S) ∩ J⁻(S) = S,
# J±(S) ∈ 𝓝 y for y ∈ J±(S) ∖ S, ∀ x, x ∈ J⁺(S) ∪ J⁻(S), J±(S) ∖ S open, S closed. The
# causal-topological argument with its localisation input in `under`: the complement of J±(S) is
# J∓(S) ∖ S, by the cover and step (2). The regular case below and the singular one
# (SingularFlatAxioms.sigma_separe_of_isCausal, the block's comment) are this, with the openness
# proved from the model.
[[consequence]]
at = ["is_causal", "causally_arc_connected"]
statement = "lem:Sigma_separe's « In particular », from the openness of J±(Σ) ∖ Σ: for a Cauchy surface Σ with J⁺(Σ) ∖ Σ and J⁻(Σ) ∖ Σ open, J±(Σ) are closed, J⁺(Σ) ∩ J⁻(Σ) = Σ, each J±(Σ) is a neighbourhood of its points outside Σ, M = J⁺(Σ) ∪ J⁻(Σ) and Σ is closed"
witness = "Causal.Causality.IsCauchySurface.sigma_separe_of_isOpen"
under = "Σ a Cauchy surface of M; J⁺(Σ) ∖ Σ and J⁻(Σ) ∖ Σ open (no node)"
standing = ["T1", "second_countable"]
status = "checked"

# The regular case (Causal/CauchySeparation.lean:282): [T2Space M] [SecondCountableTopology M]
# (hS : C.IsCauchySurface S) (hc : C.IsCausal) (hac : C.CausallyArcConnected)
# (hJ : C.NoPastEndpoint) (hI : C.NonemptyChronalCones) ⊢ the nine conclusions of the assembly. The
# proof derives ¬ x ≪ x from hJ (Causal.Causality.Jplus_not_mem_nhds) and the openness of J±(S) ∖ S
# from step (3), for C and for C.dual. How NonemptyChronalCones is recorded: as a hypothesis in
# `under`, the witness's own, and not by a node in `at`. It is no node (the comment above
# has_chronal_neighbour), and under causally_arc_connected, which `at` has, it is chronal_neighbours
# with no separation (Causal.Causality.CausallyArcConnected.chronalNeighbours_iff, whose right side is
# NonemptyChronalCones' body; the two directions by name,
# Causal.Causality.CausallyArcConnected.chronalNeighbours_of_nonemptyChronalCones and
# Causal.Causality.ChronalNeighbours.nonemptyChronalCones, the latter with no hypothesis). So the
# entry holds at is_causal ∧ causally_arc_connected ∧ chronal_neighbours with no past endpoint alone
# in words. It is not has_chronal_neighbour, which it implies
# (Causal.Causality.NonemptyChronalCones.hasChronalNeighbourEverywhere) and which the closed
# half-line has without it (Causal.closedHalfLine_separates_chronalNeighbours, the [[fails]]
# has_chronal_neighbour → chronal_neighbours); whether the regular case holds with has_chronal_neighbour
# in its place is not examined. NoPastEndpoint is no node either
# (the header's "One-sided notions"). Both fail at a BTZ point (I⁻ = ∅, rem:btz_pas_tarentin), where
# the singular form takes over. The hypotheses are met on the timelike line with Σ = {0}
# (Causal.timelikeLine_sigma_separe_of_nonemptyChronalCones, kb/0011).
[[consequence]]
at = ["is_causal", "causally_arc_connected"]
statement = "lem:Sigma_separe's « In particular », regular case: for every Cauchy surface Σ, J±(Σ) are closed, J⁺(Σ) ∩ J⁻(Σ) = Σ, each J±(Σ) is a neighbourhood of its points outside Σ, M = J⁺(Σ) ∪ J⁻(Σ), J±(Σ) ∖ Σ are open and Σ is closed"
witness = "Causal.Causality.IsCauchySurface.sigma_separe_of_nonemptyChronalCones"
under = "Σ a Cauchy surface of M; no past endpoint, J⁻(x) ≠ {x} for every x (Causal.Causality.NoPastEndpoint, no node); non-empty chronological cones, I⁺(x) and I⁻(x) non-empty for every x (Causal.Causality.NonemptyChronalCones, no node), which under causally_arc_connected is chronal_neighbours (ladder node; Causal.Causality.CausallyArcConnected.chronalNeighbours_iff)"
standing = ["T2", "second_countable"]
status = "checked"

# lem:Sigma_separe with the splitting named (Causal/CExtConnexeSecondCountable.lean:358):
# [T1Space M] [SecondCountableTopology M] (hcaus : C.IsCausal) (hC : C.CausallyArcConnected)
# (hS : C.IsCauchySurface S) {ψ : S × ℝ ≃ₜ M} (hψ : IsCauchySplitting C S ψ) ⊢ J⁺(S) = ψ(S × [0, ∞)),
# J⁻(S) = ψ(S × (−∞, 0]), J±(S) closed, J⁺(S) ∩ J⁻(S) = S, J⁺(S) ∈ 𝓝 y for y ∈ J⁺(S) ∖ S. It is
# Causal.Causality.sigma_separe (Causal/CauchyDiamond.lean:129: S acausal in place of S Cauchy)
# with the acausality from causally_arc_connected (IsCauchySurface.isAcausal_of_t1_secondCountable).
# Beside the regular case, not below it: it asks ψ, and asks neither T2 nor the two hypotheses in
# words of the regular case; it gives the two equalities, the lemma's main clause, and not the
# cover nor J⁻(Σ)'s neighbourhood clause. ψ stays a named hypothesis; the library builds one from a
# causal flow along an acausal Cauchy surface Σ once J±(Σ) are closed
# (Causal.Causality.IsCausalFlow.isCauchySplitting, Causal/Splitting.lean), which the regular case
# gives. No global hyperbolicity is used.
[[consequence]]
at = ["is_causal", "causally_arc_connected"]
statement = "lem:Sigma_separe with a named splitting: for a Cauchy surface Σ and a Cauchy splitting ψ : Σ × ℝ ≃ M, J⁺(Σ) = ψ(Σ × ℝ₊) and J⁻(Σ) = ψ(Σ × ℝ₋), so J±(Σ) are closed, J⁺(Σ) ∩ J⁻(Σ) = Σ and J⁺(Σ) is a neighbourhood of its points outside Σ"
witness = "Causal.Causality.sigma_separe_of_t1_secondCountable"
under = "Σ a Cauchy surface of M; ψ : Σ × ℝ ≃ₜ M a Cauchy splitting (Causal.Causality.IsCauchySplitting: ψ(x, 0) = x and s ≤ t gives ψ(x, s) ≤ ψ(x, t)), the homeomorphism of theo:geroch_sing carried as a named hypothesis (kb/0012)"
standing = ["T1", "second_countable"]
status = "checked"

# ---- consequences at has_chronal_neighbour, and the boundary form of Lemma 2.17
# (T-lad-has-chronal-neighbour, 2026-11-23; DEC-159, OQ-51). Sbierski 1507.00601 Lemma 2.17 and
# Grant–Kunzinger–Sämann 1804.10423 Lemma 3.8 in ETT: Causal/LocateExtension.lean
# (T-abs-locate-extension) and Causal/ChronalNeighbourBridge.lean (T-abs-chronal-neighbour-bridge),
# ETT layer, no model. Read from
# the sources, with no build (a closer held lean-causal); each signature is quoted in its comment, and
# each name was resolved by tools/ladder.py's index. The curve is future or past
# (C.ChronalCurveOn ⊤ γ 0 1 ∨ C.dual.ChronalCurveOn ⊤ γ 0 1, the time reversal standing for
# Sbierski's "otherwise reverse the time orientation"); its endpoint lies on ∂O. The connectedness of
# M is the instance [PreconnectedSpace M], beyond the ambient, whence standing ["preconnected"].
# Without the chronal neighbour at the boundary the lemma is false (Causal.not_exists_leaving_bare:
# the isolated line, causally arc-connected, causally open and plain, and (0, ∞), whose boundary
# point 0 has none).

# The every-point form: the node. [PreconnectedSpace M] (hC : C.CausallyArcConnected)
# (hE : C.HasChronalNeighbourEverywhere) (hO : IsOpen O) (hne : O.Nonempty) (hne' : O ≠ univ) ⊢
# ∃ γ : ℝ → M, (C.ChronalCurveOn ⊤ γ 0 1 ∨ C.dual.ChronalCurveOn ⊤ γ 0 1) ∧
# (∀ t ∈ Ico 0 1, γ t ∈ O) ∧ γ 1 ∉ O ∧ γ 1 ∈ frontier O. With chronal_neighbours in place of the node
# it is Causal.Causality.exists_leaving_of_chronalNeighbours, a corollary through the edge (not
# recorded). Sharp in the node: the lightlike line is causally arc-connected and connected, and no
# chronal curve leaves any set (Causal.lightlikeLine_futureBoundary, lightlikeLine_pastBoundary); the
# closed half-line has the node without chronal neighbours, and a chronal curve leaves (0, ∞) through
# its endpoint, where I⁻ = ∅ (Causal.closedHalfLine_oneSided: the one-sided hypothesis at work).
[[consequence]]
at = ["has_chronal_neighbour", "causally_arc_connected"]
statement = "Sbierski Lemma 2.17 / GKS Lemma 3.8, every-point form: for every non-empty open O ≠ M, a chronal curve γ of M, future or past, lies in O on [0, 1) and ends on ∂O (∂⁺O ∪ ∂⁻O ≠ ∅)"
witness = "Causal.Causality.exists_leaving_of_hasChronalNeighbourEverywhere"
under = "O open, non-empty, O ≠ M; M connected (standing)"
standing = ["preconnected"]
status = "checked"

# The boundary form, Sbierski's statement for an open embedding: the localisation hypothesis at the
# frontier points of ι(N) only, an edge hypothesis (DEC-159; the comment above has_chronal_neighbour).
# {N : Type v} [TopologicalSpace N] [Nonempty N] [PreconnectedSpace M] {ι : N → M}
# (hι : IsOpenEmbedding ι) (hproper : range ι ≠ univ) (hC : C.CausallyArcConnected)
# (hchr : ∀ p ∈ frontier (range ι), C.HasChronalNeighbour p) ⊢ ∃ D : Causality M, (D = C ∨
# D = C.dual) ∧ ∃ γ : ℝ → M, D.ChronalCurveOn ⊤ γ 0 1 ∧ (∀ t ∈ Ico 0 1, γ t ∈ range ι) ∧
# γ 1 ∉ range ι ∧ γ 1 ∈ frontier (range ι) ∧ ∀ s ∈ Ico 0 1, D.ChronalCurveOn ⟨range ι, _⟩ γ 0 s.
# Only ι(N) open is used of ι (not the Cᵏ isometry); the node has_chronal_neighbour gives hchr at
# every frontier point (Causal.Causality.exists_leaving_of_isOpenEmbedding_of_chronalNeighbours is
# the corollary with chronal_neighbours). Its layer 3 is per model (the property's comment): a C⁰
# Lorentzian manifold has a chronal neighbour at every point, both sides; an E_{≥0}-manifold on the
# future side. Of the open set, a weaker hypothesis suffices locally: a causally arc-connected
# neighbourhood of each frontier point in which it has a chronological future or past, nothing asked
# of M away from ∂O (Causal.Causality.exists_leaving_of_local).
[[consequence]]
at = "causally_arc_connected"
statement = "Sbierski 1507.00601 Lemma 2.17 in ETT, boundary form: for an open embedding ι : N → M of a non-empty space onto a proper subset, a chronal curve γ of C or of C.dual lies in ι(N) on [0, 1), ends on ∂ι(N), and is a chronal curve of the spacetime ι(N) on every [0, s], s < 1"
witness = "Causal.Causality.exists_leaving_of_isOpenEmbedding"
under = "the localisation hypothesis at the frontier points of ι(N) only, an edge hypothesis and no node (DEC-159): every p ∈ ∂ι(N) has a chronal neighbour, Causal.Causality.HasChronalNeighbour p (I⁺(p) or I⁻(p) non-empty in M), which has_chronal_neighbour (ladder node) gives at every point; ι an open embedding (IsOpenEmbedding ι), N non-empty, range ι ≠ M; M connected (standing)"
standing = ["preconnected"]
status = "checked"

# The sharp form: the boundary hypothesis at ONE frontier point is necessary and sufficient. (hC :
# C.CausallyArcConnected) (hO : IsOpen O) ⊢ (C.futureBoundary O ∪ C.pastBoundary O).Nonempty ↔
# ∃ p ∈ frontier O, C.HasChronalNeighbour p. No connectedness, no separation. The endpoint of a
# leaving curve has a chronal neighbour, its start
# (Causal.Causality.hasChronalNeighbour_of_mem_boundary).
[[consequence]]
at = "causally_arc_connected"
statement = "for every open O, a chronal curve of M, future or past, leaves O (∂⁺O ∪ ∂⁻O ≠ ∅) iff some frontier point of O has a chronal neighbour"
witness = "Causal.Causality.futureBoundary_union_pastBoundary_nonempty_iff"
under = "O open; the chronal neighbour at one frontier point, Causal.Causality.HasChronalNeighbour p, the edge hypothesis of the boundary form (no node)"
status = "checked"

# Density. (hC : C.CausallyArcConnected) (hO : IsOpen O) (hchr : ∀ p ∈ frontier O,
# C.HasChronalNeighbour p) ⊢ frontier O ⊆ closure (C.futureBoundary O ∪ C.pastBoundary O).
[[consequence]]
at = "causally_arc_connected"
statement = "for every open O, if every frontier point of O has a chronal neighbour, the endpoints of leaving chronal curves, ∂⁺O ∪ ∂⁻O, are dense in ∂O"
witness = "Causal.Causality.frontier_subset_closure_boundary"
under = "O open; the edge hypothesis of the boundary form at every frontier point of O (Causal.Causality.HasChronalNeighbour p for p ∈ ∂O), which has_chronal_neighbour (ladder node) gives"
status = "checked"

# The ladder form, with no localisation hypothesis, for an open set that is not dense:
# [PreconnectedSpace M] (hC : C.CausallyArcConnected) (hT : C.Tarentin) (hP : C.CausallyPlain)
# (hO : IsOpen O) (hne : O.Nonempty) (hdense : closure O ≠ univ) ⊢
# (C.futureBoundary O ∪ C.pastBoundary O).Nonempty. Neither tarentin nor plainness can be dropped
# (Causal.tarentin_and_plain_needed: the lightlike line, tarentin and not plain; the isolated line,
# plain and not tarentin; no curve leaves (0, ∞)). The dense case (O = M ∖ {p}) is open in the
# library (OQ-51; Causal/LocateExtension.lean SCOPE): by the sharp form above, it asks whether
# tarentin, plainness and causal arc-connectedness give a chronal neighbour to some point of ∂O.
[[consequence]]
at = ["tarentin", "causally_plain", "causally_arc_connected"]
statement = "locating an extension with ladder nodes only: a chronal curve of M, future or past, leaves every non-empty open O whose closure is not M"
witness = "Causal.Causality.futureBoundary_union_pastBoundary_nonempty_of_tarentin"
under = "O open, non-empty, closure O ≠ M (not dense); M connected (standing)"
standing = ["preconnected"]
status = "checked"

# The characterisations of the node's point predicate. (hC : C.CausallyArcConnected) ⊢
# C.HasChronalNeighbour p ↔ p ∈ C.Zplus ∪ C.Zminus, no separation
# (Causal/LocateExtension.lean; through CausallyArcConnected.mem_Zplus_iff, mem_Zminus_iff).
[[consequence]]
at = "causally_arc_connected"
statement = "a point p has a chronal neighbour iff it is strongly tarentin in the future or in the past (p ∈ Z⁺(M) ∪ Z⁻(M)); so has_chronal_neighbour is Z⁺ ∪ Z⁻ = M"
witness = "Causal.Causality.CausallyArcConnected.hasChronalNeighbour_iff"
status = "checked"

# [T1Space M] (h : C.AbsolutelyMinimal) ⊢ C.HasChronalNeighbour p ↔ p ∈ C.Zplus ∪ C.Zminus
# (Causal/ChronalNeighbourBridge.lean; through AbsolutelyMinimal.mem_Zplus_iff, mem_Zminus_iff, the
# consequences at absolutely_minimal above). Under DEC-167 (every ETT causality absolutely minimal)
# it holds on every ETT spacetime.
[[consequence]]
at = "absolutely_minimal"
statement = "a point p has a chronal neighbour iff it is strongly tarentin in the future or in the past (p ∈ Z⁺(M) ∪ Z⁻(M)); so has_chronal_neighbour is Z⁺ ∪ Z⁻ = M"
witness = "Causal.Causality.AbsolutelyMinimal.hasChronalNeighbour_iff"
standing = ["T1"]
status = "checked"

# Time reversal: C.dual.HasChronalNeighbourEverywhere ↔ C.HasChronalNeighbourEverywhere (the point
# predicate's two sides swap, Causal.Causality.dual_hasChronalNeighbour). The node's `dual` lemma
# for T-lad-dual-keys.
[[consequence]]
at = "has_chronal_neighbour"
