# rem:deux_pushup's finding (Causal/DeuxPushup.lean, ETT layer; T-lad-plain-separations, 2026-11-21):
# on a T1 space absolute minimality makes ≪_U interpolate (Causal.Causality.
# interpolatesOn_of_absolutelyMinimalOn: cover U by the complements of the two end points), and
# plainness with interpolation is push-up (pushUpOn_of_causallyPlainOn_of_interpolatesOn). Read
# 2026-11-21 (`#check`): {M} [TopologicalSpace M] {C : Causality M} [T1Space M], C.AbsolutelyMinimal →
# C.CausallyPlain → C.PushUp, no other premise; T1 in `standing` (in `under` until
# T-lad-classify-core, which made emit-lean skip it), as for strongly_causal ⇒ is_causal. Not a
# theorem of the paper: the remark prints "neither implies the
# other", and this is why its witness of plainness without push-up (deuxPushup, counterexamples below)
# is not absolutely minimal. absolutely_minimal cannot be dropped (deuxPushup: causally_plain ⇏
# push_up); whether causally_plain can is the unknown pair absolutely_minimal → push_up (no Lean model
# is absolutely minimal without push-up). With causally_arc_connected ⇒ absolutely_minimal it gives
# causally_arc_connected ∧ causally_plain ⇒ push_up (not recorded: a composite of two edges, and the
# matrix classifies single premises only), beside lem:pushup_local's form with locally_push_up above;
# so a causally arc-connected T1 spacetime without push-up is not causally plain ([[open]] below).
[[implies]]
from = ["absolutely_minimal", "causally_plain"]
to = "push_up"
witness = "Causal.Causality.pushUp_of_causallyPlain_of_absolutelyMinimal"
standing = ["T1"]
status = "checked"

