# ------------------------------------------------------------------ open pairs

[[open]]
from = "time_function"
to = "is_causal"
note = "True in one line (x ≤ y ≤ x, x ≠ y give T x < T y < T x), not named in Lean: wants Causality.HasTimeFunction.isCausal"

[[open]]
from = "globally_hyperbolic"
to = "time_function"
note = "Proved with tarentin (Levin, the edge above; Hausdorff, second countable). Without tarentin open: Levin's proof takes local compactness, σ-compactness and the closedness of ≤ (prop:GH_Jferme) from it, and no Lean model is globally hyperbolic, not tarentin and without a time function"

[[open]]
from = "globally_hyperbolic"
to = "curves_extend"
note = "Proved with tarentin through time_function (Causal.Causality.curvesExtend_of_secondCountable). Without tarentin open, as for time_function; the long ray (globally hyperbolic, tarentin, not second countable, no inextensible curve) is a conjectured counterexample outside ETT's spacetimes, not formalised (Causal/CurvesExtend.lean SCOPE)"

[[open]]
from = "curves_extend"
to = "time_function"
note = "Wants a model with curves extending and a closed causal loop (then no time function): the flat cylinder ℤe₀\\𝐌ⁿ is not causal (Causal.Flat.FlatQuotient.not_isCausal_timeGroup) and every flat spacetime has CurvesExtend (Causal.CBG.flat_curvesExtend, Hausdorff and second countable), but its second countability and the combination are not in Lean, nor time_function ⇒ is_causal"

[[open]]
from = "germ_extension"
to = "cauchy_slice"
note = "Geometry sort, Level B: A3 and A4 are independent fields of Causal.CBG.Geometry; every local model has both off the BTZ locus, and the residuals (GermExtFutureBTZ, GermExtPastBTZ against SliceFutureBTZ) are owed separately by gx for E₀; no local model with one and not the other is in Lean"

[[open]]
from = "cauchy_slice"
to = "germ_extension"
note = "Geometry sort, Level B: as for the converse pair; Sbierski's own route proves A3 (Lemma 3.8) from Prop 3.7 (ii), not from the slice (T-abs-sbierski-prop-3-7)"

[[open]]
from = "rigid"
to = "germ_extension"
note = "Geometry sort, Level B: every local model is rigid (Causal.CBG.eqOn_of_liftPropOn), so this asks whether every local model has A3, i.e. its BTZ residuals GermExtFutureBTZ and GermExtPastBTZ, owed by gx for E₀; no local model without A3 is in Lean"

[[open]]
from = "rigid"
to = "cauchy_slice"
note = "Geometry sort, Level B: every local model is rigid (Causal.CBG.eqOn_of_liftPropOn) and has SlicePast (Causal.CBG.LocalModel.slicePast), so this asks whether every local model has the BTZ residual SliceFutureBTZ, owed by gx for E₀"

[[open]]
from = "curve_nested"
to = "le_nested"
note = "Pair sort, at M (so on every open). False in general, argued, not in Lean: the pointed line (Causal.pointedLine, 0 ≤ y for y > 0) and the spacelike line (Causal.spacelikeLine, ≤ the diagonal) have only constant causal curves, so the first is curve-nested in the second, while 0 ≤ 1 holds in the first only. True when C is causally arc-connected (x ≤_U y of C lies on a C-causal curve of U, which is C'-causal by curve nesting on U, so x ≤_U y for C'), not in Lean either"
