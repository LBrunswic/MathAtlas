# T-lad-nested-inextensible (2026-11-22), OQ-41 (b), kb/0045. The line cut at 1 (Causal.cutLine 1,
# Causal/NestedCausalities.lean:213: the timelike line in which nothing lies causally before 1 but 1
# itself) is ≤-nested in the timelike line (Causal.cutLine_leNested), hence curve-nested in it on every
# open, and not inextensibly nested in it at M: the identity over [1, ∞) is inextensible for the cut
# line (Causal.cutLine_inextensible_Ici: it starts at 1, whose causal past is {1}) and misses the
# timelike line's Cauchy surface {0} (Causal.timelikeLine_isCauchySurface_zero), so it is not
# inextensible there (Causal.cutLine_not_inextensibleNestedOn_top). The witness, direct since
# T-lad-record-direct-witnesses (2026-11-27; T-abs-cutline-inextensible-direct), read from the source
# (Causal/CutLineInextensible.lean:96), with no build: Causal.cutLine_separates_inextensibleNested :
# (cutLine 1).LeNested timelikeLine ∧ ¬ (cutLine 1).InextensibleNestedOn timelikeLine ⊤ ∧
# (cutLine 1).IsCausal ∧ (cutLine 1).AbsolutelyMinimal ∧ (∀ W, (cutLine 1).AbsolutelyMinimalOn W) ∧
# timelikeLine.AbsolutelyMinimal ∧ ∀ W, timelikeLine.AbsolutelyMinimalOn W (a closed statement, no
# instance argument): the `from` and the negation of the `to` at W = M as conjuncts, with the timelike
# line's gluing and the cut line's, in both forms, so that it stands under DEC-167 whichever form OQ-95
# rules. Until then the witness was Causal.not_isCauchySurface_of_nested_bare : ¬ ∀ (C C' : Causality
# ℝ) S, C.LeNested C' → C'.IsCauchySurface S → C.IsCauchySurface S, which states the refutation through
# the Cauchy transfer (the consequence Causal.Causality.IsCauchySurfaceOn.of_nested, at
# inextensible_nested below, gives ¬ ∀ C C' : Causality ℝ, C.LeNested C' → C.InextensibleNestedOn C' ⊤
# in one line, checked 2026-11-22 with `lake env lean` on a file outside the tree: fun h =>
# not_isCauchySurface_of_nested_bare fun C C' _ hle hS => IsCauchySurfaceOn.of_nested (h C C' hle) hS);
# it and its companion Causal.not_dependenceDomain_nested_bare (the same through
# Causal.Causality.dependenceDomainOn_subset_of_nested) stay cited as what they state: the Cauchy
# transfer and nested domains of dependence, consequences at inextensible_nested, fail at le_nested.
# On ℝ: Hausdorff, second countable, no `space`. Through the closure
# (le_nested ⇒ curve_nested) it also refutes curve_nested → inextensible_nested. The narrower cut line
# is causal and not globally hyperbolic (Causal.cutLine_isCausal, cutLine_not_globallyHyperbolic) and
# has a causal endpoint at 1 (Causal.cutLine_inextensibleNested_missing states both, with the timelike
# line globally hyperbolic with Cauchy surface {0}); the wider timelike line has every hypothesis of
# the consequence at curve_nested that gives the nesting: those must be asked of the narrower
# causality.
[[fails]]
from = "le_nested"
to = "inextensible_nested"
witness = "Causal.cutLine_separates_inextensibleNested"
status = "checked"

