# Causal.not_isCauchySurface_of_nested_bare ({0} is a Cauchy surface of the timelike line, not of the
# line cut at 1, whose identity over [1, ∞) is inextensible: Causal.cutLine_inextensible_Ici).
[[consequence]]
at = "le_nested"
statement = "a Cauchy surface S of a globally hyperbolic wider C' is a Cauchy surface of the narrower C, which is globally hyperbolic, when C's diamonds are closed"
witness = "Causal.Causality.globallyHyperbolic_isCauchySurface_of_nested"
under = "globally_hyperbolic of C'; tarentin and causally_arc_connected of C (ladder nodes); every J_C(p, q) closed; J⁻(x) ≠ {x} and J⁺(x) ≠ {x} for C (Causal.Causality.NoCausalEndpoint, written out); M Hausdorff"
status = "checked"

# What makes the reading "curve_nested at M = on every open" (header).
[[consequence]]
at = "curve_nested"
statement = "curve nesting on an open W gives curve nesting on every open V ⊆ W"
witness = "Causal.Causality.CurveNestedOn.mono"
status = "checked"

# T-abs-nested-converse/1-converse (Causal/NestedConverse.lean): the converse of le_nested ⇒
# curve_nested, under a causality-sort property of the narrower C, hence a consequence (an [[implies]]
# with it in `under` would be chained as unconditional, against the [[fails]] curve_nested ⇏
# le_nested). Read 2026-11-21: (h : CurveNestedOn C C' ⊤) (hC : C.CausallyArcConnected) :
# LeNested C C', no instance. Sharp on both sides: not with C' causally arc-connected instead
# (Causal.not_leNested_of_curveNested_wider_bare), not with C only absolutely minimal
# (Causal.not_leNested_of_curveNested_absolutelyMinimal_bare, the rational line). Open form:
# Causal.Causality.curveNestedOn_iff_of_causallyArcConnectedOn (C causally arc-connected on W: curve
# nesting on W is ≤-nesting on the opens of W); at M, Causal.Causality.leNested_iff_curveNestedOn_top.
[[consequence]]
at = "curve_nested"
statement = "curve nesting at M gives ≤-nesting when the narrower C is causally arc-connected (the converse of le_nested ⇒ curve_nested)"
witness = "Causal.Causality.CurveNestedOn.leNested_of_causallyArcConnected"
under = "causally_arc_connected of C (ladder node); nothing of C'"
status = "checked"

# ERS Remark 4.74 (a narrower wider causality C_g ≤ C_b ≤ C_m), T-abs-nested-converse/3-trans. Also
# Causal.Causality.CurveNestedOn.refl and the mixed forms LeNested.trans_curveNestedOn,
# CurveNestedOn.trans_leNested; all on one open W.
[[consequence]]
at = "curve_nested"
statement = "curve nesting on an open W is transitive: C curve-nested in C' and C' in C'' on W give C curve-nested in C'' on W"
witness = "Causal.Causality.CurveNestedOn.trans"
status = "checked"

[[consequence]]
at = "curve_nested"
statement = "curve nesting is invariant under time reversal: C.dual is curve-nested in C'.dual on W iff C is curve-nested in C' on W"
witness = "Causal.Causality.dual_curveNestedOn_iff"
status = "checked"

# The inextensible nesting on M, InextensibleNestedOn C C' ⊤, which ERS Lemma 4.70 and the transfer of
# Cauchy surfaces need; whether it or no_causal_endpoint becomes a node is OQ-41 (b)
# (T-lad-nested-inextensible). Corollary, with NoCausalEndpoint named (Causal.LadderLocal), of
# Causal.Causality.GloballyHyperbolic.inextensibleNestedOn_top. ≤-nesting alone does not give it: the
# line cut at 1 is ≤-nested in the timelike line and not globally hyperbolic, and its identity over
# [1, ∞) is inextensible (Causal.cutLine_inextensible_Ici) though it extends in the timelike line;
# whence Causal.not_isCauchySurface_of_nested_bare.
[[consequence]]
at = "curve_nested"
statement = "every inextensible causal curve of M for C is an inextensible causal curve of M for C' (InextensibleNestedOn C C' ⊤)"
witness = "Causal.Causality.GloballyHyperbolic.inextensibleNestedOn_top_of_noCausalEndpoint"
under = "curve nesting at M; globally_hyperbolic, tarentin and causally_arc_connected of C (ladder nodes); C has no causal endpoint (Causal.Causality.NoCausalEndpoint: J⁻(x) ≠ {x} and J⁺(x) ≠ {x}); M Hausdorff"
status = "checked"

# T-abs-nested-causalities/2-dod. Bare form refuted by Causal.not_isCauchySurface_of_nested_bare (as
# above). The domain-of-dependence form, D_{C'}(S) ⊆ D_C(S), is proved under the same hypotheses in
# the same module; not cited, as its name follows the hoist of dependenceDomain (T-abs-hoist-model-free).
[[consequence]]
at = "curve_nested"
statement = "every Cauchy surface of the wider C' is a Cauchy surface of the narrower C"
witness = "Causal.Causality.GloballyHyperbolic.isCauchySurface_of_nested"
under = "curve nesting at M; globally_hyperbolic, tarentin and causally_arc_connected of C (ladder nodes); J⁻(x) ≠ {x} and J⁺(x) ≠ {x} for C (Causal.Causality.NoCausalEndpoint, written out); M Hausdorff"
status = "checked"

# ERS Lemma 4.72 (ghd_02_19.tex:976), causal-topological skeleton; C is C₂ of g(u₂, du₂), C' is
# Minkowski's C_m. As printed ("connected", S non-empty): Causal.Causality.ers_lemma_4_72_isConnected.
# OQ-41 (c): S is taken C'-acausal where ERS print m-achronal. The hypotheses are jointly satisfiable
# (Causal.timelikeLine_ers_lemma_4_72).
[[consequence]]
at = "curve_nested"
statement = "ERS Lemma 4.72: for opens U₁, U₂ containing a preconnected S that is a Cauchy surface of U₁ for C' and of U₂ for C, U₁ ∩ U₂ is preconnected"
witness = "Causal.Causality.ers_lemma_4_72"
under = "curve nesting on W = U₂; is_causal and curves_extend of C' (ladder nodes); S acausal for C'; through every point of U₁ ∩ U₂ an inextensible causal curve of U₂ for C; M Hausdorff"
status = "checked"

# ------------------------------------------------------------------ transfers along a nesting
# [[transfer]] (header, T-lad-classify-core 2026-11-21): a causality-sort property passed along a
# pair-sort nesting, C the narrower, C' the wider; `to_narrower` reads "C' has it, hence C".
# Witnesses from Causal/NestedTransfer.lean (T-abs-nested-transfer, layer 1, no instance on M; each
# read 2026-11-21: {C C' : Causality M} (h : LeNested C C') (h' : C'.P) : C.P, resp.
# (hC : C.Tarentin) : C'.Tarentin). Each LeNested.* form is the corollary of a principal form that
# asks ≤ nested at M only (∀ x y, C.le ⊤ x y → C'.le ⊤ x y): stronglyCausal_of_le_top,
# stronglyCausalOpen_of_le_top, hasTimeFunction_of_le_top, isCausal_of_le_top (Causal.NestedCausalities,
# the consequence at le_nested until T-lad-classify-core), Tarentin.wider_of_le_top. The transfers
# read ≤ only (causally convex sets, strict increase along ≤_M); tarentin reads the interiors of the
# diamonds, which grow with ≤, so it passes to the wider causality and not to the narrower.

[[transfer]]
pair = "le_nested"
property = "is_causal"
direction = "to_narrower"
witness = "Causal.Causality.LeNested.isCausal"
status = "checked"

[[transfer]]
pair = "le_nested"
property = "strongly_causal"
direction = "to_narrower"
witness = "Causal.Causality.LeNested.stronglyCausal"
status = "checked"

[[transfer]]
pair = "le_nested"
property = "strongly_causal_open"
direction = "to_narrower"
witness = "Causal.Causality.LeNested.stronglyCausalOpen"
status = "checked"

[[transfer]]
pair = "le_nested"
property = "time_function"
direction = "to_narrower"
witness = "Causal.Causality.LeNested.hasTimeFunction"
status = "checked"

[[transfer]]
pair = "le_nested"
property = "tarentin"
direction = "to_wider"
witness = "Causal.Causality.LeNested.tarentin_wider"
status = "checked"

# Tarentin does not pass to the narrower causality: Causal.leNested_tarentin_counterexample conjoins
# spacelikeLine.LeNested timelikeLine; of the wider timelike line Tarentin, GloballyHyperbolic,
# StronglyCausalOpen, PushUp, CausallyOpen, CausallyPlain, ChronalNeighbours, CausallyArcConnected,
# HasTimeFunction; of the narrower spacelike line GloballyHyperbolic, StronglyCausalOpen, PushUp,
# CausallyOpen, AbsolutelyMinimal, HasTimeFunction; and ¬ spacelikeLine.Tarentin. So no combination
# of these properties of either line makes tarentin pass to the narrower causality. Also stated
# without the lists: Causal.not_tarentin_of_leNested_bare.
[[transfer]]
pair = "le_nested"
property = "tarentin"
direction = "to_narrower"
narrower = ["globally_hyperbolic", "strongly_causal_open", "push_up", "causally_open", "absolutely_minimal", "time_function"]
wider = ["globally_hyperbolic", "strongly_causal_open", "push_up", "causally_open", "causally_plain", "chronal_neighbours", "causally_arc_connected", "time_function"]
counterexample = "Causal.leNested_tarentin_counterexample"
status = "checked"

# Global hyperbolicity does not pass bare to the narrower causality (OQ-41 (a), T-abs-nested-causalities):
# Causal.not_globallyHyperbolic_of_nested_bare (¬ ∀ C C' : Causality ℝ, C.LeNested C' →
# C'.GloballyHyperbolic → C.GloballyHyperbolic) at the line cut at 0, Causal.cutLine 0, ≤-nested in
# the timelike line (Causal.cutLine_leNested), causal (Causal.cutLine_isCausal) and not globally
# hyperbolic (its diamond J(-1, 1) = [-1, 1] ∖ {0} is not closed). The wider timelike line's other
# properties are those of the tarentin counterexample above (its conjuncts). It passes exactly when
# C's diamonds are closed: the consequence Causal.Causality.globallyHyperbolic_iff_of_nested at
# le_nested (a condition in words, so not a [[transfer]]).
[[transfer]]
pair = "le_nested"
property = "globally_hyperbolic"
direction = "to_narrower"
narrower = ["is_causal"]
wider = ["tarentin", "strongly_causal_open", "push_up", "causally_open", "causally_plain", "chronal_neighbours", "causally_arc_connected", "time_function"]
counterexample = "Causal.not_globallyHyperbolic_of_nested_bare"
status = "checked"

# ------------------------------------------------------------------ open pairs

# The seven pairs the closure chained through a localisation `under` until T-lad-local-nodes
# (header): each is proved with its local premise (the edges above), and open without it. Four of
# them are refuted since T-lad-classify-core (2026-11-21) by the rational line: push_up and
# absolutely_minimal ⇏ causally_open_future, causally_open. Of the three through
# causally_arc_connected, T-lad-record-minimal (2026-11-21) removed two, in either reading:
# causally_arc_connected ⇏ push_up (the half-chronological line) and ⇏ causally_open (the half-lit
# line). The third, causally_arc_connected → causally_open_future, T-lad-record-dual-vee (2026-11-21)
# removed, in either reading: the half-lit line's time reversal
# (Causal.halfLightLine_dual_separates_causallyOpenFuture). All seven are settled.

[[open]]
from = "globally_hyperbolic"
to = "time_function"
note = "Proved with tarentin (Levin, the edge above; Hausdorff, second countable). Without tarentin open: Levin's proof takes local compactness, σ-compactness and the closedness of ≤ (prop:GH_Jferme) from it; the globally hyperbolic Lean models without tarentin, the spacelike, jump and half-lit lines and the half-lit line's time reversal (Causal.spacelikeLine_separates_tarentin_full, Causal.jumpLine_separates_causallyOpenFuture, Causal.halfLightLine_separates_causallyOpen, Causal.halfLightLine_dual_separates_causallyOpenFuture), have a time function"

[[open]]
from = "globally_hyperbolic"
to = "curves_extend"
note = "Proved with tarentin through time_function (Causal.Causality.curvesExtend_of_secondCountable). Without tarentin open, as for time_function; the long ray (globally hyperbolic, tarentin, not second countable, no inextensible curve) is a conjectured counterexample outside ETT's spacetimes, not formalised (Causal/CurvesExtend.lean SCOPE)"

[[open]]
from = "germ_extension"
to = "cauchy_slice"
note = "Geometry sort, Level B: A3 and A4 are independent fields of Causal.CBG.Geometry; every local model has both off the BTZ locus, and the residuals (GermExtFutureBTZ, GermExtPastBTZ against SliceFutureBTZ) are owed separately by gx for E₀; no local model with one and not the other is in Lean"

[[open]]
from = "cauchy_slice"
to = "germ_extension"
note = "Geometry sort, Level B: as for the converse pair; Sbierski's own route proves A3 (Lemma 3.8) from Prop 3.7 (ii), not from the slice (T-abs-sbierski-prop-3-7)"

[[open]]
from = "rigid"
to = "germ_extension"
note = "Geometry sort, Level B: every local model is rigid (Causal.CBG.eqOn_of_liftPropOn), so this asks whether every local model has A3, i.e. its BTZ residuals GermExtFutureBTZ and GermExtPastBTZ, owed by gx for E₀; no local model without A3 is in Lean"

[[open]]
from = "rigid"
to = "cauchy_slice"
note = "Geometry sort, Level B: every local model is rigid (Causal.CBG.eqOn_of_liftPropOn) and has SlicePast (Causal.CBG.LocalModel.slicePast), so this asks whether every local model has the BTZ residual SliceFutureBTZ, owed by gx for E₀"

# ---- T-lad-classify-core (2026-11-21): every causality-sort pair the closure and the counterexamples
# above leave unknown, one [[open]] entry each, grouped by the conclusion `to`. A note is one of:
# * "False, argued: M … and …; wants N": a model M, at most two, that would refute the pair, and the
#   Lean names N (proposed; a target's name in parentheses when one is planned) that would make it a
#   [[fails]] entry. The models, with what the Lean states (L) and what is argued (A):
#   - the gated line Causal.gateLine: L causal, globally hyperbolic, curves_extend, not causally
#     arc-connected, not absolutely minimal, locally push-up, causally open in the future, two-sided
#     locally causally open, strongly causal in both forms, without push-up, not causally open in the
#     past (Causal.gateLine_separates_causallyOpen, Causal.gateLine_separates_pushUp; [[fails]]
#     entries since T-lad-record-lines); A a time function and tarentin (T-abs-gateline-witnesses), no
#     chronal neighbours at ⋆, not causally plain (nothing is ≪ ⋆, while ⋆ ∈ Int J⁻({⋆}));
#   - the jump line Causal.jumpLine (≪ empty, ≤_U the diagonal plus 0 ≤ 1 when 0, 1 ∈ U): L push-up,
#     two-sided locally causally open, globally hyperbolic, strongly causal in the open form, a time
#     function; not causally open in the future, not absolutely minimal, not causally arc-connected, no
#     chronal neighbours, not tarentin, not causally plain (Causal.jumpLine_separates_causallyOpenFuture);
#   - the rational line Causal.rationalLine: L every ladder fact it has, absolutely minimal on every
#     open set (Causal.rationalLine_separates, Causal.rationalLine_absolutelyMinimalOn; [[fails]]
#     entries since T-lad-record-minimal): not locally causally open in the future, no chronal
#     neighbours, not tarentin, not causally plain, not causally compact;
#   - the half-lit line Causal.halfLightLine: L absolutely minimal on every open set, causally
#     arc-connected, globally hyperbolic, push-up, strongly causal in both forms, a time function,
#     causally open in the future (locally too) and not in the past, nor locally at 0; not tarentin, no
#     chronal neighbours, not plain (Causal.halfLightLine_separates_causallyOpen; [[fails]] entries
#     since T-lad-record-minimal); its time reversal halfLightLine.dual: L absolutely minimal on every
#     open set, causally arc-connected, globally hyperbolic, push-up, strongly causal in both forms, a
#     time function (−id), not causally open in the future, nor locally (at 0), hence not two-sided;
#     not tarentin, no chronal neighbours, not plain, all conjoined in
#     Causal.halfLightLine_dual_separates_causallyOpenFuture ([[fails]] entries since
#     T-lad-record-dual-vee; Causal.halfLightLine_dual_absolutelyMinimalOn);
#   - the half-chronological line Causal.halfChronoLine: L causally arc-connected, globally hyperbolic,
#     causally open, tarentin, strongly causal, a time function, without local push-up
#     (Causal.halfChronoLine_separates_pushUp; [[fails]] entries since T-lad-record-minimal), not
#     plain, no chronal neighbours (Causal.halfChronoLine_not_causallyPlain,
#     halfChronoLine_not_chronalNeighbours);
#   - the flat time cylinder and the timelike circle (Causal.Flat.timeCylinder_separates,
#     timeCylinder_zero_separates; [[fails]] entries since T-lad-record-minimal): L absolutely minimal,
#     causally arc-connected, push-up, tarentin, chronal neighbours, causally open, causally plain,
#     curves_extend, not causal; the cylinder not causally compact, the circle causally compact;
#   - the isolated line Causal.isolatedLine: L causally arc-connected, causally open, causally plain,
#     not tarentin, no chronal neighbours (Causal.isolatedLine_separates_chronalNeighbours,
#     Causal.tarentin_and_plain_needed);
#   - the globally chronological line Causal.globalLine (≪ only in ℝ itself): L push-up, causally
#     open, causal, tarentin, no chronal neighbours, not absolutely minimal
#     (Causal.globalLine_separates_tarentin; [[fails]] entries since T-lad-record-minimal);
#   - the doubled line Causal.doubledLine: L not causal; A causally compact, push-up, tarentin, causally
#     open, not absolutely minimal (no target: T-abs-doubled-line-compact, which asked them, was dropped
#     on 2026-11-21, settling no pair in either reading); every pair its notes asked is settled since
