# (Causal.not_leNested_of_curveNested_absolutelyMinimal_bare, the rational line in the spacelike
# line, Causal.rationalLine_separates_curveNested).
[[fails]]
from = "curve_nested"
to = "le_nested"
witness = "Causal.pointedLine_separates_curveNested"
status = "checked"

