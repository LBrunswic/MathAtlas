# ---- T-lad-record-separators (2026-11-21): the absolutely minimal separators of T-abs-one-way-membrane,
# T-abs-one-way-membrane-chronal and T-abs-gh-without-tarentin (Causal/OneWayMembrane.lean,
# Causal/OneWayMembraneChronal.lean, Causal/GHWithoutTarentin.lean; ETT layer, no model imported;
# strict since 57f8b4f, cf4703e, 28b4b95). Each space is causally arc-connected, hence absolutely
# minimal on every open set for every cover of it (the gluing reading's form, kb/0074), so every
# separation in this section holds in either reading of defi:causalite (OQ-18). Every witness was
# read by `#check` (lake env lean on a file outside the tree, 2026-11-21) and its statement is quoted;
# the carriers are ℝ × ℝ and two subspaces of it, Hausdorff and second countable, so no `space` is
# written.
#
# One entry per witness, the one whose `to` carries the most. The matrix reads a counterexample
# backwards through conjunctive edges (T-tool-ladder-py-2), so from its one lack it has every other
# negation its witness states on the chain of causal openness and push-up, and, through Levin's edge
# and prop:GH_fortement_causal's, the fork's and the loop fan's ¬ tarentin, ¬ chronal_neighbours
# (simulated 2026-11-21: each entry's lacks, as tools/ladder.py computes them, are conjuncts its
# witness states). Left out, as restating what the tool infers from the entry kept: the membrane's
# to = causally_open, chronal_neighbours; its reversal's to = causally_open_future, causally_open,
# locally_causally_open, chronal_neighbours; the chronal membrane's to = causally_open, push_up,
# locally_push_up, causally_plain; its reversal's to = causally_open_future, causally_open,
# locally_causally_open, push_up, locally_push_up, causally_plain; the loop fan's to =
# strongly_causal_open; the fork's and the loop fan's to = tarentin, chronal_neighbours. Left out, as
# moving no pair in either reading (simulated): the four membranes' to = causally_compact,
# globally_hyperbolic (the half-plane, the rational line and the flat time cylinder refute those
# pairs already) and the one-way membrane's and its reversal's to = causally_plain (the lightlike,
# spacelike, rational, half-lit and half-chronological lines do). Of the six entries, three carry the
# 19 [[open]] pairs the section settles: the chronal membrane's reversal 11 (the 4 from tarentin to
# causal openness, global or local, in the future or two-sided, which the one-way membrane's reversal
# settles as well, and the 7 from chronal_neighbours), the fork 4, the loop fan 4. The other three
# move no pair beyond them, and each is the ladder's only counterexample to a conjunction (simulated):
# the one-way membrane to tarentin ∧ push_up ∧ causally_open_future ⇒ causally_open (OQ-69), its
# reversal to tarentin ∧ push_up ⇒ causally_open_future (Lemma K's chronal neighbours do not weaken to
# tarentin), the chronal membrane to chronal_neighbours ∧ causally_open_future ⇒ causally_open,
# push_up. The pairs moved and their notes: the header's count paragraph.

# The one-way membrane (Causal.oneWayMembrane, Causal/OneWayMembrane.lean, T-abs-one-way-membrane: on
# ℝ^{1+1} in null coordinates (u, v), ≪ empty, x ≤_U y iff a chain of future causal segments inside U
# runs from x to y, none passing from R = {x¹ > 0} into its complement; polygonal curves, the SCOPE's
# disclosed reading of "causal curves", argued equivalent). Causal.oneWayMembrane_separates :
# AbsolutelyMinimal ∧ CausallyArcConnected ∧ Tarentin ∧ CausallyOpenFuture ∧
# LocallyCausallyOpenFuture ∧ PushUp ∧ LocallyPushUp ∧ IsCausal ∧ StronglyCausalOpen ∧ StronglyCausal
# ∧ HasTimeFunction ∧ CurvesExtend ∧ ¬ CausallyOpen ∧ ¬ LocallyCausallyOpen ∧ ¬ CausallyCompact ∧
# ¬ GloballyHyperbolic ∧ ¬ CausallyPlain ∧ ¬ ChronalNeighbours (no instance argument). One entry,
# to = locally_causally_open: lacking it, it lacks causally_open (causally_open ⇒
# locally_causally_open), and chronal_neighbours (push_up ∧ chronal_neighbours ⇒ causally_open, read
# backwards). It moves no pair beyond its time reversal and the chronal membrane's (below), and it
# is the ladder's only counterexample with tarentin, push-up and causal openness in the future
# lacking causal openness: OQ-69 answered yes (Causal.exists_tarentin_absolutelyMinimal_causallyOpenFuture_not_past;
# bare form Causal.not_causallyOpen_of_tarentin_of_causallyOpenFuture_bare), so DEC-8's J± strictly
# strengthens def:causally_open_spacetime_open as printed among absolutely minimal tarentin
# spacetimes too. Past openness fails exactly on the open sets meeting the membrane
