# (Causal.Causality.InextensibleNestedOn.curveNestedOn_of_t1_secondCountable).

[[open]]
from = "inextensible_nested"
to = "le_nested"
note = "False, argued: the pointed line in the spacelike line (Causal.pointedLine, Causal.spacelikeLine). Both have the constant curves of W as their causal curves of W (Causal.pointedLine_causalCurveOn_eq; the spacelike line's ≤_U is equality; a constant curve is causal in either by reflexivity, Causal.Causality.causalCurveOn_of_forall_eq), and no causal curve of either is extensible: a strict extension is a causal curve, hence constant, and takes the old value, so its new point (StrictlyExtends.grows) is not new; so the two have the same inextensible curves of every W and the pair is inextensibly nested on every open, while it is not ≤-nested (Causal.pointedLine_not_leNested_spacelikeLine). Wants a lemma that a causality whose causal curves of W are constant has every causal curve of W inextensible, and Causal.pointedLine_separates_inextensibleNested (∀ W, InextensibleNestedOn pointedLine spacelikeLine W, ¬ LeNested pointedLine spacelikeLine). It refutes this pair only: the pointed line is curve-nested in every causality of ℝ (Causal.pointedLine_curveNestedOn)"

