statement = "causal compactness is transported by a homeomorphism e : M ≃ₜ N carrying ≤_M onto ≤_N, in particular by a causal isomorphism"
witness = "Causal.LeTopIso.causallyCompact_iff"
under = "the homeomorphism e with Causal.LeTopIso C D e"
status = "checked"

# Causal/ChainsOrder.lean: the supremum is found in the compact J(a₀, u) by a directed intersection.
