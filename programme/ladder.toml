[[implies]]
from = ["strongly_causal"]
to = "is_causal"
witness = "Causal.Causality.StronglyCausal.isCausal"
standing = ["T1"]
status = "checked"

# Fixed 2026-11-20 (T-lad-seed-check): the seed had `from = ["strongly_causal"]`; its witness then,
# Causal.Causality.StronglyCausal.stronglyCausalOpen (Causal/GlobalHyperbolicity.lean:226), also
# assumes tarentin and two-sided causal openness, which joined `from` (tarentin found a, b in the
# causally convex neighbourhood with p in the open diamond, which causal openness makes causally
# convex: Causal.Causality.CausallyOpen.causallyConvexIn_openDiamond). Re-pointed by
# T-lad-record-sc-open-edge (2026-11-23), tarentin dropped, to
# Causal.Causality.StronglyCausal.stronglyCausalOpen_of_causallyOpen (Causal/SCOpenWithoutTarentin.lean:187,
# T-abs-sc-open-without-tarentin, 364ec2d): (hO : C.CausallyOpen) (h : C.StronglyCausal), no instance
# argument, so no standing. For V a neighbourhood of p causally convex in M and O := interior V, the
# hull J⁺_M(O) ∩ J⁻_M(O) contains p, lies in V, is causally convex in M and is open by causal openness
# at U = M. The tarentin form is not kept as a second edge: its premises contain this edge's, so it
# classifies no pair (the matrix did not move) and its CausalLadder rule could fire only where this
# one has; its witness stays in Lean (Causal.Causality.GloballyHyperbolic.stronglyCausalOpen uses it).
# The node is causally_open (DEC-163): the proof opens the hull with both halves, at U = M only;
# weaker hypotheses that are no node give the same, J^±_M of every open set open
# (Causal.Causality.StronglyCausal.stronglyCausalOpen_of_isOpen_Jplus_Jminus) or the hull of every
# open set open (Causal.Causality.StronglyCausal.stronglyCausalOpen_of_isOpen_hull). The future half
# alone does not open the hull: on the one-way membrane, causally open in the future, strongly causal
# and not causally open, the hull of the interior of a causally convex neighbourhood of (0, 1) is not
# open (Causal.oneWayMembrane_hull_not_isOpen). The membrane is strongly causal in the open form all
