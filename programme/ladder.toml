# * Neither has a parameter-free form, so neither is a node (the keeper's call, which the target
#   leaves to it). Both are predicates on a causality C and on an open W, a surface S, a region R and
#   a location L, and the restart also on a conclusion Q that names the solutions ("a strictly larger
