# through causally_arc_connected ⇒ absolutely_minimal; kept because the witness states it). Through
# the closure also causally_compact (from globally_hyperbolic) and locally_causally_open_future (from
# locally_causally_open): 28 [[open]] pairs settled. What they carry for the ETT reader:
