wider = ["globally_hyperbolic", "strongly_causal_open", "push_up", "causally_open", "causally_plain", "chronal_neighbours", "causally_arc_connected", "time_function"]
counterexample = "Causal.leNested_tarentin_counterexample"
status = "checked"

# Global hyperbolicity does not pass bare to the narrower causality (OQ-41 (a), T-abs-nested-causalities):
# Causal.not_globallyHyperbolic_of_nested_bare (¬ ∀ C C' : Causality ℝ, C.LeNested C' →
# C'.GloballyHyperbolic → C.GloballyHyperbolic) at the line cut at 0, Causal.cutLine 0, ≤-nested in
# the timelike line (Causal.cutLine_leNested), causal (Causal.cutLine_isCausal) and not globally
