# as the space with no property, chaining only the edges without standing: AUDIT-1 of the target).
# Two entries. Through the closure also locally_push_up, causally_open_future and the two local forms;
# it lacks globally_hyperbolic, strongly_causal, strongly_causal_open, time_function (each implies
# is_causal on ETT's spacetimes; stated besides: Causal.Flat.timeCylinder_not_globallyHyperbolic,
# timeCylinder_not_stronglyCausal, timeCylinder_not_stronglyCausalOpen,
# timeCylinder_not_hasTimeFunction). 50 [[open]] pairs settled: X → is_causal, strongly_causal,
# strongly_causal_open for X among absolutely_minimal, causally_arc_connected, causally_open,
# causally_open_future, causally_plain, chronal_neighbours, curves_extend, locally_causally_open,
# locally_causally_open_future, locally_push_up, push_up, tarentin (36), the same but curves_extend →
# time_function (11), and curves_extend → time_function, causally_plain → causally_compact,
# globally_hyperbolic (3). The 6 with causally_plain as premise rest on its plainness, which
# push_up ∧ chronal_neighbours ⇒ causally_plain gives (Causal.Flat.timeCylinder_causallyPlain). What
# it carries: absolute minimality, causal arc-connectedness, push-up, causal openness, tarentin,
# chronal neighbours, plainness and curves_extend together do not make a spacetime causal: a flat
# spacetime with all of them has closed timelike curves.
# Reading: either (causally arc-connected, and absolutely minimal as every flat causality is,
# Causal.Flat.flatCausality_absolutelyMinimal; OQ-18 does not touch it).
[[fails]]
from = ["curves_extend", "absolutely_minimal", "causally_arc_connected", "push_up", "tarentin", "chronal_neighbours", "causally_open", "causally_plain"]
to = "is_causal"
witness = "Causal.Flat.timeCylinder_separates"
status = "checked"

# Reading: either (causally arc-connected; absolutely minimal, as every flat causality).
[[fails]]
from = ["curves_extend", "absolutely_minimal", "causally_arc_connected", "push_up", "tarentin", "chronal_neighbours", "causally_open", "causally_plain"]
to = "causally_compact"
witness = "Causal.Flat.timeCylinder_separates"
status = "checked"

# The timelike circle, the cylinder at d = 0 (ℝ/ℤ with the timelike line's causality, compact; beyond
# T-loc-flat-time-cylinder's target). Causal.Flat.timeCylinder_zero_separates : (T2Space ∧
# SecondCountableTopology ∧ ConnectedSpace ∧ CompactSpace of TimeCylinder 0) ∧ CurvesExtend ∧
# AbsolutelyMinimal ∧ CausallyArcConnected ∧ PushUp ∧ Tarentin ∧ ChronalNeighbours ∧ CausallyOpen ∧
# CausallyPlain ∧ CausallyCompact ∧ ¬ IsCausal (1 ≤ d cannot be dropped above:
# Causal.Flat.timeCylinder_causallyCompact_iff). One entry; it settles causally_compact → is_causal,
# globally_hyperbolic, strongly_causal, strongly_causal_open, time_function (5 [[open]] pairs, whose
# notes argued them with the doubled line, not absolutely minimal). So the two conjuncts of
# def:globally_hyperbolic are independent in either reading: causally_compact ⇏ is_causal here,
# is_causal ⇏ causally_compact by the half-plane.
# Reading: either (as for the cylinder).
[[fails]]
from = ["causally_compact", "curves_extend", "absolutely_minimal", "causally_arc_connected", "push_up", "tarentin", "chronal_neighbours", "causally_open", "causally_plain"]
to = "is_causal"
witness = "Causal.Flat.timeCylinder_zero_separates"
status = "checked"

# ---- off the ambient (T-lad-record-dual-vee, 2026-11-21): counterexamples whose space is not one of
# ETT's spacetimes, each with a `space` key listing what its Lean witness states of the space. Since
# T-tool-ladder-space (599b0b0) refuted() and `matrix` count a [[fails]] only when its space, closed
# under the vocabulary, contains the ambient's words (T2, second_countable): a pair such an entry alone
# refutes is `fails-off`, not counted as classified, and an [[open]] entry for it stays legal. `check`
# still reads the entry on its own space: it may not have its `to` by the edges valid there.
#
# The vee (Causal.Vee, Causal.veeCausality, Causal/PushUpOfMinimalLocal.lean,
# T-abs-pushup-of-minimal-local, strict since 4e06808; ETT layer, no model): three points left, mid,
# right, a set open iff it contains mid as soon as it contains left or right (T0, not T1: {mid} is not
# closed); x ≤_U y iff x, y ∈ U and x ≤ y in left < mid < right; x ≪_U y iff left ∈ U, x ≠ right and
# y = mid. Read by `#check` (2026-11-21): Causal.veeCausality_separates_pushUp : T0Space Vee ∧
# ¬ T1Space Vee ∧ veeCausality.AbsolutelyMinimal ∧ veeCausality.LocallyPushUp ∧ ¬ veeCausality.PushUp
# (a closed statement; bare form Causal.not_pushUp_of_absolutelyMinimal_of_locallyPushUp_T0 : ¬ ∀ (X :
# Type) [TopologicalSpace X] [T0Space X] (C : Causality X), C.AbsolutelyMinimal → C.LocallyPushUp →
# C.PushUp). So `space = ["T0"]`, what the witness states: the vee is finite, hence second countable,
# which its witness does not state and no edge's standing would use (Levin's asks T2 besides). What
# it carries: the T1 of absolutely_minimal ∧ locally_push_up ⇒ push_up (its `standing`, the instance
# binder of Causal.Causality.AbsolutelyMinimal.pushUp_of_locallyPushUp) cannot be weakened to T0; a
# sharpness of the standing only, since ETT's spacetimes are Hausdorff. On its space only the edges
# without standing chain: its `from` reaches nothing more, and it lacks push_up and nothing else (no
# single premise reaches push_up there). So it refutes absolutely_minimal → push_up and
# locally_push_up → push_up off the ambient; both are refuted on the ambient already, the first in
# either reading (the half-chronological line), the second in the no-gluing reading only (the gated
# line, not absolutely minimal; in a gluing reading it holds on ETT's spacetimes, header), so `matrix`
# shows no `fails-off` pair from it (computed 2026-11-21). `check` reads it against that edge: the
# edge asks T1, not valid on {T0}, so no contradiction.
# Reading: moot: the vee is off ETT's spacetimes in either reading of defi:causalite (the witness gives
# absolute minimality on M; on every open set, the gluing reading's form, is not stated).
[[fails]]
from = ["absolutely_minimal", "locally_push_up"]
to = "push_up"
witness = "Causal.veeCausality_separates_pushUp"
space = ["T0"]
status = "checked"

# ---- pair sort (C, C' fixed, header): T-abs-nested-converse (2026-11-21).

# The pointed line (Causal.pointedLine, Causal/LinesReachable.lean: 0 ≤ y for y > 0) is curve-nested
# in the spacelike line on every open (its causal curves are constant,
# Causal.pointedLine_causalCurveOn_eq) and not ≤-nested in it (0 ≤ 1 in the first only).
# Causal.pointedLine_separates_curveNested conjoins (∀ W, CurveNestedOn pointedLine spacelikeLine W)
# ∧ ¬ LeNested pointedLine spacelikeLine with ¬ pointedLine.CausallyArcConnected,
# pointedLine.IsCausal, pointedLine.PushUp and spacelikeLine.CausallyArcConnected. Replaces the
# [[open]] entry for this pair. The converse holds when the narrower C is causally arc-connected
