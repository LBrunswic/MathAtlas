# ---- consequences at pair properties: theorems about C nested in C' (header). The transfers of a
# causality-sort property along a nesting with no condition in words are [[transfer]] entries since
# T-lad-classify-core (2026-11-21; after the consequences): is_causal, strongly_causal,
# strongly_causal_open, time_function to the narrower, tarentin to the wider, and the two
# counterexamples (tarentin to the narrower; bare globally_hyperbolic to the narrower). What stays
# here: the structure of the nestings (transitivity, time reversal, diamonds), and the transfers under
# a condition that is no ladder node (globally_hyperbolic exactly when C's diamonds are closed; Cauchy
# surfaces and inextensibility under C's own global hyperbolicity, tarentin, causal
