# spacetimes, it moves no pair of the matrix (T-tool-ladder-space); `check` reads it against this
# edge on its own space, where the edge, asking T1, does not chain.
[[implies]]
from = ["absolutely_minimal", "locally_push_up"]
to = "push_up"
witness = "Causal.Causality.AbsolutelyMinimal.pushUp_of_locallyPushUp"
standing = ["T1"]
status = "checked"

