# The causality ladder of ETT: a DAG of causal-topological properties, with consequences at every level.
#
# Checked by `python3 tools/ladder.py check`; Lean automation generated from it by
# `python3 tools/ladder.py emit-lean` (Causal/Ladder/Rules.lean, the `causal_ladder` tactic's rules).
#
# [[property]]  id, lean (the Causal definition), label (ETT ledger label, if any), what (one line)
# [[implies]]   from (list of ids, read as a conjunction), to (id), witness (Lean theorem),
#               under (side conditions that are not ladder nodes, in words), status seed|checked
# [[fails]]     from, to, witness (a Lean counterexample: a space with `from` and not `to`), status
# [[consequence]] at (id), statement (one line), witness (Lean theorem),
#               under (the witness's other hypotheses, ladder ids named as such, in words), status
# [[open]]      from, to, note: a pair whose implication is neither proved nor refuted
#
# status `seed`: the witness name exists, but its side conditions have not been read against the edge;
# the ladder-keeper reads them and turns the edge `checked` (or fixes `under`).
#
# Names are written fully qualified (`Causal.Causality.…`, `Causal.Precausality.…`), as the ETT ledger
# lists its declarations; each was resolved by the Lean elaborator (`#check`) on 2026-11-20.
#
# `under` is NOT read by tools/ladder.py: the closure chains an edge with `under` as if it were
# unconditional. Two kinds of side condition occur below. (1) Separation (T1, Hausdorff): ETT's
# topological spacetimes are second countable Hausdorff (def:category_topological_spacetimes,
# ETT.tex:255), so these are standing assumptions of the paper; a non-Hausdorff counterexample
# (branching spaces) must not be read against such an edge. (2) Localisation hypotheses (local
# push-up, local causal openness, chronal neighbours in every open set): these are substantive, and
# the closure through them overstates what is proved until they are ladder nodes with Lean
# definitions (see the comments at those edges).

[[property]]
id = "is_causal"
lean = "Causal.Causality.IsCausal"
label = "def:causal_spacetime"
what = "≤_M is antisymmetric (an order, reflexivity and transitivity being axioms): no closed causal loops in M"

[[property]]
id = "strongly_causal"
lean = "Causal.Causality.StronglyCausal"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains a neighbourhood, not necessarily open, causally convex in M (the definition, DEC-7)"

[[property]]
id = "strongly_causal_open"
lean = "Causal.Causality.StronglyCausalOpen"
label = "def:strongly_causal_spacetime"
what = "every neighbourhood of every point contains an OPEN neighbourhood causally convex in M (the literal reading through defi:convexite_causale; auxiliary since DEC-7)"

[[property]]
id = "globally_hyperbolic"
lean = "Causal.Causality.GloballyHyperbolic"
label = "def:globally_hyperbolic"
what = "causal, and every full diamond J_M(p,q) is compact"

[[property]]
id = "push_up"
lean = "Causal.Causality.PushUp"
label = "defi:pushup"
what = "in every open U: x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z"

[[property]]
id = "causally_open"
lean = "Causal.Causality.CausallyOpen"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) and J⁻_U(V) are open (the definition read with J±, DEC-8)"

[[property]]
id = "causally_open_future"
lean = "Causal.Causality.CausallyOpenFuture"
label = "def:causally_open_spacetime_open"
what = "for every open U and open V ⊂ U, J⁺_U(V) is open (the definition as printed, J⁺ alone; auxiliary since DEC-8)"

[[property]]
id = "absolutely_minimal"
lean = "Causal.Precausality.AbsolutelyMinimal"
label = "def:topological_space_causality_absolutely"
what = "for every open cover, the precausality generated by the restrictions to its members is the given one"

[[property]]
id = "causally_arc_connected"
lean = "Causal.Causality.CausallyArcConnected"
label = "def:causal_arc_connectedness"
what = "in every open U, p ≤_U q (resp. p ≪_U q) iff a causal (resp. chronal) curve in U joins p to q"

[[property]]
id = "causally_plain"
lean = "Causal.Causality.CausallyPlain"
label = "defi:causalement_plat"
what = "for every open U and A ⊂ M, Int J±_U(A) ⊂ closure I±_U(A): no open set of causal, non-chronological points (no bubbles)"

[[property]]
id = "tarentin"
lean = "Causal.Causality.Tarentin"
label = "def:tarentin_spacetime"
what = "every neighbourhood of every x contains p, q with x ∈ Int J_M(p,q)"

# ------------------------------------------------------------------ implications

# rem:topological_spacetime_strongly_causal. Side condition: T1 (the paper has Hausdorff).
[[implies]]
from = ["strongly_causal"]
to = "is_causal"
witness = "Causal.Causality.StronglyCausal.isCausal"
under = "M is T1 ([T1Space M]); ETT's spacetimes are Hausdorff"
status = "checked"

# Fixed 2026-11-20 (T-lad-seed-check): the seed had `from = ["strongly_causal"]`; the witness also
# assumes tarentin and two-sided causal openness, which are ladder nodes, so they join `from`.
[[implies]]
from = ["strongly_causal", "tarentin", "causally_open"]
to = "strongly_causal_open"
witness = "Causal.Causality.StronglyCausal.stronglyCausalOpen"
status = "checked"

# The converse, with no hypothesis: strongly_causal_open ⇔ strongly_causal on tarentin causally
# open spacetimes.
[[implies]]
from = ["strongly_causal_open"]
to = "strongly_causal"
witness = "Causal.Causality.StronglyCausalOpen.stronglyCausal"
status = "checked"

# prop:GH_fortement_causal (DEC-7). Fixed 2026-11-20 (T-lad-seed-check): the seed had
# `from = ["globally_hyperbolic"]`; the witness also assumes tarentin (a ladder node, joins `from`)
# and Hausdorff (`under`), exactly the paper's hypotheses.
[[implies]]
from = ["globally_hyperbolic", "tarentin"]
to = "strongly_causal"
witness = "Causal.Causality.GloballyHyperbolic.stronglyCausal"
under = "M Hausdorff ([T2Space M])"
status = "checked"

# cor:causalement_connexe_minimal. No side condition.
[[implies]]
from = ["causally_arc_connected"]
to = "absolutely_minimal"
witness = "Causal.Causality.CausallyArcConnected.absolutelyMinimal"
status = "checked"

# lem:pushup_local: push-up is local on a causally arc-connected spacetime. The side condition is a
# localisation property (local push-up) with no Lean definition of its own yet; until it is a node,
# the closure reads this edge as causally_arc_connected ⇒ push_up outright, which the witness does
# not prove.
[[implies]]
from = ["causally_arc_connected"]
to = "push_up"
witness = "Causal.Causality.CausallyArcConnected.pushUp"
under = "M is covered by open sets O i each having push-up as a spacetime (∀ i, C.PushUpOn (O i)): push-up holds locally"
status = "checked"

# Lemma K's route to causal openness (Causal.LemmaK, DEC-93; no ETT label). The side condition is a
# localisation property with no Lean definition of its own yet (chronal neighbours in every open
# set, chronology of that open set).
[[implies]]
from = ["push_up"]
to = "causally_open"
witness = "Causal.Causality.causallyOpen_of_pushUp"
under = "for every open V and v ∈ V there are p, p' ∈ V with p ≪_V v and v ≪_V p' (chronology taken in V)"
status = "checked"

# prop:topological_spacetime_absolutely_minimal, as printed (J⁺ only). The side condition is local
# causal openness, with no Lean definition of its own yet.
[[implies]]
from = ["absolutely_minimal"]
to = "causally_open_future"
witness = "Causal.Causality.AbsolutelyMinimal.causallyOpenFuture"
under = "every point has an open neighbourhood W with C.CausallyOpenFutureOn W: causal openness in the future holds locally"
status = "checked"

# prop:topological_spacetime_absolutely_minimal in the DEC-8 reading (J±).
[[implies]]
from = ["absolutely_minimal"]
to = "causally_open"
witness = "Causal.Causality.AbsolutelyMinimal.causallyOpen"
under = "every point has an open neighbourhood W with C.CausallyOpenFutureOn W, and one with C.dual.CausallyOpenFutureOn W: two-sided causal openness holds locally"
status = "checked"

# DEC-8: the two-sided definition implies the printed one. No side condition.
[[implies]]
from = ["causally_open"]
to = "causally_open_future"
witness = "Causal.Causality.CausallyOpen.future"
status = "checked"

# ------------------------------------------------------------------ consequences

# prop:GH_Jferme, first step. Fixed 2026-11-20 (T-lad-seed-check): the seed's statement claimed
# J⁻(p) too, which this witness does not give (its companion is the next entry), and named no
# hypothesis beyond global hyperbolicity.
[[consequence]]
at = "globally_hyperbolic"
statement = "J⁺(p) is closed for every p"
witness = "Causal.Causality.GloballyHyperbolic.isClosed_Jplus_singleton"
under = "tarentin (ladder node); M Hausdorff"
status = "checked"

[[consequence]]
at = "globally_hyperbolic"
statement = "J⁻(p) is closed for every p"
witness = "Causal.Causality.GloballyHyperbolic.isClosed_Jminus_singleton"
under = "tarentin (ladder node); M Hausdorff"
status = "checked"

# prop:GH_Jferme.
[[consequence]]
at = "globally_hyperbolic"
statement = "≤_M is closed in M × M, and J±(K) is closed for every compact K"
witness = "Causal.Causality.GloballyHyperbolic.isClosed_le_and_isClosed_J"
under = "tarentin (ladder node); M Hausdorff"
status = "checked"

# Lemma K of record (DEC-93; no ETT label).
[[consequence]]
at = "globally_hyperbolic"
statement = "Lemma K: a compact connected locally Cauchy set is a Cauchy surface"
witness = "Causal.Causality.isCauchySurface_of_isLocallyCauchy_of_causallyOpen"
under = "tarentin, causally_arc_connected, causally_open (ladder nodes); M Hausdorff, second countable, connected; J⁺(p) ≠ {p} and J⁻(p) ≠ {p} for every p"
status = "checked"

# prop:FZenon_injectif, future (the past form is Causal.Causality.Iminus_injOn_Zminus).
[[consequence]]
at = "strongly_causal"
statement = "x ↦ I⁺(x) is injective on Z⁺(M)"
witness = "Causal.Causality.Iplus_injOn_Zplus"
under = "M Hausdorff"
status = "checked"

# prop:tarentin_topological_spacetime_causality, (i)⇒(ii).
[[consequence]]
at = "strongly_causal"
statement = "the Alexandrov topology (generated by the open diamonds) is the topology of M"
witness = "Causal.Causality.StronglyCausal.alexandrovTopology_eq"
under = "tarentin (ladder node)"
status = "checked"

# rem:absolutely_minimal_topological_spacetime, future (past: AbsolutelyMinimal.mem_Zminus_iff).
[[consequence]]
at = "absolutely_minimal"
statement = "p is strongly tarentin in the future (p ∈ Z⁺(M)) iff I⁺(p) is non-empty"
witness = "Causal.Causality.AbsolutelyMinimal.mem_Zplus_iff"
under = "M is T1"
status = "checked"

# lem:cup_cap (the I⁺ form is Causal.Causality.Iplus_subset_interior_and_subset).
[[consequence]]
at = "absolutely_minimal"
statement = "for p_n → p: I⁻(p) ⊂ Int(⋃_N ⋂_{n≥N} I⁻(p_n)) ⊂ Int J⁻(p) ∩ Z⁺(M)"
witness = "Causal.Causality.Iminus_subset_interior_and_subset"
under = "M is T1; J⁺(x) closed for every x"
status = "checked"

# lem:restriction_convexe, future (past: Causal.Causality.restriction_convexe_past).
[[consequence]]
at = "causally_arc_connected"
statement = "on an open U causally convex in M, J⁺_U(A), I⁺_U(A), K⁺_U(A) are the traces on U of J⁺(A), I⁺(A), K⁺(A), for A ⊂ U"
witness = "Causal.Causality.restriction_convexe_future"
status = "checked"

[[consequence]]
at = "causally_open"
statement = "every open diamond Int J_U(p,q) is causally convex in U"
witness = "Causal.Causality.CausallyOpen.causallyConvexIn_openDiamond"
status = "checked"
