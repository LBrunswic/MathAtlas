# separation: Causal.Causality.GloballyHyperbolic.of_nested (each diamond of C closed inside the
# diamond of C'), .of_nested_of_isClosed, .of_nested_of_isClosed_J (J±_C(x) closed).
[[consequence]]
at = "le_nested"
statement = "wider globally hyperbolic ⇒ narrower globally hyperbolic, exactly when the narrower diamonds are closed: with C' globally hyperbolic, C is globally hyperbolic iff every J_C(p, q) is closed"
witness = "Causal.Causality.globallyHyperbolic_iff_of_nested"
under = "globally_hyperbolic of C' (ladder node); M Hausdorff; the witness asks ≤-nesting at M only (∀ x y, C.le ⊤ x y → C'.le ⊤ x y)"
status = "checked"

