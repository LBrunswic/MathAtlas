# * frontier_stays_in is Causal.Causality.FrontierStaysIn C W S R L (:226): for every frontier point q
#   of R in L lying in J⁺_W(S), the frontier points of R in J⁻_W(q) ∩ J⁺_W(S) lie in L, and the past
