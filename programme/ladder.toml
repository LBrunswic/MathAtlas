#
# Three sorts of property (T-lad-cbg-geometry-nodes, T-lad-nested-nodes, 2026-11-20); `pair` is
# described after `geometry`. A property of sort `causality` (the default: no `sort` field) has a Lean
# definition that is a predicate on one causality C on a topological space M; most entries are about
# these.
# A property of sort `geometry` (`sort = "geometry"`) has a Lean definition that is a predicate on the
# structures and morphisms of a geometry, Causal.CBG.Geometry (Level A) or Causal.CBG.LocalModel
# (Level B), not on one causality: `rigid` (A1: a predicate on a class of morphisms), `germ_extension`
# (A3) and `cauchy_slice` (A4), the localisation properties of Sbierski's MGHD argument
# (lean-causal/docs/CBG-DESIGN.md §2). They are [[property]] entries because tools/binder.py takes the
# ids a binder may name from [[property]] only.
# * A property of one sort enters an edge or a consequence of another only through `under`, in words.
# * Within the geometry sort a pair is read at Level B (a local model 𝔐; `rigid` then means
#   IsRigidFor (𝔐.IsMor s t) for all structures s, t with Hausdorff target). At Level A all three
#   are fields of Causal.CBG.Geometry and hold outright.
# * A consequence at a geometry property is a theorem over a Causal.CBG.Geometry, whose fields carry
#   all three (and the A2 causal facts); it is listed at the property whose field its proof consumes.
# * No geometry-sort [[implies]] is recorded. At Level B, `germ_extension` ⇒ `rigid` and
#   `cauchy_slice` ⇒ `rigid` hold with the premise unused: every local model is rigid
#   (Causal.CBG.eqOn_of_liftPropOn, from the field LocalModel.rigid). That premise-free fact is the
#   [[fact]] `rigid` (T-tool-ladder-py-2), which classifies the two pairs implied: 314 of 314 within
#   a sort (they were `unknown` while a fact had to be an edge). emit-lean makes no CausalLadder
#   rule of an edge joining a property not of the sort `causality` (the rules are about one
#   causality), only a skipped-edge comment line in Rules.lean.
#
# A property of sort `pair` (`sort = "pair"`, T-lad-nested-nodes) has a Lean definition that is a
# predicate on TWO causalities C, C' of one topological space M, a nesting: "C is nested in C'", C the
# narrower causality, C' the wider (Causal/NestedCausalities.lean). Sub- and superluminality are
# nestings (ERS 1802.03020 §4: the cone of g(u, du) inside Minkowski's, or T timelike for every
# g(u, du)); so is Reall 2101.11623's effective-metric cone inside the causal cone. A nesting is a
# relation between two spacetime structures on M, the localisation property programme/README.md calls
# "a nesting of two causalities", and a predicate on neither one causality nor a geometry.
# * `le_nested` is Causal.Causality.LeNested C C' (≤_U of C inside ≤_U of C', every open U).
#   `curve_nested` is Causal.Causality.CurveNestedOn C C' W, read at the open W its entry names (W = M
#   when none is named); it passes to every open V ⊆ W (consequence Causal.Causality.CurveNestedOn.mono),
#   so at W = M it is curve nesting on every open.
# * `inextensible_nested` (T-lad-nested-inextensible, 2026-11-22; DEC-161 (b), OQ-41 (b)'s reading
#   taken: "the nesting" of ERS Lemma 4.70 and of item 2 of T-abs-nested-causalities) is
#   Causal.Causality.InextensibleNestedOn C C' W, read at the open W its entry names (W = M when none
#   is named). Unlike curve nesting it does not pass to an open V ⊆ W in general (an inextensible
#   causal curve of V need not be one of W): refuted in Lean on a space that is not T1
#   (Causal.not_inextensibleNestedOn_mono; the note beside its consequences), it passes when every
#   narrower-inextensible curve of V is narrower-inextensible in W
#   (Causal.Causality.InextensibleNestedOn.mono_of_inextensible, a consequence), so at W = M it is
#   not read "on every open". Neither le_nested nor curve_nested implies it (the line cut at 1, the
#   [[fails]] below: ETT's inextensibility is by extension, and the point 1, with no causal past but
#   itself, ends a narrower-inextensible curve that the timelike line extends, kb/0045). It implies
#   curve_nested at the same W on a T1, second countable M (the [[implies]] with that standing,
#   T-lad-record-curves-corollaries); whether it implies le_nested is open (an [[open]] entry, end of
#   file). Curve nesting at M gives it at M when the narrower C
#   is causally arc-connected, causal, strongly causal, with closed J^± of points and no causal
#   endpoint (or globally hyperbolic, tarentin, causally arc-connected, no causal endpoint, M
#   Hausdorff): properties of C, so a consequence at curve_nested, not an [[implies]] (one with them
#   in `under` would be chained as unconditional, against the [[fails]]).
# * Within the pair sort an entry keeps C and C' fixed: `le_nested ⇒ curve_nested` reads
#   LeNested C C' ⇒ CurveNestedOn C C' W for every open W, and the [[fails]] curve_nested ⇏ le_nested
#   is a pair (C, C') curve-nested and not ≤-nested. A pair joining inextensible_nested reads both
#   nestings at one open W (le_nested at every open): the [[fails]] le_nested ⇏ inextensible_nested
#   is a pair ≤-nested and not inextensibly nested at M, which refutes it at every reading.
# * What a nesting does is transfer: a causality-sort property of one causality passes to the other.
#   Since T-lad-classify-core a transfer with no condition in words is a [[transfer]] entry (direction,
#   the ids asked besides of each causality, a witness or a counterexample; `check` refuses a
#   counterexample that satisfies the hypotheses of a proved transfer of the same property and
#   direction along a nesting it implies). A transfer under a condition that is no node, and every
#   other theorem about a nesting, is a consequence at the pair property, its `under` saying of which
#   causality each ladder id is asked ("of C", the narrower; "of C'", the wider).
# * emit-lean makes no CausalLadder rule of a pair-sort edge (emitted() skips any edge with a property
#   not of the sort `causality`; a skipped-edge comment line in Rules.lean), asks `lean_form` of no
#   pair property (emit_test keeps the sort `causality` only; LeNested's binder `C C' : Causality M`
#   would otherwise be misread as one causality), and reads no [[transfer]].
# * Not nodes: Causal.Causality.LtNested (≪-nesting; no theorem of the library uses it); and
#   Causal.Causality.NoCausalEndpoint (J^±(x) ≠ {x}, Causal/LadderLocal.lean:198), OQ-41 (b)'s other
#   branch, a node that would give the inextensible nesting on M, which DEC-161 (b) did not adopt: it
#   is a property of one causality, written in words in the `under` of the consequences that need it
#   (at curve_nested and le_nested below; Lemma K's, at globally_hyperbolic and curves_extend).
#   Whether it becomes a causality-sort node on its own account, as Lemma K's hypothesis, is not
#   ruled (the roadmap's T-lad-nested-inextensible).
#
