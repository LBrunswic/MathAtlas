on). (2a) If a countable sequence of indices i₀ ≤ i₁ ≤ … is cofinal: choose by induction strictly increasing continuous ψₙ : I_{iₙ} → ℝ onto nested bounded intervals with ψ_{n+1} ∘ φ = ψₙ. The union J is an interval, and c := c_{iₙ} ∘ ψₙ⁻¹ on ψₙ(I_{iₙ}) is a causal curve of W over J, since each segment of J lies in one ψₙ(I_{iₙ}) (CausalCurveIn.comp). It is tail-free, because a constant end piece of c is one of some c_{iₙ}. g_i := ψₙ ∘ φ_{i iₙ}, for any iₙ ≥ i, is a commuting cocone, independent of n by coherence. (2b) Otherwise no countable set of indices is cofinal. Claim: some i* has φ_{i* j} onto I_j for every j ≥ i*. Then X_{i*} is the cocone, with φ_{i* j}⁻¹ for j ≥ i* and φ_{j i*} for j ≤ i*. Proof: suppose the right end never stabilises. By transfinite recursion take indices i_α, α < ω₁, each i_{α+1} with a right excess over i_α and each i_λ above all earlier ones (a countable set of indices is bounded). Let s_α be the right end of the image of I_{i_α}, and for each rational q ∈ (0, 1) take a point s_α^q in (s_α, s_{α+1}). At a limit λ, carry all of these into I_{i_{λ+1}} by the coherent maps, s_λ their supremum. The map α ↦ c(s_α^q) at successors and c(s_α) at limits is continuous on ω₁ (squeezed at limits), so it is eventually constant by T-abs-omega-one-constant (T1, second countable). All q share one value, c(s_λ) at large limits. By density, and since points are closed (T1), some member of the chain is then constant on a non-degenerate final segment, which contradicts tail-freeness. The left end is the same with parameters reversed. (3) A maximal element is inextensible (Causality.Inextensible W, Causal/Inextensible.lean:184). Take a strict extension (I'', c'') of a maximal Z and trim its constant end pieces: they are closed by T1, and maximal as a sup or inf. The trimmed curve is tail-free, has the same image, and still has Z as a sub-arc, because a constant end piece of c'' that Z meets in more than one point would be one of Z. Maximality maps it back