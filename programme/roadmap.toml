ry open set for every cover (CausallyArcConnected.absolutelyMinimal, Causal/ArcConnected.lean:216; as oneWayMembrane_absolutelyMinimalOn, :247), in either reading (OQ-18). (iv) Push-up in every open U. For x ≪ y ≤ z, move the causal chain y = c₀ ≤ … ≤ cₙ = z to cᵢ − εᵢ(1, 1) with ε₀ = ε > ε₁ > … > εₙ = 0: the steps become timelike, stay in M (a down-set) and in U for small ε, and x ≪ y − ε(1, 1). For x ≤ y ≪ z, tilt the chain x = c₀ ≤ … ≤ cₙ = y to cᵢ + εᵢ(1, 1) with 0 = ε₀ < … < εₙ = ε: every point is ≤ y + ε(1, 1) ≤ d₁, the first point after y of the timelike chain to z, hence in M, and y + ε(1, 1) ≪ d₁ for small ε. (v) It is plain. Every point p of M has the chronal past p − ε(1, 1) in any open set about it, so with push-up J⁻_U(A) ⊆ closure I⁻_U(A), and J⁺ of an open set is open (PushUp.causallyOpenFuture_of_chronalPastNeighbours, Causal/LadderLocal.lean:338). A point w of Int J⁺_U(A) interior to M has the chronal future w + ε(1, 1) in U, so it lies in closure I⁺_U(A) by push-up; a boundary point is a limit of interior points of Int J⁺_U(A). (vi) It is not causally open in the past. Let V be the ball of radius 1/2 about (0, 1), so V ⊆ {u ≤ 0}. J⁻_M(V) contains (0, −1/2), by the segment along u = 0, and no point (ε, −1/2) of M with ε > 0, by the product order. At the corner the same holds in every open W ∋ 0, with a small ball about (0, η) ∈ W, so it is not locally causally open. (vii) It has no chronal neighbours: the edge points (0, v), v > 0, have I⁺_M empty, since I⁺ in ℝ² lies in Q. It is not tarentin at 0: a point q above both (ε, −η) and (−η, ε) is in Q. (viii) The rest, for the keeper's entry: it is causal; its diamonds J_M(p, q) = [p, q] ∩ M are compact (globally hyperbolic); small open boxes ∩ M are causally convex (strongly causal, open form); u + v is a time function (hence curves_extend). (ix) Its time reversal (C.dual, on the same space) is plain, absolutely minimal and push-up, causally open in the past, and neither causally open in the future nor 