evidence = "DEC-167: 'The library's definition changes (a large refactor: precausality without gluing stays as the underlying notion)'. Design questions for the master, after the planner's survey (2026-11-22). (1) The form of the field. Either hereditary, ∀ W : Opens M, toPrecausality.AbsolutelyMinimalOn W, the sheaf condition on every open: it makes every open subset of a spacetime a spacetime (ex:open_subset) and puts the transparent-point line (cexemple:point_transparent) among precausalities, as DEC-172 says of rem:minimalite_non_hereditaire. Or AbsolutelyMinimal on M only (def:topological_space_causality_absolutely as printed), under which the transparent-point line is a causality whose restriction to ℝ ∖ {0} is not. This is a reading for the master's OQ row; the planner's reading is the hereditary form. (2) Mechanics. A field `glue` added to the structure (Causal/Causality.lean:77) keeps every theorem over {C : Causality M} and every full name. It asks for a proof at the 115 construction sites, which T-abs-gluing-generic and T-abs-gluing-models supply; a site whose proof needs lemmas about the object itself is rebuilt from its precausality, defined first. The alternative, renaming the current structure and extending it, moves every Causal.Causality.* name (the ladder's `lean` fields, both binders, the ett, barbot, Sbierski and ERS ledgers, lean-gx) and costs more. (3) The underlying notion. Causal.Precausality ((a), (b); Causal/Causality.lean:55) already is def:precausality's precausality without gluing. The design says whether the non-minimal objects (gated, jump and global lines, deuxPushup, timelikeLineTop, galileoOn, the transparent line, Causality.ofRelation) are restated about precausalities (their relational properties: Precausality.Jplus and the like already exist, Causal/Causality.lean:89–100) or retired. It also says which ETT findings resting on them (OQ-67, OQ-39, kb/0073) are kept as historical statements. (4) Order. First T-abs-gluing-retype: the