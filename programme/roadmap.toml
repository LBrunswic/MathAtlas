evidence = "The keeper's analysis at T-lad-record-separators (journal entry 2026-11-21 11:57: '4 causally_plain → (local) causal openness (no target: a plain, absolutely minimal, non-open model, necessarily push-up without chronal neighbours)') and the [[open]] notes (programme/ladder.toml:2471–2483, :2562–2575). A counterexample in either reading is absolutely minimal, hence push-up on a T1 space (absolutely_minimal ∧ causally_plain ⇒ push_up, Causal.Causality.pushUp_of_causallyPlain_of_absolutelyMinimal, Causal/DeuxPushup.lean:217), hence without chronal neighbours (push_up ∧ chronal_neighbours ⇒ causally_open, Causal.Causality.PushUp.causallyOpen_of_chronalNeighbours, Causal/LadderLocal.lean:350). Plainness at A = U makes I±_U(U) dense in U. Every Lean model that fails causal openness is not plain (the notes). The model and the argument below are the planner's, for the closer. Null coordinates (u, v) = (t + x¹, t − x¹) make the Minkowski cone the product order, as in Causal.OneWayMembrane (Causal/OneWayMembrane.lean:108–127). Q = {u > 0 ∧ v > 0} = I⁺(0) is an open up-set. M = ℝ² ∖ Q is a closed subspace (T2 and second countable by the subspace instances) and a down-set. ≤_U (U open in M) is given by the finite chains of future causal segments (a ≤ b in the product order) inside U, and ≪_U by the chains of future timelike segments (strict in both coordinates) inside U. (i) A causal segment between two points of M lies in M: a point of it in the up-set Q would put its upper end in Q. So ≤_M is the product order on M. (ii) It is a causality. I±_U(x) is open in M: the last (or first) step's endpoint moves in an open set, its segment staying in M by (i) and in U by compactness. Transitivity is concatenation, and ≪ ⊆ ≤. (iii) It is causally arc-connected on every open set: the affine parametrisation of a step is a causal (resp. chronal) curve (as membraneStep.causalCurveOn, :197), and a curve gives its relation (CurveOn.rel_of_lt). Hence it is absolutely minimal on every open set for every cover (CausallyArcConnected.absolutelyMinimal, Causal/ArcConnected.lean:216; as oneWayMembrane_absolutelyMinimalOn, :247), in either reading (OQ-18). (iv) Push-up in every open U. For x ≪ y ≤ z, move the causal chain y = c₀ ≤ … ≤ cₙ = z to cᵢ − εᵢ(1, 1) with ε₀ = ε > ε₁ > … > εₙ = 0: the steps become timelike, stay in M (a down-set) and in U for small ε, and x ≪ y − ε(1, 1). For x ≤ y ≪ z, tilt the chain x = c₀ ≤ … ≤ cₙ = y to cᵢ + εᵢ(1, 1) with 0 = ε₀ < … < εₙ = ε: every point is ≤ y + ε(1, 1) ≤ d₁, the first point after y of the timelike chain to z, hence in M, and y + ε(1, 1) ≪ d₁ for small ε. (v) It is plain. Every point p of M has the chronal past p − ε(1, 1) in any open set about it, so with push-up J⁻_U(A) ⊆ closure I⁻_U(A), and J⁺ of an open set is open (PushUp.causallyOpenFuture_of_chronalPastNeighbours, Causal/LadderLocal.lean:338). A point w of Int J⁺_U(A) interior to M has the chronal future w + ε(1, 1) in U, so it lies in closure I⁺_U(A) by push-up; a boundary point is a limit of interior points of Int J⁺_U(A). (vi) It is not causally open in the past. Let V be the ball of radius 1/2 about (0, 1), so V ⊆ {u ≤ 0}. J⁻_M(V) contains (0, −1/2), by the segment along u = 0, and no point (ε, −1/2) of M with ε > 0, by the product order. At the corner the same holds in every open W ∋ 0, with a small ball about (0, η) ∈ W, so it is not locally causally open. (vii) It has no chronal neighbours: the edge points (0, v), v > 0, have I⁺_M empty, since I⁺ in ℝ² lies in Q. It is not tarentin at 0: a point q above both (ε, −η) and (−η, ε) is in Q. (viii) The rest, for the keeper's entry: it is causal; its diamonds J_M(p, q) = [p, q] ∩ M are compact (globally hyperbolic); small open boxes ∩ M are causally convex (strongly causal, open form); u + v is a time function (hence curves_extend). (ix) Its time reversal (C.dual, on the same space) is plain, absolutely minimal and push-up, causally open in the past, and neither causally open in the future nor locally so at the corner. Simulated with tools/ladder.py's matrix on the ladder of bb7232d, with these properties in both orientations: the 4 [[open]] pairs causally_plain → causally_open, causally_open_future, locally_causally_open and locally_causally_open_future are refuted in either reading, with no contradiction. Witness shape for the keeper: one conjoined theorem per orientation (names the closer's). Layer 1: a new ETT-layer module importing what Causal.OneWayMembrane imports (Causal.LadderLocal, Causal.CurvesExtend), not Causal.Minkowski, which is a model. If a step fails, the closer reports which; the target is the model, or a refutation of the sketch."
