evidence = "The keeper's proposal at T-lad-record-separators (journal entry 2026-11-21 11:57) and the [[open]] note of chronal_neighbours → causally_arc_connected (programme/ladder.toml:2464–2469). Galileo and the total timelike line refute it in the no-gluing reading only: they are not absolutely minimal. In either reading a refutation is an absolutely minimal model with chronal neighbours that is not causally arc-connected. The rational line (Causal.rationalLine, Causal/NestedConverse.lean:250: x ≤_U y for rationals x < y with [x, y] ⊆ U) is absolutely minimal and not arc-connected, but has no chronology. The chronal membrane has chronal neighbours but is arc-connected. The planner's model glues the two. On ℝ² with coordinates (t, x), ≪_U is given by the chains of timelike segments (t' − t > |x' − x|) inside U. ≤_U is given by the chains whose steps are causal segments (t' − t ≥ |x' − x|) inside U, or rational jumps (t, q) → (t, q') with q < q' in ℚ and {t} × [q, q'] ⊆ U. Argued, for the closer. (i) It is a causality: I±_U(x) are Minkowski's, hence open; ≪ ⊆ ≤; transitivity is concatenation. (ii) It is absolutely minimal on every open set for every cover. A segment, and a jump (the rationals being dense), subdivide into steps each inside one member of the cover (a Lebesgue number of a compact segment), as for the rational line (Causal.rationalLine_separates_absolutelyMinimal, Causal/NestedConverse.lean:394) and the membrane (Causal/OneWayMembrane.lean:247). This holds in either reading (OQ-18). (iii) Chronal neighbours: (t ∓ ε, x) lie in any open set about (t, x). Hence it is tarentin (ChronalNeighbours.tarentin). (iv) T = t + x/2 is a time function, strictly increasing along jumps and along non-trivial causal segments. Hence it is causal and has curves_extend. (v) It is not causally arc-connected. t is non-decreasing along ≤, so a causal curve from (0, 0) to (0, 1) stays on t = 0. There the only non-trivial steps are jumps, which start at rational x, so from a point (0, r) with r irrational nothing else on t = 0 is ≤_N-reachable. At the last parameter s₀ where the curve's x is ≤ r, for an irrational r ∈ (0, 1), the curve condition at s₀ then forces x = r on a right neighbourhood: a contradiction (the rational line's argument, Causal.rationalLine_separates, Causal/RationalLineExtras.lean:289). Yet (0, 0) ≤_M (0, 1) by one jump. (vi) It is not push-up: (0, 0) ≤ (0, 1) ≪ (1, 3/2), but not (0, 0) ≪ (1, 3/2). Hence it is neither locally push-up nor plain (absolutely_minimal ∧ locally_push_up ⇒ push_up and absolutely_minimal ∧ causally_plain ⇒ push_up, T1). Simulated with tools/ladder.py's matrix on the ladder of bb7232d: it refutes chronal_neighbours → causally_arc_connected in either reading, with no contradiction. chronal_neighbours → absolutely_minimal stays Galileo's (true in any gluing reading, OQ-18). Layer 1: a new module importing ETT-layer modules only (Causal.LadderLocal, Causal.CurvesExtend; no model)."
