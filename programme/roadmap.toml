int (0, r) with r irrational nothing else on t = 0 is ≤_N-reachable. At the last parameter s₀ where the curve's x is ≤ r, for an irrational r ∈ (0, 1), the curve condition at s₀ then forces x = r on a right neighbourhood: a contradiction (the rational line's argument, Causal.rationalLine_separates, Causal/RationalLineExtras.lean:289). Yet (0, 0) ≤_M (0, 1) by one jump. (vi) It is not push-up: (0, 0) ≤ (0, 1) ≪ (1, 3/2), but not (0, 0) ≪ (1, 3/2). Hence it is neither locally push-up nor plain (absolutely_minimal ∧ locally_push_up ⇒ push_up and absolutely_minimal ∧ causally_plain ⇒ push_up, T1). Simulated with tools/ladder.py's matrix on the ladder of bb7232d: it refutes chronal_neighbours → causally_arc_connected in either reading, with no contradiction. chronal_neighbours → absolutely_minimal stays Galileo's (true in any gluing reading, OQ-18). Layer 1: a new module importing ETT-layer modules only (Causal.LadderLocal, Causal.CurvesExtend; no model)."
