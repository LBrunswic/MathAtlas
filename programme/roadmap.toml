evidence = "Step (2b) of T-abs-curves-extend-second-countable, scoped 2026-11-21; this is the earlier sketch's step (i) (the planner's, in that target's evidence). Mathlib has the tools: IsClub, with IsClub.iInter for a countable family in a well-order whose cofinality is not ℵ₀ (Mathlib/SetTheory/Cardinal/Cofinality/Club.lean), and Cardinal.isRegular_aleph_one (Mathlib/SetTheory/Cardinal/Regular.lean:91). Argued, for the closer. Take a countable base (Bₙ). Each g⁻¹(Bₙ) is open, so either it contains a tail [γₙ, ω₁), or its complement Fₙ is closed (under sups of increasing sequences, by continuity at limits) and cofinal, i.e. a club. Let A be the set of n of the first kind, γ₀ the supremum of the countably many γₙ (< ω₁ by regularity), and δ ≥ γ₀ a point of ⋂_{n ∉ A} Fₙ (a club, by IsClub.iInter). Then g δ ∈ Bₙ iff n ∈ A, while every g α with α ≥ γ₀ lies in every Bₙ with n ∈ A. Were g α ≠ g δ, T1 would give a basic Bₙ containing g δ and missing g α; then n ∈ A, a contradiction. So g is constant on [γ₀, ω₁). The form is the closer's: ω₁ as Mathlib's (Cardinal.aleph 1).ord.toType or as the ordinals below it, whichever carries IsClub and the order topology most cheaply, and continuity as the limit condition at limits if the order topology instance is costly. Optionally, the same for any well-order of uncountable cofinality. Layer 1, pure topology: a new module of Causal importing Mathlib only, uses = []. The ladder pairs it serves are served through T-abs-curves-extend-second-countable (16)."
