# The ETT programme's roadmap. Schema: the header of roadmap/roadmap.toml, plus the programme kinds
# (programme/README.md): abstract (layer 1: `uses` = ladder ids, empty for pure topology),
# localisation (layer 3: `model`, `provides` = ladder ids), ladder, binder, tactic, publish, package.
# Owners: closer, master, planner, keeper (ladder-keeper), tactician (tactics-builder), publisher.
# Checked by `python3 tools/roadmap.py --file programme/roadmap.toml check`.

[gates]
known_red = []

# ------------------------------------------------------------------ the ladder (ETT's organisation)
[[target]]
id = "T-lad-seed-check"
title = "Read the side conditions of the 7 seeded ladder edges and the seeded consequence; mark them checked or fix `under`"
stream = "ladder"
kind = "ladder"
status = "ready"
owner = "keeper"
priority = 1
evidence = "programme/ladder.toml was seeded 2026-11-20 from Lean names that exist (tools/ladder.py check), without reading their hypotheses."
added = "2026-11-20"
proposed_by = "programme seed"

[[target]]
id = "T-lad-classify-core"
title = "Classify the core pairs of the ladder: an implication with a Lean witness, a counterexample, or an `open` entry, for every pair among the 11 seeded properties"
stream = "ladder"
kind = "ladder"
status = "planned"
owner = "keeper"
priority = 2
depends = ["T-lad-seed-check"]
evidence = "tools/ladder.py matrix: 99 of 110 ordered pairs unknown. Counterexamples exist in Lean (the timelike/lightlike/half-chrono lines, Galileo, the kink, branching spaces) and in the ETT ledger's findings."
