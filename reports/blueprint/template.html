<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETT Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The atlas's tokens (reports/atlas/template.html), plus --fails for refuted pairs. */
:root{
  --bg:#eef2f5; --canvas:#f6f8fa; --grid:#dfe5eb; --ink:#1b2735; --ink-2:#4d5c6c; --ink-3:#7d8a98;
  --line:#c3ccd6; --card:#ffffff; --accent:#2c5f8f; --accent-soft:#dbe7f2;
  --closed:#2f8259; --partial:#c4861a; --stated:#7f8d9b; --terminal:#b8c1ca; --none:#ffffff; --fails:#b04a3c;
  --closed-soft:#dcefe4; --partial-soft:#f6e7cc; --fails-soft:#f5dcd8;
  --edge:#8d9aa8; --edge-hi:#2c5f8f; --shadow:0 1px 2px rgba(27,39,53,.08),0 4px 14px rgba(27,39,53,.06);
  --f-display:"Newsreader","Iowan Old Style","Georgia",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d; --fails:#e27d6c;
  --closed-soft:#173326; --partial-soft:#3a2c12; --fails-soft:#3b1d19;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d; --fails:#e27d6c;
  --closed-soft:#173326; --partial-soft:#3a2c12; --fails-soft:#3b1d19;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.005em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-size:.86rem;font-weight:500;padding:6px 12px;border-radius:6px;color:var(--ink-2);border:1px solid transparent}
.tabs button:hover{background:var(--accent-soft)}
.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs .n{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);margin-left:4px}
.spacer{flex:1}
.roadbtn{font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap}
.roadbtn[aria-pressed="true"],.roadbtn:hover{background:var(--accent);color:var(--card)}
.roadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;gap:6px;align-items:center}
.search input{font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:14rem;max-width:48vw}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;position:relative;min-width:0;min-height:0}
.view.scroll{overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 40px}
.stage{position:absolute;inset:0;background-color:var(--canvas);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
svg#g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#g:active{cursor:grabbing}
.panel>*{flex-shrink:0}
.panel{width:min(440px,40%);border-left:1px solid var(--line);background:var(--card);overflow:auto;padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance;line-height:1.2}
.panel h2.mono{font-family:var(--f-mono);font-size:1.02rem;font-weight:500;overflow-wrap:anywhere}
h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.panel p{margin:0;line-height:1.5;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:.8rem;overflow-wrap:anywhere}
.panel ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);line-height:1.45}
.tex{border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.55;overflow-x:auto;font-size:.92rem;background:var(--canvas)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--card);font-family:var(--f-body)}
button.chip{cursor:pointer}
.chip.closed{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.target{border-color:var(--accent);color:var(--accent);font-family:var(--f-mono);font-size:.72rem}
.chip.open{border-color:var(--partial);color:var(--partial);border-style:dashed;font-weight:600}
.chip.none{color:var(--ink-3);border-style:dotted}
.chip.missing,.chip.fails{background:var(--fails);border-color:var(--fails);color:#fff}
.chip.cond{border-color:var(--partial);color:var(--partial)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0;box-sizing:border-box;background:var(--ink-3)}
.dot.s-active{background:var(--accent)}.dot.s-ready{background:transparent;border:1.5px solid var(--accent)}.dot.s-needs-ruling{background:var(--partial)}
.dot.s-blocked{background:var(--fails)}.dot.s-planned{background:transparent;border:1.5px solid var(--ink-3)}.dot.s-done{background:var(--closed)}.dot.s-dropped{background:var(--terminal)}
.chip.cmp{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.brow .chips{min-width:0;max-width:100%}
.brow .pl{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.chip.seed{border-style:dashed}
.chip.s-ready{border-color:var(--accent);color:var(--accent)}
.chip.s-active{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip.s-needs-ruling{border-color:var(--partial);color:var(--partial);font-weight:600}
.chip.s-blocked{border-style:dashed;color:var(--fails);border-color:var(--fails)}
.chip.s-done{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.s-dropped{text-decoration:line-through;color:var(--ink-3)}
.chip.s-planned{color:var(--ink-2)}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.pl{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pl:hover,.pl:focus-visible{background:var(--accent-soft)}
.pl.c{border-style:dashed;border-color:var(--partial)}
.pl.f{border-color:var(--fails);color:var(--fails)}
.pl.ghost{color:var(--ink-3);border-style:dashed;cursor:default}
.pl.ghost:hover{background:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--ink-3)}
ol.wit{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
ol.wit .mono,ul.wit .mono{display:block;color:var(--ink)}
.loc{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);overflow-wrap:anywhere}
ul.wit{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
ul.wit>li{border-left:3px solid var(--line);padding-left:10px}
ul.wit>li.c{border-left-color:var(--partial)}
ul.wit>li.f{border-left-color:var(--fails)}
ul.wit>li.ok{border-left-color:var(--closed)}
ul.wit>li.tg{border-left-color:var(--accent)}
.warn{border-left:3px solid var(--partial);padding:2px 0 2px 10px;color:var(--ink-2);font-size:.84rem;line-height:1.45}
.err{border-left:3px solid var(--fails);padding:2px 0 2px 10px;color:var(--ink-2);font-size:.84rem}
details summary{cursor:pointer;color:var(--ink-2);font-size:.86rem}
.prov{font-size:.78rem;color:var(--ink-3);line-height:1.45}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--ink-2);max-width:calc(100% - 82px);box-shadow:var(--shadow)}
.legend svg{vertical-align:middle;margin-right:5px;overflow:visible}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:2px solid var(--line);background:var(--card)}
.tools{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.tools button{font:inherit;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.tools button:focus-visible{outline:2px solid var(--accent)}
.mode{position:absolute;left:12px;top:10px;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:var(--shadow);z-index:2}
.mode button{all:unset;cursor:pointer;font-size:.8rem;font-weight:500;padding:5px 12px;background:var(--card);color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.mode button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{position:absolute;right:12px;top:10px;font-size:.74rem;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
/* the ladder graph */
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.node:hover rect.box{stroke:var(--accent);stroke-width:2}
.node:focus-visible{outline:none}.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5}
.node text{fill:var(--ink);font-family:var(--f-body)}
.node .t-mono{font-family:var(--f-mono)}
.node .t-dim{fill:var(--ink-3)}
.node.sel rect.box{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.node.sel text{fill:var(--card)}
.node.down rect.box{fill:var(--closed-soft);stroke:var(--closed);stroke-width:2}
.node.up rect.box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.node.down.c rect.box,.node.up.c rect.box{stroke:var(--partial);stroke-dasharray:5 3;fill:var(--partial-soft)}
.node.no rect.box{fill:var(--fails-soft);stroke:var(--fails);stroke-width:2}
.node.dim{opacity:.45}
.junction circle{fill:var(--card);stroke:var(--edge);stroke-width:1.4}
.junction text{fill:var(--ink-2);font-size:11px;font-family:var(--f-body)}
.junction{cursor:pointer}
.junction.c circle{stroke:var(--partial)}
.edge path.vis{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-opacity:.9}
.edge.seed path.vis{stroke-dasharray:6 4}
.edge.c path.vis{stroke:var(--partial)}
.edge.hi path.vis{stroke:var(--edge-hi);stroke-width:2.4;stroke-opacity:1}
.edge.c.hi path.vis{stroke:var(--partial)}
.edge text{fill:var(--partial);font-size:10.5px;font-family:var(--f-mono);paint-order:stroke;stroke:var(--canvas);stroke-width:3px}
.edge path.hit{fill:none;stroke:transparent;stroke-width:12px;pointer-events:stroke;cursor:pointer}
.edge.dim{opacity:.3}
/* the pair matrix */
.matrix{position:absolute;inset:0;overflow:auto;padding:56px 16px 90px;background:var(--canvas)}
.matrix table{border-collapse:separate;border-spacing:2px;margin:0 auto;font-size:.76rem}
.matrix th{font-family:var(--f-mono);font-weight:500;color:var(--ink-2);white-space:nowrap}
.matrix th.row{text-align:right;padding-right:6px}
.matrix th.col{height:150px;vertical-align:bottom;padding:0}
.matrix th.col div{writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0;margin:0 auto}
.matrix th button{all:unset;cursor:pointer}
.matrix th button:hover{color:var(--accent)}
.matrix td{width:26px;height:26px;padding:0}
.matrix td button{all:unset;display:block;width:26px;height:26px;text-align:center;line-height:26px;border-radius:4px;cursor:pointer;font-size:.86rem;box-sizing:border-box}
.matrix td button:focus-visible{outline:2px solid var(--accent)}
.matrix button.m-implied,.mkey b.m-implied{background:var(--closed);color:#fff}
.matrix button.m-implied-c,.mkey b.m-implied-c{background:repeating-linear-gradient(45deg,var(--closed-soft) 0 4px,var(--partial-soft) 4px 8px);color:var(--ink);border:1.5px dashed var(--partial)}
.matrix button.m-fails,.mkey b.m-fails{background:var(--fails);color:#fff}
.matrix button.m-fails-c,.mkey b.m-fails-c{background:var(--fails-soft);color:var(--fails);border:1.5px dashed var(--fails)}
.matrix button.m-open,.mkey b.m-open{background:var(--card);border:1.5px solid var(--partial);color:var(--partial)}
.matrix button.m-unknown,.mkey b.m-unknown{background:var(--grid);color:var(--ink-3)}
.matrix button.m-diag,.mkey b.m-diag{background:transparent;color:var(--ink-3)}
.matrix button.m-cross,.mkey b.m-cross{background:transparent;color:var(--ink-3);border:1px dotted var(--line)}
.matrix h3{text-align:center;margin:18px 0 8px}
.cluster rect{fill:none;stroke:var(--line);stroke-dasharray:2 4}
.cluster text{fill:var(--ink-3);font-family:var(--f-body);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.mkey{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:14px auto 0;font-size:.76rem;color:var(--ink-2);max-width:720px}
.mkey span{display:inline-flex;align-items:center;gap:6px}
.mkey b{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;font-weight:400;font-size:.74rem;box-sizing:border-box}
/* binders and roadmap */
.paper{max-width:1180px;margin:0 auto 34px}
.phead{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.phead h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;line-height:1.2;text-wrap:balance}
.phead p{margin:0;color:var(--ink-2);line-height:1.45;max-width:90ch}
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:4px}
.cov>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.cov h4{margin:0 0 5px;font-size:.74rem;color:var(--ink-3);font-weight:600}
.cov .chips{gap:4px}
.btable{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.brow{display:grid;grid-template-columns:minmax(170px,1.05fr) minmax(170px,1.2fr) minmax(150px,1fr) minmax(190px,1.25fr);border-top:1px solid var(--line);cursor:pointer}
.brow:first-child{border-top:0}
.brow:hover{background:var(--accent-soft)}
.brow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.brow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.brow>div{padding:9px 11px;min-width:0;display:flex;flex-direction:column;gap:5px;border-left:1px solid var(--grid)}
.brow>div:first-child{border-left:0}
.bhead{cursor:default;background:var(--canvas)}
.bhead:hover{background:var(--canvas)}
.bhead>div{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.bhead small{font-size:.68rem;letter-spacing:0;text-transform:none;font-weight:400}
.rname b{font-family:var(--f-display);font-size:1.02rem;font-weight:600}
.rname .mono{font-size:.72rem;color:var(--ink-3)}
.small{font-size:.74rem;color:var(--ink-3);line-height:1.4}
.names{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.45}
.geo{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.geo .model{font-size:.72rem;font-weight:600;color:var(--ink-2);min-width:7.5em}
.lbl{display:none;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cross{border-collapse:collapse;font-size:.76rem;width:100%}
.cross th,.cross td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.cross th{font-weight:600;color:var(--ink-3);font-size:.7rem}
.cross td.p{text-align:left;font-family:var(--f-mono);font-size:.72rem}
.cross .y{color:#fff;background:var(--closed)}
.cross .t{color:var(--accent);background:var(--accent-soft)}
.cross .o{color:var(--partial)}
.board{max-width:1180px;margin:0 auto 30px}
.board>h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0 0 4px}
.board>p{margin:0 0 10px;color:var(--ink-2);max-width:90ch;line-height:1.45}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:6px 0 12px}
.sbar span{display:block;height:100%}
.sgroup{margin:8px 0 16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.tcard:hover,.tcard.sel{border-color:var(--accent);box-shadow:var(--shadow)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.72rem;color:var(--ink-3)}
.tcard b{font-weight:500;line-height:1.35;font-size:.86rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.banner{max-width:1180px;margin:0 auto 14px;border:1px solid var(--fails);border-radius:8px;padding:8px 12px;background:var(--fails-soft);color:var(--ink);font-size:.84rem}
.banner ul{margin:4px 0 0;padding-left:1.2em}
@media (max-width:760px){
  main{flex-direction:column}
  .view{flex:1 1 auto}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line);flex:0 0 46%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  h1{font-size:1.15rem}
  .search input{width:9rem}
  .brow{grid-template-columns:1fr}
  .brow>div{border-left:0;border-top:1px dashed var(--grid)}
  .brow>div:first-child{border-top:0}
  .bhead{display:none}
  .lbl{display:block}
  .legend{display:none!important}
  .search label,.long{display:none}
  header{gap:8px 10px;padding-block:8px}
  .roadbtn{padding:5px 9px}
}
@media (min-width:761px){.short{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>ETT Blueprint</h1>

    <button role="tab" id="tab-binders" data-go="#/binders" aria-selected="false">Binders<span class="n" id="n-binders"></span></button>

  </nav>
  <span class="spacer"></span>

    <datalist id="ids"></datalist>
  </div>
  <a class="roadbtn" href="../atlas/atlas.html" title="The dependency atlas of every paper (reports/atlas, kept by /atlas-team)"><span class="long">Dependency atlas</span><span class="short">Atlas</span> ↗</a>
  <button class="roadbtn" id="theme" title="Colour theme">◐ auto</button>
</header>
<main>
  <div class="view" id="v-ladder" role="tabpanel" aria-labelledby="tab-ladder">
    <div class="stage">
      <svg id="g" role="img" aria-label="The causality ladder: properties and implications">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--edge)"></path></marker>
          <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--partial)"></path></marker>
          <marker id="arr-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--edge-hi)"></path></marker>

<script>
const DATA = __DATA__;

function propBtn(id, cls){ return PROP[id] ? `<button class="pl ${cls||""}" data-go="#/ladder/p/${enc(id)}">${esc(id)}</button>` : `<span class="pl ghost" title="not a property of programme/ladder.toml">${esc(id)}</span>`; }

  const st = esc(ST_LABEL[t.status] || t.status);
  return compact ? `<button class="chip target cmp" data-go="#/roadmap/${enc(id)}" title="${esc(id)} (${st}): ${esc(t.title)}"><i class="dot s-${esc(t.status)}"></i>${esc(id)}</button>`
    : `<button class="chip target" data-go="#/roadmap/${enc(id)}" title="${esc(t.title)}"><i class="dot s-${esc(t.status)}"></i>${esc(id)} · ${st}</button>`; }
function leanLine(name, loc, how){ return `<span class="mono">${esc(name)}</span>${loc ? `<span class="loc">${esc(loc)}${how && how !== "exact" ? " · resolved by " + esc(how) : ""}</span>` : `<span class="loc">location not found by the page's scan</span>`}`; }
function statusChip(s){ return `<span class="chip ${s === "checked" ? "closed" : "seed"}">${esc(s)}</span>`; }

function texHTML(t){
  const body = String(t).replace(/^\\begin\{[a-zA-Z*0-9]+\}(\[[^\]]*\])?/,"").replace(/\\end\{[a-zA-Z*0-9]+\}\s*$/,"")
    .replace(/\\(begin|end)\{(itemize|enumerate)\}(\[[^\]]*\])?/g,"").replace(/\\item\s*(\[[^\]]*\])?/g,"\n• ").replace(/\\(emph|textit|textbf|it|bf)\{([^{}]*)\}/g,"$2").replace(/\{\\(it|bf|em)\s+([^{}]*)\}/g,"$2")
    .replace(/~?\\(cite|ref|eqref|cref|Cref)(\[[^\]]*\])?\{[^}]*\}/g," [·]").trim();

}
let mjKey = null;

    MJ.typesetClear && MJ.typesetClear([el]); MJ.typesetPromise([el]).catch(() => {});

}
const P = $("#panel");

/* ---------- theme ---------- */
const THEMES = ["auto","dark","light"]; let theme = "auto";
try { theme = localStorage.getItem("blueprint-theme") || "auto"; } catch (e) {}

  $("#theme").textContent = "◐ " + theme; $("#theme").title = "Colour theme: " + theme + " (click to change)"; }

/* =====================================================================================
   1. The ladder
   ===================================================================================== */
const S = LAD.summary;
const nChecked = LAD.implies.filter(e => e.status === "checked").length, nCond = LAD.implies.filter(e => e.cond).length;
function consAt(id){ return LAD.cons.map((c,i) => ({...c,i})).filter(c => c.at === id); }
function implStr(e){ return `${e.from.map(esc).join(" ∧ ")} ⇒ ${esc(e.to)}`; }
function edgeLi(i){
  const e = LAD.implies[i];
  return `<li class="${e.cond ? "c" : "ok"}"><button class="pl ${e.cond?"c":""}" data-go="#/ladder/edge/${i}" style="white-space:normal">${implStr(e)}</button>
    ${leanLine(e.witness, e.loc)}<div class="chips" style="margin-top:4px">${statusChip(e.status)}${e.cond ? `<span class="chip cond">under a side condition</span>` : ""}${emitChip(e)}</div>
    ${e.under ? `<div class="warn" style="margin-top:4px"><b>under</b> ${esc(e.under)}</div>` : ""}</li>`;
}
function emitChip(e){ if (!e.emit) return "";
  return e.emit.rule ? `<span class="chip" title="tools/ladder.py emit-lean makes it a rule of causal_ladder (witness in ${esc(e.emit.module)})">causal_ladder rule</span>`
    : `<span class="chip none" title="emit-lean skips it: ${esc(e.emit.why)}">not a rule</span>`; }
function derivationHTML(d){ return d && d.length ? `<ul class="wit">${d.map(edgeLi).join("")}</ul>` : `<p>The two properties coincide.</p>`; }
function consLi(c, via){
  return `<li class="${c.status === "checked" ? "ok" : ""}${via && via.c ? " c" : ""}"><span style="color:var(--ink)">${esc(c.statement)}</span>${leanLine(c.witness, c.loc)}
    <div class="chips" style="margin-top:4px">${statusChip(c.status)}${via ? `<span class="chip ${via.c ? "cond" : ""}">at ${esc(c.at)}${via.c ? ", reached through a side condition" : ""}</span>` : ""}</div>
    ${c.under ? `<div class="warn" style="margin-top:4px"><b>under</b> ${esc(c.under)}</div>` : ""}${extrasHTML(c.extra)}</li>`;
}

/* graph */
const svg = d3.select("#g"), world = d3.select("#world");
const zoom = d3.zoom().scaleExtent([0.15, 3]).on("zoom", e => world.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);
let bbox = {x:0,y:0,w:100,h:100}, NODEPOS = {}, drawn = false, selProp = null;
function fitTransform(pad = 36){
  const W = svg.node().clientWidth || 800, H = svg.node().clientHeight || 600;
  const k = Math.min(1.25, (W - 2*pad) / bbox.w, (H - 2*pad - 40) / bbox.h);
  return d3.zoomIdentity.translate(W/2 - k*(bbox.x + bbox.w/2), H/2 + 10 - k*(bbox.y + bbox.h/2)).scale(k);
}
function fit(){ svg.call(zoom.transform, fitTransform()); }
/* When the whole ladder would be drawn too small to read (a phone), centre the selected property instead. */
function view(){
  const t = fitTransform(), p = selProp && NODEPOS[selProp];
  if (t.k >= 0.45 || !p){ svg.call(zoom.transform, t); return; }
  const W = svg.node().clientWidth, H = svg.node().clientHeight, k = 0.7;
  svg.call(zoom.transform, d3.zoomIdentity.translate(W/2 - k*p.x, H/2 - k*p.y).scale(k));
}
let lastSize = "";
new ResizeObserver(() => requestAnimationFrame(() => { const n = svg.node(), sz = n.clientWidth + "x" + n.clientHeight;
  if (sz !== lastSize && drawn && !$("#v-ladder").hidden && mode === "graph" && n.clientWidth){ lastSize = sz; view(); } })).observe(svg.node());
$("#zin").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.3);
$("#zout").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1/1.3);
$("#zfit").onclick = () => fit();


function ladderGraph(){
  const nodes = LAD.props.map(p => ({id:p.id, kind:"prop", w:214, h:64, p}));
  const edges = [];
  LAD.implies.forEach((e, i) => {
    if (!PROP[e.to] || e.from.some(x => !PROP[x])) return;
    if (e.from.length === 1) edges.push({v:e.from[0], w:e.to, i, arrow:true, label:e.cond ? "under" : ""});
    else { const j = "∧" + i; nodes.push({id:j, kind:"junction", w:20, h:20, i});
      e.from.forEach(x => edges.push({v:x, w:j, i, arrow:false}));
      edges.push({v:j, w:e.to, i, arrow:true, label:e.cond ? "under" : ""}); }
  });
  return {nodes, edges};
}
function components(nodes, edges){
  const par = {}; nodes.forEach(n => par[n.id] = n.id);
  const f = x => par[x] === x ? x : (par[x] = f(par[x]));
  edges.forEach(e => { par[f(e.v)] = f(e.w); });
  const groups = {}; nodes.forEach(n => (groups[f(n.id)] ??= []).push(n)); return Object.values(groups);
}
/* Each connected component laid out by dagre, then shelf-packed (the atlas's layout). */
function layout(G){
  const parts = components(G.nodes, G.edges).map(ns => {
    const ids = new Set(ns.map(n => n.id)), es = G.edges.filter(e => ids.has(e.v));
    const g = new dagre.graphlib.Graph({multigraph:true});
    g.setGraph({rankdir:"TB", nodesep:30, ranksep:58, marginx:0, marginy:0}); g.setDefaultEdgeLabel(() => ({}));
    ns.forEach(n => g.setNode(n.id, {width:n.w, height:n.h}));
    es.forEach((e, k) => g.setEdge(e.v, e.w, {label:e.label, width:e.label ? 40 : 0, height:e.label ? 14 : 0, labelpos:"c"}, "e" + G.edges.indexOf(e)));
    dagre.layout(g); const gi = g.graph(); return {ns, g, w:gi.width || 0, h:gi.height || 0};
  }).sort((a, b) => b.ns.length - a.ns.length || b.h - a.h);
  const area = parts.reduce((a, p) => a + p.w*p.h, 0), maxW = Math.max(...parts.map(p => p.w), Math.sqrt(area)*1.6);
  let x = 0, y = 0, rowH = 0, W = 0; const out = {nodes:{}, edges:[]};
  parts.forEach(p => {
    if (x > 0 && x + p.w > maxW){ x = 0; y += rowH + 50; rowH = 0; }
    p.ns.forEach(n => { const q = p.g.node(n.id); out.nodes[n.id] = {x:q.x + x, y:q.y + y}; });
    p.g.edges().forEach(eo => { const e = p.g.edge(eo); out.edges.push({src:G.edges[+eo.name.slice(1)], points:e.points.map(pt => ({x:pt.x + x, y:pt.y + y})), lx:e.x != null ? e.x + x : null, ly:e.y != null ? e.y + y : null}); });
    x += p.w + 60; rowH = Math.max(rowH, p.h); W = Math.max(W, x - 60);
  });
  out.width = W; out.height = y + rowH; return out;
}
/* One frame per sort of property (programme/ladder.toml's `sort`), when there is more than one and no
   implication joins two sorts; otherwise one block. */
function layoutSorts(G){
  const sortN = n => n.kind === "junction" ? sortOf(LAD.implies[n.i].to) : sortOf(n.id);
  const crossing = G.edges.some(e => { const a = G.nodes.find(n => n.id === e.v), b = G.nodes.find(n => n.id === e.w); return sortN(a) !== sortN(b); });
  if (SORTS.length < 2 || crossing){ const L = layout(G); L.clusters = []; return L; }
  const pad = 26, top = 34, blocks = SORTS.map(s => { const ns = G.nodes.filter(n => sortN(n) === s), ids = new Set(ns.map(n => n.id));
    const L = layout({nodes:ns, edges:G.edges.filter(e => ids.has(e.v) && ids.has(e.w))}); return {s, L, w:L.width + 2*pad, h:L.height + pad + top}; });
  const area = blocks.reduce((a, b) => a + b.w*b.h, 0), maxW = Math.max(...blocks.map(b => b.w), Math.sqrt(area)*1.5);
  let x = 0, y = 0, rowH = 0, W = 0; const out = {nodes:{}, edges:[], clusters:[]};
  blocks.forEach(b => { if (x > 0 && x + b.w > maxW){ x = 0; y += rowH + 40; rowH = 0; }
    const ox = x + pad, oy = y + top;
    for (const [id, q] of Object.entries(b.L.nodes)) out.nodes[id] = {x:q.x + ox, y:q.y + oy};
    b.L.edges.forEach(E => out.edges.push({...E, points:E.points.map(p => ({x:p.x + ox, y:p.y + oy})), lx:E.lx != null ? E.lx + ox : null, ly:E.ly != null ? E.ly + oy : null}));
    out.clusters.push({title:"sort: " + b.s, x, y, w:b.w, h:b.h}); x += b.w + 40; rowH = Math.max(rowH, b.h); W = Math.max(W, x - 40); });
  out.width = W; out.height = y + rowH; return out;
}
function drawLadder(){
  world.selectAll("*").remove();
  const G = ladderGraph(), L = layoutSorts(G); NODEPOS = L.nodes;
  L.clusters.forEach(c => { const cg = world.append("g").attr("class", "cluster");
    cg.append("rect").attr("x", c.x).attr("y", c.y).attr("width", c.w).attr("height", c.h).attr("rx", 14);
    cg.append("text").attr("x", c.x + 16).attr("y", c.y + 22).text(c.title); });
  bbox = {x:-20, y:-20, w:L.width + 40, h:L.height + 40};
  const line = d3.line().x(p => p.x).y(p => p.y).curve(d3.curveBasis), eg = world.append("g");
  L.edges.forEach(E => { const s = E.src, e = LAD.implies[s.i], dd = line(E.points);
    const el = eg.append("g").attr("class", "edge" + (e.status !== "checked" ? " seed" : "") + (e.cond ? " c" : "")).attr("data-i", s.i).attr("data-v", s.v).attr("data-w", s.w);
    el.append("path").attr("class", "hit").attr("d", dd);
    el.append("path").attr("class", "vis").attr("d", dd).attr("marker-end", s.arrow ? `url(#${e.cond ? "arr-c" : "arr"})` : null);
    if (s.label && E.lx != null) el.append("text").attr("x", E.lx).attr("y", E.ly + 4).attr("text-anchor", "middle").text(s.label);
    el.append("title").text(`${e.from.join(" ∧ ")} ⇒ ${e.to}\n${e.witness} (${e.status})${e.under ? "\nunder: " + e.under : ""}\n(click for the edge)`);
    el.on("click", ev => { ev.stopPropagation(); nav("#/ladder/edge/" + s.i); });
  });
  const ng = world.append("g");
  G.nodes.forEach(N => { const p = L.nodes[N.id]; if (!p) return;
    if (N.kind === "junction"){ const e = LAD.implies[N.i];
      const el = ng.append("g").attr("class", "junction" + (e.cond ? " c" : "")).attr("transform", `translate(${p.x},${p.y})`).attr("data-i", N.i);
      el.append("circle").attr("r", 10); el.append("text").attr("text-anchor", "middle").attr("y", 4).text("∧");
      el.append("title").text(`${e.from.join(" ∧ ")} ⇒ ${e.to}: the premises are read together (click for the edge)`);
      el.on("click", ev => { ev.stopPropagation(); nav("#/ladder/edge/" + N.i); }); return; }
    const pr = N.p, nc = consAt(pr.id).length;
    const el = ng.append("g").attr("class", "node").attr("data-id", N.id).attr("transform", `translate(${p.x - N.w/2},${p.y - N.h/2})`)
      .attr("tabindex", 0).attr("role", "button").attr("aria-label", `${pr.id}, ${plural(nc, "consequence")}`);
    el.append("rect").attr("class", "box").attr("width", N.w).attr("height", N.h).attr("rx", 8).style("filter", "drop-shadow(0 2px 5px rgba(20,30,45,.08))");
    el.append("text").attr("class", "t-mono").attr("x", 12).attr("y", 22).attr("font-size", 12.5).attr("font-weight", 500).text(pr.id.length > 26 ? pr.id.slice(0, 25) + "…" : pr.id);
    el.append("text").attr("class", "t-mono t-dim").attr("x", 12).attr("y", 39).attr("font-size", 10.5).text(short(pr.lean || ""));
    el.append("text").attr("class", "t-dim").attr("x", 12).attr("y", 55).attr("font-size", 10.5).text(nc ? plural(nc, "consequence") : "no consequence recorded");
    el.append("title").text(pr.what);
    const go = ev => { ev.stopPropagation(); nav("#/ladder/p/" + enc(pr.id)); };
    el.on("click", go).on("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(ev); } });
  });
  svg.on("click", () => nav("#/ladder"));
  drawn = true; markLadder(); view();
}
function markLadder(){
  const P0 = selProp;
  world.selectAll(".node").each(function(){
    const id = this.getAttribute("data-id"), el = d3.select(this);
    let cls = "node";
    if (P0){
      if (id === P0) cls += " sel";
      else { const dn = pair(P0, id), up = pair(id, P0);
        if (dn && IMPL.has(dn.c)) cls += " down" + (dn.c === "implied-c" ? " c" : "");
        else if (up && IMPL.has(up.c)) cls += " up" + (up.c === "implied-c" ? " c" : "");
        else if ((dn && FAIL.has(dn.c)) || (up && FAIL.has(up.c))) cls += " no";
        else cls += " dim"; }
    }
    el.attr("class", cls);
  });
  world.selectAll(".edge").each(function(){ const e = LAD.implies[+this.getAttribute("data-i")], el = d3.select(this);
    const i = +this.getAttribute("data-i");
    const on = selEdge != null ? i === selEdge : selPair ? selPair.has(i) : !!P0 && (e.to === P0 || e.from.includes(P0));
    el.classed("hi", on).classed("dim", (P0 != null || selEdge != null) && !on);
    el.select("path.vis").attr("marker-end", function(){ return this.getAttribute("marker-end") ? `url(#${on && !e.cond ? "arr-hi" : e.cond ? "arr-c" : "arr"})` : null; });
  });
}

/* =====================================================================================
   2. The binders
   ===================================================================================== */
const PROPOSED = {}; BINDERS.forEach(B => B.proposed.forEach(p => (PROPOSED[B.slug] ??= {})[p.id] = p));
function refsStatus(refs){
  if (!refs.length) return {s:"open"};
  const miss = refs.filter(x => x.t === "missing"), tg = refs.filter(x => x.t === "target");
  if (miss.length) return {s:"missing", ids:miss.map(x => x.x)};
  if (tg.length) return {s:"target", ids:tg.map(x => x.x)};
  return {s:"closed"};
}
const L1 = r => refsStatus(r.ett);
function L2(B, r){
  if (!r.loc.length && !r.open.length) return {s:"none"};
  if (!r.open.length) return {s:"closed"};
  const pr = PROPOSED[B.slug] || {}, un = r.open.filter(id => !(pr[id] && pr[id].target));
  if (un.length) return {s:"open", ids:un};
  return {s:"target", ids:[...new Set(r.open.map(id => pr[id].target))]};
}
function L3(r){
  if (!r.geo.length) return {s:(r.loc.length || r.open.length) ? "open" : "none"};
  const st = r.geo.map(g => refsStatus(g.by));
  if (st.every(x => x.s === "closed")) return {s:"closed"};
  if (st.some(x => x.s === "missing")) return {s:"missing", ids:st.flatMap(x => x.s === "missing" ? x.ids : [])};
  if (st.some(x => x.s === "open")) return {s:"open"};
  return {s:"target", ids:[...new Set(st.flatMap(x => x.ids || []))]};
}
function stChip(st, compact){
  if (st.s === "closed") return `<span class="chip closed" title="every entry is a declaration of lean-causal's strict library">closed</span>`;
  if (st.s === "none") return `<span class="chip none">none needed</span>`;
  if (st.s === "open") return `<span class="chip open">open${st.ids ? ": " + st.ids.map(esc).join(", ") : ""}</span>`;
  if (st.s === "missing") return `<span class="chip missing">unresolved: ${st.ids.map(esc).join(", ")}</span>`;
  const ids = compact && st.ids.length > 2 ? st.ids.slice(0, 2) : st.ids;
  return ids.map(x => tgtChip(x, compact)).join("") + (ids.length < st.ids.length ? `<span class="chip none">+${st.ids.length - ids.length}</span>` : "");
}
function namesLine(refs, n = 3){
  const ln = refs.filter(x => x.t === "lean");
  return ln.length ? `<div class="names">${ln.slice(0, n).map(x => esc(short(x.x))).join(" · ")}${ln.length > n ? ` <span style="color:var(--ink-3)">+${ln.length - n}</span>` : ""}</div>` : "";
}
function models(B){ const m = []; B.rows.forEach(r => r.geo.forEach(g => { if (!m.includes(g.model)) m.push(g.model); })); return m; }
function coverage(B){
  const c = {l1:{}, l2:{}, l3:{}, mod:{}}, inc = (o, k) => o[k] = (o[k] || 0) + 1;
  B.rows.forEach(r => { inc(c.l1, L1(r).s); inc(c.l2, L2(B, r).s); inc(c.l3, L3(r).s);
    r.geo.forEach(g => inc(c.mod[g.model] ??= {}, refsStatus(g.by).s)); });
  return c;
}
const COV_ORDER = ["closed","target","open","none","missing"], COV_TXT = {closed:"closed",target:"on a target",open:"open",none:"none needed",missing:"unresolved"};
function covChips(o){ return COV_ORDER.filter(k => o[k]).map(k => `<span class="chip ${k === "target" ? "target" : k}" style="font-family:var(--f-body)">${COV_TXT[k]} ${o[k]}</span>`).join(""); }
function rowName(r){ const l = r.ledger;

    ${cited.length ? `<div><h3>Cited by binder rows (${cited.length})</h3><ul class="wit">${cited.map(c => `<li class="tg"><button class="pl" data-go="#/binders/${enc(c.B.slug)}/${enc(c.r.label)}">${esc(c.B.slug)} · ${esc(c.r.ref || c.r.label)}</button><span class="loc">${esc(c.w.join("; "))}</span></li>`).join("")}</ul></div>` : ""}
    <div><h3>Evidence</h3><p style="font-size:.86rem">${esc(t.evidence)}</p></div>
    <p class="prov">Added ${esc(t.added)} · proposed by ${esc(t.proposed_by)}</p>
    ${extrasHTML(rest)}`);
}

/* =====================================================================================
   Routing, search, boot
   ===================================================================================== */
const VIEWS = ["ladder","binders","roadmap"];
let current = null;
function showView(v){
  if (current === v) return; current = v;
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; $("#tab-" + x).setAttribute("aria-selected", x === v); });
  if (v === "ladder"){ if (!drawn) drawLadder(); else if (mode === "graph") view(); }
  if (v === "binders" && !bindersDrawn) drawBinders();
  if (v === "roadmap" && !$("#v-roadmap").innerHTML) drawRoadmap();
}
function route(){
  routed = location.hash;
  const parts = (location.hash || "#/ladder").replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const v = VIEWS.includes(parts[0]) ? parts[0] : "ladder"; showView(v);
  if (v === "ladder"){
    selProp = parts[1] === "p" ? parts[2] : null; selEdge = parts[1] === "edge" ? +parts[2] : null;
    selPair = null;
    if (parts[1] === "pair"){ selProp = parts[2]; const v = pair(parts[2], parts[3]); if (v) selPair = new Set([...(v.d || []), ...(v.da || []), ...(v.db || [])]); }
    markLadder(); ladderLegend(); if (drawn && mode === "graph" && selProp && fitTransform().k < 0.45) view();
    if (parts[1] === "p") showProp(parts[2]); else if (parts[1] === "pair") showPair(parts[2], parts[3]); else if (parts[1] === "edge") showEdge(+parts[2]); else ladderOverview();
  } else if (v === "binders"){
    if (parts[2]) showRow(parts[1], parts[2]); else if (parts[1]) { showBinder(parts[1]); const s = document.getElementById("b-" + parts[1]); if (s) s.scrollIntoView({block:"start"}); } else bindersOverview();
    if (parts[2]){ const el = document.getElementById(`row-${parts[1]}-${parts[2]}`); if (el) el.scrollIntoView({block:"nearest"}); }
  } else {
    if (parts[1]){ showTarget(parts[1]); const el = document.getElementById("t-" + parts[1]); if (el) el.scrollIntoView({block:"nearest"}); } else roadOverview();
  }
}
document.addEventListener("click", ev => {
  const s = ev.target.closest("[data-scroll]"); if (s){ const el = document.getElementById(s.dataset.scroll); if (el) el.scrollIntoView({block:"start"}); return; }
  const g = ev.target.closest("[data-go]"); if (!g || g.disabled) return;
  ev.stopPropagation(); nav(g.dataset.go);
});
/* Navigation routes at once; the hashchange that follows (or the browser's back button) routes only
   when the hash differs from the one last routed. */
let routed = null;
function nav(h){ if (location.hash !== h) location.hash = h; route(); }
addEventListener("hashchange", () => { if (location.hash !== routed) route(); });
addEventListener("keydown", e => { if (e.key === "Escape" && e.target.tagName !== "INPUT"){ const v = current || "ladder"; nav("#/" + v); } });
/* search */
const FIND = {};
LAD.props.forEach(p => FIND[p.id] = "#/ladder/p/" + enc(p.id));
BINDERS.forEach(B => B.rows.forEach(r => FIND[r.label] = `#/binders/${enc(B.slug)}/${enc(r.label)}`));
ROAD.targets.forEach(t => FIND[t.id] = "#/roadmap/" + enc(t.id));
$("#ids").innerHTML = Object.keys(FIND).sort().map(k => `<option value="${esc(k)}"></option>`).join("");
$("#q").addEventListener("change", e => { const h = FIND[e.target.value.trim()]; if (h){ nav(h); e.target.blur(); } });
$("#n-ladder").textContent = LAD.props.length;
$("#n-binders").textContent = BINDERS.reduce((a, B) => a + B.rows.length, 0);
$("#n-roadmap").textContent = ROAD.targets.length;
route();
</script>
</body>
