4.87), read as the nesting curve_nested of the static slope-δ causality in C_g), a C_δ-past-inextensible curve from a point above the graph would miss S, so ∂U₁ is the graph of the continuous f⁺; it supplies (4.83) to 4.82 as the `honesided` of ers_theorem_4_82_of_oneSidedBoundary. Its proof is causal once the narrow cone is a nested causality: T-loc-quasilinear-one-sided.","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}}],"unbound":[{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":728,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["ersthm:ThmNonUniqueness"],"tex":"\\begin{remark}\nWe emphasise that the two GHDs constructed in the proof of Theorem \\ref{ThmNonUniqueness} are \\emph{smooth}. Hence, the non-uniqueness mechanism exhibited does not stem from a loss of regularity of the solution.\n\\end{remark}","label":"ersrem:emphasise_two_ghds_constructed"},{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":734,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["ersthm:ThmNonUniqueness"],"tex":"\\begin{remark}\nThe initial data constructed in the proof of Theorem \\ref{ThmNonUniqueness} are not compactly supported. However, by a standard domain of dependence argument one can cut off the initial data outside a large enough ball to produce compactly supported initial data and two GHDs thereof which satisfy the statement of Theorem \\ref{ThmNonUniqueness}.\n\\end{remark}","label":"ersrem:initial_data_constructed_proof"},{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":738,"proof":"","nl":"informal","lean":"none","decls":[],"deps":[],"tex":"\\begin{remark} \nRecall that equation \\eqref{Eqc1} (which is \\eqref{BIeom}  multiplied by $1+(\\partial_{x^1}\\Phi)^2 - (\\partial_{x^0}\\Phi)^2$) is not manifestly hyperbolic, i.e., a quasilinear wave equation of the form \\eqref{QuasilinearEq} which we will consider in Section \\ref{theorems}.   Its principal symbol is\n\\begin{equation*}\n\\tilde{g}^{-1} = (1+(\\partial_{x^1}\\Phi)^2 - (\\partial_{x^0}\\Phi)^2) \\cdot g^{-1} = \\begin{pmatrix}\n-(1 + (\\partial_{x^1}\\Phi)^2) & \\partial_{x^0}\\Phi \\partial_{x^1} \\Phi \\\\ \\partial_{x^0}\\Phi \\partial_{x^1} \\Phi & 1 -(\\partial_{x^0} \\Phi)^2 \n\\end{pmatrix} \n\\end{equation*}\nand the determinant is $\\det \\tilde{g}^{-1} = -1 -(\\partial_{x^1}\\Phi)^2 + (\\partial_{x^0}\\Phi)^2 = -1 - 4\\partial_{\\eta}\\Phi \\partial_\\xi \\Phi$.\nIt follows from \\eqref{NullDerivativesRhoSigma} and \\eqref{phi_def} that for the two hyperbolic solutions constructed above we have\n\\begin{equation*}\n\\det \\tilde{g}^{-1}  = -1 - 4 \\frac{\\phi'(\\rho) \\phi'(\\sigma)}{(1-\\phi'(\\rho)\\phi'(\\sigma))^2} <-1 \\;.\n\\end{equation*}\nWe can thus modify the principal symbol of \\eqref{Eqc1} in the region $\\{ (\\partial_{x^0}\\Phi, \\partial_{x^1}\\Phi)  \\in \\R^2\\; |  \\det \\tilde{g}^{-1} \\geq -\\frac{1}{2} \\} = \\{(\\partial_{x^0}\\Phi)^2 \\geq (\\partial_{x^1} \\Phi)^2 + \\frac{1}{2} \\}$ to make it Lorentz-metric valued for all $d\\Phi$ (and keeping it subluminal), thus creating a subluminal quasilinear wave equation (i.e. a quasilinear equation for which every solution is hyperbolic) which is still solved by our two GHDs of the same initial data constructed above which take different values at a point that lies in …","label":"ersrem:RemCutOff"},{"kind":"conjecture","number":"","title":"","file":"ghd_02_19.tex","line":1078,"proof":"","nl":"open","lean":"none","decls":[],"deps":[],"tex":"\\begin{conjecture} \n\nThere are quasilinear wave equations of the form \\eqref{QuasilinearEq} for which there exists initial data such that there does not exist \\emph{any} UGHD.\n\\end{conjecture}","label":"ersconj:ConUni"}],"proposed":[{"id":"inextensible_nested","lean":"Causal.Causality.InextensibleNestedOn","target":"T-lad-nested-inextensible","what":"inextensible causal curves of W for C are inextensible for C' ((4.62) for Cτ ⊆ C_g, ERS 4.70); OQ-41 (b): this, or no_causal_endpoint, is the node","leanloc":"lean-causal/Causal/NestedCausalities.lean:135"},{"id":"no_causal_endpoint","lean":"Causal.Causality.NoCausalEndpoint","target":"T-lad-nested-inextensible","what":"J⁻(x) ≠ {x} and J⁺(x) ≠ {x} for every x: with GH, tarentin and causal arc-connectedness it gives inextensible_nested on M (Causal.Causality.GloballyHyperbolic.inextensibleNestedOn_top_of_noCausalEndpoint); also the hypothesis of Lemma K and of ChainsCurves","leanloc":"lean-causal/Causal/LadderLocal.lean:172"},{"id":"local_uniqueness","lean":"on this fixed background the existential `∃ V, C.IsCommonDevelopment S U₁ U₂ agree V` (Causal.Causality.IsCommonDevelopment), the `hlocal` of Causal.Causality.ers_theorem_4_64; for data, T-abs-cbg-initial-data defines it","target":"T-lad-development-nodes","what":"two developments of the same data have a common GH development (ERS Prop 4.63; Sbierski Thm 2.6)","leanloc":""},{"id":"slice_restart","lean":"Causal.Causality.SliceRestart","target":"T-lad-ers-restart-nodes","what":"at every spacelike frontier point of a common development in U₁ ∩ U₂, a strictly larger common development (Thm 4.64 Steps 3–5 with Prop 4.63; the `hstep` of ers_theorem_4_64 and, definitionally, of ers_theorem_4_82); OQ-57 (b)","leanloc":"lean-causal/Causal/ErsUniqueness.lean:211"},{"id":"frontier_stays_in","lean":"Causal.Causality.FrontierStaysIn","target":"T-lad-ers-restart-nodes","what":"the frontier of a common development below a point of U₁ ∩ U₂ and above S stays in U₁ ∩ U₂ (Thm 4.64 Step 2, ghd_02_19.tex:880); OQ-57 (b): apart, folded into the restart, or a node","leanloc":"lean-causal/Causal/ErsUniqueness.lean:226"},{"id":"one_sided_boundary","lean":"Causal.Causality.OneSidedBoundary","target":"T-lad-one-sided-node","what":"the topological content of (4.83): every boundary point of U₁ off closure S has arbitrarily small neighbourhoods V with V ∩ U₁ preconnected (the `honesided` of Causal.Causality.ers_theorem_4_82_of_oneSidedBoundary); no causality, OQ-52 (b)","leanloc":"lean-causal/Causal/LadderLocal.lean:190"}],"other":{},"errors":[],"macros":{"Erf":"\\operatorname{Erf}","Erfc":"\\operatorname{Erfc}","N":"\\mathbb{N}","R":"\\mathbb{R}","ba":"\\begin{eqnarray}","be":"\\begin{equation}","ea":"\\end{eqnarray}","ee":"\\end{equation}","pd":"\\partial","red":"\\textcolor{red}","sect":["\\setcounter{equation}{0}\\section{#1}",1],"theequation":"\\arabic{section}.\\arabic{equation}"},"path":"papers/ers-predictability/certificate/binder.toml"},{"slug":"sbierski-mghd","title":"On the Existence of a Maximal Cauchy Development for the Einstein Equations - a Dezornification","edition":"arXiv 1309.7591 e-print v3 (2 Jul 2015); J. Sbierski, On the existence of a maximal Cauchy development for the Einstein equations: a dezornification, Ann. Henri Poincare 17 (2016), doi:10.1007/s00023-015-0401-5 = bib sbierski_geroch. The published text may differ from v3 and has not been compared.","document":"Maximal_GHD2.tex","ledgerRows":19,"rows":[{"label":"mghddef:globally_hyperbolic_development_ghd","ref":"Def 2.1","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":360,"proof":"","nl":"definition","lean":"partial","decls":["Causal.CBG.Dev","Causal.IsCauchyEmbedding"],"deps":[],"tex":"\\begin{definition}\nA \\emph{globally hyperbolic development} (GHD) \\((M,g,\\iota)\\) of initial data \\((\\overline{M},\\bar{g},\\bar{k})\\) is a time oriented, globally hyperbolic Lorentzian manifold \\((M,g)\\) that satisfies the vacuum Einstein equations, together with an embedding \\(\\iota : \\overline{M} \\to M\\) such that \n\\begin{enumerate}\n\\item \\(\\iota^*(g) = \\bar{g}\\)\n\\item \\(\\iota^*(k) = \\bar{k}\\), where \\(k\\) denotes the second fundamental form of \\(\\iota(\\overline{M})\\) in \\(M\\) with respect to the future normal\n\\item \\(\\iota(\\overline{M})\\) is a Cauchy surface in \\((M,g)\\).\n\\end{enumerate}\n\\end{definition}"},"ett":[{"x":"Causal.CBG.Dev","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:750"},{"x":"Causal.IsCauchyEmbedding","t":"lean","loc":"lean-causal/Causal/CauchyExtension.lean:768"}],"loc":["globally_hyperbolic","absolutely_minimal","causally_arc_connected","push_up","tarentin"],"open":[],"open_reason":"","note":"Def 2.1 (Maximal_GHD2.tex:360). A GHD is a development `Dev 𝔊 s₀`: a structure, a Cauchy embedding of the datum and a structure morphism. ETT's datum is a GH spacetime M₀; Sbierski's is (M̄, ḡ, k̄), read as the class of developments of Σ under local uniqueness (T-abs-cbg-initial-data). The localisation step is reading the smooth GH Lorentzian manifold as an ETT spacetime: O'Neill's GH gives ETT's (causal, compact diamonds) and the A2 causal facts.","geo":[{"model":"smooth-vacuum","proves":["globally_hyperbolic","absolutely_minimal","causally_arc_connected","push_up","tarentin"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367"}],"extra":{}}],"extra":{}},{"label":"mghddef:extension","ref":"Def 2.2","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":369,"proof":"","nl":"definition","lean":"partial","decls":["Causal.CBG.Dev.IsMorphism"],"deps":[],"tex":"\\begin{definition}\n\nGiven two GHDs \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) of the same initial data, we say that \\((M',g',\\iota')\\) is an \\emph{extension} of \\((M,g,\\iota)\\) iff there exists a time orientation preserving isometric embedding\\footnote{We lay down some terminology here: An \\emph{isometry} is a diffeomorphism that preserves the metric. An \\emph{isometric immersion} is an immersion that preserves the metric. Finally, an \\emph{isometric embedding} is an isometric immersion that is a diffeomorphism onto its image.} \\(\\psi : M \\to M'\\) that preserves the initial data, i.e.\\ \\(\\psi \\circ \\iota = \\iota'\\). \n\\end{definition}"},"ett":[{"x":"Causal.CBG.Dev.IsMorphism","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:774"}],"loc":[],"open":[],"open_reason":"","note":"Def 2.2 (Maximal_GHD2.tex:369). An extension is a morphism of developments; Sbierski's 'isometric embedding' is not asked: injectivity is derived (Lemma 3.3, Causal.CBG.injOn_of_injOn_cauchy), as his remark after Lemma 3.3 says.","geo":[],"extra":{}},{"label":"mghddef:PreDefCGHD","ref":"Def 2.3","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":374,"proof":"","nl":"definition","lean":"partial","decls":["Causal.CBG.CommonSubDev"],"deps":[],"tex":"\\begin{def1}\n\nGiven two GHDs \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) of  initial data \\((\\overline{M},\\bar{g},\\bar{k})\\), we say that a GHD \\((U,g_U,\\iota_U)\\) of the same initial data is a \\emph{common globally hyperbolic development} (CGHD) of \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) iff both \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) are extensions of \\((U,g_U,\\iota_U)\\).\n\\end{def1}"},"ett":[{"x":"Causal.CBG.CommonSubDev","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:658"}],"loc":[],"open":[],"open_reason":"","note":"Def 2.3 (Maximal_GHD2.tex:374), the symmetric CGHD: ETT def:common_sub_extension with injective morphisms of developments.","geo":[],"extra":{}},{"label":"mghddef:DefCGHD","ref":"Def 2.4","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":383,"proof":"","nl":"definition","lean":"partial","decls":["Causal.CBG.IsCGHD"],"deps":[],"tex":"\\begin{def2}\n\nGiven two GHDs \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) of  initial data \\((\\overline{M},\\bar{g},\\bar{k})\\), we say that a GHD \\((U \\subseteq M,g|_U,\\iota)\\) is a \\emph{common globally hyperbolic development} (CGHD) of \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) iff  \\((M',g',\\iota')\\) is an extension of \\((U,g_U,\\iota_U)\\).\n\\end{def2}"},"ett":[{"x":"Causal.CBG.IsCGHD","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:219"}],"loc":[],"open":[],"open_reason":"","note":"Def 2.4 (Maximal_GHD2.tex:383), the CGHD realised as an open subset of M; IsCGHD asks a structure morphism into M' and no injectivity (ETT's ℰ).","geo":[],"extra":{}},{"label":"mghdrem:RemSym","ref":"Remark 2.5","ledger":{"kind":"remark","number":"","title":"","file":"Maximal_GHD2.tex","line":388,"proof":"","nl":"informal","lean":"partial","decls":["Causal.CBG.isCGHD_of_isMorphism","Causal.CBG.mcghd_factor","Causal.CBG.SmallDev"],"deps":["mghddef:extension","mghddef:PreDefCGHD","mghddef:DefCGHD"],"tex":"\\begin{remark}\n\n\\begin{enumerate}\n\\item\nThe diffeomorphism invariance of the Einstein equations implies that if \\(M\\) is a GHD of certain initial data, then so is any spacetime that is isometric to \\(M\\). From a physical point of view, isometric spacetimes should be considered to be the same, i.e., one should actually consider the \\emph{isometry class} of a GHD to be the solution to the Einstein equations. It is easy to check that the \\emph{Definitions \\ref{extension} and \\ref{PreDefCGHD} also descend to the isometry classes of GHDs, i.e., they do not depend on the chosen representative of the isometry class}. It is also only when one considers isometry classes that one can prove uniqueness for the initial value problem to the Einstein equations in the strict meaning of this word. However, working with isometry classes has a decisive disadvantage for the purposes of this paper: the isometry class of a given GHD is a \\emph{proper} class, i.e., not a set. Thus, if we considered an infinite number of isometry classes, not even the full axiom of choice would be strong enough to pick a representative of each - and we need a representative to work with. We thus refrain from considering isometry classes of GHDs. \n\n\\item\nAs just mentioned, Definition \\ref{PreDefCGHD} is diffeomorphism invariant. In Definition \\ref{DefCGHD} we break the diffeomorphism invariance by requiring that a CGHD \\(U\\) of \\(M\\) and \\(M'\\) is realised as a subset of \\(M\\). However, this is not a serious restriction, since given any CGHD \\(U\\) of \\(M\\) and \\(M'\\) in the sense of Definition \\ref{PreDefCGHD}, we  …"},"ett":[{"x":"Causal.CBG.isCGHD_of_isMorphism","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:432"},{"x":"Causal.CBG.mcghd_factor","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:468"},{"x":"Causal.CBG.SmallDev","t":"lean","loc":"lean-causal/Causal/CBG/Bound.lean:342"}],"loc":[],"open":[],"open_reason":"","note":"Remark 2.5 (Maximal_GHD2.tex:388). (1) Isometry classes are proper classes: the size bound is SmallDev (second countable T0 carriers inside Set ℕ, Causal.CBG.Bound) where Sbierski restricts to subsets of M̄ × ℝ. (2) A Def 2.3 CGHD embeds in M as a Def 2.4 one: isCGHD_of_isMorphism, mcghd_factor.","geo":[],"extra":{}},{"label":"mghdthm:LocalTheory","ref":"Thm 2.6","ledger":{"kind":"theorem","number":"","title":"","file":"Maximal_GHD2.tex","line":403,"proof":"","nl":"cited","lean":"partial","decls":["Causal.CBG.Dev.self"],"deps":[],"tex":"\\begin{theorem}\n\nGiven initial data for the vacuum Einstein equations, there exists a GHD, and for any two GHDs of the same initial data, there exists a CGHD.\n\\end{theorem}"},"ett":[{"x":"T-abs-cbg-initial-data","t":"target"},{"x":"Causal.CBG.Dev.self","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:792"}],"loc":[],"open":["local_uniqueness"],"open_reason":"local_uniqueness is not a ladder node and has no Lean definition for data (T-abs-cbg-initial-data defines it, T-lad-development-nodes adds it). Smooth-vacuum: Choquet-Bruhat 1952, cited PDE. Flat-gx: the datum is the GH spacetime M₀ itself (Dev.self), local existence and uniqueness are built in.","note":"Thm 2.6 (Maximal_GHD2.tex:403), cited. It is pure layer 3 for Einstein (local well-posedness); its ETT role is the hypothesis that makes 'developments of the same data' a directed family (T-abs-cbg-initial-data).","geo":[{"model":"smooth-vacuum","proves":[],"by":[{"x":"T-loc-vacuum-slice","t":"target"}],"extra":{}}],"extra":{}},{"label":"mghdthm:CommonExtension","ref":"Thm 2.7","ledger":{"kind":"theorem","number":"","title":"Global uniqueness","file":"Maximal_GHD2.tex","line":411,"proof":"Maximal_GHD2.tex:723","nl":"proved","lean":"partial","decls":["Causal.CBG.exists_common_extension","Causal.CBG.exists_ppcm","Causal.CBG.t2Space_gluing_mcghd","Causal.Gluing.t2Space_iff_forall_not_isCorrespondingBoundaryPair","Causal.Causality.TwoPiece.globallyHyperbolic"],"deps":["mghdthm:TNDVersion","mghdthm:ExMCGHD"],"tex":"\\begin{theorem}[Global uniqueness]\n\nGiven two GHDs \\(M\\) and \\(M'\\) of the same initial data, there exists a GHD \\(\\tilde{M}\\) that is an extension of \\(M\\) and \\(M'\\).\n\\end{theorem}"},"ett":[{"x":"Causal.CBG.exists_common_extension","t":"lean","loc":"lean-causal/Causal/CBG/Ppcm.lean:1290"},{"x":"Causal.CBG.exists_ppcm","t":"lean","loc":"lean-causal/Causal/CBG/Ppcm.lean:1273"},{"x":"Causal.CBG.t2Space_gluing_mcghd","t":"lean","loc":"lean-causal/Causal/CBG/NoCorresponding.lean:571"},{"x":"Causal.Gluing.t2Space_iff_forall_not_isCorrespondingBoundaryPair","t":"lean","loc":"lean-causal/Causal/GluingHausdorff.lean:307"},{"x":"Causal.Causality.TwoPiece.globallyHyperbolic","t":"lean","loc":"lean-causal/Causal/CBG/Ppcm.lean:640"},{"x":"T-abs-cbg-initial-data","t":"target"}],"loc":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"open":["local_uniqueness"],"open_reason":"local_uniqueness: T-lad-development-nodes, behind T-abs-cbg-initial-data. Every other localisation property is a ladder node (rigid, germ_extension, cauchy_slice of sort geometry since T-lad-cbg-geometry-nodes); flat-gx proves them in Lean, smooth-vacuum owes them.","note":"Thm 2.7 (Maximal_GHD2.tex:411, proof 723–775). Gluing along the MCGHD (Thm 3.4) is Hausdorff because it has no corresponding boundary points (Thm 3.13 + the topological criterion of Causal.GluingHausdorff, T-abs-gluing-hausdorff); its GH is proved by chains (TwoPiece, model-free, in Causal.CBG.Ppcm until T-abs-hoist-cbg-gluing), not Sbierski's timelike curves. For two GHDs of the same DATA, take the datum M₀ := their CGHD (Thm 2.6): T-abs-cbg-initial-data.","geo":[{"model":"smooth-vacuum","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"},{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-vacuum-slice","t":"target"},{"x":"T-loc-vacuum-geometry","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367"},{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243"},{"x":"Causal.CBG.flat_germExtFuture","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:808"},{"x":"Causal.CBG.flat_germExtPast","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:832"},{"x":"Causal.CBG.flat_slice_future","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:512"},{"x":"Causal.CBG.flat_slice_past","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:546"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395"},{"x":"Causal.CBG.flat_hasTimeFunction","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:403"},{"x":"Causal.CBG.flat_cbg","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:875"}],"extra":{}}],"extra":{}},{"label":"mghdthm:MGHD","ref":"Thm 2.8","ledger":{"kind":"theorem","number":"","title":"Existence of MGHD","file":"Maximal_GHD2.tex","line":417,"proof":"Maximal_GHD2.tex:780","nl":"proved","lean":"partial","decls":["Causal.CBG.cbg","Causal.CBG.maxDev_isUniversal","Causal.CBG.Dev.IsUniversal.existsUnique_iso","Causal.CBG.mcghd_cocycle","Causal.CBG.maxSpace_t2","Causal.Causality.ManyPiece.globallyHyperbolic","Causal.CBG.FamilyGlueData.t2Space_iff_forall_not_isCorrespondingBoundaryPair","Causal.CBG.Dev.isUniversal_of_small"],"deps":["mghdthm:CommonExtension"],"tex":"\\begin{theorem}[Existence of MGHD]\n\nGiven initial data there exists a GHD \\(\\tilde{M}\\) that is an extension of any other GHD of the same initial data.  The GHD \\(\\tilde{M}\\) is unique up to isometry and is called the \\emph{maximal globally hyperbolic development (MGHD)} of the given initial data.\n\\end{theorem}"},"ett":[{"x":"Causal.CBG.cbg","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:1093"},{"x":"Causal.CBG.maxDev_isUniversal","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:1043"},{"x":"Causal.CBG.Dev.IsUniversal.existsUnique_iso","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:1112"},{"x":"Causal.CBG.mcghd_cocycle","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:733"},{"x":"Causal.CBG.maxSpace_t2","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:879"},{"x":"Causal.Causality.ManyPiece.globallyHyperbolic","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:579"},{"x":"Causal.CBG.FamilyGlueData.t2Space_iff_forall_not_isCorrespondingBoundaryPair","t":"lean","loc":"lean-causal/Causal/GluingHausdorff.lean:570"},{"x":"Causal.CBG.Dev.isUniversal_of_small","t":"lean","loc":"lean-causal/Causal/CBG/Bound.lean:423"},{"x":"T-abs-cbg-initial-data","t":"target"}],"loc":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"open":["local_uniqueness"],"open_reason":"As Thm 2.7. Also used and not a ladder property: second countability of a GH spacetime with a second-countable Cauchy surface (Geroch 1968, Sbierski item 5; the Geometry field secondCountable_of_cauchy), owed by smooth-vacuum in T-loc-vacuum-geometry.","note":"Thm 2.8 (Maximal_GHD2.tex:417, proof 780–840). Glue the small developments along their pairwise MCGHDs (FamilyGlueData; Hausdorff by the family criterion of Causal.GluingHausdorff), cocycle, T2 from the pairs, GH by chains BEFORE second countability (design §6), universality, uniqueness up to unique isomorphism. Sbierski's size bound (GHDs inside M̄ × ℝ, via a timelike flow) is replaced by SmallDev. Universality over all developments of the DATA, not of one M₀, is T-abs-cbg-initial-data.","geo":[{"model":"smooth-vacuum","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"},{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-vacuum-slice","t":"target"},{"x":"T-loc-vacuum-geometry","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367"},{"x":"Causal.CBG.flatGeometry","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:824"},{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243"},{"x":"Causal.CBG.flat_germExtFuture","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:808"},{"x":"Causal.CBG.flat_germExtPast","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:832"},{"x":"Causal.CBG.flat_slice_future","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:512"},{"x":"Causal.CBG.flat_slice_past","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:546"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395"},{"x":"Causal.CBG.flat_hasTimeFunction","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:403"},{"x":"Causal.CBG.flat_cbg","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:875"},{"x":"Causal.CBG.flat_cbg_ett","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:920"}],"extra":{}}],"extra":{}},{"label":"mghdlem:IsoConnected","ref":"Lemma 3.1","ledger":{"kind":"lemma","number":"","title":"","file":"Maximal_GHD2.tex","line":437,"proof":"Maximal_GHD2.tex:442","nl":"proved","lean":"partial","decls":["Causal.CBG.IsRigidFor","Causal.CBG.IsCGHD.eqOn"],"deps":[],"tex":"\\begin{lemma}\n\nLet \\((M,g)\\) and \\((M',g')\\) be Lorentzian manifolds, where \\(M\\) is connected. Furthermore, let \\(\\psi_1, \\psi_2 : M \\to M'\\) be two isometric immersions with \\(\\psi_1(p) = \\psi_2(p)\\) and \\(d\\psi_1 (p) = d\\psi_2(p)\\) for some \\(p \\in M\\). It then follows that \\(\\psi_1 = \\psi_2\\).\n\\end{lemma}"},"ett":[{"x":"Causal.CBG.IsRigidFor","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:197"},{"x":"Causal.CBG.IsCGHD.eqOn","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:259"}],"loc":["rigid"],"open":[],"open_reason":"","note":"Lemma 3.1 (Maximal_GHD2.tex:437). Layer 3 for smooth-vacuum (geodesics in normal neighbourhoods); its ETT role is A1, the ladder node `rigid` (Causal.CBG.IsRigidFor), consumed by the gluing step IsCGHD.eqOn (the ladder's consequence at rigid). Rigidity is essential: without it maximal common sub-extensions are not unique (Causal.CBG.causal_pgcd_not_unique, the kink on the timelike line) and causal local isomorphisms are not rigid (Causal.CBG.not_isRigidFor_causalPreGeometry).","geo":[{"model":"smooth-vacuum","proves":["rigid"],"by":[{"x":"T-loc-vacuum-rigid-germ","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["rigid"],"by":[{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243"}],"extra":{}}],"extra":{}},{"label":"mghdcor:welldefined","ref":"Cor 3.2","ledger":{"kind":"corollary","number":"","title":"","file":"Maximal_GHD2.tex","line":452,"proof":"Maximal_GHD2.tex:459","nl":"proved","lean":"partial","decls":["Causal.CBG.IsCGHD.eqOn","Causal.IsCauchyEmbedding.c_ext_connexe_of_connectedSpace"],"deps":["mghdlem:IsoConnected"],"tex":"\\begin{corollary}\n\nLet \\((M,g)\\) be a globally hyperbolic, time oriented Lorentzian manifold with Cauchy surface \\(\\Sigma\\) and \\((M',g')\\) another time oriented Lorentzian manifold. Moreover, say \\(U_1, U_2 \\subseteq M\\) are open and globally hyperbolic with Cauchy surface \\(\\Sigma\\), and \\(\\psi_i : U_i \\to M'\\), \\(i=1,2\\), are time orientation preserving isometric immersions that agree on \\(\\Sigma\\).\n\nThen \\(\\psi_1\\) and \\(\\psi_2\\) agree on \\(U_1 \\cap U_2\\).\n\\end{corollary}"},"ett":[{"x":"Causal.CBG.IsCGHD.eqOn","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:259"},{"x":"Causal.IsCauchyEmbedding.c_ext_connexe_of_connectedSpace","t":"lean","loc":"lean-causal/Causal/CBG/CausalConvex.lean:758"}],"loc":["rigid","curves_extend"],"open":[],"open_reason":"","note":"Cor 3.2 (Maximal_GHD2.tex:452). Agreement on Σ propagates to U₁ ∩ U₂ by rigidity on a CONNECTED open: U₁ ∩ U₂ is connected because both Cauchy-include Σ in one M (lem:C_ext_connexe re-routed, c_ext_connexe_of_connectedSpace, the ladder's consequence at curves_extend, asked of the target; ETT-layer in Causal.CBG.CausalConvex since T-abs-hoist-time-function). That connectedness is exactly what fails on a fixed background (ERS19 §4.2, Thm 3.45; papers/ers-predictability).","geo":[{"model":"smooth-vacuum","proves":["rigid","curves_extend"],"by":[{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-smooth-causal-ladder","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["rigid","curves_extend"],"by":[{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395"}],"extra":{}}],"extra":{}},{"label":"mghdlem:IsoDiffeo","ref":"Lemma 3.3","ledger":{"kind":"lemma","number":"","title":"","file":"Maximal_GHD2.tex","line":463,"proof" erski's notion verbatim is IsCorrespondingBoundaryPair; (p, p') is in the closure of the graph of ψ (forall_nhds_iff_mem_closure_graph); with X, Y Hausdorff, [p] and [p'] are distinct and not separated in the gluing (isCorrespondingBoundaryPair_iff); the gluing is Hausdorff iff there is no such pair. In the CGHD setting it is ETT's C (corresponds_iff_mem_gluingC, ETT-layer in Causal.CorrespondingPoints since T-abs-hoist-cbg-cores). The set of corresponding pairs is closed with no hypothesis (Causal.Gluing.isClosed_correspondingPairs); Chruściel's 'H closed' is false as topology (OQ-40).","geo":[],"extra":{}},{"label":"mghdthm:NotMCGHD","ref":"Thm 3.6","ledger":{"kind":"theorem","number":"","title":"","file":"Maximal_GHD2.tex","line":537,"proof":"Maximal_GHD2.tex:662","nl":"proved","lean":"partial","decls":["Causal.CBG.IsCGHD.exists_lt","Causal.CBG.CGHDData.exists_extension"],"deps":["mghdlem:SpacelikePoint","mghdlem:ExtendIso","mghdlem:FuturePoint","mghdthm:LocalTheory","mghdcor:welldefined","mghdlem:IsoConnected"],"tex":"\\begin{theorem}\n\nLet \\(M\\) and \\(M'\\) be GHDs of the same initial data, and say \\(U\\) is a CGHD of \\(M\\) and \\(M'\\). If there are corresponding boundary points of \\(U\\) in \\(M\\) and \\(M'\\), then there exists a strictly larger extension of \\(U\\) that is also a CGHD of \\(M\\) and \\(M'\\). In particular, \\(U\\) is not the MCGHD of \\(M\\) and \\(M'\\).\n\\end{theorem}"},"ett":[{"x":"Causal.CBG.IsCGHD.exists_lt","t":"lean","loc":"lean-causal/Causal/CBG/NoCorresponding.lean:545"},{"x":"Causal.CBG.CGHDData.exists_extension","t":"lean","loc":"lean-causal/Causal/CBG/NoCorresponding.lean:396"}],"loc":["absolutely_minimal","causally_arc_connected","push_up","tarentin","germ_extension","cauchy_slice","time_function","curves_extend"],"open":[],"open_reason":"","note":"Thm 3.6 (Maximal_GHD2.tex:537, proof 662–702). A strictly larger CGHD from Lemma 3.9's spacelike point, A3 (germ_extension) and A4 (cauchy_slice) — the ladder's consequence at cauchy_slice (CGHDData.exists_extension); Sbierski's convex neighbourhood with V ∩ ∂U ⊆ C is not needed (one germ on O ∋ p). The τ_q construction (time separation, Gauss lemma) is the smooth-vacuum proof of A4, not part of the ETT argument; flat-gx uses cone slices (Causal.CBG.minkowski_coneSlice).","geo":[{"model":"smooth-vacuum","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","germ_extension","cauchy_slice","time_function","curves_extend"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"},{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-vacuum-slice","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","germ_extension","cauchy_slice","time_function","curves_extend"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367"},{"x":"Causal.CBG.flat_germExtFuture","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:808"},{"x":"Causal.CBG.flat_germExtPast","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:832"},{"x":"Causal.CBG.flat_germ_future","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:605"},{"x":"Causal.CBG.flat_slice_future","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:512"},{"x":"Causal.CBG.flat_slice_past","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:546"},{"x":"Causal.CBG.minkowski_coneSlice","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:204"},{"x":"Causal.CBG.flat_hasTimeFunction","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:403"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395"}],"extra":{}}],"extra":{}},{"label":"mghdprop:EquivCha","ref":"Prop 3.7","ledger":{"kind":"proposition","number":"","title":"","file":"Maximal_GHD2.tex","line":544,"proof":"Maximal_GHD2.tex:563","nl":"proved","lean":"partial","decls":["Causal.CBG.sbierski_prop_3_7_i_imp_ii","Causal.CBG.sbierski_prop_3_7_i_imp_ii_ladder","Causal.CBG.sbierski_prop_3_7","Causal.CBG.sbierski_prop_3_7_unique","Causal.CBG.IsCorrPair.corresponding_K","Causal.CBG.IsCorrPair.eq_of_corresponds","Causal.CBG.corresponds_of_tendsto"],"deps":["mghddef:DefBound"],"tex":"\\begin{proposition}\n\nLet \\(U\\) be a CGHD of \\(M\\) and \\(M'\\) with isometric embedding \\(\\psi : U \\subseteq M \\to M'\\).\nThe following statements are equivalent:\n\\begin{enumerate}[i)]\n\\item The points \\(p \\in \\partial U\\) and \\(p' \\in \\partial \\psi(U)\\) are corresponding boundary points.\n\\item If \\(\\gamma : (-\\varepsilon, 0) \\to U\\) is a timelike curve with \\(\\lim_{s \\nearrow 0} \\gamma(s) = p\\), then \\(\\lim_{s \\nearrow 0}  (\\psi \\circ \\gamma) (s) =p'\\).\n\\item There is a timelike curve \\(\\gamma : (-\\varepsilon, 0) \\to U\\) with \\(\\lim_{s \\nearrow 0} \\gamma(s) = p\\) such that \\(\\lim_{s \\nearrow 0}  \\psi \\circ \\gamma (s) =p'\\).\n\\end{enumerate}\nIn particular it follows from \\(ii)\\) and \\(iii)\\) that \\(p \\in \\partial U\\) has at most one corresponding boundary point.\n\\end{proposition}"},"ett":[{"x":"Causal.CBG.sbierski_prop_3_7_i_imp_ii","t":"lean","loc":"lean-causal/Causal/SbierskiProp37.lean:367"},{"x":"Causal.CBG.sbierski_prop_3_7_i_imp_ii_ladder","t":"lean","loc":"lean-causal/Causal/SbierskiProp37.lean:415"},{"x":"Causal.CBG.sbierski_prop_3_7","t":"lean","loc":"lean-causal/Causal/SbierskiProp37.lean:491"},{"x":"Causal.CBG.sbierski_prop_3_7_unique","t":"lean","loc":"lean-causal/Causal/SbierskiProp37.lean:519"},{"x":"Causal.CBG.IsCorrPair.corresponding_K","t":"lean","loc":"lean-causal/Causal/CorrespondingPoints.lean:478"},{"x":"Causal.CBG.IsCorrPair.eq_of_corresponds","t":"lean","loc":"lean-causal/Causal/CorrespondingPoints.lean:453"},{"x":"Causal.CBG.corresponds_of_tendsto","t":"lean","loc":"lean-causal/Causal/CorrespondingPoints.lean:593"}],"loc":["push_up","tarentin","causally_arc_connected"],"open":[],"open_reason":"","note":"Prop 3.7 (Maximal_GHD2.tex:544, proof 563–581), rebound 2026-11-21 after T-abs-sbierski-prop-3-7 (48d1cf0). (i) ⇒ (ii) is Causal.CBG.sbierski_prop_3_7_i_imp_ii (Causal.SbierskiProp37, ETT layer): Sbierski's route — the curve's points ≪ the corresponding point by push-up and closed J⁺, strong causality of the target, a causally convex V — for every timelike curve of U ending at p, future or past, from the KSide calculus, with NO A3 (kb/0071); its ladder-only form sbierski_prop_3_7_i_imp_ii_ladder asks push-up, GH and tarentin of both spacetimes and causal arc-connectedness of the target (Hausdorff). Strong causality, which Sbierski uses, follows from GH + tarentin (Causal.Causality.GloballyHyperbolic.stronglyCausal); GH and the KSide facts come from the CGHD setting (CGHDData.isCorrPair, kSide_future, kSide_past), not from a localisation. The equivalence (sbierski_prop_3_7, future and past sides) and 'at most one corresponding point' (sbierski_prop_3_7_unique) add (ii) ⇒ (iii), which needs a timelike curve of U ending at p: M causally arc-connected and p regular; it fails at a BTZ point (Causal.CBG.lightlikeLine_sbierski_prop_3_7_iii_fails), so the label stays unmarked (OQ-65 (a): is arc-connectedness, and regularity, part of the setting? (b): is IsCorrPair + KSide + convexity the paper's CGHD setting abstracted?). (i) ⇔ the K⁻ bijection is corresponding_K; (iii) ⇒ (i) corresponds_of_tendsto; uniqueness also eq_of_corresponds — CAUSAL, not topological (Causal.Gluing.shearGluing_not_unique refutes it for bare gluings, OQ-40). The A3 route of before, Causal.CBG.CGHDData.tendsto_comp (Causal.CBG.Corresponding, over the CBG geometry), is no longer this row's ETT theorem. causally_arc_connected enters with the ladder form and the equivalence; the smooth model has it, and Sing = ∅ there, so every point is regular.","geo":[{"model":"smooth-vacuum","proves":["push_up","tarentin","causally_arc_connected"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["push_up","tarentin","causally nder cites TwoPiece.globallyHyperbolic, ManyPiece.globallyHyperbolic), the master rebuilds the ledgers whose Lean root moved. Re-checked 2026-11-21 (planning run after wave 15): settles no ladder pair (a hoist); line references current (Causal/CBG/Ppcm.lean:640, imports :1–2; Causal/CBG/Maximal.lean imports :1–4; Causal/CBG/Corresponding.lean:431; Causal/CBG/NoCorresponding.lean:178–188).","added":"2026-11-21","proposed_by":"programme-planner (binder sbierski-mghd)"},{"id":"T-abs-hoist-cbg-geometry","title":"The CBG interface in the ETT layer: Causal.CBG.Geometry (A1–A4 over abstract structures), Dev, Bound, Pgcd, and the CBG sections of Ppcm and Maximal, so that layer-1 theorems may use cbg, exists_common_extension and maxDev_isUniversal","stream":"abstract","kind":"abstract","uses":["rigid","germ_extension","cauchy_slice","curves_extend","time_function","absolutely_minimal","causally_arc_connected","push_up","tarentin"],"package":"lean-causal","exclusive":true,"status":"needs-ruling","owner":"closer","priority":6,"depends":["T-abs-hoist-cbg-cores","T-abs-hoist-time-function"],"question":"Causal.CBG.Geometry's A2 field asks every admissible structure's causality to satisfy SingularFlatAxioms (field singularFlatAxioms, Causal/CBG/Geometry.lean:297–298; the module imports Causal.SingularFlat, which imports only ETT-layer modules and no metric, but is on the layer-1 rule's forbidden list, .claude/skills/ett-programme/SKILL.md §3 and tools/ladder.py MODEL_LAYER). Since T-abs-hoist-time-function and T-abs-hoist-cbg-cores it is the only model-layer module that Causal.CBG.cbg reaches. For layer-1 theorems over a geometry (T-abs-cbg-initial-data; Sbierski Thms 2.7, 2.8 read as Causal.CBG.cbg), should the programme (a) admit Causal.SingularFlat (an axiom bundle, not a model) and the abstract CBG interface into the ETT layer, (b) keep it out and restate A2 with ladder properties (absolutely_minimal, causally_arc_connected, push_up, tarentin, curves_extend, time_function), changing the interface gx agreed (DEC-62–DEC-64), or (c) leave Causal.CBG outside layer 1 and state T-abs-cbg-initial-data over a bare category of developments with universal objects as hypothesis?","evidence":"Journal entry 2026-11-20 23:50: T-abs-cbg-initial-data was swapped out of the wave because it needs Causal.CBG.cbg, model-importing. Imports re-read 2026-11-21 after T-abs-hoist-time-function (7eff58c) and T-abs-hoist-cbg-cores (e4df4d0), with tools/ladder.py's import index: Causal.CBG.Maximal reaches exactly one model-layer module, Causal.SingularFlat, and none once Causal.CBG.Geometry is removed; Geometry reaches none but SingularFlat (field `sing` :286, A2 :297–298; its other imports SubExtension, CompactCauchy, PushoutCausal, GXStructure are ETT-layer). Pgcd imports CurvesExtend, Geometry, CausalConvex, Injective, of which only Geometry is not ETT-layer; Ppcm imports NoCorresponding and CausalConvex; Maximal imports Ppcm, Bound, Pgcd, FamilyGluing. T-abs-hoist-cbg-gluing is therefore not a prerequisite of this question (dropped from `depends` 2026-11-21): it moves TwoPiece and ManyPiece out from behind the interface for layer-1 use either way. Also over Causal.SingularFlat's bundles, hence bearing on the same reading: SingularFlatAxioms.causallyPlain and the BTZAxioms lemmas of T-abs-hoist-plain-locz. The layer-1 rule is the author's framing (programme/README.md: layer 1 'never imports a metric'); a reading of it is a ruling.","added":"2026-11-21","proposed_by":"programme-planner (journal 2026-11-20 23:50; binder sbierski-mghd)"},{"id":"T-abs-cbg-initial-data","title":"Developments of initial data from developments of a spacetime: define local uniqueness (any two developments of the same datum have a common Cauchy sub-development, Sbierski Thm 2.6) over a Causal.CBG.Geometry, and prove from Causal.CBG.cbg and exists_common_extension that the maximal development of any one development is universal among all developments of the datum (Sbierski Thms 2.7, 2.8 for data)","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic"],"package":"lean-causal","status":"planned","owner":"closer","priority":3,"depends":["T-abs-hoist-cbg-cores","T-abs-hoist-cbg-geometry"],"evidence":"Binder papers/sbierski-mghd (rows Thm 2.6, 2.7, 2.8, Def 2.1): Lean's CBG takes a GH spacetime M₀ as datum (Causal.CBG.Dev, `cbg`), Sbierski a Riemannian (M̄, ḡ, k̄) (Maximal_GHD2.tex:360, :403–420); two GHDs of the data share no M₀, and Thm 2.8 compares them through Thm 2.6. Argument: for N a development of the datum and M₀ the one of `cbg`, local uniqueness gives a common U; M₀ ↪ maxDev(U) makes maxDev(U) a development of M₀, so N → maxDev(U) → maxDev(M₀). The datum is read as a fixed Cauchy surface Σ with the class of its developments closed under common sub-developments; the same predicate is ERS's Prop 4.63 (papers/ers-predictability; on the fixed background the `hlocal` of Causal.Causality.ers_theorem_4_64, Causal/ErsUniqueness.lean:466). Defines the Lean predicate the keeper needs for local_uniqueness (T-lad-development-nodes). Back to planned 2026-11-21 (the layer-1 rule; journal entry 2026-11-20 23:50, where it was swapped out of the wave): Causal.CBG.cbg and exists_common_extension live in Causal.CBG.Maximal (:1093) and Ppcm (:1290). Since T-abs-hoist-time-function (7eff58c) and T-abs-hoist-cbg-cores (e4df4d0) the only model-layer module they reach is Causal.SingularFlat, through Causal.CBG.Geometry's A2 field (planner's check, 2026-11-21, tools/ladder.py's import index); T-abs-hoist-cbg-geometry asks the author about it, and this target waits on that ruling alone (refined 2026-11-21). Under its reading (c) this target is restated over a bare category of developments.","added":"2026-11-20","proposed_by":"programme-planner (binder sbierski-mghd)"},{"id":"T-abs-sbierski-prop-3-7","title":"Sbierski Prop 3.7 (i) ⇒ (ii) model-free: for a corresponding pair of a causal isomorphism between causally convex opens (IsCorrPair, KSide), every chronal curve of U ending at p is carried to a curve ending at q — from open I, closed ≤ and strong causality, not from A3","stream":"abstract","kind":"abstract","uses":["strongly_causal","globally_hyperbolic","push_up","tarentin"],"package":"lean-causal","status":"done","owner":"closer","priority":3,"depends":["T-abs-hoist-cbg-cores"],"evidence":"Sbierski 1309.7591 Prop 3.7 (Maximal_GHD2.tex:544, proof 563–581; text sbierski2013existence.txt:719). lean-causal/Causal/CBG/Corresponding.lean:92–96 (SCOPE): '… Prop 3.7 (ii) and C open in ∂U are proved from A3 … Sbierski's own proof of Prop 3.7 (ii) (timelike curves, strong causality) is not formalized'; 'Downstream warning: Sbierski proves Lemma 3.8 (= A3) from Prop 3.7 (ii)'. The binder's smooth-vacuum discharge of A3 (T-loc-vacuum-rigid-germ) follows Sbierski and needs (ii) without A3, or it is circular. The model-free (i) ⇔ K⁻-bijection and uniqueness are already proved (Causal.CBG.IsCorrPair.corresponding_K, eq_of_corresponds). Ready 2026-11-21: since T-abs-hoist-cbg-cores (e4df4d0) the whole setting is ETT-layer in Causal.CorrespondingPoints: Corresponds (:240), IsCorrPair (:279: ψ, g mutually inverse homeomorphisms between the opens U and V carrying ≤ and ≪ of M onto those of N), KSide (:291: push-up, causal, closed J±, the K⁻ calculus, compact J⁺(S) ∩ J⁻(x)), IsCorrPair.eq_of_corresponds (:453), corresponding_K (:478), corresponds_of_tendsto (:593, (iii) ⇒ (i)), and the timelike-line witnesses (:639–) for the satisfiability check. Layer 1: a new module importing Causal.CorrespondingPoints (and Causal.CorrespondingSpacelike if Lemma 3.9's core helps), no Causal.CBG.* module.","added":"2026-11-20","proposed_by":"programme-planner (binder sbierski-mghd)","commit":"48d1cf0"},{"id":"T-abs-ers-thm-4-64","title":"ERS19 Thm 4.64 skeleton: on a fixed background, two developments with a common Cauchy surface agree on U₁ ∩ U₂ when it is connected — the MCGHD V₀ as a union, a boundary point in U₁ ∩ U₂, Step 2 by exists_spacel adder.py's matrix on the ladder of 5f558c5): with its two witnesses and Causal.GateLineLocal's facts the gated line settles 1 [[open]] pair now, tarentin → causally_open, in the no-gluing reading only (time_function, tarentin → absolutely_minimal are refuted already). T-abs-one-way-membrane, absolutely minimal, would settle that pair in either reading: priority 5 → 7, and no longer a dependency of T-lad-record-no-gluing. Still of use for the gated line itself (DEC-8's witness: its time function and its tarentin property) or if the membrane is refuted.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-cbg-geometry-nodes), recorded by programme-planner"},{"id":"T-abs-dependence-domain-home","title":"The name of the model-free domain of dependence: Causal.Flat.dependenceDomain (hoisted into Causal.DependenceDomain with its Flat namespace kept) and its abbrev Causal.Causality.dependenceDomainOn (NestedCausalities)","stream":"abstract","kind":"abstract","uses":[],"package":"lean-causal","status":"needs-ruling","owner":"closer","priority":8,"depends":["T-abs-hoist-model-free"],"question":"The domain of dependence D(S) of a set in an open set, for any causality, is now model-free (Causal/DependenceDomain.lean:51) but keeps the name Causal.Flat.dependenceDomain, with Causal.Causality.dependenceDomainOn an abbrev of it (Causal/NestedCausalities.lean:305): keep both names as they are, or rename it Causal.Causality.dependenceDomain (the Flat name kept as a deprecated alias so the Barbot ledger still resolves)?","evidence":"The closer's note at T-abs-hoist-model-free (journal entry 2026-11-20 22:45: 'Flat.dependenceDomain keeps its Flat namespace (a Causality-namespace alias is the author's call)'); Causal/DependenceDomain.lean SCOPE ('The names keep their namespace Causal.Flat, so that every user resolves unchanged'). The same note records that futureExtensible_of_final_on and not_futureExtensible_of_component_on (Causal/NestedCausalities.lean:652, :792) now have no us  is not open while {⋆} is (not causally open in the past); J⁺_U(V) of an open V is its line part, open as on the timelike line, plus possibly the isolated point ⋆ (causally open in the future); in an open set of the line, or in {⋆}, the relations are the timelike line's or trivial (local push-up, local causal openness on both sides). The [[open]] entry causally_arc_connected → push_up (programme/ladder.toml:1030–1033) already argues the push-up part. What the keeper gets: locally_push_up ⇏ push_up (causal arc-connectedness cannot be dropped from lem:pushup_local, ETT.tex:557), causally_open_future ⇏ causally_open, locally_causally_open ⇏ causally_open, globally_hyperbolic, is_causal, curves_extend ⇏ push_up, globally_hyperbolic ⇏ causally_open. DEC-8 (registers/DECISIONS.md:19) ruled def:causally_open_spacetime_open (ETT.tex:694) two-sided; this target proves or refutes on the gated line that the printed J⁺-only form is strictly weaker, and reports the outcome as a finding: it takes no reading. If some J⁺_U(V) fails to be open, the closer gives that counterexample instead. Layer 1: a new ETT-layer module importing CBG.CausalConvex (ETT-layer since T-abs-hoist-time-function, 7eff58c) and LadderLocal, not the file of T-abs-gateline-witnesses.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-local-nodes, T-lad-gh-causal), recorded by programme-planner","commit":"d41b625"},{"id":"T-abs-doubled-line-compact","title":"The doubled line is causally compact and not causal (doubledLine_causallyCompact: each J_M(p, q) is closed in [p.1, q.1] × Bool), conjoined with its push-up, tarentin and two-sided causal openness where they hold, and with not absolutely minimal (over the cover by the two sheets only the diagonal is generated), no chronal neighbours and not causally plain (≪ empty); and one conjoined witness for the lightlike line (causally arc-connected, absolutely minimal, tarentin, causal, push-up, causally open, globally hyperbolic, without chronal neighbours, not causally plain)","stream":"abstract","kind":"abstract","uses":["causally_compact","is_causal","push_up","tarentin","causally_open","causally_arc_connected","absolutely_minimal","globally_hyperbolic","chronal_neighbours","causally_plain"],"package":"lean-causal","status":"dropped","owner":"closer","priority":5,"depends":["T-abs-causal-iso-invariance","T-lad-gh-causal"],"evidence":"Dropped 2026-11-21 (planning run after wave 15; the keeper's finding at T-lad-record-minimal, journal entry 08:37): it settles no ladder pair in either reading, so neither the target nor a re-scope of it has work left. Simulated with tools/ladder.py's matrix on the ladder of 5f558c5: the doubled line with every conjunct of the title (causally compact, push-up, tarentin, causally open; not causal, not absolutely minimal, no chronal neighbours, not plain) settles 0 of the 51 [[open]] entries. The flat time cylinder and the timelike circle (Causal.Flat.timeCylinder_separates, timeCylinder_zero_separates; programme/ladder.toml:1433–1446), absolutely minimal, refute causally_compact ⇒ is_causal and everything the doubled line's ¬ is_causal carried, in either reading of defi:causalite, where the doubled line, not absolutely minimal, would refute them in the no-gluing reading only; the second half (one conjoined witness for the lightlike line) is moot since T-lad-record-minimal re-pointed those entries to Causal.lightlikeLine_separates_Z (Causal/ChronalTarentin.lean:246). Not re-scoped: a non-minimal model can only give no-gluing separations, and every pair the doubled line could still refute is refuted. Causal.doubledLine and doubledLine_not_isCausal (Causal/CausalIsoInvariance.lean) stay as they are; the ladder's models comment that names this target (programme/ladder.toml:2017–2019) is the keeper's to refresh (T-lad-record-dual-vee). History: The keeper's proposal at T-lad-gh-causal (journal entry 2026-11-21 01:30: 'doubledLine_causallyCompact (settles causally_compact ⇏ is_causal, GH, SC, SCO, time_function)'; its report: the diamond J_⊤(p, q) is Icc p.1 q.1 ×ˢ univ, so isCompact_Icc.prod isCompact_univ should do; with ¬ doubledLine.IsCausal it is the witness). Causal.doubledLine (Causal/CausalIsoInvariance.lean:911, ETT layer: p ≤_U q iff p = q ∈ U, or p.1 ≤ q.1 and the fibres over [p.1, q.1] lie in U; no chronology), Causal.doubledLine_not_isCausal (:957); Hausdorff and second countable (ℝ × Bool). It replaces the two [[open]] entries causally_compact → is_causal, → globally_hyperbolic (programme/ladder.toml:1070–1084) and through the closure refutes causally_compact ⇒ strongly_causal, strongly_causal_open, time_function. The further conjuncts are the planner's reading, argued, for the closer to prove or drop: ≪ is empty, so push-up holds vacuously; J_M(p, q) contains ]p.1, q.1[ × Bool, so every point lies inside a small diamond (tarentin); J±_U(V) of an open V is open, fibrewise as on the timelike line (causal openness, both sides). If they hold they also refute push_up, tarentin, causally_open ⇒ is_causal (and ⇒ time_function, through time_function ⇒ is_causal). The lightlike line (the keeper's optional proposal, T-lad-local-nodes report, journal entry 2026-11-21 00:50): its ladder entries use split witnesses (ladder.toml:563–578, :653–663) whose halves are Causal.lightlikeLine_causallyArcConnected (Causal/LocateExtension.lean:659), lightlikeLine_absolutelyMinimal (Causal/DeuxPushup.lean:235), lightlikeLine_isCausal (Causal/PushUp.lean:480), lightlikeLine_pushUp (Causal/Lines.lean:335), lightlikeLine_causallyOpen, lightlikeLine_globallyHyperbolic, lightlikeLine_not_chronalNeighbours (Causal/LadderLocal.lean:544, :548, :539), lightlikeLine_not_causallyPlain (Causal/Lines.lean:303) and lightlikeLine_tarentin (Causal/Remarks/Tarentin.lean:416), the last in a module that imports Causal.SingularFlat: re-prove it (J(p, q) = [p, q], as for Causal.timelikeLine_tarentin, Causal/Lines.lean:177) rather than import it. Layer 1: one new module importing only ETT-layer modules (CausalIsoInvariance, LadderLocal, LocateExtension, DeuxPushup). The keeper records the [[fails]] entries and may switch the split witnesses afterwards (T-lad-plain-separations can land first with the split ones). Widened 2026-11-21 (the keeper's 'doubled line widened (45)', journal entry 05:00; its [[open]] notes ask Causal.doubledLine_not_absolutelyMinimal, e.g. causally_open → absolutely_minimal, push_up → absolutely_minimal): with ¬ AbsolutelyMinimal (each sheet ℝ × {b} is open and carries only the diagonal, since a relation needs both fibres over [p.1, q.1]; as timelikeLineTop_not_absolutelyMinimal, Causal/Morphism.lean:754) and ¬ ChronalNeighbours, ¬ CausallyPlain (≪ empty, and J⁺ of a non-empty open set has interior), the doubled line settles 45 [[open]] pairs alone, 35 beyond T-lad-record-lines (simulated with tools/ladder.py's refuted(), no contradiction); ¬ is_causal carries 33 of the 35. Reading: the doubled line is not absolutely minimal, so its separations hold in the no-gluing reading only (kb/0014; OQ-18, OQ-67 (b)); priority 4 → 5, behind this plan's absolutely minimal witnesses (T-abs-dec8-minimal-witness, T-loc-flat-time-cylinder, T-abs-rational-line-extras), which settle most of the same pairs in either reading. The keeper's recording is T-lad-record-no-gluing.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-gh-causal, T-lad-local-nodes), recorded by programme-planner"},{"id":"T-abs-hoist-plain-locz","title":"Hoist the model-free causal-plainness criterion of Causal.Port.E0ModelRows into the ETT layer, same full names: E0LM.LocZplus, LocZminus, LocTarentin, LocNoPast, LocPastIn with rel_of_causallyConvex, locZplus_of, locZminus_of, locTarentin_of (Causal.Port.E0SingularFlat's section Local), Causality.Jplus_subset_closure_Iplus_of_locZplus, Jminus_diff_subset_closure_Iminus_of_locZminus, causallyPlain_of_locZ; add the ladder form PushUp.causallyPlain_of_chronalNeighbours (push_up ∧ chronal_neighbours ⇒ causally_plain); and move SingularFlatAxioms.causallyPlain and BTZAxioms.Jminus_diff_nonempty, Kminus_ne_Iminus, K_neq_I out of the Port, beside Causal.SingularFlat","stream":"abstract","kind":"abstract","uses":["push_up","chronal_neighbours","causally_plain","causally_arc_connected","strongly_causal","tarentin"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-ladder-local-defs"],"evidence":"/atlas-team's T-ett-e0-model-rows (journal entry 2026-11-21 01:30: 'E0ModelRows' model-free theorems (causallyPlain_of_locZ, SingularFlatAxioms.causallyPlain — evidence for OQ-16, rem:pas_plat —, BTZAxioms.K_neq_I) to hoist (its kb 0061, 0064)'); its audit AUDIT-1 minor flagged the layer placement (papers/ett/certificate/curation.toml:502, :1228: 'the model-free BTZAxioms.*, causallyPlain_of_locZ and SingularFlatAxioms.causallyPlain sit behind the E₀ import, to hoist into the ETT layer'); lean-causal/kb/entries/0064-causally-plain-of-locz.md, 0061-stranded-model-free-lemmas.md ('Hoist them on demand, not inside a port'). Declarations: Causal/Port/E0SingularFlat.lean:304–380 (namespace E0LM, section Local, any topological space X and causality D: LocZplus :309, LocZminus :313, LocTarentin :317, LocNoPast :321, LocPastIn :325, rel_of_causallyConvex :332, locZplus_of :352, locZminus_of :360, locTarentin_of :368; the E₀ instances after :384 stay); Causal/Port/E0ModelRows.lean:107–143 (Jplus_subset_closure_Iplus_of_locZplus :107, Jminus_diff_subset_closure_Iminus_of_locZminus :116, causallyPlain_of_locZ :127, SingularFlatAxioms.causallyPlain :139) and :81–104 (BTZAxioms.Jminus_diff_nonempty :81, Kminus_ne_Iminus :89, K_neq_I :100). The ladder form, the planner's argument for the closer to check: ChronalNeighbours (Causal/LadderLocal.lean:163) gives LocZplus C and LocZminus C ∅ directly — for y ∈ W and N ∈ 𝓝 y apply it in the open W ⊓ interior N and carry the chronology to W by the axiom lt_mono — and interior ∅ = ∅, so causallyPlain_of_locZ gives push_up ∧ chronal_neighbours ⇒ causally_plain, the first implication into causally_plain, beside push_up ∧ chronal_neighbours ⇒ causally_open (programme/ladder.toml:368–372); consistent with the lightlike line (push-up, no chronal neighbours, not plain) and deuxPushup (plain, not push-up). Layers: the E0LM block and the three Causality lemmas go to a new ETT-layer module (by name they need only Causal.PushUp, Causal.Properties, Causal.ArcConnected and Causal.LadderLocal); SingularFlatAxioms.causallyPlain and the BTZAxioms lemmas are stated over Causal.SingularFlat's bundles, which the layer-1 rule forbids (tools/ladder.py MODEL_LAYER), so they only leave the Port, for a module importing Causal.SingularFlat and the new module and no Causal.Port.* (whether that is layer 1 is T-abs-hoist-cbg-geometry's question (a)). Evidence for OQ-16 (registers/DECISIONS.md:172: are E≥0-manifolds causally plain, as prop:K_calcul's route through prop:tarentin_fort_K assumes?) and for rem:pas_plat (ETT.tex:289): every strongly causal SingularFlatAxioms spacetime is causally plain (SingularFlatAxioms.causallyPlain), and E₀ is (Causal.E0.causallyPlain, E0ModelRows.lean:189); recorded here, not a ruling. Discipline as T-abs-hoist-model-free (02b43b6): no statement changes, same full names (E0LM's namespace kept, as Flat.dependenceDomain kept Flat's; a rename is T-abs-dependence-domain-home's kind of question), the two Port modules import the new ones; the ett curation's extra_lean_files name Causal/Port/E0ModelRows.lean and Causal/Port/E0SingularFlat.lean (papers/ett/certificate/curation.toml:496, :867, :1223; papers/ett is /atlas-team's), which the master updates with the ledgers. Not exclusive: only Causal.lean and E0ModelRows import E0SingularFlat, only Causal.lean imports E0ModelRows (checked 2026-11-21); the closer leases both files. The keeper records the edge afterwards.","added":"2026-11-21","proposed_by":"target-auditor (T-ett-e0-model-rows, /atlas-team; kb 0061, 0064), recorded by programme-planner","commit":"e278e3a"},{"id":"T-abs-dec8-minimal-witness","title":"An absolutely minimal causality causally open in the future and not in the past (the auditor's sketch in OQ-67): on ℝ, x ≤_U y iff x = y ∈ U, or 0 ≤ x ≤ y and [x, y] ⊆ U; ≪ empty — absolutely minimal (and causally arc-connected), causally open in the future, J⁻((1, 2)) = [0, 2) not open, so that the printed J⁺-only causal openness is strictly weaker than DEC-8's two-sided one in either reading of defi:causalite — proved, or refuted","stream":"abstract","kind":"abstract","uses":["absolutely_minimal","causally_arc_connected","causally_open_future","locally_causally_open_future","causally_open","locally_causally_open","push_up","is_causal","globally_hyperbolic","strongly_causal_open","time_function","tarentin","chronal_neighbours","causally_plain"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-gateline-local"],"evidence":"OQ-67 (registers/DECISIONS.md:223): the gated line (Causal.GateLineLocal, T-abs-gateline-local, d41b625) shows DEC-8's ± (DEC-8, registers/DECISIONS.md:19; def:causally_open_spacetime_open, ETT.tex:694–697) to be a strict strengthening only in the library's reading without gluing, being not absolutely minimal; 'an absolutely minimal witness (an auditor's sketch on ℝ: x ≤_U y iff x = y ∈ U or 0 ≤ x ≤ y with [x, y] ⊆ U, ≪ empty) is argued, not in Lean' (T-abs-gateline-local's audit, journal entry 2026-11-21 05:00; kb/0073: 'for a separation valid in both readings, look for an absolutely minimal witness'). The planner's reading of the sketch, for the closer to prove or refute: a causality (le_trans by [x, y] ∪ [y, z] = [x, z]; le_mono as for Causal.rationalLine, Causal/NestedConverse.lean:250, of which it is the half-line variant with every point of [0, ∞) in place of the rationals); causally arc-connected (a causal curve from a negative point is constant, being locally constant where it is negative; on [0, ∞) the affine curve, as on the timelike line), hence absolutely minimal by Causal.Causality.CausallyArcConnected.absolutelyMinimal; if arc-connectedness fails, absolute minimality directly, as rationalLine_absolutelyMinimal (:303) does; causally open in the future (J⁺_U(V) = V ∪ {y : ∃ x ∈ V, 0 ≤ x ≤ y, [x, y] ⊆ U}, open since U is); not causally open (J⁻_ℝ((1, 2)) = [0, 2)), hence not locally causally open (AbsolutelyMinimal.causallyOpen_of_locallyCausallyOpen, Causal/LadderLocal.lean:296) though locally causally open in the future; causal, globally hyperbolic (every diamond [x, y] or a point), strongly causal in the open form (intervals are causally convex), a time function (the identity), push-up (≪ empty), not tarentin (no diamond has interior at a negative point), no chronal neighbours, not causally plain. One conjoined theorem for the keeper. Simulated with tools/ladder.py's refuted(): 22 [[open]] pairs alone, 14 beyond T-lad-record-lines, no contradiction; among them causally_arc_connected → causally_open, for which the ladder has no model (its note, programme/ladder.toml:1426–1429), and causally_open_future ⇏ causally_open by an absolutely minimal witness, i.e. the DEC-8 separation in either reading (OQ-18). The closer reports the outcome as a finding for the master's OQ-67 row (its (a): if proved, the ± changes the notion among absolutely minimal causalities too); the target takes no reading. Layer 1: a new ETT-layer module importing Causal.LadderLocal, Causal.ArcConnected, Causal.CurvesExtend (Causal.NestedConverse for the rational line's pattern), no model. The keeper's recording is T-lad-record-minimal.","added":"2026-11-21","proposed_by":"target-auditor (T-abs-gateline-local; OQ-67), recorded by programme-planner","commit":"175fb94"},{"id":"T-abs-pushup-of-minimal-local","title":"Local push-up gives push-up under absolute minimality on a T1 space (the auditor's claim at T-abs-gateline-local): AbsolutelyMinimal.pushUp_of_locallyPushUp, a new edge absolutely_minimal ∧ locally_push_up ⇒ push_up (standing T1) that weakens lem:pushup_local's causal arc-connectedness to absolute minimality — proved, or refuted by a T1, absolutely minimal, locally push-up causality without push-up","stream":"abstract","kind":"abstract","uses":["absolutely_minimal","locally_push_up","push_up","causally_arc_connected"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-ladder-local-defs"],"evidence":"The auditor's remark in T-abs-gateline-local's audit (journal entry 2026-11-21 05:00: 'on a T1 space, absolute minimality plus local push-up seems to give push-up'). The ladder has the arc-connected form, Causal.Causality.CausallyArcConnected.pushUp_of_locallyPushUp (Causal/LadderLocal.lean:231; lem:pushup_local, ETT.tex:557), and two absolutely minimal edges of the same shape, AbsolutelyMinimal.causallyOpenFuture_of_locallyCausallyOpenFuture and .causallyOpen_of_locallyCausallyOpen (:264, :296). The planner's sketch, for the closer: absolute minimality (Causal/Generated.lean:247) makes ≤_U and ≪_U the transitive closures of the local relations over ANY cover, ≪ through ≪-steps only (Precausality.generated, :109–112). For x ≪_U y ≤_U z, expand y ≤_U z over the cover by push-up neighbourhoods W_b (LocallyPushUp, Causal/LadderLocal.lean:140): y = b₀ ≤ b₁ ≤ … ≤ bₙ = z, each step b_{i−1} ≤_{U ⊓ W_i} b_i. Induction on i: given x ≪_U b_{i−1}, expand it over the two-set cover {W_i, M ∖ {b_{i−1}}}, open by T1; its last step a ≪_{U ⊓ O} b_{i−1} has b_{i−1} ∈ O, so O = W_i, and push-up in W_i gives a ≪_{U ⊓ W_i} b_i, hence x ≪_U b_i. The other clause (x ≤_U y ≪_U z) is the dual, or the same induction from the right. If it holds: the edge, through which causally_arc_connected ∧ locally_push_up ⇒ push_up follows via causally_arc_connected ⇒ absolutely_minimal (the old edge stays: it asks no T1); and, with AbsolutelyMinimal.causallyOpen_of_locallyCausallyOpen, under the gluing reading of defi:causalite (every causality absolutely minimal, OQ-18) the local and global forms of push-up and of causal openness coincide on T1 spaces, which is why the gated line separates them only without gluing (kb/0073): a finding for OQ-67 (b), the master's to record. Consistent with every recorded counterexample (simulated with tools/ladder.py: no contradiction; no model of the ladder is absolutely minimal, locally push-up and not push-up). If it fails, the counterexample is the finding, a [[fails]] entry. Layer 1: a new ETT-layer module importing Causal.LadderLocal and Causal.Generated. The keeper's recording is T-lad-record-minimal.","added":"2026-11-21","proposed_by":"target-auditor (T-abs-gateline-local), recorded by programme-planner","commit":"4e06808"},{"id":"T-abs-chronal-neighbours-tarentin","title":"Chronal neighbours give the tarentin property (ChronalNeighbours.tarentin): for N ∈ 𝓝 x and V = interior N, p ≪_V x ≪_V p' with p, p' ∈ V, and I⁺_V(p) ∩ I⁻_V(p') is an open neighbourhood of x inside J_M(p, p') — a new edge chronal_neighbours ⇒ tarentin","stream":"abstract","kind":"abstract","uses":["chronal_neighbours","tarentin"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-ladder-local-defs"],"evidence":"The keeper's [[open]] entry chronal_neighbours → tarentin, 'True, argued' (T-lad-classify-core, 52b8b45: 'for N ∈ 𝓝 x put V = Int N; chronal neighbours give p ≪_V x ≪_V p' with p, p' ∈ V, and I⁺_V(p) ∩ I⁻_V(p') is an open neighbourhood of x inside J_M(p, p'). Wants Causal.Causality.ChronalNeighbours.tarentin'), on its list for the planner (journal entry 2026-11-21 05:00: 'ChronalNeighbours.tarentin (a new edge)'). Definitions: Causal.Causality.ChronalNeighbours (Causal/LadderLocal.lean:163, chronology in every open V), Tarentin (Causal/Properties.lean:116: ∀ x, ∀ U ∈ 𝓝 x, ∃ p ∈ U, ∃ q ∈ U, x ∈ openDiamond ⊤ p q); the openness of I±_V(p) is an axiom of a causality (isOpen_lt_right, isOpen_lt_left) and le_mono carries J_V into J_M. Consistent with the recorded counterexamples (simulated: me-function (7eff58c): no statement changes, same full names; exclusive in lean-causal, since it edits LemmaKSC, LemmaKObstruction and LevinUtility, which Causal.LemmaK, LemmaKSCLocal and their users import. Layer 1.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-classify-core, T-tool-ladder-py), recorded by programme-planner","commit":"ad07121"},{"id":"T-abs-rational-line-extras","title":"The rational line's other properties: a time function (the identity) and open strong causality (intervals are causally convex); not locally causally open in the future (absolute minimality with ¬ causally_open_future), not tarentin, not causally plain, without chronal neighbours, not causally compact (J(p, q) = ℚ ∩ [p, q]); conjoined with rationalLine_separates_absolutelyMinimal","stream":"abstract","kind":"abstract","uses":["absolutely_minimal","is_causal","push_up","time_function","strongly_causal_open","locally_causally_open_future","causally_open_future","tarentin","causally_plain","chronal_neighbours","causally_compact"],"package":"lean-causal","status":"done","owner":"closer","priority":5,"depends":["T-abs-nested-converse"],"evidence":"The keeper's list (journal entry 2026-11-21 05:00: 'rational-line extras (27)'); its [[open]] notes ask Causal.rationalLine_hasTimeFunction, rationalLine_stronglyCausalOpen, rationalLine_not_locallyCausallyOpenFuture (programme/ladder.toml, e.g. strongly_causal → causally_arc_connected, time_function → causally_open). Causal.rationalLine (Causal/NestedConverse.lean:250: x ≤_U y iff x = y ∈ U, or x < y both rational with [x, y] ⊆ U; ≪ empty): absolutely minimal, causal, push-up, not causally arc-connected, not causally open in the future (:303, :357, :366, :353, :373; conjoined :394); kb/0069. Argued, for the closer: the identity is continuous and strictly increasing along ≤; an interval V ⊆ U is causally convex (J_⊤(p, q) ⊆ [p, q]); ¬ LocallyCausallyOpenFuture from AbsolutelyMinimal.causallyOpenFuture_of_locallyCausallyOpenFuture (Causal/LadderLocal.lean:264), the backward reading the ladder header describes (programme/ladder.toml:75–78) and T-tool-ladder-py-2 would give the tool: all 16 pairs this target adds beyond T-lad-record-lines go through it (simulated), so the Lean and the tool agree; ¬ Tarentin (each J_⊤(p, q) ⊆ ℚ has empty interior [corrected 2026-11-21: J_⊤(p, q) ⊆ ℚ ∪ {p}, which still has empty interior; journal entry 06:50]); ¬ CausallyPlain and ¬ ChronalNeighbours (≪ empty, J⁺ of a non-empty open set has interior); ¬ CausallyCompact (ℚ ∩ [p, q] is not closed). Simulated with tools/ladder.py's refuted(): 27 [[open]] pairs alone, 16 beyond T-lad-record-lines, no contradiction. The rational line is absolutely minimal in Lean: these separations hold in either reading of defi:causalite (OQ-18). Layer 1: a new ETT-layer module importing Causal.NestedConverse, Causal.LadderLocal, Causal.CurvesExtend. The keeper's recording is T-lad-record-minimal.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-classify-core), recorded by programme-planner","commit":"b50f7be"},{"id":"T-abs-timelike-line-top","title":"The total timelike line's ladder facts (Causal.timelikeLineTop: ≤_ℝ total, ≤_U and ≪ the timelike line's on every U ≠ ℝ): causally open, chronal neighbours, locally push-up, tarentin; not push-up (0 ≪ 1 ≤ −5), not causally plain, not causally compact; conjoined with timelikeLineTop_not_isCausal and _not_absolutelyMinimal","stream":"abstract","kind":"abstract","uses":["causally_open","chronal_neighbours","locally_push_up","tarentin","push_up","causally_plain","causally_compact","is_causal","absolutely_minimal"],"package":"lean-causal","status":"ready","owner":"closer","priority":7,"depends":["T-abs-ladder-local-defs"],"evidence":"The keeper's list (journal entry 2026-11-21 05:00: 'timelike-line-top (49 pairs)'); its [[open]] notes ask Causal.timelikeLineTop_causallyOpen, _chronalNeighbours, _locallyPushUp, _tarentin, _not_pushUp, _not_causallyPlain (programme/ladder.toml, e.g. cau ord-no-gluing; its title's facts stay true and cheap, for the disclosed pathological witness's own sake.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-classify-core), recorded by programme-planner"},{"id":"T-abs-galileo-ladder","title":"Galileo's spacetime in the ladder (Causal.galileo n, n ≥ 1): chronal neighbours, push-up, causally open, causally plain, tarentin, a time function (t); not absolutely minimal (a U-shaped open set relates two points that no time-increasing chain of small balls joins), not causally compact (the full diamond is a slab, galileoOn_diamond_top); conjoined with galileoOn_isCausal and galileo_not_stronglyCausal","stream":"abstract","kind":"abstract","uses":["is_causal","strongly_causal","chronal_neighbours","causally_plain","time_function","push_up","causally_open","tarentin","absolutely_minimal","causally_compact"],"package":"lean-causal","status":"ready","owner":"closer","priority":6,"depends":["T-abs-ladder-local-defs","T-abs-hoist-time-function"],"evidence":"The keeper's list (journal entry 2026-11-21 05:00: 'Galileo ladder facts (40)'); its [[open]] notes ask Causal.galileoOn_chronalNeighbours, galileoOn_causallyPlain, galileoOn_hasTimeFunction, galileo_not_absolutelyMinimal, galileo_not_causallyCompact (programme/ladder.toml, e.g. chronal_neighbours → absolutely_minimal, causally_plain → causally_compact). Causal.galileoOn (Causal/Galileo.lean:132, ETT layer: p ≪_U q iff t < t' and q in p's connected component of U; ≤ is ≪ or =), galileoOn_isCausal (:170), galileoOn_diamond_top (:180), galileo_not_stronglyCausal (:248, n ≥ 1; rem:galileo_spacetime_not_strongly, ETT.tex:670; ex:causalities_lines item 4, ETT.tex:265). Argued, for the closer: components of opens of ℝ^{n+1} are open, so I±_U(p) is non-empty in every open U ∋ p (chronal neighbours) and J±_U(V) = V ∪ I±_U(V) is open (causally open); ≤ is ≪ or = (push-up); a point of J⁺_U(A) not in I⁺_U(A) lies in A and is a limit of later points of its component (causally plain); r (T-lad-classify-core), recorded by programme-planner"},{"id":"T-abs-halflit-dual-separates","title":"The time-reversed half-lit line's conjoined witness (Causal.halfLightLine_dual_separates_causallyOpenFuture): halfLightLine.dual is causally arc-connected, absolutely minimal, globally hyperbolic (hence causally compact), push-up, strongly causal with open causally convex neighbourhoods, and neither causally open in the future nor locally so; optionally with a time function (−id)","stream":"abstract","kind":"abstract","uses":["causally_arc_connected","absolutely_minimal","globally_hyperbolic","causally_compact","push_up","strongly_causal_open","causally_open_future","locally_causally_open_future"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-dec8-minimal-witness"],"evidence":"The keeper's list (T-lad-record-minimal, journal entry 2026-11-21 08:37, item (a)) and the [[open]] notes of causally_arc_connected → causally_open_future and causally_arc_connected, causally_compact, globally_hyperbolic → locally_causally_open_future ('False, argued, in either reading: the time reversal of the half-lit line … wants these conjoined'). Every piece is in Lean: Causal.halfLightLine_dual_separates (Causal/Dec8MinimalWitness.lean:432: the dual absolutely minimal, ¬ dual.CausallyOpenFuture), halfLightLine_not_causallyOpenPast (:219), halfLightLine_not_causallyOpenPastOn_of_zero_mem (:232), the conjuncts of halfLightLine_separates_causallyOpen (:369), and the transport lemmas Causal.Causality.dual_causallyArcConnectedOn (Causal/ArcConnected.lean:182), dual_absolutelyMinimal (Causal/Minimal.lean:61), dual_globallyHyperbolic, dual_stronglyCausalOpen (Causal/Properties.lean:210, :198), dual_pushUp (Causal/PushUp.lean:96), dual_causallyCompact (Causal/LadderLocal.lean:447); ¬ dual.LocallyCausallyOpenFuture from absolute minimality and ¬ dual.CausallyOpenFuture (AbsolutelyMinimal.causallyOpenFuture_of_locallyCausallyOpenFuture, Causal/LadderLocal.lean:264), or at 0 from :232. Optional conjunct: a time function for the dual (−id is continuous and strictly increasing along the reversed order). Simulated with tools/ladder.py's matrix on the ladder of 5f558c5: 4 [[open]] pairs settled, in either reading of defi:causalite (the half-lit line is absolutely minimal on every open set, Causal.halfLightLine_absolutelyMinimalOn), no contradiction. Layer 1: one theorem, in a new ETT-layer module importing Causal.Dec8MinimalWitness, or appended to that module (the master's call; it belongs to a done target, so no closer of this wave owns it). The keeper's recording is T-lad-record-dual-vee.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-record-minimal), recorded by programme-planner","commit":"570511d"},{"id":"T-abs-one-way-membrane","title":"OQ-69's question, in either reading: an absolutely minimal tarentin causality causally open in the future and not in the past — the one-way membrane on ℝ^{1+1}: x ≤_U y iff a causal curve of the Minkowski cone inside U runs from x to y and never passes from {x¹ > 0} into {x¹ ≤ 0}, ≪ empty; causally arc-connected, absolutely minimal, tarentin, causally open in the future, J⁻ of a small ball left of the membrane not open (so neither causally open nor locally so); and its time reversal — proved, or refuted","stream":"abstract","kind":"abstract","uses":["absolutely_minimal","causally_arc_connected","tarentin","causally_open_future","causally_open","locally_causally_open","locally_causally_open_future"],"package":"lean-causal","status":"done","owner":"closer","priority":5,"depends":["T-abs-ladder-local-defs"],"evidence":"OQ-69 (registers/DECISIONS.md, 2026-11-21: 'Question left open by the closer: can an absolutely minimal tarentin causality be causally open in the future and not in the past?'), the keeper's list (journal entry 2026-11-21 08:37, item (d)) and the [[open]] notes of tarentin → causally_open, causally_open_future ('a yes to OQ-69 … refutes it in either reading'). A mathematical question, answered or refuted in Lean; whether DEC-8's ± is then needed for prop:tarentin_topological_spacetime_causality as printed stays the author's (OQ-69, OQ-9). Argued, for the closer (the planner's sketch; coordinates (x¹, t), the 1+1 Minkowski cone, i.e. the product order in null coordinates t ± x¹): call L = {x¹ ≤ 0} (the membrane included) and R = {x¹ > 0}; x ≤_U y iff some causal curve in U goes from x to y and, once in R, stays in R; ≪ empty. le_trans by concatenation, le_mono by inclusion, so a causality (Causal/Causality.lean:77); causally arc-connected by definition, hence absolutely minimal (Causal.Causality.CausallyArcConnected.absolutelyMinimal, Causal/ArcConnected.lean:216), on every open set (the gluing reading, OQ-18). Tarentin: at a membrane point m, p = m − (δ, 2δ) ∈ L and q = m + (δ, 2δ) ∈ R have J_M(p, q) the full Minkowski diamond (a segment from a point of L into R crosses once, from L to R; a segment inside R stays in R), with m inside; off the membrane, small diamonds on one side. Future: J⁺_U(V) is open — a point of L has its full Minkowski future, a point of R its future inside R, and a point on the null boundary of v's cone is in the open chronological cone of v − (0, ε) ∈ V, which keeps v's side. Past: for V a small ball about (−ε, 0) inside L, (0, −2ε) ∈ J⁻(V) (the segment stays in L) while no point (δ, −2ε) of R is (a curve from R never re-enters L): J⁻(V) is not open. With absolute minimality ¬ CausallyOpen gives ¬ LocallyCausallyOpen (AbsolutelyMinimal.causallyOpen_of_locallyCausallyOpen, Causal/LadderLocal.lean:296); the time reversal is not causally open in the future, nor locally (dual_absolutelyMinimal, dual_tarentin, dual_causallyArcConnectedOn). Not globally hyperbolic (a diamond between two points of R that crosses into L loses that part and is not closed), which is why it leaves the GH pairs alone. Simulated with tools/ladder.py's matrix on the ladder of 5f558c5 (both orientations, each with its local form
