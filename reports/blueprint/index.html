dder's consequence at time_function. The keeper's proposals: journal entries 2026-11-20 21:35 ('HasTimeFunction.isCausal/.curvesExtend once HasTimeFunction is hoisted') and 23:50 (the edge time_function ⇒ is_causal). Users of the moved model names to re-point: Causal/LemmaKSCLocal.lean, LemmaKBare.lean, Flat/Classification.lean, Model/EAlphaCauchy.lean, CBG/Injective.lean. Afterwards Causal.CBG.CausalConvex imports only ETT-layer modules (SubExtension, CurvesExtend, CompactCauchy, CurveComponents), so isCauchyInclusion_iSup and causallyConvexIn_of_isCauchySurfaceOn (binder row Thm 3.4) become usable in layer 1 too. Same refactor discipline as T-abs-hoist-model-free (02b43b6): no statement changes, every old full name keeps resolving (the Sbierski binder cites Causal.CBG.injOn_of_injOn_cauchy, Causal.CBG.sbierski_lemma_3_3, Causal.CBG.minkowski_sbierski_lemma_3_3; the ladder cites curvesExtend_of_timeFunction, exists_inextensible_of_timeFunction).","added":"2026-11-21","proposed_by":"programme-planner (keeper proposals, journal 2026-11-20 21:35 and 23:50; binder sbierski-mghd)","commit":"7eff58c"},{"id":"T-abs-hoist-cbg-gluing","title":"Move the model-free gluing cores of Causal.CBG.Ppcm and Causal.CBG.Maximal into ETT-layer modules: crossing, Cauchy sides, TwoPiece and the piece charts (Ppcm's namespace Causality), ManyPiece and the many-piece charts (Maximal's namespace Causality), with their witnesses; and the two definitions T-abs-hoist-cbg-cores left behind, correspondingSet (Causal.CBG.Corresponding) and correspondingExt with corresponds_correspondingExt, correspondingExt_eq_of_mem (Causal.CBG.NoCorresponding)","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic","causally_arc_connected","push_up","tarentin"],"package":"lean-causal","exclusive":true,"status":"ready","owner":"closer","priority":5,"depends":["T-abs-hoist-cbg-cores"],"evidence":"Binder papers/sbierski-mghd (rows Thm 2.7, 2.8): Causal.Causality.TwoPiece.globallyHyperbolic (Causal/CBG/Ppcm.lean:640) and Causal.Causality.ManyPiece.globallyHyperbolic (Causal/CBG/Maximal.lean:579) are the GH of the gluings by chains, model-free (sections TwoPiece, Ppcm.lean:217, and ManyPiece, Maximal.lean:118), but Ppcm imports Causal.CBG.NoCorresponding (→ Pgcd → Geometry → SingularFlat) and Maximal imports Pgcd and Bound. Ranges: Ppcm.lean:126–662 (sections Crossing, CauchySide, TwoPiece, PieceChart) and its witnesses :1300–1432; Maximal.lean:114–657 (ManyPiece, ManyChart, Witness). Checked by name 2026-11-21 (planner, against tools/ladder.py's import index): these ranges use no declaration of a model-reaching module except one another (Maximal's ManyPiece uses Ppcm's CauchySide, PieceChart, TwoPiece), and the Ppcm sections' Jplus_mem_nhds_of_isAcausal, Jplus_mem_nhds_of_mem_Kminus are ETT-layer since T-abs-hoist-cbg-cores (Causal/CorrespondingPoints.lean:179, :115). The two definitions: Causal.CBG.correspondingSet (Causal/CBG/Corresponding.lean:431) and Causal.CBG.correspondingExt (Causal/CBG/NoCorresponding.lean:178) with corresponds_correspondingExt, correspondingExt_eq_of_mem (:182–194) are pure topology over Corresponds (Causal/CorrespondingPoints.lean:240), left in place by T-abs-hoist-cbg-cores (e4df4d0: 'Left in place (model-free, unlisted): correspondingSet, correspondingExt'; journal entry 2026-11-21 00:50); in the ETT layer they give OQ-40's set C an ETT-layer definition (T-lad-gluing-nodes). Ready 2026-11-21: T-abs-hoist-cbg-cores is done. Not on the path of T-abs-hoist-cbg-geometry's question: since T-abs-hoist-time-function the only model-layer module Causal.CBG.Maximal reaches is Causal.SingularFlat, through Geometry (planner's check, 2026-11-21); this hoist makes TwoPiece, ManyPiece and C usable in layer 1 without the CBG interface, whatever that ruling says. Split 2026-11-21 out of T-abs-hoist-cbg-cores (one closer's worth each). Same refactor discipline as T-abs-hoist-model-free (02b43b6): no statement changes, every old full name keeps resolving (the Sbierski binder cites TwoPiece.globallyHyperbolic, ManyPiece.globallyHyperbolic), the master rebuilds the ledgers whose Lean root moved.","added":"2026-11-21","proposed_by":"programme-planner (binder sbierski-mghd)"},{"id":"T-abs-hoist-cbg-geometry","title":"The CBG interface in the ETT layer: Causal.CBG.Geometry (A1–A4 over abstract structures), Dev, Bound, Pgcd, and the CBG sections of Ppcm and Maximal, so that layer-1 theorems may use cbg, exists_common_extension and maxDev_isUniversal","stream":"abstract","kind":"abstract","uses":["rigid","germ_extension","cauchy_slice","curves_extend","time_function","absolutely_minimal","causally_arc_connected","push_up","tarentin"],"package":"lean-causal","exclusive":true,"status":"needs-ruling","owner":"closer","priority":6,"depends":["T-abs-hoist-cbg-cores","T-abs-hoist-time-function"],"question":"Causal.CBG.Geometry's A2 field asks every admissible structure's causality to satisfy SingularFlatAxioms (field singularFlatAxioms, Causal/CBG/Geometry.lean:297–298; the module imports Causal.SingularFlat, which imports only ETT-layer modules and no metric, but is on the layer-1 rule's forbidden list, .claude/skills/ett-programme/SKILL.md §3 and tools/ladder.py MODEL_LAYER). Since T-abs-hoist-time-function and T-abs-hoist-cbg-cores it is the only model-layer module that Causal.CBG.cbg reaches. For layer-1 theorems over a geometry (T-abs-cbg-initial-data; Sbierski Thms 2.7, 2.8 read as Causal.CBG.cbg), should the programme (a) admit Causal.SingularFlat (an axiom bundle, not a model) and the abstract CBG interface into the ETT layer, (b) keep it out and restate A2 with ladder properties (absolutely_minimal, causally_arc_connected, push_up, tarentin, curves_extend, time_function), changing the interface gx agreed (DEC-62–DEC-64), or (c) leave Causal.CBG outside layer 1 and state T-abs-cbg-initial-data over a bare category of developments with universal objects as hypothesis?","evidence":"Journal entry 2026-11-20 23:50: T-abs-cbg-initial-data was swapped out of the wave because it needs Causal.CBG.cbg, model-importing. Imports re-read 2026-11-21 after T-abs-hoist-time-function (7eff58c) and T-abs-hoist-cbg-cores (e4df4d0), with tools/ladder.py's import index: Causal.CBG.Maximal reaches exactly one model-layer module, Causal.SingularFlat, and none once Causal.CBG.Geometry is removed; Geometry reaches none but SingularFlat (field `sing` :286, A2 :297–298; its other imports SubExtension, CompactCauchy, PushoutCausal, GXStructure are ETT-layer). Pgcd imports CurvesExtend, Geometry, CausalConvex, Injective, of which only Geometry is not ETT-layer; Ppcm imports NoCorresponding and CausalConvex; Maximal imports Ppcm, Bound, Pgcd, FamilyGluing. T-abs-hoist-cbg-gluing is therefore not a prerequisite of this question (dropped from `depends` 2026-11-21): it moves TwoPiece and ManyPiece out from behind the interface for layer-1 use either way. Also over Causal.SingularFlat's bundles, hence bearing on the same reading: SingularFlatAxioms.causallyPlain and the BTZAxioms lemmas of T-abs-hoist-plain-locz. The layer-1 rule is the author's framing (programme/README.md: layer 1 'never imports a metric'); a reading of it is a ruling.","added":"2026-11-21","proposed_by":"programme-planner (journal 2026-11-20 23:50; binder sbierski-mghd)"},{"id":"T-abs-cbg-initial-data","title":"Developments of initial data from developments of a spacetime: define local uniqueness (any two developments of the same datum have a common Cauchy sub-development, Sbierski Thm 2.6) over a Causal.CBG.Geometry, and prove from Causal.CBG.cbg and exists_common_extension that the maximal development of any one development is universal among all developments of the datum (Sbierski Thms 2.7, 2.8 for data)","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic"],"package":"lean-causal","status":"planned","owner":"closer","priority":3,"depends":["T-abs-hoist-cbg-cores","T-abs-hoist-cbg-geometry"],"evidence":"Binder papers/sbierski-mghd (rows Thm 2.6, 2.7, 2.8, Def 2.1): Lean's CBG takes a GH spacetime M₀ as datum (Causal.CBG.Dev, `cbg`), Sbierski a Riemannian (M̄, ḡ, k̄) (Maximal_GHD2.tex:360, :403–420); two GHDs of the data share no M₀, and Thm 2.8 compares them through Thm 2.6. Argument: for N a development of the datum and M₀ the one of `cbg`, local uniqueness gives a common U; M₀ ↪ maxDev(U) makes maxDev(U) a development of M₀, so N → maxDev(U) → maxDev(M₀). The datum is read as a fixed Cauchy surface Σ with the class of its developments closed under common sub-developments; the same predicate is ERS's Prop 4.63 (papers/ers-predictability; on the fixed background the `hlocal` of Causal.Causality.ers_theorem_4_64, Causal/ErsUniqueness.lean:466). Defines the Lean predicate the keeper needs for local_uniqueness (T-lad-development-nodes). Back to planned 2026-11-21 (the layer-1 rule; journal entry 2026-11-20 23:50, where it was swapped out of the wave): Causal.CBG.cbg and exists_common_extension live in Causal.CBG.Maximal (:1093) and Ppcm (:1290). Since T-abs-hoist-time-function (7eff58c) and T-abs-hoist-cbg-cores (e4df4d0) the only model-layer module they reach is Causal.SingularFlat, through Causal.CBG.Geometry's A2 field (planner's check, 2026-11-21, tools/ladder.py's import index); T-abs-hoist-cbg-geometry asks the author about it, and this target waits on that ruling alone (refined 2026-11-21). Under its reading (c) this target is restated over a bare category of developments.","added":"2026-11-20","proposed_by":"programme-planner (binder sbierski-mghd)"},{"id":"T-abs-sbierski-prop-3-7","title":"Sbierski Prop 3.7 (i) ⇒ (ii) model-free: for a corresponding pair of a causal isomorphism between causally convex opens (IsCorrPair, KSide), every chronal curve of U ending at p is carried to a curve ending at q — from open I, closed ≤ and strong causality, not from A3","stream":"abstract","kind":"abstract","uses":["strongly_causal","globally_hyperbolic","push_up","tarentin"],"package":"lean-causal","status":"done","owner":"closer","priority":3,"depends":["T-abs-hoist-cbg-cores"],"evidence":"Sbierski 1309.7591 Prop 3.7 (Maximal_GHD2.tex:544, proof 563–581; text sbierski2013existence.txt:719). lean-causal/Causal/CBG/Corresponding.lean:92–96 (SCOPE): '… Prop 3.7 (ii) and C open in ∂U are proved from A3 … Sbierski's own proof of Prop 3.7 (ii) (timelike curves, strong causality) is not formalized'; 'Downstream warning: Sbierski proves Lemma 3.8 (= A3) from Prop 3.7 (ii)'. The binder's smooth-vacuum discharge of A3 (T-loc-vacuum-rigid-germ) follows Sbierski and needs (ii) without A3, or it is circular. The model-free (i) ⇔ K⁻-bijection and uniqueness are already proved (Causal.CBG.IsCorrPair.corresponding_K, eq_of_corresponds). Ready 2026-11-21: since T-abs-hoist-cbg-cores (e4df4d0) the whole setting is ETT-layer in Causal.CorrespondingPoints: Corresponds (:240), IsCorrPair (:279: ψ, g mutually inverse homeomorphisms between the opens U and V carrying ≤ and ≪ of M onto those of N), KSide (:291: push-up, causal, closed J±, the K⁻ calculus, compact J⁺(S) ∩ J⁻(x)), IsCorrPair.eq_of_corresponds (:453), corresponding_K (:478), corresponds_of_tendsto (:593, (iii) ⇒ (i)), and the timelike-line witnesses (:639–) for the satisfiability check. Layer 1: a new module importing Causal.CorrespondingPoints (and Causal.CorrespondingSpacelike if Lemma 3.9's core helps), no Causal.CBG.* module.","added":"2026-11-20","proposed_by":"programme-planner (binder sbierski-mghd)","commit":"48d1cf0"},{"id":"T-abs-ers-thm-4-64","title":"ERS19 Thm 4.64 skeleton: on a fixed background, two developments with a common Cauchy surface agree on U₁ ∩ U₂ when it is connected — the MCGHD V₀ as a union, a boundary point in U₁ ∩ U₂, Step 2 by exists_spacelike_boundary_point, Steps 3–5 + Prop 4.63 named as one restart hypothesis (4.82's hstep); with Remark 4.67, Cor 4.68, Cor 4.69, and Cor 4.71, 4.73 assembled with ers_lemma_4_70, ers_lemma_4_72","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic","tarentin"],"package":"lean-causal","status":"done","owner":"closer","priority":3,"evidence":"Binder papers/ers-predictability: Thm 4.64 (ghd_02_19.tex:858, proof 865–912; text eperon2018predictability.txt:1587) is consumed by Rem 4.67, Cor 4.68, 4.69, 4.71, 4.73, Thm 4.75, 4.80, and is not in Lean: Causal/NestedCausalities.lean has its Step 2 (exists_spacelike_boundary_point, :1339) and names Steps 3–5 + Prop 4.63 only inside ers_theorem_4_82 (`hstep`, :1377). The solution is abstracted as an agreement predicate on open sets; no A3 (on a fixed background the identity carries the slice, ERS §4.2). Readings as in OQ-41 (S acausal, two-sided domains).","added":"2026-11-20","proposed_by":"programme-planner (binder ers-predictability)","commit":"56ccff0"},{"id":"T-abs-ers-unions","title":"ERS19's union constructions on a fixed background: Prop 4.63 (the union of local developments of the patches S_p of S has S as Cauchy surface) and Thm 4.75 (patching the local developments on the components of DS_p ∩ DS_q through Thm 4.64), local uniqueness and existence named","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic"],"package":"lean-causal","status":"ready","owner":"closer","priority":5,"depends":["T-abs-ers-thm-4-64"],"evidence":"Binder papers/ers-predictability rows Prop 4.63 (ghd_02_19.tex:836), Thm 4.75 (:1001): causal-topological unions whose analytic inputs are local uniqueness and existence (named). Reuse Causal.ErsUniqueness (56ccff0): AgreementGlues, IsCommonDevelopment, isCommonDevelopment_maxCommonDevelopment (:361), and ers_theorem_4_64 (:466) with its named hypotheses for 4.75's components; Causal.isCauchyInclusion_iSup for the union (Causal/CBG/CausalConvex.lean:628, ETT-layer since T-abs-hoist-time-function, 7eff58c, so the layer-1 module may use it). Readings as there (OQ-57 (c): the union has S as Cauchy surface, GH not concluded — Geroch (iii) ⇒ (i) is unproved, CausalScaffold.GerochEquiv). Refined 2026-11-21: Thms 4.79, 4.80 moved to T-abs-ers-mughd (they need neither 4.63 nor 4.75), to keep one closer's worth.","added":"2026-11-20","proposed_by":"programme-planner (binder ers-predictability)"},{"id":"T-abs-ers-mughd","title":"ERS19 Thms 4.79 and 4.80: the MUGHD (the union of all UGHDs) and the unique m-MGHD, as unions under global uniqueness (ers_theorem_4_77_greatest) with Cor 4.73 (ers_corollary_4_73) as the uniqueness; 4.79's non-emptiness (D_m(S) ∩ U₁ is an m-GHD) a named Minkowski fact","stream":"abstract","kind":"abstract","uses":["curve_nested","globally_hyperbolic","tarentin","is_causal","curves_extend"],"package":"lean-causal","status":"ready","owner":"closer","priority":5,"depends":["T-abs-ers-thm-4-64"],"evidence":"Binder papers/ers-predictability rows Thm 4.79 (ghd_02_19.tex:1055) and Thm 4.80 (:1066). Remark 4.78's 'union under global uniqueness' is Causal.Causality.ers_theorem_4_77_greatest (Causal/NestedCausalities.lean:1185); global uniqueness for m-GHDs is Causal.Causality.ers_corollary_4_73 (Causal/ErsUniqueness.lean:691), whose named hypotheses are carried (subluminality CurveNestedOn C₂ C_m, Minkowski causal with CurvesExtend, local uniqueness, FrontierStaysIn, SliceRestart). 4.79's non-emptiness: D_m(S) ∩ U₁ is an m-GHD (O'Neill 14.38, 14.43), named; the m-MGHD lies in the MUGHD. Split 2026-11-21 out of T-abs-ers-unions.","added":"2026-11-21","proposed_by":"programme-planner (binder ers-predictability)"},{"id":"T-abs-causal-iso-invariance","title":"Causal properties transported by a causal isomorphism (a homeomorphism φ with φ and φ⁻¹ strong morphisms): causal, GH, Cauchy surfaces, time functions; and a continuous function strictly increasing along ≤ makes the causality causal","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic","is_causal"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"evidence":"Binder papers/ers-predictability rows Lemma 3.27, 3.29, 3.31, 3.39 (ghd_02_19.tex:335, :349, :367, :426): the Born–Infeld (U, g) is the transport of the flat (V, m̂) by the hodograph map Ψ, and 'GH with Cauchy S iff (V, m̂) GH with Cauchy Ψ⁻¹(S)' is invariance under a causal isomorphism; 'stably causal' is a time function. No such transport lemma was found in lean-causal (Causal.StrongMorphism, Causal/Morphism.lean:152, has none for GH); reuse what exists (IsEMorphism.isCauchySurface_image).","added":"2026-11-20","proposed_by":"programme-planner (binder ers-predictability)","commit":"80260b0"},{"id":"T-abs-ers-etale-mghd","title":"Fixed-background developments as étale spaces: the Einstein-style gluing of two developments along their MCGHD carries a local homeomorphism to the background, injective iff they agree on the whole overlap; ERS's non-uniqueness (Thm 3.45, Cor 4.68) is the failure of that injectivity, and Lemma 3.32's separation of preimages decides it in 1+1","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic"],"package":"lean-causal","status":"planned","owner":"closer","priority":7,"evidence":"ERS 1802.03020 §4.2 (ghd_02_19.tex:852: 'a manifold which projects down on U₁ ∪ U₂ … and contains the other connected components of U₁ ∩ U₂ twice'); KB note references/sbierski/notes/eperon2018predictability.md, (ii) and candidate 3. Binder papers/ers-predictability: the ETT theorem of the Born–Infeld rows 3.22, 3.23, 3.25, 3.32, 3.35, 3.45. Builds on Causal.CBG.injOn_of_injOn_cauchy (Sbierski Lemma 3.3, ETT-layer since T-abs-hoist-time-function, Causal/CBG/Injective.lean:566) and the ETT-layer gluings of Causal.PushoutCausal and Causal.CBG.FamilyGluing; Causal.CBG.exists_ppcm (Causal/CBG/Ppcm.lean:1273) is stated over a CBG geometry, which reaches Causal.SingularFlat (T-abs-hoist-cbg-geometry), and its two-piece core moves with T-abs-hoist-cbg-gluing. Planned: the statement is the programme's, not the paper's, and needs a design pass.","added":"2026-11-20","proposed_by":"programme-planner (binder ers-predictability)"},{"id":"T-abs-nested-converse","title":"Curve nesting back to ≤-nesting: CurveNestedOn C C' ⊤ gives LeNested C C' when C is causally arc-connected (CurveNestedOn.leNested_of_causallyArcConnected), and not without (not_leNested_of_curveNested_bare: the pointed line is curve-nested in the spacelike line, 0 ≤ 1 in the first only); and CurveNestedOn.trans","stream":"abstract","kind":"abstract","uses":["curve_nested","le_nested","causally_arc_connected"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-nested-causalities"],"evidence":"The keeper's proposal (T-lad-nested-nodes, journal entry 2026-11-20 22:45: 'CurveNestedOn.leNested_of_causallyArcConnected (converse), not_leNested_of_curveNested_bare (pointedLine in spacelikeLine)'); programme/ladder.toml:719 ([[open]] curve_nested → le_nested: false in general, argued, true under causal arc-connectedness of C, 'not in Lean either'). Definitions Causal/NestedCausalities.lean:121, :130; LeNested.curveNestedOn :148, CurveNestedOn.mono :155; the lines Causal.pointedLine (Causal/LinesReachable.lean:366), Causal.spacelikeLine (Causal/Lines.lean:113). The converse's last step reads a C'-causal curve of U from x to y as x ≤_U y for C': if that needs C' causally arc-connected too, the closer adds it and reports. CurveNestedOn.trans: binder papers/ers-predictability row Remark 4.74 (a narrower wider causality C_g ≤ C_b ≤ C_m). Layer 1: ETT-layer imports only (NestedCausalities, ArcConnected, LinesReachable).","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-nested-nodes), recorded by programme-planner","commit":"8044439"},{"id":"T-abs-nested-transfer","title":"What a ≤-nesting carries to the narrower causality: strong causality and its open form pass from the wider C' to the narrower C (LeNested C C'), and so does a time function (C'.HasTimeFunction → C.HasTimeFunction); tarentin does not: the spacelike line, ≤-nested in the timelike line, is not tarentin (spacelikeLine_not_tarentin), conjoined with its push-up, causal openness and global hyperbolicity (spacelikeLine_separates_tarentin, the first globally hyperbolic model that is not tarentin)","stream":"abstract","kind":"abstract","uses":["le_nested","strongly_causal","strongly_causal_open","time_function","tarentin","globally_hyperbolic","push_up","causally_open"],"package":"lean-causal","status":"done","owner":"closer","priority":4,"depends":["T-abs-nested-causalities"],"evidence":"The keeper's proposals at T-lad-nested-nodes (journal entry 2026-11-20 22:45: 'T-abs-nested-transfer (SC, SCO, HasTimeFunction pass to the narrower causality; tarentin does not)') and at T-lad-gh-causal (journal entry 2026-11-21 01:30: 'spacelikeLine_not_tarentin (first GH non-tarentin model)'; its report: Int J(p, q) ⊆ Int {p} = ∅; with spacelikeLine_globallyHyperbolic, _pushUp and _causallyOpen it settles globally_hyperbolic, causally_compact, is_causal, push_up, causally_open and their local forms ⇏ tarentin). The transfers already in Lean are listed in the comment above the pair-sort consequences, programme/ladder.toml:914–919 (is_causal by isCausal_of_le_top, GH under closed diamonds by globallyHyperbolic_iff_of_nested, Cauchy surfaces and inextensibility under OQ-41's hypotheses). A causally convex set for C' is causally convex for C (its ≤ is smaller), whence SC and SCO; a time function of C' is one of C. Causality.HasTimeFunction is ETT-layer in Causal.CurvesExtend (:516) since T-abs-hoist-time-function (7eff58c), so the transfer is stated with the predicate. The counterexample for tarentin: Causal.spacelikeLine (≤ the diagonal, Causal/Lines.lean:113) is ≤-nested in Causal.timelikeLine (tarentin: Causal.timelikeLine_tarentin, Lines.lean:177) and is not tarentin (each of its diamonds is at most a point, of empty interior); the conjoined witness uses Causal.spacelikeLine_pushUp (Causal/LinesReachable.lean:464), spacelikeLine_globallyHyperbolic and spacelikeLine_causallyOpen (Causal/LadderLocal.lean:552, :564). These are the first witnesses of T-tool-ladder-py's [[transfer]] table; the keeper records the [[fails]] entries ⇏ tarentin afterwards. Layer 1: ETT-layer imports only (NestedCausalities, LadderLocal, LinesReachable, CurvesExtend).","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-nested-nodes), recorded by programme-planner","commit":"f868749"},{"id":"T-abs-chronal-neighbour-bridge","title":"Bridge between LocateExtension's HasChronalNeighbour (one point, one side, chronology in M) and LadderLocal's ChronalNeighbours (every point, both sides, chronology in every open V): ChronalNeighbours gives HasChronalNeighbour everywhere; under absolute minimality on a T1 space ChronalNeighbours is 'I⁺(x) and I⁻(x) non-empty for every x'; exists_leaving restated with ChronalNeighbours","stream":"abstract","kind":"abstract","uses":["causally_arc_connected","absolutely_minimal"],"package":"lean-causal","status":"ready","owner":"closer","priority":4,"depends":["T-abs-locate-extension","T-abs-ladder-local-defs"],"evidence":"Journal entry 2026-11-20 21:35 ('HasChronalNeighbour ↔ ChronalNeighbours bridge lemma'); Causal/LadderLocal.lean SCOPE: 'It is not HasChronalNeighbour of the Causal.LocateExtension (one point, one side, chronology in M)'. Definitions: Causal.Causality.HasChronalNeighbour (Causal/LocateExtension.lean:138), ChronalPastNeighbours, ChronalNeighbours (Causal/LadderLocal.lean:157, :162); AbsolutelyMinimal.chronalPastNeighbours_iff (:318) gives the one-sided characterisation; the leaving theorems Causal.Causality.exists_leaving (LocateExtension.lean:397), exists_leaving_of_isOpenEmbedding (:418), whose localisation hypothesis is HasChronalNeighbour at the boundary points (OQ-51). The converse fails (one point, one side): the closer gives the separating instance if one is at hand (closedHalfLine, :758, has I⁻ = ∅ at 0). Layer 1: a new module importing LocateExtension and LadderLocal.","added":"2026-11-21","proposed_by":"programme-planner (journal 2026-11-20 21:35)"},{"id":"T-abs-pushup-not-open","title":"Push-up and local causal openness do not give causal openness: on ℝ, the causality with ≪ empty and ≤_U the diagonal plus 0 ≤ 1 in every open U containing 0 and 1 has push-up and is two-sided locally causally open, while J⁺((−1, 1)) = (−1, 1] is not open: not causally open in the future, hence not causally open, and (by the ladder) not absolutely minimal","stream":"abstract","kind":"abstract","uses":["push_up","causally_open_future","causally_open","locally_causally_open","locally_causally_open_future","absolutely_minimal"],"package":"lean-causal","status":"ready","owner":"closer","priority":4,"depends":["T-abs-ladder-local-defs"],"evidence":"The auditor's separating example at T-abs-ladder-local-defs (journal entry 2026-11-20 21:35: 'push-up holds but J⁺((−1,1)) = (−1,1] is not open, so push-up alone does not give causal openness (a `fails` entry candidate)'), widened by the keeper at T-lad-local-nodes (journal entry 2026-11-21 00:50, 'a widened T-abs-pushup-not-open'; its report: also prove the line two-sided locally causally open — any open around 0 or 1 that misses the other point has the diagonal order — and state that it is not causally open in the future; then push_up ⇏ causally_open_future and locally_causally_open ⇏ causally_open_future, the second showing that absolute minimality cannot be dropped from prop:topological_spacetime_absolutely_minimal, ETT.tex:698; simulated +8 refuted pairs, no contradiction). Sharper than the lightlike line (Causal.lightlikeLine_separates_chronalNeighbours, Causal/LadderLocal.lean:587: push-up AND causally open without chronal neighbours): it shows that the side condition of push_up ∧ chronal_neighbours ⇒ causally_open (programme/ladder.toml:368–372; Causal.Causality.PushUp.causallyOpen_of_chronalNeighbours, LadderLocal.lean:350) cannot be dropped, and settles the [[open]] entries push_up → causally_open_future, → causally_open (ladder.toml:1020–1028). ¬ AbsolutelyMinimal follows from Causal.Causality.AbsolutelyMinimal.causallyOpen_of_locallyCausallyOpen (LadderLocal.lean:296; ladder.toml:388–392) and is stated, so that the keeper's locally_causally_open ⇏ absolutely_minimal has a one-theorem witness. The closer checks the causality axioms for the stated ≤_U (le_mono: 0 ≤_V 1 needs 0, 1 ∈ V ⊆ U) and names the line. Layer 1: a new module importing LadderLocal (ETT layer). The keeper records the [[fails]] entries afterwards; since T-lad-local-nodes (947f841) the closure no longer chains push_up ⇒ causally_open, so they contradict nothing.","added":"2026-11-21","proposed_by":"target-auditor (T-abs-ladder-local-defs), recorded by programme-planner"},{"id":"T-abs-gateline-witnesses","title":"The gated line has a time function and is tarentin (gateLine_hasTimeFunction, gateLine_tarentin), so that with gateLine_not_absolutelyMinimalOn it refutes time_function ⇒ absolutely_minimal and tarentin ⇒ absolutely_minimal","stream":"abstract","kind":"abstract","uses":["time_function","tarentin","absolutely_minimal"],"package":"lean-causal","status":"ready","owner":"closer","priority":5,"depends":["T-abs-hoist-time-function"],"evidence":"The keeper's proposals (T-lad-cbg-geometry-nodes, journal entry 2026-11-20 21:35: 'gateLine_hasTimeFunction, gateLine_tarentin'). The gated line Causal.gateLine (Causal/CBG/CausalConvex.lean:842, ℝ ⊕ Unit, Hausdorff, second countable: inl a ≤_U inl b iff a ≤ b and [a, b] ⊆ U; inl a ≤_U ⋆ iff a ≤ 10 and a, ⋆, 5 ∈ U; ≪ only on the line): gateLine_isCausal :967, gateLine_globallyHyperbolicOn :983, gateLine_curvesExtend :1014, gateLine_not_absolutelyMinimalOn :1176; ladder.toml's three [[fails]] entries on it (programme/ladder.toml:512–537: curves_extend, is_causal, globally_hyperbolic ⇏ absolutely_minimal). Argued, for the closer: T (inl a) = a, T ⋆ = 11 is continuous and strictly increasing along ≤ (only the a ≤ 10 lie below ⋆); at ⋆, {⋆} is open and J_M(⋆, ⋆) = {⋆} (gateLine_le_inr_inr :954, nothing but ⋆ above ⋆), so ⋆ ∈ Int J(⋆, ⋆); at a line point the line's diamonds (gateLine_ t to this ruling's refactor, if any.","added":"2026-11-21","proposed_by":"target-closer (T-abs-hoist-model-free), recorded by programme-planner"},{"id":"T-abs-gateline-local","title":"The gated line's local facts: locally push-up and not push-up (0 ≪ 1 ≤ ⋆, nothing ≪ ⋆), two-sided locally causally open, causally open in the future and NOT causally open in the past (J⁻({⋆}) = (−∞, 10] ∪ {⋆} is not open), so that the printed J⁺-only causal openness is strictly weaker than DEC-8's two-sided reading — proved, or refuted by a counterexample","stream":"abstract","kind":"abstract","uses":["locally_push_up","push_up","locally_causally_open","causally_open_future","causally_open","globally_hyperbolic","is_causal","curves_extend"],"package":"lean-causal","status":"ready","owner":"closer","priority":4,"depends":["T-abs-hoist-time-function","T-lad-local-nodes"],"evidence":"The keeper's finding at T-lad-local-nodes (journal entry 2026-11-21 00:50: 'the gated line looks causally open in the future but not in the past, which would make the printed J⁺-only causal openness strictly weaker than DEC-8's two-sided reading'; its report proposes T-abs-gateline-local: gateLine_locallyPushUp (opens {⋆} and the line), gateLine_not_pushUp (0 ≪ 1 ≤ ⋆, but nothing is ≪ ⋆), gateLine_causallyOpenFuture, gateLine_not_causallyOpen and gateLine_locallyCausallyOpen, simulated +8 refuted pairs, no contradiction) and at T-lad-gh-causal (journal entry 2026-11-21 01:30, 'gateLine_not_pushUp'; its report: it settles globally_hyperbolic, causally_compact, is_causal, curves_extend ⇏ push_up). The gated line Causal.gateLine (Causal/CBG/CausalConvex.lean:842: inl a ≤_U inl b iff a ≤ b and [a, b] ⊆ U; inl a ≤_U ⋆ iff a ≤ 10 and a, ⋆, 5 ∈ U; ≪ only on the line), its relation lemmas gateLine_le_inl_inl … gateLine_le_inr_inr (:945–954), gateLine_isCausal :967, gateLine_globallyHyperbolicOn :983, gateLine_curvesExtend :1014. The argument: J⁻_⊤({⋆}) = {inl a : a ≤ 10} ∪ {⋆} is not open while {⋆} is (not causally open in the past); J⁺_U(V) of an open V is its line part, open as on the timelike line, plus possibly the isolated point ⋆ (causally open in the future); in an open set of the line, or in {⋆}, the relations are the timelike line's or trivial (local push-up, local causal openness on both sides). The [[open]] entry causally_arc_connected → push_up (programme/ladder.toml:1030–1033) already argues the push-up part. What the keeper gets: locally_push_up ⇏ push_up (causal arc-connectedness cannot be dropped from lem:pushup_local, ETT.tex:557), causally_open_future ⇏ causally_open, locally_causally_open ⇏ causally_open, globally_hyperbolic, is_causal, curves_extend ⇏ push_up, globally_hyperbolic ⇏ causally_open. DEC-8 (registers/DECISIONS.md:19) ruled def:causally_open_spacetime_open (ETT.tex:694) two-sided; this target proves or refutes on the gated line that the printed J⁺-only form is strictly weaker, and reports the outcome as a finding: it takes no reading. If some J⁺_U(V) fails to be open, the closer gives that counterexample instead. Layer 1: a new ETT-layer module importing CBG.CausalConvex (ETT-layer since T-abs-hoist-time-function, 7eff58c) and LadderLocal, not the file of T-abs-gateline-witnesses.","added":"2026-11-21","proposed_by":"ladder-keeper (T-lad-local-nodes, T-lad-gh-causal), recorded by programme-planner"},{"id":"T-abs-doubled-line-compact","title":"The doubled line is causally compact and not causal (doubledLine_causallyCompact: each J_M(p, q) is closed in [p.1, q.1] × Bool), conjoined with its push-up, tarentin and two-sided causal openness where they hold; and one conjoined witness for the lightlike line (causally arc-connected, absolutely minimal, tarentin, causal, push-up, causally open, globally hyperbolic, without chronal neighbours, not causally plain)","stream":"abstract","kind":"abstract","uses":["causally_compact","is_causal","push_up","tarentin","causally_open","causally_arc_connected","absolutely_minimal","globally_hyperbolic","chronal_neig const PROPOSED = {}; BINDERS.forEach(B => B.proposed.forEach(p => (PROPOSED[B.slug] ??= {})[p.id] = p));
function refsStatus(refs){
  if (!refs.length) return {s:"open"};
  const miss = refs.filter(x => x.t === "missing"), tg = refs.filter(x => x.t === "target");
  if (miss.length) return {s:"missing", ids:miss.map(x => x.x)};

function L2(B, r){

  if (un.length) return {s:"open", ids:un};

}
function L3(r){
  if (!r.geo.length) return {s:(r.loc.length || r.open.length) ? "open" : "none"};
  const st = r.geo.map(g => refsStatus(g.by));
  if (st.every(x => x.s === "closed")) return {s:"closed"};
  if (st.some(x => x.s === "missing")) return {s:"missing", ids:st.flatMap(x => x.s === "missing" ? x.ids : [])};
  if (st.some(x => x.s === "open")) return {s:"open"};
  return {s:"target", ids:[...new Set(st.flatMap(x => x.ids || []))]};
}

  if (st.s === "none") return `<span class="chip none">none needed</span>`;
  if (st.s === "open") return `<span class="chip open">open${st.ids ? ": " + st.ids.map(esc).join(", ") : ""}</span>`;
  if (st.s === "missing") return `<span class="chip missing">unresolved: ${st.ids.map(esc).join(", ")}</span>`;
  const ids = compact && st.ids.length > 2 ? st.ids.slice(0, 2) : st.ids;

  const cross = r.geo.length && props.length ? `<table class="cross"><thead><tr><th style="text-align:left">property</th>${r.geo.map(g => `<th>${esc(g.model)}</th>`).join("")}</tr></thead><tbody>
      ${props.map(p => `<tr><td class="p">${PROP[p] ? propBtn(p) : `<span class="pl ghost">${esc(p)}</span>`}${r.open.includes(p) ? ` <span class="chip open" style="font-size:.66rem">open</span>` : ""}</td>${r.geo.map(g => { const s = refsStatus(g.by).s;
        return g.proves.includes(p) ? `<td class="${s === "closed" ? "y" : "t"}" title="${esc(g.model)} proves it: ${s}">${s === "closed" ? "✓" : "T"}</td>` : `<td class="o" title="not among this entry's proves">·</td>`; }).join("")}</tr>`).join("")}</tbody></table>
      <p class="prov" style="margin-top:4px">✓ proved by a closed entry; T by an entry on a target; · not among the entry's <span class="mono">proves</span>.</p>` : "";
  const users = B.rows.filter(x => x.ledger && x.ledger.deps.includes(label));
  panel(`<div><h3>${esc(slug)} · ${esc(r.ref || (l ? l.kind : ""))}${l ? " · " + esc(l.file) + ":" + l.line : ""}</h3><h2>${esc(l && l.title ? l.title : r.ref || r.label)}</h2></div>
    <div class="chips"><span class="mono">${esc(r.label)}</span>${l ? `<span class="chip">${esc(l.kind)}</span><span class="chip">paper: ${esc(l.nl)}</span>${l.proof ? `<span class="chip">proof ${esc(l.proof)}</span>` : ""}` : `<span class="chip missing">not in the ledger</span>`}</div>
    ${l && l.tex ? `<div class="tex" id="tex">${texHTML(l.tex)}</div>` : ""}
    ${r.note ? `<div><h3>How it factors (the binder's note)</h3><p>${esc(r.note)}</p></div>` : ""}
    <div><h3>${esc(layerName(1))}</h3><div class="chips" style="margin-bottom:6px">${stChip(L1(r))}</div><ul class="wit">${r.ett.map(refLi).join("")}</ul></div>
    <div><h3>${esc(layerName(2))}</h3><div class="chips" style="margin-bottom:6px">${stChip(L2(B, r))}</div>
      ${r.loc.length ? `<ul class="wit">${r.loc.map(p => `<li class="${PROP[p] ? "ok" : "f"}">${propBtn(p)}<p style="margin-top:3px;font-size:.84rem">${esc(PROP[p]?.what || "not a ladder property")}</p></li>`).join("")}</ul>` : (r.open.length ? "" : `<p>The row needs no localisation property.</p>`)}
      ${r.open.length ? `<p style="margin:8px 0 6px">Listed as open (<span class="mono">open_localisation</span>)${r.open.some(x => PROP[x]) ? "; those with a ladder link have become ladder nodes since" : ""}:</p><ul class="wit">${r.open.map(p => `<li class="c"><span class="mono" style="font-weight:500">${esc(p)}</span><p style="margin:3px 0;font-size:.84rem">${esc(pr[p]?.what || "")}</p><div class="chips">${pr[p]?.target ? tgtChip(pr[p].target) : `<span class="chip open">no proposed target</span>`}${PROP[p] ? propBtn(p) : ""}</div></li>`).join("")}</ul>` : ""}
      ${r.open_reason ? `<p class="warn" style="margin-top:8px">${esc(r.open_reason)}</p>` : ""}</div>
    <div><h3>${esc(layerName(3))}</h3><div class="chips" style="margin-bottom:6px">${stChip(L3(r))}</div>
      ${r.geo.length ? r.geo.map(g => `<div style="margin-bottom:10px"><div class="chips" style="margin-bottom:5px"><b style="font-size:.86rem">${esc(g.model)}</b>${stChip(refsStatus(g.by))}</div>
        ${g.proves.length ? `<div class="linklist" style="margin-bottom:5px"><span class="small">proves</span>${g.proves.map(x => propBtn(x)).join("")}</div>` : `<p class="small" style="margin-bottom:5px">proves no ladder property</p>`}
        <ul class="wit">${g.by.map(refLi).join("")}</ul>${extrasHTML(g.extra)}</div>`).join("") : `<p>No geometric entry.</p>`}
      ${cross}</div>
    ${l && l.deps.length ? `<div><h3>The ledger's dependencies (${l.deps.length})</h3><div class="linklist">${l.deps.map(d => B.rows.some(x => x.label === d) ? `<button class="pl" data-go="#/binders/${enc(slug)}/${enc(d)}">${esc(d)}</button>` : `<span class="pl ghost">${esc(d)}</span>`).join("")}</div></div>` : ""}
    ${users.length ? `<div><h3>Used by (${users.length})</h3><div class="linklist">${users.map(x => `<button class="pl" data-go="#/binders/${enc(slug)}/${enc(x.label)}">${esc(x.label)}</button>`).join("")}</div></div>` : ""}
    ${extrasHTML(r.extra)}`);
  typeset($("#tex"), B.macros, slug);
}

/* =====================================================================================
   3. The roadmap
   ===================================================================================== */
const STREAM_LAYER = {abstract:1, ladder:2, localisation:3};
const STREAM_TXT = {binders:"Sbierski's papers, ledgered and bound", tactics:"Lean automation and the programme's tools", publish:"The blueprint and the progress reports"};
const STREAM_ORDER = ["ladder","abstract","localisation","binders","tactics","publish"];
function streams(){ const s = [...new Set(ROAD.targets.map(t => t.stream || "(none)"))];
  return STREAM_ORDER.filter(x => s.includes(x)).concat(s.filter(x => !STREAM_ORDER.includes(x)).sort()); }
function streamTitle(s){ return STREAM_LAYER[s] ? layerName(STREAM_LAYER[s]) : s.charAt(0).toUpperCase() + s.slice(1); }
function streamText(s){ return STREAM_LAYER[s] ? (LAYER[STREAM_LAYER[s]]?.text || "") : (STREAM_TXT[s] || ""); }
function tcard(t){
  return `<button class="tcard" data-go="#/roadmap/${enc(t.id)}" id="t-${esc(t.id)}"><div class="meta"><span class="chip s-${esc(t.status)}">${esc(ST_LABEL[t.status] || t.status)}</span><span class="mono" style="color:var(--ink)">${esc(t.id)}</span><span>p${esc(t.priority)}</span><span>${esc(t.owner)}</span></div>
    <b>${esc(t.title)}</b>${t.model || t.paper ? `<div class="meta">${t.model ? `<span>model ${esc(t.model)}</span>` : ""}${t.paper ? `<span>paper ${esc(t.paper)}</span>` : ""}</div>` : ""}</button>`;
}
function sbar(ts){ const n = ts.length || 1; return `<div class="sbar" aria-hidden="true">${ST_ORDER.map(s => { const k = ts.filter(t => t.status === s).length; return k ? `<span style="width:${(100*k/n).toFixed(3)}%;background:${ST_COLOR[s] || "var(--grid)"}" title="${esc(ST_LABEL[s] || s)} ${k}"></span>` : ""; }).join("")}</div>`; }
function drawRoadmap(){
  const v = $("#v-roadmap");
  v.innerHTML = (ROAD.errors.length ? `<div class="banner"><b>tools/roadmap.py check reports ${plural(ROAD.errors.length, "violation")}</b><ul>${ROAD.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "")
   + streams().map(s => { const ts = ROAD.targets.filter(t => (t.stream || "(none)") === s);
    return `<section class="board" id="s-${esc(s)}"><h2>${esc(streamTitle(s))}</h2><p>${esc(streamText(s))} <span class="mono" style="color:var(--ink-3)">stream = "${esc(s)}"</span> · ${plural(ts.length, "target")}: ${ST_ORDER.filter(x => ts.some(t => t.status === x)).map(x => `${ts.filter(t => t.status === x).length} ${esc(ST_LABEL[x] || x)}`).join(", ")}.</p>${sbar(ts)}
      ${ST_ORDER.map(st => { const g = ts.filter(t => t.status === st).sort((a, b) => a.priority - b.priority); return g.length ? `<div class="sgroup"><h3>${esc(ST_LABEL[st] || st)} (${g.length})</h3><div class="tgrid">${g.map(tcard).join("")}</div></div>` : ""; }).join("")}</section>`; }).join("");
}
function roadOverview(){
  const cnt = st => ROAD.targets.filter(t => t.status === st).length;
  panel(`<div><h3>The programme roadmap</h3><h2>Targets, by layer and by status</h2></div>
    <p>Read from <span class="mono">programme/roadmap.toml</span> through <span class="mono">tools/roadmap.py</span>. Each section is a stream; a stream that is one of the programme's layers carries the layer's name from <span class="mono">programme/README.md</span>. Within a section, targets are grouped by status and sorted by priority.</p>
    <div class="stat">${["done","ready","needs-ruling","active","blocked","planned"].filter(s => ROAD.statuses.includes(s)).map(s => `<div><b>${cnt(s)}</b><span>${esc(ST_LABEL[s])}</span></div>`).join("")}</div>
    <p class="mono">roadmap: ${ROAD.targets.length} targets, ${ROAD.errors.length ? plural(ROAD.errors.length, "violation") : "all rules hold"}</p>
    ${ROAD.known_red.length ? `<div><h3>Gates already red</h3><ul>${ROAD.known_red.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <div><h3>Sections</h3><div class="linklist">${streams().map(s => `<button class="pl" data-scroll="s-${esc(s)}">${esc(streamTitle(s))}</button>`).join("")}</div></div>
    ${provHTML()}`);
}
function showTarget(id){
  const t = TGT[id]; if (!t){ roadOverview(); return; }
  document.querySelectorAll(".tcard.sel").forEach(e => e.classList.remove("sel"));
  const el = document.getElementById("t-" + id); if (el) el.classList.add("sel");
  const needed = ROAD.targets.filter(x => (x.depends || []).includes(id));
  const cited = []; BINDERS.forEach(B => B.rows.forEach(r => { const w = [];
    if (r.ett.some(x => x.x === id)) w.push("layer 1"); r.geo.forEach(g => { if (g.by.some(x => x.x === id)) w.push("layer 3, " + g.model); });
    if (r.open.some(p => (PROPOSED[B.slug] || {})[p]?.target === id)) w.push("layer 2, proposed property");
    if (w.length) cited.push({B, r, w}); }));
  const oq = t.oq && ROAD.oqs[t.oq];
  const known = new Set(["id","title","stream","kind","status","owner","priority","evidence","added","proposed_by","depends","uses","provides","model","paper","labels","question","oq","commit","package","exclusive"]);
  const rest = Object.fromEntries(Object.entries(t).filter(([k]) => !known.has(k)));
  panel(`<div><h3>${esc(streamTitle(t.stream || ""))}</h3><h2>${esc(t.title)}</h2></div>
    <div class="chips"><span class="chip s-${esc(t.status)}">${esc(ST_LABEL[t.status] || t.status)}</span><span class="mono">${esc(t.id)}</span><span class="chip">kind ${esc(t.kind)}</span><span class="chip">p${esc(t.priority)}</span><span class="chip">owner ${esc(t.owner)}</span>${t.model ? `<span class="chip">model ${esc(t.model)}</span>` : ""}${t.package ? `<span class="chip">package ${esc(t.package)}</span>` : ""}${t.exclusive ? `<span class="chip">exclusive</span>` : ""}${t.commit ? `<span class="chip closed">commit ${esc(t.commit)}</span>` : ""}</div>
    ${t.question ? `<div><h3>The question for the author</h3><p class="warn">${esc(t.question)}</p></div>` : ""}
    ${t.oq ? `<div><h3>Waits on ${esc(t.oq)}${oq ? " · " + esc(oq.status) : ""}</h3>${oq ? `<details><summary>The OQ row of registers/DECISIONS.md (${esc(oq.date)})</summary><p style="margin-top:6px;font-size:.84rem">${esc(oq.text)}</p></details>` : `<p>Not found in <span class="mono">registers/DECISIONS.md</span>.</p>`}</div>` : ""}
    ${(t.uses || []).length ? `<div><h3>Uses (ladder)</h3><div class="linklist">${t.uses.map(x => propBtn(x)).join("")}</div></div>` : t.kind === "abstract" ? `<div><h3>Uses (ladder)</h3><p>No ladder property: pure topology.</p></div>` : ""}
    ${(t.provides || []).length ? `<div><h3>Provides (ladder)</h3><div class="linklist">${t.provides.map(x => propBtn(x)).join("")}</div></div>` : ""}
    ${t.paper ? `<div><h3>Paper</h3><p><span class="mono">papers/${esc(t.paper)}</span>${BIND[t.paper] ? ` · <button class="pl" data-go="#/binders/${enc(t.paper)}">its binder</button>` : ""}</p>${(t.labels || []).length ? `<div class="linklist" style="margin-top:6px">${t.labels.map(l => BIND[t.paper] && BIND[t.paper].rows.some(r => r.label === l) ? `<button class="pl" data-go="#/binders/${enc(t.paper)}/${enc(l)}">${esc(l)}</button>` : `<span class="pl ghost">${esc(l)}</span>`).join("")}</div>` : ""}</div>` : ""}
    ${(t.depends || []).length ? `<div><h3>After (${t.depends.length})</h3><div class="linklist">${t.depends.map(tgtChip).join("")}</div></div>` : ""}
    ${needed.length ? `<div><h3>Needed by (${needed.length})</h3><div class="linklist">${needed.map(x => tgtChip(x.id)).join("")}</div></div>` : ""}
    ${cited.length ? `<div><h3>Cited by binder rows (${cited.length})</h3><ul class="wit">${cited.map(c => `<li class="tg"><button class="pl" data-go="#/binders/${enc(c.B.slug)}/${enc(c.r.label)}">${esc(c.B.slug)} · ${esc(c.r.ref || c.r.label)}</button><span class="loc">${esc(c.w.join("; "))}</span></li>`).join("")}</ul></div>` : ""}
    <div><h3>Evidence</h3><p style="font-size:.86rem">${esc(t.evidence)}</p></div>
    <p class="prov">Added ${esc(t.added)} · proposed by ${esc(t.proposed_by)}</p>
    ${extrasHTML(rest)}`);
}

/* =====================================================================================
   Routing, search, boot
   ===================================================================================== */
const VIEWS = ["ladder","binders","roadmap"];
let current = null;
function showView(v){
  if (current === v) return; current = v;
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; $("#tab-" + x).setAttribute("aria-selected", x === v); });
  if (v === "ladder"){ if (!drawn) drawLadder(); else if (mode === "graph") view(); }
  if (v === "binders" && !bindersDrawn) drawBinders();
  if (v === "roadmap" && !$("#v-roadmap").innerHTML) drawRoadmap();
}
function route(){
  routed = location.hash;
  const parts = (location.hash || "#/ladder").replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const v = VIEWS.includes(parts[0]) ? parts[0] : "ladder"; showView(v);
  if (v === "ladder"){
    selProp = parts[1] === "p" ? parts[2] : null; selEdge = parts[1] === "edge" ? +parts[2] : null;
    selPair = null;
    if (parts[1] === "pair"){ selProp = parts[2]; const v = pair(parts[2], parts[3]); if (v) selPair = new Set([...(v.d || []), ...(v.da || []), ...(v.db || [])]); }
    markLadder(); ladderLegend(); if (drawn && mode === "graph" && selProp && fitTransform().k < 0.45) view();
    if (parts[1] === "p") showProp(parts[2]); else if (parts[1] === "pair") showPair(parts[2], parts[3]); else if (parts[1] === "edge") showEdge(+parts[2]); else ladderOverview();
  } else if (v === "binders"){
    if (parts[2]) showRow(parts[1], parts[2]); else if (parts[1]) { showBinder(parts[1]); const s = document.getElementById("b-" + parts[1]); if (s) s.scrollIntoView({block:"start"}); } else bindersOverview();
    if (parts[2]){ const el = document.getElementById(`row-${parts[1]}-${parts[2]}`); if (el) el.scrollIntoView({block:"nearest"}); }
  } else {
    if (parts[1]){ showTarget(parts[1]); const el = document.getElementById("t-" + parts[1]); if (el) el.scrollIntoView({block:"nearest"}); } else roadOverview();
  }
}
document.addEventListener("click", ev => {
  const s = ev.target.closest("[data-scroll]"); if (s){ const el = document.getElementById(s.dataset.scroll); if (el) el.scrollIntoView({block:"start"}); return; }
  const g = ev.target.closest("[data-go]"); if (!g || g.disabled) return;
  ev.stopPropagation(); nav(g.dataset.go);
});
/* Navigation routes at once; the hashchange that follows (or the browser's back button) routes only
   when the hash differs from the one last routed. */
let routed = null;
function nav(h){ if (location.hash !== h) location.hash = h; route(); }
addEventListener("hashchange", () => { if (location.hash !== routed) route(); });
addEventListener("keydown", e => { if (e.key === "Escape" && e.target.tagName !== "INPUT"){ const v = current || "ladder"; nav("#/" + v); } });
/* search */
const FIND = {};
LAD.props.forEach(p => FIND[p.id] = "#/ladder/p/" + enc(p.id));
BINDERS.forEach(B => B.rows.forEach(r => FIND[r.label] = `#/binders/${enc(B.slug)}/${enc(r.label)}`));
ROAD.targets.forEach(t => FIND[t.id] = "#/roadmap/" + enc(t.id));
$("#ids").innerHTML = Object.keys(FIND).sort().map(k => `<option value="${esc(k)}"></option>`).join("");
$("#q").addEventListener("change", e => { const h = FIND[e.target.value.trim()]; if (h){ nav(h); e.target.blur(); } });
$("#n-ladder").textContent = LAD.props.length;
$("#n-binders").textContent = BINDERS.reduce((a, B) => a + B.rows.length, 0);
$("#n-roadmap").textContent = ROAD.targets.length;
route();
</script>
