<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETT Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The atlas's tokens (reports/atlas/template.html), plus --fails for refuted pairs. */
:root{
  --bg:#eef2f5; --canvas:#f6f8fa; --grid:#dfe5eb; --ink:#1b2735; --ink-2:#4d5c6c; --ink-3:#7d8a98;
  --line:#c3ccd6; --card:#ffffff; --accent:#2c5f8f; --accent-soft:#dbe7f2;
  --closed:#2f8259; --partial:#c4861a; --stated:#7f8d9b; --terminal:#b8c1ca; --none:#ffffff; --fails:#b04a3c;
  --closed-soft:#dcefe4; --partial-soft:#f6e7cc; --fails-soft:#f5dcd8;
  --edge:#8d9aa8; --edge-hi:#2c5f8f; --shadow:0 1px 2px rgba(27,39,53,.08),0 4px 14px rgba(27,39,53,.06);
  --f-display:"Newsreader","Iowan Old Style","Georgia",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d; --fails:#e27d6c;
  --closed-soft:#173326; --partial-soft:#3a2c12; --fails-soft:#3b1d19;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d; --fails:#e27d6c;
  --closed-soft:#173326; --partial-soft:#3a2c12; --fails-soft:#3b1d19;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.005em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-size:.86rem;font-weight:500;padding:6px 12px;border-radius:6px;color:var(--ink-2);border:1px solid transparent}
.tabs button:hover{background:var(--accent-soft)}
.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs .n{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);margin-left:4px}
.spacer{flex:1}
.roadbtn{font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap}
.roadbtn[aria-pressed="true"],.roadbtn:hover{background:var(--accent);color:var(--card)}
.roadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;gap:6px;align-items:center}
.search input{font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:14rem;max-width:48vw}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;position:relative;min-width:0;min-height:0}
.view.scroll{overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 40px}
.stage{position:absolute;inset:0;background-color:var(--canvas);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
svg#g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#g:active{cursor:grabbing}
.panel>*{flex-shrink:0}
.panel{width:min(440px,40%);border-left:1px solid var(--line);background:var(--card);overflow:auto;padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance;line-height:1.2}
.panel h2.mono{font-family:var(--f-mono);font-size:1.02rem;font-weight:500;overflow-wrap:anywhere}
h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.panel p{margin:0;line-height:1.5;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:.8rem;overflow-wrap:anywhere}
.panel ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);line-height:1.45}
.tex{border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.55;overflow-x:auto;font-size:.92rem;background:var(--canvas)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--card);font-family:var(--f-body)}
button.chip{cursor:pointer}
.chip.closed{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.target{border-color:var(--accent);color:var(--accent);font-family:var(--f-mono);font-size:.72rem}
.chip.open{border-color:var(--partial);color:var(--partial);border-style:dashed;font-weight:600}
.chip.none{color:var(--ink-3);border-style:dotted}
.chip.missing,.chip.fails{background:var(--fails);border-color:var(--fails);color:#fff}
.chip.fails-off{border-color:var(--fails);color:var(--fails);border-style:dashed;font-weight:600}
.chip.cond{border-color:var(--partial);color:var(--partial)}
.chip.std{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.kw{font-family:var(--f-mono);font-size:.92em;color:var(--ink)}
.chip.std.beyond{border-color:var(--partial);color:var(--partial);border-style:dashed}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0;box-sizing:border-box;background:var(--ink-3)}
.dot.s-active{background:var(--accent)}.dot.s-ready{background:transparent;border:1.5px solid var(--accent)}.dot.s-needs-ruling{background:var(--partial)}
.dot.s-blocked{background:var(--fails)}.dot.s-planned{background:transparent;border:1.5px solid var(--ink-3)}.dot.s-done{background:var(--closed)}.dot.s-dropped{background:var(--terminal)}
.chip.cmp{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.brow .chips{min-width:0;max-width:100%}
.brow .pl{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.chip.seed{border-style:dashed}
.chip.s-ready{border-color:var(--accent);color:var(--accent)}
.chip.s-active{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip.s-needs-ruling{border-color:var(--partial);color:var(--partial);font-weight:600}
.chip.s-blocked{border-style:dashed;color:var(--fails);border-color:var(--fails)}
.chip.s-done{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.s-dropped{text-decoration:line-through;color:var(--ink-3)}
.chip.s-planned{color:var(--ink-2)}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.pl{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pl:hover,.pl:focus-visible{background:var(--accent-soft)}
.pl.c{border-style:dashed;border-color:var(--partial)}
.pl.f{border-color:var(--fails);color:var(--fails)}
.pl.fo{border-color:var(--fails);color:var(--fails);border-style:dashed}
.pl.ghost{color:var(--ink-3);border-style:dashed;cursor:default}
.pl.ghost:hover{background:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--ink-3)}
ol.wit{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
ol.wit .mono,ul.wit .mono{display:block;color:var(--ink)}
ol.wit>li>p{margin:4px 0}
ol.wit details{margin:2px 0 4px}
.loc{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);overflow-wrap:anywhere}
ul.wit{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
ul.wit>li{border-left:3px solid var(--line);padding-left:10px}
ul.wit>li.c{border-left-color:var(--partial)}
ul.wit>li.f{border-left-color:var(--fails)}
ul.wit>li.fo{border-left:3px dashed var(--fails)}
ul.wit>li.ok{border-left-color:var(--closed)}
ul.wit>li.tg{border-left-color:var(--accent)}
.warn{border-left:3px solid var(--partial);padding:2px 0 2px 10px;color:var(--ink-2);font-size:.84rem;line-height:1.45}
.err{border-left:3px solid var(--fails);padding:2px 0 2px 10px;color:var(--ink-2);font-size:.84rem}
details summary{cursor:pointer;color:var(--ink-2);font-size:.86rem}
.prov{font-size:.78rem;color:var(--ink-3);line-height:1.45}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--ink-2);max-width:calc(100% - 82px);box-shadow:var(--shadow)}
.legend svg{vertical-align:middle;margin-right:5px;overflow:visible}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:2px solid var(--line);background:var(--card)}
.tools{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.tools button{font:inherit;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.tools button:focus-visible{outline:2px solid var(--accent)}
.mode{position:absolute;left:12px;top:10px;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:var(--shadow);z-index:2}
.mode button{all:unset;cursor:pointer;font-size:.8rem;font-weight:500;padding:5px 12px;background:var(--card);color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.mode button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{position:absolute;right:12px;top:10px;font-size:.74rem;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
/* the ladder graph */
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.node:hover rect.box{stroke:var(--accent);stroke-width:2}
.node:focus-visible{outline:none}.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5}
.node text{fill:var(--ink);font-family:var(--f-body)}
.node .t-mono{font-family:var(--f-mono)}
.node .t-dim{fill:var(--ink-3)}
.node.sel rect.box{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.node.sel text{fill:var(--card)}
.node.down rect.box{fill:var(--closed-soft);stroke:var(--closed);stroke-width:2}
.node.up rect.box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.node.down.c rect.box,.node.up.c rect.box{stroke:var(--partial);stroke-dasharray:5 3;fill:var(--partial-soft)}
.node.no rect.box{fill:var(--fails-soft);stroke:var(--fails);stroke-width:2}
.node.off rect.box{fill:var(--card);stroke:var(--fails);stroke-width:2;stroke-dasharray:5 3}
.node.dim{opacity:.45}
.junction circle{fill:var(--card);stroke:var(--edge);stroke-width:1.4}
.junction text{fill:var(--ink-2);font-size:11px;font-family:var(--f-body)}
.junction{cursor:pointer}
.junction.c circle{stroke:var(--partial)}
.edge path.vis{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-opacity:.9}
.edge.seed path.vis{stroke-dasharray:6 4}
.edge.c path.vis{stroke:var(--partial)}
.edge.hi path.vis{stroke:var(--edge-hi);stroke-width:2.4;stroke-opacity:1}
.edge.c.hi path.vis{stroke:var(--partial)}
.edge text{fill:var(--partial);font-size:10.5px;font-family:var(--f-mono);paint-order:stroke;stroke:var(--canvas);stroke-width:3px}
.edge text.std{fill:var(--ink-3)}
.edge path.hit{fill:none;stroke:transparent;stroke-width:14px;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
@media (pointer:coarse){.edge path.hit{stroke-width:22px}}
.edge.dim{opacity:.3}
/* an implication is one target however many segments draw it: hovering any of them lights them all */
.edge.hov{opacity:1}.edge.hov path.vis{stroke:var(--edge-hi);stroke-width:2.4;stroke-opacity:1}.edge.c.hov path.vis{stroke:var(--partial)}
.junction.hov circle{stroke:var(--edge-hi);stroke-width:2.2}.junction.c.hov circle{stroke:var(--partial)}
/* the pair matrix */
.matrix{position:absolute;inset:0;overflow:auto;padding:56px 16px 90px;background:var(--canvas)}
.matrix table{border-collapse:separate;border-spacing:2px;margin:0 auto;font-size:.76rem}
.matrix th{font-family:var(--f-mono);font-weight:500;color:var(--ink-2);white-space:nowrap}
.matrix th.row{text-align:right;padding-right:6px}
.matrix th.col{height:150px;vertical-align:bottom;padding:0}
.matrix th.col div{writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0;margin:0 auto}
.matrix th button{all:unset;cursor:pointer}
.matrix th button:hover{color:var(--accent)}
.matrix td{width:26px;height:26px;padding:0}
.matrix td button{all:unset;display:block;width:26px;height:26px;text-align:center;line-height:26px;border-radius:4px;cursor:pointer;font-size:.86rem;box-sizing:border-box}
.matrix td button:focus-visible{outline:2px solid var(--accent)}
.matrix button.m-implied,.mkey b.m-implied{background:var(--closed);color:#fff}
.matrix button.m-implied-standing,.mkey b.m-implied-standing{background:repeating-linear-gradient(45deg,var(--closed-soft) 0 4px,var(--partial-soft) 4px 8px);color:var(--ink);border:1.5px dashed var(--partial)}
.matrix button.m-fails,.mkey b.m-fails{background:var(--fails);color:#fff}
.matrix button.m-fails-off,.mkey b.m-fails-off{background:var(--card);color:var(--fails);border:1.5px dashed var(--fails)}
.matrix button.m-open,.mkey b.m-open{background:var(--card);border:1.5px solid var(--partial);color:var(--partial)}
.matrix button.m-unknown,.mkey b.m-unknown{background:var(--grid);color:var(--ink-3)}
.matrix button.m-diag,.mkey b.m-diag{background:transparent;color:var(--ink-3)}
.matrix button.m-ill-typed,.mkey b.m-ill-typed{background:transparent;color:var(--ink-3);border:1px dotted var(--line)}
.matrix .note{max-width:720px;margin:10px auto 0;text-align:center;font-size:.76rem;color:var(--ink-3);line-height:1.45}
/* transfers along a nesting */
.matrix table.ttab{border-spacing:2px}
.ttab th.grp{font-family:var(--f-mono);font-weight:500;color:var(--ink-2);text-align:center;padding:2px 6px;border-bottom:1px solid var(--line)}
.ttab th.dir{font-family:var(--f-body);font-weight:500;color:var(--ink-3);font-size:.68rem;white-space:normal;max-width:84px;line-height:1.25;padding:2px 4px;vertical-align:bottom}
.ttab td,.ttab td button{width:44px}
.matrix button.t-yes,.mkey b.t-yes{background:var(--closed);color:#fff}
.matrix button.t-no,.mkey b.t-no{background:var(--fails);color:#fff}
.matrix button.t-yes.cond,.mkey b.t-yes.cond{background:var(--card);color:var(--closed);border:1.5px dashed var(--partial)}
.matrix button.t-mix,.mkey b.t-mix{background:var(--partial-soft);color:var(--partial);border:1.5px solid var(--partial)}
.matrix button.t-yes.thr,.mkey b.t-yes.thr{background:var(--closed-soft);color:var(--closed);border:1.5px dashed var(--closed)}
.matrix button.t-no.thr,.mkey b.t-no.thr{background:var(--fails-soft);color:var(--fails);border:1.5px dashed var(--fails)}
.mkey b.t-mix{width:auto;padding:0 3px}
.matrix span.t-none{display:block;width:44px;height:26px;line-height:26px;text-align:center;color:var(--ink-3)}
.matrix h3{text-align:center;margin:18px 0 8px}
.cluster rect{fill:none;stroke:var(--line);stroke-dasharray:2 4}
.cluster text{fill:var(--ink-3);font-family:var(--f-body);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.mkey{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:14px auto 0;font-size:.76rem;color:var(--ink-2);max-width:720px}
.mkey span{display:inline-flex;align-items:center;gap:6px}
.mkey b{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;font-weight:400;font-size:.74rem;box-sizing:border-box}
/* binders and roadmap */
.paper{max-width:1180px;margin:0 auto 34px}
.phead{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.phead h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;line-height:1.2;text-wrap:balance}
.phead p{margin:0;color:var(--ink-2);line-height:1.45;max-width:90ch}
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:4px}
.cov>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.cov h4{margin:0 0 5px;font-size:.74rem;color:var(--ink-3);font-weight:600}
.cov .chips{gap:4px}
.btable{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.brow{display:grid;grid-template-columns:minmax(170px,1.05fr) minmax(170px,1.2fr) minmax(150px,1fr) minmax(190px,1.25fr);border-top:1px solid var(--line);cursor:pointer}
.brow:first-child{border-top:0}
.brow:hover{background:var(--accent-soft)}
.brow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.brow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.brow>div{padding:9px 11px;min-width:0;display:flex;flex-direction:column;gap:5px;border-left:1px solid var(--grid)}
.brow>div:first-child{border-left:0}
.bhead{cursor:default;background:var(--canvas)}
.bhead:hover{background:var(--canvas)}
.bhead>div{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.bhead small{font-size:.68rem;letter-spacing:0;text-transform:none;font-weight:400}
.rname b{font-family:var(--f-display);font-size:1.02rem;font-weight:600}
.rname .mono{font-size:.72rem;color:var(--ink-3)}
.small{font-size:.74rem;color:var(--ink-3);line-height:1.4}
.names{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.45}
.geo{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.geo .model{font-size:.72rem;font-weight:600;color:var(--ink-2);min-width:7.5em}
.lbl{display:none;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cross{border-collapse:collapse;font-size:.76rem;width:100%}
.cross th,.cross td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.cross th{font-weight:600;color:var(--ink-3);font-size:.7rem}
.cross td.p{text-align:left;font-family:var(--f-mono);font-size:.72rem}
.cross .y{color:#fff;background:var(--closed)}
.cross .t{color:var(--accent);background:var(--accent-soft)}
.cross .o{color:var(--partial)}
.board{max-width:1180px;margin:0 auto 30px}
.board>h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0 0 4px}
.board>p{margin:0 0 10px;color:var(--ink-2);max-width:90ch;line-height:1.45}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:6px 0 12px}
.sbar span{display:block;height:100%}
.sgroup{margin:8px 0 16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.tcard:hover,.tcard.sel{border-color:var(--accent);box-shadow:var(--shadow)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.72rem;color:var(--ink-3)}
.tcard b{font-weight:500;line-height:1.35;font-size:.86rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.banner{max-width:1180px;margin:0 auto 14px;border:1px solid var(--fails);border-radius:8px;padding:8px 12px;background:var(--fails-soft);color:var(--ink);font-size:.84rem}
.banner ul{margin:4px 0 0;padding-left:1.2em}
@media (max-width:760px){
  main{flex-direction:column}
  .view{flex:1 1 auto}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line);flex:0 0 46%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  h1{font-size:1.15rem}
  .search input{width:9rem}
  .brow{grid-template-columns:1fr}
  .brow>div{border-left:0;border-top:1px dashed var(--grid)}
  .brow>div:first-child{border-top:0}
  .bhead{display:none}
  .lbl{display:block}
  .legend{display:none!important}
  .search label,.long{display:none}
  header{gap:8px 10px;padding-block:8px}
  .roadbtn{padding:5px 9px}
}
@media (min-width:761px){.short{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const DATA = {"ladder":{"props":[{"id":"is_causal","lean":"Causal.Causality.IsCausal","leanloc":"lean-causal/Causal/Properties.lean:95","label":"def:causal_spacetime","what":"≤_M is antisymmetric (an order, reflexivity and transitivity being axioms): no closed causal loops in M","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causal spacetime","file":"ETT.tex","line":653,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.IsCausal"],"deps":[],"tex":"\\begin{defi}[Causal spacetime]\nA topological spacetime is causal if the relation $\\leq_M$ is an order relation on $M$.\n\\end{defi}"}},{"id":"strongly_causal","lean":"Causal.Causality.StronglyCausal","leanloc":"lean-causal/Causal/Properties.lean:105","label":"def:strongly_causal_spacetime","what":"every neighbourhood of every point contains a neighbourhood, not necessarily open, causally convex in M (the definition, DEC-7)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Strongly causal spacetime","file":"ETT.tex","line":662,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.StronglyCausal","Causal.Causality.StronglyCausalOpen"],"deps":[],"tex":"\\begin{defi}[Strongly causal spacetime]\nLet $M$ be a topological spacetime. $M$ is strongly causal if\nfor every $p\\in M$ and every neighbourhood $\\U$ of $p$ there exists a neighbourhood $\\V\\subset \\U$ of $p$\nwhich is causally convex in $M$.\n\\end{defi}"}},{"id":"strongly_causal_open","lean":"Causal.Causality.StronglyCausalOpen","leanloc":"lean-causal/Causal/Properties.lean:109","label":"def:strongly_causal_spacetime","what":"every neighbourhood of every point contains an OPEN neighbourhood causally convex in M (the literal reading through defi:convexite_causale; auxiliary since DEC-7)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Strongly causal spacetime","file":"ETT.tex","line":662,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.StronglyCausal","Causal.Causality.StronglyCausalOpen"],"deps":[],"tex":"\\begin{defi}[Strongly causal spacetime]\nLet $M$ be a topological spacetime. $M$ is strongly causal if\nfor every $p\\in M$ and every neighbourhood $\\U$ of $p$ there exists a neighbourhood $\\V\\subset \\U$ of $p$\nwhich is causally convex in $M$.\n\\end{defi}"}},{"id":"globally_hyperbolic","lean":"Causal.Causality.GloballyHyperbolic","leanloc":"lean-causal/Causal/Properties.lean:144","label":"def:globally_hyperbolic","what":"causal, and every full diamond J_M(p,q) is compact (is_causal ∧ causally_compact: Causal.Causality.globallyHyperbolic_iff, Iff.rfl)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Globally hyperbolic","file":"ETT.tex","line":995,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.GloballyHyperbolic"],"deps":[],"tex":"\\begin{defi}[Globally hyperbolic] Let $M$ be a topological spacetime. $M$ is globally hyperbolic if $M$ is causal and\nif $J_M(p,q)$ is compact for all $p,q\\in M$.\n\\end{defi}"}},{"id":"causally_compact","lean":"Causal.Causality.CausallyCompact","leanloc":"lean-causal/Causal/Properties.lean:84","label":"def:causally_compact","what":"every full diamond J_M(p,q) = J⁻(q) ∩ J⁺(p) is compact (no causality asked: a closed causal loop is allowed)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally compact","file":"ETT.tex","line":350,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyCompact"],"deps":[],"tex":"\\begin{defi}[Causally compact]\nLet $(M,\\leq,\\ll)$ be a topological spacetime. $M$ is causally compact if the diamond $J(p,q)$ is compact for all $p,q\\in M$.\n\\end{defi}"}},{"id":"push_up","lean":"Causal.Causality.PushUp","leanloc":"lean-causal/Causal/Properties.lean:69","label":"defi:pushup","what":"in every open U: x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Push-up property","file":"ETT.tex","line":307,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.PushUp","Causal.Causality.pushUp_iff"],"deps":[],"tex":"\\begin{defi}[Push-up property]\nA topological spacetime $M$ has the \\emph{push-up property} if for every open subset $\\U$ of $M$ and\nevery $x\\in \\U$,\n$$J^\\pm_\\U\\left(I^\\pm_\\U(x)\\right)\\subset I^\\pm_\\U(x) \\qquad\\text{and}\\qquad I^\\pm_\\U\\left(J^\\pm_\\U(x)\\right)\\subset I^\\pm_\\U(x);$$\nequivalently, concatenating a causal relation with a chronological one produces a chronological one.\n\\end{defi}"}},{"id":"causally_open","lean":"Causal.Causality.CausallyOpen","leanloc":"lean-causal/Causal/Properties.lean:130","label":"def:causally_open_spacetime_open","what":"for every open U and open V ⊂ U, J⁺_U(V) and J⁻_U(V) are open (the definition read with J±, DEC-8)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally open spacetime / open causality","file":"ETT.tex","line":694,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyOpenFuture","Causal.Causality.CausallyOpen"],"deps":[],"tex":"\\begin{defi}[Causally open spacetime / open causality]\nLet $M$ be a topological spacetime. The causality of $M$ is open, and $M$ is causally open, if for every open subset $\\U$ of $M$\nand every open subset $\\V\\subset \\U$ the set $J^+_\\U(\\V)$ is open.\n\\end{defi}"}},{"id":"causally_open_future","lean":"Causal.Causality.CausallyOpenFuture","leanloc":"lean-causal/Causal/Properties.lean:121","label":"def:causally_open_spacetime_open","what":"for every open U and open V ⊂ U, J⁺_U(V) is open (the definition as printed, J⁺ alone; auxiliary since DEC-8)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally open spacetime / open causality","file":"ETT.tex","line":694,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyOpenFuture","Causal.Causality.CausallyOpen"],"deps":[],"tex":"\\begin{defi}[Causally open spacetime / open causality]\nLet $M$ be a topological spacetime. The causality of $M$ is open, and $M$ is causally open, if for every open subset $\\U$ of $M$\nand every open subset $\\V\\subset \\U$ the set $J^+_\\U(\\V)$ is open.\n\\end{defi}"}},{"id":"absolutely_minimal","lean":"Causal.Precausality.AbsolutelyMinimal","leanloc":"lean-causal/Causal/Generated.lean:247","label":"def:topological_space_causality_absolutely","what":"for every open cover, the precausality generated by the restrictions to its members is the given one","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"","file":"ETT.tex","line":397,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Precausality.AbsolutelyMinimal","Causal.Precausality.AbsolutelyMinimalOn","Causal.Precausality.absolutelyMinimal_iff"],"deps":[],"tex":"\\begin{defi} Let $M$ be a topological space.\nA precausality $(\\leq,\\ll)$ on $M$ is absolutely minimal if for every open cover $(\\U_i)_{i\\in I}$ the precausality generated by $(\\U_i,\\leq_{\\U_i}, \\ll_{\\U_i})_{i\\in I}$ is equal to $(\\leq,\\ll)$.\n\\end{defi}"}},{"id":"causally_arc_connected","lean":"Causal.Causality.CausallyArcConnected","leanloc":"lean-causal/Causal/ArcConnected.lean:133","label":"def:causal_arc_connectedness","what":"in every open U, p ≤_U q (resp. p ≪_U q) iff a causal (resp. chronal) curve in U joins p to q","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causal arc-connectedness","file":"ETT.tex","line":403,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyArcConnected","Causal.Causality.CausallyArcConnectedOn","Causal.Causality.causallyArcConnectedOn_iff"],"deps":[],"tex":"\\begin{defi}[Causal arc-connectedness] Let $M$ be a topological spacetime. $M$ is causally arc-connected if for every open subset\n$\\U$ and all $p,q\\in \\U$ the following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $p\\leq_\\U q$ (resp. $p\\ll_\\U q$);\n\\item there exists a future causal (resp. future chronal) curve $c:[0,1]\\rightarrow \\U$ with $c(0)=p$ and $c(1)=q$.\n\\end{enumerate}\n\\end{defi}"}},{"id":"causally_plain","lean":"Causal.Causality.CausallyPlain","leanloc":"lean-causal/Causal/Properties.lean:55","label":"defi:causalement_plat","what":"for every open U and A ⊂ M, Int J±_U(A) ⊂ closure I±_U(A): no open set of causal, non-chronological points (no bubbles)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally plain","file":"ETT.tex","line":283,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyPlain","Causal.Causality.causallyPlain_iff"],"deps":[],"tex":"\\begin{defi}[Causally plain]\nA topological spacetime $M$ is \\emph{causally plain} if for every open subset $\\U$ of $M$ and every $A\\subset \\U$,\n$$\\mathrm{Int}\\left(J^\\pm_\\U(A)\\right)\\subset \\overline{I^\\pm_\\U(A)},$$\nequivalently if every non-empty open subset of $J^\\pm_\\U(A)$ meets $I^\\pm_\\U(A)$.\n\\end{defi}"}},{"id":"tarentin","lean":"Causal.Causality.Tarentin","leanloc":"lean-causal/Causal/Properties.lean:116","label":"def:tarentin_spacetime","what":"every neighbourhood of every x contains p, q with x ∈ Int J_M(p,q)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Tarentin spacetime","file":"ETT.tex","line":677,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.Tarentin"],"deps":[],"tex":"\\begin{defi}[Tarentin spacetime]\nA topological spacetime $M$ is tarentin if for every $x\\in M$ and every neighbourhood $\\U$ of $x$\nthere exist $p,q\\in \\U$ such that $x\\in \\mathrm{Int}\\left(J_M(p,q)\\right)$.\n\\end{defi}"}},{"id":"time_function","lean":"Causal.Causality.HasTimeFunction","leanloc":"lean-causal/Causal/CurvesExtend.lean:516","label":"","what":"there is a continuous T : M → ℝ with T x < T y whenever x ≤_M y and x ≠ y (Sbierski Lemma 3.3's hypothesis; not ETT's defi:fonction_temps, which asks a morphism to the timelike line)","sort":"causality","extra":{},"ett":null},{"id":"curves_extend","lean":"Causal.Causality.CurvesExtend","leanloc":"lean-causal/Causal/CauchyExtension.lean:82","label":"","what":"every causal curve of M over a segment [a, b] lies on an inextensible causal curve of M (over some interval)","sort":"causality","extra":{},"ett":null},{"id":"locally_push_up","lean":"Causal.Causality.LocallyPushUp","leanloc":"lean-causal/Causal/LadderLocal.lean:140","label":"","what":"every point has an open neighbourhood W having push-up as a spacetime (PushUpOn W: in every open U ⊆ W, x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z)","sort":"causality","extra":{},"ett":null},{"id":"locally_causally_open_future","lean":"Causal.Causality.LocallyCausallyOpenFuture","leanloc":"lean-causal/Causal/LadderLocal.lean:146","label":"","what":"every point has an open neighbourhood W causally open in the future as a spacetime (CausallyOpenFutureOn W: J⁺_U(V) open for all opens V ⊆ U ⊆ W)","sort":"causality","extra":{},"ett":null},{"id":"locally_causally_open","lean":"Causal.Causality.LocallyCausallyOpen","leanloc":"lean-causal/Causal/LadderLocal.lean:152","label":"","what":"local causal openness in the future and in the past: every point has an open neighbourhood W with J⁺_U(V) and J⁻_U(V) open for all opens V ⊆ U ⊆ W","sort":"causality","extra":{},"ett":null},{"id":"chronal_neighbours","lean":"Causal.Causality.ChronalNeighbours","leanloc":"lean-causal/Causal/LadderLocal.lean:163","label":"","what":"in every open V, every v ∈ V has p, p' ∈ V with p ≪_V v ≪_V p' (chronology taken in V)","sort":"causality","extra":{},"ett":null},{"id":"rigid","lean":"Causal.CBG.IsRigidFor","leanloc":"lean-causal/Causal/CBG/Geometry.lean:197","label":"rem:CBG_analytique","what":"A1: for structures s, t with Hausdorff target, IsRigidFor (IsMor s t): two morphisms on a connected open V agreeing on a non-empty open O ⊆ V agree on V (Sbierski Lemma 3.1, Cor 3.2)","sort":"geometry","extra":{},"ett":{"kind":"remark","number":"","title":"Where the Einstein equations were","file":"ETT.tex","line":1903,"proof":"","nl":"informal","lean":"partial","decls":["Causal.CBG.Geometry.rigid_univ","Causal.CBG.IsRigidFor","Causal.CBG.flat_rigid","Causal.CBG.not_isRigidFor_branchingLine","Causal.timelikeLine_not_isRigid","Causal.CBG.not_exists_isUniversal_halfLineDev","Causal.CBG.causal_pgcd_not_unique","Causal.CBG.IsCGHD.eqOn","Causal.CBG.Dev.IsMorphism.eq_id","Causal.CBG.ppcmDev_desc","Causal.CBG.t2Space_gluing_mcghd"],"deps":[],"tex":"\\begin{rem}[Where the Einstein equations were]\nIn \\cite{MR0250640} the Hausdorffness of the glued object follows from the local uniqueness of the\nsolutions of the Einstein equations. Here it follows from the fact that there is no unreasonable\nmorphism between open subsets of the model spaces: the structure\n$\\left(\\isom(\\mass{}),\\mass{},\\mass{\\geq0}\\right)$ is analytic \\cite[Prop.~2.3.14]{thesis}, so two\n$\\mass{\\geq0}$-morphisms defined on a connected manifold and agreeing on a non-empty open set agree\neverywhere \\cite[Prop.~1.2.11]{thesis}. We use both facts as quoted.\n\\end{rem}"}},{"id":"germ_extension","lean":"Causal.CBG.LocalModel.GermExtFuture","leanloc":"lean-causal/Causal/CBG/FromModel.lean:1049","label":"","what":"A3, both time directions (with Causal.CBG.LocalModel.GermExtPast): ψ an injective morphism on a common Cauchy sub-development U (M, N, U, ψ(U) globally hyperbolic; Σ ⊆ U Cauchy in M and U, ψ(Σ) in N and ψ(U)); for p ∈ ∂U ∩ J⁺(Σ) (resp. J⁻(Σ)) at which ψ clusters at q along U, there are an open O ∋ p and a morphism φ on O with φ p = q and φ = ψ on O ∩ U; M, N Hausdorff, connected, second countable (Sbierski Lemma 3.8)","sort":"geometry","extra":{},"ett":null},{"id":"cauchy_slice","lean":"Causal.CBG.LocalModel.SliceFuture","leanloc":"lean-causal/Causal/CBG/FromModel.lean:1081","label":"","what":"A4, both time directions (with Causal.CBG.LocalModel.SlicePast): U globally hyperbolic with Σ ⊆ U a Cauchy surface of M and of U, p ∈ ∂U ∩ J⁺(Σ) with J⁻(p) ∩ ∂U ∩ J⁺(Σ) = {p} (resp. the past form): inside every open O ∋ p, U enlarges to a globally hyperbolic open U' ⊆ U ∪ O of which Σ is a Cauchy surface (Sbierski Thm 3.6's slice, Lemma 3.11)","sort":"geometry","extra":{},"ett":null},{"id":"le_nested","lean":"Causal.Causality.LeNested","leanloc":"lean-causal/Causal/NestedCausalities.lean:121","label":"","what":"C is ≤-nested in C': for every open U, x ≤_U y for C implies x ≤_U y for C' (C the narrower causality, C' the wider)","sort":"pair","extra":{},"ett":null},{"id":"curve_nested","lean":"Causal.Causality.CurveNestedOn","leanloc":"lean-causal/Causal/NestedCausalities.lean:130","label":"","what":"C is curve-nested in C' on an open W: every future causal curve of W for C, over a segment, is one for C' (W = M unless an entry names W; at M it holds on every open)","sort":"pair","extra":{},"ett":null}],"implies":[{"from":["strongly_causal"],"to":"is_causal","witness":"Causal.Causality.StronglyCausal.isCausal","loc":"lean-causal/Causal/StrongCausality.lean:58","status":"checked","under":"","standing":["T1"],"beyond":[],"onAmbient":true,"cond":false,"extra":{},"emit":{"rule":true,"module":"Causal.StrongCausality"}},{"from":["strongly_causal","tarentin","causally_open"],"to":"strongly_causal_open","witness":"Causal.Causality.StronglyCausal.stronglyCausalOpen","loc":"lean-causal/Causal/GlobalHyperbolicity.lean:226","status":"checked","under":"","standing":[],"beyond":[],"onAmbient":true,"cond":false,"extra":{},"emit":{"rule":true,"module":"Causal.GlobalHyperbolicity"}},{"from":["strongly_causal_open"],"to":"strongly_causal","witness":"Causal.Causality.StronglyCausalOpen.stronglyCausal","loc":"lean-causal/Causal/Properties.lean:238","status":"checked","under":"","standing":[],"beyond":[],"onAmbient":true,"cond":false,"extra":{},"emit":{"rule":true,"module":"Causal.Properties"}},{"from":["globally_hyperbolic","tarentin"],"to":"strongly_causal"," extension as a solution). Layer 3 computation; the boundary it describes is the 'one side' of 4.82 in the superluminal picture.","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:grhosigma","ref":"Lemma 3.27","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":335,"proof":"ghd_02_19.tex:343","nl":"proved","lean":"partial","decls":["Causal.IsCausalIso","Causal.isCausalIso_iff","Causal.isCausalIso_iff_eq_transport","Causal.Causality.transport"],"deps":["ersthm:diffeo_theorem"],"tex":"\\begin{lemma}\nConsider a Born-Infeld solution constructed as in Theorem \\ref{diffeo_theorem}. In coordinates $(\\rho,\\sigma)$, the metric (\\ref{gdef}) is\n\\be\n\n g =c  \\left( 1 + \\Phi_1'(\\rho) \\Phi_2'(\\sigma) \\right)^2 d\\rho d\\sigma\n\\ee\n\n\\end{lemma}"},"ett":[{"x":"Causal.IsCausalIso","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:180"},{"x":"Causal.isCausalIso_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:206"},{"x":"Causal.isCausalIso_iff_eq_transport","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:289"},{"x":"Causal.Causality.transport","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:186"}],"loc":[],"open":[],"open_reason":"","note":"Lemma 3.27 (ghd_02_19.tex:335). g = c(1 + Φ₁'Φ₂')² dρ dσ is conformal to the flat m̂ = c dρ dσ, so Ψ carries the causality of (V, m̂) onto that of (U, g): the layer-3 fact (a conformal factor does not change the causal cones) is IsCausalIso C_m̂ C_g Ψ, equivalently C_g = C_m̂.transport Ψ (Causal.CausalIsoInvariance, T-abs-causal-iso-invariance, 80260b0); the ETT theorems it feeds are the transports of 3.29, 3.31, 3.39. Ψ is a homeomorphism here (ERS: a diffeomorphism).","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:lemma_orientation","ref":"Lemma 3.29","ledger":{"kind":"lem ame initial data prescribed on a hypersurface $S \\subseteq \\R^{d+1}$. Then there exists a common globally hyperbolic development $v : V \\to \\R$.\n\\end{proposition}"},"ett":[{"x":"Causal.Causality.ers_prop_4_63","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:299"},{"x":"Causal.Causality.ers_prop_4_63_globallyHyperbolicOn","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:354"},{"x":"Causal.Causality.ers_prop_4_63_of_hasTimeFunction","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:370"},{"x":"Causal.Causality.IsCommonDevelopment.globallyHyperbolicOn","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:314"},{"x":"Causal.Causality.isDevelopmentIn_localDevelopmentUnion","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:279"},{"x":"Causal.Causality.isCauchySurfaceOn_sSup_of_isAcausalOn","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:194"},{"x":"Causal.Causality.causallyConvexIn_of_isCauchySurfaceOn","t":"lean","loc":"lean-causal/Causal/CBG/CausalConvex.lean:212"},{"x":"Causal.Causality.GloballyHyperbolicOn.of_causallyConvexIn","t":"lean","loc":"lean-causal/Causal/CBG/CausalConvex.lean:274"},{"x":"Causal.Causality.IsCauchySurfaceOn.eq_of_le","t":"lean","loc":"lean-causal/Causal/CBG/CausalConvex.lean:173"}],"loc":["globally_hyperbolic","causally_arc_connected","curves_extend"],"open":["local_uniqueness","curves_extend"],"open_reason":"Local uniqueness is the PDE input (Sogge, energy estimates), named Causal.Causality.LocalUniqueness: a predicate on (C, S, a region, the solutions), not a ladder node (T-lad-development-nodes). curves_extend is read on U₁ (CurvesExtendOn U₁, a model fact, kb/0012) and has no T-loc owner for g(u₁); at M it is replaced by time_function (ers_prop_4_63_of_hasTimeFunction).","note":"Prop 4.63 (ghd_02_19.tex:836). The PDE gives agreement on small DS_p (LocalUniqueness). The ETT part is the union V = localDevelopmentUnion, which contains ⋃ DS_p. It is a common development: ers_prop_4_63, under the OQ-41 reading S acausal in U₁ with only ≤_{U₁} antisymmetric, through isDevelopmentIn_localDevelopmentUnion and isCauchySurfaceOn_sSup_of_isAcausalOn. It is globally hyperbolic and causally convex in U₁ (ers_prop_4_63_globallyHyperbolicOn) when S is a Cauchy surface of the GH U₁ and U₁ is causally arc-connected with curves extending (CausallyArcConnectedOn U₁, CurvesExtendOn U₁). There acausality comes from IsCauchySurfaceOn.eq_of_le, and GH from IsCommonDevelopment.globallyHyperbolicOn (causallyConvexIn_of_isCauchySurfaceOn, GloballyHyperbolicOn.of_causallyConvexIn); no Geroch (iii) ⇒ (i) is used. ERS get GH from the Cauchy property (Geroch). Causal.isCauchyInclusion_iSup is not used: each DS_p has its own S_p, so there is no common Cauchy-included A. globallyHyperbolicOn_sSup_of_pieces and Causal.Causality.isCauchySurfaceOn_iSup form a parallel union route that the anchors do not use. Thm 4.64 uses 4.63 twice: in Step 1 (`hlocal`, ers_theorem_4_64_of_localUniqueness) and in Step 5 (inside the restart SliceRestart).","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","causally_arc_connected"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmUnique","ref":"Thm 4.64","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":858,"proof":"ghd_02_19.tex:865","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_theorem_4_64","Causal.Causality.ers_theorem_4_64_maxCommonDevelopment","Causal.Causality.isCommonDevelopment_maxCommonDevelopment","Causal.Causality.exists_isSpacelikeBoundaryPoint","Causal.Causality.exists_spacelike_boundary_point","Causal.Causality.ers_theorem_4_64_of_localUniqueness","Causal.Causality.IsCommonDevelopment.globallyHyperbolicOn"],"deps":["ersprop:PropLocUniqueness"],"tex":"\\begin{theorem}\nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments of \\eqref{QuasilinearEq} arising from the same initial data given on a connected hypersurface $S \\subseteq \\R^{d+1}$. Assume that $U_1 \\cap U_2$ is connected. Then $u_1$ and $u_2$ agree on $U_1 \\cap U_2$.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466"},{"x":"Causal.Causality.ers_theorem_4_64_maxCommonDevelopment","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:433"},{"x":"Causal.Causality.isCommonDevelopment_maxCommonDevelopment","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:361"},{"x":"Causal.Causality.exists_isSpacelikeBoundaryPoint","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:404"},{"x":"Causal.Causality.exists_spacelike_boundary_point","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1252"},{"x":"Causal.Causality.ers_theorem_4_64_of_localUniqueness","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:383"},{"x":"Causal.Causality.IsCommonDevelopment.globallyHyperbolicOn","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:314"}],"loc":["globally_hyperbolic","tarentin","causally_arc_connected","curves_extend"],"open":["local_uniqueness","slice_restart","frontier_stays_in","curves_extend"],"open_reason":"`hlocal` (Prop 4.63, local_uniqueness: T-lad-development-nodes; supplied by LocalUniqueness through ers_theorem_4_64_of_localUniqueness), `hstep` (Steps 3–5 + Prop 4.63, SliceRestart) and `hstay` (Step 2's U₂ half, FrontierStaysIn) are named hypotheses, not ladder nodes: OQ-57 (b), T-lad-ers-restart-nodes. No A3 is needed on a fixed background. causally_arc_connected and curves_extend (read on U₁) enter only IsCommonDevelopment.globallyHyperbolicOn (V₀ GH), with S a Cauchy surface of U₁; curves_extend has no T-loc owner.","note":"Thm 4.64 (ghd_02_19.tex:858, proof 865–912), Causal.ErsUniqueness (T-abs-ers-thm-4-64, 56ccff0), unmarked. Step 1 the maximal common development V₀ as a union (isCommonDevelopment_maxCommonDevelopment; S Cauchy, GH not concluded); Step 2 a frontier point with (4.65) in U₁ (exists_isSpacelikeBoundaryPoint through exists_spacelike_boundary_point: null geodesics replaced by a minimal point of a compact set, exists_minimal_of_isCompact_on), in U₂ by FrontierStaysIn; Steps 3–5 + Prop 4.63 the restart (SliceRestart; Step 3 is Sbierski's Lemma 3.11). GH and tarentin are of g(u₁) on U₁ (GloballyHyperbolicOn, TarentinOn); the Cauchy facts of S in U₁ (SplitBy, CompactSlabs, IsAcausalOn) are the quasilinear model's. One causality (OQ-57 (a)); U₁ ∩ U₂ preconnected. Since T-abs-ers-unions: hlocal from local uniqueness (ers_theorem_4_64_of_localUniqueness, through Prop 4.63), and V₀ GH (IsCommonDevelopment.globallyHyperbolicOn) when moreover S is a Cauchy surface of U₁ (IsCauchySurfaceOn U₁ S, not a hypothesis of ers_theorem_4_64, which reads U₁'s Cauchy property as IsAcausalOn, SplitBy and CompactSlabs) and U₁ is causally arc-connected with curves extending.","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin","causally_arc_connected"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:RemTime","ref":"Remark 4.67","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":914,"proof":"","nl":"informal","lean":"partial","decls":["Causal.Causality.ers_remark_4_67","Causal.Causality.ers_remark_4_67_future","Causal.Causality.ers_remark_4_67_past","Causal.Causality.ers_remark_4_67_globallyHyperbolicOn"],"deps":["ersthm:ThmUnique"],"tex":"\\begin{remark}\nLet us remark that the proof in particular shows that under the assumptions of Theorem \\ref{ThmUnique} the intersection $U_1 \\cap U_2$ is the maximal common globally hyperbolic development of $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$. If we fix a choice of normal of the initial data hypersurface $S$ and stipulate that it is future directed in $U_1$ as well as in $U_2$, then it follows in particular that a point $x \\in U_1 \\cap U_2$, which lies to the future  of $S$ in $U_1$, also lies to the future of $S$ in $U_2$. Similarly for the past.\n\\end{remark}"},"ett":[{"x":"Causal.Causality.ers_remark_4_67","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:486"},{"x":"Causal.Causality.ers_remark_4_67_future","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:544"},{"x":"Causal.Causality.ers_remark_4_67_past","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:567"},{"x":"Causal.Causality.ers_remark_4_67_globallyHyperbolicOn","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:328"}],"loc":["globally_hyperbolic","tarentin","causally_arc_connected","curves_extend"],"open":["local_uniqueness","slice_restart","frontier_stays_in","curves_extend"],"open_reason":"As Thm 4.64. causally_arc_connected and curves_extend (read on U₁) enter only ers_remark_4_67_globallyHyperbolicOn, with S a Cauchy surface of U₁; curves_extend has no T-loc owner.","note":"Remark 4.67 (ghd_02_19.tex:914). Under 4.64, U₁ ∩ U₂ is the greatest common development (ers_remark_4_67; 'maximal common GHD' read with S Cauchy, OQ-57 (c)), and a point to the future (past) of S in U₁ is to its future (past) in U₂ (ers_remark_4_67_future/_past), with the time orientations of g(u₁), g(u₂) agreeing on U₁ ∩ U₂ (FollowsSolution) and an inextensible curve of U₁ through every point (InextensibleThrough), both layer 3. It is the `hpair` of Causal.Causality.ers_theorem_4_77. Since T-abs-ers-unions: 'maximal common GHD' as printed, U₁ ∩ U₂ also GH and causally convex in U₁ (ers_remark_4_67_globallyHyperbolicOn), adding S Cauchy in U₁, CausallyArcConnectedOn U₁ and CurvesExtendOn U₁ (evidence for OQ-57 (c)).","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin","causally_arc_connected"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:CorDisCon","ref":"Cor 4.68","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":921,"proof":"","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_corollary_4_68","Causal.Causality.ers_corollary_4_68_eqOn"],"deps":[],"tex":"\\begin{corollary} \nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments of \\eqref{QuasilinearEq} arising from the same initial data on a connected hypersurface $S \\subseteq \\R^{d+1}$. If there exists an $x \\in U_1 \\cap U_2$ with $u_1(x) \\neq u_2(x)$, then $U_1 \\cap U_2$ is not connected.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_68","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:594"},{"x":"Causal.Causality.ers_corollary_4_68_eqOn","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:610"}],"loc":["globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As Thm 4.64.","note":"Cor 4.68 (ghd_02_19.tex:921): the contrapositive of 4.64 — disagreement forces a disconnected (not even preconnected) overlap, the only mechanism of non-uniqueness (cf. Thm 3.45); ers_corollary_4_68_eqOn for two functions as printed.","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:globally_defined_globally_hyperbolic","ref":"Cor 4.69","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":926,"proof":"","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_corollary_4_69","Causal.Causality.isPreconnected_of_inextensibleThrough","Causal.isConnected_of_curves"],"deps":[],"tex":"\\begin{corollary}\nLet $u_1 : \\R^{d+1} \\to \\R$ be a globally defined globally hyperbolic development of \\eqref{QuasilinearEq} arising from some initial data on a connected hypersurface $S \\subseteq \\R^{d+1}$. Let $u_2 : U_2 \\to \\R$ be another globally hyperbolic development of \\eqref{QuasilinearEq} of the same initial data. Then $u_1|_{U_2} = u_2$.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_69","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:633"},{"x":"Causal.Causality.isPreconnected_of_inextensibleThrough","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:345"},{"x":"Causal.isConnected_of_curves","t":"lean","loc":"lean-causal/Causal/SubExtension.lean:308"}],"loc":["globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As Thm 4.64.","note":"Cor 4.69 (ghd_02_19.tex:926): U₁ = ℝ^{d+1}, so the hypotheses on U₁ are the ladder nodes globally_hyperbolic and tarentin of C (at ⊤), and U₁ ∩ U₂ = U₂ is preconnected because every point lies on an inextensible curve of U₂ meeting the preconnected S (isPreconnected_of_inextensibleThrough).","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:LemConnected","ref":"Lemma 4.70","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":939,"proof":"ghd_02_19.tex:945","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_lemma_4_70","Causal.Causality.ers_lemma_4_70_isConnected","Causal.Causality.ers_lemma_4_70_core"],"deps":[],"tex":"\\begin{lemma} \nAssume that there exists a vector field  $T$ on $\\R^{d+1}$ such that $T$ is timelike with respect to  $g^{\\mu \\nu}(u, d u)$ for all $u, d u$, where $g$ is as in \\eqref{QuasilinearEq}. Let $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments of \\eqref{QuasilinearEq} arising from the same initial data on a connected hypersurface $S$ which has the property that every maximal integral curve of $T$ intersects $S$ at most once.  Then $U_1 \\cap U_2$ is connected.\n\\end{lemma}"},"ett":[{"x":"Causal.Causality.ers_lemma_4_70","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:968"},{"x":"Causal.Causality.ers_lemma_4_70_isConnected","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:986"},{"x":"Causal.Causality.ers_lemma_4_70_core","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:927"}],"loc":["is_causal"],"open":["inextensible_nested"],"open_reason":"(4.62) is read as InextensibleNestedOn Cτ C_i (OQ-41 (b), T-lad-nested-inextensible, blocked); is_causal is Cτ's (no closed orbit of T).","note":"Lemma 4.70 (ghd_02_19.tex:939). The integral curve of T through x, inextensible in each U_i, meets S once: its segment to S lies in U₁ ∩ U₂, which is connected through S.","geo":[{"model":"quasilinear","proves":["is_causal"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:CorSupLum","ref":"Cor 4.71","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":959,"proof":"ghd_02_19.tex:965","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_corollary_4_71","Causal.Causality.ers_lemma_4_70","Causal.Causality.ers_theorem_4_64"],"deps":["erslem:LemConnected","ersthm:ThmUnique"],"tex":"\\begin{corollary} \nAssume that there exists a vector field  $T$ on $\\R^{d+1}$ such that $T$ is timelike with respect to  $g^{\\mu \\nu}(u, d u)$ for all $u, d u$, where $g$ is as in \\eqref{QuasilinearEq} and that initial data is posed on a connected hypersurface $S$ which has the property that every maximal integral curve of $T$ intersects $S$ at most once. \n\nGiven two globally hyperbolic developments $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$, we then have $u_1(x) = u_2(x)$ for all $x \\in U_1 \\cap U_2$.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_71","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:662"},{"x":"Causal.Causality.ers_lemma_4_70","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:968"},{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466"}],"loc":["is_causal","globally_hyperbolic","tarentin"],"open":["inextensible_nested","local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As 4.70 and 4.64.","note":"Cor 4.71 (ghd_02_19.tex:959): 4.70 + 4.64, global uniqueness for superluminal equations (ers_corollary_4_71 composes them, the named hypotheses of both kept).","geo":[{"model":"quasilinear","proves":["is_causal","globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"},{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:two_ghds_subluminal_quasilinear","ref":"Lemma 4.72","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":976,"proof":"ghd_02_19.tex:980","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_lemma_4_72","Causal.Causality.ers_lemma_4_72_isConnected"],"deps":[],"tex":"\\begin{lemma}\nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two GHDs of a subluminal quasilinear wave equation \\eqref{QuasilinearEq} arising from the same initial data given on a connected hypersurface $S$ that is achronal with respect to the Minkowski metric $m$. Assume, moreover, that $u_1 : U_1 \\to \\R$ is a $m$-GHD. Then $U_1 \\cap U_2$ is connected.\n\\end{lemma}"},"ett":[{"x":"Causal.Causality.ers_lemma_4_72","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1034"},{"x":"Causal.Causality.ers_lemma_4_72_isConnected","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1059"}],"loc":["is_causal","curves_extend","curve_nested"],"open":[],"open_reason":"","note":"Lemma 4.72 (ghd_02_19.tex:976), the ladder's consequence at curve_nested. A g(u₂)-causal curve is m-causal (subluminality: CurveNestedOn C₂ C_m on U₂), so it cannot leave the m-GH U₁ before meeting S. is_causal and curves_extend are Minkowski's (C_m, the wider causality). OQ-41 (c): S is taken m-acausal where ERS print m-achronal. Since T-abs-nested-converse (8044439) the curve nesting is a ≤-nesting when the narrower causality is causally arc-connected (Causal.Causality.CurveNestedOn.leNested_of_causallyArcConnected, leNested_iff_curveNestedOn_top), and then Causal.NestedTransfer (T-abs-nested-transfer, f868749) carries is_causal, strong causality (both forms) and a time function of C_m to C₂ (LeNested.isCausal, .stronglyCausal, .stronglyCausalOpen, .hasTimeFunction) but not tarentin (Causal.spacelikeLine_separates_tarentin); 4.72 itself consumes the curve nesting directly and needs none of these (rebound 2026-11-21, notes only).","geo":[{"model":"minkowski","proves":["is_causal","curves_extend"],"by":[{"x":"Causal.minkowski_isCausal","t":"lean","loc":"lean-causal/Causal/Minkowski.lean:110"},{"x":"Causal.minkowski_curvesExtend","t":"lean","loc":"lean-causal/Causal/Model/CurvesExtendModels.lean:95"}],"extra":{}},{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:CorUniqueSub","ref":"Cor 4.73","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":988,"proof":"","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_corollary_4_73","Causal.Causality.ers_lemma_4_72","Causal.Causality.ers_theorem_4_64","Causal.IsMDevelopment.isUniqueDevelopment"],"deps":[],"tex":"\\begin{corollary}\n\nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two GHDs of a subluminal quasilinear wave equation \\eqref{QuasilinearEq} arising from the same initial data given on a connected hypersurface $S$ that is achronal with respect to the Minkowski metric $m$. Assume, moreover, that $u_1 : U_1 \\to \\R$ is a $m$-GHD. Then $u_1 = u_2$ on $U_1 \\cap U_2$.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_73","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:691"},{"x":"Causal.Causality.ers_lemma_4_72","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1034"},{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466"},{"x":"Causal.IsMDevelopment.isUniqueDevelopment","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:326"}],"loc":["is_causal","curves_extend","curve_nested","globally_hyperbolic","tarentin","causally_arc_connected"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As 4.64.","note":"Cor 4.73 (ghd_02_19.tex:988): 4.72 + 4.64, every m-GHD is a UGHD (ers_corollary_4_73; for the developments of Causal.ErsMughd, IsMDevelopment.isUniqueDevelopment, ERS's use at :1053). is_causal, curves_extend are Minkowski's; curve_nested is subluminality; causally_arc_connected is ≤ of g(u) realised by causal curves, which with curve_nested and C_m's acausality of S gives 4.73's IsAcausalOn U₁ S; globally_hyperbolic, tarentin are g(u₁)'s on U₁.","geo":[{"model":"minkowski","proves":["is_causal","curves_extend"],"by":[{"x":"Causal.minkowski_isCausal","t":"lean","loc":"lean-causal/Causal/Minkowski.lean:110"},{"x":"Causal.minkowski_curvesExtend","t":"lean","loc":"lean-causal/Causal/Model/CurvesExtendModels.lean:95"}],"extra":{}},{"model":"quasilinear","proves":["curve_nested","globally_hyperbolic","tarentin","causally_arc_connected"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"},{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:us_remark_better_bounds","ref":"Remark 4.74","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":993,"proof":"","nl":"informal","lean":"partial","decls":["Causal.Causality.ers_lemma_4_72","Causal.Causality.CurveNestedOn.trans","Causal.Causality.LeNested.trans_curveNestedOn","Causal.Causality.LeNested.trans"],"deps":[],"tex":"\\begin{remark}\nLet us remark that better bounds on the light cones of $g^{\\mu \\nu}(u, du)$ translate into an improvement of the uniqueness results. Above, we have only made use of the trivial Minkowski bound on the light cones for subluminal equations. If, for example, for a specific subluminal equation one can improve the a priori bound on the light cones of $g^{\\mu \\nu}(u, du)$ for certain initial data, then one can also improve the uniqueness result for these initial data.\n\\end{remark}"},"ett":[{"x":"Causal.Causality.ers_lemma_4_72","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1034"},{"x":"Causal.Causality.CurveNestedOn.trans","t":"lean","loc":"lean-causal/Causal/NestedConverse.lean:107"},{"x":"Causal.Causality.LeNested.trans_curveNestedOn","t":"lean","loc":"lean-causal/Causal/NestedConverse.lean:111"},{"x":"Causal.Causality.LeNested.trans","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:142"}],"loc":["curve_nested"],"open":[],"open_reason":"","note":"Remark 4.74 (ghd_02_19.tex:993). A better a-priori cone bound is a narrower wider causality C_g ≤ C_b ≤ C_m: 4.72 applied with C_b in place of C_m gives more UGHDs. Subluminality being a curve nesting, the transitivity the remark uses is Causal.Causality.CurveNestedOn.trans (Causal.NestedConverse, T-abs-nested-converse, 8044439; rebound 2026-11-21): C_g curve-nested in C_b and C_b in C_m give C_g in C_m, so the bound C_b keeps 4.72's conclusion for m; the mixed forms LeNested.trans_curveNestedOn, CurveNestedOn.trans_leNested, and ≤-nesting's LeNested.trans (the ladder's consequence at le_nested) serve when the bound C_b ⊆ C_m is a ≤-nesting of constant-coefficient cones.","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmEx","ref":"Thm 4.75","ledger":{"kind":"theorem","number":"","title":"Local existence","file":"ghd_02_19.tex","line":1001,"proof":"ghd_02_19.tex:1011","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_theorem_4_75","Causal.Causality.ers_theorem_4_75_eqOn","Causal.Causality.ers_theorem_4_64_in","Causal.Causality.maxDevelopmentIn_eq","Causal.Causality.isCauchySurfaceOn_iSup_of_inf","Causal.Causality.isCauchySurfaceOn_of_componentOpens"],"deps":["ersthm:ThmUnique","ersrem:RemTime"],"tex":"\\begin{theorem}[Local existence] \nGiven initial data for a quasilinear wave equation \\eqref{QuasilinearEq}, there exists a globally hyperbolic development.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_75","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:677"},{"x":"Causal.Causality.ers_theorem_4_75_eqOn","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:643"},{"x":"Causal.Causality.ers_theorem_4_64_in","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:448"},{"x":"Causal.Causality.maxDevelopmentIn_eq","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:422"},{"x":"Causal.Causality.isCauchySurfaceOn_iSup_of_inf","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:537"},{"x":"Causal.Causality.isCauchySurfaceOn_of_componentOpens","t":"lean","loc":"lean-causal/Causal/ErsUnions.lean:509"}],"loc":["globally_hyperbolic","tarentin","is_causal"],"open":["local_uniqueness","slice_restart","frontier_stays_in","is_causal"],"open_reason":"Named: local existence on {t = 0} patches (Sogge; IsLocalDevelopment), and Theorem 4.64's inputs located in each component A of DS_p ∩ DS_q (RestartsIn). These are: A meets S (N's integral curves); local uniqueness on S ∩ A; FrontierStaysIn in A (T-loc-quasilinear-frontier); SliceRestart in A (T-loc-quasilinear-slice). Both T-loc targets are scoped today to U₁ ∩ U₂, so the component-located forms are a scope question for both (T-lad-development-nodes; OQ-57 (b), T-lad-ers-restart-nodes). is_causal: the union U = ⋃ DS_p is causal (≤_U of the patched causality antisymmetric). That is a part of the printed conclusion (U a GHD, :1021), assumed as in row 4.77. For a general quasilinear equation no T-loc target supplies it: T-loc-quasilinear-nesting's is_causal needs (4.62).","note":"Thm 4.75 (ghd_02_19.tex:1001). The claim u_p = u_q on DS_p ∩ DS_q (ers_theorem_4_75_eqOn) is proved by running Thm 4.64's argument in each component A, with W = DS_p (ers_theorem_4_64_in, maxDevelopmentIn_eq). This replaces ERS's 4.64 on D_pS_A, D_qS_A and the boundary argument. The union has S as Cauchy surface by Thm 4.77's argument without S ⊆ Uᵢ (isCauchySurfaceOn_iSup_of_inf). That argument uses S Cauchy in each DS_p ∩ DS_q, obtained from the components (isCauchySurfaceOn_of_componentOpens), and the union causal. GH of U is not concluded (OQ-57 (c)). Each DS_p is GH and tarentin for g(u_p), inside IsLocalDevelopment.","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmUMGHD","ref":"Thm 4.77","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":1031,"proof":"ghd_02_19.tex:1037","nl":"proved","lean":"partial","decls":["Causal.Causality.ers_theorem_4_77","Causal.Causality.ers_theorem_4_77_greatest"],"deps":["ersthm:ThmEx","erscor:CorSupLum","ersrem:RemTime"],"tex":"\\begin{theorem} \nAssume that there exists a vector field  $T$ on $\\R^{d+1}$ such that $T$ is timelike with respect to  $g^{\\mu \\nu}(u, d u)$ for all $u, d u$, where $g$ is as in \\eqref{QuasilinearEq} and that initial data is posed on a connected hypersurface $S$ which has the property that every maximal integral curve of $T$ intersects $S$ at most once.\n\nGiven such initial data, there then exists a \\emph{unique maximal globally hyperbolic development} $u_{\\max} : U_{\\max} \\to \\R$, that is, a globally hyperbolic development  $u_{\\max} : U_{\\max} \\to \\R$ with the property that for any other globally hyperbolic development $u : U \\to \\R$ of the same initial data we have $U \\subseteq U_{\\max}$ and $u_{\\max}|_U = u$.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_77","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1084"},{"x":"Causal.Causality.ers_theorem_4_77_greatest","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1185"}],"loc":["is_causal"],"open":["inextensible_nested"],"open_reason":"Through Cor 4.71 (OQ-41 (b)). OQ-41 (d): the Lean skeleton adds 'the union is causal' and concludes 'S is a Cauchy surface', not GH (Geroch (iii) ⇒ (i) unproved).","note":"Thm 4.77 (ghd_02_19.tex:1031): the union of all GHDs is the unique MGHD; its Cauchy property by ERS's open–closed argument along a curve (the `step` of ers_theorem_4_77); global uniqueness (`hpair`) is Rem 4.67 after Cor 4.71.","geo":[{"model":"quasilinear","proves":["is_causal"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:RemMGHD","ref":"Remark 4.78","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":1047,"proof":"","nl":"informal","lean":"partial","decls":["Causal.Causality.ers_theorem_4_77_greatest","Causal.ers_remark_4_78","Causal.exists_eqOn_of_pairwise","Causal.Causality.isCauchySurfaceOn_iSup_of_isAcausalOn"],"deps":[],"tex":"\\begin{remark} \nWe note that the above construction of a unique maximal globally hyperbolic development is always possible provided the property of global uniqueness holds.\n\\end{remark}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_77_greatest","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1185"},{"x":"Causal.ers_remark_4_78","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:271"},{"x":"Causal.exists_eqOn_of_pairwise","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:254"},{"x":"Causal.Causality.isCauchySurfaceOn_iSup_of_isAcausalOn","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:132"}],"loc":["curve_nested","causally_arc_connected","is_causal"],"open":[],"open_reason": bluminal_quasilinear_wave","ref":"Thm 4.80","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":1066,"proof":"ghd_02_19.tex:1071","nl":"proved","lean":"partial","decls":["Causal.ers_theorem_4_80","Causal.ers_theorem_4_80_of_exists","Causal.IsMaximalMDevelopment.unique","Causal.IsMaximalMDevelopment.le_of_isMaximalUniqueDevelopment","Causal.Causality.isCauchySurfaceOn_sSup_of_isCausal","Causal.ers_remark_4_78","Causal.Causality.ers_corollary_4_73"],"deps":["ersthm:ThmMUGHD","erscor:CorUniqueSub","ersrem:RemMGHD","ersthm:ThmUMGHD"],"tex":"\\begin{theorem}\nConsider a subluminal quasilinear wave equation of the form \\eqref{QuasilinearEq}.\nGiven initial data on a connected hypersurface $S$ that is acausal with respect to the Minkowski metric there exists a unique $m$-MGHD, i.e., a $m$-GHD $u_{\\max}: U_{\\max} \\to \\R$  with the property that for any other $m$-GHD $u: U \\to \\R$ of the same initial data we have $U \\subseteq U_{\\max}$ and $u_{\\max}|_U = u$. \n\\end{theorem}"},"ett":[{"x":"Causal.ers_theorem_4_80","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:483"},{"x":"Causal.ers_theorem_4_80_of_exists","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:439"},{"x":"Causal.IsMaximalMDevelopment.unique","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:463"},{"x":"Causal.IsMaximalMDevelopment.le_of_isMaximalUniqueDevelopment","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:470"},{"x":"Causal.Causality.isCauchySurfaceOn_sSup_of_isCausal","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:169"},{"x":"Causal.ers_remark_4_78","t":"lean","loc":"lean-causal/Causal/ErsMughd.lean:271"},{"x":"Causal.Causality.ers_corollary_4_73","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:691"}],"loc":["curve_nested","causally_arc_connected","is_causal","curves_extend","globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in","inextensible_nested"],"open_reason":"As Thm 4.79.","note":"Thm 4.80 (ghd_02_19 \partial U_1 \\cap V$, all points below $\\mathrm{graph} f$ in $(-\\varepsilon, \\varepsilon)^{d+1}$ are mapped into $U_1$ and all points above $\\mathrm{graph} f$ in $(-\\varepsilon, \\varepsilon)^{d+1}$ are mapped into $\\R^{d+1} \\setminus U_1$.\n\n \nThen $u_1 : U_1 \\to \\R$ is the unique MGHD, i.e., any other GHD $u : U \\to \\R$ satisfies  $U \\subseteq U_1$ and thus also $u_1|_U = u$.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_82","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1304"},{"x":"Causal.Causality.ers_theorem_4_82_of_oneSidedBoundary","t":"lean","loc":"lean-causal/Causal/LadderLocal.lean:398"},{"x":"Causal.Causality.ers_theorem_4_82_of_sliceRestart","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:722"},{"x":"Causal.Causality.ers_theorem_4_82_of_globallyHyperbolicOn","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:749"},{"x":"Causal.Causality.frontier_connectedComponentIn_inter","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1209"},{"x":"Causal.Causality.exists_spacelike_boundary_point","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1252"}],"loc":["globally_hyperbolic","tarentin"],"open":["one_sided_boundary","slice_restart","local_uniqueness"],"open_reason":"(4.83) enters through its topological content Causal.Causality.OneSidedBoundary (`honesided`; node: OQ-52 (b), T-lad-one-sided-node); at the quasilinear model Lemma 4.86 supplies it from curve_nested and a Cauchy slice, Causal.ers_theorem_4_82_of_slopeCone (T-loc-quasilinear-one-sided); `hstep` is SliceRestart definitionally (ers_theorem_4_82_of_sliceRestart; OQ-57 (b), T-lad-ers-restart-nodes) and contains Prop 4.63 (T-lad-development-nodes). OQ-41 (e): ∂S read as closure(S) ∖ S.","note":"Thm 4.82 (ghd_02_19.tex:1100, proof 1114–1139). The component A of U₁ ∩ U₂ through S has boundary points in U₂ on ∂U₁ (4.84); a spacelike one (4.85) without null geodesics; one-sidedness puts a neighbourhood's trace on U₁ inside A; the r
