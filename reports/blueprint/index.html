<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETT Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The atlas's tokens (reports/atlas/template.html), plus --fails for refuted pairs. */
:root{
  --bg:#eef2f5; --canvas:#f6f8fa; --grid:#dfe5eb; --ink:#1b2735; --ink-2:#4d5c6c; --ink-3:#7d8a98;
  --line:#c3ccd6; --card:#ffffff; --accent:#2c5f8f; --accent-soft:#dbe7f2;
  --closed:#2f8259; --partial:#c4861a; --stated:#7f8d9b; --terminal:#b8c1ca; --none:#ffffff; --fails:#b04a3c;
  --closed-soft:#dcefe4; --partial-soft:#f6e7cc; --fails-soft:#f5dcd8;
  --edge:#8d9aa8; --edge-hi:#2c5f8f; --shadow:0 1px 2px rgba(27,39,53,.08),0 4px 14px rgba(27,39,53,.06);
  --f-display:"Newsreader","Iowan Old Style","Georgia",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d; --fails:#e27d6c;
  --closed-soft:#173326; --partial-soft:#3a2c12; --fails-soft:#3b1d19;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d; --fails:#e27d6c;
  --closed-soft:#173326; --partial-soft:#3a2c12; --fails-soft:#3b1d19;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.005em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-size:.86rem;font-weight:500;padding:6px 12px;border-radius:6px;color:var(--ink-2);border:1px solid transparent}
.tabs button:hover{background:var(--accent-soft)}
.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs .n{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);margin-left:4px}
.spacer{flex:1}
.roadbtn{font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap}
.roadbtn[aria-pressed="true"],.roadbtn:hover{background:var(--accent);color:var(--card)}
.roadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;gap:6px;align-items:center}
.search input{font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:14rem;max-width:48vw}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;position:relative;min-width:0;min-height:0}
.view.scroll{overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 40px}
.stage{position:absolute;inset:0;background-color:var(--canvas);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
svg#g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#g:active{cursor:grabbing}
.panel>*{flex-shrink:0}
.panel{width:min(440px,40%);border-left:1px solid var(--line);background:var(--card);overflow:auto;padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance;line-height:1.2}
.panel h2.mono{font-family:var(--f-mono);font-size:1.02rem;font-weight:500;overflow-wrap:anywhere}
h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.panel p{margin:0;line-height:1.5;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:.8rem;overflow-wrap:anywhere}
.panel ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);line-height:1.45}
.tex{border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.55;overflow-x:auto;font-size:.92rem;background:var(--canvas)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--card);font-family:var(--f-body)}
button.chip{cursor:pointer}
.chip.closed{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.target{border-color:var(--accent);color:var(--accent);font-family:var(--f-mono);font-size:.72rem}
.chip.open{border-color:var(--partial);color:var(--partial);border-style:dashed;font-weight:600}
.chip.none{color:var(--ink-3);border-style:dotted}
.chip.missing,.chip.fails{background:var(--fails);border-color:var(--fails);color:#fff}
.chip.cond{border-color:var(--partial);color:var(--partial)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0;box-sizing:border-box;background:var(--ink-3)}
.dot.s-active{background:var(--accent)}.dot.s-ready{background:transparent;border:1.5px solid var(--accent)}.dot.s-needs-ruling{background:var(--partial)}
.dot.s-blocked{background:var(--fails)}.dot.s-planned{background:transparent;border:1.5px solid var(--ink-3)}.dot.s-done{background:var(--closed)}.dot.s-dropped{background:var(--terminal)}
.chip.cmp{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.brow .chips{min-width:0;max-width:100%}
.brow .pl{max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.chip.seed{border-style:dashed}
.chip.s-ready{border-color:var(--accent);color:var(--accent)}
.chip.s-active{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip.s-needs-ruling{border-color:var(--partial);color:var(--partial);font-weight:600}
.chip.s-blocked{border-style:dashed;color:var(--fails);border-color:var(--fails)}
.chip.s-done{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.s-dropped{text-decoration:line-through;color:var(--ink-3)}
.chip.s-planned{color:var(--ink-2)}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.pl{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pl:hover,.pl:focus-visible{background:var(--accent-soft)}
.pl.c{border-style:dashed;border-color:var(--partial)}
.pl.f{border-color:var(--fails);color:var(--fails)}
.pl.ghost{color:var(--ink-3);border-style:dashed;cursor:default}
.pl.ghost:hover{background:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--ink-3)}
ol.wit{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
ol.wit .mono,ul.wit .mono{display:block;color:var(--ink)}
.loc{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);overflow-wrap:anywhere}
ul.wit{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
ul.wit>li{border-left:3px solid var(--line);padding-left:10px}
ul.wit>li.c{border-left-color:var(--partial)}
ul.wit>li.f{border-left-color:var(--fails)}
ul.wit>li.ok{border-left-color:var(--closed)}
ul.wit>li.tg{border-left-color:var(--accent)}
.warn{border-left:3px solid var(--partial);padding:2px 0 2px 10px;color:var(--ink-2);font-size:.84rem;line-height:1.45}
.err{border-left:3px solid var(--fails);padding:2px 0 2px 10px;color:var(--ink-2);font-size:.84rem}
details summary{cursor:pointer;color:var(--ink-2);font-size:.86rem}
.prov{font-size:.78rem;color:var(--ink-3);line-height:1.45}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--ink-2);max-width:calc(100% - 82px);box-shadow:var(--shadow)}
.legend svg{vertical-align:middle;margin-right:5px;overflow:visible}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:2px solid var(--line);background:var(--card)}
.tools{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.tools button{font:inherit;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.tools button:focus-visible{outline:2px solid var(--accent)}
.mode{position:absolute;left:12px;top:10px;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:var(--shadow);z-index:2}
.mode button{all:unset;cursor:pointer;font-size:.8rem;font-weight:500;padding:5px 12px;background:var(--card);color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.mode button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{position:absolute;right:12px;top:10px;font-size:.74rem;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
/* the ladder graph */
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.node:hover rect.box{stroke:var(--accent);stroke-width:2}
.node:focus-visible{outline:none}.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5}
.node text{fill:var(--ink);font-family:var(--f-body)}
.node .t-mono{font-family:var(--f-mono)}
.node .t-dim{fill:var(--ink-3)}
.node.sel rect.box{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.node.sel text{fill:var(--card)}
.node.down rect.box{fill:var(--closed-soft);stroke:var(--closed);stroke-width:2}
.node.up rect.box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.node.down.c rect.box,.node.up.c rect.box{stroke:var(--partial);stroke-dasharray:5 3;fill:var(--partial-soft)}
.node.no rect.box{fill:var(--fails-soft);stroke:var(--fails);stroke-width:2}
.node.dim{opacity:.45}
.junction circle{fill:var(--card);stroke:var(--edge);stroke-width:1.4}
.junction text{fill:var(--ink-2);font-size:11px;font-family:var(--f-body)}
.junction{cursor:pointer}
.junction.c circle{stroke:var(--partial)}
.edge path.vis{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-opacity:.9}
.edge.seed path.vis{stroke-dasharray:6 4}
.edge.c path.vis{stroke:var(--partial)}
.edge.hi path.vis{stroke:var(--edge-hi);stroke-width:2.4;stroke-opacity:1}
.edge.c.hi path.vis{stroke:var(--partial)}
.edge text{fill:var(--partial);font-size:10.5px;font-family:var(--f-mono);paint-order:stroke;stroke:var(--canvas);stroke-width:3px}
.edge path.hit{fill:none;stroke:transparent;stroke-width:12px;pointer-events:stroke;cursor:pointer}
.edge.dim{opacity:.3}
/* the pair matrix */
.matrix{position:absolute;inset:0;overflow:auto;padding:56px 16px 90px;background:var(--canvas)}
.matrix table{border-collapse:separate;border-spacing:2px;margin:0 auto;font-size:.76rem}
.matrix th{font-family:var(--f-mono);font-weight:500;color:var(--ink-2);white-space:nowrap}
.matrix th.row{text-align:right;padding-right:6px}
.matrix th.col{height:150px;vertical-align:bottom;padding:0}
.matrix th.col div{writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0;margin:0 auto}
.matrix th button{all:unset;cursor:pointer}
.matrix th button:hover{color:var(--accent)}
.matrix td{width:26px;height:26px;padding:0}
.matrix td button{all:unset;display:block;width:26px;height:26px;text-align:center;line-height:26px;border-radius:4px;cursor:pointer;font-size:.86rem;box-sizing:border-box}
.matrix td button:focus-visible{outline:2px solid var(--accent)}
.matrix button.m-implied,.mkey b.m-implied{background:var(--closed);color:#fff}
.matrix button.m-implied-c,.mkey b.m-implied-c{background:repeating-linear-gradient(45deg,var(--closed-soft) 0 4px,var(--partial-soft) 4px 8px);color:var(--ink);border:1.5px dashed var(--partial)}
.matrix button.m-fails,.mkey b.m-fails{background:var(--fails);color:#fff}
.matrix button.m-fails-c,.mkey b.m-fails-c{background:var(--fails-soft);color:var(--fails);border:1.5px dashed var(--fails)}
.matrix button.m-open,.mkey b.m-open{background:var(--card);border:1.5px solid var(--partial);color:var(--partial)}
.matrix button.m-unknown,.mkey b.m-unknown{background:var(--grid);color:var(--ink-3)}
.matrix button.m-diag,.mkey b.m-diag{background:transparent;color:var(--ink-3)}
.matrix button.m-cross,.mkey b.m-cross{background:transparent;color:var(--ink-3);border:1px dotted var(--line)}
.matrix h3{text-align:center;margin:18px 0 8px}
.cluster rect{fill:none;stroke:var(--line);stroke-dasharray:2 4}
.cluster text{fill:var(--ink-3);font-family:var(--f-body);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.mkey{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:14px auto 0;font-size:.76rem;color:var(--ink-2);max-width:720px}
.mkey span{display:inline-flex;align-items:center;gap:6px}
.mkey b{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;font-weight:400;font-size:.74rem;box-sizing:border-box}
/* binders and roadmap */
.paper{max-width:1180px;margin:0 auto 34px}
.phead{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.phead h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;line-height:1.2;text-wrap:balance}
.phead p{margin:0;color:var(--ink-2);line-height:1.45;max-width:90ch}
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:4px}
.cov>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.cov h4{margin:0 0 5px;font-size:.74rem;color:var(--ink-3);font-weight:600}
.cov .chips{gap:4px}
.btable{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.brow{display:grid;grid-template-columns:minmax(170px,1.05fr) minmax(170px,1.2fr) minmax(150px,1fr) minmax(190px,1.25fr);border-top:1px solid var(--line);cursor:pointer}
.brow:first-child{border-top:0}
.brow:hover{background:var(--accent-soft)}
.brow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.brow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.brow>div{padding:9px 11px;min-width:0;display:flex;flex-direction:column;gap:5px;border-left:1px solid var(--grid)}
.brow>div:first-child{border-left:0}
.bhead{cursor:default;background:var(--canvas)}
.bhead:hover{background:var(--canvas)}
.bhead>div{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.bhead small{font-size:.68rem;letter-spacing:0;text-transform:none;font-weight:400}
.rname b{font-family:var(--f-display);font-size:1.02rem;font-weight:600}
.rname .mono{font-size:.72rem;color:var(--ink-3)}
.small{font-size:.74rem;color:var(--ink-3);line-height:1.4}
.names{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.45}
.geo{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.geo .model{font-size:.72rem;font-weight:600;color:var(--ink-2);min-width:7.5em}
.lbl{display:none;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cross{border-collapse:collapse;font-size:.76rem;width:100%}
.cross th,.cross td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.cross th{font-weight:600;color:var(--ink-3);font-size:.7rem}
.cross td.p{text-align:left;font-family:var(--f-mono);font-size:.72rem}
.cross .y{color:#fff;background:var(--closed)}
.cross .t{color:var(--accent);background:var(--accent-soft)}
.cross .o{color:var(--partial)}
.board{max-width:1180px;margin:0 auto 30px}
.board>h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0 0 4px}
.board>p{margin:0 0 10px;color:var(--ink-2);max-width:90ch;line-height:1.45}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:6px 0 12px}
.sbar span{display:block;height:100%}
.sgroup{margin:8px 0 16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.tcard:hover,.tcard.sel{border-color:var(--accent);box-shadow:var(--shadow)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.72rem;color:var(--ink-3)}
.tcard b{font-weight:500;line-height:1.35;font-size:.86rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.banner{max-width:1180px;margin:0 auto 14px;border:1px solid var(--fails);border-radius:8px;padding:8px 12px;background:var(--fails-soft);color:var(--ink);font-size:.84rem}
.banner ul{margin:4px 0 0;padding-left:1.2em}
@media (max-width:760px){
  main{flex-direction:column}
  .view{flex:1 1 auto}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line);flex:0 0 46%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  h1{font-size:1.15rem}
  .search input{width:9rem}
  .brow{grid-template-columns:1fr}
  .brow>div{border-left:0;border-top:1px dashed var(--grid)}
  .brow>div:first-child{border-top:0}
  .bhead{display:none}
  .lbl{display:block}
  .legend{display:none!important}
  .search label,.long{display:none}
  header{gap:8px 10px;padding-block:8px}
  .roadbtn{padding:5px 9px}
}
@media (min-width:761px){.short{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

<script>
const DATA = {"ladder":{"props":[{"id":"is_causal","lean":"Causal.Causality.IsCausal","leanloc":"lean-causal/Causal/Properties.lean:95","label":"def:causal_spacetime","what":"≤_M is antisymmetric (an order, reflexivity and transitivity being axioms): no closed causal loops in M","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causal spacetime","file":"ETT.tex","line":653,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.IsCausal"],"deps":[],"tex":"\\begin{defi}[Causal spacetime]\nA topological spacetime is causal if the relation $\\leq_M$ is an order relation on $M$.\n\\end{defi}"}},{"id":"strongly_causal","lean":"Causal.Causality.StronglyCausal","leanloc":"lean-causal/Causal/Properties.lean:105","label":"def:strongly_causal_spacetime","what":"every neighbourhood of every point contains a neighbourhood, not necessarily open, causally convex in M (the definition, DEC-7)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Strongly causal spacetime","file":"ETT.tex","line":662,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.StronglyCausal","Causal.Causality.StronglyCausalOpen"],"deps":[],"tex":"\\begin{defi}[Strongly causal spacetime]\nLet $M$ be a topological spacetime. $M$ is strongly causal if\nfor every $p\\in M$ and every neighbourhood $\\U$ of $p$ there exists a neighbourhood $\\V\\subset \\U$ of $p$\nwhich is causally convex in $M$.\n\\end{defi}"}},{"id":"strongly_causal_open","lean":"Causal.Causality.StronglyCausalOpen","leanloc":"lean-causal/Causal/Properties.lean:109","label":"def:strongly_causal_spacetime","what":"every neighbourhood of every point contains an OPEN neighbourhood causally convex in M (the literal reading through defi:convexite_causale; auxiliary since DEC-7)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Strongly causal spacetime","file":"ETT.tex","line":662,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.StronglyCausal","Causal.Causality.StronglyCausalOpen"],"deps":[],"tex":"\\begin{defi}[Strongly causal spacetime]\nLet $M$ be a topological spacetime. $M$ is strongly causal if\nfor every $p\\in M$ and every neighbourhood $\\U$ of $p$ there exists a neighbourhood $\\V\\subset \\U$ of $p$\nwhich is causally convex in $M$.\n\\end{defi}"}},{"id":"globally_hyperbolic","lean":"Causal.Causality.GloballyHyperbolic","leanloc":"lean-causal/Causal/Properties.lean:144","label":"def:globally_hyperbolic","what":"causal, and every full diamond J_M(p,q) is compact","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Globally hyperbolic","file":"ETT.tex","line":995,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.GloballyHyperbolic"],"deps":[],"tex":"\\begin{defi}[Globally hyperbolic] Let $M$ be a topological spacetime. $M$ is globally hyperbolic if $M$ is causal and\nif $J_M(p,q)$ is compact for all $p,q\\in M$.\n\\end{defi}"}},{"id":"push_up","lean":"Causal.Causality.PushUp","leanloc":"lean-causal/Causal/Properties.lean:69","label":"defi:pushup","what":"in every open U: x ≤_U y ≪_U z or x ≪_U y ≤_U z implies x ≪_U z","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Push-up property","file":"ETT.tex","line":307,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.PushUp","Causal.Causality.pushUp_iff"],"deps":[],"tex":"\\begin{defi}[Push-up property]\nA topological spacetime $M$ has the \\emph{push-up property} if for every open subset $\\U$ of $M$ and\nevery $x\\in \\U$,\n$$J^\\pm_\\U\\left(I^\\pm_\\U(x)\\right)\\subset I^\\pm_\\U(x) \\qquad\\text{and}\\qquad I^\\pm_\\U\\left(J^\\pm_\\U(x)\\right)\\subset I^\\pm_\\U(x);$$\nequivalently, concatenating a causal relation with a chronological one produces a chronological one.\n\\end{defi}"}},{"id":"causally_open","lean":"Causal.Causality.CausallyOpen","leanloc":"lean-causal/Causal/Properties.lean:130","label":"def:causally_open_spacetime_open","what":"for every open U and open V ⊂ U, J⁺_U(V) and J⁻_U(V) are open (the definition read with J±, DEC-8)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally open spacetime / open causality","file":"ETT.tex","line":694,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyOpenFuture","Causal.Causality.CausallyOpen"],"deps":[],"tex":"\\begin{defi}[Causally open spacetime / open causality]\nLet $M$ be a topological spacetime. The causality of $M$ is open, and $M$ is causally open, if for every open subset $\\U$ of $M$\nand every open subset $\\V\\subset \\U$ the set $J^+_\\U(\\V)$ is open.\n\\end{defi}"}},{"id":"causally_open_future","lean":"Causal.Causality.CausallyOpenFuture","leanloc":"lean-causal/Causal/Properties.lean:121","label":"def:causally_open_spacetime_open","what":"for every open U and open V ⊂ U, J⁺_U(V) is open (the definition as printed, J⁺ alone; auxiliary since DEC-8)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally open spacetime / open causality","file":"ETT.tex","line":694,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyOpenFuture","Causal.Causality.CausallyOpen"],"deps":[],"tex":"\\begin{defi}[Causally open spacetime / open causality]\nLet $M$ be a topological spacetime. The causality of $M$ is open, and $M$ is causally open, if for every open subset $\\U$ of $M$\nand every open subset $\\V\\subset \\U$ the set $J^+_\\U(\\V)$ is open.\n\\end{defi}"}},{"id":"absolutely_minimal","lean":"Causal.Precausality.AbsolutelyMinimal","leanloc":"lean-causal/Causal/Generated.lean:247","label":"def:topological_space_causality_absolutely","what":"for every open cover, the precausality generated by the restrictions to its members is the given one","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"","file":"ETT.tex","line":397,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Precausality.AbsolutelyMinimal","Causal.Precausality.AbsolutelyMinimalOn","Causal.Precausality.absolutelyMinimal_iff"],"deps":[],"tex":"\\begin{defi} Let $M$ be a topological space.\nA precausality $(\\leq,\\ll)$ on $M$ is absolutely minimal if for every open cover $(\\U_i)_{i\\in I}$ the precausality generated by $(\\U_i,\\leq_{\\U_i}, \\ll_{\\U_i})_{i\\in I}$ is equal to $(\\leq,\\ll)$.\n\\end{defi}"}},{"id":"causally_arc_connected","lean":"Causal.Causality.CausallyArcConnected","leanloc":"lean-causal/Causal/ArcConnected.lean:133","label":"def:causal_arc_connectedness","what":"in every open U, p ≤_U q (resp. p ≪_U q) iff a causal (resp. chronal) curve in U joins p to q","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causal arc-connectedness","file":"ETT.tex","line":403,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyArcConnected","Causal.Causality.CausallyArcConnectedOn","Causal.Causality.causallyArcConnectedOn_iff"],"deps":[],"tex":"\\begin{defi}[Causal arc-connectedness] Let $M$ be a topological spacetime. $M$ is causally arc-connected if for every open subset\n$\\U$ and all $p,q\\in \\U$ the following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $p\\leq_\\U q$ (resp. $p\\ll_\\U q$);\n\\item there exists a future causal (resp. future chronal) curve $c:[0,1]\\rightarrow \\U$ with $c(0)=p$ and $c(1)=q$.\n\\end{enumerate}\n\\end{defi}"}},{"id":"causally_plain","lean":"Causal.Causality.CausallyPlain","leanloc":"lean-causal/Causal/Properties.lean:55","label":"defi:causalement_plat","what":"for every open U and A ⊂ M, Int J±_U(A) ⊂ closure I±_U(A): no open set of causal, non-chronological points (no bubbles)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Causally plain","file":"ETT.tex","line":283,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.CausallyPlain","Causal.Causality.causallyPlain_iff"],"deps":[],"tex":"\\begin{defi}[Causally plain]\nA topological spacetime $M$ is \\emph{causally plain} if for every open subset $\\U$ of $M$ and every $A\\subset \\U$,\n$$\\mathrm{Int}\\left(J^\\pm_\\U(A)\\right)\\subset \\overline{I^\\pm_\\U(A)},$$\nequivalently if every non-empty open subset of $J^\\pm_\\U(A)$ meets $I^\\pm_\\U(A)$.\n\\end{defi}"}},{"id":"tarentin","lean":"Causal.Causality.Tarentin","leanloc":"lean-causal/Causal/Properties.lean:116","label":"def:tarentin_spacetime","what":"every neighbourhood of every x contains p, q with x ∈ Int J_M(p,q)","sort":"causality","extra":{},"ett":{"kind":"definition","number":"","title":"Tarentin spacetime","file":"ETT.tex","line":677,"proof":"","nl":"definition","lean":"closed","decls":["Causal.Causality.Tarentin"],"deps":[],"tex":"\\begin{defi}[Tarentin spacetime]\nA topological spacetime $M$ is tarentin if for every $x\\in M$ and every neighbourhood $\\U$ of $x$\nthere exist $p,q\\in \\U$ such that $x\\in \\mathrm{Int}\\left(J_M(p,q)\\right)$.\n\\end{defi}"}},{"id":"time_function","lean":"Causal.Causality.HasTimeFunction","leanloc":"lean-causal/Causal/CBG/Pgcd.lean:133","label":"","what":"there is a continuous T : M → ℝ with T x < T y whenever x ≤_M y and x ≠ y (Sbierski Lemma 3.3's hypothesis; not ETT's defi:fonction_temps, which asks a morphism to the timelike line)","sort":"causality","extra":{},"ett":null},{"id":"curves_extend","lean":"Causal.Causality.CurvesExtend","leanloc":"lean-causal/Causal/CauchyExtension.lean:82","label":"","what":"every causal curve of M over a segment [a, b] lies on an inextensible causal curve of M (over some interval)","sort":"causality","extra":{},"ett":null},{"id":"rigid","lean":"Causal.CBG.IsRigidFor","leanloc":"lean-causal/Causal/CBG/Geometry.lean:196","label":"rem:CBG_analytique","what":"A1: for structures s, t with Hausdorff target, IsRigidFor (IsMor s t): two morphisms on a connected open V agreeing on a non-empty open O ⊆ V agree on V (Sbierski Lemma 3.1, Cor 3.2)","sort":"geometry","extra":{},"ett":{"kind":"remark","number":"","title":"Where the Einstein equations were","file":"ETT.tex","line":1903,"proof":"","nl":"informal","lean":"partial","decls":["Causal.CBG.Geometry.rigid_univ","Causal.CBG.IsRigidFor","Causal.CBG.flat_rigid","Causal.CBG.not_isRigidFor_branchingLine","Causal.timelikeLine_not_isRigid","Causal.CBG.not_exists_isUniversal_halfLineDev","Causal.CBG.causal_pgcd_not_unique","Causal.CBG.IsCGHD.eqOn","Causal.CBG.Dev.IsMorphism.eq_id","Causal.CBG.ppcmDev_desc","Causal.CBG.t2Space_gluing_mcghd"],"deps":[],"tex":"\\begin{rem}[Where the Einstein equations were]\nIn \\cite{MR0250640} the Hausdorffness of the glued object follows from the local uniqueness of the\nsolutions of the Einstein equations. Here it follows from the fact that there is no unreasonable\nmorphism between open subsets of the model spaces: the structure\n$\\left(\\isom(\\mass{}),\\mass{},\\mass{\\geq0}\\right)$ is analytic \\cite[Prop.~2.3.14]{thesis}, so two\n$\\mass{\\geq0}$-morphisms defined on a connected manifold and agreeing on a non-empty open set agree\neverywhere \\cite[Prop.~1.2.11]{thesis}. We use both facts as quoted.\n\\end{rem}"}},{"id":"germ_extension","lean":"Causal.CBG.LocalModel.GermExtFuture","leanloc":"lean-causal/Causal/CBG/FromModel.lean:1049","label":"","what":"A3, both time directions (with Causal.CBG.LocalModel.GermExtPast): ψ an injective morphism on a common Cauchy sub-development U (M, N, U, ψ(U) globally hyperbolic; Σ ⊆ U Cauchy in M and U, ψ(Σ) in N and ψ(U)); for p ∈ ∂U ∩ J⁺(Σ) (resp. J⁻(Σ)) at which ψ clusters at q along U, there are an open O ∋ p and a morphism φ on O with φ p = q and φ = ψ on O ∩ U; M, N Hausdorff, connected, second countable (Sbierski Lemma 3.8)","sort":"geometry","extra":{},"ett":null},{"id":"cauchy_slice","lean":"Causal.CBG.LocalModel.SliceFuture","leanloc":"lean-causal/Causal/CBG/FromModel.lean:1081","label":"","what":"A4, both time directions (with Causal.CBG.LocalModel.SlicePast): U globally hyperbolic with Σ ⊆ U a Cauchy surface of M and of U, p ∈ ∂U ∩ J⁺(Σ) with J⁻(p) ∩ ∂U ∩ J⁺(Σ) = {p} (resp. the past form): inside every open O ∋ p, U enlarges to a globally hyperbolic open U' ⊆ U ∪ O of which Σ is a Cauchy surface (Sbierski Thm 3.6's slice, Lemma 3.11)","sort":"geometry","extra":{},"ett":null}],"implies":[{"from":["strongly_causal"],"to":"is_causal","witness":"Causal.Causality.StronglyCausal.isCausal","loc":"lean-causal/Causal/StrongCausality.lean:58","status":"checked","under":"M is T1 ([T1Space M]); ETT's spacetimes are Hausdorff","cond":true,"extra":{},"emit":{"rule":false,"why":"under: M is T1 ([T1Space M]); ETT's spacetimes are Hausdorff"}},{"from":["strongly_causal","tarentin","causally_open"],"to":"strongly_causal_open","witness":"Causal.Causality.StronglyCausal.stronglyCausalOpen","loc":"lean-causal/Causal/GlobalHyperbolicity.lean:226","status":"checked","under":"","cond":false,"extra":{},"emit":{"rule":true,"module":"Causal.GlobalHyperbolicity"}},{"from":["strongly_causal_open"],"to":"strongly_causal","witness":"Causal.Causality.StronglyCausalOpen.stronglyCausal","loc":"lean-causal/Causal/Properties.lean:238","status":"checked","under":"","cond":false,"extra":{},"emit":{"rule":true,"module":"Causal.Properties"}},{"from":["globally_hyperbolic","tarentin"],"to":"strongly_causal","witness":"Causal.Causality.GloballyHyperbolic.stronglyCausal","loc":"lean-causal/Causal/GlobalHyperbolicity.lean:217","status":"checked","under":"M Hausdorff ([T2Space M])","cond":true,"extra":{},"emit":{"rule":false,"why":"under: M Hausdorff ([T2Space M])"}},{"from":["causally_arc_connected"],"to":"absolutely_minimal","witness":"Causal.Causality.CausallyArcConnected.absolutelyMinimal","loc":"lean-causal/Causal/ArcConnected.lean:216","status":"checked","under":"","cond":false,"extra":{},"emit":{"rule":true,"module":"Causal.ArcConnected"}},{"from":["causally_arc_connected"],"to":"push_up","witness":"Causal.Causality.CausallyArcConnected.pushUp","loc":"lean-causal/Causal/ArcConnected.lean:343","status":"checked","
