The file holds one non-UTF-8 byte (0xD0, a Mac Roman dash in the bibliography), kept as is.","document":"ghd_02_19.tex","ledgerRows":32,"rows":[{"label":"ersthm:diffeo_theorem","ref":"Thm 3.22","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":298,"proof":"","nl":"cited","lean":"none","decls":[],"deps":[],"tex":"\\begin{theorem}\nLet $\\Phi_1(\\rho)$ and $\\Phi_2(\\sigma)$ be smooth functions defined for all $(\\rho,\\sigma) \\in \\R^2$. Let $V$ be a connected open subset of $\\mathbb{R}^2$. If the map $\\Psi:V \\rightarrow U \\subset \\mathbb{R}^2$ defined by (\\ref{xisol}) and (\\ref{etasol}) is a diffeomorphism then (\\ref{Phi_sol}) defines a smooth solution $\\Phi: U \\rightarrow  \\mathbb{R}$ of the Born-Infeld scalar equation of motion. \n\n\\end{theorem}"},"ett":[{"x":"T-abs-ers-etale-mghd","t":"target"}],"loc":[],"open":[],"open_reason":"","note":"Thm 3.22 (ghd_02_19.tex:298), cited (Barbashov–Chernikov hodograph). A layer-3 fact of the Born–Infeld model: a diffeomorphism Ψ : V → U gives a solution on U. Its ETT role: Ψ is the developing map of a flat 1+1 development (V, m̂), the object of T-abs-ers-etale-mghd.","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:nec_cond","ref":"Lemma 3.23","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":304,"proof":"ghd_02_19.tex:308","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma}\n A necessary (although not sufficient) condition for $\\Psi:V \\rightarrow U$ to be a diffeomorphism is that either $ \\Phi_1'(\\rho)^2 \\Phi_2'(\\sigma)^2 <1$ throughout $V$ or $ \\Phi_1'(\\rho)^2 \\Phi_2'(\\sigma)^2 >1$ throughout $V$. \n\n\\end{lemma}"},"ett":[{"x":"T-abs-ers-etale-mghd","t":"target"}],"loc":[],"open":[],"open_reason":"","note":"Lemma 3.23 (ghd_02_19.tex:304). The Jacobian 1 − Φ₁'²Φ₂'² of Ψ: Ψ is a local homeomorphism exactly where it does not vanish (the étale condition of T-abs-ers-etale-mghd). Layer 3 computation.","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:lemma_sing","ref":"Lemma 3.25","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":319,"proof":"ghd_02_19.tex:323","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma}\nAssume that $\\Psi:V\\rightarrow U$ is a diffeomorphism such that $\\Phi_1'(\\rho) \\Phi_2'(\\sigma) \\rightarrow 1$ as $(\\rho,\\sigma) \\rightarrow (\\rho_0,\\sigma_0)$ for some $(\\rho_0,\\sigma_0) \\in \\partial V$. Let $\\gamma:(0,1) \\rightarrow V$ be a smooth curve with $\\gamma(t) \\rightarrow (\\rho_0,\\sigma_0)$ as $t \\rightarrow 1$. Then the gradient of the solution $\\Phi$ at the point $\\Psi(\\gamma(t))$ diverges as $t \\rightarrow 1$. \n\n\\end{lemma}"},"ett":[{"x":"T-abs-ers-etale-mghd","t":"target"}],"loc":[],"open":[],"open_reason":"","note":"Lemma 3.25 (ghd_02_19.tex:319). Gradient blow-up where Φ₁'Φ₂' → 1: the singular part of the MGHD's boundary (no extension as a solution). Layer 3 computation; the boundary it describes is the 'one side' of 4.82 in the superluminal picture.","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:grhosigma","ref":"Lemma 3.27","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":335,"proof":"ghd_02_19.tex:343","nl":"proved","lean":"none","decls":[],"deps":["ersthm:diffeo_theorem"],"tex":"\\begin{lemma}\nConsider a Born-Infeld solution constructed as in Theorem \\ref{diffeo_theorem}. In coordinates $(\\rho,\\sigma)$, the metric (\\ref{gdef}) is\n\\be\n\n g =c  \\left( 1 + \\Phi_1'(\\rho) \\Phi_2'(\\sigma) \\right)^2 d\\rho d\\sigma\n\\ee\n\n\\end{lemma}"},"ett":[{"x":"Causal.IsCausalIso","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:180","how":"exact"},{"x":"Causal.isCausalIso_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:206","how":"exact"},{"x":"Causal.isCausalIso_iff_eq_transport","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:289","how":"exact"},{"x":"Causal.Causality.transport","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:186","how":"exact"}],"loc":[],"open":[],"open_reason":"","note":"Lemma 3.27 (ghd_02_19.tex:335). g = c(1 + Φ₁'Φ₂')² dρ dσ is conformal to the flat m̂ = c dρ dσ, so Ψ carries the causality of (V, m̂) onto that of (U, g): the layer-3 fact (a conformal factor does not change the causal cones) is IsCausalIso C_m̂ C_g Ψ, equivalently C_g = C_m̂.transport Ψ (Causal.CausalIsoInvariance, T-abs-causal-iso-invariance, 80260b0); the ETT theorems it feeds are the transports of 3.29, 3.31, 3.39. Ψ is a homeomorphism here (ERS: a diffeomorphism).","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:lemma_orientation","ref":"Lemma 3.29","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":349,"proof":"ghd_02_19.tex:353","nl":"proved","lean":"none","decls":[],"deps":["ersthm:diffeo_theorem","erslem:grhosigma"],"tex":"\\begin{lemma}\nConsider a Born-Infeld solution constructed as in Theorem \\ref{diffeo_theorem}. In the subluminal case, $\\partial/\\partial \\rho$ is past-directed and $\\partial/\\partial \\sigma$ is future-directed w.r.t. $g$. In the superluminal case, if $\\Phi_1'(\\rho)^2 \\Phi_2'(\\sigma)^2 < 1$ then $\\partial/\\partial \\rho$ and $\\partial/\\partial \\sigma$ are both future directed whereas if $\\Phi_1'(\\rho)^2 \\Phi_2'(\\sigma)^2 > 1$ then they are both past-directed. In either case the spacetime $(U,g)$ is stably causal.\n\n\\end{lemma}"},"ett":[{"x":"Causal.Causality.isCausal_of_timeFunction","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:886","how":"exact"},{"x":"Causal.IsCausalIso.isCausal_of_timeFunction","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:902","how":"exact"},{"x":"Causal.Causality.isCausal_of_exists_timeFunction","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:893","how":"exact"}],"loc":["is_causal"],"open":[],"open_reason":"","note":"Lemma 3.29 (ghd_02_19.tex:349). Time orientation of ∂_ρ, ∂_σ and 'stable causality' through the time functions x⁰ (subluminal) and ±(ρ + σ) (superluminal). ETT, reading of OQ-57 (d): a function strictly increasing along ≤ makes the causality causal (isCausal_of_timeFunction for x⁰ on (U, g); IsCausalIso.isCausal_of_timeFunction for ρ + σ on (V, m̂)); an ETT time function (defi:fonction_temps, non-decreasing) does not suffice (Causal.exists_isTimeFunction_not_isCausal, the doubled line). isCausal_of_exists_timeFunction takes the body of the ladder node time_function verbatim, and the ladder's edge time_function ⇒ is_causal now has the wrapper Causal.Causality.HasTimeFunction.isCausal (Causal.CurvesExtend, ETT layer, since T-abs-hoist-time-function); whether the row names time_function (and that wrapper) is OQ-57 (d), not taken here.","geo":[{"model":"quasilinear","proves":["is_causal"],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:glob_hyp_lemma","ref":"Lemma 3.31","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":367,"proof":"ghd_02_19.tex:371","nl":"proved","lean":"none","decls":[],"deps":["ersthm:diffeo_theorem","erslem:grhosigma"],"tex":"\\begin{lemma}\nConsider a Born-Infeld solution constructed as in Theorem \\ref{diffeo_theorem}. Then $(U,g)$ is globally hyperbolic with Cauchy surface $S$ if, and only if, $(V,\\hat{m})$ is globally hyperbolic with Cauchy surface $\\Sigma=\\Psi^{-1}(S)$, where $\\hat{m} = c d\\rho d\\sigma$. \n\n\\end{lemma}"},"ett":[{"x":"Causal.IsCausalIso.globallyHyperbolic_and_isCauchySurface_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:828","how":"exact"},{"x":"Causal.IsCausalIso.globallyHyperbolic_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:539","how":"exact"},{"x":"Causal.IsCausalIso.isCauchySurface_image_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:815","how":"exact"}],"loc":["globally_hyperbolic"],"open":[],"open_reason":"","note":"Lemma 3.31 (ghd_02_19.tex:367). (U, g) GH with Cauchy surface S iff (V, m̂) is with Cauchy surface Ψ⁻¹(S): GH and Cauchy surfaces are invariant under the causal isomorphism Ψ (globallyHyperbolic_and_isCauchySurface_iff, 3.31 as printed); 'causally equivalent metrics' is the layer-3 input (Lemma 3.27). ':375' (the causal properties of (U, g) are those of (V, m̂)) is the ladder group of IsCausalIso: every causality-sort node is transported (tarentin_iff, pushUp_iff, causallyOpen_iff, absolutelyMinimal_iff, causallyArcConnected_iff, curvesExtend_iff, …).","geo":[{"model":"quasilinear","proves":["globally_hyperbolic"],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:sep_lemma","ref":"Lemma 3.32","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":380,"proof":"ghd_02_19.tex:384","nl":"proved","lean":"none","decls":[],"deps":["erslem:glob_hyp_lemma"],"tex":"\\begin{lemma}\nLet $p,\\,q$ be distinct points such that $\\Psi(p)=\\Psi(q)$. Then the straight line connecting $p,q$ in the $(\\rho,\\sigma)$ plane is spacelike w.r.t. $\\hat{m}$ in the subluminal case and timelike in the superluminal case. \n\n\\end{lemma}"},"ett":[{"x":"T-abs-ers-etale-mghd","t":"target"}],"loc":["curve_nested"],"open":[],"open_reason":"","note":"Lemma 3.32 (ghd_02_19.tex:380). Two Ψ-preimages of one point are m̂-spacelike separated (subluminal) or timelike separated (superluminal). This is the mechanism: a GH development of (V, m̂) can contain two preimages only in the subluminal case, so the developing map of an MGHD is injective in the superluminal case (T-abs-ers-etale-mghd). The sub/superluminal dichotomy is a nesting (ladder node curve_nested, sort pair). Layer 3 computation.","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-born-infeld-causal","t":"target"},{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:global_theorem","ref":"Thm 3.35","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":401,"proof":"ghd_02_19.tex:405","nl":"proved","lean":"none","decls":[],"deps":["ersthm:diffeo_theorem"],"tex":"\\begin{theorem}\nLet $\\Phi_1$ and $\\Phi_2$ be smooth functions on the real line such that the integrals in (\\ref{xisol}) and (\\ref{etasol}) converge for $\\rho \\rightarrow -\\infty$ and $\\sigma \\rightarrow \\infty$. Assume that  $\\Phi_1'(\\rho)^2 \\Phi_2'(\\sigma)^2 < 1$ for all $(\\rho,\\sigma)$. Then the map $\\Psi: \\mathbb{R}^2 \\rightarrow \\mathbb{R}^2$ defined by (\\ref{xisol}), (\\ref{etasol}) is a diffeomorphism and so the Born-Infeld solution of Theorem \\ref{diffeo_theorem} is a globally defined smooth solution.\n\n\\end{theorem}"},"ett":[{"x":"T-abs-ers-etale-mghd","t":"target"}],"loc":[],"open":[],"open_reason":"","note":"Thm 3.35 (ghd_02_19.tex:401). Ψ : ℝ² → ℝ² is a global diffeomorphism when Φ₁'²Φ₂'² < 1 everywhere: the developing map is injective, the solution global. Layer 3 (monotonicity of F(·; η)).","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:solution_theorem_global_theorem","ref":"Lemma 3.39","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":426,"proof":"ghd_02_19.tex:429","nl":"proved","lean":"none","decls":[],"deps":["ersthm:global_theorem","erslem:glob_hyp_lemma","erslem:lemma_orientation"],"tex":"\\begin{lemma}\nThe solution of Theorem \\ref{global_theorem} is globally hyperbolic.\n\\end{lemma}"},"ett":[{"x":"Causal.IsCausalIso.globallyHyperbolic_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:539","how":"exact"},{"x":"Causal.IsCausalIso.isCauchyTimeFunction_comp_iff","t":"lean","loc":"lean-causal/Causal/CausalIsoInvariance.lean:852","how":"exact"}],"loc":["globally_hyperbolic"],"open":[],"open_reason":"","note":"Lemma 3.39 (ghd_02_19.tex:426). The global solution is GH: (ℝ², m̂) is 1+1 Minkowski (a model fact) and GH transports along Ψ (IsCausalIso.globallyHyperbolic_iff). Its Cauchy surfaces 'of constant x⁰' need a Cauchy time function, carried across Ψ by isCauchyTimeFunction_comp_iff; OQ-57's finding: 'level sets of a global time function are Cauchy' fails in general (true in ERS's case).","geo":[{"model":"minkowski","proves":["globally_hyperbolic"],"by":[{"x":"Causal.minkowski_globallyHyperbolic","t":"lean","loc":"lean-causal/Causal/Minkowski.lean:132","how":"exact"}],"extra":{}},{"model":"quasilinear","proves":["globally_hyperbolic"],"by":[{"x":"T-loc-born-infeld-causal","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmNonUniqueness","ref":"Thm 3.45","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":560,"proof":"ghd_02_19.tex:564","nl":"proved","lean":"none","decls":[],"deps":["ersthm:diffeo_theorem","erslem:glob_hyp_lemma","erslem:lemma_sing"],"tex":"\\begin{theorem} \nFor the equation \\eqref{Eqc1} there exist two GHDs $\\Phi_a : U_a \\to \\R$ and $\\Phi_b : U_b \\to \\R$  of the same initial data posed on $\\{x^0=0\\}$ such that there exists an $x \\in U_a \\cap U_b$ with $\\Phi_a(x) \\neq \\Phi_b(x)$.\n\\end{theorem}"},"ett":[{"x":"T-abs-ers-etale-mghd","t":"target"}],"loc":["curve_nested"],"open":[],"open_reason":"","note":"Thm 3.45 (ghd_02_19.tex:560, proof 564–724). Layer 4 (classification): two GHDs of one datum with a disconnected overlap on which they differ — the criterion separating 4.70 (superluminal: inextensible nesting of Cτ) and 4.72 (m-GH) from the general subluminal case; subluminal nesting (curve_nested) alone gives neither connected overlaps nor global uniqueness. Causally: two flat 1+1 developments with overlapping developing maps (T-abs-ers-etale-mghd).","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-born-infeld-causal","t":"target"},{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:note_two_ghds_constructed","ref":"Remark 3.56","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":731,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["ersthm:ThmNonUniqueness"],"tex":"\\begin{remark}\nWe note that the two GHDs constructed in the proof of Theorem \\ref{ThmNonUniqueness} are not maximal. However, an application of  Zorn's Lemma (!) to the set of globally hyperbolic extensions of $\\Phi_a : U_a \\to \\R$ shows that there exists a MGHD which contains $\\Phi_a : U_a \\to \\R$. In the same way one shows the existence of a MGHD which contains $\\Phi_b : U_b \\to \\R$. These two MGHDs are clearly distinct. In fact one can even show that there are infinitely many distinct MGHDs of the constructed initial data. We leave the details to the reader. \n\\end{remark}"},"ett":[{"x":"T-abs-maximal-zorn","t":"target"}],"loc":[],"open":[],"open_reason":"","note":"Remark 3.56 (ghd_02_19.tex:731). Zorn gives an MGHD containing each of the two GHDs, and they are distinct: maximal developments exist without uniqueness (Chruściel Thm 2.2's abstract existence, T-abs-maximal-zorn); the 'infinitely many' claim is left to the reader in the paper.","geo":[],"extra":{}},{"label":"ersprop:PropLocUniqueness","ref":"Prop 4.63","ledger":{"kind":"proposition","number":"","title":"Local uniqueness","file":"ghd_02_19.tex","line":836,"proof":"ghd_02_19.tex:840","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{proposition}[Local uniqueness]\nLet $ u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments for \\eqref{QuasilinearEq} of the same initial data prescribed on a hypersurface $S \\subseteq \\R^{d+1}$. Then there exists a common globally hyperbolic development $v : V \\to \\R$.\n\\end{proposition}"},"ett":[{"x":"T-abs-ers-unions","t":"target"},{"x":"Causal.isCauchyInclusion_iSup","t":"lean","loc":"lean-causal/Causal/CBG/CausalConvex.lean:628","how":"exact"}],"loc":[],"open":["local_uniqueness"],"open_reason":"Local uniqueness is the PDE input (Sogge, energy estimates), not a ladder node (T-lad-development-nodes).","note":"Prop 4.63 (ghd_02_19.tex:836). The PDE gives agreement on small DS_p; the ETT part is that V = ⋃ DS_p has S as Cauchy surface (a union of local Cauchy developments of the pieces S_p, T-abs-ers-unions, through Causal.isCauchyInclusion_iSup, ETT-layer in Causal.CBG.CausalConvex since T-abs-hoist-time-function; GH of the union is Geroch (iii) ⇒ (i), unproved, OQ-57 (c)). Thm 4.64 uses 4.63 twice: Step 1 (`hlocal`, some common development exists) and Step 5 (inside the restart SliceRestart).","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-quasilinear-slice","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmUnique","ref":"Thm 4.64","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":858,"proof":"ghd_02_19.tex:865","nl":"proved","lean":"none","decls":[],"deps":["ersprop:PropLocUniqueness"],"tex":"\\begin{theorem}\nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments of \\eqref{QuasilinearEq} arising from the same initial data given on a connected hypersurface $S \\subseteq \\R^{d+1}$. Assume that $U_1 \\cap U_2$ is connected. Then $u_1$ and $u_2$ agree on $U_1 \\cap U_2$.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_64_maxCommonDevelopment","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:433","how":"exact"},{"x":"Causal.Causality.isCommonDevelopment_maxCommonDevelopment","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:361","how":"exact"},{"x":"Causal.Causality.exists_isSpacelikeBoundaryPoint","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:404","how":"exact"},{"x":"Causal.Causality.exists_spacelike_boundary_point","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1252","how":"exact"}],"loc":["globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"`hlocal` (Prop 4.63, local_uniqueness: T-lad-development-nodes), `hstep` (Steps 3–5 + Prop 4.63, SliceRestart) and `hstay` (Step 2's U₂ half, FrontierStaysIn) are named hypotheses, not ladder nodes: OQ-57 (b), T-lad-ers-restart-nodes. No A3 is needed on a fixed background.","note":"Thm 4.64 (ghd_02_19.tex:858, proof 865–912), Causal.ErsUniqueness (T-abs-ers-thm-4-64, 56ccff0), unmarked. Step 1 the maximal common development V₀ as a union (isCommonDevelopment_maxCommonDevelopment; S Cauchy, GH not concluded); Step 2 a frontier point with (4.65) in U₁ (exists_isSpacelikeBoundaryPoint through exists_spacelike_boundary_point: null geodesics replaced by a minimal point of a compact set, exists_minimal_of_isCompact_on), in U₂ by FrontierStaysIn; Steps 3–5 + Prop 4.63 the restart (SliceRestart; Step 3 is Sbierski's Lemma 3.11). GH and tarentin are of g(u₁) on U₁ (GloballyHyperbolicOn, TarentinOn); the Cauchy facts of S in U₁ (SplitBy, CompactSlabs, IsAcausalOn) are the quasilinear model's. One causality (OQ-57 (a)); U₁ ∩ U₂ preconnected.","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:RemTime","ref":"Remark 4.67","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":914,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["ersthm:ThmUnique"],"tex":"\\begin{remark}\nLet us remark that the proof in particular shows that under the assumptions of Theorem \\ref{ThmUnique} the intersection $U_1 \\cap U_2$ is the maximal common globally hyperbolic development of $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$. If we fix a choice of normal of the initial data hypersurface $S$ and stipulate that it is future directed in $U_1$ as well as in $U_2$, then it follows in particular that a point $x \\in U_1 \\cap U_2$, which lies to the future  of $S$ in $U_1$, also lies to the future of $S$ in $U_2$. Similarly for the past.\n\\end{remark}"},"ett":[{"x":"Causal.Causality.ers_remark_4_67","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:486","how":"exact"},{"x":"Causal.Causality.ers_remark_4_67_future","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:544","how":"exact"},{"x":"Causal.Causality.ers_remark_4_67_past","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:567","how":"exact"}],"loc":["globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As Thm 4.64.","note":"Remark 4.67 (ghd_02_19.tex:914). Under 4.64, U₁ ∩ U₂ is the greatest common development (ers_remark_4_67; 'maximal common GHD' read with S Cauchy, OQ-57 (c)), and a point to the future (past) of S in U₁ is to its future (past) in U₂ (ers_remark_4_67_future/_past), with the time orientations of g(u₁), g(u₂) agreeing on U₁ ∩ U₂ (FollowsSolution) and an inextensible curve of U₁ through every point (InextensibleThrough), both layer 3. It is the `hpair` of Causal.Causality.ers_theorem_4_77.","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:CorDisCon","ref":"Cor 4.68","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":921,"proof":"","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{corollary} \nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments of \\eqref{QuasilinearEq} arising from the same initial data on a connected hypersurface $S \\subseteq \\R^{d+1}$. If there exists an $x \\in U_1 \\cap U_2$ with $u_1(x) \\neq u_2(x)$, then $U_1 \\cap U_2$ is not connected.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_68","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:594","how":"exact"},{"x":"Causal.Causality.ers_corollary_4_68_eqOn","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:610","how":"exact"}],"loc":["globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As Thm 4.64.","note":"Cor 4.68 (ghd_02_19.tex:921): the contrapositive of 4.64 — disagreement forces a disconnected (not even preconnected) overlap, the only mechanism of non-uniqueness (cf. Thm 3.45); ers_corollary_4_68_eqOn for two functions as printed.","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:globally_defined_globally_hyperbolic","ref":"Cor 4.69","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":926,"proof":"","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{corollary}\nLet $u_1 : \\R^{d+1} \\to \\R$ be a globally defined globally hyperbolic development of \\eqref{QuasilinearEq} arising from some initial data on a connected hypersurface $S \\subseteq \\R^{d+1}$. Let $u_2 : U_2 \\to \\R$ be another globally hyperbolic development of \\eqref{QuasilinearEq} of the same initial data. Then $u_1|_{U_2} = u_2$.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_69","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:633","how":"exact"},{"x":"Causal.Causality.isPreconnected_of_inextensibleThrough","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:345","how":"exact"},{"x":"Causal.isConnected_of_curves","t":"lean","loc":"lean-causal/Causal/SubExtension.lean:307","how":"exact"}],"loc":["globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As Thm 4.64.","note":"Cor 4.69 (ghd_02_19.tex:926): U₁ = ℝ^{d+1}, so the hypotheses on U₁ are the ladder nodes globally_hyperbolic and tarentin of C (at ⊤), and U₁ ∩ U₂ = U₂ is preconnected because every point lies on an inextensible curve of U₂ meeting the preconnected S (isPreconnected_of_inextensibleThrough).","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:LemConnected","ref":"Lemma 4.70","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":939,"proof":"ghd_02_19.tex:945","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma} \nAssume that there exists a vector field  $T$ on $\\R^{d+1}$ such that $T$ is timelike with respect to  $g^{\\mu \\nu}(u, d u)$ for all $u, d u$, where $g$ is as in \\eqref{QuasilinearEq}. Let $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two globally hyperbolic developments of \\eqref{QuasilinearEq} arising from the same initial data on a connected hypersurface $S$ which has the property that every maximal integral curve of $T$ intersects $S$ at most once.  Then $U_1 \\cap U_2$ is connected.\n\\end{lemma}"},"ett":[{"x":"Causal.Causality.ers_lemma_4_70","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:968","how":"exact"},{"x":"Causal.Causality.ers_lemma_4_70_isConnected","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:986","how":"exact"},{"x":"Causal.Causality.ers_lemma_4_70_core","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:927","how":"exact"}],"loc":["is_causal"],"open":["inextensible_nested"],"open_reason":"(4.62) is read as InextensibleNestedOn Cτ C_i (OQ-41 (b), T-lad-nested-inextensible, blocked); is_causal is Cτ's (no closed orbit of T).","note":"Lemma 4.70 (ghd_02_19.tex:939). The integral curve of T through x, inextensible in each U_i, meets S once: its segment to S lies in U₁ ∩ U₂, which is connected through S.","geo":[{"model":"quasilinear","proves":["is_causal"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:CorSupLum","ref":"Cor 4.71","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":959,"proof":"ghd_02_19.tex:965","nl":"proved","lean":"none","decls":[],"deps":["erslem:LemConnected","ersthm:ThmUnique"],"tex":"\\begin{corollary} \nAssume that there exists a vector field  $T$ on $\\R^{d+1}$ such that $T$ is timelike with respect to  $g^{\\mu \\nu}(u, d u)$ for all $u, d u$, where $g$ is as in \\eqref{QuasilinearEq} and that initial data is posed on a connected hypersurface $S$ which has the property that every maximal integral curve of $T$ intersects $S$ at most once. \n\nGiven two globally hyperbolic developments $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$, we then have $u_1(x) = u_2(x)$ for all $x \\in U_1 \\cap U_2$.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_71","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:662","how":"exact"},{"x":"Causal.Causality.ers_lemma_4_70","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:968","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466","how":"exact"}],"loc":["is_causal","globally_hyperbolic","tarentin"],"open":["inextensible_nested","local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As 4.70 and 4.64.","note":"Cor 4.71 (ghd_02_19.tex:959): 4.70 + 4.64, global uniqueness for superluminal equations (ers_corollary_4_71 composes them, the named hypotheses of both kept).","geo":[{"model":"quasilinear","proves":["is_causal","globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"},{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:two_ghds_subluminal_quasilinear","ref":"Lemma 4.72","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":976,"proof":"ghd_02_19.tex:980","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma}\nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two GHDs of a subluminal quasilinear wave equation \\eqref{QuasilinearEq} arising from the same initial data given on a connected hypersurface $S$ that is achronal with respect to the Minkowski metric $m$. Assume, moreover, that $u_1 : U_1 \\to \\R$ is a $m$-GHD. Then $U_1 \\cap U_2$ is connected.\n\\end{lemma}"},"ett":[{"x":"Causal.Causality.ers_lemma_4_72","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1034","how":"exact"},{"x":"Causal.Causality.ers_lemma_4_72_isConnected","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1059","how":"exact"}],"loc":["is_causal","curves_extend","curve_nested"],"open":[],"open_reason":"","note":"Lemma 4.72 (ghd_02_19.tex:976), the ladder's consequence at curve_nested. A g(u₂)-causal curve is m-causal (subluminality: CurveNestedOn C₂ C_m on U₂), so it cannot leave the m-GH U₁ before meeting S. is_causal and curves_extend are Minkowski's (C_m, the wider causality). OQ-41 (c): S is taken m-acausal where ERS print m-achronal.","geo":[{"model":"minkowski","proves":["is_causal","curves_extend"],"by":[{"x":"Causal.minkowski_isCausal","t":"lean","loc":"lean-causal/Causal/Minkowski.lean:110","how":"exact"},{"x":"Causal.minkowski_curvesExtend","t":"lean","loc":"lean-causal/Causal/Model/CurvesExtendModels.lean:95","how":"exact"}],"extra":{}},{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"erscor:CorUniqueSub","ref":"Cor 4.73","ledger":{"kind":"corollary","number":"","title":"","file":"ghd_02_19.tex","line":988,"proof":"","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{corollary}\n\nLet $u_1 : U_1 \\to \\R$ and $u_2 : U_2 \\to \\R$ be two GHDs of a subluminal quasilinear wave equation \\eqref{QuasilinearEq} arising from the same initial data given on a connected hypersurface $S$ that is achronal with respect to the Minkowski metric $m$. Assume, moreover, that $u_1 : U_1 \\to \\R$ is a $m$-GHD. Then $u_1 = u_2$ on $U_1 \\cap U_2$.\n\\end{corollary}"},"ett":[{"x":"Causal.Causality.ers_corollary_4_73","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:691","how":"exact"},{"x":"Causal.Causality.ers_lemma_4_72","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1034","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466","how":"exact"}],"loc":["is_causal","curves_extend","curve_nested","globally_hyperbolic","tarentin"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"As 4.64.","note":"Cor 4.73 (ghd_02_19.tex:988): 4.72 + 4.64, every m-GHD is a UGHD (ers_corollary_4_73). is_causal, curves_extend are Minkowski's; curve_nested is subluminality; globally_hyperbolic, tarentin are g(u₁)'s on U₁.","geo":[{"model":"minkowski","proves":["is_causal","curves_extend"],"by":[{"x":"Causal.minkowski_isCausal","t":"lean","loc":"lean-causal/Causal/Minkowski.lean:110","how":"exact"},{"x":"Causal.minkowski_curvesExtend","t":"lean","loc":"lean-causal/Causal/Model/CurvesExtendModels.lean:95","how":"exact"}],"extra":{}},{"model":"quasilinear","proves":["curve_nested","globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"},{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-frontier","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:us_remark_better_bounds","ref":"Remark 4.74","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":993,"proof":"","nl":"informal","lean":"none","decls":[],"deps":[],"tex":"\\begin{remark}\nLet us remark that better bounds on the light cones of $g^{\\mu \\nu}(u, du)$ translate into an improvement of the uniqueness results. Above, we have only made use of the trivial Minkowski bound on the light cones for subluminal equations. If, for example, for a specific subluminal equation one can improve the a priori bound on the light cones of $g^{\\mu \\nu}(u, du)$ for certain initial data, then one can also improve the uniqueness result for these initial data.\n\\end{remark}"},"ett":[{"x":"Causal.Causality.ers_lemma_4_72","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1034","how":"exact"},{"x":"Causal.Causality.LeNested.trans","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:142","how":"exact"}],"loc":["curve_nested"],"open":[],"open_reason":"","note":"Remark 4.74 (ghd_02_19.tex:993). A better a-priori cone bound is a narrower wider causality C_g ≤ C_b ≤ C_m: 4.72 applied with C_b in place of C_m gives more UGHDs; ≤-nesting is transitive (LeNested.trans, the ladder's consequence at le_nested). The curve-nesting form of the transitivity is T-abs-nested-converse's CurveNestedOn.trans.","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmEx","ref":"Thm 4.75","ledger":{"kind":"theorem","number":"","title":"Local existence","file":"ghd_02_19.tex","line":1001,"proof":"ghd_02_19.tex:1011","nl":"proved","lean":"none","decls":[],"deps":["ersthm:ThmUnique","ersrem:RemTime"],"tex":"\\begin{theorem}[Local existence] \nGiven initial data for a quasilinear wave equation \\eqref{QuasilinearEq}, there exists a globally hyperbolic development.\n\\end{theorem}"},"ett":[{"x":"T-abs-ers-unions","t":"target"},{"x":"Causal.Causality.ers_theorem_4_64","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:466","how":"exact"}],"loc":[],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"Local existence on {t = 0} patches (Sogge) and 4.64 on the components, with its named hypotheses (T-lad-development-nodes; OQ-57 (b), T-lad-ers-restart-nodes).","note":"Thm 4.75 (ghd_02_19.tex:1001). Patching: each component A of DS_p ∩ DS_q meets S_p ∩ S_q along integral curves of the normal N, the two local developments agree on A by 4.64 and a boundary argument, and the union has S as Cauchy surface (T-abs-ers-unions).","geo":[{"model":"quasilinear","proves":[],"by":[{"x":"T-loc-quasilinear-slice","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmUMGHD","ref":"Thm 4.77","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":1031,"proof":"ghd_02_19.tex:1037","nl":"proved","lean":"none","decls":[],"deps":["ersthm:ThmEx","erscor:CorSupLum","ersrem:RemTime"],"tex":"\\begin{theorem} \nAssume that there exists a vector field  $T$ on $\\R^{d+1}$ such that $T$ is timelike with respect to  $g^{\\mu \\nu}(u, d u)$ for all $u, d u$, where $g$ is as in \\eqref{QuasilinearEq} and that initial data is posed on a connected hypersurface $S$ which has the property that every maximal integral curve of $T$ intersects $S$ at most once.\n\nGiven such initial data, there then exists a \\emph{unique maximal globally hyperbolic development} $u_{\\max} : U_{\\max} \\to \\R$, that is, a globally hyperbolic development  $u_{\\max} : U_{\\max} \\to \\R$ with the property that for any other globally hyperbolic development $u : U \\to \\R$ of the same initial data we have $U \\subseteq U_{\\max}$ and $u_{\\max}|_U = u$.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_77","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1084","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_77_greatest","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1185","how":"exact"}],"loc":["is_causal"],"open":["inextensible_nested"],"open_reason":"Through Cor 4.71 (OQ-41 (b)). OQ-41 (d): the Lean skeleton adds 'the union is causal' and concludes 'S is a Cauchy surface', not GH (Geroch (iii) ⇒ (i) unproved).","note":"Thm 4.77 (ghd_02_19.tex:1031): the union of all GHDs is the unique MGHD; its Cauchy property by ERS's open–closed argument along a curve (the `step` of ers_theorem_4_77); global uniqueness (`hpair`) is Rem 4.67 after Cor 4.71.","geo":[{"model":"quasilinear","proves":["is_causal"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersrem:RemMGHD","ref":"Remark 4.78","ledger":{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":1047,"proof":"","nl":"informal","lean":"none","decls":[],"deps":[],"tex":"\\begin{remark} \nWe note that the above construction of a unique maximal globally hyperbolic development is always possible provided the property of global uniqueness holds.\n\\end{remark}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_77_greatest","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1185","how":"exact"}],"loc":[],"open":[],"open_reason":"","note":"Remark 4.78 (ghd_02_19.tex:1047): the union construction works whenever global uniqueness holds — ers_theorem_4_77_greatest takes the agreement on pairwise intersections as hypothesis.","geo":[],"extra":{}},{"label":"ersthm:ThmMUGHD","ref":"Thm 4.79","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":1055,"proof":"ghd_02_19.tex:1060","nl":"proved","lean":"none","decls":[],"deps":["ersthm:ThmEx","erscor:CorUniqueSub","ersthm:ThmUMGHD"],"tex":"\\begin{theorem} \nConsider a subluminal quasilinear wave equation of the form \\eqref{QuasilinearEq}.\nGiven initial data on a connected hypersurface $S$ that is acausal with respect to the Minkowski metric there exists a UGHD $u : U \\to \\R$ with the property that the domain of any other UGHD is contained in $U$. The UGHD $u : U \\to \\R$ is called the \\emph{maximal unique globally hyperbolic development} (MUGHD).\n\\end{theorem}"},"ett":[{"x":"T-abs-ers-mughd","t":"target"},{"x":"Causal.Causality.ers_corollary_4_73","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:691","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_77_greatest","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1185","how":"exact"}],"loc":["curve_nested","curves_extend"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"Through Cor 4.73's 4.64 (T-lad-development-nodes; OQ-57 (b), T-lad-ers-restart-nodes).","note":"Thm 4.79 (ghd_02_19.tex:1055). The union of all UGHDs is the MUGHD (a union under global uniqueness, ers_theorem_4_77_greatest); non-empty because D_m(S) ∩ U₁ is an m-GHD (O'Neill 14.38, 14.43; a Minkowski model fact), hence a UGHD by 4.73. The m-MGHD is contained in it, in general strictly. T-abs-ers-mughd assembles it.","geo":[{"model":"minkowski","proves":["curves_extend"],"by":[{"x":"Causal.minkowski_curvesExtend","t":"lean","loc":"lean-causal/Causal/Model/CurvesExtendModels.lean:95","how":"exact"}],"extra":{}},{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:consider_subluminal_quasilinear_wave","ref":"Thm 4.80","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":1066,"proof":"ghd_02_19.tex:1071","nl":"proved","lean":"none","decls":[],"deps":["ersthm:ThmMUGHD","erscor:CorUniqueSub","ersrem:RemMGHD","ersthm:ThmUMGHD"],"tex":"\\begin{theorem}\nConsider a subluminal quasilinear wave equation of the form \\eqref{QuasilinearEq}.\nGiven initial data on a connected hypersurface $S$ that is acausal with respect to the Minkowski metric there exists a unique $m$-MGHD, i.e., a $m$-GHD $u_{\\max}: U_{\\max} \\to \\R$  with the property that for any other $m$-GHD $u: U \\to \\R$ of the same initial data we have $U \\subseteq U_{\\max}$ and $u_{\\max}|_U = u$. \n\\end{theorem}"},"ett":[{"x":"T-abs-ers-mughd","t":"target"},{"x":"Causal.Causality.ers_theorem_4_77_greatest","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1185","how":"exact"},{"x":"Causal.Causality.ers_corollary_4_73","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:691","how":"exact"}],"loc":["curve_nested"],"open":["local_uniqueness","slice_restart","frontier_stays_in"],"open_reason":"Through Cor 4.73's 4.64.","note":"Thm 4.80 (ghd_02_19.tex:1066): the unique m-MGHD, by Remark 4.78's union over the m-GHDs with 4.73 as global uniqueness (T-abs-ers-mughd).","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"}],"extra":{}}],"extra":{}},{"label":"ersthm:ThmNotBlocking","ref":"Thm 4.82","ledger":{"kind":"theorem","number":"","title":"","file":"ghd_02_19.tex","line":1100,"proof":"ghd_02_19.tex:1114","nl":"proved","lean":"none","decls":[],"deps":["ersthm:ThmUnique","ersrem:RemTime"],"tex":"\\begin{theorem} \nLet $u_1 : U_1 \\to \\R$ be a MGHD of given initial data for a quasilinear wave equation of the form \\eqref{QuasilinearEq} and assume that \n\nfor every $p \\in (\\partial U_1 \\setminus \\partial S)$ there exists a neighbourhood $V$ of $p$ together with a chart $\\psi : V \\to (-\\varepsilon, \\varepsilon)^{d+1}$, $\\varepsilon >0$, and a continuous function $f : (-\\varepsilon, \\varepsilon)^d \\to (-\\varepsilon, \\varepsilon)$ such that $\\psi^{-1}(\\mathrm{graph} f) = \\partial U_1 \\cap V$, all points below $\\mathrm{graph} f$ in $(-\\varepsilon, \\varepsilon)^{d+1}$ are mapped into $U_1$ and all points above $\\mathrm{graph} f$ in $(-\\varepsilon, \\varepsilon)^{d+1}$ are mapped into $\\R^{d+1} \\setminus U_1$.\n\n \nThen $u_1 : U_1 \\to \\R$ is the unique MGHD, i.e., any other GHD $u : U \\to \\R$ satisfies  $U \\subseteq U_1$ and thus also $u_1|_U = u$.\n\\end{theorem}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_82","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1304","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_82_of_oneSidedBoundary","t":"lean","loc":"lean-causal/Causal/LadderLocal.lean:398","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_82_of_sliceRestart","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:722","how":"exact"},{"x":"Causal.Causality.ers_theorem_4_82_of_globallyHyperbolicOn","t":"lean","loc":"lean-causal/Causal/ErsUniqueness.lean:749","how":"exact"},{"x":"Causal.Causality.frontier_connectedComponentIn_inter","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1209","how":"exact"},{"x":"Causal.Causality.exists_spacelike_boundary_point","t":"lean","loc":"lean-causal/Causal/NestedCausalities.lean:1252","how":"exact"}],"loc":["globally_hyperbolic","tarentin"],"open":["one_sided_boundary","slice_restart","local_uniqueness"],"open_reason":"(4.83) enters through its topological content Causal.Causality.OneSidedBoundary (`honesided`; node: OQ-52 (b), T-lad-one-sided-node); `hstep` is SliceRestart definitionally (ers_theorem_4_82_of_sliceRestart; OQ-57 (b), T-lad-ers-restart-nodes) and contains Prop 4.63 (T-lad-development-nodes). OQ-41 (e): ∂S read as closure(S) ∖ S.","note":"Thm 4.82 (ghd_02_19.tex:1100, proof 1114–1139). The component A of U₁ ∩ U₂ through S has boundary points in U₂ on ∂U₁ (4.84); a spacelike one (4.85) without null geodesics; one-sidedness puts a neighbourhood's trace on U₁ inside A; the restart extends the MGHD: contradiction. With each development GH and tarentin (ladder nodes read on dom i), hcaus, hJm, hJp are derived (ers_theorem_4_82_of_globallyHyperbolicOn).","geo":[{"model":"quasilinear","proves":["globally_hyperbolic","tarentin"],"by":[{"x":"T-loc-quasilinear-causal-ladder","t":"target"},{"x":"T-loc-quasilinear-slice","t":"target"},{"x":"T-loc-quasilinear-one-sided","t":"target"}],"extra":{}}],"extra":{}},{"label":"erslem:PropertyTimelike","ref":"Lemma 4.86","ledger":{"kind":"lemma","number":"","title":"","file":"ghd_02_19.tex","line":1143,"proof":"ghd_02_19.tex:1159","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma}\nLet $u_1 : U_1 \\to \\R$ be a GHD of given initial data posed on an open and connected subset $S$ of $\\{x^0=0\\}$ for a  quasilinear wave equation of the form \\eqref{QuasilinearEq}. Furthermore, assume that \n\nthere exists a $\\delta >0$ such that $\\partial_0 + \\sum_{i=1}^d \\delta_i \\partial_i$ is timelike with respect to $g(u_1, du_1)$ for all $\\delta_i \\in \\R$ with $\\sum_{i=1}^d |\\delta_i| < \\delta$.\n\n \nThen the condition \\eqref{PropertyBoundary} is satisfied.\n\\end{lemma}"},"ett":[{"x":"Causal.Causality.ers_theorem_4_82_of_oneSidedBoundary","t":"lean","loc":"lean-causal/Causal/LadderLocal.lean:398","how":"exact"},{"x":"Causal.Causality.OneSidedBoundary","t":"lean","loc":"lean-causal/Causal/LadderLocal.lean:190","how":"exact"}],"loc":["curve_nested"],"open":["one_sided_boundary"],"open_reason":"Its output (4.83) is one_sided_boundary, Causal.Causality.OneSidedBoundary U₁ (closure S), not a node (OQ-52 (b), T-lad-one-sided-node).","note":"Lemma 4.86 (ghd_02_19.tex:1143, proof 1159–1169). A layer-3 lemma (coordinates of ℝ^{d+1}): if the cone of slope δ around ∂₀ is g-timelike ((4.87), read as the nesting curve_nested of the static slope-δ causality in C_g), a C_δ-past-inextensible curve from a point above the graph would miss S, so ∂U₁ is the graph of the continuous f⁺; it supplies (4.83) to 4.82 as the `honesided` of ers_theorem_4_82_of_oneSidedBoundary. Its proof is causal once the narrow cone is a nested causality: T-loc-quasilinear-one-sided.","geo":[{"model":"quasilinear","proves":["curve_nested"],"by":[{"x":"T-loc-quasilinear-nesting","t":"target"},{"x":"T-loc-quasilinear-one-sided","t":"target"}],"extra":{}}],"extra":{}}],"unbound":[{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":728,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["ersthm:ThmNonUniqueness"],"tex":"\\begin{remark}\nWe emphasise that the two GHDs constructed in the proof of Theorem \\ref{ThmNonUniqueness} are \\emph{smooth}. Hence, the non-uniqueness mechanism exhibited does not stem from a loss of regularity of the solution.\n\\end{remark}","label":"ersrem:emphasise_two_ghds_constructed"},{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":734,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["ersthm:ThmNonUniqueness"],"tex":"\\begin{remark}\nThe initial data constructed in the proof of Theorem \\ref{ThmNonUniqueness} are not compactly supported. However, by a standard domain of dependence argument one can cut off the initial data outside a large enough ball to produce compactly supported initial data and two GHDs thereof which satisfy the statement of Theorem \\ref{ThmNonUniqueness}.\n\\end{remark}","label":"ersrem:initial_data_constructed_proof"},{"kind":"remark","number":"","title":"","file":"ghd_02_19.tex","line":738,"proof":"","nl":"informal","lean":"none","decls":[],"deps":[],"tex":"\\begin{remark} \nRecall that equation \\eqref{Eqc1} (which is \\eqref{BIeom}  multiplied by $1+(\\partial_{x^1}\\Phi)^2 - (\\partial_{x^0}\\Phi)^2$) is not manifestly hyperbolic, i.e., a quasilinear wave equation of the form \\eqref{QuasilinearEq} which we will consider in Section \\ref{theorems}.   Its principal symbol is\n\\begin{equation*}\n\\tilde{g}^{-1} = (1+(\\partial_{x^1}\\Phi)^2 - (\\partial_{x^0}\\Phi)^2) \\cdot g^{-1} = \\begin{pmatrix}\n-(1 + (\\partial_{x^1}\\Phi)^2) & \\partial_{x^0}\\Phi \\partial_{x^1} \\Phi \\\\ \\partial_{x^0}\\Phi \\partial_{x^1} \\Phi & 1 -(\\partial_{x^0} \\Phi)^2 \n\\end{pmatrix} \n\\end{equation*}\nand the determinant is $\\det \\tilde{g}^{-1} = -1 -(\\partial_{x^1}\\Phi)^2 + (\\partial_{x^0}\\Phi)^2 = -1 - 4\\partial_{\\eta}\\Phi \\partial_\\xi \\Phi$.\nIt follows from \\eqref{NullDerivativesRhoSigma} and \\eqref{phi_def} that for the two hyperbolic solutions constructed above we have\n\\begin{equation*}\n\\det \\tilde{g}^{-1}  = -1 - 4 \\frac{\\phi'(\\rho) \\phi'(\\sigma)}{(1-\\phi'(\\rho)\\phi'(\\sigma))^2} <-1 \\;.\n\\end{equation*}\nWe can thus modify the principal symbol of \\eqref{Eqc1} in the region $\\{ (\\partial_{x^0}\\Phi, \\partial_{x^1}\\Phi)  \\in \\R^2\\; |  \\det \\tilde{g}^{-1} \\geq -\\frac{1}{2} \\} = \\{(\\partial_{x^0}\\Phi)^2 \\geq (\\partial_{x^1} \\Phi)^2 + \\frac{1}{2} \\}$ to make it Lorentz-metric valued for all $d\\Phi$ (and keeping it subluminal), thus creating a subluminal quasilinear wave equation (i.e. a quasilinear equation for which every solution is hyperbolic) which is still solved by our two GHDs of the same initial data constructed above which take different values at a point that lies in …","label":"ersrem:RemCutOff"},{"kind":"conjecture","number":"","title":"","file":"ghd_02_19.tex","line":1078,"proof":"","nl":"open","lean":"none","decls":[],"deps":[],"tex":"\\begin{conjecture} \n\nThere are quasilinear wave equations of the form \\eqref{QuasilinearEq} for which there exists initial data such that there does not exist \\emph{any} UGHD.\n\\end{conjecture}","label":"ersconj:ConUni"}],"proposed":[{"id":"inextensible_nested","lean":"Causal.Causality.InextensibleNestedOn","target":"T-lad-nested-inextensible","what":"inextensible causal curves of W for C are inextensible for C' ((4.62) for Cτ ⊆ C_g, ERS 4.70); OQ-41 (b): this, or no_causal_endpoint, is the node","leanloc":"lean-causal/Causal/NestedCausalities.lean:135"},{"id":"no_causal_endpoint","lean":"Causal.Causality.NoCausalEndpoint","target":"T-lad-nested-inextensible","what":"J⁻(x) ≠ {x} and J⁺(x) ≠ {x} for every x: with GH, tarentin and causal arc-connectedness it gives inextensible_nested on M (Causal.Causality.GloballyHyperbolic.inextensibleNestedOn_top_of_noCausalEndpoint); also the hypothesis of Lemma K and of ChainsCurves","leanloc":"lean-causal/Causal/LadderLocal.lean:172"},{"id":"local_uniqueness","lean":"on this fixed background the existential `∃ V, C.IsCommonDevelopment S U₁ U₂ agree V` (Causal.Causality.IsCommonDevelopment), the `hlocal` of Causal.Causality.ers_theorem_4_64; for data, T-abs-cbg-initial-data defines it","target":"T-lad-development-nodes","what":"two developments of the same data have a common GH development (ERS Prop 4.63; Sbierski Thm 2.6)","leanloc":""},{"id":"slice_restart","lean":"Causal.Causality.SliceRestart","target":"T-lad-ers-restart-nodes","what":"at every spacelike frontier point of a common development in U₁ ∩ U₂, a strictly larger common development (Thm 4.64 Steps 3–5 with Prop 4.63; the `hstep` of ers_theorem_4_64 and, definitionally, of ers_theorem_4_82); OQ-57 (b)","leanloc":"lean-causal/Causal/ErsUniqueness.lean:211"},{"id":"frontier_stays_in","lean":"Causal.Causality.FrontierStaysIn","target":"T-lad-ers-restart-nodes","what":"the frontier of a common development below a point of U₁ ∩ U₂ and above S stays in U₁ ∩ U₂ (Thm 4.64 Step 2, ghd_02_19.tex:880); OQ-57 (b): apart, folded into the restart, or a node","leanloc":"lean-causal/Causal/ErsUniqueness.lean:226"},{"id":"one_sided_boundary","lean":"Causal.Causality.OneSidedBoundary","target":"T-lad-one-sided-node","what":"the topological content of (4.83): every boundary point of U₁ off closure S has arbitrarily small neighbourhoods V with V ∩ U₁ preconnected (the `honesided` of Causal.Causality.ers_theorem_4_82_of_oneSidedBoundary); no causality, OQ-52 (b)","leanloc":"lean-causal/Causal/LadderLocal.lean:190"}],"other":{},"errors":[],"macros":{"Erf":"\\operatorname{Erf}","Erfc":"\\operatorname{Erfc}","N":"\\mathbb{N}","R":"\\mathbb{R}","ba":"\\begin{eqnarray}","be":"\\begin{equation}","ea":"\\end{eqnarray}","ee":"\\end{equation}","pd":"\\partial","red":"\\textcolor{red}","sect":["\\setcounter{equation}{0}\\section{#1}",1],"theequation":"\\arabic{section}.\\arabic{equation}"},"path":"papers/ers-predictability/certificate/binder.toml"},{"slug":"sbierski-mghd","title":"On the Existence of a Maximal Cauchy Development for the Einstein Equations - a Dezornification","edition":"arXiv 1309.7591 e-print v3 (2 Jul 2015); J. Sbierski, On the existence of a maximal Cauchy development for the Einstein equations: a dezornification, Ann. Henri Poincare 17 (2016), doi:10.1007/s00023-015-0401-5 = bib sbierski_geroch. The published text may differ from v3 and has not been compared.","document":"Maximal_GHD2.tex","ledgerRows":19,"rows":[{"label":"mghddef:globally_hyperbolic_development_ghd","ref":"Def 2.1","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":360,"proof":"","nl":"definition","lean":"none","decls":[],"deps":[],"tex":"\\begin{definition}\nA \\emph{globally hyperbolic development} (GHD) \\((M,g,\\iota)\\) of initial data \\((\\overline{M},\\bar{g},\\bar{k})\\) is a time oriented, globally hyperbolic Lorentzian manifold \\((M,g)\\) that satisfies the vacuum Einstein equations, together with an embedding \\(\\iota : \\overline{M} \\to M\\) such that \n\\begin{enumerate}\n\\item \\(\\iota^*(g) = \\bar{g}\\)\n\\item \\(\\iota^*(k) = \\bar{k}\\), where \\(k\\) denotes the second fundamental form of \\(\\iota(\\overline{M})\\) in \\(M\\) with respect to the future normal\n\\item \\(\\iota(\\overline{M})\\) is a Cauchy surface in \\((M,g)\\).\n\\end{enumerate}\n\\end{definition}"},"ett":[{"x":"Causal.CBG.Dev","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:750","how":"exact"},{"x":"Causal.IsCauchyEmbedding","t":"lean","loc":"lean-causal/Causal/CauchyExtension.lean:768","how":"exact"}],"loc":["globally_hyperbolic","absolutely_minimal","causally_arc_connected","push_up","tarentin"],"open":[],"open_reason":"","note":"Def 2.1 (Maximal_GHD2.tex:360). A GHD is a development `Dev 𝔊 s₀`: a structure, a Cauchy embedding of the datum and a structure morphism. ETT's datum is a GH spacetime M₀; Sbierski's is (M̄, ḡ, k̄), read as the class of developments of Σ under local uniqueness (T-abs-cbg-initial-data). The localisation step is reading the smooth GH Lorentzian manifold as an ETT spacetime: O'Neill's GH gives ETT's (causal, compact diamonds) and the A2 causal facts.","geo":[{"model":"smooth-vacuum","proves":["globally_hyperbolic","absolutely_minimal","causally_arc_connected","push_up","tarentin"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367","how":"exact"}],"extra":{}}],"extra":{}},{"label":"mghddef:extension","ref":"Def 2.2","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":369,"proof":"","nl":"definition","lean":"none","decls":[],"deps":[],"tex":"\\begin{definition}\n\nGiven two GHDs \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) of the same initial data, we say that \\((M',g',\\iota')\\) is an \\emph{extension} of \\((M,g,\\iota)\\) iff there exists a time orientation preserving isometric embedding\\footnote{We lay down some terminology here: An \\emph{isometry} is a diffeomorphism that preserves the metric. An \\emph{isometric immersion} is an immersion that preserves the metric. Finally, an \\emph{isometric embedding} is an isometric immersion that is a diffeomorphism onto its image.} \\(\\psi : M \\to M'\\) that preserves the initial data, i.e.\\ \\(\\psi \\circ \\iota = \\iota'\\). \n\\end{definition}"},"ett":[{"x":"Causal.CBG.Dev.IsMorphism","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:774","how":"exact"}],"loc":[],"open":[],"open_reason":"","note":"Def 2.2 (Maximal_GHD2.tex:369). An extension is a morphism of developments; Sbierski's 'isometric embedding' is not asked: injectivity is derived (Lemma 3.3, Causal.CBG.injOn_of_injOn_cauchy), as his remark after Lemma 3.3 says.","geo":[],"extra":{}},{"label":"mghddef:PreDefCGHD","ref":"Def 2.3","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":374,"proof":"","nl":"definition","lean":"none","decls":[],"deps":[],"tex":"\\begin{def1}\n\nGiven two GHDs \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) of  initial data \\((\\overline{M},\\bar{g},\\bar{k})\\), we say that a GHD \\((U,g_U,\\iota_U)\\) of the same initial data is a \\emph{common globally hyperbolic development} (CGHD) of \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) iff both \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) are extensions of \\((U,g_U,\\iota_U)\\).\n\\end{def1}"},"ett":[{"x":"Causal.CBG.CommonSubDev","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:658","how":"exact"}],"loc":[],"open":[],"open_reason":"","note":"Def 2.3 (Maximal_GHD2.tex:374), the symmetric CGHD: ETT def:common_sub_extension with injective morphisms of developments.","geo":[],"extra":{}},{"label":"mghddef:DefCGHD","ref":"Def 2.4","ledger":{"kind":"definition","number":"","title":"","file":"Maximal_GHD2.tex","line":383,"proof":"","nl":"definition","lean":"none","decls":[],"deps":[],"tex":"\\begin{def2}\n\nGiven two GHDs \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) of  initial data \\((\\overline{M},\\bar{g},\\bar{k})\\), we say that a GHD \\((U \\subseteq M,g|_U,\\iota)\\) is a \\emph{common globally hyperbolic development} (CGHD) of \\((M,g,\\iota)\\) and \\((M',g',\\iota')\\) iff  \\((M',g',\\iota')\\) is an extension of \\((U,g_U,\\iota_U)\\).\n\\end{def2}"},"ett":[{"x":"Causal.CBG.IsCGHD","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:219","how":"exact"}],"loc":[],"open":[],"open_reason":"","note":"Def 2.4 (Maximal_GHD2.tex:383), the CGHD realised as an open subset of M; IsCGHD asks a structure morphism into M' and no injectivity (ETT's ℰ).","geo":[],"extra":{}},{"label":"mghdrem:RemSym","ref":"Remark 2.5","ledger":{"kind":"remark","number":"","title":"","file":"Maximal_GHD2.tex","line":388,"proof":"","nl":"informal","lean":"none","decls":[],"deps":["mghddef:extension","mghddef:PreDefCGHD","mghddef:DefCGHD"],"tex":"\\begin{remark}\n\n\\begin{enumerate}\n\\item\nThe diffeomorphism invariance of the Einstein equations implies that if \\(M\\) is a GHD of certain initial data, then so is any spacetime that is isometric to \\(M\\). From a physical point of view, isometric spacetimes should be considered to be the same, i.e., one should actually consider the \\emph{isometry class} of a GHD to be the solution to the Einstein equations. It is easy to check that the \\emph{Definitions \\ref{extension} and \\ref{PreDefCGHD} also descend to the isometry classes of GHDs, i.e., they do not depend on the chosen representative of the isometry class}. It is also only when one considers isometry classes that one can prove uniqueness for the initial value problem to the Einstein equations in the strict meaning of this word. However, working with isometry classes has a decisive disadvantage for the purposes of this paper: the isometry class of a given GHD is a \\emph{proper} class, i.e., not a set. Thus, if we considered an infinite number of isometry classes, not even the full axiom of choice would be strong enough to pick a representative of each - and we need a representative to work with. We thus refrain from considering isometry classes of GHDs. \n\n\\item\nAs just mentioned, Definition \\ref{PreDefCGHD} is diffeomorphism invariant. In Definition \\ref{DefCGHD} we break the diffeomorphism invariance by requiring that a CGHD \\(U\\) of \\(M\\) and \\(M'\\) is realised as a subset of \\(M\\). However, this is not a serious restriction, since given any CGHD \\(U\\) of \\(M\\) and \\(M'\\) in the sense of Definition \\ref{PreDefCGHD}, we  …"},"ett":[{"x":"Causal.CBG.isCGHD_of_isMorphism","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:432","how":"exact"},{"x":"Causal.CBG.mcghd_factor","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:468","how":"exact"},{"x":"Causal.CBG.SmallDev","t":"lean","loc":"lean-causal/Causal/CBG/Bound.lean:342","how":"exact"}],"loc":[],"open":[],"open_reason":"","note":"Remark 2.5 (Maximal_GHD2.tex:388). (1) Isometry classes are proper classes: the size bound is SmallDev (second countable T0 carriers inside Set ℕ, Causal.CBG.Bound) where Sbierski restricts to subsets of M̄ × ℝ. (2) A Def 2.3 CGHD embeds in M as a Def 2.4 one: isCGHD_of_isMorphism, mcghd_factor.","geo":[],"extra":{}},{"label":"mghdthm:LocalTheory","ref":"Thm 2.6","ledger":{"kind":"theorem","number":"","title":"","file":"Maximal_GHD2.tex","line":403,"proof":"","nl":"cited","lean":"none","decls":[],"deps":[],"tex":"\\begin{theorem}\n\nGiven initial data for the vacuum Einstein equations, there exists a GHD, and for any two GHDs of the same initial data, there exists a CGHD.\n\\end{theorem}"},"ett":[{"x":"T-abs-cbg-initial-data","t":"target"},{"x":"Causal.CBG.Dev.self","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:792","how":"exact"}],"loc":[],"open":["local_uniqueness"],"open_reason":"local_uniqueness is not a ladder node and has no Lean definition for data (T-abs-cbg-initial-data defines it, T-lad-development-nodes adds it). Smooth-vacuum: Choquet-Bruhat 1952, cited PDE. Flat-gx: the datum is the GH spacetime M₀ itself (Dev.self), local existence and uniqueness are built in.","note":"Thm 2.6 (Maximal_GHD2.tex:403), cited. It is pure layer 3 for Einstein (local well-posedness); its ETT role is the hypothesis that makes 'developments of the same data' a directed family (T-abs-cbg-initial-data).","geo":[{"model":"smooth-vacuum","proves":[],"by":[{"x":"T-loc-vacuum-slice","t":"target"}],"extra":{}}],"extra":{}},{"label":"mghdthm:CommonExtension","ref":"Thm 2.7","ledger":{"kind":"theorem","number":"","title":"Global uniqueness","file":"Maximal_GHD2.tex","line":411,"proof":"Maximal_GHD2.tex:723","nl":"proved","lean":"none","decls":[],"deps":["mghdthm:TNDVersion","mghdthm:ExMCGHD"],"tex":"\\begin{theorem}[Global uniqueness]\n\nGiven two GHDs \\(M\\) and \\(M'\\) of the same initial data, there exists a GHD \\(\\tilde{M}\\) that is an extension of \\(M\\) and \\(M'\\).\n\\end{theorem}"},"ett":[{"x":"Causal.CBG.exists_common_extension","t":"lean","loc":"lean-causal/Causal/CBG/Ppcm.lean:1290","how":"exact"},{"x":"Causal.CBG.exists_ppcm","t":"lean","loc":"lean-causal/Causal/CBG/Ppcm.lean:1273","how":"exact"},{"x":"Causal.CBG.t2Space_gluing_mcghd","t":"lean","loc":"lean-causal/Causal/CBG/NoCorresponding.lean:571","how":"exact"},{"x":"Causal.Gluing.t2Space_iff_forall_not_isCorrespondingBoundaryPair","t":"lean","loc":"lean-causal/Causal/GluingHausdorff.lean:307","how":"exact"},{"x":"Causal.Causality.TwoPiece.globallyHyperbolic","t":"lean","loc":"lean-causal/Causal/CBG/Ppcm.lean:640","how":"exact"},{"x":"T-abs-cbg-initial-data","t":"target"}],"loc":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"open":["local_uniqueness"],"open_reason":"local_uniqueness: T-lad-development-nodes, behind T-abs-cbg-initial-data. Every other localisation property is a ladder node (rigid, germ_extension, cauchy_slice of sort geometry since T-lad-cbg-geometry-nodes); flat-gx proves them in Lean, smooth-vacuum owes them.","note":"Thm 2.7 (Maximal_GHD2.tex:411, proof 723–775). Gluing along the MCGHD (Thm 3.4) is Hausdorff because it has no corresponding boundary points (Thm 3.13 + the topological criterion of Causal.GluingHausdorff, T-abs-gluing-hausdorff); its GH is proved by chains (TwoPiece, model-free, in Causal.CBG.Ppcm until T-abs-hoist-cbg-gluing), not Sbierski's timelike curves. For two GHDs of the same DATA, take the datum M₀ := their CGHD (Thm 2.6): T-abs-cbg-initial-data.","geo":[{"model":"smooth-vacuum","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"},{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-vacuum-slice","t":"target"},{"x":"T-loc-vacuum-geometry","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367","how":"exact"},{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243","how":"exact"},{"x":"Causal.CBG.flat_germExtFuture","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:808","how":"exact"},{"x":"Causal.CBG.flat_germExtPast","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:832","how":"exact"},{"x":"Causal.CBG.flat_slice_future","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:512","how":"exact"},{"x":"Causal.CBG.flat_slice_past","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:546","how":"exact"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395","how":"exact"},{"x":"Causal.CBG.flat_hasTimeFunction","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:403","how":"exact"},{"x":"Causal.CBG.flat_cbg","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:875","how":"exact"}],"extra":{}}],"extra":{}},{"label":"mghdthm:MGHD","ref":"Thm 2.8","ledger":{"kind":"theorem","number":"","title":"Existence of MGHD","file":"Maximal_GHD2.tex","line":417,"proof":"Maximal_GHD2.tex:780","nl":"proved","lean":"none","decls":[],"deps":["mghdthm:CommonExtension"],"tex":"\\begin{theorem}[Existence of MGHD]\n\nGiven initial data there exists a GHD \\(\\tilde{M}\\) that is an extension of any other GHD of the same initial data.  The GHD \\(\\tilde{M}\\) is unique up to isometry and is called the \\emph{maximal globally hyperbolic development (MGHD)} of the given initial data.\n\\end{theorem}"},"ett":[{"x":"Causal.CBG.cbg","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:1093","how":"exact"},{"x":"Causal.CBG.maxDev_isUniversal","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:1043","how":"exact"},{"x":"Causal.CBG.Dev.IsUniversal.existsUnique_iso","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:1112","how":"exact"},{"x":"Causal.CBG.mcghd_cocycle","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:733","how":"exact"},{"x":"Causal.CBG.maxSpace_t2","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:879","how":"exact"},{"x":"Causal.Causality.ManyPiece.globallyHyperbolic","t":"lean","loc":"lean-causal/Causal/CBG/Maximal.lean:579","how":"exact"},{"x":"Causal.CBG.FamilyGlueData.t2Space_iff_forall_not_isCorrespondingBoundaryPair","t":"lean","loc":"lean-causal/Causal/GluingHausdorff.lean:570","how":"exact"},{"x":"Causal.CBG.Dev.isUniversal_of_small","t":"lean","loc":"lean-causal/Causal/CBG/Bound.lean:423","how":"exact"},{"x":"T-abs-cbg-initial-data","t":"target"}],"loc":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"open":["local_uniqueness"],"open_reason":"As Thm 2.7. Also used and not a ladder property: second countability of a GH spacetime with a second-countable Cauchy surface (Geroch 1968, Sbierski item 5; the Geometry field secondCountable_of_cauchy), owed by smooth-vacuum in T-loc-vacuum-geometry.","note":"Thm 2.8 (Maximal_GHD2.tex:417, proof 780–840). Glue the small developments along their pairwise MCGHDs (FamilyGlueData; Hausdorff by the family criterion of Causal.GluingHausdorff), cocycle, T2 from the pairs, GH by chains BEFORE second countability (design §6), universality, uniqueness up to unique isomorphism. Sbierski's size bound (GHDs inside M̄ × ℝ, via a timelike flow) is replaced by SmallDev. Universality over all developments of the DATA, not of one M₀, is T-abs-cbg-initial-data.","geo":[{"model":"smooth-vacuum","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"T-loc-smooth-causal-ladder","t":"target"},{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-vacuum-slice","t":"target"},{"x":"T-loc-vacuum-geometry","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["absolutely_minimal","causally_arc_connected","push_up","tarentin","rigid","germ_extension","cauchy_slice","curves_extend","time_function"],"by":[{"x":"Causal.CBG.flat_singularFlatAxioms","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:367","how":"exact"},{"x":"Causal.CBG.flatGeometry","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:824","how":"exact"},{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243","how":"exact"},{"x":"Causal.CBG.flat_germExtFuture","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:808","how":"exact"},{"x":"Causal.CBG.flat_germExtPast","t":"lean","loc":"lean-causal/Causal/Flat/CBGGerm.lean:832","how":"exact"},{"x":"Causal.CBG.flat_slice_future","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:512","how":"exact"},{"x":"Causal.CBG.flat_slice_past","t":"lean","loc":"lean-causal/Causal/Flat/CBGSlice.lean:546","how":"exact"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395","how":"exact"},{"x":"Causal.CBG.flat_hasTimeFunction","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:403","how":"exact"},{"x":"Causal.CBG.flat_cbg","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:875","how":"exact"},{"x":"Causal.CBG.flat_cbg_ett","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:920","how":"exact"}],"extra":{}}],"extra":{}},{"label":"mghdlem:IsoConnected","ref":"Lemma 3.1","ledger":{"kind":"lemma","number":"","title":"","file":"Maximal_GHD2.tex","line":437,"proof":"Maximal_GHD2.tex:442","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma}\n\nLet \\((M,g)\\) and \\((M',g')\\) be Lorentzian manifolds, where \\(M\\) is connected. Furthermore, let \\(\\psi_1, \\psi_2 : M \\to M'\\) be two isometric immersions with \\(\\psi_1(p) = \\psi_2(p)\\) and \\(d\\psi_1 (p) = d\\psi_2(p)\\) for some \\(p \\in M\\). It then follows that \\(\\psi_1 = \\psi_2\\).\n\\end{lemma}"},"ett":[{"x":"Causal.CBG.IsRigidFor","t":"lean","loc":"lean-causal/Causal/CBG/Geometry.lean:197","how":"exact"},{"x":"Causal.CBG.IsCGHD.eqOn","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:259","how":"exact"}],"loc":["rigid"],"open":[],"open_reason":"","note":"Lemma 3.1 (Maximal_GHD2.tex:437). Layer 3 for smooth-vacuum (geodesics in normal neighbourhoods); its ETT role is A1, the ladder node `rigid` (Causal.CBG.IsRigidFor), consumed by the gluing step IsCGHD.eqOn (the ladder's consequence at rigid). Rigidity is essential: without it maximal common sub-extensions are not unique (Causal.CBG.causal_pgcd_not_unique, the kink on the timelike line) and causal local isomorphisms are not rigid (Causal.CBG.not_isRigidFor_causalPreGeometry).","geo":[{"model":"smooth-vacuum","proves":["rigid"],"by":[{"x":"T-loc-vacuum-rigid-germ","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["rigid"],"by":[{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243","how":"exact"}],"extra":{}}],"extra":{}},{"label":"mghdcor:welldefined","ref":"Cor 3.2","ledger":{"kind":"corollary","number":"","title":"","file":"Maximal_GHD2.tex","line":452,"proof":"Maximal_GHD2.tex:459","nl":"proved","lean":"none","decls":[],"deps":["mghdlem:IsoConnected"],"tex":"\\begin{corollary}\n\nLet \\((M,g)\\) be a globally hyperbolic, time oriented Lorentzian manifold with Cauchy surface \\(\\Sigma\\) and \\((M',g')\\) another time oriented Lorentzian manifold. Moreover, say \\(U_1, U_2 \\subseteq M\\) are open and globally hyperbolic with Cauchy surface \\(\\Sigma\\), and \\(\\psi_i : U_i \\to M'\\), \\(i=1,2\\), are time orientation preserving isometric immersions that agree on \\(\\Sigma\\).\n\nThen \\(\\psi_1\\) and \\(\\psi_2\\) agree on \\(U_1 \\cap U_2\\).\n\\end{corollary}"},"ett":[{"x":"Causal.CBG.IsCGHD.eqOn","t":"lean","loc":"lean-causal/Causal/CBG/Pgcd.lean:259","how":"exact"},{"x":"Causal.IsCauchyEmbedding.c_ext_connexe_of_connectedSpace","t":"lean","loc":"lean-causal/Causal/CBG/CausalConvex.lean:758","how":"exact"}],"loc":["rigid","curves_extend"],"open":[],"open_reason":"","note":"Cor 3.2 (Maximal_GHD2.tex:452). Agreement on Σ propagates to U₁ ∩ U₂ by rigidity on a CONNECTED open: U₁ ∩ U₂ is connected because both Cauchy-include Σ in one M (lem:C_ext_connexe re-routed, c_ext_connexe_of_connectedSpace, the ladder's consequence at curves_extend, asked of the target; ETT-layer in Causal.CBG.CausalConvex since T-abs-hoist-time-function). That connectedness is exactly what fails on a fixed background (ERS19 §4.2, Thm 3.45; papers/ers-predictability).","geo":[{"model":"smooth-vacuum","proves":["rigid","curves_extend"],"by":[{"x":"T-loc-vacuum-rigid-germ","t":"target"},{"x":"T-loc-smooth-causal-ladder","t":"target"}],"extra":{}},{"model":"flat-gx","proves":["rigid","curves_extend"],"by":[{"x":"Causal.CBG.flat_rigid","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:243","how":"exact"},{"x":"Causal.CBG.flat_curvesExtend","t":"lean","loc":"lean-causal/Causal/Flat/CBG.lean:395","how":"exact"}],"extra":{}}],"extra":{}},{"label":"mghdlem:IsoDiffeo","ref":"Lemma 3.3","ledger":{"kind":"lemma","number":"","title":"","file":"Maximal_GHD2.tex","line":463,"proof":"Maximal_GHD2.tex:472","nl":"proved","lean":"none","decls":[],"deps":[],"tex":"\\begin{lemma}\n\nSay \\((M,g)\\) and \\((M',g')\\) are two globally hyperbolic spacetimes with Cauchy surfaces \\(\\Sigma\\) and \\(\\Sigma'\\), respectively. Let \\(\\psi : M \\to M'\\) be an isometric immersion such that \\(\\psi|_\\Sigma : \\Sigma \\to \\Sigma'\\) is a diffeomorphism.\n\nThen \\(\\psi\\) is an isometric embedding.\n\\end{lemma}"},"ett":[{"x":"Causal.CBG.injOn_of_injOn_cauchy","t":"lean","loc":"lean-causal/Causal/CBG/Injective.lean:566","how":"exact"},{"x":"Causal.CBG.sbierski_lemma_3_3","t":"lean","loc":"lean-causal/Causal/CBG/Injective.lean:610","how":"exact"},{"x":"Causal.CBG.injective_of_globallyHyperbolic","t":"lean","loc":"lean-causal/Causal/CBG/Injective.lean:621","how":"exact"},{"x":"Causal.Causality.HasTimeFunction.isCausal","t":"lean","loc":"lean-causal/Causal/CurvesExtend.lean:536","how":"exact"},{"x":"Causal.Causality.HasTimeFunction.curvesExtend","t":"lean","loc":"lean-c
