":"Global hyperbolicity without tarentin gives neither a time function nor strong causality: two absolutely minimal comb spacetimes in ℝ² (oriented segments, ≤_U along them inside U, ≪ empty) — the fork (a → w → x_n, b → y_n with x_n → b, y_n → a): causal, causally compact, strongly causal with open convex neighbourhoods, no time function; the loop fan (arcs γ_n from p_n to q_n through height 1, p_n, q_n → a): causal, causally compact, with a time function, not strongly causal at a — proved, or refuted","stream":"abstract","kind":"abstract","uses":["globally_hyperbolic","causally_compact","is_causal","strongly_causal","strongly_causal_open","time_function","absolutely_minimal","causally_arc_connected","tarentin"],"package":"lean-causal","status":"done","owner":"closer","priority":5,"depends":["T-abs-ladder-local-defs","T-abs-hoist-time-function"],"evidence":"The keeper's list (journal entry 2026-11-21 08:37, item (d): 'is_causal, strongly_causal, strongly_causal_open → time_function, which need non-stably-causal spacetimes'); the [[open]] notes of globally_hyperbolic → time_function ('Without tarentin open: Levin's proof takes local compactness, σ-compactness and the closedness of ≤ from it') and globally_hyperbolic → strongly_causal, strongly_causal_open ('with tarentin it holds (prop:GH_fortement_causal, T2)'), and Galileo's no-gluing pairs time_function → strongly_causal(_open). No Hawking–Ellis-type Lorentzian example is needed: an ETT causality may live on countably many segments. Argued, for the closer (the planner's sketch). (1) The fork: M ⊆ ℝ² the union of [a, w], [w, x_n], [b, y_n] (n ≥ 1), a = (0, 0), w = (1/2, 1), x_n = (1, 1/n), b = (1, 0), y_n = (0, −1/n), oriented a → w → x_n and b → y_n, pairwise disjoint but at w; x ≤_U y iff x = y ∈ U or y follows x along one oriented path whose piece between them lies in U; ≪ empty. Hausdorff and second countable (a subspace of ℝ²); causally arc-connected, hence absolutely minimal (Causal/ArcConnected.lean:216); causal (no cycle); each J_M(p, q) a compact sub-path (causally compact, so GH by Causal.Causality.globallyHyperbolic_iff, Causal/LadderLocal.lean:438); strongly causal with open neighbourhoods (a small ball meets each segment in a sub-segment, and no oriented path leaves a small ball about a, b or w and comes back); no time function: T(a) < T(w) < T(x_n) → T(b) and T(b) < T(y_n) → T(a) give T(a) < T(w) ≤ T(b) ≤ T(a). (2) The loop fan: M = {a} ∪ ⋃ γ_n, a = (0, 0), γ_n the polygon (1/n, 0) → (1/n, 1 + 1/n) → (−1/n, 1 + 1/n) → (−1/n, 0), so oriented, pairwise disjoint; ≤ along each γ_n as in (1), ≪ empty; causally arc-connected, causal, causally compact; T(γ_n(s)) = s/n (s ∈ [0, 1] the normalised parameter) and T(a) = 0 is continuous and strictly increasing along ≤ (Causal.Causality.HasTimeFunction, Causal/CurvesExtend.lean:516); not strongly causal at a: every small neighbourhood holds p_n, q_n for n large, and J_M(p_n, q_n) = γ_n reaches height 1. Simulated with tools/ladder.py's matrix on the ladder of 5f558c5: (1) settles globally_hyperbolic, is_causal, strongly_causal, strongly_causal_open → time_function, (2) time_function, globally_hyperbolic → strongly_causal, strongly_causal_open: 8 [[open]] pairs, all in either reading, no contradiction; Levin's edge (globally_hyperbolic ∧ tarentin ⇒ time_function) and prop:GH_fortement_causal (⇒ strongly_causal) are then sharp in tarentin, a finding for the ETT ledger's notes (the master's call). Galileo's two strong-causality pairs become moot. Layer 1: a new ETT-layer module (subspaces of ℝ², no model import); the two spaces share one construction (a causality carried by a family of oriented arcs), so one closer; if it is two closers' worth the closer reports the split. The keeper's recording is T-lad-record-separators.","added":"2026-11-21","proposed_by":"programme-planner (the keeper's list at T-lad-record-minimal, item (d), journal entry 2026-11-21 08:37)","commit":"28b4b95"},{"id":"T-abs-curves-extend-second-countable","title":"CurvesExtend on every T1, second countable spacetime, with no other hypothesis: every causal curve over a segment lies on an inextensible one (Zorn on the extension preorder; a continuous map from ω₁ into a second countable T1 space is eventually constant, so no chain of uncountable cofinality keeps growing) — proved, or refuted by a Hausdorff, second countable causality without it","stream":"abstract","kind":"abstract","uses":["curves_extend"],"package":"lean-causal","status":"planned","owner":"closer","priority":6,"evidence":"The keeper's list (journal entry 2026-11-21 08:37, item (d): 'the 16 X → curves_extend pairs: no Lean model lacks curves_extend') and Causal/CurvesExtend.lean's SCOPE (:90–100: 'The fully general statement is not proved, and is not stated … the long ray L … is not second countable; whether CurvesExtend holds in every strongly causal spacetime is open here'). CurvesExtend is the model fact carried as a named hypothesis of kb/0012 (Causal/CauchyExtension.lean:79–85), the hext of Lemma K, and a localisation property of 14 binder rows (curves_extend in open_localisation or localisation of papers/sbierski-mghd and papers/ers-predictability). Argued, for a scoping pass (the planner's sketch, 2026-11-21): (i) a continuous g : ω₁ → Y with Y second countable and T1 is eventually constant — for each basic open B_n, g⁻¹(B_n) is open, so it contains a tail or its complement is closed and unbounded; the countably many clubs meet in a club, and beyond the countably many tail bounds a point γ of it has g(γ) in exactly the B_n whose preimage holds a tail, while every g(α) of a common tail lies in all of them, so g(α) = g(γ) by T1; (ii) applied to α ↦ g(α + r) for each rational r ∈ [0, 1), a 'long curve' (over a direct limit of real intervals of uncountable cofinality) is eventually constant; (iii) Zorn on the causal curves extending c, preordered by 'is a reparametrised sub-arc of': a chain of countable cofinality is bounded by the union of a cofinal sequence over nested real intervals (a strictly monotone map of an interval with ordconnected image is continuous), one of uncountable cofinality is by (ii) eventually a constant tail, hence eventually equivalent; a maximal element is inextensible (Causal.Causality.Inextensible, Causal/Inextensible.lean:184: a strict extension grows the image, which a sub-arc cannot). The hard step is (iii)'s coherence: a chain gives its reparametrisations only existentially, and a curve with self-intersections or constant pieces (non-causal spacetimes, the time cylinder) has several, so the direct limit needs a coherent choice, or a formulation by images, or a transfinite construction by countable steps; the scoping pass chooses and may split the target (hence planned: not specified enough for one closer). If it holds, curves_extend is a theorem of every ETT spacetime: the 16 [[open]] pairs X → curves_extend are implied (a premise-free fact, T-tool-ladder-py-2 item (3)), the hext hypotheses discharge, and curves_extend leaves the binders' localisation lists. Same technique as T-abs-maximal-zorn (chains of extensions).","added":"2026-11-21","proposed_by":"programme-planner (the keeper's list at T-lad-record-minimal, item (d), journal entry 2026-11-21 08:37)"},{"id":"T-abs-hoist-inextensible-piece","title":"Hoist section 2 of Causal.Model.QuasilinearOneSided into a new ETT-layer module Causal.InextensiblePiece, same full names: Causality.futureInextensible_of_isLUB_notMem, pastInextensible_of_isGLB_notMem, inextensible_connectedComponentIn (the maximal piece in W of a time-parametrised causal line is inextensible) and IsCauchySurfaceOn.exists_mem_connectedComponentIn","stream":"abstract","kind":"abstract","uses":[],"package":"lean-causal","status":"done","owner":"closer","priority":6,"depends":["T-loc-quasilinear-one-sided"],"evidence":"Journal entry 2026-11-21 08:37 ('Causality.inextensible_connectedComponentIn is a hoist candidate') and kb/0081 (lean-causal/kb/entries/0081-lines- g into a connected, causally arc-connected spacetime with I⁺ open has a chronal curve leaving the image\", after Sbierski 1507.00601 Lemma 2.17 and Grant–Kunzinger–Sämann 1804.10423 Lemma 3.8) is FALSE in ETT: `Causal.isolatedLine` (the timelike line on ℝ ∖ {0}, 0 related only to itself) is causally arc-connected, causally open and plain, and no chronal curve leaves (0, ∞) (`not_exists_leaving_bare`). What both Lorentzian proofs take from the metric is a chronal neighbour of the boundary point (Sbierski's q̃ ∈ I⁻(p̃), GKS's Ĩ±(p̃) ∩ Ω̃ ≠ ∅). Proved: the sharp form (a chronal curve leaves O iff a boundary point of O has a chronal neighbour), the true form under the localisation hypothesis `HasChronalNeighbour` (`exists_leaving_of_isOpenEmbedding`, Sbierski's statement), and, with no localisation hypothesis, the non-dense case under tarentin + plain + arc-connected (neither tarentin nor plainness can be dropped). Readings taken: \"timelike curve\" of either time orientation; \"leaves\" = γ([0,1)) ⊆ ι(N), γ(1) ∈ ∂ι(N); proper = ι(N) ≠ M̃. Questions: should `HasChronalNeighbour` be a ladder node (the one-sided form; `Causal.LadderLocal.ChronalNeighbours` is the two-sided one)? Drop `causally_open_future` from the target's `uses` (no proof uses it; I± of points are open by the axioms)? The dense case under tarentin + plain + arc-connected is open.","where":"the 1-locate mark of T-abs-locate-extension; the binder of papers/sbierski-schwarzschild","status":"OPEN"},"OQ-52":{"date":"2026-11-20","text":"ETT programme, T-abs-ladder-local-defs (`Causal.LadderLocal`): readings taken for the named ladder side conditions. (a) The one-sided notions take the PAST as base (`ChronalPastNeighbours`, `NoPastEndpoint`; future forms are `C.dual.…`), against the library's usual future base, because the witnesses take the past hypothesis first and past neighbours give FUTURE causal openness; rename before the keeper makes them nodes? (b) `OneSidedBoundary U B` (ERS 1802.03020 (4.83)'s topol /* =====================================================================================

   ===================================================================================== */
const VIEWS = ["ladder","binders","roadmap"];
let current = null;
function showView(v){
  if (current === v) return; current = v;
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; $("#tab-" + x).setAttribute("aria-selected", x === v); });
  if (v === "ladder"){ if (!drawn) drawLadder(); else if (mode === "graph") view(); }
  if (v === "binders" && !bindersDrawn) drawBinders();
  if (v === "roadmap" && !$("#v-roadmap").innerHTML) drawRoadmap();
}
function route(){
  routed = location.hash;
  const parts = (location.hash || "#/ladder").replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const v = VIEWS.includes(parts[0]) ? parts[0] : "ladder"; showView(v);
  if (v === "ladder"){
    selProp = parts[1] === "p" ? parts[2] : null; selEdge = parts[1] === "edge" ? +parts[2] : null;
    selPair = null;
    if (parts[1] === "pair"){ selProp = parts[2]; const v = pair(parts[2], parts[3]); if (v) selPair = new Set([...(v.d || []), ...(v.da || []), ...(v.db || []), ...(v.bw ? LAD.fails[v.f].back[parts[3]].edges : [])]); }
    if (parts[1] === "transfer"){ const t = TR[+parts[2]]; selProp = t && PROP[t.pair] ? t.pair : null; }
    markLadder(); ladderLegend(); if (drawn && mode === "graph" && selProp && fitTransform().k < 0.45) view();
    if (parts[1] === "p") showProp(parts[2]); else if (parts[1] === "pair") showPair(parts[2], parts[3]); else if (parts[1] === "edge") showEdge(+parts[2]);
    else if (parts[1] === "transfer") showTransfer(+parts[2]); else if (parts[1] === "transfers") showTransfers(); else ladderOverview();
  } else if (v === "binders"){
    if (parts[2]) showRow(parts[1], parts[2]); else if (parts[1]) { showBinder(parts[1]); const s = document.getElementById("b-" + parts[1]); if (s) s.scrollIntoView({block:"start"}); } else bindersOverview();
    if (parts[2]){ const el = document.getElementById(`row-${parts[1]}-${parts[2]}`); if (el) el.scrollIntoView({block:"nearest"}); }
  } else {
    if (parts[1]){ showTarget(parts[1]); const el = document.getElementById("t-" + parts[1]); if (el) el.scrollIntoView({block:"nearest"}); } else roadOverview();
  }
}
document.addEventListener("click", ev => {
  const s = ev.target.closest("[data-scroll]"); if (s){ const el = document.getElementById(s.dataset.scroll); if (el) el.scrollIntoView({block:"start"}); return; }
  const g = ev.target.closest("[data-go]"); if (!g || g.disabled) return;
  ev.stopPropagation(); nav(g.dataset.go);
});
/* Navigation routes at once; the hashchange that follows (or the browser's back button) routes only
   when the hash differs from the one last routed. */
let routed = null;
function nav(h){ if (location.hash !== h) location.hash = h; route(); }
addEventListener("hashchange", () => { if (location.hash !== routed) route(); });
addEventListener("keydown", e => { if (e.key === "Escape" && e.target.tagName !== "INPUT"){ const v = current || "ladder"; nav("#/" + v); } });
/* search */
const FIND = {};
LAD.props.forEach(p => FIND[p.id] = "#/ladder/p/" + enc(p.id));
BINDERS.forEach(B => B.rows.forEach(r => FIND[r.label] = `#/binders/${enc(B.slug)}/${enc(r.label)}`));
ROAD.targets.forEach(t => FIND[t.id] = "#/roadmap/" + enc(t.id));
$("#ids").innerHTML = Object.keys(FIND).sort().map(k => `<option value="${esc(k)}"></option>`).join("");
$("#q").addEventListener("change", e => { const h = FIND[e.target.value.trim()]; if (h){ nav(h); e.target.blur(); } });
$("#n-ladder").textContent = LAD.props.length;
$("#n-binders").textContent = BINDERS.reduce((a, B) => a + B.rows.length, 0);
$("#n-roadmap").textContent = ROAD.targets.length;
route();
</script>
</body>
</html>
