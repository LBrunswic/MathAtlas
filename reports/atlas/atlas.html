"deps":[],"decls":["Causal.Flat.isOpen_omegaPlus_of_isClosed","Causal.Flat.isOpen_omegaMinus_of_isClosed"],"ndecls":2,"findings":[],"notes":"Flat/Penrose.lean (WP-30c). No sorry, no added hypothesis.","twin":"","tex":"\\begin{lema}\n\nIf $\\Lambda$ is closed, then $\\Omega^{+}(\\Lambda)$ is open\n(maybe empty).\n\\end{lema}"},{"id":"blem:fermonsbis","block":"GHFspace.tex:757","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":986,"deps":[],"decls":["Causal.Flat.omegaPlus_closure_eq_interior","Causal.Flat.omegaPlus_closure_eq_interior_of_futureRegular","Causal.Flat.omegaMinus_closure_eq_interior"],"ndecls":3,"findings":["Lemma 4.9 (l.989-990): the hypothesis 'with future regular closure' is superfluous: Omega^+(cl Lambda) = Int Omega^+(Lambda) for every Lambda, since Omega^+(cl Lambda) is open by Lemma 4.8."],"notes":"Flat/Penrose.lean (WP-30c). No sorry; one hypothesis dropped (weakened), none added.","twin":"","tex":"\\begin{lema}\n\nLet $\\Lambda$ be a subset of ${\\mathcal J}$ with\nfuture regular closure. Then, $\\Omega^{+}(\\overline{\\Lambda})$\nis the interior of $\\Omega^{+}(\\Lambda)$.\n\\end{lema}"},{"id":"bprop:regular_iff_bounded","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1007,"deps":[],"decls":["Causal.Flat.futureRegular_iff_exists_lt","Causal.Flat.pastRegular_iff_exists_gt","Causal.Flat.omegaPlus_nonempty_iff","Causal.Flat.omegaMinus_nonempty_iff","Causal.Flat.RegularIffBoundedAsPrinted","Causal.Flat.not_regularIffBoundedAsPrinted","Causal.Flat.regular_iff_bounded_corrected"],"ndecls":7,"findings":["(DEC-95: a typo; the corrected sign is the formalization of record) Prop 4.10 sign error (l.1011-1013): the statement says future regular iff s < C (past regular iff s > C); the proof (l.1017-1031), with P^+ = {<v|p> - s < 0} (l.887-890), shows that closed Lambda is future regular iff s is bounded BELOW, past regular iff bounded ABOVE. The printed form is refuted for every n >= 2 by Lambda = S x [0,inf[.","l.1030: the compactness of S is not needed (Cauchy-Schwarz gives |<v|x>| <= |x_0| + |x_1| uniformly), and the nonemptiness half needs no closedness."],"notes":"MARKED (DEC-95, 2026-11-02): Flat/Penrose.lean carries **`bprop:regular_iff_bounded`**; the corrected sign (closed Lambda future regular iff s bounded below, past regular iff bounded above) is the formalization of record, regular_iff_bounded_corrected, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed: the printed sign is a typo (DEC-95); the printed form is kept as the refuted Prop RegularIffBoundedAsPrinted (not_regularIffBoundedAsPrinted, kb/0022), a finding. Flat/Penrose.lean (WP-30c), no sorry. Corrected form proved ","twin":"","tex":"\\begin{prop}\n\nA closed subset of ${\\mathcal J}$ is future regular\n(resp. past regular) \nif and only if there is some real number $C$ such that,\nfor every $(v,s)$ in $\\Lambda$, the second component $s$\nis less than $C$ (resp. bigger than $C$).\n\\end{prop}"},{"id":"bcor:futetpast","block":"GHFspace.tex:757","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1035,"deps":[],"decls":["Causal.Flat.futureRegular_and_pastRegular_iff_isCompact","Causal.Flat.futureRegular_and_pastRegular_of_isCompact","Causal.Flat.futureRegular_pastRegular_not_isCompact"],"ndecls":3,"findings":["(DEC-95: covered by the closed-Lambda convention of l.1001-1004; the non-closed counterexample is kept as a finding) Cor 4.11 (l.1035-1040) needs Lambda closed, which it does not print: Lambda = {u_0} x ([0,1] minus {1/2}) is future and past regular and not compact (futureRegular_pastRegular_not_isCompact)."],"notes":"MARKED (DEC-95, 2026-11-02): Flat/Penrose.lean carries **`bcor:futetpast`**; futureRegular_and_pastRegular_iff_isCompact, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed: Lambda closed by the standing convention of l.1001-1004, which covers Cor 4.11 (DEC-95); the non-closed counterexample futureRegular_pastRegular_not_isCompact kept as a finding. Flat/Penrose.lean (WP-30c), no sorry. Proved for closed Lambda; the compact => regular direction holds without closedness.","twin":"","tex":"\\begin{cora}\n\n$\\Lambda$ is future regular and past regular if and only\nif it is compact.\\fin\n\\end{cora}"},{"id":"bprop:lip","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1073,"deps":[],"decls":["Causal.Flat.minkQ_gaussMap_sub_le","Causal.Flat.sqrt_minkQ_gaussMap_sub_le","Causal.Flat.minkQ_gaussMap_sub_nonneg","Causal.Flat.minkQ_sub_nonneg_of_mem_frontier","Causal.Flat.LipLength.lipschitzWith_gaussInduced","Causal.Flat.LipLength.edist_gaussInduced_le","Causal.Flat.LipLength.lipschitzWith_gaussSpace","Causal.Flat.LipLength.gaussInduced","Causal.Flat.LipLength.gaussSpace","Causal.Flat.LipLength.lipschitzWith_inducedMap","Causal.Flat.LipLength.lorentzLength_le_of_chord","Causal.Flat.LipLength.sqrt_minkQ_deriv_le_of_chord"],"ndecls":16,"findings":["Prop 4.12's proof (l.1073-1105) works directly at epsilon = t with q = pi(p) on the boundary; the dropped term |pi(p) - pi(p')|^2 >= 0 is the achronality of the boundary of Omega, which the proof uses silently."],"notes":"MARKED (DEC-103, 2026-11-02): Flat/LipLength.lean carries **`bprop:lip`** in the length form (lipschitzWith_gaussInduced), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed (DEC-103): 'the usual hyperbolic metric' read as the hyperboloid's induced length (agreement with arccosh(-<u|v>) not proved); DEC-35's induced length on S_t; DEC-88's CosmoRegular; the proof's silent use of the achronality term a finding. Flat/Cosmological.lean (WP-33b) and Flat/LipLength.lean (2026-11-02), strict, sorry-free (#print axioms against im","twin":"","tex":"\\begin{prop}\n\nThe Gauss map $n: S_{t} \\rightarrow {\\mathbb H}^{n-1}$, where\n${\\mathbb H}^{n-1}$ is equipped with its usual hyperbolic metric \nis $\\frac{1}{t}$-Lipschitz.\n\\end{prop}"},{"id":"bcor:level_sets_complete","block":"GHFspace.tex:757","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1108,"deps":[],"decls":["Causal.Flat.completeSpace_inducedLength_cosmoLevel","Causal.Flat.Lox.completeSpace_inducedLength_top_cosmoLevel","Causal.Flat.Lox.isSpacelikeLipschitzIn_opens_cosmoLevel","Causal.Flat.Cla.cosmoLevel_completeSpace_inducedLength"],"ndecls":4,"findings":[],"notes":"MARKED (DEC-88, 2026-11-02): Flat/Lox/LevelComplete.lean and Flat/Cla/RegularComplete.lean carry **`bcor:level_sets_complete`**. Proved twice, strict, sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath. Readings, disclosed: 'the induced riemannian metric' on S_t as the Lipschitz-path induced length (InducedLengthSpace / InducedLength, DEC-31/35), and CosmoRegular Lambda as the paper's intended regular domain (DEC-88, ✓ carried, not a strengthening; automatic for invariant Lambda under a group fixing no point of the Penrose sphere: cosmoRe","twin":"","tex":"\\begin{cora}\n\nEvery $S_{t}$ is complete.\n\\end{cora}"},{"id":"bprop:regular_cauchy_complete","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":1147,"deps":[],"decls":["Causal.Flat.Cla.isCauchyComplete_of_isQuotientOf_regular","Causal.Flat.Cla.isCauchyComplete_of_isQuotientOf_of_invariant","Causal.Flat.Cla.cosmoLevel_completeSpace_inducedLength","Causal.Flat.regular_cauchy","Causal.Flat.Bonsante_exhaustion","Causal.Flat.isCauchySurfaceOn_cosmoLevel_of","Causal.Flat.bonsante_exhaustion","Causal.Flat.bonsante_exhaustion_cone","Causal.Flat.isCauchySurfaceOn_cosmoLevel","Causal.Flat.futureExtensible_of_cosmoTime_le","Causal.Flat.pastExtensible_of_le_cosmoTime","Causal.Flat.two_mul_fst_sub_le_cosmoTime_sq"],"ndecls":18,"findings":["[4.CT] l.1049-1052, a wording issue, not an error (DEC-88): 'the proper times of all these curves are uniformly bounded' holds for the intended reading of Lambda, a regular domain (Bonsante's two non-parallel null support planes, Def 4.1, which l.921-922 calls 'completely equivalent'). Def 4.4's literal 'at least 2 elements' (l.900-901, l.1001-1004) is too weak: it also admits the domains delimited by one or two parallel degenerate hyperplanes, the paper's own unipotent family (introduction, l.222-226), where the cosmological time is infinite; Lambda = {(u,0),(u,1)} gives unbounded proper times (not_cosmoBoundedAsPrinted, the witness). Regularity is automatic when the topology is hyperbolic: a Lambda invariant under a nonelementary group has two distinct null directions (cosmoRegular_of_invariant, Cla.cosmoRegular_of_invariant_nonelementary).","[4.CT] l.1055: 'T(p) is equal to -sqrt(|p - pi(p)|^2)' should read sqrt(-|p - pi(p)|^2).","[4.CT] l.1064: the denominator of n(p) reads <p - pi(p) | p - n(p)>; it should be <p - pi(p) | p - pi(p)>.","[4.CT] l.1058-1060: T is concave (its superlevel sets are convex), not 'a C^1-convex function'; concavity is proved, C^1 is not.","l.1144-1145: Bonsante's Lemma 4.9, cited without proof, has a short causal proof in the flat setting (bonsante_exhaustion, no sorry)."],"notes":"MARKED (DEC-88, 2026-11-02): Flat/Cosmological.lean and Flat/Cla/RegularComplete.lean carry **`bprop:regular_cauchy_complete`**. Strict, sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02 for the marked decls and the six DEC-88 lemmas), no sorry beneath. Readings, disclosed: CosmoRegular Lambda as the paper's intended regular domain (DEC-88), and Cauchy-complete in DEC-35's reading (the induced length of bcor:level_sets_complete). The regularity is automatic, as DEC-88 asks: a nonempty Lambda invariant under a group whose linear part fixes no point of the P","twin":"","tex":"\\begin{prop} \n\nFuture complete regular convex domains are globally hyperbolic\nCauchy-complete, admitting as Cauchy hypersurfaces the level\nsets of the cosmological time function.\\fin\n\\end{prop}"},{"id":"bprop:agissons","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1173,"deps":[],"decls":["Causal.Flat.Lox.isCauchyComplete_flatQuotient_of_invariant","Causal.Flat.Lox.isCauchyComplete_flatQuotient_cosmo","Causal.Flat.agissons_invariant","Causal.Flat.cosmoTime_smul","Causal.Flat.cosmoTimes_smul","Causal.Flat.smul_cosmoLevel","Causal.Flat.smul_mem_cosmoLevel_iff","Causal.Flat.cosmoRetract_smul","Causal.Flat.preimage_omegaPlus_of_isomPenrose","Causal.Flat.bprop_agissons_general","Causal.Flat.agissons_properlyDiscontinuous","Causal.Flat.isOfFinOrder_of_smul_eq"],"ndecls":32,"findings":[],"notes":"MARKED (DEC-103, 2026-11-02): Flat/Semicomplete.lean carries **`bprop:agissons`**; bprop_agissons_full proves every clause of Prop 4.16, 'semicomplete' included, for CosmoRegular Lambda, Gamma discrete and preserving Omega+(Lambda): properly discontinuous, and if torsion-free a quotient M that is GH, Cauchy-complete (DEC-35), geodesically semicomplete (IsGeodesicallySemicomplete), in fact future complete for timelike and for null rays (isFutureGeodesicallyComplete_of_isQuotientOf), with an acausal Cauchy surface; sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, ","twin":"","tex":"\\begin{prop}\n\nIf $\\Gamma$ preserves a future complete regular convex domain $\\Omega$, \nthen, the action of $\\rho(\\Gamma)$ on $\\Omega$ is properly discontinuous.\nIf moreover $\\Gamma$ is torsionfree, then this action is\nfree, and the quotient $\\Gamma\\backslash\\Omega$ is\na Cauchy-complete semicomplete GH spacetime.\n\\end{prop}"},{"id":"bprop:admlox","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1229,"deps":[],"decls":["Causal.Flat.laoucapulse_repulsive_basin","Causal.Flat.laoucapulse_repulsive_basin_of_isRepulsiveFixed","Causal.Flat.laoucapulse_repulsive_linear","Causal.Flat.LimitSetMinimal","Causal.Flat.IsRepulsiveFixed","Causal.Flat.repulsiveSet","Causal.Flat.HasGlobalFixedPoint","Causal.Flat.IsSphereInvariant","Causal.Flat.limitSet_invariant_and_minimal","Causal.Flat.isSphereInvariant_repulsiveSet","Causal.Flat.IsSphereInvariant.closure","Causal.Flat.IsRepulsiveFixed.conj"],"ndecls":25,"findings":["(DEC-96: 'nonempty' is the evident intent) Prop 4.17 (l.1232-1238): 'contained in any closed rho(Gamma)-invariant subset' needs 'nonempty' (the empty set is closed and invariant); the same for the limit-set fact quoted at l.1248-1251.","l.1255-1266: the basin of repulsion of x_0 is all of J off the fibre over the attractive point v_1, so the closure of delta(Lambda) is not needed; the convergence of the s-coordinate is not argued in the paper (the elliptic part grows O(k) against the contraction lambda^k)."],"notes":"MARKED (DEC-96, 2026-11-02): Flat/Loxodromic.lean carries **`bprop:admlox`**; bprop_admlox (Prop 4.17 with 'nonempty'; invariance written as a subset, equivalent for a group), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed: 'nonempty' added as the evident intent (DEC-96); LimitSetMinimal a named external (DEC-36); of admissibility only 'L(Gamma) discrete with no global fixed point' is used; the empty set, the basin of repulsion and the unargued s-convergence kept as findings. Flat/Externals.lean (WP-33c) and Flat/Loxod","twin":"","tex":"\\begin{prop}\n\nFor any admissible representation $\\rho$, the closure of\nthe set of repulsive fixed\npoints in ${\\mathcal J}$ of loxodromic elements of $\\rho(\\Gamma)$\nis a $\\rho(\\Gamma)$-invariant subset $\\Lambda(\\rho)$ \ncontained in any closed $\\rho(\\Gamma)$-invariant subset\nof ${\\mathcal J}$. \n\\end{prop}"},{"id":"bdef:definitioncauchyhyp","block":"GHFspace.tex:757","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1276,"deps":[],"decls":["Causal.Flat.IsCauchyHyperbolic","Causal.Flat.IsAdmissible","Causal.Flat.limitOpensPlus","Causal.Flat.limitOpensMinus","Causal.Flat.limitSetJ","Causal.Flat.loxRepSet","Causal.Flat.IsRepulsiveFixedJ","Causal.Flat.IsFutureAdmissible","Causal.Flat.IsPastAdmissible","Causal.Flat.IsCauchyHyperbolic.exists_isAdmissible"],"ndecls":10,"findings":[],"notes":"MARKED (DEC-96, 2026-11-02): Flat/Loxodromic.lean carries **`bdef:definitioncauchyhyp`**, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Readings, disclosed (DEC-96): Lambda(rho) as in Prop 4.17 (limitSetJ: the closure of the repulsive fixed points in J of loxodromic elements); Omega^+ for future admissible and Omega^- for past admissible rho; 'admissible' in subgroup form. Flat/Loxodromic.lean (WP-34d), no sorry. Subgroup form: L injective on Gamma, L(Gamma) discrete (lorentzTopology), no global fixed point; the sign of Omega^p","twin":"","tex":"\\begin{defina}\n\nA Cauchy-hyperbolic spacetime is the quotient of \n$\\Omega^{\\pm}(\\Lambda(\\rho))$\nby $\\rho(\\Gamma)$ for any admissible representation \n$\\rho: \\Gamma \\rightarrow \\mbox{Isom}({\\bf M}^{n})$.\n\\end{defina}"},{"id":"blem:admissible_cone","block":"GHFspace.tex:757","kind":"lemma","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":1354,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lema}\n\n${\\mathcal T}^{+}$ is a convex cone.\n\\end{lema}"},{"id":"bprop:tri","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":1420,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop}\n\nThere his a (nonuniform) lattice $\\Gamma$ of $SO_{0}(1,2)$ for which\n${\\mathcal T}^{+}$ is reduced to $\\{ 0 \\}$.\n\\end{prop}"},{"id":"bdef:geometrically_finite","block":"GHFspace.tex:757","kind":"definition","num":"","title":"","bucket":"T","lean":"none","nl":"definition","line":1610,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defina} \n\n$\\Gamma$ is \\emph{geometrically finite} if, for any $\\epsilon>0$,\nthe quotient of the $\\epsilon$-neighborhood of $C(\\widehat{\\Lambda})$ by\n$\\Gamma$ has finite volume. If moreover this quotient is\ncompact, then $\\Gamma$ is \\emph{convex cocompact.}\n\\end{defina}"},{"id":"bthm:convex_cocompact","block":"GHFspace.tex:757","kind":"theorem","num":"","title":"","bucket":"T","lean":"none","nl":"informal","line":1680,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{thma}\n\nFor convex cocompact Kleinian groups, the convex cone \n${\\mathcal T}^{+}$ is the whole $H^{1}(\\Gamma, {\\mathbb R}^{1,n-1})$.\n\\fin\n\\end{thma}"},{"id":"bthm:ausl","block":"GHFspace.tex:1688","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":1696,"deps":[],"decls":["Causal.Flat.affAuslanderCarriereDalbo","Causal.Flat.affAuslanderCarriereDalbo_euclidean","Causal.Flat.auslanderCarriereDalbo_viaAff","Causal.Flat.AffAuslanderCarriereDalbo","Causal.Flat.AffAusConclusion","Causal.Flat.AffDiscrete","Causal.Flat.affTopology","Causal.Flat.affPair","Causal.Flat.affLin","Causal.Flat.affLinearImage","Causal.Flat.affG0","Causal.Flat.affNonDiscretePart"],"ndecls":42,"findings":[],"notes":"MARKED (DEC-123, 2026-11-08): Flat/AffACDProof.lean carries **`bthm:ausl`** in the PRINTED generality, sorry-free, strict, imported by Causal.lean: affAuslanderCarriereDalbo_euclidean n : AffAuslanderCarriereDalbo (EuclideanSpace R (Fin n)) (every discrete Gamma <= Aff(n, R): G_0, the identity component of the closure of L(Gamma) in GL(n, R), and Gamma_nd = Gamma cap L^{-1}(G_0) are nilpotent), from affAuslanderCarriereDalbo V for every finite-dimensional real normed V (hypothesis weakened only). Forms (Flat/AffACDBase.lean): GL(V) = (V ->L V)^x with the operator-norm (units) topology; Aff(V) ","twin":"","tex":"\\begin{thma}\n\nLet $\\Gamma$ be a discrete subgroup of $\\mbox{Aff}(n, {\\mathbb R})$.\nThen, the identity component $G_{0}$ of\nthe closure of $L(\\Gamma)$ in $GL(n, {\\mathbb R})$ is nilpotent.\nIn particular, $\\Gamma_{nd} = L^{-1}(G_{0} \\cap L(\\Gamma))$\nis nilpotent.\n\\end{thma}"},{"id":"bthm:unip","block":"GHFspace.tex:1688","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":1709,"deps":[],"decls":["Causal.Flat.affMaxUnipotent","Causal.Flat.affMaxUnipotent_real","Causal.Flat.AffMaxUnipotentSubspace","Causal.Flat.AffIsMaxUnipotent","Causal.Flat.AffIsUnipotentInvariant","Causal.Flat.affFitting","Causal.Flat.affFitting_linear_mem","Causal.Flat.mem_affFitting_of_forall","Causal.Flat.affIsUnipotentInvariant_mk'_affFitting","Causal.Flat.le_mk'_affFitting_of_affIsUnipotentInvariant","Causal.Flat.affMaxUnipotent_of_mem_affFitting","Causal.Flat.affFittingRep"],"ndecls":44,"findings":["[5.B] l.1732-1733: 'the kernel of the restriction morphism Gamma -> Isom(U) is a finite index subgroup of Gamma_nd' is false as written: that kernel is the pointwise stabiliser of U, finite for discrete Gamma. What the argument needs is that Gamma_nd acts on U by translations, plus an omitted step (finite-by-Z^j is virtually Z^j).","[5.B] l.2611-2612: 'up to finite index, there is a unique maximal affine subspace U on which Gamma acts by translations' does not determine U (screw motion of R^3: the axis for <g>, all of R^3 for <g^m>); in Section 5.1 U is canonical (the maximal unipotent subspace of Gamma_nd).","[5.B] l.1772-1775: the U of 'a twisted product of a flat torus Gamma\\U by R^n/U' must be the cocompact subspace, not the maximal unipotent one (Z acting by a translation on R^2 gives a cylinder); no single U serves l.2611 and l.1773 at once."],"notes":"MARKED (DEC-123, 2026-11-08): Flat/AffUnipProof.lean carries **`bthm:unip`** in the PRINTED generality, sorry-free, strict, imported by Causal.lean: affMaxUnipotent_real n : AffMaxUnipotentSubspace R (Fin n -> R) (every nilpotent N <= Aff(R^n) has a nonempty maximal N-invariant affine subspace on which N acts unipotently, and every maximal one equals it), from affMaxUnipotent for any field k and finite-dimensional V (hypothesis weakened only). Readings disclosed in the module's SCOPE: a nilpotent group of affine transformations as a nilpotent subgroup of the affine group (an acting group and i","twin":"","tex":"\\begin{thma}\n\nLet $\\Gamma$ be a nilpotent group of affine transformations of\n${\\mathbb R}^{n}$. Then, there exist a maximal $\\Gamma$-invariant \naffine subspace ${\\bf U}$\nof ${\\mathbb R}^{n}$ such that the restriction of the action\nof $\\Gamma$ to ${\\bf U}$ is unipotent. Moreover, this maximal\nunipotent affine subspace is unique.\n\\end{thma}"},{"id":"blem:suspendre","block":"GHFspace.tex:1688","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1833,"deps":[],"decls":["Causal.Flat.suspendre","Causal.Flat.AffineMinkEmbedding.baseSpacetime","Causal.Flat.AffineMinkEmbedding.isQuotientOf_baseSpacetime","Causal.Flat.AffineMinkEmbedding.restrictGroup","Causal.Flat.AffineMinkEmbedding.preimageOpens","Causal.Flat.AffineMinkEmbedding.instInvariantRestrict","Causal.Flat.AffineMinkEmbedding.instIsCancelSMulRestrict","Causal.Flat.AffineMinkEmbedding.instProperlyDiscontinuousSMulRestrict","Causal.Flat.AffineMinkEmbedding.connectedSpace_base","Causal.Flat.AffineMinkEmbedding.split","Causal.Flat.AffineMinkEmbedding.Restricts.split_smul","Causal.Flat.AffineMinkEmbedding.mem_iff_retract_mem"],"ndecls":16,"findings":["Lemma 5.5 (l.1836-1844) is false as written in dimension >= 3: in M^3 the glide gamma(t,x) = (t+1,-x) generates a free properly discontinuous Z on M^3, preserves the timelike plane U = {x_2 = 0}, and restricts to U with determinant -1, so Gamma\\U is a timelike Moebius strip, not a flat spacetime (not_restrictsIn_glideGroup_of_range). Fix: Gamma preserves the orientation of U (an index <= 2 subgroup, consistent with Theorem A's 'up to finite coverings').","Freeness and proper discontinuity do not make Gamma\\Omega causal (Z e_0 acting on M^n, not_isCausal_timeGroup); Barbot never claims otherwise, but every 'quotient of GH is GH' step needs a hypothesis on the action."],"notes":"MARKED (DEC-99, 2026-11-02): Flat/TwistedProduct.lean carries **`blem:suspendre`**, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed (DEC-99): the orientation hypothesis RestrictsIn (the glide/Moebius counterexample a finding, not_restrictsIn_glideGroup_of_range); read at the level of Omega in DEC-43's twisted-product form IsLTPOver, not descended to a bundle map B -> M. Flat/TwistedProduct.lean (WP-31d), on Flat/Quotient.lean's FlatQuotient (WP-31b), no sorry. ⚠ strengthened (ruled DEC-99): RestrictsIn iota Gamma (each ","twin":"","tex":"\\begin{lema}\n\nLet $B$ be a flat spacetime, \nquotient of an open subset $\\Omega$ of \\mink by a \ngroup of isometries acting freely and properly discontinuously.\nAssume that $\\Gamma$ preserves a timelike affine subspace $\\bf U$,\nand that $\\Omega$ is invariant by translations by vectors contained\nin the orthogonal linear space ${\\bf U}^{\\perp}$. Then, the\nquotient of ${\\bf U} \\cap \\Omega$ by $\\Gamma$ is a \nflat spacetime $M$, and $B$ is the linear twisted product of\n$M$ by the euclidean space ${\\bf U}^{\\perp}$.\\fin\n\\end{lema}"},{"id":"blem:paranongh","block":"GHFspace.tex:2019","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2173,"deps":[],"decls":["Causal.Flat.CausallyRelated","Causal.Flat.Paranongh","Causal.Flat.ParanonghPts","Causal.Flat.paranongh_of_paranonghPts","Causal.Flat.paranongh_iff","Causal.Flat.paranonghPts_iff","Causal.Flat.paranongh_of_le_two","Causal.Flat.paranonghPts_of_le_two","Causal.Flat.not_paranongh","Causal.Flat.not_paranonghPts","Causal.Flat.IsParabolicNontrivR","Causal.Flat.ParanonghStrict"],"ndecls":34,"findings":["Lemma 7.1 (l.2173-2180) is FALSE as printed: with 'parabolic' admitting R = id (as Section 9's purely unipotent case l.2865 requires) it fails for n >= 4 (null rotation composed with a unit translation, x_0 = 0: nullRotShift_counterexample); with R non-trivial (l.1974) it fails for n >= 6 (halfTurnShift_counterexample). It holds exactly for n <= 3; the strongest true forms are proved class by class (transverse, linear, tangent off an affine hyperplane c + J^perp).","Proof, l.2187-2188: |g^q x - x_0|^2 = |x|^2 + |x_0|^2 - 2<g^q x|x_0> uses |g^q x|^2 = |x|^2, false unless tau = 0; l.2191: <g^q x|x_0> = <g^q x_0|x> is false; in the transverse case the leading term is quartic (-q^4|p tau|^2/12), not the cubic of l.2193.","Proof, l.2207-2209 (linear case): an x with <p^2(x)|x_0> > 0 exists only if x_0 is not in J^perp; for x_0 in J^perp another choice is needed (paranongh_linear_normal).","Use in Section 9, l.2776-2783: the base point x_0 in S~ must avoid the exceptional hyperplane parallel to J^perp in the tangent case.","Section 6 class overlaps, l.1880-1899 and l.1973-1974: the normal forms overlap (zeta = 0 allows the identity, so every elliptic element is loxodromic; parabolic as listed contains every elliptic and every unipotent element, while Section 6.2 asks R non-trivial and Section 7 l.2085 treats id + p as parabolic), so elliptic/loxodromic/parabolic is not a partition as printed. With zeta != 0 and U != id the classes are disjoint and exhaustive (lorentz_trichotomy).","Section 6, l.1852: p = L(g) - id is an endomorphism of M^n, not an element of SO_0(1,n-1); l.1873: M^n = I + I^perp is justified for elliptic L(g) only (false for unipotent L(g) != id); l.1890 and l.1908: 'J nontrivial' needs p != 0; l.1943-1951: the displayed matrix is that of p, not of L(g); l.2008-2014: 'tau in I' is meaningful only after normalisation (as an invariant: tau in Im(L(g) - id)).","Section 6, l.1875-1876: 'R' is not yet defined in the elliptic item (read L(g) = id); l.1929-1931: 'v_1 = p(v_n) is a non-trivial element of I minus J' is asserted without argument (gap filled).","[7.0] l.2024: the printed Omega_g quantifies over all q in Z, q = 0 included, so it is empty as written; read q != 0. l.2026: 'It is the open set' is false in general: open for elliptic and parabolic g, and for loxodromic g iff tau = 0 and L(g) has finite order on the orthogonal of the null frame (isOpen_achronalDomain_lox_iff).","[7.L] l.2081: Omega_g = {xy < 0} holds for its interior only; for normal-form tau != 0, Omega_g = {xy <= 0}, not open. l.2068 and l.2075: the normalisations of the sh^2 factor disagree (harmless: only its sign and growth are used).","[7.E] l.2047-2049: 'the R^n-fixed points' must read R^N for one N > 0 (not n the dimension); l.2036: '|(R^q - id)(x)|^2' should read '(R^q - id)(x)'."],"notes":"MARKED (DEC-98, 2026-11-02): Flat/AchronalDomains.lean carries **`blem:paranongh`**; the class-by-class corrected form paranongh_corrected is the formalization of record (transverse and linear parabolic: every x_0; tangent parabolic: x_0 off c + J^perp, failing at c; the point c is existential in the statement), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed: 'parabolic' read as a decomposition R U with R = id allowed; the printed form is false (for d >= 3 with R = id, nullRotShift_counterexample; for d >= 5 with R != ","twin":"","tex":"\\begin{lema}\n\nLet $g$ be a parabolic isometry. Let $x_{0}$ be any point of \\mink.\nThen, there exist at least one point $x$ in \\mink admitting\ninfinitely many $g$-iterates in the future or in\nthe past of $x_{0}$.\n\\end{lema}"},{"id":"bprop:project","block":"GHFspace.tex:2212","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2232,"deps":[],"decls":["Causal.Flat.bprop_project","Causal.Flat.isHomeomorph_of_isCoveringMap","Causal.Flat.SpacelikeDevelopment","Causal.Flat.PulledLength","Causal.Flat.projAlong","Causal.Flat.orthSub","Causal.Flat.projAlong_eq_iff","Causal.Flat.completeSpace_pulledLength_slice","Causal.Flat.edist_pulledLength_slice","Causal.Flat.edist_eq_iInf_pathLength_slice","Causal.Flat.spacelikeDevelopment_slice","Causal.Flat.isCoveringMap_projAlong_comp"],"ndecls":27,"findings":["W5, l.2244-2257: the maximal lifting of an arbitrary path c-bar is Cauchy only if c-bar is rectifiable; repaired by lifting straight segments only. The step 'distance increasing, and thus a local homeomorphism' (l.2244-2245) is a standard implicit one in the smooth setting, not a defect.","Section 8 set-up, l.2215-2223: Barbot works on the universal cover S~ of S with a lift f~; this agrees with p^-1(S) in the universal cover of M iff pi_1(S) -> pi_1(M) is onto, which is never stated (for a Cauchy surface it is the topological splitting, Prop 8.11).","[8.L] l.2318-2319: the integrand sqrt(1 - phi'(c(t))^2)||c'(t)|| is correct only for n - 1 = 1; in general it is sqrt(||c'||^2 - (dphi c')^2), and phi' need not exist along c.","[8.L] l.2315-2317: for 1-Lipschitz graphs the induced pseudo-distance can vanish (the null graph {t = <e,x>}), so 'length metric' is false and the induced topology is not the subspace topology; true for locally uniformly spacelike Lipschitz hypersurfaces (IsSpacelikeLipschitzIn.isHomeomorph_toSubtype)."],"notes":"Flat/CauchyComplete.lean (WP-32g), no sorry (#print axioms: propext, Classical.choice, Quot.sound). Hypotheses only weakened: any connected T2 space X with a spacelike Lipschitz development whose pulled-back length is complete (DEC-35's metric reading; simple connectivity not used). The paper's order (covering, then simply connected) is inverted, legitimately. Non-vacuity: spacelikeDevelopment_slice. The master may unmark if the [2.4] reading question is held to bear on 8.1. The bridge IsCauchyComplete => (CC') (no paper label) is closed in the same file.","twin":"","tex":"\\begin{prop}\n\nLet $\\Delta$ be a timelike direction in ${\\bf M}^{n}$.\nLet $Q(\\Delta)$ be the quotient linear space ${\\bf M}^{n} \\slash \\Delta$,\nand $\\pi: {\\bf M}^{n} \\rightarrow Q(\\Delta)$ the quotient map.\nEquip $Q(\\Delta)$ with the metric for which $\\pi$ restricted to every\nspacelike hyperplane orthogonal to $\\Delta$ is an isometry.\nThen, $\\pi \\circ {\\mathcal D} \\circ \\tilde{f}$ is a homeomorphism.\n\\end{prop}"},{"id":"bcor:quo","block":"GHFspace.tex:2212","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":2263,"deps":[],"decls":["Causal.Flat.existsUnique_mem_graph_line","Causal.Flat.eq_of_mem_line_of_isAchronal","Causal.Flat.exists_lipschitz_graph_iff","Causal.Flat.lt_top_line","Causal.Flat.exists_lipschitz_graph_of_isAchronal_of_exists","Causal.Flat.bcor_quo","Causal.Flat.holonomy_smul_eq","Causal.Flat.eq_one_of_holonomy_fix","Causal.Flat.holonomy_proper","Causal.Flat.ccAction_of_developsCC","Causal.Flat.deck_eq_one_of_apply_eq","Causal.Flat.IsDevelopingPair"],"ndecls":49,"findings":["[8.G] l.2323-2326: 'one cannot be contained in the past or future cone of the other, i.e. |x - y|^2 > 0' defines acausality (strict), not achronality.","[8.G] l.2307-2309: 'contracting' is ambiguous, and the paper does not say why the contraction is strict: 8.1 gives a 1-Lipschitz graph for each timelike direction, and strictness comes from a point-locally c < 1 piece containing no null segment.","'f and D o f~ are embeddings' (l.2266) does not follow from (CC') without the local-graph structure of S~; D o f~ an embedding and S~ preconnected are proved under T2."],"notes":"MARKED (DEC-105, 2026-11-02): Flat/QuoFull.lean carries **`bcor:quo`** (ruling L); bcor_quo_of_isCauchyComplete proves every clause of Cor 8.2 from the paper's Cauchy-completeness, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]), with no DevelopsCC or injOn hypothesis: M : FlatSpacetime (T2 and connected), GH M, S a Cauchy surface, IsSpacelikeLipschitz d S, CompleteSpace (InducedLengthSpace d S) and the topology field (the fields of IsCauchyComplete), any developing pair; conclusion that of bcor_quo_full_of_connected: f and D o f~","twin":"","tex":"\\begin{cora}\n\nThe maps $f$ and ${\\mathcal D} \\circ \\tilde{f}$ are embeddings. The natural morphism\n$\\Gamma \\subset \\pi_{1}(M)$ and the morphism\n$\\rho$ are injective. Moreover, \n${\\mathcal D} \\circ \\tilde{f}(\\widetilde{S})$ intersects every\ntimelike geodesic.\\fin\n\\end{cora}"},{"id":"bcor:quoiso","block":"GHFspace.tex:2212","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2277,"deps":[],"decls":["Causal.Flat.bcor_quoiso","Causal.Flat.IsSpacelikeLipschitzIn.exists_uniform_spacelike","Causal.Flat.SpacelikeDevelopment.exists_chart_of_proj","Causal.Flat.nullProj","Causal.Flat.nullProj_apply","Causal.Flat.minkQ_eq_nullProj","Causal.Flat.minkB_nullProj","Causal.Flat.minkB_sub_left'","Causal.Flat.minkB_smul_right'","Causal.Flat.exists_lift_segment_of_mapClusterPt","Causal.Flat.SpacelikeDevelopment.exists_lift_of_proj","Causal.Flat.SpacelikeDevelopment.tendsto_lift_of_proj"],"ndecls":13,"findings":["W6, l.2287-2290: 'completely similar' hides two distinct steps, an openness step by the intermediate value theorem and a closedness step that is 8.1's completeness argument on the (n-2)-dimensional S~ cap P_0."],"notes":"Flat/CauchyComplete.lean (WP-32g), no sorry. Hypotheses as for bprop:project (weakened only).","twin":"","tex":"\\begin{cora}\n\nLet $P_{0}$ be a lightlike affine hyperplane of ${\\bf M}^{n}$,\nwith direction the orthogonal of a lightlike direction $\\Delta_{0}$.\nThen, either $\\widetilde{S}$ does not intersect $P_{0}$, or\nit intersects every affine line with direction $\\Delta_{0}$\ncontained in $P_{0}$.\n\\end{cora}"},{"id":"bcor:abel","block":"GHFspace.tex:2212","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2292,"deps":[],"decls":["Causal.Flat.BcorAbelPrinted","Causal.Flat.not_bcorAbelPrinted","Causal.Flat.BcorAbelStepPrinted","Causal.Flat.not_bcorAbelStepPrinted","Causal.Flat.bcor_abel_counterexample","Causal.Flat.gamma4","Causal.Flat.ccAction_gamma4","Causal.Flat.not_isVirtuallyFreeAbelian_gamma4","Causal.Flat.IsVirtuallyFreeAbelian","Causal.Flat.bcor_abel","Causal.Flat.bcor_abel_hypotheses_witness","Causal.Flat.abel_free_of_fix"],"ndecls":17,"findings":["Cor 8.4 false as printed (l.2295-2296): in M^4, Gamma = Gamma_0 x <z -> z+1>, Gamma_0 a cocompact Fuchsian group in SO_0(1,2), preserves the spacelike line {t = x = y = 0}, acts freely, properly and cocompactly on the (CC') surface H^2 x R, and is pi_1(closed surface) x Z, not virtually abelian. The failing step is 'the action of Gamma on pi(U) has to be free and properly discontinuous' (Delta is not Gamma-invariant, W9). The cocompact example is not formalized; the formalized one is Gamma(4) < SL(2,Z) (a finite-area, non-compact quotient of H^2), in every n >= 4 (not_bcorAbelPrinted).","The proof's missing hypothesis is a Gamma-invariant timelike direction Delta (with it the statement holds: bcor_abel); at its use in [10.M] (l.3326) L(Gamma) preserves two null directions instead, where the claim is also false as written (a pure boost fixes P pointwise; not formalized) and bcor_abel_twoNull is the true replacement."],"notes":"MARKED (DEC-101, 2026-11-02): Flat/Abel.lean carries **`bcor:abel`**; the unified repair bcor_abel_unified (an invariant timelike direction or two invariant null directions; m <= dim U + 1; conditional only on the named external BieberbachI, DEC-36) is the formalization of record, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). The printed form is false (not_bcorAbelPrinted, the Gamma(4) witness), kept as a finding. Flat/Abel.lean (WP-35a-Abel), strict, sorry-free (#print axioms of every decl of this row: propext, Classical.choic","twin":"","tex":"\\begin{cora}\n\nIf $\\Gamma$ preserves a spacelike affine subspace ${\\bf U}$, then\n$\\Gamma$ contains as a finite index subgroup a free abelian group of finite rank.\n\\end{cora}"},{"id":"bdef:U_g","block":"GHFspace.tex:2212","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":2332,"deps":[],"decls":["Causal.Flat.Ug","Causal.Flat.IsNonspacelikeElliptic","Causal.Flat.IsSpacelikeElliptic","Causal.Flat.IsParabolicPair","Causal.Flat.IsLinearParabolic","Causal.Flat.IsTangentParabolic","Causal.Flat.IsTransverseParabolic","Causal.Flat.nullHyperplanes","Causal.Flat.Ug_subset_achronalDomain","Causal.Flat.compl_nullHyperplanes_subset_achronalDomain","Causal.Flat.smul_mem_Ug","Causal.Flat.classes_of_not"],"ndecls":21,"findings":["W4: U(id) is empty (id is nonspacelike elliptic), so U(Gamma) must range over gamma != 1 (and Omega_g over q != 0).","l.2343, 'J the lightlike affine line of fixed points': for a linear parabolic g with R = id the fixed set c + ker(L(g) - id) has dimension n - 2, not a line; J is read as the null direction through a fixed point."],"notes":"MARKED (DEC-94, 2026-11-02): Flat/Develop.lean carries **`bdef:U_g`**, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Readings, disclosed: W4 (DEC-91: U(Gamma) over gamma != 1, Omega_g over q != 0); for a linear parabolic g, 'J' read as the null direction through a fixed point (the fixed set has dimension n - 2, DEC-94), so J^perp is nullHyperplanes, independent of the parabolic decomposition (mem_nullHyperplanes_iff). Flat/Develop.lean (WP-32f), no sorry. The last branch Ug = Omega_g covers exactly 'loxodromic, spacelike ellipt","twin":"","tex":"\\begin{defina}\n\nFor every isometry $g$ of ${\\bf M}^{n}$.\nWe define an open set $U(g)$ in the following way:\n\n- $U(g) = \\Omega_{g}$ if $g$ is loxodromic, or spacelike\nelliptic, or non linear parabolic.\n\n- $U(g) = \\emptyset$ if $g$ is nonspacelike elliptic,\n\n- $U(g) = {\\bf M}^{n} \\setminus J^{\\perp}$ if $g$\nis linear parabolic, where $J$ is the lightlike\naffine line of fixed points of $g$, \n\n\\end{defina}"},{"id":"blem:SdanU","block":"GHFspace.tex:2212","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2353,"deps":[],"decls":["Causal.Flat.blem_SdanU","Causal.Flat.CCAction","Causal.Flat.CCAction.dependenceDomain_subset_UGamma","Causal.Flat.CCAction.dependenceDomain_subset_achronalDomain","Causal.Flat.CCAction.dependenceDomain_subset_compl_nullHyperplanes","Causal.Flat.CCAction.not_isNonspacelikeElliptic","Causal.Flat.CCAction.false_of_le_smul","Causal.Flat.ccAction_bot","Causal.Flat.CCAction.nonempty","Causal.Flat.CCAction.smul_mem","Causal.Flat.CCAction.pow_ne_one","Causal.Flat.CCAction.not_isOfFinOrder"],"ndecls":14,"findings":["Proof, l.2383-2389: 'the complement of U(gamma) is a union of lightlike geodesics' is false for loxodromic gamma (through a point with xy > 0 every null line leaves {xy >= 0}); repaired through D(Sigma) in U(Gamma) and Sigma in int D(Sigma).","The transverse parabolic case needs no Lemma 7.1 (false for n >= 4): Sigma lies in Omega_gamma, which is empty."],"notes":"MARKED (DEC-83, 2026-11-02): Flat/Develop.lean (WP-32f) carries **`blem:SdanU`**. blem_SdanU is sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath it. ⚠ reading, disclosed: the (CC') reading (DEC-35, CCAction) and W4 (U(Gamma) as the intersection over gamma != 1); no external. Torsion is excluded first: a finite-order isometry is nonspacelike elliptic.","twin":"","tex":"\\begin{lema}\n\nThe complete spacelike hypersurface $\\widetilde{S}$ is contained in the interior of\n$U(\\Gamma) = \\bigcap_{\\gamma \\in \\Gamma} U(\\gamma)$.\n\\end{lema}"},{"id":"bdef:omega_gamma","block":"GHFspace.tex:2212","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":2394,"deps":[],"decls":["Causal.Flat.UGamma","Causal.Flat.omegaGamma","Causal.Flat.omegaS","Causal.Flat.omegaSOpens","Causal.Flat.omegaS_eq","Causal.Flat.subset_omegaS","Causal.Flat.isOpen_omegaS","Causal.Flat.UGamma_eq_of_index"],"ndecls":8,"findings":["Rem 8.8 (l.2403-2408): under W4, U(Gamma') = U(Gamma) for a finite-index Gamma' fails with torsion (Gamma = {1, gamma}, gamma^2 = 1, Gamma' = 1); it holds for torsion-free Gamma, which CCAction gives. The first sentence U(g^n) = U(g) is proved (Ug_zpow), and Omega_{g^n} = Omega_g holds for every isometry with no class analysis (achronalDomain_zpow)."],"notes":"MARKED (DEC-94, 2026-11-02): Flat/Develop.lean carries **`bdef:omega_gamma`**, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Readings, disclosed: W4 (DEC-91); Omega(S~) is one component under CCAction (omegaS_eq); Rem 8.8's torsion caveat kept as a finding (it holds for torsion-free Gamma, UGamma_eq_of_index). Flat/Develop.lean (WP-32f), no sorry. Omega(S~) is the union of the components of Omega(Gamma) meeting Sigma, one component under CCAction (omegaS_eq). Rem 8.8 (remplacefini, l.2403-2408) partial and Rem 8.9 (nini, l.2411","twin":"","tex":"\\begin{defina}\n\nThe interior of $U(\\Gamma)$ is denoted by $\\Omega(\\Gamma)$ and\ncalled the achronal domain of $\\Gamma$. The connected component\nof the interior of $U(\\Gamma)$ containing $\\widetilde{S}$ is  \ndenoted by $\\Omega(\\widetilde{S})$.\n\\end{defina}"},{"id":"bprop:ghyp","block":"GHFspace.tex:2212","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2420,"deps":[],"decls":["Causal.Flat.bprop_ghyp_of_trichotomy","Causal.Flat.bprop_ghyp","Causal.Flat.IsCausalPiece","Causal.Flat.convex_causallyConvex_connectedComponentIn","Causal.Flat.isCausalPiece_UGamma","Causal.Flat.isCausalPiece_Ug","Causal.Flat.isCausalPiece_compl_nullHyperplanes","Causal.Flat.isCausalPiece_achronalDomain_lox","Causal.Flat.isCausalPiece_achronalDomain_spacelikeElliptic","Causal.Flat.isCausalPiece_achronalDomain_tangent","Causal.Flat.smul_omegaS","Causal.Flat.LorentzTrichotomy"],"ndecls":19,"findings":["W8, l.2430-2431: 'convexity of the connected components of every U(gamma)' is false for U(gamma) = Omega_gamma loxodromic with tau != 0 (Omega_gamma = {xy <= 0}, connected, not convex), and convexity of the components of each U(gamma) does not pass to the interior of an infinite intersection; repaired by a 'piece' property stable under intersection.","The Gamma-invariance of Omega(S~) needs the conjugation invariance of the classes and of J^perp (smul_mem_Ug), not stated in the paper.","Beem-Ehrlich and 'distinguished' are not needed: global hyperbolicity follows from causal convexity."],"notes":"MARKED (DEC-91, 2026-11-02): Flat/Develop.lean (WP-32f) carries **`bprop:ghyp`**. bprop_ghyp and bprop_ghyp_of_trichotomy are sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath. Readings, disclosed: the (CC') reading (DEC-35, CCAction) and W4 as the intended reading (DEC-91: U(Gamma) over gamma != 1, Omega_g over q != 0, the interior of U(g)); the statement is unchanged, and W8 is a finding on the proof, not on the statement. Global hyperbolicity is ETT's (causal + compact diamonds), obtained from causal convexity; the classification ente","twin":"","tex":"\\begin{prop}\n\n$\\Omega(\\widetilde{S})$ is a convex open set. It is\nglobally hyperbolic. The action of $\\Gamma$ on \nit is free and achronal.\n\\end{prop}"},{"id":"bprop:splitting","block":"GHFspace.tex:2212","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2459,"deps":[],"decls":["Causal.Causality.IsCausalFlow.exists_isCauchySplitting","Causal.Causality.IsCausalFlow.exists_isCauchySplitting_of_isChronalFlow","Causal.Causality.IsCausalFlow.nonempty_homeomorph","Causal.Causality.HasChronalCausalFlow.nonempty_isCauchySplitting","Causal.Flat.flat_exists_isCauchySplitting","Causal.Flat.flat_hasChronalCausalFlow","Causal.minkowski_splitting_cauchy_slices","Causal.minkowski_isCauchySurface_flow_image","Causal.Flat.isCauchySurface_liftSet","Causal.Flat.isCauchySurface_preimage","Causal.Flat.inextensible_comp","Causal.Flat.lift_causalCurveIn"],"ndecls":22,"findings":["l.2461-2462: 'every S x {*} is a Cauchy hypersurface' is a property of a well-chosen flow, not of the splitting by any causal flow: on M^n, n >= 2, the chronal causal flow phi_t(s,x) = (s + t(1+|x|), x) splits along {t = 0} and its slice at time 1 is not Cauchy (minkowski_skew_slice_not_isCauchySurface).","The topological splitting needs J^pm(S) closed, which is necessary and sufficient for the flow map to be a homeomorphism (isClosed_iff_exists_isCauchySplitting); the paper's smooth argument hides it."],"notes":"MARKED (DEC-100, 2026-11-02): Flat/SplittingFull.lean carries **`bprop:splitting`**; bprop_splitting_full (for GH M and a Cauchy surface S: Phi : S x R homeomorphic to M with every slice Phi(S x {t}) a Cauchy surface, and p^-1(S) a Cauchy surface of the universal cover), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed (DEC-100): 'every S x {*} is Cauchy' read for a suitable splitting, here the level sets of Geroch's time function (exists_admissible_measure, geroch_i_imp_ii) reparametrising the orbits of the chronal caus","twin":"","tex":"\\begin{prop}\n\n$M$ is homeomorphic to $ S \\times {\\mathbb R}$, \nwhere every $S \\times \\{ \\ast \\}$ are Cauchy hypersurfaces. Any nonspacelike geodesic in $\\widetilde{M}$\nintersect $\\widetilde{S}$. \n\\end{prop}"},{"id":"bprop:danom","block":"GHFspace.tex:2212","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2469,"deps":[],"decls":["Causal.Flat.isCauchySurface_graph_iff","Causal.Flat.exists_mem_graph_hyperboloid_null_iff","Causal.Flat.exists_mem_graph_hyperboloid_null_iff_isFutureTimelike","Causal.Flat.dependenceDomain_hyperboloid","Causal.Flat.not_isCauchySurface_graph_hyperboloid_of_criterion","Causal.Flat.bprop_danom","Causal.Flat.injective_of_developsCC","Causal.Flat.causalCurveIn_of_lift"],"ndecls":8,"findings":["Prop 8.12 needs Hausdorff: without [T2Space M] it is false in every dimension (two copies of M^n glued along {t < 0}, S = {t = -1}, D the fold, rho = 1); T2 is implicit in 'manifold' and is carried (DEC-90).","W7, l.2489-2491: 'every nonspacelike line of M meets D(S~ x {t})' is false as written: for a strictly contracting entire graph it says the slice is a Cauchy surface of M^n, and the hyperboloid (Rem 2.2) is a counterexample (dependenceDomain_hyperboloid); repaired without slices (D(M~) in D(Sigma) in U(Gamma))."],"notes":"MARKED (DEC-90, 2026-11-02): Flat/Develop.lean (WP-32f) carries **`bprop:danom`**. bprop_danom and injective_of_developsCC are sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath (injectivity of D: injective_of_developsCC); the null-line Cauchy criterion and the hyperboloid counterexample in Flat/LipschitzGraph.lean (WP-32d). ✓ carried: [T2Space M], implicit in 'manifold' (DEC-90), the non-Hausdorff fold counterexample kept as a finding; ⚠ reading: the (CC') reading (DEC-35); GH weakened to IsCausal (W10). The design's step 4 (Gamma free a","twin":"","tex":"\\begin{prop}\n\nThe developing map ${\\mathcal D}: \\widetilde{M} \\rightarrow {\\bf M}^{n}$ is injective, with image contained in $\\Omega(\\widetilde{S})$.\n\\end{prop}"},{"id":"bprop:sanloxo","block":"GHFspace.tex:2567","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2572,"deps":[],"decls":["Causal.Flat.BenoistNoLox","Causal.Flat.FixesTimelikeOrNull","Causal.Flat.benoistNoLox_zero","Causal.Flat.not_benoist_conclusion_stdBoost","Causal.Flat.not_fixesTimelikeOrNull_of_isLoxodromic","Causal.Flat.minkQ_pos_of_fixed_pow_loxodromic","Causal.Flat.exists_finiteIndex_fixes_of_noLox","Causal.Flat.bprop_sanloxo","Causal.Flat.exists_timelike_fixed_of_elliptic_of_null","Causal.Flat.TitsVirtuallyAbelianNull","Causal.Flat.titsVirtuallyAbelianNull_zero","Causal.Flat.exists_timelike_fixed_of_comm_elliptic"],"ndecls":38,"findings":["Prop 9.1 gap (Tits), l.2621-2622: 'up to finite index, L(Gamma) preserves an isotropic vector v_0 and Gamma contains a parabolic element gamma_1' does not follow from Prop 9.1: its proof (l.2585-2594) produces a parabolic element of the Zariski closure G_0, not of Gamma, and leaves a branch Section 9 never treats (L(Gamma') fixing v_0, all elliptic).","That branch needs Gamma discrete: without discreteness it is false for n >= 6 (a free unit-quaternion pair on P_0-bar = R^4: all elliptic, fixes v_0, no finite-index subgroup fixes a timelike vector; documented, not formalized). With discreteness it needs an argument absent from the paper (L(Gamma) virtually abelian); it is proved (TitsVirtuallyAbelianNull, DEC-50), elementarily, without Tits' alternative.","An 'elliptic analogue of Benoist' (all elliptic in Gamma => all elliptic in the Zariski closure) is false, so the step 'G_0 admits only elliptic elements, therefore compact' (l.2596-2597) never fires on that branch; the Barbot-cited route goes through Thm 5.1 (bthm:ausl) and Gamma's discreteness.","l.2575-2577, l.2593-2594, l.2621: 'stabilizes an isotropic vector', 'stabilizes a lightlike direction' and 'preserves an isotropic vector v_0' agree only because an element of SO_0 scaling a null vector by lambda != 1 is loxodromic, which the paper never states.","[9.E] l.2609-2610: only freeness of Gamma on M^n is stated; the quotient needs properness (proved for subgroups whose linear parts fix a timelike vector). l.588-590: 'translations by spacelike translation vectors' is not 'translations whose span is spacelike' (in M^4, e_1 and e_0 + e_2 + sqrt2 e_1: spacelike_translations_null_span).","[9.P] l.2659: for a linear gamma in A(v_0), U(gamma) is the preimage of the complement of a point (u + y v != 0), not of 'a half-line'."],"notes":"MARKED (DEC-97, 2026-11-02): Flat/Nonloxodromic.lean carries **`bprop:sanloxo`**; bprop_sanloxo, sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]), from the named external BenoistNoLox (DEC-36). Disclosed (DEC-97): the conclusion read as 'fixes a nonzero null vector'; 'Gamma discrete', a standing hypothesis of the holonomy setting, enters only the timelike refinement of the all-elliptic branch (exists_timelike_fixed_of_elliptic_of_null, through titsVirtuallyAbelianNull), not bprop_sanloxo itself, which carries no discreteness hypoth","twin":"","tex":"\\begin{prop}\n\nIf $\\Gamma$ does not contain loxodromic elements, it is elementary;\ni.e., up to finite index, its linear part is either contained in $SO(n-1)$ (up to conjugacy),\nor its linear part stabilizes an isotropic vector.\n\\end{prop}"},{"id":"bprop:limites","block":"GHFspace.tex:2567","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2940,"deps":[],"decls":["Causal.Flat.bprop_limites","Causal.Flat.bprop_limites_model","Causal.Flat.limites_of_leading","Causal.Flat.leading_nonneg_of_achronal","Causal.Flat.NolParam.nolQ_powA_sub","Causal.Flat.nonneg_on_span_of_addSubgroup","Causal.Flat.bprop_limites_general","Causal.Flat.bprop_limites_general_of_ccPrime","Causal.Flat.bprop_limites_bounded_model","Causal.Flat.bprop_limites_general_model","Causal.Flat.bprop_limites_of_isAchronal","Causal.Flat.bprop_limites_general_model_hypotheses"],"ndecls":17,"findings":["l.2982-2987: 'since u(Gamma) is a lattice of E' needs only that u(Gamma) is an additive group spanning E (a continuous quadratic form nonnegative on a subgroup is nonnegative on its real span).","Rem 9.2 (l.2737-2760): the changes of v_n are not changes of null frame (|v_n + w|^2 = |w|^2, |v_n + a v_0|^2 = 2a); the correct change is v_n' = v_n + w - (|w|^2/2) v_0; the first bullet (w in Delta_0) is not a frame change at all.","[9.b] l.2776-2787 uses Lemma 7.1 (false as printed for n >= 4) and Cor 8.3; neither is needed for a purely unipotent gamma_1 (b_trivial_model); for gamma_1 = R U with R != id the analogue is not written.","Rem 9.4 (l.2958-2962) has a consequence the paper does not draw: when every element of Gamma is a nonlinear unipotent isometry, M(S) = Gamma\\M^n embeds in no unipotent spacetime (M^4, Gamma = <phi(e_1 + e_2)> on {y > -1}).","l.2935-2936, l.2944: the normalisation 'reducing as above to y_- = -y_+' changes E and T, not only y: E becomes (1 + cT)E and T becomes T' with T'(u + cTu) = Tu (c = (y_- + y_+)/2); it needs 1 + cT injective on E, true (a kernel vector would make the leading term (y-c)(y'-c)|Tu|^2 negative for y < c < y') but unstated (Flat/LimitesGeneral.lean).","l.2941-2946: in the original coordinates the inequality reads |((y_+ - y_-)/2) T u| <= |u + ((y_- + y_+)/2) T u|; the printed |y_+ T(u)| <= |u| holds for T' in the reduced coordinates only.","l.2941-2946: 'positive' is 'nonnegative', and S~ achronal suffices (acausal not needed)."],"notes":"MARKED (DEC-103, 2026-11-02): Flat/LimitesGeneral.lean carries **`bprop:limites`**, covered by bprop_limites_of_isAchronal (the three cases, 'at least one extremity is finite') and bprop_limites_general (any real y_- < y_+), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed (DEC-103): the fixed null frame nolToMink (as the marked bprop:extension); S~ need only be achronal; pi_1(S~) contains ]y_-, y_+[. Flat/Nonloxodromic.lean (WP-34c) and Flat/LimitesGeneral.lean (2026-11-02), strict, sorry-free (#print axioms against imp","twin":"","tex":"\\begin{prop}\n\nAt least one of the extremities $y_{\\pm}$ is finite. If they are both finite then,\nreducing as above to the case $y_{-} = -y_{+}$, for every $u$ in $E$ we have:\n\n\\[ \\mid y_{+}T(u) \\mid \\leq \\mid u \\mid \\]\n\nIf $y_{+} = +\\infty$, then for every $u$ in $E$:\n\n\\[   \\langle u \\mid T(u) \\rangle \\geq -y_{-}\\mid T(u) \\mid^{2} \\]\n\nIf $y_{-} = -\\infty$, then for every $u$ in $E$:\n\n\\[   \\langle u \\mid T(u) \\rangle \\leq -y_{+}\\mid T(u) \\mid^{2} \\]\n\\end{prop}"},{"id":"bprop:extension","block":"GHFspace.tex:2567","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2992,"deps":[],"decls":["Causal.Flat.bprop_extension","Causal.Flat.bprop_extension_bounded","Causal.Flat.bprop_extension_top","Causal.Flat.bprop_extension_bot","Causal.Flat.exists_symm_extension_of_coercive","Causal.Flat.LimitesIneq","Causal.Flat.IsSymmOn"],"ndecls":7,"findings":["Barbot's proof (compactness of the symmetric maps of norm <= 1, l.3040-3099) can be replaced by one explicit extension T^(e + w) = T e for w orthogonal to T(E), symmetric and satisfying the same inequality.","[9.A] l.3126: the conclusion is about M (D(M~) in Omega in Omega(S~), Omega != Omega(S~) in general), not about M(S) = Gamma\\Omega(S~), which by Rem 9.4 need not embed in any unipotent spacetime."],"notes":"Flat/Nonloxodromic.lean (WP-34c), no sorry; hypotheses carried or weakened (any finite-dimensional real inner product space).","twin":"","tex":"\\begin{prop}\n\nThe map $T: E \\rightarrow \\overline{P}_{0}$ can be extended to a linear map\n$\\widehat{T}: \\overline{P}_{0} \\rightarrow \\overline{P}_{0}$ satisfying the same properties, i.e.:\n\n\\begin{itemize}\n\n\\item $\\overline{T}$ is symetric:\n\\[ \\langle u \\mid T(u') \\rangle = \\langle u' \\mid T(u) \\rangle \\] \n\n\\item If $y_{-} = -y_{+}$:\n\n\\[ \\mid y_{+}\\widehat{T}(u) \\mid \\leq \\mid u \\mid \\]\n\n\\item If $y_{+} = +\\infty$:\n\n\\[   \\langle u \\mid \\widehat{T}(u) \\rangle \\geq -y_{-}\\mid \\widehat{T}(u) \\mid^{2} \\]\n\n\\item If $y_{-} = -\\infty$:\n\n\\[   \\langle u \\mid \\widehat{T}(u) \\rangle \\leq -y_{+}\\mid \\widehat{T}(u) \\mid^{2} \\]\n\\end{itemize}\n\\end{prop}"},{"id":"blem:sanlox","block":"GHFspace.tex:3133","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":3140,"deps":[],"decls":["Causal.Flat.UGammaLox","Causal.Flat.omegaLox","Causal.Flat.omegaGamma_subset_omegaLox","Causal.Flat.subset_UGamma_of_oneSided","Causal.Flat.subset_compl_nullHyperplanes_of_oneSided","Causal.Flat.omegaPlus_limitSetJ_subset_omegaGamma","Causal.Flat.omegaMinus_limitSetJ_subset_omegaGamma","Causal.Flat.blem_sanlox","Causal.Flat.IsRepulsiveFixedJ.pair","Causal.Flat.exists_lt_minkB_pow_smul","Causal.Flat.exists_minkQ_neg_of_sign","Causal.Flat.not_minkQ_neg_of_mem_UGammaLox"],"ndecls":13,"findings":["l.3136 and l.3157: Omega_lox(Gamma) is called 'the convex domain' but is not convex (for Gamma = <gamma> it is U^+(gamma) union U^-(gamma)); the proof l.3157-3165 is valid on each convex piece. The printed statement l.3143-3144 is nevertheless true, by an argument the paper does not give (not_mem_quadrantPlus_quadrantMinus).","l.3159-3163: 'the convex hull of the gamma_0-orbit of x is a complete lightlike line' is replaced by an exact growth argument; a point of P(gamma_0) in ker p has a bounded orbit, so x must first be moved off ker p."],"notes":"MARKED (DEC-83, 2026-11-02): Flat/Loxodromic.lean (WP-34d) carries **`blem:sanlox`**. blem_sanlox is sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath it. ⚠ reading, disclosed: Section 8's standing hypotheses as CCAction (DEC-35); no external. Rem 8.9 is derived from CCAction through Develop's nini.","twin":"","tex":"\\begin{lema}\n\nIf $\\Gamma$ contains loxodromic elements, \n$\\Omega_{lox}(\\Gamma) = \\Omega(\\Gamma)$.\n\\end{lema}"},{"id":"blem:loxregular","block":"GHFspace.tex:3133","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":3169,"deps":[],"decls":["Causal.Flat.blem_loxregular","Causal.Flat.loxregular_sign","Causal.Flat.omegaS_subset_quadrant","Causal.Flat.exists_line_avoiding","Causal.Flat.omegaS_eq_interior","Causal.Flat.interior_achronalDomain_eq_quadrants","Causal.Flat.cosmoRegular_limitSetJ"],"ndecls":7,"findings":["l.3191-3193: 'the reader can easily check that there is always a timelike line avoiding U^+(gamma_0) cap U^-(gamma_1)' is filled (exists_line_avoiding: one of the repulsive points of gamma_0, gamma_0^-1 has a direction distinct from gamma_1's)."],"notes":"MARKED (DEC-83, 2026-11-02): Flat/Loxodromic.lean (WP-34d) carries **`blem:loxregular`**. blem_loxregular is sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath it. ⚠ reading, disclosed: Section 8's standing hypotheses as CCAction (DEC-35); no external. Both time orientations kept (Omega^+ future regular or Omega^- past regular); Lemma 4.9 used without its hypothesis.","twin":"","tex":"\\begin{lema}\n\n$\\Omega(\\widetilde{S})$ is a regular convex domain.\n\\end{lema}"},{"id":"bcor:loxo_proper","block":"GHFspace.tex:3133","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":3213,"deps":[],"decls":["Causal.Flat.Lox.bcor_loxo_proper_both","Causal.Flat.Lox.bcor_loxo_proper_past","Causal.Flat.Lox.preimage_negConj_omegaPlus","Causal.Flat.Lox.invariant_limitOpensMinus","Causal.Flat.Lox.actsAcausally_limitOpensMinus","Causal.Flat.Lox.gh_of_isQuotientOf_limitOpensMinus_of_lox","Causal.Flat.bcor_loxo_proper","Causal.Flat.Lox.isCauchyComplete_flatQuotient_cosmo","Causal.Flat.completeSpace_inducedLength_cosmoLevel","Causal.Flat.loxo_free","Causal.Flat.loxo_properlyDiscontinuous","Causal.Flat.loxo_cauchyComplete"],"ndecls":20,"findings":["l.3222-3224: Cor 10.3's proper discontinuity needs neither bprop:agissons nor the Riemannian geometry of S_t: the Gauss map of the cosmological time is L(Gamma)-equivariant and bounded on compact sets.","[10.M] l.3326-3330: 'M(S) = Gamma\\Omega(S~) is a linear twisted product over a Misner spacetime' is false for Gamma itself and holds up to finite index (M^4: Gamma = <gamma_0, sigma> with sigma gamma_0 sigma^-1 = gamma_0^-1 is elementary while Gamma_U is non-abelian)."],"notes":"MARKED (DEC-89, 2026-11-02): Flat/Loxodromic.lean (WP-34d) and Flat/Lox/PastProper.lean carry **`bcor:loxo_proper`**, after the past case was formalized as DEC-89 required. Strict, sorry-free (#print axioms of bcor_loxo_proper_both, bcor_loxo_proper_past, bcor_loxo_proper, loxo_cauchyComplete and the four PastProper helpers: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath. ⚠ reading, disclosed: Section 8's standing hypotheses as CCAction (DEC-83/DEC-35), Cauchy-complete in DEC-35's reading. Both time orientations: bcor_loxo_proper (future, Omega(S~) = Omega^+), ","twin":"","tex":"\\begin{cora}\n\nThe action of $\\Gamma$ on $\\Omega(\\widetilde{S})$ is\nfree and properly discontinuous, and the\nquotient space $M(S) = \\Gamma \\backslash \\Omega(\\widetilde{S})$\nis a Cauchy-complete globally hyperbolic spacetime.\n\\end{cora}"},{"id":"bprop:U_timelike","block":"GHFspace.tex:3133","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":3346,"deps":[],"decls":["Causal.Flat.AbelianPairAsPrinted","Causal.Flat.not_abelianPairAsPrinted","Causal.Flat.unipotent_null_eigen_unique","Causal.Flat.fixed_null_of_commute_unipotent","Causal.Flat.eigen_of_commute","Causal.Flat.lorentzSphere_fixed_of_commute","Causal.Flat.bprop_U_timelike","Causal.Flat.not_isNonelementary_of_lightlike","Causal.Flat.exists_nullVec_eq_smul","Causal.Flat.IsMaxUnipotent.mem_direction_of_linFixed","Causal.Flat.Lox.exists_finiteIndex_fix_of_nilpotent_normal","Causal.Flat.Lox.exists_fixed_timelike_of_commuteOn"],"ndecls":13,"findings":["Prop 10.4's proof (l.3356-3359): 'an abelian subgroup of SO_0(1,n-1) fixes a pair of isotropic directions, except if it consists only of elliptic elements' is false for n >= 3 (the cyclic group of a null rotation fixes exactly one point: not_abelianPairAsPrinted); the proof survives through one invariant isotropic direction.","Its spacelike case (l.3355-3356) rests on Cor 8.4, false as printed (bcor:abel); the true route is through the fixed space of L(Gamma_nd), which lies in U's direction (IsMaxUnipotent.mem_direction_of_linFixed)."],"notes":"MARKED (DEC-83, 2026-11-02): Flat/Loxodromic.lean (WP-34d) carries **`bprop:U_timelike`**. bprop_U_timelike is sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath it. ⚠ strengthened, disclosed: the named externals AuslanderCarriereDalbo d (bthm:ausl) and MaxUnipotentSubspace d (bthm:unip), DEC-36, cited by the paper and not proved by design; ⚠ reading: Section 8's standing hypotheses as CCAction, carried but unused (⚠ weakened). Lightlike case: not_isNonelementary_of_lightlike. Spacelike case (formerly the one sorry): the fixed space of L(","twin":"","tex":"\\begin{prop}\n\n${\\bf U}$ is timelike.\n\\end{prop}"},{"id":"bprop:LU_discrete","block":"GHFspace.tex:3133","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":3367,"deps":[],"decls":["Causal.Flat.bprop_LU_discrete","Causal.Flat.discreteTopology_restrictGroup_of_nonDiscretePart_bot","Causal.Flat.Lox.exists_normal_central_nonElliptic_restrict"],"ndecls":3,"findings":["[10.G] l.3409: 'the translation vectors form a lattice in some spacelike linear space E' does not follow from the vectors being spacelike (Z(0,0,1) + Z(1,1,sqrt2) in M^3 spans a degenerate plane); it holds because Omega(S~) is E-invariant and Lambda(Gamma) has two distinct null directions (span_kerTranslations_spacelike)."],"notes":"MARKED (DEC-83, 2026-11-02): Flat/Loxodromic.lean (WP-34d) carries **`bprop:LU_discrete`**. bprop_LU_discrete is sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02), no sorry beneath it. ⚠ strengthened, disclosed: the named external AuslanderCarriereDalbo d (bthm:ausl, DEC-36, not proved by design), which the proof uses; MaxUnipotentSubspace d (bthm:unip) and CCAction are carried and unused (finding, in the proof). ⚠ reading, disclosed: U read as an AffineMinkEmbedding satisfying RestrictsIn (TwistedProduct's form). The branch L_U(Gamma_nd) = {1} by discret","twin":"","tex":"\\begin{prop}\n\n$L_{U}(\\Gamma)$ is discrete.\n\\end{prop}"},{"id":"bthm:cmc","block":"GHFspace.tex:3681","kind":"theorem","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":3702,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{thma}\n\nEvery (flat) maximal Cauchy-compact GH spacetime admits \na unique CMC foliation. It admits a CMC time function\nif and only if it is finitely covered by a Misner\nspacetime, or the twisted\nproduct of a standart spacetime by a flat torus;\nthe CMC time function then takes value in $]-\\infty, 0[$\n(future complete case) or $]0, +\\infty[$ (past complete case). \nCauchy-compact translations spacetimes \ndo not admit CMC time functions, and any CMC spacelike\nclosed hypersurface is a leaf of the unique CMC foliation.\n\\end{thma}"}],"closed":39,"target":39,"macros":{"ncmd":"\\newcommand"}},"gx":{"blocks":[{"id":"RamcovGX.tex:339","title":"Singular (G,X)-manifolds (I): bases and examples"},{"id":"RamcovGX.tex:339:360","title":"Singular (G,X)-manifolds (I): bases and examples › Topological preliminaries"},{"id":"RamcovGX.tex:339:397","title":"Singular (G,X)-manifolds (I): bases and examples › Almost everywhere (G,X)-atlases"},{"id":"RamcovGX.tex:339:469","title":"Singular (G,X)-manifolds (I): bases and examples › Category of Singular (G,X)-manifolds"},{"id":"RamcovGX.tex:339:612","title":"Singular (G,X)-manifolds (I): bases and examples › Common construction of  singular (G,X)-manifolds"},{"id":"RamcovGX.tex:813:822","title":"Branched Covering à la  Fox : spreads, paths and Galois › Preliminaries on spreads"},{"id":"RamcovGX.tex:813:955","title":"Branched Covering à la  Fox : spreads, paths and Galois › Primer on Branched covering"},{"id":"RamcovGX.tex:813:1189","title":"Branched Covering à la  Fox : spreads, paths and Galois › Paths and maximal branched covering"},{"id":"RamcovGX.tex:813:1417","title":"Branched Covering à la  Fox : spreads, paths and Galois › Galoisian branched covering"},{"id":"RamcovGX.tex:1610","title":"Singular (G,X)-manifolds (II) : tame and wild"},{"id":"RamcovGX.tex:1610:1670","title":"Singular (G,X)-manifolds (II) : tame and wild › Ramified coverings, group actions"},{"id":"RamcovGX.tex:1610:1706","title":"Singular (G,X)-manifolds (II) : tame and wild › Developing map and tameness"},{"id":"RamcovGX.tex:1610:1889","title":"Singular (G,X)-manifolds (II) : tame and wild › Singular models"},{"id":"RamcovGX.tex:2163","title":"An application : uniformization of BTZ-manifolds"},{"id":"RamcovGX.tex:100000000","title":"After \\end{document} (drafts, terminal)"}],"nodes":[{"id":"ex:conical","block":"RamcovGX.tex:339","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":347,"deps":[],"decls":["GX.conicalDev","GX.conicalDev_smul","GX.isLocalHomeomorphOn_conicalDev","GX.conicalAtlas","GX.conical","GX.conical_circle","GX.exists_smul_eq_on_of_isLocalHomeomorphOn","GX.Cone","GX.ConePoint","GX.coneE","GX.angDist","GX.Cone.isGeodesic"],"ndecls":48,"findings":["l.347, printed slip (DEC-47 reads angle α): with θ ∈ R/Z the metric dz²+dr²+α r² dθ² has cone angle √α (a circle r = r0 has length √α·r0), not α. Lean witness: read as the cone C_{√α}, its apex is Euclidean iff α = 4π² and NOT Euclidean at the paper's α = 2π (GX.conical_printed_metric, GX.conical_printed_metric_two_pi), against 'cannot be extended … except for α = 2π'. The rest of the example (holonomy = rotation of angle α) and ex:consider_identifying need angle α, i.e. α² r² dθ² on R/Z (or r² dθ² on R/αZ). The corrected object is built: E^n_α = C_α × R^{n-2} (GX.ConicalSpace, ℓ²), C_α ported from lean-causal, proper and geodesic, C_2π ≅ ℂ, apex not Euclidean for α ≠ 2π; its metric topology is the quotient topology of Γ_1\\(D_inf × R^{n-2}) (GX.conicalMetricHomeo) and it is Euclidean along the developing map on {r>0} (GX.conical_locally_euclidean_prod).","l.350–351: the holonomy is offered by the paper only as 'an obstruction', and it is one only for α ∉ 2πN*: for α ∈ 2πN*, α ≠ 2π, the holonomy is trivial and does not obstruct, so the argument as written does not cover those angles. The claim itself is true there as well (the developing map is k-to-1 around the axis, so no chart covers it): GX.conical proves support = univ ↔ α = 2π, and the whole axis singular for α ≠ 2π. The metric side agrees: Cone.apex_not_euclidean for every α ≠ 2π (GX.conical_metric)."],"notes":"WP-47a, audited clean. Readings/questions: Informational (no change of status): the Riemannian metric dz²+dr²+α r²dθ² is represented by the distance of the flat cone C_α × R^{n-2} (ℓ²; lean-causal kb/0021), not by mathlib's IsRiemannianManifold; 'locally Euclidean on {r>0}' is proved as a local isometry with the Euclidean distance through the developing map (GX.conical_locally_euclidean_prod).","twin":"","tex":"\\begin{ex} Let $\\alpha>0$ and $n\\geq 2$, define $\\mathbb E_\\alpha^n = \\RR^{n-2}\\times \\RR^2$ endowed with cylindrical coordinates $(z,r,\\theta) \\in \\RR^{n-2}\\times \\RR_+\\times \\RR/\\ZZ$ and the Riemannian metric $\\mathbf{g} = \\d z^2+\\d r^2 + \\alpha r^2\\d \\theta^2$. \nThis Riemannian metric is well defined and locally Euclidean on the complement of the domain $\\{r=0\\}$. \nOne can thus endow the domain $\\{r>0\\}$ with a $(\\mathbb E^n,\\RR^n \\rtimes \\SO(n))$-structure. However, this geometrical structure cannot be extended to the whole $\\RR^n$ except for $\\alpha=2\\pi$. An obstruction is given by the holonomy $\\rho:\\pi_1(\\{r>0\\})=\\ZZ \\rightarrow \\RR^n\\rtimes \\SO(n)$, indeed $\\rho(1)$ is the rotation of angle $\\alpha$ which is non trivial  when $\\alpha\\notin  2\\pi\\N^*$.\n\\end{ex}"},{"id":"def:portly_skeletal_subset","block":"RamcovGX.tex:339:360","kind":"definition","num":"","title":"Portly/skeletal subset","bucket":"A","lean":"closed","nl":"definition","line":364,"deps":[],"decls":["GX.IsLocallyConnectedIn","GX.IsPortly","GX.IsSkeletal","GX.isLocallyConnectedIn_iff_isConnected"],"ndecls":4,"findings":[],"notes":"WP-24a, audited clean. Readings/questions: l.362 'W ∩ U is connected': read with IsPreconnected (empty set allowed). For open dense U it is equivalent to the IsConnected reading (GX.isLocallyConnectedIn_iff_isConnected), so IsPortly is unaffected; the reading only matters for 'locally connected in X' applied to non-dense sets.","twin":"","tex":"\\begin{defi}[Portly/skeletal subset] Let $X$ be a Hausdorff locally connected topological space, a subset $\\U$ of $X$ is portly (in $X$) if $\\U$ is open dense and locally connected in $X$. A subset $S\\subset X$ is skeletal if its complement in $X$ is portly.\n\\end{defi}"},{"id":"ex:following_example_skeletal_itemize","block":"RamcovGX.tex:339:360","kind":"example","num":"","title":"","bucket":"C","lean":"partial","nl":"open","line":367,"deps":[],"decls":["GX.isSkeletal_of_finite_surface","GX.isSkeletal_of_tameKnot","GX.bowtie_counterexample","GX.isSkeletal_skeletonSpace","GX.isSkeletal_skeletonSpace_codim_two","GX.isSkeletal_of_isTotallyDisconnected","GX.isPreconnected_compl_of_isTotallyDisconnected"],"ndecls":7,"findings":["Item 3 (l.372) is false as written: the bow-tie (two triangles sharing a vertex) is a pure 2-complex whose 0-skeleton is not skeletal (GX.bowtie_counterexample, pre-existing). With local strong connectivity in codimension >= 2 added, the corrected statement is now proved in full (no sorry)."],"notes":"WP-26g, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: Item 2 read as a closed locally flat subset (pre-existing reading, unchanged by this package).","twin":"","tex":"\\begin{ex} The following example of $S$ are skeletal in $X$.\n\\begin{itemize}\n \\item $S$ finite  and $X$ a surface;\n \\item $S$ a tame knot  in a $3$-manifold $X$;\n \\item $S$ the $k$-skeleton of a pure $n$-dimensional simplicial complex $X$ with $k\\leq n-2$;\n \\item $S$ a Cantor wildly embedded into a $n$-manifold $X$.\n\\end{itemize} \n \\end{ex}"},{"id":"def:almost_everywhere_atlas_topological","block":"RamcovGX.tex:339:397","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":402,"deps":[],"decls":["GX.IsAEAtlas","GX.isAEAtlas_iff_exists_isPortly","GX.IsSubchart","GX.completion","GX.IsComplete","GX.IsThinner","GX.AELe","GX.isComplete_completion"],"ndecls":8,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{defi} An almost everywhere $(G,X)$-atlas on a topological space $M$ is a $(G,X)$-atlas supported by some portly subset of $M$. \n\\end{defi}"},{"id":"lem:GX_atlas_union","block":"RamcovGX.tex:339:397","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":412,"deps":[],"decls":["GX.isAEAtlas_iUnion","GX.not_isAEAtlas_iUnion_empty"],"ndecls":2,"findings":["l.412-418: for an empty family the union is the empty atlas, not an a.e. atlas on a nonempty space (GX.not_isAEAtlas_iUnion_empty); the statement needs K nonempty, the reading DEC-46 (a) accepts."],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{lem} \n        Let $N$ be a locally connected topological space.\n        Let $(\\B_k)_{k\\in K}$ be a family of a.e.$(G,X)$-atlases on $N$. Assume for  all $(k,k')\\in K^2$, there exists an a.e $(G,X)$-atlas $\\mathcal A$ such that $\\A$ is thinner than both $\\B_{k}$ and $\\B_{k'}$.\n\n            Then the union $\\bigcup_{k\\in K} \\B_k$ is an a.e.$(G,X)$-atlas.\n    \\end{lem}"},{"id":"cor:maximal_atlas","block":"RamcovGX.tex:339:397","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":458,"deps":["lem:GX_atlas_union"],"decls":["GX.maximal_atlas","GX.maximalAEAtlas","GX.IsAEAtlas.maximalAEAtlas","GX.maximalAEAtlas_eq_of_aeLe","GX.IsMaximalAEAtlas","GX.isMaximalAEAtlas_iff"],"ndecls":6,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{cor} \n\t\t\t\t\tLet $M$ be a locally connected Hausdorff topological space. \n\t\t\t\t\tConsider the set $\\mathcal E$ of  a.e $(G,X)$-atlas $\\mathcal A$ on $M$ ordered by $\\A\\leq \\B$ if the completion of $\\A$ is thinner than $\\B$.\n\t\t\t\t\t\n\t\t\t\t\tThen, for every $\\mathcal A \\in \\mathcal E$ the maximum $$ \\max\\,(\\B ~:~ \\A\\leq \\B \\in \\mathcal E\\})$$\n\t\t\t\t\tis well defined.\n\t\t\t\t\t\\end{cor}"},{"id":"def:structure_topological_space_atlas","block":"RamcovGX.tex:339:469","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":471,"deps":[],"decls":["GX.IsAEStructure"],"ndecls":1,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{defi} An a.e. $(G,X)$-structure on a topological space $M$ is an a.e. $(G,X)$-atlas on $M$.                     \n                    \\end{defi}"},{"id":"def:singular_manifold_locally_connected","block":"RamcovGX.tex:339:469","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":474,"deps":["cor:maximal_atlas"],"decls":["GX.SingularGXStructure","GX.aeAtlas","GX.isMaximalAEAtlas_aeAtlas","GX.Reg","GX.Sing","GX.isPortly_reg","GX.isOpen_reg","GX.isSkeletal_sing","GX.isClosed_sing","GX.SingGXCat","GX.isMaximalAEAtlas_maximalAtlas"],"ndecls":11,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{defi} A singular $(G,X)$-manifold is a locally connected Hausdorff second countable topological space $M$ endowed with an a.e. $(G,X)$-structure maximal in the sense of Corollary \\ref{cor:maximal_atlas}.\n\t\t\t\t\t\n\t\t\t\t\tThe support of its a.e. $(G,X)$-atlas is called its regular locus denoted $\\reg(M)$ and the complement of $\\reg(M)$ is called the singular locus denoted $\\sing(M)$.\n\t\t\t\t\t\\end{defi}"},{"id":"def:morphism","block":"RamcovGX.tex:339:469","kind":"definition","num":"","title":"a.e.(G,X)-morphism","bucket":"A","lean":"closed","nl":"definition","line":480,"deps":[],"decls":["GX.IsAEMorphismOf","GX.IsAEMorphism","GX.IsRegularOn","GX.isAEMorphismOf_iff"],"ndecls":4,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{defi}[a.e.$(G,X)$-morphism] Let\n\t\t\t\t\t$M$ and $N$ be two singular $(G,X)$-manifolds.\n\n\t\t\t\t\tAn a.e.morphism $\\phi:M\\rightarrow N$ is a continuous map such that there exists portly subsets $\\U\\subset \\reg(M)$ and $\\V\\subset \\reg(N)$ such that\n\t\t\t\t\t$\\phi_{|\\U}^{|\\V}:\\U\\rightarrow \\V$ is a $(G,X)$-morphism.\n\t\t\t\t\t\\end{defi}"},{"id":"rem:composition_morphisms_morphisms_category","block":"RamcovGX.tex:339:469","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":487,"deps":[],"decls":["GX.IsAEMorphismOf.comp","GX.IsAEMorphism.comp","GX.isAEMorphismOf_id","GX.isAEMorphism_id","GX.SingGXCat"],"ndecls":5,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{rem} Composition of a.e. $(G,X)$-morphisms is an a.e. $(G,X)$-morphisms. The category $\\CatSingGX$ of singular $(G,X)$-manifold which morphisms are a.e $(G,X)$-morphisms is then well defined. \n\t\t\t\t\tIsomorphisms of singular $(G,X)$-manifolds are then maps that are both  homeomorphism and a.e. $(G,X)$-morphism.\n\t\t\t\t\t\\end{rem}"},{"id":"rem:morphisms_analytical_two_equal","block":"RamcovGX.tex:339:469","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":491,"deps":[],"decls":["GX.analytic_counterexample_empty","GX.analytic_counterexample_disconnected"],"ndecls":2,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{rem} A.e. $(G,X)$-morphisms are analytical: if two are equal on an open set, they are equal everywhere.\n                     \n                    \\end{rem}"},{"id":"prop:GX_sing_morph_local","block":"RamcovGX.tex:339:469","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":497,"deps":[],"decls":["GX.isAEMorphismOf_tfae","GX.isAEMorphism_tfae","GX.IsAEMorphismOn"],"ndecls":3,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{rem}\n\t\t\t\t\tLet $M\\rightarrow N$ be a continuous map between singular $(G,X)$-manifolds.\n\t\t\t\t\tThe following properties are equivalent.\n\t\t\t\t\t\\begin{enumerate}[(i)]\n\t\t\t\t\t \\item $f$ is an a.e. $(G,X)$-morphism;\n\t\t\t\t\t \\item $f$ is locally an a.e. $(G,X)$-morphism ;\n\t\t\t\t\t \\item $f_{|\\U}$ is an a.e. $(G,X)$-morphisms for some portly set $\\U\\subset M$.\n\t\t\t\t\t\\end{enumerate}\n\t\t\t\t\t\\end{rem}"},{"id":"lem:singular_manifolds_morphism_set","block":"RamcovGX.tex:339:469","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":507,"deps":[],"decls":["GX.isGreatest_regLocusOf","GX.isGreatest_regLocus","GX.isRegularOn_regLocusOf"],"ndecls":3,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{lem} \n                   Let $M$ and $N$ be singular $(G,X)$-manifolds and let $f:M\\rightarrow N$ an be a.e $(G,X)$-morphism. \n                   The set $\\mathcal E$ of open subset $\\U$ such that $\\U\\subset \\reg(M)$ and $f$ induces a $(G,X)$-morphism $\\U\\rightarrow \\reg(N)$.   \n                   \n                   Ordered by the inclusion, $\\mathcal E$ has a maximum.\n                    \n                \\end{lem}"},{"id":"def:singular_manifolds_morphism_maximal","block":"RamcovGX.tex:339:469","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":518,"deps":[],"decls":["GX.regLocusOf","GX.regLocus"],"ndecls":2,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{defi} Let $M$ and $N$ be singular $(G,X)$-manifolds and let $f:M\\rightarrow N$ an a.e $(G,X)$-morphism.\n                The maximal open subset of $M$ on which $f$ induces a $(G,X)$-morphism is the regular locus of $f$ which we denote by $\
