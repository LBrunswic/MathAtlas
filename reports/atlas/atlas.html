<style>

  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d;

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.005em;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.86rem;min-width:0;flex:1}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);padding:2px 4px;border-radius:4px;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover,.crumbs button:focus-visible{background:var(--accent-soft);outline:none}
.crumbs .here{color:var(--ink);font-weight:600;cursor:default}
.crumbs .sep{color:var(--ink-3)}
.roadbtn{font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.roadbtn[aria-pressed="true"],.roadbtn:hover{background:var(--accent);color:var(--card)}
.roadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tgt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--canvas)}
.tgt b{font-weight:600;line-height:1.35}
.tgt .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.74rem;color:var(--ink-3)}
.tgt .q{font-size:.82rem;color:var(--ink-2);line-height:1.45}
.tgt button.go{all:unset;cursor:pointer;color:var(--accent);font-size:.78rem}
.chip.s-ready{border-color:var(--accent);color:var(--accent)}
.chip.s-active{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip.s-needs-ruling{border-color:var(--partial);color:var(--partial);font-weight:600}
.chip.s-blocked{border-style:dashed}
.node .flag{fill:var(--accent);stroke:var(--card);stroke-width:1.5}
.search{display:flex;gap:6px;align-items:center}
.search input{font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:15rem;max-width:52vw}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;min-width:0;background-color:var(--canvas);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
svg#g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#g:active{cursor:grabbing}
.panel>*{flex-shrink:0}
.panel{width:min(420px,40%);border-left:1px solid var(--line);background:var(--card);overflow:auto;padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance;line-height:1.2}
.panel h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.panel p{margin:0;line-height:1.5;color:var(--ink-2)}
.panel .mono{font-family:var(--f-mono);font-size:.8rem;word-break:break-all}
.panel ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);line-height:1.45}
.panel .tex{border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.55;overflow-x:auto;font-size:.92rem;background:var(--canvas)}
.panel .tex pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.78rem;margin:0;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.closed{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.partial{background:var(--partial);border-color:var(--partial);color:#fff}
.chip.terminal{background:var(--terminal);border-color:var(--terminal);color:var(--ink)}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.linklist button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.linklist button:hover,.linklist button:focus-visible{background:var(--accent-soft)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--ink-3)}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--ink-2);max-width:calc(100% - 24px);box-shadow:var(--shadow)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.hint{position:absolute;right:12px;top:10px;font-size:.74rem;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.tools{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.tools button{font:inherit;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.tools button:focus-visible{outline:2px solid var(--accent)}
/* svg */
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1}
.node:hover rect.box,.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node:focus-visible{outline:none}.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5}
.node text{fill:var(--ink);font-family:var(--f-body)}
.node .t-display{font-family:var(--f-display);font-weight:600}
.node .t-mono{font-family:var(--f-mono)}
.node .t-dim{fill:var(--ink-3)}
.node .t-2{fill:var(--ink-2)}
.node.lib rect.box{fill:var(--accent-soft);stroke:var(--accent)}
.node.ghost rect.box{fill:none;stroke-dasharray:4 3;stroke:var(--ink-3)}
.node.ghost text{fill:var(--ink-3)}
.node.st-closed rect.box{fill:var(--closed);stroke:var(--closed)}
.node.st-partial rect.box{fill:var(--partial);stroke:var(--partial)}
.node.st-closed text,.node.st-partial text{fill:#fff}
.node.st-terminal rect.box{fill:url(#hatch)}
.node.st-none rect.box{fill:var(--none);stroke-dasharray:5 3;stroke:var(--stated)}
.node.st-closed:hover rect.box,.node.st-partial:hover rect.box,.node.st-closed.sel rect.box,.node.st-partial.sel rect.box{stroke:var(--ink);stroke-width:2.5}
.edge path{fill:none;stroke:var(--edge);stroke-opacity:.75}
.edge.dashed path{stroke-dasharray:6 4}
.edge.hi path{stroke:var(--edge-hi);stroke-opacity:1}
.edge text{fill:var(--ink-3);font-size:11px;font-family:var(--f-mono)}
.cluster rect{fill:none;stroke:var(--line);stroke-dasharray:2 4;rx:14}
.cluster text{fill:var(--ink-3);font-family:var(--f-body);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.world{transition:opacity .22s ease}
.world.fade{opacity:0}
@media (prefers-reduced-motion: reduce){.world{transition:none}}
@media (max-width:760px){
  main{flex-direction:column}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:42%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  h1{font-size:1.15rem}
}
</style>

const DATA = {"ett":{"blocks":[{"id":"ETT.tex:230:231","title":"Definition, constructions, examples › Causality"},{"id":"ETT.tex:230:363","title":"Definition, constructions, examples › Generated causality"},{"id":"ETT.tex:230:645","title":"Definition, constructions, examples › Tarentin spacetimes, Alexandrov topology and strong causality"},{"id":"ETT.tex:230:753","title":"Definition, constructions, examples › Continuously reachable past and future"},{"id":"ETT.tex:230:992","title":"Definition, constructions, examples › Geroch's Theorem"},{"id":"ETT.tex:1319:1322","title":"Singular flat spacetimes › Model spaces and their causality"},{"id":"ETT.tex:1319:1498","title":"Singular flat spacetimes › Definition"},{"id":"ETT.tex:1319:1513","title":"Singular flat spacetimes › Some causal properties of singular flat spacetimes"},{"id":"ETT.tex:1319:1707","title":"Singular flat spacetimes › Geroch's Theorem for singular flat spacetimes"},{"id":"ETT.tex:1319:1798","title":"Singular flat spacetimes › Some complementary causal lemmas"},{"id":"ETT.tex:1835","title":"The Choquet-Bruhat--Geroch Theorem"}],"nodes":[{"id":"defi:categorie_C","block":"ETT.tex:230:231","kind":"definition","num":"","title":"The category C","bucket":"A","lean":"closed","nl":"definition","line":232,"deps":[],"decls":["Causal.IsCObject","Causal.CObj","Causal.CObj.Hom","Causal.Causality.toCObj"],"ndecls":4,"findings":["ETT.tex:233 the objects of C are topological spaces, but its morphisms are only 'non-decreasing maps', with no continuity asked. Formalized as written (no continuity); the author may want 'continuous non-decreasing maps'."],"notes":"No `sorry`. Certified in `Causal.Morphism` under DEC-12 (rules OQ-12): a morphism of C sends ≪ to ≪ as well as ≤ to ≤, and on morphisms not being asked continuous, as written. WP-1, audited.","twin":"","tex":"\\begin{defi}[The category $\\mathbf{C}$]\n\t\t\tLet $\\mathbf{C}$ be the category whose objects are triples $(X,\\leq, \\tlleq)$ where $X$ is a topological space, $\\leq$ is a preorder, and $\\tlleq$ is a transitive relation contained in $\\leq$ and open --- that is, $\\{y~|~x\\tlleq y\\}$ and $\\{y~|~y \\tlleq x\\}$ are open for every $x\\in X$; and whose morphisms are the non-decreasing maps.\n\t\t\\end{defi}"},{"id":"rem:relation_not_assumed_reflexive","block":"ETT.tex:230:231","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":235,"deps":["defi:causal_E0"],"decls":["Causal.relation_not_assumed_reflexive","Causal.Causality.BTZAxioms.not_lt_self","Causal.Flat.minkowski_not_lt_self"],"ndecls":3,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: Minkowski space → carried (minkowski n, every n (existing Causal.Flat.minkowski_not_lt_self, reused)); a BTZ point (defi:causal_E0) → strengthened (a point of S₀ under BTZAxioms C S₀; I^-(p) = ∅ is the field Iminus_eq_empty, standing for defi:causal_E0 at E₀ (the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0))).","twin":"","tex":"\\begin{rem} The relation $\\tlleq$ is \\emph{not} assumed reflexive: no point of Minkowski space lies in its own chronological future, and a BTZ point has empty chronological past (Definition \\ref{defi:causal_E0}).\n\t\t\\end{rem}"},{"id":"defi:causalite","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causality","bucket":"A","lean":"closed","nl":"definition","line":237,"deps":[],"decls":["Causal.Causality","Causal.Precausality.Jplus","Causal.Precausality.Jminus","Causal.Precausality.Iplus","Causal.Precausality.Iminus"],"ndecls":5,"findings":["The first sentence defines a causality as a sheaf with values in C; the definition then used is the 'equivalently' one, which has no gluing axiom. The equivalence is asserted, not proved, and nothing downstream uses a gluing property."],"notes":"Carried in the paper's 'equivalently' form: a preorder and an open transitive relation on every open set, (a), (b), (c). No gluing axiom is stated in the paper and none is carried.","twin":"","tex":"\\begin{defi}[Causality]\n\t\t\tLet $M$ be a topological space. A causality $\\mathscr{C}$ on $M$ is a sheaf on $M$ with values in the category $\\mathbf{C}$.\n\t\t\tFor every open subset $\\U$ of $M$ and every subset $A\\subset \\U$ we write\n\t\t\t$$J^+_\\U(A) := \\{y\\in \\U ~|~ \\exists x\\in A, x\\leq_\\U y\\}, \\quad \\quad I^+_\\U(A):=\\{y\\in \\U ~|~\\exists x\\in A, x\\tll_\\U y\\}, $$\n\t\t\t$$J^-_\\U(A) := \\{y\\in \\U ~|~ \\exists x\\in A, x\\geq_\\U y\\}, \\quad \\quad I^-_\\U(A):=\\{y\\in \\U ~|~\\exists x\\in A, x\\succ_\\U y\\}.$$\n\n\t\t\tOpenness of $\\ll$ is a standing assumption of this work. It is not innocent: Grant, Kunzinger and S\\\"amann \\cite{MR4047145} exhibit continuous Lorentzian metrics whose chronological futures fail to be open. Our framework therefore stops short of that regularity, and we say so deliberately rather than silently.\n\n\t\t\tEquivalently, a causality is a pair $(\\leq,\\tll )=(\\leq_{\\U},\\ll_\\U)_{\\U\\subset M}$ of families of preorder relations on $M$, where $\\U$ ranges over the open subsets of $M$, such that the following holds for every open subset $\\U$ of $M$:\n\t\t\t\\begin{enumerate}[label=(\\alph*)]\n\t\t\t\t\\item $\\leq_\\U$ is a preorder, i.e. reflexive and transitive;\n\t\t\t\t\\item for every open $\\V\\subset \\U$ and all $x,y\\in \\V$,\n\t\t\t\t\t$$x\\leq_{\\V}y \\Rightarrow  x\\leq_{\\U}y \\quad \\text{and }\\quad x\\ll_{\\V}y\\Rightarrow  x\\ll_{\\U}y;$$\n\t\t\t\t\\item for every $A\\subset \\U$, $$I_\\U^\\pm(A)\\subset J_\\U^\\pm(A).$$\n\t\t\t\\end{enu …"},{"id":"def:category_topological_spacetimes","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Category of topological spacetimes","bucket":"A","lean":"closed","nl":"definition","line":254,"deps":[],"decls":["Causal.StrongMorphism","Causal.WeakMorphism","Causal.StrongMorphism.component","Causal.StrongMorphism.of_components","Causal.StrongMorphism.id","Causal.StrongMorphism.comp","Causal.StrongMorphism.weakMorphism","Causal.StrongMorphism.le_of_mapsTo","Causal.StrongMorphism.lt_of_mapsTo","Causal.WeakMorphism.id","Causal.WeakMorphism.comp","Causal.Spacetime"],"ndecls":12,"findings":["ETT.tex:255 'an open map inducing a sheaf morphism': continuity is implicit (φ⁻¹U must be open for the component at U to exist). Carried as an explicit field, per DEC-10. Naturality of the sheaf morphism is automatic, since every component is a restriction of φ.","A strong morphism is a weak morphism (StrongMorphism.weakMorphism); both classes contain the identity and are closed under composition, so the strong morphisms form a category (instCategorySpacetime). Openness of φ is not used for any of this.","Library, not paper: Causal/Curves.lean's docstring says a causal curve 'is the weak morphism ... from the segment with the causality of the timelike line'. Under reading (a) that is the chronal curve; the causal curve is the weak morphism from the LIGHTLIKE line. Under the ≤-only reading the docstring is correct. Worth one sentence there once (a) is ruled."],"notes":"No `sorry`. Certified in `Causal.Morphism`. Strong morphism as ruled by DEC-10; weak morphism with open neighbourhoods. Identity, composition and strong ⇒ weak are proved, so the strong morphisms form a category. WP-1, audited.","twin":"","tex":"\\begin{defi}[Category of topological spacetimes]\n\t\t\tA topological spacetime is a second countable Hausdorff topological space endowed with a causality. A strong morphism $M\\rightarrow N$ between topological spacetimes $M$ and $N$ is an open map inducing a sheaf morphism.\n\n\t\t\tA weak morphism $\\phi:M\\rightarrow N$ is a continuous map such that for every $x\\in M$ and every neighbourhood $\\U$ of $\\phi(x)$ there exists a neighbourhood $\\V\\subset \\phi^{-1}(\\U)$ of $x$ such that $\\phi_{|\\V}^{|\\U}$ is non-decreasing.\n\t\t\\end{defi}"},{"id":"ex:open_subset","block":"ETT.tex:230:231","kind":"example","num":"","title":"","bucket":"B","lean":"partial","nl":"open","line":259,"deps":[],"decls":["Causal.LocalCausality.InclusionStrong","Causal.Causality.restrict_inclusionStrong","Causal.LocalCausality.InclusionStrong.le_restrict","Causal.LocalCausality.InclusionStrong.eq_restrict","Causal.LocalCausality.diagonal","Causal.LocalCausality.diagonal_inclusionStrong","Causal.openSubset_not_unique","Causal.LocalCausality.toSubtype","Causal.LocalCausality.inclusionStrong_iff","Causal.LocalIsomorphism","Causal.Causality.pullback","Causal.Causality.pullback_localIsomorphism"],"ndecls":18,"findings":["ETT.tex:260 uniqueness is false as written: the diagonal causality (≤_V equality on V, ≪_V empty) also makes the inclusion of any open W a strong morphism, since a strong morphism only asks the relations of W to imply those of M (openSubset_not_unique, on the timelike line). What is true: the restriction is the GREATEST such causality, and the unique one for which the inclusion also reflects the relations (an isomorphism onto W). Suggested wording: 'a unique structure for which the inclusion is an isomorphism onto its image' or 'the largest structure for which ...'.","ETT.tex:262 uniqueness fails without a gluing property; among absolutely minimal causalities it holds (LocalIsomorphism.unique). Witness (localIsomorphism_not_unique): id : ℝ → ℝ is a local isomorphism to the timelike line both from the timelike line and from timelikeLineTop, which relates every pair of ℝ in ℝ itself. timelikeLineTop is a causality only because the library, like the paper's 'equivalently' form, has no gluing axiom: it is not causal (timelikeLineTop_not_isCausal), not absolutely minimal (timelikeLineTop_not_absolutelyMinimal), and not local in the sheaf sense. The paper's own use at ETT.tex:599 (X causally arc-connected, hence absolutely minimal) supplies the hypothesis under which uniqueness holds.","ETT.tex:262 'local isomorphism of topological spacetimes' needs N second countable and Hausdorff, and the paper says nothing about N: the line with two origins mapping to ℝ is a local homeomorphism from a non-Hausdorff space. The formalization asks nothing of N (the pull-back exists regardless), so N is a topological spacetime only if those hypotheses are added.","ETT.tex:262 existence holds for every local homeomorphism with no hypothesis on M (Causality.pullback, pullback_localIsomorphism): chains of relations read through φ in open sets on which φ is injective.","ETT.tex:262 'local isomorphism of topological spacetimes' is not defined in the paper."],"notes":"No `sorry`. In the scaffold. Both uniqueness claims are false as written and proved in corrected forms: the restriction is the greatest causality making the inclusion a strong morphism, and the unique one if the inclusion reflects the relations; the pull-back along a local homeomorphism exists with no hypothesis and is unique among absolutely minimal causalities. WP-1, audited.","twin":"","tex":"\\begin{exemple}\n\t\t An open subset of a topological spacetime carries a unique topological spacetime structure for which the inclusion is a strong morphism.\n\n\t\t More generally, if $\\phi:N\\rightarrow M$ is a local homeomorphism onto a topological spacetime $M$, then $N$ carries a unique causality for which $\\phi$ is a local isomorphism of topological spacetimes.\n\t\t\\end{exemple}"},{"id":"ex:causalities_lines","block":"ETT.tex:230:231","kind":"example","num":"","title":"Causalities on lines","bucket":"D","lean":"partial","nl":"open","line":265,"deps":[],"decls":["Causal.timelikeLine","Causal.lightlikeLine","Causal.spacelikeLine","Causal.timelikeLine_le_iff"],"ndecls":4,"findings":["Item 3 writes the spacelike line (R, empty, empty). Axiom (a) of defi:causalite asks the causal relation reflexive, so it cannot be empty: the diagonal is meant."],"notes":"Items 1, 2 and 3 are constructed. The timelike line is shown causally plain, absolutely minimal, tarentin, causal, globally hyperbolic and with push-up: the hypotheses of the library are jointly satisfiable.","twin":"","tex":"\\begin{exemple}[Causalities on lines]\n\t\t\\begin{enumerate}\n\t\t\t\\item \\textbf{The timelike line}\n\t\t\t\t$(\\RR,\\leq,\\leq)$ is $\\RR$ endowed with the family of binary relations $(\\leq_\\U,\\ll_\\U)_{\\U}$ given by:\n\t\t\t\t$x\\leq_\\U y$ (resp. $x\\ll_\\U y$) if and only if $x\\leq y$ (resp. $x< y$) and $x,y$ lie in the same connected component of $\\U$, where $\\leq$ is the usual order of $\\RR$.\n\t\t\t\\item\n\t\t\t\t\\textbf{The lightlike line} $(\\RR,\\leq,\\emptyset)$ is $\\RR$ endowed with the family of binary relations $(\\leq_\\U,\\ll_\\U)_{\\U}$ where $\\leq_\\U$ is the same as for the timelike line and $\\ll_\\U=\\emptyset$ for every open $\\U$.\n\t\t\t\\item \\textbf{The spacelike line} $(\\RR,\\emptyset,\\emptyset)$.\n\t\t\t\\item Galileo's spacetime $(\\RR^{n+1},\\leq,\\ll)$, where for every open $\\U$,\n\t\t\t\t$$(t,x_1,\\cdots,x_n)\\ll_{\\U}  (t',x_1',\\cdots,x_n')$$ if $t<t'$ and both points lie in the same connected component of $\\U$; and $p\\leq_\\U q$ if $p\\ll_\\U q$ or $p=q$.\n\t\t\t\\item\n\t\t\t\tMinkowski spacetime $\\E^{1,n}$ for $n\\geq1$, and more generally every Lorentzian manifold.\n\t\t\\end{enumerate}\n\t\t\\end{exemple}"},{"id":"defi:causalement_plat","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causally plain","bucket":"A","lean":"closed","nl":"definition","line":283,"deps":[],"decls":["Causal.Causality.CausallyPlain","Causal.Causality.causallyPlain_iff"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Causally plain]\\index{Causally plain}\nA topological spacetime $M$ is \\emph{causally plain} if for every open subset $\\U$ of $M$ and every $A\\subset \\U$,\n$$\\mathrm{Int}\\left(J^\\pm_\\U(A)\\right)\\subset \\overline{I^\\pm_\\U(A)},$$\nequivalently if every non-empty open subset of $J^\\pm_\\U(A)$ meets $I^\\pm_\\U(A)$.\n\\end{defi}"},{"id":"rem:pas_plat","block":"ETT.tex:230:231","kind":"remark","num":"","title":"Why causal plainness is not an axiom","bucket":"D","lean":"partial","nl":"informal","line":289,"deps":["defi:causalement_plat","defi:causal_E0","defi:futur_continue","prop:tarentin_fort_K"],"decls":["Causal.Causality.IsCausalBubble","Causal.Causality.IsCausalBubble.not_causallyPlain","Causal.Causality.IsCausalBubble.not_causallyPlain_past","Causal.lightlikeLine_isCausalBubble","Causal.Causality.SingularFlatAxioms.btz_past","Causal.Causality.SingularFlatAxioms.interior_Jminus_eq_empty","Causal.Causality.SingularFlatAxioms.btz_causallyPlain_past"],"ndecls":7,"findings":["ETT.tex:290 and 294-295: the BTZ defect of (ii) is not a violation of defi:causalement_plat. J^-(p) ⊂ sing_0 (lem:past_BTZ) and sing_0 has empty interior (prop:GX_sing_dec), so Int J^-(p) = ∅ ⊂ closure I^-(p); more generally Int J^-_U(A) = ∅ for every open U and every A ⊂ sing_0 (Lean: SingularFlatAxioms.interior_Jminus_eq_empty, btz_causallyPlain_past). rem:deux_pushup (ETT.tex:318-320) says the same thing ('silent at a point whose causal future or past has empty interior'). Nothing in the paper shows an E≥0-manifold is not causally plain (cf. OQ-16), so 'it fails in the two families' (l.290) is supported for (i) only.","ETT.tex:290 opens with 'This is the push-up property', naming defi:causalement_plat; the relational push-up of defi:pushup does hold on E≥0-manifolds (cor:pushup_sing). Suggested wording: 'This is the topological form of push-up'."],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: (i) causal bubbles of low-regularity metrics (Chruściel–Grant, Sämann) → weakened (no metric: an abstract causal bubble (IsCausalBubble, any open U and any A) is proved to violate defi:causalement_plat; witnessed on the lightlike line. The bubbles of the cited C⁰ metrics are not built.); (ii) a BTZ point of an E≥0-manifold → strengthened (SingularFlatAxioms C sing, causal; I^-(p) = ∅ (field Iminus_eq_empty) and J^-(p) = γ(]-∞,0]) (field line + Jminu","twin":"","tex":"\\begin{rem}[Why causal plainness is not an axiom]\nThis is the \\emph{push-up} property, and it fails in the two families of spacetimes this work exists to cover. The two failures are the same phenomenon.\n\n\\begin{enumerate}[label=(\\roman*)]\n\\item \\emph{Low regularity.} Local Lipschitz continuity of the metric is the threshold below which causal theory degenerates: light cones cease to be hypersurfaces and \\emph{bubble up}, and a \\emph{causal bubble} is by definition a non-empty open subset of $J^+(p)$ disjoint from $I^+(p)$ --- an explicit violation of Definition \\ref{defi:causalement_plat}. See Chru\\'sciel and Grant \\cite{MR2949547}, S\\\"amann \\cite{MR3500220} and the survey \\cite{samann2024nonregular}.\n\\item \\emph{Singularities.} At a BTZ point $p$ of a $\\mass{\\geq0}$-manifold, $I^-(p)=\\emptyset$ while $J^-(p)$ is the singular half-line below $p$ (Definition \\ref{defi:causal_E0}). This is the degenerate case of the same defect: causal past without chronological past.\n\\end{enumerate}\n\nImposing causal plainness as an axiom would therefore exclude precisely the objects announced in the introduction. This is the reason for the invariant $K^\\pm$ of Definition \\ref{defi:futur_continue}: it agrees with $I^\\pm$ wherever push-up holds (Proposition \\ref{prop:tarentin_fort_K}), and it is what carries Geroch's Theorem through where push-up fails.\n\\end{rem}"},{"id":"rem:droites_pas_plates","block":"ETT.tex:230:231","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":299,"deps":["rem:pas_plat","defi:causalement_plat"],"decls":["Causal.lines_not_causallyPlain","Causal.lightlikeLine_interior_Jplus_zero"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{rem}\nItems $2$ and $3$ are not causally plain: for the lightlike line, $\\mathrm{Int}\\left(J^+(0)\\right)=]0,+\\infty[$ whereas $I^+(0)=\\emptyset$. They are the simplest illustrations of Remark \\ref{rem:pas_plat}, and they are topological spacetimes in our sense precisely because Definition \\ref{defi:causalement_plat} is not an axiom.\n\t\t\\end{rem}"},{"id":"defi:pushup","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Push-up property","bucket":"A","lean":"closed","nl":"definition","line":307,"deps":[],"decls":["Causal.Causality.PushUp","Causal.Causality.pushUp_iff"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Push-up property]\\index{Push-up}\nA topological spacetime $M$ has the \\emph{push-up property} if for every open subset $\\U$ of $M$ and\nevery $x\\in \\U$,\n$$J^\\pm_\\U\\left(I^\\pm_\\U(x)\\right)\\subset I^\\pm_\\U(x) \\qquad\\text{and}\\qquad I^\\pm_\\U\\left(J^\\pm_\\U(x)\\right)\\subset I^\\pm_\\U(x);$$\nequivalently, concatenating a causal relation with a chronological one produces a chronological one.\n\\end{defi}"},{"id":"rem:deux_pushup","block":"ETT.tex:230:231","kind":"remark","num":"","title":"The two forms are independent","bucket":"B","lean":"partial","nl":"informal","line":314,"deps":["defi:causalement_plat","defi:pushup","rem:droites_pas_plates","prop:tarentin_fort_K","prop:K_plongement_ordre","lem:pushup_local","rem:pushup"],"decls":["Causal.lightlikeLine_pushUp","Causal.lightlikeLine_not_causallyPlain"],"ndecls":2,"findings":[],"notes":"First half: the lightlike line has the push-up property and is not causally plain. The converse independence is argued in the remark, not exhibited.","twin":"","tex":"\\begin{rem}[The two forms are independent]\nDefinitions \\ref{defi:causalement_plat} and \\ref{defi:pushup} are the topological and the relational\nform of one classical phenomenon, and neither implies the other. The lightlike line has\n$I^\\pm=\\emptyset$, so it has the push-up property vacuously while failing to be causally plain\n(Remark \\ref{rem:droites_pas_plates}). Conversely, causal plainness is a statement about\n$\\mathrm{Int}\\left(J^\\pm\\right)$ and is silent at a point whose causal future or past has empty\ninterior.\n\nThe two are used for different purposes below. Causal plainness is what makes $K^\\pm$ collapse onto\n$I^\\pm$ (Proposition \\ref{prop:tarentin_fort_K}). The push-up property is what makes $I^\\pm(x)$\n\\emph{dense} in $J^\\pm(x)$, hence what turns the injectivity of $x\\mapsto K^\\pm(x)$ into an embedding\nof ordered sets (Proposition \\ref{prop:K_plongement_ordre}); it is local (Lemma\n\\ref{lem:pushup_local}) and it holds in the model spaces of Section \\ref{subsec:sing_spacetime_defi}\n(Remark \\ref{rem:pushup}).\n\\end{rem}"},{"id":"def:causal_chain","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causal chain","bucket":"B","lean":"partial","nl":"definition","line":329,"deps":[],"decls":["Causal.linearCausality","Causal.linearCausality_real","Causal.Causality.IsCausalChainMap","Causal.Causality.IsCausalChain","Causal.WeakMorphism.le_of_Icc_subset","Causal.Causality.IsCausalChainMap.isCausalChain_range","Causal.Causality.isCausalChainMap_of_isCausalChain","Causal.Causality.isCausalChainMap_real_iff","Causal.Causality.dual_isCausalChain","Causal.Causality.isCausalChain_empty","Causal.Causality.isCausalChain_singleton","Causal.Causality.IsCausalChain.mono"],"ndecls":16,"findings":["ETT.tex:331 'causal morphism' is not defined; it is read as the weak morphism of def:category_topological_spacetimes (DEC-6), with (X,≤) given the lightlike causality of its order (no ≪). Then a chain map from ℝ is exactly an injective DEC-6 causal curve which is an embedding (isCausalChainMap_real_iff).","ETT.tex:330-332 the paper gives two notions under one name and never relates them. Image ⇒ subset chain holds when X is conditionally complete and densely ordered (isCausalChain_range); for a general linearly ordered X (e.g. ℚ) the proof needs to chain local relations of ≤_V across [y,z], which needs compact connected intervals, and I could not exclude a counterexample built from a non-local causality. Subset chain ⇒ image of a chain map holds when S carries a linear order reflected by ≤_M whose order topology is the subspace topology; without that hypothesis S need not even be globally comparable (two disjoint timelike lines, or X minus its vertex below).","Every subset of the timelike line is a causal chain (timelikeLine_isCausalChain): def (2) is a purely local condition, so discrete sets, Cantor sets etc. are chains. In the spacelike line exactly the subsets whose points are all isolated are chains."],"notes":"No `sorry` beneath the strict part. Both notions are defined: a chain map (an embedding which is a weak morphism from the order causality of X) and a subset chain. Image ⇒ subset chain is proved for X conditionally complete and densely ordered; the paper never relates the two. WP-6, audited twice.","twin":"","tex":"\\begin{defi}[Causal chain]\nLet $(M,\\leq,\\ll)$ be a topological spacetime.\nA causal chain is an embedding $c:(X,\\leq) \\rightarrow M$ where $(X,\\leq)$ is linearly ordered and endowed with the order topology, and where $c$ is a causal morphism.\nA subset $S\\subset M$ is a causal chain of $M$ if for every $x\\in S$ and every neighbourhood $\\U$ of $x$ there exists a neighbourhood $\\V\\subset \\U$ of $x$ such that $S\\cap \\V$ is totally ordered for $\\leq_\\V$.\n\\end{defi}"},{"id":"def:maximal_chain","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Maximal chain","bucket":"T","lean":"none","nl":"definition","line":334,"deps":[],"decls":[],"ndecls":0,"findings":["ETT.tex:335 with the subset notion (2), a maximal chain of a T1 space is DENSE (IsMaximalChain.dense): any point outside the closure of a chain can be added to it.","Abstract consequence, proved (not_isMaximalChain_of_hasUnrelatedOpensIn): in a nonempty T1 space, if every point has an open neighbourhood U such that every non-empty open O ⊆ U contains two non-empty open sets with no ≤_U relation between their points, there is no maximal chain. Proof: the dense maximal chain S meets both unrelated sets inside the V ⊆ U where S ∩ V is totally ordered for ≤_V, and ≤_V ⊆ ≤_U by axiom (b). The global form (U = ⊤) is not_isMaximalChain_of_hasUnrelatedOpensIn_top; the spacelike line satisfies it (spacelikeLine_hasUnrelatedOpensIn_top), which re-derives spacelikeLine_not_isMaximalChain.","Application to Lorentzian manifolds (prose; no Lorentzian manifold is in the library): let M have dimension ≥ 2, chronology and causality conditions arbitrary (vicious spacetimes included). Take at each x a convex normal neighbourhood U, with ≤_U the relation 'joined by a causal curve in U'. Every non-empty open O ⊆ U contains two points spacelike-separated in U (e.g. on a short spacelike geodesic), and since J_U is closed in U × U for a convex normal U, small balls around them are ≤_U-unrelated. So the hypothesis holds with local U, and there is NO maximal causal chain. Because only ≤_U for small U is used, no global causality condition is needed. Consequently, as written, causal completeness holds vacuously in every Lorentzian manifold of dimension ≥ 2 and causal connectedness fails there. The paper presumably means maximal among CONNECTED chains, or among chain maps / curves maximal under extension (DEC-11).","Superseded by DEC-20: Causal.Chains keeps the literal definition (IsMaximalChain) as the record of the finding (a maximal chain is dense; none exists in Minkowski space). Relation proved here: the image of an inextensible causal curve over ℝ which is an embedding is a subset causal chain (CausalCurveIn.isCausalChain_range), and in ℝ^{1,n}, n ≥ 1, through every p ≤ q passes such a curve whose image is a chain and is not maximal (minkowski_curveChain_not_maximal).","Witness only (the definition is Causal/Chains.lean's, OQ-17). As written, Minkowski space R^{1,n}, n >= 1 (indeed every static R x X with X geodesic with two points), has NO maximal causal chain: every open set contains two small balls at one time, spatially apart, with no causal relation between them (hasUnrelatedOpensIn), and not_isMaximalChain_of_hasUnrelatedOpensIn applies. Hence def:causally_connected fails in Minkowski space and def:causally_complete holds vacuously there (minkowski_not_causallyConnected, minkowski_causallyComplete). This is with the local causality of curves, so it is not an artefact of non-local causalities (kb/0019).","Lean declarations of this witness (not row decls, so as not to overwrite Causal/Chains.lean's def:maximal_chain row): Causal.minkowski_not_isMaximalChain, Causal.minkowski_not_causallyConnected, Causal.minkowski_causallyComplete, Causal.staticCausality.not_isMaximalChain, Causal.staticCausality.hasUnrelatedOpensIn."],"notes":"The literal definition stays in Causal.Chains as the record of the finding. (WP-6, WP-6b, WP-9, audited)","twin":"","tex":"\\begin{defi}[Maximal chain]\nA causal chain of $M$ is maximal if it is maximal for the inclusion among causal chains of $M$.\n\\end{defi}"},{"id":"def:causally_connected","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causally connected","bucket":"A","lean":"closed","nl":"definition","line":337,"deps":[],"decls":["Causal.Causality.CausallyConnected","Causal.Causality.dual_causallyConnected","Causal.timelikeLine_causallyConnected","Causal.spacelikeLine_not_causallyConnected","Causal.Causality.CausallyConnectedCurves","Causal.Causality.CausallyConnectedCurves.dual","Causal.Causality.dual_causallyConnectedCurves","Causal.Causality.CausalCurveIn.isConnected_image","Causal.Causality.causallyConnectedCurves_iff_of_isCausal","Causal.staticCausality.exists_inextensible_graph","Causal.staticCausality.causallyConnectedCurves","Causal.timelikeLine_causallyConnectedCurves"],"ndecls":18,"findings":["ETT.tex:339 as written (maximal among all subset chains), causal connectedness fails in every spacetime with no maximal chain, Minkowski space of dimension ≥ 2 included (see def:maximal_chain); the condition holds for the timelike line only because its unique maximal chain is the whole line.","Under DEC-20 Minkowski space ℝ^{1,n} is causally connected for every n (minkowski_causallyConnectedCurves), where the literal definition fails for n ≥ 1 (minkowski_not_causallyConnected, CausalScaffold.Minkowski). More generally every static spacetime ℝ × X over a geodesic metric space is: through p ≤ q passes the graph of a 1-Lipschitz map — the geodesic segment from p to q prolonged by the vertical lines through p and q — which is inextensible because time is unbounded along it (staticCausality.exists_inextensible_graph).","Negative example (audit): ℚ with the causality of its order (linearCausality ℚ) is not causally connected: ℚ is totally disconnected, so every causal curve is constant (rat_not_causallyConnectedCurves). It is non-local and not causally arc-connected, both proved: rat_not_absolutelyMinimal (the cover by the two sides of √2), rat_not_causallyArcConnected (kb/0019). Under causal arc-connectedness and causality, connectedness follows from CurvesExtend (CauchyExtension.lean:82), here as a hypothesis (causallyConnectedCurves_of_curvesExtend)."],"notes":"DEC-20: for p ≤ q an inextensible causal curve meets p, then q (the order is immaterial in a causal spacetime). Minkowski space and every static spacetime over a geodesic space are causally connected; ℚ (non-local) is not. OQ-20 asks whether it should read with maximal chains of (M, ≤) instead. (WP-6, WP-6b, audited)","twin":"","tex":"\\begin{defi}[Causally connected]\nLet $(M,\\leq,\\ll)$ be a topological spacetime.\n$M$ is causally connected if for all $p,q\\in M$ such that $p\\leq_M q$ there exists a connected maximal causal chain from $p$ to $q$.\n\\end{defi}"},{"id":"def:diamonds","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Diamonds","bucket":"A","lean":"closed","nl":"definition","line":342,"deps":[],"decls":["Causal.Causality.diamond","Causal.Causality.openDiamond"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Diamonds]\nLet $M$ be a topological spacetime. For every open $\\U$ of $M$ and all $p,q \\in M$ we define\n\\begin{itemize}\n\\item $J_\\U(p,q) := J^-_\\U(q)\\cap J^+_\\U(p)$, the full diamond from $p$ to $q$;\n\\item $\\ring{J}_\\U(p,q): = \\mathrm{Int}(J_\\U(p,q))$, the open diamond from $p$ to $q$.\n\\end{itemize}\n\\end{defi}"},{"id":"def:causally_compact","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causally compact","bucket":"A","lean":"closed","nl":"definition","line":350,"deps":[],"decls":["Causal.Causality.CausallyCompact"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Causally compact]\nLet $(M,\\leq,\\ll)$ be a topological spacetime. $M$ is causally compact if the diamond $J(p,q)$ is compact for all $p,q\\in M$.\n\\end{defi}"},{"id":"def:causally_complete","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causally complete","bucket":"A","lean":"closed","nl":"definition","line":353,"deps":[],"decls":["Causal.Causality.chainPreorder","Causal.Causality.DedekindComplete","Causal.Causality.CausallyComplete","Causal.Causality.dedekindComplete_iff","Causal.Causality.DedekindComplete.dual","Causal.Causality.DedekindComplete.exists_isGLB","Causal.Causality.dual_dedekindComplete","Causal.Causality.dual_causallyComplete","Causal.timelikeLine_causallyComplete","Causal.spacelikeLine_causallyComplete","Causal.Causality.IsComparableClosedChain","Causal.Causality.isMaxChain_iff_comparableClosed"],"ndecls":59,"findings":["ETT.tex:354 a maximal chain is only locally totally ordered, so 'Dedekind-complete' (a notion for linear orders) needs an order on a set which need not be linear. Read for the preorder ≤_M induced on S: every non-empty subset bounded above has an IsLUB (mathlib vocabulary). The IsGLB half then follows in any preorder (DedekindComplete.exists_isGLB), so the reading is time-symmetric (dual_dedekindComplete).","The master's reading of DEC-21 and the author's literal sentence agree on causal spacetimes: requiring every 'author-chain' (totally ordered; a point cutting S into two NON-EMPTY pieces, strictly below and strictly above, lies in S) to be Dedekind-complete is equivalent to CausallyCompleteOrder (causallyCompleteOrder_iff_author, due to the WP-6b audit).","Under DEC-21 the notion is neither vacuous nor trivial. Maximal chains of (M, ≤) exist through every chain (Zorn, exists_isMaxChain_le) and are not dense. Every maximal chain of Minkowski space ℝ^{1,n} (every n) and of the timelike line is Dedekind-complete (minkowski_causallyCompleteOrder, timelikeLine_causallyCompleteOrder), as is every static spacetime over a complete geodesic space, proper or not (staticCausality.causallyCompleteOrder).","LOCAL negative example: the half-plane ℝ × ]0,∞[ (an open subset of 1+1 Minkowski, its causality of curves; causal, tarentin, strongly causal, causally arc-connected, absolutely minimal). The two null rays t + x = 1 and t − x = 1 form a maximal chain of (M, ≤) (halfPlaneWedge_isMaxChain) whose cut at the missing corner (1, 0) has no bound (halfPlane_not_causallyCompleteOrder).","Relation with the curve reading (b) (CausallyCompleteCurves, ChainsCurves): reading (b) does NOT imply the DEC-21 notion — ℚ with its order is complete for curves (all causal curves constant, rat_causallyCompleteCurves) and not order-complete (ℚ is its own maximal chain, cut at √2, rat_not_causallyCompleteOrder); the witness is non-local and not causally arc-connected (rat_not_absolutelyMinimal, rat_not_causallyArcConnected). Whether the DEC-21 notion implies (b), in general or under DEC-22's hypotheses, is open: both follow from causal compactness under them, both fail on the half-plane, both hold over ℝ × C([0,1], ℝ)."],"notes":"DEC-21: every maximal chain of the ordered set (M, ≤) is Dedekind-complete (equivalently, every cut has its bound in the chain). Minkowski space and every static spacetime over a complete geodesic space are causally complete; the half-plane ℝ × ]0,∞[ is not (a local example). The curve reading (b) of DEC-20 is kept, unmarked, as a related notion. (WP-6, WP-6b, audited)","twin":"","tex":"\\begin{defi}[Causally complete]\nLet $(M,\\leq,\\ll)$ be a topological spacetime. $M$ is causally complete if every maximal causal chain is Dedekind-complete \\cite{MR1631533}.\n\\end{defi}"},{"id":"rem:causal_completeness_slightly_weaker","block":"ETT.tex:230:231","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":356,"deps":[],"decls":["Causal.Bowtie","Causal.bowtie","Causal.bowtie_le","Causal.bowtie_isCausal","Causal.bowtie_causallyCompact","Causal.bowtie_isCausalChain","Causal.bowtie_isMaximalChain_univ","Causal.bowtie_not_causallyComplete","Causal.not_causallyCompact_imp_causallyComplete","Causal.fan","Causal.fanRel","Causal.fan_le"],"ndecls":51,"findings":["ETT.tex:357 'slightly weaker' asserts two things: (i) causally compact ⇒ causally complete, and (ii) not conversely. Half (ii) is CONFIRMED (not_causallyComplete_imp_causallyCompact): the fan, ℕ discrete with 0 below and 1 above every other event, is causal, T2, second countable, causally complete, and J(0,1) = ℕ is not compact. The fan is non-local (ofRelation).","Half (i) is refuted only for NON-LOCAL causalities (not_causallyCompact_imp_causallyComplete): the bowtie, four discrete events a1,a2 < b1,b2 with the restrictions of a global order (ofRelation), is causal, T2, second countable, causally compact (finite diamonds), and {a1,a2} is bounded above with no least upper bound. The refutation rests on non-locality: on a discrete space an absolutely minimal causality has ≤ the diagonal (AbsolutelyMinimalOn.eq_of_discrete), hence is causally compact and causally complete (AbsolutelyMinimalOn.causallyCompact_of_discrete, …causallyComplete_of_discrete). Correction to the audit's wording: ≪ is then contained in the diagonal but need NOT be empty — diagonalCausality (≤ = ≪ = diagonal) is absolutely minimal with x ≪ x (diagonalCausality_absolutelyMinimalOn, diagonalCausality_lt). Compactness and completeness depend on ≤ only, so the conclusion stands.","A LOCAL witness against (i), in prose only (not formalized: not cheap — it needs the induced causality on a subtype of ℝ², the comparability case analysis inside its diamonds for transitivity, absolute minimality via a subdivision along the two branches, and compactness of diamonds as images of segments; estimated several hundred lines). X = the two null lines |x| = |t| of 1+1 Minkowski space through the origin o, with x ≤_U y iff y is in the Minkowski causal future of x and the diamond {z ∈ X : x ≤ z ≤ y} — a segment, or two half-segments through o — lies in U. This is absolutely minimal (relations are generated along segments), causal, T2, second countable, and its diamonds are compact. X minus o is a chain; o cannot be added (every neighbourhood of o meets both future branches, which are ≤-incomparable), and any other missing point can, so X \\ {o} is the unique maximal chain. One past branch is bounded above by every point of both future branches and has no least upper bound in X \\ {o}. If this is accepted, (i) fails for local causalities too: compactness fills a gap with a point of M, but nothing forces that point into the chain, and the chain need not be linearly ordered.","totalLine (any two points related, ofRelation) is kept only as a NON-CAUSAL sanity example and is not a witness for the remark.","Under DEC-21 and DEC-22 the remark is proved in both halves for second countable Hausdorff spacetimes. 'Compact ⇒ complete' needs only T2, tarentin and causal. The witness of strictness is local and second countable but not locally compact; a locally compact one is not known (the half-plane fails both properties).","Audit correction: the first witness ℝ × (ℕ →ᵇ ℝ) is not second countable (indicators of subsets of ℕ form an uncountable 1-separated set); replaced by ℝ × C([0,1], ℝ) in both not_causallyCompleteOrder_imp_causallyCompact and not_causallyCompleteCurves_imp_causallyCompact, whose quantified class now includes [SecondCountableTopology N]."],"notes":"DEC-22: compact ⇒ complete under T2, tarentin and causal (fewer than DEC-22 lists); not conversely, by ℝ × (ℕ →ᵇ ℝ), local but not locally compact. (WP-6, WP-6b, audited)","twin":"","tex":"\\begin{rem}\nCausal completeness is slightly weaker than causal compactness.\n\\end{rem}"},{"id":"def:causal_chronological_curve","block":"ETT.tex:230:231","kind":"definition","num":"","title":"Causal/chronological curve","bucket":"A","lean":"closed","nl":"definition","line":360,"deps":[],"decls":["Causal.Causality.CausalCurveOn","Causal.Causality.ChronalCurveOn","Causal.CurveOn"],"ndecls":3,"findings":["A causal curve is 'a connected causal chain', and a causal chain is an embedding. An embedding is injective, so no causal curve joins a point to itself; but the proof of lem:restriction_convexe takes a future causal curve from y to x for y <= x, equality allowed, and that of lem:pushup_local considers 'y = z' if s = 0'. def:causal_arc_connectedness, read with embeddings, fails at p = q.","'Causal morphism' is not defined; def:category_topological_spacetimes defines strong and weak morphisms."],"notes":"No `sorry`. The definition is the one ruled by DEC-6 (OQ-7): a map locally non-decreasing at every scale, the weak morphism of def:category_topological_spacetimes, not asked to be an embedding. Continuity is a consequence.","twin":"","tex":"\\begin{defi}[Causal/chronological curve] Let $(M,\\leq,\\ll)$ be a topological spacetime and let $I$ be an interval of $\\RR$. A causal curve $c:I\\rightarrow M$ is a connected causal chain.\n\\end{defi}"},{"id":"def:precausality","block":"ETT.tex:230:363","kind":"definition","num":"","title":"Precausality","bucket":"A","lean":"closed","nl":"definition","line":364,"deps":["defi:causalite"],"decls":["Causal.Precausality"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Precausality]\\index{Precausality}\nLet $M$ be a topological space. A sheaf $(\\leq,\\ll)$ of pairs of transitive binary relations is a precausality if it satisfies hypotheses $(a)$ and $(b)$ of Definition \\ref{defi:causalite}.\n\\end{defi}"},{"id":"lem:union_causalite","block":"ETT.tex:230:363","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":367,"deps":["defi:causalite"],"decls":["Causal.Precausality.existsUnique_minimal_extension","Causal.Precausality.generated","Causal.Precausality.Compatible","Causal.LocalCausality.exists_extension"],"ndecls":4,"findings":[],"notes":"A precausality on U_i is carried by a precausality on M of which only the restriction to U_i is read; `Causal/Local.lean` proves that every precausality given on the open subsets of U_i alone is such a restriction.","twin":"","tex":"\\begin{lem} Let $M$ be a topological space and let $(\\U_i)_{i\\in I}$ be an open cover of $M$.\nAssume that\n\\begin{enumerate}[label=(\\Alph*)]\n\\item each $\\U_i$ is endowed with a precausality;\n\\item for all $i,j\\in I$, the restrictions of $\\ll^i$ and $\\ll^j$ (resp. of $\\leq^i$ and $\\leq^j$) to $\\U_i\\cap \\U_j$ are equal.\n\\end{enumerate}\nThen there exists a minimal precausality $(\\leq,\\ll)$ extending the family $(\\leq^i,\\ll^i)_{i\\in I}$, and it is moreover unique.\n\\end{lem}"},{"id":"def:precausality_generated_notation_lemma","block":"ETT.tex:230:363","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":393,"deps":["lem:union_causalite"],"decls":["Causal.Precausality.generated"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}\\index{Precausality!generated} With the notation of Lemma \\ref{lem:union_causalite}, $(\\leq,\\ll)$ is called the precausality generated by the family $(\\U_i,\\leq^i,\\ll^i)_{i\\in I}$.\n\\end{defi}"},{"id":"def:topological_space_causality_absolutely","block":"ETT.tex:230:363","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":397,"deps":[],"decls":["Causal.Precausality.AbsolutelyMinimal","Causal.Precausality.AbsolutelyMinimalOn","Causal.Precausality.absolutelyMinimal_iff"],"ndecls":3,"findings":[],"notes":"","twin":"","tex":"\\begin{defi} Let $M$ be a topological space.\\index{Causality!absolutely minimal}\nA precausality $(\\leq,\\ll)$ on $M$ is absolutely minimal if for every open cover $(\\U_i)_{i\\in I}$ the precausality generated by $(\\U_i,\\leq_{\\U_i}, \\ll_{\\U_i})_{i\\in I}$ is equal to $(\\leq,\\ll)$.\n\\end{defi}"},{"id":"def:causal_arc_connectedness","block":"ETT.tex:230:363","kind":"definition","num":"","title":"Causal arc-connectedness","bucket":"A","lean":"closed","nl":"definition","line":403,"deps":[],"decls":["Causal.Causality.CausallyArcConnected","Causal.Causality.CausallyArcConnectedOn","Causal.Causality.causallyArcConnectedOn_iff"],"ndecls":3,"findings":[],"notes":"No `sorry`. Under DEC-6, (ii) implies (i) holds in every topological spacetime: causal arc-connectedness is the existence of curves.","twin":"","tex":"\\begin{defi}[Causal arc-connectedness]\\index{Causally!arc-connected} Let $M$ be a topological spacetime. $M$ is causally arc-connected if for every open subset\n$\\U$ and all $p,q\\in \\U$ the following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $p\\leq_\\U q$ (resp. $p\\ll_\\U q$);\n\\item there exists a future causal (resp. future chronal) curve $c:[0,1]\\rightarrow \\U$ with $c(0)=p$ and $c(1)=q$.\n\\end{enumerate}\n\\end{defi}"},{"id":"def:local_causal_arc_connectedness","block":"ETT.tex:230:363","kind":"definition","num":"","title":"Local causal arc-connectedness","bucket":"A","lean":"closed","nl":"definition","line":411,"deps":[],"decls":["Causal.Causality.LocallyCausallyArcConnected"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Local causal arc-connectedness]\\index{Locally causally arc-connected} Let $M$ be a topological spacetime.\n$M$ is locally causally arc-connected if for every $x\\in M$ and every neighbourhood $\\U$ of $x$ there\nexists an open neighbourhood $\\V$ of $x$ contained in $\\U$ which is causally arc-connected.\n\\end{defi}"},{"id":"rem:cac_local","block":"ETT.tex:230:363","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":415,"deps":[],"decls":["Causal.Causality.CausallyArcConnectedOn.mono","Causal.Causality.CausallyArcConnected.locallyCausallyArcConnected"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} Causal arc-connectedness is a condition bearing on \\emph{every} open subset of $M$.\nConsequently every open subset of a causally arc-connected topological spacetime is itself\ncausally arc-connected, and a causally arc-connected topological spacetime is in particular\nlocally causally arc-connected.\n\\end{rem}"},{"id":"prop:cac_engendre","block":"ETT.tex:230:363","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":421,"deps":[],"decls":["Causal.Causality.generated_eq_iff_causallyArcConnected"],"ndecls":1,"findings":["That M is locally causally arc-connected follows from the cover by causally arc-connected open subsets and rem:cac_local; it is not used."],"notes":"No `sorry`.","twin":"","tex":"\\begin{prop} Let $M$ be a locally causally arc-connected topological spacetime.\nFor every cover $(\\U_i)_{i\\in I}$ of $M$ by causally arc-connected open subsets the following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item the causality of $M$ is the causality generated by the family $(\\U_i,\\leq^i,\\ll^i)_{i\\in I}$;\n\\item $M$ is causally arc-connected.\n\\end{enumerate}\n\\end{prop}"},{"id":"cor:causalement_connexe_minimal","block":"ETT.tex:230:363","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":458,"deps":["rem:cac_local","prop:cac_engendre"],"decls":["Causal.Causality.CausallyArcConnected.absolutelyMinimal","Causal.Causality.CausallyArcConnectedOn.absolutelyMinimalOn"],"ndecls":2,"findings":[],"notes":"No `sorry`. Proved for every open subset.","twin":"","tex":"\\begin{cor}\nLet $M$ be a topological spacetime. If $M$ is causally arc-connected, then the causality of $M$ is absolutely minimal.\n\\end{cor}"},{"id":"cexemple:point_transparent","block":"ETT.tex:230:363","kind":"counterexample","num":"","title":"A line with a transparent point","bucket":"A","lean":"closed","nl":"open","line":472,"deps":[],"decls":["Causal.transparentLine","Causal.transparentLine_le_iff","Causal.transparentLine_causallyPlain","Causal.transparentLine_absolutelyMinimalOn_top","Causal.transparentLine_absolutelyMinimal","Causal.realMinusZero","Causal.transparentLine_not_absolutelyMinimalOn","Causal.point_transparent"],"ndecls":8,"findings":[],"notes":"No `sorry`. Every assertion proved, no added hypothesis. WP-2, audited.","twin":"","tex":"\\begin{cexemple}[A line with a transparent point]\nEndow $M=\\RR$ with the following causality: for $\\W$ open and $x,y\\in \\W$,\n$$x\\leq_\\W y \\iff x\\leq y \\text{ and } [x,y]\\subset \\W\\cup\\{0\\}, \\qquad\n  x\\ll_\\W y \\iff x< y \\text{ and } [x,y]\\subset \\W\\cup\\{0\\},$$\nthat is, the timelike line except that the point $0$ is \\emph{transparent}: causality remembers it even once it has been removed from the ambient open set. Equivalently, $x\\leq_\\W y$ if $x\\leq y$ and $x,y$ lie in the same connected component of $\\W\\cup\\{0\\}$.\n\nThis is a topological spacetime, and it is even causally plain. Reflexivity and transitivity are clear, monotonicity $(b)$ holds because $[x,y]\\subset \\V\\cup\\{0\\}$ implies $[x,y]\\subset \\W\\cup\\{0\\}$ for $\\V\\subset \\W$, and $\\ll_\\W$ is open since $I^+_\\W(x)=]x,b[\\,\\cap\\, \\W$ with $b=\\sup\\{t~|~[x,t]\\subset \\W\\cup\\{0\\}\\}$.\n\nIt is absolutely minimal on $\\RR$. Let $(\\O_a)_{a\\in A}$ be an open cover of $\\RR$, let $\\W$ be open and let $x\\leq_\\W y$ with $x<y$. If $0\\notin[x,y]$ or $0\\in \\W$, then $[x,y]$ is a compact subset of $\\W$; a Lebesgue number for the cover $(\\W\\cap \\O_a)_a$ of $[x,y]$ provides a subdivision $x=p_0<\\cdots<p_n=y$ with $[p_k,p_{k+1}]\\subset \\W\\cap \\O_{a_k}$, whence $p_k\\leq_{\\W\\cap \\O_{a_k}}p_{k+1}$. If $0\\in\\,]x,y[$ and $0\\notin \\W$, choose $\\O_{a_0}\\ni 0$ and $\\delta>0$ with $]-\\delta,\\delta[\\,\\subset \\O_{a_0}$ and $\\delta<\\min(|x|,y)$, and put $u=-\\d …"},{"id":"rem:minimalite_non_hereditaire","block":"ETT.tex:230:363","kind":"remark","num":"","title":"","bucket":"C","lean":"partial","nl":"informal","line":485,"deps":[],"decls":["Causal.generated_restrict_le","Causal.generated_restrict_lt","Causal.Precausality.AbsolutelyMinimalOn.of_isClosed","Causal.Precausality.AbsolutelyMinimal.absolutelyMinimalOn_of_isClopen","Causal.timelikeLine_rules_out_per_precausality_reading"],"ndecls":5,"findings":["ETT.tex:486, 'quantifying over arbitrarily fine covers of U this forces closure(U) ∩ (M∖U) = ∅' is an argument sketch: no precausality is exhibited, and the transparent-point construction of cexemple:point_transparent needs a boundary point of U with points of U on both sides (it does not apply to U = ]0,+∞[ ⊂ ℝ). Proved: restriction commutes with generation; clopen ⇒ hereditary. The per-precausality reading (P|_U absolutely minimal ⇒ U clopen) is not the paper's intent — it would contradict lem:precausalite_restriction_minimale (ETT.tex:491) — and is formally ruled out by timelikeLine_rules_out_per_precausality_reading."],"notes":"No `sorry`. Restriction commutes with generation, and absolute minimality restricts to clopen subsets. The per-precausality reading of the last sentence is ruled out (the timelike line on ]0,+∞[); the subset reading is open, even for ℝ and ]0,+∞[. WP-2, audited.","twin":"","tex":"\\begin{rem}\nThe obstruction is structural. For $\\U$ open and $\\mathcal O$ an open cover of $M$, restriction commutes with generation: $\\mathrm{Gen}(\\mathcal O,P)|_\\U=\\mathrm{Gen}(\\mathcal O|_\\U,P|_\\U)$, where $\\mathcal O|_\\U=(\\O_a\\cap \\U)_a$. So the covers of $\\U$ reachable from covers of $M$ are the ones refined by some trace $\\mathcal O|_\\U$; quantifying over arbitrarily fine covers of $\\U$ this forces $\\overline\\U\\cap(M\\setminus \\U)=\\emptyset$, i.e. $\\U$ clopen. Absolute minimality is hereditary only for clopen subsets.\n\\end{rem}"},{"id":"lem:precausalite_restriction_minimale","block":"ETT.tex:230:363","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":491,"deps":["prop:cac_engendre","rem:cac_local","cor:causalement_connexe_minimal"],"decls":["Causal.Causality.LocallyCausallyArcConnected.absolutelyMinimalOn","Causal.Causality.LocallyCausallyArcConnected.causallyArcConnected"],"ndecls":2,"findings":[],"notes":"No `sorry`.","twin":"","tex":"\\begin{lem} Let $M$ be a locally causally arc-connected topological spacetime whose causality is absolutely minimal. Then the restriction of the causality of $M$ to $\\U$ is absolutely minimal, for every open subset $\\U$ of $M$.\n\\end{lem}"},{"id":"lem:precausalite_engendre_minimale","block":"ETT.tex:230:363","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":498,"deps":["lem:union_causalite"],"decls":["Causal.Precausality.generated_absolutelyMinimal"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}\nLet $M$ be a topological space and let $(\\leq,\\ll)$ be the precausality generated by a family $(\\U_i,\\leq^i,\\ll^i)_{i\\in I}$.\nIf the precausalities $(\\leq^i,\\ll^i)$ are absolutely minimal, then so is $(\\leq,\\ll)$.\n\\end{lem}"},{"id":"theo:causalite_engendre","block":"ETT.tex:230:363","kind":"theorem","num":"","title":"","bucket":"B","lean":"partial","nl":"proved","line":514,"deps":["lem:union_causalite","lem:precausalite_engendre_minimale","defi:causalite"],"decls":["Causal.Causality.generated_isAbsolutelyMinimal_and_causallyPlain","Causal.Causality.generated","Causal.Causality.generated_absolutelyMinimal","Causal.Causality.generated_causallyPlain","Causal.Causality.mem_closure_Iplus_of_le_of_lt"],"ndecls":5,"findings":["Hypothesis (C), M is a Baire space, is not needed, nor is the reduction to a countable index set.","The Baire argument does not go through as written. The sets J^+_{U_i}(A_{i,n}) are neither open nor closed in general, and the boundary of such a set may have non-empty interior, so the union of the boundaries is not a countable union of closed sets with empty interior.","The identity closure(union I^+_{U_i}(A_{i,n})) = closure(I^+_U(A)) is asserted with the sets A_{i,n} of the decomposition of J^+_U(A), which are causal iterates: a point of I^+_{U_i}(A_{i,n}) is reached by a causal chain followed by one chronological step, and is not in I^+_U(A) without push-up.","Another route proves the clause: J^+_U(A) cap U_i is its own causal future in U cap U_i, so local plainness applies to it directly; and the chronological future of a causal future lies in the closure of the chronological future, by absolute minimality of the charts, (B), and the fact that points are closed.","The statement takes M a topological space, and the proof uses that M is second countable: the hypothesis on M should be stated."],"notes":"Proved for a T1 space M, without hypothesis (C) and without countability. The statement says 'topological space'; its proof says 'since M is second countable'. For a Hausdorff M, which is what a topological spacetime is, the Lean statement has fewer hypotheses than the paper's. 'Is an absolutely minimal causality' needs no separation and no (B); the plainness clause uses T1 and (B).","twin":"","tex":"\\begin{theo} Let $M$ be a topological space and let $(\\U_i)_{i\\in I}$ be an open cover of $M$.\nAssume that\n\\begin{enumerate}[label=(\\Alph*)]\n\\item each $\\U_i$ is endowed with an absolutely minimal causality $(\\leq^i,\\ll^i)$;\n\\item for all $i,j\\in I$, the restrictions of $\\ll^i$ and $\\ll^j$ (resp. of $\\leq^i$ and $\\leq^j$) to $\\U_i\\cap \\U_j$ are equal;\n\\item $M$ is a Baire space.\n\\end{enumerate}\nThen the precausality generated by the family $(\\U_i,\\leq^i,\\ll^i)$ is an absolutely minimal causality.\n\nIf moreover each $(\\leq^i,\\ll^i)$ is causally plain, then so is the generated causality.\n\\end{theo}"},{"id":"lem:pushup_local","block":"ETT.tex:230:363","kind":"lemma","num":"","title":"Push-up is local","bucket":"A","lean":"closed","nl":"proved","line":557,"deps":["rem:cac_local"],"decls":["Causal.Causality.CausallyArcConnected.pushUp","Causal.Causality.PushUpOn"],"ndecls":2,"findings":[],"notes":"No `sorry`. The parameter s of the one-step claim is taken in ]0,1[, so the case 'y = z'' does not occur.","twin":"","tex":"\\begin{lem}[Push-up is local]\nLet $M$ be a causally arc-connected topological spacetime and let $(\\U_i)_{i\\in I}$ be a cover of $M$\nby open subsets each having the push-up property. Then $M$ has the push-up property.\n\\end{lem}"},{"id":"prop:GX_espace_temps_topo","block":"ETT.tex:230:363","kind":"proposition","num":"","title":"","bucket":"B","lean":"partial","nl":"proved","line":589,"deps":["ex:open_subset","rem:cac_local","cor:causalement_connexe_minimal","theo:causalite_engendre"],"decls":["Causal.existsUnique_causality_GX_maximal","Causal.chartIso_of_mem_maximalAtlas","Causal.existsUnique_causality_GX_of_covering_chart","Causal.eq_of_chartIso_of_source_eq_univ","Causal.GX_maximal_not_unique","Causal.existsUnique_causality_GX","Causal.gxPregroupoid","Causal.gxGroupoid","Causal.ChartIso","Causal.chartIso_iff_strongMorphism","Causal.Causality.chartTransport","Causal.Causality.chartTransport_chartIso"],"ndecls":20,"findings":["ETT.tex:592-594, uniqueness, under DEC-16's maximal atlas: FALSE as stated in the library's reading, TRUE outright when some chart of the maximal atlas covers M. Counterexample (GX_maximal_not_unique): M = ℝ ⊔ ℝ, X = ℝ with the timelike line, G = translations. Every chart of the maximal atlas is, along each copy, a single translation onto ℝ, so none is injective on all of M (twoLines_source_ne_univ). The absolutely minimal causality C has ¬ (inl 1 ≤_M inl 0) (twoLines_not_le), and C.topEnlarge (≤_M enlarged to all pairs, non-local by kb/0014) still makes every chart of the maximal atlas an isomorphism, since no chart sees M itself. The defect is in the claimed equivalence of the 'Equivalently' form of defi:causalite (ETT.tex:237, implemented without gluing) with the sheaf form, not in the proposition: under gluing (≤ generated by covers, i.e. absolute minimality) uniqueness holds, which is what the proof's last sentence ('minimality gives uniqueness', ETT.tex:613) establishes (existsUnique_causality_GX_maximal). The earlier interval witness (GX_not_unique_without_minimality) used a non-maximal atlas and disappears under DEC-16, the identity of ℝ forcing timelikeLine (eq_of_chartIso_refl). Not settled: connected M covered by no chart (e.g. a cylinder); on the timelike circle ≤_M is already total, so the enlargement there changes nothing.","ETT.tex:606-608, hypothesis (B): 'transition maps are restrictions of elements of G, hence the transported causalities agree on overlaps' is immediate only if each transition is the restriction of ONE element of G on the whole overlap. In the usual definition the element is constant only on components (or, in the groupoid reading, only locally), and then agreement on an open subset of the overlap needs a relation there to be a chain of local relations: absolute minimality of the model on every open subset, which (A)'s argument (rem:cac_local + cor:causalement_connexe_minimal) supplies. Lean: compatible_of_agree_locally.","ETT.tex:609-611, (C): the Baire property of X and its locality are not needed (OQ-10).","Analyticity of (G,X) is used nowhere in the proof.","The produced causality is, by construction, the one generated by the transported chart causalities (Causality.generated); cor:massA_cac (ETT.tex:1408-1416) relies on this, and it is what the Lean existence witness is."],"notes":"No `sorry` beneath the strict part. Existence and the chart condition over the maximal atlas (DEC-16), uniqueness among absolutely minimal causalities, and outright when a chart covers M; uniqueness as stated fails on ℝ ⊔ ℝ in the library's gluing-free reading (kb/0014). WP-8, audited twice.","twin":"","tex":"\\begin{prop} Let $(G,X)$ be an analytic structure and let\n$(M,\\A)$ be a $(G,X)$-manifold.\n\nIf $X$ is a causally arc-connected Baire topological spacetime on which $G$ acts by morphisms of topological spacetimes,\nthen $M$ admits a unique topological spacetime structure such that for every chart $(\\U,\\V,\\phi)\\in\\A$\nthe map $\\phi:\\U\\rightarrow \\V$ is an isomorphism of topological spacetimes.\n\\end{prop}"},{"id":"prop:GX_sing_espace_temps_topo","block":"ETT.tex:230:363","kind":"proposition","num":"","title":"","bucket":"B","lean":"partial","nl":"proved","line":616,"deps":["prop:GX_espace_temps_topo","theo:causalite_engendre","rem:cac_local","cor:causalement_connexe_minimal"],"decls":["Causal.existsUnique_causality_singularGX","Causal.ModelIso","Causal.ModelIso.rel_iff","Causal.ChartIso.agreeOn_of_modelIso","Causal.ChartIso.agreeOn_of_regular","Causal.causality_singularGX_line","Causal.ChartIso.agreeOn_of_localIso","Causal.chartIso_refl_restrOpen","Causal.linePos","Causal.lineLow"],"ndecls":10,"findings":["ETT.tex:628-632: the second half of (b) ('extends the natural causality of reg(X_α)') is needed at (B) and not cited there. The proof cites (a) and (b) for (A), where causal arc-connectedness of X_α suffices, and cites only 'restrictions of elements of G and of isomorphisms of the model spaces' for (B). The transitions between a chart into X and a chart into X_α are neither; they are (G,X)-charts of reg(X_α) composed with elements of G, and agreement across them is exactly (b)'s second half (Lean: agreeOn_of_regular).","Uniqueness: as for prop:GX_espace_temps_topo, false in the gluing-free 'Equivalently' form, true under the gluing reading (absolute minimality).","(C) Baire not needed (OQ-10); analyticity not used.","'Analytic singular structure', '(G,X,X_A)-manifold', reg(X_α) and its (G,X)-structure are used but not defined in this paper (cited to the thesis).","Non-vacuity: causality_singularGX_line states the hypotheses of existsUnique_causality_singularGX, instantiated, as conjuncts, for M = ℝ with two model spaces, a regular chart with target ]0,∞[ ≠ X, one X-chart on ]0,∞[ and two Y-charts on ]-∞,1[ (overlaps ]0,1[ and ]-∞,1[), and proves the produced causality is the timelike line."],"notes":"No `sorry` beneath the strict part. Proved for abstracted data (model spaces as hypotheses, local isomorphisms between them), over the given atlas; the hypotheses are instantiated on a line with two models. WP-8, audited twice.","twin":"","tex":"\\begin{prop} Let $(G,X,X_A)$ be an analytic singular structure and\nlet $(M,\\A)$ be a $(G,X,X_A)$-manifold. Assume moreover that\n\\begin{enumerate}[label=(\\alph*)]\n\\item $X$ is a causally arc-connected Baire topological spacetime on which $G$ acts by morphisms of topological spacetimes;\n\\item for every $\\alpha \\in A$, the model space $X_\\alpha$ is a causally arc-connected topological spacetime whose causality extends the natural causality of $\\reg(X_\\alpha)$ given by its $(G,X)$-manifold structure.\n\\end{enumerate}\nThen $M$ admits a unique topological spacetime structure such that for every chart $(\\U,Y,\\V,\\phi)$ of $\\A$\nthe homeomorphism $\\phi:\\U\\rightarrow \\V$ is an isomorphism of topological spacetimes.\n\\end{prop}"},{"id":"rem:hypotheses_proposition_prop_gx","block":"ETT.tex:230:363","kind":"remark","num":"","title":"","bucket":"C","lean":"partial","nl":"informal","line":635,"deps":["prop:GX_sing_espace_temps_topo"],"decls":["Causal.strongMorphism_of_gxMorphism","Causal.strongMorphism_of_locally"],"ndecls":2,"findings":["'Branched (G,X)-morphism' is not defined in the paper and the remark gives no proof. Proved for unbranched maps at regular points only: an open continuous map which reads, near every point, in charts into X, as an element of G is a strong morphism when the source causality is absolutely minimal (strongMorphism_of_gxMorphism; general form strongMorphism_of_locally). At singular and branch points the argument says nothing."],"notes":"No `sorry` beneath the strict part. Proved for unbranched maps at regular points only: a map reading in charts as an element of G is a strong morphism when the source causality is absolutely minimal. WP-8, audited twice.","twin":"","tex":"\\begin{rem} Under the hypotheses of Proposition \\ref{prop:GX_sing_espace_temps_topo}, every\nbranched $(G,X)$-morphism is a morphism of topological spacetimes.\n\\end{rem}"},{"id":"def:alexandrov_topology","block":"ETT.tex:230:645","kind":"definition","num":"","title":"Alexandrov topology","bucket":"A","lean":"closed","nl":"definition","line":649,"deps":[],"decls":["Causal.Causality.alexandrovTopology"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Alexandrov topology]\\index{Topology!Alexandrov} Let $M$ be a topological spacetime.\nThe Alexandrov topology on $M$ is the topology generated by the open diamonds of $M$.\n\\end{defi}"},{"id":"def:causal_spacetime","block":"ETT.tex:230:645","kind":"definition","num":"","title":"Causal spacetime","bucket":"A","lean":"closed","nl":"definition","line":653,"deps":[],"decls":["Causal.Causality.IsCausal"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Causal spacetime]\\index{Causal!spacetime}\nA topological spacetime is causal if the relation $\\leq_M$ is an order relation on $M$.\n\\end{defi}"},{"id":"defi:convexite_causale","block":"ETT.tex:230:645","kind":"definition","num":"","title":"Causal convexity","bucket":"A","lean":"closed","nl":"definition","line":657,"deps":[],"decls":["Causal.Causality.CausallyConvexIn"],"ndecls":1,"findings":[],"notes":"Defined for every subset V of the open U; the paper's definition is the case V open.","twin":"","tex":"\\begin{defi}[Causal convexity]\\index{Causally!convex}Let $M$ be a topological spacetime and let $\\U,\\V$ be two open subsets of $M$ with $\\V\\subset\\U$.\nThe open set $\\V$ is {\\it causally convex in $\\U$} if for all $p,q\\in \\V$\nthe full diamond $J_\\U(p,q)$ is contained in $\\V$.\n\\end{defi}"},{"id":"def:strongly_causal_spacetime","block":"ETT.tex:230:645","kind":"definition","num":"","title":"Strongly causal spacetime","bucket":"B","lean":"partial","nl":"definition","line":662,"deps":[],"decls":["Causal.Causality.StronglyCausal","Causal.Causality.StronglyCausalOpen"],"ndecls":2,"findings":[],"notes":"Two forms are carried: `StronglyCausal` (V a neighbourhood) and `StronglyCausalOpen` (V open, the literal reading through defi:convexite_causale). Hypotheses use the first, conclusions the strongest form proved.","twin":"","tex":"\\begin{defi}[Strongly causal spacetime]\\index{Causal!strongly causal spacetime}\nLet $M$ be a topological spacetime. $M$ is strongly causal if\nfor every $p\\in M$ and every neighbourhood $\\U$ of $p$ there exists a neighbourhood $\\V\\subset \\U$ of $p$\nwhich is causally convex in $M$.\n\\end{defi}"},{"id":"rem:topological_spacetime_strongly_causal","block":"ETT.tex:230:645","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":667,"deps":[],"decls":["Causal.Causality.StronglyCausal.isCausal"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} Let $M$ be a topological spacetime. If $M$ is strongly causal then $M$ is causal.\n\\end{rem}"},{"id":"rem:galileo_spacetime_not_strongly","block":"ETT.tex:230:645","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":670,"deps":[],"decls":["Causal.galileoOn","Causal.galileo","Causal.galileoOn_isCausal","Causal.galileoOn_diamond_top","Causal.galileoOn_slab_subset","Causal.exists_before_after_of_mem_nhds","Causal.galileoOn_not_convex_basis","Causal.galileoOn_not_stronglyCausal","Causal.galileo_not_stronglyCausal","Causal.galileoOn_stronglyCausal_of_subsingleton","Causal.galileo_zero_stronglyCausal","Causal.minkowski_stronglyCausal"],"ndecls":14,"findings":["ETT.tex:273 / 670: Galileo's spacetime R^{n+1} is written with n unrestricted; for n = 0 it is the timelike line, which is strongly causal (galileo_zero_stronglyCausal; also timelikeLine_stronglyCausal in Causal.Lines). The remark holds for n ≥ 1 only.","ETT.tex:274-275: 'p ≤_U q if p ≪_U q or p = q' needs p ∈ U in the second case (relations of a causality on U hold between points of U); carried so.","ETT.tex:672-673: the last sentence (flat model spacetimes are strongly causal) is about the model spaces of subsec:sing_spacetime_defi, absent from the library; not stated.","The sentence 'the flat model spacetimes ... are strongly causal' (l.672-674) holds for Minkowski space: the vertical diamonds J((t-e,x),(t+e,x)) are causally convex and lie in the closed e-ball (stronglyCausal)."],"notes":"Galileo's spacetime is not strongly causal for n ≥ 1 (false for n = 0); Minkowski space and E_α (α > 0) are strongly causal. (WP-2, WP-9, audited)","twin":"","tex":"\\begin{rem} Galileo's spacetime is not strongly causal: if a causally convex open set contains two\npoints with distinct times $t_0<t_1$ --- and every non-empty open set does --- then it contains the\nwhole slab $\\{t_0<t<t_1\\}$, so no point has a basis of causally convex neighbourhoods. The flat\nmodel spacetimes of Section \\ref{subsec:sing_spacetime_defi} are, by contrast, strongly causal.\n\\end{rem}"},{"id":"def:tarentin_spacetime","block":"ETT.tex:230:645","kind":"definition","num":"","title":"Tarentin spacetime","bucket":"A","lean":"closed","nl":"definition","line":677,"deps":[],"decls":["Causal.Causality.Tarentin"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Tarentin spacetime]\\index{Tarentin}\nA topological spacetime $M$ is tarentin if for every $x\\in M$ and every neighbourhood $\\U$ of $x$\nthere exist $p,q\\in \\U$ such that $x\\in \\mathrm{Int}\\left(J_M(p,q)\\right)$.\n\\end{defi}"},{"id":"rem:terminology_borrowed_archytas_tarentum","block":"ETT.tex:230:645","kind":"remark","num":"","title":"","bucket":"","lean":"none","nl":"informal","line":681,"deps":[],"decls":[],"ndecls":0,"findings":["ETT.tex:684-685: read weakly (p ≤ x ≤ q with p, q in any neighbourhood, p = x allowed) the gloss 'has a future and a past' is the definition; read as J^-(x) ≠ {x} and J^+(x) ≠ {x} it does not follow from tarentin. Lean evidence for non-local causalities only (kb/0014, kb/0019): Causal.no_past_not_enough (radialLine on ℝ, built with Causality.ofRelation; it is tarentin at 0 only because its relation crosses the origin). For the paper's local causalities the finding rests on a planar argument (the auditor's, by hand, not formalized): on ℝ² let x ≤_U y iff x = y or a curve in U along which |·| strictly increases joins them, and x ≪_U y iff such a curve does; it is causally arc-connected, hence absolutely minimal, causal, and tarentin (at 0 take p = 0, |q| = ε/2, so J(0,q) contains the open disc of radius ε/2; at x ≠ 0 take p = (1-t)x, q = (1+t)x), with J^-(0) = {0} and J^+(0) = ℝ²."],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Not attempted. No mathematical assertion: etymology (Archytas) and a gloss of def:tarentin_spacetime; no declaration of its own.","twin":"","tex":"\\begin{rem}\nThe terminology is borrowed from Archytas of Tarentum, who asked whether an observer standing at\nthe outermost edge of the heaven could extend a hand or a staff beyond it. We read the condition\nas the assertion that every observer may ``hold out a staff'' both into the future and into the\npast --- that is, has a future and a past.\n\\end{rem}"},{"id":"rem:tarentin_exemples","block":"ETT.tex:230:645","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":688,"deps":["rem:sing_tarentin","cexemple:misner_tarentin"],"decls":["Causal.tarentin_exemples","Causal.minkowski_tarentin","Causal.massive_tarentin","Causal.Cau
