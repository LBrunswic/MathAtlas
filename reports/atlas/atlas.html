pic","GX.freeHomotopic_of_pHomotopic"],"ndecls":6,"findings":["'left to the reader' (l.1383): proof supplied"],"notes":"WP-40a, audited clean. Readings/questions: Readings (e), (f), accepted by DEC-56.","twin":"","tex":"\\begin{prop} \n Let $Y$ be a first countable connected locally path-connected Hausdorff topological space and let $S\\subset Y$ skeletal such  that $Y\\setminus S$ is semi-locally simply connected. Let $a\\in Y\\setminus S$ and let $\\U\\subset Y$ be open and connected.   Denote $\\widetilde Y^S\\xrightarrow{p} Y$ the maximal cover of $Y$ possibly branched over~$S$. Define\n$\\pi_1(a,\\U)$ the set of paths with fixed start at $a$ and free end in $\\U$ up to homotopy.\n\nThen, for all $b\\in Y$ and all connected neighborhood basis $\\boldsymbol \\U$ of $b$ we have \n  $$ p^{-1}(b) \\simeq \\varprojlim_{\\U\\in \\boldsymbol\\U} \\pi_1(a,\\U)$$\n  where the projective system is given by the natural maps $\\pi_1(a,\\U)\\rightarrow \\pi_1(a,\\V)$  for $\\U\\subset \\V$.\n\\end{prop}"},{"id":"ex:consider_fiber_above_homeomorphic","block":"RamcovGX.tex:813:1189","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1409,"deps":["prop:general_fiber_path_universal"],"decls":["GX.fiber_above_homeomorphic","GX.fibS","GX.fibD","GX.isSkeletal_fibS","GX.semilocallySimplyConnected_fibS","GX.fibS_tower","GX.countable_piOneU_fibD","GX.infinite_fiber_piOneUMap_fibD","GX.argLift_freeHomotopic","GX.towerHomeomorph","GX.prodNatPiHomeomorph","GX.not_locallyCompactSpace_nat_pi"],"ndecls":12,"findings":["l.1414: 'the natural map pi_1(a,D_{n+1}) -> pi_1(a,D_n) has an infinite fiber above every point' is asserted without proof; it is supplied","l.1415: 'the result follows' also needs the sets pi_1(a,D_n) countable and pi_1(a,D_1) countable nonempty; the limit is pi_1(a,D_1) x N^N, homeomorphic to Z^N","l.1409: 'answers positively Problem 10.8 of MR2198590' is bibliographic and not formalized"],"notes":"WP-40a, audited clean.","twin":"","tex":"\\begin{ex} Consider $Y = \\RR^2$ and $S=\\{(\\frac{1}{n},0)~:~n\\in \\N^*\\cup\\{\\infty\\}\\}$. The fiber above  $(0,0)$ in $\\widetilde Y^S$ is homeomorphic to $\\mathbb Z^\\N$ endowed with the weak topology; hence is not locally compact. This answers positively Problem 10.8 of \\cite{MR2198590}.\n\\end{ex}"},{"id":"def:automorphisms_spread","block":"RamcovGX.tex:813:1417","kind":"definition","num":"","title":"Automorphisms of a spread","bucket":"A","lean":"closed","nl":"definition","line":1420,"deps":[],"decls":["GX.deckStab","GX.deckSetStab","GX.deckToSpreadIso"],"ndecls":3,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{defi}[Automorphisms of a spread] Let $X\\xrightarrow{p} Y$ be a spread, an automorphisms of $p$ is an homeomorphism $\\varphi$ of $X$ such that $p\\circ \\varphi = p$. \nDenote by  $\\Gamma(X/Y)$ the group of spread automorphisms of $X$ above $Y$. \nWe also denote by $\\Gamma_x$ the stabilizer of $x$ if $x\\in X$ and by $\\Gamma_\\U$ the set-wise stabilizer of $\\U$ if $\\U$  is a subset of $X$.\n\\end{defi}"},{"id":"def:branched_covering_galoisian_group","block":"RamcovGX.tex:813:1417","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1426,"deps":[],"decls":["GX.IsDeckTransitive","GX.IsGaloisian","GX.IsQuasiGaloisian","GX.isQuasiGaloisian_iff","GX.isQuasiGaloisian_of_isSpreadCompletion"],"ndecls":5,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{defi} A branched covering $X\\xrightarrow{p} Y$ is Galoisian if the group $\\Gamma(X/Y)$ of automorphism of $p$ acts transitively on the fibers of $p$. It is called quasi-Galoisian if $p$ is the completion of a Galoisian covering.  \n\n\\end{defi}"},{"id":"rem:galois_quotient","block":"RamcovGX.tex:813:1417","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1431,"deps":[],"decls":["GX.galois_quotient","GX.subgroupOrbitSetoid","GX.HomeoQuotient","GX.homeoQuotientMk","GX.exists_homeomorph_homeoQuotient"],"ndecls":5,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{rem} If a branched covering $X\\xrightarrow{p} Y$ is Galoisian then $p$ induces an homeomorphism $\\Gamma(X/Y)\\backslash X \\rightarrow Y$. \n\\end{rem}"},{"id":"lem:branched_covering_group_automorphisms","block":"RamcovGX.tex:813:1417","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1435,"deps":[],"decls":["GX.deckRestrict","GX.deckRestrictEquiv","GX.branched_covering_group_automorphisms","GX.exists_deck_extend"],"ndecls":4,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{lem} Let $X\\xrightarrow{p} Y$ be a branched covering, the group of automorphisms of $p$ is exactly the group of automorphisms of the induced branched covering $p^{-1}(\\U) \\rightarrow \\U$ for any $\\U$ portly in $Y$:\n$$\\Gamma(X/Y) = \\Gamma(p^{-1}(\\U)/\\U).$$\n\\end{lem}"},{"id":"cor:branched_covering","block":"RamcovGX.tex:813:1417","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1441,"deps":[],"decls":["GX.deckOrdEquiv"],"ndecls":1,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{cor}Let $X\\xrightarrow{p} Y$ be a branched covering, then\n $$\\Gamma(X/Y) =  \\Gamma(\\ord(X)/\\ord(Y)).$$\n\\end{cor}"},{"id":"def:semi_locally_simple_connectedness","block":"RamcovGX.tex:813:1417","kind":"definition","num":"","title":"semi-locally simple connectedness","bucket":"A","lean":"closed","nl":"definition","line":1451,"deps":[],"decls":["GX.IsSLSCAtCC","GX.IsSLSCInCC","GX.isSLSCInCC_iff","GX.IsSLSCAt","GX.IsSLSCIn"],"ndecls":5,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{defi}[semi-locally simple connectedness] Let $X$ be a Hausdorff, connected, locally path-connected topological space.  We say that an open subset $\\U$ is semi-locally simply connected at $x \\in \\overline \\U$ if there exists a connected open neighborhood $\\V$ of $x$ such that every loop $\\gamma$ of $\\Omega(x,x,\\V\\cap \\U)$ seen as an element of $\\Omega(x,x,\\U)$ is almost trivial . \n\n$\\U$ is then semi-locally simply connected in $X$ if $\\U$ is dense and semi-locally simply connected at every point of $X$\n\\end{defi}"},{"id":"rem:definition_semi_locally_simply_connected","block":"RamcovGX.tex:813:1417","kind":"remark","num":"","title":"","bucket":"C","lean":"partial","nl":"informal","line":1455,"deps":[],"decls":["GX.isSLSCInCC_univ_of_semilocallySimplyConnected","GX.isSLSCIn_univ_of_semilocallySimplyConnected","GX.harmonicArchipelago_counterexample","GX.not_semilocallySimplyConnected_of_isSLSCInCC_univ","GX.HarmonicArchipelago","GX.harmonicArchipelago_isSLSCInCC","GX.harmonicArchipelago_isSLSCIn","GX.harmonicArchipelago_isSLSCAt_base","GX.harmonicArchipelago_isSLSCAt_pt","GX.harmonicArchipelago_not_semilocallySimplyConnected","GX.archLoop_not_homotopic","GX.archLoop"],"ndecls":17,"findings":["RamcovGX.tex:1455-1457: 'X is semi-locally simply connected iff it is semi-locally simply connected in itself' holds only in the direction slsc ⇒ slsc in itself (GX.isSLSCInCC_univ_of_semilocallySimplyConnected, literal DEC-55 form; the corrected statement). The converse is false, now FORMALIZED (DEC-27): GX.not_semilocallySimplyConnected_of_isSLSCInCC_univ refutes the printed 'iff' over all Hausdorff, connected, locally path-connected X, with witness GX.harmonicArchipelago_counterexample.","The harmonic archipelago is built as the graph over the open half-plane Re z > 0 (coordinate w = 1/z; the Hawaiian-earring circles Re w = k/2 pass through the base point 0) of h(w) = sin²(2π Re w)/(1 + (Im w)²), plus the base point. Slsc in itself: every loop at the base point is homotopic rel ends into any neighbourhood (GX.archPush pushes the hills Re w < n onto the circle Re w = n; a compact loop climbs no far hill, GX.arch_compact_bound); off the base point the space is a surface (radial contraction through the chart GX.isOpenEmbedding_archPt). Not slsc: the loops Re w = N/2 (GX.archLoop, inside the 2/N-ball) are not null-homotopic (GX.archLoop_not_homotopic): a null-homotopy has compact image, misses the summit (1/c, 1), c = M/2 + 1/4, of a far hill, and off that summit GX.archF : 𝔸 → ℂ ∖ {0} is continuous and carries the loop to a loop of winding number 1 (GX.cWinding of GX.Branched.Paths).","The space formalized is NOT compact (the summits accumulate at the missing point (0,1)), so it is not a 'Peano continuum' as WP-27e's report and the WP-35b dispatch call it; compactness is not needed for the counterexample, and the remark's hypotheses (Hausdorff, connected, locally path-connected) are all proved. No compact variant is formalized. The row stays partial as a corrected statement (no ruling accepts the one-directional form)."],"notes":"WP-35b, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: Is the non-compact archipelago acceptable as the recorded counterexample, or is a compact (Peano continuum) one wanted? The remark's standing hypotheses do not ask for compactness.","twin":"","tex":"\\begin{rem}\n The definition of semi-locally simply connected is coherent with the usual definition of semi-locally simply connected. Indeed a topological space $X$ is semi-locally simply connected if and only if it is semi-locally simply connected in  itself.\n\\end{rem}"},{"id":"rem:simple_cases","block":"RamcovGX.tex:813:1417","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1459,"deps":[],"decls":["GX.isSLSCInCC_of_locally_linear","GX.isSLSCInCC_compl_submodule","GX.isSLSCInCC_univ_of_normedSpace","GX.isSLSCInCC_compl_faces_of_locallyFinite","GX.isSLSCInCC_compl_faces","GX.isSLSCAtCC_of_radial_contraction","GX.isSLSCInCC_of_local_nhds","GX.isSLSCInCC_of_local","GX.AlmostTrivialCC.map","GX.isSLSCAtCC_of_subtype","GX.dense_of_local_subtype","GX.isSLSCIn_compl_submodule"],"ndecls":20,"findings":["RamcovGX.tex:1462: the codimension ≥ 2 condition is not needed for semi-local simple connectedness in X: for any closed proper linear subspace L of ℝⁿ (codimension 1 included) ℝⁿ ∖ L is slsc in ℝⁿ by radial contraction (GX.isSLSCInCC_compl_submodule); the codimension condition only matters for U being connected / X∖U skeletal.","RamcovGX.tex:1465: 'then U is locally simply connected at every point of X' is read as 'semi-locally simply connected at every point of X' (the notion just defined).","RamcovGX.tex:1462: the simplicial case needs no dimension condition either: for a locally finite simplicial complex K and S a union of closed faces with |K|∖S dense, |K|∖S is slsc in |K| by radial contraction inside the closed star of the base point (GX.isSLSCInCC_compl_faces_of_locallyFinite)."],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{rem}  Using the same notations as in the definition above, there are generic situations in which dense open subsets are semi-locally simply connected at every point of the whole space.\n\\begin{itemize}\n \\item If $X$ is a manifold and $X\\setminus \\U$ is a codimension at least 2 submanifold, more generally if $X$ is a simplicial complex and $X\\setminus \\U$ is a union of facets (such that $\\U$ is still dense and locally connected);\n \\item  or if $X$ admits a basis of neighborhoods such that for each $\\V$ of said basis, $\\V\\cap \\U$ is semi-locally simply connected in $\\V$;\n\\end{itemize}\nthen $\\U$ is locally simply connected at every point of $X$. \n\\end{rem}"},{"id":"lem:dense_orbits","block":"RamcovGX.tex:813:1417","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1469,"deps":["prop:spread_fiber"],"decls":["GX.dense_orbits","GX.fiberOrbit","GX.exists_mem_nhds_of_transitive","GX.dense_fiberOrbit_of"],"ndecls":4,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{lem}\n Let $X\\xrightarrow{p} Y$ be a quasi-galoisian branched covering. Let $a\\in Y$ and $\\hat a \\in p^{-1}(a)$, the orbit  $\\Gamma(X/Y)\\hat a$  is dense in $p^{-1}(a)$.\n\\end{lem}"},{"id":"prop:Galoisian_fiber","block":"RamcovGX.tex:813:1417","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1478,"deps":["prop:spread_fiber"],"decls":["GX.galoisian_fiber","GX.GaloisThread","GX.GaloisCoset","GX.galoisMk","GX.galoisComp","GX.deckSetStab_mono","GX.galoisThreadHomeomorph","GX.galoisThreadToFiber"],"ndecls":8,"findings":["RamcovGX.tex:1488: 'Γ(X/Y) acts transitively on the connected components of p⁻¹(U) for every open U' is false for disconnected U (components over different components of U); true, and what the proof needs, for connected open U (GX.IsQuasiGaloisian.exists_image_eq)."],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{prop}\n  Let $X\\xrightarrow{p} Y$ be a quasi-Galoisian branched covering possibly branched over $S\\subset Y$.\n  \n  For all $b\\in Y$ and all connected neighborhood basis $(\\U_i)_{i\\in I}$ of $b$ we have \n  $$ p^{-1}(b) \\simeq \\varprojlim_{i\\in I} \\Gamma(X/Y)/\\Gamma_{\\hat\\U_i} $$\n  where $\\hat\\U_i$ is the connected component of $\\hat b$ in $p^{-1}(\\U_i)$ for $i\\in I$.\n  \n\\end{prop}"},{"id":"lem:alternative_countable","block":"RamcovGX.tex:813:1417","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1492,"deps":["lem:dense_orbits"],"decls":["GX.alternative_countable","GX.discreteTopology_fiber_of_countable","GX.isCompletelyMetrizableSpace_fiber","GX.exists_isOpen_singleton_of_countable","GX.exists_countable_isCNbhd_basis","GX.exists_eq_of_discreteTopology_fiber"],"ndecls":6,"findings":[],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{lem} \n Let $X\\xrightarrow{p} Y$ be a quasi-Galoisian branched covering possibly branched over $S\\subset Y$ and let $b\\in Y$. \n \n Assume that $\\Gamma(X/Y)$ is countable, then the following are equivalent:\n \\begin{enumerate}[(i)]\n  \\item $p^{-1}(b)$ is discrete;\n  \\item $p^{-1}(b)$ is countable;\n  \\item $\\Gamma(X/Y)$ acts transitively on $p^{-1}(b)$.\n \\end{enumerate}\n\n\\end{lem}"},{"id":"prop:Galoisian_semilocal","block":"RamcovGX.tex:813:1417","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1514,"deps":["lem:alternative_countable","lem:complete_path_carac","prop:spread_fiber","cor:spread_connected_image"],"decls":["GX.galoisian_semilocal_cc","GX.maxBranched_isGaloisian_cc","GX.galoisian_semilocal","GX.maxBranched_isGaloisian","GX.isSLSCInCC_iff","GX.discreteTopology_fiber_of_isSLSCAt","GX.isSLSCAt_of_discreteTopology_fiber","GX.maxBranched_isQuasiGaloisian","GX.maxBranched_transitive","GX.countable_deck_maxBranched","GX.discreteTopology_fiber_maxBranched"],"ndecls":11,"findings":["RamcovGX.tex:1524: the proof of (ii) ⇒ (i) writes Ω(y, ord(Y)) where (ii) is about Y ∖ S; the argument goes through with paths whose interior lies in p⁻¹(Y∖S) (GX.discreteTopology_fiber_of_isSLSCAt).","RamcovGX.tex:1536: the proof of (i) ⇒ (ii) lifts a loop γ ∈ Ω(y,U) from the possibly singular point y, where lifts are neither guaranteed nor unique; the formal proof lifts the two halves of γ from its midpoint γ(1/2) ∈ Y∖S and applies lem:almost_homotopic_carac2 (GX.isSLSCAt_of_discreteTopology_fiber)."],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{prop} \nLet $Y$ be a connected, locally path-connected, second countable, Hausdorff topological space and let $S\\subset Y$ skeletal such that $Y\\setminus S$ is semi-locally simply connected.\nLet $\\widetilde Y^S\\xrightarrow{p} Y$ be the maximal covering of $Y$ possibly branched  above $S$. The following are equivalent:\n\\begin{enumerate}[(i)]\n\\item $\\widetilde Y^S\\xrightarrow{p} Y$  is Galoisian;\n  \\item $Y\\setminus S$ is semi-locally simply connected in $Y$;\n\\end{enumerate}\n\\end{prop}"},{"id":"theo:Galois_cor","block":"RamcovGX.tex:813:1417","kind":"theorem","num":"","title":"Galois correspondance","bucket":"A","lean":"closed","nl":"open","line":1550,"deps":[],"decls":["GX.galois_correspondence_cc","GX.galois_correspondence","GX.maxBranched_isGaloisian_cc","GX.maxBranched_isGaloisian","GX.galois_cor_quotient","GX.galois_cor_normal","GX.discreteTopology_fiber_maxBranched_of_isSLSCIn","GX.eq_of_comp_eq_of_mem_portly","GX.deck_eq_of_apply_eq","GX.isSLSCInCC_iff","GX.harmonicArchipelago_compl_empty"],"ndecls":11,"findings":["RamcovGX.tex:1551-1553: the statement omits 'Y ∖ S semi-locally simply connected', the hypothesis of prop:universality under which the maximal covering Ỹ^S exists. Carried under DEC-70 (the row closes); the omission stays recorded. 'Y ∖ S semi-locally simply connected in Y' does not imply it, now formally: GX.harmonicArchipelago_compl_empty (Y = GX.HarmonicArchipelago: connected, LPC, T2, first countable; S = ∅ skeletal; Y ∖ S slsc in Y in both forms; Y ∖ S not semi-locally simply connected).","RamcovGX.tex:1548: 'a direct consequence of Propositions prop:Galoisian_semilocal and prop:universality' silently drops second countability, which prop:Galoisian_semilocal assumes. The theorem holds without it: (ii) ⇒ (i) of prop:Galoisian_semilocal does not use countability (discrete fibres + dense orbits give transitivity, GX.maxBranched_isGaloisian). The second and third assertions need an argument the paper does not give: H is the automorphism group of the universal map Φ : Ỹ^S → X, which acts transitively on the Φ-fibres because they are discrete (subsets of the discrete fibres of Ỹ^S) and its orbits are dense (Φ is quasi-Galoisian through the ordinary part); normality ⇔ X Galoisian uses the uniqueness of maps over Y agreeing at one ordinary point (GX.eq_of_comp_eq_of_mem_portly). The normality equivalence is proved for every H with H\\\\Ỹ^S ≃ X over Y."],"notes":"WP-35b, audited clean.","twin":"","tex":"\\begin{thm}[Galois correspondance]\n Let $Y$ be a connected, locally path-connected Hausdorff topological space and let $S\\subset Y$ skeletal.\n Assume $Y\\setminus S$ is semi-locally simply connected in $Y$. \n \n Then the maximal covering $\\widetilde Y^S$ possibly branched over $S$ is Galoisian. \n\n Furthermore, every covering $X$ of $Y$ possibly branched over $S$ is isomorphic to the quotient of $\\widetilde{Y}^S$ by a subgroup of $\\Gamma(\\widetilde{Y}^S/Y)$. \n Finally, this subgroup is normal if and only if $X$ is Galoisian.\n\\end{thm}"},{"id":"ex:following_situations_semi_locally_simply","block":"RamcovGX.tex:813:1417","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1560,"deps":[],"decls":["GX.following_situations_semi_locally_simply","GX.IsConicalAt","GX.isConicalAt_empty","GX.IsConicalAt.union","GX.isConicalAt_biUnion","GX.isConicalAt_segment","GX.isSLSCIn_subtype_compl_of_isConicalAt","GX.isSLSCIn_compl_of_local_models","GX.isConicalAt_of_finite","GX.polygonalSet","GX.isConicalAt_polygonalSet","GX.dense_compl_segment"],"ndecls":46,"findings":["l.1564 (item 3) is false as written (a connected complex of dimension n with a maximal face of dimension <= n-2: GX.following_situations_simplicial_false); the corrected form accepted by DEC-68 (d) is proved.","l.1562 (item 1): n >= 2 is not needed; n >= 1 suffices (GX.following_situations_finite_euclidean).","l.1563 (item 2): neither dimension 3 nor being a knot is used: any locally polygonal closed set in a manifold of dimension >= 2 works."],"notes":"WP-41r, audited clean.","twin":"","tex":"\\begin{ex}  In the following situations,  $Y\\setminus S$ is semi-locally simply connected in $Y$ \n\\begin{enumerate}\n \\item $Y$ is a $n$-manifold with $n\\geq 2$ and $S$ is a finite subset;\n \\item $Y$ is a 3-manifold and $S$ is a tame knot.\n \\item $Y$ is a simplicial complex of dimension $n$ and $S$ is a $(n-2)$-skeleton.\n\\end{enumerate}\n\n \n\\end{ex}"},{"id":"ex:consider_denote_absolute_galois","block":"RamcovGX.tex:813:1417","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":1570,"deps":[],"decls":["GX.absolute_galois_corrected","GX.absGal_Y₂_fiber_cantor_corrected","GX.cant_fiber_isCantor","GX.cantFiberHomeo","GX.cant_isSpread_cantProj","GX.cantGamma","GX.mem_cantGamma_iff","GX.gamma2_le_cantGamma","GX.CantY₂","GX.cantFiber0","GX.cantPt","GX.cantPt_mem"],"ndecls":306,"findings":["l.1571, first claim, proved in the literal reading (DEC-55): C minus S is not semi-locally simply connected in C (GX.absGal_not_isSLSCInCC).","l.1572-1573 as printed is refuted (record, DEC-69): the printed Gamma_2 is Gamma; for the normal closure of the squares of the (lollipop) simple loops the fibre over 0 is not compact (GX.absGal_Y₂_fiber_not_cantor_simple).","l.1572-1573 corrected (DEC-69), PROVED sorry-free: for Gamma_2' = kernel of the mod-2 windings around the 1/n the fibre above (0,0) of Y_2' is a Cantor set (GX.absGal_Y₂_fiber_cantor_corrected). Proof: square roots s_n of p - 1/(n+1) on the universal cover; deck signs eps_n = (-1)^winding; over D_k the components of the preimage are exactly the 2^k sign classes of sigma_0..sigma_{k-1} (GX.cantZ_comp), the hard half realising every eventually constant sign pattern (eventual constancy: a loop stays away from 0, GX.cant_eps_eventually) by small circles around the 1/(n+1), n >= k, and the circle of radius R_k around 0, inside D_k; ends over 0 = sign sequences, a continuous bijection from the compact {0,1}^N onto the Hausdorff fibre.","l.1573: 'This answers positively Problem 10.7 of MR2198590' is bibliographic and not formalized; with the corrected Gamma_2' the example does exhibit a Cantor fibre over a point of the branching locus."],"notes":"WP-41r, audited clean. Readings/questions: Is the bibliographic sentence 'answers positively Problem 10.7 of MR2198590' (l.1573) outside the row's certification, as taken here (row closed under DEC-69)? If the master reads it as an assertion, downgrade to partial.","twin":"","tex":"\\begin{ex} Consider $Y = \\RR^2$ and $S=\\{(\\frac{1}{n},0)~:~n\\in \\N^*\\cup\\{\\infty\\}\\}$ and denote by $\\Gamma$ the absolute Galois group $\\Gamma(\\widetilde Y^S/Y)$. We see that $Y\\setminus S$ is not semi-locally simply connected in $Y$.  \nLet $\\Gamma_2:=\\langle \\Gamma[\\gamma_n]^2\\Gamma~:~ n\\in \\N \\rangle$ where $\\gamma_n$ is a simple loop around $(1/n,0)$. Consider $Y_2$, the completion of the spread $\\Gamma_2\\backslash\\ord(\\widetilde Y^S) \\rightarrow Y$.\nThe fiber above $(0,0)$ in  $Y_2$ is  a Cantor set. This answers positively Problem 10.7 of \\cite{MR2198590}. \n\n\\end{ex}"},{"id":"ex:wild_cantor_general_antoine","block":"RamcovGX.tex:813:1417","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":1578,"deps":[],"decls":["GX.Sphere3","GX.greatCircle3","GX.IsCantorSubset","GX.IsWildCantor","GX.not_isSLSCIn_of_essential","GX.IsLocallyNonseparating","GX.homotopicIn_of_simplyConnected","GX.isSLSCIn_compl_of_simplyConnected","GX.preconnectedSpace_sphere3","GX.sphere3_isSLSCIn_compl_of_simplyConnected","GX.sphere3_exists_nhds_loops_trivial","GX.sphere3Perp"],"ndecls":564,"findings":["Under DEC-58/DEC-68 (f) the example is about one explicit Antoine necklace, constructed, proved a Cantor set and (DEC-82) proved wild from the residual; the general wild-Cantor reading fails as soon as some wild Cantor set has simply connected, locally non-separating complement (GX.wild_cantor_claim_false_of_exists, proved).","l.1578: the conclusion does not depend on wildness; for the necklace it reduces (proved) to Antoine's lemma for the top link (GX.AntoineMeridianEssentialTop), at ONE point of S (the fixed point of g_0). Conversely wildness follows from the conclusion: the complement of a Cantor subset of a great circle (a tame Cantor set) IS semi-locally simply connected (GX.tameCantorSLSC, proved), so a Cantor set satisfying the conclusion is automatically wild.","WP-41r: Antoine's lemma for every generation is reduced, sorry-free, to its first generation (GX.antoineMeridianEssentialTop_of_firstGeneration): the classical van Kampen argument (incompressible boundary tori, amalgamated products) is formalized through a topological SvK theorem built for the purpose (GX.VanKampen.homotopicIn_of_homotopicIn_union', no path-connectedness of U, V needed) and mathlib's Monoid.PushoutI.of_injective; the induction must carry ALL powers of the meridian (the collar's injectivity on the tube side needs m^a non-null for every a != 0).","WP-41r round 1: the first generation is reduced, sorry-free, to its non-abelian heart (GX.antoineFirstGeneration_of_chain). The five collar facts are proved: the round tubes miss the other links (non-consecutive pairs box-separated by decide, consecutive ones by GX.antoine_tube_aux; the corner-diagonal pairs ARE box-separated once the tube's bounds are strict, so the round-tube argument is needed only for consecutive pairs); the base points are joined by explicit polygonal paths certified by decide; and the collar is path-connected, and is classified by two windings (GX.antoine_collar_classify, pi_1(T^2 x I) = Z^2 through a retraction onto the torus |W| = 3/14 and a straight-line homotopy of lifted angles), the longitudinal winding being read in S^3 \\ C_1 through the next link, around which the longitude of link j winds +-1 (GX.antoine_succ_wind, by free homotopies in C \\ 0, GX.AntoineLiftWind.of_freeHomotopy).","Hand computation (not formalized; recorded for the next package): the meridian of L is detected in S^3 \\ C_1 by a D_inf = Z/2 * Z/2 representation (a Fox Z-colouring of the necklace diagram), sending it to a translation of infinite order; so a METABELIAN invariant suffices at the first generation, while no fixed solvable invariant works for all generations (the meridian lies in the k-th derived subgroup of pi_1(S^3 \\ C_k)) -- which is why the reduction to the first generation is needed.","WP-41r round 2: Antoine's lemma at the first generation (GX.AntoineChainEssential) is proved with no Fox calculus and no presentation of pi_1: let P = prod over the 32 vertical links of Theta'_i (Theta_i or its conjugate on the sides y = -7/8, x = -7/8) and N the slab |tau| < 1e-4 around the sphere {z = 0} u {inf}, outside the closed holes of the 32 horizontal links. On N, R = chi * prod sqrt(Theta'_i) is a continuous square root of P (chi = -1 inside the core square): the principal roots are cut exactly in the 32 gaps of the chain, and there the side chi flips with them (sign(Im w) sqrt w = i sqrt(-w)); elsewhere chi is locally constant because in the slab the core square is covered by the closed holes and the gaps. The invariant exp(i pi (s/R) phi(tau)) on the double cover s^2 = P winds 2 along the meridian (it crosses the slab outside and inside the core square, on opposite sheets) and 0 along a null-homotopy. The closing of the chain enters exactly once: inside and outside of the core square meet in N only through the gaps; deleting link 8 opens a passage with no cut and R is no longer continuous, matching the fact that the meridian then bounds."],"notes":"WP-41r, audited clean.","twin":"","tex":"\\begin{ex} If $S$ is a  wild Cantor \\cite{general_antoine} embedded into $Y = \\SS^3$, then $Y\\setminus S$ is not semi-locally simply connected in $Y$.\n\\end{ex}"},{"id":"ex:Tame","block":"RamcovGX.tex:1610","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1616,"deps":[],"decls":["GX.tame_conical","GX.conicalDev_posEmb_div","GX.conicalPolar","GX.conicalDev_posEmb_eq_conicalPolar","GX.hasDerivAt_conicalPolar","GX.conicalPolar_metric","GX.tameCylMetric","GX.cylMetricForm","GX.cylMetricForm_apply","GX.cylMetricForm_comm","GX.cylMetricForm_self","GX.cylMetricForm_pos"],"ndecls":23,"findings":[],"notes":"WP-35c, audited clean.","twin":"","tex":"\\begin{ex} \n Let $n\\in \\N$ and $\\theta\\in \\RR_+^*\\setminus \\{2\\pi\\}$ and  $M = \\mathbb E^{n+2}_{\\theta}$ so that $\\sing(M) = \\{r=0\\}$ in cylindrical coordinates. \n We observe that $\\widetilde{\\mathbb E}^{n+2}_{\\theta} := \\widetilde M^{\\sing(M)}$ can be identified with $\\susp(\\RR)\\times \\RR^{n}$.  In cylindrical coordinates $(r,\\theta,z_1,\\cdots,z_{n}) \\in \\RR_+\\times \\RR\\times \\RR^{n}$, the covering $\\widetilde{\\mathbb E}^{n+2}_{\\theta}$ can be endowed with the singular Euclidean metric $\\d r^2 + r^2 \\d \\theta^2 + \\sum_{i=1}^{n}\\d z_i^2$ and we can define the developing map \n $$\\fonction{\\D}{\\widetilde{\\mathbb E}^{n+2}_{\\theta} }{\\E^{n+2}}{(r,\\theta,z_1,\\cdots,z_{n})}{ (r\\cos\\theta,r\\sin(\\theta),z_1,\\cdots,z_n)}.$$\n\\end{ex}"},{"id":"ex:WTame","block":"RamcovGX.tex:1610","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1625,"deps":["ex:quotient_base"],"decls":["GX.wtame_btz","GX.wtame_btz_isom0","GX.btz_whitehole_sing_eq","GX.not_isAEMorphismOf_btzDev","GX.not_continuousAt_of_eqOn_btzDev","GX.wtameSeq","GX.tendsto_wtameSeq","GX.tendsto_norm_btzDev_wtameSeq","GX.btzDev_paper_coords","GX.apex_notMem_support_of_smul_ne","GX.btzDev_ofInt_one_smul_ne","GX.not_admits_developing_btz"],"ndecls":14,"findings":[],"notes":"WP-35c, audited clean. Readings/questions: Readings (no ruling needed, recorded): 'no developing map' is now proved in BOTH senses of def:developing_map — for M̃ → M (l.1731: no a.e. (G,X)-morphism from the cylinder, with the corollary's structure, into X; GX.not_isAEMorphismOf_btzDev) and 'M admits no developing map' (l.1729: for no T2/LPC/first-countable branched covering M̂ → M possibly branched over sing(M) and no maximal a.e. atlas on M̂ making it an a.e. morphism is there an a.e. morphism M̂ → X; GX.not_admits_developing_btz, via universality); both strictly stronger than the paper's arg","twin":"","tex":"\\begin{ex}\n Using notation from \\ref{ex:quotient_base}, the extreme BTZ-like whitehole model has maximal branched covering but no developing map. Indeed, one can observe that the developing map \n$$\\fonction{\\D}{\\reg(\\cyl{3})}{\\E^{1,2}}{\\left(\\tau,\\r,\\frac{\\theta}{2\\pi}\\right)}{\n\\begin{pmatrix}t \\\\ x \\\\ y\\end{pmatrix}=\\begin{pmatrix} \\tau + \\frac{1}{2}\\r\\theta^2 \\\\ \\tau + \\frac{1}{2}\\r\\theta^2 -r \\\\ -\\r\\theta  \\end{pmatrix}\n}.$$\ndoes not extends continuously at $\\r = 0$. For instance, the sequence $(\\tau_n,\\r_n,\\theta_n)_{\\N^*}$ with \n$$\\forall n\\in \\N^*, \\quad \\tau_n=0,~\\r_n=\\frac{1}{n},~ \\theta_n = n$$\nis such that $(\\tau_n,\\r_n,\\theta_n)\\xrightarrow{n\\rightarrow +\\infty} (0,0,0)$ in $\\cyl{3}$ but $\\D(\\tau_n,\\r_n,\\theta_n)$ is unbounded.\n\\end{ex}"},{"id":"ex:eucl_sphere","block":"RamcovGX.tex:1610","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1640,"deps":[],"decls":["GX.eucl_sphere","GX.eucl_sphere_isomPlus","GX.sphereStereo","GX.euclidPlaneHomeo","GX.support_maximalAEAtlas_singleton","GX.isAEAtlas_singleton_of_source_eq","GX.not_tendsto_comp_of_source_eq_compl_singleton","GX.not_tendsto_of_source_eq_compl_singleton","GX.exists_isPreconnected_diff_singleton_of_chart","GX.mem_stereographic'_neg_source","GX.sphereStereo_source","GX.sphereStereo_target"],"ndecls":12,"findings":[],"notes":"WP-35c, audited clean. Readings/questions: Reading taken: the 'singular structure induced by a stereographic projection' is the maximal a.e. atlas generated by the single chart φ : 𝕊²∖{N} → E²; 'M̃^{sing M} = M' is a homeomorphism over M (branching locus empty).","twin":"","tex":"\\begin{ex} Let $M = \\mathbb S^2$  and $N\\in M$ endowed with a singular $(\\isom^+(\\E^2),\\mathbb E^2)$-structure induced by a stereographic projection $\\mathbb S^2\\setminus \\{N\\} \\rightarrow \\mathbb E^2$. \nOn the one hand, $M$ is a singular Euclidean manifold with $\\sing(M)=\\{N\\}$ and  $\\widetilde M^{\\sing(M)} = M$. On the other hand, the  developing map $\\D:\\reg(M)\\rightarrow \\mathbb E^2$ given by  the stereographic projection  cannot be extended continuously and no sequence $x_n\\xrightarrow{n\\rightarrow +\\infty} N$ with $\\forall n\\in\\N, x_n\\in \\reg(M)$ is such that $(\\D(x_n))_{n\\in \\N}$ converges.\n\\end{ex}"},{"id":"def:topological_space_locally_unloopable","block":"RamcovGX.tex:1610","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1650,"deps":[],"decls":["GX.IsLocallyUnloopable","GX.IsLocallyUnloopable.semilocallySimplyConnected_of_isOpen","GX.isLocallyUnloopable_iff","GX.isLocallyUnloopable_of_normedSpace","GX.semilocallySimplyConnected_pathComponentIn"],"ndecls":5,"findings":[],"notes":"WP-35c, audited clean. Readings/questions: Recorded reading: the paper's 'semi-locally simply connected' (l.1156) is stated for connected spaces, the Lean V carries no connectedness; under local path-connectedness the readings agree, proved as GX.isLocallyUnloopable_iff (equivalently, open path-connected SLSC V) via GX.semilocallySimplyConnected_pathComponentIn.","twin":"","tex":"\\begin{defi} A topological space $X$ is locally unloopable if it is locally path-connected and if for all \n$x\\in X$ and all neighborhood $\\U$ of $x$, there exists an open neighborhood $\\V\\subset \\U$ of $x$ which is semi-locally simply connected.\n\\end{defi}"},{"id":"lem:analytical_structure_locally_unloopable","block":"RamcovGX.tex:1610","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1653,"deps":[],"decls":["GX.analytical_structure_locally_unloopable","GX.semilocallySimplyConnected_compl_of_sing_subset"],"ndecls":2,"findings":["F1 (l.1653–1658), resolved by DEC-66 (a): the conclusion is prop:universality, which needs M locally path-connected and first countable; §3's standing assumption (l.810) covers §2.5. Recorded: the proof's 'unloopable' (l.1656) is read as semilocally simply connected, what is proved (with connectedness) for M ∖ S."],"notes":"WP-35c, audited clean.","twin":"","tex":"\\begin{lem} Let $(G,X)$ be an analytical structure with $X$ locally unloopable.  Then every connected singular $(G,X)$-manifold $M$ admits a maximal covering possibly branched over some given skeletal subset $S$ as long as $S\\supset \\sing(M)$.\n\\end{lem}"},{"id":"prop:singular_manifold_branched_covering","block":"RamcovGX.tex:1610:1670","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1677,"deps":["lem:aepullback","lem:regf1"],"decls":["GX.singular_manifold_branched_covering","GX.singular_manifold_branched_covering_aepullback"],"ndecls":2,"findings":["F2 (l.1680), resolved by DEC-67 (a): the printed Γ(M̃^S/M) is read Γ(N/M), as the proof (l.1688) argues; recorded also that l.1688 cites 'Proposition \\ref{lem:aepullback}' (a lemma)."],"notes":"WP-35c, audited clean.","twin":"","tex":"\\begin{prop} Let $M$ be a singular $(G,X)$-manifold and let $N\\xrightarrow{\\pi} M$ be a branched covering.\n                    \n                    $N$ has a unique a.e. $(G,X)$-structure for which $\\pi$ is an a.e. $(G,X)$-morphism.\n                    and $\\reg(\\pi)\\supset\\reg(N)\\cap \\ord(\\pi)$.\n                    \n                     Furthermore, the Galois group $\\Gamma(\\widetilde M^S/M)$ acts by a.e. $(G,X)$-morphisms.\n                    \\end{prop}"},{"id":"cor:singular_manifold_skeletal_subset","block":"RamcovGX.tex:1610:1670","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1693,"deps":[],"decls":["GX.singular_manifold_skeletal_subset","GX.singular_manifold_skeletal_subset_btz"],"ndecls":2,"findings":["F3 (l.1693), resolved by DEC-66 (b): M̃^S is defined (prop:universality, l.1158) only for M connected; the notation presupposes it."],"notes":"WP-35c, audited clean.","twin":"","tex":"\\begin{cor} Let $M$ be a singular $(G,X)$-manifold and let $S$ be a skeletal subset of $M$ containing $\\sing(M)$. Then $\\widetilde M^S$ admits a unique a.e. $(G,X)$-structure such that the natural projection $\\widetilde M^S\\rightarrow M$ is an a.e. $(G,X)$-morphism.\n\t\t\t\t\t\n\t\t\t\t\tFurthermore, the Galois group $\\Gamma(\\widetilde M^S/M)$ acts by a.e. $(G,X)$-morphisms. \n\t\t\t\t\t \n\t\t\t\t\t\\end{cor}"},{"id":"def:developing_map","block":"RamcovGX.tex:1610:1706","kind":"definition","num":"","title":"developing map","bucket":"A","lean":"closed","nl":"definition","line":1726,"deps":[],"decls":["GX.IsDevelopingMapOf","GX.gxModelAtlas","GX.isDevelopingMapOf_iff","GX.AdmitsDevelopingMap","GX.admitsDevelopingMap_iff"],"ndecls":5,"findings":[],"notes":"WP-27h, audited clean.","twin":"","tex":"\\begin{defi}[developing map]\n  Let $N\\xrightarrow{p} M$ be a branched covering of singular $(G,X)$-manifold.\n  A developing map $\\D$ of $N\\rightarrow M$ is any a.e. $(G,X)$-morphism $N \\rightarrow X$. \n  \n  We say that $M$ admits a developing map if there exists a branched covering $\\widehat M \\rightarrow M$ possibly branched above $\\sing(M)$ and a developing map of $\\widehat M \\rightarrow M$\n  \n   For simplicity sake, whenever it makes sense, a developing map of $\\widetilde M\\rightarrow M$ is simply called a developing map of $M$. \n  \\end{defi}"},{"id":"lem:MtoXG","block":"RamcovGX.tex:1610:1706","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1748,"deps":[],"decls":["GX.aeMorphism_model_unique"],"ndecls":1,"findings":[],"notes":"WP-27h, audited clean.","twin":"","tex":"\\begin{lem}\n  Let $N\\xrightarrow{f_1,f_2} X$ be a.e.  $(G,X)$-morphisms,\nthen there exists a unique $g\\in G$ such that $f_1=gf_2$.\n\\end{lem}"},{"id":"lem:holonomy","block":"RamcovGX.tex:1610:1706","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1753,"deps":[],"decls":["GX.existsUnique_holonomy","GX.existsUnique_holonomy_hom","GX.existsUnique_holonomyOf"],"ndecls":3,"findings":[],"notes":"WP-35d, audited clean.","twin":"","tex":"\\begin{lem}  Let $M$ be a singular $(G,X)$-manifold and $\\Gamma$ be a group acting on $N$ by a.e. $(G,X)$-morphisms. \n\nFor any a.e. $(G,X)$-morphism $M\\xrightarrow{f} X $  there exists a unique morphism $\\rho:\\Gamma\\rightarrow G$ such that $f$ is $\\rho$-equivariant.\n\\end{lem}"},{"id":"def:quasi_galoisian_branched_covering_singular","block":"RamcovGX.tex:1610:1706","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1761,"deps":["lem:holonomy"],"decls":["GX.holonomyOf","GX.IsHolonomyOf","GX.holonomyOf_spec","GX.isHolonomyOf_iff","GX.isHolonomyOf_one_iff"],"ndecls":5,"findings":[],"notes":"WP-27h, audited clean.","twin":"","tex":"\\begin{defi} \n Let $N\\xrightarrow{p} M$ be a quasi-Galoisian branched covering of singular $(G,X)$-manifold admitting a developing map $\\D$. The holonomy of $N\\rightarrow M$ (associated to $\\D$) is the morphism $\\rho$ of Lemma \\ref{lem:holonomy}.\n\\end{defi}"},{"id":"rem:developing_map_quasi_galoisian_covering","block":"RamcovGX.tex:1610:1706","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1764,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-27h, audited clean.","twin":"","tex":"\\begin{rem}\n    A developing map $\\D$ of a quasi-Galoisian covering $M\\rightarrow N$ sends points to some fix point of their stabilizer : $\\D(x) \\in \\fix(\\rho(\\Gamma_x))$.\n  \\end{rem}"},{"id":"rem:singular_manifold_holonomy_indeed","block":"RamcovGX.tex:1610:1706","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1768,"deps":[],"decls":["GX.singular_manifold_holonomy_indeed_of_isLocallyUnloopable","GX.singular_manifold_holonomy_indeed","GX.regChartedSpace","GX.hasGroupoid_regChartedSpace","GX.exists_mem_aePullback_val_reg","GX.aePullback_val_reg_spec"],"ndecls":6,"findings":[],"notes":"WP-35d, audited clean.","twin":"","tex":"\\begin{rem} \n Let $M$ be a singular $(G,X)$-manifold. The holonomy of $\\widetilde M \\rightarrow M$ is indeed the holonomy of $\\reg(M)$ in the usual sense.\n\\end{rem}"},{"id":"lem:quasi_galoisian_branched_covering_singular","block":"RamcovGX.tex:1610:1706","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1771,"deps":[],"decls":["GX.developing_pair_unique"],"ndecls":1,"findings":[],"notes":"WP-27h, audited clean.","twin":"","tex":"\\begin{lem}\n Let $N\\xrightarrow{p} M$ be a quasi-Galoisian branched covering of singular $(G,X)$-manifold. If it admits a couple $(\\D,\\rho)$ of developing map and holonomy, then all other such couples are obtained via conjugation ie:\n if $(\\D',\\rho')$ is another couple developing map and holonomy, then there exists a unique $g\\in G$ such that $(\\D',\\rho')= (g\\circ\\D,\\rho^g)$ with $\\rho^g  : \\gamma \\mapsto g\\rho(\\gamma)g^{-1}$.\n\\end{lem}"},{"id":"lem:descend_developing_map","block":"RamcovGX.tex:1610:1706","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1780,"deps":["lem:dense_orbits","cor:spread_connected_image"],"decls":["GX.descend_developing_map","GX.eq_of_isHolonomyOf_one"],"ndecls":2,"findings":[],"notes":"WP-35d, audited clean.","twin":"","tex":"\\begin{lem} Let $M\\xrightarrow{p} N$ be a quasi-Galoisian branched covering of singular $(G,X)$-manifolds. Then, the following are equivalent:\n\\begin{enumerate}[(i)]\n \\item there exists an a.e. $(G,X)$-morphism $M\\rightarrow X$ and the holonomy of $M\\rightarrow N$ is trivial,\n \\item there exists an a.e. $(G,X)$-morphism $N\\rightarrow X$. \n\\end{enumerate} \n\\end{lem}"},{"id":"lem:morphism_singular_manifolds_branched","block":"RamcovGX.tex:1610:1706","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1799,"deps":[],"decls":["GX.morphism_singular_manifolds_branched"],"ndecls":1,"findings":[],"notes":"WP-27h, audited clean.","twin":"","tex":"\\begin{lem}\n Let $f:M\\rightarrow N$ be a morphism of singular $(G,X)$-manifolds and let $\\hat M$ and $\\hat N$ be branched coverings of $M$ and $N$ respectively. \nIf $\\hat f:\\hat M \\rightarrow \\hat N$ if a lift of $f$, then $\\hat f$ is a morphism of singular $(G,X)$-manifolds.\n\\end{lem}"},{"id":"prop:branched_devmap","block":"RamcovGX.tex:1610:1706","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1807,"deps":["prop:universality","lem:descend_developing_map"],"decls":["GX.singular_developing_theorem","GX.singular_developing_theorem_of_slsc","GX.exists_developing_maxBranched_of_branchedCovering","GX.exists_developing_of_simplyConnected"],"ndecls":4,"findings":["(kept from WP-27h, not a defect) l.1812–1819: the formal proof does not use \\widehat M' nor lem:descend_developing_map; it compares D ∘ Φ and F ∘ Ψ on the connected \\widehat M ∖ \\widehat S and descends along the open map Ψ (SCOPE (c))."],"notes":"WP-35d, audited clean.","twin":"","tex":"\\begin{prop} Let $M$ be a singular $(G,X)$-manifold. The following are then equivalent:\n\\begin{enumerate}[(i)]\n \\item there exists an a.e. $(G,X)$-morphism $\\widetilde M\\rightarrow X$,\n \\item there exists a branched covering of $N\\xrightarrow{p} M$ which admits a developing map.\n\\end{enumerate} \n\\end{prop}"},{"id":"def:singular_manifold_tame_admits","block":"RamcovGX.tex:1610:1706","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1826,"deps":[],"decls":["GX.IsTame","GX.isTame_iff","GX.isTame_of_isDevelopingMapOf"],"ndecls":3,"findings":[],"notes":"WP-35e, audited clean.","twin":"","tex":"\\begin{defi}\n A singular $(G,X)$-manifold $M$ is tame if it admits a  developing map.\n\\end{defi}"},{"id":"lem:embedding_tame","block":"RamcovGX.tex:1610:1706","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1831,"deps":[],"decls":["GX.isTame_of_isAEMorphism"],"ndecls":1,"findings":["l.1834 (proof of lem:embedding_tame): 'The morphism M -> N lifts to a morphism \\widetilde M -> \\widetilde N' fails when f sends regular points to singular ones: for the k-fold quotient R^2 -> E^2_{2pi/k} (an a.e. morphism, regular off 0), a lift R^2 -> \\widetilde N over f would restrict to a lift of R^2\\{0} -> cone\\{apex} to its universal cover, impossible since the generator of pi_1 maps to k times a generator (sketch, not formalized). The statement is true: the Lean proof lifts from \\widehat M = \\widetilde M^{M\\U}, U portly with f regular on U, into \\widetilde{reg N}, extends the lift to the Fox completions (IsFoxCompletion.existsUnique_extend), composes with the developing map of \\widetilde N (lem:morphism_singular_manifolds_branched) and concludes by prop:branched_devmap."],"notes":"WP-35e, audited clean.","twin":"","tex":"\\begin{lem}\nLet $M,N$ be singular $(G,X)$-manifolds and let $M\\rightarrow N$ be an a.e. $(G,X)$-morphism. If $N$ is tame then $M$ is tame.\n\\end{lem}"},{"id":"cor:branched_covering_tame_singular","block":"RamcovGX.tex:1610:1706","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1837,"deps":[],"decls":["GX.isTame_of_isBranchedCovering"],"ndecls":1,"findings":[],"notes":"WP-35e, audited clean.","twin":"","tex":"\\begin{cor} A branched covering of a tame  singular $(G,X)$-manifold is tame.\n\\end{cor}"},{"id":"cor:open_subsets_tame_singular","block":"RamcovGX.tex:1610:1706","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1839,"deps":[],"decls":["GX.isTame_opens","GX.aeAtlas_opensSingular","GX.isAEMorphism_opensSingular_val","GX.reg_opensSingular","GX.sing_opensSingular"],"ndecls":5,"findings":["l.1839 (cor:open_subsets_tame_singular): only connected open subsets can be tame (def:developing_map asks a branched covering, whose target is connected); the row is read under the standing convention l.1712 with DEC-66(b), and closes."],"notes":"WP-35e, audited clean.","twin":"","tex":"\\begin{cor} Open subsets of tame singular $(G,X)$-manifolds are tame.\n\\end{cor}"},{"id":"theo:local_tame","block":"RamcovGX.tex:1610:1706","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1844,"deps":["lem:branched_covering_restriction","prop:universality","prop:branched_devmap"],"decls":["GX.isTame_iff_isLocallyTame","GX.IsLocallyTame","GX.isTame_of_isLocallyTame","GX.exists_local_tame_extension","GX.exists_regDeveloping_maxBranched"],"ndecls":5,"findings":[],"notes":"WP-35e, audited clean.","twin":"","tex":"\\begin{thm}   Let $M$ be a singular $(G,X)$-manifold the following are equivalent:\n\\begin{enumerate}\n \\item $M$ is tamely singular \n \\item $M$ locally tamely singular.\n\\end{enumerate}\n\n\\end{thm}"},{"id":"rem:tamely_singular_manifold_admits","block":"RamcovGX.tex:1610:1706","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1869,"deps":[],"decls":["GX.tamely_singular_manifold_admits","GX.tamely_singular_manifold_admits_aeIso","GX.homeomorph_rangeTameTopology","GX.rangeTameTopology","GX.tameHolonomyOrbitSetoid"],"ndecls":5,"findings":["l.1869 (rem:tamely_singular_manifold_admits): the identification M ≅ Γ(N/M)\\D(N) needs Γ(N/M) to act transitively on the fibres of N -> M (otherwise the map [D x] ↦ p x is not injective); DEC-71 rules the reading 'N Galoisian', under which the remark is certified in full."],"notes":"WP-35e, audited clean.","twin":"","tex":"\\begin{rem} Let $M$ be a tamely singular $(G,X)$-manifold. If $M$ admits an injective developing map $N\\xrightarrow{\\D}X$ for some branched covering $N$ of $M$ then $M$ is isomorphic to $\\Gamma(N/M)\\backslash\\D(N)$ where \n \\begin{itemize}\n  \\item $\\Gamma(N/M)$ acts on $X$ via the holonomy of $\\D$;\n  \\item $\\D(N)$ is endowed with the topology making  $\\D$ an homeomorphism.\n \\end{itemize} \n \\end{rem}"},{"id":"ex:take_closed_unit_disc","block":"RamcovGX.tex:1610:1706","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1877,"deps":["ex:quotient_base"],"decls":["GX.take_closed_unit_disc_metric","GX.IsCuspedHyperbolicMetric","GX.take_closed_unit_disc","GX.IsHyperbolicMetric","GX.IsHyperbolicMetric.unique","GX.IsHyperbolicMetric.t2Space","GX.IsHypQuotient","GX.quotDist","GX.IsHypQuotient.metricSpace","GX.IsHypQuotient.completeSpace","GX.IsHypQuotient.exists_path_variation_le","GX.IsHypQuotient.le_eVariationOn"],"ndecls":31,"findings":["Under DEC-81 + DEC-84 the row is certified in full by GX.take_closed_unit_disc_metric: every assertion of l.1879-1886 is proved for M\\S with a complete hyperbolic metric, cusps at the points of S, atlas compatible with the metric.","Kept from WP-40b: metric completeness is exactly Thurston-Goldman completeness (GX.IsHyperbolicMetric.completeSpace_iff), so 'complete' may be read either way; finite volume enters the paper's argument only through the cusp shape of the ends (thick-thin), which DEC-84 takes as the reading.","Carried over from WP-35i: l.1880 'injective developing map' holds for every developing map; l.1881 the neighbourhoods U ≅ {r<r0} exist arbitrarily small (not every open neighbourhood); l.1882 D(U) is a horodisc together with its centre D(x) on the circle."],"notes":"WP-41o, audited clean.","twin":"","tex":"\\begin{ex}\n  Take $X$ the closed unit disc in $\\RR^2$ and identify the open disc with the pointcaré disc $\\H$. Take $G$ the group of isometries of the pointcaré disc. Note that $G$ acts by homeomorphisms on $X$.\n  Consider $M$ a genus $g$ surface and $S\\subset M$ a finite subset such that $2g-2+s>0$. Endow $M\\setminus S$ with a finite volume complete hyperbolic metric. \n  On the one hand, $M$ is a tamely singular $(G,X)$-manifold with injective developing map $\\widetilde M \\xrightarrow{\\D} X$. On the other hand, an open neighborhood $\\U$ of a singular point $x$ of $\\widetilde M$ is homeomorphic to a domain $\\{r<r_0\\}$ in the  ``infinite angle disc'' $\\DD_\\infty$ introduced in Example \\ref{ex:quotient_base}. We may choose $\\U$ so that $\\D(U)$ is a horodisc centered at $\\D(x)$. Such a domain is not open for the topology of $X$.\n  \n  \n \\end{ex}"},{"id":"def:singular_manifold_automorphisms_group","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1895,"deps":[],"decls":["GX.singularAut","GX.mem_singularAut"],"ndecls":2,"findings":[],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi}\n Let $M$ be a singular $(G,X)$-manifold. The automorphisms group of $M$ denoted $\\Aut(M)$ is the group of isomorphisms of singular $(G,X)$-manifolds from $M$ to itself.\n\\end{defi}"},{"id":"def:family_singular_manifolds_endowed","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1899,"deps":[],"decls":["GX.IsAnalyticModelFamily","GX.isAnalyticModelFamily_iff"],"ndecls":2,"findings":[],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi} A family $(X_\\alpha)_{\\alpha \\in A}$ of singular $(G,X)$-manifolds each endowed with a non-empty subset $S_\\alpha\\subset \\sing(X_\\alpha)$ is an analytic family of model spaces if for all $\\alpha_1,\\alpha_2\\in A$ and all a.e. $(G,X)$-isomorphism $\\U_1\\xrightarrow{\\varphi} \\U_2$ where $\\U_1,\\U_2$ are connected open subsets of $X_{\\alpha_1}$ and $X_{\\alpha_2}$ respectively we have:\n$$\\U_1\\cap S_{\\alpha_1}\\neq \\emptyset \\quad \\Rightarrow \\quad \\alpha_1=\\alpha_2 ~~\\text{and}~~\\exists \\phi \\in  \\mathrm{Aut}(X_{\\alpha_1}), \\varphi=\\phi_{|\\U_1}^{|\\U_2}.$$\n\n\\end{defi}"},{"id":"def:atlas","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"X_A-atlas","bucket":"A","lean":"closed","nl":"definition","line":1905,"deps":[],"decls":["GX.XAChart","GX.HasXAType","GX.IsXAAtlas","GX.XAChart.mem_sing","GX.XAChart.restrict"],"ndecls":5,"findings":["The round-3 question on the reading of 'X_A-atlas' (literal cover vs a chart centred at every singular point) is answered by DEC-67 (e): the printed def:atlas is kept literal (IsXAAtlas, IsXAManifoldPrinted) and X_A-manifolds have a chart centred at every singular point (IsXAManifold). Closed."],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi}[$X_A$-atlas]\n  Let $(X_\\alpha)_{\\alpha\\in A}$ be an analytic family of model spaces and let $M$ be a singular $(G,X)$-manifold.\n    \n  For $\\alpha\\in A$, an $X_\\alpha$-chart around $x\\in \\sing(M)$ is a triplet $(\\U,\\V,\\phi)$ with $x\\in \\U\\subset M,\\phi(x)\\in S_\\alpha, \\V\\subset X_\\alpha$ open and connected;  and $\\U\\xrightarrow{\\phi} \\V$ an isomorphism. If such a chart exists, we say that $x$ has type $\\alpha$. \n  \n  An $X_A$-chart is an $X_\\alpha$-chart for some $\\alpha\\in A$.  \n  An $X_A$-atlas is a collection of $X_A$-charts covering $M$.\n\\end{defi}"},{"id":"def:analytic_family_model_spaces","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1913,"deps":[],"decls":["GX.IsXAManifold","GX.IsXAManifoldPrinted","GX.isXAManifoldPrinted_iff","GX.isXAManifoldPrinted_model","GX.isXAManifold_model","GX.isXAManifold_model_of_sing_subset","GX.modelChartSelf"],"ndecls":7,"findings":[],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi}\n  Let $(X_\\alpha)_{\\alpha\\in A}$ be an analytic family of model spaces and let $M$ be a singular $(G,X)$-manifold.\n  \n  A $X_A$-manifold is a singular $(G,X)$-manifold $M$  admitting  a $X_A$-atlas\n\\end{defi}"},{"id":"rem:singular_point_manifold_has","block":"RamcovGX.tex:1610:1889","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1921,"deps":[],"decls":["GX.existsUnique_hasXAType","GX.hasType_unique","GX.XAChart.mem_sing","GX.XAChart.restrict","GX.isAEMorphism_opensHomeoRestrict"],"ndecls":5,"findings":["l.1921: under the printed def:atlas (charts covering M) a singular point need not be the centre of a chart, so 'has exactly one type' fails in its existence half (e.g. the singular lines of the paper's own cex l.1930 with S = {O}); DEC-67 (e) reads X_A-manifolds as having a chart centred at every singular point, under which the remark holds (GX.existsUnique_hasXAType)."],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{rem}\n    A singular point $x\\in \\sing(M)$ of a $X_A$-manifold $M$ has exactly one type. Indeed, let $\\U_i\\xrightarrow{\\varphi_i} \\V_i\\subset X_{\\alpha_i}$ be isomorphisms with $\\U_i,\\V_i$ open for $i\\in \\{1,2\\}$ and with $x\\in \\U_1\\cap \\U_2$. Restricting $\\varphi_1,\\varphi_2$ if necessary, we may assume $\\U_1=\\U_2$ connected  so that $\\V_1\\xrightarrow{\\varphi_2\\circ \\varphi_1^{-1}}\\V_2$ is an isomorphism, Moreover, $\\V_1$ contains the singular point $\\varphi_1(x)\\in S_{\\alpha_1}$ so by analyticity $\\alpha_1=\\alpha_2$.\n\\end{rem}"},{"id":"rem:theorem_theo_local_tame","block":"RamcovGX.tex:1610:1889","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1924,"deps":["theo:local_tame"],"decls":["GX.forall_isTame_iff_printed","GX.forall_isTame_iff","GX.isTame_of_isXAAtlas","GX.isTame_of_isXAManifold","GX.isTame_of_isXAManifoldPrinted"],"ndecls":5,"findings":["Closed under DEC-80 (b) (WP-40c): the remark is the GLOBAL equivalence, proved both ways (GX.forall_isTame_iff_printed, no added hypothesis; GX.forall_isTame_iff for the DEC-67 (e) notion, models X_A-manifolds as the paper presumes at l.2069). Marked.","Kept for the author: read per manifold, l.1924 'a X_A-manifold is tame iff all models are tame' is false (a tame X_A-manifold need not use every model; the 'if' per manifold is GX.isTame_of_isXAAtlas). Under DEC-67 (e) without the presumption that models are X_A-manifolds, 'only if' fails (informal: a model with a non-tame singular point q of no type; by analyticity no X_A-manifold contains a copy of a neighbourhood of q, since its preimage would need a type β, forcing β = α and q ∈ Aut(X_α)·S_α); not formalized: it needs a model with a non-tame UNTYPED singular point; the library's one non-tame singular manifold, GX.ThinCex.VV (WP-43g; not virtually tame, hence not tame), has its only singular point typed, so it does not instantiate this (wording corrected at WP-43g fixer round 1)."],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{rem}\n By Theorem \\ref{theo:local_tame}, a $X_A$-manifold is tame if and only if all models are tame.\n\\end{rem}"},{"id":"ex:follows_proposition_brunswic_cauchy","block":"RamcovGX.tex:1610:1889","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":1927,"deps":[],"decls":["GX.isAnalyticModelFamily_ePaper","GX.isAnalyticModelFamily_eFam","GX.ePaperToIdx","GX.ePaperToIdx_zero","GX.ePaperToIdx_pos","GX.ePaperToIdx_injective","GX.eFam","GX.eFamS","GX.EIdx","GX.EPaperIdx","GX.btzE0_exists_aut","GX.mass_exists_aut"],"ndecls":19,"findings":["l.1927: 'the family (E_theta)_{theta >= 0} is analytic' includes theta = 2pi, where E_{2pi} is regular (its developing map descends to a homeomorphism onto Minkowski space, GX.mass_two_pi_sing_eq_empty), so S_{2pi} subset of sing(E_{2pi}) = emptyset violates def:family_singular_manifolds_endowed's non-emptiness and the family is not analytic as printed (GX.not_isAnalyticModelFamily_two_pi); brunswic2021cauchy Prop 1.3 assumes alpha != 2pi. Corrected (DEC-74) and proved for theta >= 0, theta != 2pi.","l.1927: 'It follows from Proposition 1.3' needs, beyond Prop 1.3's local form, a globalisation (an a.e. isomorphism of connected opens meeting S agreeing with an automorphism on an open set agrees everywhere: rem:morphisms_analytical_two_equal, DEC-42) and that sing(E_theta) is the whole axis also for theta in 2piZ \\ {2pi} (trivial holonomy; GX.mass_sing uses the m-to-1 developing map instead). Both are proved here.","Cross types (E_0 vs E_alpha): proved by the radial limits of the lift — an isometry g with g . D_alpha = D_0 . L would send two points of the timelike axis to cluster values of the BTZ developing map at the axis, i.e. onto the lightlike line Delta (GX.btzDev_cluster), impossible for an isometry (GX.mass_to_btz_false). Massive vs massive: g keeps the time axis, hence is a rotation-translation (GX.isom_eq_of_timeAxis), one turn theta is k turns theta', and injectivity forces k = 1."],"notes":"WP-41d, audited clean.","twin":"","tex":"\\begin{ex} It follows from Proposition 1.3 of  \\cite{brunswic2021cauchy} that the family $(\\mass{\\theta})_{\\theta\\geq 0}$ is analytic.\n \n\\end{ex}"},{"id":"cex:start_singular_manifold_homeomorphic","block":"RamcovGX.tex:1610:1889","kind":"counterexample","num":"","title":"","bucket":"C","lean":"partial","nl":"cited","line":1930,"deps":["prop:susp_portly"],"decls":["GX.TroyanovSuspensionTheorem","GX.TroyanovAngleCondition","GX.SuspensionCexFacts","GX.cex_start_singular_manifold_homeomorphic","GX.isAnalyticModelFamily_unit_iff_eq_singleton","GX.troyanovAngleCondition_witness","GX.exists_suspensionCexFacts","GX.suspensionCexFacts_joukowski","GX.troyanovSuspensionTheorem_of_subsingleton","GX.joukowskiStructure","GX.sing_joukowskiStructure","GX.support_joukowskiStructure"],"ndecls":16,"findings":["Proved from the named external result (DEC-69): for every s ≥ 3 pairwise distinct angles satisfying Troyanov's condition there is a connected singular (G,X)-manifold M with O ∈ sing M and some other singular point, such that for S ⊆ sing M, (M,S) is analytic iff S = {O}, and (M, sing M) is not analytic (GX.cex_start_singular_manifold_homeomorphic), 0 sorry.","Round-4 audit major 1 fixed by option (a) at its 'at least' level: SuspensionCexFacts gains exists_ne (∃ s ∈ sing M, s ≠ O) and connected, so the sphere (sing = {O}) no longer witnesses it and the cex conclusion is informative. Re-witnessed with every field exercised (GX.exists_suspensionCexFacts): ℂ with the a.e. structure pulled back by the Joukowski map z ↦ z + z⁻¹ on ℂ ∖ {0, ±1}, G trivial; sing = {0, 1, −1} (0 a pole, ±1 branch points, GX.sing_joukowskiStructure); O = 0 rigid (GX.joukowski_eq_of_isAEMorphism: z + z⁻¹ unbounded and injective near 0, then the identity theorem IsAEMorphism.eq_of_eqOn); at ±1 the flip z ↦ z⁻¹ of B(±1,1/2) is an a.e. isomorphism (GX.isAEMorphism_joukowskiFlip) which no automorphism extends, since every automorphism is the identity by rigidity at 0. The old sphere witness GX.suspensionCexFacts_sphere is removed (it does not satisfy exists_ne).","Disclosed (round-4 audit major 1, option (b) part, which (a) cannot remove): the named Prop is not tied to θ — SuspensionCexFacts mentions no cone angle (the library has none) — so over a general (G,X) it asserts only the existence of a manifold carrying the facts, and for a trivial group acting on ℂ it holds outright for every θ (GX.troyanovSuspensionTheorem_of_subsingleton, proved). The angle-dependent content (the s singular rays, Aut(Σ) ≅ Aut(M), the (SO(4),S³)-structure) is the paper's instance, not stated here. Not built: spherical cone surfaces, the (SO(4),S³)-structure of the Thurston suspension (GX.Singular.Suspension is topological), Aut(Σ) ≅ Aut(M)."],"notes":"WP-44b, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: DEC-69 is applied as ruled: Troyanov's theorem (MR1005085) with the suspension is the named external Prop GX.TroyanovSuspensionTheorem, an explicit hypothesis of GX.cex_start_singular_manifold_homeomorphic, with non-vacuity witnesses (GX.troyanovAngleCondition_witness; GX.exists_suspensionCexFacts, the Joukowski structure; GX.troyanovSuspensionTheorem_of_subsingleton, the Prop holds for a trivial group on ℂ); row partial. Disclosed: the Prop is not tied to θ (no cone angles in the library); restating it at (","twin":"","tex":"\\begin{cex} Start from $\\Sigma$ a singular $\\SS^2$-manifold homeomorphic to a sphere with $s\\geq 3$ conical singularities of respective angles $(\\theta_i)_{i\\in \\lsem 1,s\\rsem}$. We know from Troyanov \\cite{MR1005085}  that one can construct such a surface for arbitrary  $(\\theta_i)_{i\\in \\lsem 1,s\\rsem}$ as long as $$0<\\sum_{i=1}^s( \\theta_i -2\\pi) + 4\\pi\\leq \\min(4\\pi, \\theta_i : i\\in \\lsem 1,s\\rsem).$$\nApply the Thurston suspension method described in Section \\ref{sec:susp}, the constructed manifold $M$ is  a singular $(\\SO(4),\\SS^3)$-manifold (we may either apply  by Proposition \\ref{prop:susp_portly}  or check that directly). We call $O$ its center.\n\nAn automorphism of $M$ has to fix $O$ since singular locus is homeomorphic to a line except at $O$, furthermore it preserves distances and geodesics. By considering the sphere of some radius $\\varepsilon>0$ centered at $O$ we see that the natural map $\\Aut(\\Sigma)\\rightarrow \\Aut(M)$ is a group isomorphism.  As a consequence, except for very particular $\\Sigma$, $\\Aut(M)$ is trivial. For instance, if all the $\\theta_i$ are different then $\\Aut(M)=\\{Id\\}$. These remarks hold for all neighborhoods of $O$.\n\nFor a generic $\\Sigma$, since locally we may construct a rotation around any of the axes and since  those cannot be extended as automorphism of $M$, we conclude that for $S\\subset \\sing(M)$, $(M,S)$ is  analytic if and only if …"},{"id":"def:singular_manifold_virtually_tame","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1960,"deps":[],"decls":["GX.IsTamifyingTopology","GX.IsVirtuallyTame","GX.IsRegDevelopingOnReg","GX.deckMapsMax","GX.weakTopMax","GX.isTamifyingTopology_natural_iff","GX.isTame_iff_isTamifyingTopology_natural"],"ndecls":7,"findings":["Not a defect: (A) and (C) force a tamifying topology to coincide with the weak one on p⁻¹(reg M) (IsTamifyingTopology.induced_reg_eq). The proof of theo:local_virt_tame (l.2088) needs exactly this to apply lem:spread_top ('R … on which strong and weak topologies agree') and does not check it; it holds."],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi} A singular $(G,X)$-manifold $M$ is virtually tame if there exists  a first countable locally path connected (strong) topology $\\T$ on $\\widetilde M$ thinner than the natural (weak) topology such that :\n\\begin{enumerate}[(A)]\n\\item The quotient topology induced by $\\T$ on $M$ is the natural one.\n \\item the developing map $\\D:\\reg(\\widetilde M)\\rightarrow X$ admits a $\\T$-continuous extension ;\n \\item elements $\\Gamma(\\widetilde M/M)$ are $\\T$-continuous;\n \\item  the lift of $\\reg(M)$ to $\\widetilde M$ is $\\T$-portly in $\\widetilde M$.\n\\end{enumerate}\nWe call such a $\\T$ a tamifying topology.\n\\end{defi}"},{"id":"def:singular_manifold_locally_galoisian","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1969,"deps":[],"decls":["GX.IsLocallyGaloisian"],"ndecls":1,"findings":[],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi}A singular $(G,X)$-manifold $M$ is locally Galoisian  \nif for every $\\U\\subset \\M$ open, $\\reg(\\U)$ is semi-locally simply connected in $\\U$.\n\\end{defi}"},{"id":"theo:local_virt_tame","block":"RamcovGX.tex:1610:1889","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1974,"deps":[],"decls":["GX.isVirtuallyTame_of_descending","GX.local_virt_tame_descending","GX.not_localVirtTameStatement","GX.LocalVirtTameStatement","GX.ThinCex.local_virt_tame_counterexample","GX.ThinCex.not_forall_isVirtuallyTame_XA","GX.ThinCex.not_isVirtuallyTame_VV","GX.ThinCex.hasAutContinuousTamifying_XA","GX.ThinCex.isLocallyGaloisian_XA","GX.ThinCex.isAnalyticModelFamily_XA","GX.ThinCex.isLocallyUnloopable_XS","GX.ThinCex.isXAManifold_VV"],"ndecls":76,"findings":["WP-44b (DEC-109): the row is CERTIFIED by its descending-chart form, GX.isVirtuallyTame_of_descending ((ii) => (i)) and GX.local_virt_tame_descending (the iff), 0 sorry, under all the theorem's hypotheses plus the ruled descending-chart condition (GX.IsDescendingChartMap) — the form Section 4 uses. The printed statement stays refuted (GX.not_localVirtTameStatement, GX.ThinCex); the other corrected forms are recorded in SCOPE (d); the manifold case is not pursued.","WP-43g (DEC-86): theo:local_virt_tame (l.1974) is FALSE as printed: GX.not_localVirtTameStatement (0 sorry, axioms propext/Classical.choice/Quot.sound). Counterexample GX.ThinCex: the model X_alpha = {(p,q) in C^2 : |q| <= 1, |p| = |q|(1-|q|)}, the solid torus C x S^1 with its end collapsed to one point s (a cone over T^2), S_alpha = {s}; G = Z acting on the model geometry X = {0} u devF(C x R) in R x R x C, devF(z,b) = (rho, rho b, z rho e(-rho b^2) - (1-rho)), rho = 1/(1+|z|), by H^n: devF(z,b) -> devF(z,b+n) (faithful, rigid, continuous; X Hausdorff, locally unloopable via a star chart at 0). The (Z,X)-structure of X_alpha is given by the local sections of Q : X -> X_alpha; Sing X_alpha = {s} (the longitude loop has no lift). All hypotheses hold: the family is analytic (every a.e. isomorphism of opens is the identity), X_alpha is locally Galoisian (radial contraction at s), and X_alpha~ carries a tamifying topology with Aut-continuity (X's topology transported by the developing map extended by 0, a bijection; (A) holds because thin tubes saturate under the longitude holonomy: GX.ThinCex.exists_good_shift, GX.ThinCex.CA_subset_Q_Nb; Aut = deck by GX.ThinCex.aeMorphism_XA_unique). So (ii) holds. But the X_A-manifold V = {|q| < 1/2} (an open subset of the model, a collar T^2 x (0,1/2) plus s) is NOT virtually tame (GX.ThinCex.not_isVirtuallyTame_VV): the meridian mu of the collar dies in reg X_alpha but not in reg V; as a deck transformation of V~ it fixes the end over s, D o mu = D, and along any path from z to mu z inside D^{-1}(E), E = {r < 1/4, |w| < 1/4}, the phase Phi = Im w/2pi - r b^2 has cos 2 pi Phi > 0 (it is the argument of w + (1-r)) yet Phi(mu z) = Phi(z) + 1 (the strip argument), contradicting the WP-40c necessary condition GX.not_isVirtuallyTame_of_forall_not_joinedIn.","The proof's gap (l.2130-2134, (D) of r^*T_alpha via lem:spread_top (c)) is not only a gap: piece (2) itself fails for non-descending charts (r : V~ -> V^ not an isomorphism), and no other tamifying topology exists there. The corrected forms remain proved, 0 sorry: descending charts (GX.isVirtuallyTame_of_descending, GX.local_virt_tame_descending), r an isomorphism (GX.isVirtuallyTame_of_hasMaximalLifts), models of finite local degree (GX.isVirtuallyTame_of_isXAManifold_of_hasFiniteLocalDegree), liftable charts (GX.local_virt_tame_liftable); general (ii) => (i) conditional on piece (2) (GX.local_virt_tame_of_charts).","Piece (2) of the proof (the natural local tamifying topologies T_{U,V,phi}, GX.HasLocalTamifyingCharts) is itself false in general: GX.ThinCex.not_forall_hasLocalTamifyingCharts_VV (for V = {|q| < 1/2}, some base point and developing map admit no such family), the contraposition of GX.isVirtuallyTame_of_isXAManifold with GX.ThinCex.isXAManifold_VV and GX.ThinCex.not_isVirtuallyTame_VV (fixer round 1, audit minor 2).","The counterexample's model geometry X is not a manifold at 0 (a point with contractible punctured neighbourhoods); this is allowed by the paper's standing assumption (an analytical structure with X locally unloopable, l.1660; (G,X) analytical, l.341) but is far from the paper's intended (Isom(E^{1,2}), E^{1,2}) setting.","l.1974: (i) => (ii) holds trivially (GX.local_virt_tame_forward), as recorded before.","Kept from earlier waves: l.2077 (gluing/naturality unstated), l.2025/l.2088 (Galoisianity of sub-coverings asserted without argument), the WP-40c necessary condition and the finite-local-degree naturality."],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{thm} Let $(X_\\alpha)_{\\alpha\\in A}$ be an analytical family of locally Galoisian model spaces.\nIf for every $\\alpha\\in A$, there exists a tamifying topology $\\T_\\alpha$ such that the group $\\Aut(\\widetilde X_\\alpha)$ acts $\\T_\\alpha$-continuously,\n then the following are equivalent:\n\\begin{enumerate}[(i)]\n \\item every $X_A$-manifold is virtually tame\n \\item for every $\\alpha \\in A$, $X_\\alpha$ is virtually tame\n\\end{enumerate}\n\\end{thm}"},{"id":"def:topological_spaces_continuous_map","block":"RamcovGX.tex:1610:1889","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1984,"deps":[],"decls":["GX.strongPullTop","GX.strongPullTop_le","GX.isOpen_strongPullTop_connectedComponentIn","GX.continuous_strongPullTop","GX.strongPullTop_self"],"ndecls":5,"findings":[],"notes":"WP-44b, audited clean.","twin":"","tex":"\\begin{defi} Let $(M,\\T_M),(N,\\T_N)$ be topological spaces and Let $M\\xrightarrow{p} N$ be a continuous map. For any topology $\\T$ on $N$ define $p^*\\T$ the topology of $M$ generated by $\\T_M$ and the $\\T_M$-connected components of $p^{-1}(\\O)$ for $\\O\\in \\T$. \n \n\\end{defi}"},{"id":"lem:spread_top","block":"RamcovGX.tex:1610:1889","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1990,"deps":["lem:branched_covering_restriction"],"decls":["GX.spread_top_of_local","GX.spread_top_of_isPortly","GX.spread_top_corrected","GX.not_spreadTopGalLocalCE","GX.SpreadTopGalLocalCE","GX.strongLocallyConnectedOrd_halfCut","GX.not_spreadTopGalConnCE","GX.SpreadTopGalConnCE","GX.not_spreadTopPrinted","GX.SpreadTopPrinted","GX.cex_spread_top_halfCut","GX.isGaloisian_of_comp"],"ndecls":38,"findings":["l.1990–2004: lem:spread_top is false as printed. Counterexample (formal, GX.cex_spread_top_halfCut / GX.not_spreadTopPrinted): M = N = ℂ, S = ∅, q = id, p: M̃^∅ → ℂ the universal covering, R = {Im ≠ 0}, T = the topology of ℂ generated by the usual one and {Im ≥ 0}. All hypotheses hold; p⁻¹{Im ≥ 0} and p⁻¹{Im < 0} are p^*T-open, so p^*T is disconnected and (a), (e) fail. The proof uses 'N strongly connected' (l.2018) and 'R̂ weakly connected' (l.2047), neither of which is a hypothesis.","l.2047: 'R̂ is weakly connected' does not follow even when T is connected (informal, not formalized; the formal correction only needs the half-cut counterexample): M = N = ℂ*, S = ∅, p the universal covering (log), T cutting ℂ* along the positive real ray with the ray glued to the upper bank; p^*T splits M̃ into strips. Corrected form: assume p⁻¹(R) connected (true when R is portly for the natural topology, as in the application l.2096).","l.2029/2034: the Claim's 'We may assume that Ô ∩ R̂ is connected' is unproved (the argument lifts a path from x̂ to some point over z, not to ẑ) and is exactly (c): GX.isPortly_strongPullTop_iff_local. It fails (FORMAL, GX.cex_spread_top_sector, GX.not_spreadTopConnCE): M = N = ℂ, S = {0}, M̃^{0} ≅ 𝔻_∞ the logarithmic covering completed at 0 (GX.exists_homeomorph_maxBranched_qDisc), q = id, R = ℂ∖{0} (portly for both topologies, p⁻¹R connected), T = usual ⊓ generateFrom{{0} ∪ {Re > 0}} (first countable, LPC, agreeing with the usual topology on R). The preimage of the sector is p^*T-open and p^*T-connected through the branch point, its regular part p⁻¹{Re > 0} is not connected: (c), (e) and the Claim's local hypothesis all fail. theo:local_virt_tame uses (c)/(e) through (D) and the strong branched covering; its proof inherits the gap.","l.2025: 'M̃^S → M is Galoisian and thus so is M̃^S → N' is asserted without argument; it is true (GX.isGaloisian_of_comp: deck transitivity over q⁻¹(M∖S) by uniqueness of lifts, dense orbits, discrete fibres from M∖S slsc in M), using N Hausdorff, LPC, first countable and M∖S ⊆ ord_q (GX.compl_subset_ordY_of_comp).","l.2017–2018 'lem:path_covering' is applied relative to an open connected O (GX.exists_path_of_isPortly_of_isOpen), and the Claim's second part needs fibres of p discrete (from M∖S slsc in M) to pick Ô ∩ p⁻¹(y) = {ŷ}.","Proof BUILT (WP-35g) for all five clauses: GX.spread_top_of_local proves (a) first countable+connected+LPC, (b), (c), (d), (e) exactly as printed under three added hypotheses (N → M Galoisian; p⁻¹(R) connected; StrongLocallyConnectedOrd). Both topological added hypotheses are now shown necessary in the presence of all the others (in both counterexamples q = id is Galoisian): the half-cut example satisfies the local hypothesis (GX.strongLocallyConnectedOrd_halfCut, via GX.exists_homeomorph_maxBranched_empty: M̃^∅ → ℂ is a homeomorphism) and p^*T is disconnected; the sector example satisfies p⁻¹R connected and (c), (e) fail.","(d) without 'N → M Galoisian' is not formalized either way. Informal counterexample sketch: N a non-normal finite intermediate covering of a space with non-abelian π₁ (e.g. ℂ minus two points, S = ∅) has Γ(N/M) trivial, so any T is allowed; take T cut (as in halfCutTop) at one point n₀ of a fibre and natural elsewhere; a deck transformation γ of M̃ sending a point over n₁ ≠ n₀ to a point over n₀ (exists, M̃ → M Galoisian) is not p^*T-continuous there.","The dispatch cites the proof as l.2068–2136; that range is the proof of theo:local_virt_tame. The proof of lem:spread_top is l.2010–2061 (it follows rem:intuitively_spread_thinner_than).","WP-40d: row CLOSED under DEC-80(c) (GX.spread_top_of_local is the lemma); the counterexamples to the printed form are kept as the record of the correction. Docstring mark applied in the module docstring and on GX.spread_top_of_local.","WP-41q: GX.spread_top_deck is declared in GXScaffold.SingularII.Models, not here; moved to decls_imported (audit round 1, minor)."],"notes":"WP-41q, audited clean.","twin":"","tex":"\\begin{lem}  Let $M$ be a first countable, connected locally path connected Hausdorff topological space. Let $S\\subset M$ be a skeletal subset such that $M\\setminus S$ is semi-locally simply connected in $M$;\nconsider a sub-covering $\\widetilde M^S\\xrightarrow{p}N\\xrightarrow{q}M$.\n\nLet $\\T$ be a (strong) thinner first countable and locally path connected topology on $N$ for which elements of $\\Gamma(N/M)$ are continuous. Consider the induced strong topology $p^*\\T$ on $\\widetilde M^S$.\nAssume in addition there exists some $\\R \\subset \\ord_p(N)$ strongly portly  in $N$ on which strong and weak topologies agree.\n\n Then, we have the following\n \\begin{enumerate}[(a)]\n \\item $\\widetilde M^S$ is strongly first countable connected locally path connected;\n \\item strong and weak topologies agree on $p^{-1}(\\R)$; \n \\item $p^{-1}(\\R)$ is strongly portly;\n  \\item elements of $\\Gamma(\\widetilde M^S/M)$ are  strongly continuous;\n  \\item $\\widetilde M^S\\xrightarrow{p}N$ is a branched covering for the strong\n  topologies.\n  \\end{enumerate}\n\\end{lem}"},{"id":"rem:intuitively_spread_thinner_than","block":"RamcovGX.tex:1610:1889","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2006,"deps":["lem:path_covering","prop:Galoisian_semilocal","lem:complete_path_carac"],"decls":["GX.intuitively_spread_thinner_of_local","GX.cex_component_not_strongPull_connected","GX.not_isGreatest_strongPullTop_unrestricted","GX.isPreconnected_top_sptop","GX.le_strongPullTop_of_continuous","GX.le_strongPullTop_of_isSpread","GX.isSpread_strongPullTop","GX.isSpread_strongPullTop_iff","GX.isGreatest_strongPullTop_of_isSpread","GX.isGreatest_strongPullTop","GX.cutTopReal","GX.ratTopReal"],"ndecls":15,"findings":["l.2006: read literally, 'p^*T is the coarsest topology on M such that (M,p^*T) → (N,T) is a spread' is false in general — p^*T need not be a spread (GX.not_isSpread_strongPullTop_ratTop: p = id on ℝ, T generated by the usual topology and ℚ), and the comparison must be restricted to topologies finer than T_M (GX.not_isGreatest_strongPullTop_unrestricted: p : ℝ → point, the indiscrete topology also makes p a spread).","WP-40d: in the lemma the remark accompanies the intuition HOLDS: under lem:spread_top's hypotheses in the ruled form (DEC-80(c)), p^*T is the coarsest spread topology finer than that of M̃^S (GX.intuitively_spread_thinner_of_local, from (e)). In general: every spread topology finer than T_M is finer than p^*T (GX.le_strongPullTop_of_isSpread), and p^*T is the coarsest one exactly when it is locally connected (GX.isSpread_strongPullTop_iff, GX.isGreatest_strongPullTop). The 'However' sentence is GX.cex_component_not_strongPull_connected (ℝ cut at 0).","WP-41q: row CLOSED and MARKED under DEC-87(d): GX.intuitively_spread_thinner_of_local (first sentence, in lem:spread_top's setting), GX.cex_component_not_strongPull_connected (the 'However' sentence). The two counterexamples to the unrestricted reading (GX.not_isSpread_strongPullTop_ratTop, GX.not_isGreatest_strongPullTop_unrestricted) are kept as the record of the reading."],"notes":"WP-41q, audited clean.","twin":"","tex":"\\begin{rem}\n Intuitively, if $(M,\\T_M)\\xrightarrow{p}(N,\\T_N)$ is a spread and $\\T$ is thinner than $\\T_N$, then the strong topology $p^*\\T$ is the coarsest topology on $M$ such that $(M,p^*\\T)\\xrightarrow{p}(N,\\T)$ is a spread. However, the definition does not garantee that $\\T_M$-connected components are $p^*\\T$-connected components. Point $(e)$ above is thus non-trivial.\n\\end{rem}"},{"id":"rem:hypothesis_model_spaces_necessary","block":"RamcovGX.tex:1610:1889","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":2137,"deps":[],"decls":["GX.hypothesis_model_spaces_necessary","GX.exists_isMassiveStructure","GX.MassCyl","GX.IsMassiveStructure","GX.massCyl_sing","GX.massive_sing_eq","GX.apex_notMem_support_of_sep","GX.massiveDev_sep","GX.massCyl_isTame","GX.massCyl_natural_tamifying","GX.massCyl_exists_homeomorph","GX.massCyl_isTamifying_tamTop"],"ndecls":41,"findings":["l.2137: 'Hypothesis (C) for the model spaces' is theo:local_virt_tame's hypothesis 'Aut(X̃_α) acts T_α-continuously' (l.1975), not item (C) of def:singular_manifold_virtually_tame (Γ(M̃/M) T-continuous, l.1965), which the messed-up T' satisfies: the label collides with the definition's item.","l.2141: the assertion that T' is again tamifying is made without argument; it is TRUE and now proved (first countable; locally path-connected also at the boundary points (apex, 0) — paths go radially to the axis then along it; (A) since a Γ_α-invariant T'-open set is open; (B) as E_θ is tame; (C) as Γ(Ẽ_θ/E_θ) = Γ_α; (D)). The WP-35g concern about local path-connectedness at ∂{t>0} is WITHDRAWN.","l.2148: 'V ⊂ {t>0} or V ⊂ {t>0}' — the second should read {t<0}.","The time
