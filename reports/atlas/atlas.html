\reg(f)$.\n                \\end{defi}"},{"id":"lem:regf1","block":"RamcovGX.tex:339:469","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":523,"deps":[],"decls":["GX.exists_smul_eq_on_of_isPreconnected","GX.regLocusOf_subset"],"ndecls":2,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{lem}\n                     Let $M$ and $N$ be  singular $(G,X)$-manifolds and let $f:M\\rightarrow N$ an a.e $(G,X)$-morphism. Then, \n                     $$\\reg(f)=\\reg(M)\\cap f^{-1}(\\reg(N)).$$\n                    \\end{lem}"},{"id":"rem:though_may_tempted_include","block":"RamcovGX.tex:339:469","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":538,"deps":[],"decls":["GX.not_isAEMorphismOf_maximalAtlas_of_eventually_eq_pow","GX.not_isAEMorphismOf_of_eventually_eq_pow","GX.zero_notMem_regLocusOf_pow","GX.not_isAEMorphismOf_pow","GX.not_injOn_pow_of_mem_nhds","GX.notMem_regLocusOf_of_forall_not_injOn","GX.not_injOn_of_eventually_eq_pow"],"ndecls":7,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{rem}\n                 Though we may be tempted to include Riemann surfaces in the a.e. $(G,X)$-manifold framework, the previous Lemma shows there is no simple definition of Riemann surfaces as $(G,X)$-manifolds that allows branched map to be a.e. $(G,X)$-morphisms. Indeed, those maps are locally modeled on $z\\mapsto z^p$ and $0\\notin \\reg(z\\mapsto z^p)$ except if $p=1$. The above Lemma would thus force $p=1$ hence does not allow ramification.  \n                \\end{rem}"},{"id":"lem:aepullback","block":"RamcovGX.tex:339:469","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":541,"deps":["cor:maximal_atlas"],"decls":["GX.aepullback","GX.existsUnique_aePullback","GX.SameAEStructure","GX.IsAELocalHomeomorph","GX.aePullback_counterexample_nonmaximal"],"ndecls":5,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{lem}\n                    Let $M\\xrightarrow{f} N$ be a continuous map with $M$ locally connected Hausdorff topological space and $N$ a singular $(G,X)$-manifold. \n                    \n                    If $f$ is a.e. a local homeomorphism there exists a unique a.e. $(G,X)$-structure on $M$ such that $f$ is an a.e. $(G,X)$-morphism.\n                \\end{lem}"},{"id":"def:notations_lemma_lem_aepullback","block":"RamcovGX.tex:339:469","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":554,"deps":["lem:aepullback"],"decls":["GX.aePullback","GX.aePullback_spec","GX.eq_aePullback","GX.aePullback_spec_of_isAELocalHomeomorph"],"ndecls":4,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{defi}\n                 With the notations of Lemma \\ref{lem:aepullback}, the unique  a.e. $(G,X)$-structure $f^*\\A$ on $M$ is called the pullback by $f$ of the a.e. $(G,X)$-structure $\\A$ of $N$.\n                 \n                \\end{defi}"},{"id":"cor:locally_connected_hausdorff_topological","block":"RamcovGX.tex:339:469","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":558,"deps":[],"decls":["GX.aePullback_comp_of_exists","GX.aePullback_comp_spec_of_exists","GX.aePullback_comp"],"ndecls":3,"findings":["l.558-561: the corollary states no hypothesis under which the pullbacks of def:notations_lemma_lem_aepullback are defined; read with g^*A, f^*g^*A defined (DEC-46 (c))."],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{cor}\n                 Let $L\\xrightarrow{f}M\\xrightarrow{g} N$ be locally connected Hausdorff topological space. And let $\\A$ be an a.e $(G,X)$-structure on $N$. \n                 Then $f^*g^*\\A = (g\\circ f)^*\\A$.\n                \\end{cor}"},{"id":"lem:GX_sing_homeo_reg","block":"RamcovGX.tex:339:469","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":592,"deps":["lem:aepullback"],"decls":[],"ndecls":0,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{lem}{}\n\t\t\t\t\t\t Let $M$ and $N$ be singular $(G,X)$-manifolds and let $f:M\\rightarrow N$ an a.e $(G,X)$-morphism. Then,\n\t\t\t\t\t$$\\reg(f)=\\reg(M)\\cap \\{x\\in M  ~|~ f \\text{ is a local homeomorphism around }x\\}$$\n\t\t\t\t\t\\end{lem}"},{"id":"cor:morphisms_also_local_homemorphism","block":"RamcovGX.tex:339:469","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":603,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{cor} If an a.e. $(G,X)$-morphisms  is also a local homemorphism then it preserves both regular and singular locii.\n\t\t\t\t\t\\end{cor}"},{"id":"rem:consequence_isomorphism_singular_manifolds","block":"RamcovGX.tex:339:469","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":606,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-27a, audited clean.","twin":"","tex":"\\begin{rem} As a consequence, \n\t\t\t\t\t an isomorphism $M\\xrightarrow{f} N$ of singular $(G,X)$-manifolds is an isomorphism of almost everywhere $(G,X)$-atlas in the sense that given the maximal almost everywhere $(G,X)$-atlases $\\mathcal A$ and $\\mathcal B$ of $M$ and $N$ respectively, the pullback $f^*\\mathcal B$ and $\\mathcal A$ are equal. It is then an isomorphism in every natural ways relative to singular $(G,X)$-manifolds.\n\t\t\t\t\t \n\t\t\t\t\t \n                    \\end{rem}"},{"id":"ex:consider_identifying_point_wise_stabilizer","block":"RamcovGX.tex:339:612","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":629,"deps":["ex:conical"],"decls":["GX.quotient_finite_model_analytical","GX.finiteQuotient_of_t2","GX.quotient_rotations","GX.isPortly_ne_zero","GX.isPreconnected_ball_diff_zero","GX.finiteQuotient","GX.quotient_rotations_rootsOfUnity","GX.IsRigidAction.subgroup","GX.euclidQ","GX.IsomPlus","GX.rotAff","GX.rotAff_mem"],"ndecls":92,"findings":["l.635 'as a metric space Γ\\M ≅ E^n_{2π/p}' holds with the cone angle of ex:conical read as α (DEC-47; with the printed metric the angle would be √(2π/p) and the claim false); proved for every n.","l.637 read as ruled by DEC-54(a); the row closes under it."],"notes":"WP-47a, audited clean. Readings/questions: 'The metric on reg(Γ\\M) extends continuously to Γ\\M' is read as: the quotient distance min_γ |γx − y| of μ_p\\E^n is carried by a homeomorphism (GX.rotationsMetricHomeo) to the metric of E^n_{2π/p} (GX.rotations_metric), hence a metric on the whole quotient inducing its topology; the singular isomorphism is that isometry (GX.conical_quotient_rotations_isometry).","twin":"","tex":"\\begin{ex} \n  Consider $X=M = \\mathbb E^n$ and $G=\\isom^+(\\mathbb E^n)$ identifying $\\mathbb E^n$ with $\\RR^n$ and $n\\in \\N_{\\geq 2}$. The point-wise stabilizer of $S = \\RR^{n-2}\\times \\{(0,0)\\}$ is isomorphic to $\\mathrm {SO}(2;\\RR)$,  we choose $\\Gamma \\subset \\stab(S)$ a finite group of rotations fr order $p$.\n The group $\\Gamma$ acts freely on $M\\setminus S$ which is portly, therefore the quotient $\\Gamma \\backslash M$ has a natural singular $(G,X)$-structure. \n The metric on $\\reg(\\Gamma\\backslash M)$ extends continuously to $\\Gamma\\backslash M$. As a \\textbf{metric space} $\\Gamma \\backslash M$ is isomorphic to $\\mathbb E^n_ {2\\pi/p}$ described in Example \\ref{ex:conical}.\n \n  Variations on this example can be done either by replacing $X$ by another Riemannian spaceform $\\mathbb H^n$ or $\\mathbb S^n$. More generaly one can take submodel of the projective model space :\n $X \\subset \\mathbb K P^n$ and $G \\subset \\mathrm{PGL}(n;\\mathbb K)$ for $\\mathbb K \\in \\{\\mathbb R,\\mathbb C\\}$.\n\\end{ex}"},{"id":"prop:GXquotient","block":"RamcovGX.tex:339:612","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":639,"deps":[],"decls":["GX.gxQuotient","GX.maximalAtlas_eq_of_isGXMorphism","GX.mem_maximalAtlas_of_comp","GX.pushChartedSpace","GX.hasGroupoid_pushChartedSpace","GX.hasDecks_orbitMk","GX.isLocalHomeomorphOn_orbitMk","GX.gxQuotient_counterexample","GX.swapScale","GX.swapScaleAction"],"ndecls":10,"findings":["l.639 is false as written: a free, properly discontinuous action by homeomorphisms that are not (G,X)-morphisms admits NO structure on the quotient making the projection a (G,X)-morphism. Counterexample GX.gxQuotient_counterexample: Z/2 acting on the (translations of R)-manifold R ⊕ R by inl x ↦ inr 2x, inr x ↦ inl x/2 (free, properly discontinuous in the full reading IsProperlyDiscontinuous, continuous; ℝ ⊕ ℝ a (G,X)-manifold, all certified as conjuncts); no charted structure at all on the quotient makes the projection a (G,X)-morphism. Corrected form GX.gxQuotient adds 'by (G,X)-morphisms' (which prop:aeGXquotient does state). DEC-51 rules the reading; the row closes under it, the missing hypothesis recorded."],"notes":"WP-47a, audited clean.","twin":"","tex":"\\begin{prop} Let $M$ be a $(G,X)$-manifold and let $\\Gamma$ be a discrete group acting freely properly discontinuously on $M$. Then there exists a unique $(G,X)$-structure on $\\Gamma\\backslash M$  such that the natural projection $M\\rightarrow \\Gamma\\backslash M$ is a $(G,X)$-morphism.\n\\end{prop}"},{"id":"prop:aeGXquotient","block":"RamcovGX.tex:339:612","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":642,"deps":["prop:GXquotient","lem:GX_atlas_union"],"decls":["GX.aeGXQuotient","GX.existsUnique_aeGXQuotient","GX.quotientSingularGXStructure","GX.isAEMorphism_orbitMk","GX.orbits_topology","GX.hasDecks_orbitMk_reg","GX.pushAtlas","GX.support_pushAtlas","GX.isRegularOn_pushAtlas","GX.isGXAtlas_pushAtlas"],"ndecls":10,"findings":["l.647 'By assumption, the quotient is Hausdorff': Hausdorffness of Gamma\\M does not follow from the neighbourhood form of proper discontinuity alone (free wandering actions with non-Hausdorff quotients exist); it needs the separating form (IsProperlyDiscontinuous.separates, or local compactness with mathlib's definition). The structure itself needs neither Hausdorffness nor invariance of U."],"notes":"WP-47a, audited clean. Readings/questions: 'properly discontinuous' is not defined in the paper; reading taken: GX.IsProperlyDiscontinuous (nbhd meeting translates only through the stabiliser + distinct orbits separated); only its first half is used for the structure, and it is implied by the two standard definitions (proved).","twin":"","tex":"\\begin{prop}\n Let $M$ be a singular $(G,X)$-manifold, let $\\Gamma$ be a discrete group acting properly discontinuously on $M$ by a.e. $(G,X)$-morphisms. \n \n If there exists a portly $\\Gamma$-invariant subset $\\U$ on which $\\Gamma$ acts freely then $\\Gamma\\backslash M$ has a unique a.e. $(G,X)$-structure such that the natural projection $M \\rightarrow \\Gamma\\backslash M$ is an a.e. $(G,X)$-morphism.\n\\end{prop}"},{"id":"ex:quotient_base","block":"RamcovGX.tex:339:612","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"cited","line":660,"deps":[],"decls":["GX.quotientBase_ruled","GX.misner_variations_ruled","GX.nullB_ne_zero_of_timelike","GX.DInfty.gens","GX.DInfty.hasBasis_nhds_apex","GX.DInfty.isOpenEmbedding_posEmb","GX.devAtlas","GX.isAEAtlas_devAtlas","GX.devStructure","GX.subset_support_devStructure","GX.isAEMorphismOf_devStructure","GX.GammaA"],"ndecls":137,"findings":["l.667 'Its singular locus is sing(M) = {r=0}' is false in general: GX.quotientBase_counterexample (alpha = 2π, X = C, G = translations, D(r,θ) = r e^{iθ}, every hypothesis of the example) has EMPTY singular locus while {r=0} is the apex. True: sing(M) ⊆ π{r=0} (GX.quotientBase_sing_subset).","l.664–667 dimension slip: cyl{n} := D_inf × R^n is (n+2)-dimensional and is said to have a local homeomorphism {r>0} → X ⊆ R^n and a quotient homeomorphic to R^n; read cyl{n} = D_inf × R^{n-2} (the Minkowski case uses (r,θ,z), z ∈ R, X = R^3), or the quotient as R^{n+2}. Formalized for D_inf × Z, with M ≅ C × Z (GX.cylHomeomorph).","l.673 (massive particle), printed slip (DEC-47): with D(r,θ,z) = (z+σθ/α, r cos(θ/α), r sin(θ/α)) the deck generator θ ↦ θ+α of Γ_α acts by D ↦ (time translation by σ) ∘ (rotation of angle 1 radian), whatever α (GX.massiveDev_smul with c = 1/α). The cone angle is therefore 1 and the mass 1 − 1/2π, not m = 1 − α/2π, unless α = 1. The intended D = (z+σθ/α, r cos θ, r sin θ) (DEC-47) is GX.massive_particle_intended: angle α.","l.674–678 (extreme BTZ white hole): formalized in the paper's generality (GX.btz_whitehole_isom0: every x0, future lightlike u, <v|u> < 0, G = Isom_0); D is even a homeomorphism of {r>0} onto a half-space, holonomy P_α.","l.678, printed slip (DEC-47): 'Choosing D'(r,θ,t) = D(r,θ,−t) gives an extreme BTZ blackhole instead' — D' = D ∘ T with T(r,θ,t) = (r,θ,−t) a Γ_α-equivariant homeomorphism of the cylinder, so the printed black hole is isomorphic, as a singular (G,X)-manifold, to the white hole (GX.btz_blackhole_iso_whitehole, GX.btz_blackhole_isom0). The intended black hole takes u past lightlike (DEC-47): GX.btz_blackhole_past_isom0, which develops {r>0} into the past side of the null plane through the singular line, where the white hole develops into the future side (GX.btzDevGen_future_side).","l.679 (Misner/BTZ variations, u spacelike): 'v spacelike' does not suffice: for u = (0,0,1) and the spacelike v = (1,0,1) (null coordinates, Q(v) = 1) the image of D lies in a plane, so D is not a local homeomorphism (GX.misnerDev_spacelike_counterexample). Needed: v not in the plane spanned by u and one null eigendirection of the boosts (v_a v_b ≠ 0), automatic for timelike v. Formalized with that condition (GX.misner_btz, GX.misner_isom0).","l.679 (variations): the condition on v, stated intrinsically, is: ⟨v|w⟩ ≠ 0 for every nonzero null w ⊥ u (v off the two null planes spanned by u and a null eigenline of the boosts); automatic for timelike v (GX.misner_isom0_general, first disjunct), and 'v spacelike' alone allows a degenerate D (GX.misnerDev_spacelike_counterexample).","STATUS: closed under DEC-52 (sing(M) ⊆ π{r=0}; <v|w> != 0 for every nonzero null w ⊥ u) and DEC-47 (massive particle (r cos θ, r sin θ); past lightlike u for the black hole); the printed forms stay recorded as findings with their counterexamples. The dimension slip (cyl{n} = D_inf × R^n homeomorphic to R^n) is absorbed by the generality in Z (M ≅ ℂ × Z, GX.cylHomeomorph). The polyhedral sentence l.681 is an informal remark by DEC-125 (g) (WP-47a).","l.681 ('All these examples can also be obtained via gluings of polyedra'; cited as l.684 in DEC-125 (g) and in earlier reports) is an informal remark, not formalized: no polyhedra, gluing maps nor isomorphism are given, and gluings of polyhedra are described only informally (l.624) (SCOPE (c)(ii)). Ruled an informal remark by DEC-125 (g) (2026-11-08, AUTHOR, 'Accept (a)–(g)'); the row's closed status rests on that ruling, as l.679 (tachyons/photons) rests on DEC-116 (a).","l.679 (tachyons/photons; cited as l.682 in DEC-116 (a)) holds as written, read literally: with Γ = ℤ acting on θ alone (r and z fixed), as a variation of the action Γ_α of the example, and θ identified with \\widetilde{RP¹} by a homeomorphism ψ conjugating the generator to the lift of A, the quotient is a singular (Isom₀, E^{1,2})-manifold (Hausdorff, locally connected, second countable, ≅ ℂ × ℝ) with holonomy g (tachyon_isom0, photon_isom0, ThetaLiftQuotient). The developing map is then not Euclidean-polar in θ: D(r,θ,z) = x₀ + (z + r b(θ)) c v + r R(θ) w(e^{iψθ}), R > 0, built from a fundamental-domain curve extended equivariantly.","Feed-back to BBS (papers/bbs/REVIEW.md §H.2, POSTWAVE5/BBS-NOTES.md (3)): the construction there — 1·(r,θ,z) = (r‖g w(θ)‖/‖w(ĝθ+2πm)‖, ĝθ+2πm, z) with w a 2π-periodic Euclidean parametrisation — does not give a Hausdorff quotient, because the action rescales the Euclidean radius while 𝔻_∞'s apex neighbourhoods are {r < ε}: for the tachyon the quotient is not even T₁ (a point of the contracted eigen-ray lies in every neighbourhood of an axis point, GX.rayLiftQuotient_tachyon_not_t1, every β ≠ 0, every m), for the photon it is not T₂ (p_n = (−1/(s²n²), 1/(sn), 0) → (apex, 0) while φⁿp_n = (−1/(s²n²), 0, 1) → (apex, 1), GX.rayLiftQuotient_photon_not_t2, every s ≠ 0, every m). §H.2 checks only the neighbourhood half (hdisc) of proper discontinuity, which holds. The fix is to make the action preserve r: choose w equivariant (w(ĝθ + 2πm) = g w(θ), defined on a fundamental domain and extended), equivalently act on θ alone.","For the photon no complement of ℝv is invariant under a null rotation, so in the Euclidean-radius reading the action must also shift z ((r,θ,z) ↦ (r‖Ae^{iθ}‖, θ + rayShift A θ + 2πm, z + r κ(e^{iθ}))); BBS H.2's z-preserving formula holds only for the tachyon. In the corrected reading the drift is absorbed in the developing map (the term r b(θ) c v).","Every element of Isom₀ fixing a spacelike (resp. null) line pointwise is a boost (resp. a null rotation): the orientation-reversing candidates (exchange of the two null lines of v^⊥; γ = −1 for the null case) are excluded only by the determinant condition of Isom₀.","l.679 names no lift of the PSL(2,ℝ) element to \\widetilde{RP¹}: the lift is a choice m ∈ ℤ of sheets. Every m ≠ 0 is certified (m = ±1 the tachyon/photon proper); m = 0 (the lift fixing the eigen-rays) is not claimed.","Defect record (kept, not certifying the row): the Euclidean-radius tachyon/photon construction GX.RayLiftQuotient, GX.rayLiftQuotient_of_frame, GX.homeoZ_quotient, GX.IsTurning, GX.isTurning_rayLiftHomeo, GX.rayLiftHomeo, GX.HomeoZ, GX.tachyon_conj, GX.photon_conj, GX.rayLift, GX.rayDev, GX.rayDev_axis — its quotient is not Hausdorff, proved by GX.rayLiftQuotient_tachyon_not_t1, GX.rayLiftQuotient_photon_not_t2, GX.not_t1Space_rayLift_of_eigen. The docstrings of GX.tachyon_conj / GX.photon_conj now say so and point to the certified GX.tachyon_conj_theta / GX.photon_conj_theta (WP-46a)."],"notes":"WP-47a, audited clean. Readings/questions: SETTLED by DEC-116 (a): 'tachyon'/'photon' and 'a hyperbolic (resp. parabolic) action of Γ = ℤ on θ' are read literally, Γ acting on θ alone (r, z fixed); the Euclidean-radius action is proved non-Hausdorff. | The orientation of w (BBS l.1229–1233) is not pinned: the paper makes no positivity claim. That the axis is actually singular and BBS's degree 2|m| are not asserted by the paper and not formalized.","twin":"","tex":"\\begin{ex}\n Consider $\\mathbb D_{\\infty}$ the topological space $(\\RR_{+}^*\\times \\RR \\cup \\{(0,0)\\},\\T)$ where $\\T$ is the topology generated by the one of $\\RR_+^*\\times \\RR$  and open subsets $\\{(r,\\theta) \\in \\mathbb D_{\\infty} ~|~ r<r_0\\}$ for $r_0>0$. We may refer to the space $\\DD_\\infty$ as  the \"infinite angle disc\".\n \n The infinite angle cylinder eg  the space $\\cyl{n} :=\\DD_\\infty \\times \\RR^n$  can be endowed with an a.e. affine structure for some choice $G\\subset \\mathrm{Aff}(\\RR^n)$ and $X\\subset \\RR^n$   via pullback by a local homeomorphism $\\D : \\{r>0\\}\\rightarrow X$. We call this singular $(G,X)$-manifold $\\widetilde M$ and  naturally, $\\sing(\\widetilde M)\\subset \\{r=0\\}$.\n \n Take $\\Gamma_\\alpha =\\Z$ acting on $\\widetilde M$ via $k\\cdot (r,\\theta,z)= (r,\\theta+k\\alpha,z)$ for some $\\alpha\\in \\RR_+^*$, assume that $\\Gamma_\\alpha$ acts via a.e. $(G,X)$-morphisms, then $M:=\\Gamma_\\alpha\\backslash \\widetilde M$ is naturally a singular $(G,X)$-manifold homeomorphic to $\\RR^n$ endowed with cylindrical coordinates.  Its singular locus is $\\sing(M) = \\{r=0\\}$.\n \n Consider the special case $X=\\mass{}$ eg $\\RR^3$ endowed  with the bilinear form $Q(t,x,y)=x^2+y^2-t^2$ of signature $(2,1)$ ; with $G = \\isom_0(X)$ the identity component of the affine isometry group.  $\\mass{}$ is the 3-dimensional Minkowski space and $G$ the group of isometries preserving both orientation  …"},{"id":"rem:previous_examples_instances_developing","block":"RamcovGX.tex:339:612","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":684,"deps":[],"decls":["GX.previous_examples_developing","GX.isCoveringMapOn_orbitMk_cylPos","GX.cylPosHomeo","GX.preimage_image_cylPos","GX.previous_examples_universalCover","GX.isLocalHomeomorphOn_of_subtype","GX.cylPosDeck_bijective","GX.fundamentalGroup_cylPos","GX.quotientBase_sing_subset","GX.quotientBase_ruled"],"ndecls":10,"findings":["l.685 'branched over its singular locus': the branching locus of D_inf × Z → M is π{r=0}, which can strictly contain sing(M) (GX.quotientBase_counterexample: α = 2π, sing(M) = ∅ while the cover branches at the apex). DEC-52 rules the corrected form: branched over π{r=0} ⊇ sing(M) (GX.quotientBase_sing_subset).","STATUS (WP-47a): closed in the corrected form ruled by DEC-52, the certificate spanning GX.Singular.Quotient (sing(M) ⊆ π{r=0}: quotientBase_ruled / quotientBase_sing_subset; the developing map: previous_examples_developing; the universal covering of the regular part: previous_examples_universalCover) and GX.Branched.Universality (the Fox-universality and the assembled statement previous_examples_instances_developing_ruled, certified by WP-27c). The Fox-universality cannot be proved in Quotient.lean, since Universality imports it; the mark in Quotient.lean records the row closed across the two strict, sorry-free modules. The instances: ex:conical (α, D = (r e^{iαθ}, z)), ex:consider_identifying (α = 2π/p), the Lorentzian developing maps and the tachyons/photons (Γ = GammaA (2π) on θ alone, D = thetaDev) are all cylinders of ex:quotient_base, so covered by the statement for every α, D; the polyhedral sentence l.681 is an informal remark (DEC-125 (g))."],"notes":"WP-47a, audited clean. Readings/questions: Read as: the cylinder is a covering over π{r>0}, branched over π{r=0} ⊇ sing(M) (DEC-52), it is the universal covering of π{r>0} (GX.previous_examples_universalCover), D induces a (G,X)-morphism on {r>0} (GX.previous_examples_developing), and it is the maximal covering of M possibly branched over π{r=0}, the Fox completion of the universal covering of π{r>0} (GX.previous_examples_instances_developing_ruled, in GX.Branched.Universality).","twin":"","tex":"\\begin{rem}\n The previous examples are instances of developing maps defined on the universal covering of some singular space branched over its singular locus. This is the archetype we will describe with more precisions in section~\\ref{sec:GXsing2}.\n\\end{rem}"},{"id":"def:topological_suspension","block":"RamcovGX.tex:339:612","kind":"definition","num":"","title":"Topological suspension","bucket":"A","lean":"closed","nl":"definition","line":710,"deps":[],"decls":["GX.suspSetoid","GX.Susp","GX.Susp.mk","GX.Susp.r","GX.Susp.O","GX.Susp.gens","GX.Susp.continuous_mk","GX.Susp.hasBasis_nhds_O","GX.Susp.nhds_mk_of_pos","GX.Susp.continuous_of"],"ndecls":10,"findings":[],"notes":"WP-25g, audited clean. Readings/questions: R_+ read as [0,∞) (NNReal); susp(Σ) is the quotient type, so susp(∅) = ∅ and O = {r = 0} is a single point iff Σ ≠ ∅ — the paper's literal definition.","twin":"","tex":"\\begin{defi}[Topological suspension]\n Let $\\Sigma$ be a  topological space, the topological suspension of $\\Sigma$ is\n $$ \\susp(\\Sigma):= (\\Sigma \\times \\RR_+)/{\\sim}$$\nwhere $(\\sigma,r) \\sim (\\sigma',r')$ if $r=r'=0$; endowed with the topology generated by the  quotient topology on $\\{r>0\\}$ and the image of $\\Sigma\\times [0,\\varepsilon[$ for $\\varepsilon>0$.\nWe also define $O:= \\{r=0\\}$.\n \\end{defi}"},{"id":"rem:one_may_check_suspension","block":"RamcovGX.tex:339:612","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":716,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-25g, audited clean.","twin":"","tex":"\\begin{rem} One may check the suspension preserves Hausdorff as well as first and second countable properties. \n \\end{rem}"},{"id":"rem:infinite_angle_disc_suspension","block":"RamcovGX.tex:339:612","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":718,"deps":[],"decls":["GX.Susp.dInftyHomeomorphSusp","GX.Susp.homeomorphDInfty","GX.Susp.toDInfty","GX.Susp.ofDInfty"],"ndecls":4,"findings":[],"notes":"WP-25g, audited clean. Readings/questions: D_∞ is GX.DInfty of GXScaffold.Singular.Quotient (WP-25f) with the topology of ex:quotient_base; 'is the suspension' read as a homeomorphism (r,θ) ↔ (θ,r).","twin":"","tex":"\\begin{rem} The infinite angle disc $\\DD_\\infty$ is the suspension of $\\RR$.\n  \n \\end{rem}"},{"id":"cex:topology_chose_same_quotient","block":"RamcovGX.tex:339:612","kind":"counterexample","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":722,"deps":[],"decls":["GX.Susp.quotTop","GX.SuspQ","GX.Susp.quotTop_le","GX.Susp.eq_quotTop_of_compactSpace","GX.SuspQ.not_firstCountableTopology_real","GX.SuspQ.instTopologicalSpace_ne_quotTop_real"],"ndecls":6,"findings":["l.723: the neighbourhoods are written U_f := {(x,r) | r < f(r)}; it should read r < f(x).","l.725: g(n) := ½ min(f_k : k ≤ n) should read ½ min(f_k(n) : k ≤ n), and the proof does not say how g is made continuous nor why the U_f form a basis; the Lean proof bypasses both with the locally finite closed set ⋃_n {n} × [t_n, ∞[ (t_n > 0 chosen inside the n-th basic neighbourhood)."],"notes":"WP-25g, audited clean.","twin":"","tex":"\\begin{cex} The topology we chose is the same as the quotient topology if $\\Sigma$ is compact, however the suspension\n $\\susp(\\RR)$ endowed with the quotient topology  is not first countable. Indeed, a basis of open neighborhoods of $O$ is given by $\\U_f := \\{(x,r)~|~ r<f(r)\\}$ for $f:\\RR\\rightarrow \\RR_+^*$ continuous. \n For any sequence $(f_n)_{n\\in \\N}$ we may construct $g:\\RR\\rightarrow \\RR$ continuous and such that\n $\\forall n\\in \\N, g(n):= \\frac{1}{2}\\min(f_k : k\\leq n )$. \n This way,  $\\forall n\\in \\N, \\U_{f_n} \\nsubset \\U_g$ which proves $(\\U_{f_n})_{n\\in \\N}$ is not a basis of neighborhoods of $O$.\n\\end{cex}"},{"id":"rem:topological_suspension_fact_functor","block":"RamcovGX.tex:339:612","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":729,"deps":[],"decls":["GX.Susp.functor","GX.Susp.map","GX.Susp.cmap","GX.Susp.map_mk","GX.Susp.map_id","GX.Susp.map_comp","GX.Susp.continuous_map","GX.Susp.map_injective","GX.Susp.map_surjective","GX.Susp.isInducing_map","GX.Susp.isEmbedding_map"],"ndecls":11,"findings":[],"notes":"WP-25g, audited clean. Readings/questions: 'functor from the category of topological spaces to itself' read as CategoryTheory.Functor TopCat TopCat (GX.Susp.functor), with the paper's topology.","twin":"","tex":"\\begin{rem}\n The topological suspension is in fact a functor from the category of topological space to itself as continuous maps can be extended radially in a natural way. Suspension preserves injectivity, surjectivity and embeddings.\n\\end{rem}"},{"id":"prop:susp_portly","block":"RamcovGX.tex:339:612","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":745,"deps":[],"decls":["GX.Susp.susp_portly","GX.Susp.isPortly_image_mk","GX.Susp.isPortly_image_of_suspLike","GX.Susp.range_map_val_diff_O","GX.Susp.exists_box","GX.Susp.susp_portly_needs_connected"],"ndecls":6,"findings":["l.774: the proof's lower-semicontinuity step uses 'since Σ is first countable', which is not a hypothesis of prop:susp_portly (l.745). The statement is nevertheless true without it: the Lean proof (local connectedness criterion, GX.isPreconnected_of_local) needs at O only the ball {r < ε} ⊆ W, whose trace on susp(U)∖O is π(U × ]0,ε[), connected because U is (Σ connected, U portly). Neither first countability nor the function f nor lem:connected_union is needed for the paper's topology."],"notes":"WP-25g, audited clean. Readings/questions: susp(U) ∖ {O} for U ⊆ Σ read as range(susp(U ↪ Σ)) ∖ O (the functor applied to the inclusion), proved equal to π(U × ℝ₊*).","twin":"","tex":"\\begin{prop}  Let $\\Sigma$ be a Hausdorff, connected, locally connected topological space and let $\\U\\subset \\Sigma$ be a portly subset. \nThen $\\susp(\\U)\\setminus \\{O\\}$ is a portly subset of $\\susp(\\Sigma)$.\n\\end{prop}"},{"id":"lem:connected_union","block":"RamcovGX.tex:339:612","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":749,"deps":[],"decls":["GX.connected_union","GX.connected_union_quot"],"ndecls":2,"findings":["l.752: 'The ⋃ U_i is connected' — typo for 'Then'. The paper omits the proof; it is proved here from mathlib's IsPreconnected.transGen_of_iUnion and IsConnected.iUnion_of_reflTransGen."],"notes":"WP-25g, audited clean. Readings/questions: 'I/∼ is a singleton' read as Subsingleton (Quot ∼) (I nonempty), equivalently ∀ i j, EqvGen ∼ i j.","twin":"","tex":"\\begin{lem}\n Let $M$ be a topological space and let $(\\U_i)_{i\\in I}$ be a non-empty family of non-empty connected open subset. Define on $I$ the equivalence relation $\\sim$ generated by $i\\sim j$ if $\\U_i\\cap \\U_j \\neq \\emptyset$.\n \n The $\\bigcup_{i\\in I} \\U_i$ is connected if and only if $I/\\sim$ is a singleton.\n \n\\end{lem}"},{"id":"rem:proof_above_works_quotient","block":"RamcovGX.tex:339:612","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":784,"deps":[],"decls":["GX.SuspQ.susp_portly","GX.SuspQ.mkQ","GX.SuspQ.isOpen_iff","GX.SuspQ.continuous_mkQ"],"ndecls":4,"findings":["For the quotient topology the apex step is genuinely different (a quotient neighbourhood of O need not contain a ball): the Lean proof uses the tube neighbourhood π(⋃_σ B_σ × [0,δ_σ[) with B_σ connected open and chains the pieces π((B_σ ∩ U) × ]0,δ_σ[) by lem:connected_union-style reflexive-transitive chaining over the connected Σ — so lem:connected_union is where the quotient version needs it; still no first countability."],"notes":"WP-25g, audited clean.","twin":"","tex":"\\begin{rem} The proof above works for the quotient topology.\n \n\\end{rem}"},{"id":"def:category_spreads","block":"RamcovGX.tex:813:822","kind":"definition","num":"","title":"Category of spreads","bucket":"A","lean":"closed","nl":"definition","line":825,"deps":[],"decls":["GX.spreadBasis","GX.IsSpread","GX.isSpread_iff","GX.isSpread_iff_of_locallyConnectedSpace","GX.Spread","GX.Spread.Hom"],"ndecls":6,"findings":[],"notes":"WP-24d, audited clean. Readings/questions: 'generated by' is read as TopologicalSpace.generateFrom of the components; equivalently (GX.isSpread_iff) the components are open and form a basis, so the source of a spread is locally connected. Objects of GX.Spread have source and target in one universe.","twin":"","tex":"\\begin{defi}[Category of spreads] A spread $X\\xrightarrow{p} Y$ is a continuous map such that the topology of $X$ is generated by the connected components of the preimages of open subsets of $Y$.\n\nWe define the category of spreads $\\CatSpread$ whose objects are spreads and morphisms in $\\mathrm{Hom}(X\\xrightarrow{p} Y, X'\\xrightarrow{p'} Y')$ are couples of continuous functions $(f,g)$  such that the following diagram commutes\n\n$$\\xymatrix{\nX\\ar[d]^p \\ar[r]^g & X' \\ar[d]^{p'} \\\\ Y \\ar[r]^{f} & Y'\n}.$$\n\n\\end{defi}"},{"id":"rem:spread_open_respectively_co","block":"RamcovGX.tex:813:822","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":835,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-24d, audited clean.","twin":"","tex":"\\begin{rem} Let $X\\xrightarrow{p} Y$ be a spread, \nwith $\\U,\\V$ open of $X$  and $Y$ respectively such that $p(\\U)\\subset \\V$, the (co)restriction $p_{|\\U}^{|\\V}$ is a spread.\n\\end{rem}"},{"id":"def:continuous_map_ordinary_locus","block":"RamcovGX.tex:813:822","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":838,"deps":[],"decls":["GX.IsEvenlyCoveredSet","GX.ordY","GX.ordX","GX.ordY_subset_range"],"ndecls":4,"findings":[],"notes":"WP-25a, audited clean. Readings/questions: DEC-40 applied: y is ordinary iff some open U ∋ y has p⁻¹(U) non-empty and each component of p⁻¹(U) mapped homeomorphically onto U; consequently ord(Y) ⊆ p(X) (GX.ordY_subset_range).","twin":"","tex":"\\begin{defi}\n  Let $X\\xrightarrow{p} Y$ be a continuous map, the  ordinary locus $\\ord_p(Y)$ of $Y$  is the set of point $y\\in Y$  for which there exists an open neighborhood $\\U$ evenly covered by $p$ ie such that $p$ maps each connected component of $p^{-1}(\\U)$ homeomorphically onto $\\U$. The ordinary locus $\\ord_p(X)$ of $X$ is the preimage of the ordinary locus of $Y$.\n  \n  We will write $\\ord$ instead of $\\ord_p$ when there is no ambiguity.\n\\end{defi}"},{"id":"rem:ordinary_locii_open_but","block":"RamcovGX.tex:813:822","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":843,"deps":[],"decls":["GX.ordinary_locii_open_but","GX.isOpen_ordY","GX.isOpen_ordX","GX.isCoveringMap_restrict_ordX","GX.surjective_restrict_ordX","GX.isCoveringMap_surjective_restrict_ordX","GX.isCoveringMap_restrict_ordX_connected_iff","GX.not_isPreconnected_ordY_nFold","GX.not_isPreconnected_ordX_nFold","GX.not_isPreconnected_ordX_abs","GX.abs_ordX_not_isPreconnected_covering"],"ndecls":11,"findings":["Under DEC-40 the restriction ord(X) → ord(Y) is ALWAYS a surjective covering map over a locally connected source (GX.isCoveringMap_surjective_restrict_ordX), connected or not. This proves the positive reading of 'the only obstruction ... is the connectedness of ord(X)' (connected ord(X) ⇒ covering) in a stronger form. The negative reading (a disconnected ord(X) prevents a covering) is FALSE under DEC-40: GX.abs_ordX_not_isPreconnected_covering (x ↦ |x|, ord(X) = ℝ ∖ 0 disconnected, restriction still a surjective covering map). GX.isCoveringMap_restrict_ordX_connected_iff only restates the remark for a connected total space; its docstring now says so."],"notes":"WP-25a, audited clean. Readings/questions: Does 'covering' in rem:ordinary_locii_open_but (l.844) include a connected total space? If yes, the remark is exactly GX.isCoveringMap_restrict_ordX_connected_iff. If no (DEC-40 as written), the restriction is always a covering and the sentence could read 'the restriction ord(X) → ord(Y) is a covering; it is connected iff ord(X) is'. The row is kept closed because the unconditional statement is stronger than the positive reading; the master may mark it partial until the author answers.","twin":"","tex":"\\begin{rem}\n The ordinary locii are open but may not be connected. The only obstruction for the restriction $\\ord(X)\\rightarrow \\ord(Y)$ to be a covering is the connectedness of $\\ord(X)$.\n\\end{rem}"},{"id":"rem:singular_on_singular","block":"RamcovGX.tex:813:822","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":846,"deps":[],"decls":["GX.image_compl_ordX"],"ndecls":1,"findings":[],"notes":"WP-25a, audited clean.","twin":"","tex":"\\begin{rem}\n Let $X\\xrightarrow{p}Y$ be a surjective continuous map. Then $$p(X\\setminus \\ord(X))  = Y\\setminus \\ord(Y).$$\n\\end{rem}"},{"id":"lem:spread_partial_covering","block":"RamcovGX.tex:813:822","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":851,"deps":[],"decls":["GX.spread_partial_covering","GX.spread_partial_covering_surjective_needed","GX.preimage_subset_of_sheets"],"ndecls":3,"findings":["Surjectivity of the covering is used for Y₁ ⊆ ord(Y): for a covering map in mathlib's sense (possibly non-surjective) one gets p(X₁) ⊆ ord(Y), X₁ ⊆ ord(X), p⁻¹(Y₁) = X₁ (GX.spread_partial_covering'), and Y₁ ⊆ ord(Y) fails for unitTrue : Unit → Bool, X₁ = Unit, Y₁ = Bool (GX.spread_partial_covering_surjective_needed). Consistent with DEC-40's 'covering = surjective covering map'.","Necessity of portlyness (density) is now witnessed with every other hypothesis of the Lean statement, including T2Space and LocallyConnectedSpace X (even LocPathConnectedSpace, second countable) and X₁ locally connected in X: GX.cex_portlyness_paper."],"notes":"WP-25a, audited clean.","twin":"","tex":"\\begin{lem} Let $X\\xrightarrow{p} Y$ be a continuous map inducing a covering $X_1\\rightarrow Y_1$ for some $X_1\\subset X$ and $Y_1\\subset Y$ with $X_1$ portly and $Y_1$ open. \n \n Then $Y_1\\subset \\ord(Y)$, $X_1 \\subset \\ord(X)$ and $p^{-1}(Y_1)=X_1$. \n\\end{lem}"},{"id":"cex:openess","block":"RamcovGX.tex:813:822","kind":"counterexample","num":"","title":"Openess of Y_1","bucket":"A","lean":"closed","nl":"open","line":870,"deps":[],"decls":["GX.cex_openess","GX.ordY_lineIncl","GX.ordX_lineIncl"],"ndecls":3,"findings":[],"notes":"WP-25a, audited clean. Readings/questions: As written under DEC-40: p continuous, a spread, the induced X → p(X) a surjective covering map, ord(Y) = ∅. Also recorded: X₁ = ℝ portly, p(X) not open, ord(X) = ∅.","twin":"","tex":"\\begin{cex}[Openess of $Y_1$]\n\n Consider $X = \\RR\\times \\{0\\} $ and $Y = \\RR^2$ with $p$ the inclusion map. $p$ is a continuous map (it is even a spread) and induces a covering $X\\rightarrow X \\subset Y$ but $\\ord(Y)=\\emptyset$.\n\\end{cex}"},{"id":"cex:portlyness","block":"RamcovGX.tex:813:822","kind":"counterexample","num":"","title":"Portlyness of X_1","bucket":"A","lean":"closed","nl":"open","line":874,"deps":[],"decls":["GX.notMem_ordX_of_notMem_interior","GX.not_injOn_of_notMem_interior","GX.cex_portlyness_fst","GX.fstLineHomeo","GX.zero_notMem_interior_fstLine","GX.cex_portlyness_paper","GX.PortlySpace","GX.portlyTop","GX.isSpread_portlyι","GX.le_portlyTop_of_isSpread","GX.isSpread_portlyP","GX.exists_isPathConnected_subset"],"ndecls":22,"findings":["Item 2 is proved as written for the paper's own space, with every listed property (GX.cex_portlyness_paper): the topology generated by the subspace components of X ∩ U (GX.portlyTop) makes the injection a spread (GX.isSpread_portlyι) and is the coarsest such topology (GX.le_portlyTop_of_isSpread: every topology making the injection a spread is finer), so the paper's 'coarsest topology' exists and is this one; X is Hausdorff, second countable, locally path-connected; the inner rays are homeomorphic to ∐_ℕ (0,1); p is a spread; X₁ = Y₁ open, X₁ locally connected in X (GX.IsLocallyConnectedIn), X₁ → Y₁ a homeomorphism; ord(Y) = ord(X) = ∅. Since LocallyConnectedSpace and T2Space hold, the example refutes the density-free form of the Lean lem:spread_partial_covering exactly as the paper intends.","The read-only audit's suggested route (subspace components of X ∩ U are portlyTop-connected) is FALSE for this X: for U = ℝ² ∖ {μu} (u a rational unit vector, 0 < μ < 1) the segment (0,μ)u lies in the subspace closure of the rest of X ∩ U, so X ∩ U is subspace-connected, but the segment is clopen for portlyTop. The proofs avoid this: local path-connectedness from explicit bases (Euclidean balls off the disc, ray segments, truncated cones GX.portlyCone at circle points), then 'spread' from local connectedness. The counterexample to the audit's route is recorded in SCOPE as prose, not formalized.","Item 1 now has a cheap inhabitant (GX.cex_portlyness_fst): p = Prod.fst : ℝ² → ℝ, X₁ = ℝ × {0} (not open), Y₁ = ℝ; X₁ → Y₁ a homeomorphism (surjective covering map) and (0,0) ∉ ord(X), 0 ∉ ord(Y)."],"notes":"WP-25a, audited clean.","twin":"","tex":"\\begin{cex}[Portlyness of $X_1$] \\ \n\\begin{itemize}\n \\item If $X_1$ is not open, then take $x \\in X_1\\setminus Int(X_1)$, for neighborhood $\\V$ of $x$ small enough, the set $\\V\\cap X_1$ is mapped homeomorphically to some open neighborhood $\\U$ of $p(x)$. For $\\V$ small enough, $p(\\V)\\subset \\U$ thus $p(\\V\\setminus X_1) \\cap p(\\V\\cap X_1)\\neq \\emptyset$. In otherword, $p$ is not injective in any neighborhood of $x$. \n In particular, $p(x)\\notin \\ord(Y)$ and  $x\\notin \\ord(X)$.\n \\item  Take $X\\subset Y=\\RR^2$ with the Euclidean norm,\n $X=\\{x~|~\\|x\\|\\geq 1\\} \\cup \\{\\lambda x ~|~ \\lambda \\in ]0,1], \\|x\\|=1, x\\in \\mathbb Q^2\\}$.  Endow $Y$ with its usual topology but $X$ with the coarsest topology making the natural injection $X\\rightarrow Y$ a spread : the subset $\\{\\lambda x ~|~ \\lambda \\in ]0,1[, \\|x\\|=1, x\\in \\mathbb Q^2\\}$ is homeomorphic to $\\coprod_{i\\in \\N} ]0,1[$. \n  Define piecewise $p(x) = \\frac{x}{\\|x\\|^2}$ if $\\|x\\|\\leq 1$ and $p(x) = x$ if $\\|x\\|>1$. Take $X_1=\\{x~|~\\|x\\|>1\\}=Y_1$. Notice that $X_1\\xrightarrow{p} Y_1$ is an homeomorphism hence a covering, $X$ is Hausdorff, second countable and locally path-connected, $X\\xrightarrow{p}Y$ is a spread, $Y_1$ is open and $X_1$ is open locally connected in $X$.  However, $\\ord(Y)=\\emptyset$ since for every open neighborhood $\\U$ of some $y\\in p(X)$, the preimage $p^{-1}(\\U)$ contains points $x$ with $\\|x\\|<1$ but $p$ is not …"},{"id":"lem:ord_iso","block":"RamcovGX.tex:813:822","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":889,"deps":[],"decls":["GX.Spread.ord_iso","GX.image_ordX_of_homeomorph","GX.image_ordY_of_homeomorph","GX.preimage_image_homeomorph"],"ndecls":4,"findings":[],"notes":"WP-25a, audited clean.","twin":"","tex":"\\begin{lem} Let $X_i\\xrightarrow{p_i} Y_i$ be spreads for $i\\in \\{1,2\\}$ and let $(f,g)$ be a spread isomorphism from $X_1\\rightarrow Y_1$ to $X_2\\rightarrow Y_2$. Then $g(\\ord(X_1)) = \\ord(X_2)$ and $f(\\ord(Y_1)) = \\ord(Y_2)$.\n \n\\end{lem}"},{"id":"def:complete_spread_spread_completion","block":"RamcovGX.tex:813:822","kind":"definition","num":"","title":"Complete spread, spread completion","bucket":"A","lean":"closed","nl":"definition","line":903,"deps":[],"decls":["GX.IsCNbhd","GX.IsCompOf","GX.SpreadEnd","GX.SpreadEnd.ofPoint","GX.IsCompleteSpread","GX.isCompleteSpread_iff","GX.IsSpreadCompletion","GX.IsFoxCompletion"],"ndecls":8,"findings":[],"notes":"WP-25c, audited clean.","twin":"","tex":"\\begin{defi}[Complete spread, spread completion] Let  $X\\xrightarrow{p} Y$ be a spread. For $y\\in \\overline{p(X)}$, consider the set $X_y$ of maps $$\\chi : \\{\\U\\subset Y ~ \\text{ open and connected neighborhood of }y\\} \\rightarrow \\{\\V\\subset X ~ \\text{open connected}\\}$$ increasing for the inclusion and such that  $\\chi(\\U)$ is a connected component of $p^{-1}(\\U)$ for all $\\U$.\nThe spread $X\\xrightarrow{p} Y$ is complete if for all $y\\in \\overline{p(X)}$ and all $\\chi \\in X_y$, the intersection of $\\chi(\\U)$ for $\\U$ going through all open connected neighborhood of $y$ is non empty.\n\nA completion of a spread $X\\xrightarrow{p} Y$ is a spread $X'\\xrightarrow{p'} Y$ together with a spread morphism $(Id_Y,\\iota)$\n$$\\xymatrix{\nX\\ar[d]^p \\ar[r]^\\iota & X' \\ar[d]^{p'} \\\\ Y \\ar@{=}[r] & Y\n} $$\nsuch that $\\iota$ is an embedding, $X'$ is complete and the image of $\\iota$ is portly.\n\\end{defi}"},{"id":"theo:Fox_completion_functor","block":"RamcovGX.tex:813:822","kind":"theorem","num":"","title":"[MR0123298]","bucket":"C","lean":"partial","nl":"cited","line":914,"deps":[],"decls":["GX.SpreadEnd.isFoxCompletion_base","GX.SpreadEnd.isSpread_base","GX.SpreadEnd.isCompleteSpread_base","GX.SpreadEnd.isEmbedding_ofPoint","GX.SpreadEnd.denseRange_ofPoint","GX.SpreadEnd.isLocallyConnectedIn_range_ofPoint","GX.SpreadEnd.isSpreadCompletion_base_iff","GX.IsFoxCompletion.homeomorph","GX.IsFoxCompletion.existsUnique_homeomorph","GX.IsSpreadCompletion.existsUnique_homeomorph","GX.exists_isSpreadCompletion_iff","GX.not_exists_isSpreadCompletion_foxSeq"],"ndecls":40,"findings":["l.915 existence is false as written: the inclusion of ℂ ∖ {1/(n+1)} into ℂ is a spread (Hausdorff, second countable, locally path-connected source, GX.locPathConnectedSpace_compl_countable) with NO completion in the paper's sense (GX.not_exists_isSpreadCompletion_foxSeq; in every universe: GX.not_isSpreadCompletion_foxSeq, and in general GX.not_isSpreadCompletion_of_not_isOpen): by uniqueness every completion is id_ℂ, and the image ℂ ∖ {1/(n+1)} is not open (0 is a limit of removed points). What is true: Fox's completion (space of ends) always exists with a dense, locally-connected-in image (Fox's own notion; IsFoxCompletion), and it is a completion in the paper's sense iff that image is open (GX.exists_isSpreadCompletion_iff) — e.g. when p lands in an open subset of its ordinary locus (the completion of a covering of a portly subset, the case l.1147/l.1170/l.1439 use).","l.915 uniqueness holds, in the strong form: any two completions (even in Fox's sense) are isomorphic by a UNIQUE homeomorphism over Y and under X (GX.IsFoxCompletion.existsUnique_homeomorph).","l.915 'fully faithful' is false (as the 2021 draft): the completion functor is faithful but not full (GX.not_full_foxCompletionFunctor: ℂ∖{0} and ℂ∖{1} both complete to ℂ, and the identity between the completions extends no morphism ℂ∖{0} → ℂ∖{1}; also GX.completion_not_full for the paper's completions id_ℂ). What l.1170 and l.1439 actually use is true and proved: every spread morphism (f, g) extends uniquely and continuously to the completions (GX.SpreadEnd.map, GX.SpreadEnd.eq_map), functorially (map_id, map_comp), and the extension determines g (map_injective); the same holds between ARBITRARY completions (Fox's or the paper's), as l.1170/l.1439 use it (GX.IsFoxCompletion.existsUnique_extend: a unique continuous ḡ with p₂'∘ḡ = f∘p₁' and ḡ∘ι₁ = ι₂∘g).","Local path-connectedness of the completion (needed for 'completion is a functor from Spread to itself' under the §3 standing assumptions, and used by lem:complete_path_carac l.1033 via lem:path_covering on the completion) is proved: GX.SpreadEnd.locPathConnectedSpace (paths to an end are infinite concatenations through e(W_n), W_n a decreasing basis at the base)."],"notes":"WP-25c, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: The paper's 'completion of spread is a functor from Spread to itself' needs a locally connected base for the space of ends to be a spread; the functor is formalized on the full subcategory LocallyConnectedSpace Y ∧ T2Space Y ∧ T0Space X (the §3 standing assumptions imply it). Is that the intended domain?","twin":"","tex":"\\begin{thm}[\\cite{MR0123298,MR2198590}] \n Every spread admits a unique completion up to isomorphism, furthermore the completion of spread is a fully faithful functor  from $\\CatSpread$ to itself.\n\\end{thm}"},{"id":"prop:spread_fiber","block":"RamcovGX.tex:813:822","kind":"proposition","num":"","title":"[MR2198590]","bucket":"C","lean":"partial","nl":"proved","line":924,"deps":[],"decls":["GX.DiscreteSets","GX.FiberThread","GX.fiberMap","GX.continuous_fiberMap","GX.isInducing_fiberMap","GX.injective_fiberMap","GX.isEmbedding_fiberMap","GX.isOpenMap_fiberMap_iff","GX.mem_range_fiberMap_iff","GX.surjective_fiberMap_iff_threads","GX.FiberThread.toEnd","GX.surjective_fiberMap_iff_ends"],"ndecls":31,"findings":["l.928 'injective open': injective and an embedding (open onto its image) is proved (GX.isEmbedding_fiberMap); the literal 'open map into the inverse limit' is equivalent to the image being open (GX.isOpenMap_fiberMap_iff) and is FALSE, proved by GX.not_isOpenMap_fiberMap_comb: X = GX.combSet ⊆ ℝ², the x-axis with the arms {(t, r_n − t) : 0 < t ≤ r_n}, r_n = 2⁻ⁿ (Hausdorff, second countable, locally path-connected — instance), p = first projection (a spread, GX.isSpread_combProj), b = 0, 𝓤 = {(−ρ, ρ)}: p⁻¹(0) is the origin, and the arm-n thread (GX.combThread) agrees with the origin's on every (−ρ, ρ) with ρ > r_n (combThread_eq_of_lt) but is unrealised (combThread_ne), so every cylinder around φ(origin) leaves the image. The proof's identity φ(V ∩ p⁻¹(b)) = π_U⁻¹(V) (l.940) holds only when every thread through V is realised.","l.929 'homeomorphism iff complete' is false for a fixed b: exp : ℝ → ℝ at b = 1 has the natural map a homeomorphism for every basis while exp is not complete (GX.fiberMap_exp_bijective_not_complete). True forms: for fixed b, onto iff every thread (equivalently every end at b) has a point (surjective_fiberMap_iff_threads, surjective_fiberMap_iff_ends); complete iff onto for every b and every basis (GX.isCompleteSpread_iff_forall_surjective_fiberMap), equivalently for one basis at each b (GX.isCompleteSpread_iff_forall_exists_surjective_fiberMap), and then a homeomorphism (GX.fiberHomeomorph)."],"notes":"WP-25c, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: Is 'injective open' meant as 'a homeomorphism onto its image' (proved) rather than 'an open map into the limit' (false, comb)? | Is 'connected neighbourhood basis' meant to allow non-open connected neighbourhoods? The comparison with ends is stated for open ones (IsCNbhd); the embedding is proved for any neighbourhood basis (fiberMapNhds).","twin":"","tex":"\\begin{prop}[\\cite{MR2198590}] \n Let $X\\xrightarrow{p} Y$ be a spread and let $b\\in Y$. Let $\\boldsymbol{\\U}$ be a connected neighborhood basis of $b$. \n \n Then, the  natural map $p^{-1}(b) \\rightarrow \\varprojlim_{\\U\\in \\boldsymbol{\\U}}X_\\U$ \n is injective open. \n Furthermore, it is an homeomorphism if and only if the spread $X\\xrightarrow{p}Y$ is complete.\n\n\\end{prop}"},{"id":"cor:totdiscont","block":"RamcovGX.tex:813:822","kind":"corollary","num":"","title":"[MR2198590]","bucket":"A","lean":"closed","nl":"cited","line":947,"deps":[],"decls":["GX.isTotallyDisconnected_fiber"],"ndecls":1,"findings":[],"notes":"WP-25c, audited clean.","twin":"","tex":"\\begin{cor}[\\cite{MR2198590}] Let $X\\xrightarrow{p} Y$ be a spread, then the fibers of $p$ are totally discontinuous. \n\\end{cor}"},{"id":"lem:path_covering","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":967,"deps":[],"decls":["GX.path_covering","GX.exists_path_of_isPortly_of_isOpen"],"ndecls":2,"findings":[],"notes":"WP-24a, audited clean.","twin":"","tex":"\\begin{lem} Let $X$ be a connected first countable, locally path-connected, Hausdorff topological space and let $\\U\\subset X$ be a portly subset. \nFor all $a\\in \\U$ and all $b\\in X$, there exists a path $\\gamma: [0,1]\\rightarrow X$  from $a$ to $b$ such that $\\gamma([0,1[)\\subset \\U$.\n\\end{lem}"},{"id":"lem:portly_first_countable","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":974,"deps":["lem:path_covering"],"decls":["GX.portly_first_countable","GX.isPathConnected_inter_of_isPortly"],"ndecls":2,"findings":[],"notes":"WP-24a, audited clean.","twin":"","tex":"\\begin{lem} Let $X$ be a connected first countable, locally path-connected Hausdorff topological space and let $X_1$ a subset containing a portly subset. Then, $X_1$ is first countable, locally path connect Hausdorff.\n\\end{lem}"},{"id":"def:branched_covering","block":"RamcovGX.tex:813:955","kind":"definition","num":"","title":"Branched covering","bucket":"A","lean":"closed","nl":"definition","line":988,"deps":[],"decls":["GX.IsBranchedCovering","GX.branchingLocus","GX.IsPossiblyBranchedOver","GX.fiber","GX.isBranchedCovering_id"],"ndecls":5,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{defi}[Branched covering]  A {\\it branched covering} is a complete surjective spread $X\\rightarrow Y$, with $X$ and $Y$ connected, whose ordinary locii in $X$ and $Y$ are portly subsets of $X$ and $Y$ respectively. We call $Y$ the {\\it base space}, $X$ the {\\it total space} and the inverse image of a point $a$ of $Y$ is called the {\\it fiber} above $a$.\n \n We say that $X\\rightarrow Y$ is branched over $Y\\setminus \\ord(Y)$. The latter is the branching locus of $X\\rightarrow Y$ and for $S\\subset Y$, we say that $X\\rightarrow Y$ is possibly branched over $S$ if $S$ contains its branching locus.\n\n \\end{defi}"},{"id":"rem:branching_locii_branched_covering","block":"RamcovGX.tex:813:955","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":998,"deps":[],"decls":["GX.IsBranchedCovering.branching_locii"],"ndecls":1,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{rem} The branching locii of a branched covering are skeletal thus closed with empty interior.\n \\end{rem}"},{"id":"rem:ordinary_part_branched_covering","block":"RamcovGX.tex:813:955","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1000,"deps":[],"decls":["GX.IsBranchedCovering.ordinary_part"],"ndecls":1,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{rem}\n The ordinary part $\\ord(X)\\rightarrow \\ord(Y)$ of a branched covering $X\\rightarrow Y$ is a covering. Indeed, $X$ is open connected and $\\ord(X)$ is portly so $\\ord(X)=\\ord(X)\\cap X$ is connected. \n\\end{rem}"},{"id":"lem:portly_preimage_branched","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1003,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{lem} If $X\\xrightarrow{p} Y$ is a branched covering, then the preimage of  portly subset of $Y$ is portly in $X$.\n\\end{lem}"},{"id":"lem:complete_path_carac","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1014,"deps":["lem:spread_partial_covering","lem:path_covering"],"decls":["GX.complete_path_carac","GX.PathLiftExtends","GX.HomotopyLiftExtends","GX.exists_extend_of_isCompleteSpread","GX.exists_extend_path_of_isCompleteSpread","GX.isCompleteSpread_of_pathLiftExtends","GX.exists_partial_lift"],"ndecls":7,"findings":["l.1031: the proof applies lem:path_covering in Y, which needs Y connected, but the lemma does not assume Y connected. It follows (Y1 is dense and lies in p(X), which is connected since X is), so the statement is true; the proof should say so.","l.1032-1033: the proof embeds X in 'the completion' X̄ with X portly in X̄; by WP-25c a completion in the paper's sense need not exist (theo:Fox_completion_functor existence is false in general). The argument is repaired with Fox's space of ends, in which only the image of X1 = p^{-1}(Y1) needs to be portly; it is, being base^{-1}(Y1) (ends over ordinary points are realised)."],"notes":"WP-25d, audited clean. Readings/questions: Partial lifts on [0,1) (resp. Q x [0,1)) are read as functions on I (resp. Q x I) continuous on {t < 1}; the value at t = 1 is ignored.","twin":"","tex":"\\begin{lem} \n Let $X\\xrightarrow{p} Y$ be a spread with $X$ connected which induces a covering $X_1\\rightarrow Y_1$ for some $X_1$ and $Y_1$ portly subsets of $X$ and $Y$ respectively. Then the following are equivalent:\n \\begin{enumerate}[(i)]\n  \\item $X\\rightarrow Y$ is a branched covering;\n  \\item $X\\rightarrow Y$ is a complete spread\n  \\item for every Hausdorff locally connected topological space $Q$ and every homotopy $H:Q\\times [0,1]\\rightarrow Y$ such that $H(Q\\times [0,1[)\\subset Y_1$, every partial lift \n  $\\hat H : Q \\times [0,1[ \\rightarrow X_1$ of $H$ extends continuously to some lift $Q \\times [0,1] \\rightarrow X$ of $H$;\n  \\item for every path $\\gamma:[0,1]\\rightarrow Y$ such that $\\gamma([0,1[) \\subset Y_1$, every partial lift \n  $\\hat \\gamma : [0,1[ \\rightarrow X_1$ extends continuously to some lift $[0,1] \\rightarrow X$ of $\\gamma$.\n  \n \\end{enumerate}\n\\end{lem}"},{"id":"lem:branched_covering_restriction","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"[MR2198590]","bucket":"A","lean":"closed","nl":"proved","line":1041,"deps":["lem:complete_path_carac"],"decls":["GX.branched_covering_restriction"],"ndecls":1,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{lem}[\\cite{MR2198590}]\n Let $X\\xrightarrow{p} Y$ be a branched covering, let $\\U$ be some open connected subset of $Y$ and let $\\V$ be a connected component of $p^{-1}(\\U)$. Then $\\V\\xrightarrow{p} \\U$ is a branched covering.\n\\end{lem}"},{"id":"cor:spread_connected_image","block":"RamcovGX.tex:813:955","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1053,"deps":["lem:branched_covering_restriction"],"decls":["GX.spread_connected_image"],"ndecls":1,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{cor}\n   Let $X\\xrightarrow{p} Y$ be a branched covering. Then $p$ is open, furthermore for every connected open $\\U\\subset Y$ and every connected component $\\V$ of $p^{-1}(\\U)$ \n   the map $\\V\\xrightarrow{p} \\U$ is surjective.\n\\end{cor}"},{"id":"cor:subcovering_portly","block":"RamcovGX.tex:813:955","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1062,"deps":["lem:portly_preimage_branched","lem:branched_covering_restriction"],"decls":["GX.subcovering_portly"],"ndecls":1,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{cor} \n  Let $X\\xrightarrow{p} Y$ be a branched covering, let $\\U$ be some portly subset of $Y$ then $p^{-1}(\\U)\\xrightarrow{p}\\U$ is a branched covering.\n\\end{cor}"},{"id":"lem:subcovering_general","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1069,"deps":["lem:portly_preimage_branched","lem:portly_first_countable","cor:subcovering_portly","lem:complete_path_carac"],"decls":["GX.subcovering_general","GX.subset_ordY_restrict","GX.pathLiftExtends_restrict"],"ndecls":3,"findings":[],"notes":"WP-25d, audited clean.","twin":"","tex":"\\begin{lem}\n Let $X\\xrightarrow{p} Y$ be a branched covering, let $Y_1\\subset Y$ containing a portly subset of $Y$ then $p^{-1}(Y_1)\\xrightarrow{~p~}Y_1$ is a branched covering.\n\\end{lem}"},{"id":"prop:branched_covering_composition","block":"RamcovGX.tex:813:955","kind":"proposition","num":"","title":"","bucket":"C","lean":"partial","nl":"proved","line":1091,"deps":["cor:spread_connected_image","lem:spread_partial_covering","lem:complete_path_carac"],"decls":["GX.branched_covering_composition","GX.preimage_ordY_comp_subset","GX.image_branchingLocus_subset","GX.isSkeletal_closure_image_branchingLocus","GX.not_isSkeletal_of_isBranchedCovering_comp","GX.isBranchedCovering_comp_of_finite","GX.isBranchedCovering_comp_of_semilocallySimplyConnected","GX.isBranchedCovering_comp_of_isSkeletal","GX.isBranchedCovering_comp_of_isCoveringMap"],"ndecls":9,"findings":["unchanged; stays partial by DEC-48"],"notes":"WP-27c, audited clean. Partial: paper statement corrected (DEC-27)","twin":"","tex":"\\begin{prop} Let $X\\xrightarrow{p} Y \\xrightarrow{q} Z $ be two branched coverings.   Then the following are equivalent: \n\\begin{enumerate}[(i)]\n \\item $X\\xrightarrow{q\\circ p} Z$ is a branched covering,\n     \\item $q(Y\\setminus \\ord_p(Y))$  is skeletal in $Z$.\n \\end{enumerate}\n\n\\end{prop}"},{"id":"rem:completion_covering","block":"RamcovGX.tex:813:955","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1147,"deps":["theo:Fox_completion_functor"],"decls":["GX.completion_covering","GX.completion_covering_unique"],"ndecls":2,"findings":["unchanged by WP-27c"],"notes":"WP-27c, audited clean.","twin":"","tex":"\\begin{lem} Let $X\\xrightarrow{p} Y$ be a branched covering and $\\U\\subset Y$ some portly subset. The spread $X\\rightarrow Y$ is isomorphic to the completion of $p^{-1}(\\U)\\rightarrow Y$.\n\\end{lem}"},{"id":"prop:universality","block":"RamcovGX.tex:813:955","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1158,"deps":[],"decls":["GX.MaxBranchedCover","GX.maxBranched_isBranchedCovering","GX.maxBranched_universal","GX.maxBranched_isMaximal","GX.IsMaximalPossiblyBranched","GX.maxBranched_unique"],"ndecls":6,"findings":["unchanged by WP-27c"],"notes":"WP-27c, audited clean.","twin":"","tex":"\\begin{prop} Let $Y$ be a connected, locally path-connected, Hausdorff topological space.  Let $S$ be a skeletal subset of $Y$.\n\nIf $Y\\setminus S$ is semi-locally simply connected then  there exists a covering $\\widetilde Y^S$ of $Y$ possibly branched over $S$ which is maximal among such branched covering.\nFurthermore, $\\widetilde Y^S$\n is unique up to isomorphism and universal in the sense that for any covering $X\\xrightarrow{p} Y$ possibly branched over $S$, there exists a covering $\\widetilde Y^S\\rightarrow X$ possibly branched over $p^{-1}(S)$.\n\\end{prop}"},{"id":"rem:one_could_sum_up","block":"RamcovGX.tex:813:955","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1164,"deps":["theo:Fox_completion_functor"],"decls":["GX.isBranchedCovering_of_isSpreadCompletion","GX.isSpreadCompletion_ends_of_isCoveringMap","GX.completion_hom_equiv","GX.completion_hom_ext","GX.completion_hom_id","GX.completion_hom_comp","GX.isBranchedCovering_of_comm"],"ndecls":7,"findings":["unchanged by WP-27c (DEC-46(d))"],"notes":"WP-27c, audited clean.","twin":"","tex":"\\begin{rem}\nOne could sum up the proof below by saying Fox completion induces a category equivalence between the category of covering of $Y\\setminus S$  and the category of covering of $Y$ possibly branched over $S$.\n\\end{rem}"},{"id":"rem:considering_maximal_covering_possibly","block":"RamcovGX.tex:813:955","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1176,"deps":[],"decls":["GX.sphere2_maxBranched_trivial","GX.maxBranched_trivial_of_simplyConnected","GX.isSkeletal_sphere2_singleton"],"ndecls":3,"findings":["unchanged by WP-27c"],"notes":"WP-27c, audited clean.","twin":"","tex":"\\begin{rem}\n Considering the maximal covering $\\widetilde Y^S$ of some $Y$ possibly branched over some subset $S$, there is an ambiguity: the branching locus of $\\widetilde Y^S$ might be smaller than $S$. One can consider the example where $Y=\\mathbb S^2$ the 2-dimensionnal sphere and $S$ is a singleton, since the complement of a point is simply connected, the maximal covering of $\\mathbb S^2$ possibly branched above $S$ is trivial and the branching locus is empty. \n \\end{rem}"},{"id":"cex:proposition_prop_branched_covering","block":"RamcovGX.tex:813:955","kind":"counterexample","num":"","title":"to Proposition prop:branched_covering_composition","bucket":"A","lean":"closed","nl":"open","line":1181,"deps":["ex:quotient_base"],"decls":["GX.cex_branched_covering_composition","GX.cexS_not_isSkeletal","GX.dense_qDisc_image_cexS","GX.isBranchedCovering_qDisc","GX.not_isBranchedCovering_qDisc_comp","GX.exists_branched_over","GX.logChart_mem_branchingLocus","GX.not_homotopic_refl_of_exp_lift","GX.isSkeletal_branchSet","GX.semilocallySimplyConnected_branchSet","GX.exists_isDenseFamilyY₀","GX.cexS"],"ndecls":18,"findings":["l.1184 'S is skeletal' is false: the apex is in the closure of S (GX.cexS_not_isSkeletal); with S ∪ {apex} (DEC-53) the counterexample holds in full (GX.cex_branched_covering_composition). The row closes under DEC-53, the correction recorded. 'Y∖S semilocally simply connected' for the printed S (also false at the apex) is not formalized; it is superseded by the ruled S ∪ {apex}.","l.1186: 'q(Y∖ord_p(Y)) = q(S)' is false as printed. The branching locus Y∖ord_p(Y) is closed (ord_p open) and contains S, hence the apex (in the closure of S); with branchingLocus ⊆ S ∪ {apex} it is exactly S ∪ {apex}, so q(Y∖ord_p(Y)) = q(S) ∪ {0} ≠ q(S) (0 ∉ q(S) since r_n > 0). The equality holds with S ∪ {apex} in place of S (DEC-53); the density argument and the conclusion are unaffected. Proved in GX.cex_branched_covering_composition (conjuncts branchingLocus = insert apex S, q-image = insert 0 (q '' S), q-image ≠ q '' S)."],"notes":"WP-27c, audited clean.","twin":"","tex":"\\begin{cex}[to Proposition \\ref{prop:branched_covering_composition}]\n\nTaking notions from example \\ref{ex:quotient_base},  Consider $Z=\\DD$, $Y=\\DD_\\infty$ with $Y\\xrightarrow{q} Z$ the quotient map which is a branched covering. Consider $Y_0 = \\{(r,\\theta) ~|~ \\theta \\in ]0,1[\\}$ and choose $(r_n,\\theta_n)_{n\\in \\ZZ}$ a countable dense family in $Y_0$. Consider $S := (r_n,\\theta_n+n)_{n\\in \\ZZ}$. We see that $S$ is skeletal and that $Y\\setminus S$ is semi-locally simply connected. We thus consider $X:= \\widetilde Y^{S} \\xrightarrow{p} Y$ the maximal covering possibly branched over $S$. \n\nNotice that $q(Y\\setminus \\ord_p(Y)) = q(S)$ is dense in $Z$ hence not skeletal, therefore the composition $q\\circ p$ is not a branched covering. \n\\end{cex}"},{"id":"def:almost_trivial_loop","block":"RamcovGX.tex:813:1189","kind":"definition","num":"","title":"Almost trivial loop","bucket":"A","lean":"closed","nl":"definition","line":1210,"deps":[],"decls":["GX.AlmostTrivialCC","GX.OmegaSet","GX.MemOmega","GX.AlmostTrivial","GX.AlmostTrivialAt","GX.almostTrivialCC_iff","GX.eventually_almostTrivialAt_iff","GX.eventually_homotopic_family","GX.OmegaHomotopic.mem_connectedComponentIn"],"ndecls":9,"findings":["l.1201 calls 'same connected component of the compact-open Omega(x,y,U)' and 'homotopic with respect to U' equivalent. Homotopic => same component holds in general (GX.OmegaHomotopic.mem_connectedComponentIn); for almost triviality the converse is proved when U is open and semilocally simply connected and X locally path-connected (GX.almostTrivialCC_iff: for each open V the set of loops homotopic w.r.t. U to a loop of Omega(x,x,V cap U) is clopen in Omega(x,x,U), being decided by the middle of the loop, whose compact-open perturbations are homotopies in U up to short end connections, by homotopy lifting in the universal cover of U). Without semilocal simple connectivity of U the 'equivalently' is not established (the clopen argument needs it: without it a compact-open perturbation of the middle of a loop need not be homotopic to it; no counterexample to the 'equivalently' is proved)."],"notes":"WP-40a, audited clean.","twin":"","tex":"\\begin{defi}[Almost trivial loop] Let $X$ be a Hausdorff, locally path-connected topological space, let $\\U\\subset X$ be an open subset and let $x\\in \\overline \\U$.\n\nA loop $\\gamma\\in \\Omega(x,x,\\U)$ is  almost trivial with respect to $\\U$ if its connected component in $\\Omega(x,x,\\U)$ intersects $\\Omega(x,x,\\V\\cap \\U)$ for all neighborhood $\\V$ of $x$. \n\\end{defi}"},{"id":"ex:consider_carthesian_coordinates_usual","block":"RamcovGX.tex:813:1189","kind":"example","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1214,"deps":[],"decls":["GX.cartS₁","GX.cartS₂","GX.IsHomTrivial","GX.carthesian_S₁_trivial","GX.CartPiOneZ","GX.carthesian_piOne_S₁","GX.carthesian_piOne_S₁_at","GX.cartDeg","GX.cartDeg_bijective","GX.carthesian_piOne_S₂","GX.cartHE","GX.cartKappa"],"ndecls":41,"findings":["l.1216: S2 is printed as {y = sin(1/x)} union a segment, which in R^3 is a surface (z free); read with z = 0 on the graph (the planar topologist's sine curve), as the proof's 'plane {z=0}' and claim 1 require","l.1243-1244: H'(s,t) = (0, lambda_s t, 0) lies on the segment of S2; with gamma(t) = (0,0,t) near the ends it should read (0, 0, lambda_s t) and (0, 0, -lambda_s t)","l.1218: 'The isomorphism is given by the number of turns around S_i' — for S1 this is GX.cartDeg (winding of y + iz), proved bijective","l.1229-1257 (fourth claim): the mod 2 intersection numbers can be replaced by windings around 0 of psi + i z, psi a signed distance to the planar curve P: globally psi > 0 above P; locally psi* > 0 only on the finitely many pockets of A+ met at an intermediate time (they are cut off at x = 1/(pi/2 + 2 pi k) and x = -1/(3 pi/2 + 2 pi k), where sin(1/x) = 1). The winding of psi + i z along the reparametrised homotopy stays -pi, that of psi* + i z is +pi near the end of the homotopy, and the two agree at the intermediate time. Formalized as GX.not_isHomTrivial_cartγ for the loop t -> (0, 4 sin^2(pi t), sin(pi t) cos(pi t)) (it leaves O upwards over the limit segment, crosses z = 0 once at (0,4,0) in A+, and returns from below); the paper's normalisation through c (l.1236-1241) is replaced by an explicit frame reparametrisation (GX.cartM).","l.1222: the paper's loop 'gamma(t) = (0,0,t) for t < 1/4' is not needed; any loop leaving O over the limit segment and crossing the plane only in A+ works","l.1218, l.1224 ('left to the reader', first claim for S2): proof supplied by an explicit homotopy equivalence R^3 minus S2 ~ R^3 minus S1 (GX.cartHE): (x,y,z) -> (x, y + 2s psi/(|psi|+|z|), z) pushes the plane points above/below P off the strip R x [-1,1] x {0}, and the radial expansion (x,w) -> (x, (1 + s/|w|) w) of w = (y,z) maps R^3 minus S1 into the complement of that strip; the transfer to pi_1 is Mathlib's equivalence of fundamental groupoids","l.1225-1228 (third claim): the paper's step 'Y minus closed B(S2,eps) is homeomorphic to Y minus S1' is not used; instead the middle of the loop is homotopic in Y minus S2 to a path of B minus S2 because pi_1(Y minus S2) = Z is generated by a small circle around an arc of S2 inside B (in the plane x = 1/(2 pi k)), and B minus S2 is path-connected (GX.cart_middle_homotopic)","l.1216 (ruled, DEC-68 (a)): as printed {y = sin(1/x)} is a surface of R^3 and S2 is not closed; certified for S2 = sine curve x {0}"],"notes":"WP-40a, audited clean. Readings/questions: Reading (g) (DEC-56): homotopically trivial = homotopic with fixed ends to the constant loop through loops of Omega(O,O,U) (GX.IsHomTrivial). Reading (a) of DEC-68 for S2.","twin":"","tex":"\\begin{ex}\n Consider $Y = \\RR^3$ with carthesian coordinates $x,y,z$ and its usual Euclidean distance; let  $S_1= \\{y=z=0\\}$ and $$S_2=\\{y=sin(1/x) ~:~ x\\in \\RR^*\\}\\cup \\{x=z=0, |y|\\leq 1 \\};$$ denote $O=(0,0,0)$ the origin. \n We make the following claims.\n \\begin{itemize}\n  \\item  The fundamental group of $Y\\setminus S_i$ is isomorphic to $\\ZZ$ for both $i=1$ and $i=2$. The isomorphism is given by \"the number of turns\" around $S_i$. \n  \\item Every loop  $\\gamma\\in \\Omega(O,O,Y\\setminus S_1)$ is homotopically trivial hence almost trivial.\n  \\item Every loop  $\\gamma\\in \\Omega(O,O,Y\\setminus S_2)$ is almost trivial. \n  \\item There exists non homotopically trivial loops $\\gamma\\in \\Omega(O,O,Y\\setminus S_2)$.\n \\end{itemize}\n\\end{ex}"},{"id":"def:almost_homotopic_paths","block":"RamcovGX.tex:813:1189","kind":"definition","num":"","title":"Almost homotopic paths","bucket":"A","lean":"closed","nl":"definition","line":1262,"deps":[],"decls":["GX.AlmostHomotopicCC","GX.AlmostHomotopic","GX.almostHomotopicCC_iff"],"ndecls":3,"findings":[],"notes":"WP-40a, audited clean.","twin":"","tex":"\\begin{defi}[Almost homotopic paths]\n Let $X$ be a Hausdorff, locally path-connected topological space, let $\\U\\subset X$ be an open subset and let $(x,y)\\in \\U\\times \\overline \\U$.\n\nTwo paths $\\gamma_1,\\gamma_2 \\in \\Omega(x,y,\\U)$ are almost homotopic with respect to $\\U$ if the loop $(\\gamma_2)^{-1}*\\gamma_1$ is almost trivial with respect to $\\U$.\n\\end{defi}"},{"id":"rem:implicitely_two_almost_homotopic","block":"RamcovGX.tex:813:1189","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1268,"deps":[],"decls":["GX.AlmostHomotopicCC.ends","GX.AlmostHomotopic.ends"],"ndecls":2,"findings":[],"notes":"WP-40a, audited clean.","twin":"","tex":"\\begin{rem} Implicitely, two almost homotopic paths $\\gamma_1,\\gamma_2$ always satisfy $\\gamma_1(1)=\\gamma_2(1)$ and $\\gamma_1(0)=\\gamma_2(0)$. \n\\end{rem}"},{"id":"lem:almost_homotopic_carac","block":"RamcovGX.tex:813:1189","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1271,"deps":[],"decls":["GX.almost_homotopic_carac_cc_component","GX.almost_homotopic_carac_cc","GX.almost_homotopic_carac","GX.splice","GX.splice_omegaHomotopic"],"ndecls":5,"findings":["l.1277: item (ii) prints gamma_{|[0,t_0]} * omega * gamma_{|[t_1,t_0]}; the last factor is gamma_{|[t_1,1]}","l.1278-1279 (ruled, DEC-68 (b)): the proof of (i) => (ii) uses the homotopy form of l.1201, which the literal component form (DEC-55) implies when U is semilocally simply connected (GX.almostTrivialCC_iff); certified with U slsc.","Item (ii)'s 'homotopic in Omega(x,x,U)' is certified in both readings: literal (same compact-open component, GX.almost_homotopic_carac_cc_component) and homotopy form (stronger, GX.almost_homotopic_carac_cc)."],"notes":"WP-40a, audited clean. Readings/questions: Reading (b): '*' as any parameterization is made concrete by GX.splice.","twin":"","tex":"\\begin{lem} \n Let $X$ be a Hausdorff, first countable, connected, locally path-connected topological space, let $\\U\\subset X$ be an open subset and let $x \\in  \\overline \\U$.\n \n For $\\gamma \\in \\Omega(x,x,\\U)$,  the following are equivalent:\n \\begin{enumerate}[(i)]\n  \\item $\\gamma$ is almost trivial with respect to $\\U$;\n  \\item for all open neighborhood $\\V$ of $x$ and for all $t_0,t_1\\in ]0,1[$ such that $t_0<t_1$ and $\\gamma([0,t_0]\\cup [t_1,1])\\subset \\V$, there exists a path $\\omega : \\gamma(t_0)\\rightsquigarrow \\gamma(t_1)$ in $\\V\\cap \\U$ such that $\\gamma$ is homotopic to $\\gamma_{|[0,t_0]}*\\omega*\\gamma_{|[t_1,t_0]}$ in $\\Omega(x,x,\\U)$.\n \\end{enumerate}\n\\end{lem}"},{"id":"lem:hausdorff_first_countable_connected","block":"RamcovGX.tex:813:1189","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1290,"deps":["lem:almost_homotopic_carac"],"decls":["GX.hausdorff_first_countable_connected_cc","GX.almostHomotopicCC_refl","GX.AlmostHomotopicCC.symm","GX.AlmostTrivialCC.symm","GX.AlmostHomotopicCC.trans","GX.hausdorff_first_countable_connected","GX.GermEquiv","GX.almostHomotopic_iff_germEquiv"],"ndecls":8,"findings":["l.1298-1303: the proof's indices drift (gamma_2^{-1}*gamma_1 for gamma_2^{-1}*gamma_3, gamma_{2|[0,t_1]} for gamma_{2|[0,t_2]}, omega_3 for omega_2, t_0 for t_1); the argument is sound once corrected, for the homotopy form","Under DEC-55 the proof rests on lem:almost_homotopic_carac (i) => (ii), certified with U slsc (DEC-68 (b))."],"notes":"WP-40a, audited clean.","twin":"","tex":"\\begin{lem} \n Let $X$ be a Hausdorff, first countable, connected, locally path-connected topological space, let $\\U\\subset X$ be an open subset and let $(x,y)\\in \\U\\times \\overline \\U$.\n \n Then, the \"almost homotopic\" relation is an equivalence relation in $\\Omega(x,y,\\U)$.\n \n\\end{lem}"},{"id":"lem:almost_homotopic_carac2","block":"RamcovGX.tex:813:1189","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1306,"deps":["cor:spread_connected_image"],"decls":["GX.almost_homotopic_carac2_cc","GX.almost_homotopic_carac2_of_isMaximal_cc","GX.almost_homotopic_carac2","GX.almost_homotopic_carac2_of_isMaximal","GX.maxBranched_existsUnique_lift","GX.maxBranched_lifting","GX.lift_end_eq_of_almostHomotopic","GX.almostHomotopic_of_lift_end_eq","GX.IsStandardNbhd"],"ndecls":9,"findings":["l.1313, l.1318: 'standard neighborhood' is used but never defined in the paper (reading (c), DEC-56: GX.IsStandardNbhd)","l.1307 (ruled, DEC-79 (a)): widetilde Y^S is prop:universality's covering, so S skeletal and Y minus S slsc; the proof at l.1316 uses that p^{-1}(Y minus S) is simply connected, a property of that covering. Certified in full under the ruling, marked; the Lean is unchanged since WP-35a.","WP-40a: row re-marked and closed under DEC-79 (a) (module list, checklist row '✓ read (DEC-79 (a))', SCOPE (i), docstring of GX.almost_homotopic_carac2_cc)."],"notes":"WP-40a, audited clean.","twin":"","tex":"\\begin{lem} \n Let $\\widetilde Y^S\\xrightarrow{p} Y$ be a maximal covering possibly branched above some $S$, let $(x,y)\\in (Y\\setminus S)\\times Y$ and let $\\hat x \\in p^{-1}(x)$.\nLet $\\gamma_1, \\gamma_2\\in \\Omega(x,y,Y\\setminus S)$ and let $\\hat \\gamma_1,\\hat\\gamma_2$ be the respective lifts of $\\gamma_1$ and $\\gamma_2$ such that $\\hat \\gamma_1(0)=\\hat \\gamma_2(0)=\\hat x$. \n\nThen, $\\hat\\gamma_1(1)=\\hat\\gamma_2(1)$ if and only if $\\gamma_1$ and $\\gamma_2$ are almost homotopic.\n\\end{lem}"},{"id":"theo:ramified_covering_path","block":"RamcovGX.tex:813:1189","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1322,"deps":["lem:almost_homotopic_carac2","cor:spread_connected_image"],"decls":["GX.ramified_covering_path","GX.omegaEnd_isBranchedCovering","GX.OmegaSpace","GX.OmegaRel","GX.omegaRel_equivalence","GX.OmegaQuot","GX.omegaEnd","GX.omegaLift","GX.continuous_omegaLift_one","GX.isOpenMap_omegaLift_one","GX.surjective_omegaLift_one","GX.omegaLift_one_eq_iff"],"ndecls":12,"findings":["l.1322 (ruled, DEC-70): the statement omits 'Y minus S semilocally simply connected', which its proof uses at l.1349 and without which widetilde Y^S is not available; the omission is recorded, the row closes"],"notes":"WP-40a, audited clean. Readings/questions: Reading (d): X carries the quotient of the compact-open topology of Omega by the literal almost homotopy (GX.OmegaRel, an equivalence relation by GX.omegaRel_equivalence); DEC-79 (b): covered by DEC-70 (recorded in SCOPE (d), (i) and the theorem docstring).","twin":"","tex":"\\begin{thm}  Let $Y$ be a first countable connected locally path-connected Hausdorff topological space and let $S\\subset Y$ be a skeletal subset. \nLet $y_0\\in Y\\setminus S$ and let $\\Omega:=\\bigcup_{x\\in Y}\\Omega(y_0,x,Y\\setminus S)$. Define $X$ as the set of almost homotopy classes of $\\Omega$ with respect to $Y\\setminus S$ and define the map $\\varphi:\\Omega\\rightarrow Y, \\gamma \\mapsto \\gamma(1)$.\n\nThen, $\\varphi$ induces a branched covering $X \\xrightarrow{~~\\overline\\varphi~~ } Y$  isomorphic to $\\widetilde Y^S \\xrightarrow{~~p~~} Y$.\n \n\\end{thm}"},{"id":"def:covering_branched_two_paths","block":"RamcovGX.tex:813:1189","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1385,"deps":[],"decls":["GX.PHomotopic","GX.FreePath","GX.pHomotopic_equivalence"],"ndecls":3,"findings":[],"notes":"WP-40a, audited clean. Readings/questions: Reading (e), accepted by DEC-56.","twin":"","tex":"\\begin{defi} \n Let $X\\xrightarrow{p} Y$ be a  covering branched over $S\\subset Y$. \n Given two paths $\\gamma_1,\\gamma_2$ with fixed start point $a\\in Y\\setminus S$ and free end point in an open connected subset $\\U\\subset Y\\setminus S$; $\\gamma_1$ and $\\gamma_2$ are $p$-homotopic if their lifts, from the same start point, end in the same connected component of $p^{-1}(\\U)$.\n\\end{defi}"},{"id":"prop:general_fiber_path","block":"RamcovGX.tex:813:1189","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1390,"deps":[],"decls":["GX.general_fiber_path","GX.PiOneP","GX.piOnePMap","GX.compOfClass","GX.isCoveringMap_restrict_compl"],"ndecls":5,"findings":["'left to the reader' (l.1383): proof supplied"],"notes":"WP-40a, audited clean. Readings/questions: Readings (e), (f), accepted by DEC-56.","twin":"","tex":"\\begin{prop} \n  Let $X\\xrightarrow{p} Y$ be a  covering branched over $S\\subset Y$. Let $a\\in Y\\setminus S$ and let $\\U\\subset Y$ be open and connected.  Define\n$\\pi_1(a,p,\\U)$ the set of paths with fixed start at $a$ and free end in $\\U$ up to $p$-homotopy.\n\nThen, for all $b\\in Y$ and all connected neighborhood basis $\\boldsymbol \\U$ of $b$ we have \n  $$ p^{-1}(b) \\simeq \\varprojlim_{\\U\\in \\boldsymbol\\U} \\pi_1(a,p,\\U)$$\n  where the projective system is given by the natural maps $\\pi_1(a,p,\\U)\\rightarrow \\pi_1(a,p,\\V)$  for $\\U\\subset \\V$.\n\\end{prop}"},{"id":"prop:general_fiber_path_universal","block":"RamcovGX.tex:813:1189","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":1399,"deps":[],"decls":["GX.general_fiber_path_universal","GX.PiOneU","GX.FreeHomotopic","GX.piOneUMap","GX.pHomotopic_of_freeHomoto
