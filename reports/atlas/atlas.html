    <div class="chips">${pp.home?`<span class="chip">Lean: ${esc(pp.home)}</span>`:""}${pp.source?`<span class="chip">${esc(pp.source)}</span>`:""}</div>
    <p>${esc(pp.summary)}</p>
    ${pp.headline?.length?`<div><h3>Headline Lean</h3><div class="mono">${pp.headline.map(esc).join("<br>")}</div></div>`:""}
    ${pp.open?`<div><h3>What remains</h3><p>${esc(pp.open)}</p></div>`:""}
    ${targetsForPaper(p).length?`<div><h3>On the roadmap (${targetsForPaper(p).length})</h3><div style="display:flex;flex-direction:column;gap:8px">${targetsForPaper(p).map(t=>tgtHTML(t,true)).join("")}</div></div>`:""}
    ${d&&state.level==="hub"?`<p><button class="chip" id="openp" style="cursor:pointer;color:var(--accent)">Open this paper</button></p>`:""}`;
  wireTargets();
  const b=$("#openp"); if(b) b.onclick=()=>go({level:"paper",p},p,"down");
}
function showLib(id){ const L=HUB.libs[id];
  P.innerHTML=`<div><h3>Lean library</h3><h2 class="mono" style="font-family:var(--f-mono)">${esc(id)}</h2></div><p>${esc(L.what)}</p>
  <div class="stat">${L.cells.map(c=>`<div><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div><p>${esc(L.about)}</p>`; }
function showEdge(e){ P.innerHTML=`<div><h3>Dependency</h3><h2>${esc(HUB.papers[e.from]?.short||e.from)} → ${esc(HUB.papers[e.to]?.short||e.to)}</h2></div><p>${esc(e.why)}</p>${e.dashed?`<p><span class="chip">planned, not yet in Lean</span></p>`:""}`; }
function showStmt(p,n){
  const s=statusOf(n), d=DATA[p];
  const users=d.nodes.filter(m=>m.deps.includes(n.id)).map(m=>m.id);
  P.innerHTML=`<div><h3>${esc(kindLabel(n))}${n.title?" · "+esc(n.title):""} · l.${n.line}</h3><h2 class="mono" style="font-family:var(--f-mono);font-size:1.02rem">${esc(n.id)}</h2></div>
   <div class="chips">${chipFor(s)}${n.bucket?`<span class="chip">bucket ${esc(n.bucket)}</span>`:""}<span class="chip">paper: ${esc(n.nl)}</span>${n.twin?`<span class="chip">twin of ${esc(n.twin)}</span>`:""}</div>
   <div class="tex" id="tex">${texHTML(n.tex)}</div>
   ${n.decls.length?`<div><h3>Lean (${n.ndecls})</h3><div class="mono">${n.decls.map(esc).join("<br>")}${n.ndecls>n.decls.length?"<br>…":""}</div></div>`:""}
   ${n.deps.length?`<div><h3>Uses</h3><div class="linklist">${n.deps.map(x=>`<button data-l="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`:""}
   ${users.length?`<div><h3>Used by</h3><div class="linklist">${users.map(x=>`<button data-l="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`:""}
   ${n.findings.length?`<div><h3>What formalizing found (${n.findings.length})</h3><ul>${n.findings.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:""}
   ${n.notes?`<div><h3>Notes</h3><p>${esc(n.notes)}</p></div>`:""}
   ${targetsForLabel(p,n.id).length?`<div><h3>On the roadmap</h3><div style="display:flex;flex-direction:column;gap:8px">${targetsForLabel(p,n.id).map(t=>tgtHTML(t,false)).join("")}</div></div>`:""}`;
  P.querySelectorAll("[data-l]").forEach(bt=>bt.onclick=()=>openStatement(p,bt.dataset.l));
  P.scrollTop=0; typeset(p);
}
function texHTML(t){
  const body=t.replace(/^\\begin\{[a-zA-Z*]+\}(\[[^\]]*\])?/,"").replace(/\\end\{[a-zA-Z*]+\}\s*$/,"")
    .replace(/\\(begin|end)\{(itemize|enumerate)\}/g,"").replace(/\\item\s*/g,"\n• ").replace(/\\(emph|textit|textbf)\{([^{}]*)\}/g,"$2")
    .replace(/\\(cite|ref|eqref|cref|Cref)(\[[^\]]*\])?\{[^}]*\}/g,"[·]");
  return `<div class="mj">${esc(body).replace(/\n\s*\n/g,"<br><br>")}</div>`;
}
let mjMacrosFor=null;
function typeset(p){
  const el=$("#tex"); if(!el) return;
  const MJ=window.MathJax; if(!MJ||!MJ.typesetPromise){ setTimeout(()=>typeset(p),300); return; }
  try{
    if (mjMacrosFor!==p){ MJ.config.tex.macros=Object.assign({R:"\\mathbb{R}",N:"\\mathbb{N}",Z:"\\mathbb{Z}",C:"\\mathbb{C}"},DATA[p].macros||{}); MJ.startup.getComponents(); mjMacrosFor=p; }
    MJ.typesetClear&&MJ.typesetClear([el]); MJ.typesetPromise([el]).catch(()=>{});
  }catch(e){}
}

function tgtHTML(t,withGo){
  const first=(t.labels||[])[0];
  const go=withGo&&t.paper&&DATA[t.paper]?`<button class="go" data-tp="${esc(t.paper)}" data-tl="${esc(first||"")}">${first?"Show "+esc(first)+" →":"Open "+esc(HUB.papers[t.paper]?.short||t.paper)+" →"}</button>`:"";
  return `<div class="tgt"><div class="meta"><span class="chip s-${t.status}">${ST_LABEL[t.status]||t.status}</span><span class="mono">${esc(t.id)}</span><span>p${t.priority}</span><span>${esc(t.owner)}</span></div>
    <b>${esc(t.title)}</b>${t.question?`<div class="q"><strong>Question:</strong> ${esc(t.question)}</div>`:""}
    ${t.labels?.length?`<div class="meta">${t.labels.length} row${t.labels.length>1?"s":""}${t.depends?.length?" · after "+t.depends.map(esc).join(", "):""}</div>`:t.depends?.length?`<div class="meta">after ${t.depends.map(esc).join(", ")}</div>`:""}${go}</div>`;
}
function wireTargets(){ P.querySelectorAll("button.go").forEach(b=>b.onclick=()=>{ const p=b.dataset.tp,l=b.dataset.tl; if(l) openStatement(p,l); else go({level:"paper",p},null,"down"); }); }
function showRoadmap(){
  const order=["active","ready","needs-ruling","blocked","planned","done","dropped"];
  const groups=order.map(st=>[st,ROAD.targets.filter(t=>t.status===st).sort((a,b)=>a.priority-b.priority)]).filter(g=>g[1].length);
  P.innerHTML=`<div><h3>Roadmap</h3><h2>What the team works on next</h2></div>
   <p>Targets come from <span class="mono">roadmap/roadmap.toml</span>. The loop takes the first ready target, works it, has it audited, and commits. A target that needs your ruling waits until a DEC row decides it.</p>
   <div class="stat">${["ready","needs-ruling","done"].map(k=>`<div><b>${ROAD.targets.filter(t=>t.status===k).length}</b><span>${ST_LABEL[k]}</span></div>`).join("")}</div>
   ${groups.map(([st,ts])=>`<div><h3>${ST_LABEL[st]} (${ts.length})</h3><div style="display:flex;flex-direction:column;gap:8px">${ts.map(t=>tgtHTML(t,true)).join("")}</div></div>`).join("")}
   ${ROAD.known_red.length?`<div><h3>Hub gates already red</h3><ul>${ROAD.known_red.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}`;
  wireTargets(); P.scrollTop=0;
}
const RB=$("#roadbtn"); $("#roadn").textContent="("+openTargets.length+")";
RB.onclick=()=>{ const on=RB.getAttribute("aria-pressed")!=="true"; RB.setAttribute("aria-pressed",on); if(on) showRoadmap(); else panelForLevel(); };
function legend(){
  const L=$("#legend");
  if (state.level==="block") L.innerHTML=`<span><i style="background:var(--closed);border-color:var(--closed)"></i>closed in Lean</span><span><i style="background:var(--partial);border-color:var(--partial)"></i>partial</span><span><i style="background:url(#);background:repeating-linear-gradient(45deg,var(--terminal) 0 3px,var(--card) 3px 6px)"></i>terminal</span><span><i style="border-style:dashed;border-color:var(--stated)"></i>not formalized</span><span><i style="border-style:dashed;background:none"></i>in another block</span><span><i style="background:var(--accent);border-color:var(--accent);transform:rotate(45deg) scale(.7)"></i>on the roadmap</span>`;
  else L.innerHTML=`<span><i style="background:var(--closed);border-color:var(--closed)"></i>closed</span><span><i style="background:var(--partial);border-color:var(--partial)"></i>partial</span><span><i style="background:repeating-linear-gradient(45deg,var(--terminal) 0 3px,var(--card) 3px 6px)"></i>terminal</span><span><i style="background:var(--grid)"></i>no Lean yet</span>${state.level==="paper"?"<span>arrow width = statement dependencies</span>":"<span>arrow: used by</span>"}<span><i style="background:var(--accent);border-color:var(--accent);transform:rotate(45deg) scale(.7)"></i>on the roadmap</span>`;
}

/* ---------- boot ---------- */
draw(); panelForLevel(); fit(false);
</script>
</body></html>
