u$.\n\\end{definition}"},{"id":"def:summably_mixing","block":"main.tex:213","kind":"definition","num":"","title":"","bucket":"","lean":"none","nl":"definition","line":262,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition} A Markov kernel $\\pi$ on $(\\Statespace,\\lambda)$ is summably $L^2$-mixing if $\\pi$ admits an invariant measure $\\widehat \\lambda$ equivalent to $\\lambda$ and such that the $L^2$-mixing coefficients given by,\n\\begin{equation}\n    \\gamma_n := \\sup_{\\varphi \\in H} \\int_{s\\in \\Statespace}\n    \\left(\\varphi\\pi^n(s)\\right)^2 d\\widehat \\lambda(s), \n\\end{equation}\nwith $H = \\{\\varphi \\in L^2(\\lambda)~|~\\|\\varphi\\|_2 = 1 \\text{ and } \\int_{s\\in \\Statespace} \\varphi(s)=0\\}$\nare summable: $\\sum_{n\\geq 0} \\gamma_n < +\\infty$.\n\\end{definition}"},{"id":"theo:universality","block":"main.tex:213","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"open","line":277,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem} A parameterized family  of EGF is universal provided  that it contains some summably $L^2$-mixing $\\ForwardPolicyStar$  and that the set of $\\foutstar$ is dense in $L^2(\\Statespace,\\lambda)$.\n\\end{theorem}"},{"id":"theo:universality_tori","block":"main.tex:213","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"open","line":291,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem} Any affine toroidal family is a universal EGF family provided mild technical assumptions on the $(\\Phi_i)_{i=1}^p$.\n\\end{theorem}"},{"id":"theo:universality_sphere","block":"main.tex:213","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"open","line":305,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem} An isometry spherical family is a universal EGF family, provided technical assumptions on the $(\\Phi_i)_{i=1}^p$.\n\\end{theorem}"},{"id":"def:virtual_flows","block":"main.tex:213","kind":"definition","num":"","title":"Virtual initial and terminal flow","bucket":"","lean":"none","nl":"definition","line":316,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Virtual initial and terminal flow] Let $(\\ForwardPolicyStar,\\foutstar)$ be a generative flow and let $\\Finit,\\Fterm$ be initial and terminal distributions. Define the initial and terminal errors as $\\delta\\Finit:=(\\Finit+\\Finstar-\\Fterm-\\Foutstar)^-$ and $\\delta\\Fterm:=(\\Finit+\\Finstar-\\Fterm-\\Foutstar)^+$ respectively. Define the positive and negative parts of a measure $\\mu$ as ${\\mu}^\\pm$.\nThe virtual initial and terminal distributions are $\\Finithat := \\Finit+ \\delta\\Finit$ and $\\Ftermhat := \\Fterm+ \\delta\\Fterm$.\n\\end{definition}"},{"id":"theo:negative_control","block":"main.tex:213","kind":"theorem","num":"","title":"Quantitative Sampling of Generative Flows","bucket":"","lean":"none","nl":"open","line":321,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Quantitative Sampling of Generative Flows]\n\n    Let $(\\ForwardPolicyStar, \\foutstar)$ be a generative flow and let $\\Finit$ and $\\Fterm$ initial and terminal distributions. Assume that $\\Finit\\neq 0$ and consider the sample $s_\\tau$ of the generative flow Markov chain from $\\Finit$ to $\\Ftermhat$ then:\n    \\begin{equation}\n        \\TV\\left(s_\\tau \\left\\| \\frac{1}{\\Ftermhat(\\Statespace )} \\Ftermhat\\right.\\right) \\leq  \\frac{\\delta\\Finit(\\Statespace)}{\\Ftermhat(\\Statespace)},\n    \\end{equation}\n    with $\\TV$  the total variation.\n\\end{theorem}"},{"id":"cor:sampling_error_control","block":"main.tex:213","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":329,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{corollary} For a generative flow trained on the target $\\target$ with $\\Finit(\\Statespace)=1$ and using $\\Fterm=\\widehat\\target := \\left(\\Finit+\\Finstar-\\Foutstar\\right)^+$ during inference, the sampling error is controlled by:\n    \\begin{eqnarray}\n      \\TV\\left(s_\\tau \\left\\| \\frac{\\target}{\\target(\\Statespace )} \\right.\\right) \\leq  \\frac{\\delta}{1+\\delta}+\\TV\\left(\\frac{\\widehat\\target}{\\widehat\\target(\\Statespace)} \\left\\| \\frac{\\target}{\\target(\\Statespace )} \\right.\\right),\n\\end{eqnarray}\nwith $\\delta :=  \\left(\\Finit+\\Finstar-\\Foutstar\\right)^-(\\Statespace)$.\n\\end{corollary}"},{"id":"cor:pinsker_negative_control","block":"main.tex:213","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":374,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{corollary} \nLet $(\\ForwardPolicyStar, \\foutstar)$ be a generative flow. We train the generative flow on target probability distribution $\\target$ with $\\Finit(\\Statespace)=1$. By using $\\Fterm=\\widehat\\target:=  \\left(\\Finit+\\Finstar-\\Foutstar\\right)^+$ during inference, the sampling error is bounded as follow:\n\\begin{eqnarray}\n  \\TV\\left(s_\\tau \\left\\| \\target \\right.\\right) &\\leq&  \\frac{\\delta}{1+\\delta} +\\sqrt{\\frac{1}{2}\\KL\\left(\\left.\\frac{\\widehat\\target}{\\widehat\\target(\\Statespace)} \\right\\| \\target \\right)},\n\\end{eqnarray}\nwith $\\delta :=  \\int_{s\\in\\Statespace} \\deltafinit(s)d\\lambda(s)$.\n\\end{corollary}"},{"id":"theo:backward_policy","block":"main.tex:729","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":733,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem} Let $(\\ForwardPolicyStar,\\Foutstar)$ as above, the induced Generative Flow  on $\\Statespace$ has a backward star policy given by  \n    \\begin{eqnarray}\n\\BackwardPolicy^*(s) &=& \\sum_{i=1}^p\\backwardalpha^i(s) \\delta_{\\Phi_i^{-1}(s)} \\\\ \n\\backwardalpha^i(s) &=& \\frac{(\\forwardalpha^if^*_\\rightarrow)\\circ \\Phi_i^{-1}(s)|J_s {\\Phi_i^{-1}}| }{ \\finstar(s)} \\\\\n\\finstar &=&  \\sum_j (\\forwardalpha^jf^*_\\rightarrow)\\circ \\Phi_j^{-1}(s) |J_s {\\Phi_j^{-1}}|.\n\\end{eqnarray}\n\\end{theorem}"},{"id":"theo:universality_true","block":"main.tex:770","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":775,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem} Let $(\\Statespace,\\lambda)$ be a measured Polish space and let $\\ForwardPolicyStar$ be a Markov kernel acting on $\\Statespace$. Assume that $\\ForwardPolicyStar$ is ergodic on $(\\Statespace,\\lambda)$ with summable $L^2$-mixing coefficients, then for any probability distributions $\\Finit,\\Fterm \\ll \\lambda$ with density in $L^2(\\lambda)$ and any $\\varepsilon>0$, there exists $\\foutstar\\in L^2(\\lambda)$ such that the generative flow $(\\ForwardPolicyStar,\\foutstar)$ from $\\Finit$ to $\\Fterm$ is such that $\\delta\\Finit(\\Statespace)+\\delta\\Fterm(\\Statespace)<\\varepsilon$.\n\\end{theorem}"},{"id":"theo:spectral_gap_tori","block":"main.tex:770","kind":"theorem","num":"","title":"Theorem 5 of [bekka2015spectral]","bucket":"","lean":"none","nl":"cited","line":810,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Theorem 5 of \\cite{bekka2015spectral}  ]\n\n    Let $H$ be a countable subgroup of $\\mathrm{Aff}(\\mathbb T^d)$. The following properties are equivalent:\n    \\begin{enumerate}\n        \\item[(i)]  The action of H on $\\mathbb{T}$ does not have a spectral gap.\n\\item[(ii)] There exists a non-trivial $H$-invariant factor torus $\\overline{\\mathbb T}$ such that the projection of $H$ on $\\mathrm{Aut}(\\overline {\\mathbb T})$ is amenable.\n    \\end{enumerate}\n\\end{theorem}"},{"id":"theo:spectral_gap_sphere","block":"main.tex:770","kind":"theorem","num":"","title":"Reformulation of Theorem 1 of [bourgain2012spectral]","bucket":"","lean":"none","nl":"cited","line":830,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Reformulation of Theorem 1 of \\cite{bourgain2012spectral}  ]\n \n Assume that $(\\Phi_1,\\cdots, \\Phi_p) \\in \\mathrm{SO}(d)\\cap\\mathrm{Mat}_{d\\times d}(\\overline {\\mathbb Q})$, that the group generated by $\\Phi_1,\\cdots,\\Phi_p$ is dense in $\\mathrm{SO}(d,\\mathbb R)$ and that $\\forall i\\in \\{1,\\cdots,p\\}, \\exists j \\in \\{1,\\cdots,p\\}, \\Phi_i^{-1}=\\Phi_j$. \n Assume that, $\\forall i, \\forwardalpha^i = \\frac{1}{p}$ then the associated Markov kernel $\\ForwardPolicyStar$ given by equation \\eqref{equ:forward_policy} has a spectral gap.\n\\end{theorem}"},{"id":"theo:negative_control_appendix","block":"main.tex:843","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":844,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}\n\n  Let $(\\ForwardPolicyStar, \\foutstar)$ be a generative flow and let $\\Finit$ and $\\Fterm$ initial and terminal distributions. Assume that $\\Finit\\neq 0$, and consider the sample $s_\\tau$ of the generative flow Markov chain from $\\Finit$ to $\\Ftermhat$ then:\n    \\begin{equation}\n        \\TV\\left(s_\\tau \\left\\| \\frac{1}{\\Ftermhat(\\Statespace )} \\Ftermhat\\right.\\right) \\leq  \\frac{\\delta\\Finit(\\Statespace)}{\\Ftermhat(\\Statespace)}\n    \\end{equation}\n    with $\\TV$  the total variation.\n\\end{theorem}"}],"closed":0,"target":16,"macros":{"theHalgorithm":"\\arabic{algorithm}","Rhat":"\\widehat{R}","ForwardPolicy":"\\pi_{\\rightarrow}","ForwardPolicyStar":"\\pi_{\\rightarrow}^*","BackwardPolicy":"\\pi_{\\leftarrow}","BackwardPolicyStar":"\\pi_{\\leftarrow}^*","TV":"\\mathrm{TV}","Statespace":"\\mathcal S","foutstar":"f^*_{\\rightarrow}","Foutstar":"F^*_{\\rightarrow}","Fout":"F_{\\rightarrow}","finstar":"f^*_{\\leftarrow}","Finstar":"F^*_{\\leftarrow}","Finit":"F_{\\mathrm{init}}","Fterm":"F_{\\mathrm{term}}","Finithat":"\\widehat {F}_{\\mathrm{init}}","Ftermhat":"\\widehat{F}_{\\mathrm{term}}","ftermhat":"\\widehat{f}_{\\mathrm{term}}","fterm":"f_{\\mathrm{term}}","finit":"f_{\\mathrm{init}}","LFMstable":" \\mathcal L_{\\mathrm{FM},2}^{\\mathrm{stable}} ","LFMstableq":" \\mathcal L_{\\mathrm{FM},q}^{\\mathrm{stable}} ","KL":"\\mathrm{KL}","deltafinit":"\\delta f_{\\mathrm{init}}","LKLwFM":"\\mathcal L_{KL-wFM}","target":"\\kappa","source":"\\nu","backwardalpha":"\\alpha_{\\leftarrow} ","forwardalpha":"\\alpha_{\\rightarrow} "}},"syracuse":{"blocks":[{"id":"syracuse.tex:45","title":"Known facts and conventions"},{"id":"syracuse.tex:169","title":"Constraints on cycles"},{"id":"syracuse.tex:269","title":"Upper bounds"}],"nodes":[{"id":"def:ring_define","block":"syracuse.tex:45","kind":"definition","num":"","title":"","bucket":"","lean":"none","nl":"definition","line":54,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}  Let $A$ be a  $\\ZZ/2\\ZZ$-ring, define\n$$ \\fonctiondeux{f_A}{A}{A}{x\\in 2A}{3x+1}{x\\notin 2A}{x/2} \\text{ and }\\fonction{T_A}{2A+1}{2A+1}{x}{\\frac{3x+1}{2^{\\nu_2(3x+1)}}}.$$\n\\end{defi}"},{"id":"prop:ring_both_continuous_extends","block":"syracuse.tex:45","kind":"proposition","num":"","title":"","bucket":"","lean":"none","nl":"open","line":58,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $A$ be a $\\ZZ/2\\ZZ$-ring, both $f_A$ and $T_A$ are continuous and extends continuously to $A_2$. Furthermore, their extension is $f_{A_2}$ and $T_{A_2}$ respectively.\n\\end{prop}"},{"id":"def:ring_define_2","block":"syracuse.tex:45","kind":"definition","num":"","title":"","bucket":"","lean":"none","nl":"definition","line":61,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi} Let $A$ be a $\\ZZ/2\\ZZ$-ring. \nFor $n\\in \\NN$, define $$\\fonction{a_n}{2A+1}{\\NN}{x}{\\nu_2(3 T^n_A(x)+1)}$$ and \n$$\\fonction{p_n}{2A+1}{\\NN}{x}{\\sum_{k<n}a_k(x)}$$\n\n\\end{defi}"},{"id":"lem:base","block":"syracuse.tex:45","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":67,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}Let $A$ be a $\\ZZ/2\\ZZ$-ring and let $x\\in A$, one has : \n$$\\forall n\\in \\NN, \\quad 2^{p_n(x)}T_A^n(x)-3^n x = \\sum_{k=0}^{n-1} 2^{p_k(x)}\\,3^{n-1-k} .$$\n\\end{lem}"},{"id":"def:define_n__n_","block":"syracuse.tex:45","kind":"definition","num":"","title":"","bucket":"","lean":"none","nl":"definition","line":80,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}\nLet $n\\in\\NN^*$ and let $a\\in (\\NN^*)^\\ZZ$, define $$ A_{u}^n(a)=\\sum_{k=0}\n^{n-1}3^k\\prod_{i=0}^{n-1-k}2^{a_{u+i}} $$ \n\\end{defi}"},{"id":"lem:ring_maps_rhs_n_","block":"syracuse.tex:45","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"open","line":84,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} Let $A$ be a $\\ZZ/2\\ZZ$-ring. \nFor $n\\in \\NN$, the maps $$\\fonction{RHS_n}{\\{p\\in \\NN^n~|~ p_0=0~\\wedge~p_n \\nearrow\\nearrow \\} }{A}{p}{\\sum_{k=0}^{n-1}2^{p_k}3^{n-1-k}} $$ \nare injective.\n\\end{lem}"},{"id":"theo:rep","block":"syracuse.tex:45","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":88,"deps":["lem:base"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo} The map $$\\fonction{\\phi}{2A_2+1}{\\{p\\in \\NN^\\NN~|~ p_0=0 ~\\wedge~ (p_n) \\nearrow\\nearrow\\}}{x}{(p_n(x))_{n\\in \\NN}} $$\nis bijective and its inverse is: \n$$\\fonction{\\phi^{-1}}{\\{p\\in \\NN^\\NN~|~ p_0=0 ~\\wedge~ (p_n) \\nearrow\\nearrow\\}}{2A_2+1}{p}{ -\\frac{1}{3}\\sum_{n = 0}^{\\infty}\\frac{2^{p_n}}{3^{n}}}.$$\n\\end{theo}"},{"id":"cor:ring_following_equivalent_enumerate","block":"syracuse.tex:45","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":96,"deps":["theo:rep"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor}Let $A$ be a $\\ZZ/2\\ZZ$-ring and  $x\\in A$. The following are equivalent : \n\\begin{enumerate}\n\\item  $\\left(a_n(x)\\right)_{n\\in \\NN}$ is periodic of period $n$\n\\item  $\\left(T^n(x)\\right)_{n\\in \\NN}$ is periodic of period $n$\n\\end{enumerate}\n\\end{cor}"},{"id":"cor:ring_periodic_minimal_period","block":"syracuse.tex:45","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":107,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor}  Let $A$ be a $\\ZZ/2\\ZZ$-ring and  $x\\in A$ such that $\\left(T^k(x)\\right)_{k\\in\\NN}$ is $n$-periodic for some $n$.  If $n$ the minimal period then :\n$$\\forall i,j\\in \\lsem 1,n\\rsem,\\quad A_i^n(a(x))-A_j^n(a(x)) \\neq 0$$\n\\end{cor}"},{"id":"cor:corollary","block":"syracuse.tex:45","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":110,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor}  \n\\end{cor}"},{"id":"lem:one_has","block":"syracuse.tex:45","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":114,"deps":["lem:base"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} Let $x\\in \\ZZ^*$ such that $\\forall n\\in\\NN, |T^n(x)|\\geq |x|$, one has : $$p_n(x) \\log(2) - n \\log(3)\\leq n\\log\\left(1+ \\frac{1}{|x|}\\right)  $$\n\\end{lem}"},{"id":"lem:itemize_furthermore_itemize","block":"syracuse.tex:45","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":127,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} Let $x\\in \\NN^*$.\n\n\\begin{itemize}\n\\item If $n\\in\\NN$ is such that $T^n(x)\\leq x$ then \n$$p_n(x)\\log(2)-n\\log(3) >0$$ \n\\item If furthermore $\\forall n\\in\\NN,~T^n(x)\\leq x $ then $$\\forall n\\in \\NN,\\quad  p_n(x)\\log(2)-n\\log(3) \\geq n \\log\\left(1+\\frac{1}{x} \\right).$$ \n\\end{itemize}\n\n\\end{lem}"},{"id":"cor:corollary_2","block":"syracuse.tex:45","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":140,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor} Let $x\\in \\NN$ such that $T^n(x) \\xrightarrow{n\\rightarrow +\\infty} +\\infty$, then $$\\limsup_{n\\rightarrow+\\infty} \\frac{p_n}{n}\\leq \\log_2(3) $$\n\\end{cor}"},{"id":"cor:bounds","block":"syracuse.tex:45","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":142,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor} Let $x\\in \\NN$ such that $\\exists n\\in \\NN^*,~ T^n(x) = x$, then for such a $n\\in \\NN^*$, $$\\log_2\\left(1+\\frac{1}{\\min_{k\\in \\NN}(T^k(x))}\\right)  \\leq \\frac{p_n}{n}-\\log_2(3)\\leq  \\log_2\\left(1+\\frac{1}{\\max_{k\\in \\NN}(T^k(x))}\\right) $$\n\\end{cor}"},{"id":"theo:mr","block":"syracuse.tex:45","kind":"theorem","num":"","title":"[MR1074572]","bucket":"","lean":"none","nl":"cited","line":145,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo}[\\cite{MR1074572}]\nLet $a,b\\in \\ZZ$ such that $|a\\log(2)-b\\log(3)|\\leq e^{-a/\\delta}$ with $\\delta \\geq 1$ then \n$$a < 2^{800}\\log(3)^{25}\\delta^{25} $$\n\\end{theo}"},{"id":"theo:steiner","block":"syracuse.tex:45","kind":"theorem","num":"","title":"Steiner []","bucket":"","lean":"none","nl":"open","line":150,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo}[Steiner \\cite{}] Let $x\\in \\NN^*$. \nIf \n$$\\exists n\\in\\NN^*,\\quad T^n(x)=x \\text{~and~} \\forall k< n,~p_k(x)=k$$\nthen $x=1$.\n\\end{theo}"},{"id":"theo:matveev","block":"syracuse.tex:45","kind":"theorem","num":"","title":"Matveev","bucket":"","lean":"none","nl":"open","line":156,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo}[Matveev] Let $a,b\\in \\NN^*$ such that $2^a>3^b$.\n Then :\n $$2^a-3^b \\geq \\frac{2^a}{e^da^d} $$\n where $d = 3.5\\cdot 10^6$.\n\\end{theo}"},{"id":"cor:property_defined_cycles_gcd","block":"syracuse.tex:45","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":161,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor} Let $\\mathcal P(\\Gamma)$ a property defined on cycles $\\Gamma$. If\n$$\\exists \\varepsilon>0,\\forall \\Gamma, \\quad \\left(\\mathcal P(\\Gamma)\\quad\\Rightarrow \\quad \\mathrm{GCD}(A_i(\\Gamma)~:~ i\\in \\ZZ) \\ll  2^{|\\Gamma|(1-\\varepsilon)}\\right) $$ then there exists only finitely many cycles $\\Gamma$ such that $\\mathcal P(\\Gamma)$.\n\nIf furthermore, the domination is effective then the cycles can be determined effectively.\n\\end{cor}"},{"id":"prop:have_gcd_n__l_k","block":"syracuse.tex:169","kind":"proposition","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":171,"deps":["lem:base"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $x\\in \\ZZ$ and $n\\in \\NN^*$ such that $T^n(x)=x$. \nWe have : \n$$ 2^{p_n(x)}-3^n = \\mathrm{GCD}\\left(\\sum_{k=0}^{n-1}3^k 2^{p_n(x)-\\sum_{i=l-k}^{l} a_i(x) } : l \\in \n\\lsem 0,n-1 \\rsem \\right) $$\n\\end{prop}"},{"id":"prop:proposition","block":"syracuse.tex:169","kind":"proposition","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":194,"deps":["cor:bounds"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $x\\in \\ZZ$  and $n\\in \\NN^*$ such that $T^n(x)=x$. \nIf $|x|>1000$ then : \n$$ \\#\\left\\{i\\in \\lsem 1,n\\rsem ~|~ a_i(x) =1\\right\\} \\geq \\alpha n $$\nwith $\\alpha = 2-\\log_2(3)-10^{-10}> 0.415037499$\n\n\\end{prop}"},{"id":"lem:periodic_exists_i_a_i_","block":"syracuse.tex:169","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"open","line":207,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} Let $n,p\\in\\NN^*$ with $p< n$ and let $a \\in (\\NN^*)^\\ZZ$ $n$-periodic, if there exists $i,j\\in \\lsem 0,n-1\\rsem$, such that $$i\\neq j\\quad \\text{and}\\quad \\forall k\\in\\lsem 1,p\\rsem,~  a_{i+k}=a_{j+k} $$\nthen :\n$$ \\nu_2(A_i-A_j)\\geq \\sum_{k=1}^p a_k \\quad \\text{and}\\quad  \\nu_3(A_{p+i}-A_{p+j})\\geq p  $$\n\n$$A_i- A_j \\neq 0 $$\n\\end{lem}"},{"id":"def:circuit","block":"syracuse.tex:169","kind":"definition","num":"","title":"ε-circuit","bucket":"","lean":"none","nl":"definition","line":213,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[$\\varepsilon$-circuit] Let $x\\in \\ZZ$ and $\\varepsilon>0$. $\\left(x\\right)_{n\\in\\NN}$ is an $\\varepsilon$-circuit if the sequence is $n$-periodic for some \n$n\\in\\NN^*$ and their exists a term $y$ in the sequence such that $$\\forall i \\in \\lsem\n 1,p\\rsem,~a_i(y)=1$$\nfor some $p\\geq \\varepsilon n-1$.\n\\end{defi}"},{"id":"theo:exists_no_circuit_other","block":"syracuse.tex:169","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":219,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo} If $\\varepsilon\\geq 10^{-14}$, there exists no $\\varepsilon$-circuit other than the known ones.\n\\end{theo}"},{"id":"def:syracuse_cycle_period_denote","block":"syracuse.tex:269","kind":"definition","num":"","title":"","bucket":"","lean":"none","nl":"definition","line":271,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi} Let $\\Gamma=(x_i~:~ i \\in \\ZZ)$ be syracuse cycle of period $n>0$, denote $\\forall i\\in\\ZZ , a_i :=T^i(x_0)$.\n We denote by $\\mathcal A_\\Gamma$ the set of ascending term  in a give cycle $\\Gamma$ and by $\\mathcal D_\\Gamma$ the set of descending terms : \n $$\\A_\\Gamma = \\{i\\in \\ZZ~|~ a_i=1\\} \\quad\\quad \\D_\\Gamma = \\{i\\in \\ZZ~|~ a_i>1\\}$$\n\\end{defi}"},{"id":"lem:syracuse_cycle_n__n_","block":"syracuse.tex:269","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"open","line":275,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}\nLet $(\\Gamma,a)$ be a Syracuse cycle and let $i\\in\\ZZ$, then \n$$ \\Delta_i := A_{i+1}-A_{i} = \\sum_{k=1}^{n-1}3^{n-1-k}2^{a_i+\\cdots+a_{i+k-1}} \\left(2^{a_{i+k}}-2^{a_i}\\right)$$ \n\nIn particular, if $a_i=1$ then :\n$$ \\Delta_i = \\sum_{k=1,k\\in\\D}^{n-1}3^{n-1-k}2^{a_i+\\cdots+a_{i+k-1}} \\left(2^{a_{i+k}}-2\\right)$$ \n\\end{lem}"},{"id":"lem:syracuse_cycle","block":"syracuse.tex:269","kind":"lemma","num":"","title":"","bucket":"","lean":"none","nl":"open","line":283,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}\nLet $(\\Gamma,a)$ be a Syracuse cycle, let $m = \\mathrm{GCD}(A_i ~:~ i\\in \\ZZ)=2^{p_n}-3^n$ and let $i\\in\\ZZ$, then, : \n\n$$a_i=a_{i+1}=1 \\quad\\Rightarrow \\quad\\Delta_{i} \\sim_S \\Delta_{i+1}$$\n\\end{lem}"},{"id":"cor:intertwined_i_","block":"syracuse.tex:269","kind":"corollary","num":"","title":"","bucket":"","lean":"none","nl":"open","line":289,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{cor}\nIf $\\A$ and $\\D$ are intertwined.\n$$ m = A_0\\bigwedge_{i=\\D}\\Delta_{i-1} $$\n\\end{cor}"},{"id":"theo:steiner_2","block":"syracuse.tex:269","kind":"theorem","num":"","title":"Steiner","bucket":"","lean":"none","nl":"proved","line":294,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo}[Steiner] Let $\\Gamma$ be a Syracuse n-cycle.\n If $\\#\\D_\\Gamma=1$ then $\\Gamma = (\\cdots,1,\\cdots)$.  \n\\end{theo}"},{"id":"theo:syracuse_cycle","block":"syracuse.tex:269","kind":"theorem","num":"","title":"","bucket":"","lean":"none","nl":"proved","line":306,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theo} Let $\\Gamma$ be a Syracuse $n$-cycle, then $\\#(\\D_\\Gamma\\cap \\lsem 1,n\\rsem)\\neq 2$.\n\\end{theo}"}],"closed":0,"target":29,"macros":{"fonction":["\\displaystyle#1:\\begin{array}{l|rcl}\n& \\displaystyle #2 & \\longrightarrow & \\displaystyle #3 \\\\\n    & \\displaystyle #4 & \\longmapsto & \\displaystyle #5 \\end{array}",5],"RR":"\\mathbb{R}","CC":"\\mathbb{C}","NN":"\\mathbb{N}","ZZ":"\\mathbb{Z}","A":"\\mathcal{A}","D":"\\mathcal{D}"}},"dyniso":{"blocks":[{"id":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","title":"Free Probability Tools"},{"id":"rigorous_dyson_theorem/sections/03_spectral_theory.tex:3","title":"Spectral Theory and Computation"}],"nodes":[{"id":"prop:kronecker-collapse","block":"rigorous_dyson_theorem/sections/03_spectral_theory.tex:3","kind":"proposition","num":"","title":"Kronecker collapse","bucket":"","lean":"none","nl":"open","line":25,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Kronecker collapse]\nUnder the Kronecker structure and isotropy, the $\\mcB$-valued order parameter $M(z) \\in M_q(\\C)$ satisfies\n\\begin{equation}\nM(z) = A_h(M) \\cdot \\bigl(zI_q - A_h(M)^\\top A_h(M)\\bigr)^{-1},\n\\end{equation}\nwhere $A_h(M) := A_q + \\sigma^2 M$ is the $q \\times q$ dressed matrix. The scalar Cauchy transform is $G(z) = \\frac{1}{q}\\Tr_q\\bigl(zI_q - A_h(M)^\\top A_h(M)\\bigr)^{-1}$. When $q = 1$, the scalar Dyson equation~\\eqref{eq:dyson-fp} is recovered.\n\\end{proposition}"},{"id":"def:r-transform","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"definition","num":"","title":"Free Cumulants and R-transform","bucket":"","lean":"none","nl":"definition","line":11,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Free Cumulants and R-transform]\nLet $\\mu$ be a probability measure on $\\R$ with moments $m_n = \\int x^n d\\mu(x)$ for $n \\geq 1$. The \\emph{free cumulants} $(\\kappa_n)_{n \\geq 1}$ of $\\mu$ are defined combinatorially via non-crossing partitions (see \\cite{nica2006lectures}, Lecture 11).\n\nThe \\emph{R-transform} of $\\mu$ is the formal power series\n\\begin{equation}\n\\mathcal{R}_\\mu(z) = \\sum_{n=1}^\\infty \\kappa_n z^n.\n\\end{equation}\n\\end{definition}"},{"id":"prop:r-cauchy-relation","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"proposition","num":"","title":"R-transform functional equation","bucket":"","lean":"none","nl":"proved","line":22,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[R-transform functional equation]\nLet $G_\\mu(z) = \\int \\frac{d\\mu(\\lambda)}{z - \\lambda}$ be the Cauchy transform of $\\mu$. Then the R-transform satisfies\n\\begin{equation}\n\\mathcal{R}_\\mu(G_\\mu(z)) + \\frac{1}{G_\\mu(z)} = z.\n\\end{equation}\n\nEquivalently, if $K_\\mu(z) = 1/G_\\mu(1/z)$ denotes the inverse Cauchy transform, then\n\\begin{equation}\n\\mathcal{R}_\\mu(z) = K_\\mu(z) - \\frac{1}{z}.\n\\end{equation}\n\\end{proposition}"},{"id":"ex:free-poisson","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"example","num":"","title":"Free Poisson distribution","bucket":"","lean":"none","nl":"cited","line":38,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{example}[Free Poisson distribution]\nThe free Poisson distribution with rate $\\lambda > 0$ and jump size $\\alpha \\in \\R$ has R-transform\n\\begin{equation}\n\\mathcal{R}(z) = \\frac{\\lambda \\alpha}{1 - \\alpha z}.\n\\end{equation}\n\nThis corresponds to the limiting spectral distribution of the matrix $\\lambda^{1/2} X$, where $X$ has i.i.d.\\ entries with variance $1/N$; it is the free analogue of the classical Marchenko--Pastur law~\\cite{marchenko1967distribution} (see \\cite{nica2006lectures}, Proposition 12.11).\n\\end{example}"},{"id":"def:s-transform","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"definition","num":"","title":"S-transform","bucket":"","lean":"none","nl":"definition","line":51,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[S-transform]\nLet $\\mu$ be a probability measure on $\\R^+$ with Cauchy transform $G_\\mu(z) = \\int \\frac{d\\mu(\\lambda)}{z - \\lambda}$. Define the \\emph{moment function} $\\Psi_\\mu(z) := z\\,G_\\mu(z) - 1$, and let $\\chi_\\mu$ denote its functional inverse: $\\Psi_\\mu(\\chi_\\mu(w)) = w$. The \\emph{S-transform} of $\\mu$ is\n\\begin{equation}\nS_\\mu(w) = \\frac{w+1}{w \\cdot \\chi_\\mu(w)}.\n\\end{equation}\nEquivalently, for each $w$ in a neighborhood of~$0$, let $z_w = \\chi_\\mu(w)$ be the unique solution of $z\\,G_\\mu(z) - 1 = w$. Then\n\\begin{equation}\nS_\\mu(w) = \\frac{G_\\mu(z_w)}{w}.\n\\end{equation}\n\\end{definition}"},{"id":"rem:reconciliation_cauchy__s_transform_relation","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"remark","num":"","title":"Reconciliation with the Cauchy--S-transform relation","bucket":"","lean":"none","nl":"informal","line":62,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Reconciliation with the Cauchy--S-transform relation]\nThe familiar identity\n\\[\n\\frac{G(z)}{zG(z)-1} = S\\bigl(zG(z)-1\\bigr),\n\\]\nis obtained by setting $w = zG(z) - 1 = \\Psi(z)$ in~\\eqref{eq:s-transform-via-G}. Indeed, $z_w = z$ solves $z\\,G(z) - 1 = w$ by construction, so $S(w) = G(z)/w = G(z)/(zG(z)-1)$.\n\\end{remark}"},{"id":"rem:s_transform_particularly_natural_measures","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"remark","num":"","title":"","bucket":"","lean":"none","nl":"informal","line":70,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}\nThe S-transform is particularly natural for measures on $\\R^+$, which arise as the spectral distributions of $XX^T$ for random matrices $X$. For the extension to general signed measures (relevant for eigenvalues as opposed to singular values), see \\cite{nica2006lectures}, Lecture 18.\n\\end{remark}"},{"id":"thm:s-linearization","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"theorem","num":"","title":"S-transform linearization","bucket":"","lean":"none","nl":"proved","line":76,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[S-transform linearization]\nLet $a, b$ be freely independent random variables in a $C^*$-probability space with spectral measures $\\mu_a, \\mu_b$ supported on $\\R^+ \\cup \\{0\\}$. Then the spectral measure $\\mu_{ab}$ of the product $ab$ satisfies\n\\begin{equation}\nS_{\\mu_{ab}}(z) = S_{\\mu_a}(z) \\cdot S_{\\mu_b}(z).\n\\end{equation}\n\nMore generally, for a product of $L$ freely independent random variables $a_1, \\ldots, a_L$,\n\\begin{equation}\nS_{\\mu_{a_1 \\cdots a_L}}(z) = \\prod_{l=1}^L S_{\\mu_{a_l}}(z).\n\\end{equation}\n\\end{theorem}"},{"id":"def:free-multiplicative-convolution","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"definition","num":"","title":"Free multiplicative convolution","bucket":"","lean":"none","nl":"definition","line":94,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Free multiplicative convolution]\nLet $\\mu, \\nu$ be probability measures on $\\R^+$. The \\emph{free multiplicative convolution} $\\mu \\boxtimes \\nu$ is the unique probability measure on $\\R^+$ whose S-transform satisfies\n\\begin{equation}\nS_{\\mu \\boxtimes \\nu}(z) = S_\\mu(z) \\cdot S_\\nu(z).\n\\end{equation}\n\\end{definition}"},{"id":"thm:asymptotic-freeness","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"theorem","num":"","title":"Asymptotic freeness of independent matrices","bucket":"","lean":"none","nl":"proved","line":103,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Asymptotic freeness of independent matrices]\nLet $A_N, B_N \\in \\R^{N \\times N}$ be sequences of random matrices such that:\n\\begin{enumerate}\n\\item $A_N, B_N$ are independent for each $N$;\n\\item The empirical spectral distributions $\\mu_{A_N}$ converge weakly to deterministic limits $\\mu_A, \\mu_B$ as $N \\to \\infty$;\n\\item Standard concentration and moment conditions hold.\n\\end{enumerate}\n\nThen the empirical spectral distribution of $A_N B_N$ converges weakly to $\\mu_A \\boxtimes \\mu_B$ as $N \\to \\infty$.\n\\end{theorem}"},{"id":"cor:jacobian-free-convolution","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"corollary","num":"","title":"Jacobian products in ResNets","bucket":"","lean":"none","nl":"proved","line":118,"deps":["thm:asymptotic-freeness"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{corollary}[Jacobian products in ResNets]\nFor a residual network with Jacobian $J = \\prod_{l=1}^L Y^l$ where each $Y^l = aI + D^l W^l$ and the $W^l$ are independent random matrices, the limiting spectral measure of $J^T J$ satisfies\n\\begin{equation}\n\\mu_{J^T J} = \\bigboxplus_{l=1}^L \\mu_{(Y^l)^T Y^l},\n\\end{equation}\nwhere $\\bigboxplus$ denotes the iterated free multiplicative convolution. Consequently,\n\\begin{equation}\nS_{J^T J}(z) = \\prod_{l=1}^L S_{(Y^l)^T Y^l}(z).\n\\end{equation}\n\\end{corollary}"},{"id":"prop:s-from-dyson","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"proposition","num":"","title":"S-transform from Dyson equation","bucket":"","lean":"none","nl":"proved","line":137,"deps":["def:s-transform"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[S-transform from Dyson equation]\nLet $Y = A + X$ where $X$ is isotropic with variance $\\sigma^2/N$, and assume the deterministic equivalent $M(z)$ is given by the Dyson equation~\\eqref{eq:dyson-fp}. Define the order parameters\n\\begin{equation}\nm_{12}(z) = \\frac{1}{N}\\Tr(M_{12}(z)), \\quad m_{21}(z) = \\frac{1}{N}\\Tr(M_{21}(z)).\n\\end{equation}\n\nThen the S-transform of the spectral measure of $Y^\\top Y$ is obtained as follows. For each $w$ in a neighborhood of $0$, let $z_w$ be the unique solution on the physical (Stieltjes) branch of\n\\begin{equation}\nz \\, G_1(z) - 1 = w,\n\\end{equation}\nwhere $G_1(z) = g_{11}(z)$ is the Cauchy transform of $Y^\\top Y$ from the Dyson equation. Then\n\\begin{equation}\nS_{Y^\\top Y}(w) = \\frac{G_1(z_w)}{w}.\n\\end{equation}\n\nFor the specific case $Y = aI + X$ with isotropic $X$, explicit formulas are given in \\cite{tarnowski2019dynamical}, Section II.\n\\end{proposition}"},{"id":"thm:universal-via-s","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"theorem","num":"","title":"Universal spectral equation via S-transform","bucket":"","lean":"none","nl":"proved","line":161,"deps":["cor:jacobian-free-convolution","prop:s-from-dyson","def:s-transform"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Universal spectral equation via S-transform]\nConsider a deep residual network with $L$ layers, skip connection parameter $a$, and effective cumulant $c = L\\sigma^2$ (Section~\\ref{sec:dyson-resnet}). In the large-depth limit $L \\to \\infty$ with $c^l \\sim c/L$ per layer, the S-transform of the Jacobian spectrum satisfies\n\\begin{equation}\nS_J(z) = \\prod_{l=1}^L S_{Y^l}(z) = a^{2L} \\exp\\left(\\int_0^z \\frac{2c}{w(w+1)} dw\\right) = a^{2L} \\left(\\frac{z+1}{z}\\right)^{2c}.\n\\end{equation}\n\nInverting the S-transform to obtain the Cauchy transform $G(z)$ yields the universal equation\n\\begin{equation}\n\\boxed{a^{2L} G(z) = (zG(z) - 1) \\exp\\bigl(z(1 - 2cG(z))\\bigr),}\n\\end{equation}\nwhich is exactly the universal spectral equation of Tarnowski et al.~\\cite{tarnowski2019dynamical}.\n\\end{theorem}"},{"id":"rem:universality_interpretation","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"remark","num":"","title":"Universality interpretation","bucket":"","lean":"none","nl":"informal","line":222,"deps":["thm:universal-via-s"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Universality interpretation]\nTheorem \\ref{thm:universal-via-s} shows that the spectral properties of the Jacobian depend \\emph{only} on:\n\\begin{itemize}\n\\item The depth $L$,\n\\item The skip connection strength $a$,\n\\item The effective cumulant $c = \\frac{1}{L}\\sum_{l=1}^L c^l$, where $c^l$ encodes the variance and activation statistics at layer $l$.\n\\end{itemize}\n\nThe specific choice of activation function $\\phi$ (ReLU, tanh, sigmoid, etc.) affects the spectrum \\emph{only through} its contribution to $c$. This is the \\textbf{spectral universality} observed in \\cite{tarnowski2019dynamical}, Figure 3: different activation functions with the same effective cumulant yield identical Jacobian spectra.\n\\end{remark}"},{"id":"rem:dynamical_isometry","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"remark","num":"","title":"Dynamical isometry","bucket":"","lean":"none","nl":"informal","line":233,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Dynamical isometry]\nSetting $a = 1$ and solving for the value of $c$ that yields a spectrum concentrated near $\\lambda = 1$ (dynamical isometry), one finds $c = 1/2$ (Definition~\\ref{def:dynamical-isometry}). This critical value is universal across all activation functions, depending only on the constraint that the spectrum of $J$ should be localized at 1.\n\\end{remark}"},{"id":"thm:dykema","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"theorem","num":"","title":"Dykema, 2006","bucket":"","lean":"none","nl":"open","line":245,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Dykema, 2006]\nLet $x$ and $y$ be $\\mcB$-freely independent positive elements. Then\n\\begin{equation}\nS^{(\\mcB)}_{xy}(W) = S^{(\\mcB)}_y(W) \\cdot S^{(\\mcB)}_x\\!\\bigl(S^{(\\mcB)}_y(W)^{-1} \\, W \\, S^{(\\mcB)}_y(W)\\bigr).\n\\end{equation}\n\\end{theorem}"},{"id":"prop:scalar-dyson","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"proposition","num":"","title":"Scalar Dyson equation and z_1-mapping","bucket":"","lean":"none","nl":"open","line":268,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Scalar Dyson equation and $z_1$-mapping]\nLet $Y = aI_N + DW$ with effective variance $\\sigma^2 := \\sigma_w^2\\,\\E[\\phi'(\\sqrt{q}\\,Z)^2]$, $Z \\sim \\mathcal{N}(0,1)$.\n\n\\noindent\\emph{(i) Single layer.} In the limit $N \\to \\infty$, the order parameter $m(z) := \\frac{1}{N}\\Tr\\!\\bigl(Y(zI_N - Y^\\top\\! Y)^{-1}\\bigr)$ satisfies the self-consistent \\emph{scalar Dyson equation}\n\\begin{equation}\nm(z) = \\frac{1}{N}\\Tr\\bigl(A_h(z)\\,(zI_N - A_h(z)^\\top A_h(z))^{-1}\\bigr), \\qquad A_h(z) := aI + \\sigma^2 m(z)\\, I,\n\\end{equation}\nwhere $A_h$ is the dressed skip connection. The Cauchy transform is $G(z) = \\frac{1}{N}\\Tr(zI_N - A_h^\\top A_h)^{-1}$ and the spectral density is $\\rho(\\lambda) = -\\pi^{-1}\\lim_{\\eta \\to 0^+}\\!\\Im\\, G(\\lambda + i\\eta)$.\n\n\\noindent\\emph{(ii) $L$ identical layers.} Let $G_1(z)$ be the single-layer Cauchy transform. Then for any $z_1 \\in \\C^+$:\n\\begin{equation}\nz_L(z_1) := z_1 \\cdot \\left(\\frac{z_1 G_1(z_1) - 1}{G_1(z_1)}\\right)^{L-1}, \\qquad\nG_L(z_L) = \\frac{z_1 \\, G_1(z_1)}{z_L}.\n\\end{equation}\n\\end{proposition}"},{"id":"rem:verification_recovery","block":"rigorous_dyson_theorem/appendices/C_free_probability.tex:3","kind":"remark","num":"","title":"Verification: q = 1 recovery","bucket":"","lean":"none","nl":"proved","line":421,"deps":["def:s-transform"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Verification: $q = 1$ recovery]\nWhen $q = 1$, $A_q = a \\in \\R$, $M(z) = m(z) \\in \\C$, and~\\eqref{eq:kronecker-collapse-final} becomes\n\\[\nm = \\frac{a + \\sigma^2 m}{z - (a + \\sigma^2 m)^2},\n\\]\nwhich is exactly~\\eqref{eq:dyson-fp} evaluated for $A_h = (a + \\sigma^2 m)\\,I_N$.\n\\end{remark}"}],"closed":0,"target":18,"macros":{"E":"\\mathbb{E}","R":"\\mathbb{R}","C":"\\mathbb{C}","N":"\\mathbb{N}","mcL":"\\mathcal{L}","mcR":"\\mathcal{R}","mcX":"\\mathcal{X}","mcM":"\\mathcal{M}","mcG":"\\mathcal{G}","mcS":"\\mathcal{S}","mcH":"\\mathcal{H}","mcB":"\\mathcal{B}","norm":["\\left\\|#1\\right\\|",1],"abs":["\\left|#1\\right|",1],"bigboxplus":"\\mathop{\\boxplus}","Tr":"\\operatorname{Tr}","bTr":"\\operatorname{bTr}","Var":"\\operatorname{Var}","supp":"\\operatorname{supp}","tr":"\\operatorname{tr}"}},"yamabe":{"blocks":[{"id":"Yamabegap.tex:152","title":"Closed leaves: Yamabe energy, Yamabe invariant, and the Yamabe gap"},{"id":"Yamabegap.tex:293","title":"Leaves with boundary"},{"id":"Yamabegap.tex:461","title":"Punctured flat tori: what can be proven"},{"id":"Yamabegap.tex:601","title":"Proofs for Section"}],"nodes":[{"id":"def:yamabe","block":"Yamabegap.tex:152","kind":"definition","num":"","title":"Yamabe energy, Yamabe constant, Yamabe invariant","bucket":"","lean":"none","nl":"definition","line":158,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Yamabe energy, Yamabe constant, Yamabe invariant]\n\nThe \\emph{Yamabe energy} of $(\\Sigma,\\g)$ is\n\\begin{equation}\n\n\\EH(\\Sigma,\\g) := \\frac{\\int_{\\Sigma}\\Rs_{\\g}\\,\\vol}{\\Vol(\\Sigma,\\g)^{(N-2)/N}} = \\langle\\Rs_\\g\\rangle_\\Sigma\\,\\Vol(\\Sigma,\\g)^{2/N}\\ .\n\\end{equation}\nThe \\emph{Yamabe constant} of the conformal class $[\\g]$ and the \\emph{Yamabe invariant} of $\\Sigma$ are\n\\begin{align}\n\n\\Y(\\Sigma,[\\g]) &:= \\inf_{\\phi>0}\\EH\\big(\\Sigma,\\phi^{4/(N-2)}\\g\\big)\\ ,\\\\\n\n\\sigma(\\Sigma) &:= \\sup_{[\\g]}\\Y(\\Sigma,[\\g])\\ ,\n\\end{align}\nthe infimum being taken over smooth positive functions and the supremum over all conformal classes of Riemannian metrics on $\\Sigma$.\n\\end{definition}"},{"id":"thm:yamabe","block":"Yamabegap.tex:152","kind":"theorem","num":"","title":"Yamabe, Trudinger, Aubin, Schoen [MR125546]","bucket":"","lean":"none","nl":"cited","line":182,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Yamabe, Trudinger, Aubin, Schoen \\cite{MR125546,MR240748,MR448404,Aubin1976JMPA,MR788292}]\n\nLet $\\Sigma$ be a closed manifold of dimension $N\\ge 3$ and $\\g$ a Riemannian metric on $\\Sigma$.\n\\begin{enumerate}\n\\item[(a)] (Aubin bound) $\\Y(\\Sigma,[\\g])\\le \\Y(\\Sph^N,[\\g_{\\mathrm{round}}]) = N(N-1)\\,\\omega_N^{2/N}$, where $\\omega_N$ is the volume of the unit round $N$-sphere; in particular $\\sigma(\\Sigma)\\le\\sigma(\\Sph^N)=N(N-1)\\omega_N^{2/N}$.\n\\item[(b)] The infimum in \\eqref{eq:yamabe-constant} is attained by a smooth positive function $\\phi$, and every minimizing metric $\\phi^{4/(N-2)}\\g$ has constant scalar curvature, equal to $\\Y(\\Sigma,[\\g])\\Vol(\\Sigma,\\phi^{4/(N-2)}\\g)^{-2/N}$.\n\\end{enumerate}\n\\end{theorem}"},{"id":"prop:csc-yamabe","block":"Yamabegap.tex:152","kind":"proposition","num":"","title":"Constant scalar curvature versus Yamabe metrics","bucket":"","lean":"none","nl":"proved","line":193,"deps":["lem:kobayashi"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Constant scalar curvature versus Yamabe metrics]\n\nLet $(\\Sigma,\\g)$ be closed, $N\\ge3$, with constant scalar curvature $\\Rs_\\g$.\n\\begin{enumerate}\n\\item[(a)] If $\\Rs_\\g\\le 0$, then $\\EH(\\Sigma,\\g)=\\Y(\\Sigma,[\\g])$, i.e.\\ $\\g$ is a Yamabe metric, and $\\g$ is, up to homotheties, the only constant scalar curvature metric in $[\\g]$.\n\\item[(b)] If $\\Rs_\\g>0$, then $\\Y(\\Sigma,[\\g])>0$ and $\\EH(\\Sigma,\\g)\\ge\\Y(\\Sigma,[\\g])$, where the inequality may be strict: the conformal class of the product metric on $\\Sph^1(L)\\times\\Sph^{N-1}$ contains, for $L$ large, constant scalar curvature metrics that are not Yamabe metrics.\n\\end{enumerate}\n\\end{proposition}"},{"id":"thm:extremal","block":"Yamabegap.tex:152","kind":"theorem","num":"","title":"Realizations of the Yamabe invariant","bucket":"","lean":"none","nl":"cited","line":207,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Realizations of the Yamabe invariant]\n\nLet $\\Sigma$ be a closed manifold of dimension $N\\geq 3$.\n\\begin{enumerate}\n\\item[(a)] Let $\\g$ be a Yamabe metric with $\\Y(\\Sigma,[\\g])=\\sigma(\\Sigma)$. If $\\sigma(\\Sigma)\\le0$, or if $\\g$ is the unique Yamabe metric of $[\\g]$ up to homotheties, then $\\g$ is Einstein, $\\Ric_\\g=\\frac{\\Rs_\\g}{N}\\g$ \\cite{Schoen1989,MR867684,Anderson2005}.\n\\item[(b)] The Yamabe invariant is attained by the metric of constant sectional curvature when $\\Sigma$ is a closed hyperbolic $3$-manifold \\cite{MR2213687}, a closed flat manifold (then $\\sigma(\\Sigma)=0$ \\cite{MR569070}), the sphere $\\Sph^N$ \\cite{MR448404,Obata1971} or the real projective space $\\RR\\mathrm{P}^3$ \\cite{BrayNeves2004,MR2081443}. In these cases $\\sigma(\\Sigma)=\\Rs_{\\g_0}\\Vol(\\Sigma,\\g_0)^{2/N}$ for the constant-curvature metric $\\g_0$.\n\\end{enumerate}\n\\end{theorem}"},{"id":"cor:gap-nonneg","block":"Yamabegap.tex:152","kind":"corollary","num":"","title":"Non-negativity and rigidity of the Yamabe gap","bucket":"","lean":"none","nl":"proved","line":234,"deps":["prop:csc-yamabe","thm:extremal"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{corollary}[Non-negativity and rigidity of the Yamabe gap]\n\nAssume that the leaf $(\\Sigma_t,\\g_t)$ is closed, has constant scalar curvature $\\Rs_{\\g_t}\\le 0$, or more generally that $\\g_t$ is a Yamabe metric. Then:\n\\begin{enumerate}\n\\item[(a)] $\\delta(\\Sigma_t)\\ge 0$, and $\\delta(\\Sigma_t)=0$ if and only if $\\g_t$ attains the Yamabe invariant; in that case, if $\\sigma(\\Sigma)\\le0$ (which is automatic when $\\Rs_{\\g_t}\\le0$), $\\g_t$ is Einstein, hence of constant curvature when $N=3$, i.e.\\ an FLRW leaf.\n\\item[(b)] If $\\Sigma$ is diffeomorphic to a closed hyperbolic $3$-manifold, a closed flat manifold, $\\Sph^N$ or $\\RR\\mathrm{P}^3$, then $-k/a^2$ in \\eqref{eq:accel-gap} is exactly the curvature term of the FLRW model whose leaf at time $\\ini t$ has constant curvature and volume $\\ini V$, and the Yamabe gap is the full deviation of the averaged scalar curvature from its Friedmannian value.\n\\end{enumerate}\n\\end{corollary}"},{"id":"cor:volume","block":"Yamabegap.tex:152","kind":"corollary","num":"","title":"Volume comparison","bucket":"","lean":"none","nl":"proved","line":246,"deps":["prop:csc-yamabe","thm:extremal"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{corollary}[Volume comparison]\n\nLet $\\Sigma$ be a closed hyperbolic $3$-manifold with hyperbolic metric $\\g_{\\mathrm{hyp}}$, and let $\\g$ be a metric on $\\Sigma$ of constant scalar curvature $\\Rs_\\g=\\Rs_{\\g_{\\mathrm{hyp}}}<0$. Then $\\Vol(\\Sigma,\\g)\\ge\\Vol(\\Sigma,\\g_{\\mathrm{hyp}})$, with equality if and only if $\\g$ is isometric to $\\g_{\\mathrm{hyp}}$.\n\\end{corollary}"},{"id":"def:yamabe-bdry","block":"Yamabegap.tex:293","kind":"definition","num":"","title":"Yamabe energy and relative Yamabe constant with boundary","bucket":"","lean":"none","nl":"definition","line":301,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Yamabe energy and relative Yamabe constant with boundary]\n\nLet\n\\begin{equation}\n\n\\mathcal{S}(\\Sigma,\\g):=\\int_{\\Sigma}\\Rs_\\g\\,\\vol+2(N-1)\\int_{\\partial \\Sigma}H_\\g\\,\\bvol\n\\end{equation}\nbe the Einstein--Hilbert action with its Gibbons--Hawking--York boundary term. The \\emph{Yamabe energy} of $(\\Sigma,\\g)$ and its \\emph{boundary-normalized} version are\n\\begin{align}\n\n\\EH(\\Sigma,\\g) &:= \\frac{\\mathcal{S}(\\Sigma,\\g)}{\\Vol(\\Sigma,\\g)^{(N-2)/N}}\\ ,\\\\\n\n\\EHB(\\Sigma,\\g) &:= \\frac{\\mathcal{S}(\\Sigma,\\g)}{\\Vol(\\partial\\Sigma,\\g)^{(N-2)/(N-1)}}\\ ,\n\\end{align}\nand the \\emph{relative Yamabe constant} and \\emph{boundary Yamabe constant} of the conformal class $[\\g]$ are\n\\begin{align}\n\n\\Y_{[\\g]}(\\Sigma) &:= \\inf_{\\phi>0}\\EH\\big(\\Sigma,\\phi^{4/(N-2)}\\g\\big)\\ ,\\\\\n\n\\YB_{[\\g]}(\\Sigma) &:= \\inf_{\\phi>0}\\EHB\\big(\\Sigma,\\phi^{4/(N-2)}\\g\\big)\\ .\n\\end{align}\n\\end{definition}"},{"id":"prop:gap-bdry-nonneg","block":"Yamabegap.tex:293","kind":"proposition","num":"","title":"Non-negativity of the gap with boundary","bucket":"","lean":"none","nl":"proved","line":356,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Non-negativity of the gap with boundary]\n\nIf $\\g$ has constant scalar curvature, minimal boundary and $\\Rs_\\g\\le0$, then $\\delta(\\Sigma,\\g)\\ge0$.\n\\end{proposition}"},{"id":"rem:old-reference","block":"Yamabegap.tex:293","kind":"remark","num":"","title":"What this replaces","bucket":"","lean":"none","nl":"informal","line":371,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[What this replaces]\n\nAn earlier version of this work compared $\\EH(\\Sigma,\\g)$ with the energy of a flat leaf built by embedding each $(B_j,\\g|_{B_j})$ isometrically in $\\Eucl^3$ and rescaling so as to match $\\Vol(\\Sigma,\\g)$. That comparison manifold is rebuilt from the \\emph{deformed} boundary areas and volume of the very metric being compared, and the resulting gap is non-positive for every metric in the flat conformal class, with equality only for the constant conformal factor. The defect is the one Ellis and Stoeger \\cite{EllisStoeger1987} identify in the standard model---an implicitly chosen smoothing---made local. Definition \\eqref{eq:sigma-bdry} removes it: the reference is fixed by the topology, not by the metric under comparison.\n\\end{remark}"},{"id":"def:reference","block":"Yamabegap.tex:293","kind":"definition","num":"","title":"Euclidean reference embedding","bucket":"","lean":"none","nl":"definition","line":378,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Euclidean reference embedding]\n\nLet $N=3$ and assume that each boundary component $(B_j,\\g|_{B_j})$ is a $2$-sphere of positive Gauss curvature. By the Weyl--Nirenberg embedding theorem \\cite{MR58265} each $(B_j,\\g|_{B_j})$ admits an isometric embedding into $\\Eucl^3$ as the boundary of a convex body $C_j$, unique up to rigid motions. We write $\\Href$ for the mean curvature of $\\partial C_j$ with respect to the normal pointing \\emph{into} $C_j$; for a round sphere of radius $r_j$, $\\Href=-1/r_j$.\n\\end{definition}"},{"id":"prop:brown-york","block":"Yamabegap.tex:293","kind":"proposition","num":"","title":"Relation to the Brown--York mass","bucket":"","lean":"none","nl":"proved","line":390,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Relation to the Brown--York mass]\n\nLet $\\mBY(B_j):=\\int_{B_j}(k_0-k)\\,\\bvol$ be the Brown--York quasi-local mass of $B_j$ \\cite{MR1188439,BrownYork1993} (in units $8\\pi G=1$), where $k$ is the trace of the second fundamental form of $B_j\\subset\\Sigma$ with respect to the unit normal pointing out of the enclosed region, i.e.\\ into the void, and $k_0$ the corresponding quantity for the isometric embedding of $B_j$ into $\\Eucl^3$. Then\n\\begin{equation}\n\nM=\\frac{1}{N-1}\\sum_{j=1}^n\\mBY(B_j)\\ .\n\\end{equation}\nIn particular, if $B_j$ is a minimal round sphere of radius $r_j$ (the horizon of a Schwarzschild-like end), then $\\mBY(B_j)=(N-1)\\omega_{N-1}r_j^{N-2}$, i.e.\\ $8\\pi r_j$ for $N=3$, and the contribution of $B_j$ to $M$ equals the mass parameter $m_j$ of the Schwarzschild solution with horizon radius $r_j$.\n\\end{proposition}"},{"id":"prop:accel-bdry","block":"Yamabegap.tex:293","kind":"proposition","num":"","title":"Acceleration law for the void","bucket":"","lean":"none","nl":"open","line":407,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Acceleration law for the void]\n\nLet $\\Sigma_t$ carry a metric $\\g_t$ with minimal boundary, $H_{\\g_t}\\equiv0$, and let $\\delta(\\Sigma_t)=\\sigbd(\\Sigma)-\\EH(\\Sigma_t,\\g_t)$ be the Yamabe gap \\eqref{eq:gap-bdry}. Then\n\\begin{equation}\n\n\\frac{\\partial_{tt} (a^N)}{a^N} = \\frac{N}{N-1}\\, \\frac{\\inirho}{a^N} + \\frac{2N}{N-1}\\Lambda + \\frac{\\delta(\\Sigma_t)-\\sigbd(\\Sigma)}{\\ini V^{2/N}a^2}\\ .\n\\end{equation}\nFor a punctured flat torus, $\\sigbd(\\Sigma)=0$ by \\eqref{eq:sigma-torus} and the last term is $\\delta(\\Sigma_t)/(\\ini V^{2/N}a^2)$. If the boundary is not minimal, the right-hand side acquires the further term $2(N-1)\\int_{\\partial\\Sigma}H_{\\g_t}\\bvol/(\\ini V a^N)$.\n\\end{proposition}"},{"id":"rem:conformal-gap","block":"Yamabegap.tex:293","kind":"remark","num":"","title":"Gap and conformal gap","bucket":"","lean":"none","nl":"informal","line":421,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Gap and conformal gap]\n\nBy \\eqref{eq:relative-yamabe}, $\\EH(\\Sigma,\\g)\\ge\\Y_{[\\g]}(\\Sigma)$, so that $\\delta(\\Sigma)\\le\\delta_{\\mathrm{conf}}(\\Sigma):=\\sigbd(\\Sigma)-\\Y_{[\\g]}(\\Sigma)$, with equality when $\\g$ has constant scalar curvature, minimal boundary and $\\Rs_\\g\\le0$ (fact (iii) above). Sec.~\\ref{sec:torus} treats minimal boundaries, for which $\\delta=\\delta_{\\mathrm{conf}}$.\n\\end{remark}"},{"id":"rem:positive-mass","block":"Yamabegap.tex:293","kind":"remark","num":"","title":"Positive mass and Penrose inequalities","bucket":"","lean":"none","nl":"informal","line":426,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Positive mass and Penrose inequalities]\n\nThe non-negativity of the Yamabe gap may be viewed as a cosmological analogue of a positive mass theorem, identifying the most homogeneous configuration (FLRW) as the one in which the matter content has the least influence on the geometry; sharper lower bounds on $\\delta$ under a Brown--York-type constraint at the boundary would be analogues of Penrose inequalities \\cite{penrose1969gravitational,MR1916951}. Shi and Tam \\cite{MR1987378} proved the positivity of the Brown--York mass of the boundary of a compact manifold with non-negative scalar curvature and positive mean curvature, i.e.\\ of the \\emph{enclosed} region. In the void the outward mean curvature is non-positive and the scalar curvature is negative, so that no direct implication holds; the two statements are nonetheless closely related.\n\\end{remark}"},{"id":"prop:nonpositive","block":"Yamabegap.tex:461","kind":"proposition","num":"","title":"Non-positive type","bucket":"","lean":"none","nl":"open","line":476,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{proposition}[Non-positive type]\n\nAssume that $\\Sigbar$ is enlargeable and that for each $j$ the conformal class of $\\g|_{B_j}$ has positive Yamabe constant (automatic for $N=3$). Then $\\Y_{[\\g]}(\\Sigma)\\le0$. Consequently, if $\\g$ has constant scalar curvature and minimal boundary, then $\\Rs_\\g\\le0$ and $\\EH(\\Sigma,\\g)=\\Y_{[\\g]}(\\Sigma)$.\n\\end{proposition}"},{"id":"rem:existence","block":"Yamabegap.tex:461","kind":"remark","num":"","title":"Existence","bucket":"","lean":"none","nl":"informal","line":481,"deps":["prop:nonpositive","thm:upper-bound"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[Existence]\n\nMetrics satisfying the hypotheses of Proposition~\\ref{prop:nonpositive} exist in abundance. Starting from any metric on $\\Sigma$ with minimal boundary---for instance a flat torus with holes to which Schwarzschild collars are attached---fact (ii) of Sec.~\\ref{sec:boundary} provides a constant-scalar-curvature metric with minimal boundary in its conformal class, and for $N=3$ each boundary component stays conformally round. Whether the boundary spheres can moreover be made \\emph{isometrically} round within a prescribed conformal class is part of the constrained Yamabe problem discussed in Sec.~\\ref{sec:discussion}; Theorem~\\ref{thm:upper-bound} below does not require it.\n\\end{remark}"},{"id":"thm:upper-bound","block":"Yamabegap.tex:461","kind":"theorem","num":"","title":"Upper bound on the relative Yamabe constant","bucket":"","lean":"none","nl":"open","line":493,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Upper bound on the relative Yamabe constant]\n\nAssume that $\\sigma(\\Sigbar)\\le0$, that $\\g$ has constant scalar curvature and minimal boundary, and that each $(B_j,\\g|_{B_j})$ is conformally equivalent to the round sphere (automatic for $N=3$). Then\n\\begin{equation}\n\n\\Y_{[\\g]}(\\Sigma)\\ \\le\\ -\\inf_{u\\in W^{1,2}(\\Sigma)\\setminus\\{0\\}}\\Fq_{\\g}(u)\\ .\n\\end{equation}\n\\end{theorem}"},{"id":"cor:negative","block":"Yamabegap.tex:461","kind":"corollary","num":"","title":"Strict negativity","bucket":"","lean":"none","nl":"proved","line":502,"deps":["thm:upper-bound"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{corollary}[Strict negativity]\n\nUnder the hypotheses of Theorem~\\ref{thm:upper-bound}, $\\inf\\Fq_\\g>0$; hence $\\Y_{[\\g]}(\\Sigma)<0$ and $\\Rs_\\g<0$. In particular a Schwarzschild-like punctured torus is never scalar flat.\n\\end{corollary}"},{"id":"rem:sign","block":"Yamabegap.tex:461","kind":"remark","num":"","title":"What Theorem~thm:upper-bound does and does not say","bucket":"","lean":"none","nl":"proved","line":507,"deps":["thm:upper-bound","cor:negative","prop:nonpositive","lem:kobayashi","lem:gluing","lem:gluing-estimate","lem:stability","lem:positivity"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remark}[What Theorem~\\ref{thm:upper-bound} does and does not say]\n\nOn the constant function, \\eqref{eq:F1-torus} gives $\\Fq_\\g(1)=2(N-1)M/\\Vol(\\Sigma,\\g)^{(N-2)/N}$. The first variation of $\\Fq_\\g$ at $u=1$ in a direction $\\varphi$ with $\\int_\\Sigma\\varphi\\,\\vol=0$ and $\\varphi\\le0$, $\\varphi\\not\\equiv0$ on $\\partial\\Sigma$ is strictly negative (Appendix~\\ref{app:proofs}), so that $\\inf\\Fq_\\g<\\Fq_\\g(1)$: the constant function is never optimal, and any bound of the form $\\inf\\Fq_\\g\\ge\\kappa\\Fq_\\g(1)$ must have $\\kappa<1$. Theorem~\\ref{thm:upper-bound} therefore yields $\\delta>0$ but no size. The size is the content of the next theorem.\n\\end{remark}"},{"id":"thm:lower-bound","block":"Yamabegap.tex:461","kind":"theorem","num":"","title":"Quantitative lower bound on the gap","bucket":"","lean":"none","nl":"proved","line":512,"deps":["thm:upper-bound","thm:yamabe","lem:kobayashi"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}[Quantitative lower bound on the gap]\n\nUnder the hypotheses of Theorem~\\ref{thm:upper-bound}, let $\\cpst(\\Sigma,\\g)$ denote the capacity of $\\partial\\Sigma$ against a uniform neutralising background, i.e.\\ the least Dirichlet energy of a function whose mean over $\\Sigma$ exceeds its (area-weighted) mean over $\\partial\\Sigma$ by one, and set\n\\begin{equation}\n\n\\theta:=\\frac{\\aN\\,\\cpst(\\Sigma,\\g)}{\\cN\\sum_j\\Vol(B_j,\\g)^{(N-2)/(N-1)}}\\ .\n\\end{equation}\nThen\n\\begin{equation}\n\n\\delta(\\Sigma,\\g)\\ \\ge\\ \\kappa\\,\\Fq_\\g(1)\n =\\ \\kappa\\,\\frac{2(N-1)M}{\\Vol(\\Sigma,\\g)^{(N-2)/N}}\\ ,\n\\end{equation}\nwith an explicit\n\\begin{equation}\n\n\\kappa=\\frac{\\theta}{1+\\theta}\\Big(1-\\tfrac{\\Atil\\,\\theta\\,\\Fq_\\g(1)}{\\aN(1+\\theta)^2}+O(\\Fq_\\g(1)^2)\\Big)\\ ,\n\\end{equation}\nwhere $\\Atil$ depends only on the Sobolev--Poincar\\'e and Poincar\\'e constants of $(\\Sigma,\\g)$. The factor $\\theta/(1+\\theta)$ is optimal. One has $\\theta=2$ for a Euclidean ball in every dimension and $\\theta=1$ for a Schwarzschild collar, so that $\\kappa\\to1/2$ in the dilute limit relevant here, giving\n\\begin{equation}\n\n|\\Rs_\\g|\\,\\Vol(\\Sigma,\\g)^{2/N}\\ \\ge\\ \\frac{(N-1)M}{\\Vol(\\Sigma,\\g)^{(N-2)/N}}\\big(1+o(1)\\big)\\ ,\n\\end{equation}\ni.e.\\ $|\\Rs_\\g|\\ge2M/\\Vol(\\Sigma,\\g)$ for $N=3$.\n\\end{theorem}"},{"id":"lem:kobayashi","block":"Yamabegap.tex:601","kind":"lemma","num":"","title":"Lower bound of Kobayashi type","bucket":"","lean":"none","nl":"proved","line":613,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lemma}[Lower bound of Kobayashi type]\n\nAssume $H_\\g\\equiv0$ (or $\\partial\\Sigma=\\emptyset$).\n\\begin{enumerate}\n\\item[(a)] If $m:=\\min(0,\\min_\\Sigma\\Rs_\\g)$, then for every $u\\in W^{1,2}(\\Sigma)\\setminus\\{0\\}$\n\\begin{equation}\n\n\\EH\\big(\\Sigma,u^{4/(N-2)}\\g\\big)\\ \\ge\\ \\aN\\frac{\\|\\nabla u\\|^2_{L^2(\\Sigma)}}{\\|u\\|^2_{L^{\\pstar}(\\Sigma)}}+m\\Vol(\\Sigma)^{2/N}\\ ;\n\\end{equation}\nin particular $\\Y_{[\\g]}(\\Sigma)\\ge m\\Vol(\\Sigma)^{2/N}$. If $\\Rs_\\g$ is constant and non-positive, then $\\EH(\\Sigma,\\g)=\\Y_{[\\g]}(\\Sigma)$.\n\\item[(b)] If $\\min_\\Sigma\\Rs_\\g>0$, then $\\Y_{[\\g]}(\\Sigma)>0$.\n\\end{enumerate}\n\\end{lemma}"},{"id":"lem:gluing-estimate","block":"Yamabegap.tex:601","kind":"lemma","num":"","title":"Gluing estimate","bucket":"","lean":"none","nl":"proved","line":648,"deps":["thm:yamabe","lem:kobayashi"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lemma}[Gluing estimate]\n\nLet $(\\Sigbar,\\gbar)$ be a smooth closed Riemannian $N$-manifold with $\\Y_{[\\gbar]}(\\Sigbar)\\le0$, let $\\Sigma\\subset\\Sigbar$ be a compact connected domain with smooth boundary $\\partial\\Sigma=\\bigsqcup_jB_j$, and let $D_j$ be the closures of the components of $\\Sigbar\\setminus\\Sigma$, each $D_j$ meeting $\\Sigma$ along $B_j$. Put $\\g:=\\gbar|_\\Sigma$, $\\g_j:=\\gbar|_{D_j}$, and assume $H_\\g\\equiv0$ on $\\partial\\Sigma$ and $\\beta_j:=\\YB_{[\\g_j]}(D_j)>-\\infty$. Then there exists a smooth positive function $u$ on $\\Sigma$ such that, with $m:=\\min(0,\\min_\\Sigma\\Rs_\\g)$,\n\\begin{equation}\n\nm\\,\\Vol(\\Sigma,\\g)^{2/N}\\ \\le\\ -\\Fq^{(\\beta)}_\\g(u)+\\Y_{[\\gbar]}(\\Sigbar)\\Big(\\frac{\\Vol(\\Sigbar,\\bar h)}{\\Vol(\\Sigma,\\bar h)}\\Big)^{\\frac{N-2}{N}}\\ ,\n\\end{equation}\nwhere $\\bar h$ is a Yamabe metric of $[\\gbar]$; the last term is non-positive.\n\\end{lemma}"},{"id":"lem:gluing","block":"Yamabegap.tex:601","kind":"lemma","num":"","title":"Gluing a flat-class filling","bucket":"","lean":"none","nl":"proved","line":685,"deps":["thm:upper-bound"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lemma}[Gluing a flat-class filling]\n\nLet $(\\Sigma,\\g)$ satisfy the hypotheses of Theorem~\\ref{thm:upper-bound}. For every $\\tau>0$ there exist a metric $\\tilde\\g_\\tau$ on $\\Sigma$ with $H_{\\tilde\\g_\\tau}\\equiv0$ and a smooth metric $\\gbar_\\tau$ on $\\Sigbar$ such that $\\gbar_\\tau|_\\Sigma=\\tilde\\g_\\tau$, $\\gbar_\\tau|_{D_j}$ is conformally equivalent to the flat unit ball for every $j$, and, as $\\tau\\to0$, $\\tilde\\g_\\tau\\to\\g$ and $\\Rs_{\\tilde\\g_\\tau}\\to\\Rs_\\g$ uniformly on $\\Sigma$.\n\\end{lemma}"},{"id":"lem:stability","block":"Yamabegap.tex:601","kind":"lemma","num":"","title":"Stability of the trace-Sobolev quotient","bucket":"","lean":"none","nl":"proved","line":697,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lemma}[Stability of the trace-Sobolev quotient]\n\nLet $\\g,\\g'$ be metrics on $\\Sigma$ with $(1+\\varepsilon)^{-1}\\g\\le\\g'\\le(1+\\varepsilon)\\g$ as quadratic forms, $\\varepsilon\\ge0$. Then for every $u\\in W^{1,2}(\\Sigma)\\setminus\\{0\\}$ and all $\\beta_j\\ge0$,\n\\begin{equation*}\n(1+\\varepsilon)^{-N}\\ \\le\\ \\frac{\\Fq^{(\\beta)}_{\\g'}(u)}{\\Fq^{(\\beta)}_{\\g}(u)}\\ \\le\\ (1+\\varepsilon)^{N}\\ ,\n\\end{equation*}\nConsequently $\\inf\\Fq^{(\\beta)}_{\\g'}\\to\\inf\\Fq^{(\\beta)}_\\g$ when $\\g'\\to\\g$ uniformly.\n\\end{lemma}"},{"id":"lem:positivity","block":"Yamabegap.tex:601","kind":"lemma","num":"","title":"Positivity of the trace-Sobolev quotient","bucket":"","lean":"none","nl":"proved","line":715,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lemma}[Positivity of the trace-Sobolev quotient]\n\nFor every metric $\\g$ on the compact connected manifold with non-empty boundary $\\Sigma$, $\\inf_{u\\ne0}\\Fq_\\g(u)>0$.\n\\end{lemma}"}],"closed":0,"target":25,"macros":{"RR":"\\mathbb{R}","Sph":"\\mathbb{S}","Torus":"\\mathbb{T}","Eucl":"\\mathbb{E}","g":"\\mathbf{g}","gbar":"\\bar{\\mathbf{g}}","Rs":"\\mathcal{R}","Ric":"\\mathbf{Ric}","vol":"\\boldsymbol{\\eta}","bvol":"\\boldsymbol{\\varpi}","M":"\\mathcal{M}","sigbd":"\\sigma_\\partial","cpst":"\\operatorname{cap}_*","Atil":"\\widetilde{A}","Sigbar":"\\bar{\\Sigma}","ini":["{#1}_{\\mathbf{i}}",1],"inirho":"\\ini{\\varrho}","mBY":"m_{\\mathrm{BY}}","Href":"H_{\\mathrm{ref}}","EH":"\\mathcal{E}","EHB":"\\mathcal{E}^{\\partial}","Y":"\\mathcal{Y}","YB":"\\mathcal{Y}^{\\partial}","pstar":"p^{*}","psharp":"p^{\\sharp}","rd":"\\mathrm{d}","aN":"a_N","cN":"c_N","Fq":"\\mathsf{F}","Vol":"\\operatorname{Vol}","tr":"\\operatorname{tr}"}}};

function wrap(text, n, maxLines){
  const words = String(text).split(/\s+/); const lines=[]; let cur="";
  for (const w of words){ if ((cur+" "+w).trim().length>n && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }

  if (lines.length>maxLines){ const l=lines.slice(0,maxLines); l[maxLines-1]=l[maxLines-1].replace(/.{0,2}$/,"")+"…"; return l; }
  return lines;
}

function shortBlock(t){ const i=t.lastIndexOf(" › "); return i<0?t.replace(/\.$/,""):t.slice(i+3).replace(/\.$/,""); }

  return d3.zoomIdentity.translate(W/2-k*(bbox.x+bbox.w/2), H/2-k*(bbox.y+bbox.h/2)).scale(k);
}

/* ---------- graph builders ---------- */
function hubGraph(){
  const nodes=[], edges=[];
  for (const [id,pp] of Object.entries(HUB.papers)){
    const d=DATA[id];
    nodes.push({id, kind:"paper", w:236, h:104, cluster:pp.cluster, drill:!!d, pp, c:d?counts(d.nodes):null, closed:d?d.closed:pp.closed, target:d?d.target:pp.target});
  }
  for (const [id,lib] of Object.entries(HUB.libs)) nodes.push({id, kind:"lib", w:216, h:78, cluster:"libs", lib});
  HUB.edges.forEach(e=>edges.push({v:e.from,w:e.to,label:e.short,dashed:e.dashed,info:e}));
  return {nodes,edges,rankdir:"TB",clusters:HUB.clusters, nodesep:36, ranksep:62, aspect:1.25};
}
function paperGraph(p){
  const d=DATA[p]; const byBlock={}; d.nodes.forEach(n=>(byBlock[n.block]??=[]).push(n));
  const blockOf={}; d.nodes.forEach(n=>blockOf[n.id]=n.block);
  const nodes=d.blocks.map(b=>({id:b.id,kind:"block",w:250,h:92,b,c:counts(byBlock[b.id]||[]),n:(byBlock[b.id]||[]).length,drill:true}));
  const agg={};
  d.nodes.forEach(n=>n.deps.forEach(dep=>{ const a=blockOf[dep], b=n.block; if(a&&a!==b){ const k=a+"|"+b; agg[k]=(agg[k]||0)+1; } }));
  const edges=Object.entries(agg).map(([k,v])=>{const [a,b]=k.split("|"); return {v:a,w:b,weight:v,label:String(v)};});
  // keep document order as a weak spine so isolated blocks still read top-to-bottom
  return {nodes,edges,rankdir:"TB",nodesep:36,ranksep:64};
}
function blockGraph(p,bid){
  const d=DATA[p]; const inB=d.nodes.filter(n=>n.block===bid); const ids=new Set(inB.map(n=>n.id));
  const byId={}; d.nodes.forEach(n=>byId[n.id]=n);
  const nodes=inB.map(n=>({id:n.id,kind:"stmt",w:200,h:50,n}));
  const edges=[]; const ghosts={};
  inB.forEach(n=>n.deps.forEach(dep=>{ if(!ids.has(dep)) ghosts[dep]=byId[dep]; edges.push({v:dep,w:n.id}); }));
  d.nodes.forEach(n=>{ if(!ids.has(n.id)) n.deps.forEach(dep=>{ if(ids.has(dep)){ ghosts[n.id]=n; edges.push({v:dep,w:n.id}); } }); });
  for (const [g,n] of Object.entries(ghosts)) nodes.push({id:g,kind:"ghost",w:200,h:44,n});
  return {nodes,edges,rankdir:"TB",nodesep:22,ranksep:46};
}

/* ---------- layout + draw ---------- */
function dagreOne(nodes,edges,G){
  const g=new dagre.graphlib.Graph({multigraph:true});
  g.setGraph({rankdir:G.rankdir,nodesep:G.nodesep,ranksep:G.ranksep,marginx:0,marginy:0});
  g.setDefaultEdgeLabel(()=>({}));
  nodes.forEach(n=>g.setNode(n.id,{width:n.w,height:n.h}));
  edges.forEach(e=>g.setEdge(e.v,e.w,{label:e.label,width:e.label?18:0,height:e.label?14:0,labelpos:"c",weight:e.weight||1},"e"+e.i));
  dagre.layout(g);
  const gi=g.graph(); return {g,w:gi.width||0,h:gi.height||0};
}
function components(nodes,edges){
  const par={}; nodes.forEach(n=>par[n.id]=n.id);
  const f=x=>par[x]===x?x:(par[x]=f(par[x]));
  edges.forEach(e=>{ if(par[e.v]!=null&&par[e.w]!=null) par[f(e.v)]=f(e.w); });
  const groups={}; nodes.forEach(n=>(groups[f(n.id)]??=[]).push(n)); return Object.values(groups);
}
/* Lay out each group with dagre, then shelf-pack the groups into rows; returns absolute geometry. */
function layout(G){
  const edges=G.edges.map((e,i)=>({...e,i}));
  let groups;
  if (G.clusters) groups=G.clusters.map(c=>({c,nodes:G.nodes.filter(n=>n.cluster===c.id)})).filter(x=>x.nodes.length);
  else groups=components(G.nodes,edges).map(ns=>({nodes:ns}));
  const pad=G.clusters?28:0, top=G.clusters?34:0;
  const parts=groups.map(gr=>{ const ids=new Set(gr.nodes.map(n=>n.id)); const es=edges.filter(e=>ids.has(e.v)&&ids.has(e.w));
    const r=dagreOne(gr.nodes,es,G); return {...gr,es,r,w:r.w+2*pad,h:r.h+pad+top}; });
  if (!G.clusters) parts.sort((a,b)=>b.nodes.length-a.nodes.length||b.h-a.h);
  const area=parts.reduce((a,p)=>a+p.w*p.h,0);
  const maxW=Math.max(...parts.map(p=>p.w), Math.sqrt(area)*(G.aspect||1.5));
  const gapX=G.clusters?40:G.nodesep*1.6, gapY=G.clusters?40:G.ranksep;
  let x=0,y=0,rowH=0,W=0; const out={nodes:{},edges:[],clusters:[]};
  parts.forEach(p=>{
    if (x>0 && x+p.w>maxW){ x=0; y+=rowH+gapY; rowH=0; }
    const ox=x+pad, oy=y+top;
    p.nodes.forEach(n=>{ const q=p.r.g.node(n.id); out.nodes[n.id]={x:q.x+ox,y:q.y+oy,width:n.w,height:n.h}; });
    p.r.g.edges().forEach(eo=>{ const e=p.r.g.edge(eo); out.edges.push({src:edges[+eo.name.slice(1)],points:e.points.map(pt=>({x:pt.x+ox,y:pt.y+oy})),x:e.x!=null?e.x+ox:null,y:e.y!=null?e.y+oy:null,label:e.label,v:eo.v,w:eo.w}); });
    if (p.c) out.clusters.push({title:p.c.title,x,y,w:p.w,h:p.h});
    x+=p.w+gapX; rowH=Math.max(rowH,p.h); W=Math.max(W,x-gapX);
  });
  out.width=W; out.height=y+rowH; return out;
}
function bar(sel,c,x,y,w,h){
  const tot=c.closed+c.partial+c.terminal+c.none||1; let xx=x;
  [["closed","var(--closed)"],["partial","var(--partial)"],["terminal","url(#hatch)"],["none","var(--grid)"]].forEach(([k,col])=>{
    const ww=w*c[k]/tot; if(ww>0){ sel.append("rect").attr("x",xx).attr("y",y).attr("width",ww).attr("height",h).attr("fill",col).attr("stroke",k==="terminal"?"var(--terminal)":"none").attr("stroke-width",.5); xx+=ww; }
  });
  sel.append("rect").attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",2).attr("fill","none").attr("stroke","var(--line)");
}
let G=null, g=null;
function draw(){
  world.selectAll("*").remove();
  G = state.level==="hub"?hubGraph(): state.level==="paper"?paperGraph(state.p):blockGraph(state.p,state.b);
  g = layout(G);
  bbox={x:-20,y:-20,w:g.width+40,h:g.height+40};
  // clusters
  for (const c of g.clusters){
    const cg=world.append("g").attr("class","cluster");
    cg.append("rect").attr("x",c.x).attr("y",c.y).attr("width",c.w).attr("height",c.h).attr("rx",14);
    cg.append("text").attr("x",c.x+16).attr("y",c.y+22).text(c.title); }
  // edges
  const line=d3.line().x(p=>p.x).y(p=>p.y).curve(d3.curveBasis);
  const eg=world.append("g");
  g.edges.forEach(e=>{ const src=e.src;
    const el=eg.append("g").attr("class","edge"+(src.dashed?" dashed":"")).attr("data-v",e.v).attr("data-w",e.w);
    el.append("path").attr("d",line(e.points)).attr("marker-end","url(#arr)").attr("stroke-width",src.weight?Math.min(1.2+Math.log2(src.weight)*1.3,6):1.4);
    if (e.label && e.x!=null) el.append("text").attr("x",e.x).attr("y",e.y+4).attr("text-anchor","middle").text(e.label);
    if (src.info){ el.style("cursor","pointer").on("click",ev=>{ev.stopPropagation(); showEdge(src.info);}); el.append("title").text(src.info.why); }
  });
  // nodes
  const ng=world.append("g");
  G.nodes.forEach(N=>{ const p=g.nodes[N.id]; if(!p) return; const x=p.x-N.w/2, y=p.y-N.h/2;
    const st=N.kind==="stmt"?" st-"+statusOf(N.n):"";
    const el=ng.append("g").attr("class","node "+N.kind+st).attr("transform",`translate(${x},${y})`).attr("tabindex",0).attr("data-id",N.id)
      .attr("role","button").attr("aria-label",nodeAria(N));
    el.append("rect").attr("class","box").attr("width",N.w).attr("height",N.h).attr("rx",N.kind==="stmt"||N.kind==="ghost"?6:10).style("filter",N.kind==="paper"||N.kind==="block"?"drop-shadow(0 2px 5px rgba(20,30,45,.09))":null);
    drawNode[N.kind](el,N);
    const act=ev=>{ ev.stopPropagation(); onNode(N, el); };
    el.on("click",act).on("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); act(ev);} });
    el.on("mouseenter",()=>hiEdges(N.id,true)).on("mouseleave",()=>hiEdges(N.id,false));
  });
  svg.on("click",()=>{ selected=null; markSel(); panelForLevel(); });
  crumbs(); legend();
}
function nodeAria(N){

/* ---------- navigation with zoom-in / zoom-out transitions ---------- */
function go(next, fromNodeId, dir){
  const W=svg.node().clientWidth,H=svg.node().clientHeight;
  const after=()=>{ state=next; selected=null; world.classed("fade",true); draw(); panelForLevel();
    const t=fitTransform();
    if (reduce){ svg.call(zoom.transform,t); world.classed("fade",false); return; }
    const pre = dir==="up" ? t.scale(2.2).translate(-(bbox.w/2)*(1-1/2.2),-(bbox.h/2)*(1-1/2.2)) : d3.zoomIdentity.translate(W/2,H/2).scale(t.k*0.25).translate(-bbox.w/2,-bbox.h/2);
    svg.call(zoom.transform,pre); requestAnimationFrame(()=>{ world.classed("fade",false); svg.transition().duration(480).ease(d3.easeCubicOut).call(zoom.transform,t); });
  };
  if (reduce){ after(); return; }
  if (fromNodeId && g && g.nodes[fromNodeId]){
    const p=g.nodes[fromNodeId]; const k=Math.min(4,Math.max(W/p.width,H/p.height)*0.9);
    svg.transition().duration(380).ease(d3.easeCubicIn).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*p.x,H/2-k*p.y).scale(k)).on("end",after);
    world.classed("fade",true);
  } else { world.classed("fade",true); setTimeout(after,200); }
}
function onNode(N, el){
  if (N.kind==="paper"){ if (N.drill) go({level:"paper",p:N.id},N.id,"down"); else { selected=N.id; markSel(); showPaperInfo(N.id); } return; }
  if (N.kind==="lib"){ selected=N.id; markSel(); showLib(N.id); return; }
  if (N.kind==="block"){ go({level:"block",p:state.p,b:N.id},N.id,"down"); return; }
  if (N.kind==="ghost"){ openStatement(state.p,N.id); return; }
  selected=N.id; markSel(); showStmt(state.p,N.n);
}
function openStatement(p,id){
  const n=LABEL[p+"/"+id].n;
  const after=()=>{ selected=id; markSel(); showStmt(p,n); const q=g.nodes[id]; if(q){ const W=svg.node().clientWidth,H=svg.node().clientHeight; const k=Math.max(fitTransform().k,0.9); svg.transition().delay(reduce?0:520).duration(reduce?0:420).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*q.x,H/2-k*q.y).scale(k)); } };
  if (state.level==="block"&&state.p===p&&state.b===n.block) { after(); return; }
  go({level:"block",p,b:n.block},null,"down"); setTimeout(after, reduce?0:260);
}
addEventListener("keydown",e=>{
  if (e.key!=="Escape"||e.target.tagName==="INPUT") return;
  if (state.level==="block") go({level:"paper",p:state.p},null,"up"); else if (state.level==="paper") go({level:"hub"},null,"up");
});
$("#q").addEventListener("change",e=>{ const v=e.target.value.trim(); const hit=Object.keys(LABEL).find(k=>LABEL[k].n.id===v); if(hit){ openStatement(LABEL[hit].p,v); e.target.blur(); } });
