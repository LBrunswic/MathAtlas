\\kappa}$, with $J^\\pm$ and $I^\\pm$ taken\nin that subset.\n\\end{lem}"},{"id":"def:singular_spacetime","block":"ETT.tex:1319:1498","kind":"definition","num":"","title":"Singular flat spacetime","bucket":"D","lean":"partial","nl":"definition","line":1500,"deps":[],"decls":["Causal.Causality.SingularFlatSpacetime","Causal.Causality.SingularFlatAxioms","Causal.timelikeLine_singularFlatSpacetime"],"ndecls":3,"findings":[],"notes":"Abstracted as SingularFlatSpacetime: SingularFlatAxioms (the causal facts the paper derives for E≥0-manifolds, each citing its line) plus connectedness; witnessed on the timelike line; no witness with sing_0 ≠ ∅. (WP-11, audited)","twin":"","tex":"\\begin{defi}[Singular flat spacetime]\\index{Spacetime!singular flat}\nLet $A$ be a subset of $\\RR_+$.\nAn $\\mass{A}$-spacetime is a connected $\\E^{1,2}_A$-manifold endowed with the causality generated\nby its $X_A$-atlas and by the causalities of $X$ and of the\n$(X_\\alpha)_{\\alpha\\geq 0}$.\n\nWe simply say singular flat spacetime when $A=\\RR_+$.\n\\end{defi}"},{"id":"rem:singular_flat_spacetime_therefore","block":"ETT.tex:1319:1498","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":1508,"deps":["theo:geroch"],"decls":["Causal.Causality.SingularFlatAxioms.geroch_hypotheses","Causal.Causality.SingularFlatAxioms.geroch_hypotheses_of_singularFlat","Causal.Causality.SingularFlatAxioms.Jplus_ne_singleton","Causal.Causality.SingularFlatAxioms.Jminus_ne_singleton","Causal.Causality.SingularFlatAxioms.not_open_subset_singleton","Causal.timelikeLine_geroch_hypotheses"],"ndecls":6,"findings":["The reason for DEC-18. As printed (no strong causality), the remark overclaims: theo:geroch asks local causal convexity and a pair of admissible measures, and prop:mesure_admissible gives the measures only for strongly causal M; nothing in Section 3 makes a singular flat spacetime strongly causal (l.1216 reads 'locally causally convex => strongly causal'). By hand, not formalized (no E_alpha in the library): for alpha > 0, E_alpha modulo a translation along its timelike singular line is a connected singular flat spacetime with a non-empty singular locus (so the example does not depend on whether A = R_+ allows an empty one); its singular line closes into a closed timelike curve, it is totally vicious (J^-(q) = M for every q), and it carries no measure admissible in the past (property 3 fails). E^{1,2} modulo a timelike translation is the same example if an empty singular locus is allowed. None of (i)-(iii) holds there, so theo:geroch_sing without strong causality is not refuted, but its proof (l.1781-1785) needs strong causality for (ii)=>(iii) and (iii)=>(i). The example is local (not a kb/0014 artefact). Since line/massive_line ask the closed embedding only when M is causal, the structure does not exclude such a quotient. Under DEC-18 the remark and theo:geroch_sing assume M strongly causal.","J^±(p) ≠ {p} (l.1783-1785) follows abstractly: I^±(p) is non-empty and open (or J^-(p) accumulates at p at a BTZ point) and M has no isolated point; the '3-dimensional J^+(p)' is not needed."],"notes":"With strong causality assumed (DEC-18), a singular flat spacetime satisfies the hypotheses of theo:geroch. (WP-11, audited)","twin":"","tex":"\\begin{rem}\nA singular flat spacetime is therefore a differential manifold and satisfies all the\nhypotheses of Geroch's Theorem \\ref{theo:geroch}.\n\\end{rem}"},{"id":"lem:past_BTZ","block":"ETT.tex:1319:1513","kind":"lemma","num":"","title":"[brunswic2021cauchy]","bucket":"D","lean":"partial","nl":"proved","line":1515,"deps":["prop:GX_sing_dec","defi:causal_Ealpha","defi:causal_E0"],"decls":["Causal.Causality.SingularFlatAxioms.past_BTZ_b","Causal.Causality.mem_of_causalCurveOn","Causal.Causality.SingularFlatAxioms.mem_sing_zero_of_causalCurveOn","Causal.Causality.BTZAxioms","Causal.Causality.SingularFlatAxioms","Causal.Causality.SingularFlatAxioms.Jminus_subset_component","Causal.Causality.SingularFlatAxioms.mem_sing_zero_of_le","Causal.Causality.SingularFlatAxioms.Jminus_eq_image","Causal.Causality.SingularFlatAxioms.isClosed_Jminus","Causal.timelikeLine_past_BTZ_b"],"ndecls":10,"findings":[],"notes":"(b) proved by the paper's argument for every causal curve over any interval; (a) is a field. (WP-11, audited)","twin":"","tex":"\\begin{lem}[{\\cite[Lem.~1.9]{brunswic2021cauchy}}] \nLet $M$ be a singular spacetime. Then\n\\begin{enumerate}[label=(\\alph*)]\n\\item for every $\\alpha\\in \\RR_+$, each connected component of $\\sing_\\alpha(M)$ is an inextensible causal curve;\nif $\\alpha>0$, such a connected component is moreover chronal;\n\\item every causal curve $c$ of $M$ decomposes as\n$$c=\\Delta\\cup c^0$$\nwith $\\Delta=c\\cap \\sing_0(M)$ and\n$c^0=c\\setminus \\sing_0(M)$.\nMoreover $\\Delta$ and $c^0$ are connected, $\\Delta$ is closed and lies in the past of $c^0$.\n\\end{enumerate}\n\\end{lem}"},{"id":"prop:K_calcul","block":"ETT.tex:1319:1513","kind":"proposition","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1557,"deps":["prop:tarentin_fort_K","lem:past_BTZ","lem:K_facile"],"decls":["Causal.Causality.PushUp.Jminus_Iminus_eq","Causal.Causality.PushUp.Kminus_eq_Iminus","Causal.Causality.PushUp.Kplus_eq_Iplus","Causal.Causality.SingularPastAt","Causal.Causality.Kminus_eq_Jminus_diff","Causal.Causality.K_calcul","Causal.Causality.singularPastAt_of_le_iff","Causal.Causality.singularPastAt_of_ge_iff","Causal.timelikeLine_K_monotone_hypotheses","Causal.lightlikeLine_singularPastAt","Causal.lightlikeLine_K"],"ndecls":11,"findings":["ETT.tex:1565: (a) and (b) are derived from prop:tarentin_fort_K, whose hypothesis 'causally plain' is established for E_{≥0}-manifolds nowhere in the paper (l.303-305 presents push-up as 'the form that singular flat spacetimes do satisfy'). Repair, proved here: under push-up lem:passe_coherent is immediate (J^-(I^-(p)) ⊂ I^-(p) is push-up itself, at every point and in every open set, no Z^- needed), and the proof of prop:tarentin_fort_K then goes through unchanged (PushUp.Kminus_eq_Iminus). The paper may want a push-up variant of prop:tarentin_fort_K and to cite cor:pushup_sing here.","ETT.tex:1571: '⊃ J^-(p_0)' is false as written: on the half-line J^-(p) the relative interior of J^-(p_0) is J^-(p_0) \\ {p_0}. The conclusion survives because p_0 is arbitrary (x < p_0 gives x ∈ Int_{J^-(p)} J^-(p_0)).","ETT.tex:1570: applying lem:K_facile needs p ∈ Int J^+(p_n) for every n, which the proof does not check; at a BTZ point it rests on the shape of the future cone of the singular line (defi:causal_E0, whose description of I^+ at a BTZ point is flagged in the source as asserted without proof).","ETT.tex:1567-1570: the inclusion K^-(p) ⊂ J^-(p) \\ {p} uses only one sequence p_n → p with p_n < p and causality; 'J^-(p_n) is contained in the BTZ line' (lem:past_BTZ) is not needed."],"notes":"No `sorry`. The BTZ facts enter as named hypotheses (a set S for sing_0, SingularPastAt); (a)/(b) are proved from push-up instead of causal plainness (OQ-16). The timelike line with S = ]-∞,0] satisfies the hypotheses. WP-3, audited.","twin":"","tex":"\\begin{prop} Let $M$ be a $\\mass{\\geq 0}$-manifold and let $p\\in M$.\n\\begin{enumerate}[label=(\\alph*)]\n\\item $K^\\pm(p)=I^\\pm(p)$ if $p\\notin \\sing_0(M)$;\n\\item $K^+(p)=I^+(p)$ if $p\\in \\sing_0(M)$;\n\\item if $M$ is causal and $p\\in \\sing_0(M)$, then $K^-(p)=J^-(p)\\setminus \\{p\\}$.\n\\end{enumerate}\n\\end{prop}"},{"id":"cor:K_injectif","block":"ETT.tex:1319:1513","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1575,"deps":["rem:btz_pas_tarentin","prop:K_calcul","prop:FZenon_injectif","lem:past_BTZ","prop:GX_sing_dec"],"decls":["Causal.Causality.SingularFlatAxioms.K_injectif","Causal.timelikeLine_K_injectif"],"ndecls":2,"findings":[],"notes":"Proved under SingularFlatAxioms. (WP-11, audited)","twin":"","tex":"\\begin{cor} If $M$ is a strongly causal $\\mass{\\geq 0}$-manifold, then\nthe map\n$$\\fonctionn{M}{\\mathcal P(M)}{x}{K^\\pm(x)}$$\nis injective.\n\\end{cor}"},{"id":"prop:K_monotone","block":"ETT.tex:1319:1513","kind":"proposition","num":"","title":"Monotonicity of K^","bucket":"D","lean":"partial","nl":"proved","line":1608,"deps":["prop:K_calcul","cor:pushup_sing","lem:past_BTZ","defi:causal_E0"],"decls":["Causal.Causality.K_monotone","Causal.timelikeLine_K_monotone_hypotheses"],"ndecls":2,"findings":["ETT.tex:1630: case 'q ∈ sing_0, p ∉ sing_0' rests on I^+(x) = J^+(x) \\ sing_0 for x BTZ (defi:causal_E0, l.1352-1356, marked in the source '[editorial] asserted without proof -- verify'); push-up is not needed in that case once that is granted. DEC-64: that identity is false in E_0 (see defi:causal_E0); the case needs it only for x ∈ J^-(q) \\ {q}, x strictly below the BTZ point q ≤ p, where the true form p < p' ⇒ J^+(p') \\ sing_0 ⊂ I^+(p) gives x ≪ p; the proposition stands.","The future half uses K^+ = I^+ at every point, i.e. prop:K_calcul (a)(b), hence inherits the causal-plainness gap reported there; it holds under push-up."],"notes":"No `sorry`. Under the hypotheses of prop:K_calcul plus S closed under J^- and, for x < x' in S and x' ≤ y ∉ S, x ≪ y. Witness: the timelike line. WP-3, audited. DEC-64 (2026-11-02): the last hypothesis was 'x ∈ S, x ≤ y ∉ S ⇒ x ≪ y', false in E_0 (defi:causal_E0, the radial null ray), so the theorem was vacuous there; it is weakened to the form above (BTZAxioms.Iplus_of_lt), the only case the proof uses; the conclusion is unchanged.","twin":"","tex":"\\begin{prop}[Monotonicity of $K^\\pm$]\nLet $M$ be a causal $\\mass{\\geq0}$-manifold and let $q\\leq p$ in $M$. Then\n$$K^-(q)\\subset K^-(p) \\qquad\\text{and}\\qquad K^+(p)\\subset K^+(q).$$\n\\end{prop}"},{"id":"prop:K_densite_sing","block":"ETT.tex:1319:1513","kind":"proposition","num":"","title":"Density of K^","bucket":"D","lean":"partial","nl":"proved","line":1634,"deps":["cor:massA_cac","cor:pushup_sing","rem:btz_pas_tarentin","lem:past_BTZ","prop:K_calcul","defi:causal_E0","lem:densite_modele"],"decls":["Causal.Causality.SingularFlatAxioms.K_densite_sing","Causal.Causality.SingularFlatAxioms.K_densite_sing_of_stronglyCausal","Causal.Causality.SingularPastAt.mem_closure","Causal.Causality.SingularPastAt.Jminus_diff_subset_Kminus","Causal.timelikeLine_K_densite_sing"],"ndecls":5,"findings":["The proof l.1640-1690 can be replaced by three lines, given I^+(p) = J^+(p) \\ sing_0 at BTZ points in its global form (the field Iplus_eq): every point is strongly tarentin in the future, so push-up gives J^+(x) in closure I^+(x) = closure K^+(x); in the past a regular y <= x is strongly tarentin in the past (push-up again), a BTZ y <= x with x regular has y << x by I^+(y) = J^+(y) \\ sing_0, and at a BTZ x the half-line accumulates at x. Strong causality and lem:densite_modele (l.1464) are not needed. Causal arc-connectedness is unneeded only because Iplus_eq is assumed globally: the paper states it in the model (l.1352), and deriving the global form in M is the chart plus causal arc-connectedness argument of l.1663-1669.","DEC-64: the identity I^+(p) = J^+(p) \\ sing_0 used in the shortcut above is false in E_0 (defi:causal_E0); the shortcut survives with the true form (Iplus_of_lt): a BTZ y <= x with x regular is the limit of the points u_n < y of its BTZ line (lem:past_BTZ / SingularPastAt), each u_n << x, so y lies in the closure of I^-(x). Causal arc-connectedness is now used (u_n ∈ sing_0, via lem:past_BTZ (b)); strong causality and lem:densite_modele are still not needed."],"notes":"Proved under SingularFlatAxioms, without strong causality. (WP-11, audited) DEC-64: re-proved from the corrected field Iplus_of_lt, statement unchanged.","twin":"","tex":"\\begin{prop}[Density of $K^\\pm$]\nLet $M$ be a strongly causal $\\mass{\\geq0}$-manifold. Then for every $x\\in M$,\n$$J^\\pm(x)\\subset \\overline{K^\\pm(x)}.$$\n\\end{prop}"},{"id":"cor:K_ordre","block":"ETT.tex:1319:1513","kind":"corollary","num":"","title":"K^ recovers the causal order","bucket":"D","lean":"partial","nl":"proved","line":1692,"deps":["prop:GH_Jferme","prop:GH_fortement_causal","prop:K_plongement_ordre","prop:K_densite_sing","prop:K_monotone"],"decls":["Causal.Causality.SingularFlatAxioms.K_ordre","Causal.Causality.SingularFlatAxioms.K_monotone","Causal.Causality.SingularFlatAxioms.K_calcul","Causal.timelikeLine_K_ordre"],"ndecls":4,"findings":[],"notes":"Proved under SingularFlatAxioms for globally hyperbolic M. (WP-11, audited) DEC-64: K_monotone and K_densite_sing re-proved from the corrected field Iplus_of_lt; statements unchanged.","twin":"","tex":"\\begin{cor}[$K^\\pm$ recovers the causal order]\nLet $M$ be a globally hyperbolic $\\mass{\\geq0}$-manifold. Then for all $x,y\\in M$,\n$$x\\leq y \\iff K^-(x)\\subset K^-(y) \\iff K^+(y)\\subset K^+(x).$$\nIn particular $x\\mapsto K^-(x)$ is an isomorphism of ordered sets from $(M,\\leq)$ onto its image in\n$\\left(\\mathcal P(M),\\subset\\right)$, and $x\\mapsto K^+(x)$ is an anti-isomorphism onto its image.\n\\end{cor}"},{"id":"rem:mesure_unilaterale","block":"ETT.tex:1319:1707","kind":"remark","num":"","title":"The two senses are incompatible","bucket":"D","lean":"partial","nl":"informal","line":1713,"deps":["defi:causal_E0","prop:K_calcul"],"decls":["Causal.Causality.SingularFlatAxioms.mesure_unilaterale","Causal.Causality.SingularFlatAxioms.not_admissible_both_of_le","Causal.Causality.SingularFlatAxioms.Jminus_diff_eq_segment"],"ndecls":3,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: M a causal E≥0-manifold → strengthened (SingularFlatAxioms C sing with IsCausal; the fields used are line, Iminus_eq_empty, pushUp, mem_Zplus, secondCountable, causallyArcConnected, past_local, isClosed_sing (the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0))); p < q two BTZ points of one singular line → weakened (p ≤ q, p ≠ q, q BTZ (p is then BTZ and on q's line); or only sing_0 ≠ ∅ (mesure_unilaterale)). No witness with a BTZ point: ","twin":"","tex":"\\begin{rem}[The two senses are incompatible]\n\nOne cannot ask for admissibility in the past and in the future at once as soon as the spacetime\ncarries a BTZ line, and property $4$ is the obstruction. Let $M$ be a causal\n$\\mass{\\geq0}$-manifold and let $p<q$ be two BTZ points of one singular line $\\Delta$. By\nDefinition \\ref{defi:causal_E0} the set $J^-(q)\\setminus J^-(p)$ is the segment $]p,q]$ of\n$\\Delta$, so property $3$ in the past forces $\\mu(]p,q])>0$. But every $r\\in\\,]p,q]$ is a BTZ\npoint, hence $I^-(r)=\\emptyset$ and therefore $r\\notin I^+(p)=K^+(p)$ by Proposition\n\\ref{prop:K_calcul}; thus $]p,q]\\subset J^+(p)\\setminus K^+(p)$ and property $4$ in the future\nforces $\\mu(]p,q])=0$. No measure on $M$ is therefore admissible in the past and in the future at\nonce.\n\\end{rem}"},{"id":"prop:mesure_admissible","block":"ETT.tex:1319:1707","kind":"proposition","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1726,"deps":["cor:massA_cac","prop:mesure_dieckmann_topo","lem:restriction_convexe","prop:K_monotone"],"decls":["Causal.Causality.SingularFlatAxioms.mesure_admissible","Causal.Causality.ModelMeasures","Causal.timelikeLine_modelMeasures","Causal.timelikeLine_mesure_admissible"],"ndecls":4,"findings":[],"notes":"From prop:mesure_dieckmann_topo with the local measures as a named hypothesis; asks only causality. (WP-11, audited)","twin":"","tex":"\\begin{prop} Let $M$ be a strongly causal $\\mass{\\geq 0}$-manifold.\nThen $M$ carries a measure $\\mu_-$ admissible in the past and a measure $\\mu_+$ admissible in the future.\n\\end{prop}"},{"id":"lem:vecteur","block":"ETT.tex:1319:1707","kind":"lemma","num":"","title":"","bucket":"D","lean":"none","nl":"proved","line":1751,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Not attempted. Not attempted: a C¹ non-singular future causal vector field parallel to the singular lines, built by a partition of unity (O'Neill Lemma 32). Missing infrastructure: a differentiable structure on singular flat spacetimes, tangent vectors and their causal character, flows. What theo:geroch_sing uses of it is already the named hypothesis Causal.Causality.VecteurFlow (Causal.SingularGeroch, kb/0022).","twin":"","tex":"\\begin{lem} Let $M$ be a singular flat spacetime. There exists a vector field $X$\non $M$ such that:\n\\begin{itemize}\n\\item $X$ is $\\CC^1$ and non-singular;\n\\item $X$ is future causal;\n\\item for $p\\in \\sing(M)$, $X_p$ is parallel to the direction of the singular line through $p$.\n\\end{itemize}\n\\end{lem}"},{"id":"theo:geroch_sing","block":"ETT.tex:1319:1707","kind":"theorem","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1771,"deps":["theo:geroch","prop:mesure_admissible","cor:massA_cac","defi:causal_E0","lem:vecteur"],"decls":["Causal.Causality.SingularFlatAxioms.geroch_sing_of_stronglyCausal","Causal.Causality.SingularFlatAxioms.geroch_sing_i_imp_ii","Causal.Causality.SingularFlatAxioms.geroch_sing_i_imp_iii","Causal.Causality.SingularFlatAxioms.geroch_sing_split","Causal.Causality.VecteurFlow","Causal.timelikeLine_geroch_sing_i_imp_ii","Causal.timelikeLine_geroch_sing_i_imp_iii","Causal.timelikeLine_geroch_sing","Causal.timelikeLine_vecteurFlow","Causal.timelikeLine_geroch_sing_split","Causal.timelikeLine_split_zero"],"ndecls":11,"findings":["See rem:singular_flat_spacetime_therefore: the proof's 'direct consequence of theo:geroch and prop:mesure_admissible' needs strong causality, which, without DEC-18, is available only in direction (i)=>(ii)/(iii). The E_alpha-modulo-a-translation example is the reason for DEC-18. The former paper-form geroch_sing and its tagged sorry stronglyCausal_of_ii_or_iii are removed; no form without strong causality is stated."],"notes":"Strongly causal (DEC-18). The equivalence rests only on theo:geroch's cited step; the Σ × ℝ splitting is proved from the flow of lem:vecteur as a named hypothesis (its openness is asserted, not argued, by the paper). (WP-11, audited)","twin":"","tex":"\\begin{theo}\\index{Theorem!Geroch}\nLet $M$ be a singular flat spacetime. The following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $M$ is globally hyperbolic;\n\\item $M$ admits a Cauchy time function;\n\\item $M$ admits a Cauchy hypersurface.\n\\end{enumerate}\nMoreover, if $\\Sigma$ is a Cauchy surface of $M$, then $M$ is homeomorphic to $\\Sigma\\times \\RR$.\n\\end{theo}"},{"id":"lem:J_int","block":"ETT.tex:1319:1798","kind":"lemma","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1800,"deps":["lem:IJ_calc"],"decls":["Causal.Causality.interior_Jplus_inter_Zminus","Causal.Causality.interior_Jminus_inter_Zplus","Causal.Causality.J_int"],"ndecls":3,"findings":["ETT.tex:1805-1809: the reduction to a causally convex chart (hence strong causality) is not needed: the proof of lem:IJ_calc (l.1449-1461) works verbatim in any T1, absolutely minimal topological spacetime with push-up. lem:J_int therefore holds for every E_{≥0}-manifold, strongly causal or not. Note that the step 'I^-(q) ≠ ∅, therefore q ∈ Z^-' of lem:IJ_calc is rem:absolutely_minimal_topological_spacetime."],"notes":"No `sorry`. Proved in any T1, absolutely minimal spacetime with push-up — the three properties the paper proves of singular flat spacetimes (cor:pushup_sing, cor:massA_causalite, prop:GX_sing_dec). Strong causality is not used. WP-3, audited.","twin":"","tex":"\\begin{lem}\nLet $M$ be a strongly causal singular flat spacetime.\nFor every $p\\in M$,\n$$\\ring J^\\pm(p)\\cap Z^\\mp(M)=I^\\pm(p).$$\n\\end{lem}"},{"id":"lem:cup_cap_sing","block":"ETT.tex:1319:1798","kind":"lemma","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1812,"deps":["lem:cup_cap","lem:J_int"],"decls":["Causal.Causality.Iminus_eq_interior_iUnion_iInter","Causal.Causality.Iplus_eq_interior_iUnion_iInter","Causal.Causality.cup_cap_sing"],"ndecls":3,"findings":["The proof's appeal to strong causality (l.1820) is unnecessary; the statement for '-' needs only J^+(x) closed for every x (and for '+' only J^-(x) closed), plus the three class properties."],"notes":"No `sorry`. As lem:J_int, plus tarentin, T2 and J^±(x) closed; strong causality is not used. WP-3, audited.","twin":"","tex":"\\begin{lem}\nLet $M$ be a globally hyperbolic singular flat spacetime, let\n$p\\in M$ and let $(p_n)_{n\\in \\N}$ be a sequence of $M$ converging to $p$.\nThen\n$$I^{\\pm}(p)=\\mathrm{Int}\\left(\\bigcup_{N\\in \\N}\\bigcap_{n\\geq N} I^\\pm(p_n)\\right).$$\n\\end{lem}"},{"id":"lem:cup_cap_BTZ","block":"ETT.tex:1319:1798","kind":"lemma","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1825,"deps":["lem:J_int"],"decls":["Causal.Causality.cupCapBTZAsPrinted_of_globallyHyperbolic","Causal.Causality.SingularFlatAxioms.cup_cap_BTZ","Causal.Causality.cup_cap_BTZ_of_isClosed","Causal.Causality.SingularPastAt.Jminus_diff_subset_iUnion_iInter","Causal.Causality.iUnion_iInter_subset_Jminus_diff","Causal.Causality.CupCapBTZAsPrinted","Causal.lightlikeLine_cup_cap_BTZ","Causal.timelikeLine_cupCapBTZAsPrinted"],"ndecls":8,"findings":["The reason for DEC-19. By hand, not formalized (no E_0 in the library): in E_0 minus a point w of the BTZ line below p, with z on that line below w, z << p_n for regular p_n -> p with p ∉ J^-(p_n) (a chronal curve from a BTZ point leaves the line at once and avoids w), while J^-(p) = ]w,p]; so lem:cup_cap_BTZ as printed (strongly causal) fails for this strongly causal singular flat spacetime, granted that E_0 is strongly causal and p ∈ Int J^+(z) (the fact the proof of prop:K_calcul (c) uses). Its only use (l.2122) is in a globally hyperbolic setting, where it holds. The proof 'as for lem:J_int' (l.1831) does not reduce to a chart: z may lie outside it. Under DEC-19 the lemma is stated for globally hyperbolic M and its certificate is cupCapBTZAsPrinted_of_globallyHyperbolic; the printed strongly causal form stays the Prop Causal.Causality.CupCapBTZAsPrinted, not asserted, with this finding. SingularFlatAxioms.cup_cap_BTZ has no witness at a BTZ point (the full structure has none); the certificate is instantiated on the timelike line only vacuously (sing 0 = ∅)."],"notes":"Proved for globally hyperbolic M (DEC-19); the printed strongly causal form is kept as a Prop with its finding. (WP-11, audited)","twin":"","tex":"\\begin{lem}\nLet $M$ be a strongly causal singular flat spacetime, let\n$p\\in M$ and let $(p_n)_{n\\in \\N}$ be a sequence of $M$ converging to $p$.\nIf $p \\notin J^-(p_n)$ for every $n\\in \\N$ and if $p\\in \\sing_0(M)$, then\n$$\\bigcup_{N\\in \\N}\\bigcap_{n\\geq N} J^-(p_n)=J^-(p)\\setminus \\{p\\}.$$\n\\end{lem}"},{"id":"def:cauchy_embedding_cauchy_extension","block":"ETT.tex:1835","kind":"definition","num":"","title":"Cauchy embedding, Cauchy extension","bucket":"B","lean":"partial","nl":"definition","line":1858,"deps":[],"decls":["Causal.IsCauchyEmbedding","Causal.IsCauchyInclusion","Causal.IsEMorphismOn","Causal.IsEMorphism","Causal.isEMorphism_iff","Causal.IsEMorphism.id","Causal.not_isEMorphism_const","Causal.IsCauchyEmbedding.rangeOpens","Causal.IsCauchyEmbedding.coe_rangeOpens","Causal.timelikeLine_isCauchyEmbedding_id","Causal.not_isCauchyEmbedding_const","Causal.timelikeLine_isCauchyInclusion_top"],"ndecls":14,"findings":[],"notes":"Defined for globally hyperbolic topological spacetimes with IsEMorphism (DEC-17). (WP-12, audited)","twin":"","tex":"\\begin{defi}[Cauchy embedding, Cauchy extension]\\index{Cauchy!embedding}\\index{Cauchy!extension}\nLet $M$ and $N$ be globally hyperbolic singular flat spacetimes. A \\emph{Cauchy embedding} of $M$\ninto $N$ is an injective $\\mass{\\geq0}$-morphism $\\phi:M\\rightarrow N$ carrying some Cauchy surface\nof $M$ onto a Cauchy surface of $N$. We then say that $N$, together with $\\phi$, is a \\emph{Cauchy\nextension} of $M$.\n\\end{defi}"},{"id":"lem:Cauchy_plongement_toutes","block":"ETT.tex:1835","kind":"lemma","num":"","title":"","bucket":"B","lean":"partial","nl":"proved","line":1865,"deps":[],"decls":["Causal.IsEMorphism.cauchy_plongement_toutes","Causal.IsEMorphism.isCauchySurface_image","Causal.IsCauchyEmbedding.isCauchySurface_image","Causal.IsEMorphism.isCauchySurface_iff","Causal.Causality.IsCauchySurfaceOn.isCauchySurface_of_open","Causal.Causality.inextensible_ordConnectedComponent","Causal.Causality.not_futureExtensible_of_component","Causal.Causality.futureExtensible_of_final","Causal.IsEMorphismOn.isCauchySurfaceOn_image_iff","Causal.IsEMorphismOn.inextensible_iff_invComp","Causal.IsEMorphismOn.inextensible_iff_comp","Causal.timelikeLine_cauchy_plongement_toutes"],"ndecls":12,"findings":[],"notes":"(i)⇒(ii) with N causal and Hausdorff only; (ii)⇒(i) given a Cauchy surface of M (theo:geroch_sing). (WP-12, audited)","twin":"","tex":"\\begin{lem}\nLet $M$ and $N$ be globally hyperbolic singular flat spacetimes and let $\\phi:M\\rightarrow N$ be an\ninjective $\\mass{\\geq0}$-morphism. The following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item there exists a Cauchy surface $\\Sigma$ of $M$ whose image $\\phi(\\Sigma)$ is a Cauchy surface of $N$;\n\\item for every Cauchy surface $\\Sigma$ of $M$, the image $\\phi(\\Sigma)$ is a Cauchy surface of $N$.\n\\end{enumerate}\n\\end{lem}"},{"id":"theo:CBG","block":"ETT.tex:1835","kind":"theorem","num":"","title":"Choquet-Bruhat--Geroch","bucket":"D","lean":"partial","nl":"proved","line":1884,"deps":["prop:ppcm_Cauchy"],"decls":["Causal.CBG.theo_CBG","Causal.CBG.theo_CBG_of_modelMeasures","Causal.CBG.Dev.IsCEMaximal","Causal.CBG.Dev.isCEMaximal_iff","Causal.CBG.Dev.IsMorphism.injective","Causal.CBG.cbg","Causal.CBG.cbg_ett","Causal.CBG.cbg_isETTMaximal","Causal.CBG.isETTMaximal_iff_isUniversal","Causal.CBG.Dev.IsUniversal.existsUnique_iso","Causal.CBG.Dev.IsUniversal.unique","Causal.CBG.Dev.IsUniversal.isETTMaximal"],"ndecls":23,"findings":["ETT.tex:2336-2340 (proof of theo:CBG): 'the family of Cauchy extensions is directed, hence admits an inductive limit in the category of Hausdorff spaces endowed with a 𝕄≥0-structure; the limit is maximal' is not argued: a directed colimit of Hausdorff spaces need not be Hausdorff, the family is a proper class (rem:CBG_manquant (ii)), and the compatibility (cocycle) of the pairwise common over-extensions is not shown. The library replaces it by Sbierski's gluing of all small developments along their pairwise MCGHDs (maxGlueData, mcghd_cocycle, maxSpace_t2 from pairs, maxStr_globallyHyperbolic) — consistent with CBG-DESIGN §1 'ETT gaps filled'.","ETT.tex:1885: 'M₀ globally hyperbolic' gives a Cauchy surface only through theo:geroch_sing (i)⇒(iii), which rests on the model measures (DEC-18, the theo:geroch_sing row): the theorem's proof fixes a Cauchy surface Σ₀ (l.2008) without saying where it comes from."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{theo}[Choquet-Bruhat--Geroch]\\index{Theorem!Choquet-Bruhat--Geroch}\nLet $M_0$ be a globally hyperbolic singular flat spacetime. Then $M_0$ admits a maximal Cauchy\nextension, and that extension is unique up to isomorphism.\n\\end{theo}"},{"id":"rem:CBG_analytique","block":"ETT.tex:1835","kind":"remark","num":"","title":"Where the Einstein equations were","bucket":"D","lean":"partial","nl":"informal","line":1903,"deps":[],"decls":["Causal.CBG.Geometry.rigid_univ","Causal.CBG.IsRigidFor","Causal.CBG.flat_rigid","Causal.CBG.not_isRigidFor_branchingLine","Causal.timelikeLine_not_isRigid","Causal.CBG.not_exists_isUniversal_halfLineDev","Causal.CBG.causal_pgcd_not_unique","Causal.CBG.IsCGHD.eqOn","Causal.CBG.Dev.IsMorphism.eq_id","Causal.CBG.ppcmDev_desc","Causal.CBG.t2Space_gluing_mcghd"],"ndecls":11,"findings":["ETT.tex:1904-1907 says the Hausdorffness of the glued object follows from rigidity alone ('there is no unreasonable morphism'). The formal proof needs, besides rigidity (A1), the germ extension at corresponding boundary points (A3, Sbierski Lemma 3.8, used by cor:ext_continue) and the slice (A4, Sbierski Thm 3.6, used by prop:Cauchy_non_max); ETT gets them from the chart argument of prop:Cauchy_non_max, which at BTZ points is open (gx's GermExtFutureBTZ/GermExtPastBTZ/SliceFutureBTZ, CBG-DESIGN §6). Rigidity of the abstract 𝕄≥0-morphisms (IsEMorphism) is false (timelikeLine_not_isRigid), and rigidity fails into a non-Hausdorff target (not_isRigidFor_branchingLine): the remark's sentence holds for the structure morphisms with Hausdorff target only."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{rem}[Where the Einstein equations were]\nIn \\cite{MR0250640} the Hausdorffness of the glued object follows from the local uniqueness of the\nsolutions of the Einstein equations. Here it follows from the fact that there is no unreasonable\nmorphism between open subsets of the model spaces: the structure\n$\\left(\\isom(\\mass{}),\\mass{},\\mass{\\geq0}\\right)$ is analytic \\cite[Prop.~2.3.14]{thesis}, so two\n$\\mass{\\geq0}$-morphisms defined on a connected manifold and agreeing on a non-empty open set agree\neverywhere \\cite[Prop.~1.2.11]{thesis}. We use both facts as quoted.\n\\end{rem}"},{"id":"def:common_sub_extension","block":"ETT.tex:1835","kind":"definition","num":"","title":"Common sub-extension","bucket":"B","lean":"partial","nl":"definition","line":1914,"deps":[],"decls":["Causal.CommonSubExtension","Causal.CommonSubExtension.IsMorphism","Causal.CommonSubExtension.Equivalent","Causal.CommonSubExtension.IsMaximal","Causal.CommonSubExtension.isMorphism_id","Causal.CommonSubExtension.equivalent_refl","Causal.CommonSubExtension.base","Causal.CommonSubExtension.base_isMaximal","Causal.CommonSubExtension.timelikeLine_base_isMaximal"],"ndecls":9,"findings":[],"notes":"Defined, with morphisms, equivalence and maximality; carriers not asked connected or T2. (WP-12, audited)","twin":"","tex":"\\begin{defi}[Common sub-extension]\nLet $M_0$ be a globally hyperbolic singular flat spacetime and let $M_0\\xrightarrow{i_1} M_1$ and\n$M_0\\xrightarrow{i_2} M_2$ be two Cauchy extensions of $M_0$. A \\emph{common sub-extension} of $M_1$\nand $M_2$ is a singular flat spacetime $M$ equipped with Cauchy embeddings $M_0\\rightarrow M$,\n$M\\rightarrow M_1$ and $M\\rightarrow M_2$ making the diagram\n$$\n\t\\xymatrix{\n\t\t& &M_1\\\\\n\t\tM_0\\ar[urr]^{i_1} \\ar[drr]_{i_2}\\ar[r]&M\\ar[ur]\\ar[dr]& \\\\\n\t\t&& M_2\n\t}\n$$\ncommute. A morphism of common sub-extensions $M\\rightarrow M'$ is a $\\mass{\\geq0}$-morphism\ncommuting with the embeddings into $M_1$ and $M_2$; if it is bijective, $M$ and $M'$ are\n\\emph{equivalent}. A common sub-extension $M$ is \\emph{maximal} if every morphism of common\nsub-extensions $M\\rightarrow M'$ is bijective.\n\\end{defi}"},{"id":"lem:C_ext_connexe","block":"ETT.tex:1835","kind":"lemma","num":"","title":"","bucket":"C","lean":"none","nl":"proved","line":1932,"deps":["theo:geroch_sing"],"decls":["Causal.IsCauchyEmbedding.c_ext_connexe","Causal.IsCauchyEmbedding.c_ext_connexe_of_isCauchySurfaceOn","Causal.IsCauchyEmbedding.isCauchySurfaceOn_inf","Causal.IsCauchyEmbedding.exists_mem_image_inf","Causal.IsCauchyEmbedding.eq_of_mem_image_inter","Causal.isConnected_of_curves","Causal.isConnected_of_homeomorph","Causal.timelikeLine_c_ext_connexe_hypotheses","Causal.timelikeLine_rangeOpens_id"],"ndecls":9,"findings":["ETT.tex:1940-1941: 'The map M → A∩B is a Cauchy embedding, so φ(Σ) is a Cauchy surface of A∩B' is asserted without argument. That φ(Σ) meets each causal curve of A∩B at most once is proved (eq_of_mem_image_inter); that it meets every inextensible curve of A∩B is the open step. In the Lorentzian case it holds by an end-point argument (the future end points of the two extensions coincide and would lie in (A∖B) ∩ (B∖A)).","ETT.tex:1941-1942: 'every point of A∩B lies on an inextensible causal curve' — the existence of inextensible causal curves through every point is proved nowhere (GerochEquiv's SCOPE notes the same gap); carried as a model fact."],"notes":"The rest of the proof is sorry-free given that step as a hypothesis (c_ext_connexe_of_isCauchySurfaceOn); the statement rests on a tagged sorry. (WP-12, audited)","twin":"","tex":"\\begin{lem}\nLet $M$ be a connected globally hyperbolic singular flat spacetime and let $\\phi:M\\rightarrow N$ be a\nCauchy extension. If $A$ and $B$ are open subsets of $N$ containing $\\phi(M)$ and such that the\ninclusions $\\phi(M)\\rightarrow A$ and $\\phi(M)\\rightarrow B$ are Cauchy embeddings, then $A\\cap B$ is\nconnected.\n\\end{lem}"},{"id":"prop:Cauchy_pgcd","block":"ETT.tex:1835","kind":"proposition","num":"","title":"Greatest common sub-extension","bucket":"C","lean":"none","nl":"proved","line":1945,"deps":["lem:C_ext_connexe","rem:CBG_analytique"],"decls":["Causal.cauchy_pgcd","Causal.IsPgcdCandidate","Causal.IsPgcdCandidate.eqOn","Causal.pgcdOpens","Causal.pgcdMap","Causal.pgcdMap_eqOn","Causal.subset_pgcdOpens","Causal.timelikeLine_isPgcdCandidate","Causal.IsRigid","Causal.isRigid_of_subsingleton","Causal.timelikeLine_not_isRigid","Causal.OrderIso.isEMorphism_timelikeLine"],"ndecls":21,"findings":["ETT.tex:1953-1960 (confirms WP-4): ℰ's condition (b) does not ask φ_M injective, so the step '(∧, φ) ∈ ℰ, hence ∧ is a common sub-extension' does not show ∧ → M₂ injective. A gap in the argument, not a refutation: no counterexample is known, and injectivity is plausibly recoverable.","ETT.tex:1960-1961: 'Thus (∧, φ) ∈ ℰ' needs that the inclusion of i₁(M₀) into the union ∧ is a Cauchy embedding (global hyperbolicity of ∧ and the Cauchy property of i₁(Σ₀) in ∧), which does not follow from the same facts for each M; it is not argued."],"notes":"ℰ and the gluing step proved under rigidity and connected overlaps; the proposition is a tagged sorry. (WP-12, audited)","twin":"","tex":"\\begin{prop}[Greatest common sub-extension]\nLet $M_0$ be a globally hyperbolic singular flat spacetime and let $M_0\\xrightarrow{i_1} M_1$ and\n$M_0\\xrightarrow{i_2} M_2$ be two Cauchy extensions of $M_0$. There exists a common sub-extension\n$\\pgcd$ of $M_1$ and $M_2$ which is maximal, and it is unique up to equivalence.\n\\end{prop}"},{"id":"def:common_over_extension","block":"ETT.tex:1835","kind":"definition","num":"","title":"Common over-extension","bucket":"B","lean":"partial","nl":"definition","line":1970,"deps":[],"decls":["Causal.CommonOverExtension","Causal.CommonOverExtension.IsMorphism","Causal.CommonOverExtension.Equivalent","Causal.CommonOverExtension.IsMinimal","Causal.CommonOverExtension.isMorphism_id","Causal.CommonOverExtension.self","Causal.CommonOverExtension.self_isMinimal","Causal.CommonSubExtension.gluing_comm","Causal.CommonSubExtension.exists_unique_desc"],"ndecls":9,"findings":[],"notes":"Defined; the gluing of defi:ppcm closes the square and, under rigidity, maps uniquely to every common over-extension. (WP-12, audited)","twin":"","tex":"\\begin{defi}[Common over-extension]\nLet $M_0$ be a globally hyperbolic singular flat spacetime and let $M_0\\xrightarrow{i_1} M_1$ and\n$M_0\\xrightarrow{i_2} M_2$ be two Cauchy extensions of $M_0$. A \\emph{common over-extension} of\n$M_1$ and $M_2$ is a singular flat spacetime $M$ equipped with Cauchy embeddings $M_1\\rightarrow M$\nand $M_2\\rightarrow M$ making the diagram\n$$\n\t\\xymatrix{\n\t\t& M_1\\ar[dr]&\\\\\n\t\tM_0\\ar[ur]^{i_1} \\ar[dr]_{i_2}&&M \\\\\n\t\t& M_2\\ar[ur]&\n\t}\n$$\ncommute. Morphisms and equivalence of common over-extensions are defined as in Section\n\\ref{subsec:CBG_pgcd}, and a common over-extension $M$ is \\emph{minimal} if for every common\nover-extension $M'$ there is a morphism $M\\rightarrow M'$.\n\\end{defi}"},{"id":"defi:ppcm","block":"ETT.tex:1835","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":1987,"deps":[],"decls":["Causal.GlueRel","Causal.Gluing","Causal.Gluing.mk","Causal.Gluing.ι₁","Causal.Gluing.ι₂","Causal.Gluing.mk_eq_mk_iff","Causal.Gluing.ι₁_eq_ι₂_iff","Causal.Gluing.ι₁_j₁","Causal.Gluing.isOpenEmbedding_ι₁","Causal.Gluing.isOpenEmbedding_ι₂","Causal.Gluing.isOpenMap_mk","Causal.Gluing.desc"],"ndecls":13,"findings":["ETT.tex:1990 the relation ∼ is not reflexive (p ∼ p only for p in the image of M1∧M2), so it is not an equivalence relation; the quotient is meant by the equivalence relation it generates, which is 'p = q or p ∼ q' when both maps are injective (Gluing.mk_eq_mk_iff). Suggest: 'the equivalence relation generated by …', or add 'p = q or'.","ETT.tex:1953-1960 (prop:Cauchy_pgcd, not this package): condition (b) of ℰ asks φ_M only to be a 𝕄≥0-morphism, not injective nor a Cauchy embedding, so (M1∧M2, φ) ∈ ℰ does not by itself make M1∧M2 a common sub-extension. defi:ppcm needs φ injective: if φ is not, M1 → M1∨M2 is not injective (Gluing.injective_j₂_of_injective_ι₁: ι₁ injective and j₁ injective force j₂ injective)."],"notes":"No `sorry`. The quotient of X ⊔ Y by the paper's relation, for any maps j₁, j₂ (Cauchy embeddings weakened to open embeddings in the API). WP-4, audited.","twin":"","tex":"\\begin{defi}\nWith the notation above, let\n$$\\ppcm := \\left(M_1\\coprod M_2\\right)/\\!\\sim,$$\nwhere $p\\sim q$ if there is $x\\in \\pgcd$ whose images in $M_1$ and $M_2$ are $p$ and $q$, in either\norder.\n\\end{defi}"},{"id":"prop:ppcm_Cauchy","block":"ETT.tex:1835","kind":"proposition","num":"","title":"Least common over-extension","bucket":"D","lean":"partial","nl":"proved","line":1994,"deps":["prop:Cauchy_point_min","prop:Cauchy_non_max","prop:Cauchy_pgcd","rem:non_separe_cas","rem:CBG_analytique"],"decls":["Causal.CBG.ett_ppcm_Cauchy","Causal.CBG.CommonOverDev","Causal.CBG.CommonOverDev.IsMorphism","Causal.CBG.CommonOverDev.Equivalent","Causal.CBG.CommonOverDev.IsMinimal","Causal.CBG.CommonOverDev.IsMorphism.toDev","Causal.CBG.CommonOverDev.IsMorphism.comp","Causal.CBG.CommonOverDev.IsMinimal.equivalent","Causal.CBG.ppcmOver","Causal.CBG.exists_ppcm","Causal.CBG.ppcmDev","Causal.CBG.PpcmSpace"],"ndecls":21,"findings":["ETT.tex:2324 'and it is a singular flat spacetime': global hyperbolicity of ppcm with ι(Σ₀) Cauchy is not argued in ETT; proved in the library (ppcm_globallyHyperbolic, ppcm_isCauchySurface; same finding as Causal/CBG/Ppcm.lean checklist)."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{prop}[Least common over-extension]\nLet $M_0$ be a globally hyperbolic singular flat spacetime and let $M_0\\xrightarrow{i_1} M_1$ and\n$M_0\\xrightarrow{i_2} M_2$ be two Cauchy extensions of $M_0$. Then $\\ppcm$ is, up to equivalence,\nthe unique minimal common over-extension of $M_1$ and $M_2$.\n\\end{prop}"},{"id":"rem:non_separe_cas","block":"ETT.tex:1835","kind":"remark","num":"","title":"","bucket":"B","lean":"partial","nl":"informal","line":2016,"deps":[],"decls":["Causal.Gluing.nonSeparated_cases","Causal.Gluing.BoundaryPair","Causal.Gluing.t2Space_iff_frontier","Causal.Gluing.t2Space_iff_Cdist_eq_empty","Causal.Gluing.C","Causal.Gluing.Cdist","Causal.Gluing.graph","Causal.Gluing.C_eq_closure","Causal.Gluing.Cdist_eq","Causal.Gluing.Cdist_subset_frontier","Causal.Gluing.graph_subset_C","Causal.Gluing.C_nonempty"],"ndecls":18,"findings":["ETT.tex:2011 C is defined as the pairs (p,q) ∈ M1×M2 with π(p), π(q) not separated. Two equal points are never separated, so C contains every (j₁(x), j₂(x)) (Gluing.graph_subset_C) and C ≠ ∅ as soon as N ≠ ∅, even when the quotient is Hausdorff (Gluing.t2Space_and_C_nonempty). The last sentence of rem:non_separe_cas ('it is the case C ≠ ∅') is therefore false as written, and so is prop:Cauchy_point_min's hypothesis 'C ≠ ∅' in its literal reading. Every use of C (lem:corresponding_K, cor:model_corresponding, prop:C_connexe 'C is closed', prop:Cauchy_point_min, proof of prop:ppcm_Cauchy at l.2320-2324) needs the pairs with DISTINCT non-separated images. Suggest: add 'distinct' (or π(p) ≠ π(q)) to the definition of C. With that reading (Gluing.Cdist) the remark is proved: Cdist = closure(graph) ∖ graph ⊆ ∂j₁(N) × ∂j₂(N), and the quotient is Hausdorff iff Cdist = ∅.","The literal C is exactly the closure in M1×M2 of the graph {(j₁(x), j₂(x))} (Gluing.C_eq_closure, no separation axiom): this is the neighbourhood form of the sentence 'a sequence (a_n) with j₁(a_n) → p and j₂(a_n) → q exists because π(p) and π(q) are not separated' in the proof of lem:corresponding_K (l.2111). A cleaner statement of the whole remark: the gluing is Hausdorff iff M1, M2 are and the graph of f = j₂∘j₁⁻¹ is closed in M1×M2 (Gluing.t2Space_iff).","The remark is a necessary condition only: a pair in ∂j₁(N)×∂j₂(N) need not be non-separated; 'only the last case obstructs' is proved as: for Hausdorff M1, M2 the quotient is Hausdorff iff every pair of ∂j₁(N)×∂j₂(N) has separated images (Gluing.t2Space_iff_frontier). The line with two origins (two copies of ℝ glued along ℝ∖{0}) is the example: (0,0) ∈ Cdist and the gluing is not Hausdorff."],"notes":"No `sorry`. The trichotomy and 'only the last case obstructs' are proved; the last sentence is false for the literal C (which contains the graph) and proved for the pairs with distinct images (Gluing.Cdist). WP-4, audited.","twin":"","tex":"\\begin{rem}\nIf $p,q\\in M_1\\coprod M_2$ have non-separated images, then exactly one of the following holds:\n$p=q$; or $p=j_1(x)$ and $q=j_2(x)$ for some $x\\in N$, or the same with the roles of $j_1$ and $j_2$\nexchanged; or $p\\in \\partial_{M_1}j_1(N)$ and $q\\in \\partial_{M_2}j_2(N)$, or the same with the\nroles of $M_1$ and $M_2$ exchanged. Only the last case obstructs the Hausdorff property, and it is\nthe case $C\\neq \\emptyset$.\n\\end{rem}"},{"id":"lem:image_diamant","block":"ETT.tex:1835","kind":"lemma","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2024,"deps":[],"decls":["Causal.IsCauchyEmbedding.image_diamant","Causal.IsCauchyEmbedding.diamond_subset_range","Causal.timelikeLine_cauchy_diamond_hypotheses","Causal.timelikeLine_Jplus_zero_inter"],"ndecls":4,"findings":["ETT.tex:2031-2032: 'Since M is globally hyperbolic K is compact' — def:globally_hyperbolic gives compact diamonds J(p,q) between two points, not the compactness of J_M(Σ,p) = J⁺(Σ) ∩ J⁻(p); this needs an argument (carried as a hypothesis).","ETT.tex:2035-2037: 'it stays above Σ because c(1)=q lies above i(Σ) and Σ is a Cauchy surface' — the relation σ' ≤ q holds in N, not in M. The step uses M = J⁺(Σ) ∪ J⁻(Σ) (lem:Sigma_separe, stated later) and the acausality of i(Σ) in N (from lem:Cauchy_plongement_toutes and the extension of curves): a point of the pulled-back curve in J⁻_M(Σ) is then forced onto Σ."],"notes":"Proved under the named hypotheses the proof uses. (WP-12, audited)","twin":"","tex":"\\begin{lem}\nLet $M$ be a globally hyperbolic singular flat spacetime with Cauchy surface $\\Sigma$, let\n$i:M\\rightarrow N$ be a Cauchy extension and let $p\\in J^+_M(\\Sigma)$. Then\n$$i\\left(J_M(\\Sigma,p)\\right)=J_N\\left(i(\\Sigma),i(p)\\right).$$\n\\end{lem}"},{"id":"lem:passe_pgcd","block":"ETT.tex:1835","kind":"lemma","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2042,"deps":["defi:futur_continue","lem:image_diamant","prop:K_calcul"],"decls":["Causal.IsCauchyEmbedding.passe_pgcd","Causal.IsCauchyEmbedding.passe_pgcd_explicit"],"ndecls":2,"findings":["ETT.tex:2054-2055: lem:image_diamant is applied to p_n ∈ i(M), but it requires i⁻¹(p_n) ∈ J⁺_M(Σ); points below i(Σ) need a separate (easy) argument, the diamond J_N(i(Σ), p_n) being {p_n} by acausality of i(Σ) (diamond_subset_range)."],"notes":"Proved, with p only in the closure of i(M). (WP-12, audited)","twin":"","tex":"\\begin{lem}\nLet $M$ be a globally hyperbolic singular flat spacetime with Cauchy surface $\\Sigma$, let\n$i:M\\rightarrow N$ be a Cauchy extension and let $p\\in \\partial i(M)\\cap J^+\\left(i(\\Sigma)\\right)$.\nThen\n$$K^-_N(p)\\cap J^+\\left(i(\\Sigma)\\right)\\subset i(M);$$\nexplicitly, $I^-_N(p)\\cap J^+\\left(i(\\Sigma)\\right)\\subset i(M)$ if $p\\notin \\sing_0(N)$, and\n$J_N\\left(i(\\Sigma),p\\right)\\setminus \\{p\\}\\subset i(M)$ if $p\\in \\sing_0(N)$.\n\\end{lem}"},{"id":"lem:Sigma_separe","block":"ETT.tex:1835","kind":"lemma","num":"","title":"A Cauchy surface separates","bucket":"D","lean":"partial","nl":"proved","line":2062,"deps":["theo:geroch_sing"],"decls":["Causal.Causality.sigma_separe","Causal.Causality.IsCauchySplitting","Causal.Causality.IsCauchySplitting.Jplus_eq","Causal.Causality.IsCauchySplitting.Jminus_eq","Causal.Causality.IsCauchySplitting.cover","Causal.Causality.IsAcausal","Causal.Causality.IsCauchySurface.isAcausal","Causal.Causality.CurvesExtend","Causal.timelikeLineSplitting","Causal.timelikeLine_isCauchySplitting","Causal.timelikeLine_isAcausal_zero"],"ndecls":11,"findings":["Minor, aimed at the EDITORIAL proof ('[editorial] supplied 2026-08-22 -- verify', l.2068), not the author's: an omitted standard step. ETT.tex:2071-2074 concatenates a causal curve from σ to ψ(x,t) with the flow segment and invokes the Cauchy property, but a Cauchy surface constrains inextensible causal curves only (DEC-14), so the finite concatenated curve must first be extended to an inextensible one (existence of inextensible extensions, standard in the Lorentzian setting); the curve from σ to ψ(x,t) also uses causal arc-connectedness. What is used is the acausality of Σ.","lem:Sigma_separe (l.2062) is stated after lem:image_diamant (l.2024), whose proof uses its consequence M = J⁺(Σ) ∪ J⁻(Σ)."],"notes":"All five claims, with ψ and Σ acausal as hypotheses. (WP-12, audited)","twin":"","tex":"\\begin{lem}[A Cauchy surface separates]\nLet $M$ be a globally hyperbolic singular flat spacetime, let $\\Sigma$ be a Cauchy surface of $M$ and\nlet $\\psi:\\Sigma\\times \\RR\\rightarrow M$ be the homeomorphism of Theorem \\ref{theo:geroch_sing}.\nThen\n$$J^+(\\Sigma)=\\psi\\left(\\Sigma\\times \\RR_+\\right)\\qquad\\text{and}\\qquad J^-(\\Sigma)=\\psi\\left(\\Sigma\\times \\RR_-\\right).$$\nIn particular $J^\\pm(\\Sigma)$ are closed, $J^+(\\Sigma)\\cap J^-(\\Sigma)=\\Sigma$, and $J^+(\\Sigma)$ is\na neighbourhood of each of its points outside $\\Sigma$.\n\\end{lem}"},{"id":"cor:K_ordre_Sigma","block":"ETT.tex:1835","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2082,"deps":["lem:Sigma_separe","prop:K_densite_sing","prop:GH_Jferme"],"decls":["Causal.Causality.le_of_Kminus_inter_subset","Causal.Causality.K_ordre_Sigma","Causal.timelikeLine_K_ordre_Sigma_hypotheses"],"ndecls":3,"findings":["The proof uses of prop:K_densite_sing only x ∈ closure K^-(x), and of lem:Sigma_separe only that J^+(Σ) is a neighbourhood of x; the hypothesis on y is needed only for injectivity."],"notes":"No `sorry`. The two model facts are named hypotheses (J^- ⊂ cl K^-, J^+(Σ) a neighbourhood of J^+(Σ) ∖ Σ). Witness: the timelike line with Σ = {0}. WP-3, audited.","twin":"","tex":"\\begin{cor}\nLet $M$ be a globally hyperbolic singular flat spacetime, let $\\Sigma$ be a Cauchy surface of $M$\nand let $x,y\\in J^+(\\Sigma)\\setminus \\Sigma$. If\n$$K^-(x)\\cap J^+(\\Sigma)\\subset K^-(y)\\cap J^+(\\Sigma),$$\nthen $x\\leq y$. In particular $x\\mapsto K^-(x)\\cap J^+(\\Sigma)$ is injective on $J^+(\\Sigma)\\setminus \\Sigma$.\n\\end{cor}"},{"id":"lem:corresponding_K","block":"ETT.tex:1835","kind":"lemma","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2100,"deps":["lem:cup_cap_sing","lem:image_diamant","rem:btz_pas_tarentin","prop:K_calcul","lem:cup_cap_BTZ","rem:suite_croissante","lem:passe_pgcd","cor:K_ordre_Sigma"],"decls":["Causal.CBG.ett_corresponding_K","Causal.CBG.ett_corresponding_K_past","Causal.CBG.CommonSubDev.instNonempty","Causal.CBG.CommonSubDev.U","Causal.CBG.CommonSubDev.coe_U","Causal.CBG.CommonSubDev.f","Causal.CBG.CommonSubDev.f_b","Causal.CBG.CommonSubDev.image_f_U","Causal.CBG.CommonSubDev.image_f_cauchy","Causal.CBG.CommonSubDev.isOpenEmbedding_b","Causal.CBG.CommonSubDev.isOpenEmbedding_c","Causal.CBG.CommonSubDev.isMor_f"],"ndecls":30,"findings":["The statement is proved as printed, with the literal C (no Cdist needed: p ∈ ∂j₁(N) excludes graph pairs). The past-side form (K⁺(p) ∩ J⁻(Σ₁) → K⁺(q) ∩ J⁻(Σ₂)) is not printed but is what the proof of cor:ext_continue needs at points below Σ₁ (ETT.tex:2148-2156); proved here (ett_corresponding_K_past). The paper's proof via lem:cup_cap_sing / lem:cup_cap_BTZ is replaced by Sbierski's interpolation argument (Corresponding SCOPE)."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134).","twin":"","tex":"\\begin{lem}\nLet $p\\in \\partial j_1(N)\\cap J^+(\\Sigma_1)$ and $q\\in \\partial j_2(N)\\cap J^+(\\Sigma_2)$. The\nfollowing are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $(p,q)\\in C$;\n\\item $f$ induces a bijection\n$$K^-(p)\\cap J^+(\\Sigma_1)\\xrightarrow{\\quad f\\quad} K^-(q)\\cap J^+(\\Sigma_2).$$\n\\end{enumerate}\n\\end{lem}"},{"id":"cor:ext_continue","block":"ETT.tex:1835","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2144,"deps":["lem:corresponding_K","cor:model_corresponding","lem:image_diamant"],"decls":["Causal.CBG.ett_ext_continue","Causal.CBG.ett_ext_germ","Causal.CBG.CommonSubDev.mem_C_iff","Causal.CBG.CommonSubDev.cghdData","Causal.CBG.CGHDData.ext_continue","Causal.CBG.CGHDData.continuousWithinAt_update","Causal.CBG.CGHDData.continuousWithinAt_update_of_corresponds","Causal.CBG.CGHDData.tendsto_comp"],"ndecls":8,"findings":["ETT.tex:2148-2156 (editorial proof, flagged 'verify'): it applies lem:corresponding_K, which assumes p ∈ J⁺(Σ₁) and the accumulation point q'' ∈ J⁺(Σ₂), though the corollary assumes neither (a point below Σ₁ needs the K⁺ form, ett_corresponding_K_past); and 'it eventually lies in a compact diamond of M₂ by Lemma image_diamant' is unsupported (the x_m → p are not shown to lie below one point of j₁(N)). Same finding as Causal/CBG/Corresponding.lean SCOPE; the statement is proved by another route (A3)."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{cor}\nLet $(p,q)\\in C$. Then $f$ extends continuously to $p$ by setting $f(p)=q$.\n\\end{cor}"},{"id":"cor:model_corresponding","block":"ETT.tex:1835","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2158,"deps":["lem:corresponding_K","cor:K_ordre_Sigma","cor:ext_continue","lem:past_BTZ"],"decls":["Causal.CBG.ett_model_corresponding","Causal.CBG.CommonSubDev.mem_C_iff","Causal.CBG.CGHDData.eq_of_corresponds","Causal.CBG.CGHDData.mem_sing_iff","Causal.CBG.IsCorrPair.eq_of_corresponds"],"ndecls":5,"findings":[],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ. Audit AUDIT-1 (minor): ett_model_corresponding proves the sing_α type assertion only for p ∈ ∂j₁(N); the literal 'if (p,q) ∈ C' also covers the graph pairs (j₁x, j₂x), where it is trivial — reading recorded with OQ-25.","twin":"","tex":"\\begin{cor}\nA point $p\\in \\partial j_1(N)$ has at most one corresponding point $q$. Moreover, if $(p,q)\\in C$\nand $p\\in \\sing_\\alpha(M_1)$, then $q\\in \\sing_\\alpha(M_2)$.\n\\end{cor}"},{"id":"prop:Cauchy_non_max","block":"ETT.tex:1835","kind":"proposition","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2178,"deps":["cor:model_corresponding","cor:ext_continue","rem:CBG_analytique"],"decls":["Causal.CBG.ett_cauchy_non_max","Causal.CBG.ett_cauchy_non_max_literal_false","Causal.CBG.ett_cauchy_non_max_literal_false_flat","Causal.CBG.CommonSubDev.mem_correspondingSet_of_mem_Cdist","Causal.CBG.CommonSubDev.mem_Cdist_iff","Causal.CBG.IsCGHD.exists_lt","Causal.CBG.CGHDData.exists_extension","Causal.CBG.correspondingSet_mcghd_eq_empty","Causal.CBG.mcghd_factor","Causal.CBG.CommonSubDev.IsMaximal.bijective_toMcghd","Causal.CBG.mcghdSubDev_isMaximal"],"ndecls":11,"findings":["ETT.tex:2179-2180 is FALSE as printed with C as defined at l.2011-2012: a graph pair (j₁(x), j₂(x)) lies in C (Gluing.graph_subset_C) and satisfies J(Σ₁,p) ∖ {p} ⊂ j₁(N) (j₁(N) is causally convex in M₁), while N = pgcd is maximal. ett_cauchy_non_max_literal_false proves this for every pair of developments of a non-empty connected M₀ over any geometry; ett_cauchy_non_max_literal_false_flat inhabits it (flat geometry, M₀ = 𝕄^{1,d}). With C read as the pairs with distinct images (Cdist, equivalently p ∉ j₁(N)), the proposition holds and its diamond hypothesis is superfluous (ett_cauchy_non_max). Consistent with the rem:non_separe_cas finding (curation): suggest 'C := pairs with π(p) ≠ π(q)' or 'with p ∉ j₁(N)'."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{prop}\nIf there exists $(p,q)\\in C$ with $J_{M_1}(\\Sigma_1,p)\\setminus\\{p\\}\\subset j_1(N)$, then $N$ is not\nmaximal among the common sub-extensions of $M_1$ and $M_2$.\n\\end{prop}"},{"id":"prop:C_connexe","block":"ETT.tex:1835","kind":"proposition","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2240,"deps":["cor:ext_continue"],"decls":["Causal.CBG.ett_C_connexe","Causal.CBG.CommonSubDev.mem_C_iff","Causal.CBG.CGHDData.isOpen_correspondingSet","Causal.CBG.CGHDData.exists_nhds_correspondingSet","Causal.CBG.isClosed_setOf_corresponds_frontier","Causal.CBG.isClosed_setOf_corresponds","Causal.CBG.correspondingSet","Causal.Gluing.C_eq_closure"],"ndecls":8,"findings":["ETT.tex:2242 'C is closed in ∂j₁(N) × ∂j₂(N)': with the literal C (l.2011-2012) C is the closure of the graph of f (Gluing.C_eq_closure), so it is closed in M₁ × M₂ and the proof at l.2264-2267 is not needed.","ETT.tex:2303 (proof of prop:Cauchy_point_min) uses prop:C_connexe to conclude that the connected curve c_n ⊂ ∂j₁(N) lies in C₁; that needs C₁ ∩ c_n closed in c_n, which does not follow from 'C closed in ∂j₁(N) × ∂j₂(N)' without keeping the partners q in a compact set (projection of a closed set). The conclusion is true by another route: a boundary point q ≤ p₀ with p₀ ∈ C₁ is in C₁ (IsCorrPair.exists_corresponds_of_le, with the compact J⁺(Σ₂) ∩ J⁻(q₀))."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{prop}\nThe set $C_1:=\\left\\{p\\in \\partial j_1(N) ~|~ \\exists q,~(p,q)\\in C\\right\\}$ is open in $\\partial\nj_1(N)$, and $C$ is closed in $\\partial j_1(N)\\times \\partial j_2(N)$.\n\\end{prop}"},{"id":"prop:Cauchy_point_min","block":"ETT.tex:1835","kind":"proposition","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":2270,"deps":["lem:image_diamant","lem:past_BTZ","lem:passe_pgcd","prop:K_densite_sing","prop:K_calcul","prop:C_connexe"],"decls":["Causal.CBG.ett_cauchy_point_min","Causal.CBG.ett_cauchy_point_min_symm","Causal.CBG.ett_cauchy_point_min_literal","Causal.CBG.CommonSubDev.mem_Cdist_of_mem_correspondingSet","Causal.CBG.CommonSubDev.mem_correspondingSet_of_mem_Cdist","Causal.CBG.CGHDData.exists_diamond_subset_of_nonempty","Causal.CBG.CGHDData.exists_diamond_subset_symm","Causal.CBG.CGHDData.exists_diamond_subset","Causal.CBG.CGHDData.exists_diamond_subset_past","Causal.CBG.CGHDData.exists_spacelike","Causal.CBG.CGHDData.exists_spacelike_corresponding","Causal.CBG.CGHDData.exists_spacelike_corresponding_past"],"ndecls":13,"findings":["ETT.tex:2271-2272 with the literal C is true but carries no information: every graph pair (j₁(x), j₂(x)) is in C and satisfies the conclusion (ett_cauchy_point_min_literal), so the proposition can return such a pair, which is useless to prop:Cauchy_non_max. The intended statement (C read as Cdist, the distinct pairs) is proved. Consistent with the rem:non_separe_cas finding (the hypothesis C ≠ ∅ is not the intended one)."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134). Audit AUDIT-1 (minor): the closure of ett_cauchy_point_min uses no A3/A4 field and no rigidity — like lem:corresponding_K it needs only the E₀ instance of A2 (the REPORT's 'A2 and A3' corrected).","twin":"","tex":"\\begin{prop}\nIf $C\\neq \\emptyset$, then there exists $(p',q')\\in C$ with\n$$J_{M_1}(\\Sigma_1,p')\\setminus\\{p'\\}\\subset j_1(N).$$\n\\end{prop}"},{"id":"rem:CBG_manquant","block":"ETT.tex:1835","kind":"remark","num":"","title":"What is missing","bucket":"D","lean":"partial","nl":"informal","line":2343,"deps":["defi:causalite"],"decls":["Causal.CBG.Dev.card_le_continuum","Causal.CBG.ett_maximal_secondCountable","Causal.CBG.maxSpace_secondCountable","Causal.CBG.SmallDev","Causal.CBG.SmallDev.ofDev","Causal.CBG.SmallDev.exists_iso","Causal.CBG.Dev.isUniversal_of_small","Causal.CBG.exists_injective_setNat","Causal.CBG.maxDev"],"ndecls":9,"findings":["Both gaps the remark lists are closed in the library over a geometry: (ii) by SmallDev / Sbierski's gluing instead of a categorical inductive limit, (i) by maxSpace_secondCountable after global hyperbolicity of M̄ (maxStr_globallyHyperbolic), whose remaining input for E₀ is the geometry field secondCountable_of_cauchy. The remark could be updated once the E₀ instance exists."],"notes":"T-ett-cbg-anchor (atlas-team, 2026-11-20), audit AUDIT-1 minor. Certified over an abstract CBG Geometry; partial until the E₀ instance (T-ett-port-e0, DEC-134); for rows using A3/A4 also gx's GermExtFutureBTZ, GermExtPastBTZ, SliceFutureBTZ.","twin":"","tex":"\\begin{rem}[What is missing]\nTwo points of the argument above are not established here.\n\\begin{enumerate}[label=(\\roman*)]\n\\item The inductive limit $\\overline{M_0}$ is Hausdorff and carries a $\\mass{\\geq0}$-structure, but\nwe have not checked that it is \\emph{second countable}, hence that it is a topological spacetime in\nthe sense of Definition \\ref{defi:causalite}. The proof should follow Geroch's argument for\nLorentzian manifolds, in the appendix of \\cite{MR0234703}; this is exactly the point left open in\n\\cite[Section~3.4]{thesis}.\n\\item The existence of the inductive limit also requires a small skeleton of the category of\nglobally hyperbolic $\\mass{\\geq0}$-manifolds, i.e. a full subcategory containing one representative\nof each isomorphism class and whose morphisms form a set. Since all such manifolds have the\ncardinality of the continuum, this is routine, and we do not detail it.\n\\end{enumerate}\n\\end{rem}"}],"closed":57,"target":136,"macros":{"gap":["\\ifdraftnotes\\medskip\\noindent\\fbox{\\begin{minipage}{0.92\\linewidth}\\small\\textbf{[to be supplied]} #1\\end{minipage}}\\medskip\\fi",1],"fonction":["\\displaystyle#1:\\begin{array}{l|rcl}\n& \\displaystyle #2 & \\longrightarrow & \\displaystyle #3 \\\\\n    & \\displaystyle #4 & \\longmapsto & \\displaystyle #5 \\end{array}",5],"fonctionn":["\n\t\\displaystyle\\begin{array}{l|rcl}\n\t& \\displaystyle #1 & \\longrightarrow & \\displaystyle #2 \\\\\n    & \\displaystyle #3 & \\longmapsto & \\displaystyle #4 \\end{array}\n",4],"connexe":["\n\t\\mathrm{CC}\\left(#1,#2\\right)\n",2],"mass":["\\mathbb{E}^{1,2}_{#1}",1],"dS":["\\mathbb S^{1,1}_{#1} ",1],"thefigure":"\\arabic{figure}","subsetcirc":"\\mathrel{\\mathpalette\\opncls\\circ}","cls":"\\mathrel{\\mathpalette\\opncls\\bullet}","opncls":["\n  \\ooalign{$#1\\subset$\\cr\n  \\hidewidth\\raisefix{#1}\\hbox{\\scalebox{0.8}{\\hbox{$#1#2\\mkern.55mu$}}}\\cr}",2],"tll":"\\ll","tlleq":"\\ll","catE":["\\mathbf{Var_{\\mass{#1}}}",1],"catX":["\\mathbf{Var_{X_{#1}}}",1],"V":"\\mathcal V","F":"\\mathcal F","T":"\\mathcal{T}","TT":"\\mathscr{T}","G":"\\mathbf G","S":"\\mathcal S","W":"\\mathcal W","MM":"\\overline M","SO":"\\mathrm{SO}","stab":"\\mathrm{Stab}","RR":"\\mathbb R","R":"\\mathcal R","CC":"\\mathbb{C}","J":"\\mathcal{J}","SS":"\\mathbb{S}","H":"\\mathbb{H}","C":"\\mathcal C","E":"\\mathbb{E}","sing":"\\mathrm{Sing}","isom":"\\mathrm{Isom}","d":"\\mathrm{d}","Z":"\\mathbb Z","N":"\\mathbb{N}","reg":"\\mathrm{Reg}","D":"\\mathcal{D}","BTZ":"\\mathbb{E}^{1,2}_0","U":"\\mathcal{U}","fix":"\\mathrm{Fix}","BTZext":"\\mathrm{Ext}_{\\mathrm{BTZ}}","Reg":"\\mathrm{Reg}","mink":"\\mathbb{E}^{1,2}","Dbar":"\\overline{\\D}","adm":"\\mathcal{P}_\\Sigma","EH":"\\mathcal H","grad":"\\mathrm{grad}","Hol":"\\mathrm{Hol}","Cat":"\\mathbf{C}","Top":"\\mathbf{Top}","M":"\\mathcal M","cotan":"\\mathrm{ct}","catGX":"\\mathbf{Var_{G,X}}","Im":"\\mathrm{Im}","et":"~\\text{et}~","DD":"\\mathbb{D}","r":"\\mathfrak{r}","massA":"\\mass{\\geq 0}","pgcd":"M_1 \\wedge M_2","ppcm":"M_1 \\vee M_2","teich":"\\mathrm{Teich}","dec":"\\mathrm{dec}","so":"\\mathfrak{so}","pen":"\\mathscr{P}","susp":"\\mathrm{susp}","UU":"\\mathbb{U}","PP":"\\mathbb{P}","P":"\\mathscr{P}","Hom":"\\mathrm{Hom}","a":"\\lambda","b":"\\mu","cc":"\\beta","dd":"\\alpha","A":"\\mathcal A","B":"\\mathcal B","GG":"\\SO_0(1,2)","Hbar":"\\overline{\\H^2}","RP":"\\mathbb{RP}^1","PSL":"\\mathrm{PSL}","HS":"\\mathbb{HS}","struc":"\\mathbf{Struct}","GL":"\\mathrm{GL}","SL":"\\mathrm{SL}","Aut":"\\mathrm{Aut}","supp":"\\mathrm{supp}","Homeo":"\\mathrm{Homeo}","cool":"{cool}","vecM":"\\overrightarrow{\\E}^{1,2}","X":"\\overrightarrow X","gradH":"{\\overrightarrow{\\grad} \\mathcal H_{\\bar\\kappa}}","Kbar":"\\overline{K}","au":"\\overrightarrow{u}","SwapTheoremNumbers":"\\def\\thm@swap{S}","NoSwapTheoremNumbers":"\\def\\thm@swap{N}"}},"barbot":{"blocks":[{"id":"GHFspace.tex:140","title":"Introduction"},{"id":"GHFspace.tex:757","title":"The non-elementary GH spacetimes: Cauchy-hyperbolic spacetimes"},{"id":"GHFspace.tex:1688","title":"Around Bieberbach's Theorem"},{"id":"GHFspace.tex:2019","title":"Achronal domains of isometries"},{"id":"GHFspace.tex:2212","title":"Spacelike hypersurfaces and achronal domains"},{"id":"GHFspace.tex:2567","title":"The nonloxodromic case"},{"id":"GHFspace.tex:3133","title":"The loxodromic case"},{"id":"GHFspace.tex:3681","title":"CMC foliations"}],"nodes":[{"id":"bthm:caucomp","block":"GHFspace.tex:140","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":337,"deps":[],"decls":["Causal.Flat.barbot_A","Causal.Flat.barbot_A₀","Causal.Flat.EmbeddingOutput","Causal.Flat.caseOutput","Causal.Flat.CaseOutput","Causal.Flat.caseOutput_nonloxodromic","Causal.Flat.caseOutput_generic","Causal.Flat.caseOutput_misner","Causal.Flat.exists_finiteCover_tameEmbedding","Causal.Flat.IsModelA","Causal.Flat.IsMisnerFamily","Causal.Flat.IsUnipotentFamily"],"ndecls":67,"findings":["F1, [11.i] l.3620: 'Misner spacetimes are absolutely maximal' is false when Gamma has no loxodromic element (Gamma trivial: the wedge {t > |x_1|} sits non-surjectively in M^n); the proof assumes one. The Misner family carries 'some gamma has nonzero boost parameter', and with it absolute maximality is proved for both wedges (surjective_of_isQuotientOf_misner).","F2, [10.G] l.3333-3456: the torsion of L(Gamma) is never treated. The literal 'Cauchy-hyperbolic x torus' family is replaced by the central-extension family (b); the torus product (a) is reached only under pi_1 finitely generated, through Selberg's lemma (DEC-44).","G1, l.3678-3679: [11.i]'s unbounded unipotent case is called 'similar' and is not written; it needs one-sided forms of Props 9.3 and 9.5.","G3, l.3586-3592: (i)'s proof applies Theorem A to the target N and drops the linear-twisted-product and finite-cover clauses; it is non-circular only through the layering A_0 (embedding) -> (i) -> A, which is how barbot_A is assembled.","Theorem A's tame embedding into B = Gamma''\\Omega needs Omega simply connected (pi_1(B) is an extension of Gamma'' by pi_1(Omega)); the paper's Omega are convex, but this is not stated.","l.3586-3590, l.3616-3618: for translation spacetimes [11.i] does not need Theorem A on the target: they are absolutely maximal among all flat targets, GH or not (absMax_of_isTranslationSpacetime).","Def 4.18 (l.1212-1214), the fourth family, asks 'no global fixed point', not 'nonelementary': it admits elementary groups with a loxodromic element (infinite dihedral). Its GH needs a loxodromic element, which Def 4.18 yields only through Benoist, not invoked there.","[3.U] geodesics only, l.729-741: the Cauchy argument for the unipotent slice S_f checks nonspacelike geodesics only; the separation claim (S_f disconnects the two lightlike boundary hyperplanes) is false for bounded f even with two finite poles (n = 4, f(y) = y). The conclusion stands because the chosen f = int a^2 (l.707-711) diverges at every end; when an end is infinite the case split l.734-737 is also incomplete.","Rem 2.2, l.544: 'S is not a Cauchy hypersurface in M^n' holds for n >= 2 only (for n = 1, S is a point and is Cauchy in the line); harmless, the paper works in n >= 2.","[2.3] l.485-490 never states that isometries preserve the causal relations of open subsets; in the ETT framework it is a theorem (le_iff_le_isomImage). Typographic: l.490 Isom(M^n) with a plain M.","F3, [10.M] l.3320-3321: 'the action on pi_P^-1(0) is free and properly discontinuous' is false for Gamma: in M^4, Gamma = <gamma_0> with gamma_0(x,z,y) = (e^-1 x, R_theta z, e y), theta/pi irrational, is elementary loxodromic and acts freely and properly on the domain, but acts on pi_P^-1(0) by a rotation fixing 0. The claim holds for Gamma_0 = ker a, and [10.M]'s conclusion is not refuted (that example is Misner in M^2): Bieberbach is run on Gamma_1's euclidean model (Lox.misner_bieberbach).","F4, [10.M] l.3264-3269: the conjugation formula for alpha(gamma gamma' gamma^-1) holds only if alpha(gamma) fixes the origin of Q_0; a loxodromic with a screw part fixes no point and its conjugates drift by n R^n (I - R(gamma')) u, so 'v(gamma') = 0' is unjustified as written. The conclusion is true and proved another way (translation lengths are conjugation-invariant, Lox.fix_second_null, under Bieberbach I). Also l.3287 ('L(Gamma_0) is finite') needs the U = M^n reduction made just before it (Carriere-Dal'bo)."],"notes":"MARKED (DEC-72, 2026-11-02): Flat/Classification.lean (WP-34e) carries **`bthm:caucomp`**. barbot_A and barbot_A₀ are sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02) and no sorry lies beneath them. Read as R1 (DEC-43), every dimension d, d = 0 included; the fourth family is the central-extension form (b) (DEC-44). ⚠ strengthened, disclosed: the group theory the paper cites enters as the named external BarbotExternals d (DEC-36): Benoist (BenoistNoLox), Bieberbach I (BieberbachI, k <= d + 1), Auslander-Carriere-Dal'bo (AuslanderCarriereDalbo), Carriere-D","twin":"","tex":"\\begin{thma}\n\n \nUp to finite coverings and linear twisted products, every Cauchy-complete\nglobally hyperbolic flat spacetime can be tamely embedded\nin an absolutely maximal globally hyperbolic spacetime \nwhich is a translation spacetime, a\nMisner spacetime, a unipotent spacetime,\nor the twisted product of a  Cauchy-hyperbolic flat GH spacetime\nby an euclidean torus.\n\\end{thma}"},{"id":"bthm:cauclo","block":"GHFspace.tex:140","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":352,"deps":[],"decls":["Causal.Causality.isCauchySurface_of_isLocallyCauchyTwoSided","Causal.Causality.IsLocallyCauchy","Causal.Causality.IsLocallyCauchyTwoSided","Causal.Flat.barbot_B","Causal.Flat.IsModelB","Causal.Flat.IsStandard","Causal.Flat.cauclo_from_embedding","Causal.Flat.isCauchyComplete_of_cauchyCompact","Causal.Flat.absMax_of_cauchyCompact_of_mgh","Causal.Flat.surjective_of_mgh_cauchyCompact","Causal.Flat.FlatLemmaKData","Causal.Flat.barbot_B_geroch"],"ndecls":48,"findings":["Rem 2.3 (l.571-579) is false as written: the slab Z^d\\{0 < t < 1} is GH and Cauchy-compact and embeds isometrically, not onto, in the torus Z^d\\M^n (DEC-44; proved in every d in Flat/Examples). The literal remark fails because M is not assumed maximal; the corrected form adds MGH (lemma K).","Rem 2.3, l.577-578: 'any spacelike hypersurface in a CGH spacetime is a Cauchy hypersurface' is false for a small spacelike disc, and needs 'closed' and 'connected' (two disjoint Cauchy slices form a compact, locally Cauchy set met twice by every inextensible curve); for closed connected hypersurfaces it is lemma K.","l.3537-3540: 'closed spacelike hypersurfaces of a GH spacetime are Cauchy' is asserted without proof (lemma K: proved under its named data FlatLemmaKData, which GerochFlat discharges on every GH flat spacetime).","l.3578-3581: '(ii) follows from (i)' also needs that a finite cover of a maximal Cauchy-compact spacetime is maximal, which the paper does not state. It is true, and proved without the uniqueness of maximal Cauchy developments (Cla.cover_maximal_of_isFiniteCover, Flat/Cla/CoverMax): Rem defdep's first claim for M, then the lift of a Cauchy embedding of the cover to the universal covers.","l.3536 ('reconsider the proof above when M is assumed Cauchy-compact') uses Cauchy-compact => Cauchy-complete, which for a topological Cauchy surface needs a smoothing step the paper takes for granted (l.560-565, l.3536-3538). It is proved: finitely many past-hyperboloid caps whose rims lie strictly below S and which lie strictly above S near their centres; the upper part K minus I^-(K) of their union is a nonempty compact spacelike Lipschitz hypersurface (Cla.exists_capEnvelope_of_isCompact_cauchy, SmoothCap; gluing SmoothGlue), a component of which is Cauchy by lemma K. Only per-point constants are needed.","G4, l.355-358: the identification of the third family with 'standard' spacetimes is asserted in a parenthesis; read as Cauchy-compact Cauchy-hyperbolic.","Rem defdep, l.2517-2521: 'when M is maximal globally hyperbolic, the image of D is the Cauchy domain of S' is proved in the DEC-35 reading, range D = int D(Sigma), for every maximal GH flat spacetime with (CC') (Cla.cover_range_eq_of_mgh; Cauchy-compactness not needed). Its second claim, Omega(S~) = int D(Sigma) (Rem dependance, l.3552-3555), is not proved: only int D(Sigma) = range D within Omega(S~)."],"notes":"MARKED (DEC-72, 2026-11-02): Flat/Classification.lean (WP-34e) carries **`bthm:cauclo`**. barbot_B, and barbot_B_geroch (Flat/GerochFlat.lean, DEC-65: barbot_B with lemma K's data hK discharged by flatGerochGH through forall_flatLemmaKData_iff), are sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02); no sorry lies beneath. 'Standard' is read as Cauchy-compact Cauchy-hyperbolic (G4); the torus family is the literal form (a). ⚠ strengthened, disclosed: the named externals BarbotExternals d (Benoist, Bieberbach I, Auslander-Carriere-Dal'bo, Carriere-Dal'bo, a","twin":"","tex":"\\begin{thma}\n\nUp to finite coverings,\nevery maximal Cauchy-compact globally hyperbolic flat spacetime is isometric\nto a translation spacetime, a Misner spacetime, or \nthe twisted product of a standart spacetime (Cauchy-compact \nCauchy-hyperbolic GH spacetime) by an euclidean torus.\n\\end{thma}"},{"id":"bprop:laoucapulse","block":"GHFspace.tex:757","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":854,"deps":[],"decls":["Causal.Flat.laoucapulse_corrected","Causal.Flat.laoucapulse_zeroSection","Causal.Flat.laoucapulse_one","Causal.Flat.laoucapulse_cover","Causal.Flat.expandsAtRate_zeroSection","Causal.Flat.le_penroseFactor_of_expandsAtRate","Causal.Flat.one_lt_penroseFactor_of_isExpandingAtWrt","Causal.Flat.isExpandingAtWrt_penroseDist_one_iff","Causal.Flat.IsExpandingAtWrt","Causal.Flat.ExpandsAtRate","Causal.Flat.LaoucapulseScaledReading","Causal.Flat.not_laoucapulseScaledReading_two"],"ndecls":65,"findings":["Prop 4.2 metric reading refuted (l.859-865): 'expanding' is undefined; in the metric reading (some l > 1 with l*dist <= dist of the images near x) the statement is FALSE, proved in Lean for n = 3 (boost with cosh = 5/4, sinh = 3/4, at the point (u_0, 4) of J^+). It holds for volume expansion (Jacobian a^d > 1 iff a > 1), the only reading the common-factor remark l.849-851 justifies.","l.849-851: off s = 0 the differential of g.(v,s) = ([L]v, a(g,v)s) is not conformal (the s-component has v-derivative s grad a).","The refutation does not depend on the scale of the fibre metric: for n = 3 the printed equivalence fails for every euclidean metric lam|.| on R (not_laoucapulseScaledReading_two); for n = 2 it fails in the metric reading of S on the zero section and holds exactly in the conformal one (S^0 is discrete). What is true for every n: E is open and U x {0} <= E <= delta+^-1(U) (laoucapulse_corrected).","Under the volume reading (DEC-102) Prop 4.2 is false for n = 2: on S^0 the projective action has Jacobian a^0 = 1, so nothing on S is volume-expanding while a boost expands volume on J+ (not_laoucapulseVolumeReading_one, not_expandsVolumeAt_lorentzSphere_one); it holds for every n >= 3 (laoucapulseVolumeReading); the label is marked in a two-case form, conformal at n = 2 (laoucapulse_one), DEC-104."],"notes":"MARKED (DEC-104, 2026-11-02): Flat/LaoucapulseVolume.lean carries **`bprop:laoucapulse`** (ruling K); bprop_laoucapulse_two_case is Prop 4.2 in a two-case form for EVERY dimension, hypothesis only 'g linear' (g . 0 = 0), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]): for d >= 2 (n >= 3) the volume reading (DEC-102; Jacobian a(g,u)^d on J+, a(g,u)^(d-1) on S; from laoucapulse_volume), for d < 2 the conformal reading (a(g,.) > 1 on S, metric expansion for the sup product with any lam|.| on R, every lam > 0), which at d = 1 (n = 2)","twin":"","tex":"\\begin{prop}\n\nEquip ${\\mathcal J}^{+} \\approx {\\mathcal S}^{+} \\times {\\mathbb R}$\nwith the product metric of the round metric on the sphere ${\\mathcal S}^{+}$\nand any euclidean metric on $\\mathbb R$. Let $g$ be a linear\nisometry of \\mink, i.e., admitting a trivial translation part\n$\\tau$. Then, \nthe domain in ${\\mathcal J}^{+}$\nwhere the action of $g$ is expanding is precisely the preimage under\n$\\delta^{+}$ of the domain of ${\\mathcal S}^{+}$ where the action of $L(g)$\nis expanding.\n\\end{prop}"},{"id":"bdef:omega_lambda","block":"GHFspace.tex:757","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":892,"deps":[],"decls":["Causal.Flat.omegaPlus","Causal.Flat.omegaMinus","Causal.Flat.convex_omegaPlus","Causal.Flat.convex_omegaMinus","Causal.Flat.Jplus_omegaPlus_subset","Causal.Flat.Jminus_omegaMinus_subset","Causal.Flat.add_smul_mem_omegaPlus","Causal.Flat.sub_smul_mem_omegaMinus","Causal.Flat.disjoint_omegaPlus_omegaMinus","Causal.Flat.not_futureRegular_ray","Causal.Flat.omegaLambda_regular_of_isClosed"],"ndecls":11,"findings":["(DEC-95: the closing sentence is read under the closed-Lambda convention of l.1001-1004, under which it is proved; the non-closed case is kept as a finding) Def 4.4, l.901-902: 'If Lambda contains at least 2 elements, then Omega^pm(Lambda), if nonempty, is regular' is false for non-closed Lambda: Lambda = {u_0} x ]0,inf[ gives Omega^+ = {<v|p> <= 0}, nonempty and not open (not_futureRegular_ray). For closed Lambda it holds with any number of elements (Lemma 4.8).","l.907-911: the disjointness of Omega^+ and Omega^- needs Lambda nonempty (l.882).","[4.J] normalisation slip, l.782-789: on {N(v) = 1, |v| = 0}, x_0 = 1/sqrt 2, not 1/2, and the induced metric is the round metric of radius 1/sqrt 2; nothing downstream depends on the radius."],"notes":"MARKED (DEC-95, 2026-11-02): Flat/Penrose.lean carries **`bdef:omega_lambda`**; Def 4.4's closing sentence (l.901-902) is proved under the closed-Lambda convention of l.1001-1004 by omegaLambda_regular_of_isClosed ('at least 2 elements' not needed), sorry-free (#print axioms against import Causal re-derived 2026-11-02: [propext, Classical.choice, Quot.sound]). Disclosed: the closed-Lambda convention read as covering Def 4.4 (DEC-95); FutureRegular as Def 4.5 defines it (nonempty and open); the non-closed counterexample kept as a finding (not_futureRegular_ray). Flat/Penrose.lean (WP-30c), no s","twin":"","tex":"\\begin{defina}\n\nThe future complete (resp. past complete) \nconvex set defined by $\\Lambda$ is the intersection:\n\n\\[ \\Omega^{+}(\\Lambda) = \\bigcap_{P \\in \\Lambda} P^{+} \\;\\;\\;\\;\\; \n(\\mbox{resp.} \\;\n\\Omega^{-}(\\Lambda) = \\bigcap_{P \\in \\Lambda} P^{-}) \\]\n\nIf $\\Lambda$ contains at least $2$ elements, then $\\Omega^{\\pm}(\\Lambda)$,\nif nonempty, is regular.\n\\end{defina}"},{"id":"bdef:regular_domain","block":"GHFspace.tex:757","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":913,"deps":[],"decls":["Causal.Flat.FutureRegular","Causal.Flat.PastRegular","Causal.Flat.futureRegular_and_pastRegular_cone"],"ndecls":3,"findings":[],"notes":"Flat/Penrose.lean (WP-30c). No sorry, no added hypothesis.","twin":"","tex":"\\begin{defina}\n\nIf $\\Omega^{+}(\\Lambda)$ (resp. $\\Omega^{-}(\\Lambda)$) is\nnonempty and open, then it is called a future (resp. past)\nregular convex domain. The set $\\Lambda$ is then said\nfuture regular (resp. past regular).\n\\end{defina}"},{"id":"blem:fermons","block":"GHFspace.tex:757","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":926,"deps":[],"decls":["Causal.Flat.interior_omegaPlus_subset","Causal.Flat.interior_omegaMinus_subset","Causal.Flat.omegaPlus_closure_eq_interior","Causal.Flat.omegaPlus_closure_eq_interior_of_futureRegular","Causal.Flat.omegaMinus_closure_eq_interior"],"ndecls":5,"findings":["Typo, l.937: 'for some element (v,s) of Omega^+(cl Lambda)' should read 'of cl Lambda'."],"notes":"Flat/Penrose.lean (WP-30c). No sorry, no added hypothesis.","twin":"","tex":"\\begin{lema}\n\nIf $\\overline{\\Lambda}$ is the closure in \n${\\mathcal J}$ of $\\Lambda$, then $\\Omega^{\\pm}(\\overline{\\Lambda})$\ncontains the interior of $\\Omega^{\\pm}(\\Lambda)$.\n\\end{lema}"},{"id":"bcor:closeregular","block":"GHFspace.tex:757","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":950,"deps":[],"decls":["Causal.Flat.FutureRegular.closure_futureRegular","Causal.Flat.PastRegular.closure_pastRegular"],"ndecls":2,"findings":[],"notes":"Flat/Penrose.lean (WP-30c). No sorry, no added hypothesis.","twin":"","tex":"\\begin{cora}\n\nIf $\\Lambda$ is future regular, then its closure $\\overline{\\Lambda}$ is future\nregular too, and $\\Omega^{+}(\\Lambda) = \\Omega^{+}(\\overline{\\Lambda})$.\n\\end{cora}"},{"id":"blem:closecool","block":"GHFspace.tex:757","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":962,
