sality.not_tarentin_of_Jminus_eq"],"ndecls":4,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: Lorentzian manifolds → strengthened (instance only: minkowski n (no Lorentzian manifolds in the library)); every E≥0-manifold (rem:sing_tarentin) → strengthened (the field tarentin of SingularFlatAxioms (rem:sing_tarentin is itself partial; the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0)); E_α, α > 0, proved (massive_tarentin)); Misner singularity → strengthened (the mechanism of cexemple:misner_tarentin, with its added hypothesis (se","twin":"","tex":"\\begin{rem}\nLorentzian manifolds are tarentin, and so is every $\\mass{\\geq0}$-manifold (Remark\n\\ref{rem:sing_tarentin}). The hypothesis is nevertheless not innocent: a singular flat spacetime\ncontaining a Misner singularity fails it (Counter-example \\ref{cexemple:misner_tarentin}).\n\\end{rem}"},{"id":"def:causally_open_spacetime_open","block":"ETT.tex:230:645","kind":"definition","num":"","title":"Causally open spacetime / open causality","bucket":"A","lean":"closed","nl":"definition","line":694,"deps":[],"decls":["Causal.Causality.CausallyOpenFuture","Causal.Causality.CausallyOpen"],"ndecls":2,"findings":["The definition asks J^+_U(V) open only. The proof of prop:tarentin_topological_spacetime_causality, (ii) implies (i), uses J^-(Int J^-(b_i)) = Int J^-(b_i), which needs J^-_U(V) open as well. Either the definition is meant with J^pm, or that proposition needs the time-reversed hypothesis."],"notes":"`CausallyOpenFuture` is the definition as written; `CausallyOpen` is its conjunction with the time-reversed one.","twin":"","tex":"\\begin{defi}[Causally open spacetime / open causality]\\index{Causally!open}\nLet $M$ be a topological spacetime. The causality of $M$ is open, and $M$ is causally open, if for every open subset $\\U$ of $M$\nand every open subset $\\V\\subset \\U$ the set $J^+_\\U(\\V)$ is open.\n\\end{defi}"},{"id":"prop:topological_spacetime_absolutely_minimal","block":"ETT.tex:230:645","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":698,"deps":["lem:union_causalite"],"decls":["Causal.Causality.AbsolutelyMinimal.causallyOpenFuture","Causal.Causality.AbsolutelyMinimal.causallyOpen"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{prop}Let $M$ be a topological spacetime. If $M$ is absolutely minimal and if for every $p\\in M$ there\nexists a neighbourhood $\\U$ of $p$ whose causality is open, then\nthe causality of $M$ is open.\n\\end{prop}"},{"id":"prop:tarentin_topological_spacetime_causality","block":"ETT.tex:230:645","kind":"proposition","num":"","title":"","bucket":"B","lean":"partial","nl":"proved","line":713,"deps":[],"decls":["Causal.Causality.StronglyCausal.alexandrovTopology_eq","Causal.Causality.stronglyCausalOpen_of_alexandrovTopology_eq","Causal.Causality.stronglyCausal_iff_alexandrovTopology_eq","Causal.Causality.stronglyCausalOpen_iff_alexandrovTopology_eq"],"ndecls":4,"findings":["(ii) implies (i) uses J^-(Int J^-(b_i)) = Int J^-(b_i): causal openness in the past, which def:causally_open_spacetime_open does not state.","(i) implies (ii) uses neither causal openness nor second countability; (ii) implies (i) does not use the tarentin hypothesis."],"notes":"(i) implies (ii) is proved as stated, and without causal openness. (ii) implies (i) is proved under two-sided causal openness, which is more than def:causally_open_spacetime_open gives. Under that hypothesis the equivalence holds for both forms of strong causality.","twin":"","tex":"\\begin{prop} Let $M$ be a tarentin topological spacetime. If the causality of $M$ is open, then the following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $M$ is strongly causal;\n\\item the Alexandrov topology on $M$ coincides with the topology of $M$.\n\\end{enumerate}\n\\end{prop}"},{"id":"defi:futur_continue","block":"ETT.tex:230:753","kind":"definition","num":"","title":"Continuously reachable future and past","bucket":"A","lean":"closed","nl":"definition","line":759,"deps":["ex:open_subset"],"decls":["Causal.Causality.Kplus","Causal.Causality.Kminus","Causal.interiorWithin","Causal.Causality.mem_Kplus_singleton_iff_seq_mem"],"ndecls":4,"findings":[],"notes":"K^pm_U is defined with the sequences of M converging to p; for p in U this is the paper's definition with the sequences of U (`mem_Kplus_singleton_iff_seq_mem`), and for p outside U it gives the empty set.","twin":"","tex":"\\begin{defi}[Continuously reachable future and past]\\index{KM@$K^\\pm_M$}\nLet $M$ be a topological spacetime and let $p\\in M$. We let $K^+(p)$ (resp. $K^-(p)$) denote the continuously reachable future (resp. past) of $p$:\n$$K^\\pm(p)=\\bigcap_{p_n\\rightarrow p} \\bigcup_{N\\in \\N} \\mathrm{Int}_{J^\\pm(p)}\\left( J^\\pm(p)\\cap \\bigcap_{n\\geq N} J^\\pm(p_n)\\right),\n$$\nthe intersection being taken over all sequences $(p_n)_{n\\in \\N}$ of $M$ converging to $p$.\nFor a subset $A\\subset M$ we set\n$$K^\\pm(A):=\\bigcup_{p\\in A} K^\\pm(p),$$\nand for $\\U$ open we write $K^\\pm_\\U$ for the operator obtained by applying these definitions inside the topological spacetime $\\U$ (Example \\ref{ex:open_subset}); thus $K^\\pm=K^\\pm_M$.\n\\end{defi}"},{"id":"rem:K_ensemble","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":768,"deps":["prop:K_calcul"],"decls":["Causal.Causality.K_ensemble"],"ndecls":1,"findings":[],"notes":"The three general assertions are closed. The last sentence, on a BTZ point, is prop:K_calcul's.","twin":"","tex":"\\begin{rem}\nOne has $K^\\pm(\\emptyset)=\\emptyset$, $K^\\pm(A)\\subset J^\\pm(A)$, and $K^\\pm$ is monotone for inclusion. Note that $A\\not\\subset K^\\pm(A)$ in general: for a BTZ point $p$ of a causal $\\mass{\\geq0}$-manifold, $p\\notin K^-(p)=J^-(p)\\setminus\\{p\\}$ (Proposition \\ref{prop:K_calcul}).\n\\end{rem}"},{"id":"def:strongly_tarentin_point","block":"ETT.tex:230:753","kind":"definition","num":"","title":"Strongly tarentin point","bucket":"A","lean":"closed","nl":"definition","line":774,"deps":[],"decls":["Causal.Causality.Zplus","Causal.Causality.Zminus"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Strongly tarentin point]\\index{Tarentin!strongly tarentin point}\nLet $M$ be a topological spacetime. A point $p\\in M$ is strongly tarentin in the future (resp. in the past)\nif for every neighbourhood $\\U$ of $p$ the set $I^+(p)\\cap \\U$ is non-empty (resp. $I^-(p)\\cap \\U$ is non-empty).\n\nWe write $Z^+(M)$ (resp. $Z^-(M)$) for the set of points of $M$ which are strongly tarentin in the future (resp. in the past).\n\\end{defi}"},{"id":"rem:absolutely_minimal_topological_spacetime","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":780,"deps":[],"decls":["Causal.Causality.AbsolutelyMinimal.mem_Zplus_iff","Causal.Causality.AbsolutelyMinimal.mem_Zminus_iff"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} If $M$ is an absolutely minimal topological spacetime, then a point is strongly tarentin\nin the past (resp. in the future) if and only if its chronological past (resp. future) is non-empty.\n\\end{rem}"},{"id":"rem:lorentz_tarentin","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":783,"deps":["rem:btz_pas_tarentin"],"decls":["Causal.lorentz_tarentin","Causal.Causality.Zplus_Zminus_eq_univ","Causal.minkowski_Z_eq_univ","Causal.Causality.SingularFlatAxioms.Z_eq"],"ndecls":4,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: Lorentzian manifold → strengthened (an absolutely minimal T1 spacetime in which every I^±(p) is non-empty (Zplus_Zminus_eq_univ, via rem:absolutely_minimal_topological_spacetime); instance minkowski n); E≥0-manifold: non-strongly-tarentin-in-the-past points = BTZ points → strengthened (fields mem_Zplus, mem_Zminus_iff of SingularFlatAxioms (rem:btz_pas_tarentin, partial; the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0))).","twin":"","tex":"\\begin{rem}\nEvery point of a Lorentzian manifold is strongly tarentin in the future and in the past. The notion\nonly becomes discriminating on singular or low-regularity spacetimes: on a $\\mass{\\geq0}$-manifold\nthe points which fail to be strongly tarentin in the past are exactly the BTZ points (Remark\n\\ref{rem:btz_pas_tarentin}).\n\\end{rem}"},{"id":"rem:suite_croissante","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":790,"deps":[],"decls":["Causal.Causality.exists_seq_lt_tendsto_of_mem_Zminus","Causal.Causality.exists_seq_lt_tendsto_of_mem_Zplus"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} Let $M$ be a topological spacetime. If $p\\in M$ is strongly tarentin in the past, then one may construct\nby induction sequences which are increasing for $\\ll$ and converge to $p$. Indeed, start from an arbitrary point $p_0\\in I^-(p)$ and from a countable basis of\nopen neighbourhoods $(\\U_n)_{n\\in \\N}$ of $p$;\nobserve that $I^+(p_0)\\cap \\U_1$ is an open neighbourhood of $p$, so that there exists $p_1\\in I^+(p_0)\\cap \\U_1\\cap I^-(p)$.\nInductively one constructs a sequence $(p_n)_{n\\in \\N}$ such that for every $n\\geq 1$,\n$p_n\\in \\U_n$ and $p_{n-1}\\ll p_n$. Such a sequence converges to $p$ and is increasing for $\\ll$.\n\\end{rem}"},{"id":"lem:K_facile","block":"ETT.tex:230:753","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":798,"deps":[],"decls":["Causal.Causality.Kminus_eq_of_tendsto"],"ndecls":1,"findings":["The tarentin hypothesis is not used by the proof: it is what provides a sequence with p in Int J^+(p_n), which the statement assumes anyway. The proof here avoids the identity Int(cap Int A_n) = Int(cap A_n)."],"notes":"","twin":"","tex":"\\begin{lem}Let $M$ be a tarentin topological spacetime and let $p\\in M$.\nLet $(p_n)_{n\\in \\N}$ be a sequence of points of $M$ converging to $p$ and such that $p\\in \\ring J^{+}(p_n)$ for every $n\\in \\N$.\nThen\n$$K^-(p) = \\bigcup_{N\\in \\N} \\mathrm{Int}_{J^-(p)}\\left(\\bigcap_{n\\geq N} J^-(p_n)\\right).$$\n\\end{lem}"},{"id":"rem:equivalent_lemma_obviously_holds","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":827,"deps":[],"decls":["Causal.Causality.Kplus_eq_of_tendsto"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} An equivalent lemma obviously holds for $K^+$.\n\\end{rem}"},{"id":"rem:K_borelien","block":"ETT.tex:230:753","kind":"remark","num":"","title":"Measurability","bucket":"C","lean":"partial","nl":"informal","line":829,"deps":["defi:futur_continue","prop:cont_ext_cont","lem:K_facile"],"decls":["Causal.Causality.exists_seq_mem_interior_Jplus","Causal.Causality.Kminus_eq_inter_isOpen","Causal.Causality.Kplus_eq_inter_isOpen","Causal.Causality.measurableSet_Kminus","Causal.Causality.measurableSet_Kplus","Causal.Causality.measurableSet_K_of_globallyHyperbolic"],"ndecls":6,"findings":["ETT.tex:833-834: 'a countable union of sets open in J^±(p), hence a Borel subset of M' needs J^-(p) Borel: a relatively open subset of a non-Borel set need not be Borel. Proved: K^-(p) = J^-(p) ∩ O with O open (the countable union is itself open in J^-(p)), hence Borel whenever J^-(p) is, in particular in the setting of prop:cont_ext_cont where J^-(p) is closed. 'open in J^±(p)' should read J^-(p).","The library's prop:cont_ext_cont (Causal/Measure.lean) does not need this remark at all: it applies inner regularity to a measurable subset of K^-(p) of full measure."],"notes":"No `sorry`. K^-(p) = J^-(p) ∩ O with O open: Borel whenever J^-(p) is (⚠ strengthened), and outright for a tarentin, globally hyperbolic, Hausdorff spacetime. WP-3, audited.","twin":"","tex":"\\begin{rem}[Measurability]\nDefinition \\ref{defi:futur_continue} presents $K^\\pm(p)$ as an intersection over the \\emph{uncountable}\nfamily of sequences converging to $p$, so its measurability is not immediate --- yet inner regularity\nis applied to it in Proposition \\ref{prop:cont_ext_cont}. Lemma \\ref{lem:K_facile} settles the point:\nif $M$ is tarentin, one may choose a single sequence $(p_n)$ with $p\\in \\ring J^+(p_n)$, and then\n$K^-(p)$ is a countable union of sets open in $J^\\pm(p)$, hence a Borel subset of $M$.\n\\end{rem}"},{"id":"lem:passe_coherent","block":"ETT.tex:230:753","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":837,"deps":["defi:causalement_plat"],"decls":["Causal.Causality.Jminus_Iminus_eq_of_mem_Zminus"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} Let $M$ be a causally plain topological spacetime.\nFor every point $p\\in M$ strongly tarentin in the past, $$J^-(I^-(p))= I^-(p).$$\n\\end{lem}"},{"id":"prop:tarentin_fort_K","block":"ETT.tex:230:753","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":850,"deps":["rem:suite_croissante","lem:K_facile","lem:passe_coherent"],"decls":["Causal.Causality.Kminus_eq_Iminus_of_mem_Zminus"],"ndecls":1,"findings":["Absolute minimality and the tarentin hypothesis are not used: causal plainness, a countable basis of neighbourhoods at p, and p strongly tarentin in the past suffice."],"notes":"","twin":"","tex":"\\begin{prop}\nLet $M$ be a causally plain, absolutely minimal, tarentin topological spacetime and let $p\\in M$.\nIf $p$ is strongly tarentin in the past, then $K^-(p) = I^-(p)$.\n\\end{prop}"},{"id":"rem:comparable_property_obviously_holds","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":868,"deps":[],"decls":["Causal.Causality.Kplus_eq_Iplus_of_mem_Zplus"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{rem}\nA comparable property obviously holds for $K^+$.\n\\end{rem}"},{"id":"rem:K_neq_I","block":"ETT.tex:230:753","kind":"remark","num":"","title":"Where K^ and I^ part company","bucket":"D","lean":"partial","nl":"informal","line":871,"deps":["prop:tarentin_fort_K","prop:K_calcul"],"decls":["Causal.halfChronoLine","Causal.halfChronoLine_tarentin","Causal.halfChronoLine_absolutelyMinimal","Causal.halfChronoLine_isCausal","Causal.halfChronoLine_mem_Zminus","Causal.halfChronoLine_not_causallyPlain","Causal.halfChronoLine_neg_two_mem_Kminus","Causal.causallyPlain_cannot_be_dropped","Causal.causallyPlain_cannot_be_dropped_plus","Causal.pointedLine","Causal.pointedLine_Kplus_zero","Causal.bubble_need_not_meet_Kplus"],"ndecls":12,"findings":["ETT.tex:872-875: the conclusion (causal plainness cannot be dropped from prop:tarentin_fort_K) is certified by halfChronoLine (timelike causal relation, chronology only after −1): tarentin, absolutely minimal, causal, 0 ∈ Z^-, not causally plain, ]−∞,−1[ a bubble of J^-(0), −2 ∈ K^-(0) ∖ I^-(0).","ETT.tex:875-877: the BTZ sentence rests on prop:K_calcul and the model space E_0, absent from the library; not stated."],"notes":"No `sorry`. Certified: causal plainness cannot be dropped from prop:tarentin_fort_K (halfChronoLine). The bubble mechanism fails in general but is open under prop:tarentin_fort_K's hypotheses; the BTZ sentence needs E_0. WP-2, audited.","twin":"","tex":"\\begin{rem}[Where $K^\\pm$ and $I^\\pm$ part company]\nCausal plainness cannot be dropped from Proposition \\ref{prop:tarentin_fort_K}. If $B$ is a causal\nbubble of $J^+(p)$ --- a non-empty open set contained in $J^+(p)$ and disjoint from $I^+(p)$, as\noccurs below Lipschitz regularity \\cite{MR2949547,MR3500220,samann2024nonregular} --- then $B$ meets\n$K^+(p)$ while $B\\cap I^+(p)=\\emptyset$, so $K^+(p)\\neq I^+(p)$. The same separation occurs, in\ndegenerate form, at a BTZ point, where $I^-(p)=\\emptyset$ while\n$K^-(p)=J^-(p)\\setminus\\{p\\}\\neq \\emptyset$ (Proposition \\ref{prop:K_calcul}).\n\nThis is the whole point of $K^\\pm$. Everything that follows --- admissible measures, continuity of\n$x\\mapsto \\mu(J^\\pm(x))$, and Geroch's Theorem --- is built on $K^\\pm$ rather than on $I^\\pm$, and\ntherefore survives in both settings.\n\\end{rem}"},{"id":"cor:K_lorentzien","block":"ETT.tex:230:753","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":884,"deps":["rem:lorentz_tarentin","prop:tarentin_fort_K"],"decls":["Causal.Causality.K_lorentzien","Causal.Causality.K_eq_I_of_pushUp","Causal.minkowski_K_lorentzien"],"ndecls":3,"findings":["ETT.tex:889-891: the proof checks tarentin and absolute minimality, which prop:tarentin_fort_K assumes but does not need, and omits causal plainness, which it needs (l.851). For a smooth (or C^{1,1}) Lorentzian manifold plainness/push-up is classical and should be cited; below Lipschitz regularity it can fail (rem:pas_plat (i), rem:K_neq_I), so 'Lorentzian manifold' must be read with at least that regularity."],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: M a Lorentzian manifold → strengthened (abstract core of the proof: absolutely minimal, T1, first countable, I^±(p) ≠ ∅ for every p, and causally plain (K_lorentzien) or push-up (K_eq_I_of_pushUp); instance minkowski n (all points). No Lorentzian manifold in the library.); tarentin (named in the proof) → weakened (not used (prop:tarentin_fort_K does not use it)).","twin":"","tex":"\\begin{cor} Let $M$ be a Lorentzian manifold. Then\n$$\\forall p\\in M, \\quad K^\\pm(p)=I^\\pm(p).$$\n\\end{cor}"},{"id":"prop:FZenon_injectif","block":"ETT.tex:230:753","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":894,"deps":[],"decls":["Causal.Causality.Iplus_injOn_Zplus","Causal.Causality.Iminus_injOn_Zminus"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $M$ be a topological spacetime. If $M$ is strongly causal, then\nthe map $$\\fonctionn{Z^\\pm(M)}{\\mathcal{P}(M)}{x}{I^\\pm(x)}$$\nis injective.\n\\end{prop}"},{"id":"rem:manifolds_specialises_brunswic_cauchy","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"","lean":"none","nl":"informal","line":898,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Kept informal pending OQ-30: its assertion (I⁺ injective on M, I⁻ on M ∖ sing₀) is proved under SingularFlatAxioms with strong causality, Causal.Causality.SingularFlatAxioms.FZenon_injectif (Causal/Remarks/Tarentin.lean), partial until the E₀ port; brunswic2021cauchy Prop. 1.10 is not in the repository and was not read.","twin":"","tex":"\\begin{rem}\nFor $\\mass{\\geq0}$-manifolds this specialises to \\cite[Prop.~1.10]{brunswic2021cauchy}, which states the injectivity of $x\\mapsto I^+(x)$ on all of $M$ and of $x\\mapsto I^-(x)$ on $M\\setminus \\sing_0(M)$ --- the two domains being exactly $Z^+(M)$ and $Z^-(M)$ in the present language.\n\\end{rem}"},{"id":"prop:K_plongement_ordre","block":"ETT.tex:230:753","kind":"proposition","num":"","title":"K^ as an embedding of ordered sets","bucket":"A","lean":"closed","nl":"proved","line":922,"deps":["prop:mesure_dieckmann_topo"],"decls":["Causal.Causality.K_order_embedding","Causal.Causality.le_of_Kminus_subset","Causal.Causality.le_of_Kplus_subset"],"ndecls":3,"findings":["That M is causal is used for the injectivity of x -> K^pm(x) only; the two implications and the two equivalences hold without it."],"notes":"","twin":"","tex":"\\begin{prop}[$K^\\pm$ as an embedding of ordered sets]\nLet $M$ be a causal topological spacetime. Assume that for every $x\\in M$\n\\begin{enumerate}[label=(\\alph*)]\n\\item $J^\\pm(x)$ is closed, and\n\\item $J^\\pm(x)\\subset \\overline{K^\\pm(x)}$, i.e. $K^\\pm(x)$ is dense in $J^\\pm(x)$.\n\\end{enumerate}\nThen for all $x,y\\in M$,\n$$K^-(x)\\subset K^-(y)\\ \\Longrightarrow\\ x\\leq y, \\qquad K^+(y)\\subset K^+(x)\\ \\Longrightarrow\\ x\\leq y,$$\nand in particular the maps $x\\mapsto K^\\pm(x)$ are injective.\n\nIf moreover $K^-$ is monotone --- $q\\leq p \\Rightarrow K^-(q)\\subset K^-(p)$, which is hypothesis\n$(ii)$ of Proposition \\ref{prop:mesure_dieckmann_topo} --- then for all $x,y\\in M$\n$$x\\leq y \\iff K^-(x)\\subset K^-(y),$$\nso that $x\\mapsto K^-(x)$ is an isomorphism of ordered sets from $(M,\\leq)$ onto its image in\n$\\left(\\mathcal P(M),\\subset\\right)$. The symmetric statement holds for $K^+$, with the order\nreversed.\n\\end{prop}"},{"id":"rem:K_plongement_hypotheses","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":951,"deps":["prop:GH_Jferme","prop:tarentin_fort_K","prop:K_densite_sing"],"decls":["Causal.Causality.mem_closure_Jminus_of_Kminus_subset","Causal.Causality.mem_closure_Jplus_of_Kplus_subset","Causal.Causality.GloballyHyperbolic.hypothesis_a","Causal.Causality.K_order_embedding_of_globallyHyperbolic","Causal.Causality.Jminus_subset_closure_Kminus_iff","Causal.Causality.Jplus_subset_closure_Kplus_iff","Causal.Causality.Jminus_subset_closure_Iminus_of_pushUp","Causal.Causality.Jplus_subset_closure_Iplus_of_pushUp","Causal.PuncturedPlane","Causal.puncturedPlane","Causal.hypothesis_a_needed","Causal.spacelikeLine_Kminus"],"ndecls":16,"findings":["ETT.tex:952 'Neither hypothesis can be dispensed with' is certified by two counterexamples: (a) the punctured null plane (ℝ²∖{0}, product order with the null rays through the puncture blocked) is causal, satisfies (b) at every point for both signs, J^-((1,0)) is not closed, and K^-((−1,0)) ⊂ K^-((1,0)), K^+((1,0)) ⊂ K^+((−1,0)) while (−1,0) ≰ (1,0); (b) the spacelike line is causal, satisfies (a), K^± ≡ ∅, and both the order conclusion and injectivity fail.","ETT.tex:323-324 (rem:deux_pushup) and 953: imprecise rather than false. The paper uses 'push-up' for two properties: ETT.tex:290 calls causal plainness 'the push-up property', defi:pushup defines a relational one. With defi:pushup, density of I^-(x) in J^-(x) needs J^-(x) ⊆ Z^- as well (Jminus_subset_closure_Iminus_of_pushUp); without it the spacelike line has defi:pushup (vacuously) and fails density and (b) everywhere (pushUp_does_not_give_hypothesis_b). At ETT.tex:953 the sentence reasons through prop:tarentin_fort_K, so its 'push-up' is causal plainness, which the spacelike line lacks: that sentence is not contradicted. Suggest naming one property per word.","ETT.tex:954 'around which M is causally plain': prop:tarentin_fort_K is for a causally plain M; a local version is not proved anywhere. Certified with global plainness.","ETT.tex:957-958: prop:K_densite_sing belongs to the singular model spaces, absent from the library; not stated."],"notes":"No `sorry`. 'Neither hypothesis can be dispensed with' is certified by two counterexamples; 'around which M is causally plain' is used as 'M causally plain' (⚠ strengthened). WP-2, audited.","twin":"","tex":"\\begin{rem}\nNeither hypothesis can be dispensed with. Without $(a)$ one only gets $x\\in \\overline{J^-(y)}$; global\nhyperbolicity supplies $(a)$ through Proposition \\ref{prop:GH_Jferme}. Hypothesis $(b)$ is where\npush-up enters: at a point which is strongly tarentin in the past and around which $M$ is causally\nplain, $K^-(x)=I^-(x)$ (Proposition \\ref{prop:tarentin_fort_K}) and $(b)$ reads\n$J^-(x)\\subset\\overline{I^-(x)}$, the classical density of the chronological past in the causal past.\nProposition \\ref{prop:K_densite_sing} establishes $(b)$ for singular flat spacetimes --- including at\nBTZ points, where $I^-(x)$ is empty and only $K^-(x)$ can be dense.\n\\end{rem}"},{"id":"lem:cup_cap","block":"ETT.tex:230:753","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":962,"deps":[],"decls":["Causal.Causality.Iminus_subset_interior_and_subset"],"ndecls":1,"findings":["Absolute minimality is used for the inclusion in Z^+(M) only, through rem:absolutely_minimal_topological_spacetime; the two other inclusions hold in every topological spacetime."],"notes":"","twin":"","tex":"\\begin{lem} Let $M$ be an absolutely minimal topological spacetime, let $p\\in M$ and let $(p_n)_{n\\in \\N}\\in M^\\N$ be a sequence converging to\n$p$.\nIf $J^+(x)$ is closed for every $x\\in M$, then\n$$I^{-}(p)\\subset \\mathrm{Int}\\left(\\bigcup_{N\\in \\N}\\bigcap_{n\\geq N} I^-(p_n)\\right)\\subset \\ring J^-(p) \\cap Z^{+}(M). $$\n\\end{lem}"},{"id":"rem:same_notation_one_proves","block":"ETT.tex:230:753","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":987,"deps":[],"decls":["Causal.Causality.Iplus_subset_interior_and_subset"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} With the same notation, one proves in the same way the corresponding property for the chronological future:\nif $J^-(x)$ is closed for every $x\\in M$, then\n$$I^{+}(p)\\subset \\mathrm{Int}\\left(\\bigcup_{N\\in \\N}\\bigcap_{n\\geq N} I^+(p_n)\\right)\\subset \\ring J^+(p) \\cap Z^{-}(M). $$\n\\end{rem}"},{"id":"def:globally_hyperbolic","block":"ETT.tex:230:992","kind":"definition","num":"","title":"Globally hyperbolic","bucket":"A","lean":"closed","nl":"definition","line":995,"deps":[],"decls":["Causal.Causality.GloballyHyperbolic"],"ndecls":1,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Globally hyperbolic]\\index{Globally hyperbolic} Let $M$ be a topological spacetime. $M$ is globally hyperbolic if $M$ is causal and\nif $J_M(p,q)$ is compact for all $p,q\\in M$.\n\\end{defi}"},{"id":"def:cauchy_surface","block":"ETT.tex:230:992","kind":"definition","num":"","title":"Cauchy surface","bucket":"A","lean":"closed","nl":"definition","line":999,"deps":[],"decls":["Causal.Causality.IsCauchySurfaceOn","Causal.Causality.IsCauchySurface","Causal.Causality.IsCauchySurfaceLiteral","Causal.Causality.not_isCauchySurfaceLiteral","Causal.timelikeLine_not_isCauchySurfaceLiteral","Causal.timelikeLine_isCauchySurface_zero","Causal.Causality.isCauchySurfaceOn_top"],"ndecls":7,"findings":["Ruled by DEC-14 (2026-10-30): the definition is 'every inextensible causal curve meets S exactly once'.","ETT.tex:1000 read literally, def:cauchy_surface admits no Cauchy surface once some causal curve is non-constant: constant curves are causal curves (DEC-6), so S must contain every point, and a non-constant curve then meets S twice (not_isCauchySurfaceLiteral; on the timelike line, timelikeLine_not_isCauchySurfaceLiteral). Suggested wording: 'every inextensible causal curve of M meets S exactly once'.","ETT.tex:1005 and 1265 say 'Cauchy hypersurface' while def:cauchy_surface defines 'Cauchy surface'; the theorem never asks S to be a hypersurface (which would need a manifold structure).","Witness: on the timelike line {0} is a Cauchy surface in the reading taken (timelikeLine_isCauchySurface_zero)."],"notes":"No `sorry` beneath the strict part. Every inextensible causal curve meets S exactly once, on the image (DEC-14); the literal definition admits no Cauchy surface (not_isCauchySurfaceLiteral). WP-7, audited twice.","twin":"","tex":"\\begin{defi}[Cauchy surface]\\index{Surface!Cauchy} Let $M$ be a topological spacetime. A Cauchy surface in $M$ is a subset\n$S\\subset M$ such that every causal curve of $M$ meets $S$ exactly once.\n\\end{defi}"},{"id":"theo:geroch_mr","block":"ETT.tex:230:992","kind":"theorem","num":"","title":"Geroch [MR0270697]","bucket":"D","lean":"none","nl":"cited","line":1002,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Not attempted. Not attempted: a cited theorem about smooth Lorentzian manifolds (Geroch 1970) with no abstract core beyond what theo:geroch (Causal.Geroch, CausalScaffold.GerochEquiv) already carries. Missing infrastructure: smooth Lorentzian manifolds (metric, time orientation, metric causal curves), Cauchy hypersurfaces as topological hypersurfaces, and Geroch's volume-function / limit-curve argument. A Minkowski instance would be narrower than the paper and is not an anchor; none is written (no GerochMR.lean)","twin":"","tex":"\\begin{theo}[Geroch \\cite{MR0270697}]\\index{Theorem!Geroch} Let $M$ be a Lorentzian manifold. The following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $M$ is globally hyperbolic;\n\\item $M$ admits a Cauchy hypersurface.\n\\end{enumerate}\nMoreover, if these properties hold, then $M$ is homeomorphic to $\\Sigma\\times \\RR$.\n\\end{theo}"},{"id":"defi:fonction_temps","block":"ETT.tex:230:992","kind":"definition","num":"","title":"Time function","bucket":"A","lean":"closed","nl":"definition","line":1028,"deps":[],"decls":["Causal.Causality.IsTimeFunction","Causal.Causality.IsTimeFunction.continuous","Causal.Causality.IsTimeFunction.isOpenMap","Causal.Causality.IsTimeFunction.le","Causal.Causality.IsTimeFunction.lt","Causal.Causality.IsTimeFunction.Icc_subset","Causal.Causality.IsTimeFunction.monotoneOn","Causal.Causality.IsTimeFunction.strictMonoOn","Causal.Causality.IsTimeFunction.weakMorphism","Causal.Causality.IsTimeFunction.comp","Causal.Causality.IsTimeFunction.dual","Causal.Causality.dual_isTimeFunction"],"ndecls":21,"findings":["Under DEC-10 a time function must be an OPEN map. The Geroch sketch ETT.tex:1272-1276 shows only that t^± = ±μ_±(J^±(x)) are continuous ('time functions (hence continuous)') and never argues that t^±, or T = log(-t^-/t^+), is open; nor, under the within-components reading (b), that [T x, T y] ⊆ U whenever x ≤_{T⁻¹U} y. The second point is automatic there, because Geroch assumes causal arc-connectedness (isTimeFunction_iff_order); the openness is a gap in (i)⇒(ii) of theo:geroch.","Notation: ETT.tex:267 calls the timelike line '(ℝ,≤,≤)' while ETT.tex:1029 calls the target of a time function '(ℝ,≤,<)'; the relations defined at l.267-268 are ≤ and <, so l.267 should read (ℝ,≤,<)."],"notes":"No `sorry`. Certified in `Causal.Morphism`. A strong morphism to the timelike line (DEC-10, DEC-12); monotone along causal curves, strictly along chronal ones; −T is a time function for the dual. WP-1, audited.","twin":"","tex":"\\begin{defi}[Time function]\\index{Time function} Let $(M,\\leq,\\ll)$ be a topological spacetime. A time function $T$ on $M$ is a morphism of topological spacetimes\n$$(M,\\leq,\\ll)\\xrightarrow{~~T~~}(\\RR,\\leq,<).$$\n\\end{defi}"},{"id":"defi:mesure_dieckmann","block":"ETT.tex:230:992","kind":"definition","num":"","title":"Admissible measure","bucket":"A","lean":"closed","nl":"definition","line":1032,"deps":[],"decls":["Causal.Causality.AdmissiblePast","Causal.Causality.AdmissibleFuture"],"ndecls":2,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Admissible measure]\\index{Admissible measure} Let $M$ be a topological spacetime. A measure $\\mu$ on $M$ is admissible \\emph{in the past} (resp. \\emph{in the future})\nif it satisfies the following properties:\n\\begin{enumerate}\n\\item $\\mu$ is a regular Borel measure on $M$;\n\\item $\\mu(M)<+\\infty$;\n\\item for all $p,q\\in M$, if $p<q$ then\n$$\\mu(J^-(q)\\setminus J^-(p))>0 \\qquad \\left(\\text{resp.}\\quad  \\mu(J^+(p)\\setminus J^+(q))>0\\right) ; $$\n\\item for every $A \\subset M$, $\\mu(J^-(A)\\setminus K^-(A))=0$ \\quad (resp. $\\mu(J^+(A)\\setminus K^+(A))=0$).\n\\end{enumerate}\n\\end{defi}"},{"id":"rem:mesure_bord","block":"ETT.tex:230:992","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":1042,"deps":[],"decls":["Causal.Causality.AdmissiblePast"],"ndecls":1,"findings":[],"notes":"mathlib's `μ s` is the outer measure of `s` for every set `s`: property 4. is read as the remark asks.","twin":"","tex":"\\begin{rem}\nIn property $4$ the set $J^\\pm(A)$ need not be Borel; the condition is to be read for the completion of $\\mu$, equivalently as $\\mu^*\\left(J^\\pm(A)\\setminus K^\\pm(A)\\right)=0$ for the associated outer measure.\n\\end{rem}"},{"id":"rem:mesure_unilaterale_ptr","block":"ETT.tex:230:992","kind":"remark","num":"","title":"Why the notion is one-sided","bucket":"D","lean":"partial","nl":"informal","line":1045,"deps":["rem:mesure_unilaterale","theo:geroch"],"decls":["Causal.Causality.not_admissiblePast_and_admissibleFuture","Causal.Causality.not_admissiblePast_and_admissibleFuture_of_pushUp","Causal.lightlikeLine_admissible_past_and_future","Causal.lightlikeLine_chain","Causal.pointedLineMR","Causal.pointedLineMR_Kplus_zero","Causal.pointedLineMR_obstruction_hypotheses","Causal.pointedLineMR_not_admissible"],"ndecls":8,"findings":["ETT.tex:1047-1049 is false in the generality stated: the lightlike line (ex:causalities_lines, item 2) is a causal chain along which every chronological past is empty, and the standard Gaussian measure on it is admissible in the past AND in the future (Lean: lightlikeLine_admissible_past_and_future; there K^-(p) = ]-∞,p[, K^+(p) = ]p,+∞[, so J^±(A) \\ K^±(A) has at most one point). The computation of rem:mesure_unilaterale also uses K^+(p) = I^+(p) at the lower end p (prop:K_calcul (b)), which fails on the lightlike line; with it the obstruction is proved. Suggested wording: 'a BTZ line, along which chronological pasts are empty while K^+ = I^+ (as at a BTZ point of an E_{≥0}-manifold)'.","Satisfiability (audit request): every hypothesis of not_admissiblePast_and_admissibleFuture holds on the pointed line (rebuilt locally as pointedLineMR from WP-2's pointedLine) at p = 0, q = 1: J^-(1) \\ J^-(0) = {1} ⊂ J^+(0), I^- = ∅, K^+(0) = ∅ = I^+(0); hence no measure on it is admissible in both senses (pointedLineMR_not_admissible). The _of_pushUp form has NO Lean witness: p ∈ Z^+(M) forces points r ≫ p arbitrarily close to p, with I^-(r) ∋ p, hence off the chain ]p,q]; a witness needs a second direction (dimension ≥ 2, as in the BTZ model) and is not built."],"notes":"No `sorry`. False in the generality stated: on the lightlike line the Gaussian measure is admissible in the past and in the future. The obstruction is proved under K^+(p) ⊂ I^+(p), with a witness (pointedLineMR). WP-3, audited.","twin":"","tex":"\\begin{rem}[Why the notion is one-sided]\nThe one-sided formulation is not a stylistic choice. As soon as a spacetime carries the analogue of\na BTZ line --- a causal chain along which chronological pasts are empty --- no measure on it is\nadmissible in the past and in the future at once, property $4$ being the obstruction; the\ncomputation is carried out in Remark \\ref{rem:mesure_unilaterale} of Section\n\\ref{subsec:geroch_sing}. Geroch's Theorem \\ref{theo:geroch} is accordingly fed a \\emph{pair} of\nmeasures.\n\\end{rem}"},{"id":"prop:mesure_dieckmann_Lorentz","block":"ETT.tex:230:992","kind":"proposition","num":"","title":"","bucket":"C","lean":"none","nl":"proved","line":1054,"deps":[],"decls":["Causal.minkowski_mesure_dieckmann","Causal.minkowski_mesure_dieckmann_of","Causal.minkowski_exists_measure","Causal.staticCausality.Kminus_eq_Iminus","Causal.staticCausality.Kplus_eq_Iplus","Causal.staticCausality.Jminus_diff_Kminus_subset_frontier","Causal.staticCausality.Jplus_diff_Kplus_subset_frontier","Causal.staticCausality.exists_isOpen_subset_Jminus_diff","Causal.staticCausality.exists_isOpen_subset_Jplus_diff"],"ndecls":9,"findings":["l.1058-1059 'one then checks easily that conditions 3. and 4. hold': condition 4 for an ARBITRARY A rests on the classical theorem that achronal boundaries are Lipschitz hypersurfaces (Hawking-Ellis, Prop. 6.3.1), hence Lebesgue-null; the paper's sentence stands once that fact is cited. Concretely, with K^pm(A) = I^pm(A) (push-up and Z^pm = M) condition 4 asks that mu not charge J^pm(A) \\ I^pm(A), a subset of the frontier of the open past/future set I^pm(A). Condition 3 is elementary (J^-(q) \\ J^-(p) contains a non-empty open set, exists_isOpen_subset_Jminus_diff). The sorry'd existence statement is true for every n, n = 0 included (a Gaussian), so it is not vacuous.","Row status for the ledger: stated, on the Minkowski instance only (hypothesis strengthened)."],"notes":"Stated on Minkowski space only (the library has no Lorentzian manifolds), reduced to a measure null on the boundary of every open past or future set, which is the tagged sorry. (WP-9, audited)","twin":"","tex":"\\begin{prop} Let $M$ be a strongly causal Lorentzian manifold. Then $M$ admits a measure which is admissible both in the past and in the future.\n\\end{prop}"},{"id":"lem:restriction_convexe","block":"ETT.tex:230:992","kind":"lemma","num":"","title":"Restriction to a causally convex open set","bucket":"A","lean":"closed","nl":"proved","line":1063,"deps":["defi:causalite"],"decls":["Causal.Causality.restriction_convexe_past","Causal.Causality.restriction_convexe_future"],"ndecls":2,"findings":[],"notes":"No `sorry`.","twin":"","tex":"\\begin{lem}[Restriction to a causally convex open set]\n\nLet $M$ be a causally arc-connected topological spacetime and let $\\U$ be an open subset of $M$\ncausally convex in $M$. Then for every $x\\in \\U$,\n$$J^\\pm_\\U(x)=J^\\pm(x)\\cap \\U,\\qquad I^\\pm_\\U(x)=I^\\pm(x)\\cap \\U,\\qquad K^\\pm_\\U(x)=K^\\pm(x)\\cap \\U,$$\nand consequently $J^\\pm_\\U(A)=J^\\pm(A)\\cap \\U$ and $K^\\pm_\\U(A)=K^\\pm(A)\\cap \\U$ for every $A\\subset \\U$.\n\\end{lem}"},{"id":"prop:mesure_dieckmann_topo","block":"ETT.tex:230:992","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1094,"deps":["cor:causalement_connexe_minimal","lem:restriction_convexe"],"decls":["Causal.Causality.mesure_dieckmann_topo_past","Causal.Causality.mesure_dieckmann_topo_future","Causal.Causality.exists_admissiblePast_of_local","Causal.Causality.exists_admissibleFuture_of_local","Causal.Causality.AdmissiblePastOn","Causal.Causality.AdmissibleFutureOn"],"ndecls":6,"findings":["ETT.tex:1094: 'strongly causal' is not used by the proof (l.1103-1139); hypothesis (i) already provides causally convex neighbourhoods. It can be dropped from the statement.","ETT.tex:1104: 'Since M is second countable' — only the Lindelöf property is used (a countable subcover of (U_p)).","ETT.tex:1106-1107: 'normalised so that mu_n(U_n)=1' is not always possible: a measure admissible in the past on U_n may be the zero measure (when U_n contains no pair p <_{U_n} q, property 3 is vacuous). Weights 2^{-n-1}/(1+mu_n(U_n)), or simply dropping zero terms, repair it.","ETT.tex:1110: 'Since each mu_n is a normalised regular Borel measure, mu is a regular Borel measure' is true but not immediate: outer regularity is not stable under the countable intersection of open sets the termwise argument would produce. It holds because the total mass is finite: inner regularity by closed sets passes to the sum (finite unions), and for a finite measure that gives outer regularity; this uses Hausdorff (R1). Proved as Causal.regular_sum.","ETT.tex:1111-1113: the existence of n_0, q' with p in U_{n_0}, p <_{U_{n_0}} q', q' <= q is correct: take the first link of the chain given by cor:causalement_connexe_minimal that leaves p (Causal.transGen_exists_first_ne).","Hypothesis (i) is necessary (admissiblePast_local_of_admissiblePast: U_p = M), so the proposition says that, under (ii), admissibility in the past is a local property for causally convex covers."],"notes":"No `sorry`. Past and future, with the paper's hypotheses; strong causality carried unused, and `exists_admissible*_of_local` needs only Lindelöf and R1. WP-5, audited.","twin":"","tex":"\\begin{prop} Let $M$ be a causally arc-connected, strongly causal\ntopological spacetime. Assume that\n\\begin{enumerate}[label=(\\roman*)]\n\\item for every $p\\in M$ there is an open neighbourhood $\\U_p$ of $p$, causally convex in $M$,\ncarrying a measure admissible in the past;\n\\item for every $p\\in M$ and every $q\\leq p$, $K^-(q)\\subset K^-(p)$.\n\\end{enumerate}\nThen $M$ carries a measure admissible in the past. The symmetric statement holds in the future.\n\\end{prop}"},{"id":"rem:recursion_these","block":"ETT.tex:230:992","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":1140,"deps":[],"decls":["Causal.Causality.thesisRecursion","Causal.Causality.Kminus_eq_empty_of_inter_eq_empty","Causal.Causality.thesisRecursion_eq_empty","Causal.Causality.recursion_these","Causal.recursion_these_misseeded"],"ndecls":5,"findings":["ETT.tex:1144: the hypotheses 'A ⊂ U₅' and 'A ∩ (U₂ ∪ U₃ ∪ U₄) = ∅' are not needed: A ∩ U₁ = ∅ alone empties every K^{-,(n)}(A), as the remark's own reason ('A enters only through U₁') says. Mis-seeding is witnessed: on the timelike line with U₁ = ⋯ = U₄ = ]-∞,0[, U₅ = ℝ, A = {1}, every K^{-,(n)}(A) is empty while 0 ∈ K^-(A) (recursion_these_misseeded)."],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: A ⊂ U₅ and A ∩ (U₁ ∪ ⋯ ∪ U₄) = ∅ → weakened (A ∩ U₁ = ∅ suffices (thesisRecursion_eq_empty); the printed form is recursion_these). The first sentence (l.1141-1143) is about the paper's proof of prop:mesure_dieckmann_topo; the library's mesure_dieckmann_topo_past (Causal.MeasureLocal, closed) is indeed proved without the recursion or the thesis's hypothesis. A sentence about a proof is not certified by a declaration, hence partial.","twin":"","tex":"\\begin{rem}\nThe argument above uses neither the recursion\n$K^{-,(0)}(A)=K^-_{\\U_1}(A)$, $K^{-,(n+1)}(A)=K^{-,(n)}(A)\\cup K^-_{\\U_{n+1}}\\left(K^{-,(n)}(A)\\cap \\U_{n+1}\\right)$\nof \\cite{thesis}, nor the further hypothesis made there. That recursion is in any case mis-seeded:\nif $A\\subset \\U_5$ and $A\\cap\\left(\\U_1\\cup\\cdots\\cup \\U_4\\right)=\\emptyset$, then every\n$K^{-,(n)}(A)$ is empty, since $A$ enters the recursion only through $\\U_1$.\n\\end{rem}"},{"id":"prop:relation_fermee","block":"ETT.tex:230:992","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1148,"deps":[],"decls":["Causal.Causality.isClosed_le"],"ndecls":1,"findings":["Second countability is not used: the passage through sequential closedness can be replaced by an argument on neighbourhoods. The same holds for prop:GH_Jferme and prop:GH_fortement_causal, where the decreasing sequence of compact sets becomes a directed family."],"notes":"","twin":"","tex":"\\begin{prop}\nLet $M$ be a tarentin topological spacetime. If $J^\\pm(x)$ is closed for every $x\\in M$, then the\nrelation $\\leq_M$ is closed in $M\\times M$.\n\\end{prop}"},{"id":"rem:proof_uses_neither_causal","block":"ETT.tex:230:992","kind":"remark","num":"","title":"","bucket":"","lean":"partial","nl":"informal","line":1171,"deps":[],"decls":["Causal.lightlikeLine_relation_fermee","Causal.lightlikeLine_tarentin","Causal.lightlikeLine_Jplus_top","Causal.lightlikeLine_Jminus_top","Causal.Causality.isClosed_le"],"ndecls":5,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. A statement about the proof of prop:relation_fermee. Its formal counterpart: the library's Causality.isClosed_le (prop:relation_fermee, closed) asks only tarentin and J^±(x) closed (no curve, no I^±, no plainness, no countability), and the lightlike line satisfies these hypotheses while I^+(q) = ∅ for every q, so the classical q ∈ closure I^+(q) fails everywhere (lightlikeLine_relation_fermee). Partial only because a sentence about a proof is not certified by a","twin":"","tex":"\\begin{rem}\nThe proof uses neither causal curves, nor $I^\\pm$, nor causal plainness. This matters: it is exactly\nthe classical argument that ``$J^\\pm(x)$ closed for every $x$ implies $\\leq$ closed'', with the\ntarentin hypothesis playing the role that $q\\in \\overline{I^+(q)}$ plays in the Lorentzian case.\nThe classical formulation is unavailable here, since $I^+(q)$ may be empty.\n\\end{rem}"},{"id":"prop:GH_Jferme","block":"ETT.tex:230:992","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1178,"deps":["prop:relation_fermee"],"decls":["Causal.Causality.GloballyHyperbolic.isClosed_le_and_isClosed_J","Causal.Causality.GloballyHyperbolic.isClosed_Jplus_singleton","Causal.Causality.isClosed_Jplus_of_isCompact"],"ndecls":3,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $M$ be a topological spacetime. If $M$ is\ntarentin and globally hyperbolic, then $\\leq_M$ is closed in $M\\times M$ and $J^\\pm(K)$ is closed\nfor every compact $K\\subset M$.\n\\end{prop}"},{"id":"prop:GH_fortement_causal","block":"ETT.tex:230:992","kind":"proposition","num":"","title":"","bucket":"B","lean":"partial","nl":"proved","line":1199,"deps":["prop:GH_Jferme"],"decls":["Causal.Causality.GloballyHyperbolic.exists_diamond_subset","Causal.Causality.GloballyHyperbolic.stronglyCausal","Causal.Causality.GloballyHyperbolic.stronglyCausalOpen"],"ndecls":3,"findings":["The proof ends: 'The open set Int J_M(a,b) contains p, is contained in U and is causally convex in M.' Causal convexity of the open diamond is not proved: for x, y in the interior of J(a,b) and x <= z <= y one gets z in J(a,b), not z in its interior. The full diamond J(a,b) is causally convex and is a neighbourhood of p, which proves the statement if the neighbourhood V of def:strongly_causal_spacetime need not be open; an open V is obtained under two-sided causal openness."],"notes":"Proved with the full diamond J(a,b) as causally convex neighbourhood (`StronglyCausal`), under the paper's hypotheses; and with the open diamond (`StronglyCausalOpen`) under two-sided causal openness, which the paper does not assume.","twin":"","tex":"\\begin{prop} Let $M$ be a tarentin topological spacetime.\nIf $M$ is globally hyperbolic, then $M$ is strongly causal.\n\\end{prop}"},{"id":"prop:cont_ext_cont","block":"ETT.tex:230:992","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":1219,"deps":[],"decls":["Causal.Causality.AdmissiblePast.continuous_measure_Jminus","Causal.Causality.AdmissibleFuture.continuous_measure_Jplus"],"ndecls":2,"findings":["The measurability of K^-(p), which rem:K_borelien establishes, is not needed: property 4. gives a measurable null set Z containing J^-(p) minus K^-(p), and inner regularity applied to J^-(p) minus Z, a measurable subset of K^-(p) with the measure of J^-(p), does what the proof asks.","Property 4. is used for A = {p} only."],"notes":"","twin":"","tex":"\\begin{prop}\nLet $M$ be a topological spacetime. If $M$ is\ntarentin and globally hyperbolic and if $\\mu$ is a measure admissible in the past (resp. in the\nfuture) on $M$, then $p\\mapsto \\mu(J^-(p))$ (resp. $p\\mapsto \\mu(J^+(p))$) is continuous.\n\\end{prop}"},{"id":"def:cauchy_time_function","block":"ETT.tex:230:992","kind":"definition","num":"","title":"Cauchy time function","bucket":"A","lean":"closed","nl":"definition","line":1251,"deps":[],"decls":["Causal.Causality.IsCauchyTimeFunction","Causal.Causality.CausalCurveIn","Causal.Causality.StrictlyExtends","Causal.Causality.Extensible","Causal.Causality.Inextensible","Causal.timelikeLine_inextensible_id","Causal.timelikeLine_not_inextensible_Icc","Causal.Causality.exists_naive_extension","Causal.timelikeLine_isCauchyTimeFunction_id","Causal.timelikeLine_not_inextensible_min","Causal.Causality.StrictlyExtendsPast","Causal.Causality.StrictlyExtendsFuture"],"ndecls":20,"findings":["Ruled by DEC-13 (2026-10-30): the strict-extension definition is confirmed, and past-/future-inextensibility are defined (StrictlyExtendsPast/Future: the image of φ is a final/initial segment of I'); Inextensible ↔ PastInextensible ∧ FutureInextensible (inextensible_iff), exchanged by time reversal (dual_pastInextensible_iff, dual_futureInextensible_iff).","Inextensible (used ~20 times, ruled DEC-11 as maximal under extension): with DEC-6 the naive 'larger domain, same values' extension makes every curve extensible by a constant piece (exists_naive_extension), so nothing would be inextensible and every time function would be a Cauchy time function. Formalized: (I', c') strictly extends (I, c) iff c' is a causal curve over the interval I', some strictly increasing φ : I → I' with interval image has c' ∘ φ = c on I, and the image grows (c' takes a value c does not).","Reparametrisation must be allowed: with domain inclusion alone every curve over ℝ (constant ones included) is inextensible, because no interval strictly contains ℝ, and no Cauchy time function could exist.","Sanity: on the timelike line id : ℝ → ℝ is inextensible, id : [0,1] → ℝ is not, and t ↦ min t 0 over ℝ is not (timelikeLine_inextensible_id, timelikeLine_not_inextensible_Icc, timelikeLine_not_inextensible_min); the last exercises the reparametrisation clause: its constant tail is squeezed by φ into [0,1[ and the extension rises after it, which no extension with φ = id can do. id is a Cauchy time function (timelikeLine_isCauchyTimeFunction_id).","def:cauchy_time_function quantifies over curves c : ℝ → M, def:cauchy_surface over curves on intervals. They see the same curves only when inextensible curves have open domains: under causal arc-connectedness, causality and J^±(p) ≠ {p}, every inextensible curve over an interval is a reparametrised inextensible curve over ℝ (Inextensible.reparam). Without these hypotheses an inextensible curve can have a closed end (a point with J^-(p) = {p}).","φ is automatically a homeomorphism onto its image (strictly increasing, interval onto interval, hence an order isomorphism); it is not asked to be continuous. 'The image grows' differs from parametrised maximality in non-causal spacetimes: a surjective curve, or a closed causal loop run forever, is inextensible under it although a longer parametrisation exists. Both are disclosed in Inextensible's SCOPE."],"notes":"No `sorry` beneath the strict part. A DEC-10 time function tending to ∓∞ along every inextensible causal curve over ℝ; inextensibility as ruled by DEC-11/DEC-13, two- and one-sided. WP-7, audited twice.","twin":"","tex":"\\begin{defi}[Cauchy time function]\\index{Cauchy time function} Let $M$ be a topological spacetime. A time function $T$ is a Cauchy time function\nif for every inextensible causal curve $c:\\RR\\rightarrow M$,\n$$-\\lim_{-\\infty} (T\\circ c) = \\lim_{+\\infty}(T\\circ c) = +\\infty.$$\n\\end{defi}"},{"id":"theo:geroch","block":"ETT.tex:230:992","kind":"theorem","num":"","title":"Generalised Geroch","bucket":"D","lean":"partial","nl":"proved","line":1256,"deps":["prop:cont_ext_cont","prop:GH_fortement_causal"],"decls":["Causal.Causality.geroch","Causal.Causality.geroch_i_imp_ii","Causal.Causality.GloballyHyperbolic.isCauchyTimeFunction_gerochTime","Causal.Causality.gerochTime","Causal.Causality.isTimeFunction_gerochTime","Causal.Causality.isOpenMap_gerochTime","Causal.Causality.continuous_gerochTime","Causal.Causality.gerochTime_lt","Causal.Causality.gerochTime_le","Causal.Causality.gerochTime_dual","Causal.Causality.exists_le_of_bddBelow","Causal.Causality.tendsto_atBot_gerochTime"],"ndecls":28,"findings":["ETT.tex:1300 (ii)⇒(iii) 'take S = T⁻¹(0)' is false for a Cauchy time function in the sense of DEC-10 alone (≤ ↦ ≤, ≪ ↦ <): on 1+1 Minkowski space T(t,x) = t − g(x), with g smooth bounded, |g'| ≤ 1 and g(x) = x on [0,1], is continuous, open, non-decreasing along ≤, increasing along ≪, and tends to ±∞ along every inextensible causal curve, yet T⁻¹(0) contains the null segment from (0,0) to (1,1), which the inextensible null line t = x meets infinitely often. Not formalized (no Minkowski plane in the library). This is why the author ruled DEC-15 ((ii) asks T strictly increasing along ≤); with it the step is proved (geroch_ii_imp_iii), and the T of (i)⇒(ii) is strict (gerochTime_lt). The DEC-10-only form of (ii)⇒(iii) and its sorry were removed.","The open-map gap WP-1 found in (i)⇒(ii) is closed (isOpenMap_gerochTime), with no added hypothesis: in a causally arc-connected causal T1 spacetime with J^-(x) ≠ {x}, J^+(x) is never a neighbourhood of x (Jplus_not_mem_nhds), so the tarentin diamond J(p,q) ⊂ V around x (V causally convex, from strong causality) has p ≠ x ≠ q, T(p) < T(x) < T(q), and [T p, T q] ⊂ T(V) by the intermediate value theorem along a causal curve from p to q. The same lemma gives chronology, x ≪ y ⇒ x ≠ y (ne_of_lt_top), which ≪ ↦ < needs.","ETT.tex:1274 't⁺ : x ↦ μ₊(J⁺(x)) and t⁻ : x ↦ −μ₋(J⁻(x)) are time functions': both are non-increasing along ≤ (J⁺(x) shrinks and J⁻(x) grows as x moves to the future), so neither is a time function as stated. T = log(−t⁻/t⁺) has the right sign and is the one formalized; the time-function property of −t^± is not proved here.","ETT.tex:1291 'If I = ]0,1] then c is extensible by setting c(0) = p' needs two repairs, both available in the sketch: (a) the adjoined point must be causally related to the curve inside small open sets, which is proved from closed causal pasts, strong causality and causal arc-connectedness (causalCurveIn_insert); in a general spacetime it fails; (b) if c is constant near 0 then p is already on the curve and nothing is extended; prepending a curve from q' ∈ J⁻(p) ∖ {p} (the I = [0,1] step) repairs it (extensible_of_tendsto).","ETT.tex:1287–1290 the uniqueness-of-the-accumulation-point step needs neither Hausdorffness nor a second accumulation point: one causally convex neighbourhood of an accumulation point that the curve visits arbitrarily far in the past contains the whole tail (tendsto_of_mapClusterPt). T2 is still used upstream in (i)⇒(ii), for strong causality (prop:GH_fortement_causal) and for the closedness of J⁻(x) (prop:GH_Jferme); only this step avoids it.","(i)⇒(ii) uses neither local compactness nor strong causality as a hypothesis (strong causality follows from global hyperbolicity, prop:GH_fortement_causal); (ii)⇒(iii) uses neither the measures, nor tarentin, nor local compactness, and only T1.","The sketch takes 'a decreasing sequence (x_n) converging to 0' for curves over I = [0,1] or ]0,1], while def:cauchy_time_function is about curves over ℝ; formalized over ℝ with x_n = −n and a log reparametrisation onto ]0, ∞[.","The hypotheses of theo:geroch are jointly satisfiable: on the timelike line the standard Gaussian measure is admissible in the past and in the future (timelikeLine_admissible_past_and_future; K⁻(a) ⊇ ]−∞,a[, so J⁻(A)∖K⁻(A) has at most one point and is null, the argument of lightlikeLine_admissible_past_and_future in Causal/MeasureRemarks.lean). geroch_i_imp_ii then gives a strict Cauchy time function (timelikeLine_exists_strict_isCauchyTimeFunction), and timelikeLine_geroch_tfae instantiates geroch_tfae. The construction is due to the WP-7 audit; the earlier claim that no admissible measure exists in the library was wrong.","(i)⇒(ii) is proved in the one-sided form of the sketch (ETT.tex:1295–1296, DEC-13): T → −∞ along every past-inextensible causal curve over ℝ (tendsto_atBot_gerochTime_of_pastInextensible) and T → +∞ along every future-inextensible one (tendsto_atTop_gerochTime_of_futureInextensible); the extension built is at the past end (pastExtensible_of_forall_le).","Witness only (the theorem is WP-7's). DEC-15's counterexample is now a Lean theorem, with a LOCAL (absolutely minimal) causality, not Causality.ofRelation: on R^{1,n}, n >= 1 (n = 1: minkowski2_dec15), T(t,x) = t - g(x) with g(x) = max(0, min(<x,e>, 1)) (bounded, 1-Lipschitz, g(tau e) = tau on [0,1]) is a Cauchy time function in the DEC-10 sense, is not strictly increasing along <= ((0,0) <= (1,e), same T), and T^{-1}(0) contains the null segment {(tau, tau e)} and is not a Cauchy surface (DEC-14): the null line tau -> (tau, tau e), inextensible, meets it at least twice. This confirms why l.1300 'it suffices to take S = T^{-1}(0)' needs DEC-15. The time coordinate is a strictly increasing Cauchy time function (minkowski_time_strict), so (ii) as ruled is satisfiable there.","Lean declarations of this witness (not row decls, so as not to overwrite WP-7's theo:geroch row): Causal.minkowski_dec15, Causal.minkowski2_dec15, Causal.staticCausality.not_strict_and_not_isCauchySurface, Causal.staticCausality.isCauchyTimeFunction_sub, Causal.staticCausality.isTimeFunction_sub, Causal.staticCausality.tendsto_time_atTop, Causal.staticCausality.tendsto_time_atBot, Causal.staticCausality.inextensible_nullLine, Causal.minkowski_inextensible_nullLine, Causal.minkowski_time_strict, Causal.Causality.Inextensible.not_tendsto_atBot, Causal.Causality.Inextensible.not_tendsto_atTop, Causal.Causality.inextensible_of_unbounded."],"notes":"(i)⇒(ii) and (ii)⇒(iii) proved in the strict library with no sorry, (ii) strict as ruled by DEC-15, the Geroch time function shown open; the equivalence (`geroch`, scaffold) rests on the cited (iii)⇒(i) alone. The hypotheses are jointly satisfiable (the timelike line with a Gaussian measure). DEC-15's counterexample is a Lean theorem on Minkowski space (minkowski2_dec15). (WP-7, WP-9, audited)","twin":"","tex":"\\begin{theo}[Generalised Geroch]\\index{Theorem!Geroch}\nLet $M$ be a metrizable, locally compact topological spacetime.\nAssume moreover that $M$ is tarentin, causally arc-connected and locally causally convex, and that\n$J^\\pm(p)\\neq \\{p\\}$ for every $p\\in M$.\nIf $M$ admits a pair $(\\mu_+,\\mu_-)$ of measures admissible respectively in the future and in the\npast, then the following are equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n\\item $M$ is globally hyperbolic;\n\\item $M$ admits a Cauchy time function;\n\\item $M$ admits a Cauchy hypersurface.\n\\end{enumerate}\n\\end{theo}"},{"id":"defi:causal_Ealpha","block":"ETT.tex:1319:1322","kind":"definition","num":"","title":"Causal structure of the model spaces","bucket":"D","lean":"partial","nl":"definition","line":1335,"deps":[],"decls":["Causal.Massive","Causal.massive","Causal.massive_le_top_iff","Causal.massive_lt_top_iff","Causal.massive_isOpen_I","Causal.singLine","Causal.regPart","Causal.singLine_chronalCurveOn","Causal.singLine_lt","Causal.singLine_locallyChronal","Causal.Cone","Causal.StaticCurve"],"ndecls":23,"findings":["l.1327-1329 gives the metric -dt^2+dr^2+r^2 dtheta^2 for every alpha without saying that theta runs over R/alphaZ: the angle alpha enters only through the period of theta, which the sentence should state ('theta in R/alpha Z').","For alpha > 0, E_alpha = R x C_alpha with C_alpha the Euclidean cone over the circle of length alpha, d^2 = r1^2 + r2^2 - 2 r1 r2 cos(min(delta, pi)); proper and geodesic for every alpha > 0, alpha > 2pi included (there geodesics between directions >= pi apart run through the apex and are not unique). The relations defined by curves in every open set form a causality, I^pm_U(A) open, and the singular line {r = 0} is a chronal curve in every open set containing it ('timelike, hence locally chronal', l.1341, confirmed).","The sentence 'On any E>=0-manifold there is then a unique causal structure inducing that of E_alpha in every chart' (l.1339-1341) is the (G,X) part, not addressed.","Formalized for Minkowski space R^{1,n} (and every static R x X over a geodesic space): the relations defined by curves in every open set form a causality (axioms (a)-(c), << transitive, I^pm_U(x) open), as l.1336-1339 assert; the openness of I^pm needs the geodesic hypothesis (a perturbed endpoint is reached by a geodesic segment inside a ball of U). The sentence 'On any E>=0-manifold there is then a unique causal structure...' (l.1339-1341) is not addressed.","l.1337 does not define 'future chronological curve'. The uniform reading (c-Lipschitz for one c < 1) and the pointwise one (speed < 1 at every point, supremum possibly 1) define the same <<_U in every open U, so no question to the author is needed: a pointwise-timelike curve has strict chords d(gamma s, gamma s') < |s - s'|; a fine enough inscribed polygon of geodesic segments stays in a thickening of the compact graph, hence in U, and its finitely many slopes have a maximum c < 1. The argument is in prose (Static.lean SCOPE), not formalized; causallyArcConnected independently proves that staticLt U is equivalent to a chronal curve of Causal/Curves.lean in U. (Question withdrawn after audit.)"],"notes":"For α > 0: E_α is the static spacetime ℝ × C_α over the flat cone (a proper geodesic metric space), with the curve-defined causality; the singular line is timelike and locally chronal; E_{2π} ≅ Minkowski. κ = 0 and the (G,X) uniqueness sentence are not covered. (WP-10, WP-9, audited)","twin":"","tex":"\\begin{defi}[Causal structure of the model spaces]\nThe causal and chronological orders of $\\mass{\\alpha}$ give rise to a sheaf with values in\n$\\mathbf{C}$: for $\\U\\subset \\mass{\\alpha}$ open and $x,y\\in \\U$, one sets $x\\leq_\\U y$ (resp.\n$x\\ll_\\U y$) if and only if there is a future causal (resp. chronological) curve from $x$ to $y$\nin $\\U$. On any $\\mass{\\geq0}$-manifold $M$ there is then a unique causal structure inducing that\nof $\\mass{\\alpha}$ in every chart, and $I^\\pm(x)$ is always an open --- possibly empty --- subset\nof $M$. For $\\alpha>0$ the singular line is timelike, hence locally chronal.\n\\end{defi}"},{"id":"defi:causal_E0","block":"ETT.tex:1319:1322","kind":"definition","num":"","title":"Causal structure at a BTZ point","bucket":"D","lean":"none","nl":"definition","line":1344,"deps":[],"decls":["Causal.Causality.BTZAxioms"],"ndecls":1,"findings":["l.1329-1331 (the sentence before the definition; the audit cited l.1327) give E_0 the metric −dτ² + dρ² + ρ²dθ² and call its singular locus {ρ = 0} a lightlike line. With that metric ∂_τ has norm −1 on {ρ = 0}, so the line is timelike, contradicting 'lightlike' (and defi:causal_E0's I^-(p) = ∅). Most likely a transcription error: the flat extreme-BTZ metric has the form −2 dτ dρ + ρ² dθ², for which {ρ = 0} is lightlike. (Auditor's side observation, by hand; nothing in WP-11 depends on the metric.)","The sentence I^+(p) = J^+(p) \\ sing_0 (l.1352-1355) is flagged in the source at l.1351 as quoted from the thesis where it is asserted without proof; WP-11's field Iplus_eq assumes it, globally, and lt_of_le_of_not_mem, K_monotone, K_densite_sing, K_ordre and mesure_admissible rest on it.","DEC-64 (2026-11-02), the l.1351 'verify' answered: the sentence I^+(p) = J^+(p) \\ sing_0 is FALSE in E_0 (gx review of the CBG geometry interface, C1; by hand, not formalized: the library has no E_0). For the metric −2dτdr + dr² + r²dθ² a future causal vector has r' ≥ 0 and 2τ'r' ≥ r'² + r²θ'², so f = τ − r/2 is non-decreasing along causal and strictly increasing along timelike curves; the radial null ray t ↦ (t/2, t, θ₀) from p = (0,0) reaches x = (s/2, s, θ₀), s > 0, so x ∈ J^+(p) \\ sing_0 while f(x) = f(p) gives x ∉ I^+(p) (locally I^+(p) = {r > 0, τ − τ(p) > r/2}). 'Every non-BTZ point of the causal future of p lies in its chronological future' fails along the null ray. The true statement, now the field Iplus_of_lt of BTZAxioms: for p < p' on the BTZ line, J^+(p') \\ sing_0 ⊂ I^+(p) (a regular y ≥ p' has r(y) > 0 and f(y) ≥ f(p') > f(p)). Every use the paper makes of the sentence (prop:K_monotone l.1630, prop:K_densite_sing) needs only that form, at a point strictly below a BTZ point; the statements of those propositions are unaffected. The thesis states the sentence the same way."],"notes":"Not formalized; its causal facts are fields of BTZAxioms (SingularFlat). (WP-11, audited) DEC-64 (2026-11-02): the field Iplus_eq (I^+(p) = J^+(p) \\ sing_0, the sentence of l.1352-1355) is false in E_0 and was replaced in the strict library by Iplus_of_lt (p ≤ p', p ≠ p', both BTZ ⇒ J^+(p') \\ sing_0 ⊂ I^+(p)), true in E_0; lt_of_le_of_not_mem (false at the same pair) is deleted for lt_of_lt_of_le_of_not_mem; K_monotone, K_densite_sing and K_ordre are re-proved; mesure_admissible is unchanged (it takes the re-proved K_monotone) from the corrected field with their statements unchanged; Causality","twin":"","tex":"\\begin{defi}[Causal structure at a BTZ point]\nFor $\\alpha=0$ the singular line is lightlike: locally causal, but not locally chronal. More\nprecisely \\cite[Section~1.2]{brunswic2021cauchy}, for a singular point $p\\in \\sing(\\mass{0})$,\n$$I^-(p)=\\emptyset \\qquad\\text{and}\\qquad J^-(p)=\\{\\r=0,~\\tau\\leq \\tau(p)\\},$$\nthat is, the causal past of $p$ is exactly the singular half-line below $p$. In particular a BTZ\npoint is strongly tarentin in the future but not in the past, and a $\\mass{\\geq0}$-manifold with at\nleast one extreme BTZ white hole is not past distinguishing.\n\nDually, the chronological future of a BTZ point $p$ is\n$$I^+(p)=\\reg\\left(J^+(p)\\right)=J^+(p)\\setminus \\sing_0\\left(\\mass{0}\\right):$$\nevery non-BTZ point of the causal future of $p$ lies in its chronological future.\n\\end{defi}"},{"id":"rem:btz_pas_tarentin","block":"ETT.tex:1319:1322","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":1358,"deps":["defi:causal_Ealpha","defi:causal_E0"],"decls":["Causal.massive_Zplus","Causal.massive_Zminus"],"ndecls":2,"findings":[],"notes":"For α > 0 every point is strongly tarentin both ways (Z⁺ = Z⁻ = E_α); the BTZ half is a field of SingularFlatAxioms. (WP-10, audited)","twin":"","tex":"\\begin{rem}\nEvery point of a $\\mass{\\geq 0}$-manifold is strongly tarentin in the future, and the points which\nfail to be strongly tarentin in the past are exactly the BTZ points: this is immediate from\nDefinitions \\ref{defi:causal_Ealpha} and \\ref{defi:causal_E0} read in a chart.\n\\end{rem}"},{"id":"rem:sing_tarentin","block":"ETT.tex:1319:1322","kind":"remark","num":"","title":"","bucket":"D","lean":"partial","nl":"informal","line":1364,"deps":[],"decls":["Causal.massive_tarentin"],"ndecls":1,"findings":[],"notes":"E_α (α > 0) is tarentin. (WP-10, audited)","twin":"","tex":"\\begin{rem}\nEvery $\\mass{\\geq0}$-manifold is a tarentin topological spacetime.\n\\end{rem}"},{"id":"cexemple:misner_tarentin","block":"ETT.tex:1319:1322","kind":"counterexample","num":"","title":"","bucket":"D","lean":"partial","nl":"cited","line":1368,"deps":[],"decls":["Causal.Causality.not_tarentin_of_no_past","Causal.Causality.not_tarentin_of_Jminus_eq","Causal.sourceLine","Causal.sourceLine_le_top","Causal.sourceLine_no_past","Causal.no_past_not_enough","Causal.radialLine","Causal.radialLine_tarentin","Causal.radialLine_isCausal","Causal.radialLine_Jminus_zero","Causal.radialLine_Jplus_zero","Causal.radialLine_le_top"],"ndecls":12,"findings":["ETT.tex:1370-1371: 'a singular point has no past. Hence M is not tarentin' is not a valid inference by itself. Tarentin at x gives p ≤ x ≤ q near x with x ∈ Int J(p,q); with no past p = x, so only J^+(x) ∈ 𝓝 x follows, a contradiction only if the causal future of the Misner singular point is not a neighbourhood of it, which the paper does not say. Lean: not_tarentin_of_no_past (with that hypothesis; its hypotheses witnessed by sourceLine_no_past, non-local). That 'no past' alone does not exclude tarentin is proved in Lean for non-local causalities only: no_past_not_enough (radialLine on ℝ, y ≤ z ⇔ y = z ∨ |y| < |z|, Causality.ofRelation; tarentin at 0 only because its relation crosses the origin, kb/0019). For the paper's local causalities the finding rests on a planar argument (the auditor's, by hand, not formalized): on ℝ² let x ≤_U y iff x = y or a curve in U along which |·| strictly increases joins them, and x ≪_U y iff such a curve does; it is causally arc-connected, hence absolutely minimal, causal, and tarentin (at 0 take p = 0, |q| = ε/2, so J(0,q) contains the open disc of radius ε/2; at x ≠ 0 take p = (1-t)x, q = (1+t)x), with J^-(0) = {0} and J^+(0) = ℝ². It refutes the inference, not the counter-example."],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: M a singular E-manifold with a Misner singularity (constructed in [thesis]) → strengthened (not constructed (no Misner singularity, no singular E-manifolds in the library); the mechanism is stated for any topological spacetime with a point x); 'a singular point has no past' → carried (no past near x (∃ N ∈ 𝓝 x, p ∈ N, p ≤ x ⇒ p = x), or J^-(x) = {x}); (not in the paper's argument) → strengthened (J^+(x) is not a neighbourhood of x: needed, see findi","twin":"","tex":"\\begin{cexemple}\nConsider a singular $\\mass{}$-manifold $M$ containing a Misner singularity, as constructed in\n\\cite{thesis}. The causality extends to all of $M$, but every causal curve issued from a\nsingular point is future directed, so a singular point has no past. Hence $M$ is not tarentin.\n\\end{cexemple}"},{"id":"rem:pushup","block":"ETT.tex:1319:1322","kind":"remark","num":"","title":"Push-up","bucket":"D","lean":"partial","nl":"informal","line":1374,"deps":["defi:pushup"],"decls":["Causal.massive_pushUp","Causal.massive_pushUpOn","Causal.staticLt_of_staticLt_of_staticLe","Causal.staticLt_of_staticLe_of_staticLt","Causal.staticCausality.pushUp","Causal.staticCausality.pushUpOn","Causal.minkowski_pushUp"],"ndecls":7,"findings":["The wording finding of WP-9 applies verbatim to E_alpha: the concatenation itself is not chronological; its end points are joined by a chronological curve in the same open set (Static.staticLt_of_staticLt_of_staticLe).","l.1375-1376 'the concatenation of a future causal curve with a future chronological one is future chronological' is false for the concatenated curve itself: a chronological curve followed by a null segment is not chronological (it has a null piece). What holds, and what the 'Equivalently' formula and defi:pushup need, is that the END POINTS are chronologically related in the same open set, through another curve: Lean re-times the concatenation (the chronological part sped up, the causal part slowed down) inside a tube of U (staticLt_of_staticLt_of_staticLe). Suggested wording: '...the end points of the concatenation of a future causal curve with a future chronological one are joined by a future chronological curve in the same open set.'"],"notes":"Push-up in every open subset of every static spacetime over a geodesic space, hence of Minkowski space and of E_α, α > 0. (WP-10, WP-9, audited)","twin":"","tex":"\\begin{rem}[Push-up]\nIn the model spaces, the concatenation of a future causal curve with a future chronological one is\nfuture chronological. Equivalently, for every $x$,\n$$J^+(I^+(x))\\subset I^+(x)\\quad\\text{and}\\quad I^+(J^+(x))\\subset I^+(x),$$\nand symmetrically in the past. Since this holds in every open subset of $\\mass{\\kappa}$, the model\nspaces have the push-up property of Definition \\ref{defi:pushup}.\n\\end{rem}"},{"id":"cor:model_minimal","block":"ETT.tex:1319:1322","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1386,"deps":["cor:causalement_connexe_minimal"],"decls":["Causal.massive_causallyArcConnected","Causal.massive_absolutelyMinimal","Causal.staticCausality.causallyArcConnected","Causal.staticCausality.absolutelyMinimal","Causal.staticCausality.causalCurveOn_graph","Causal.staticCausality.chronalCurveOn_graph","Causal.minkowski_absolutelyMinimal","Causal.minkowski_causallyArcConnected"],"ndecls":8,"findings":["For alpha > 0 the paper's proof is the formal one: causal arc-connectedness of E_alpha (which the paper cites to [thesis, brunswic:hal-01317447]) is proved here, and cor:causalement_connexe_minimal concludes.","The graphs of 1-Lipschitz (resp. c-Lipschitz, c<1) maps are causal (resp. chronal) curves of Causal/Curves.lean (DEC-6), which is the bridge between defi:causal_Ealpha's curves and def:causal_arc_connectedness."],"notes":"E_α (α > 0) is causally arc-connected, hence absolutely minimal, as the paper argues. (WP-10, WP-9, audited)","twin":"","tex":"\\begin{cor} For every $\\kappa\\geq 0$ the causality of $\\mass{\\kappa}$ is absolutely minimal.\n\\end{cor}"},{"id":"cor:massA_causalite","block":"ETT.tex:1319:1322","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1396,"deps":["cor:model_minimal","prop:GX_sing_espace_temps_topo","theo:causalite_engendre"],"decls":["Causal.massA_causalite","Causal.IsAtlasCausality","Causal.massA_singular","Causal.massA_positive","Causal.massA_positive_minkowski","Causal.minkowski_model_facts","Causal.massive_model_facts","Causal.massiveOf"],"ndecls":8,"findings":["ETT.tex:1400-1405: the proof checks absolute minimality of the models (cor:model_minimal) and Baire, but prop:GX_sing_espace_temps_topo asks causal arc-connectedness of X and of each X_α ((a), (b)) — the premise of cor:model_minimal, not its conclusion — and the second half of (b) (the causality of X_α extends that of reg(X_α)), which the proof does not check. Baire is not needed (OQ-10)."],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: E≥0-manifold → strengthened (the abstracted singular (G,X)-atlas of Causal.existsUnique_causality_singularGX (prop:GX_sing_espace_temps_topo; OQ-19, ruled by DEC-25 in gx's terms, not yet reconciled)); model spaces E_κ, κ ≥ 0 (cor:model_minimal) → strengthened (E^{1,2} and Isom(E^{1,2}) discharged (minkowski_model_facts); E₀: causal arc-connectedness is the hypothesis hb at the BTZ model (the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0","twin":"","tex":"\\begin{cor} Every $\\mass{\\geq 0}$-manifold carries a natural absolutely minimal causality.\n\\end{cor}"},{"id":"cor:massA_cac","block":"ETT.tex:1319:1322","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1408,"deps":["rem:cac_local","prop:GX_sing_espace_temps_topo","prop:cac_engendre"],"decls":["Causal.massA_cac","Causal.ChartIso.causallyArcConnectedOn","Causal.ChartIso.curveOn_symm","Causal.massA_singular","Causal.massA_positive"],"ndecls":5,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: E≥0-manifold → strengthened (IsAtlasCausality for the abstracted atlas (OQ-19 / DEC-25), models causally arc-connected; E₀'s causal arc-connectedness is the named hypothesis hb (the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0)). For E_κ, κ > 0: causal arc-connectedness and push-up are discharged (massive_model_facts); the second half of (b) of prop:GX_sing_espace_temps_topo — the regular charts of E_κ are isomorphisms onto E^{1,2}, hre","twin":"","tex":"\\begin{cor} Every $\\mass{\\geq 0}$-manifold is causally arc-connected.\n\\end{cor}"},{"id":"cor:pushup_sing","block":"ETT.tex:1319:1322","kind":"corollary","num":"","title":"","bucket":"D","lean":"partial","nl":"proved","line":1419,"deps":["cor:massA_causalite","rem:pushup","cor:massA_cac","lem:pushup_local"],"decls":["Causal.pushup_sing","Causal.ChartIso.pushUpOn","Causal.Causality.PushUp.pushUpOn","Causal.massA_singular","Causal.massA_positive"],"ndecls":5,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Stated and proved with no sorry; partial, unmarked. Hypotheses: E≥0-manifold → strengthened (IsAtlasCausality for the abstracted atlas (OQ-19 / DEC-25); models causally arc-connected and with push-up (rem:pushup); E₀'s push-up is the named hypothesis hpY (the E₀ instance is not in lean-causal (DEC-134, T-ett-port-e0)); E^{1,2} discharged. For E_κ, κ > 0: causal arc-connectedness and push-up are discharged (massive_model_facts); the second half of (b) of prop:GX_sing_espace_temps_topo — the regular charts of E_κ ","twin":"","tex":"\\begin{cor}\nEvery $\\mass{\\geq0}$-manifold has the push-up property.\n\\end{cor}"},{"id":"prop:GX_sing_dec","block":"ETT.tex:1319:1322","kind":"property","num":"","title":"[brunswic2021cauchy]","bucket":"D","lean":"none","nl":"cited","line":1435,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"T-ett-unanchored (atlas-team, 2026-11-20), audit AUDIT-1 minor (fixed in round 1). Not attempted. Not attempted: cited (Cor. 1.7 of brunswic2021cauchy), a smooth statement; the library has no smooth structure on a singular (G,X)-manifold, and no submanifolds. Its topological consequences stand in as the fields t2, secondCountable, metrizable, locallyCompact, noIsolated, isClosed_sing, interior_sing of SingularFlatAxioms (Causal.SingularFlat).","twin":"","tex":"\\begin{propri}[{\\cite[Cor.~1.7]{brunswic2021cauchy}}]\nA $\\mass{\\geq 0}$-manifold $M$ is a smooth $3$-manifold and its singular locus is a closed\n$1$-submanifold. Furthermore, for every $\\alpha\\in \\RR_+$, $\\sing_\\alpha(M)$ is a closed\n$1$-submanifold.\n\\end{propri}"},{"id":"lem:IJ_calc","block":"ETT.tex:1319:1322","kind":"lemma","num":"","title":"Computation of I^ and J^ in the model spaces","bucket":"D","lean":"partial","nl":"proved","line":1441,"deps":["defi:causal_Ealpha","defi:causal_E0","rem:pushup"],"decls":["Causal.massive_IJ_calc","Causal.staticCausality.interior_Jplus_inter_Zminus","Causal.staticCausality.interior_Jminus_inter_Zplus","Causal.staticCausality.interior_Jplus","Causal.staticCausality.interior_Jminus","Causal.staticCausality.mem_Zplus","Causal.staticCausality.mem_Zminus","Causal.minkowski_IJ_calc"],"ndecls":8,"findings":["Missing citation, not an error. The proof (l.1446-1447, l.1452-1454) passes from 'I^-(q) is non-empty' to 'q in Z^-' (and from non-empty chronological futures to Z^+ = E_kappa). That step is rem:absolutely_minimal_topological_spacetime (l.780-782), which applies because the models are absolutely minimal by cor:model_minimal (l.1386); Lean's proof goes the same way (AbsolutelyMinimal.mem_Zminus_iff). Suggested wording: '... so I^-(q) is non-empty and therefore, by Remark rem:absolutely_minimal_topological_spacetime and Corollary cor:model_minimal, q in Z^-(E_kappa).' For the static models Z^pm = M is also proved directly (mem_Zplus, mem_Zminus)."],"notes":"Int J^±(p) ∩ Z^∓ = I^±(p) for every static spacetime, Minkowski and E_α (α > 0). (WP-10, WP-9, audited)","twin":"","tex":"\\begin{lem}[Computation of $I^\\pm$ and $J^\\pm$ in the model spaces]\nFor every $\\kappa\\geq 0$ and every $p\\in \\mass{\\kappa}$,\n$$\\ring J^\\pm(p)\\cap Z^\\mp(\\mass{\\kappa})=I^\\pm(p).$$\n\\end{lem}"},{"id":"lem:densite_modele","block":"ETT.tex:1319:1322","kind":"lemma","num":"","title":"Density in the model spaces","bucket":"D","lean":"partial","nl":"proved","line":1464,"deps":["defi:causal_E0","lem:IJ_calc","lem:restriction_convexe"],"decls":["Causal.massive_densite","Causal.massive_densite_of_causallyConvexIn","Causal.staticCausality.closure_Iplus","Causal.staticCausality.closure_Iminus","Causal.staticCausality.Jplus_eq_closure_Iplus_of_causallyConvexIn","Causal.staticCausality.Jminus_eq_closure_Iminus_of_causallyConvexIn","Causal.minkowski_densite","Causal.minkowski_densite_of_causallyConvexIn"],"ndecls":8,"findings":["For alpha > 0 the proof's appeal to [brunswic2021cauchy, Section 1.2] for 'J^pm(p) is the closure of its interior' (l.1480-1482) is not needed: Z^mp(E_alpha) = E_alpha, and J^pm(p) = closure I^pm(p) follows from the vertical time shift (Static.closure_Iplus). The citation is needed only for kappa = 0."],"notes":"(a)(b) for α > 0, also in causally convex open subsets; the citation the proof gives is not needed there. (WP-10, WP-9, audited)","twin":"","tex":"\\begin{lem}[Density in the model spaces]\nLet $\\kappa\\geq 0$ and let $p\\in \\mass{\\kappa}$. Then\n\\begin{enumerate}[label=(\\alph*)]\n\\item $J^+(p)=\\overline{I^+(p)}$;\n\\item $J^-(p)=\\overline{I^-(p)}$ if $\\kappa>0$, or if $\\kappa=0$ and $p\\in \\reg(\\mass{0})$;\n\\item $J^-(p)=\\overline{J^-(p)\\setminus\\{p\\}}$ if $\\kappa=0$ and $p\\in \\sing(\\mass{0})$.\n\\end{enumerate}\nThe same holds in any causally convex open subset of $\\mass{
