 translation by 2 is an a.e. automorphism of Ẽ_θ (its developing map reads it as screw 2 1 ∈ Isom₀) which is continuous for the BTZ topology T and not for T' (GX.massCyl_timeShift_continuity).","WP-41q: DEC-87(b) rules the reading — 'Hypothesis (C) for the model spaces' (l.2137) is theo:local_virt_tame's 'Aut(X̃_α) acts T_α-continuously' (l.1975); GX.hypothesis_model_spaces_necessary certifies the remark under it. Row closed and marked (already so at WP-40d; the ruling now covers the reading). Docstring of the decl cites DEC-87(b)."],"notes":"WP-41q, audited clean.","twin":"","tex":"\\begin{rem}   Hypothesis (C) for the model spaces is necessary for the proof.  Take $\\theta \\in \\RR_+\\setminus \\{0,2\\pi\\}$ and consider $\\mass{\\theta}$ as a singular model.\nWe may choose as tamifying topology either the natural one or the tamifying topology $\\T$ we defined on $\\mass{0}$. Indeed, properties (A),(C) and (D) are purely topological and $\\BTZtilde \\rightarrow \\BTZ$ is isomorphic to $\\widetilde \\E_\\theta^{1,2}\\rightarrow \\mass{\\theta}$ in $\\CatSpread$. \nProperty (B) is certainly satisfied since $\\mass{\\theta}$ is tame.\nWe may thus construct a messed up tamifying topology on $\\widetilde \\E_\\theta^{1,2}$ by taking the topology $\\T'$ generated by the natural one and the restriction of $\\T$ to $\\{t>0\\}$. Since  the Galois group acts by 'rotation' around the 'axis' $\\{r=0\\}$ it preserves $\\T'$. However, the automorphism group also contains translations along the $t$-axis which send points from $t<0$ to $t>0$. \n\nThe proof above thus fails at the first step since the induced topology $\\T_{\\U,\\V,\\phi}$ for $\\sing(\\U)\\neq\\emptyset$ depends on whether $\\V\\subset \\{t>0\\}$ or $\\V \\subset \\{t>0\\}$ or any other intermediary cases with $(0,0,0)\\in \\V$.\n\nThat being said, the author ignores whether one could remove this hypothesis by showing that from  a given tamifying topology, the coarsest topology that makes the developing map and the automorphisms continuous would still satisfy  …"},{"id":"rem:quotient_virtually_tame","block":"RamcovGX.tex:1610:1889","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":2154,"deps":[],"decls":["GX.quotient_virtually_tame_galoisian","GX.exists_deck_lift_maxBranched","GX.base_preimage_image_galoisian","GX.quotient_virtually_tame_cover","GX.descendSet","GX.descendHol","GX.exists_descend_of_injective","GX.descend_mem_deckMapsOf","GX.isOpenMap_base_of_isTamifying","GX.quotient_virtually_tame","GX.devImageTop","GX.exists_homeomorph_devImageTop"],"ndecls":17,"findings":["l.2154: the identification uses that the fibres of N → M are Γ(N/M)-orbits (Galoisian N), which the remark does not state. WP-40d proves the remark under exactly that hypothesis, without assuming M̃ → M Galoisian (earlier forms GX.quotient_virtually_tame_cover / _of_slsc carry 'M̃ → M Galoisian', which with D injective implies N Galoisian, GX.descend_mem_deckMapsOf). No counterexample for a non-Galoisian N is known: a narrowing, not a refutation.","WP-41q: row CLOSED and MARKED under DEC-87(c) (N → M Galoisian, 'isomorphic' = homeomorphic): GX.quotient_virtually_tame_galoisian' is the remark. The narrowing finding above (non-Galoisian N: no counterexample known) stays as the record."],"notes":"WP-41q, audited clean.","twin":"","tex":"\\begin{rem} Let $M$ be a virtually tamely singular $(G,X)$-manifold. If $M$ admits an injective developing map $N\\xrightarrow{\\D}X$ for some branched covering $N\\rightarrow M$ possibly branched above $\\sing(M)$ then $M$ is isomorphic to $\\Gamma(N/M)\\backslash\\D(N)$ where \n \\begin{itemize}\n  \\item $\\Gamma(N/M)$ acts on $X$ via the holonomy of $\\D$;\n  \\item $N$ is endowed with the quotient of a tamifying topology $\\T$;\n  \\item $\\D(N)$ is endowed with the topology generated by that of $X$ and the images by $\\D$ of $\\T$.\n \\end{itemize} \n \\end{rem}"},{"id":"prop:BTZ_virt_tame","block":"RamcovGX.tex:2163","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2252,"deps":[],"decls":["GX.btz_virt_tame","GX.btzE0_virt_tame","GX.btz_isTamifyingTopology","GX.btzPaperDev_pullback","GX.btzPaperDev_pullback_minkB","GX.btzPaperDev_eq_btzDevM","GX.btz_chart_pullback","GX.btzE0_chart_pullback"],"ndecls":8,"findings":["l.2257-2258 (D-6, as planned): 'the image of U_lambda in BTZ contains {r < lambda/4pi^2} and is thus open' is a non sequitur (containing an open set does not make a set open; and the quotient topology must be checked on all T-open sets, not on the U_lambda). Repaired proof of (A): a Gamma-invariant T_BTZ-open set is open for the natural topology (translate a point of a small natural box at an axis point by the k in Gamma bringing its angle into [-alpha/2, alpha/2], where r theta^2 <= r alpha^2/4), GX.isOpen_of_isOpen_tamTop_of_invariant / GX.coinduced_orbitMk_tamTop. The statement stands.","l.2256 and l.1955-1956: (B), (C), (D) of virtual tameness are asserted in the motivational example without proof; all are proved here (D is T_BTZ-continuous and a developing map over p^{-1}(reg); Gamma(BTZ~/BTZ) = Gamma_alpha acts T-continuously; {r>0} is T-portly), as is the stronger claim that all of Aut(BTZ~) acts T-continuously (GX.btz_aut_continuous), the model hypothesis of theo:local_virt_tame (GX.btz_hasAutContinuousTamifying).","l.2249-2250: D(BTZ~) = J^+(Delta), D injective, Gamma = Z, Gamma fixing p^-1(Sing) pointwise, rho(gamma) fixing Delta pointwise and parabolic are all true and proved (GX.btz_dev_injective_range, GX.btzDeckEquiv, GX.btz_deck_fix_sing, GX.btzHol_smul_of_mem_btzLine, GX.btzHol_isParabolic); in fact rho(gamma) is parabolic and fixes Delta for EVERY gamma != 1, either generator included (GX.btzHolonomy_isParabolic, via btzHol^n = btzHol at angle n*alpha, GX.btzHol_zpow); 'Delta lightlike => phi parabolic' needs phi != 1 (D-1), which holds (alpha != 0, GX.btzHol_ne_one).","T_BTZ = T_natural inf D^*T_{M3} (GX.hornTop_eq_inf_induced, GX.btzTop_eq): the BTZ topology is the coarsest topology finer than the natural one making D continuous; relevant to defi:BTZtop / prop:quotient_chart (WP-41h).","l.1944: the printed metric '-2 dtau dr + dr^2 + r^2 dtheta' lacks a square on dtheta; with r^2 dtheta^2 it is exactly D^*(-dt^2+dx^2+dy^2) for the printed D of l.1947 (GX.btzPaperDev_pullback)."],"notes":"WP-41b, audited clean. Readings/questions: The paper's 'singular structure induced by the flat metric' (l.1944) has no library notion of metric; the file proves the structure is the one developed by the paper's D and that D^*eta is the printed metric at every point (GX.btzPaperDev_pullback, with r^2 dtheta read r^2 dtheta^2). Per audit-1's own fix this closes the row; if the master instead wants the metric-induced (G,X)-structure as a separate definition with an equality theorem, that is a new library notion (Lorentzian metric + local isometry atlas) and the row would be partial pending it.","twin":"","tex":"\\begin{prop}The $\\BTZ$ model space is virtually tame.\n \n\\end{prop}"},{"id":"prop:BTZ_manifold_virt_tame","block":"RamcovGX.tex:2163","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2262,"deps":["prop:BTZ_virt_tame","theo:local_virt_tame"],"decls":["GX.btz_manifold_virt_tame","GX.btz_xaManifold_virt_tame","GX.IsBTZSingModelled","GX.isAnalyticModelFamily_btzFam","GX.btzFam","GX.btzFamS","GX.isLocallyGaloisian_btzE0","GX.btzE0_isSLSCIn_reg_opens","GX.hasMaximalLifts_btzBox","GX.exists_xaChart_hasMaximalLifts","GX.exists_xaChart_btzBox"],"ndecls":11,"findings":["l.2266: 'Topologically, BTZ is homeomorphic to R^3 and sing(BTZ) is a line. Therefore BTZ is locally Galoisian' — local Galoisianity is about every open subset U (reg U slsc in U), not only BTZ itself; true (proved by radial contraction in cylindrical coordinates E_0 = C x R, GX.btzE0_isSLSCIn_reg_opens), but the inference from 'homeomorphic to R^3 with a line' needs the line to be straight in some global coordinates, which cylHomeomorph provides.","l.2266: the proof applies theo:local_virt_tame, whose general case is an open tagged sorry in Models (DEC-86); for E_0 every chart restricts to a box whose lifts r : V~ -> V^ are isomorphisms (a covering with simply connected regular part is maximal, GX.exists_homeomorph_maxBranched_of_simplyConnected), the case proved there, so the row closes without the open case."],"notes":"WP-41d, audited clean.","twin":"","tex":"\\begin{prop}  All $\\BTZ$-manifolds are virtually tame.\n\\end{prop}"},{"id":"defi:BTZtop","block":"RamcovGX.tex:2163","kind":"definition","num":"","title":"BTZ topology","bucket":"A","lean":"closed","nl":"definition","line":2281,"deps":[],"decls":["GX.BTZLineJplus","GX.IsBTZLightlikeLine","GX.btzLineRay","GX.btzLineGenSet","GX.btzLineGen","GX.btzLineRay_eq","GX.IsBTZLightlikeLine.btzLineRay_eq","GX.btzLineRay_subset","GX.btzLineGenSet_subset","GX.isOpen_btzLine_val_preimage","GX.isOpen_btzLine_gen","GX.btzLineTop_le_iff"],"ndecls":26,"findings":["The definition is consistent with its motivation (l.2279): the BTZ topology is exactly the image by D of T_BTZ (GX.btzJTop_eq_coinduced, from GX.btzJDevHomeomorph); D^{-1}(I+(p_s) u ]p_s,+inf[) = {s < t + kappa r} with kappa = -nullQ(v)/<v|u> (GX.btzDevM_mem_genSet_iff)."],"notes":"WP-41h, audited clean.","twin":"","tex":"\\begin{defi}[BTZ topology] Let $\\Delta$ be a lightlike line in $\\mass{}$.\nThe BTZ topology on $J^+(\\Delta)$ is the topology generated by the one induced by the natural topology of $\\mass{}$ and open subsets of the form $I^+(p)\\cup]p,+\\infty[$  for  $p\\in \\Delta$ where $]p,+\\infty[$ denote the relatively open future half-ray from $p$.\n\\end{defi}"},{"id":"prop:quotient_chart","block":"RamcovGX.tex:2163","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":2286,"deps":[],"decls":["GX.btz_quotient_chart","GX.btzE0_quotient_chart","GX.btzQuotDevHomeomorph","GX.btzQuotDev","GX.btzQuotDevInv","GX.btzJDevHomeomorph","GX.btzJStructure","GX.btzJQuot_existsUnique","GX.btzJQuotStructure","GX.btzJQuotStructure_spec","GX.btzJDev_smul","GX.btzJ_eventually_chart"],"ndecls":22,"findings":["No proof is printed (the ledger row is 'open'). The proof here: D : (cylinder, T_BTZ) -> (J+(Delta), BTZ) is a homeomorphism (GX.btzJDevHomeomorph): continuity because D^{-1}(I+(p_s) u ]p_s,+inf[) = {s < t + kappa r} is naturally open; openness at the axis from the estimate GX.btz_axis_diamond (the set I-(P_eta) n (I+(p_{t-eta}) u ]p_{t-eta},+inf[) pulls back into the horn neighbourhood {r(1+theta^2) < eps, |t'-t| < eps}); D is Gamma-equivariant and T_BTZ induces the quotient topology of E_0 (coinduced_orbitMk_tamTop), so D-bar is a homeomorphism; on regular parts both charts are translates of D.","With the BTZ topology Gamma\\J+(Delta) is Hausdorff (GX.btzJQuot_instances), in contrast with the quotient of the usual topology (l.2273).","The paper does not say which singular E^{1,2}-structure Gamma\\J+(Delta) carries (l.2286-2289). It is forced, not a reading: the regular part Gamma\\(J+(Delta)\\Delta) is the quotient of an open subset of E^{1,2} by a free, properly discontinuous group of isometries, and the singular structure extending it making the projection an a.e. morphism is unique (prop:aeGXquotient; GX.btzJQuot_existsUnique). That structure is the one used (AUDIT-2 minor: moved from questions to findings)."],"notes":"WP-41h, audited clean.","twin":"","tex":"\\begin{prop} \nIf $J^+(\\Delta)$ is endowed with the BTZ topology,\nthen the map $\\overline \\D : \\mass{0}\\rightarrow \\Gamma\\backslash J^+(\\Delta)$  is an isomorphism of singular $\\E^{1,2}$-manifold.\n\\end{prop}"},{"id":"rem:tamifying_topology_generated_open","block":"RamcovGX.tex:2163","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":2293,"deps":[],"decls":["GX.btz_tamifying_topology_generated_open_ett","GX.btz_hasBasis_nhds_diamond_ett","GX.btz_tamifying_topology_generated_open_cover_ett","GX.BTZTildeCyl","GX.btzTildeDev","GX.btzCylCausality","GX.btzCylCausality_le_top_iff","GX.btzCylCausality_lt_top_iff","GX.btzCylCausality_diamond","GX.BTZTildeCover","GX.btzTildeCoverHomeomorph","GX.btzCoverCausality"],"ndecls":34,"findings":["No proof is printed. True at every point, BTZ points included: off the axis the diamond J-(D y + eta e) n J+(D y - eta e), e = (1,1,0) in null coordinates, lies in the null box of radius 2 eta; at an axis point (apex,t) the diamond J-(P_eta) n J+((apex, t-eta)), P_eta = x0 + (t+eta, eta, 0), lies in the horn neighbourhood and its T_BTZ-interior contains I-(P_eta) n {t-eta < t' + kappa r} (GX.btz_exists_diamond).","With the ETT causality of DEC-33 the global causal order of BTZ-tilde is exactly the order of the developments in E^{1,2} (D injective onto J+(Delta)); a point of the singular line is never chronologically after anything (btzJ_mem_reg_of_lt), consistent with DEC-64."],"notes":"WP-41h, audited clean.","twin":"","tex":"\\begin{rem} The tamifying topology $\\T_{BTZ}$ is generated by $\\T_{BTZ}$-open diamond eg the sets of the form $Int_{\\T_{BTZ}}\\left(J^{-}(p)\\cap J^{+}(q)\\right)$ for $p,q\\in \\BTZtilde$.\n\\end{rem}"},{"id":"prop:manifold_admits_galoisian_maximal","block":"RamcovGX.tex:2163","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":2308,"deps":[],"decls":["GX.btz_manifold_galoisian_maximal_full","GX.btz_xaManifold_galoisian_maximal_full","GX.BTZTildeData.aeAtlas_space","GX.BTZTildeData.aePullback_proj_spec","GX.BTZTildeData.isAEMorphism_proj","GX.BTZTildeData.reg_space","GX.BTZTildeData.sing_space","GX.BTZTildeData.developsCharts","GX.BTZTildeData.isAEMorphismOf_dev","GX.BTZTildeData.hasXAType_of_mem_sing","GX.IsBTZTildeSingModelled","GX.btzTildeFam"],"ndecls":17,"findings":["l.2310: with the BTZ topology T_BTZ (finer than the natural one) it is not automatic that the singular points of M~ stay singular; proved here (GX.BTZTildeData.reg_space): a T_BTZ-chart at a point over sing M would make D, on a lifted chart, a single translate of the chart, so D(U) would be an open neighbourhood of a point of the BTZ line inside g.J+(Delta), which has empty interior there (GX.btzDevM_range_notMem_nhds). The paper does not state this fact; it is what makes 'singular points modelled on E_0~' meaningful."],"notes":"WP-48b, audited clean. Readings/questions: 'BTZ~-manifold' (l.2310) is formalized, like the hypothesis 'E_0-manifold' (l.2300, IsBTZSingModelled), by the hasType clause of DEC-67 (e): every singular point is the centre of an E_0~-chart (IsBTZTildeSingModelled). The atlas clause of IsXAManifold (every point, regular ones included, in the domain of an E_0~-chart) is neither assumed of M nor proved of M~ (it holds for the model itself, GX.btzTildeModel_isXAManifold). Is the hasType reading, symmetric with the hypothesis, the one DEC-130 intends?","twin":"","tex":"\\begin{prop} Let $M$ be a $\\mass{0}$-manifold, then $M$ admits a Galoisian maximal covering exactly branched above $\\sing(M)$ and admits a developing map continuous for the tamifying topology $\\T_{BTZ}$.\nFurthermore, $\\widetilde M$ is a $\\BTZtilde$-manifold.\n\\end{prop}"},{"id":"def:manifolds_future_distinguishing_map","block":"RamcovGX.tex:2163","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":2317,"deps":[],"decls":["GX.IsFutureDistinguishing"],"ndecls":1,"findings":["l.2317 and l.2356 state the same definition (D-8)"],"notes":"WP-46c, audited clean.","twin":"","tex":"\\begin{defi} A $\\BTZtilde$-manifolds $M$ is future distinguishing if the map $x\\mapsto I^+(x)$ defined on $M$ is injective.\n\\end{defi}"},{"id":"def:singular_manifold_endowed_causal","block":"RamcovGX.tex:2163","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":2319,"deps":[],"decls":["GX.IsCausallyConnected","GX.isCausallyConnected_of_causallyArcConnected"],"ndecls":2,"findings":[],"notes":"WP-46c, audited clean.","twin":"","tex":"\\begin{defi}\n A singular $\\mass{}$-manifold $M$ endowed with some causal pre-order $\\leq$ extending the one on $\\reg(M)$ is causally connected if \nfor all $x,y\\in M$ such that  $x\\leq y$, there exists a future causal path from $x$ to $y$.\n\\end{defi}"},{"id":"lem:globally_hyperbolic_manifolds_manifolds","block":"RamcovGX.tex:2163","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":2325,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"WP-46d, audited clean.","twin":"","tex":"\\begin{lem} Globally hyperbolic  $\\BTZ$-manifolds and $\\BTZtilde$-manifolds are future distinguishing.\n\\end{lem}"},{"id":"lem:manifolds_manifolds_causally_connected","block":"RamcovGX.tex:2163","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":2329,"deps":[],"decls":["GX.e0Manifold_isCausallyConnected","GX.BTZTildeData.natIsCausallyConnected","GX.BTZTildeData.natCausality_causalCurveOn","GX.btzTildeAtlas_isCausallyConnected","GX.BTZTildeData.isCausallyConnected"],"ndecls":5,"findings":[],"notes":"WP-46c, audited clean.","twin":"","tex":"\\begin{lem} $\\BTZ$-manifolds and $\\BTZtilde$-manifolds are causally connected.\n\\end{lem}"},{"id":"lem:increasing_map","block":"RamcovGX.tex:2163","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2334,"deps":[],"decls":["GX.BTZTildeData.natIncreasing","GX.BTZTildeData.natIncreasing_lt","GX.BTZTildeData.increasing","GX.BTZTildeData.increasing_lt","GX.btzTilde_strict_dev","GX.btzTilde_le_dev","GX.btzTilde_lt_dev","GX.BTZTildeData.natCausality_isCausal"],"ndecls":8,"findings":["l.2334 quantifies over M while D lives on M~ (D-10)","l.2338 'M connected ⇒ causally connected' needs causal connectedness of M~; proved link by link"],"notes":"WP-46c, audited clean.","twin":"","tex":"\\begin{lem} Let $M$ be a  $\\BTZ$-manifold and let $\\D:\\widetilde M\\rightarrow \\mass{}$ be a developing map.\nThen $\\D$ is  increasing on $M$ eg\n$$\\forall x,y\\in M, \\quad x<y \\Rightarrow \\D(x)<\\D(y).$$\n\\end{lem}"},{"id":"def:manifold_future_complete_all","block":"RamcovGX.tex:2163","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":2343,"deps":[],"decls":["GX.IsFutureComplete","GX.BTZTildeData.IsBTZFutureComplete","GX.btzJ0_isFutureComplete","GX.BTZTildeData.isBTZFutureComplete_iff_of_smul","GX.isFutureComplete_smul_iff","GX.btzTildeCausality_smul","GX.BTZTildeData.not_isFutureComplete_natCausality","GX.BTZTildeData.natCausality_Iplus_eq_empty"],"ndecls":8,"findings":["DEC-27 correction kept on record: read for natCausality the definition is unsatisfiable once sing M ≠ ∅ (not_isFutureComplete_natCausality). The row closes under DEC-118 (a)."],"notes":"WP-46c, audited clean.","twin":"","tex":"\\begin{defi}\n A $\\BTZ$-manifold $M$ is future complete if for all $x\\in \\widetilde M$ \n $$ \\D(J^+(x)) = J^+(\\D(x)) \\text{ and }  \\D(I^+(x)) = I^+(\\D(x)).$$\n\\end{defi}"},{"id":"prop:globally_hyperbolic_cauchy_complete_manifolds","block":"RamcovGX.tex:2163","kind":"proposition","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2348,"deps":[],"decls":["GX.btz_isBTZFutureComplete_C1","GX.isBTZFutureComplete_of_regFuture","GX.btzTilde_null_supset","GX.btzTilde_supset_of_null","GX.btzTilde_supset_of_reg","GX.btzTilde_transport","GX.btz_isFutureComplete_C1","GX.e0PastHalf_counterexample_DEC118","GX.e0PastHalf_not_isBTZFutureComplete","GX.e0PastHalf_isE0CauchyComplete","GX.e0PastHalf_counterexample_DEC31"],"ndecls":11,"findings":["As printed the proposition is false (D-11, DEC-77), now refuted with the PRINTED hypothesis AND the RULED conclusion: GX.e0PastHalf_counterexample_DEC118 (0 sorry, standard axioms) — {τ<0} ⊂ E0 is GH, Cauchy-complete in DEC-31's sense (GX.e0PastHalf_isE0CauchyComplete), has BTZ points, and NO datum of {τ<0}~ (any base point, any presentation, chartwise or not) satisfies BTZTildeData.IsBTZFutureComplete (GX.e0PastHalf_not_isBTZFutureComplete: on reg M~, r = a ∘ D with a affine; for regular x every w ≫ x is regular with r(x) ≤ r(w) ≤ r(x) − 2τ(x), so a is bounded on the open cone I+(Dx) = D(I+(x)), hence constant, while r takes the values 1 and 2). The Reg-part reading fails as well (GX.e0PastHalf_counterexample_DEC31).","The proof's l.2350 omits that Barbot's future completeness needs equality D(reg M~) = Omega+, i.e. absolute maximality (B21 Cor 2.18) and the future case; the proof cites 'Lemma 2.4' for what is B21 Lemma 2.3 (D-11 (b)).","The proof's two steps (Reg M~ future complete, l.2350; full BTZ rays, l.2352) do not by themselves give « M future complete » in DEC-118 (a)'s reading: J+ in Reg M~ is not J+ in M~. Round 2 supplies the transport of Reg M~'s causality into M~'s (GX.btzTilde_transport) and the BTZ-point charts (GX.BTZTildeData.chart_notMem_btzJReg_of_sing); what the paper's « Lemma 2.4 implies full BTZ rays » still leaves implicit is that the ray of M lifts to M~ and develops onto the whole null half-line (GX.btzTilde_null_supset).","WP-47g: the last case (the future half of the developed BTZ line at a BTZ point) is closed by GX.futureRay_null_supset (WP-47e, DEC-126); GX.btz_isBTZFutureComplete_C1 is on standard axioms.","WP-48a re-check: certified in full in DEC-77's corrected form (GH + Cauchy-compact (DEC-107 C¹) + Cauchy-maximal + π₁(Reg M) not metabelian, which DEC-119's free and non-abelian implies, + s ≥ 1 (DEC-76)), conclusion in DEC-118 (a)'s reading for every chartwise M~, with the printed form refuted by {τ<0} (GX.e0PastHalf_counterexample_DEC118); the row stays CLOSED and marked."],"notes":"WP-48a, audited clean.","twin":"","tex":"\\begin{prop} Globally hyperbolic Cauchy-complete $\\BTZ$-manifolds are future complete.\n\\end{prop}"},{"id":"def:manifolds_future_distinguishing_map_2","block":"RamcovGX.tex:2163","kind":"definition","num":"","title":"","bucket":"A","lean":"closed","nl":"definition","line":2356,"deps":[],"decls":["GX.IsFutureDistinguishing"],"ndecls":1,"findings":["verbatim repeat of def:manifolds_future_distinguishing_map (D-8)"],"notes":"WP-46c, audited clean.","twin":"","tex":"\\begin{defi} A $\\BTZtilde$-manifolds $M$ is future distinguishing if the map $x\\mapsto I^+(x)$ defined on $M$ is injective.\n\\end{defi}"},{"id":"lem:globally_hyperbolic_manifolds_maximal","block":"RamcovGX.tex:2163","kind":"lemma","num":"","title":"","bucket":"A","lean":"closed","nl":"open","line":2359,"deps":[],"decls":[],"ndecls":0,"findings":["l.2361 'not different from the proof for Lorentzian manifolds': in the natural topology the Lorentzian covering argument does not transfer as is -- the fibres of M~ -> M are infinite (Causal.Flat.Cla.isCompact_diamond_of_isFiniteCover inapplicable) and D is not naturally continuous at a BTZ end. What works: the finite-chain argument with the finitely many CENTRES as labels (GX.LiftGH.isCompact_of_liftLocalData); sheet data over reg M (liftLocalData_reg); over sing M one descending chart lifted at every point over its domain (exists_liftedChart_of_isChartwise), a box of D_inf x R for compactness (isCompact_btzBox) and the closedness of the developed order in the natural topology (isClosed_btzDevLe: at the apex it is theta-free), with a causally convex neighbourhood of E0 keeping the straight segment of J+(Delta_0) in the chart (liftLocalData_sing_of_isChartwise)."],"notes":"WP-46d, audited clean.","twin":"","tex":"\\begin{lem} Let $M$ be a Globally hyperbolic $\\BTZ$-manifolds. its maximal branched covering $\\widetilde M$ is future distinguishing.\n\\end{lem}"},{"id":"theo:globally_hyperbolic_cauchy_complete_cauchy_maximal","block":"RamcovGX.tex:2163","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":2363,"deps":["lem:increasing_map"],"decls":["GX.btz_uniformization","GX.btz_uniformization_btzRays","GX.btz_uniformization_of_mixed","GX.btz_uniformization_btzHalf","GX.btz_uniformization_C1","GX.btz_uniformization_C1_of_regM","GX.btz_uniformization_C1_of_isFreeGroup","GX.btz_uniformization_regFuture","GX.btz_uniformization_reg","GX.btz_uniformization_reg_of_regM","GX.e0RegM_range_not_subset_omegaMinus","GX.e0RegM_range_not_subset_omegaMinus_of_regM"],"ndecls":63,"findings":["DEC-129 (2026-11-08) closes this row in its ruled DEC-28 form; the correction stays a FINDING: the theorem as printed (l.2363, 'Cauchy-complete') is not supported by its citations — Barbot's equality D(Reg M~) = Ω^± needs absolute maximality (B21 Rem 8.13), obtained here through B21 Prop 2.17 / Cor 2.18 from a compact C¹ spacelike Cauchy surface (DEC-28, DEC-107); the statement of record is GX.btz_uniformization (Cauchy-compact in DEC-107's C¹ sense, π₁(Reg M) free and non-abelian with s ≥ 1 (DEC-76/119), image (⋃Δᵢ) ∪ ⋂I⁺(Πⱼ), M ≅ ρ\\D(M~) as an a.e.-isomorphism), on standard axioms.","The headline as printed (l.2363, Cauchy-complete) is supported only in DEC-28's Cauchy-compact form; the form of record GX.btz_uniformization (DEC-107 C¹ Cauchy-compact, DEC-119 π₁ free non-abelian) is now on standard axioms [propext, Classical.choice, Quot.sound] (campaign/WP-47g/axioms.out): the upstream mixed-diamond leaf is proved (WP-47f) and the developed BTZ half-line is built (WP-47e).","The display l.2369 is wrong (D-12 (c)); certified (DEC-28): range d.D = (⋃ₓ Δₓ) ∪ Ω⁺(Λ), Ω⁺(Λ) = ⋂_w I⁺(Π_w), with Δₓ = 𝒟(sing M~) ∩ J⁺(𝒟x) ∖ {𝒟x} (GX.btzTildeDelta) = {𝒟x + λu, λ > 0}, u future null ≠ 0, Δₓ ⊆ ∂Ω⁺, the family ρ(Γ)-invariant, ⋃ Δₓ = 𝒟(sing M~) disjoint from Ω⁺.","Every bullet of the headline is proved in GX.btz_uniformization: D injective on all of M~ (btz_injective_dev_C1); ρ faithful, discrete, torsion-free; the planes; the rays and the image; and ρ(Γ)\\𝒟(M~) ≃ₜ M by [𝒟 e] ↦ p(e) (btzTilde_quotient_homeomorph, through GX.quotient_virtually_tame and btz_manifold_isGaloisian), with the isometry Reg M ≅ ρ(Γ)\\Ω⁺. Equivariance at the BTZ points (D∘φ = ρ(φ)·D for every deck φ of M~ → M), which the proof (l.2382–2397) uses without comment, is proved (btzTilde_dev_deck) by T_BTZ-density of reg M~ and T_BTZ-continuity of deck maps.","The proof's 'S_x is a totally ordered relatively open future half line, so is its image' (l.2385–2386) needs a BTZ point strictly below each BTZ point on its developed line; proved (btzTilde_exists_sing_below) through one descending chart along the full future BTZ ray of p(x) started slightly in the past of p(x) — the openness of the domain W of the ray's E₀-morphism.","WP-47g fixer (audit major 1): the proof's identification l.2390–2395 ('the image of such D(I_{p,q}) together with the topology induced by M generates the BTZ topology on D(M~)') is PROVED: GX.BTZTildeData.btzRangeTop_eq_devImageTop — defi:BTZtop traced on D(M~) near the rays (GX.btzRangeTop) equals the topology generated by M3 and the D-images of T_BTZ-opens. The proof does not need the paper's causally convex chart neighbourhoods I_{p,q}: at a regular point D is a local homeomorphism; at a BTZ point y, in a developed chart κ (D = g·val∘κ), the BTZ topology of J+(Δ0) has the basic neighbourhoods A ∩ (I+(p_{t−η}) ∪ ]p_{t−η},+∞[) (GX.btzJ0_exists_basic_of_mem_nhds, from the axis diamonds of btz_axis_diamond), the regular points of a BTZ chart are off Δ0 (GX.BTZTildeData.exists_nhds_sing_of_mem_btzLine), and g sends Δ0 onto the developed half-line with its orientation, g·p_{t+s} = Dz + (s c) u, c > 0 (GX.btzTilde_chart_align). The headline's last conjunct is now ρ(Γ)\\D(M~) ≃ₜ M with D(M~) carrying btzRangeTop (GX.btzTilde_quotient_homeomorph_btzTop), so the bullet is a statement about a BTZ topology on a subset of M3, not a transported topology.","WP-47g fixer (audit minor 2): the two halves of 'isomorphism' are PROVED compatible and the compatibility is a conjunct of GX.btz_uniformization: for every isometry f : Reg M ≅ B onto a presentation π : Ω+ → B of ρ(Γ)\\Ω+ with f ∘ p = π ∘ D (the first block's), the homeomorphism h satisfies h [D e] = f⁻¹(π (D e)) for every regular e (GX.btzTilde_quotient_compat, via E0Bridge.proj_regTildeHomeo).","WP-47g fixer (audit minor 3): not a reading — the family (Δi) of l.2368 is existential; the witness (Δx)_{x BTZ}, Δx = {Dx + λu, λ>0}, is relatively open, future complete and lightlike, ρ(Γ)-invariant as a family, contained in ∂Ω+, with union D(sing M~) and D(M~) = (⋃Δx) ∪ ⋂ I+(Πw). The paper's maximal D(S_x) is its proof's choice of witness; each Δx is a sub-ray of it.","WP-47g fixer round 2 (audit major): the headline's last bullet 'isomorphism M → ρ\\D(M~)' is PROVED as an isomorphism of singular (Isom 𝐌³, 𝐌³)-manifolds, as the audit prescribed: ρ(Γ)\\D(M~) (quotient of D(M~) with defi:BTZtop near the rays) carries the unique maximal a.e. atlas for which the projection M~ → ρ(Γ)\\D(M~), e ↦ [D e], is an a.e. morphism (M~ with the structure p^*B_M of prop:singular_manifold_branched_covering), and for it the homeomorphism h : ρ(Γ)\\D(M~) ≃ₜ M, [D e] ↦ p(e), and its inverse are a.e. morphisms (GX.btzTilde_quotient_aeIso, conjuncts of GX.btz_uniformization). The previous round's claim that 'ρ\\D(M~) carries no singular (G,X)-structure in the library' was wrong and is withdrawn (SCOPE (b) (ii) rewritten). Every assertion of the DEC-28 form is now proved; the row stays partial only because DEC-28 itself rules it partial (Cauchy-complete strengthened to Cauchy-compact, DEC-27)."],"notes":"WP-48a, audited clean.","twin":"","tex":"\\begin{thm} Let $M$ be a globally hyperbolic Cauchy-complete Cauchy-maximal $\\mass{0}$-manifold, let $\\widetilde M$ its maximal covering branched over $\\sing(M)$, of  developing map and holonomy  $(\\D,\\rho)$. We note $\\Gamma:=\\Gamma(\\widetilde M/M)\\simeq\\pi_1(\\reg(M))$ its Galois group.  Then, up to time reversal of $M$:\n\\begin{itemize}\n \\item $\\D$ is injective\n \\item $\\rho$ is faithful, discrete and torsion-free; \n \\item there exists a $\\Gamma$-invariant family of relatively open future complete lightlike  rays $(\\Delta_i)_{i\\in I}$ and a $\\Gamma$-invariant family of lightlike planes $(\\Pi_j)_{j\\in J}$ such that \n $$\\D(\\widetilde M) = \\bigcap_{i\\in I} J^+(\\Delta_i) \\cup \\bigcap_{j\\in I} I^+(\\Pi_j) $$\n \n \\item endowing $\\D(\\widetilde M)$ with the BTZ topology in the neighborhood of the lightlike rays $(\\Delta_i)_{i\\in I}$, the developing map induces an isomorphism\n $$ M\\xrightarrow{~~\\overline \\D~~} \\rho\\backslash\\D(\\widetilde M\n ) $$\n\\end{itemize}\n\n\\end{thm}"},{"id":"lem:spread_hausdorff_locally_connected","block":"RamcovGX.tex:100000000","kind":"lemma","num":"","title":"","bucket":"T","lean":"none","nl":"open","line":2562,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} Let $N\\xrightarrow{p}M$ be a spread with $N,M$ Hausdorff and locally connected. \nIf $M$ is normal, then so is $N$.\n\\end{lem}"},{"id":"def:weak_morphism","block":"RamcovGX.tex:100000000","kind":"definition","num":"","title":"Weak a.e. (G,X)-morphism","bucket":"T","lean":"none","nl":"definition","line":2567,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Weak a.e. $(G,X)$-morphism]\nLet $M,N$ be singular $(G,X)$-manifolds, a weak a.e. $(G,X)$-morphism  is a possibly discontinuous map \n$N\\xrightarrow{f} X$ such that \n\\begin{enumerate}[(a)]\n \\item there exists a portly subset $\\U\\subset M$ such that $f_{|\\U}$ is an a.e $\n (G,X)$-morphism;\n \\item for any $\\U$ such as in $(a)$ we have \n $$\\forall x\\in M, f(x) \\in \\bigcap_{\\V\\ni x} \\overline {f(\\V\\cap \\U)}$$\n where the intersection runs over the open neighborhoods $\\V$ of $x$. \n\\end{enumerate}\n\nTwo such weak a.e $(G,X)$-morphisms $N\\xrightarrow{f_1,f_2}M$ are equivalent if they are equal on a portly subset.\n\\end{defi}"},{"id":"lem:singular_manifolds_weak_morphism","block":"RamcovGX.tex:100000000","kind":"lemma","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":2583,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}\n Let $M,N$ be singular $(G,X)$-manifolds and $M\\xrightarrow{f} N$ a weak a.e. $(G,X)$-morphism.\n\n Point $(b)$ of definition above can be replaced by \n \\begin{enumerate}\n  \\item[(b')] There exists a $\\U$ such as in $(a)$ such that \n $$\\forall x\\in M, f(x) \\in \\bigcap_{\\V\\ni x} \\overline {f(\\V\\cap \\U)}$$\n where the intersection runs over the open neighborhoods $\\V$ of $x$. \n \\end{enumerate}\n\n\\end{lem}"},{"id":"lem:Tamecont","block":"RamcovGX.tex:100000000","kind":"lemma","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":2606,"deps":["lem:path_covering"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}\nLet $M,N$ be singular $(G,X)$-manifolds and $M\\xrightarrow{f} N$ a weak a.e. $(G,X)$-morphism.\n\nThere exists a unique maximal domain $\\Tame(f)$ containing a portly subset and such that $f_{|\\Tame(f)}$ is an a.e. $(G,X)$-morphism.\nFurthermore, for any subset $\\U\\subset\\Tame(f)$ portly in $M$:  $$\\Tame(f) = \\{x\\in M ~|~ f \\text{ continuous at } x\\} \\subset \\left\\{x\\in M ~\\left|~ \\mathrm{card}\\bigcap_{ \\V \\ni x} \\overline{f(\\V \\cap \\U)}=1 \\right. \\right\\}$$\nwhere the intersection runs through the neighborhoods of $x$.\n\\end{lem}"},{"id":"def:tame_domain","block":"RamcovGX.tex:100000000","kind":"definition","num":"","title":"Tame domain","bucket":"T","lean":"none","nl":"definition","line":2630,"deps":["lem:Tamecont"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Tame domain] Let $M,N$ be singular $(G,X)$-manifolds and $M\\xrightarrow{f} N$ a weak a.e. $(G,X)$-morphism. The tame domain of $f$ is the set $\\Tame(f)$ given by Lemma \\ref{lem:Tamecont}.\n\\end{defi}"},{"id":"lem:Tame_equ","block":"RamcovGX.tex:100000000","kind":"lemma","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":2633,"deps":["lem:Tamecont"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem} If $f$ is a weak a.e. $(G,X)$-morphism then $\\Tame(f)$ only depends on its equivalence class.\n\\end{lem}"},{"id":"prop:weak_morphism_group_acting","block":"RamcovGX.tex:100000000","kind":"proposition","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":2649,"deps":["lem:MtoXG","lem:Tamecont","lem:Tame_equ","lem:holonomy"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $M\\xrightarrow{f} X$ be a weak a.e. $(G,X)$-morphism\nand let  $\\Gamma$ be a group acting on $M$ via a.e. $(G,X)$-morphisms.\nThen\n\\begin{enumerate}[(i)]\n \\item $\\Tame(f)$ only depends on $M$ and is then denoted by $\\Tame(M)$;\n \\item $\\Tame(M)$ is $\\Gamma$-invariant;\n \\item there exists a unique morphism $\\Gamma \\xrightarrow{\\rho} G$ such that $f_{|\\Tame(M)}$ is $\\rho$-equivariant. $\\rho$ is called the holonomy of $f$.\n\\end{enumerate}\n\\end{prop}"},{"id":"defi:weakdevmap","block":"RamcovGX.tex:100000000","kind":"definition","num":"","title":"Weak developing map","bucket":"T","lean":"none","nl":"definition","line":2671,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defi}[Weak developing map] \nLet $N\\xrightarrow{p} M$ be a quasi-Galoisian branched covering of singular $(G,X)$-manifold of Galois group $\\Gamma$. \nA weak developing map for  $N\\xrightarrow{p} M$ is a weak a.e. $(G,X)$-morphism $N\\xrightarrow{\\D} X$ of holonomy $\\Gamma \\xrightarrow{\\rho} G$ such that\n\\begin{enumerate}[(a)]\n \\item $\\D$ is $\\rho$-equivariant.\n \\item $\\D : N\\rightarrow (M,\\T^\\rho)$ is continuous  where $\\T^\\rho$ is the topology of $X$ given by $\\Gamma$-invariant open subsets (with $\\Gamma$ acting via $\\rho$).\n\\end{enumerate}\n\\end{defi}"},{"id":"rem:same_notations_most_one","block":"RamcovGX.tex:100000000","kind":"remark","num":"","title":"","bucket":"T","lean":"none","nl":"informal","line":2679,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} With the same notations, there is at most one equivalence class of weak a.e. $(G,X)$-morphisms $M\\rightarrow X$. In such a class, there is always at least one equivariant map but the existence of a developing map is not garanteed. \n\\end{rem}"},{"id":"rem:quasi_galoisian_branched_covering_singular","block":"RamcovGX.tex:100000000","kind":"remark","num":"","title":"","bucket":"T","lean":"none","nl":"informal","line":2682,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{rem}\n Let $N\\xrightarrow{p}M$ be a quasi-Galoisian branched covering of singular $(G,X)$-manifolds of Galois group $\\Gamma$ and let $N\\xrightarrow{\\D} X$ be a weak developing map. Then : \n$\\forall x\\in N, \\forall \\gamma \\in \\Gamma_x, \\D(x) \\in \\mathrm{Fix}(\\rho(\\gamma))$.\n\\end{rem}"},{"id":"lem:galoisian_branched_covering_manifolds","block":"RamcovGX.tex:100000000","kind":"lemma","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":2691,"deps":["lem:descend_developing_map","defi:weakdevmap"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{lem}\n Let $N\\xrightarrow{p}M$ be a Galoisian branched covering of a.e. $(G,X)$-manifolds. Then the following are equivalent:\n \\begin{enumerate}[(i)]\n  \\item There exists a developing map $N\\xrightarrow{\\D}X$ and its holonomy is trivial;\n  \\item There exists a weak developing map $N\\xrightarrow{\\D}X$ and its holonomy is trivial;\n  \\item There exists an a.e $(G,X)$-morphism $M\\xrightarrow{\\overline \\D}X$.\n \\end{enumerate}\n\\end{lem}"},{"id":"rem:weak_dev_map_comp","block":"RamcovGX.tex:100000000","kind":"remark","num":"","title":"","bucket":"T","lean":"none","nl":"informal","line":2708,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{rem} If $N\\xrightarrow{\\D} X$ is a developing map of $N\\rightarrow M$ and $\\widehat N\\xrightarrow{p} N$ is a branched covering then the composition $\\widehat \\D=\\D\\circ p$ is a natural candidate for a weak developing map for $\\widehat N\\rightarrow M$. \n\\begin{itemize}\n \\item For all $\\hat\\gamma\\in \\Gamma(\\widehat N/M)$, $\\gamma$ its projection in $\\Gamma(N/M)$, and for all $x_0\\in \\widehat N$ we have:\n $$ \\widehat \\D(\\hat \\gamma x_0 ) := \\D\\circ p(\\hat\\gamma x_0) = \\D(\\gamma p(x_0)) = \\rho(\\gamma)\\D( p(x_0))$$\nIn particular, $\\widehat \\D$ is $\\widehat \\rho$-equivariante with $\\widehat \\rho$ the composition of $\\rho$ by the natural projection $\\Gamma(\\widehat N/M) \\rightarrow \\Gamma(N/M)=\\Gamma(\\widehat N/M)/\\Gamma(\\widehat N/N)$.\n\n\\item Since $N\\xrightarrow{\\D} (X,\\T^\\rho)$ and $\\widehat N \\xrightarrow{p} N$ are continuous, so is $\\widehat N \\xrightarrow{\\widehat \\D} (X,\\T^\\rho)$. \n\\end{itemize}\nTherefore, $\\widehat \\D$ is indeed a developing map for $\\widehat N\\rightarrow M$.\n\nHowever, it is not necessarily a developing map for $\\widehat N\\rightarrow N$. Beware that hypothesis $(b)$ for weak developing map may not be satisfied. A counter-example can be constructed by considering $N\\rightarrow M$ such that $\\Tame(N)\\neq N$ and then taking $\\widehat N$ as the maximal covering of $N$ possibly branched over some skeletal subset $S\\subset \\reg(N)$ such that $\\pi_1(\\reg(N)\\se …"},{"id":"prop:branched_weak_devmap","block":"RamcovGX.tex:100000000","kind":"proposition","num":"","title":"","bucket":"T","lean":"none","nl":"proved","line":2725,"deps":["prop:branched_devmap","prop:universality","rem:weak_dev_map_comp","prop:Galoisian_semilocal","rem:galois_quotient","lem:descend_developing_map"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop} Let $M$ be a singular $(G,X)$-manifold. Assume that $\\reg(M)$ is semi-locally simply connected in $M$.\nThe following are then equivalent:\n\\begin{enumerate}[(i)]\n \\item  $\\widetilde M\\rightarrow M$ admits a weak developing map,\n \\item there exists a Galoisian branched covering of $N\\xrightarrow{q} M$ which admits a weak developing map and such that $\\reg(\\ord_{q}(M))$ is semi-locally simply connected in $M$.\n\\end{enumerate} \n\\end{prop}"}],"closed":143,"target":149,"macros":{"thelem":"\\arabic{section}.\\arabic{lem}","mass":["{\\mathbb E}^{1,2}_{#1}",1],"catE":["\\mathbf{Var_{\\mass{#1}}}",1],"catX":["\\mathbf{Var_{X_{#1}}}",1],"fonction":["\\displaystyle#1:\\begin{array}{l|rcl}\n& \\displaystyle #2 & \\longrightarrow & \\displaystyle #3 \\\\\n    & \\displaystyle #4 & \\longmapsto & \\displaystyle #5 \\end{array}",5],"fonctionn":["\\displaystyle\\begin{array}{l|rcl}\n& \\displaystyle #1 & \\longrightarrow & \\displaystyle #2 \\\\\n    & \\displaystyle #3 & \\longmapsto & \\displaystyle #4 \\end{array}",4],"cyl":["\\CC_\\infty^{(#1)}",1],"edl":["{\\color{MyGreen}{#1}}",1],"leo":["{\\color{MyGreen} [\\textbf{Leo: } #1]}",1],"edt":["{\\color{MyDarkRed}{#1}}",1],"ZZ":"\\mathbb{Z}","r":"\\mathfrak{r}","D":"\\mathcal{D}","Z":"\\mathbb{Z}","H":"\\mathbb{H}","M":"\\mathcal{M}","s":"\\mathfrak S","v":"\\mathfrak v","stab":"\\mathrm{Stab}","Kbar":"\\overline{K}","au":"\\overrightarrow{u}","U":"\\mathcal U","ab":" \\mathrm{ab}","Hom":"\\mathrm{Hom}","isom":"Isom","lsem":"[\\![","rsem":"]\\!]","V":"\\mathcal V","F":"\\mathcal F","C":"\\mathcal C","A":"\\mathcal A","TT":"\\mathcal T","R":"\\mathbb{R}","E":"\\mathbf E","G":"\\mathbf G","S":"\\mathcal S","N":"\\mathbb N","T":"\\mathcal{T}","rot":"\\mathbf{rot}","div":"\\mathbf{div}","grad":"\\overrightarrow{\\mathbf{grad}}","d":"\\mathrm{d}","K":"\\mathbf K","SO":"\\mathrm{SO}","BTZ":"{\\E_{0}^{1,2}}","sing":"\\mathrm{Sing}","RR":"\\mathbb{R}","L":"\\mathrm{L}","graph":"\\mathrm{Graph}","Teich":"\\mathrm{Teich}","Hol":"\\mathrm{Hol}","Reg":"\\mathrm{Reg}","fix":"\\mathrm{Fix}","teich":"\\mathrm{Teich}","susp":"\\mathrm{susp}","pgcd":"M_1\\wedge M_2","ppcm":"M_1\\vee M_2","reg":"\\Reg","DD":"\\mathbb{D}","isomH":"\\isom^+(\\H)","BTZtilde":"{\\widetilde \\E}^{1,2}_0","W":"\\mathcal W","MM":"\\overline M","CC":"\\mathbb{C}","J":"\\mathcal{J}","SS":"\\mathbb{S}","BTZext":"\\mathrm{Ext}_{\\mathrm{BTZ}}","mink":"\\mathbb{E}^{1,2}","Dbar":"\\overline{\\D}","O":"\\mathcal{O}","adm":"\\mathcal{P}_\\Sigma","EH":"\\mathcal H","Cat":"\\mathbf{C}","Top":"\\mathbf{Top}","cotan":"\\mathrm{ct}","catGX":"\\mathbf{Var_{G,X}}","Im":"\\mathrm{Im}","et":"~\\text{et}~","Tame":"\\mathrm{Tame}","WTame":"\\mathrm{WTame}","massA":"\\mass{\\geq 0}","dec":"\\mathrm{dec}","so":"\\mathfrak{so}","pen":"\\mathcal{P}","UU":"\\mathbb{U}","PP":"\\mathbb{P}","P":"\\mathcal{P}","a":"\\lambda","b":"\\mu","cc":"\\beta","dd":"\\alpha","B":"\\mathcal B","GG":"\\mathrm{O}_{0}(1,2 ; \\RR)","Hbar":"\\overline{\\H^2}","RP":"\\mathbb{RP}^1","PSL":"\\mathrm{PSL}","HS":"\\mathbb{HS}","struc":"\\mathbf{Struct}","GL":"\\mathrm{GL}","SL":"\\mathrm{SL}","Aut":"\\mathrm{Aut}","supp":"\\mathrm{supp}","Homeo":"\\mathrm{Homeo}","cool":"{cool}","ord":"\\mathrm{Ord}","vecM":"\\overrightarrow{\\E}^{1,2}","X":"\\overrightarrow X","gradH":"{\\overrightarrow{\\grad} \\mathcal H_{\\bar\\kappa}}","Wild":"\\mathrm{Wild}","CatSpread":"\\mathbf{Spr}","CatSingGX":"\\mathbf{SingGX}"}},"benzecri":{"blocks":[{"id":"benzecri1960_ch1.tex:61","title":"Introduction"},{"id":"benzecri1960_ch1.tex:118:126","title":"Chapitre 1. Variétés localement projectives et variétés localement affines. › 1. Géométrie affine et géométrie projective."},{"id":"benzecri1960_ch1.tex:118:480","title":"Chapitre 1. Variétés localement projectives et variétés localement affines. › 2. Variétés coniques affines."},{"id":"benzecri1960_ch1.tex:118:655","title":"Chapitre 1. Variétés localement projectives et variétés localement affines. › 3. Applications."}],"nodes":[{"id":"bzthm:intro_A","block":"benzecri1960_ch1.tex:61","kind":"theorem","num":"","title":"A","bucket":"A","lean":"closed","nl":"proved","line":69,"deps":["bzcor:c1s3p1c_produit_cercle","bzcor:c1s3p3c_produit_projectif"],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Applications/TheoremA.lean (WP-45w), theoremA (theoremA_affine, theoremA_projective); S₁^{(p−1)} as printed (DEC-128).","twin":"","tex":"\\begin{resume}[A]\nSi une variété compacte $V$ peut être munie d'une structure localement projective, le produit\n$V\\times S_1$ peut être muni d'une structure localement affine ($S_1$ désigne le cercle;\n\\bzcf{cf. chap. 1, \\S\\,3, prop. 1, corrolaire}{\\ref{bzcor:c1s3p1c_produit_cercle}}).\n\nSi chacune des $p$ variétés compactes $V_i$ peut être munie d'une structure localement\nprojective, le produit $V_1\\times\\ldots\\times V_i\\times\\ldots\\times V_p\\times S_1^{(p-1)}$ peut\nêtre muni d'une structure localement projective (\\bzcf{chap. 1, \\S\\,3, prop. 3,\ncorollaire}{\\ref{bzcor:c1s3p3c_produit_projectif}}).\n\\end{resume}"},{"id":"bzthm:intro_B","block":"benzecri1960_ch1.tex:61","kind":"theorem","num":"","title":"B","bucket":"T","lean":"none","nl":"proved","line":86,"deps":["bzdef:c1s1d11_corps_convexe"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{resume}[B]\nSi le revêtement universel d'une variété localement affine ou projective compacte possède une\npoche (resp. coque), ce revêtement s'identifie à un ouvert (resp. à un convexe) de l'espace\naffin, ou de la sphère projective (\\textit{cf.} chap. 2, \\S\\,3, théorème).\n\nSi le revêtement universel $W$ d'une variété localement projective compacte possède une coque\nstricte, ou si $W$ considéré comme ouvert étalé, a une projection sur la sphère projective dont\nla fermeture est incluse dans un hémisphère ouvert, $W$ s'identifie à l'intérieur d'un corps\nconvexe de la sphère projective (\\textit{cf.} chap. 2, \\S\\,3, théorème et prop. 2).\n\nLe revêtement universel d'une variété localement affine compacte, considérée comme ouvert étalé\nau-dessus de l'espace affin, a une projection non bornée (\\textit{cf.} chap. 2, \\S\\,3 : la\nproposition 1 énonce un résultat plus fort).\n\nPoche, coque, coque stricte, sont définis au chapitre 2, paragraphe 1, définitions 1, 2, 3.\nCorps convexe est défini au \\bzcf{chapitre 1, paragraphe 1, définition\n11}{\\ref{bzdef:c1s1d11_corps_convexe}}. Sans répéter ces définitions, disons qu'un ouvert étalé\nqui possède une poche (resp. coque) est univalent (resp. convexe) au voisinage d'un point de sa\nfrontière.\n\\end{resume}"},{"id":"bzthm:intro_C","block":"benzecri1960_ch1.tex:61","kind":"theorem","num":"","title":"C","bucket":"T","lean":"none","nl":"proved","line":107,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{resume}[C]\nSupposons que le revêtement universel d'une variété localement projective compacte soit\nl'intérieur d'un corps convexe $W$ : si $W$ possède, en un point de sa frontière, un ellipsoïde\nosculateur, $W$ est un ellipsoïde; si $W$ possède sur sa frontière un point conique, $W$ est un\ncône (i.~e. $W$ est l'enveloppe convexe d'un point et d'une base hyperplane convexe)\n(\\textit{cf.} chap. 5, \\S\\,3, théorème final et prop. 3, 9, 10).\n\\end{resume}"},{"id":"bzdef:c1s1d1_espace_affin","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"1","bucket":"A","lean":"closed","nl":"definition","line":132,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[1]\nOn définit sur $A$ une structure d'\\textit{espace affin} par la donnée d'un espace vectoriel\n$T(A)$ et d'une opération de $T(A)$ sur $A$ par laquelle $T(A)$, considéré comme groupe abélien,\nopère simplement et transitivement sur $A$.\n\n$T(A)$ est appelé \\textit{espace vectoriel de translation} de $A$. L'opération de $T(A)$ sur $A$\nest notée $+$.\n\nSoit $M$ et $N$ deux éléments de $A$. On note $MN$ l'unique élément de $T(A)$ tel que\n$M+MN=N$.\n\\end{defin}"},{"id":"bzdef:c1s1d2_application_affine","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"2","bucket":"A","lean":"closed","nl":"definition","line":149,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[2]\nSoit $A$ et $B$ deux espaces affins; $T(A)$ et $T(B)$ les espaces vectoriels définis sur un même\ncorps, des translations de $A$ et $B$ respectivement. Une application $l$ de $A$ dans $B$ est\nappelée \\textit{application affine} s'il existe une\n\napplication $l'$ de $T(A)$ dans $T(B)$ telle que, quels que soient $M\\in A$ et $m\\in T(A)$, on\nait\n\\[ l(M+m)=l(M)+l'(m). \\]\n\\end{defin}"},{"id":"bzdef:c1s1d3_sphere","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"3","bucket":"A","lean":"closed","nl":"definition","line":167,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[3]\nSoit $E$ un espace vectoriel sur $\\R$. Le groupe multiplicatif $\\R^+$ (resp.\n$\\R^*=\\R-\\{O\\}$) opère sur $E$ comme groupe des homothéties positives (resp. des homothéties non\nnulles).\n\nNous appellerons \\textit{sphère} associée à $E$, et noterons $S(E)$ (resp. \\textit{espace\nprojectif}, $P(E)$, associé à $E$), le quotient de $E-\\{O\\}$ par $\\R^+$ (resp. $\\R^*$), $O$\nétant l'origine de $E$.\n\nQuand aucune autre structure topologique ne sera spécifiée sur $E$, nous supposerons $E$ muni de\nla topologie localement convexe la plus fine.\n\nUne structure d'espace vectoriel topologique sur $E$ induit une topologie sur $E-\\{O\\}$ : $S(E)$\n[resp. $P(E)$] sera muni de la topologie quotient.\n\nNous noterons $s$ la projection canonique de $E-\\{O\\}$ sur $S(E)$; nous noterons $F$ la\ncorrespondance qui, à une partie de $S(E)$, associe son image réciproque dans $E-\\{O\\}$.\n\\end{defin}"},{"id":"bzdef:c1s1d4_sous_variete_lineaire","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"4","bucket":"A","lean":"closed","nl":"definition","line":186,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[4]\nSoit $L$ un sous-espace vectoriel de $E$; $s(L-\\{O\\})$ sera appelé \\textit{sous-variété\nlinéaire} de $S(E)$.\n\\end{defin}"},{"id":"bzdef:c1s1d5_hemisphere","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"5","bucket":"A","lean":"closed","nl":"definition","line":202,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[5]\nOn dit qu'une partie ouverte $H$ de $S(E)$ est un \\textit{hémisphère ouvert} de $S(E)$ s'il\nexiste une forme linéaire $l\\in E^*$ telle que\n\\[ F(H)=l^{-1}(\\R^+). \\]\nLa forme linéaire $l$ est définie à un multiplicateur positif près. On l'appelle\n\\textit{équation} de l'hémisphère $H$.\n\nLa frontière de $H$ est l'hyperplan fermé $h$ défini par\n\\[ F(h)\\cup\\{O\\}=l^{-1}(O). \\]\nLa fermeture $H\\cup h$ de $H$ est appelée \\textit{hémisphère fermé}.\n\\end{defin}"},{"id":"bzdef:c1s1d6_structure_affine_hemisphere","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"6","bucket":"A","lean":"closed","nl":"definition","line":222,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[6]\nSur tout hémisphère ouvert $H$ de $S(E)$, nous allons définir une structure d'espace affin.\n\nSoient $l$ une équation de $H$ et $N$ le sous-espace vectoriel $l^{-1}(O)$; le groupe des\ntranslations de $H$ sera l'espace vectoriel $L(E/N, N)$ opérant sur $H$ comme suit :\n\nSoient $m\\in H$, $u\\in L(E/N, N)$, $M\\in F(m)$, $q$ l'application de $E$ sur son quotient $E/N$\n\\[ m+u=s(M+u(q(M))) \\]\nIl est clair que cette expression est indépendante du choix de $m$.\n\n\\end{defin}"},{"id":"bzdef:c1s1d7_segment","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"7","bucket":"A","lean":"closed","nl":"definition","line":234,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[7]\nSoient $m$, $m'$ deux points \\textit{non diamétralement opposés} de $S(E)$, nous allons définir\nle segment de droite fermé $(m, m')$.\n\nSoient $M$, $M'$ deux points de $E-\\{O\\}$ appartenant à l'image réciproque de $m$ et $m'$\nrespectivement; on pose\n\\[ (m, m')=s(M, M'). \\]\nIl est clair que le choix de $M$ et $M'$ est indifférent.\n\nOn définit de même le segment ouvert $)m, m'($.\n\\end{defin}"},{"id":"bzdef:c1s1d8_partie_convexe","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"8","bucket":"A","lean":"closed","nl":"definition","line":246,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[8]\nOn appelle \\textit{partie convexe} $k\\subset S(E)$ une partie $k$ telle que $F(k)+\\{O\\}$ soit un\nconvexe de $E$.\n\nUne partie convexe de $S(E)$ est une partie $k$ de $S(E)$ telle que, quels que soient $m$ et\n$m'$ non diamétralement opposés dans $k$, le segment $(m, m')$ soit inclus dans $k$.\n\\end{defin}"},{"id":"bzdef:c1s1d9_convexe_strict","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"9","bucket":"A","lean":"closed","nl":"definition","line":255,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[9]\nUne partie convexe de $S(E)$ est dite \\textit{stricte} si elle ne contient pas de couples de\npoints diamétralement opposés.\n\\end{defin}"},{"id":"bzdef:c1s1d10_quotient","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"10","bucket":"A","lean":"closed","nl":"definition","line":260,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[10]\nSoient $L$ un sous-espace vectoriel d'un espace vectoriel $E$ et $l$ l'image de $L-\\{O\\}$ dans\n$S(E)$ par $s$; la sphère $S(E/L)$ sera aussi notée $S(E)/l$ et appelée quotient de $S(E)$ par\n$l$.\n\nDe même que les convexes de $E$ contenant $L$ s'identifient aux convexes de $E/L$, les convexes\nde $S(E)$ contenant $l$ s'identifient aux convexes de $S(E)/l$.\n\\end{defin}"},{"id":"bzdef:c1s1d11_corps_convexe","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"11","bucket":"A","lean":"closed","nl":"definition","line":285,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[11]\nOn appelle \\textit{corps convexe} de $\\R^n$ [resp. $S(n)$] un convexe de $\\R^n$ [resp. un\nconvexe strict de $S(n)$] qui est compact et d'intérieur non vide.\n\nOn note $EA(n)$ [resp. $E(n)$] l'ensemble des corps convexes de $\\R^n$ [resp. de $S(n)$].\n\nOn note $CA(n)$ l'ensemble des parties convexes compactes de $\\R^n$.\n\\end{defin}"},{"id":"bzdef:c1s1d12_variete_localement_projective","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"12","bucket":"A","lean":"closed","nl":"definition","line":304,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[12]\nSur une variété $V$, convexe, de dimension $n$, on définit une structure de \\textit{variété\nlocalement projective} (resp. \\textit{affine}), par la donnée d'un ensemble ouvert $J(V)$ de jets\nd'isomorphismes de $V$ dans $S(n)$ (resp. $\\R^n$) appelé ensemble de jets projectifs (resp.\naffins) et jouissant des propriétés suivantes :\n\n1\\textsuperscript{o} L'image de $J(V)$ par la projection source est $V$ tout entier;\n\n2\\textsuperscript{o} $GS(n, \\R)$ [resp. $GA(n, \\R)$] opère transitivement sur chaque fibre de\n$J(V)$, composée des jets de source donnée.\n\nIl est clair que $J(V)$, muni de la projection source sur $V$ est un revêtement de $V$.\n\\end{defin}"},{"id":"bzrem:c1s1r1_affine_vers_projective","block":"benzecri1960_ch1.tex:118:126","kind":"remark","num":"","title":"","bucket":"A","lean":"closed","nl":"informal","line":319,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{remarque}\nSoit $j$ un isomorphisme, compatible avec la structure affine de $\\R^n$ sur un hémisphère\n$\\mathring{H}$ de $S(n)$. Soit $V$ une variété localement affine, $J(V)$ l'ensemble des jets\naffins de $V$ dans $\\R^n$. Désignons par $J'(V)$ l'ensemble\n\ndes jets d'isomorphismes de $V$ dans $S(n)$ obtenus en composant $j$ et un jet de $J(V)$.\nDésignons par $J''(V)$ l'ensemble des jets d'isomorphismes de $V$ sur $S(n)$ obtenus en composant\nun automorphisme de $GS(n, \\R)$ et un jet de $J'(V)$. Il est clair que $J''(V)$ définit sur $V$\nune structure de variété localement projective canoniquement associée à la structure localement\naffine définie par $J(V)$.\n\\end{remarque}"},{"id":"bzdef:c1s1d13_carte_compatible","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"13","bucket":"A","lean":"closed","nl":"definition","line":331,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{defin}[13]\nUne \\textit{carte} d'un ouvert $U$ d'une variété localement projective (resp. affine) sur un\nouvert de $S(n)$ (resp. $\\R^n$) est dite \\textit{compatible avec la structure projective} (resp.\n\\textit{affine}) si tous ses jets appartiennent à $J(V)$.\n\nSi aucune confusion n'est à craindre, nous parlerons de \\textit{carte compatible}, sans préciser\nla structure.\n\\end{defin}"},{"id":"bzprop:c1s1p1_cartes_compatibles","block":"benzecri1960_ch1.tex:118:126","kind":"proposition","num":"","title":"1","bucket":"A","lean":"closed","nl":"proved","line":340,"deps":["bzdef:c1s1d12_variete_localement_projective"],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop}[1]\nSoit $V$ une variété localement affine (resp. projective); soit $U$ un ouvert de $V$.\n\n1\\textsuperscript{o} Soient $\\varphi_1$, $\\varphi_2$ deux cartes compatibles de $U$ : il existe\nun automorphisme unique $g\\in GA(n, \\R)$ [resp. $GS(n, \\R)$] tel que\n\\[ \\varphi_1=g\\circ\\varphi_2. \\]\n\n2\\textsuperscript{o} Soit $\\varphi_1$ une carte compatible de $U$; soit $x\\in U$; soit $j_x$ un\njet de $J(V)$ de source $x$ : il existe une carte compatible unique $\\varphi_2$ dont le jet en\n$x$ soit $j_x$.\n\\end{prop}"},{"id":"bzprop:c1s1p2_developpement","block":"benzecri1960_ch1.tex:118:126","kind":"proposition","num":"","title":"2","bucket":"A","lean":"closed","nl":"proved","line":357,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Structure/Developing.lean (WP-45k), Benzécri's route through the jet covering (isCoveringMap_jets + IsCoveringMap.existsUnique_continuousMap_lifts); needs only SimplyConnectedSpace V. Graduated 2026-11-08.","twin":"","tex":"\\begin{prop}[2]\nSoit $V$ une variété localement projective (resp. affine) simplement connexe : il existe une\napplication $p$ de $V$ dans $S(n)$ (resp. $\\R^n$) dont tous les jets appartiennent à $J(V)$;\n$p$ est défini à une multiplication à gauche près par un élément de $GS(n, \\R)$ [resp.\n$GA(n, \\R)$]; $V$, muni de la projection $p$, est un ouvert étalé au-dessus de $S(n)$ (resp.\n$\\R^n$).\n\\end{prop}"},{"id":"bzprop:c1s1p3_atlas","block":"benzecri1960_ch1.tex:118:126","kind":"proposition","num":"","title":"3","bucket":"A","lean":"closed","nl":"cited","line":371,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{prop}[3]\nSoit $\\{U_i\\}$ un recouvrement d'une variété $V$ par un système d'ouverts; soit $\\{f_i\\}$ un\nsystème de cartes des $U_i$ sur des ouverts de $S(n)$ (resp. $\\R^n$), tel que, si\n$U_i\\cap U_j\\neq\\emptyset$, on ait sur $U_i\\cap U_j$,\n\\[ f_i=g_{ij}\\circ f_j, \\qquad\\text{avec}\\quad g_{ij}\\in GS(n, \\R)\n   \\quad [\\text{Resp. } GA(n, \\R)]; \\]\nalors il existe sur $V$ une structure localement projective (resp. affine) unique, avec laquelle\nles cartes $f_i$ sont compatibles.\n\\end{prop}"},{"id":"bzdef:c1s1d14_segment_variete","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"14","bucket":"A","lean":"closed","nl":"definition","line":410,"deps":["bzdef:c1s1d7_segment"],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Structure/Classes.lean (WP-45l); the scan prints Déf. 7's closed segment.","twin":"","tex":"\\begin{defin}[14]\nSoit $V$ une variété localement projective (resp. affine). Une partie $S$ de $V$ est appelée\n\\textit{segments d'extrémités} les deux points $M$ et $N$ de $V$, s'il existe un voisinage\nouvert $O$ de $S$, et une carte compatible $\\varphi$ de $O$, telle que\n\\[ \\varphi(S)=(\\varphi(M), \\varphi(N)) \\]\n(sur la notion de segment, \\bzcf{\\textit{cf.} déf. 7}{\\ref{bzdef:c1s1d7_segment}}).\n\n\\end{defin}"},{"id":"bzdef:c1s1d15_homogene_balayable_divisible","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"15","bucket":"A","lean":"closed","nl":"definition","line":419,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Structure/Classes.lean (WP-45l); divisible ⇒ balayable for V locally compact (supplied in both cases).","twin":"","tex":"\\begin{defin}[15]\nUne variété projective $V$ est dite \\textit{homogène}, si le groupe $G$ des automorphismes\nprojectifs de $V$ opère transitivement dans $V$; elle est dite \\textit{balayable} (resp.\nbalayable pour un sous-groupe $G_1\\subset G$) s'il existe un compact $K\\subset V$, appelé\n\\textit{domaine générateur} pour $G$ (resp. $G_1$), tel que\n\\[ V=\\bigcup_{g\\in G} gK \\qquad \\Bigl(\\text{resp. } V=\\bigcup_{g\\in G_1} gK\\Bigr), \\]\n$V$ est dit \\textit{divisible} s'il existe un sous-groupe $G_1$ de $G$, proprement discontinu,\nsans point fixe, et tel que $V/G_1$ soit compact.\n\\end{defin}"},{"id":"bzthm:c1s1_revetement_universel_divisible","block":"benzecri1960_ch1.tex:118:126","kind":"theorem","num":"","title":"","bucket":"D","lean":"none","nl":"informal","line":431,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{enonce}\nSi $V$ est une variété localement projective et compacte, son\nrevêtement universel est divisible.\n\\end{enonce}"},{"id":"bzdef:c1s1d16_maximale","block":"benzecri1960_ch1.tex:118:126","kind":"definition","num":"","title":"16","bucket":"A","lean":"closed","nl":"definition","line":472,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Structure/Classes.lean (WP-45l); compact ⇒ maximal read with U Hausdorff (DEC-122).","twin":"","tex":"\\begin{defin}[16]\nUne variété $V$ localement projective et connexe est dite \\textit{maximale} s'il n'existe pas de\nvariété $U$ connexe localement projective, de même dimension que $V$, et telle que $V$ soit\nisomorphe à un ouvert de $U$, distinct de $U$.\n\\end{defin}"},{"id":"bzdef:c1s2d1_cone_ouvert","block":"benzecri1960_ch1.tex:118:480","kind":"definition","num":"","title":"1","bucket":"A","lean":"closed","nl":"definition","line":482,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Cone/Basic.lean (WP-45m).","twin":"","tex":"\\begin{defin}[1]\nOn appelle cône ouvert de $\\R^n$, une partie ouverte de $\\R^n-\\{O\\}$, réunion de demi-droites\nouvertes issues de l'origine.\n\\end{defin}"},{"id":"bzdef:c1s2d2_variete_conique_affine","block":"benzecri1960_ch1.tex:118:480","kind":"definition","num":"","title":"2","bucket":"A","lean":"closed","nl":"definition","line":488,"deps":["bzdef:c1s1d13_carte_compatible"],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Cone/Basic.lean (WP-45m); jet form ⇔ atlas form (def2_iff); « définition 2 » read as Déf. 13 (DEC-113).","twin":"","tex":"\\begin{defin}[2]\nSur une variété $V$ de dimension $n$, une structure de variété conique affine de dimension $n$\nest définie par la donnée d'un ensemble ouvert $J_1(V)$ de jets d'isomorphismes de $V$ dans\n$\\R^n-\\{O\\}$ tel que\n\n1\\textsuperscript{o} L'image de $J_1(V)$ par la projection source est $V$ tout entier;\n\n2\\textsuperscript{o} $GU(n, \\R)$ opère transitivement sur chaque fibre des jets de source donnée;\n\n3\\textsuperscript{o} Comme dans le \\bzcf{paragraphe 1, définition\n2}{\\ref{bzdef:c1s1d13_carte_compatible}}, appelons carte compatible, toute carte dont les jets\nappartiennent à $J_1$ : tout point de $V$ possède un voisinage dont il existe une carte\ncompatible sur un cône ouvert de $\\R^n$.\n\n\\end{defin}"},{"id":"bzprop:c1s2p1_atlas_conique","block":"benzecri1960_ch1.tex:118:480","kind":"proposition","num":"","title":"1","bucket":"A","lean":"closed","nl":"informal","line":508,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Cone/Basic.lean (WP-45m); printed {V_i}, f_i read {U_i}, f_j.","twin":"","tex":"\\begin{prop}[1]\nSoit $\\{V_i\\}$ un recouvrement d'une variété $V$ par un système d'ouverts; $f_i$ un système de\ncartes des $U_i$ sur des cônes ouverts de $\\R^n$, tel que, si $U_i\\cap U_j\\neq\\emptyset$, on\nait, sur $U_i\\cap U_j$,\n\\[ f_i=g_{ij}\\circ f_i, \\qquad\\text{avec}\\quad g_{ij}\\in GU(n, \\R). \\]\nAlors il existe sur $V$ une structure conique affine, et une seule, avec laquelle les cartes\n$f_i$ soient compatibles.\n\n\\end{prop}"},{"id":"bzdef:c1s2d3_homotheties_positives","block":"benzecri1960_ch1.tex:118:480","kind":"definition","num":"","title":"3","bucket":"A","lean":"closed","nl":"definition","line":526,"deps":[],"decls":[],"ndecls":0,"findings":["V = {z > 0, (x,y) ≠ 0} × ℝ^{n-3} / ⟨diag(4, 1/8, 2, 1, …, 1)⟩ is a Hausdorff, second-countable, paracompact affine conical manifold whose base V/ℝ₊* is not Hausdorff, for every n ≥ 3 (Benzecri.ConeCex.not_t2Space_coneBase_dim, not_properSMul_dim, not_exists_section_dim, isEmpty_homeomorph_dim); for n ≤ 2 the base is always Hausdorff (Benzecri.LowDim.t2Space_coneBase_of_le_one); in general B is Hausdorff iff the ℝ₊* action is proper (Benzecri.ConeBase.t2Space_iff_properSMul)"],"notes":"MARKED in corrected form (DEC-124; correction DEC-122): Benzecri/Cone/Section.lean carries the mark on ConeBase.exists_trivialization_of_properSMul — « topologiquement trivial » with the added hypothesis that the ℝ₊* action is proper; the corrected form is the formalization of record, the printed form is refuted (ConeCex.not_*_dim). Chart independence needs V Hausdorff (plan F6).","twin":"","tex":"\\begin{defin}[3]\nLe groupe $\\R^+$ des réels positifs opère sur un cône affin $V$ de la façon suivante : soit\n$m\\in V$; soit $U$ un voisinage de $m$ dont il existe une carte compatible $f$ sur un cône ouvert\nde $\\R^n$; on pose $\\lambda m=f^{-1}(\\lambda f(m))$, où $\\lambda\\in\\R^+$ opère sur $\\R^n$ comme\nune homothétie de centre $O$ et de rapport $\\lambda$. Cette définition est indépendante de la\ncarte $f$ choisie.\n\n$V$ est ainsi munie d'une structure d'espace fibré $\\R^+$-principal : cet espace fibré est\ntopologiquement trivial, puisque $\\R^+$ est homéomorphe au segment ouvert, et nous en\nconstruirons plus loin une section. $\\R^+$ opère sur $V$ comme un groupe d'automorphismes de sa\nstructure localement affine (mais non de sa structure conique affine), que nous appellerons le\ngroupe des homothéties positives de $V$.\n\\end{defin}"},{"id":"bzprop:c1s2p2_base_cone","block":"benzecri1960_ch1.tex:118:480","kind":"proposition","num":"","title":"2","bucket":"A","lean":"closed","nl":"informal","line":540,"deps":[],"decls":[],"ndecls":0,"findings":["V = {z > 0, (x,y) ≠ 0} × ℝ^{n-3} / ⟨diag(4, 1/8, 2, 1, …, 1)⟩ is a Hausdorff, second-countable, paracompact affine conical manifold whose base V/ℝ₊* is not Hausdorff, for every n ≥ 3 (Benzecri.ConeCex.not_t2Space_coneBase_dim, not_properSMul_dim, not_exists_section_dim, isEmpty_homeomorph_dim); for n ≤ 2 the base is always Hausdorff (Benzecri.LowDim.t2Space_coneBase_of_le_one); in general B is Hausdorff iff the ℝ₊* action is proper (Benzecri.ConeBase.t2Space_iff_properSMul)"],"notes":"MARKED in corrected form (DEC-124; correction DEC-122): Benzecri/Cone/Base.lean carries the mark on ConeBase.existsUnique_baseStructure_of_properSMul (and ConeBase.variete_of_properSMul: B Hausdorff, connected, second countable) — the base is a locally projective manifold under the added hypothesis that the ℝ₊* action is proper; the printed form (B a variété) is refuted (ConeCex.not_t2Space_coneBase_dim).","twin":"","tex":"\\begin{prop}[2]\nSur le quotient $B=V/\\R^+$, appelé \\textit{base} de l'espace fibré $V$, est définie\ncanoniquement une structure localement projective : soit $j$ un jet de $J_1(V)$, on en déduit\npar passage au quotient par le groupe des homothéties positives, un jet de $B$ dans $S(n-1)$, que\nnous noterons $p(j)$ : la structure localement projective de $B$ est l'unique structure telle que\nles $p(j)$ soient des jets projectifs de $B$.\n\\end{prop}"},{"id":"bzthm:c1s2_isomorphisme_fonctoriel","block":"benzecri1960_ch1.tex:118:480","kind":"theorem","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":554,"deps":[],"decls":[],"ndecls":0,"findings":["§ 2 Prop. 2's finding (DEC-122) carried over to the Énoncé: read over all Hausdorff connected cones the printed isomorphism fails for every n ≥ 3 (not_essSurjAsPrinted_dim; true for n ≤ 2, essSurjAsPrinted_of_le_one) because the base of a Hausdorff cone need not be a « variété »; F itself does not fail — every Hausdorff cone is F of its own base (ConeCex.isoFConeBase, iso_FCone_coneBase_and_not_t2Space); the essential image of F is exactly the proper cones (exists_iso_coneObj_iff)"],"notes":"MARKED in corrected form (DEC-127): Benzecri/Cone/Functor.lean carries the mark on coneEquivalence : ConeCat (n+1) ≌ ProjCat n (and baseFunctor_isEquivalence) — V ↦ V/ℝ₊* between connected Hausdorff affine conical manifolds with a proper ℝ₊* action and connected Hausdorff locally projective manifolds, inverse F(B) = FJ(B)/ℛ (Benzecri/Cone/Lift.lean); the in-proof identification « FJ(B) s'identifie avec J₁(F(B)) » is FCone.fjJetHomeomorph (natural in B); l.640 « φ∘j₂ = j₁ » read j₂∘φ = j₁ (misprint, DEC-127).","twin":"","tex":"\\begin{enonce}\nNous nous proposons de montrer que la correspondance établie entre une variété conique affine et\nsa base, définit un isomorphisme fonctoriel entre la catégorie des variétés coniques affines de\ndimension $n$, et celle des variétés localement projectives de dimension $n-1$.\n\\end{enonce}"},{"id":"bzprop:c1s3p1_F_homogene","block":"benzecri1960_ch1.tex:118:655","kind":"proposition","num":"","title":"1","bucket":"A","lean":"closed","nl":"proved","line":657,"deps":["bzdef:c1s1d15_homogene_balayable_divisible"],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Applications/Circle.lean (WP-45t), FCone.prop1_F_homogene; B Hausdorff (plan F6).","twin":"","tex":"\\begin{prop}[1]\nSi $B$ est une variété localement projective homogène (resp. balayable, resp. divisible),\n$F(B)$ considérée comme variété localement affine est homogène (resp. balayable, resp.\ndivisible).\n\\end{prop}"},{"id":"bzcor:c1s3p1c_produit_cercle","block":"benzecri1960_ch1.tex:118:655","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":701,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Applications/Circle.lean (WP-45t), produit_cercle; paracompactness read into « variété » (DEC-128); no compactness needed; the non-paracompact case a remark (DEC-128).","twin":"","tex":"\\begin{corollaire}\nSi $B$ peut être muni d'une structure localement projective, $B\\times S_1$ peut être muni d'une\nstructure localement affine.\n\\end{corollaire}"},{"id":"bzdef:c1s3d1_produit_cones","block":"benzecri1960_ch1.tex:118:655","kind":"definition","num":"","title":"1","bucket":"A","lean":"closed","nl":"definition","line":727,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED for general p: Benzecri/Applications/ProductsGeneral.lean (WP-45x), def1_produit_cones_pi (flat block construction; free, orbits = fibres, equivariantly locally trivial).","twin":"","tex":"\\begin{defin}[1]\nSoient $p$ variétés localement projectives $B_1$, \\ldots, $B_i$, \\ldots, $B_p$; et soit\n\\[ F(B_1)\\times F(B_2)\\times\\ldots\\times F(B_i)\\times\\ldots\\times F(B_p) \\]\nle cône affin produit des cônes affins de bases les $B_i$. Nous munirons ce produit d'une\nstructure d'espace fibré $\\R^{+p}$ principal de base $B_1\\times B_2\\times\\ldots\\times B_p$ en\nfaisant opérer $\\R^{+p}$ sur $F(B_1)\\times\\ldots\\times F(B_p)$ suivant la formule\n\\[ (\\lambda_1\\ldots\\lambda_i\\ldots\\lambda_p)\\times(m_1\\ldots m_p)\n   =(\\lambda_1 m_1, \\ldots, \\lambda_i m_i, \\ldots, \\lambda_p m_p), \\]\noù $\\lambda_i\\in\\R^+$, $m\\in F(B_i)$ et $\\lambda_i m_i$ désigne l'homothétique de $m_i$ dans le\nrapport $\\lambda$.\n\n\\end{defin}"},{"id":"bzprop:c1s3p2_fibre_produit","block":"benzecri1960_ch1.tex:118:655","kind":"proposition","num":"","title":"2","bucket":"A","lean":"closed","nl":"proved","line":741,"deps":[],"decls":[],"ndecls":0,"findings":["Proof remark of § 3 Prop. 2 (p. 244, « On peut encore remarquer »): the product-1 lift of ℝ^{+p}/ℝ^+ is not conical when the factors' dimensions differ (not_isGXMorphism_piSMul_of_ne; converse prod_pow_eq_one_of_isGXMorphism_piSMul); the corrected lift is ∏ λᵢ^{dim F(Bᵢ)} = 1 (piLift, existsUnique_piLift); the statement of Prop. 2 holds (DEC-128)"],"notes":"MARKED for general p: Benzecri/Applications/ProductsGeneral.lean (WP-45x), prop2_fibre_produit_pi (PiTorus acting at once by projective automorphisms, free, orbits = fibres; base Hausdorff; joint continuity).","twin":"","tex":"\\begin{prop}[2]\nLe quotient $\\R^{+p}/\\R^+$ opère sur\n\\[ F^{-1}(F(B_1)\\times\\ldots\\times F(B_i)\\times\\ldots\\times F(B_p)) \\]\net définit sur cette variété localement projective une structure d'espace fibré principal de\nbase $(B_1\\times\\ldots\\times B_i\\times\\ldots\\times B_p)$.\n\\end{prop}"},{"id":"bzprop:c1s3p3_produit_homogene","block":"benzecri1960_ch1.tex:118:655","kind":"proposition","num":"","title":"3","bucket":"A","lean":"closed","nl":"proved","line":761,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED for general p: Benzecri/Applications/ProductsGeneral.lean (WP-45x), prop3_produit_homogene_pi; no paracompactness needed (paracompactSpace_of_properlyDiscontinuousSMul); proved flat rather than by DEC-128's suggested induction.","twin":"","tex":"\\begin{prop}[3]\nSoient $B_1$, \\ldots, $B_i$, \\ldots, $B_p$ des variétés localement projectives homogènes (resp.\nbalayables, resp. divisibles); la variété localement projective\n$F^{-1}(F(B_1)\\times\\ldots\\times F(B_i)\\times\\ldots\\times F(B_p))$ est homogène (resp. balayable,\nresp. divisible).\n\\end{prop}"},{"id":"bzcor:c1s3p3c_produit_projectif","block":"benzecri1960_ch1.tex:118:655","kind":"corollary","num":"","title":"","bucket":"A","lean":"closed","nl":"proved","line":797,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED: Benzecri/Applications/Products.lean (WP-45u), produit_projectif for every p (Hausdorff, σ-compact factors).","twin":"","tex":"\\begin{corollaire}\nSi $p$ variétés $B_i$ peuvent être munies chacune d'une structure localement projective, le\nproduit $B_1\\times\\ldots\\times B_i\\times\\ldots\\times B_p\\times S_1^{(p-1)}$ peut être muni d'une\nstructure localement projective.\n\\end{corollaire}"},{"id":"bzdef:c1s3d2_automorphisme_compatible","block":"benzecri1960_ch1.tex:118:655","kind":"definition","num":"","title":"2","bucket":"A","lean":"closed","nl":"definition","line":806,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED for general p and unequal dimensions: Benzecri/Applications/ConverseGeneral.lean (WP-45y): compatibleSubgroup, exists_isCompatibleAssocPi (the « automorphisme φ » clause), σ only between equal dimensions.","twin":"","tex":"\\begin{defin}[2]\nSoient $p$ variétés localement projectives $B_1$, \\ldots, $B_i$, \\ldots, $B_p$; un automorphisme\nprojectif $f$ de $F^{-1}(F(B_1)\\times\\ldots\\times F(B_i)\\times\\ldots\\times F(B_p))$ est dit\ncompatible s'il peut s'exprimer de la façon suivante : il existe une permutation $\\sigma$ des\nentiers $(1, \\ldots, i, \\ldots, p)$, un système $\\{\\varphi_i\\}$ de $p$ isomorphismes coniques\naffins entre $F(B_{\\sigma(i)})$ et $F(B_i)$, tels que, si l'on définit un automorphisme\n$\\varphi$ de la structure conique affine du produit\n\\[ F(B_1)\\times\\ldots\\times F(B_i)\\times\\ldots\\times F(B_p) \\]\npar la formule\n\\[ (m_1, \\ldots, m_i, \\ldots, m_p)\\overset{\\varphi}{\\to}(m'_1, \\ldots, m'_i, \\ldots, m'_p), \\]\navec\n\\[ m_i\\in F(B_i), \\qquad m'_i\\in F(B_i) \\qquad\\text{et}\\qquad m'_i=\\varphi_i m_{\\sigma(i)}, \\]\non ait\n\\[ f\\in\\{F^{-1}(\\varphi)\\}\\times(\\R^{+p}/\\R^+). \\]\nL'automorphisme $f$ sera dit associé à la permutation $\\sigma$.\n\\end{defin}"},{"id":"bzprop:c1s3p4_reciproque","block":"benzecri1960_ch1.tex:118:655","kind":"proposition","num":"","title":"4","bucket":"A","lean":"closed","nl":"proved","line":823,"deps":["bzdef:c1s3d2_automorphisme_compatible"],"decls":[],"ndecls":0,"findings":[],"notes":"MARKED for general p: Benzecri/Applications/ConverseGeneral.lean (WP-45y), prop4_reciproque_pi; G_I of index ≤ p! (relIndex_compatibleIdSubgroup_le), compatiblePerm with kernel G_I; nonempty factors (DEC-128).","twin":"","tex":"\\begin{prop}[4]\nSoient $p$ variétés localement projectives $B_1$, \\ldots, $B_i$, \\ldots, $B_p$; si le groupe des\nautomorphismes compatibles opère transitivement sur $F^{-1}(F(B_1)\\times\\ldots\\times F(B_p))$,\nles $B_i$ sont projectivement homogènes.\n\nSi $F^{-1}(F(B_1)\\times\\ldots\\times F(B_p))$ est balayable par le groupe de ces automorphismes\ncompatibles, les $B_i$ sont projectivement balayables.\n\\end{prop}"}],"closed":35,"target":36,"macros":{"R":"\\boldsymbol{R}","Rc":"\\mathcal{R}","bzcf":["#1",2]}},"egf":{"blocks":[{"id":"main.tex:153","title":"Preliminaries: GFN for RL and IL"},{"id":"main.tex:213","title":"Ergodic Generative Flows for  RL and IL"},{"id":"main.tex:729","title":"Fundamentals of EGFs"},{"id":"main.tex:770","title":"Universality Theorems"},{"id":"main.tex:843","title":"Quantitative Sampling Theorem"}],"nodes":[{"id":"theo:sampling_theorem","block":"main.tex:153","kind":"theorem","num":"","title":"[bengio2021flow]","bucket":"","lean":"none","nl":"cited","line":178,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{theorem}\n        [\\cite{bengio2021flow, brunswic2024theory}]  \n        Let $\\Finit$, and $\\Fterm$ be unnormalized distributions with $\\Fterm\\neq0$ and let $(\\ForwardPolicyStar, \\Foutstar)$ be a generative flow. If the flow-matching constraint \n        \\begin{equation}\n        \n            \\Finit + \\Foutstar\\ForwardPolicyStar = \\Fterm + \\Foutstar\n        \\end{equation}\n        is satisfied then $\\Finit(\\Statespace)=\\Fterm(\\Statespace)$ and:\n        \\begin{equation}\n            \\mathbb E(\\tau)\\leq \\frac{\\Foutstar(\\Statespace)}{\\Finit(\\Statespace)}+1,\\quad \\quad \\underline s_\\tau \\sim \\Fterm. \\nonumber\n        \\end{equation}\n    \n    \\end{theorem}"},{"id":"def:egf","block":"main.tex:213","kind":"definition","num":"","title":"Ergodic Generative Flows","bucket":"","lean":"none","nl":"definition","line":216,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}[Ergodic Generative Flows] \n        Let $\\Statespace$ be Riemannian manifold endowed with its volume measure $\\lambda$ and let $(\\Phi_{i})_{i=1}^p$ be a family of diffeomorphisms $\\Statespace\\rightarrow \\Statespace$. An EGF is a generative flow, where  \n        \\begin{eqnarray} \n            \\ForwardPolicyStar(s) = \\sum_{i=1}^p\\forwardalpha^i(s) \\delta_{\\Phi_i(s)}\n        \\end{eqnarray}    \n        for some policy $\\forwardalpha:\\Statespace \\rightarrow [0,1]^p$, and such that the group of diffeomorphisms generated by the $\\Phi_i$ is topologically ergodic. That is for all $x,y \\in \\Statespace$ and any neighborhood $\\mathcal U$ of $y$, there exists a sequence $i_1,\\cdots, i_t$ such that $x\\Phi_{i_1}\\Phi_{i_2}\\cdots \\Phi_{i_t} \\in \\mathcal U$.\n    \\end{definition}"},{"id":"def:universal_family","block":"main.tex:213","kind":"definition","num":"","title":"","bucket":"","lean":"none","nl":"definition","line":249,"deps":[],"decls":[],"ndecls":0,"findings":[],"notes":"","twin":"","tex":"\\begin{definition}\nOn a state space $(\\Statespace,\\lambda)$, a family of generative flow family is \nuniversal if for any two distributions $\\mu,\\nu\\ll \\lambda$ with bounded density there is a flow $(\\foutstar,\\ForwardPolicyStar)$ in the family that is flow matching for $\\Finit=\\nu$ and $\\Fterm=\\m
