<title>LeanArticles Dependency Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-height drawing table — header strip, an infinite blueprint canvas, a reading panel docked right (bottom sheet on phones). */
:root{
  --bg:#eef2f5; --canvas:#f6f8fa; --grid:#dfe5eb; --ink:#1b2735; --ink-2:#4d5c6c; --ink-3:#7d8a98;
  --line:#c3ccd6; --card:#ffffff; --accent:#2c5f8f; --accent-soft:#dbe7f2;
  --closed:#2f8259; --partial:#c4861a; --stated:#7f8d9b; --terminal:#b8c1ca; --none:#ffffff;
  --edge:#8d9aa8; --edge-hi:#2c5f8f; --shadow:0 1px 2px rgba(27,39,53,.08),0 4px 14px rgba(27,39,53,.06);
  --f-display:"Newsreader","Iowan Old Style","Georgia",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --canvas:#111923; --grid:#1b2531; --ink:#dce5ef; --ink-2:#a5b3c2; --ink-3:#71808f;
  --line:#2c3a49; --card:#17212d; --accent:#7fb0de; --accent-soft:#1d3247;
  --closed:#4fae7f; --partial:#e0a440; --stated:#8795a4; --terminal:#3d4a58; --none:#17212d;
  --edge:#5d6d7e; --edge-hi:#7fb0de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.005em;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.86rem;min-width:0;flex:1}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);padding:2px 4px;border-radius:4px;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover,.crumbs button:focus-visible{background:var(--accent-soft);outline:none}
.crumbs .here{color:var(--ink);font-weight:600;cursor:default}
.crumbs .sep{color:var(--ink-3)}
.roadbtn{font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:6px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.roadbtn[aria-pressed="true"],.roadbtn:hover:not(:disabled){background:var(--accent);color:var(--card)}
.roadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.roadbtn:disabled{opacity:.45;cursor:not-allowed}
.tgt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--canvas)}
.tgt b{font-weight:600;line-height:1.35}
.tgt .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.74rem;color:var(--ink-3)}
.tgt .q{font-size:.82rem;color:var(--ink-2);line-height:1.45}
.tgt button.go{all:unset;cursor:pointer;color:var(--accent);font-size:.78rem}
.chip.s-ready{border-color:var(--accent);color:var(--accent)}
.chip.s-active{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip.s-needs-ruling{border-color:var(--partial);color:var(--partial);font-weight:600}
.chip.s-blocked{border-style:dashed}
.node .flag{fill:var(--accent);stroke:var(--card);stroke-width:1.5}
.search{display:flex;gap:6px;align-items:center}
.search input{font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:15rem;max-width:52vw}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;min-width:0;background-color:var(--canvas);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
svg#g{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#g:active{cursor:grabbing}
.panel>*{flex-shrink:0}
.panel{width:min(420px,40%);border-left:1px solid var(--line);background:var(--card);overflow:auto;padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance;line-height:1.2}
.panel h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.panel p{margin:0;line-height:1.5;color:var(--ink-2)}
.panel .mono{font-family:var(--f-mono);font-size:.8rem;word-break:break-all}
.panel ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);line-height:1.45}
.panel .tex{border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.55;overflow-x:auto;font-size:.92rem;background:var(--canvas)}
.panel .tex pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:.78rem;margin:0;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.closed{background:var(--closed);border-color:var(--closed);color:#fff}
.chip.partial{background:var(--partial);border-color:var(--partial);color:#fff}
.chip.terminal{background:var(--terminal);border-color:var(--terminal);color:var(--ink)}
.linklist{display:flex;flex-wrap:wrap;gap:6px}
.linklist button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.76rem;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.linklist button:hover,.linklist button:focus-visible{background:var(--accent-soft)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--ink-3)}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--ink-2);max-width:calc(100% - 82px);box-shadow:var(--shadow)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.hint{position:absolute;right:12px;top:10px;font-size:.74rem;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.tools{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.tools button{font:inherit;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.tools button:focus-visible{outline:2px solid var(--accent)}
/* svg */
.node{cursor:pointer}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1}
.node:hover rect.box,.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node:focus-visible{outline:none}.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2.5}
.node text{fill:var(--ink);font-family:var(--f-body)}
.node .t-display{font-family:var(--f-display);font-weight:600}
.node .t-mono{font-family:var(--f-mono)}
.node .t-dim{fill:var(--ink-3)}
.node .t-2{fill:var(--ink-2)}
.node .t-aside{fill:var(--ink-3);font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.02em}
.node.lib rect.box{fill:var(--accent-soft);stroke:var(--accent)}
.node.ghost rect.box{fill:none;stroke-dasharray:4 3;stroke:var(--ink-3)}
.node.ghost text{fill:var(--ink-3)}
.node.st-closed rect.box{fill:var(--closed);stroke:var(--closed)}
.node.st-partial rect.box{fill:var(--partial);stroke:var(--partial)}
.node.st-closed text,.node.st-partial text{fill:#fff}
.node.st-terminal rect.box{fill:url(#hatch)}
.node.st-none rect.box{fill:var(--none);stroke-dasharray:5 3;stroke:var(--stated)}
.node.st-closed:hover rect.box,.node.st-partial:hover rect.box,.node.st-closed.sel rect.box,.node.st-partial.sel rect.box{stroke:var(--ink);stroke-width:2.5}
.edge path{fill:none;stroke:var(--edge);stroke-opacity:.75}
.edge.dashed path{stroke-dasharray:6 4}
.edge.hi path{stroke:var(--edge-hi);stroke-opacity:1}
.edge text{fill:var(--ink-3);font-size:11px;font-family:var(--f-mono)}
/* the Lean overlay: one class per doubledag edge kind */
.edge.k-both path.vis{stroke:var(--closed);stroke-opacity:.95}
.edge.k-lean path.vis{stroke:var(--accent);stroke-opacity:.8;stroke-dasharray:5 3}
.edge.k-tex path.vis{stroke:var(--partial);stroke-opacity:.95;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.edge.k-texu path.vis{stroke:var(--edge)}
.edge.k-twin path.vis{stroke:var(--ink-3);stroke-dasharray:8 3 2 3}
.edge.k-pboth path.vis{stroke:var(--accent);stroke-opacity:.85}
.edge.k-lean text,.edge.k-pboth text{fill:var(--accent)}
.edge.hi path.vis{stroke:var(--edge-hi);stroke-opacity:1}
.edge.dim{opacity:.13}.edge.dim.hi{opacity:1}
.edge.esel path.vis{stroke-width:2.8px;stroke-opacity:1}
.edge path.hit{stroke:transparent;stroke-width:12px;stroke-dasharray:none;pointer-events:stroke}
.legend svg{vertical-align:middle;margin-right:5px;overflow:visible}
.linklist button.lk{border-left:3px solid var(--line)}
.lk.k-both{border-left-color:var(--closed)!important}.lk.k-lean{border-left-color:var(--accent)!important}
.lk.k-tex{border-left-color:var(--partial)!important}.lk.k-twin{border-left-color:var(--ink-3)!important}
ol.wit{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
ol.wit .mono{display:block;font-family:var(--f-mono);font-size:.78rem;word-break:break-all;color:var(--ink)}
ol.wit .loc{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);word-break:break-all}
.panel .warn{border-left:3px solid var(--partial);padding-left:10px}
.panel details summary{cursor:pointer;color:var(--ink-2);font-size:.86rem}
.panel .prov{font-size:.78rem;color:var(--ink-3)}
.cluster rect{fill:none;stroke:var(--line);stroke-dasharray:2 4;rx:14}
.cluster text{fill:var(--ink-3);font-family:var(--f-body);font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.world{transition:opacity .22s ease}
.world.fade{opacity:0}
@media (prefers-reduced-motion: reduce){.world{transition:none}}
@media (max-width:760px){
  main{flex-direction:column}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:42%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  h1{font-size:1.15rem}
}
</style>

<div class="app">
<header>
  <h1>Dependency Atlas</h1>
  <nav class="crumbs" id="crumbs" aria-label="Level"></nav>
  <button id="leanbtn" class="roadbtn" aria-pressed="false">Lean edges</button>
  <button id="roadbtn" class="roadbtn" aria-pressed="false">Roadmap <span id="roadn"></span></button>
  <div class="search">
    <label for="q" class="t-dim" style="font-size:.78rem;color:var(--ink-3)">Find</label>
    <input id="q" list="labels" placeholder="label, e.g. theo:Galois_cor" autocomplete="off">
    <datalist id="labels"></datalist>
  </div>
</header>
<main>
  <div class="stage">
    <svg id="g" role="img" aria-label="Dependency graph">
      <defs>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="7" height="7" fill="var(--card)"></rect><line x1="0" y1="0" x2="0" y2="7" stroke="var(--terminal)" stroke-width="4"></line>
        </pattern>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--edge)"></path></marker>
        <marker id="arrhi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--edge-hi)"></path></marker>
        <marker id="arr-both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--closed)"></path></marker>
        <marker id="arr-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"></path></marker>
        <marker id="arr-tex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--partial)"></path></marker>
      </defs>
      <g id="world" class="world"></g>
    </svg>
    <div class="hint" id="hint">Click a block to open it · drag to pan · scroll to zoom · Esc goes up</div>
    <div class="legend" id="legend"></div>
    <div class="tools"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to view">⤢</button></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script>
window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]],processEscapes:true,packages:{'[+]':['noerrors','noundefined','ams']}},
  options:{skipHtmlTags:["script","style","pre","code"]},svg:{fontCache:"local"},startup:{typeset:false}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js" async></script>
<script>
const DATA = __DATA__;
const HUB = __HUB__;
const ROAD = __ROAD__;
const LEAN = __LEAN__;
const OPEN_ST = new Set(["planned","ready","active","needs-ruling","blocked"]);
const openTargets = ROAD.targets.filter(t=>OPEN_ST.has(t.status));
const targetsForPaper = p => openTargets.filter(t=>t.paper===p);
const targetsForLabel = (p,id) => openTargets.filter(t=>t.paper===p && (t.labels||[]).includes(id));
const ST_LABEL = {planned:"planned",ready:"ready",active:"in progress","needs-ruling":"needs your ruling",blocked:"blocked",done:"done",dropped:"dropped"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wrap(text, n, maxLines){
  const words = String(text).split(/\s+/); const lines=[]; let cur="";
  for (const w of words){ if ((cur+" "+w).trim().length>n && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }
  if (cur) lines.push(cur);
  if (lines.length>maxLines){ const l=lines.slice(0,maxLines); l[maxLines-1]=l[maxLines-1].replace(/.{0,2}$/,"")+"…"; return l; }
  return lines;
}
function statusOf(n){
  if (n.lean==="closed") return "closed";
  if (n.lean==="partial") return "partial";
  if (n.bucket==="T") return "terminal";
  return "none";
}
const KIND_ABBR={theorem:"Thm",theo:"Thm",proposition:"Prop",lemma:"Lem",corollary:"Cor",definition:"Def",remark:"Rem",example:"Ex",counterexample:"Cex",conjecture:"Conj",claim:"Claim",notation:"Not"};
function kindLabel(n){ const k=KIND_ABBR[n.kind]||(n.kind||"").slice(0,4); return (k+(n.num?" "+n.num:"")).trim(); }
function counts(nodes){ const c={closed:0,partial:0,terminal:0,none:0}; nodes.forEach(n=>c[statusOf(n)]++); return c; }
function shortBlock(t){ const i=t.lastIndexOf(" › "); return i<0?t.replace(/\.$/,""):t.slice(i+3).replace(/\.$/,""); }
function parentSec(t){ const i=t.lastIndexOf(" › "); return i<0?"":t.slice(0,i).replace(/\.$/,""); }

/* indexes */
const LABEL = {};  // label -> {p, node}
for (const p in DATA) for (const n of DATA[p].nodes) LABEL[p+"/"+n.id]={p,n};
const labelsDL = $("#labels");
Object.keys(LABEL).sort().forEach(k=>{ const o=document.createElement("option"); o.value=LABEL[k].n.id; o.label=HUB.papers[LABEL[k].p]?.short||LABEL[k].p; labelsDL.appendChild(o); });

/* ---------- the Lean overlay (lean_edges.py over tools/doubledag.py) ---------- */
const KINDS=["both","lean-only","tex-only","tex-only-unformalized","twin","both-unformalized"];
const KCLS={"both":"k-both","lean-only":"k-lean","tex-only":"k-tex","tex-only-unformalized":"k-texu","twin":"k-twin","both-unformalized":"k-both"};
const KMK={"both":"arr-both","lean-only":"arr-lean","tex-only":"arr-tex","both-unformalized":"arr-both"};
const KNAME={"both":"both","lean-only":"Lean only","tex-only":"draft only","tex-only-unformalized":"draft only, an end without Lean","twin":"twin","both-unformalized":"both, an end without Lean"};
const KTXT={"both":"cited by the draft and used by the Lean proof","lean-only":"used by the Lean proof, never cited by the draft",
  "tex-only":"cited by the draft, not reached by the Lean proof","tex-only-unformalized":"cited by the draft; one end has no Lean declaration yet",
  "twin":"a restatement: a body statement and its full form","both-unformalized":"cited by the draft and reached in Lean; one end has no principal"};
const LE={};
for (const [p,L] of Object.entries(LEAN)){
  if (!DATA[p]) continue;
  const ids=DATA[p].nodes.map(n=>n.id);
  const edges=L.edges.map(([s,t,k,w],i)=>({i,s:ids[s],t:ids[t],k:KINDS[k],w}));
  const bySrc={},byTgt={},pair={};
  edges.forEach(e=>{ (bySrc[e.s]??=[]).push(e); (byTgt[e.t]??=[]).push(e); pair[e.s+"|"+e.t]=e; });
  const ord=e=>KINDS.indexOf(e.k);
  for (const m of [bySrc,byTgt]) for (const k in m) m[k].sort((a,b)=>ord(a)-ord(b)||(a.s+a.t).localeCompare(b.s+b.t));
  const principals={}; L.principals.forEach(([l,ns])=>principals[ids[l]]=ns.map(i=>L.names[i]));
  LE[p]={...L,edges,bySrc,byTgt,pair,principals};
}
let leanOn=false;
const hasLean = p => !!(LE[p]&&LE[p].edges.length);
const leanFor = p => leanOn&&hasLean(p)?LE[p]:null;
const fmtN = n => Number(n).toLocaleString("en-US");
function shortDecl(n){ const i=n.lastIndexOf("."); return i<0?n:n.slice(i+1); }
function edgeTip(p,e){ const L=LE[p];
  return `${e.s} uses ${e.t}: ${KTXT[e.k]}`+(e.w.length?`\nwitness: ${e.w.map(i=>shortDecl(L.names[i])).join(" → ")}`:"")+"\n(click for the witness)"; }
function leanEdge(p,e){ return {v:e.t,w:e.s,cls:KCLS[e.k],mk:KMK[e.k]||"arr",tip:edgeTip(p,e),click:()=>showLeanEdge(p,e)}; }
function swatch(cls){ return `<svg width="24" height="8" aria-hidden="true" class="edge ${cls}"><path class="vis" d="M1,4H23" stroke-width="1.8"></path></svg>`; }

/* ---------- svg + zoom ---------- */
const svg = d3.select("#g"), world = d3.select("#world");
const zoom = d3.zoom().scaleExtent([0.08,4]).on("zoom", e => world.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let bbox = {x:0,y:0,w:100,h:100};
function fitTransform(pad=40){
  const W=svg.node().clientWidth, H=svg.node().clientHeight;
  const k=Math.min(1.25,(W-2*pad)/bbox.w,(H-2*pad)/bbox.h);

/* ---------- graph builders ---------- */
function hubGraph(){
  const nodes=[], edges=[];
  for (const [id,pp] of Object.entries(HUB.papers)){
    const d=DATA[id];
    nodes.push({id, kind:"paper", w:236, h:104, cluster:pp.cluster, drill:!!d, pp, c:d?counts(d.nodes):null, closed:d?d.closed:pp.closed, target:d?d.target:pp.target});
  }
  for (const [id,lib] of Object.entries(HUB.libs)) nodes.push({id, kind:"lib", w:236, h:90, cluster:"libs", lib});
  HUB.edges.forEach(e=>edges.push({v:e.from,w:e.to,label:e.short,dashed:e.dashed,info:e}));
  return {nodes,edges,rankdir:"TB",clusters:HUB.clusters, nodesep:36, ranksep:62, aspect:1.25};
}
function paperGraph(p){
  const d=DATA[p]; const byBlock={}; d.nodes.forEach(n=>(byBlock[n.block]??=[]).push(n));
  const blockOf={}; d.nodes.forEach(n=>blockOf[n.id]=n.block);
  const nodes=d.blocks.map(b=>({id:b.id,kind:"block",w:250,h:92,b,c:counts(byBlock[b.id]||[]),n:(byBlock[b.id]||[]).length,drill:true}));
  const agg={};
  d.nodes.forEach(n=>n.deps.forEach(dep=>{ const a=blockOf[dep], b=n.block; if(a&&a!==b){ const k=a+"|"+b; agg[k]=(agg[k]||0)+1; } }));
  const L=leanFor(p);
  const refs=v=>`${v} reference${v>1?"s":""} in the draft`;
  if (!L){
    const edges=Object.entries(agg).map(([k,v])=>{const [a,b]=k.split("|");
      return {v:a,w:b,weight:v,label:String(v),tip:refs(v)+" (click for the list)",click:()=>showAgg(p,a,b,"tex")};});
    return {nodes,edges,rankdir:"TB",nodesep:36,ranksep:64};
  }
  // With the overlay: one arrow per pair of blocks, for the draft's references and the Lean edges
  // (both + Lean only) between them; its style says which of the two the pair has.
  const la={};
  L.edges.forEach(e=>{ if(e.k!=="lean-only"&&e.k!=="both"&&e.k!=="both-unformalized") return;
    const a=blockOf[e.t], b=blockOf[e.s]; if(a&&b&&a!==b){ const k=a+"|"+b; la[k]=(la[k]||0)+1; } });
  const keys=[...new Set([...Object.keys(agg),...Object.keys(la)])].sort();
  const edges=keys.map(k=>{ const [a,b]=k.split("|"), t=agg[k]||0, l=la[k]||0;
    const lean=`${l} Lean edge${l>1?"s":""}`, click=()=>showAgg(p,a,b,"pair");
    if (t&&l) return {v:a,w:b,weight:t+l,label:String(t),cls:"k-pboth",mk:"arr-lean",tip:`${refs(t)}; ${lean} (click for the list)`,click};
    if (t) return {v:a,w:b,weight:t,label:String(t),tip:`${refs(t)}; no Lean edge (click for the list)`,click};
    return {v:a,w:b,weight:l,cls:"k-lean",mk:"arr-lean",tip:`${lean}, no reference in the draft (click for the list)`,click}; });
  return {nodes,edges,rankdir:"TB",nodesep:36,ranksep:64,adaptive:true};
}
function blockGraph(p,bid){
  const d=DATA[p]; const inB=d.nodes.filter(n=>n.block===bid); const ids=new Set(inB.map(n=>n.id));
  const byId={}; d.nodes.forEach(n=>byId[n.id]=n);
  const L=leanFor(p);
  const nodes=inB.map(n=>({id:n.id,kind:"stmt",w:200,h:L?62:50,n}));
  const edges=[]; const ghosts={};
  const tex=(user,dep)=>{ const e=L&&L.pair[user+"|"+dep]; return e?leanEdge(p,e):{v:dep,w:user}; };
  inB.forEach(n=>n.deps.forEach(dep=>{ if(!ids.has(dep)) ghosts[dep]=byId[dep]; edges.push(tex(n.id,dep)); }));
  d.nodes.forEach(n=>{ if(!ids.has(n.id)) n.deps.forEach(dep=>{ if(ids.has(dep)){ ghosts[n.id]=n; edges.push(tex(n.id,dep)); } }); });
  if (L){
    // Lean-only edges: drawn inside the block and to statements already on the page; the rest are
    // counted on the statement (the paper level draws them between blocks, the panel lists them).
    const badge={};
    L.edges.forEach(e=>{ if(e.k!=="lean-only") return; const sIn=ids.has(e.s), tIn=ids.has(e.t); if(!sIn&&!tIn) return;
      const other=sIn?e.t:e.s;
      if ((sIn&&tIn)||ghosts[other]) edges.push(leanEdge(p,e));
      else { const me=sIn?e.s:e.t; const b=(badge[me]??={uses:0,usedby:0}); b[sIn?"uses":"usedby"]++; } });
    nodes.forEach(N=>N.badge=badge[N.id]);
  }
  for (const [g,n] of Object.entries(ghosts)) nodes.push({id:g,kind:"ghost",w:200,h:44,n});
  return {nodes,edges,rankdir:"TB",nodesep:22,ranksep:46,adaptive:!!L};
}

/* ---------- layout + draw ---------- */
function dagreOne(nodes,edges,G){
  const g=new dagre.graphlib.Graph({multigraph:true});
  g.setGraph({rankdir:G.rankdir,nodesep:G.nodesep,ranksep:G.ranksep,marginx:0,marginy:0});
  g.setDefaultEdgeLabel(()=>({}));
  nodes.forEach(n=>g.setNode(n.id,{width:n.w,height:n.h}));
  edges.forEach(e=>g.setEdge(e.v,e.w,{label:e.label,width:e.label?18:0,height:e.label?14:0,labelpos:"c",weight:e.weight||1},"e"+e.i));
  dagre.layout(g);
  const gi=g.graph(); return {g,w:gi.width||0,h:gi.height||0};
}
function components(nodes,edges){
  const par={}; nodes.forEach(n=>par[n.id]=n.id);
  const f=x=>par[x]===x?x:(par[x]=f(par[x]));
  edges.forEach(e=>{ if(par[e.v]!=null&&par[e.w]!=null) par[f(e.v)]=f(e.w); });
  const groups={}; nodes.forEach(n=>(groups[f(n.id)]??=[]).push(n)); return Object.values(groups);
}
/* Lay out each group with dagre, then shelf-pack the groups into rows; returns absolute geometry. */
function layout(G){
  const edges=G.edges.map((e,i)=>({...e,i}));
  let groups;
  if (G.clusters) groups=G.clusters.map(c=>({c,nodes:G.nodes.filter(n=>n.cluster===c.id)})).filter(x=>x.nodes.length);
  else groups=components(G.nodes,edges).map(ns=>({nodes:ns}));
  const pad=G.clusters?28:0, top=G.clusters?34:0;
  const parts=groups.map(gr=>{ const ids=new Set(gr.nodes.map(n=>n.id)); const es=edges.filter(e=>ids.has(e.v)&&ids.has(e.w));
    const r=dagreOne(gr.nodes,es,G); return {...gr,es,r,w:r.w+2*pad,h:r.h+pad+top}; });
  if (!G.clusters) parts.sort((a,b)=>b.nodes.length-a.nodes.length||b.h-a.h);
  const area=parts.reduce((a,p)=>a+p.w*p.h,0);
  const maxW=Math.max(...parts.map(p=>p.w), Math.sqrt(area)*(G.aspect||1.5));
  const gapX=G.clusters?40:G.nodesep*1.6, gapY=G.clusters?40:G.ranksep;
  let x=0,y=0,rowH=0,W=0; const out={nodes:{},edges:[],clusters:[]};
  parts.forEach(p=>{
    if (x>0 && x+p.w>maxW){ x=0; y+=rowH+gapY; rowH=0; }
    const ox=x+pad, oy=y+top;
    p.nodes.forEach(n=>{ const q=p.r.g.node(n.id); out.nodes[n.id]={x:q.x+ox,y:q.y+oy,width:n.w,height:n.h}; });
    p.r.g.edges().forEach(eo=>{ const e=p.r.g.edge(eo); out.edges.push({src:edges[+eo.name.slice(1)],points:e.points.map(pt=>({x:pt.x+ox,y:pt.y+oy})),x:e.x!=null?e.x+ox:null,y:e.y!=null?e.y+oy:null,label:e.label,v:eo.v,w:eo.w}); });
    if (p.c) out.clusters.push({title:p.c.title,x,y,w:p.w,h:p.h});
    x+=p.w+gapX; rowH=Math.max(rowH,p.h); W=Math.max(W,x-gapX);
  });
  out.width=W; out.height=y+rowH; return out;
}
function bar(sel,c,x,y,w,h){
  const tot=c.closed+c.partial+c.terminal+c.none||1; let xx=x;
  [["closed","var(--closed)"],["partial","var(--partial)"],["terminal","url(#hatch)"],["none","var(--grid)"]].forEach(([k,col])=>{
    const ww=w*c[k]/tot; if(ww>0){ sel.append("rect").attr("x",xx).attr("y",y).attr("width",ww).attr("height",h).attr("fill",col).attr("stroke",k==="terminal"?"var(--terminal)":"none").attr("stroke-width",.5); xx+=ww; }
  });
  sel.append("rect").attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",2).attr("fill","none").attr("stroke","var(--line)");
}
let G=null, g=null;

/* ---------- navigation with zoom-in / zoom-out transitions ---------- */
function go(next, fromNodeId, dir){
  const W=svg.node().clientWidth,H=svg.node().clientHeight;
  const after=()=>{ state=next; selected=null; world.classed("fade",true); draw(); panelForLevel();
    const t=fitTransform();
    if (reduce){ svg.call(zoom.transform,t); world.classed("fade",false); return; }
    const pre = dir==="up" ? t.scale(2.2).translate(-(bbox.w/2)*(1-1/2.2),-(bbox.h/2)*(1-1/2.2)) : d3.zoomIdentity.translate(W/2,H/2).scale(t.k*0.25).translate(-bbox.w/2,-bbox.h/2);
    svg.call(zoom.transform,pre); requestAnimationFrame(()=>{ world.classed("fade",false); svg.transition().duration(480).ease(d3.easeCubicOut).call(zoom.transform,t); });
  };
  if (reduce){ after(); return; }
  if (fromNodeId && g && g.nodes[fromNodeId]){
    const p=g.nodes[fromNodeId]; const k=Math.min(4,Math.max(W/p.width,H/p.height)*0.9);
    svg.transition().duration(380).ease(d3.easeCubicIn).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*p.x,H/2-k*p.y).scale(k)).on("end",after);
    world.classed("fade",true);
  } else { world.classed("fade",true); setTimeout(after,200); }
}
function onNode(N, el){
  if (N.kind==="paper"){ if (N.drill) go({level:"paper",p:N.id},N.id,"down"); else { selected=N.id; markSel(); showPaperInfo(N.id); } return; }
  if (N.kind==="lib"){ selected=N.id; markSel(); showLib(N.id); return; }
  if (N.kind==="block"){ go({level:"block",p:state.p,b:N.id},N.id,"down"); return; }
  if (N.kind==="ghost"){ openStatement(state.p,N.id); return; }
  selected=N.id; markSel(); showStmt(state.p,N.n);
}
function openStatement(p,id){
  const n=LABEL[p+"/"+id].n;
  const after=()=>{ selected=id; markSel(); showStmt(p,n); const q=g.nodes[id]; if(q){ const W=svg.node().clientWidth,H=svg.node().clientHeight; const k=Math.max(fitTransform().k,0.9); svg.transition().delay(reduce?0:520).duration(reduce?0:420).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*q.x,H/2-k*q.y).scale(k)); } };
  if (state.level==="block"&&state.p===p&&state.b===n.block) { after(); return; }
  go({level:"block",p,b:n.block},null,"down"); setTimeout(after, reduce?0:260);
}

function showLeanEdge(p,e){

function texHTML(t){
  const body=t.replace(/^\\begin\{[a-zA-Z*]+\}(\[[^\]]*\])?/,"").replace(/\\end\{[a-zA-Z*]+\}\s*$/,"")
    .replace(/\\(begin|end)\{(itemize|enumerate)\}/g,"").replace(/\\item\s*/g,"\n• ").replace(/\\(emph|textit|textbf)\{([^{}]*)\}/g,"$2")
    .replace(/\\(cite|ref|eqref|cref|Cref)(\[[^\]]*\])?\{[^}]*\}/g,"[·]").trim();
  return `<div class="mj">${esc(body).replace(/\n\s*\n/g,"<br><br>")}</div>`;
}
let mjMacrosFor=null;
function typeset(p){
  const el=$("#tex"); if(!el) return;
  const MJ=window.MathJax; if(!MJ||!MJ.typesetPromise){ setTimeout(()=>typeset(p),300); return; }
  try{
    if (mjMacrosFor!==p){ MJ.config.tex.macros=Object.assign({R:"\\mathbb{R}",N:"\\mathbb{N}",Z:"\\mathbb{Z}",C:"\\mathbb{C}"},DATA[p].macros||{}); MJ.startup.getComponents(); mjMacrosFor=p; }
    MJ.typesetClear&&MJ.typesetClear([el]); MJ.typesetPromise([el]).catch(()=>{});
  }catch(e){}
}

  const lean=leanLegend();
  if (state.level==="block") L.innerHTML=`<span><i style="background:var(--closed);border-color:var(--closed)"></i>closed in Lean</span><span><i style="background:var(--partial);border-color:var(--partial)"></i>partial</span><span><i style="background:url(#);background:repeating-linear-gradient(45deg,var(--terminal) 0 3px,var(--card) 3px 6px)"></i>terminal</span><span><i style="border-style:dashed;border-color:var(--stated)"></i>not formalized</span><span><i style="border-style:dashed;background:none"></i>in another block</span><span><i style="background:var(--accent);border-color:var(--accent);transform:rotate(45deg) scale(.7)"></i>on the roadmap</span>${lean}`;
  else L.innerHTML=`<span><i style="background:var(--closed);border-color:var(--closed)"></i>closed</span><span><i style="background:var(--partial);border-color:var(--partial)"></i>partial</span><span><i style="background:repeating-linear-gradient(45deg,var(--terminal) 0 3px,var(--card) 3px 6px)"></i>terminal</span><span><i style="background:var(--grid)"></i>no Lean yet</span>${state.level==="paper"?"<span>arrow width = statement dependencies</span>":"<span>arrow: used by</span>"}<span><i style="background:var(--accent);border-color:var(--accent);transform:rotate(45deg) scale(.7)"></i>on the roadmap</span>${lean}`;
}

/* ---------- boot ---------- */
draw(); panelForLevel(); fit(false);
</script>
