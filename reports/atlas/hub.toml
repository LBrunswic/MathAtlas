[paper.syracuse]
short = "Syracuse"
cluster = "other"
authors = "L. Brunswic"
title = "On non-trivial cycles of the 3x+1 problem"
home = "lean-syracuse"
summary = "An extension of Terras's method constraining non-trivial cycles through upper bounds and cyclotomic arithmetic. Formalized in lean-syracuse (DEC-138), from § 1 on: ℤ/2ℤ-rings, the maps f_A and T_A, the sequences a_n and p_n, the basic identity and A_u^n (Syracuse.Valuation, Syracuse.Base; 895d501)."
headline = ["Syracuse.base", "Syracuse.Aun", "Syracuse.ring_maps_rhs"]
open = "The rows formalized so far are partial on readings of the printed definitions (OQ-42), except A_u^n (def:define_n__n_), marked as printed while OQ-43 asks whether it or its later use is off by one. The rest of § 1 (the 2-adic representation, T-syr-rep; the integer bounds, T-syr-integer-bounds) and §§ 2–3 remain."

[paper.dyniso]
short = "dyniso"
cluster = "other"
authors = ""
title = "Orthogonal hyper-connections: why the Birkhoff polytope breaks dynamical isometry"
aside = "DEC-140"
summary = "Bistochastic skip mixing contracts the non-Perron spectrum over depth; orthogonal skips restore dynamical isometry. Set aside by DEC-140: it is JPMc work, with no package and no target; its ledger stays as a record."
headline = []

[paper.yamabe]
short = "Yamabe gap"
cluster = "other"
authors = "L. Brunswic"
title = "The Yamabe gap: inhomogeneity measure and morphological driver of cosmic expansion"
home = "lean-yamabe"
summary = "The averaged scalar curvature of a void is governed by the Yamabe energy of its leaves; bounds on punctured flat tori. Formalized in lean-yamabe, scoped first to § 6, the punctured flat tori, and its proofs (DEC-139): the trace-Sobolev quotient over an abstract measured model (Yamabe.Quotient, Yamabe.Stability; e4e12c0)."
headline = ["Yamabe.MeasuredModel.stability", "Yamabe.MeasuredModel.rem_sign"]
open = "lem:stability and rem:sign are partial: an abstract layer, whose Riemannian anchoring waits on which cited analytic theorems become named externals (T-yamabe-scope, the author's). OQ-44 asks to confirm the layer's readings, and reports eq:hoelder's boundary line false as printed when Vol(B_j) < 1."

