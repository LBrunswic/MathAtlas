[paper.syracuse]
short = "Syracuse"
cluster = "other"
authors = "L. Brunswic"
title = "On non-trivial cycles of the 3x+1 problem"
home = "lean-syracuse"
summary = "An extension of Terras's method constraining non-trivial cycles through upper bounds and cyclotomic arithmetic. Formalized in lean-syracuse (DEC-138), from § 1 on: ℤ/2ℤ-rings, the maps f_A and T_A, the sequences a_n and p_n, the basic identity and A_u^n (Syracuse.Valuation, Syracuse.Base; 895d501)."
headline = ["Syracuse.base", "Syracuse.Aun", "Syracuse.ring_maps_rhs"]
open = "The rows formalized so far are partial on readings of the printed definitions (OQ-42), except A_u^n (def:define_n__n_), marked as printed while OQ-43 asks whether it or its later use is off by one. The rest of § 1 (the 2-adic representation, T-syr-rep; the integer bounds, T-syr-integer-bounds) and §§ 2–3 remain."

[paper.dyniso]
short = "dyniso"
cluster = "other"
