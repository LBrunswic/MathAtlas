[paper.egf]
short = "EGF"
cluster = "gfn"
authors = "Brunswic et al. · ICML 2025"
title = "Ergodic Generative Flows"
home = "lean-egf"
source = "camera-ready"
summary = "Generative flows whose forward policy is a finite family of diffeomorphisms; universality from ergodicity. Fully formalized and corrected by a loop of its own, /egf-programme (DEC-141): the Lean is in lean-egf; every place where the formalization finds the paper wrong or short is an entry of the corrections register (papers/egf/programme/corrections.toml), proved in Lean, adopted under the standing ruling and applied to the arXiv v2 working copy; the experiments are reproduced in a private repository on node1. Theorem B.1 holds under weaker hypotheses than printed, and under ergodicity alone (EGF.universal_iff_ergodic); the inflow is dominated as soon as the moves are nonsingular (EGF.inflow_ac_of_map_ac)."
headline = ["EGF.main_universality", "EGF.universal_iff_ergodic", "EGF.universality", "EGF.main_quantitative_sampling", "EGF.pinsker_negative_control", "EGF.inflow_ac_of_map_ac", "EGF.backward_policy"]
open = "The two concrete families (Theorems 3.5 and 3.6, from the cited spectral-gap theorems stated as named Props) and the mixing criteria are in progress; the corrected v2 is packaged for the author's review once the last correction batches land (T-egf-v2-package), and the reproduction runs on node1's GPU. Readings left to the author: OQ-47 (summable mixing when the invariant measure differs from lambda), OQ-48 (group or forward-word ergodicity), OQ-83 (Algorithm 1's backward buffer), OQ-84 (which weak-FM term is of record), OQ-85 (whether v2 states the strengthenings of Theorem B.1)."

