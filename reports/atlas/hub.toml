[paper.bbs]
short = "BBS → 3+1"
cluster = "geo"
authors = "T. Barbot · F. Bonsante · J.-M. Schlenker · Comm. Math. Phys. 308 (2011)"
title = "Collisions of particles in locally AdS spacetimes I: local description and global examples"
home = "lean-gx"
source = "arXiv 1010.3602 v1"
summary = "An external paper counted in the hub (DEC-132, as DEC-34 did for Barbot); its reading map is papers/bbs/STORY.md: singular lines and their links (a singular point is the suspension of its HS-link), particle interactions classified by the topology of their link, and global hyperbolicity with singular lines. Its research side stays REVIEW.md (the review against gx, with the layered Lean roadmap) and NOTES-3+1.md (the 3+1 programme: Theorems M and G, both unverified), whose first layers, the conic, celestial and affine suspensions, are built in lean-gx."
headline = ["GX.Suspension.Conic", "GX.Suspension.Celestial", "GX.Suspension.Affine"]
open = "The whole ledger: no row is anchored in Lean yet (the suspension modules above are keyed to REVIEW.md, not to ledger labels), and the statement DAG has no edges yet because the authors' \\ref's point at their own labels, which the ledger does not resolve. On the research side: BBS-Q1…Q8, the funnel lemma, Theorem M in Lean; codimension-2 strata need an interface ruling (BBS-Q7)."

