aside = "DEC-140"
summary = "Bistochastic skip mixing contracts the non-Perron spectrum over depth; orthogonal skips restore dynamical isometry. Set aside by DEC-140: it is JPMc work, with no package and no target; its ledger stays as a record."
headline = []

[paper.yamabe]
short = "Yamabe gap"
cluster = "other"
authors = "L. Brunswic"
title = "The Yamabe gap: inhomogeneity measure and morphological driver of cosmic expansion"
home = "lean-yamabe"
summary = "The averaged scalar curvature of a void is governed by the Yamabe energy of its leaves; bounds on punctured flat tori. Formalized in lean-yamabe, scoped first to § 6, the punctured flat tori, and its proofs (DEC-139): the trace-Sobolev quotient over an abstract measured model (Yamabe.Quotient, Yamabe.Stability; e4e12c0)."
headline = ["Yamabe.MeasuredModel.stability", "Yamabe.MeasuredModel.rem_sign"]
open = "lem:stability and rem:sign are partial: an abstract layer, whose Riemannian anchoring waits on which cited analytic theorems become named externals (T-yamabe-scope, the author's). OQ-44 asks to confirm the layer's readings, and reports eq:hoelder's boundary line false as printed when Vol(B_j) < 1."

[paper.perforated]
short = "Perforated"
cluster = "other"
authors = "L. Brunswic · in preparation"
title = "A capacitary lower bound for the doubly critical trace-Sobolev constant of a perforated manifold"
home = "lean-yamabe (shared with yamabe)"
source = "legacy perforated.tex (PositiveYamabeGap, 6c57c10)"
summary = "The companion of the Yamabe gap paper, cited there as BrunswicPerforated (Yamabegap.bib:497–502). On a compact Riemannian manifold whose boundary has several components, the trace-Sobolev constant with both exponents critical is bounded below through a capacity (thm:main), under a quadratic Sobolev hypothesis that the paper proves with an explicit constant; the draft states the bound's asymptotic optimality for a small boundary (thm:sharp, open in the draft) and treats the punctured flat torus. Ledgered as a paper of its own by DEC-185 (T-yamabe-companion, 3af8e6b), so that the Lean mirror of the Yamabe research is self-contained; its Lean is lean-yamabe, with no label shared with yamabe."
headline = []
open = "The formalization has not started: no row names a Lean declaration yet. Closing yamabe's thm:lower-bound from it is T-yamabe-companion's second half; the story is a skeleton for the author (papers/perforated/STORY.md)."

