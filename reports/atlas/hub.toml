[paper.ett]
short = "ETT"
cluster = "geo"
authors = "L. Brunswic"
title = "Topological spacetimes (I): from scratch to Geroch's and Choquet-Bruhat–Geroch's theorems"
home = "lean-causal"
source = "legacy ETT.tex"
summary = "Causal theory for topological spaces with a causality and no smooth structure, so singular spacetimes (cones E_α, BTZ lines) are first-class. The library proves Geroch (i)⇒(ii)⇒(iii), Lemma K through Levin's theorem, and the universal maximal Cauchy development."
headline = ["Causal.geroch_i_imp_ii", "Causal.geroch_ii_imp_iii", "Causal.Causality.isCauchySurface_of_isLocallyCauchy_of_causallyOpen", "Causal.CBG.cbg_ett"]
open = "Singular §3–§4 material is proved under named model hypotheses until gx supplies the instance; the CBG rows are not yet anchored; Geroch (iii)⇒(i) is cited; the scaffold sorrys are counted on the lean-causal card; open questions OQ-10…20."

[paper.barbot]
short = "Barbot"
cluster = "geo"
authors = "T. Barbot · J. Geom. Phys. 53 (2005)"
title = "Globally hyperbolic flat space-times"
home = "lean-causal (Causal.Flat)"
source = "arXiv math/0402257"
summary = "Theorems A and B (classification of Cauchy-complete and Cauchy-compact GH flat spacetimes) proved with no hypothesis beyond the paper's. Selberg, Bieberbach I, Auslander–Carrière–Dal'bo, Fried–Goldman–Hirsch and Gromov (in place of Benoist) were proved on the way."
headline = ["Causal.Flat.barbot_A_unconditional", "Causal.Flat.barbot_B_geroch_unconditional", "Causal.Flat.selbergLemma", "Causal.Flat.affAuslanderCarriereDalbo"]
open = "Only the terminal rows, off the spine of Theorems A and B: convex cocompactness (Sullivan), the thrice-punctured-sphere computation, CMC foliations."

[paper.gx]
short = "gx"
cluster = "geo"
authors = "L. Brunswic · Geom. Dedicata (2024)"
title = "On branched coverings of singular (G,X)-manifolds"
home = "lean-gx"
source = "arXiv 2010.10610"
summary = "Singular (G,X)-manifolds, Fox completion, branched coverings and their Galois correspondence, the singular developing theorem, tame and virtually tame singularities, and the uniformization of BTZ-manifolds in its ruled form."
headline = ["GX.btz_uniformization", "GX.galois_correspondence", "GX.singular_developing_theorem", "GX.developing_theorem", "GX.e0_cbg"]
open = "The partial rows are partial by ruling: corrected forms, or a named external, Troyanov's theorem, which DEC-136 asks to prove in full. The rows after \\end{document} are terminal."

[paper.benzecri]
short = "Benzécri"
cluster = "geo"
authors = "J.-P. Benzécri · Bull. SMF 88 (1960)"
title = "Sur les variétés localement affines et localement projectives — Ch. 1–2"
home = "lean-benzecri"
source = "Numdam scan, transcription"
summary = "Chapter 1: locally projective and affine manifolds, affine cones and the functorial equivalence with locally projective manifolds, Theorem A (V × S¹ is locally affine for compact locally projective V), and the p. 238 sentence: the universal cover of a compact locally projective manifold is divisible. Chapter 2, transcribed and ledgered by DEC-137, leads to result B: pockets and shells (§ 1), the projective measure and the pseudo-length (§ 2), and the theorem on sweepable manifolds with a pocket (§ 3)."
headline = ["Benzecri.theoremA", "Benzecri.coneEquivalence", "Benzecri.revetement_universel_divisible_proj", "Benzecri.IsPocheProj", "Benzecri.pseudoLength", "Benzecri.ConeCex.not_t2Space_coneBase_dim"]
open = "Chapter 1 is closed, its p. 238 row on a Mathlib-only port of the universal cover (2ed332b). In Chapter 2, § 1 and the first definitions of § 2 with its Prop. 1 are closed (T-bz-c2-poches, T-bz-c2-mesure); the rest of § 2 (the properties of the pseudo-length, Déf. 5–6, Prop. 2–7) and § 3 (the theorem, Prop. 1–2) remain, and with them result B (bzthm:intro_B). Result C is terminal: its proof is in Chapter 5, not transcribed. Open questions OQ-45 (the pseudo-length in dimension 0) and OQ-46 (p injective in § 1's examples); the transcriptions await the author's check (T-bz-transcription-check)."

[paper.bbs]
short = "BBS → 3+1"
cluster = "geo"
authors = "T. Barbot · F. Bonsante · J.-M. Schlenker · Comm. Math. Phys. 308 (2011)"
title = "Collisions of particles in locally AdS spacetimes I: local description and global examples"
home = "lean-gx"
source = "arXiv 1010.3602 v1"
summary = "An external paper counted in the hub (DEC-132, as DEC-34 did for Barbot); its reading map is papers/bbs/STORY.md: singular lines and their links (a singular point is the suspension of its HS-link), particle interactions classified by the topology of their link, and global hyperbolicity with singular lines. Its research side stays REVIEW.md (the review against gx, with the layered Lean roadmap) and NOTES-3+1.md (the 3+1 programme: Theorem M, whose holonomy half is proved in lean-gx's scaffold, and Theorem G, which rests on it and on the funnel lemma, still a sketch), whose first layers, the conic, celestial and affine suspensions, are built in lean-gx."
headline = ["GX.Suspension.Conic", "GX.Suspension.Celestial", "GX.Suspension.Affine"]
open = "The whole ledger: no row is anchored in Lean yet. The triage (a06acc2) defers every row (bucket D) to a layer not yet built: the suspension modules above are L0–L1 infrastructure and anchor no row, and no row needs only L0–L1, so nothing is dispatched before BBS-Q1, where the L2–L3 layers live (T-bbs-layer-home, the author's). The statement DAG resolves the authors' own \\ref's since 43c0840 (T-ledger-secondary-labels). On the research side: the funnel lemma is to be written out in full (T-3p1-funnel-lemma); Theorem M's real-angle half is blocked (T-3p1-theorem-m-theta, OQ-36); codimension-2 strata need an interface ruling (BBS-Q7)."

