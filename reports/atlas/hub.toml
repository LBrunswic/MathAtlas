[paper.egf]
short = "EGF"
cluster = "gfn"
authors = "Brunswic et al. · ICML 2025"
title = "Ergodic Generative Flows"
home = "lean-egf"
source = "camera-ready"
summary = "Generative flows whose forward policy is a finite family of diffeomorphisms; universality from ergodicity. Formalized in lean-egf, a package of its own (DEC-133): the master universality theorem (theo:universality_true) is EGF.main_universality, proved under weaker hypotheses than printed, with a stronger conclusion and by another route, a truncated Neumann series (742a9c5)."
headline = ["EGF.main_universality", "EGF.main_universality_of_tendsto", "EGF.IsSummablyL2Mixing"]
open = "The rest of the paper. The toroidal and spherical families rest on cited spectral-gap theorems, named externals or proofs (T-egf-families, the author's); the sampling theorem with its loss controls (T-egf-sampling) and the backward policy (T-egf-backward-policy) are planned. def:egf and def:universal_family are partial on readings (OQ-48, OQ-49, OQ-50), and the closed rows' marks rest on the λ̂ ≠ λ reading that OQ-47 asks to confirm."

