evidence = "Added 2026-11-21 (planning run after the wave of 10:05) by the planner, split from T-ett-singular-instance (its reason (2)). Causal/GXSingularDEC25.lean adds (b′) as hiso: ∀ a b ψ, IsAEChart G X ψ → ChartIso (DY a) (DY b) ψ. Whether (b′) belongs to « model space », or (b) should state it, is OQ-64 (open). That question bears on the mark of prop:GX_sing_espace_temps_topo, for every analytic singular structure. cor:massA_causalite is about the E≥0 models only, so (b′) can be proved there instead of waited for. By forall_exists_causality_singularGX_iff, taken at M = X_α, the existence half of the corollary at every E≥0-manifold holds iff (b′) holds at these models. This assumes (a), (b), hreg and the maximal-atlas reading of « every chart »; proving (b′) also covers every narrower reading. So this target needs no ruling. If (b′) fails at some E≥0 model, that is a finding for OQ-64: the corollary is then false as printed under that reading. What there is. At regular sources (b′) holds (chartIso_model_of_subset_reg, chartIso_of_isAEChart_of_subset_reg). An IsAEChart maps Sing to Sing (IsAEChart.mem_reg_iff). The rotations and τ-translations of E₀ are chart isomorphisms (E0.chartIso_tauShift, chartIso_rotE0), and an isometry of space carries static causalities (staticCausality.strongMorphism_of_isometryEquiv). [r] (planner, unchecked, to be scoped before dispatch) Near a singular point, an a.e. isomorphism is a (G,X)-map on a punctured neighbourhood of the line, so its development conjugates the holonomy of a small loop about the line. That holonomy is elliptic of angle κ for E_κ and parabolic for E₀. So no such map joins E₀ to an E_κ, or E_κ to E_κ′ with κ ≢ κ′ mod 2π. For κ ≡ κ′ (mod 2π) with κ ≠ κ′, the lengths of small loops about the line (κr against κ′r) should exclude it. For κ = κ′ the map should be a rotation–translation about the line, which preserves the causality. Planned until the models' structures exist, since the statement needs a SingularGXStructure on E_κ and E₀."
