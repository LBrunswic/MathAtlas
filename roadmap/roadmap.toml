evidence = "DEC-136: prove it in full, do not shrink it; DEC-69 made it a named external. Re-scoped 2026-11-20 by the planner and moved from ready to planned, because it is not one dispatch. The Prop (GX/SingularII/Models.lean:944) quantifies over every s ≥ 3 and every θ with TroyanovAngleCondition (Σ(θ_i − 2π) + 4π in ]0, min(4π, θ_i)]). That is an existence theorem for cone metrics with prescribed angles. Re-scoped again 2026-11-20 by the planner, after T-gx-spherical-cone (7d7d6fa). The objects exist: GX.IsConeSphere, GX.SphCone, the angle-tied GX.TroyanovTheorem, whose proof is the tagged sorry GX.troyanovTheorem (scaffold Spherical/TroyanovAngles.lean:322). The s = 3 case is T-gx-troyanov-triangle; this target is s ≥ 4. It no longer depends on T-gx-troyanov-suspension: GX.TroyanovTheorem does not use the suspension facts, and the row's mark needs both obligations whichever closes last. [r] (planner, unchecked) Route notes, to be scoped before dispatch. (1) An angle 2π is a marked regular point: dropping it leaves the sum unchanged and keeps s ≥ 3 (GX.TroyanovAngleCondition.three_le_card_ne_two_pi), so it reduces to s − 1 points. (2) Angles above 2π occur once s ≥ 4: (5π/2, 3π/5, 3π/5, 3π/5) satisfies the condition (sum term 3π/10 ≤ 3π/5). So doubling a convex spherical polygon is not enough, and a reflex vertex or another construction is needed. MR1005085 is not archived under papers/gx/sources (T-gx-spherical-cone REPORT: the condition's subcritical form was recalled from it, unchecked). Updated and split 2026-11-20 by the planner, after T-gx-troyanov-triangle (6195fbb). s = 3 is proved: GX.troyanovTheorem_three (GX/Spherical/TroyanovTriangle.lean:2426), exactly TroyanovTheorem at s = 3 (AUDIT-1 CHECKED (1)). GX.troyanovTheorem_of_four_le (l.2442) reduces TroyanovTheorem to s ≥ 4, and the reduction is an equivalence (AUDIT-1 CHECKED (2)). The scaffold sorry (TroyanovAngles.lean:322) still covers every s. The REPORT suggests that the master re-route it through troyanovTheorem_of_four_le so that it carries only s ≥ 4. Route note (1) is now T-gx-troyanov-two-pi (drop the angles 2π). The all-below-2π part of (2) is T-gx-troyanov-polygon (double a convex spherical s-gon). What remains here is s ≥ 4, every θ_i ≠ 2π, some θ_i > 2π. The case occurs: (5π/2, 3π/5, 3π/5, 3π/5) gives χ' = 3π/10. At s = 3 it does not, since every θ_i < 2π there (troyanovAngleCondition_three_iff, l.102). Then the assembly: GX.troyanovTheorem from the four cases. No construction for an angle above 2π is in the library or the notes, and MR1005085's own proof is variational. So this target needs a scoping pass before any dispatch, starting from what T-gx-troyanov-source quotes. Hence planned, with the source as a dependency. T-gx-troyanov-triangle AUDIT-1 owes the check of l.1930's bound against the source (it suspects θ_i where Troyanov has 2θ_i). That check is T-gx-troyanov-source's, and it goes to the author only once checked. Updated 2026-11-21 by the planner, after T-gx-troyanov-polygon (bed88aa). GX.troyanovTheorem_of_exists_gt_two_pi (GX/Spherical/TroyanovPolygon.lean:2146) leaves s ≥ 4, every θ_i ≠ 2π, some θ_i > 2π, and its REPORT says that doubling a convex polygon cannot give it. Split: s = 4 is T-gx-troyanov-four (the double of a spherical dart, startable without the source); this target keeps s ≥ 5 and the assembly. The dependency on T-gx-troyanov-source is replaced by T-gx-troyanov-four: the source's existence proof is analytic, so it gives no construction: § 4 of MR1005085 is 'Analysis on a surface' (Sobolev and Trudinger inequalities) and § 5 solves the equation by '5.3 The variational method' (section titles from the planner's read of the author-hosted copy, see T-gx-troyanov-source); and the check of l.1930's bound is a finding for the author, not a step of this proof. [r] (planner, unchecked) Routes for s ≥ 5. Two angles above 2π are possible there: (5π/2, 5π/2, 2π/5, 2π/5, 2π/5) has χ' = π/5 ≤ 2π/5. (i) The double of an abstract spherical s-gon, immersed rather than embedded, with interior angles θ_i/2, one reflex corner per angle above 2π, built as a fan of convex triangles from one vertex. This generalises the dart, but its existence for the whole condition is unproved. (ii) Slit gluing: cut two cone spheres along geodesic segments of equal length joining two cone points each, and glue them crosswise. The angles at the two glued points add, so with the doubles of T-gx-troyanov-triangle and T-gx-troyanov-polygon as pieces, an induction on s may cover the case. The dart is the case of two triangles: its double is the slit gluing of two triangle doubles along the diagonal v_1v_3. Scope this target after T-gx-troyanov-four reports which of (i) and (ii) its machinery supports. Re-scoped 2026-11-21 (04:10) by the planner, after T-gx-troyanov-four (942f470) and T-gx-troyanov-reroute (e113f97), at the master's question « what existence step would cover s ≥ 5? ». Still planned: the case needs an existence argument that nobody has written, which is mathematics, not a ruling. Where it stands. The scaffold's only Troyanov sorry (GXScaffold/Spherical/TroyanovAngles.lean:328) carries s ≥ 5, every θ_i ≠ 2π, some θ_i > 2π. The T-gx-troyanov-four REPORT (lean-gx/campaign/T-gx-troyanov-four/REPORT.json, notes): GX.StarFrames and the reflex polar fold are generic (any number of reflex vertices); GX.StarPolygon.isConeSphere doubles any EMBEDDED polygon P ⊆ 𝕊², convex or not, given a disc model eK, its genuine sides and its sign facts; slit gluing of cone spheres is not supported; and « whether an embedded polygon with angles theta_i/2 exists for the whole condition at s >= 5 is not studied ». So the missing step is an existence theorem for embedded spherical s-gons with prescribed angles α_i = θ_i/2 ∈ ]0, 2π[ ∖ {π}, some above π, under A := Σα_i − (s − 2)π ∈ ]0, min(2π, α_i)] (the printed condition; Gauss–Bonnet makes A the area). [r] (planner; numerical, by least squares over vertex positions with a simplicity check; the scripts ran outside the repository and are not archived; not a proof) such polygons exist, in some cyclic order of the angles, for all 24 sampled admissible data at s = 5 (12 with one angle above 2π, 12 with two, among them (5π/2, 5π/2, 2π/5, 2π/5, 2π/5)) and for all 4 sampled at s = 6 with one. [r] (unchecked) Two candidate constructions. (a) The dart's decomposition: cut along a diagonal from a reflex vertex into a triangle and a convex (s − 1)-gon (exists_sphPolygon, GX/Spherical/TroyanovPolygon.lean:610), and match the diagonal by an IVT in the two split angles, as GX.exists_dartParams (TroyanovFour.lean:3028) does at s = 4. The planner's grid scan finds the sign change in some cyclic order for 12 of 12 sampled data at s = 5 with one angle above 2π, but only 9 of 12 at s = 6, so the convex piece does not always suffice; and the IVT needs the (s − 1)-gon's side to vary continuously with its angles, which exists_polar_radius (an IVT on the radius, :234) does not give. A naive signed version of exists_polar_polygon (sides π − α_i < 0 run backwards) reproduces the convex case but gave no embedded polygon in 30 reflex samples. (b) A fan of s − 2 triangles from one vertex c whose two neighbours have α < π (there are always at least two such angles): the triangles occupy disjoint sectors at c, whose total angle α_c < 2π, so the union is embedded; the other vertices get their angles as sums of two triangle angles, so reflex vertices are allowed there; the triangles are built one by one by angle–side–angle, and the existence reduces to ONE closing equation in s − 2 parameters (the angle of the last triangle at c's other neighbour), to be solved by an IVT along a path of valid parameters, explicit spherical trigonometry only. Its endpoint signs are not checked, and StarPolygon's disc model would have to be built for a fan, whose triangles share only c (exists_homeomorph_union_convex asks for a common interior point). OQ-59 bears on the scope: under Theorem C's condition (< min(4π, 2θ_min)) more tuples must be covered than under the printed one. Moves to ready once (b), or another route, is written out with its endpoint signs, by a planner pass or as a closer's scoping dispatch. Re-checked 2026-11-21 (planning run after the wave of 06:03) by the planner: still planned, and the scope is wider than the two routes above. No lean-gx commit since T-gx-troyanov-reroute (e113f97); the scaffold's only Troyanov sorry is still GXScaffold/Spherical/TroyanovAngles.lean:328. [r] (planner; arithmetic checked numerically, not in Lean) At s ≥ 5 the condition admits angles of 4π and more, which no double of an EMBEDDED polygon can give. Example: θ = (5π, 3π/4, π/10, π/10, π/10) satisfies GX.TroyanovAngleCondition (GX/SingularII/Models.lean:897): χ' = Σ(θ_i − 2π) + 4π = π/20, and 0 < π/20 ≤ min(4π, π/10). It also satisfies Theorem C's 0 < χ' < min{4π, 2θ_min} (papers/gx/sources/MR1005085/NOTE.md, where the θ_i are « positive numbers », with no upper bound). Its double would need a polygon with interior angle α_1 = θ_1/2 = 5π/2 > 2π. So GX.StarPolygon.isConeSphere cannot reach it, and neither can route (b): there α_c < 2π, and each other vertex gets a sum of two triangle angles, which is < 2π. In general the condition gives θ_max ≤ Σ_{i≠max,j}(2π − θ_i) < 2π(s − 2) for every j ≠ max, so θ_max < 4π at s = 4 (why the dart sufficed) but not from s = 5 on. The case left therefore splits in two. (1) Some θ_i ≥ 4π: this needs a construction that is not a double of an embedded polygon, for instance the double of an abstract (immersed) spherical polygon glued from triangles, or slit gluing. The library supports neither (T-gx-troyanov-four REPORT). (2) Every θ_i < 4π: routes (a)/(b) still apply, with their endpoint signs unchecked. Whoever scopes this target scopes both parts. This is mathematics, not a ruling (DEC-136: prove in full)."
