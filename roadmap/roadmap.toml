ssA_cac); the chart carries ≤_{U₁} to the model's ≤_{φ(U₁)}, contained in the model's ≤; and V is causally convex in the model. The model measure restricted to V (E0.admissiblePastOn_restrict_of, admissibleFutureOn_restrict_of, :713, :742, and their E_κ analogues from T-ett-measures-ealpha), carried back by φ, is then admissible on U. Write the transfer in the ETT layer over IsoChartsCover, as Causal/SFATransfer.lean is; then instantiate it at E₀-manifolds (E0Covered, IsE0Natural of Causal/Port/SFALocalE0.lean) and over MassAModel. prop:mesure_admissible at every strongly causal E≥0-manifold then follows from SingularFlatAxioms.mesure_admissible once T-ett-singular-sfa supplies the axioms; until then this target gives ModelMeasures M and the conditional. If T-ett-massa-models-instance lags, the E₀-manifold half can be split off (its dependencies are all done). Marks: prop:mesure_admissible stays partial until T-ett-singular-sfa; OQ-18, OQ-34/OQ-35, OQ-82. It shares its labels with T-ett-measures-ealpha, after which it runs. Where: the transfer in a new ETT-layer module (no Causal.Port import), the instances in a new module importing Causal.Port.MeasuresE0, placed beside T-ett-massa-models-instance's family module under Causal/Remarks; nothing under Causal/Port or Causal/CBG. Collision check against programme/roadmap.toml: no target there builds admissible measures or ModelMeasures."
