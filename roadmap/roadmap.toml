evidence = "DEC-136 (prove Troyanov in full). The obligation is GX.troyanovTheorem (scaffold Spherical/TroyanovAngles.lean:322: 'not yet a construction of one with s ≥ 3 cone points (e.g. by gluing spherical triangles, or the variational method)'). [r] (planner; arithmetic checked, Lean not) Put α_i = θ_i/2. For s = 3, GX.TroyanovAngleCondition θ (GX/SingularII/Models.lean:897) is equivalent to α_1 + α_2 + α_3 > π together with α_i + α_j ≤ π for i ≠ j. Indeed Σ(θ_i − 2π) + 4π = 2(Σα − π); '≤ θ_k' becomes α_i + α_j ≤ π; '≤ 4π' then follows (2Σα ≤ 3π); and θ_j > 0 is TroyanovAngleCondition.pos. Hence every α_i < π and α_i + α_j < π + α_k. With Σα > π, these are the conditions for a spherical triangle with angles α_i (its polar triangle has sides π − α_i). Doubling that triangle along its boundary gives a cone sphere with cone angles 2α_i = θ_i. Edge points get charts by reflecting the second copy, so chart changes are products of two reflections and lie in SO(3). Vertices get X_θ-charts onto C_{2α_i}. So the doubled triangle covers the whole s = 3 case, and no angle equals 2π. Deliverable: GX.TroyanovTheorem restricted to s = 3, sorry-free: the existence of the triangle, its double, and IsConeSphere for the double. The general case s ≥ 4 is T-gx-troyanov. This target shares its label with T-gx-cone-football, so the wave serialises them."
