evidence = "Added 2026-11-21 (planning run after the wave of 10:05) by the planner, split from T-ett-singular-instance (reason (1) there). Causal/Remarks/MassiveManifold.lean assumes hreg, « the regular charts of E_α are isomorphisms ». massA_positive takes it as a hypothesis, and the file's header says « the library builds no regular chart of E_α ». massA_positive_minkowski is witnessed in the regular case only, because « A witness with a chart into some E_κ needs regular charts reg(E_κ) → E^{1,2} which are isomorphisms, and the library does not build them ». What there is. Causal/Model/Cone.lean builds C_α from its distance formula, the law of cosines √(r₁² + r₂² − 2r₁r₂ cos(min(δ, π))), and coneTwoPiIsoEuclidean (C_{2π} ≃ᵢ ℝ², by (r, θ) ↦ r e^{iθ}). Causal/Model/Massive.lean has massive α := staticCausality (Cone α), staticCausality.strongMorphism_of_isometryEquiv (strong morphisms transport along an isometry of space) and massiveTwoPi_iso. Causal/Minkowski.lean has minkowski n := staticCausality (EuclideanSpace ℝ (Fin n)). The E₀ template is Causal.E0.chartIso_sectorChart (Causal/Port/E0Strong.lean). [r] (planner, unchecked) Take a sector of directions of opening less than π and less than α, away from the apex. There (r, θ) ↦ r e^{iθ} preserves the cone distance, since min(δ, π) = δ. So the time coordinate times that map is a distance-preserving homeomorphism from an open subset of space onto an open subset of ℝ². The static causalities, defined in each open set by Lipschitz curves inside it, then correspond, which makes a ChartIso (massiveOf κ) (minkowski 2). On each component of an overlap, two such charts differ by a rotation of ℝ², an element of Flat.isom 2. What to deliver: such a family covering E_κ ∖ singLine κ, each chart a ChartIso, with the transitions in gxGroupoid (Flat.isom 2) (Minkowski 2). That discharges hreg in massA_positive's form for this family. Non-vacuity: massA_positive at M = E_κ itself, with its sector charts as eX and the identity as e