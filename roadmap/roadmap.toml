evidence = "Added 2026-11-21 (planning run after wave 19) by the planner: the E₀ track announced in T-ett-singular-sfa (note of the run after wave 17, « to be scoped once T-ett-sfa-local-e0 reports »). It has reported. Causal.SFALocalE0.singularFlatAxioms_iff (Causal/Port/SFALocalE0.lean:398): for an E₀-manifold M (E0Covered) with its natural causality (IsE0Natural; it exists and is unique, existsUnique_isE0Natural), [T2Space M] [SecondCountableTopology M], C.SingularFlatAxioms (sing M) holds iff the three fields hold at every point of sing M 0 = Sing(M). Its REPORT: « Not done here (scope): the BTZAxioms fields singularPastAt, Iplus_of_lt and line (T-ett-singular-sfa). » The three are global statements on M (Causal/SingularFlat.lean:150–176; SingularPastAt, Causal/PushUp.lean:227), so they do not transfer chartwise; the paper reads them off defi:causal_E0 (ETT.tex:1344–1356) and lem:past_BTZ (a) (l.1515, cited from brunswic2021cauchy Lem. 1.9). At M = E₀ all three hold (E0.singularFlatAxioms, Causal/Port/E0SingularFlat.lean:589). What there is. Near an axis point every a.e. isomorphism chart of E₀ is rotE0 φ ∘ tauShift t (Causal.BPrimeE0.exists_eqOn_rotE0_tauShift, Causal/Port/BPrimeE0.lean:627), so the X_A-charts of M restrict on Sing(M) to τ-translations: Sing(M) carries a translation structure in τ. Absolute minimality turns facts on a cover into global ones, as SFATransfer.Iminus_eq_empty_of_cover (Causal/SFATransfer.lean:292) does for I⁻(p) = ∅. [r] (planner, unchecked) Route. (1) J⁻_M(p) at a BTZ point p lies in the component of Sing(M) through p, by the same absolute-minimality argument from past_local (SFALocalE0.pastLocal) at every point of that component; then singularPastAt and Iplus_of_lt reduce to statements along the line, read in E₀-charts (where E0.singularFlatAxioms has them) and chained by push-up (SFALocalE0.pushUp). (2) line: the τ-translation structure parametrises each component of Sing(M) by an interval or a circle (a connected 1-manifold with a translation structure develops into ℝ); the field asks a parametrisation by ℝ, inextensible, and a closed embedding when M is causal, which excludes the circle (a closed causal curve). The planner found no classification of 1-manifolds in Mathlib at the pin, so (2) is the hard step, as the note in T-ett-singular-sfa says; the development of the translation structure may replace it. Planned until a closer's scoping or a planner pass writes (2) out; then split if (1) is a dispatch of its own. It would give SingularFlatAxioms at every E₀-manifold, hence the theorems of Causal.SingularFlat and Causal.SingularGeroch at every E₀-manifold, a first instance for the 16 rows blocked on T-ett-singular-sfa. Marks: OQ-18 (« natural »), OQ-34/OQ-35 (E₀), OQ-82. Where: a new module beside Causal/Port/SFALocalE0.lean, so under Causal/Port, to be said to /ett-programme at dispatch; nothing under Causal/CBG. Collision check against programme/roadmap.toml: no target there proves the BTZ fields or SingularFlatAxioms."
