evidence = "Added 2026-11-21 by the planner. This is the master's 'start of § 2'. prop:proposition (l.194–206) uses cor:bounds (l.201, 'from Corollary cor:bounds'), which is false as printed (OQ-54 (c)). Its true form Syracuse.bounds (Syracuse/IntegerBounds.lean:493) gives p_n/n − log₂3 ≤ log₂(1 + 1/(3 min)), which is all the proof needs. So OQ-54 decides cor:bounds' mark, not this row's statement. What this row's proof cannot do without is the computer check of l.201, hence the question. [r] (planner, unchecked) That check matters only for x > 0. On a cycle, lem:base makes 2^{p_n} − 3^n have the sign of x, so for x < 0 one has p_n < n log₂3, and #{a_i = 1} ≥ 2n − p_n > (2 − log₂3)n > αn with no computer check. cor:property_defined_cycles_gcd (l.161–168) needs a lower bound on |2^p − 3^n| (theo:matveev or theo:mr) and the GCD identity (T-syr-cycle-gcd). '≪' and 'effectively' are readings for the closer to record, not to rule. theo:steiner (l.150) and theo:steiner_2 belong with § 3, and theo:exists_no_circuit_other (l.219) has a proof the draft leaves unfinished (l.221–247, with a stray display after it). None of them is in this target. Once ruled, this moves to ready (named externals) or is re-scoped (proofs). Updated 2026-11-21 (04:10) by the planner: § 3's theo:steiner_2 (l.294–305) and theo:syracuse_cycle (l.306–334) also rest on the corollary to Matveev's theorem (cor:property_defined_cycles_gcd) and on computer checks (l.302, l.326), and theo:exists_no_circuit_other (l.219) on theo:matveev; the same answer decides them, though they are not labels of this target. § 3's algebraic rows, which need none of this, are T-syr-upper-bounds. Updated 2026-11-21 (planning run after the wave of 06:03) by the planner. The own steps of theo:steiner_2 and theo:syracuse_cycle are now T-syr-steiner and T-syr-two-descents (ready). Both stop at the hypothesis this ruling would discharge, and their marks still wait on it. Both rows are also false over ℤ as printed, by the cycles (−5, −7) and −17 already in Lean (Syracuse.cycle_neg_five, cycle_neg_seventeen). So whether the § 2–3 cycles are positive (OQ-63 (a)) bears on them as well. Updated 2026-11-21 (planning run after the wave of 07:22) by the planner. The paper's own steps for two of this target's labels, cor:property_defined_cycles_gcd and prop:proposition, are now T-syr-cited-steps (ready), with the cited inputs as hypotheses; those of theo:exists_no_circuit_other are T-syr-no-circuit (ready). This target now waits on T-syr-cited-steps. Once ruled, it states theo:mr and theo:matveev (and the check of l.201) as the ruling says, discharges those hypotheses there and in Syracuse.Steiner and Syracuse.TwoDescents, and the marks follow. The question is unchanged."
