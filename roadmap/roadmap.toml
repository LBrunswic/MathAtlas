evidence = "Added 2026-11-21 (planning run after the wave of 10:05) by the planner, split from T-ett-singular-instance. DEC-25 reads an E≥0-manifold's models as singular (G,X)-manifolds, and existsUnique_causality_singularGX_dec25 (Causal/GXSingularDEC25.lean) asks hreg of each model: ∀ r ∈ aeAtlas G X (Xα a), ChartIso (DY a) DX r. lean-causal has no SingularGXStructure with a singular point. GXSingularDEC25's SCOPE says so (« gx's on its BTZ models are not ported »), and its only instance is lineSingularGX, with Sing = ∅. gx has one, btzE0Structure (lean-gx/GX/BTZ/Model.lean), but on its own carrier GX.BTZModel (2π) = Orbits (GammaA α) (DInfty × ℝ), not on Causal.E0 = ℝ × ℂ. And lean-causal never imports GX (DEC-33). What lean-causal has. Causal.E0.sectorChart y, for y off the axis, is a chart isomorphism onto an open set of E^{1,2}: chartIso_sectorChart and isEMorphismOn_chartMap (Causal/Port/E0Strong.lean). interior_axis gives interior sing₀ = ∅ (E0SingularFlat.lean). Causal/Port/SingularAtlas.lean has IsAEAtlas (a (G,X)-atlas with portly support), IsThinner, maximalAEAtlas, IsMaximalAEAtlas and the class SingularGXStructure. GXSingularDEC25 has ChartIso.agreeOn_of_mem_aeAtlas and eq_of_agreeOn_locally. What to deliver. (1) The sector charts form an a.e. (Flat.isom 2, Minkowski 2)-atlas. [r] (planner, unchecked) On each component of an overlap, two sector charts differ by the identity or by a power of the parabolic holonomy of a loop about the axis: gx's btzHol (lean-gx/GX/BTZ/Model.lean, « The holonomy ρ(γ) = btzHol: parabolic, fixing Δ pointwise »). The support E₀ ∖ sing₀ is portly: open, dense, and locally connected in, since removing the line ℝ × {0} from a connected open subset of ℝ × ℂ leaves it connected. (2) A SingularGXStructure on Causal.E0 with Reg = E₀ ∖ sing₀ and Sing = sing₀ ≠ ∅. (3) A model-free lemma, in an ETT-layer or Port module so that T-ett-ealpha-gx-structure reuses it rather than copying it. Statement: if every chart of an a.e. atlas A of Y