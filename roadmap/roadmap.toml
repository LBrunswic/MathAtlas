evidence = "Added 2026-11-21 (planning run after the wave of 10:05) by the planner. This is the second half of T-ett-singular-instance's former title, « Discharge SingularFlatAxioms for every E≥0-manifold ». T-ett-singular-instance now keeps the three corollaries, which are the fields pushUp, absolutelyMinimal and causallyArcConnected. The other fields of Causal.Causality.SingularFlatAxioms (Causal/SingularFlat.lean) are these. tarentin, mem_Zplus and mem_Zminus_iff (rem:sing_tarentin, rem:btz_pas_tarentin). t2, secondCountable, metrizable, locallyCompact and noIsolated (the topological consequences of prop:GX_sing_dec). isClosed_sing and interior_sing. massive_line. And the BTZAxioms fields singularPastAt, Iminus_eq_empty, Iplus_of_lt, past_local and line. They hold at the models: E0.singularFlatAxioms (Causal/Port/E0SingularFlat.lean), and for E_κ, κ > 0, massive_tarentin, massive_Zplus, massive_Zminus and singLine_locallyChronal (Causal/Model/Massive.lean). [r] (planner, unchecked) The local fields transfer through the X_A-charts once T-ett-singular-instance makes them isomorphisms. Defining sing_α(M) needs the cone angle at a singular point to be independent of the chart, the invariance argued in T-ett-e-models-bprime. Iminus_eq_empty, Iplus_of_lt, massive_line and line are global statements on M and do not transfer chartwise. So this target is to be scoped, and probably split, once T-ett-singular-instance is done. Its labels: rem:sing_tarentin, blocked on « E≥0-manifolds (the (G,X) layer for the singular structure) and E_0 », and def:singular_spacetime, which the library abstracts as SingularFlatSpacetime. T-ett-singular-rows consumes this target. The ledger rows rem:pas_plat, rem:tarentin_exemples and rem:lorentz_tarentin wait on it. Their blocked_on reads « the E₀ instance of SingularFlatAxioms, which T-ett-singular-instance discharges »; T-ett-curation-model-blockers re-points it. Split 2026-11-21 (planning run after wave 16) by the planner, as announced above. The fields (Causal/SingularFlat.lean:150–206) fall in two groups. (i) Chartwise, now T-ett-sfa-local. These are tarentin, mem_Zplus, the ⇐ of mem_Zminus_iff and past_local, which the paper calls « immediate from Definitions defi:causal_Ealpha and defi:causal_E0 read in a chart » (rem:btz_pas_tarentin, ETT.tex:1358–1362). With them come the topological fields and sing_α(M) with isClosed_sing and interior_sing. They hold for any absolutely minimal causality with an isomorphic chart at each point, so they need neither the existence half nor this target. (ii) Global, kept here: Iminus_eq_empty and the ⇒ of mem_Zminus_iff (no chronological past at a BTZ point of M, not only of a chart), Iplus_of_lt, singularPastAt, line and massive_line (lem:past_BTZ (a), ETT.tex:1515, cited from brunswic2021cauchy Lem. 1.9). Then the assembly of SingularFlatAxioms for the natural causality, which T-ett-singular-instance supplies, and the definition's E^{1,2}_A-spacetimes (def:singular_spacetime, l.1500–1504). [r] (planner, unchecked) The global fields should follow from absolute minimality: a relation of M is generated by relations inside charts, and the models' facts hold there (E0.singularFlatAxioms, Causal/Port/E0SingularFlat.lean:589). The two line fields still need the components of sing₀(M) and sing_κ(M) to be curves, which is lem:past_BTZ (a)'s own argument. Note 2026-11-21 (planning run after wave 17) by the planner. A track for E₀-manifolds can run before the E_κ one. existsUnique_causality_e0 gives the natural causality of every E₀-manifold, and T-ett-sfa-local-e0 gives its chartwise fields. The global fields at E₀-manifolds could then be a target of their own: Iminus_eq_empty and the ⇒ of mem_Zminus_iff, from absolute minimality and E0.Iminus_axis, which holds in every open set; Iplus_of_lt; singularPastAt; line. That target would give SingularFlatAxioms for every E₀-manifold, hence T-ett-singular-rows' theorems at every E₀-manifold. It is to be scoped once T-ett-sfa-local-e0 reports. It is not added now, because its line field (lem:past_BTZ (a)) is the hard step and no route for it is written yet. Updated 2026-11-21 (planning run after wave 19) by the planner. T-ett-sfa-local-e0 reported (5bcad0b): Causal.SFALocalE0.singularFlatAxioms_iff (Causal/Port/SFALocalE0.lean:398) shows that at a Hausdorff, second countable E₀-manifold with its natural causality, SingularFlatAxioms (sing M) is exactly the three BTZ fields singularPastAt, Iplus_of_lt and line, every other field discharged (Iminus_eq_empty and the ⇒ of mem_Zminus_iff included). The E₀ track announced in the note above is therefore added as T-ett-sfa-btz-e0 (planned). This target now depends on it and keeps the E≥0 assembly: the three fields at the BTZ points of E≥0-manifolds, whose global relations also pass through E_κ charts; massive_line; and SingularFlatAxioms for the natural causality. 16 ETT ledger rows name this target in blocked_on (count of 2026-11-21)."
