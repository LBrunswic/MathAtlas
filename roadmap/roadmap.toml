# The roadmap: planned targets beyond what the ledgers already record as closed.
#
# Validated by `python3 tools/roadmap.py check`; drawn by the atlas (reports/atlas). Written by the
# roadmap-planner agent (proposals) and the /atlas-team loop (status changes); ruled by the author.
#
# status  planned       proposed, not yet ready (a dependency is not done, or it is not specified enough)
#         ready         can be dispatched now
#         active        a wave is working on it (at most MAX_PARALLEL at a time, tools/roadmap.py)
#         needs-ruling  waits for the author: `question` says what to decide; the loop never decides it
#         blocked       waits on an OPEN question of registers/DECISIONS.md, named in `oq`
#         done          closed; `evidence` names the commit
#         dropped       abandoned; `evidence` says why
# owner   closer | planner | builder | master (the loop itself: packages, ledgers, transcriptions) | author
# kind    close     formalize/prove ledger rows (labels must exist in the paper's ledger)
#         package   create a Lean package or a ledger for a paper
#         research  new mathematics (3+1 notes); scaffold-only, marked [r] until proved
#         tooling   the atlas, the ledgers, the gates
#         author    something only the author can do (shown on the roadmap, never dispatched)
# fields  required: id, title, stream, kind, status, owner, priority (lower runs first), evidence,
#         added, proposed_by. `paper` + `labels`: the ledger rows (a close target names them).
#         `depends`: ids that must be done first (a ready target's are all done). `question`
#         (needs-ruling), `oq` (blocked), `commit` (done).
#         `package`: the Lean package the target writes in, read by `roadmap.py wave` (at most
#         MAX_PER_PACKAGE per wave). Default: the paper's (PACKAGE_OF) for closer and master
#         targets. "none" for a master target that writes no Lean (curation, tools), so that it
#         does not take a closer's place in the paper's package.
#         `exclusive = true`: alone in its package for the wave (a port, a strict-library
#         refactor, a root file).

[gates]
# Hub gates already red at the team's start (2026-11-20). An iteration may not add a failure;
# it is not asked to fix these, which need rulings. Emptied 2026-11-20 by T-bbs-ledger: with
# papers/bbs counted, papers-check and gate-tests went green and `make -k check` is all green.
known_red = []

