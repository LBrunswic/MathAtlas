admap.toml has no target for hreg, (b′) or OQ-64 (grep). If OQ-64 rules (b′) part of « model space », (b′) is a model fact to prove; otherwise its mark waits on how (b) is restated. Split 2026-11-21 (planning run after the wave of 10:05) by the planner, read against lean-causal (read only). hreg is not a ruling. It is a construction the library lacks. The E₀ sector charts are already chart isomorphisms (Causal.E0.chartIso_sectorChart, Causal/Port/E0Strong.lean). But lean-causal has no regular chart of E_α, and no SingularGXStructure with a singular point: Causal/GXSingularDEC25.lean says so in its SCOPE (« Witness »), and its only instance is lineSingularGX, with Sing = ∅. DEC-25's form of hreg, in existsUnique_causality_singularGX_dec25, asks every chart of the maximal a.e. atlas of each model to be a ChartIso onto E^{1,2}. So the structures come first. (b′) can be proved at the models rather than waited for, because the corollary is about E≥0-manifolds only. By forall_exists_causality_singularGX_iff, taken at M = X_α, the existence half at E≥0-manifolds holds iff (b′) holds at the E≥0 models. This assumes (a), (b), hreg and the maximal-atlas reading of « every chart ». The parts. T-ett-massa-dec25 (ready): the uniqueness half, cor:massA_cac and cor:pushup_sing over DEC-25 atlases, needing neither hreg nor (b′). T-ett-ealpha-sectors (ready): the sector charts of E_κ, κ > 0, which give hreg in Causal.GXSingular's form. T-ett-e0-gx-structure (ready): E₀ as a singular (Isom(E^{1,2}), E^{1,2})-manifold, hreg at κ = 0 in DEC-25's form, and the model-free lemma from a generating atlas of chart isomorphisms. T-ett-ealpha-gx-structure: E_κ's structure, with hreg in DEC-25's form. T-ett-e-models-bprime: (b′) at the models. This target keeps the instance. It sets up the model family over X = E^{1,2} and G = Isom(E^{1,2}), E₀ and E_κ for κ > 0, indexed for instance by Unit ⊕ {κ // 0 < κ}. (a) comes from minkowski_model_facts. (b) comes from massive_model_facts and E₀'s causal