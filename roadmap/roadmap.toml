evidence = "DEC-134 answers the question above: the E₀ model is ported into lean-causal and SingularFlatAxioms/BTZAxioms are discharged there. Re-scoped 2026-11-20 by the planner. Causal/SingularFlat.lean: 'None is marked: each is a statement about E≥0-manifolds, which the library does not define'. The three rows are proved in Causal/Remarks/MassiveManifold for the abstracted atlas given the model facts; hreg for E_κ is an assumed model fact (T-ett-unanchored AUDIT-1). The E₀ facts come from T-ett-port-e0-sfa, the atlas from T-ett-gxsingular-dec25. Split off: defi:causal_E0 (T-ett-port-e0), def:singular_spacetime (T-ett-port-e0-sfa), the consumers (T-ett-singular-rows). Left out: prop:K_calcul, whose mark also waits on OQ-16 (plainness or push-up), and theo:geroch_sing, blocked on OQ-32/OQ-33. Checked against programme/roadmap.toml on 2026-11-20 by the planner: there is no duplicate. The programme's T-loc-ealpha-cauchy also reads Causal.Model.Massive (E_α), but it proves Cauchy-surface facts of E_α × ℝ, not the atlas or SingularFlatAxioms. Re-checked 2026-11-21 (planning run after the wave of 09:05) by the planner: both dependencies are done (596352f, 933a95d), and the E₀ facts hb, hpY of Causal.Remarks.MassiveManifold.massA_singular (:278) now have a source: the causallyArcConnected and pushUp fields of E₀'s singularFlatAxioms (Causal/Port/E0SingularFlat.lean:589). Not promoted, for two reasons. (1) hreg is still assumed for every κ > 0: massA_positive (:329) and massA_singular take it, and the header says « the library builds no regular chart of E_α ». (2) The existence half of cor:massA_causalite under DEC-25 needs (b′), which Causal/GXSingularDEC25.lean adds as a hypothesis, and whether (b′) belongs to « model space » is OQ-64 (open). So this is two model facts for E_κ, κ ≥ 0 (hreg and (b′), layer-3 lemmas in the sense of programme/README.md) and then the assembly. It is to be split in a planning pass on lean-causal, coordinated with /ett-programme: programme/roadmap.toml has no target for hreg, (b′) or OQ-64 (grep). If OQ-64 rules (b′) part of « model space », (b′) is a model fact to prove; otherwise its mark waits on how (b) is restated. Split 2026-11-21 (planning run after the wave of 10:05) by the planner, read against lean-causal (read only). hreg is not a ruling. It is a construction the library lacks. The E₀ sector charts are already chart isomorphisms (Causal.E0.chartIso_sectorChart, Causal/Port/E0Strong.lean). But lean-causal has no regular chart of E_α, and no SingularGXStructure with a singular point: Causal/GXSingularDEC25.lean says so in its SCOPE (« Witness »), and its only instance is lineSingularGX, with Sing = ∅. DEC-25's form of hreg, in existsUnique_causality_singularGX_dec25, asks every chart of the maximal a.e. atlas of each model to be a ChartIso onto E^{1,2}. So the structures come first. (b′) can be proved at the models rather than waited for, because the corollary is about E≥0-manifolds only. By forall_exists_causality_singularGX_iff, taken at M = X_α, the existence half at E≥0-manifolds holds iff (b′) holds at the E≥0 models. This assumes (a), (b), hreg and the maximal-atlas reading of « every chart ». The parts. T-ett-massa-dec25 (ready): the uniqueness half, cor:massA_cac and cor:pushup_sing over DEC-25 atlases, needing neither hreg nor (b′). T-ett-ealpha-sectors (ready): the sector charts of E_κ, κ > 0, which give hreg in Causal.GXSingular's form. T-ett-e0-gx-structure (ready): E₀ as a singular (Isom(E^{1,2}), E^{1,2})-manifold, hreg at κ = 0 in DEC-25's form, and the model-free lemma from a generating atlas of chart isomorphisms. T-ett-ealpha-gx-structure: E_κ's structure, with hreg in DEC-25's form. T-ett-e-models-bprime: (b′) at the models. This target keeps the instance. It sets up the model family over X = E^{1,2} and G = Isom(E^{1,2}), E₀ and E_κ for κ > 0, indexed for instance by Unit ⊕ {κ // 0 < κ}. (a) comes from minkowski_model_facts. (b) comes from massive_model_facts and E₀'s causallyArcConnected (E0Axioms). Push-up comes from massive_pushUp and E0LM.e0_pushUp. Then it proves the three corollaries at every E≥0-manifold whose singular points lie in X_A-charts. The rest of SingularFlatAxioms for every E≥0-manifold is T-ett-singular-sfa. What this needs from programme/ (read only, nothing to edit). hreg and (b′) are layer-3 lemmas for the models E_alpha and E_0 (programme/README.md). Neither is a node of programme/ladder.toml, so they are close targets here, not localisation targets there. T-loc-ealpha-tidy (programme, ready, lean-causal) moves the generic static section out of Causal/Model/EAlphaCauchy.lean. The E_α targets therefore write new modules and leave EAlphaCauchy.lean and Causal/Static.lean alone while its lease is live. The ladder-keeper may record the new E₀ witnesses. Re-checked 2026-11-21 (planning run after wave 16) by the planner. Done since: T-ett-massa-dec25 (cf6dca6: MassAModel, massAModel_facts and the abstract assembly massA_singular_dec25_models, Causal/Remarks/MassADEC25.lean:327, :343, :396), T-ett-ealpha-sectors (03d7f18) and T-ett-e0-gx-structure (fa2d000: E0GX.singularGX and hreg at κ = 0, Causal/Port/E0GXStructure.lean:488, :648). Of « the model family » above, the facts and the abstract statement now exist. Left: E_κ's structure (T-ett-ealpha-gx-structure); the packaged instance ∀ o, SingularGXStructure (Flat.isom 2) (Minkowski 2) (MassAModel o), hreg at every model and the witness that T-ett-massa-dec25 AUDIT-1 found missing (split off as T-ett-massa-models-instance); and (b′) (T-ett-e-models-bprime, itself split into T-ett-bprime-e0 and T-ett-bprime-ealpha). This target is then one application of massA_singular_dec25_models with hreg and hiso discharged, plus witnesses with a singular point (E₀ and an E_κ through their identity X_A-charts). Marks: OQ-18 (« natural »), OQ-82 (the group), OQ-34/OQ-35 (E₀). Re-checked 2026-11-21 (planning run after wave 17) by the planner. Done since: T-ett-maxatlas-hoist (3263c8f) and T-ett-bprime-e0 (0dffb9d), which gives (b′) at o = o′ = none (hiso_massAModel_none) and E₀-manifolds outright (existsUnique_causality_e0). Left: T-ett-ealpha-gx-structure (now ready), T-ett-massa-models-instance, T-ett-e-models-bprime. Still planned. Re-checked 2026-11-21 (planning run after wave 19) by the planner. Done since: T-ett-ealpha-gx-structure (245a447). T-ett-massa-models-instance and T-ett-bprime-ealpha are now ready (the latter relabelled defi:causal_Ealpha, a model fact); T-ett-e-models-bprime is planned on them. Still planned."
