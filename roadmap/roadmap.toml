evidence = "reports/atlas/sweep.json holds three packages only: lean-benzecri 2447 declarations / 27 modules, lean-causal 11851 / 195, lean-gx 11887 / 46. It was last written by the seed commit 3814d45 (git log -- reports/atlas/sweep.json), before every wave of 2026-11-20. lean-egf, lean-syracuse and lean-yamabe have no entry, so their lib cards are drawn 'not swept' (build.py l.47–62: 'a package it does not hold yet is drawn as not swept rather than given a number'). Refresh with make -C reports/atlas LOGS=<dir> (Makefile l.2–4). It reads check-<pkg>.log for every package of hub.toml's lib table and asserts each log's line 'axiom sweep (strict): N declarations in M modules' plus the clean-sweep line (build.py l.53–58). So it needs one fresh make -C <pkg> check log per package, all six. lean-causal's must come from a run when /ett-programme's lease leaves the package free, as the master's wave gates already do. The output is generated and the master commits it. Journal 2026-11-20 23:10 lists it as owed. Re-checked 2026-11-21 by the planner: still owed (git log -- reports/atlas/sweep.json shows only 3814d45). It is cheap now. The journal's last two waves record every package's gate green: lean-egf at 00:25, and lean-benzecri, lean-yamabe, lean-gx, lean-syracuse and lean-causal (223 strict modules) at 01:15. So the six check-<pkg>.log files can be the next wave's own gate logs, kept under one LOGS directory, instead of extra runs."
added = "2026-11-20"
proposed_by = "roadmap-planner"
