ical s-gon, immersed rather than embedded, with interior angles θ_i/2, one reflex corner per angle above 2π, built as a fan of convex triangles from one vertex. This generalises the dart, but its existence for the whole condition is unproved. (ii) Slit gluing: cut two cone spheres along geodesic segments of equal length joining two cone points each, and glue them crosswise. The angles at the two glued points add, so with the doubles of T-gx-troyanov-triangle and T-gx-troyanov-polygon as pieces, an induction on s may cover the case. The dart is the case of two triangles: its double is the slit gluing of two triangle doubles along the diagonal v_1v_3. Scope this target after T-gx-troyanov-four reports which of (i) and (ii) its machinery supports. Re-scoped 2026-11-21 (04:10) by the planner, after T-gx-troyanov-four (942f470) and T-gx-troyanov-reroute (e113f97), at the master's question « what existence step would cover s ≥ 5? ». Still planned: the case needs an existence argument that nobody has written, which is mathematics, not a ruling. Where it stands. The scaffold's only Troyanov sorry (GXScaffold/Spherical/TroyanovAngles.lean:328) carries s ≥ 5, every θ_i ≠ 2π, some θ_i > 2π. The T-gx-troyanov-four REPORT (lean-gx/campaign/T-gx-troyanov-four/REPORT.json, notes): GX.StarFrames and the reflex polar fold are generic (any number of reflex vertices); GX.StarPolygon.isConeSphere doubles any EMBEDDED polygon P ⊆ 𝕊², convex or not, given a disc model eK, its genuine sides and its sign facts; slit gluing of cone spheres is not supported; and « whether an embedded polygon with angles theta_i/2 exists for the whole condition at s >= 5 is not studied ». So the missing step is an existence theorem for embedded spherical s-gons with prescribed angles α_i = θ_i/2 ∈ ]0, 2π[ ∖ {π}, some above π, under A := Σα_i − (s − 2)π ∈ ]0, min(2π, α_i)] (the printed condition; Gauss–Bonnet makes A the area). [r] (planner; numerical, by least squares over vertex positions with a simplicity check; the scripts ran outside the repository and are not archived; not a proof) such polygons exist, in some cyclic order of the angles, for all 24 sampled admissible data at s = 5 (12 with one angle above 2π, 12 with two, among them (5π/2, 5π/2, 2π/5, 2π/5, 2π/5)) and for all 4 sampled at s = 6 with one. [r] (unchecked) Two candidate constructions. (a) The dart's decomposition: cut along a diagonal from a reflex vertex into a triangle and a convex (s − 1)-gon (exists_sphPolygon, GX/Spherical/TroyanovPolygon.lean:610), and match the diagonal by an IVT in the two split angles, as GX.exists_dartParams (TroyanovFour.lean:3028) does at s = 4. The planner's grid scan finds the sign change in some cyclic order for 12 of 12 sampled data at s = 5 with one angle above 2π, but only 9 of 12 at s = 6, so the convex piece does not always suffice; and the IVT needs the (s − 1)-gon's side to vary continuously with its angles, which exists_polar_radius (an IVT on the radius, :234) does not give. A naive signed version of exists_polar_polygon (sides π − α_i < 0 run backwards) reproduces the convex case but gave no embedded polygon in 30 reflex samples. (b) A fan of s − 2 triangles from one vertex c whose two neighbours have α < π (there are always at least two such angles): the triangles occupy disjoint sectors at c, whose total angle α_c < 2π, so the union is embedded; the other vertices get their angles as sums of two triangle angles, so reflex vertices are allowed there; the triangles are built one by one by angle–side–angle, and the existence reduces to ONE closing equation in s − 2 parameters (the angle of the last triangle at c's other neighbour), to be solved by an IVT along a path of valid parameters, explicit spherical trigonometry only. Its endpoint signs are not checked, and StarPolygon's disc model would have to be built for a fan, whose triangles share only c (exists_homeomorph_union_convex asks for a common interior point). OQ-59 bears on the scope: under Theorem C's condition (< min(4π, 2θ_min)) more tuples must be covered than under the printed one. Moves to ready once (b), or another route, is written out with its endpoint signs, by a planner pass or as a closer's scoping dispatch. Re-checked 2026-11-21 (planning run after the wave of 06:03) by the planner: still planned, and the scope is wider than the two routes above. No lean-gx commit since T-gx-troyanov-reroute (e113f97); the scaffold's only Troyanov sorry is still GXScaffold/Spherical/TroyanovAngles.lean:328. [r] (planner; arithmetic checked numerically, not in Lean) At s ≥ 5 the condition admits angles of 4π and more, which no double of an EMBEDDED polygon can give. Example: θ = (5π, 3π/4, π/10, π/10, π/10) satisfies GX.TroyanovAngleCondition (GX/SingularII/Models.lean:897): χ' = Σ(θ_i − 2π) + 4π = π/20, and 0 < π/20 ≤ min(4π, π/10). It also satisfies Theorem C's 0 < χ' < min{4π, 2θ_min} (papers/gx/sources/MR1005085/NOTE.md, where the θ_i are « positive numbers », with no upper bound). Its double would need a polygon with interior angle α_1 = θ_1/2 = 5π/2 > 2π. So GX.StarPolygon.isConeSphere cannot reach it, and neither can route (b): there α_c < 2π, and each other vertex gets a sum of two triangle angles, which is < 2π. In general the condition gives θ_max ≤ Σ_{i≠max,j}(2π − θ_i) < 2π(s − 2) for every j ≠ max, so θ_max < 4π at s = 4 (why the dart sufficed) but not from s = 5 on. The case left therefore splits in two. (1) Some θ_i ≥ 4π: this needs a construction that is not a double of an embedded polygon, for instance the double of an abstract (immersed) spherical polygon glued from triangles, or slit gluing. The library supports neither (T-gx-troyanov-four REPORT). (2) Every θ_i < 4π: routes (a)/(b) still apply, with their endpoint signs unchecked. Whoever scopes this target scopes both parts. This is mathematics, not a ruling (DEC-136: prove in full). Re-checked 2026-11-22 by the planner, after T-gx-troyanov-theorem-c (636edca, DEC-174). The obligation of record is now GX.troyanovTheoremC (scaffold GXScaffold/Spherical/TroyanovAngles.lean:328–336), over Theorem C's condition 0 < χ' < min{4π, 2θ_min}. It is routed through troyanovTheoremC_of_five_le_of_exists_gt_two_pi (strict GX/Spherical/TroyanovTheoremC.lean), so every case with s ≤ 4 or all angles ≤ 2π is proved. The sorry carries s ≥ 5, no angle 2π, some angle above 2π (possibly ≥ 4π), a case wider than the printed one (GX.troyanovAngleConditionC_five_not_printed). Both parts (1) and (2) above are now to be read under Theorem C's condition. GX.troyanovTheorem (printed condition) follows from it. Still planned: no existence route for the case is written out."
