[[target]]
id = "T-gx-troyanov"
title = "Troyanov's existence theorem, the case left after s = 3, the angles 2π, the polygons and the dart: s ≥ 5 angles, none equal to 2π, at least one above 2π; then GX.troyanovTheorem assembled and discharged"
stream = "gx"
kind = "close"
paper = "gx"
labels = ["cex:start_singular_manifold_homeomorphic"]
status = "planned"
owner = "closer"
priority = 8
depends = ["T-gx-spherical-cone", "T-gx-troyanov-triangle", "T-gx-troyanov-two-pi", "T-gx-troyanov-polygon", "T-gx-troyanov-four"]
evidence = "DEC-136: prove it in full, do not shrink it; DEC-69 made it a named external. Re-scoped 2026-11-20 by the planner and moved from ready to planned, because it is not one dispatch. The Prop (GX/SingularII/Models.lean:944) quantifies over every s ≥ 3 and every θ with TroyanovAngleCondition (Σ(θ_i − 2π) + 4π in ]0, min(4π, θ_i)]). That is an existence theorem for cone metrics with prescribed angles. Re-scoped again 2026-11-20 by the planner, after T-gx-spherical-cone (7d7d6fa). The objects exist: GX.IsConeSphere, GX.SphCone, the angle-tied GX.TroyanovTheorem, whose proof is the tagged sorry GX.troyanovTheorem (scaffold Spherical/TroyanovAngles.lean:322). The s = 3 case is T-gx-troyanov-triangle; this target is s ≥ 4. It no longer depends on T-gx-troyanov-suspension: GX.TroyanovTheorem does not use the suspension facts, and the row's mark needs both obligations whichever closes last. [r] (planner, unchecked) Route notes, to be scoped before dispatch. (1) An angle 2π is a marked regular point: dropping it leaves the sum unchanged and keeps s ≥ 3 (GX.TroyanovAngleCondition.three_le_card_ne_two_pi), so it reduces to s − 1 points. (2) Angles above 2π occur once s ≥ 4: (5π/2, 3π/5, 3π/5, 3π/5) satisfies the condition (sum term 3π/10 ≤ 3π/5). So doubling a convex spherical polygon is not enough, and a reflex vertex or another construction is needed. MR1005085 is not archived under papers/gx/sources (T-gx-spherical-cone REPORT: the condition's subcritical form was recalled from it, unchecked). Updated and split 2026-11-20 by the planner, after T-gx-troyanov-triangle (6195fbb). s = 3 is proved: GX.troyanovTheorem_three (GX/Spherical/TroyanovTriangle.lean:2426), exactly TroyanovTheorem at s = 3 (AUDIT-1 CHECKED (1)). GX.troyanovTheorem_of_four_le (l.2442) reduces TroyanovTheorem to s ≥ 4, and the reduction is an equivalence (AUDIT-1 CHECKED (2)). The scaffold sorry (TroyanovAngles.lean:322) still covers every s. The REPORT suggests that the master re-route it through 