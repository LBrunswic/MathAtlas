id = "T-gx-troyanov"
title = "Troyanov's existence theorem, the case left after s = 3, the angles 2π, the polygons and the dart: s ≥ 5 angles, none equal to 2π, at least one above 2π; then GX.troyanovTheorem assembled and discharged"
