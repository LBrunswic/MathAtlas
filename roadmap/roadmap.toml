[[target]]
id = "T-ett-e-models-bprime"
title = "(b′) at the E≥0 models, assembled over MassAModel: every a.e. isomorphism chart between open subsets of E₀ and the E_κ (κ > 0) is a chart isomorphism. Same type from T-ett-bprime-e0 and T-ett-bprime-ealpha, regular sources from chartIso_of_isAEChart_of_subset_reg, and no a.e. isomorphism chart joining a point of E₀'s axis to a point of an E_κ's line"
