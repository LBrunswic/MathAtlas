[[target]]
id = "T-gx-troyanov"
title = "Troyanov's existence theorem, the case left after s = 3, the angles 2π and the polygons: s ≥ 4 angles, none equal to 2π, at least one above 2π; then GX.troyanovTheorem assembled and discharged"
stream = "gx"
kind = "close"
paper = "gx"
labels = ["cex:start_singular_manifold_homeomorphic"]
status = "planned"
owner = "closer"
priority = 8
