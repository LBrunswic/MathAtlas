evidence = "Added 2026-11-21 (planning run after wave 16) by the planner, split from T-ett-singular-sfa (its group (i)). The paper gives these fields from charts. rem:btz_pas_tarentin (ETT.tex:1358–1362): « this is immediate from Definitions defi:causal_Ealpha and defi:causal_E0 read in a chart ». rem:sing_tarentin (l.1364–1366): « Every E≥0-manifold is a tarentin topological spacetime ». (TeX references and macros rendered.) The model facts: E0.singularFlatAxioms (Causal/Port/E0SingularFlat.lean:589), and massive_tarentin, massive_Zplus, massive_Zminus (Causal/Model/Massive.lean:201–207). Tarentin, Z⁺ and Z⁻ are read with ⊤ (Causal/Properties.lean:116, :137, :140) but are witnessed by points of a neighbourhood, so a chart isomorphism carries them [r]. Hypothesis: an absolutely minimal C with IsoChartsCoverDEC25 (Causal/Remarks/MassADEC25.lean:133), which the natural causality satisfies (IsAtlasCausalityDEC25.isoChartsCover :141). So this target needs neither the existence half (T-ett-singular-instance) nor its global fields (T-ett-singular-sfa). Topology. t2 and secondCountable do not follow from a SingularGXStructure; they are « manifold » and enter as hypotheses (a reading, to disclose). Local compactness and no isolated point come through the charts, and metrizability from T2, second countability and local compactness. sing_α(M): sing₀(M) is the set of points an X_A-chart into E₀ sends to the axis, and sing_κ(M) (κ > 0, κ ≠ 2π) the same with E_κ's line. They are well defined by the type invariance of T-ett-e-models-bprime and T-ett-bprime-ealpha (BTZ_1.tex:389, quoted in T-ett-bprime-ealpha), hence that dependency. isClosed_sing: Sing(M) is closed and each sing_α is open in it [r]. interior_sing: Reg is portly, hence dense (isPortly_reg, Causal/Port/SingularAtlas.lean:1562) [r]. Write a new module; no strict file is edited. Split 2026-11-21 (planning run after wave 17) by the planner. The E₀-manifold case and the model-free transfer lemmas are now T-ett-sfa-local-e0 (ready), which needs only E₀'s structure and (b′) at E₀, both done. This target keeps the E≥0 instance over MassAModel: the charts into E_κ (κ > 0), sing_κ(M) for κ ≠ 2π, and its well-definedness by the type invariance (T-ett-bprime-ealpha, T-ett-e-models-bprime). Once T-ett-sfa-local-e0 states its lemmas over IsoChartsCoverDEC25 for any model family (Causal/Remarks/MassADEC25.lean:133), this target is their instance at the family MassAModel, with E_κ's model facts in local form (E0LM.locZplus_of, locTarentin_of from massive_causallyArcConnected and massive_stronglyCausal; Causal/CausallyPlainLocZ.lean:119–135). Updated 2026-11-21 (planning run after wave 19) by the planner, after T-ett-sfa-local-e0 (5bcad0b). What it leaves here. The model-free transfer exists in the ETT layer over IsoChartsCover (Causal/SFATransfer.lean), and IsoChartsCoverDEC25 bridges to it (Causal.SFALocalE0.isoChartsCover_of_dec25, Causal/Port/SFALocalE0.lean:127), so this target is that transfer's instance at MassAModel plus E_κ's model facts in local form. isClosed_sing and interior_sing are strict for every singular (G,X)-manifold (Causal.isClosed_sing and isSkeletal_sing, Causal.Port.SingularAtlas); local compactness and no isolated point come from the charts (SFATransfer.exists_isCompact_nhds_of_chart, nhdsNE_neBot_of_chart); metrizability is infer_instance from T2, second countability and local compactness. Its finding, as its AUDIT-1 narrowed it: Z⁺ = M, tarentin, M ∖ sing₀ ⊆ Z⁻ and past_local are chart facts; I⁻(p) = ∅ at a BTZ point, hence BTZ ∉ Z⁻, is not: it uses absolute minimality (SFATransfer.Iminus_eq_empty_of_cover, Causal/SFATransfer.lean:292) with a cover whose members through p are sources of charts into E₀, and it fails for a causality with only an isomorphic chart at each point (e0_topTotal_separates). That is OQ-18's reading of « natural », and it is why this target keeps « absolutely minimal » in its hypothesis. At an E≥0-manifold the members through a BTZ point must be E₀-chart sources, i.e. no X_A-chart into an E_κ passes through it: the cross-type invariance of T-ett-e-models-bprime, hence that dependency. T2 and second countability are part of « manifold » under DEC-25 (gx's def:singular_manifold_locally_connected, papers/gx/legacy/labeled/RamcovGX.tex:474), as T-ett-sfa-local-e0 AUDIT-1 settled; no OQ. Where: a new module beside Causal/Port/SFALocalE0.lean (it imports the E₀ port), so under Causal/Port, to be said to /ett-programme at dispatch. Still planned on T-ett-massa-models-instance and T-ett-e-models-bprime."
