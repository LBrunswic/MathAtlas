evidence = "Split off T-syr-rep 2026-11-20 by the planner. syracuse.tex l.52 (unlabelled): 'one can show that for any ℤ/2ℤ-ring A, A_2 is naturally isomorphic to the ring of 2-adic integers ℤ_2'. l.57–60, prop:ring_both_continuous_extends: 'both f_A and T_A are continuous and extends continuously to A_2. Furthermore, their extension is f_{A_2} and T_{A_2} respectively', with the proof 'left to the reader' (l.57). T-syr-base (895d501) REPORT notes: 'ZMod 2 is a counterexample to A_2 ≅ ℤ_2 (l.52) under the printed definition' (OQ-42 (b), open: 2 ≠ 0 is added where it is used). T_A is undefined at −1/3 when 3 is a unit, as in ℤ_2 (Syracuse.T_undefined_padicInt, lean-syracuse/Syracuse/Base.lean:185; OQ-42 (d), open). The tools are strict: IsZ2Ring with the instance ℤ_[2] (Valuation.lean:78, 321), nu2 and v2 (REPORT kb_proposals[0]), and f and T (Base.lean). [r] (planner, unchecked) For 2 ≠ 0, multiplication by 2^k gives A/2A ≅ 2^kA/2^{k+1}A, so |A/2^nA| = 2^n. 1 has additive order 2^n there (2^{n−1} ∈ 2^nA would put 1 in 2A), so ℤ/2^n ≅ A/2^nA and A_2 = lim A/2^nA ≅ ℤ_2. Krull's intersection theorem (A a noetherian domain) makes A → A_2 injective. Mathlib has PadicInt and AdicCompletion. Likely finding [r]: T_{A_2} is undefined at −1/3 ∈ 2ℤ_2 + 1, and the odd part of 3x + 1 has no limit as x → −1/3. So T_ℤ, though continuous on 2ℤ + 1, does not extend continuously to all of ℤ_2, and 'extends continuously to A_2' presumably holds only off −1/3: a finding under OQ-42 (d). It runs beside T-syr-rep, which works in ℤ_[2] and builds no map A → ℤ_2; that map is this target's."
