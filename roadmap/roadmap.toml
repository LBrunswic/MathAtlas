depends = ["T-ett-e0-gx-structure", "T-ett-ealpha-gx-structure", "T-ett-bprime-e0", "T-ett-bprime-ealpha", "T-ett-massa-models-instance"]
evidence = "Added 2026-11-21 (planning run after the wave of 10:05) by the planner, split from T-ett-singular-instance (its reason (2)). Causal/GXSingularDEC25.lean adds (b′) as hiso: ∀ a b ψ, IsAEChart G X ψ → ChartIso (DY a) (DY b) ψ. Whether (b′) belongs to « model space », or (b) should state it, is OQ-64 (open). That question bears on the mark of prop:GX_sing_espace_temps_topo, for every analytic singular structure. cor:massA_causalite is about the E≥0 models only, so (b′) can be proved there instead of waited for. By forall_exists_causality_singularGX_iff, taken at M = X_α, the existence half of the corollary at every E≥0-manifold holds iff (b′) holds at these models. This assumes (a), (b), hreg and the maximal-atlas reading of « every chart »; proving (b′) also covers every narrower reading. So this target needs no ruling. If (b′) fails at some E≥0 model, that is a finding for OQ-64: the corollary is then false as printed under that reading. What there is. At regular sources (b′) holds (chartIso_model_of_subset_reg, chartIso_of_isAEChart_of_subset_reg). An IsAEChart maps Sing to Sing (IsAEChart.mem_reg_iff). The rotations and τ-translations of E₀ are chart isomorphisms (E0.chartIso_tauShift, chartIso_rotE0), and an isometry of space carries static causalities (staticCausality.strongMorphism_of_isometryEquiv). [r] (planner, unchecked, to be scoped before dispatch) Near a singular point, an a.e. isomorphism is a (G,X)-map on a punctured neighbourhood of the line, so its development conjugates the holonomy of a small loop about the line. That holonomy is elliptic of angle κ for E_κ and parabolic for E₀. So no such map joins E₀ to an E_κ, or E_κ to E_κ′ with κ ≢ κ′ mod 2π. For κ ≡ κ′ (mod 2π) with κ ≠ κ′, the lengths of small loops about the line (κr against κ′r) should exclude it. For κ = κ′ the map should be a rotation–translation about the line, which preserves the causality. Planned until the models' structures exist, since the statement needs a SingularGXStructure on E_κ and E₀. Scoped and split 2026-11-21 (planning run after wave 16) by the planner. E₀'s structure exists (E0GX.singularGX), and (b′) at its regular sources too (E0GX.chartIso_of_isAEChart_of_subset_compl_axis, Causal/Port/E0GXStructure.lean:658). Its REPORT records the singular case as « Not done: (b') of existsUnique_causality_singularGX_dec25 at singular sources of E0 ». The argument is the source's own. brunswic2021cauchy, which ETT.tex:1323–1325 names as the reference for the model spaces, proves it as prop:isom (papers/gx/sources/2108.12631/src/BTZ_1.tex:378–383): « Let α,β ∈ ℝ₊ with α ≠ 2π, and let U be an open connected subset of E^{1,2}_α containing a singular point and let φ : U → E^{1,2}_β be an almost everywhere E-morphism. If φ is a local homeomorphism then α = β and φ is the restriction of an element of Isom(E^{1,2}_α). » (TeX macros rendered.) An IsAEChart between models is such a φ on each connected open set of its source. Split three ways. T-ett-bprime-e0 (ready): E₀ to E₀. T-ett-bprime-ealpha: E_κ to E_κ′, κ, κ′ > 0. This target: the cross-type case, and the assembly over MassAModel (hence its dependency on T-ett-massa-models-instance, which packages the instance in which (b′) is stated in massA_singular_dec25_models, Causal/Remarks/MassADEC25.lean:396). The cross-type case is the first step of prop:isom's proof (BTZ_1.tex:446): « If α>0 (resp. α=0), the holonomy of γ is elliptic (resp. parabolic), then so is the holonomy of φ(γ), thus β>0 (resp. β=0). » E₀'s holonomy is parabolic (E0GX.isParabolic_holLin_two_pi, :297). E_κ's is rotIsom κ, elliptic or trivial, by the continuation lemma of T-ett-ealpha-gx-structure. A trivial holonomy also differs from a parabolic one, so κ ∈ 2πℤ needs no special case. At κ = 2π, Sing(E_{2π}) = ∅, so IsAEChart.mem_reg_iff (Causal/GXSingularDEC25.lean:157) settles it at once. Regular sources: chartIso_of_isAEChart_of_subset_reg (:512) with hreg. [r] (planner) The three targets are written for Flat.isom 2 = SO₀(1,2) ⋉ ℝ³, the reading of record. If OQ-82 rules O↑(1,2) ⋉ ℝ³, the reflections θ ↦ −θ of E₀ and E_κ enter the maximal atlases, and their ChartIso is a follow-up. For E_κ it is staticCausality.strongMorphism_of_isometryEquiv (Causal/Model/Massive.lean:108) at a reflection of the cone; for E₀ it is a le/lt computation like le_rotE0_iff. Updated 2026-11-21 (planning run after wave 17) by the planner. T-ett-bprime-e0 is done (0dffb9d). (b′) at E₀ → E₀ is Causal.BPrimeE0.chartIso_of_isAEChart (Causal/Port/BPrimeE0.lean:726). Causal.BPrimeE0.hiso_massAModel_none (:785) is already the case o = o′ = none of massA_singular_dec25_models' hiso; it takes the family of structures as an instance argument whose value at E₀ is E0GX.singularGX, a shape its AUDIT-1 checked by a probe. So the assembly here needs the case (some, some) from T-ett-bprime-ealpha and the cross-type cases (none, some) and (some, none). For those, E₀'s parabolic holonomy is E0GX.isParabolic_holLin_two_pi, now at Causal/Port/E0GXStructure.lean:212 after the hoist. Two things (b′) will still lack after this target, recorded so that nobody counts them done. (i) The O↑(1,2) ⋉ ℝ³ statement under OQ-82's other reading. The reflection conjE0 is a ChartIso (chartIso_conjE0), but the theorem for that group is not stated; at κ > 0 the reflections in timelike planes through the line would use staticCausality.strongMorphism_of_isometryEquiv. (ii) prop:isom's global form on a connected U (BTZ_1.tex:378–383, by Liouville). (b′) needs only the local form, and BTZ_1 is a source, not a ledgered paper, so no target asks for it. Still planned on T-ett-ealpha-gx-structure (now ready), T-ett-bprime-ealpha and T-ett-massa-models-instance. Updated 2026-11-21 (planning run after wave 19) by the planner. T-ett-ealpha-gx-structure is done (245a447); T-ett-bprime-ealpha and T-ett-massa-models-instance are now ready. With the latter's (5), regular sources for every pair, this target owes the singular sources only. (some, some): from T-ett-bprime-ealpha, which now carries the label defi:causal_Ealpha and states nothing over MassAModel, so its theorem is transported here to MassAModel (some κ) → MassAModel (some κ′) under the family instance. (none, none): Causal.BPrimeE0.hiso_massAModel_none (Causal/Port/BPrimeE0.lean:785). Cross-type, [r] (planner, unchecked): for ψ : E₀ ⇀ E_κ whose source meets the axis, κ = 2π is excluded at once (Sing(E_{2π}) = ∅, EAlphaGX.sing_eq_empty_two_pi, Causal/Model/EAlphaGX.lean:379, with IsAEChart.mem_reg_iff); for κ ≠ 2π read ψ from BPrimeE0's reference chart c₀ (:117) into E_κ's disc charts up to rotIsom (nκ), the target side of T-ett-bprime-ealpha's route (A), one g on BPrimeE0's slit box; across the slit c₀ jumps by hol(2π), so g hol(2π) g⁻¹ = rotIsom (nκ) for some n. The linear part of hol(2π) is parabolic (E0GX.isParabolic_holLin_two_pi, Causal/Port/E0GXStructure.lean:212): unipotent, not the identity, trace 3. The linear part of rotIsom c has trace 1 + 2 cos c, which is 3 only when the rotation is the identity. Conjugation keeps the trace, a contradiction. (some, none) is the inverse of (none, some) by IsAEChart.symm (Causal/GXSingularDEC25.lean:152). Then the assembly: the hiso of massA_singular_dec25_models (Causal/Remarks/MassADEC25.lean:396) by cases on (o, o′). Where: a new module beside the family module of T-ett-massa-models-instance under Causal/Remarks; it imports Causal.Port.BPrimeE0 but writes nothing under Causal/Port or Causal/CBG. Still planned on T-ett-bprime-ealpha and T-ett-massa-models-instance."
