question = "Section 6 of the Yamabe paper (Yamabegap.tex l.461–552; proofs from l.601) rests on cited analysis that Mathlib lacks at this pin: the Yamabe theorem (thm:yamabe, MR125546); Akutagawa–Botvinnik's approximation and gluing theorems (MR1957657, in prop:nonpositive and lem:gluing); Gromov–Lawson enlargeability (MR569070); Escobar's facts (i)–(iv) for manifolds with boundary (l.~320–340, used in thm:upper-bound); and the Sobolev, trace and Rellich theorems on compact manifolds with boundary (Hebey1996, in lem:kobayashi and lem:positivity). Are these formalized as named external Props (as DEC-69 first did for Troyanov), with every step of the paper's own proofs formalized from them over Mathlib's manifolds? Answer yes, or name the ones to prove."
evidence = "DEC-139 scopes lean-yamabe to §6 first. lean-yamabe/Yamabe has only the wave-0 Basic.lean (979b864). The ledger curates thm:yamabe and thm:extremal as cited. Mathlib at v4.31.0 has manifolds with boundary and Riemannian metrics (Mathlib/Geometry/Manifold/Riemannian/Basic.lean, VectorBundle/Riemannian.lean). It has no Riemannian volume measure, no scalar or mean curvature, and no Sobolev or trace theorem on manifolds. Without this answer no §6 row can be anchored (Lean ≥ paper). T-yamabe-quotient is the part that does not wait on it. Updated 2026-11-20 by the planner. T-yamabe-quotient (e4e12c0) proved lem:stability and rem:sign over an abstract measured model, both partial pending this ruling and OQ-44 (whether that model is the formalization of record). T-yamabe-kobayashi is the next part that does not wait on it: lem:kobayashi (a) over the same model. Its (b), the Sobolev embedding (Hebey1996), does wait. Re-checked 2026-11-21 (04:10) by the planner, at the master's request: after T-yamabe-quotient, T-yamabe-kobayashi and T-yamabe-gluing-algebra (1c83dfc), nothing else in § 6 is dispatchable before this ruling. The rows left each need a cited input: prop:nonpositive (l.476, proof l.640–646: Akutagawa–Botvinnik's Corollary 5.3 of MR1957657, thm:yamabe (b), Gromov–Lawson enlargeability MR569070); lem:gluing (l.685, proof l.689–695: Akutagawa–Botvinnik's Theorem 4.6); lem:positivity (l.715, proof l.719–721: Rellich–Kondrachov and the compact trace, Hebey1996); lem:kobayashi (b) (Sobolev embedding, Hebey1996); cor:negative (l.502), from thm:upper-bound and lem:positivity (Yamabe.MeasuredModel.upper_bound_of_gluings_of_pos already gives its R_g < 0 over the model given lem:positivity, T-yamabe-gluing-algebra REPORT). rem:existence is informal and uses Escobar's fact (ii). thm:lower-bound is not proved in this paper at all (T-yamabe-lower-bound). The upper bound's own steps (lem:gluing-estimate's chain, the τ → 0 limit, lem:stability, rem:sign, lem:kobayashi