question = "theo:BTZ_Cauchy-completness (i) ⇒ (iii), in the readings of record. (i) has Reg M Cauchy-complete through a spacelike-Lipschitz complete Cauchy surface Σ₀ (Causal.Flat.IsCauchyComplete, the form prop:reg_complete concludes; OQ-152 (b)). (iii) has BTZext(M) Cauchy-complete as GX.E0RegComplete.IsE0C1CompleteCauchy (OQ-142 (e)), whose rim field asks that the trace of the Cauchy surface on the shaft of every spear chart be C¹. Step 2's Σ₁ agrees with Σ₀ off the spears, so the C¹ form needs Σ₀ to be C¹ near the BTZ lines. Which form of record? (a) (i) ⇒ (iii) concludes a spacelike-Lipschitz complete Cauchy surface of BTZext(M), that is, IsE0C1CompleteCauchy without its rim field. The theorem is then recorded in that corrected form, and (ii) ⇒ (i) keeps prop:reg_complete's C¹ hypothesis. (b) (i) ⇒ (iii) concludes IsE0C1CompleteCauchy itself. This needs a smoothing of Σ₀ near the BTZ lines that keeps it Cauchy and complete, to be proved in lean-gx"
evidence = "BTZ_1.tex l.226–227: « a E-manifold is called Cauchy-compact (resp. Cauchy-complete) if there exists a smooth spacelike Cauchy-surface Σ in M which is compact (resp. metrically complete) ». The paper cites Bernal and Sánchez (l.226) only for the existence of a smooth spacelike Cauchy surface. Step 2, l.1620–1623: « construct a Cauchy-surface Σ₁ of M₁ by replacing pieces of a complete Cauchy-surface of M₀ inside each spear neighborhood by a compact piece cutting the BTZ line. This operation preserve metric completeness ». GX/BTZ/CompleteCauchy.lean:49–60: IsE0C1CompleteCauchy has the fields cauchy, reg (spacelike-Lipschitz regular part), complete, continuous and rim. rim asks, for every spear chart where S meets the spear along a continuous graph τS, that ContDiff ℝ 1 (E0Surgery.rimFun τS R) hold. OQ-142 (e) (OPEN): « Cauchy-complete (l.227) read as IsE0C1CompleteCauchy … the conclusion's Cauchy-completeness of Reg M is the spacelike-Lipschitz one of DEC-31/35 ». OQ-152 (b) (OPEN): « Cauchy-complete for M₀ read in the Lipschitz form (DEC-31/35) ». [r] (planner) A spear chart around a line whose radius exceeds the cap's has its shaft trace on Σ₀, so under (b) Σ₁ must be C¹ wherever such a shaft meets it. The library has no smoothing of spacelike-Lipschitz surfaces: DEC-117 deleted the forward surgery's smoothing step (G0). The cap lemma GX.E0Surgery.lem_curve_extension_i (GX/BTZ/Surgery.lean:2229) needs a C¹ rim. Under (a), the three-way equivalence holds with (iii) Lipschitz. The C¹ form of (iii) still implies (ii), hence (i), by prop:reg_complete, but is not shown to follow from (i). This decides what T-btz-cauchy-step2-surface concludes, and through it T-btz-cauchy-step2-max and T-btz-cauchy-conservation. T-btz-cauchy-easy and T-btz-surface-complete-lip hold under either answer"
