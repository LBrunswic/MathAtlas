re Yamabe.MeasuredModel.tendsto_infF_of_uniformlyClose (Yamabe/Stability.lean:593, lem:stability's 'consequently') and EH_eq_Y and Y_eq_const_mul (Yamabe/Kobayashi.lean:415, :437). Both rows stay partial, like lem:stability and lem:kobayashi: their anchoring waits on T-yamabe-scope, and the model's status on OQ-44. If OQ-44 rejects the measured model, this target is rebased with T-yamabe-quotient and T-yamabe-kobayashi. The work is used whichever way T-yamabe-scope rules, since named externals or proofs both feed these same steps. Writes a new module of lean-yamabe."
