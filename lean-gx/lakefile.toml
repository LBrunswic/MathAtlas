name = "GX"
defaultTargets = ["GX"]

# The library of the paper `gx`: L. Brunswic, "On branched coverings of singular (G,X)-manifolds"
# (arXiv 2010.10610; Geom. Dedicata 2024), with the classical developing theorem. A package of its
# own at the hub's pin, beside `lean-causal/`, because `lean/` is the read-only GFNBoundsLean
# submodule (OQ-1). It does NOT depend on `lean-causal`: the (G,X)-groupoid of
# `Causal/GXStructure.lean` is ported, with its origin cited. Graduation into `lean/` is
# `git mv lean-gx/GX lean/GX` and `git mv lean-gx/scaffold/GXScaffold lean/scaffold/GXScaffold`.
#
# Mathlib at the hub's pin (hub.toml): tag v4.31.0, frozen by lake-manifest.json to fabf563a7c95.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

# The STRICT library. `sorry` is a compile error here: warningAsError.
[[lean_lib]]
name = "GX"
globs = ["GX.*"]
leanOptions = { warningAsError = true }

# The SCAFFOLD library. `sorry` is permitted and tagged `SORRY(<label>): <obstruction>`. Not a
# default target, and never imported by `GX`: graduation is a file move.
[[lean_lib]]
name = "GXScaffold"
srcDir = "scaffold"
globs = ["GXScaffold.*"]
