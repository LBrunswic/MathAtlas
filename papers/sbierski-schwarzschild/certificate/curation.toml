# Authored. The curated fields of the sbierski-schwarzschild ledger
# (tools/ledger_curate.py --paper papers/sbierski-schwarzschild).
# Sbierski, The C^0-inextendibility of the Schwarzschild spacetime and the spacelike diameter in
# Lorentzian Geometry (arXiv 1507.00601 v2) is an EXTERNAL paper, ledgered for the ETT programme
# (programme/roadmap.toml T-pkg-sbierski-schwarzschild, 2026-11-23), as DEC-34 for Barbot and as
# papers/sbierski-mghd: read and formalized, never rewritten. Its Lean home is lean-causal/ (Causal,
# CausalScaffold). At wave 0 no row has a Lean anchor and none is marked: the row-by-row
# correspondence is the binder's (certificate/binder.toml, T-bind-sbierski-schwarzschild), which
# splits each row into its ETT theorem (layer 1: Lemma 2.17's locating step is
# Causal.Causality.exists_leaving_of_hasChronalNeighbourEverywhere and its boundary form
# exists_leaving_of_isOpenEmbedding), its localisation properties (ladder ids: has_chronal_neighbour,
# DEC-159) and its geometric lemma (layer 3: C^0 Lorentzian metrics, the package of DEC-147, OQ-100).
#
# Labels. Every statement environment carries a `schw<kind>:` label first (schwthm, schwprop,
# schwlem, schwdef, schwrem), ahead of the author's own label, whose name it reuses
# (`ExtensionLemma` -> `schwlem:ExtensionLemma`); the twelve statements without an author label
# get a mechanical name from their first significant words (a definition's from its emphasised
# term). The author's \ref's resolve through the secondary labels. The two theorem* of the
# introduction are twins of Theorems MainThm and DiamFinite (ledger.toml `twins`).

# Layer 1 in Lean (T-cur-schw-layer1, 2026-11-27). The rows the binder binds to Lean names carry
# those names as decls, with their files, lean_proved_override = "partial" (strict, sorry-free,
# unmarked: Lean < paper, never an anchor, while the C0 model's layer 3 is open), bucket B where an
# open question names the reading and D where only the C0 layer 3 is missing, and a note. Binder and
# curation are two copies of one mapping: a rebinding is mirrored here. Not curated: the remarks,
# Prop 2.8 and Thm 5.7, whose binder `ett` names only the axioms their causal steps use.

