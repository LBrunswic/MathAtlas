bucket = "D"
notes = "Unmarked, partial (T-cur-schw-layer1, 2026-11-27): Lemma 2.17 (:425–440), locating the extension: its ETT argument is in Lean with the localisation properties as hypotheses (has_chronal_neighbour at the frontier, an edge hypothesis by DEC-159; causally_arc_connected), narrower than the row. Lean < paper, so no anchor and no mark; the C0 model's layer 3 (T-loc-c0-metric-causality) is not built."

