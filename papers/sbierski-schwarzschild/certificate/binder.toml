#
# How the paper factors (SYNTHESIS Q2; KB note (i)–(iii)). Every C⁰-inextendibility proof here has one
# scheme (§1, :145–160; Thm 3.1, :480–624):
#   (1) locate the extension: a timelike curve γ̃ of the extension M̃ leaves ι(M) (Lemma 2.17), and
#       γ = ι⁻¹ ∘ γ̃ is future inextendible in M (Thm 3.1 Step 1, :485);
#   (2) a near-Minkowskian chart Ũ about γ̃(1) (Lemma 2.4) whose chart diamonds have compact closure
#       in Ũ and bounded timelike diameter (Thm 3.1 Steps 1.1–1.3);
#   (3) identify diamonds of M with chart diamonds, (1.2)'s '⊇' (:153–158): a timelike homotopy in M
#       with fixed endpoints, starting from the segment of γ, cannot escape the chart diamond (open–
#       closed in the homotopy parameter, Thm 3.1 Step 3, :619–621; Thm 4.11 at :1623); every timelike
#       curve of M between the two points is such a homotopy's end once M is future one-connected;
#   (4) a metric invariant bounded in the chart and infinite in M: the timelike diameter (Minkowski,
#       Schwarzschild exterior) or the spacelike diameter (Schwarzschild interior, §5–6).
# (1) and (3) are layer 1. (1) is in Lean: Causal.Causality.exists_leaving_of_isOpenEmbedding
# (Causal/LocateExtension.lean:418), with the localisation hypothesis HasChronalNeighbour at the
# frontier points (DEC-159; without it the lemma is false in ETT, Causal.not_exists_leaving_bare, the
# isolated line), and its every-point form exists_leaving_of_hasChronalNeighbourEverywhere
# (Causal/ChronalNeighbourBridge.lean:269) through the node has_chronal_neighbour; the leaving curve
# is future-inextensible in ι(M) on a Hausdorff M̃ (Causal.Causality.futureInextensible_of_leaving,
# exists_leaving_futureInextensible_of_isOpenEmbedding; Causal.SchwCausalLemmas). (3)'s vocabulary is
# in Lean: chronal homotopies and future one-connectedness (Causal.TimelikeHomotopy: ChronalHomotopyOn,
# FutureOneConnectedOn, an equivalence, invariant under time reversal, causal isomorphisms and charts),
# Prop 2.7 and Def 2.14 (Causal.SchwCausalLemmas: schw_prop_2_7, ChronallySeparatedOn,
# schw_def_2_14_iff). The confinement and the identification are in Lean since
# T-abs-diamond-confinement (Causal.DiamondConfinement, ETT layer: ChronalHomotopyOn.mapsTo_of_closure_subset
# and its _of_lt form, Step 3 as printed; FutureOneConnectedOn.chronalCurveOn_inf_of_closure_subset, Thm
# 4.11's curve form; Iplus_inter_Iminus_eq_inf_of_futureOneConnectedOn, (1.2)'s identification;
# LocallyStronglyCausal and the assembly LocallyStronglyCausal.exists_diamond_identification). The
# assembly of (1)–(3) is in Lean since T-abs-c0-extension-skeleton (Causal.C0ExtensionSkeleton,
# 1faaa160, ETT layer; the KB note's candidates (a) + (b)): the setting Causal.Causality.ExitDiamonds W γ
# (chart diamonds of compact closure at the exit point γ 1, and (1.2)'s identification along γ); the
# given-curve form Causal.Causality.exitDiamonds_of_curve (Thms 4.10, 4.11, and Thm 4.9 through W =
# ι(region I)); the leaving assembly exists_c0_extension_skeleton (Thm 3.1, with W = ι(M) all of N);
# Def 2.15 read causally, Causal.IsSpacetimeExtension, with its corollaries exists_c0_skeleton,
# exitDiamonds_of_curve and preimage_curve. (2) and (4) are layer 3, metric (DEC-147's package): no
# layer-1 statement.
#
# Which spacetime each localisation property is of. Two spacetimes enter every proof, and the
# binder's `localisation` lists both kinds:
#   * the EXTENSION M̃ (Sbierski: any C^k metric, k ∈ ℕ, so C⁰ is the general case): connected,
#     causally_arc_connected (Sbierski's ≪ is defined by timelike curves, Def 2.2), has_chronal_neighbour
#     at ∂ι(M) (Lemma 2.17's proof, :431: 'Let q̃ ∈ I⁻(p̃, Ũ)'; the edge hypothesis
#     chronal_neighbour_at_boundary, which the node gives at every frontier point), and the precompact
#     chart diamonds of step (2), the node locally_strongly_causal (Causal.Causality.LocallyStronglyCausal,
#     T-lad-c0-extension-nodes, e9adc425; only strongly_causal implies it, the ladder's 21 [[open]] pairs
#     argued to fail). Its entries are model C0 (T-loc-c0-metric-causality, needs-ruling: where C⁰ metrics
#     live, as T-loc-lipschitz-plain asks for C^{0,1}; locally_strongly_causal by Lemma 2.4's cone
#     sandwich, T-loc-c0-chart-diameter) and, for Lemma 2.17 alone, the hub's models as ambient spacetimes;
#   * the EMBEDDED spacetime N = ι⁻¹(…) (Minkowski, the Schwarzschild exterior, interior, maximal):
#     causally_arc_connected (for the identification, (3)) and future one-connectedness (the node
#     future_one_connected). Its entries are model minkowski and model schwarzschild.
# Models. `C0`: Sbierski's class of C⁰ time-oriented Lorentzian manifolds (the extensions M̃).
# `minkowski`: Causal.minkowski n (Causal/Minkowski.lean), in Lean, = Causal.staticCausality on
# EuclideanSpace; its metric facts (timelike diameter) go in DEC-147's package. `schwarzschild`: the
# maximal analytic Schwarzschild spacetime of §4.1 (d ≥ 3) and its regions, a member of the class
# smooth-vacuum that the paper treats; nothing of it is in Lean (T-loc-schwarzschild-model, behind
# T-pkg-smooth-lorentz, blocked on OQ-100). `smooth-vacuum`: smooth ambient spacetimes (the C^∞ case
# of Lemma 2.17, e.g. M_ext ↪ M_max), through T-loc-smooth-causal-ladder. `E_alpha` (DEC-188: the 3+1
# cosmic string Causal.cosmicString α of record, α_H = α/2π, the 2+1 massive α its corollary), `E_0`
# (DEC-159's BTZ case: I⁻ = ∅ ≠ I⁺ at a BTZ point, why the hypothesis is one-sided) and `flat-gx`
# (Causal.CBG.flat_singularFlatAxioms) appear on Lemma 2.17 only, as ambient spacetimes: that is where
# ETT goes beyond the paper (Sbierski's M̃ is a Lorentzian manifold, every point two-sided).
#
# Conventions of this binder.
#   * A row with no layer-1 content (a metric definition, chart or estimate) names in `ett` the
#     layer-1 theorem that consumes it (the theorem whose hypothesis it discharges, or whose conclusion
#     its obstruction contradicts), so that `tools/binder.py status` counts as 'layer 1 in Lean' only
#     rows whose layer-1 content is in Lean; its note says 'metric'. The one exception is a row whose
#     causal steps are exactly ETT axioms or notions used verbatim (Prop 2.8 (ii), Thm 5.7): those name
#     them.
#   * A layer-3 lemma for a property that is not yet a ladder node lists the property in
#     `open_localisation` and points its entry at the target that proves it, as papers/sbierski-mghd
#     does for data_local_uniqueness. Since 2026-11-27 (planning run after wave 45) no row of this
#     binder has one: future_one_connected and locally_strongly_causal are nodes, cited in
#     `localisation`.
#   * Twins: the two theorem* of the introduction (:96, :167) are bound as their numbered twins.
#
# Findings of this binder (reported to the master):
# * Lemma 2.17 is the one row whose whole layer 1 is in Lean (sorry-free, ETT layer). ETT's form is
#   strictly more general than the paper's in three ways the Lean records: only ι(M) open is used (not
#   the isometry; invariance of domain is layer 3); the boundary hypothesis is one-sided (E_0's BTZ
#   points qualify, exists_leaving_of_frontier_subset_Zplus); and it is local
#   (exists_leaving_of_local: arc-connectedness and the chronal neighbour asked near ∂ι(M) only). The
#   curve is future or past (D = C ∨ D = C.dual), Sbierski's 'otherwise reverse the time orientation'
#   (:485). Its layer 3 for Sbierski's class C0 is a target (T-loc-c0-metric-causality); for minkowski
#   and E_alpha it is in Lean.
# * Prop 2.6 (I^± open) is an AXIOM of an ETT causality (defi:causalite, Causal/Causality.lean:81–83,
#   Causal.Causality.isOpen_Iplus): in ETT it is what makes a C⁰ metric's curve relation a causality
#   at all, so its proof is the C0 model's layer 3, not a theorem of the ETT layer. Sbierski's remark
#   (:254) that it is 'the only result in causality theory for merely continuous metrics we need' is
#   ETT's point.
# * The diamond identification (1.2) needs no metric: with the closure of the chart diamond inside the
#   chart and N future one-connected and causally arc-connected, it is an open–closed argument on the
#   homotopy parameter (Causal.Causality.ChronalHomotopyOn.mapsTo_of_closure_subset, no separation
#   axiom; the identification Iplus_inter_Iminus_eq_inf_of_futureOneConnectedOn). The closure
#   hypothesis is a localisation property of M̃, the node locally_strongly_causal
#   (Causal.Causality.LocallyStronglyCausal): M̃ need not be strongly causal, but on a locally compact
#   R₁ space a strongly causal open neighbourhood of the exit point gives it
#   (LocallyStronglyCausal.exists_isCompact_closure; the cone sandwich of Lemma 2.4's chart, C⁰), and
#   it is needed there only (Causal.Causality.exitDiamonds_of_stronglyCausalOn).
# * Neither localisation property of step (3) comes from another causality condition. future_one_connected
#   is independent of every other node: the spatially compact flat cylinder ℤe₁\𝐌^{1+1} has all of
#   them and is not future one-connected (Causal.Flat.spaceCylinder_separates, T-abs-not-future-one-connected,
#   bdce0bdd), and the chronology-free witnesses of Causal.FutureOneConnectedVacuous separate it from
#   the rest; so Props 4.12 and 6.5 are irreducible layer-3 inputs. locally_strongly_causal is implied
#   by strongly_causal only (StronglyCausal.locallyStronglyCausal) and its other 21 pairs are argued
#   to fail, their witnesses targeted (T-abs-lsc-separations, T-abs-loop-fan-every-scale,
#   T-abs-galileo-curve-form, T-loc-time-cylinder-lsc): in particular a globally hyperbolic space need
#   not have it without tarentin (the loop fan at every scale), so the cone sandwich of Lemma 2.4 is
#   needed.
# * Lemma 2.17's hypothesis is not replaced by any global causality condition of the ladder: the
#   isolated line, which refutes the bare lemma (Causal.not_exists_leaving_bare), is globally
#   hyperbolic, causally compact, strongly causal and has a time function (Causal.isolatedLine_separates,
#   T-abs-isolated-line-conjoined, 166420a2), and lacks has_chronal_neighbour.
# * Readings, not taken (OQ rows): (R1) where C⁰ metrics live (T-loc-c0-metric-causality's question);
#   (R2) Def 2.12's Cauchy hypersurfaces count inextendible TIMELIKE curves of a smooth embedded
#   hypersurface, ETT's IsCauchySurface inextensible CAUSAL curves (DEC-14): for a spacelike C¹ Σ every
#   ETT Cauchy surface is one of Sbierski's, so diam_s over ETT's class is ≤ Sbierski's, and the
#   layer-3 targets use Sbierski's notion verbatim (OQ-114); (R3) M̃ need not be time-orientable (Rem
#   2.16 (2)): ETT's M̃ is time-oriented by construction, the double-cover lift being Lorentzian
#   geometry, cited (OQ-115).
# * Def 2.13 in ETT (Causal.TimelikeHomotopy) reads Sbierski's timelike curves (piecewise smooth,
#   one-sided tangents in the timelike cone) as chronal curves (continuous, locally ≪-increasing).
#   Under the C0 model the ETT class of curves contains his, so ETT's notion asks more homotopies of
#   more curves, and neither notion of future one-connectedness implies the other without a layer-3
#   comparison (the module's SCOPE). So FutureOneConnectedOn is a partial anchor of
#   schwdef:timelike_homotopic_fixed_endpoints (unmarked; the curation is T-cur-schw-layer1's).
#
# Findings on the paper (the audits of T-abs-timelike-homotopy and T-abs-schw-causal-lemmas, journal
# 2026-11-23 05:22 and 06:01, and of T-abs-c0-extension-skeleton, journal 2026-11-27 21:24, as that
# audit grades them; each also on its row, in `findings`; none is in a register):
# * Thm 3.1 Step 2.1 (:572–579): the printed homotopy Γ(t, s) = (σ_{λ(t)} * λ|[t,1])(s) splits at
#   s = 1/2 (refuted in Lean for every λ in ℝ^{1,n}: Causal.minkowski_not_chronalHomotopyOn_sbierskiPrinted;
#   the fixed split, Causal.minkowski_chronalHomotopyOn_sbierskiSplit). Its slices at t = 0 (σ_{λ(0)} is constant, λ(0) = 0) and at t = 1 (λ|[1,1] is a point) are
#   constant on half of [0, 1], so they are not timelike curves (Defs 2.1, 2.13), and Γ(0, ·), Γ(1, ·)
#   are λ and σ_{λ(1)} with a pause, not the curves themselves. The interior slices are timelike. Fix:
#   split at s = t, Γ(t, s) = σ_{λ(t)}(s/t) = (s/t)·λ(t) for s ≤ t and λ(s) for s ≥ t, with
#   Γ(0, ·) = λ; then Γ(1, ·) = σ_{λ(1)}. (On the timelike line a pause is not chronal:
#   Causal.timelikeLine_not_chronalCurveOn_pause.)
# * :876 (Prop 4.12's proof) writes γ₀(0) = γ₁(0) and γ₀(1) = γ₁(1) for curves over [t₀, t₁]:
#   γᵢ(t₀), γᵢ(t₁) are meant, and the homotopy is over [0, 1] × [t₀, t₁].
# * :1623 (Thm 4.11) writes γ(x₀⁻) where γ(y₀⁻) is meant.
# * Thm 4.9's 'and thus it is future inextendible in M_max' is at :798 (:799, which the roadmap and the
#   docstring of Causal.SchwCausalLemmas cite, is blank).
# * Prop 6.5 prints (M_ext, g_ext) for the interior (its row's note).
# * Thm 4.9 :798 ('otherwise reverse the time orientation of M_max') and :800 ('Since ∂_u and ∂_v are
#   future directed'): after a reversal of the orientation fixed by ∂_u + ∂_v future directed (:706,
#   :752), ∂_u and ∂_v are past directed, so the reduction uses a time-orientation-reversing isometry of
#   M_max, e.g. (u, v, ω) ↦ (−u, −v, ω), which preserves H (uv < const) and g_max. Unstated: an implicit
#   step, harmless; the same at :485 for M_Mink. In ETT the reversal is C.dual and every hypothesis of
#   the skeleton is two-sided (dual_causallyArcConnectedOn, dual_futureOneConnectedOn,
#   dual_locallyStronglyCausal, dual_hasChronalNeighbour), so layer 1 has no gap.
# * §4.1, :721: the maps (u, v, ω) ↦ (t_A, r, ω) are said to preserve the time orientation for
#   A ∈ {I, IV} (onto M_ext) and A ∈ {II, III} (onto M_int). They reverse it for A = IV and A = III:
#   along a future curve u and v increase (:706), so t_IV = 2m log(−v/u) (:718) decreases while ∂_t
#   is future on M_ext (:654), and r increases on III while −∂_r is future on M_int (:664). A slip,
#   harmless where it is used (:809, 'since both regions are isometric'): the swap (u, v, ω) ↦ (v, u, ω)
#   carries IV onto I and keeps uv, du⊗dv + dv⊗du and ∂_u + ∂_v. §4.1 has no ledger row (the model is
#   T-loc-schwarzschild-model's); recorded on schwthm:MainThm, its use.
# * §1 :153–158 justifies (1.2) by the exterior's future one-connectedness ('i.e., in particular, any
#   future directed timelike curve in M_max from γ̃(s₀) to γ̃(s) is homotopic to γ̃|[s₀,s]'). The 'i.e.'
#   needs every future timelike curve of M_max between two points of region I to stay in region I
#   (region I causally convex in M_max): true, since u and v increase along it (:800) and
