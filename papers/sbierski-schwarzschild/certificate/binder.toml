by = ["T-loc-c0-metric-causality"]

[[bind]]
label = "schwrem:course_question_extendibility_also"
ett = ["Causal.Causality", "Causal.LocalCausality", "Causal.Causality.exists_leaving_of_local"]
localisation = []
note = "Rem 2.16 (:413–421). (1) Extendibility matters for non-smooth M too: the ETT layer asks no metric of M at all, so its theorems apply to any causality. (2) Time-orientability of M̃ is not more general (the time-orientable double cover, O'Neill 7.17): an ETT spacetime is time-oriented by construction (a causality chooses ≪), so ETT's M̃ is time-oriented; the double-cover lift is cited Lorentzian geometry (reading R3, header). Only data near ∂ι(M) is used by the local form exists_leaving_of_local, though still of a causality on M̃ (Causal.LocalCausality is the notion on one open). (3) Hawking–Ellis local extensions (Beem's objection): no ETT content."

[[bind]]
