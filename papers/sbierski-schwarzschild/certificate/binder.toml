note = "Def 2.14 (:390–392) and the sentence after it (:393): A and B are timelike separated by K iff every timelike curve from A to B meets K; for K closed, iff I^±(A, M ∖ K) ∩ B = ∅. In Lean, sorry-free, ETT layer (Causal.SchwCausalLemmas, T-abs-schw-causal-lemmas, 873469e): Causal.Causality.ChronallySeparatedOn W K A B (every chronal curve of C or of C.dual of the open W over [0, 1] from A to B meets K; 'timelike curve' read as future or past directed, which Defs 2.1–2.2 force), ChronallySeparated = On ⊤; the reformulation schw_def_2_14_iff (K closed, C causally arc-connected) and chronallySeparatedOn_iff_of_isClosed (any open W). The '⇐' needs nothing (chronallySeparatedOn_of_Iplus_Iminus: a curve avoiding K is a chronal curve of W ∖ K); the '⇒' needs causal arc-connectedness (the row's localisation) and fails without it (Causal.allRelated_chronallySeparated_not_iff). Invariant under time reversal, symmetric, monotone (Thm 4.11 Step 1.5 passes from K to U ⊇ closure K). Used in Thm 4.11 Steps 1.3.1, 1.5 on M_int (:1772, :1813), hence the schwarzschild entry."
