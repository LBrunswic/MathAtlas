#   W = ι(region I) itself (exitDiamonds_of_curve), where it is not needed; the same remark covers Thm
#   4.9's reduction to Thm 4.10 (:809).
# * §1 and Thm 3.1 use opposite sign conventions for s₀ (§1: the vertex γ̃(s₀), s₀ < s < 0, :146, :153;
#   Thm 3.1 Step 1.2: s₀ ∈ (0, ε), the vertex γ̃(−s₀), :528, :621): notational.
# * :589 (Thm 3.1 Step 2.2) writes γ(1) = (Δ, 0, …, 0) for λ(1), the curve of that step being λ: a typo.

