note = "Def 2.15 (:403–411): a C^k-extension is a smooth isometric embedding ι : M ↪ M̃ of the same dimension onto a proper subset (connected manifolds, so ∂ι(M) ≠ ∅, footnote :406). ETT: an open embedding with proper range (all Lemma 2.17 uses of ι: IsOpenEmbedding, range ι ≠ univ; same dimension ⇒ open image is invariance of domain, layer 3) which is causally an isomorphism onto the open ι(M) (the isometry: Causal.ChartIso along ι, Causal/GXStructure.lean:82), so that M's causality is the restriction of M̃'s to ι(M) (Rem 2.3). T-abs-c0-extension-skeleton fixes the notion. Proving that a C⁰ isometric embedding is such a map is the C0 model's."
[[bind.geometric]]
