[[bind]]
label = "schwdef:extension"
ett = ["Causal.Causality.exists_leaving_of_isOpenEmbedding", "Causal.ChartIso", "Causal.IsSpacetimeExtension", "Causal.IsSpacetimeExtension.rel_top_iff", "Causal.IsSpacetimeExtension.image_Iplus_inter_Iminus", "Causal.IsSpacetimeExtension.dual"]
localisation = []
note = "Def 2.15 (:403–411): a C^k-extension is a smooth isometric embedding ι : M ↪ M̃ of the same dimension onto a proper subset (connected manifolds, so ∂ι(M) ≠ ∅, footnote :406). ETT: an open embedding with proper range (all Lemma 2.17 uses of ι: IsOpenEmbedding, range ι ≠ univ; same dimension ⇒ open image is invariance of domain, layer 3) which is causally an isomorphism onto the open ι(M) (the isometry: Causal.ChartIso along ι, Causal/GXStructure.lean:86), so that M's causality is the restriction of M̃'s to ι(M) (Rem 2.3). The notion is Causal.IsSpacetimeExtension CN C ι (Causal.C0ExtensionSkeleton, T-abs-c0-extension-skeleton, 1faaa160): ι an open embedding with range ι ≠ M̃ which is a Causal.ChartIso along ι, [Nonempty N] (a manifold is non-empty, footnote :406); N's relations on every open are M̃'s on its image (rel_top_iff; the diamonds, image_Iplus_inter_Iminus), and it is invariant under time reversal (dual). Readings taken, disclosed in the module: M̃ is time-oriented (R3, OQ-115); N's connectedness (Sbierski's tacit convention, :401) is not asked, only M̃ preconnected being used (Lemma 2.17); smoothness, the isometry and the dimension enter only through openness and the causality. Whether the notion should carry more (an IsEMorphism field, N connected) is the closer's question 1, proposed as an OQ by the planner. Proving that a C⁰ isometric embedding is such a map is the C0 model's."
[[bind.geometric]]
model = "C0"
proves = []
by = ["T-loc-c0-metric-causality"]

[[bind]]
label = "schwrem:course_question_extendibility_also"
ett = ["Causal.Causality", "Causal.LocalCausality", "Causal.Causality.exists_leaving_of_local"]
localisation = []
note = "Rem 2.16 (:413–421). (1) Extendibility matters for non-smooth M too: the ETT layer asks no metric of M at all, so its theorems apply to any causality. (2) Time-orientability of M̃ is not more general (the time-orientable double cover, O'Neill 7.17): an ETT spacetime is time-oriented by construction (a causality chooses ≪), so ETT's M̃ is time-oriented; the double-cover lift is cited Lorentzian geometry (reading R3, header). Only data near ∂ι(M) is used by the local form exists_leaving_of_local, though still of a causality on M̃ (Causal.LocalCausality is the notion on one open). (3) Hawking–Ellis local extensions (Beem's objection): no ETT content."

[[bind]]
label = "schwlem:ExtensionLemma"
ett = ["Causal.Causality.exists_leaving_of_isOpenEmbedding", "Causal.Causality.exists_leaving_of_hasChronalNeighbourEverywhere", "Causal.Causality.exists_leaving_of_isOpenEmbedding_of_chronalNeighbours", "Causal.Causality.futureBoundary_union_pastBoundary_nonempty_iff"]
localisation = ["has_chronal_neighbour", "chronal_neighbour_at_boundary", "causally_arc_connected"]
note = "Lemma 2.17 (:425–440), locating the extension; DEC-159 (OQ-51). Layer 1 in Lean, ETT layer, sorry-free: Causal.Causality.exists_leaving_of_isOpenEmbedding (Causal/LocateExtension.lean:418; the ladder's consequence at causally_arc_connected, programme/ladder.toml, the boundary form) takes M̃ connected ([PreconnectedSpace M]) and causally arc-connected, ι an open embedding of a non-empty space with range ι ≠ M̃, and HasChronalNeighbour at every frontier point of ι(N) (an edge hypothesis, DEC-159), and gives a chronal curve of C or C.dual in ι(N) on [0, 1) ending on ∂ι(N), chronal in the spacetime ι(N) on every [0, s], s < 1. That edge hypothesis is the ladder's [[edge_hypothesis]] chronal_neighbour_at_boundary (T-lad-edge-hypotheses; the row cites it beside the node since T-bind-edge-hypotheses, 2026-11-27). The node has_chronal_neighbour (Causal.Causality.HasChronalNeighbourEverywhere) gives it at every point, which is how each model entry proves it: exists_leaving_of_hasChronalNeighbourEverywhere (Causal/ChronalNeighbourBridge.lean:269, the ladder's consequence at has_chronal_neighbour ∧ causally_arc_connected); with chronal_neighbours, exists_leaving_of_isOpenEmbedding_of_chronalNeighbours (:293). Sharp: one frontier point with a chronal neighbour is necessary and sufficient (futureBoundary_union_pastBoundary_nonempty_iff, LocateExtension.lean:354), and without it the lemma is false (Causal.not_exists_leaving_bare, :648: the isolated line, causally arc-connected, causally open and plain; by Causal.isolatedLine_separates also globally hyperbolic, causally compact and strongly causal, so no global causality condition replaces the hypothesis). Both localisation properties are of the EXTENSION M̃ (header): Sbierski's proof uses connectedness of M̃, openness of ι(M) and of I^± (an ETT axiom), and 'Let q̃ ∈ I⁻(p̃, Ũ)' (:431), i.e. a chronal neighbour at p̃, on one side. ETT is more general (header, findings): one-sided (BTZ points, Causal.closedHalfLine_oneSided, exists_leaving_of_frontier_subset_Zplus), local (exists_leaving_of_local), only ι(M) open used. Layer 3 per ambient class: C0 is Sbierski's (any C^k, k ∈ ℕ); smooth-vacuum the C^∞ case, and schwarzschild as an ambient of its own regions (M_ext ↪ M_max, M_int ↪ M_max, the classical extensions; T-loc-schwarzschild-model); minkowski and E_alpha in Lean; E_0 and flat-gx through T-loc-e0-has-chronal-neighbour's lemma for every SingularFlatAxioms causality (Causal.Causality.SingularFlatAxioms.hasChronalNeighbourEverywhere, from the field mem_Zplus; the E₀ instance Causal.E0.hasChronalNeighbourEverywhere; Causal.Model.E0ChronalNeighbour, 524cc76; at a BTZ point the future disjunct only). The inextensibility of the leaving curve in ι(N), which the lemma does not address, is Causal.Causality.futureInextensible_of_leaving on a Hausdorff M̃ (T-abs-schw-causal-lemmas)."
