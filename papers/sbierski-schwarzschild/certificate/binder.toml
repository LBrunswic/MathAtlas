localisation = ["has_chronal_neighbour", "causally_arc_connected"]
note = "Lemma 2.17 (:425–440), locating the extension; DEC-159 (OQ-51). Layer 1 in Lean, ETT layer, sorry-free: Causal.Causality.exists_leaving_of_isOpenEmbedding (Causal/LocateExtension.lean:418; the ladder's consequence at causally_arc_connected, programme/ladder.toml, the boundary form) takes M̃ connected ([PreconnectedSpace M]) and causally arc-connected, ι an open embedding of a non-empty space with range ι ≠ M̃, and HasChronalNeighbour at every frontier point of ι(N) (an edge hypothesis, DEC-159), and gives a chronal curve of C or C.dual in ι(N) on [0, 1) ending on ∂ι(N), chronal in the spacetime ι(N) on every [0, s], s < 1. The node has_chronal_neighbour (Causal.Causality.HasChronalNeighbourEverywhere) gives the edge hypothesis at every point: exists_leaving_of_hasChronalNeighbourEverywhere (Causal/ChronalNeighbourBridge.lean:257, the ladder's consequence at has_chronal_neighbour ∧ causally_arc_connected); with chronal_neighbours, exists_leaving_of_isOpenEmbedding_of_chronalNeighbours (:281). Sharp: one frontier point with a chronal neighbour is necessary and sufficient (futureBoundary_union_pastBoundary_nonempty_iff, LocateExtension.lean:354), and without it the lemma is false (Causal.not_exists_leaving_bare, :648: the isolated line, causally arc-connected, causally open and plain). Both localisation properties are of the EXTENSION M̃ (header): Sbierski's proof uses connectedness of M̃, openness of ι(M) and of I^± (an ETT axiom), and 'Let q̃ ∈ I⁻(p̃, Ũ)' (:431), i.e. a chronal neighbour at p̃, on one side. ETT is more general (header, findings): one-sided (BTZ points, Causal.closedHalfLine_oneSided, exists_leaving_of_frontier_subset_Zplus), local (exists_leaving_of_local), only ι(M) open used. Layer 3 per ambient class: C0 is Sbierski's (any C^k, k ∈ ℕ); smooth-vacuum the C^∞ case, and schwarzschild as an ambient of its own regions (M_ext ↪ M_max, M_int ↪ M_max, the classical extensions; T-loc-schwarzschild-model); minkowski and E_alpha in Lean; E_0 and flat-gx through T-loc-e0-has-chronal-neighbour's lemma for every SingularFlatAxioms causality (Causal.Causality.SingularFlatAxioms.hasChronalNeighbourEverywhere, from the field mem_Zplus; the E₀ instance Causal.E0.hasChronalNeighbourEverywhere; Causal.Model.E0ChronalNeighbour, 524cc76; at a BTZ point the future disjunct only). The inextensibility of the leaving curve in ι(N), which the lemma does not address, is Causal.Causality.futureInextensible_of_leaving on a Hausdorff M̃ (T-abs-schw-causal-lemmas)."
