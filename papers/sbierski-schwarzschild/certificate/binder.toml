localisation = []
note = "Def 2.13 (:380–386): timelike homotopy with fixed endpoints; future one-connected. In Lean, sorry-free, ETT layer (Causal.TimelikeHomotopy, T-abs-timelike-homotopy, 9448424), timelike curves read as chronal curves: Causal.Causality.ChronalHomotopyOn W Γ γ₀ γ₁ (Γ continuous on [0, 1]², each Γ(t, ·) a future chronal curve of the open W over [0, 1] with fixed endpoints), ChronallyHomotopicOn, FutureOneConnectedOn W and FutureOneConnected (W = ⊤). An equivalence on chronal curves (chronallyHomotopicOn_equivalence); two-sided (dual_futureOneConnectedOn); invariant under causal isomorphisms and charts (IsCausalIso.futureOneConnectedOn_iff, ChartIso.futureOneConnectedOn_iff); it reads ≪ only (futureOneConnectedOn_congr_lt), the layer-1 content of the conformal invariance Sbierski notes (:845). Witness: the timelike line, future one-connected on every open set, non-trivially (Causal.timelikeLine_futureOneConnectedOn, timelikeLine_chronallyHomotopicOn_sq). Proposed anchor for the curation (T-cur-schw-layer1): FutureOneConnectedOn, partial, unmarked: under the C0 model the chronal curves contain Sbierski's piecewise smooth timelike curves, so the two notions of future one-connectedness are incomparable without a layer-3 comparison (header; the module's SCOPE). The node future_one_connected is its ⊤ form (T-lad-future-one-connected-node, f92836fe), independent of every other causality node: the spatially compact flat cylinder ℤe₁\\𝐌^{1+1} has all of them and is not future one-connected, two chronal curves winding differently (Causal.Flat.spaceCylinder_not_futureOneConnected, Causal.Flat.spaceCylinder_separates; T-abs-not-future-one-connected, bdce0bdd; the bridge to Mathlib, Causal.Causality.ChronalHomotopyOn.homotopicRel), and the chronology-free witnesses of Causal.FutureOneConnectedVacuous have it with none of the others. Consumed by step (3): Causal.Causality.Iplus_inter_Iminus_eq_inf_of_futureOneConnectedOn and FutureOneConnectedOn.chronalCurveOn_inf_of_closure_subset (Causal.DiamondConfinement, T-abs-diamond-confinement); proved of Minkowski (Thm 3.1 Step 2.1: Causal.minkowski_futureOneConnected, for every n and on every convex open, T-loc-minkowski-future-one-connected, 3247324f), the Schwarzschild exterior (Prop 4.12) and interior (Prop 6.5)."

[[bind]]
label = "schwdef:timelike_separated_set"
ett = ["Causal.Causality.ChronallySeparatedOn", "Causal.Causality.ChronallySeparated", "Causal.Causality.schw_def_2_14_iff", "Causal.Causality.chronallySeparatedOn_iff_of_isClosed", "Causal.Causality.chronallySeparatedOn_of_Iplus_Iminus", "Causal.Causality.dual_chronallySeparatedOn", "Causal.Causality.ChronallySeparatedOn.symm", "Causal.Causality.ChronallySeparatedOn.mono"]
