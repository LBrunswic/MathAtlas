ett = ["Causal.Causality.IsCauchySurface", "Causal.Causality.IsCauchySurfaceOn", "Causal.Causality.GloballyHyperbolic"]
localisation = []
note = "Def 2.12 (:369–377): a smooth embedded hypersurface met exactly once by every inextendible TIMELIKE curve; GH := one exists. ETT: IsCauchySurface counts inextensible CAUSAL curves (DEC-14, Causal/Cauchy.lean:67–74) and GloballyHyperbolic is causal + compact diamonds (Causal/Properties.lean:144), linked by Geroch's theorem (Causal.Causality.geroch_ii_imp_iii, IsCauchyTimeFunction.isCauchySurface). Reading R2 (header), not taken: for a spacelike C¹ Σ every ETT Cauchy surface is a Sbierski one, so a sup over ETT's class (Def 5.1) is at most Sbierski's; the layer-3 targets (§5–6) use Sbierski's notion verbatim, and for smooth metrics the two agree on spacelike hypersurfaces. Sbierski's uses: the hypersurfaces {r = r₀} of M_int (§6, :1453) and the Cauchy hypersurfaces of Def 5.1."

[[bind]]
label = "schwdef:timelike_homotopic_fixed_endpoints"
ett = ["Causal.Causality.ChronalHomotopyOn", "Causal.Causality.ChronallyHomotopicOn", "Causal.Causality.FutureOneConnectedOn", "Causal.Causality.FutureOneConnected", "Causal.Causality.chronallyHomotopicOn_equivalence", "Causal.Causality.dual_futureOneConnectedOn", "Causal.IsCausalIso.futureOneConnectedOn_iff", "Causal.ChartIso.futureOneConnectedOn_iff", "Causal.Causality.futureOneConnectedOn_congr_lt"]
localisation = []
note = "Def 2.13 (:380–386): timelike homotopy with fixed endpoints; future one-connected. In Lean, sorry-free, ETT layer (Causal.TimelikeHomotopy, T-abs-timelike-homotopy, 9448424), timelike curves read as chronal curves: Causal.Causality.ChronalHomotopyOn W Γ γ₀ γ₁ (Γ continuous on [0, 1]², each Γ(t, ·) a future chronal curve of the open W over [0, 1] with fixed endpoints), ChronallyHomotopicOn, FutureOneConnectedOn W and FutureOneConnected (W = ⊤). An equivalence on chronal curves (chronallyHomotopicOn_equivalence); two-sided (dual_futureOneConnectedOn); invariant under causal isomorphisms and charts (IsCausalIso.futureOneConnectedOn_iff, ChartIso.futureOneConnectedOn_iff); it reads ≪ only (futureOneConnectedOn_congr_lt), the layer-1 content of the conformal invariance Sbierski notes (:845). Witness: the timelike line, future one-connected on every open set, non-trivially (Causal.timelikeLine_futureOneConnectedOn, timelikeLine_chronallyHomotopicOn_sq). Proposed anchor for the curation (T-cur-schw-layer1): FutureOneConnectedOn, partial, unmarked: under the C0 model the chronal curves contain Sbierski's piecewise smooth timelike curves, so the two notions of future one-connectedness are incomparable without a layer-3 comparison (header; the module's SCOPE). The node future_one_connected is T-lad-future-one-connected-node's ([[proposed]] above). Consumed by step (3) (T-abs-diamond-confinement); proved of Minkowski (Thm 3.1 Step 2.1, T-loc-minkowski-future-one-connected), the Schwarzschild exterior (Prop 4.12) and interior (Prop 6.5)."

[[bind]]
label = "schwdef:timelike_separated_set"
ett = ["Causal.Causality.ChronallySeparatedOn", "Causal.Causality.ChronallySeparated", "Causal.Causality.schw_def_2_14_iff", "Causal.Causality.chronallySeparatedOn_iff_of_isClosed", "Causal.Causality.chronallySeparatedOn_of_Iplus_Iminus", "Causal.Causality.dual_chronallySeparatedOn", "Causal.Causality.ChronallySeparatedOn.symm", "Causal.Causality.ChronallySeparatedOn.mono"]
localisation = ["causally_arc_connected"]
note = "Def 2.14 (:390–392) and the sentence after it (:393): A and B are timelike separated by K iff every timelike curve from A to B meets K; for K closed, iff I^±(A, M ∖ K) ∩ B = ∅. In Lean, sorry-free, ETT layer (Causal.SchwCausalLemmas, T-abs-schw-causal-lemmas, 873469e): Causal.Causality.ChronallySeparatedOn W K A B (every chronal curve of C or of C.dual of the open W over [0, 1] from A to B meets K; 'timelike curve' read as future or past directed, which Defs 2.1–2.2 force), ChronallySeparated = On ⊤; the reformulation schw_def_2_14_iff (K closed, C causally arc-connected) and chronallySeparatedOn_iff_of_isClosed (any open W). The '⇐' needs nothing (chronallySeparatedOn_of_Iplus_Iminus: a curve avoiding K is a chronal curve of W ∖ K); the '⇒' needs causal arc-connectedness (the row's localisation) and fails without it (Causal.allRelated_chronallySeparated_not_iff). Invariant under time reversal, symmetric, monotone (Thm 4.11 Step 1.5 passes from K to U ⊇ closure K). Used in Thm 4.11 Steps 1.3.1, 1.5 on M_int (:1772, :1813), hence the schwarzschild entry."
[[bind.geometric]]
model = "schwarzschild"
proves = ["causally_arc_connected"]
by = ["T-loc-schwarzschild-model"]

# ------------------------------------------------------------------ §2.3 extensions
[[bind]]
label = "schwdef:extension"
ett = ["Causal.Causality.exists_leaving_of_isOpenEmbedding", "Causal.ChartIso", "T-abs-c0-extension-skeleton"]
