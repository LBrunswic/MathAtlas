blocked_on = "OQ-42 (d) (T_A does not extend continuously at −1/3; the corrected form extends to A₂ ∖ {−1/3}), OQ-42 (c) (the f_A half under the halve-the-even reading), OQ-42 (a)/(b) (integrality and 2 ≠ 0, both used for A₂ ≅ ℤ₂)"
notes = "T-syr-completion (atlas-team, 2026-11-21), audit AUDIT-1 minor (printed_T_extends_false asked agreement at −1/3's junk value; fixed at graduation to agreement where T_A is defined). Proved sorry-free in Syracuse/Completion.lean: for 2 ≠ 0, toZ2 : A → ℤ₂ is the unique ring hom, injective (Krull), with dense image, and UniformSpace.Completion A ≃ ℤ₂ as rings and uniform spaces (completion_ringEquiv, l.52 for integral A with 2 ≠ 0); f_{A₂} the unique continuous extension of f_A; T_{A₂} the unique continuous extension of T_A off −1/3 (ring_both_continuous_extends, ring_both_continuous_extends_padicInt). The printed T half is refuted (printed_T_extends_false, at A = ℤ)."
paper_findings = ["syracuse.tex:58 — 'T_A … extends continuously to A_2' is false. Take A = Z, where T_Z is the paper's map on all of 2Z+1 (3x+1 ≠ 0 always). No g : Z_2 → Z_2 is continuous on 2Z_2+1 and agrees with T_Z on the odd integers (Syracuse.T_int_not_extends). The printed statement, quantified over all Z/2Z-rings with 2 ≠ 0, is refuted (Syracuse.printed_T_extends_false). In every Z/2Z-ring A with 2 ≠ 0, no extension of T_A to A_2 is continuous at −1/3 ∈ 2A_2+1 within 2A_2+1 (Syracuse.not_continuousWithinAt_extension_T, not_exists_continuousWithinAt_extension_T, not_exists_continuousWithinAt_extension_T_completion). The reason: the odd part of 3x+1 has no limit as x → −1/3. The integers c_j = (4^{j+1} − 1)/3 tend 2-adically to −1/3 with T(c_j) = 1, and d_j = (10·4^{j+1} − 1)/3 tend to −1/3 with T(d_j) = 5. Hence 'their extension is T_{A_2}' fails too: T_{A_2} is undefined at −1/3 (OQ-42 (d)), and no value there makes it continuous on 2A_2+1 (Syracuse.not_continuousWithinAt_T_padicInt for the junk value). Strongest true form (Syracuse.ring_both_continuous_extends): T_{A_2} is continuous on A_2 ∖ {−1/3}, extends T_A, and is the unique continuous extension of T_A : 2A+1 → 2A+1 to (2A_2+1) ∖ {−1/3}. This is the topological face of OQ-42 (d).", "syracuse.tex:58 — 'T_A is continuous' holds wherever T_A is defined. T is continuous at every x with 3x+1 ≠ 0, in every Z/2Z-ring, Z/2Z included (Syracuse.continuousAt_T, continuousOn_T). For y − x ∈ 2^{n+k+1}A with k = ν_2(3x+1), one has T y − T x = 3(y − x)/2^k ∈ 2^{n+1}A. When 3 ∉ A^×, as in Z, T is continuous on all of A, hence on 2A+1 as printed (Syracuse.continuous_T_of_not_isUnit_three). When 3 ∈ A^×, as in Z_2, the printed T_A does not exist at −1/3.", "syracuse.tex:52 — 'for any Z/2Z-ring A, A_2 is naturally isomorphic to Z_2' is false for A = Z/2Z. Its completion has 2 = 0 for every uniform ring structure, so it is not isomorphic to Z_2 (Syracuse.completion_zmod2_not_padicInt; for the 2-adic structure, completion_zmod2_twoAdic_not_padicInt). It holds for every other Z/2Z-ring, i.e. whenever 2 ≠ 0 (Syracuse.completion_ringEquiv, completion_twoAdic). The proof: every x is an integer modulo 2^nA, so Z/2^nZ ≅ A/2^nA (Syracuse.zmodEquivQuotient). The limit is a ring hom ι : A → Z_2 (Syracuse.toZ2). It is injective by Krull, preserves ν_2 and |·|, has dense image, and induces the 2-adic topology, so (Z_2, ι) is a completion of A (Syracuse.completionPkg). The resulting A_2 ≅ Z_2 is a ring isomorphism and a uniform isomorphism extending ι. 'Naturally' is proved in two ways: ι is the only ring hom A → Z_2 (Syracuse.toZ2_unique, toZ2_comp), and the isomorphism is the only ring isomorphism A_2 ≅ Z_2 (Syracuse.ringEquiv_padicInt_unique). The paper prints no proof ('one can show').", "syracuse.tex:50–52 (evidence for OQ-42 (a)) — under the printed definition of l.52 (noetherian, A/2A ≅ Z/2Z, no integrality), the l.52 claim fails even with 2 ≠ 0. ZMod 4 is noetherian, has A/2A ≅ Z/2Z and 2 ≠ 0, and is not a domain. Its completion has 4 = 0 for every uniform ring structure, so it is not Z_2 (Syracuse.zmod4_witness). Integrality, which l.50 states but l.52 omits, is therefore load-bearing.", "syracuse.tex:58 — the f_A half holds in the halve-the-even reading of OQ-42 (c) (the printed f_A does not exist, T-syr-base). f_A is continuous in every Z/2Z-ring (Syracuse.continuous_f). For 2 ≠ 0, f_{A_2} is continuous, extends f_A, and is its only continuous extension (Syracuse.continuous_f_completion, f_coe_completion, eq_f_completion_of_continuous; in Z_2 the same via ι: continuous_f_padicInt, f_toZ2, eq_f_of_continuous). The proof is left to the reader (l.57); none is printed."]
