[[row]]
label = "def:ring_define"
extra_lean_files = ["Syracuse/Valuation.lean", "Syracuse/Base.lean"]
decls = ["Syracuse.IsZ2Ring", "Syracuse.nu2", "Syracuse.v2", "Syracuse.divPow2", "Syracuse.f", "Syracuse.T", "Syracuse.nu2_eq_coe_iff", "Syracuse.IsZ2Ring.exists_isGreatest", "Syracuse.IsZ2Ring.nu2_eq_top_iff", "Syracuse.two_mul_f_of_two_dvd", "Syracuse.f_of_not_two_dvd", "Syracuse.f_eq_of_two_mul", "Syracuse.pow_v2_mul_T", "Syracuse.T_odd", "Syracuse.T_unique", "Syracuse.nu2_three_mul_add_one", "Syracuse.three_mul_add_one_ne_zero", "Syracuse.printed_f_not_definable", "Syracuse.T_undefined_of_isUnit_three", "Syracuse.T_undefined_padicInt"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-42 (the readings of the printed definitions; a corrected form is marked only once ruled)"
notes = "T-syr-base (atlas-team, 2026-11-20), audits AUDIT-1 major (an accidental bold mark on lem:base, fixed in round 1) and AUDIT-2 clean. Partial: a finding on the printed text; the strongest true form is proved, unmarked."
paper_findings = ["syracuse.tex:55 — the two cases of f_A are swapped: as printed f_A(x) = 3x+1 for x ∈ 2A and x/2 for x ∉ 2A, but x/2 does not exist for x ∉ 2A, so no such map exists in any Z/2Z-ring (Syracuse.printed_f_not_definable, at x = 1). The formalized f halves on 2A and sends x ↦ 3x+1 off 2A, as in the integer definition l.46–48.", "syracuse.tex:55 — T_A(x) = (3x+1)/2^{nu_2(3x+1)} is undefined at x0 = -1/3 whenever 3 is a unit of A (Z_2 = the 2-adic integers, also Z/2Z; Z_(2) and Z[1/3] are further examples, not formalized here): x0 ∈ 2A+1, 3x0+1 = 0, {n | 0 ∈ 2^n A} has no max, and (when 2 ≠ 0) no odd t and k ∈ N satisfy 2^k t = 3x0+1 (Syracuse.T_undefined_of_isUnit_three; in Z_2: Syracuse.T_undefined_padicInt). It is the only defect: 3x+1 = 0 forces 3 ∈ A^× (Syracuse.three_mul_add_one_ne_zero), so over Z every point is good. Where 3x+1 ≠ 0, T x is odd, 2^{nu_2(3x+1)} T x = 3x+1, and it is the unique such odd element (T_odd, pow_v2_mul_T, T_unique).", "syracuse.tex:50 — 'in such a ring, 2 ≠ 0' is false for A = Z/2Z itself, which is integral, noetherian and has A/2A = A ≅ Z/2Z (Syracuse.instIsZ2RingZMod2, Syracuse.two_eq_zero_zmod2). It is the only exception: in a Z/2Z-ring, 2 = 0 iff A ≅ Z/2Z (Syracuse.IsZ2Ring.two_eq_zero_iff). There halves are not unique; and if 'such a ring' in the last sentence of l.50 means any Z/2Z-ring (it may mean only the rings named just before it, which have characteristic 0), '4 ≠ 0' fails for Z/2Z too; with 2 ≠ 0 the ring has characteristic 0 (Syracuse.IsZ2Ring.charZero_of_two_ne_zero). The claim A_2 ≅ Z_2 (l.52) also fails for Z/2Z (not formalized here; it belongs to T-syr-rep)."]

