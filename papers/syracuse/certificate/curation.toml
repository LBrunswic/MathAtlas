paper_findings = ["syracuse.tex:277 — false as printed, for both readings of OQ-43. The exponent a_i + ⋯ + a_{i+k−1} has one term too many. For every a : ℤ → ℕ, A'_{i+1} − A'_i = Σ_{k=1}^{n−1} 3^{n−1−k} 2^{a_{i+1}+⋯+a_{i+k−1}} (2^{a_{i+k}} − 2^{a_i}) (Syracuse.DeltaAlt_eq), no periodicity needed. For n-periodic a the printed A_u^n gives Δ_i = 3Δ'_i, i.e. the same sum with 3^{n−k} (Delta_eq_three_mul, Delta_eq). The printed right-hand side equals 2^{a_i}·Δ'_i (deltaPrinted_eq), and 3 times it equals 2^{a_i}·Δ_i (three_mul_deltaPrinted). So it is off by the factor 2^{a_i} for the OQ-43 reading and by 2^{a_i}/3 for the printed A_u^n, and it equals either difference only where Δ'_i = 0. It fails at every i ∈ ℤ for every periodic a ∈ (ℕ*)^ℤ of minimal period n ≥ 2 (deltaPrinted_ne_of_minimal). It holds on fixed points, where both sides are 0 (deltaPrinted_period_one). Witness: the cycle (−5, −7), a = (1, 2), i = 0, where Δ_0 = 6, Δ'_0 = 2 and the printed side is 4 (syracuse_cycle_n_printed_false). This confirms the planner's [r] numerics.", "syracuse.tex:280 — the case a_i = 1 inherits the error. The true form is Δ'_i = Σ_{k ∈ ⟦1, n−1⟧, i+k ∈ 𝒟} 3^{n−1−k} 2^{a_{i+1}+⋯+a_{i+k−1}} (2^{a_{i+k}} − 2) (Syracuse.DeltaAlt_eq_asc), and the same with 3^{n−k} for Δ_i (Delta_eq_asc). The printed side equals 2Δ'_i (deltaPrintedAsc_eq). It is refuted at the cycle (−5, −7), i = 0 (a_0 = 1), for both readings of OQ-43 and both readings of 'k ∈ 𝒟' (syracuse_cycle_n_asc_printed_false).", "syracuse.tex:275–281 — the lemma has no proof in the draft (ledger nl_status 'open'); the proofs here are new."]

[[row]]
label = "lem:syracuse_cycle"
extra_lean_files = ["Syracuse/UpperBounds.lean"]
