bucket = "B"
blocked_on = "T-syr-2026-import (DEC-182, DEC-193; theo:mr, theo:matveev as named externals or proofs); OQ-76 (c); OQ-63 (a); OQ-43"
notes = "T-syr-cited-steps (atlas-team, 2026-11-21), audit AUDIT-1 minor (wording; fixed at graduation). Unmarked, partial: the paper's own steps with the cited inputs as hypotheses (CitedStepsMR, CitedStepsMatveev; Props, never axioms). Finitely many 𝒫-cycles over ℤ from theo:mr (property_defined_cycles_gcd_mr_aun, _mr_alt; both readings of OQ-43, any index convention), the effective clause as an explicit bound and a computable candidate list (_mr_effective_*), and on positive cycles from theo:matveev (_matveev*). citedStepsMatveev_iff_noCircuitMatveev: one Matveev Prop for this file and NoCircuit.lean. Not vacuous: (−17, 7) and (1, 1) among the finite sets."
paper_findings = ["syracuse.tex:156–159 (theo:matveev), as used at l.302 and l.326 (« the corollary to Matveev Theorem »). As printed, theo:matveev assumes 2^a > 3^b, so it bounds |2^{p_n} − 3^n| only on positive cycles: on a cycle, 2^{p_n} − 3^n has the sign of x (two_pow_p_sub_three_pow_mul_pos). Over ℤ the corollary needs a bound for both signs, which theo:mr's form (l.145–148) gives. The corollary is proved over ℤ from theo:mr (property_defined_cycles_gcd_mr, _mr_aun, _mr_alt), and for the positive cycles from theo:matveev (property_defined_cycles_gcd_matveev, _aun, _alt). This bears on OQ-63 (a) and on § 3's negative cycles (−5, −7) and −17.", "syracuse.tex:162: the GCD enters only through |2^{p_n} − 3^n|. On a cycle, that number divides every A_u^n and every A'^n_u, u ∈ ℤ, in every index convention (citedSteps_dvd_Aun), so it is at most either GCD (citedSteps_abs_le_gcd). For OQ-43's reading the GCD equals it (corGcdAlt_of_cycle). For the printed A_u^n the GCD is larger: 278 against 139 at −17 (citedSteps_gcd_instances). The corollary holds with the weaker hypothesis |2^{p_n} − 3^n| ≪ 2^{|Γ|(1−ε)}.", "syracuse.tex:166–168: every step of the proof holds, and each is a theorem. First, n ≤ |Γ| (citedSteps_le_p). Second, |Γ| is bounded explicitly, through exp t ≥ t^{d+1}/(d+1)!: from theo:matveev, |Γ| ≤ C e^d (d+1)!/(ε log 2)^{d+1} (citedSteps_le_of_lower, citedSteps_le_of_matveev). From theo:mr, |Γ| ≤ max(2 log₂(2C)/ε, 2^800 log(3)^25 δ^25) with δ = max(1, 2/(ε log 2)) (citedSteps_le_of_mr). Third, a ranges over ⟦1, |Γ|⟧^n. Fourth, there is at most one cycle per a, because lem:base gives x(2^{p_n} − 3^n) = Σ_k 2^{p_k} 3^{n−1−k} (citedSteps_mul_eq_rhs, citedSteps_cycle_unique). Together: every cycle with p_n ≤ B lies in a computable Finset (mem_citedStepsCandidates), which the kernel evaluates on small B (citedStepsCandidates_decide). The proof does not say what bounds |Γ|; it is the cited lower bound printed just before (l.145–159), and l.190 says so in prose.", "syracuse.tex:164, l.167: « effective » holds in principle, not in practice. theo:mr's conclusion is elementary for a < 2^775 (citedStepsMR_of_lt); the bound it gives on |Γ| exceeds 2^800, since it contains the term 2^800·log(3)^25·δ^25. theo:matveev's inequality is elementary for a ≤ d = 3.5·10^6 (citedStepsMatveev_of_le), and the bound it gives involves (d+1)!. The determination is a finite computation that cannot be carried out by the enumeration of l.167.", "syracuse.tex:161–162, non-vacuity. With P = « two descending indices per period », the bound of T-syr-two-descents is the corollary's hypothesis (twoDesc_corollary_hyp, ε₀ ≈ 0.104, C = 2). So from theo:mr only finitely many cycles of ℤ qualify, and (−17, 7) is one (citedSteps_twoDesc_finite, citedSteps_twoDesc_neg_seventeen). With P = « one descending index per period », the bound of T-syr-steiner is the hypothesis on positive cycles (steiner_corollary_hypothesis). So from theo:matveev only finitely many positive cycles qualify, and (1, 1) is one (citedSteps_steiner_finite, citedSteps_steiner_one). TwoDescMatveev B, the hypothesis of theo_syracuse_cycle_of_cited, follows from either cited bound at an explicit B (citedSteps_twoDescMatveev_of_matveev, citedSteps_twoDescMatveev_of_mr)."]

[[row]]
label = "prop:proposition"
extra_lean_files = ["Syracuse/CitedSteps.lean"]
decls = ["Syracuse.CitedStepsCheck", "Syracuse.CitedStepsCycleCheck", "Syracuse.citedStepsAlpha", "Syracuse.citedSteps_logb_lt", "Syracuse.citedStepsAlpha_gt", "Syracuse.citedStepsOnes", "Syracuse.citedStepsOnes_eq_range", "Syracuse.citedSteps_two_mul_le", "Syracuse.prop_proposition_neg", "Syracuse.prop_proposition_min", "Syracuse.citedSteps_eq_one_of_iterate", "Syracuse.prop_proposition_pos_of_ge", "Syracuse.citedStepsCycleCheck_of_check", "Syracuse.prop_proposition_ne_one", "Syracuse.prop_proposition_of_cycleCheck", "Syracuse.prop_proposition_of_check", "Syracuse.prop_proposition_instances", "Syracuse.prop_proposition_unbounded_false"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "T-syr-2026-import (DEC-182, DEC-193; the computer check of l.201); OQ-54 (c); OQ-63 (a)"
notes = "T-syr-cited-steps (atlas-team, 2026-11-21), audit AUDIT-1 minor. Unmarked, partial: for x < 0 unconditional (prop_proposition_neg, no check and no |x| > 1000; counts 1, 1, 1, 5 at −1, −5, −7, −17); for x > 0 from the check carried as CitedStepsCheck (prop_proposition_of_check, the printed statement; prop_proposition_ne_one, x ≠ 1 suffices, strict). α > 0.415037499 by the kernel check 3^{79335} < 2^{125743} (citedStepsAlpha_gt)."
paper_findings = ["syracuse.tex:194–199: for x < 0 the statement holds unconditionally, with no computer check and no |x| > 1000: #{a_i = 1} > (2 − log₂3) n > α n (prop_proposition_neg). On a negative cycle 2^{p_n} < 3^n, so p_n < n log₂3, and p_n ≥ a + 2(n − a) (citedSteps_two_mul_le). This confirms the planner's [r]. At −1, at −5 and −7 (the two points of (−5, −7)) and at −17 the counts are 1, 1, 1 and 5, each above α n (prop_proposition_instances).", "syracuse.tex:201: the inference « |x| > 10^{10} » holds only for x > 0. The tested « conjecture » is false over the negative integers (the cycles (−1), (−5, −7), (−17, …)), so the check says nothing about negative cycles. The gap is harmless, by the previous finding.", "syracuse.tex:201–204: two slips in the proof, both harmless. First, it cites cor:bounds, which is false as printed (OQ-54 (c)). The true form gives #{a_i = 1} ≥ n(2 − log₂3 − log₂(1 + 1/(3 min))) on every cycle of ℤ* (prop_proposition_min). Second, l.202 and l.204 write log, which is the natural logarithm elsewhere in the paper (l.114), where cor:bounds has log₂. Once every point exceeds 10^{10}, log₂(1 + 1/(3·10^{10})) < 10^{−10} (prop_proposition_pos_of_ge), so the conclusion stands for x > 0, given the check (prop_proposition_of_check). The printed log₂(1 + 1/|x|) would not close the step (log₂(1 + 10^{−10}) ≈ 1.44·10^{−10} > 10^{−10}); the natural log or the true form's 1/(3 min) does.", "syracuse.tex:195: given the check, the hypothesis |x| > 1000 can be weakened to x ≠ 1, and the inequality becomes strict (prop_proposition_ne_one). It cannot be dropped: at the cycle (1) the count is 0 < α (prop_proposition_unbounded_false). No known cycle of ℤ has |x| > 1000, so the printed hypothesis is met by no known cycle.", "syracuse.tex:197: α = 2 − log₂3 − 10^{−10} > 0.415037499 holds (citedStepsAlpha_gt), from 3^{79335} < 2^{125743} checked by decide in the kernel (citedSteps_logb_lt; 125743/79335 is a convergent of log₂3 from above). The margin is about 1.8·10^{−10}."]
