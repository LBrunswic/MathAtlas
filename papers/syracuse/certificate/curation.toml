paper_findings = ["syracuse.tex:88–90 — false as printed on 2A_2+1 = 2Z_2+1: x0 = -1/3 is odd but not in the image of the printed inverse φ^{-1} (Syracuse.neg_inv3_not_mem_image), nor is any y_k = -(2^k+3)/9, k ≥ 1, which satisfies T(y_k) = -1/3 with ν_2(3y_k+1) = k (Syracuse.neg_third_preimage). Hence no map φ from 2Z_2+1 to {p | p_0 = 0, p ↗↗} has the printed φ^{-1} as a left inverse, whatever values are given to the undefined p_n on the backward orbit of -1/3 (Syracuse.rep_printed_false). Strongest true form proved (Syracuse.theo_rep): φ: x ↦ (p_n(x)) is a bijection from RepDomain (odd x whose T-orbit avoids -1/3) onto the strictly increasing sequences from 0, its inverse is the printed formula, and the image of the formula is exactly RepDomain (Syracuse.repInv_image). This is the theorem-level form of OQ-42 (d).", "syracuse.tex:92–95 — the proof establishes only φ^{-1} ∘ φ = id (x = -(1/3)Σ 2^{p_k(x)}/3^k, i.e. injectivity of φ); that every strictly increasing p with p_0 = 0 is some φ(x) (surjectivity, and that the printed formula lands in the domain) is not argued. It is proved here: S(q) = Σ 2^{q_n}/3^n satisfies S(q) = 1 + (1/3)2^{q_1}S(q') with q'_n = q_{n+1} - q_1 (Syracuse.repSeries_eq), so 3φ^{-1}(q)+1 = 2^{q_1}φ^{-1}(q') with φ^{-1}(q') odd, whence T(φ^{-1}q) = φ^{-1}q' and a_0(φ^{-1}q) = q_1 (Syracuse.T_repInv) and p_n(φ^{-1}q) = q_n (Syracuse.rep_repInv). The proof's displayed identity (l.93) also writes x ∈ 2A+1 where 2A_2+1 is meant, and holds only on orbits avoiding -1/3."]

