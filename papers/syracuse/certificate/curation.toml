notes = "T-syr-upper-bounds (atlas-team, 2026-11-21), audit AUDIT-1 clean. The implication proved as printed, for both readings of OQ-43, under the ∼_S reading (syracuse_cycle, syracuse_cycle_alt); the « m = GCD(A_i) = 2^{p_n} − 3^n » clause refuted as an assertion (gcd_AunAlt_printed_false, gcd_Aun_ne_of_cycle). Unmarked: ∼_S is undefined (kb/0006)."
paper_findings = ["syracuse.tex:286 — the implication holds, for both readings of OQ-43, on every n-periodic sequence: no cycle is needed. For periodic a, 2^{a_u} A'_{u+1} = 3A'_u + 2^P − 3^n, where P = Σ_{t<n} a_t (Syracuse.two_pow_mul_AunAlt_succ; on a cycle this is 2^{p_n} − 3^n times 2^{a_u} x_{u+1} = 3x_u + 1). Hence a_i = a_{i+1} = b gives 3Δ'_i = 2^b Δ'_{i+1} and 3Δ_i = 2^b Δ_{i+1} (three_mul_DeltaAlt_of_eq, three_mul_Delta_of_eq). With b = 1, Δ_i = (2/3)Δ_{i+1} and 2/3 = 2^1 3^{−1} ∈ S (syracuse_cycle_alt, syracuse_cycle). This confirms the planner's [r] '3Δ_i = 2Δ_{i+1}', for both readings.", "syracuse.tex:284 — 'm = GCD(A_i : i ∈ Z) = 2^{p_n} − 3^n' is false as printed. For the OQ-43 reading it holds up to sign on every cycle of Z: d divides every A'_u (u ∈ ℤ) iff d divides 2^{p_n(x)} − 3^n (Syracuse.dvd_iff_dvd_AunAlt_of_cycle). Normalized, the GCD over one period is |2^{p_n(x)} − 3^n| (gcd_AunAlt_of_cycle). That is the printed value for x > 0 (gcd_AunAlt_of_pos) and is refuted at the cycle (−1), where 2 − 3 = −1 (gcd_AunAlt_printed_false), as for prop:have_gcd_n__l_k (OQ-63 (a)). For the printed A_u^n every A_i = 2^{a_i} A'_{i+1} is even (Aun_eq_two_pow_mul, two_dvd_Aun), while 2^{p_n} − 3^n is odd. So the claim fails on every cycle of Z, signed, normalized and up to sign (gcd_Aun_ne_of_cycle, not_dvd_iff_dvd_Aun_of_cycle). This is OQ-43's observation, proved.", "syracuse.tex:286 — '∼_S' is not defined in the paper; it is also used at l.301, l.318 and l.320.", "syracuse.tex:283–287 — the lemma has no proof in the draft; the proof here is new."]

