blocked_on = "T-syr-2026-import (DEC-182, DEC-193; Matveev's theorem); OQ-76 (a), (b); OQ-63 (a), (d); the unfinished conclusion"
notes = "T-syr-no-circuit (atlas-team, 2026-11-21), audit AUDIT-1 major (noCircuit_of_cited was a tautology, ∃ B after K), fixed in one round; AUDIT-2 clean. Unmarked, partial: the statement is NoCircuitStatement K (K the known cycles, a parameter), not proved. Every step of the proof in its true form, Syracuse/NoCircuit.lean: the 3-adic step (l.225–229, as printed for Aun, 3^{q−1} for AunAlt), the corrected identity of l.232–234, the sharp bound 3·2ⁿ·|A_{q+i} − A_{q+i+1}| ≤ 2·3ⁿ(2^{p_n} − 2ⁿ) (attained at (−5, −7)), the true l.244 under NoCircuitMatveev C (a hypothesis, never an axiom), and for ε > log₃(3/2) a bound on the least period of every ε-circuit (noCircuit_period_bounded; noCircuit_of_cited, B before K). Not vacuous: (−5, −7), and −17, a 4/7-circuit."
paper_findings = ["syracuse.tex:221–247 — the proof does not reach the statement. It stops at l.244, an inequality that bounds n. Two things are missing: a bound of l.235 with η < ε, and a check of every smaller n. What the steps give in their true form is proved, with Matveev's theorem as a hypothesis. On every cycle of ℤ of least period n ≥ 2 with a run of q ≥ 1 ascending indices, 3^{q+1} 2ⁿ ≤ 2·3ⁿ (e p_n)^C (Syracuse.noCircuit_l244). That is 3^{n(ε − log₃(3/2))} ≤ 2(2en)^C for q ≥ εn − 1 (noCircuit_l244_eps). So for ε > log₃(3/2) ≈ 0.369, one B bounds the least period of every ε-circuit of ℤ (noCircuit_period_bounded; noCircuit_period_bounded_pos for x > 0 from theo:matveev's shape). The statement for that ε thus reduces to the ε-circuits of least period ≤ B. noCircuit_of_cited states this reduction with the bound as its first conjunct. Its earlier form, ∃ B, (check up to B) → statement, was a tautology, provable for every ε and K with no hypothesis; the audit caught it, and it is not to be reintroduced. For 10⁻¹⁴ ≤ ε ≤ log₃(3/2) the inequality holds for every n and bounds nothing (noCircuit_l244_eps_vacuous). The statement is recorded as the Prop NoCircuitStatement K and not proved.", "syracuse.tex:222, 227 — the step needs n ≥ 2. « since i ≠ i+1 and n is a minimal period, A_{p+i} − A_{p+i+1} ≠ 0 » is false at n = 1, where i ≡ i + 1. The fixed point (−1) is an ε-circuit for every ε, has runs of every length, and A_{q+i} − A_{q+i+1} = 0 (noCircuit_step_period_one_false). For n ≥ 2 the step holds for both readings of OQ-43 (noCircuit_diff_ne_zero, from the strict Aun_sub_ne_zero_of_minimal).", "syracuse.tex:227–229 — the step is true for the printed A_u^n. On a cycle of ℤ of least period n ≥ 2, with a_{i+k} = 1 on ⟦1, q⟧, 3^q (2^{p_n} − 3ⁿ) divides A_{q+i} − A_{q+i+1} ≠ 0. So 3^q |2^{p_n} − 3ⁿ| ≤ |A_{q+i} − A_{q+i+1}|, and l.229 holds as printed (noCircuit_step). The run gives the agreement a_{i+k} = a_{i+1+k} on ⟦1, q−1⟧ that the strict three_pow_dvd_Aun_sub needs. 2^{p_n} − 3ⁿ divides every A_u (noCircuit_dvd_Aun) and is prime to 3.", "syracuse.tex:227 — « divisible by 3^p » fails for OQ-43's A'. At the cycle of −17, with i = 6 and q = 3 (the run a_7 = a_8 = a_9 = 1), A'_9 − A'_{10} = −2502 = −2·3²·139, and 27 ∤ −2502 (noCircuit_alt_three_pow_false). What holds is 3^{q−1}(2^{p_n} − 3ⁿ) ∣ A'_{q+i} − A'_{q+i+1} (noCircuit_step_alt). This is another conjunct in favour of the printed A_u^n (OQ-43).", "syracuse.tex:232–234 — the display is false as printed, in both index readings and both readings of OQ-43. The true identity, for n-periodic a with a_{i+k} = 1 on ⟦1, q⟧ and 1 ≤ q ≤ n, is A_{q+i} − A_{q+i+1} = 3^q Σ_{m=1}^{n−q} 3^{n−q−m} 2^{a_{q+i+1}+⋯+a_{q+i+m−1}} (2 − 2^{a_{q+i+m}}) (noCircuit_diff_eq). For A' it holds with 3(A'_{q+i} − A'_{q+i+1}) on the left (noCircuit_diff_eq_alt). The printed sum stops at n − 1 − p with 3^{n−1−p−k}, so it misses the term m = n − p, which can be nonzero: at −17 with i = 6, p = 3 it is −224 of the total −278. It is not the largest in general: at −17 with i = 3, p = 2 the terms are (−1134, 0, 0, 0, −256), and when the run extends to the left (a_i = 1) the term is 0, since then a_{p+i+(n−p)} = a_i = 1. At −17 (i = 6, p = 3), 3^{−3}(A_9 − A_{10}) = −278 and 3^{−3}(A'_9 − A'_{10}) = −2502/27. The display is −110 with the literal indices and −18 with the summation index restored (noCircuit_display_printed_false). The step 2^{a_{p+i}} = 2 at l.234 is correct (a_{p+i} is the last term of the run).", "syracuse.tex:235–236 — the bound is an unproved step. Signed, as printed, the chain bounds a negative number: A_{q+i} − A_{q+i+1} < 0 (noCircuit_upper), so l.235–236 hold trivially. l.229 needs them in absolute value. There, what follows from the identity and a ≥ 1 is 3·2ⁿ |A_{q+i} − A_{q+i+1}| ≤ 2·3ⁿ (2^{p_n} − 2ⁿ), that is 3^{−q}|…| ≤ 2·3^{n−q−1}(2^{p_n−n} − 1) (noCircuit_abs_diff_le). From a ≥ 1 and Σa alone this is sharp (noCircuitSum_bound_sharp), and it is attained at the cycle (−5, −7) (noCircuit_bound_sharp_seq12). l.235 holds under the partial-sum bound 2^{a_{p+i+1}+⋯+a_{p+i+m}} ≤ (3+η)^m, which the stray display l.253 writes (noCircuit_l235_of_eta). That hypothesis holds at −17 with η = 1 (noCircuit_l235_nonvacuous_seq17), but nothing in the draft proves it.", "syracuse.tex:236 — the second inequality is false for small η. If 2 log 3 (3^η − 1) < 1, then for all large n and every p ≤ εn, 3^{n−p}(3^{nη} − 1)/(3^η − 1) > 2 log 3 · 3^{(1−ε+η)n} (noCircuit_l236_false). The true form has 1/(3^η − 1) in place of 2 log 3. With the natural log, which the Lean statement uses, the condition is η < 0.341. It is η < 0.652 with log₁₀ (the base the constant of l.241 matches) and η < 0.250 with log₂ (the base l.243 needs). The draft's log is not consistent, so the number depends on the reading, but the failure for small η holds in every base. l.244 needs η < ε, so for ε below the threshold (0.341, 0.652 or 0.250) the printed chain cannot run.", "syracuse.tex:239–244 — under the partial-sum bound of l.253, with x > 0, the proof's p ≥ εn, and theo:matveev's shape as a hypothesis, l.244 holds in the form 3^{n(ε−η)}(3^η − 1) < (e p_n)^C (noCircuit_l244_of_eta). The printed form has 2(log(3+η) n)^{3.7·10⁸} on the right, with no factor 3^η − 1. The passage from (e p_n)^C to 3.7·10⁸ is not derived.", "syracuse.tex:243 — « p_n ≤ n log(3+η) » is false with the natural logarithm, which the draft uses elsewhere (l.114–124, l.146). On every cycle of x > 0 and for 0 ≤ η ≤ 1, n log(3 + η) < p_n (noCircuit_l243_natural_log_false), since p_n > n log₂ 3. The log of l.243 must be log₂, as in l.253. « 2^{p_n} ≥ 3ⁿ » (l.243) holds only for x > 0 (OQ-63 (a)); the true l.244 does not need it.", "syracuse.tex:241 — the constant: ½ e 2^{4.5} 30⁵ log 3 > 7·10⁸ with the natural logarithm, more than the exponent 3.7·10⁸ of l.244. The printed ≃ 3.6·10⁸ is the value with log₁₀ 3, which lies in (3.5·10⁸, 3.6·10⁸) (noCircuit_matveev_constant). theo:matveev has d = 3.5·10⁶ at l.158. Here C is a parameter, so none of these is used.", "syracuse.tex:219 — « the known ones » is not defined. Read as the cycle (1, 4, 2) of the abstract (l.42), the statement is false: the fixed point (−1) is an ε-circuit for every ε (strict isCircuit_neg_one; noCircuitStatement_false_of_neg_one, for every K without −1). The cycle (−5, −7) is an ε-circuit for ε ≤ 1 (isCircuit_neg_five) and that of −17 for ε ≤ 4/7 (noCircuit_isCircuit_neg_seventeen; 3/7 in the proof's reading). With the printed p ≥ εn − 1, the statement implies that every cycle of ℤ of period n ≤ 10¹⁴ is a known one (noCircuitStatement_period_le, by p = 0).", "syracuse.tex:251–257 — the stray display after the proof is not part of it and is not formalized. Its first line is 0 as printed: the two exponents Σ_{j=0}^{k−1} a_{p+j}(y) coincide. Its left side is nonzero (noCircuit_diff_ne_zero).", "syracuse.tex:221–247 — the true identity, the bound, the threshold log₃(3/2) and the finiteness are not in the draft; the proofs here are new."]

