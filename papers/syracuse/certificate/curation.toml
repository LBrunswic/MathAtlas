notes = "T-syr-steiner (atlas-team, 2026-11-21), audit AUDIT-1 minor (wording, fixed at graduation). Unmarked, partial: the paper's own steps proved in Syracuse/Steiner.lean, the cited inputs untouched and never stated as externals. The exact reduction steiner_reduction (y(2^{n+α} − 3^n) = 3^n − 2^n, 2^{n+α} − 3^n ∣ 2^α − 1) and its converse steiner_cycle_of_dvd make the positive statement equivalent to theo:steiner (l.150) and to SteinerArithStmt (named Props, not anchors without T-syr-cited's ruling). Proved outright for n = 1 and, by a kernel decide check, for periods n ≤ 100: the cycles of ℤ with one descending index per period are (1) and (−5, −7) (steinerTwo_int_of_le, steinerTwo_pos_of_le). The bound the corollary consumes: steiner_gcd_bound, both readings of OQ-43."
paper_findings = ["syracuse.tex:295 — '#𝒟_Γ = 1' read literally is never satisfied. 𝒟_Γ ⊆ ℤ is n-periodic, so it is empty or infinite (Syracuse.encard_descIdx_ne_one), and the literal statement holds vacuously (steinerTwoLiteral_vacuous). The count is per period, as the proof's 'Assume 𝒟 = nℤ' (l.298) and the '#(𝒟_Γ ∩ ⟦1, n⟧)' of theo:syracuse_cycle (l.306) read it.", "syracuse.tex:294–295 — false over ℤ in the per-period reading (the literal one holds vacuously, finding above). The cycle (−5, −7) has a = (1, 2), so one descending index per period, and 1 is not a term (Syracuse.steinerTwo_neg_five, steinerTwo_printed_false). It holds for n = 1 over ℤ (steinerTwo_period_one). For n ≤ 100, the n-cycles of ℤ with one descending index per period are exactly (1) and (−5, −7) (steinerTwo_int_of_le, both sides checked in the kernel), and the positive ones are (1) only (steinerTwo_pos_of_le).", "syracuse.tex:150 against 294 — the planner's (c), confirmed in Lean. theo:steiner (cited, l.150) and theo:steiner_2 on positive cycles are the same statement (Syracuse.steiner_iff_steinerTwoPos). theo:steiner's '∀ k < n, p_k(x) = k' is a_0 = ⋯ = a_{n−2} = 1 at the point after the descending index (steiner_point, p_eq_self_of_a_eq_one). Both are equivalent to the arithmetic statement 'n ≥ 1, 3^n < 2^{n+e}, 2^{n+e} − 3^n ∣ 2^e − 1 ⇒ n = e = 1' (SteinerArithStmt, steinerTwoPos_iff_arith). The reduction is exact: every solution with e ≥ 1 is an n-cycle of the required shape (steiner_cycle_of_dvd). So the paper proves at l.294–303, through the corollary to Matveev's theorem, the result it cites at l.150.", "syracuse.tex:298–301 — the exact reduction behind the proof (the planner's (3)). With y the point after the descending index and α = a_{n−1}(y) − 1: p_n = n + α, y(2^{n+α} − 3^n) = 3^n − 2^n (lem:base) and 2^{n+α} − 3^n ∣ 2^α − 1, for either sign (Syracuse.steiner_reduction). For y > 0 also α ≥ 1 and 3^n < 2^{n+α} ≤ 3^n + 2^α − 1 < 2·3^n (steiner_reduction_pos, steiner_cycle_pos).", "syracuse.tex:298 — 'm = A_0 ∧ Δ_{−1}'. For every n-periodic α ≥ 1 with 𝒟 ⊆ nℤ, the common divisors of A_0 and Δ_{−1} are those of all the A_u, for both readings of OQ-43 (Syracuse.steiner_gcd_alt_iff, steiner_gcd_aun_iff). On a cycle, the OQ-43 reading gives A'_0 ∧ Δ'_{−1} = |2^{p_n} − 3^n|, which is the printed m for x > 0, in both index conventions (steiner_m_cycle, steiner_m_cycle_shift). For the printed A_u^n, A_0 ∧ Δ_{−1} = GCD(A_u) = 2|2^{p_n} − 3^n| when n ≥ 2 (gcd_Aun_of_cycle_of_asc), so never 2^{p_n} − 3^n. In that reading m is even and does not divide the odd 2^α − 1. The proof's implicit step from 'Δ ∼_S 2^α − 1' to m ∣ 2^α − 1 needs m prime to 6, which holds only in the OQ-43 reading (2^{p_n} − 3^n is odd and prime to 3). The bound of l.302 holds in both readings, up to a factor 2.", "syracuse.tex:299 — the planner's (a), confirmed. 'α = a_0 − 1 = ½(|a(Γ)| − n)' has a spurious ½. |a(Γ)| = n + α (Syracuse.steiner_sum_eq), so α = |a(Γ)| − n, as l.302 itself writes it. The printed identity fails whenever a_0 > 1 (steiner_alpha_half_false), e.g. at the cycle (1): α = 1 against ½.", "syracuse.tex:301 — 'Δ_1 ∼_S 2^α − 1' holds exactly for n ≥ 2, for both readings of OQ-43, at i = 1 as printed and at i = −1 (the index of l.298). Δ'_1 = 2^{n−1}(2^α − 1), Δ_1 = 3·2^{n−1}(2^α − 1), Δ'_{−1} = 2·3^{n−2}(2^α − 1), Δ_{−1} = 2·3^{n−1}(2^α − 1) (Syracuse.steiner_delta, steiner_delta_sEquiv). It fails for n = 1, at the cycle (1) itself: there every Δ_i = 0, while 2^α − 1 = 1 (steiner_delta_period_one_false). The conclusion m ∣ 2^α − 1 still holds there, by lem:base.", "syracuse.tex:302 — the planner's (b), confirmed. '2^{|Γ|−n} ≤ 2^{|Γ|(1−log₃2)}' (|Γ| = p_n) is equivalent to 2^{p_n} ≤ 3^n. On a cycle of ℤ it holds iff the cycle is negative, so it is reversed on every positive cycle (Syracuse.steiner_printed_bound_iff). The form that holds, from 2^{p_n} < 2·3^n: 2^α < 2^{log₃2}·2^{|Γ|(1−log₃2)} (steiner_bound). The corollary's '≪' absorbs the constant.", "syracuse.tex:162, 302 — the hypothesis of the corollary to Matveev's theorem is proved for 𝒫(Γ) = 'Γ positive with one descending index per period', with ε = log₃2 and an explicit constant, for both readings of OQ-43. GCD(A'_u) = 2^{p_n} − 3^n ≤ 2^α − 1 < 2^{log₃2}·2^{|Γ|(1−ε)}, and GCD(A_u) ≤ 2^{α+1} (Syracuse.steiner_gcd_bound). In the corollary's form, ∃ ε ∈ (0, 1), ∃ C, with C = 2^{1+log₃2} (steiner_corollary_hypothesis).", "syracuse.tex:302, 'with the aid of a computer' — the check runs in the kernel (decide) for n ≤ 100. On the positive side the only solution is (n, α) = (1, 1), i.e. x = 1. On the negative side it is (2, 1), i.e. x = −5 (Syracuse.steinerArith_check_pos, steinerArith_check_neg). This confirms the planner's [r] numerics in that range. They were re-run, not as a proof, for n < 400, with the same two solutions."]

