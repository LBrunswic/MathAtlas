paper_findings = ["syracuse.tex:271 — 'a_i := T^i(x_0)' is a misprint for a_i = a_i(x_0) = ν₂(3T^i(x_0)+1). Read literally, 𝒜_Γ = {i | x_i = 1} and 𝒟_Γ = {i | x_i > 1}. On the cycle (−1) both are empty, though a_i(−1) = 1 for every i (Syracuse.literal_neg_one). On the cycle (1) every index is literally 'ascending', though a_i(1) = 2, so every index is descending (Syracuse.literal_one). Read as a_i(x_0), the two sets partition ℤ on every cycle of ℤ (ascIdx_union_descIdx, disjoint_ascIdx_descIdx, one_le_of_cycle). The names fit this reading: for odd y > 0, a_0(y) = 1 iff y < T(y) (a_zero_eq_one_iff_lt_T)."]

