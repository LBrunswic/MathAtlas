decls = ["Syracuse.noCircuit_alpha_minimal", "Syracuse.noCircuit_run_lt", "Syracuse.noCircuit_three_pow_dvd", "Syracuse.noCircuit_dvd_Aun", "Syracuse.noCircuit_diff_ne_zero", "Syracuse.noCircuit_step", "Syracuse.noCircuit_step_alt", "Syracuse.noCircuit_alt_three_pow_false", "Syracuse.noCircuit_step_period_one_false", "Syracuse.noCircuitSum", "Syracuse.noCircuitSum_succ", "Syracuse.noCircuitSum_nonpos", "Syracuse.noCircuitSum_bound", "Syracuse.noCircuitSum_bound_sharp", "Syracuse.noCircuit_window_sum", "Syracuse.noCircuit_diff_eq", "Syracuse.noCircuit_diff_eq_alt", "Syracuse.noCircuit_abs_diff_le", "Syracuse.noCircuit_upper", "Syracuse.NoCircuitMatveev", "Syracuse.NoCircuitMatveevAbs", "Syracuse.NoCircuitMatveevAbs.matveev", "Syracuse.noCircuit_l244_of_lower", "Syracuse.noCircuit_l244", "Syracuse.noCircuit_l244_pos", "Syracuse.noCircuit_l244_eps", "Syracuse.noCircuit_l244_eps_vacuous", "Syracuse.noCircuit_eventually", "Syracuse.noCircuit_period_bounded_of", "Syracuse.noCircuit_period_bounded", "Syracuse.noCircuit_period_bounded_pos", "Syracuse.noCircuitKnown", "Syracuse.NoCircuitStatement", "Syracuse.noCircuit_isCircuit_of_le", "Syracuse.noCircuitStatement_iff", "Syracuse.noCircuitStatement_period_le", "Syracuse.noCircuitStatement_false_of_neg_one", "Syracuse.noCircuit_of_cited", "Syracuse.noCircuit_isCircuit_neg_seventeen", "Syracuse.noCircuit_nonvacuous_seq17", "Syracuse.noCircuit_nonvacuous_seq12", "Syracuse.noCircuit_bound_sharp_seq12", "Syracuse.noCircuitDisplayLit", "Syracuse.noCircuitDisplay", "Syracuse.noCircuit_display_printed_false", "Syracuse.noCircuit_matveev_constant", "Syracuse.noCircuit_l243_natural_log_false", "Syracuse.noCircuit_l235_of_eta", "Syracuse.noCircuit_l235_nonvacuous_seq17", "Syracuse.noCircuit_l236_false", "Syracuse.noCircuit_l244_of_eta"]
