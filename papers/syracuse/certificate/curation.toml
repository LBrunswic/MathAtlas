decls = ["Syracuse.citedStepsD", "Syracuse.CitedStepsMatveev", "Syracuse.CitedStepsMR", "Syracuse.citedStepsMatveev_of_le", "Syracuse.citedStepsMR_of_lt", "Syracuse.citedSteps_periodic_ext", "Syracuse.citedSteps_gcd_dvd", "Syracuse.citedSteps_dvd_Aun", "Syracuse.citedSteps_abs_le_gcd", "Syracuse.citedStepsRhs", "Syracuse.citedStepsExt", "Syracuse.citedStepsCandidates", "Syracuse.citedSteps_mul_eq_rhs", "Syracuse.citedSteps_cycle_unique", "Syracuse.citedSteps_le_p", "Syracuse.mem_citedStepsCandidates", "Syracuse.citedSteps_finite_of_le", "Syracuse.citedStepsCandidates_decide", "Syracuse.citedStepsCandidates_neg_seventeen", "Syracuse.citedSteps_le_of_lower", "Syracuse.citedStepsBoundMatveev", "Syracuse.citedStepsDelta", "Syracuse.citedStepsBoundMR", "Syracuse.citedSteps_le_of_matveev", "Syracuse.citedSteps_abs_log_le", "Syracuse.citedSteps_le_of_mr", "Syracuse.property_defined_cycles_gcd_mr_effective", "Syracuse.property_defined_cycles_gcd_mr", "Syracuse.property_defined_cycles_gcd_mr_aun", "Syracuse.property_defined_cycles_gcd_mr_alt", "Syracuse.property_defined_cycles_gcd_mr_effective_aun", "Syracuse.property_defined_cycles_gcd_mr_effective_alt", "Syracuse.property_defined_cycles_gcd_matveev_effective", "Syracuse.property_defined_cycles_gcd_matveev", "Syracuse.property_defined_cycles_gcd_matveev_aun", "Syracuse.property_defined_cycles_gcd_matveev_alt", "Syracuse.property_defined_cycles_gcd_matveev_effective_aun", "Syracuse.property_defined_cycles_gcd_matveev_effective_alt", "Syracuse.citedSteps_aPer_neg_seventeen", "Syracuse.citedSteps_twoDesc_finite", "Syracuse.citedSteps_twoDesc_neg_seventeen", "Syracuse.citedSteps_twoDescMatveev_of_matveev", "Syracuse.citedSteps_twoDescMatveev_of_mr", "Syracuse.citedSteps_steiner_finite", "Syracuse.citedSteps_steiner_one", "Syracuse.citedSteps_gcd_instances"]
