notes = "T-syr-cycle-gcd (atlas-team, 2026-11-21), audit AUDIT-1 clean. True forms proved sorry-free in Syracuse/CycleGcd.lean, the printed forms stated with Lean refutations; unmarked."
paper_findings = ["syracuse.tex:171–174 — false for every cycle of x < 0. On every cycle of Z the GCD of the n sums is |2^{p_n(x)} − 3^n| (Syracuse.have_gcd), and 2^{p_n(x)} − 3^n has the sign of x, since (2^{p_n(x)} − 3^n)·x = Σ_{k<n} 2^{p_k(x)} 3^{n−1−k} > 0 by lem:base (Syracuse.two_pow_p_sub_three_pow_mul_pos). So the printed equality holds iff x > 0 (have_gcd_of_pos), and for x < 0 the GCD is 3^n − 2^{p_n(x)} (have_gcd_of_neg). The printed statement is refuted at the cycle (−1), n = 1, where 2^1 − 3 = −1 < 0 ≤ GCD (have_gcd_printed_false). The same cycle refutes it in the index convention of l.71 (have_gcd_printed_false_shift). Read up to sign ('a GCD') it holds on every cycle (have_gcd_associated). This confirms the planner's [r] numerics (GCD 1, 1, 1, 139 on the cycles of 1, −1, −5, −17, against 2^{p_n} − 3^n = 1, −1, −1, −139).", "syracuse.tex:62 against 71, 75, 178 — two index conventions for a_i. def:ring_define_2 (l.62) sets a_0(x) = ν₂(3x+1), while the proof of lem:base writes a_1(x) = p_1(x) for it (l.71, l.75). In the convention of l.62 the display of l.178 is off by one: the l-th sum is (2^{p_n(x)} − 3^n)·T^{l+1}(x) for every l ∈ N, in every commutative ring (Syracuse.gcdSum_cycle), and as printed (with T^l(x)) it fails at l = 0 on every cycle that is not a fixed point (gcdSum_ne_display), e.g. the cycle (−5, −7), where the 0-th sum is 7 = (−1)(−7), not (−1)(−5) = 5 (gcd_display_printed_false). In the convention of l.71 (β_{k+1} = a_k(x)) the display holds as printed (gcdSum_cycle_shift). The Bézout step of l.186 holds as printed in both conventions, with a_1(x) read in the same convention (gcd_bezout: a_1(x) = ν₂(3T(x)+1); gcd_bezout_shift: β_1 = a_0(x) = ν₂(3x+1)). The statement is the same in both: the n sums are the same set up to a cyclic shift (have_gcd, have_gcd_shift).", "syracuse.tex:173 — the l-th sum is the OQ-43 sum A'^n_{l+1} = Σ_{k<n} 3^k Π_{i=0}^{n−2−k} 2^{a_{l+1+i}} (Syracuse.gcdSum_eq_AunAlt): the exponent p_n(x) − Σ_{i=l−k}^{l} a_i(x) is the sum of a over the other n − 1 − k terms of the period, never negative. With the printed A_u^n of def:define_n__n_ the sums would be (2^{p_n} − 3^n)(3T^u(x)+1) (Syracuse.Aun_cast_of_cycle), whose GCD is at least 2|2^{p_n} − 3^n|: this proposition's sums side with the OQ-43 reading."]

