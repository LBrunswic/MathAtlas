notes = "T-syr-upper-bounds (atlas-team, 2026-11-21), audit AUDIT-1 clean. With m = GCD(A_i) proved for every periodic sequence at every base point, for both readings of OQ-43 (intertwined_alt, intertwined_aun, corGcd_eq_gcd_Aun); with m = 2^{p_n} − 3^n refuted (intertwined_printed_false) and proved up to sign for OQ-43's reading (corGcdAlt_of_cycle). Unmarked. Roadmap [r] numerics checked in Lean (four_cycles): on the cycles of 1, −1, −5, −17, 2^{p_n} − 3^n = 1, −1, −1, −139; the corollary's GCD is 1, 1, 1, 139 (OQ-43 reading) and 4, 2, 2, 278 (printed A_u^n); the planner's « 2m for Aun » fails at the cycle (1) (four_cycles_two_m_false)."
paper_findings = ["syracuse.tex:290 — 'intertwined' is not defined and is not needed. For every n-periodic a ∈ (ℕ*)^ℤ, n ≥ 1, and every base point c ∈ ℤ, d divides A_c and every Δ_{i−1} with i ∈ 𝒟 iff d divides every A_u, for both readings of OQ-43 (Syracuse.intertwined_alt, intertwined_aun). So A_c ∧ ⋀_{i∈𝒟} Δ_{i−1} = GCD(A_i : i ∈ ℤ) always (corGcd_eq_gcd_Aun for the printed A_u^n). The case 𝒟 = nℤ used in the proof of theo:steiner_2 (l.298) is included. The proof (none is printed) uses X_u = A'_u and δ = 2^P − 3^n, with 2^{a_u} X_{u+1} = 3X_u + δ. An ascending step has the fixed point −δ, so d ∣ X_c together with the first i ∈ 𝒟 after c forces d ∣ δ (dvd_delta_of_intertwined). For the printed A_u^n, the odd part goes through A_u = 2^{a_u} A'_{u+1} (odd_dvd_Aun_of_intertwined), and the 2-part through ν₂(A_u) = a_u (not_four_dvd_of_intertwined).", "syracuse.tex:291 — false as printed with m = 2^{p_n} − 3^n, for both readings of OQ-43. For the OQ-43 reading, on every cycle of Z the corollary's GCD is |2^{p_n(x)} − 3^n| (Syracuse.corGcdAlt_of_cycle; universal property intertwined_alt_cycle). That is m for x > 0 (corGcdAlt_of_pos) and −m for x < 0 (corGcdAlt_of_neg). For the printed A_u^n it is GCD(A_i), which is even, while m is odd (corGcd_eq_gcd_Aun, gcd_Aun_ne_of_cycle). Witness: the cycle (−5, −7), where 𝒜 = 2ℤ and 𝒟 = 2ℤ + 1 alternate (ascIdx_descIdx_seq12), m = −1, and the GCD is 1 for the OQ-43 reading and 2 for the printed one. The refutation holds for every reading of 'intertwined' that admits this pattern (intertwined_printed_false).", "syracuse.tex:289–292 — the corollary has no proof in the draft; the proofs here are new."]
