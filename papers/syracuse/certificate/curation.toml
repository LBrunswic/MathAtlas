paper_findings = ["syracuse.tex:142 — false as printed: at x = 1, n = 1 (min = max = 1, p_1(1) = 2) it asks log_2 2 = 1 ≤ 2 − log_2 3 ≈ 0.415 (Syracuse.bounds_printed_false). More: its lower bound log_2(1 + 1/min) fails on every positive cycle (Syracuse.bounds_printed_lower_false), and its two bounds are in decreasing order (1/min ≥ 1/max), so the printed chain could only hold on a fixed point.", "syracuse.tex:142 — the true form (no printed proof): on every cycle of Z* (either sign), p_n/n − log_2 3 = (1/n) Σ_{k<n} log_2(1 + 1/(3T^k x)) (Syracuse.cycle_mean), hence log_2(1 + 1/(3 max)) ≤ p_n/n − log_2 3 ≤ log_2(1 + 1/(3 min)) (Syracuse.bounds): the printed bounds are swapped and lack the factor 3. On a negative cycle both bounds are negative."]
