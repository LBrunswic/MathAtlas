paper_findings = ["syracuse.tex:213 — '(x)_{n∈N}' is literally the constant sequence x, x, …, which is n-periodic for every n. Read so, every integer is an ε-circuit for every ε ≤ 1, with n = 1 and p = 0 (Syracuse.isCircuitLiteral_of_le_one); 3 is one, though its orbit 3, 5, 1, 1, … is not periodic (not_isCircuit_three). The orbit (T^n(x))_n is meant, as at l.98–99 and l.107; IsCircuit reads it so.", "syracuse.tex:216 against 222 — the definition asks p ≥ εn − 1, the proof of theo:exists_no_circuit_other takes p ≥ εn. With the printed −1 every cycle is an ε-circuit as soon as εn ≤ 1 (p = 0): the fixed point (1), where a_i = 2, is an ε-circuit iff ε ≤ 1 (Syracuse.isCircuit_one_iff); the fixed point (−1) is an ε-circuit for every ε (isCircuit_neg_one); (−5, −7) is a 1-circuit (isCircuit_neg_five). For ε ≥ 0 the existential n may be taken to be the minimal period (isCircuit_iff_minimalPeriod).", "syracuse.tex:218 — 'Steinitz' is presumably Steiner (theo:steiner, l.150). The remark is commentary. The shape it describes, a point y of the cycle with a_1(y) = ⋯ = a_{n−1}(y) = 1, is a 1-circuit (Syracuse.isCircuit_one_of_run)."]

