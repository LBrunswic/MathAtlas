paper_findings = ["syracuse.tex:211 — 'A_i − A_j ≠ 0' is false without the minimal period: for a ≡ 1, n = 2, p = 1, i = 0, j = 1 every hypothesis holds and A_0 = A_1, so the printed lemma is refuted, for both readings of OQ-43 (Syracuse.periodic_exists_printed_false, periodic_exists_printed_false_alt). With n the minimal period of a it holds for both readings (Aun_sub_ne_zero_of_minimal, AunAlt_sub_ne_zero_of_minimal), with no use of the agreement or of p. The proof: A_u^n = RHS_n(Σ_{t≤k} a_{u+t})_k (Aun_cast_eq_RHS), lem:ring_maps_rhs_n_ (Syracuse.rhs_injOn_strictMono) gives a_{i+t} = a_{j+t} for t < n (agree_of_Aun_eq), hence j − i is a period (periodic_sub_of_agree). The use of the lemma in the proof of theo:exists_no_circuit_other (l.222, l.227) assumes the minimal period, as OQ-53 does for cor:ring_periodic_minimal_period.", "syracuse.tex:209 — the ν₂ conjunct is false, even for a of minimal period n: a = (1, 2, 2), n = 3, p = 1, i = 0, j = 1 satisfies every hypothesis, and ν₂(A_0 − A_1) = ν₂(74 − 116) = ν₂(−42) = 1 < 2 = a_1 (Syracuse.periodic_exists_nu2_printed_false); for the OQ-43 reading ν₂(A'_0 − A'_1) = ν₂(23 − 37) = 1 (periodic_exists_nu2_printed_false_alt). Since i = 0 the bound read as Σ_{k=1}^p a_{i+k} fails too (periodic_exists_nu2_shifted_bound_false, _alt). The bound is off by an index: an agreement a_{u+t} = a_{v+t} for t < q gives 2^{Σ_{t<q} a_{u+t} + min(a_{u+q}, a_{v+q})} ∣ A_u − A_v, for both readings and without periodicity (two_pow_dvd_Aun_sub, two_pow_dvd_AunAlt_sub). Under the printed agreement (k ∈ ⟦1, p⟧) this gives ν₂(A_{i+1} − A_{j+1}) ≥ Σ_{k=1}^p a_{i+k} (periodic_exists_nu2_shift, _alt). Under the agreement on ⟦0, p−1⟧ it gives ν₂(A_i − A_j) ≥ Σ_{k=0}^{p−1} a_{i+k} (periodic_exists_corrected, _alt). Both confirm the planner's [r] numerics.", "syracuse.tex:209 — the ν₃ conjunct holds as printed for the printed A_u^n of def:define_n__n_ (Syracuse.periodic_exists_nu3): 3^p ∣ A_{p+i} − A_{p+j} needs only a_{i+k} = a_{j+k} for k ∈ ⟦1, p−1⟧ (three_pow_dvd_Aun_sub). It fails for the OQ-43 reading: with a = (1, 2, 2), p = 1, i = 0, j = 1 (minimal period 3), A'_1 − A'_2 = 37 − 29 = 8 is prime to 3 (periodic_exists_nu3_printed_false_alt). The reason: for n-periodic a, A_u − A_v = 3(A'_u − A'_v) (Syracuse.Aun_sub_eq_three_mul, from A_u^n = 3A'^n_u + 2^{Σ_{t<n} a_{u+t}} − 3^n, Aun_eq_three_mul_AunAlt). So ν₃ drops by one in the OQ-43 reading, which needs the agreement on ⟦0, p−1⟧ (three_pow_dvd_AunAlt_sub; periodic_exists_corrected_alt). This bears on OQ-43: this conjunct favours the printed A_u^n, while prop:have_gcd_n__l_k and l.283–284 favour the OQ-43 reading.", "syracuse.tex:207–212 — the lemma has no proof in the draft (ledger nl_status 'open'); the proofs here are new."]

