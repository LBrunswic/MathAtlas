paper_findings = ["syracuse.tex:114 — the statement holds as printed (Syracuse.one_has), and in the sharper form p_n(x) log 2 − n log 3 ≤ n log(1 + 1/(3|x|)) for every x ∈ Z*, either sign (Syracuse.one_has_sharp); the hypothesis is needed only for k ≤ n (Syracuse.one_has_of_le). The proof used is the product form of lem:base, 2^{p_n(x)} T^n(x) = 3^n x Π_{k<n}(1 + 1/(3T^k(x))) (Syracuse.pow_p_mul_T_iterate_eq_prod), in place of the Grönwall step.", "syracuse.tex:119 — the displayed equation drops the factor 1/3 that dividing lem:base by 3^n produces (the right side should be (1/3) Σ_{k<n} e^{p_k log 2 − k log 3}); as printed it is false at x = 1, n = 1, where the left side is 4/3 − 1 = 1/3 and the right side is 1 (Syracuse.one_has_proof_l119_false). Harmless: dropping 1/3 only weakens the inequality of l.121.", "syracuse.tex:123 — u_k is defined as exp(log(2) p_k(x) − n log(3)); k log(3) is meant.", "syracuse.tex:124 — the bound (1 + 1/x)^n should read (1 + 1/|x|)^n, as in the statement: as printed it is false at x = −1, n = 1, which satisfies the hypothesis (T(−1) = −1) and has e^{p_1 log 2 − log 3} = 2/3 > 0 = 1 + 1/(−1) (Syracuse.one_has_proof_l124_false)."]

