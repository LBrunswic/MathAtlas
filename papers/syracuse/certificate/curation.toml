paper_findings = ["syracuse.tex:67–68 — as printed the lemma covers x0 = -1/3 when 3 ∈ A^×, where T_A(x0) and p_1(x0) do not exist; no assignment of an odd value t to T_A(x0) and of k ∈ N to p_1(x0) satisfies the n = 1 instance 2^k t - 3x0 = 1 (Syracuse.base_printed_fails_padicInt, in Z_2). The strongest true form is proved: the identity holds for every x ∈ A and n for the total maps (Syracuse.base), and on every orbit avoiding -1/3 all its terms are the paper's (Syracuse.base_of_orbit), hence for all x when 3 ∉ A^×, in particular in Z (Syracuse.base_of_not_isUnit_three).", "syracuse.tex:71 and 75 — the proof writes a_1(x) for nu_2(3x+1); by def:ring_define_2 (l.62–63) this is a_0(x) = p_1(x), and p_{n+1}(x) = a_0(x) + p_n(T_A x).", "syracuse.tex:75–77 — the last sums of the proof have shifted indices: Σ_{k=1}^{n} 2^{p_{k+1}(x)} 3^{n-1-k} should read Σ_{k=1}^{n} 2^{p_k(x)} 3^{n-k} (the exponent n-1-k is negative at k = n), and the final Σ_{k=0}^{n} 2^{p_{k+1}(x)} 3^{n-1-k} should read Σ_{k=0}^{n} 2^{p_k(x)} 3^{n-k}, the statement at n+1. The statement itself is correct."]

