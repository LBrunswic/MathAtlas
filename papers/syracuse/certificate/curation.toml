notes = "T-syr-two-descents (atlas-team, 2026-11-21), audit AUDIT-1 minor (wording, fixed at graduation). Unmarked, partial: the paper's own steps proved in Syracuse/TwoDescents.lean, both readings of OQ-43. The key identity twoDesc_key (needs no ascending index), the true two-term and ∼_S forms, and the bound twoDesc_bound / twoDesc_corollary_hyp in every configuration, the draft's unfinished case k₂ = k₁ + 1 included (twoDesc_adjacent; the wrap-around in twoDesc_abs_le). For x > 0 and n the least period the statement follows from two explicit hypotheses, TwoDescMatveev B and TwoDescCheck B (theo_syracuse_cycle_of_cited, _shift): neither is an axiom nor, without T-syr-cited's ruling, a named external; the audit found neither false nor trivialising."
paper_findings = ["syracuse.tex:306 — false over ℤ, with a_i read as a_i(x_0) (OQ-68 (a); under the literal T^i(x_0), 𝒟 is empty on this witness). The cycle −17 → −25 → −37 → −55 → −41 → −61 → −91 has least period 7 (Syracuse.twoDesc_neg_seventeen_minimal) and a = (1, 1, 1, 2, 1, 1, 4). So 𝒟 ∩ ⟦1, 7⟧ = {3, 6}, and {4, 7} in the other index convention (twoDescCount_seq17, theo_syracuse_cycle_printed_false). This bears on OQ-63 (a), the sign of the cycles, and decides nothing.", "syracuse.tex:306 — with a_i read as a_i(x_0) (OQ-68 (a)) and n any period, the statement fails also for x > 0. The cycle (1) read as a 2-cycle has a ≡ 2 and 𝒟 ∩ ⟦1, 2⟧ = {1, 2} (theo_syracuse_cycle_nonminimal_false). The statement needs n to be the least period.", "syracuse.tex:308 — '#𝒟_Γ = (k₁ + nℤ) ∪ (k₂ + nℤ)' equates a number with a set. Read as 𝒟_Γ = …, it is equivalent, for periodic a, to the theorem's #(𝒟 ∩ ⟦1, n⟧) = 2 with 1 ≤ k₁ < k₂ ≤ n (twoDescCount_eq_two_iff). This confirms the planner's [r] (b).", "syracuse.tex:310–315 — the exact displays are false for both readings of OQ-43 and both readings of the positions. The true two-term form at an ascending u is twoDesc_deltaAlt_two_terms (twoDesc_delta_two_terms for the printed A_u^n). Its exponents are s₁ − 1 and s₂ − 2 + a, where the displays have s₁ and s₂ − 1 + a: the error of lem:syracuse_cycle_n__n_, OQ-68 (b). The display of l.311–312 has the shape for k₂ − n < u < k₁, the positions l.308 gives to j, and there it is 2Δ'_u = (2/3)Δ_u (twoDesc_displayI_eq). Symmetrically, l.313–314 is 2Δ'_u for k₁ < u < k₂, the positions of i (twoDesc_displayJ_eq). This confirms the planner's [r] (a), up to the factor 2. At the printed positions the exponent k₁ − i is negative. At −17 neither display equals Δ'_u or Δ_u at any ascending u of a period (twoDesc_displays_printed_false).", "syracuse.tex:317–322 — both ∼_S forms are false as printed. The true forms at the positions of l.308 are as follows. For k₁ < i < k₂, Δ'_i = 3^{i−k₁−1} 2^{k₂−i} E(δ₂, α₂, α₁) and Δ_i = 3^{i−k₁} 2^{k₂−i} E(δ₂, α₂, α₁) (twoDesc_delta_i). For k₂ − n < j < k₁, Δ_j = 3^{j+n−k₂} 2^{k₁−j} E(δ₁, α₁, α₂) (twoDesc_delta_j). Here E(δ, α, β) = 3^δ(2^α − 1) + 2^{δ+α}(2^β − 1). So Δ_i ∼_S 3^{δ₂}(2^{α₂} − 1) + 2^{δ₂+α₂}(2^{α₁} − 1): l.318's δ₂ with α₁ and α₂ exchanged, as the planner's [r] (a) says. The same exchange holds for l.320. Equivalently, l.318 and l.320 are what the displays of l.310–315 give with δ₁ and δ₂ exchanged. At −17 (k₁ = 3, k₂ = 6, δ₁ = 3, δ₂ = 4, α₁ = 1, α₂ = 3), the true S-free parts are 139 and 695 = 5·139. The printed ones are 305 = 5·61 and 253 = 11·23. No Δ_u, u ∈ ℤ, is ∼_S to either printed one, under both readings of OQ-43 (twoDesc_values_seq17, twoDesc_sEquiv_printed_false).", "syracuse.tex:323–324 — the WLOG is not needed. 2^{p_n} − 3ⁿ divides both E(δ₁, α₁, α₂) and E(δ₂, α₂, α₁), so m = |2^{p_n} − 3ⁿ| is at most each (twoDesc_abs_le). Hence m ≤ 2^{|Γ|−n}(3^δ + 2^δ) with δ = min(δ₁, δ₂) ≤ n/2 (twoDesc_bound), and in real form m ≤ 3^{n/2}2^{|Γ|−n} + 2^{|Γ|−n}2^{n/2} (twoDesc_bound_rpow). Read literally on Δ_j, the first inequality of l.324 is false: at −17 every ascending u has Δ'_u ≥ 1112 > 3^{7/2}·2⁴ + 2⁴·2^{7/2} (twoDesc_l324_first_literal_false). It holds for the S-free part.", "syracuse.tex:324–325 — the second inequality, 3^{n/2}2^{|Γ|−n} + 2^{|Γ|−n}2^{n/2} ≤ 2^{|Γ|−(log₃2 − 1/2)|Γ|}, is false whenever 3ⁿ < 2^{|Γ|}, so on every cycle of x > 0 (twoDesc_l324_second_false, twoDesc_l324_second_printed_false). It needs n ≥ |Γ| log₃ 2, the reverse of 2^{p_n} > 3ⁿ. What holds: p_n ≤ 2n on every cycle of ℤ (twoDesc_p_le), so (2^{p_n} − 3ⁿ)⁴ ≤ 16·12^{p_n} (twoDesc_bound_pow_four). That is, m ≤ 2·2^{|Γ|(1−ε₀)} with ε₀ = 1/2 − (log₂ 3)/4 ≈ 0.104 > 0, on every cycle of ℤ with two descending indices per period (twoDesc_corollary_hyp). This is the hypothesis of cor:property_defined_cycles_gcd, with ε₀ in place of log₃ 2 − 1/2.", "syracuse.tex:326 — the corollary to Matveev's theorem and the computer check are cited, not proved. Carried as the hypotheses TwoDescMatveev B and TwoDescCheck B, they give the statement for x > 0 and n the least period (theo_syracuse_cycle_of_cited; _shift for the other index convention).", "syracuse.tex:328 — the case k₂ = k₁ + 1 is not a separate case. The key identity A'_{k₂+1} + (2^P − 3ⁿ) = 2^{δ₂}E(δ₁, α₁, α₂), with A'_{k₁+1} symmetric (twoDesc_key, twoDesc_key_classes; on a cycle, (2^{p_n} − 3ⁿ)(x_{k₂+1} + 1) = 2^{δ₂}E), holds with no ascending index. So m ≤ E(1, α₁, α₂) ≤ 5·2^{|Γ|−n} (twoDesc_adjacent), and the bound of the previous finding covers the case. It rests on the same two cited steps and nothing else. With δ₁ = 1 ≤ δ₂ the paper's own Δ_j also exists once n ≥ 3. The display of l.331 is unfinished: its i is not defined in this case, and its summand depends on k only through 3^{n−1−k}. It is not formalized.", "syracuse.tex:308–334 — the key identity and the true two-term forms are not in the draft; the proofs here are new."]

