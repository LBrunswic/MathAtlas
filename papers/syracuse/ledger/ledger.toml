# Ledger configuration for syracuse. Phase 0: ledger and label audit only; the Lean namespace is not built yet.
[paper]
root = "../legacy/labeled"
document = "syracuse.tex"
notation = []
files = [["syracuse.tex", "body", "P"]]
env_alias = { defi = "definition", theo = "theorem", prop = "proposition", lem = "lemma", cor = "corollary", rem = "remark", propri = "property", exemple = "example", cexemple = "counterexample" }
label_prefixes = ["theo", "lem", "prop", "cor", "def", "defi", "rem", "propri", "conj"]
coverage_recursive = false

[lean]
root = "../../../lean"
strict = ["Syracuse"]
scaffold = ["scaffold/SyracuseScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
