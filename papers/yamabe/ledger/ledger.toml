# Ledger configuration for yamabe. Phase 0: ledger and label audit only; the Lean namespace is not built yet.
[paper]
root = "../legacy/labeled"
document = "Yamabegap.tex"
notation = []
files = [["Yamabegap.tex", "body", "P"]]

label_prefixes = ["theo", "thm", "lem", "prop", "cor", "def", "rem", "conj"]
coverage_recursive = false

[lean]
root = "../../../lean"
strict = ["Yamabe"]
scaffold = ["scaffold/YamabeScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
