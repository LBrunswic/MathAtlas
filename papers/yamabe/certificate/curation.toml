notes = "T-yamabe-negative (atlas-team, 2026-11-21), audit AUDIT-1 minor. The second sentence only, over the measured model: Yamabe.MeasuredModel.prop_nonpositive_csc, (∀ x, R_g x ≤ 0) ∧ EH = Y for constant scalar curvature and minimal boundary, from Y ≤ 0 (the first sentence, carried, not formalized: doubles, connected sums and enlargeability have no counterpart in the model) and KobayashiB g (the conclusion of lem:kobayashi (b) for g, a Prop taken as an argument, not an axiom); « (b) excludes R_g > 0 » is nonpos_of_kobayashiB, EH = Y the strict lem_kobayashi_a. Not vacuous: toy_prop_nonpositive (KobayashiB vacuous there, R < 0; toy_kobayashiB shows it holds on the toy model for every c > 0). Unmarked, partial. T-yamabe-analysis (atlas-team, 2026-11-22), audit AUDIT-1 minor (SCOPE notes on AB46, the ClosedConformal reading, σ(Σ̄) and the Fubini step, fixed at integration): partial, in the scaffold. The named externals (YamabeScaffold.External) and the model-level analytic Props are sorry-free; the six manifold theorems (Sobolev, trace, Rellich on Yamabe.Mfd) are tagged sorrys, so the row stays partial and unmarked. T-yamabe-apply-rulings (2026-11-22): OQ-44 and OQ-74 are ruled by DEC-186 (the model of record; n ≥ 1 standing, l.615's « or ∂Σ = ∅ » removed; eq:hoelder's boundary exponent 1/(N−1) at l.609 and l.720, a typo)."

