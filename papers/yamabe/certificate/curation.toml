notes = "T-yamabe-negative (atlas-team, 2026-11-21), audit AUDIT-1 minor (two line citations and a docstring, fixed at graduation). Over the measured model: Yamabe.MeasuredModel.cor_negative, under exactly the hypotheses of upper_bound_of_gluings_of_pos with lem:positivity carried (hpos): inf F > 0, Y < 0, R_g = c < 0, R_g = Y·Vol^{−2/N} (l.728), and not scalar flat (Vol > 0 derived, so not vacuous). Not vacuous: toy_cor_negative discharges every hypothesis on the two-point toy model (R ≡ −8; lem:positivity proved there, toy_infF_pos). lem:positivity is not a theorem of the model (toyClosed_counterexample, n = 0; toyCut_infF, a disconnected Σ). Unmarked, partial. T-yamabe-analysis (atlas-team, 2026-11-22), audit AUDIT-1 minor (SCOPE notes on AB46, the ClosedConformal reading, σ(Σ̄) and the Fubini step, fixed at integration): partial, in the scaffold. The named externals (YamabeScaffold.External) and the model-level analytic Props are sorry-free; the six manifold theorems (Sobolev, trace, Rellich on Yamabe.Mfd) are tagged sorrys, so the row stays partial and unmarked."
paper_findings = ["Minor, a missing standing hypothesis (l.465, l.495, l.504, l.717). The setting of § 6 (l.465: « Σ is a compact connected N-manifold with boundary ∂Σ = ⊔_{j=1}^n B_j ») and thm:upper-bound (l.495) do not say n ≥ 1. For n = 0, a flat T³ satisfies every hypothesis of thm:upper-bound: σ(T³) = 0 ≤ 0, R ≡ 0 is constant, and an empty boundary is minimal and has no B_j to be round. thm:upper-bound itself holds (Y = 0 ≤ 0 = −inf F). cor:negative fails: F_g(1) = 0 because there is no boundary term, so inf F_g = 0, Y_[g](Σ) = 0, and R_g ≡ 0 is scalar flat. The proof (l.728) uses lem:positivity, whose statement (l.717) asks for « non-empty boundary ». Model counterexample: Yamabe.toyClosed_counterexample. On the closed two-point model (n = 0) with R ≡ 0 it proves a GluingInput with β = c_N and y = 0, minimal boundary, vol ≠ 0, measurable densities, and also inf F = 0, Y = 0 and R ≡ 0. The flat-T³ instance is argued, not formalized. Suggested fix: state n ≥ 1 at l.465 or in cor:negative. The « punctured torus » sentence (l.504) is not affected, because a punctured torus has n ≥ 1."]
