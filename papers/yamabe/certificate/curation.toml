paper_findings = ["prop:csc-yamabe (a), l.195, uniqueness: as printed it does not hold when R_g ≡ 0 and Σ is disconnected. 'Closed' at l.161 is 'compact, without boundary', with no connectedness. Example: flat T³ ⊔ T³ with u = 1 on one torus and u = 2 on the other. The metric u^4 g is flat, so it has constant scalar curvature, lies in [g], and is not homothetic to g (argued on manifolds). In Lean: toyClosedCut_not_cscUnique, the closed two-point model with d = 0 and R ≡ 0, u = (2,1), c' = 0. On the connected closed two-point model it holds (toyClosed_cscUnique). For R_g ≡ c < 0 disconnectedness does no harm. Suggested fix: add 'connected' to the hypotheses of prop:csc-yamabe or to the convention at l.161. The first assertions of (a) and (b) need no connectedness."]

