notes = "T-yamabe-kobayashi (atlas-team, 2026-11-21), audit AUDIT-1 minor (two checklist rows marked as readings; fixed at graduation). Part (a) proved over the measured model with curvature (Yamabe.CurvedMetric), sorry-free: Yamabe.MeasuredModel.lem_kobayashi_a gives eq:kobayashi for every u, Y ≥ m Vol^{2/N}, and EH = Y = c Vol^{2/N} for constant R = c ≤ 0; toy witness toyCurved (EH = Y = −2^{2/3}). Part (b) is out of scope. T-yamabe-analysis (atlas-team, 2026-11-22), audit AUDIT-1 minor (SCOPE notes on AB46, the ClosedConformal reading, σ(Σ̄) and the Fubini step, fixed at integration): partial, in the scaffold. The named externals (YamabeScaffold.External) and the model-level analytic Props are sorry-free; the six manifold theorems (Sobolev, trace, Rellich on Yamabe.Mfd) are tagged sorrys, so the row stays partial and unmarked. Round 2 (2026-11-22, AUDIT-2 minor): Yamabe.Mfd.sobolev_embedding', eLpNorm_gradNorm_lt_top' and trace_embedding' are proved with the round-1 statements, sorry-free (YamabeScaffold.ManifoldTheorems, via HalfSpace and Localisation), to be rewired in place of the round-1 sorrys; Mfd.const_of_tendsto is false as stated (no measurability of the limit; Mfd.not_const_of_tendsto), corrected form proved (const_of_tendsto_of_aestronglyMeasurable); open: rellich_kondrachov, trace_compact. Integrated 2026-11-22 (T-yamabe-integrate-r2, AUDIT-INTEGRATE-R2 minor): the round-2 proofs now carry the round-1 names (Mfd.sobolev_embedding, eLpNorm_gradNorm_lt_top, trace_embedding and the Reads bridges, sorry-free); ConstLimit and Mfd.const_of_tendsto ask MemLp f 2 and are proved (Mfd.Reads.constLimit). The scaffold's only sorrys are Mfd.rellich_kondrachov and Mfd.trace_compact."
paper_findings = ["Minor, cross-reference (l.606–610, cited at l.627 and l.720). In the align of the Hölder inequalities the interior line l.607 carries \\nonumber, and \\label{eq:hoelder} sits on the boundary line (l.608–609). Both citations, '\\eqref{eq:conformal-energy-bdry} and \\eqref{eq:hoelder} give, since m ≤ 0' (l.627, lem:kobayashi) and 'By \\eqref{eq:hoelder}, (u_k) is bounded in W^{1,2}(Σ)' (l.720, lem:positivity), therefore print the number of the boundary line, which is false as printed (OQ-44; Yamabe.hoelder_boundary_printed_false_of_lt_one). Both arguments use the interior line, which is correct (Yamabe.hoelder_interior, used here in Yamabe.MeasuredModel.scalar_term_ge). Suggested fix: label the interior line, or number both lines and cite the right one.", "Minor, wording (l.617–620). eq:kobayashi is stated 'for every u ∈ W^{1,2}(Σ)∖{0}', but EH(Σ, u^{4/(N−2)} g) is the Yamabe energy of a metric only for smooth u > 0. A W^{1,2} function may vanish or change sign; where it vanishes u^{4/(N−2)} g degenerates, and for negative values u^{4/(N−2)} is not even defined for some N (N = 10: u^{1/2}). The inequality is true for every u once its left side is read as the conformal quotient (the right side of eq:conformal-energy-bdry over ‖u‖²_{p*}): Lean Yamabe.MeasuredModel.kobayashi, for every measurable u, 0 included. Its only uses, l.622 (the infimum over φ > 0) and l.660 (u = ψ|_Σ > 0), take u > 0, so nothing downstream is affected. Suggested fix: write the left side as the quotient, or restrict to u > 0 smooth."]

