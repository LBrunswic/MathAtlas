label = "thm:upper-bound"
extra_lean_files = ["Yamabe/Quotient.lean", "Yamabe/Stability.lean", "Yamabe/Kobayashi.lean", "Yamabe/Gluing.lean"]
decls = ["Yamabe.MeasuredModel.upper_bound_of_gluings", "Yamabe.MeasuredModel.upper_bound_of_gluings_of_pos", "Yamabe.MeasuredModel.upper_bound_of_limit", "Yamabe.MeasuredModel.upper_bound_of_limit_of_pos", "Yamabe.MeasuredModel.kobM_mul_le_neg_infF", "Yamabe.MeasuredModel.tendsto_vol_of_uniformlyClose", "Yamabe.CurvedMetric.tendsto_kobM", "Yamabe.CurvedMetric.abs_kobM_sub_le", "Yamabe.Filling.le_neg_infF_of_gluing", "Yamabe.GluingInput", "Yamabe.GluingInput.le_neg_infF"]
lean_proved_override = "partial"
bucket = "D"
blocked_on = "T-yamabe-scope (the cited analytic inputs: thm:yamabe (b), lem:gluing, Escobar's fact (iv), the conformal law) and OQ-44 (the frame model's readings)"
notes = "T-yamabe-gluing-algebra (atlas-team, 2026-11-21), audit AUDIT-1 minor (a joint witness for the β = c_N inputs, shown by the auditor's probe but not in the file; REPORT wording). The τ → 0 limit of the proof (l.723–729) proved over the model: upper_bound_of_limit, le_neg_infF_of_gluing, upper_bound_of_gluings; the repair of l.724 through lem:positivity (carried): upper_bound_of_limit_of_pos, upper_bound_of_gluings_of_pos. Lemmas, never the anchor. Ledger tooling: this row's proof (« Proof of Theorem~\\ref{thm:upper-bound} », l.723) is not linked because texgraph's PROOF_OF does not accept '~' (a tool follow-up)."
paper_findings = ["Minor, a citation in the proof (l.724; prop:nonpositive l.477–480; thm:upper-bound l.495). 'By Proposition prop:nonpositive, or directly by hypothesis, R_g ≤ 0 is constant.' prop:nonpositive assumes Σ̄ enlargeable. thm:upper-bound assumes only σ(Σ̄) ≤ 0, which enlargeability implies but which does not imply it (argued, not formalized: the K3 surface, N = 4, has σ = 0 and is simply connected, hence not enlargeable). None of thm:upper-bound's hypotheses states R_g ≤ 0. Without R_g ≤ 0, the limit of l.728 is min(0, R_g) Vol(Σ, g)^{2/N}, not R_g Vol(Σ, g)^{2/N}, and Y_[g](Σ) = R_g Vol^{2/N} (lem:kobayashi (a)) needs R_g ≤ 0. The gap closes inside the proof. The limit gives min(0, R_g) Vol(Σ, g)^{2/N} ≤ −inf F_g (Lean Yamabe.MeasuredModel.kobM_mul_le_neg_infF). lem:positivity gives inf F_g > 0, and the proof already uses it for cor:negative at l.728. Together they force R_g < 0, hence Y_[g](Σ) = R_g Vol^{2/N} ≤ −inf F_g (Yamabe.MeasuredModel.upper_bound_of_limit_of_pos, upper_bound_of_gluings_of_pos). Suggested fix: replace the appeal to prop:nonpositive at l.724 by this argument, or add 'Σ̄ enlargeable' to thm:upper-bound. The theorem's statement is not affected."]
