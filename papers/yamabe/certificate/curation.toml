blocked_on = "OQ-121 (σ^∂(Σ) ≥ 0; the weights of the mean), OQ-93 and OQ-111 (the marks); three clauses on T-perf-dilute-limit (needs-ruling)"
notes = "Not proved in this paper: « the proof … is given in the companion paper \\cite{BrunswicPerforated} » (l.538). DEC-185 (T-yamabe-lower-bound): close it from the companion. T-yamabe-thm-lower-bound (atlas-team, 2026-11-23), audit AUDIT-1 clean: Yamabe/LowerBound.lean, strict, sorry-free. Partial, unmarked. Over the measured model, under thm:upper-bound's hypotheses as upper_bound_of_gluings_of_pos reads them and thm:main's: R_g ≡ c < 0, EH = Y, κF_g(1) > 0, δ ≥ F_g(1)/Λ_max and δ ≥ κF_g(1) (κ of eq:kappa with the explicit remainder mainRem), ∣R_g∣Vol^{2/N} ≥ κF_g(1) (eq:R-bound before the dilute limit, no σ^∂ needed), the round-B_j M forms, the remainder O(F²). lem:positivity is derived from thm:main, not carried. Both forms of thm:main (thm_lower_bound, thm_lower_bound_signed: OQ-111 (a) picks one with no Lean change); every Ã with eq:star, instantiated at star3AtilCorr (N = 3) and starNAtil (N ≥ 3): OQ-109 and OQ-118 choose an instance. Manifold forms (Mfd.Reads) discharge MeanPoincare, the trace, λ₁ > 0, C_SP < ∞, eq:star; they carry InteriorBump and NonConst, under OQ-93. Added hypothesis σ^∂(Σ) ≥ 0 (OQ-121 (a)); the sign-free δ ≥ σ^∂ + κF_g(1) is proved. Not formalized: « θ/(1+θ) is optimal », θ = 2 and θ = 1 with κ → 1/2, eq:R-bound's (1 + o(1)) (T-perf-dilute-limit). Non-vacuity: Yamabe.toy_thm_lower_bound."
paper_findings = ["Missing hypothesis (l.514–524, eq:gap-bdry l.352–353, eq:sigma-torus l.366–369; perforated l.924–925): the proof needs σ^∂(Σ) ≥ 0, which the companion states (« δ ≥ λ_∂ whenever Yb(Σ) ≥ 0 ») and yamabe's theorem does not; thm:upper-bound's σ(Σ̄) ≤ 0 does not imply it. Without a sign the argument gives δ ≥ σ^∂(Σ) + κF_g(1). Smallest fix: add « σ^∂(Σ) ≥ 0 », or restrict to T³ and prove eq:sigma-torus.", "Minor (l.522–524): « κF_g(1) = κ·2(N−1)M/Vol^{(N−2)/N} » holds only for round B_j (the Setting, l.467; eq:F1-torus, l.469); under thm:upper-bound's hypotheses each B_j is only conformally round, and Minkowski's inequality makes F_g(1) strictly smaller for a non-round B_j (argued).", "Minor wording (l.530): Ã depends on V too, not only on the Sobolev–Poincaré and Poincaré constants.", "Minor (l.530): « θ/(1+θ) is optimal » is the companion's thm:sharp, about λ_∂; transferring it to δ needs δ ≤ λ_∂(1 + o(1)), which neither paper states (eq:sandwich gives only δ ≤ F_g(1))."]

