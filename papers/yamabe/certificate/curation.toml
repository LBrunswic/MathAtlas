paper_findings = ["Minor (l.699–701): the printed conclusion is a ratio F^(β)_{g'}(u)/F^(β)_g(u), which is 0/0 when F^(β)_g(u) = 0; 'all β_j ≥ 0' allows β = 0, and then u = 1 gives F^(0)_g(1) = 0 (Lean witness Yamabe.toy_F_zero_one). The product form (1+ε)^{-N} F_g ≤ F_{g'} ≤ (1+ε)^N F_g holds for every u (stability). Harmless for the paper: the lemma is used at l.728 with β_j = c_N > 0."]

