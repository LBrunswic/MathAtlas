notes = "T-yamabe-analysis (atlas-team, 2026-11-22), audit AUDIT-1 minor (SCOPE notes, fixed at integration). Every step of l.720 is proved over the measured model from the four analytic Props (Yamabe.MeasuredModel.lem_positivity, sorry-free, standard axioms; all four hold on the toy model, toy_lem_positivity). On the manifold, Yamabe.Mfd.lem_positivity rests on the open manifold theorems. Over C¹(M), the reading of W^{1,2}, positivity is weaker than printed; the two agree by density and continuity, argued, not formalized. Partial, unmarked. Round 2 (2026-11-22, AUDIT-2 minor): Yamabe.Mfd.sobolev_embedding', eLpNorm_gradNorm_lt_top' and trace_embedding' are proved with the round-1 statements, sorry-free (YamabeScaffold.ManifoldTheorems, via HalfSpace and Localisation), to be rewired in place of the round-1 sorrys; Mfd.const_of_tendsto is false as stated (no measurability of the limit; Mfd.not_const_of_tendsto), corrected form proved (const_of_tendsto_of_aestronglyMeasurable); open: rellich_kondrachov, trace_compact. Integrated 2026-11-22 (T-yamabe-integrate-r2, AUDIT-INTEGRATE-R2 minor): the round-2 proofs now carry the round-1 names (Mfd.sobolev_embedding, eLpNorm_gradNorm_lt_top, trace_embedding and the Reads bridges, sorry-free); ConstLimit and Mfd.const_of_tendsto ask MemLp f 2 and are proved (Mfd.Reads.constLimit). The scaffold's only sorrys are Mfd.rellich_kondrachov and Mfd.trace_compact."
paper_findings = ["Remark, wording (l.720). The proof calls the trace operator W^{1,2}(Σ) → L²(∂Σ) compact; it uses only its continuity: once ∇u_k → 0 and u_k → c in L²(Σ), u_k → c in W^{1,2}(Σ), and a bounded trace gives the traces' convergence (Lean: Yamabe.MeasuredModel.lem_positivity uses only TraceIneq). Suggested wording: « bounded »."]
