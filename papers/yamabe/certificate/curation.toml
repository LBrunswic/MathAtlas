blocked_on = "T-yamabe-scope (which cited analysis is a named external) and OQ-44 (the frame model's readings)"
notes = "T-yamabe-quotient (atlas-team, 2026-11-20), audit AUDIT-1 minor (quote cuts, checklist rows, a SCOPE note; fixed in round 1). Proved over an abstract measured model with the paper's constants (sorry-free); the passage from Riemannian manifolds to the model is the scope ruling's."
paper_findings = ["eq:hoelder (l.609; not a ledger row, in this target's scope; the curation may attach it to lem:positivity, whose proof uses it at l.720): on any B_j with Vol(B_j) < 1 the constant u = 1 (in W^{1,2}(Σ), trace 1) violates the printed boundary line ‖u‖²_{L²(B_j)} ≤ Vol(B_j)^{2/(N−1)} ‖u‖²_{L^{p♯}(B_j)} (Lean: Yamabe.hoelder_boundary_printed_false_of_lt_one, for every measure of mass in (0,1), e.g. a round B_j of radius r_j < ω_{N−1}^{−1/(N−1)}, r_j < 1/√(4π) for N = 3; and Yamabe.hoelder_boundary_printed_false, a point mass 1/2). The exponent is 1/(N−1) = 1 − 2/p♯ (Yamabe.hoelder_boundary), sharp: equality on constants for every mass (Yamabe.hoelder_boundary_eq_one). Of the two citations of eq:hoelder at l.720 only the second, ‖u_k‖_{L²(B_j)} ≤ Vol(B_j)^{1/(N−1)} ‖u_k‖_{L^{p♯}(B_j)} → 0, uses the boundary line; its factor should be Vol(B_j)^{1/(2(N−1))}, and the step survives since only → 0 is used. The first citation at l.720 ('bounded in W^{1,2}') and l.627 (lem:kobayashi) use the interior line l.607, which is correct (Yamabe.hoelder_interior)."]

[[row]]
label = "lem:kobayashi"
extra_lean_files = ["Yamabe/Quotient.lean", "Yamabe/Kobayashi.lean"]
decls = ["Yamabe.MeasuredModel.lem_kobayashi_a", "Yamabe.MeasuredModel.kobayashi", "Yamabe.MeasuredModel.kobayashi_printed", "Yamabe.MeasuredModel.confAction_ge", "Yamabe.MeasuredModel.scalar_term_ge", "Yamabe.MeasuredModel.le_infConf", "Yamabe.MeasuredModel.le_Y", "Yamabe.MeasuredModel.le_Y_printed", "Yamabe.MeasuredModel.EH_eq_const_mul", "Yamabe.MeasuredModel.Y_le_EH", "Yamabe.MeasuredModel.EH_eq_Y", "Yamabe.MeasuredModel.Y_eq_const_mul", "Yamabe.MeasuredModel.EH_eq_confEnergy_one", "Yamabe.MeasuredModel.minimalBoundary_of_bvol_eq_zero", "Yamabe.MeasuredModel.confAction_of_minimal", "Yamabe.MeasuredModel.action_of_minimal", "Yamabe.CurvedMetric", "Yamabe.CurvedMetric.kobM", "Yamabe.CurvedMetric.kobM_nonpos", "Yamabe.CurvedMetric.kobM_le", "Yamabe.MeasuredModel.action", "Yamabe.MeasuredModel.EH", "Yamabe.MeasuredModel.confAction", "Yamabe.MeasuredModel.confEnergy", "Yamabe.MeasuredModel.MinimalBoundary", "Yamabe.MeasuredModel.Pos", "Yamabe.MeasuredModel.infConf", "Yamabe.MeasuredModel.Y", "Yamabe.toyCurved", "Yamabe.toy_kobM", "Yamabe.toy_EH", "Yamabe.toy_EH_eq_Y"]
lean_proved_override = "partial"
bucket = "D"
blocked_on = "T-yamabe-scope (part (b) needs the Sobolev embedding of Hebey1996; the conformal law MR1152225, MR1173925 identifies confEnergy with EH) and OQ-44 (the frame model's readings)"
notes = "T-yamabe-kobayashi (atlas-team, 2026-11-21), audit AUDIT-1 minor (two checklist rows marked as readings; fixed at graduation). Part (a) proved over the measured model with curvature (Yamabe.CurvedMetric), sorry-free: Yamabe.MeasuredModel.lem_kobayashi_a gives eq:kobayashi for every u, Y ≥ m Vol^{2/N}, and EH = Y = c Vol^{2/N} for constant R = c ≤ 0; toy witness toyCurved (EH = Y = −2^{2/3}). Part (b) is out of scope."
paper_findings = ["Minor, cross-reference (l.606–610, cited at l.627 and l.720). In the align of the Hölder inequalities the interior line l.607 carries \\nonumber, and \\label{eq:hoelder} sits on the boundary line (l.608–609). Both citations, '\\eqref{eq:conformal-energy-bdry} and \\eqref{eq:hoelder} give, since m ≤ 0' (l.627, lem:kobayashi) and 'By \\eqref{eq:hoelder}, (u_k) is bounded in W^{1,2}(Σ)' (l.720, lem:positivity), therefore print the number of the boundary line, which is false as printed (OQ-44; Yamabe.hoelder_boundary_printed_false_of_lt_one). Both arguments use the interior line, which is correct (Yamabe.hoelder_interior, used here in Yamabe.MeasuredModel.scalar_term_ge). Suggested fix: label the interior line, or number both lines and cite the right one.", "Minor, wording (l.617–620). eq:kobayashi is stated 'for every u ∈ W^{1,2}(Σ)∖{0}', but EH(Σ, u^{4/(N−2)} g) is the Yamabe energy of a metric only for smooth u > 0. A W^{1,2} function may vanish or change sign; where it vanishes u^{4/(N−2)} g degenerates, and for negative values u^{4/(N−2)} is not even defined for some N (N = 10: u^{1/2}). The inequality is true for every u once its left side is read as the conformal quotient (the right side of eq:conformal-energy-bdry over ‖u‖²_{p*}): Lean Yamabe.MeasuredModel.kobayashi, for every measurable u, 0 included. Its only uses, l.622 (the infimum over φ > 0) and l.660 (u = ψ|_Σ > 0), take u > 0, so nothing downstream is affected. Suggested fix: write the left side as the quotient, or restrict to u > 0 smooth."]
