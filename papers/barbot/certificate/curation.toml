notes = "Flat/Externals.lean (Benoist as the external BenoistNoLox, WP-33c), Flat/Nonloxodromic.lean (WP-34c), Flat/TitsNull.lean (WP-34g). ⚠ added on the all-elliptic branch: DiscreteTopology Gamma and the external TitsVirtuallyAbelianNull d (DEC-50), which reduces to one local statement (a sorry) and is closed for d <= 2 (Barbot's n <= 3). [9.E] (nonloxodromic_elliptic) and [9.A] (nonloxodromic_parabolic) carry one sorry each; G6 (Omega(S~) invariant under U^perp, parabolic case) is closed. The conclusion is strengthened to FIXES a nonzero null vector (equivalent for loxodromic-free groups)."
paper_findings = ["Prop 9.1 gap (Tits), l.2621-2622: 'up to finite index, L(Gamma) preserves an isotropic vector v_0 and Gamma contains a parabolic element gamma_1' does not follow from Prop 9.1: its proof (l.2585-2594) produces a parabolic element of the Zariski closure G_0, not of Gamma, and leaves a branch Section 9 never treats (L(Gamma') fixing v_0, all elliptic).", "That branch needs Gamma discrete: without discreteness it is false for n >= 6 (a free unit-quaternion pair on P_0-bar = R^4: all elliptic, fixes v_0, no finite-index subgroup fixes a timelike vector; documented, not formalized). With discreteness it needs an argument absent from the paper (no free subgroup, Tits, virtually solvable, L(Gamma) virtually abelian), carried as TitsVirtuallyAbelianNull.", "An 'elliptic analogue of Benoist' (all elliptic in Gamma => all elliptic in the Zariski closure) is false, so the step 'G_0 admits only elliptic elements, therefore compact' (l.2596-2597) never fires on that branch; the Barbot-cited route goes through Thm 5.1 (bthm:ausl) and Gamma's discreteness.", "l.2575-2577, l.2593-2594, l.2621: 'stabilizes an isotropic vector', 'stabilizes a lightlike direction' and 'preserves an isotropic vector v_0' agree only because an element of SO_0 scaling a null vector by lambda != 1 is loxodromic, which the paper never states.", "[9.E] l.2609-2610: only freeness of Gamma on M^n is stated; the quotient needs properness (proved for subgroups whose linear parts fix a timelike vector). l.588-590: 'translations by spacelike translation vectors' is not 'translations whose span is spacelike' (in M^4, e_1 and e_0 + e_2 + sqrt2 e_1: spacelike_translations_null_span).", "[9.P] l.2659: for a linear gamma in A(v_0), U(gamma) is the preimage of the complement of a point (u + y v != 0), not of 'a half-line'."]

