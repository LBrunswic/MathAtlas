notes = "MARKED (DEC-72, 2026-11-02): Flat/Classification.lean (WP-34e) carries **`bthm:caucomp`**. barbot_A and barbot_A₀ are sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02) and no sorry lies beneath them. Read as R1 (DEC-43), every dimension d, d = 0 included; the fourth family is the central-extension form (b) (DEC-44). ⚠ strengthened, disclosed: the group theory the paper cites enters as the named external BarbotExternals d (DEC-36): Benoist (BenoistNoLox), Bieberbach I (BieberbachI, k <= d + 1), Auslander-Carriere-Dal'bo (AuslanderCarriereDalbo), Carriere-Dal'bo (MaxUnipotentSubspace); non-vacuity barbotExternals_zero and barbot_A_hypotheses_zero at d = 0, consistent on the cited literature only for d >= 1. [10.M] (loxo_elementary_misner) carries hBieb (its statement implies Bieberbach I), supplied by BarbotExternals.bieberbach in caseOutput: nothing beyond the bundle. Tits is proved, not assumed (titsVirtuallyAbelianNull, DEC-50). Files involved: Classification; Loxodromic and Lox/* ([10.M]: SecondNullFix, MisnerFrame, MisnerLimitSet, MisnerBieberbach, MisnerRestrict; [10.G] and bprop:LU_discrete: ClosedSubgroupNhds and the fix/restriction lemmas); Nonloxodromic and Nonlox/* ([9.U], [9.E], [9.A]); TitsNull; Cla/* L1-L7 (LTPConvex, FiniteCover, TameNested, RegularComplete, UnipEnvelope, UnipComplete, LTPEnlarge: the finite cover, the tame embedding, [11.i]). [11.i] is closed: AMGH of translation and Misner spacetimes and of family (b), G1/G3 for the unipotent family through the corrected envelope. Section 2's prose is carried by Flat/{IsomCausal,FlatSpacetime,Developing,SecondCountable}.lean and Flat/{InducedLength,CauchyComplete}.lean (the Cauchy-complete reading, DEC-35); Section 3's models by Flat/Examples.lean. Scaffold: lean_proved reads none until graduation, and the scaffold root imports no Flat module, so the axiom sweep has not covered it (kb/0025); the axioms above are #print axioms by hand."
paper_findings = ["F1, [11.i] l.3620: 'Misner spacetimes are absolutely maximal' is false when Gamma has no loxodromic element (Gamma trivial: the wedge {t > |x_1|} sits non-surjectively in M^n); the proof assumes one. The Misner family carries 'some gamma has nonzero boost parameter', and with it absolute maximality is proved for both wedges (surjective_of_isQuotientOf_misner).", "F2, [10.G] l.3333-3456: the torsion of L(Gamma) is never treated. The literal 'Cauchy-hyperbolic x torus' family is replaced by the central-extension family (b); the torus product (a) is reached only under pi_1 finitely generated, through Selberg's lemma (DEC-44).", "G1, l.3678-3679: [11.i]'s unbounded unipotent case is called 'similar' and is not written; it needs one-sided forms of Props 9.3 and 9.5.", "G3, l.3586-3592: (i)'s proof applies Theorem A to the target N and drops the linear-twisted-product and finite-cover clauses; it is non-circular only through the layering A_0 (embedding) -> (i) -> A, which is how barbot_A is assembled.", "Theorem A's tame embedding into B = Gamma''\\Omega needs Omega simply connected (pi_1(B) is an extension of Gamma'' by pi_1(Omega)); the paper's Omega are convex, but this is not stated.", "l.3586-3590, l.3616-3618: for translation spacetimes [11.i] does not need Theorem A on the target: they are absolutely maximal among all flat targets, GH or not (absMax_of_isTranslationSpacetime).", "Def 4.18 (l.1212-1214), the fourth family, asks 'no global fixed point', not 'nonelementary': it admits elementary groups with a loxodromic element (infinite dihedral). Its GH needs a loxodromic element, which Def 4.18 yields only through Benoist, not invoked there.", "[3.U] geodesics only, l.729-741: the Cauchy argument for the unipotent slice S_f checks nonspacelike geodesics only; the separation claim (S_f disconnects the two lightlike boundary hyperplanes) is false for bounded f even with two finite poles (n = 4, f(y) = y). The conclusion stands because the chosen f = int a^2 (l.707-711) diverges at every end; when an end is infinite the case split l.734-737 is also incomplete.", "Rem 2.2, l.544: 'S is not a Cauchy hypersurface in M^n' holds for n >= 2 only (for n = 1, S is a point and is Cauchy in the line); harmless, the paper works in n >= 2.", "[2.3] l.485-490 never states that isometries preserve the causal relations of open subsets; in the ETT framework it is a theorem (le_iff_le_isomImage). Typographic: l.490 Isom(M^n) with a plain M.", "F3, [10.M] l.3320-3321: 'the action on pi_P^-1(0) is free and properly discontinuous' is false for Gamma: in M^4, Gamma = <gamma_0> with gamma_0(x,z,y) = (e^-1 x, R_theta z, e y), theta/pi irrational, is elementary loxodromic and acts freely and properly on the domain, but acts on pi_P^-1(0) by a rotation fixing 0. The claim holds for Gamma_0 = ker a, and [10.M]'s conclusion is not refuted (that example is Misner in M^2): Bieberbach is run on Gamma_1's euclidean model (Lox.misner_bieberbach).", "F4, [10.M] l.3264-3269: the conjugation formula for alpha(gamma gamma' gamma^-1) holds only if alpha(gamma) fixes the origin of Q_0; a loxodromic with a screw part fixes no point and its conjugates drift by n R^n (I - R(gamma')) u, so 'v(gamma') = 0' is unjustified as written. The conclusion is true and proved another way (translation lengths are conjugation-invariant, Lox.fix_second_null, under Bieberbach I). Also l.3287 ('L(Gamma_0) is finite') needs the U = M^n reduction made just before it (Carriere-Dal'bo)."]

