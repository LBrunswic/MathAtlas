notes = "MARKED (DEC-72, 2026-11-02): Flat/Classification.lean (WP-34e) carries **`bthm:cauclo`**. barbot_B, and barbot_B_geroch (Flat/GerochFlat.lean, DEC-65: barbot_B with lemma K's data hK discharged by flatGerochGH through forall_flatLemmaKData_iff), are sorry-free (#print axioms: propext, Classical.choice, Quot.sound, re-derived 2026-11-02); no sorry lies beneath. 'Standard' is read as Cauchy-compact Cauchy-hyperbolic (G4); the torus family is the literal form (a). ⚠ strengthened, disclosed: the named externals BarbotExternals d (Benoist, Bieberbach I, Auslander-Carriere-Dal'bo, Carriere-Dal'bo, as in bthm:caucomp) and SelbergLemma (Minkowski d) (DEC-44, consumed by G9's step family (b) -> (a)); barbot_B itself also carries hK : forall N, GH N -> FlatLemmaKData N (lemma K's data on every GH target, DEC-44), which barbot_B_geroch discharges. Non-vacuity: barbot_B_hypotheses_satisfiable, barbot_B_zero_geroch (every input discharged at d = 0). Rem 2.3 is formalized corrected (DEC-44): absMax_of_cauchyCompact_of_mgh, through lemma K's proved form isCauchySurface_of_isLocallyCauchyTwoSided (CompactCauchy.lean, WP-34a); its bare form isCauchySurface_of_isLocallyCauchy is a sorry, possibly false in ETT generality, and is NOT used. Files involved: Classification; CompactCauchy; Cla/* L8-L12 (LocallyCauchy; CompactComplete with the smoothing step SmoothCap, SmoothGlue, SmoothCone, CCComponent; CoverMGH with CoverMax, finding 2 proved without CBG; G9 with G9Pair, G9PairLin; CoverComp) and L1-L4, L6; TheoremBInputs and GerochFlat with Geroch/* (hK); and through barbot_A₀ everything bthm:caucomp lists (Loxodromic, Nonloxodromic, Lox/*, Nonlox/*, TitsNull). CurvesExtend is proved from a time function (CurvesExtend.lean, WP-34b). Scaffold: lean_proved reads none until graduation, and the scaffold root imports no Flat module, so the axiom sweep has not covered it (kb/0025)."
paper_findings = ["Rem 2.3 (l.571-579) is false as written: the slab Z^d\\{0 < t < 1} is GH and Cauchy-compact and embeds isometrically, not onto, in the torus Z^d\\M^n (DEC-44; proved in every d in Flat/Examples). The literal remark fails because M is not assumed maximal; the corrected form adds MGH (lemma K).", "Rem 2.3, l.577-578: 'any spacelike hypersurface in a CGH spacetime is a Cauchy hypersurface' is false for a small spacelike disc, and needs 'closed' and 'connected' (two disjoint Cauchy slices form a compact, locally Cauchy set met twice by every inextensible curve); for closed connected hypersurfaces it is lemma K.", "l.3537-3540: 'closed spacelike hypersurfaces of a GH spacetime are Cauchy' is asserted without proof (lemma K: proved under its named data FlatLemmaKData, which GerochFlat discharges on every GH flat spacetime).", "l.3578-3581: '(ii) follows from (i)' also needs that a finite cover of a maximal Cauchy-compact spacetime is maximal, which the paper does not state. It is true, and proved without the uniqueness of maximal Cauchy developments (Cla.cover_maximal_of_isFiniteCover, Flat/Cla/CoverMax): Rem defdep's first claim for M, then the lift of a Cauchy embedding of the cover to the universal covers.", "l.3536 ('reconsider the proof above when M is assumed Cauchy-compact') uses Cauchy-compact => Cauchy-complete, which for a topological Cauchy surface needs a smoothing step the paper takes for granted (l.560-565, l.3536-3538). It is proved: finitely many past-hyperboloid caps whose rims lie strictly below S and which lie strictly above S near their centres; the upper part K minus I^-(K) of their union is a nonempty compact spacelike Lipschitz hypersurface (Cla.exists_capEnvelope_of_isCompact_cauchy, SmoothCap; gluing SmoothGlue), a component of which is Cauchy by lemma K. Only per-point constants are needed.", "G4, l.355-358: the identification of the third family with 'standard' spacetimes is asserted in a parenthesis; read as Cauchy-compact Cauchy-hyperbolic.", "Rem defdep, l.2517-2521: 'when M is maximal globally hyperbolic, the image of D is the Cauchy domain of S' is proved in the DEC-35 reading, range D = int D(Sigma), for every maximal GH flat spacetime with (CC') (Cla.cover_range_eq_of_mgh; Cauchy-compactness not needed). Its second claim, Omega(S~) = int D(Sigma) (Rem dependance, l.3552-3555), is not proved: only int D(Sigma) = range D within Omega(S~)."]

