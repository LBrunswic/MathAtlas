paper_findings = ["Lemma 7.1 (l.2173-2180) is FALSE as printed: with 'parabolic' admitting R = id (as Section 9's purely unipotent case l.2865 requires) it fails for n >= 4 (null rotation composed with a unit translation, x_0 = 0: nullRotShift_counterexample); with R non-trivial (l.1974) it fails for n >= 6 (halfTurnShift_counterexample). It holds exactly for n <= 3; the strongest true forms are proved class by class (transverse, linear, tangent off an affine hyperplane c + J^perp).", "Proof, l.2187-2188: |g^q x - x_0|^2 = |x|^2 + |x_0|^2 - 2<g^q x|x_0> uses |g^q x|^2 = |x|^2, false unless tau = 0; l.2191: <g^q x|x_0> = <g^q x_0|x> is false; in the transverse case the leading term is quartic (-q^4|p tau|^2/12), not the cubic of l.2193.", "Proof, l.2207-2209 (linear case): an x with <p^2(x)|x_0> > 0 exists only if x_0 is not in J^perp; for x_0 in J^perp another choice is needed (paranongh_linear_normal).", "Use in Section 9, l.2776-2783: the base point x_0 in S~ must avoid the exceptional hyperplane parallel to J^perp in the tangent case.", "Section 6 class overlaps, l.1880-1899 and l.1973-1974: the normal forms overlap (zeta = 0 allows the identity, so every elliptic element is loxodromic; parabolic as listed contains every elliptic and every unipotent element, while Section 6.2 asks R non-trivial and Section 7 l.2085 treats id + p as parabolic), so elliptic/loxodromic/parabolic is not a partition as printed. With zeta != 0 and U != id the classes are disjoint and exhaustive (lorentz_trichotomy).", "Section 6, l.1852: p = L(g) - id is an endomorphism of M^n, not an element of SO_0(1,n-1); l.1873: M^n = I + I^perp is justified for elliptic L(g) only (false for unipotent L(g) != id); l.1890 and l.1908: 'J nontrivial' needs p != 0; l.1943-1951: the displayed matrix is that of p, not of L(g); l.2008-2014: 'tau in I' is meaningful only after normalisation (as an invariant: tau in Im(L(g) - id)).", "Section 6, l.1875-1876: 'R' is not yet defined in the elliptic item (read L(g) = id); l.1929-1931: 'v_1 = p(v_n) is a non-trivial element of I minus J' is asserted without argument (gap filled).", "[7.0] l.2024: the printed Omega_g quantifies over all q in Z, q = 0 included, so it is empty as written; read q != 0. l.2026: 'It is the open set' is false in general: open for elliptic and parabolic g, and for loxodromic g iff tau = 0 and L(g) has finite order on the orthogonal of the null frame (isOpen_achronalDomain_lox_iff).", "[7.L] l.2081: Omega_g = {xy < 0} holds for its interior only; for normal-form tau != 0, Omega_g = {xy <= 0}, not open. l.2068 and l.2075: the normalisations of the sh^2 factor disagree (harmless: only its sign and growth are used).", "[7.E] l.2047-2049: 'the R^n-fixed points' must read R^N for one N > 0 (not n the dimension); l.2036: '|(R^q - id)(x)|^2' should read '(R^q - id)(x)'."]

