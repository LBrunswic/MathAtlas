# Ledger configuration for perforated (BrunswicPerforated, the companion of yamabe; DEC-185, T-yamabe-companion).
[paper]
root = "../legacy/labeled"
document = "perforated.tex"
notation = []
files = [["perforated.tex", "body", "P"]]

label_prefixes = ["thm", "lem", "prop", "cor", "def", "rem", "q"]
coverage_recursive = false

[lean]
# The Yamabe research's Lean is one package (DEC-185: self-contained): lean-yamabe, shared with
# papers/yamabe. No statement label is shared between the two papers.
root = "../../../lean-yamabe"
strict = ["Yamabe"]
scaffold = ["scaffold/YamabeScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
