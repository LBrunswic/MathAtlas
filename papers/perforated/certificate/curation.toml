paper_findings = ["thm:upper (l.871–889) is true as printed but lossy: since ∫ψ = 0, ∫u_s = V for every s, so Hölder against 1 gives ‖u_s‖_{p*} ≥ V^{1/p*}, replacing the triangle-inequality step at l.885; hence λ_∂ ≤ θ_D/(1+θ_D)·F_g(1), with no (1−ρ)^{-2} and no proviso ρ < 1 (Lean Yamabe.thm_upper_strong). The proviso ρ < 1 does not follow from the model's axioms (ρ = 1 on the two-point toy model); on the Euclidean 3-ball ρ ≈ 0.874 (the auditor's numerical integration). Consequences: eq:sandwich's right side becomes θ_D/(1+θ_D), and thm:sharp needs only θ_D/θ → 1, not ρ → 0.", "Minor (l.862–866): cap_D is defined through a minimiser whose existence the paper does not prove; the Lean statements do not need it (thm_upper for every competitor, thm_upper_capD with the infimum)."]

