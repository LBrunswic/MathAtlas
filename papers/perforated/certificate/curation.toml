extra_lean_files = ["Yamabe/Perforated/Star3.lean"]
decls = ["Yamabe.star3N2", "Yamabe.star3N6", "Yamabe.star3G", "Yamabe.star3Coeff", "Yamabe.star3Atil", "Yamabe.star3AtilCorr", "Yamabe.star3Phi", "Yamabe.MeasuredModel.StarIneq", "Yamabe.MeasuredModel.StarIneqSigned", "Yamabe.star3_binom", "Yamabe.star3_interp", "Yamabe.star3_core", "Yamabe.star3_Dbound", "Yamabe.star3_normalized", "Yamabe.star3_integral", "Yamabe.MeasuredModel.star3_point", "Yamabe.MeasuredModel.star3_of_consts", "Yamabe.MeasuredModel.thm_star3_corrected", "Yamabe.MeasuredModel.thm_star3_corrected_nonneg", "Yamabe.star3G_eq", "Yamabe.star3G_not_monotone", "Yamabe.star3CexModel", "Yamabe.star3Cex_hyps", "Yamabe.star3Cex_not_star", "Yamabe.thm_star3_printed_false"]
lean_proved_override = "partial"
blocked_on = "OQ-109 (the correction of record), T-perf-poincare"
notes = "T-perf-star3 (atlas-team, 2026-11-22), audit AUDIT-1 minor (the headline « false as printed » qualified: the proof error is against the paper, the invalid constant on the model; fixed at graduation). eq:binom, the interpolations, eq:Dbound, cases (i), (iii) proved as printed; the corrected theorem (the minimum over C_SP·X₀ ≤ 2) proved for every u, signed or not (thm_star3_corrected); the printed Ã refuted on the model (thm_star3_printed_false). Not marked: the correction of record is OQ-109."
paper_findings = ["The proof is wrong (l.635, l.645–647; proved against the paper): « G is non-decreasing » fails, since the cap n₆ = min{C_SP X₀, 2} makes G decrease past 2/C_SP (Yamabe.star3G_not_monotone: G(4) < G(2) at V = λ₁ = C_SP = 1), and case (ii) uses G(X) ≤ G(X₀), which fails e.g. at X = 2/C_SP.", "The printed Ã (l.607–611) is not a valid constant on the model of record: a two-point model (masses 1/100, 99/100, V = 1) meets every hypothesis and u = (1, 1/5) needs Ã ≥ 0.27 against ≤ 0.22 printed (thm_star3_printed_false). The model violates lem:csp-lower (C_SP = 0.4595 < 0.538), so against a Riemannian Σ this is argued, not proved: a dumbbell with a neck of conductance κ → 0, every constant scaling like 1/κ, gives 0.211 against 0.270.", "The table at l.660 (λ₁V^{2/3} = 4π², V = 1): the corrected minima are 1.070, 1.509, 2.508, 4.682 and the printed formula's own minima 0.375, 0.490, 1.000, 2.250 at C_SP = 0.539, 0.70, 1.0, 1.5, against 1.073, 1.511, 1.915, 2.250 printed; the first two agree with the corrected minimum, 2.250 only with the printed formula, 1.915 with neither (numerical, not formalized)."]
