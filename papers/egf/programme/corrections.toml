# Ergodicity suffices for universality; the spectral-gap remark (T-egf-plan-wave-1)           batch C-ergodicity

[[correction]]
id = "C-29"
label = "theo:universality_true"
where = "Theorem B.1 and Theorem 3.4: the mixing hypothesis; l.238, l.271 and the limitations of Section 6"
printed = ["main.tex:775", "main.tex:277", "main.tex:238", "main.tex:271", "main.tex:697-698", "main.tex:702"]
kind = "strengthening"
finding = "Summable L2-mixing is not needed for universality. For a Markov kernel pi with a finite invariant measure lambda-hat equivalent to lambda, the conclusion of Theorem B.1 (any probabilities F_init, F_term << lambda, any eps > 0, a bounded f_out >= 0 with delta F_init(S) + delta F_term(S) < eps) holds if and only if (pi, lambda-hat) is ergodic. Sufficiency: the transfer operator T is a contraction of L2(lambda-hat) whose fixed points are constant under ergodicity, so by von Neumann's mean ergodic theorem the range of I - T is dense in the mean-zero subspace; explicitly (I - T) sum_{t<N} (1 - t/N) T^t h = h - (1/N) sum_{t=1..N} T^t h -> h for mean-zero h (a Cesaro-weighted Neumann series; the paper sums the series itself, which needs mixing), and a constant, a 0-flow since lambda-hat is invariant, makes the outflow non-negative at vanishing cost. Necessity: an invariant set A with 0 < lambda(A) < lambda(S) gives, for F_init = lambda|_A / lambda(A) and F_term = lambda|_{A^c} / lambda(A^c), delta F_init(S) + delta F_term(S) >= 2 for every outflow F_out << lambda. Hence the mixing clause of l.775 can be dropped; Theorem 3.4 (l.277) holds for any family containing such an ergodic pi; l.238 ('Ergodicity guarantees ...') is right in its epsilon form; l.697-698 ('the technical assumption of L2-mixing summability needed for universality') and l.702 ('essential to ensure universality') are wrong, and l.271's contrast misleading (Cesaro convergence is what suffices). For Theorems 3.5-3.6 (C-28): ergodicity of the group generated by the moves suffices, so one ergodic affine map suffices on tori, against l.698's 'two transformations'. The follow-up's sentence 'Universality then does need mixing' (GFNCertified, body/04_universality.tex) has the same issue. Routes to proved: EGF.universality_of_ergodic, EGF.not_universal_of_not_ergodic, EGF.universal_iff_ergodic (T-egf-universality-ergodic) and EGF.universality_of_ergodic_family (T-egf-families). Status note (master, 2026-11-21, AUDIT-1 of T-egf-universality-ergodic): `proved` covers the equivalence (the anchors); the refutation of l.697-698 and l.702 ('mixing is needed') rests on witnesses that are universal (EGF.isUniversalPolicy_addCircle, EGF.Swap.isUniversalPolicy_policy) but whose non-mixing is not yet in Lean (T-egf-mixing-criteria). Adoption is OQ-85."
anchor = ["EGF.universality_of_ergodic", "EGF.not_universal_of_not_ergodic", "EGF.universal_iff_ergodic", "EGF.universality_of_ergodic_family", "EGF.isUniversalFamilyEps_fixedPolicyFamily_iff"]
basis = ["OQ-85"]
status = "proved"
corrected = '''Theorem B.1: \emph{Let $(\Statespace,\lambda)$ be a measured space with $\lambda$ finite and $\ForwardPolicyStar$ a Markov kernel on $\Statespace$ which admits a finite invariant measure $\widehat\lambda$ equivalent to $\lambda$ for which it is ergodic. Then for any probability distributions $\Finit,\Fterm\ll\lambda$ and any $\varepsilon>0$ there is a bounded $\foutstar\geq0$ such that the generative flow $(\ForwardPolicyStar,\foutstar)$ from $\Finit$ to $\Fterm$ has $\delta\Finit(\Statespace)+\delta\Fterm(\Statespace)<\varepsilon$. Conversely, if $\ForwardPolicyStar$ is not ergodic for $\widehat\lambda$, some such pair has $\delta\Finit(\Statespace)+\delta\Fterm(\Statespace)\geq2$ for every $\foutstar$.} Summable $L^2$-mixing (Definition 3.3) gives the outflow as a convergent series; universality itself needs only ergodicity. Theorem 3.4: replace ``some summably $L^2$-mixing $\ForwardPolicyStar$'' by ``some $\ForwardPolicyStar$ ergodic for a finite invariant measure equivalent to $\lambda$''. Section 6 (l.697--702): $L^2$-mixing summability is not needed for universality.'''
summary = "Universality (Theorems B.1 and 3.4) holds under ergodicity alone, which is also necessary; summable L2-mixing is not needed."
added_hypotheses = ["the invariant measure equivalent to lambda is finite (automatic under the Walters reading of 'ergodic on (S, lambda)', OQ-47)"]
batch = "T-egf-correct-ergodicity"

[[correction]]
