[[correction]]
id = "C-29"
label = "theo:universality_true"
where = "Theorem B.1 and Theorem 3.4: the mixing hypothesis; l.238, l.271 and the limitations of Section 6"
printed = ["main.tex:775", "main.tex:277", "main.tex:238", "main.tex:261", "main.tex:271", "main.tex:697-698", "main.tex:702"]
kind = "strengthening"
finding = "Summable L2-mixing is not needed for universality. For a Markov kernel pi with a finite invariant measure lambda-hat equivalent to lambda, the conclusion of Theorem B.1 (any probabilities F_init, F_term << lambda, any eps > 0, a bounded f_out >= 0 with delta F_init(S) + delta F_term(S) < eps) holds if and only if (pi, lambda-hat) is ergodic. Sufficiency: the transfer operator T is a contraction of L2(lambda-hat) whose fixed points are constant under ergodicity, so by von Neumann's mean ergodic theorem the range of I - T is dense in the mean-zero subspace; explicitly (I - T) sum_{t<N} (1 - t/N) T^t h = h - (1/N) sum_{t=1..N} T^t h -> h for mean-zero h (a Cesaro-weighted Neumann series; the paper sums the series itself, which needs mixing), and a constant, a 0-flow since lambda-hat is invariant, makes the outflow non-negative at vanishing cost. Necessity: an invariant set A with 0 < lambda(A) < lambda(S) gives, for F_init = lambda|_A / lambda(A) and F_term = lambda|_{A^c} / lambda(A^c), delta F_init(S) + delta F_term(S) >= 2 for every outflow F_out << lambda. Hence the mixing clause of l.775 can be dropped; Theorem 3.4 (l.277) holds for any family containing such an ergodic pi; l.238 ('Ergodicity guarantees ...') is right in its epsilon form; l.697-698 ('the technical assumption of L2-mixing summability needed for universality') and l.702 ('essential to ensure universality') are wrong, and l.271's contrast misleading (Cesaro convergence is what suffices). For Theorems 3.5-3.6 (C-28): ergodicity of the group generated by the moves suffices, so one ergodic affine map suffices on tori, against l.698's 'two transformations'. The follow-up's sentence 'Universality then does need mixing' (GFNCertified, body/04_universality.tex) has the same issue. Routes to proved: EGF.universality_of_ergodic, EGF.not_universal_of_not_ergodic, EGF.universal_iff_ergodic (T-egf-universality-ergodic) and EGF.universality_of_ergodic_family (T-egf-families). Status note (master, 2026-11-21, AUDIT-1 of T-egf-universality-ergodic): `proved` covers the equivalence (the anchors); the refutation of l.697-698 and l.702 ('mixing is needed') rests on witnesses that are universal (EGF.isUniversalPolicy_addCircle, EGF.Swap.isUniversalPolicy_policy) but whose non-mixing is not yet in Lean (T-egf-mixing-criteria). Adoption is OQ-85. Update (2026-11-21, T-egf-mixing-criteria graduated): the witnesses' non-mixing is now in Lean (EGF.Swap.universal_not_summablyMixing, EGF.universal_not_summablyMixing_addCircle, EGF.not_isSummablyL2Mixing_of_map_eq), so l.697 and l.702 are refuted in the reading 'summable mixing is necessary for universality'; in the reading 'the hypothesis Theorem 3.4 is stated under' they are not false. One translation of the circle does not contradict l.698's 'two transformations are sufficient'. Amended by the master (2026-11-22, on the planner's analysis): the sentence on the convergent series now says 'when lambda itself is invariant', the only case in which a convergent series is proved (C-21's remark); for lambda-hat != lambda only universality is proved (EGF.main_universality). The theorem's statement, which DEC-144 rules, is unchanged. CHECK-1 of T-egf-correct-ergodicity (major finding 2): the lead-in to Theorem 3.4 (l.261, 'a sufficiently strong ergodic policy ... More precisely,' before Definition 3.3) and l.271's Cesaro contrast still announced the old hypothesis; l.261 added to printed and both given corrected texts. The applied form writes a reference to the label def:summably_mixing and no emph (the theorem style is plain)."
