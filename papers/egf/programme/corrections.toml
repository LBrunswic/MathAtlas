status = "applied"
corrected = '''Theorem B.1: Let $(\Statespace,\lambda)$ be a measured space with $\lambda$ finite and $\ForwardPolicyStar$ a Markov kernel on $\Statespace$ which admits a finite invariant measure $\widehat\lambda$ equivalent to $\lambda$ for which it is ergodic. Then for any probability distributions $\Finit,\Fterm\ll\lambda$ and any $\varepsilon>0$ there is a bounded $\foutstar\geq0$ such that the generative flow $(\ForwardPolicyStar,\foutstar)$ from $\Finit$ to $\Fterm$ has $\delta\Finit(\Statespace)+\delta\Fterm(\Statespace)<\varepsilon$. Conversely, if $\ForwardPolicyStar$ is not ergodic for $\widehat\lambda$, some such pair has $\delta\Finit(\Statespace)+\delta\Fterm(\Statespace)\geq2$ for every $\foutstar$. When $\lambda$ itself is invariant, summable $L^2$-mixing (Definition~\ref{def:summably_mixing}, a label added to Definition 3.3) gives the outflow as a convergent series (see the remark after the proof); universality itself needs only ergodicity. Theorem 3.4: replace ``some summably $L^2$-mixing $\ForwardPolicyStar$'' by ``some $\ForwardPolicyStar$ ergodic for a finite invariant measure equivalent to $\lambda$''. Section 6 (l.697--702): $L^2$-mixing summability is not needed for universality. l.261: ``The next theorem states that if the family contains an ergodic policy $\ForwardPolicyStar$, then the family is universal. We first recall a stronger property, which Theorem~\ref{theo:universality} does not need.'' l.271, its second sentence: ``Ergodicity alone ensures the convergence of $\varphi\pi^n$ only in the much weaker Ces\`aro sense, and this is enough for universality (Theorem~\ref{theo:universality}, Appendix~B.1).'''''
