anchor = ["EGF.inflow_ac_of_map_ac", "EGF.InflowAC.of_map_ac", "EGF.inflow_eq_withDensity_of_map_ac", "EGF.IsEGFPolicy.inflow_eq_sum_map", "EGF.map_ac_of_diffeomorph", "EGF.pinsker_negative_control_nonsingular"]
basis = ["OQ-55", "DEC-141"]
status = "applied"
corrected = '''At l.196: ``the latter presupposes $\Finstar\ll\lambda$, which holds for an EGF since its moves are nonsingular (Section \ref{sec:fundamentals_EGF})''. After l.230: ``Denote by $(\Phi_i)_\#\mu := \mu(\Phi_i^{-1}(\cdot))$ the image of a measure $\mu$ by $\Phi_i$. For an EGF, $\Finstar = \sum_i (\Phi_i)_\#(\forwardalpha^i \Foutstar) \ll \lambda$ because $\Foutstar \ll \lambda$ and each $\Phi_i$ is nonsingular, $(\Phi_i)_\#\lambda \ll \lambda$ (true for diffeomorphisms and the Riemannian volume); hence $\finstar$ exists ($\lambda$ being $\sigma$-finite).'''''
summary = "The existence of the inflow density f_in* is now derived: the moves Phi_i are nonsingular, (Phi_i)_# lambda << lambda, so F_in* << lambda."
added_hypotheses = ["(Phi_i)_# lambda << lambda for each i (nonsingular moves; automatic for diffeomorphisms and a smooth volume)"]
