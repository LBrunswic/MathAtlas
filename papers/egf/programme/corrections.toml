ive sentence for d = 3 (through SO(3) = SU(2)/{±1}) has no anchor (AUDIT-1 finding 3); it waits on T-egf-spectral-gap-so3, or on a corrected text that quotes it as a cited consequence. Planner (2026-11-22): the corrected text below no longer states the d = 3 consequence, so it is anchored without the stretch T-egf-spectral-gap-so3: Theorem 1 quoted as its authors state it (EGF.BourgainGamburdTheorem1, a faithful named Prop under DEC-141, ledger bucket C), the failure of the SO(d) analogue at SO(2) (the refutation, with eigenvalues cos(k theta) -> 1 on mean-zero functions, EGF.so2Witness_eigen), and Theorem 3.6 resting on ergodicity, not on a spectral gap (EGF.universality_sphere_of_ergodic, EGF.universality_sphere_iff; the density condition that gives the ergodicity is C-28's and C-49's, and for d >= 2 waits on T-egf-sphere-dense-ergodic, so the sentence here does not name it): every clause of the corrected text is anchored today. If T-egf-spectral-gap-so3 closes, the d = 3 sentence can return as a strengthening entry of its own. For the master: added_hypotheses becomes [] (the d = 3 hypothesis served only the dropped sentence); anchor += EGF.so2Witness_eigen, EGF.not_hasBGSpectralGap_sphere_two. Proved (2026-11-22): the corrected text's last clause (Theorem 3.6 rests on ergodicity, not on a spectral gap) by T-egf-sphere-dense-ergodic (EGF.universality_sphere, EGF.ergodicSMul_rotSphere, EGF.ae_const_of_dense_rotations); the eigenvalue sentence by EGF.so2Witness_eigen (eigenvalues arbitrarily close to 1; the text no longer names them cos(k theta)). The unanchored d = 3 sentence was dropped by the planning run of 2026-11-22. Adopted under DEC-141 and DEC-187."
