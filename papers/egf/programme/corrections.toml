[[correction]]
id = "C-11"
label = "theo:negative_control"
where = "Theorem 3.8 and Theorem C.1"
printed = ["main.tex:327", "main.tex:850"]
kind = "convention"
finding = "The bound needs TV(mu||nu) = 1/2 ||mu - nu|| = sup_A |mu(A) - nu(A)|: on a two-point example the unhalved norm is 1 against the bound 1/2. The paper uses the 1/2 at l.338 but not at l.327 and l.850; the proof's last step (l.863-866) needs TV <= 1. The bound is sharp."
refutation = ["EGF.TwoPoint.negative_control_sharp"]
anchor = ["EGF.main_quantitative_sampling"]
basis = ["OQ-60", "DEC-141"]
