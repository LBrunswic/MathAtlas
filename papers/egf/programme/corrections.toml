[[correction]]
id = "C-1"
label = "cor:pinsker_negative_control"
where = "Corollary 3.10"
printed = ["main.tex:362", "main.tex:379"]
kind = "false"
finding = "delta f_init = min(0, f_init + f_in - f_out) is <= 0, so delta <= 0 and the right side of (equ:control_pinsker) is negative for every flow with 0 < e := (F_init + F_in - F_out)^-(S) < 1; a two-point instance gives the bound -1."
refutation = ["EGF.printed_false_of_mem_Ioo", "EGF.Swap.printed_pinsker_negative_control_false"]
anchor = ["EGF.pinsker_negative_control", "EGF.pinsker_negative_control_density", "EGF.pinsker_negative_control_real"]
basis = ["OQ-66"]
status = "proved"
corrected = '''$\deltafinit := \max\left(0, -(\finit+\finstar-\foutstar)\right)$, the negative part (as in Definition 3.7), so that $\delta = \int \deltafinit\, d\lambda = (\Finit+\Finstar-\Foutstar)^-(\Statespace) \geq 0$.'''
summary = "delta f_init is the negative part max(0, -(f_init + f_in - f_out)); with the printed min(0, .) the bound of Corollary 3.10 is negative, hence false."
added_hypotheses = []
batch = "T-egf-correct-sign"

