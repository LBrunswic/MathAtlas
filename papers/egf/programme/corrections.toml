# The EGF corrections register (DEC-141): every place where formalizing found the paper wrong or
# short, what replaces it, and how far the replacement has got. Checked by
# `python3 tools/corrections.py check`; the schema and the rules are in that tool's docstring.
#
# Written by the egf-planner (new `found` entries) and the /egf-programme master (statuses, via
# `tools/corrections.py set`). The paper-corrector applies only `adopted` entries, to the v2 working
# copy (~/Dropbox/ErgodicGFN arXiv/source/main.tex); the author reviews the applied diff.
#
# Line numbers: legacy/orig/main.tex = the camera-ready = the v2 working copy before corrections
# (legacy/labeled differs only by \label inside lines, so the ledger's lines are the same).
#
# fields  required: id (C-n), printed (main.tex:<line> or a list), kind, finding, status.
#         kind      false | missing-hypothesis | gap | convention | typo | strengthening
#         status    found -> proved -> adopted -> applied -> reviewed (only forward)
#         label     the ledger row, when the place is one;  where: a human name for the place
#         refutation  Lean declaration(s) refuting the printed form (required for `false`)
#         anchor    Lean declaration(s) proving the corrected form (required from `proved`, not for a typo)
#         basis     the OQ/DEC rows it rests on; `adopted` needs a DEC row (only the author rules)
#         corrected the replacement text (TeX allowed);  summary: one line for the "Changes from v1" list
#         added_hypotheses  the assumptions the correction adds (a list, maybe empty; required from `adopted`)
#         v2_commit the v2 commit that applied it;  review: when and how the author read it
#         batch     the `correct` target of papers/egf/programme/roadmap.toml that applies it
#
# Seeded 2026-11-21 from papers/egf/ledger/LEDGER.md ("What formalizing found in the paper") and
# certificate/curation.toml `paper_findings`. Proposed `corrected` texts are proposals until adopted.

