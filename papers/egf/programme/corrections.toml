# The inflow and the backward policy (OQ-55, and the author's ruling of 2026-11-21 on F_in domination)
#                                                                                       batch C-backward

[[correction]]
id = "C-6"
where = "the density of the star inflow"
printed = ["main.tex:196", "main.tex:231-234"]
kind = "missing-hypothesis"
finding = "f_in* = dF_in*/d lambda presupposes F_in* = F_out* pi* << lambda, which no statement lists. For an EGF it follows from the diffeomorphism decomposition of the policy (the author, 2026-11-21): F_out* pi* = sum_i (Phi_i)_# (alpha^i F_out*) << sum_i (Phi_i)_# lambda << lambda as soon as every Phi_i is nonsingular, (Phi_i)_# lambda << lambda, which holds for diffeomorphisms and a smooth volume, for Haar measure on tori and for isometries of the sphere. Proved today under (Phi_i)_# lambda = J_i lambda; the bare nonsingular form is T-egf-inflow-nonsingular."
anchor = ["EGF.inflowAC_of_isEGFPolicy"]
basis = ["OQ-55"]
status = "found"
corrected = '''For an EGF, $\Finstar = \sum_i (\Phi_i)_\#(\forwardalpha^i \Foutstar) \ll \lambda$ because each $\Phi_i$ is nonsingular, $(\Phi_i)_\#\lambda \ll \lambda$ (true for diffeomorphisms and the Riemannian volume); hence $\finstar$ exists.'''
summary = "The existence of the inflow density f_in* is now derived: the moves Phi_i are nonsingular, (Phi_i)_# lambda << lambda, so F_in* << lambda."
added_hypotheses = ["(Phi_i)_# lambda << lambda for each i (nonsingular moves; automatic for diffeomorphisms and a smooth volume)"]
batch = "T-egf-correct-backward"

