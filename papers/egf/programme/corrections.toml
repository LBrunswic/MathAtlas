ery subgroup of Aff(T^1) is abelian, hence amenable, so (ii) always holds (EGF.bgConditionII_dim_one), and no finite set of rotations of S^1 has a spectral gap (EGF.not_hasBGSpectralGap_sphere_two); (c) the theorems also need the model rich enough (C-31). With C-29 every condition reduces to ergodicity of the group generated by the moves: on tori it follows from not-(ii) through Theorem 5 (a spectral gap excludes invariant vectors, EGF.ergodic_of_hasSpectralGap), and from any affine map in the group whose linear part has no periodic integer vector: the cat map [[2,1],[1,1]] is the linear part of the commutator T S T^{-1} S^{-1}, which lies in the group of the minimal four moves for every choice of their translations (one such map suffices, against l.698's count); on T^1 it follows from a translation of infinite order; on spheres from density in SO(d+1), with no algebraicity and no inverse-stability, for every d >= 1. For l.293's 'in any dimension' with linear parts generating SL_d(Z): d = 2 by the cat map; d = 1 needs an irrational translation part (SL_1(Z) is trivial); d >= 3 rests on l.821 (SL_d(Z) contains a free group, so the projections of (ii) are never amenable; kept as printed, cited, not formalized), unless the stretch of T-egf-tori-minimal (an explicit element of SL_d(Z) without periodic integer vector) lands. Routes to proved: EGF.BekkaGuivarchTheorem5, EGF.universality_tori, EGF.universality_tori_of_ergodic (T-egf-families, graduated 2026-11-21, EGF/TorusFamilies.lean); EGF.ergodic_torusAffine_of_noPeriodic, EGF.universality_tori_minimal, EGF.universality_tori_one (T-egf-tori-minimal, ready); EGF.BourgainGamburdTheorem1, EGF.universality_sphere_of_ergodic, EGF.universality_sphere_iff, EGF.universality_sphere_one_of_dense (T-egf-families-sphere, graduated 2026-11-22, EGF/SphereFamilies.lean); EGF.universality_sphere, density in SO(d+1) for d >= 2 (T-egf-sphere-dense-ergodic, ready). Stays found until those two targets land, then the master adds their anchors. The l.307 omission of density (EGF.not_universality_sphere_identity), recorded here by T-egf-families-sphere, is its own entry from 2026-11-22: C-49. Batch moved from T-egf-correct-defs to T-egf-correct-families by T-egf-plan-wave-1 (it shares its sentences with C-31). Both halves proved (2026-11-22): the tori half by T-egf-tori-minimal (EGF/ToriMinimal.lean, AUDIT-1 minor): an affine map without periodic integer vector is ergodic (Fourier), the cat map T S T^-1 S^-1 lies in the group of the minimal four moves for every choice of translations, so they and the l.440 moves (both readings of C-34) give universal families, l.293 holds for every d >= 2 (the stretch landed: every SL_d(Z) has an element without periodic vector, EGF.exists_noPeriodicVector_det_one; so d >= 3 no longer rests on l.821) and fails at d = 1, where one irrational translation suffices; the sphere half by T-egf-sphere-dense-ergodic (EGF/SphereDense.lean, AUDIT-1 minor): density in SO(n), n >= 2, gives ergodicity (Fubini and Mathlib's aeconst_of_dense_aestabilizer_smul) and universality with no algebraicity, inverse-stability or spectral gap. The reading d >= 1 for S^d is AUDIT-1's finding 1 (added to the corrected text). Adopted under DEC-141 (missing hypotheses, corrected form proved), DEC-144 (ergodicity) and DEC-187 (the cited spectral-gap theorems as named Props)."
