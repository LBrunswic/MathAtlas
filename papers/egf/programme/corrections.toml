corrected = '''Theorem 3.5: An affine toroidal family is a universal EGF family provided its model realizes the uniform policy $\forwardalpha^i\equiv\frac1p$ and a set of outflows dense in the non-negative cone of $L^2(\Statespace,\lambda)$ (C-31), and the group generated by the $(\Phi_i)_{i=1}^p$ acts ergodically on $(\mathbb T^d,\lambda)$; this holds when that group has no non-trivial invariant factor torus on which its linear part projects to an amenable group (Theorem 5 of \citet{bekka2015spectral}), and when it contains an affine map whose linear part has no periodic integer vector (e.g. $T(STS^{-1})^{-1}=\begin{pmatrix}2&1\\1&1\end{pmatrix}$ for the minimal four moves) or, on $\mathbb T^1$, a translation of infinite order. Theorem 3.6: An isometry spherical family is a universal EGF family provided its model realizes $\forwardalpha^i\equiv\frac1p$ and a set of outflows dense in the non-negative cone of $L^2(\Statespace,\lambda)$ (C-31), and the $\Phi_i$ generate a dense subgroup of $\mathrm{SO}_{d+1}(\mathbb R)$, $d\geq1$. l.293: ``The `technical assumptions' above are in particular satisfied, for $d\geq2$, if the group generated by the linear parts of the $\Phi_i$ is the whole group $\mathrm{SL}_d(\mathbb Z)$ (Appendix~B.2; for $d=2$ the group then contains an affine map with linear part $\begin{pmatrix}2&1\\1&1\end{pmatrix}$, which has no periodic integer vector), and for $d=1$ if one translation part is irrational.'' l.836: ``With the technical condition `the group generated by $(\Phi_i)_{i=1}^p$ is dense in $\mathrm{SO}_{d+1}(\mathbb R)$', Theorem~\ref{theo:universality_sphere} follows from master Theorem~\ref{theo:universality_true}, since the group then acts ergodically on $\mathbb S^d$, $d\geq1$.'' l.818--820, replaced by: ``If condition $(ii)$ of Theorem~\ref{theo:spectral_gap_tori} is false for the group generated by the $(\Phi_i)_{i=1}^p$, then the action of that group has a spectral gap, hence is ergodic: a set $A$ invariant under the group would give the invariant mean-zero function $\mathbf 1_A-\lambda(A)$. Since each $\Phi_i$ keeps the Lebesgue measure $\lambda$ invariant, the policy $\forwardalpha^i=\frac1p$ is then ergodic for $\lambda$, and by master Theorem~\ref{theo:universality_true} the family is universal. Our technical condition of Theorem~\ref{theo:universality_tori} is then `the group generated by $(\Phi_i)_{i=1}^p$ violates condition $(ii)$'.'' (the inverse-stability of l.820 is not needed; this replacement also covers C-33's l.818 typo).'''
