corrected = '''Replace the proof of Theorem~\ref{theo:universality_true} (l.778--804) by: ``\emph{Sufficiency.} Let $\varepsilon>0$ and $\eta=\varepsilon/5$; norms of signed measures are total variation norms. Truncating their densities, choose probability measures $\mu_0=a\lambda$, $\mu_1=b\lambda$ with $a,b\leq K\frac{d\widehat\lambda}{d\lambda}$ for some $K<\infty$ and $\|\Finit-\mu_0\|,\|\Fterm-\mu_1\|<\eta$. Since $\widehat\lambda\ForwardPolicyStar=\widehat\lambda$, every $\mu_j(\ForwardPolicyStar)^t$ is at most $K\widehat\lambda$. The operator $P:h\mapsto\frac{d((h\widehat\lambda)\ForwardPolicyStar)}{d\widehat\lambda}$ is a contraction of $L^2(\widehat\lambda)$ whose fixed points are constant, $\ForwardPolicyStar$ being ergodic for $\widehat\lambda$; by von Neumann's mean ergodic theorem, $\frac1N\sum_{t<N}P^th\to0$ in $L^2(\widehat\lambda)$, hence in $L^1(\widehat\lambda)$, for the mean-zero $h=\frac{d(\mu_0-\mu_1)}{d\widehat\lambda}$, so that some $N\geq1$ has $\big\|\sum_{t<N}(\mu_0-\mu_1)(\ForwardPolicyStar)^t\big\|<N\eta$. Let $R=NK\widehat\lambda$, which is invariant and dominates every $\sum_{t\leq T}\mu_1(\ForwardPolicyStar)^t$, $T<N$, and
\[F=\frac1N\sum_{T<N}\Big(\sum_{t\leq T}\mu_0(\ForwardPolicyStar)^t+R-\sum_{t\leq T}\mu_1(\ForwardPolicyStar)^t\Big)\geq0,\]
a Ces\`aro-weighted Neumann series. Telescoping, $\mu_0+F\ForwardPolicyStar-\mu_1-F=\frac1N\sum_{T<N}(\mu_0-\mu_1)(\ForwardPolicyStar)^{T+1}$, of norm less than $\eta$, the kernel being a contraction for the total variation norm. As $F\ll\lambda$, truncating its density at a level $M$ with $\|F-F_M\|<\eta$ gives a bounded $\foutstar=\frac{dF_M}{d\lambda}$, and $\delta\Finit(\Statespace)+\delta\Fterm(\Statespace)=\|\Finit+\Foutstar\ForwardPolicyStar-\Fterm-\Foutstar\|<5\eta=\varepsilon$.

\emph{Necessity.} If $A$ is measurable with $\ForwardPolicyStar(x,A)=\mathbf 1_A(x)$ for $\widehat\lambda$-almost every $x$ and $0<\lambda(A)<\lambda(\Statespace)$, take $\Finit=\lambda_{|A}/\lambda(A)$ and $\Fterm=\lambda_{|A^c}/\lambda(A^c)$. Every finite $\Foutstar\ll\lambda$ has $(\Foutstar\ForwardPolicyStar)(A)=\Foutstar(A)$, so the defect $\Finit+\Foutstar\ForwardPolicyStar-\Fterm-\Foutstar$ has mass $1$ on $A$ and $-1$ on $A^c$, and $\delta\Finit(\Statespace)+\delta\Fterm(\Statespace)\geq2$.'' (C-21's remark follows the proof.) l.664, its first two sentences: ``Lastly, when $\lambda$ is invariant, $\ForwardPolicyStar$ is summably $L^2$-mixing and $\Finit,\Fterm$ have bounded densities (the remark after the proof of Theorem~\ref{theo:universality_true}), $\foutstar$ can be obtained from the partial sums of a series whose sum is a fixed point of the flow operator $\nu\mapsto\nu\ForwardPolicyStar+\Finit-\Fterm$, some power of which is a contraction on mean-zero densities.'' (replacing ``Lastly, from the proof of the universality Theorem \ref{theo:universality}, \dots\ This operator is a contraction for the affine toroidal family.''; the rest of the paragraph stays).'''
summary = "The proof of Theorem B.1 follows the ergodic route: a Cesaro-weighted Neumann series and von Neumann's mean ergodic theorem, with the converse (an invariant set blocks every outflow)."
added_hypotheses = []
batch = "T-egf-correct-ergodicity"
v2_commit = "0ff8347"

