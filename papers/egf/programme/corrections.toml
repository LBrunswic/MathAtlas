finding = "l.273-274: a Koopman operator whose spectrum on {int phi d lambda = 0} is 'bounded away from 1' need not give summable L2-mixing, nor exponential convergence of the iterates: the spectrum has to stay away from the whole unit circle (spectral radius < 1 on mean-zero functions; for a reversible pi, away from both 1 and -1). On two points with the uniform measure the swap has phi pi = -phi for mean-zero phi: its spectrum there is {-1}, bounded away from 1, while gamma_n = 1 for every n. The same one-sided notion is the one of the cited theorems (Bekka-Guivarc'h: no almost invariant vectors; Bourgain-Gamburd: lambda_1 < 2k), so l.818's 'any pi induced by (equ:forward_policy) has spectral gap if alpha^i = 1/p' needs the generating measure aperiodic before l.273 applies (C-28). Routes to proved (T-egf-mixing-criteria): the refutation EGF.Swap.transfer_eq_neg with EGF.Swap.not_isSummablyL2Mixing (kind missing-hypothesis until it exists) and the corrected criterion EGF.isSummablyL2Mixing_of_pow_contraction (||T^N|| < 1 on mean-zero functions for some N, lambda invariant, gives summable L2-mixing)."
