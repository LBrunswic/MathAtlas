# The EGF programme's roadmap (/egf-programme; papers/egf/programme/README.md).
#
# Same schema as roadmap/roadmap.toml (its header), checked by
#     python3 tools/roadmap.py --file papers/egf/programme/roadmap.toml check
# Written by the egf-planner (proposals) and the /egf-programme loop (status changes); ruled by the
# author (DEC-141 is the standing ruling that set this programme up).
#
# owner   closer        Lean in lean-egf (target-closer, then target-auditor)
#         corrector     one batch of `adopted` corrections applied to the v2 working copy
#                       (paper-corrector, then tex-lean-checker); one at a time
#         experimenter  one experiment of the reproduction repository, on node1 only (egf-experimenter);
#                       one at a time
#         planner       egf-planner: this file and new `found` entries of corrections.toml
#         master        the loop itself: adoption under DEC-141, curation, ledger, packaging
# kind    close | package | research | tooling | author (as in the hub), plus
#         correct  a batch of corrections.toml (its entries name it in `batch`)
#         repro    one experiment of LBrunswic/egf-reproduction (private), run on node1's GPU
# stream  lean | paper | repro | programme

[gates]
# Hub gates allowed to be red when this loop runs (each names why); `roadmap.py gates` reads it.
known_red = []

