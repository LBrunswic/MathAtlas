[[target]]
id = "T-egf-inflow-nonsingular"
title = "F_in << lambda from the diffeomorphism decomposition: nonsingular moves give the inflow density, with no InflowAC or Jacobian hypothesis left for EGFs"
stream = "lean"
kind = "close"
paper = "egf"
labels = ["theo:backward_policy", "cor:pinsker_negative_control"]
status = "ready"
owner = "closer"
priority = 2
evidence = "The author (2026-11-21, DEC-141): 'The fin domination in the context of the paper is a straightforward consequence of the diffeomorphism decomposition of the policy.' State EGF.inflowAC_of_map_ac: an IsEGFPolicy with measurable Phi_i, (Phi_i)_# lambda << lambda for every i and F_out << lambda give InflowAC (F_out pi = sum_i (Phi_i)_#(alpha_i F_out)). Port, by copying with a provenance comment (kb 0001, OQ-1), GFNBounds.Core.EGF.IsEGFPolicy.bind_withDensity (lean/GFNBounds/Core/UniversalityBody.lean:207), GFNBounds.Core.Family.bind_withDensity_ac (FamilyUniversality.lean:373) and GFNBounds.Core.ILBoundFull.inflowAC_of_bind_ac (ILBoundFull.lean:581); no `≃ᵐ` needed. Instances: R^d with Haar measure and Phi_i with differentiable inverse (EGF.map_eq_withDensity_abs_det), the torus (AddCircle^d with Haar measure, affine moves), the sphere (isometries preserve Measure.toSphere). Then restate pinsker_negative_control_density / _real and backward_policy for EGFs in those settings with no InflowAC and no hJ hypothesis. Proves correction C-6 (and C-7's corrected setting)."
added = "2026-11-21"
proposed_by = "egf-programme set-up (DEC-141)"

