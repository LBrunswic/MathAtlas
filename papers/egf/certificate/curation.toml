bucket = "A"
notes = "T-egf-sampling (atlas-team, 2026-11-21), audit AUDIT-1 minor (pathLaw_spec's docstring over-stated the Markov clause, reworded at graduation; two REPORT phrasings). Marked: EGF.main_quantitative_sampling (only F_init ≠ 0), sharp (TwoPoint.negative_control_sharp). Rests on OQ-60 (a), (b). Its appendix restatement theo:negative_control_appendix is the same statement (a twin the ledger does not link)."
paper_findings = ["The bound is sharp. On S = Bool with the identity policy, F_out = 0, F_init = delta_true and F_term = delta_false: delta F_init = delta_false, F_term-hat = delta_true + delta_false, the sampler stops at once at true, and TV(s_tau || F_term-hat/2) = 1/2 = delta F_init(S)/F_term-hat(S) (EGF.TwoPoint.negative_control_sharp).", "The 1/2 of the total variation is needed. On the same example the unhalved norm ||law(s_tau) - F_term-hat/F_term-hat(S)|| = 1 exceeds the bound 1/2 (EGF.TwoPoint.negative_control_sharp, second clause). main.tex:327 says only 'TV the total variation'. main.tex:338 rewrites TV as (1/2) sum |.|, and the proof's last step (main.tex:863-866: TV(s_tau, alpha s_tau + (1 - alpha) Q) = (1 - alpha) TV(s_tau, Q) <= 1 - alpha) needs TV <= 1.", "The flow is not flow matching from F_init to F_term-hat, so the sampler's termination is not given by theo:sampling_theorem. The proof takes it for granted (main.tex:853: 'The sampling distribution s_tau of F is then F_init pi^{tau,F}/F_init(S)'). It holds because F_init <= F_init-hat and the flow matches from F_init-hat: the occupation is dominated by F_term-hat + F_out, so E(tau) <= (F_term-hat(S) + F_out(S))/F_init(S) and tau < inf a.s. (clauses 1-2 of EGF.main_quantitative_sampling). The same gap is noted in GFNBounds.Core.SamplingGeneralBounds.", "main.tex:322 writes the flow (pi*, f_out*) with a density, while the sampler and F_term-hat use the measure F_out* (main.tex:161). This is notation only."]

[[row]]
label = "theo:negative_control_appendix"
extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean", "EGF/Sampling.lean"]
decls = ["EGF.main_quantitative_sampling", "EGF.GenerativeFlow.termLaw_split", "EGF.GenerativeFlow.fterm_univ_eq", "EGF.GenerativeFlow.negative_control_marginal", "EGF.normalize_add_sub_normalize_le", "EGF.tvDist_normalize_add_le", "EGF.tvDist", "EGF.tvDist_eq_iSup", "EGF.isFlowMatching_virtual", "EGF.TwoPoint.negative_control_sharp"]
bucket = "A"
notes = "T-egf-sampling (atlas-team, 2026-11-21), audit AUDIT-1 minor (pathLaw_spec's docstring over-stated the Markov clause, reworded at graduation; two REPORT phrasings). Marked on the same anchor EGF.main_quantitative_sampling as theo:negative_control (the same statement up to a comma; its proof l.852–867 is the one formalized). Rests on OQ-60."
paper_findings = ["The proof (main.tex:852-867) is formalized as written, on measures. The flow is flow matching from F_init-hat to F_term-hat (main.tex:857, EGF.isFlowMatching_virtual). The chains from F_init and from delta F_init share their stopping rule, and their stopped laws add up to F_term-hat (main.tex:858-862, EGF.GenerativeFlow.termLaw_split). A mixture estimate concludes (main.tex:863-866, EGF.tvDist_normalize_add_le). The mass identity of main.tex:854-855 is clause 4 of the anchor.", "main.tex:863 divides by delta F_init(S). That is undefined when delta F_init = 0, where the flow matches from F_init and the bound is 0 (theo:sampling_theorem). The formal mixture estimate (EGF.normalize_add_sub_normalize_le) does not divide by delta F_init(S), so that case needs no separate argument.", "The termination gap and the 1/2 of TV (findings 2-3 of theo:negative_control) concern this proof: main.tex:853 presumes tau < inf a.s., and main.tex:866 needs TV <= 1.", "The ledger links theo:negative_control and theo:negative_control_appendix by no twin, though the statements are identical up to a comma (main.tex:323 vs :846). Both are certified by the one anchor EGF.main_quantitative_sampling. Twinning them is a curation point for the master."]

