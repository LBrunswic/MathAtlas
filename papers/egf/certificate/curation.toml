bucket = "A"
notes = "T-egf-sampling (atlas-team, 2026-11-21), audit AUDIT-1 minor (pathLaw_spec's docstring over-stated the Markov clause, reworded at graduation; two REPORT phrasings). Marked: EGF.sampling_theorem on any measurable space, the sampler constructed (Ionescu-Tulcea, GenerativeFlow.pathLaw), with τ < ∞ a.s. added; agrees with GFNBounds' chainLaw (chainLaw_tendsto_pathLaw, lintegral_stopTime). Rests on the confirmations of OQ-60 (b)."
paper_findings = ["The theorem is cited (main.tex:179, bengio2021flow, brunswic2024theory) and proved here on any measurable space, with no named hypothesis. The proof ports GFNBounds.Core.SamplingGeneral: the sampler's occupation measure is dominated by every super-solution, and (F_term + F_out)/F_init(S) is one.", "main.tex:164: the stopping probability dF_term/d(F_term + F_out*)(s_t) is defined only (F_term + F_out*)-a.e. The footnote at main.tex:164 gives its existence. That the version does not matter is not stated, but it holds: under flow matching the sampler's unstopped mass is dominated by (F_term + F_out)/F_init(S) (EGF.GenerativeFlow.occupation_ac_of_isFlowMatching), so every version gives the same sampler law (EGF.GenerativeFlow.pathLaw_hazard_rnDeriv).", "'s_tau ~ F_term' presupposes tau < inf almost surely, which the statement does not list. It follows from E(tau) < inf and is proved as a clause of EGF.sampling_theorem.", "main.tex:163 indexes the chain '(s_t)_{g >= 1}' for '(s_t)_{t >= 1}' (typo)."]

[[row]]
