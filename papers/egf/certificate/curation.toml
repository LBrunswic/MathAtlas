paper_findings = ["main.tex:273-274 (the remark after the definition; correction C-30, adopted under DEC-141): in the gloss reading (a spectrum bounded away from 1 on mean-zero functions) both sentences are false: the swap of two points has spectrum {-1} there, is not summably mixing and its iterates do not decay (EGF.Swap.transfer_eq_neg, EGF.Swap.not_isSummablyL2Mixing, EGF.not_spectralGapRemarkPrinted); in the operator reading (spectral radius < 1) l.273 lacks only the invariance of lambda (EGF.not_spectralRadiusCriterionWithoutInvariance) and holds with it (EGF.isSummablyL2Mixing_of_pow_contraction), and l.274 is true. conze2013ergodicity not consulted.", "OQ-47: the alternative reading (H normalized in L2(lambda-hat)) is vacuous if lambda-hat may be infinite (EGF.isSummablyL2MixingHat_of_bind_eq, with lambda-hat = infinity * lambda, not sigma-finite): that reading must take lambda-hat sigma-finite; the swap fails it for every finite lambda-hat (EGF.Swap.not_isSummablyL2MixingHat_of_finite).", "main.tex:267: the condition 'int_{s in S} phi(s) = 0' names no measure; main.tex:273 ('the subspace {phi | int phi d lambda = 0}') and the proof of theo:universality_true (main.tex:788: eps_t(S) = 0) fix it as lambda, which is what is formalized.", "main.tex:264-267 integrates (phi pi^n)^2 against lambda-hat while H normalizes in L2(lambda); the proof of theo:universality_true (main.tex:789) integrates against lambda, i.e. treats lambda-hat = lambda.", "The definition is inhabited: on any probability space the resampling kernel pi(x) = lambda is summably L2-mixing with lambda-hat = lambda (EGF.isSummablyL2Mixing_const), so EGF.main_universality is not vacuous (EGF.main_universality_const)."]

