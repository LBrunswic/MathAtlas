label = "cor:pinsker_negative_control"
extra_lean_files = ["EGF/Sampling.lean", "EGF/SamplingCorollaries.lean", "EGF/BackwardPolicy.lean", "EGF/Loss.lean"]
decls = ["EGF.pinsker_negative_control_rev", "EGF.pinsker_negative_control_density_rev", "EGF.pinsker_negative_control_min", "EGF.kl_decomposition", "EGF.klwfmLoss", "EGF.klwfmLossPrinted", "EGF.loss_ge_entropy", "EGF.loss_controls_defect", "EGF.loss_controls_sampling", "EGF.loss_controls_sampling_essSup", "EGF.algBackwardFactor_mem_Ioc", "EGF.cont_kappaHat_ae_eq_forwardFactor", "EGF.pinsker_negative_control_nonsingular", "EGF.loss_controls_sampling_nonsingular", "EGF.Null.printed_kl_decomposition_false_finite", "EGF.Swap3.printed_algBackwardFactor_neg", "EGF.SwapM.printed_loss_tendsto_bot", "EGF.SwapM.loss_lt_entropy", "EGF.reverse_isFlowMatching_iff", "EGF.reverse_cont_ae_eq_backwardFactor", "EGF.printed_reverse_not_isFlowMatching", "EGF.pinsker_negative_control_density", "EGF.pinsker_negative_control", "EGF.pinsker_negative_control_real", "EGF.pinsker_negative_control_isEGF", "EGF.pinsker", "EGF.Pinsker.pinsker", "EGF.tvDist_withDensity", "EGF.klD_rnDeriv_eq_toReal_klDiv", "EGF.dens", "EGF.defectDensity", "EGF.deltaFinitDensity", "EGF.deltaFinitDensityPrinted", "EGF.ftermHatDensity", "EGF.InflowAC", "EGF.integral_deltaFinitDensity", "EGF.integral_deltaFinitDensityPrinted", "EGF.kappaHat_eq_withDensity", "EGF.inferenceDefect_eq_withDensity", "EGF.inflowAC_of_isEGFPolicy", "EGF.PinskerNegativeControlPrinted", "EGF.printed_false_of_mem_Ioo", "EGF.Swap.printed_pinsker_negative_control_false", "EGF.sampling_error_control", "EGF.kappaHat", "EGF.inferenceDefect"]
bucket = "A"
notes = "T-egf-sampling-corollaries (atlas-team, 2026-11-21), audit AUDIT-1 minor (the κ row is a weakening; the printed-form Prop's KL = ∞ caveat; two further sign/direction findings, l.418 and l.423, added here). Closed in its corrected form of record by DEC-141, which rules OQ-66 (δf_init is the negative part; corrections C-1, C-4 adopted, papers/egf/programme/corrections.toml); the strict module carries the mark (EGF/SamplingCorollaries.lean:13). False as printed (the sign of δf_init), the printed form kept as EGF.PinskerNegativeControlPrinted beside its refutation; proved under the negative part: EGF.pinsker_negative_control (measure form), pinsker_negative_control_density, _real, pinsker_negative_control_isEGF. Pinsker ported verbatim from GFNBounds' ILBoundFull as EGF.pinsker, with Mathlib's klDiv (no import of GFNBounds). T-egf-loss (egf-programme, 2026-11-21, audit AUDIT-1 minor: the b conditions worded as sufficient, Corollary 3.10 quoted, the ⊤ conditions, the l.400 finding marked as a reading; fixed at graduation) adds EGF/Loss.lean: Eq. (15) with the negative part (EGF.klwfmLoss), the KL decomposition in its true direction and Corollary 3.10 for KL(κ ‖ κ̂/κ̂(𝒮)) (C-5 adopted), the loss controlling the sampling error for b ≥ 1 + ‖dλ/dν_train‖_∞ (C-2 adopted; C-35, which weak-FM term is of record, is OQ-84), Algorithm 1's factors in (0, 1] (C-3 adopted; which law the backward buffer holds is OQ-83), and the forms for EGFs with nonsingular moves (C-6)."
paper_findings = ["main.tex:418: the printed decomposition KL(κ̂/κ̂(𝒮) ‖ κ) = cross-entropy + log-normalization − H(κ) is false even with both sides finite: on Bool with no outflow, F_init uniform and κ = ¼δ_true + ¾δ_false, the two sides are ¾ log 3 − log 2 and log 2 − ½ log 3, which differ since 2⁸ ≠ 3⁵ (EGF.Null.printed_kl_decomposition_false_finite). It holds for KL(κ ‖ κ̂/κ̂(𝒮)) (EGF.kl_decomposition), the divergence the cross-entropy of Eq. (15) controls, and Corollary 3.10 holds for it too (EGF.pinsker_negative_control_rev). Correction C-5.", "main.tex:366: b > 0 is not enough for the loss to control anything: with ν_train = λ and b < log 2 the loss lies below the entropy (EGF.SwapM.loss_lt_entropy); b ≥ N gives the floor and b ≥ 1 + N the control of the sampling error, N = ‖dλ/dν_train‖_∞ (EGF.loss_ge_entropy, EGF.loss_controls_sampling_essSup; sufficient, not shown necessary). With the printed sign the loss is unbounded below while the defect grows (EGF.SwapM.printed_loss_tendsto_bot). Corrections C-2, C-35 (OQ-84).", "main.tex:396-404 (Algorithm 1): with the printed sign the backward factor of l.400 can be negative (EGF.Swap3.printed_algBackwardFactor_neg; C-3). If the backward buffer holds paths of the sampler run backwards (the reversed flow, flow matching from κ̂ to F_init + δF_init, EGF.reverse_isFlowMatching_iff), its continuation probability is (1 + (f_init + δf_init)/f_in)⁻¹ (EGF.reverse_cont_ae_eq_backwardFactor) and l.400 omits f_init; which law the buffer holds is not printed (l.392): OQ-83.", "False as printed. main.tex:362 defines delta f_init = min(0, f_init + f_in* - f_out*), which is <= 0 (EGF.deltaFinitDensityPrinted_nonpos), so delta = int delta f_init d lambda = -(F_init + F_in - F_out)^-(S) <= 0 (main.tex:379; EGF.integral_deltaFinitDensityPrinted). At the target probability kappa := kappa-hat/kappa-hat(S) the divergence is 0 and the printed right side is -e/(1 - e) < 0 <= TV, for every flow with 0 < e := (F_init + F_in - F_out)^-(S) < 1 whose densities exist (EGF.printed_false_of_mem_Ioo).", "A two-point instance (EGF.Swap.printed_pinsker_negative_control_false): S = Bool, lambda the counting measure, the swap policy b -> not b, F_out = (1/2) delta_false, F_init = delta_true, kappa = kappa-hat/kappa-hat(S) = delta_true. Every presupposition holds (F_init, F_out, F_in << lambda). The printed delta is -1/2, the negative-part delta is 1/2, KL = 0, and the printed bound is -1.", "With delta the negative-part mass, as def:virtual_flows (main.tex:316, (.)^-) and cor:sampling_error_control (main.tex:333, (.)^-(S)) define it, the corollary holds: in measures (EGF.pinsker_negative_control), in the paper's densities with delta f_init := max(0, -(f_init + f_in - f_out)) = -min(0, .) (EGF.pinsker_negative_control_density), in R when KL < inf (EGF.pinsker_negative_control_real), and for an EGF with no named hypothesis (EGF.pinsker_negative_control_isEGF). The proof (none is printed) is cor:sampling_error_control with Pinsker on its second term, kappa being a probability.", "The same sign reaches the loss, outside this target's labels: equ:weakFM (main.tex:363-365) penalizes b E_{nu_train} delta f_init, and Algorithm 1 (main.tex:395, and p_t at main.tex:400 through delta f_init/f_in*) uses delta f_init. With delta f_init <= 0 that penalty rewards the negative part instead of controlling it, against main.tex:368 ('controls only the negative part of the FM defect'). GFNBounds reads delta f_init as e^- = max(-e, 0) (GFNBounds.Core.wklfmLoss, lean/GFNBounds/Core/ILBound.lean), the reading taken here. The dispatch cites the definition at l.363; in papers/egf/legacy/labeled/main.tex it is l.362.", "Pinsker's inequality is cited by name only (main.tex:370) and is absent from Mathlib at fabf563a, which has klDiv. It is proved here: GFNBounds' density statement copied (EGF.Pinsker.pinsker), identified with tvDist (EGF.tvDist_withDensity, equality, via Mathlib's Measure.withDensity_sub) and with klDiv (EGF.klD_rnDeriv_eq_toReal_klDiv), and restated for probability measures (EGF.pinsker).", "F_in* << lambda is presupposed by f_in* := dF_in*/d lambda (main.tex:196). For a general flow it is the named hypothesis EGF.InflowAC. For an EGF it is a theorem under Phi_i push lambda = J_i lambda (OQ-55's form (c), which contains (a) and (b)), so the EGF instance holds whatever OQ-55 rules; only the printed 'lambda << Lebesgue' fails (EGF.printed_inflow_not_ac, OQ-55's own finding).", "main.tex:418 (AUDIT-1): the KL decomposition there is KL(κ ‖ κ̂/κ̂(𝒮)), the reverse of the direction printed at l.377; the cross-entropy of equ:weakFM and the claim at l.413 connect to the corollary only through the reverse direction (the corollary holds in both).", "main.tex:423 (AUDIT-1): ∫ f̂_term = 1 + ∫ δf_init is false under the printed sign (min(0, ·)) and true under the negative-part reading: the paper's own evidence for that reading."]
