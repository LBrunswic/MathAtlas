extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean", "EGF/UniversalityErgodic.lean"]
decls = ["EGF.universality_of_ergodic", "EGF.isUniversalPolicy_of_ergodic", "EGF.not_universal_of_not_ergodic", "EGF.isKernelErgodic_of_isUniversalPolicy", "EGF.universal_iff_ergodic", "EGF.universality_of_ergodic_family", "EGF.isUniversalFamilyEps_fixedPolicyFamily_iff", "EGF.IsKernelErgodic", "EGF.isKernelErgodic_egfKernel_uniform", "EGF.isKernelErgodic_of_isSummablyL2Mixing", "EGF.exists_tvMass_cesaro_lt_of_ergodic", "EGF.isUniversalPolicy_addCircle", "EGF.Swap.isUniversalPolicy_policy", "EGF.main_universality", "EGF.main_universality_of_tendsto", "EGF.main_universality_const", "EGF.trivial_of_lamHat_univ_eq_top", "EGF.trivial_of_lamHat_univ_eq_top_of_ne_top", "EGF.exists_tvMass_pushIter_lt", "EGF.exists_tvMass_pushIter_lt_of_tendsto", "EGF.exists_truncation", "EGF.tvMass_construction", "EGF.eq_of_trivial", "EGF.tvMass", "EGF.errors_eq_tvMass", "EGF.initialError", "EGF.terminalError", "EGF.initialError_eq_negPart", "EGF.terminalError_eq_posPart", "EGF.lintegral_transfer_sq_le", "EGF.transfer_zero_ae"]
bucket = "A"
notes = "T-egf-headline (atlas-team, 2026-11-20), audits AUDIT-1 minor (fixed in round 1) and AUDIT-2 minor (three wording points, fixed at graduation and here). Marked in EGF/Universality.lean, sorry-free. Lean ≥ paper: no Polish structure, no L² densities of F_init, F_term, no ergodicity or invariance of λ assumed; f_out bounded. The general form EGF.main_universality_of_tendsto needs only γ₀ < ∞ and γₙ → 0. Rests on the reading of def:summably_mixing, ruled by DEC-145 (OQ-47: the L²(λ) reading taken). T-egf-universality-ergodic (egf-programme, 2026-11-21, audit AUDIT-1 minor: two REPORT findings qualified, the port claim of SCOPE; fixed at graduation) adds EGF/UniversalityErgodic.lean: for a finite invariant λ̂ ~ λ the conclusion holds iff π is ergodic for λ̂ (EGF.universal_iff_ergodic; correction C-29, proved; DEC-144 (OQ-85) restates Theorems B.1 and 3.4 under ergodicity in v2: C-29 adopted). The mark stays on EGF.main_universality, the printed form."
paper_findings = ["main.tex:775: summable L2-mixing is not needed. For a Markov kernel with a finite invariant measure lambda-hat equivalent to lambda, the conclusion holds if and only if the kernel is ergodic for lambda-hat (EGF.universality_of_ergodic: Cesaro-weighted Neumann series and von Neumann's mean ergodic theorem; EGF.universal_iff_ergodic), and the necessity needs no invariant measure at all (EGF.not_universal_of_not_ergodic). Mixing implies ergodicity (EGF.isKernelErgodic_of_isSummablyL2Mixing, formalizing the sketch below), so the printed 'ergodic' is redundant beside mixing. 'Ergodic' here is for lambda-hat, not the topological ergodicity of def:egf (OQ-48). Correction C-29 (OQ-85).", "main.tex:697-698, :702 ('mixing is needed / essential'): a translation of infinite order of the circle and the swap of two points are universal policies (EGF.isUniversalPolicy_addCircle, EGF.Swap.isUniversalPolicy_policy) and not summably L2-mixing (EGF.Swap.universal_not_summablyMixing, EGF.universal_not_summablyMixing_addCircle; no measure-preserving automorphism of a sigma-finite lambda is, EGF.not_isSummablyL2Mixing_of_map_eq): l.697 and l.702 are false in the reading 'mixing is necessary for universality', not in the reading 'the hypothesis Theorem 3.4 is stated under'; one map suffices on the circle, which sharpens, and does not contradict, l.698's 'two transformations are sufficient'.", "main.tex:775: the theorem holds without the Polish structure and without the L2 densities of F_init and F_term; f_out can be taken bounded; and summability of (gamma_n) can be weakened to gamma_n -> 0 with gamma_0 < infinity (EGF.main_universality_of_tendsto). Ergodicity proper is not an extra assumption: gamma_0 < infinity and gamma_n -> 0 already force (pi, lambda-hat) to be ergodic (sketch, not formalized: an invariant set A with 0 < lambda-hat(A) < lambda-hat(S) gives phi = (1_A - c) d lambda-hat/d lambda with phi pi^n = phi, and gamma_0 < infinity makes d lambda-hat/d lambda essentially bounded, so phi is in L2(lambda)). What the Lean theorem genuinely drops is the invariance of lambda (next finding). Where lambda is invariant (every application in the paper, main.tex:819 and :836, and the Walters reading of the next finding), the submultiplicativity argument of the finding on main.tex:789 makes gamma_n -> 0 imply summability, so this weakening can be strict only for a non-invariant lambda; no example is given.", "main.tex:793 uses lambda*pi = lambda ('H(nu_inf + eta*lambda) = H(nu_inf) + eta*lambda*pi = nu_inf + eta*lambda'), and main.tex:779 uses that pi maps L2(lambda) densities to L2(lambda) densities. If 'pi is ergodic on (S, lambda)' is read in Walters' sense, as the paper uses the word (main.tex:211: 0-flows are measures for which pi is ergodic, i.e. invariant ones; main.tex:819 applies the theorem right after noting that each Phi_i keeps lambda invariant), it includes lambda*pi = lambda and both steps follow from the theorem's own hypothesis (main.tex:779 by Jensen). If it is not, they are gaps, since def:summably_mixing (main.tex:262) only provides an invariant lambda-hat equivalent to lambda. Either way the Lean theorem does not assume lambda invariant: it lifts by the invariant lambda-hat, and shows lambda-hat is finite unless lambda is trivial (EGF.trivial_of_lamHat_univ_eq_top).", "main.tex:789: 'sum_t int (d eps_t/d lambda)^2 d lambda < +infinity. Therefore nu_T converges' does not follow as written: summable squared L2 norms do not by themselves make sum_t eps_t converge in L2 (it would follow from sum_t ||d eps_t/d lambda||_2 < infinity), and the bound |nu_inf|_2 <= sum_t int (d eps_t/d lambda)^2 mixes norms and squared norms. The argument fails as written, not the conclusion: with lambda-hat = lambda invariant, gamma_n is the squared norm of T^n on the mean-zero subspace H_0 (T the transfer, a contraction of L2(lambda) preserving H_0), so sum gamma_n < infinity gives ||T^N on H_0|| <= 1/2 for some N, hence geometric decay and absolute convergence. Under the Walters reading of the finding on main.tex:793, lambda is invariant and ergodic, so lambda-hat = c lambda and the step is fully repaired; only if 'ergodic' excludes lambda pi = lambda is lambda-hat != lambda a genuine gap: the step integrates against lambda where gamma_n integrates against lambda-hat. The Lean proof avoids the series altogether (truncated Neumann series, EGF.tvMass_construction, plus TV-mixing from gamma_n -> 0, EGF.exists_tvMass_pushIter_lt_of_tendsto).", "main.tex:790: 'nu_inf = nu_inf pi* - R + F_init': R stands for F_term.", "main.tex:774: 'The following theorem implies Theorem theo:universality' does not follow for def:universal_family as printed (main.tex:249-252), which asks a flow that is exactly flow matching; theo:universality_true gives only deltaF_init(S) + deltaF_term(S) < eps."]

