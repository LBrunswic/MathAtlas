paper_findings = ["The bound is sharp. On S = Bool with the identity policy, F_out = 0, F_init = delta_true and F_term = delta_false: delta F_init = delta_false, F_term-hat = delta_true + delta_false, the sampler stops at once at true, and TV(s_tau || F_term-hat/2) = 1/2 = delta F_init(S)/F_term-hat(S) (EGF.TwoPoint.negative_control_sharp).", "The 1/2 of the total variation is needed. On the same example the unhalved norm ||law(s_tau) - F_term-hat/F_term-hat(S)|| = 1 exceeds the bound 1/2 (EGF.TwoPoint.negative_control_sharp, second clause). main.tex:327 says only 'TV the total variation'. main.tex:338 rewrites TV as (1/2) sum |.|, and the proof's last step (main.tex:863-866: TV(s_tau, alpha s_tau + (1 - alpha) Q) = (1 - alpha) TV(s_tau, Q) <= 1 - alpha) needs TV <= 1.", "The flow is not flow matching from F_init to F_term-hat, so the sampler's termination is not given by theo:sampling_theorem. The proof takes it for granted (main.tex:853: 'The sampling distribution s_tau of F is then F_init pi^{tau,F}/F_init(S)'). It holds because F_init <= F_init-hat and the flow matches from F_init-hat: the occupation is dominated by F_term-hat + F_out, so E(tau) <= (F_term-hat(S) + F_out(S))/F_init(S) and tau < inf a.s. (clauses 1-2 of EGF.main_quantitative_sampling). The same gap is noted in GFNBounds.Core.SamplingGeneralBounds.", "main.tex:322 writes the flow (pi*, f_out*) with a density, while the sampler and F_term-hat use the measure F_out* (main.tex:161). This is notation only."]

[[row]]
label = "theo:negative_control_appendix"
extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean", "EGF/Sampling.lean"]
decls = ["EGF.main_quantitative_sampling", "EGF.GenerativeFlow.termLaw_split", "EGF.GenerativeFlow.fterm_univ_eq", "EGF.GenerativeFlow.negative_control_marginal", "EGF.normalize_add_sub_normalize_le", "EGF.tvDist_normalize_add_le", "EGF.tvDist", "EGF.tvDist_eq_iSup", "EGF.isFlowMatching_virtual", "EGF.TwoPoint.negative_control_sharp"]
bucket = "A"
notes = "T-egf-sampling (atlas-team, 2026-11-21), audit AUDIT-1 minor (pathLaw_spec's docstring over-stated the Markov clause, reworded at graduation; two REPORT phrasings). Marked on the same anchor EGF.main_quantitative_sampling as theo:negative_control (the same statement up to a comma; its proof l.852–867 is the one formalized). Rests on OQ-60."
paper_findings = ["The proof (main.tex:852-867) is formalized as written, on measures. The flow is flow matching from F_init-hat to F_term-hat (main.tex:857, EGF.isFlowMatching_virtual). The chains from F_init and from delta F_init share their stopping rule, and their stopped laws add up to F_term-hat (main.tex:858-862, EGF.GenerativeFlow.termLaw_split). A mixture estimate concludes (main.tex:863-866, EGF.tvDist_normalize_add_le). The mass identity of main.tex:854-855 is clause 4 of the anchor.", "main.tex:863 divides by delta F_init(S). That is undefined when delta F_init = 0, where the flow matches from F_init and the bound is 0 (theo:sampling_theorem). The formal mixture estimate (EGF.normalize_add_sub_normalize_le) does not divide by delta F_init(S), so that case needs no separate argument.", "The termination gap and the 1/2 of TV (findings 2-3 of theo:negative_control) concern this proof: main.tex:853 presumes tau < inf a.s., and main.tex:866 needs TV <= 1.", "The ledger links theo:negative_control and theo:negative_control_appendix by no twin, though the statements are identical up to a comma (main.tex:323 vs :846). Both are certified by the one anchor EGF.main_quantitative_sampling. Twinning them is a curation point for the master."]

[[row]]
label = "cor:sampling_error_control"
extra_lean_files = ["EGF/Sampling.lean", "EGF/SamplingCorollaries.lean", "EGF/BackwardPolicy.lean"]
decls = ["EGF.sampling_error_control", "EGF.kappaHat", "EGF.inferenceDefect", "EGF.kappaHat_eq_posPart", "EGF.inferenceDefect_eq_negPart", "EGF.terminalError_kappaHat", "EGF.virtualTerm_kappaHat", "EGF.initialError_kappaHat", "EGF.tvDist_triangle", "EGF.main_quantitative_sampling", "EGF.tvDist", "EGF.normalize", "EGF.GenerativeFlow.pathLaw", "EGF.sampledState", "EGF.stopTime"]
bucket = "A"
notes = "T-egf-sampling-corollaries (atlas-team, 2026-11-21), audit AUDIT-1 minor (the κ row is a weakening; the printed-form Prop's KL = ∞ caveat; two further sign/direction findings, l.418 and l.423, added here). Marked in EGF/SamplingCorollaries.lean: EGF.sampling_error_control (κ any finite measure, κ ≠ 0 dropped); rests on OQ-60 like theo:negative_control."
paper_findings = ["No proof is printed (the ledger row has proof null). The corollary is one application of theo:negative_control: at F_term = kappa-hat = E^+ (E := F_init + F_in - F_out) the terminal error is (E - E^+)^+ = 0, so F-hat_term = kappa-hat, the initial error is E^-, F-hat_term(S) = F_init(S) + delta = 1 + delta, and the bound delta F_init(S)/F-hat_term(S) of main.tex:325 is delta/(1 + delta). The triangle inequality for TV (EGF.tvDist_triangle, from the strict tvMass_triangle) adds the second term.", "The statement holds for every generative flow and every finite kappa: 'trained on the target kappa' (main.tex:329) is context and plays no role in the inequality."]

[[row]]
label = "cor:pinsker_negative_control"
extra_lean_files = ["EGF/Sampling.lean", "EGF/SamplingCorollaries.lean", "EGF/BackwardPolicy.lean"]
decls = ["EGF.pinsker_negative_control_density", "EGF.pinsker_negative_control", "EGF.pinsker_negative_control_real", "EGF.pinsker_negative_control_isEGF", "EGF.pinsker", "EGF.Pinsker.pinsker", "EGF.tvDist_withDensity", "EGF.klD_rnDeriv_eq_toReal_klDiv", "EGF.dens", "EGF.defectDensity", "EGF.deltaFinitDensity", "EGF.deltaFinitDensityPrinted", "EGF.ftermHatDensity", "EGF.InflowAC", "EGF.integral_deltaFinitDensity", "EGF.integral_deltaFinitDensityPrinted", "EGF.kappaHat_eq_withDensity", "EGF.inferenceDefect_eq_withDensity", "EGF.inflowAC_of_isEGFPolicy", "EGF.PinskerNegativeControlPrinted", "EGF.printed_false_of_mem_Ioo", "EGF.Swap.printed_pinsker_negative_control_false", "EGF.sampling_error_control", "EGF.kappaHat", "EGF.inferenceDefect"]
bucket = "A"
notes = "T-egf-sampling-corollaries (atlas-team, 2026-11-21), audit AUDIT-1 minor (the κ row is a weakening; the printed-form Prop's KL = ∞ caveat; two further sign/direction findings, l.418 and l.423, added here). Closed in its corrected form of record by DEC-141, which rules OQ-66 (δf_init is the negative part; corrections C-1, C-4 adopted, papers/egf/programme/corrections.toml); the strict module carries the mark (EGF/SamplingCorollaries.lean:13). False as printed (the sign of δf_init), the printed form kept as EGF.PinskerNegativeControlPrinted beside its refutation; proved under the negative part: EGF.pinsker_negative_control (measure form), pinsker_negative_control_density, _real, pinsker_negative_control_isEGF. Pinsker ported verbatim from GFNBounds' ILBoundFull as EGF.pinsker, with Mathlib's klDiv (no import of GFNBounds)."
paper_findings = ["False as printed. main.tex:362 defines delta f_init = min(0, f_init + f_in* - f_out*), which is <= 0 (EGF.deltaFinitDensityPrinted_nonpos), so delta = int delta f_init d lambda = -(F_init + F_in - F_out)^-(S) <= 0 (main.tex:379; EGF.integral_deltaFinitDensityPrinted). At the target probability kappa := kappa-hat/kappa-hat(S) the divergence is 0 and the printed right side is -e/(1 - e) < 0 <= TV, for every flow with 0 < e := (F_init + F_in - F_out)^-(S) < 1 whose densities exist (EGF.printed_false_of_mem_Ioo).", "A two-point instance (EGF.Swap.printed_pinsker_negative_control_false): S = Bool, lambda the counting measure, the swap policy b -> not b, F_out = (1/2) delta_false, F_init = delta_true, kappa = kappa-hat/kappa-hat(S) = delta_true. Every presupposition holds (F_init, F_out, F_in << lambda). The printed delta is -1/2, the negative-part delta is 1/2, KL = 0, and the printed bound is -1.", "With delta the negative-part mass, as def:virtual_flows (main.tex:316, (.)^-) and cor:sampling_error_control (main.tex:333, (.)^-(S)) define it, the corollary holds: in measures (EGF.pinsker_negative_control), in the paper's densities with delta f_init := max(0, -(f_init + f_in - f_out)) = -min(0, .) (EGF.pinsker_negative_control_density), in R when KL < inf (EGF.pinsker_negative_control_real), and for an EGF with no named hypothesis (EGF.pinsker_negative_control_isEGF). The proof (none is printed) is cor:sampling_error_control with Pinsker on its second term, kappa being a probability.", "The same sign reaches the loss, outside this target's labels: equ:weakFM (main.tex:363-365) penalizes b E_{nu_train} delta f_init, and Algorithm 1 (main.tex:395, and p_t at main.tex:400 through delta f_init/f_in*) uses delta f_init. With delta f_init <= 0 that penalty rewards the negative part instead of controlling it, against main.tex:368 ('controls only the negative part of the FM defect'). GFNBounds reads delta f_init as e^- = max(-e, 0) (GFNBounds.Core.wklfmLoss, lean/GFNBounds/Core/ILBound.lean), the reading taken here. The dispatch cites the definition at l.363; in papers/egf/legacy/labeled/main.tex it is l.362.", "Pinsker's inequality is cited by name only (main.tex:370) and is absent from Mathlib at fabf563a, which has klDiv. It is proved here: GFNBounds' density statement copied (EGF.Pinsker.pinsker), identified with tvDist (EGF.tvDist_withDensity, equality, via Mathlib's Measure.withDensity_sub) and with klDiv (EGF.klD_rnDeriv_eq_toReal_klDiv), and restated for probability measures (EGF.pinsker).", "F_in* << lambda is presupposed by f_in* := dF_in*/d lambda (main.tex:196). For a general flow it is the named hypothesis EGF.InflowAC. For an EGF it is a theorem under Phi_i push lambda = J_i lambda (OQ-55's form (c), which contains (a) and (b)), so the EGF instance holds whatever OQ-55 rules; only the printed 'lambda << Lebesgue' fails (EGF.printed_inflow_not_ac, OQ-55's own finding).", "main.tex:418 (AUDIT-1): the KL decomposition there is KL(κ ‖ κ̂/κ̂(𝒮)), the reverse of the direction printed at l.377; the cross-entropy of equ:weakFM and the claim at l.413 connect to the corollary only through the reverse direction (the corollary holds in both).", "main.tex:423 (AUDIT-1): ∫ f̂_term = 1 + ∫ δf_init is false under the printed sign (min(0, ·)) and true under the negative-part reading: the paper's own evidence for that reading."]
