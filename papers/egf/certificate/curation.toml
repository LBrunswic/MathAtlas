[[row]]
label = "theo:universality_true"
extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean"]
decls = ["EGF.main_universality", "EGF.main_universality_of_tendsto", "EGF.main_universality_const", "EGF.trivial_of_lamHat_univ_eq_top", "EGF.trivial_of_lamHat_univ_eq_top_of_ne_top", "EGF.exists_tvMass_pushIter_lt", "EGF.exists_tvMass_pushIter_lt_of_tendsto", "EGF.exists_truncation", "EGF.tvMass_construction", "EGF.eq_of_trivial", "EGF.tvMass", "EGF.errors_eq_tvMass", "EGF.initialError", "EGF.terminalError", "EGF.initialError_eq_negPart", "EGF.terminalError_eq_posPart", "EGF.lintegral_transfer_sq_le", "EGF.transfer_zero_ae"]
bucket = "A"
notes = "T-egf-headline (atlas-team, 2026-11-20), audits AUDIT-1 minor (fixed in round 1) and AUDIT-2 minor (three wording points, fixed at graduation and here). Marked in EGF/Universality.lean, sorry-free. Lean ≥ paper: no Polish structure, no L² densities of F_init, F_term, no ergodicity or invariance of λ assumed; f_out bounded. The general form EGF.main_universality_of_tendsto needs only γ₀ < ∞ and γₙ → 0. Rests on the reading of def:summably_mixing (OQ-47, a confirmation)."
paper_findings = ["main.tex:775: the theorem holds without the Polish structure and without the L2 densities of F_init and F_term; f_out can be taken bounded; and summability of (gamma_n) can be weakened to gamma_n -> 0 with gamma_0 < infinity (EGF.main_universality_of_tendsto). Ergodicity proper is not an extra assumption: gamma_0 < infinity and gamma_n -> 0 already force (pi, lambda-hat) to be ergodic (sketch, not formalized: an invariant set A with 0 < lambda-hat(A) < lambda-hat(S) gives phi = (1_A - c) d lambda-hat/d lambda with phi pi^n = phi, and gamma_0 < infinity makes d lambda-hat/d lambda essentially bounded, so phi is in L2(lambda)). What the Lean theorem genuinely drops is the invariance of lambda (next finding). Where lambda is invariant (every application in the paper, main.tex:819 and :836, and the Walters reading of the next finding), the submultiplicativity argument of the finding on main.tex:789 makes gamma_n -> 0 imply summability, so this weakening can be strict only for a non-invariant lambda; no example is given.", "main.tex:793 uses lambda*pi = lambda ('H(nu_inf + eta*lambda) = H(nu_inf) + eta*lambda*pi = nu_inf + eta*lambda'), and main.tex:779 uses that pi maps L2(lambda) densities to L2(lambda) densities. If 'pi is ergodic on (S, lambda)' is read in Walters' sense, as the paper uses the word (main.tex:211: 0-flows are measures for which pi is ergodic, i.e. invariant ones; main.tex:819 applies the theorem right after noting that each Phi_i keeps lambda invariant), it includes lambda*pi = lambda and both steps follow from the theorem's own hypothesis (main.tex:779 by Jensen). If it is not, they are gaps, since def:summably_mixing (main.tex:262) only provides an invariant lambda-hat equivalent to lambda. Either way the Lean theorem does not assume lambda invariant: it lifts by the invariant lambda-hat, and shows lambda-hat is finite unless lambda is trivial (EGF.trivial_of_lamHat_univ_eq_top).", "main.tex:789: 'sum_t int (d eps_t/d lambda)^2 d lambda < +infinity. Therefore nu_T converges' does not follow as written: summable squared L2 norms do not by themselves make sum_t eps_t converge in L2 (it would follow from sum_t ||d eps_t/d lambda||_2 < infinity), and the bound |nu_inf|_2 <= sum_t int (d eps_t/d lambda)^2 mixes norms and squared norms. The argument fails as written, not the conclusion: with lambda-hat = lambda invariant, gamma_n is the squared norm of T^n on the mean-zero subspace H_0 (T the transfer, a contraction of L2(lambda) preserving H_0), so sum gamma_n < infinity gives ||T^N on H_0|| <= 1/2 for some N, hence geometric decay and absolute convergence. Under the Walters reading of the finding on main.tex:793, lambda is invariant and ergodic, so lambda-hat = c lambda and the step is fully repaired; only if 'ergodic' excludes lambda pi = lambda is lambda-hat != lambda a genuine gap: the step integrates against lambda where gamma_n integrates against lambda-hat. The Lean proof avoids the series altogether (truncated Neumann series, EGF.tvMass_construction, plus TV-mixing from gamma_n -> 0, EGF.exists_tvMass_pushIter_lt_of_tendsto).", "main.tex:790: 'nu_inf = nu_inf pi* - R + F_init': R stands for F_term.", "main.tex:774: 'The following theorem implies Theorem theo:universality' does not follow for def:universal_family as printed (main.tex:249-252), which asks a flow that is exactly flow matching; theo:universality_true gives only deltaF_init(S) + deltaF_term(S) < eps."]

[[row]]
label = "def:summably_mixing"
extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean"]
decls = ["EGF.IsSummablyL2Mixing", "EGF.mixingCoeff", "EGF.unitMeanZero", "EGF.transfer", "EGF.pushIter", "EGF.isSummablyL2Mixing_const", "EGF.pushIter_const_succ"]
bucket = "A"
notes = "T-egf-headline (atlas-team, 2026-11-20), audits AUDIT-1 minor (fixed in round 1) and AUDIT-2 minor (three wording points, fixed at graduation and here). Marked in EGF/Defs.lean, sorry-free; inhabited by the resampling kernel (EGF.isSummablyL2Mixing_const). The reading for λ̂ ≠ λ is OQ-47 (a confirmation: the paper only uses λ̂ = λ)."
paper_findings = ["main.tex:267: the condition 'int_{s in S} phi(s) = 0' names no measure; main.tex:273 ('the subspace {phi | int phi d lambda = 0}') and the proof of theo:universality_true (main.tex:788: eps_t(S) = 0) fix it as lambda, which is what is formalized.", "main.tex:264-267 integrates (phi pi^n)^2 against lambda-hat while H normalizes in L2(lambda); the proof of theo:universality_true (main.tex:789) integrates against lambda, i.e. treats lambda-hat = lambda.", "The definition is inhabited: on any probability space the resampling kernel pi(x) = lambda is summably L2-mixing with lambda-hat = lambda (EGF.isSummablyL2Mixing_const), so EGF.main_universality is not vacuous (EGF.main_universality_const)."]

[[row]]
label = "def:egf"
extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean"]
decls = ["EGF.IsEGF", "EGF.IsEGFPolicy", "EGF.IsTopologicallyErgodic", "EGF.egfKernel", "EGF.GenerativeFlow", "EGF.isEGFPolicy_egfKernel", "EGF.IsEGFPolicy.isMarkovKernel", "EGF.IsTopologicallyErgodicPos", "EGF.isTopologicallyErgodic_iff_pos", "EGF.IsTopologicallyErgodicGroup", "EGF.IsTopologicallyErgodic.group", "EGF.shiftZ", "EGF.shiftZ_group_not_forward"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-48 (group or forward-word topological ergodicity; a corrected form is marked only once ruled)"
notes = "T-egf-headline (atlas-team, 2026-11-20), audits AUDIT-1 minor (fixed in round 1) and AUDIT-2 minor (three wording points, fixed at graduation and here). Unmarked: stated with the printed forward-word clause (OQ-48); Lean ≥ paper on the space (a topological measurable space; homeomorphisms for diffeomorphisms); measurability of α a mild added condition, not forced."
paper_findings = ["main.tex:219-221: the sentence says the GROUP generated by the Phi_i is topologically ergodic, but its 'That is' clause uses only words in the Phi_i (no inverses). The clause is strictly stronger: on Z (a 0-manifold) the translation by 1 generates a group whose orbits are all of Z, while its forward words never decrease (EGF.shiftZ_group_not_forward). The same can happen for translations of R^d, a state space the paper names (main.tex:155): +1 and +sqrt 2 on R have dense group orbits and forward orbits in [x, infinity), though not every family does (+1, -sqrt 2 has dense forward orbits). Z and R^d carry infinite volume, outside the standing finite lambda of main.tex:161, but the clause compared is purely topological.", "main.tex:219: alpha is declared S -> [0,1]^p; that its coordinates sum to 1 is not written but is forced by pi being a Markov kernel. Measurability of alpha is not forced (a non-measurable split of the weights between two identical maps gives a measurable kernel); IsEGF assumes it, a mild condition, without loss of generality on standard Borel spaces.", "Whether the empty word (t = 0) is allowed is immaterial as soon as p >= 1 (EGF.isTopologicallyErgodic_iff_pos)."]

[[row]]
label = "def:universal_family"
extra_lean_files = ["EGF/Defs.lean", "EGF/Universality.lean"]
decls = ["EGF.IsUniversalFamily", "EGF.GenerativeFlow", "EGF.IsFlowMatching", "EGF.inflow", "EGF.GenerativeFlow.IsFlowMatching", "EGF.IsUniversalFamilyUnnormalized", "EGF.not_isUniversalFamilyUnnormalized"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-49 (probability or equal-mass distributions) and OQ-50 (exact or ε flow matching)"
notes = "T-egf-headline (atlas-team, 2026-11-20), audits AUDIT-1 minor (fixed in round 1) and AUDIT-2 minor (three wording points, fixed at graduation and here). Unmarked: stated with probability measures and exact flow matching, as printed (OQ-49, OQ-50)."
paper_findings = ["main.tex:250: read with unnormalized distributions (the paper's other use of the word, main.tex:163 and :180), the definition is never satisfied on a finite non-zero lambda: flow matching forces F_init(S) = F_term(S) (EGF.not_isUniversalFamilyUnnormalized).", "main.tex:251 asks exact flow matching, while the master theorem (main.tex:775) only gives deltaF_init(S) + deltaF_term(S) < eps, and theo:universality (main.tex:277) assumes the set of f_out only dense; so 'The following theorem implies Theorem theo:universality' (main.tex:774) does not hold with this definition as printed; an eps-version of universality is what is proved.", "main.tex:277 (theo:universality, not this target): 'the set of f_out is dense in L2(S, lambda)' cannot hold for non-negative outflows, which are not dense in L2; presumably dense in the non-negative cone."]

[[row]]
label = "theo:backward_policy"
extra_lean_files = ["EGF/Defs.lean", "EGF/BackwardPolicy.lean"]
decls = ["EGF.backward_policy", "EGF.backward_policy_of_map_eq", "EGF.backward_policy_rnDeriv", "EGF.backward_policy_addHaar", "EGF.backward_policy_diffeomorph", "EGF.backward_policy_equiv_addHaar", "EGF.IsBackwardPolicy", "EGF.inflowDensity", "EGF.backwardWeight", "EGF.backwardKernel", "EGF.coordJac", "EGF.printed_backward_policy_false", "EGF.printed_inflow_not_ac"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-55 (which corrected form is of record; the meaning of « λ ≪ Lebesgue »)"
notes = "T-egf-backward-policy (atlas-team, 2026-11-20), audit AUDIT-1 minor (the counterexamples' non-ergodicity disclosed, a σ-finite qualifier; fixed in the docstring at graduation). The backward star policy is defined (EGF.IsBackwardPolicy, the identity of l.745; its Radon–Nikodym form l.744; Mathlib's posterior gives existence on standard Borel spaces; a.e. unique). EGF.backward_policy holds on any measurable space under Φᵢ₊λ = Jᵢ λ, with corrected forms _rnDeriv, _addHaar, _diffeomorph, _equiv_addHaar, sorry-free. The printed statement is false in the appendix's setting (printed_inflow_not_ac refutes the f_in line only; printed_backward_policy_false the weights under the coordinate Jacobian). EGF.inflow_eq_withDensity serves T-egf-sampling."
paper_findings = ["main.tex:731-732 (the setting of theo:backward_policy): 'a background measure lambda absolutely continuous with respect to Lebesgue measure' does not make F_in = F_out pi* absolutely continuous with respect to lambda, so f_in = dF_in/d lambda (main.tex:196, :737) need not exist, whatever |J_s Phi_i^{-1}| means. On R with the finite lambda = 1_[0,1) Lebesgue, Phi(x) = x + 1, alpha = 1, f_out = 1, F_in = 1_[1,2) Lebesgue is singular to lambda (EGF.printed_inflow_not_ac). The change of variables of the proof (main.tex:754, d lambda(s) -> |J_u Phi_i^{-1}| d lambda(u)) needs Phi_i_* lambda = |J Phi_i^{-1}| lambda, in particular Phi_i_* lambda << lambda. That holds when lambda is equivalent to Lebesgue (a positive density, EGF.map_ac_of_equiv_addHaar) and for the Riemannian volume of def:egf (main.tex:217).", "main.tex:735-737 with main.tex:230 ('J_s denotes the Jacobian matrix at s'): with |J_s Phi_i^{-1}| the coordinate Jacobian determinant, the formulas for f_in and beta^i are false for a background measure other than Lebesgue, even a finite one equivalent to Lebesgue. On R take lambda with density 1 on [-1,0), 2 on [0,1) and exp(-x^2) elsewhere, Phi_0 = id, Phi_1 = x -> x + 1, alpha = (1/2, 1/2), f_out = 1_[-1,1). Then the printed f_in is not dF_in/d lambda and the printed kernel is not a backward policy (EGF.printed_backward_policy_false): on [0,1) the true weights are (2/3, 1/3) and the printed ones (1/2, 1/2). The formulas hold with |J_s Phi_i^{-1}| read as the Jacobian of Phi_i^{-1} relative to lambda, d(Phi_i_* lambda)/d lambda (s), which for lambda = rho Lebesgue is rho(Phi_i^{-1} s)|det J_s Phi_i^{-1}|/rho(s) (EGF.backward_policy_rnDeriv, EGF.backward_policy_equiv_addHaar; on this example EGF.cx_rnDeriv_reading). They also hold with the coordinate Jacobian when lambda is Lebesgue (or Haar) measure, the body's setting at main.tex:225 (EGF.backward_policy_addHaar, EGF.backward_policy_diffeomorph; on this example EGF.cx_lebesgue). Every application in the paper takes lambda Lebesgue, Haar or a Riemannian volume, where the two readings agree.", "The two counterexamples use translations of R, which are not topologically ergodic. The appendix's definition of an EGF (main.tex:731-732) does not ask for ergodicity, so they meet it. An ergodic counterexample to the coordinate reading exists and is not formalized: on the circle, Phi_0 = id and Phi_1 an irrational rotation (dense forward orbits), lambda with a positive non-constant density, alpha = (1/2, 1/2), f_out = 1. The printed weights are (1/2, 1/2), the true ones rho(s)/(rho(s) + rho(s - theta)) and its complement, and these differ on a set of positive measure unless rho is rotation-invariant, hence constant. (AUDIT-1: both findings survive ergodicity, by examples checked by hand and not formalized: for finding 1, Φ = (x + 1, x − √2), α = (½, ½), λ = 𝟙_[0,1)·Leb, f_out = 1, dense forward orbits, F_in singular to λ; for finding 2, an irrational rotation of the circle. Under a Riemannian volume in place of « λ ≪ Lebesgue » (def:egf, l.217) finding 1 disappears and finding 2 holds only for the coordinate Jacobian.)", "main.tex:736-737 and main.tex:754-764 write |J_s Phi_i^{-1}| for what main.tex:233 writes |det J_s Phi_i^{-1}|, the absolute value of the Jacobian determinant. It is formalized as the determinant (EGF.coordJac).", "main.tex:758: the proof environment closes before the deduction that yields the formula (main.tex:759-766, 'Since this formula is true for any Y ... The result follows.'). The ledger's proof span [740, 758] misses that deduction.", "main.tex:736: beta^i(s) divides by f_in(s), which is undefined where f_in(s) = 0 (and where f_in(s) is infinite). Both sets are F_in-null, and a backward policy is only defined F_in-a.e., since main.tex:744 is a Radon-Nikodym derivative. The formalization sets the quotient to 0 there. The resulting kernel is Markov F_in-a.e. and is the unique backward policy up to F_in-null sets (EGF.backward_policy, conclusions 3-4)."]
