notes = "T-egf-families (egf-programme, 2026-11-21), three audits: AUDIT-1 major (a member-only family predicate) fixed in one round, AUDIT-2 major on prose only (an aperiodicity claim) fixed in a second, AUDIT-3 minor (wording, fixed at graduation). Unmarked: the corrected form is ε-universality (DEC-141) for the image of a rich model (C-31) whose generated group acts ergodically (C-28, C-29); EGF.universality_tori derives it from Bekka-Guivarc'h's Theorem 5 as a named Prop (theo:spectral_gap_tori) without the inverse-stability of l.820; no group violating (ii) is constructed in Lean for d >= 1. T-egf-tori-minimal (egf-programme, 2026-11-22, AUDIT-1 minor: findings reworded at graduation) adds EGF/ToriMinimal.lean: ergodicity of affine maps without periodic integer vector (Fourier), the cat map in the group of the minimal four moves for every choice of translations, universality of the minimal and RL moves (both readings of C-34), l.293 for every d ≥ 2 (every SL_d(ℤ) has an element without periodic vector) and its failure at d = 1, one move or one random translation in every dimension (C-29). C-28 adopted under DEC-141, DEC-144, DEC-187."
paper_findings = ["main.tex:291: the printed Theorem 3.5 is false for every satisfiable choice of moves: a family whose heads ignore the state (in particular constant outflows) is never ε-universal (EGF.not_isUniversalFamilyEps_of_constantHeads, EGF.not_isUniversalFamilyEps_constOutflow); the printed statement over models (EGF.UniversalityToriPrinted, l.820's condition at every parameter) is refuted by the constant model (EGF.not_universalityToriPrinted, conditional on moves meeting l.820 existing). With all translations free and d >= 1, l.820 cannot hold at every parameter, so in that reading the theorem is vacuous. Correction C-31.", "main.tex:293, :821: at d = 1 every group satisfies (ii) (EGF.bgConditionII_dim_one), so l.820's condition is never met and the printed theorem is vacuous there (EGF.universalityToriPrinted_one); 'any dimension' (l.293) fails for this route and 'SL(d,Z) contains a free group' (l.821) is false at d = 1. Correction C-28.", "main.tex:818-820: the route needs neither the inverse-stability of l.820 nor aperiodicity: ergodicity of the generated group suffices and is necessary (EGF.universality_tori_of_ergodic, EGF.universality_tori_iff). Aperiodicity is Bekka-Guivarc'h's sufficient condition for a spectral radius < 1; the two-sided gap holds for every group violating (ii) (not formalized).", "main.tex:1022 ('Theoretically minimal EGF with four affine moves on the torus T^2') and main.tex:493 ('the minimal four affine transformations'): four is minimal for the paper's own sufficient condition (the smallest inverse-closed set of moves whose linear parts generate SL_2(Z); l.1022 glosses 'minimal' as 'two generators and their inverse', and l.698 says two transformations suffice), not in the number of moves needed for universality: one move suffices. A single move x -> [[2,1],[1,1]] x + b, any b, with a rich model gives an epsilon-universal family on T^2 (EGF.universality_tori_cat, non-vacuous by EGF.universality_tori_cat_l2); in every dimension d >= 2 a single move x -> Mx + b with M in SL_d(Z) suffices (EGF.exists_universality_tori_single_move), and in every dimension one translation x -> x + c for almost every c (EGF.ae_universality_tori_translation). By C-29 only ergodicity of the group of the moves matters, and one ergodic element suffices (EGF.isGroupErgodic_of_ergodic_mem). The four moves of l.293 are sufficient (EGF.universality_tori_minimal), for every choice of their translations.", "main.tex:293 ('the technical assumptions above is in particular satisfied if the group generated by the linear part of the Phi_i is the whole group SL_d(Z)'): with the corrected condition (ergodicity of the group of the moves, C-28/C-29), proved for every d >= 2 and every choice of translations (EGF.universality_tori_sl), since SL_d(Z) contains an element without periodic integer vector (EGF.exists_noPeriodicVector_det_one: block diagonals of the cat map and of the companion matrix of x^3 - x - 1, proved via irreducibility over Q and Bezout); so l.293 for d >= 3 no longer rests on l.821 (free subgroups) nor on conder2025generating. At d = 1 the criterion is false: every family of T^1 has linear parts generating SL_1(Z) = {1}, yet the identity move with the L2 model is not epsilon-universal (EGF.not_universality_tori_sl_one); on T^1 one translation of infinite order is needed and suffices (EGF.universality_tori_one, EGF.universality_tori_one_sqrt_two). In l.820's printed form, 'in particular satisfied' also fails for the inverse-stability clause unless each inverse move's translation is matched (not formalized; the corrected condition drops inverse-stability).", "main.tex:149 ('in any dimension on tori and spheres, this criterion can be fulfilled with four simple transformations'): for tori, confirmed in every dimension d >= 1, and with one transformation for the criterion as corrected by C-29 (ergodicity; a one-move family is never summably L2-mixing, EGF.not_isSummablyL2Mixing_of_map_eq, so the criterion of Theorem 3.4 as printed needs more than one) (d = 1: an irrational translation; every d: almost every translation; d >= 2: one move in SL_d(Z)).", "main.tex:697 ('for instance on tori, one randomly initialized non-trainable translation is sufficient to ensure ergodicity'): confirmed in every dimension: almost every translation of T^d is ergodic (EGF.ae_ergodic_torusAffine_one, Kronecker by Fourier: EGF.ergodic_torusAffine_one_of_mFourier_ne_one, EGF.ae_mFourier_ne_one), and with a rich model the family with that one move is epsilon-universal (EGF.ae_universality_tori_translation). main.tex:698 ('two transformations are sufficient'): true, not tight; one suffices (C-29).", "main.tex:440 (RL experiment, 16 transformations): in both readings of C-34 (12 moves: 8 translations and S^{+-1}, T^{+-1}; 20 moves: 16 translations, which include 8 translations and their inverses, and S^{+-1}, T^{+-1}) the family is epsilon-universal with a rich model for every choice of the translations, the harness's rational ones included (EGF.universality_tori_rl, non-vacuous by EGF.universality_tori_rl_l2): the translations play no role in universality."]

