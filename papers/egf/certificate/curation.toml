label = "theo:universality_sphere"
extra_lean_files = ["EGF/SphereFamilies.lean", "EGF/UniversalityErgodic.lean", "EGF/UniversalFamily.lean", "EGF/SphereDense.lean"]
decls = ["EGF.universality_sphere_of_ergodic", "EGF.universality_sphere_of_groupErgodic", "EGF.universality_sphere_iff", "EGF.isKernelErgodic_sphereUniformKernel_iff", "EGF.isGroupErgodic_sphereRotGroup_iff", "EGF.universality_sphere_one", "EGF.universality_sphere_one_of_dense", "EGF.universality_sphere_one_witness", "EGF.ergodic_rotSphere_two", "EGF.exists_irrational_of_dense", "EGF.universality_sphere_of_reformulation", "EGF.ergodic_of_hasBGSpectralGap", "EGF.IsometrySphericalModel", "EGF.isometrySphericalFamily", "EGF.IsIsometrySphericalFamily", "EGF.IsRichSphericalModel", "EGF.l2SphericalModel", "EGF.isRichSphericalModel_l2", "EGF.sphereRotGroup", "EGF.not_isUniversalFamilyEps_sphere_of_constantHeads", "EGF.constSphericalModelAt", "EGF.IsPrintedSphereCondition", "EGF.UniversalitySpherePrinted", "EGF.not_universalitySpherePrinted", "EGF.not_universalitySpherePrinted_one", "EGF.not_universality_sphere_identity", "EGF.RoundSphere", "EGF.sphereVolume", "EGF.SO", "EGF.rotSphere", "EGF.measurePreserving_rotation_sphere", "EGF.measurePreserving_rotSphere", "EGF.sphereUniformKernel", "EGF.universality_sphere", "EGF.universality_sphere_of_printedCondition", "EGF.universality_sphere_l2", "EGF.UniversalitySphereDense", "EGF.universalitySphereDense_of_one_le", "EGF.universalitySphereDense_iff", "EGF.not_universalitySphereDense_zero", "EGF.ae_const_of_dense_rotations", "EGF.isGroupErgodic_sphereRotGroup_of_dense", "EGF.ergodicSMul_rotSphere", "EGF.sphereVolume_eq_smul_map_orbit", "EGF.exists_rotSphere_eq", "EGF.not_transitive_rotSphere_one", "EGF.soHaar", "EGF.so3Witness", "EGF.so3Witness_dense", "EGF.so3Witness_inv", "EGF.so3Witness_algebraic", "EGF.so3_euler", "EGF.universality_sphere_witness_two", "EGF.universality_sphere_witness_three", "EGF.not_universalitySpherePrinted_two"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "C-28, C-31 and C-49 are adopted (2026-11-22): the corrected Theorem 3.6 is of record and proved for every d ≥ 1 (EGF.universality_sphere), but no strict module carries the mark: marking it in its corrected form of record needs an audited step (for the planner)"
notes = "T-egf-families-sphere (egf-programme, closed 2026-11-21, graduated 2026-11-22), AUDIT-1 minor (four points: SCOPE's import, the SU(d) instances named, C-32's d = 3 sentence, the l.307 quote; fixed at graduation or recorded on C-32). Unmarked: the corrected form is ε-universality (DEC-141) for a family containing the uniform kernel of the rotations with outflows dense in the non-negative cone (C-31, adopted under DEC-141) whose rotations act ergodically (C-28, C-29; DEC-144, DEC-146): EGF.universality_sphere_of_ergodic, with no algebraicity, no inverse-stability and no spectral gap, and necessary for the L2 model (EGF.universality_sphere_iff). The printed theorem over models is EGF.UniversalitySpherePrinted, refuted (EGF.not_universalitySpherePrinted_one). T-egf-sphere-dense-ergodic (egf-programme, 2026-11-22, AUDIT-1 minor: the d ≥ 1 reading tagged, the witness's entries corrected) adds EGF/SphereDense.lean: SO(n) acts ergodically on the sphere for n ≥ 2 (Fubini), so a dense subgroup does (Mathlib's aeconst_of_dense_aestabilizer_smul), and the isometry spherical family is ε-universal with no algebraicity, inverse-stability or spectral gap (EGF.universality_sphere); explicit rational dense generators on 𝕊² (EGF.so3Witness), and the printed theorem refuted there (C-31). C-28, C-49 adopted under DEC-141."
paper_findings = ["main.tex:305 with main.tex:836 (Theorem 3.6 as printed, 'technical assumptions' read as l.836 at every parameter of the model): false wherever the condition is satisfiable, because the theorem assumes nothing of the model. On S^1 (d = 1) the condition is satisfiable: the rotation of cosine 3/5 and its inverse have rational entries, form a set stable under inverse and generate a dense subgroup of SO(2) (Niven). The constant-heads model at these frozen rotations is not epsilon-universal (EGF.not_universalitySpherePrinted_one; in general EGF.not_universalitySpherePrinted and EGF.not_isUniversalFamilyEps_sphere_of_constantHeads: any model whose heads ignore the state, for every n >= 1). A one-point model also refutes; the informative statement is the constant-heads one. (C-31, sphere half.)", "main.tex:307: 'The technical assumption is satisfied if the Phi_i have algebraic coefficients and are frozen' omits the density of l.836. The identity rotation has integer entries and is frozen, yet even the family of the L2 model (uniform kernel, every non-negative L2 outflow) is not epsilon-universal on S^{n-1}, n >= 1 (EGF.not_universality_sphere_identity). Proposed for C-28's batch.", "Corrected Theorem 3.6 (C-28 sphere half, C-29, C-31): with C-31's richness, ergodicity of the moves suffices on every sphere (EGF.universality_sphere_of_ergodic), with no algebraic coefficients, no inverse-stability and no spectral gap; for the L2 model it is also necessary (EGF.universality_sphere_iff). On S^1, the density clause of l.836 alone suffices: a dense subgroup of SO(2) generated by finitely many rotations has a generator of irrational angle (EGF.exists_irrational_of_dense), and one irrational rotation is ergodic for sigma (EGF.ergodic_rotSphere_two), so Theorem 3.6 holds on S^1 under l.836's density clause plus richness (EGF.universality_sphere_one_of_dense); an instance is EGF.universality_sphere_one_witness.", "C-28 (b), sphere half: no finite set of rotations of S^1 gives its uniform kernel a spectral gap in Bourgain-Gamburd's one-sided sense (EGF.not_hasBGSpectralGap_sphere_two, any p >= 1 rotations), so the spectral-gap route of l.836 gives nothing on S^1; Theorem 3.6 still holds there by the ergodic route (previous finding).", "The paper's route of main.tex:836 is sound where the reformulation holds: a one-sided spectral gap of the uniform kernel makes the moves ergodic (EGF.ergodic_of_hasBGSpectralGap), and the rich family is then epsilon-universal (EGF.universality_sphere_of_reformulation, with SpectralGapSphereReformulation n as hypothesis, false for n = 2).", "main.tex:305 with l.307 and l.836 (C-28 sphere half, C-49): Theorem 3.6 holds on every S^d, d >= 1, when the Phi_i generate a dense subgroup of SO(d+1) and the model is rich (C-31): EGF.universality_sphere. The algebraic coefficients (l.307, l.836), the inverse-stability (l.836) and the spectral gap (l.307) are not needed. For d = 1 this was EGF.universality_sphere_one_of_dense; universality_sphere covers every d >= 1 uniformly, so the corrected Theorem 3.6 of C-28 and the corrected l.307 of C-49 are anchored for d >= 2.", "The route that replaces l.836's spectral gap (C-32's last clause): SO(n), n >= 2, acts transitively on S^{n-1} (EGF.exists_rotSphere_eq, two reflections), hence sigma is sigma(S) times the orbit pushforward of Haar (Fubini, EGF.sphereVolume_eq_smul_map_orbit), hence SO(n) acts ergodically (EGF.ergodicSMul_rotSphere, through the ergodicity of left translation on SO(n)); a dense subgroup of a group acting continuously and ergodically acts ergodically (Mathlib's aeconst_of_dense_aestabilizer_smul): EGF.ae_const_of_dense_rotations. For n = 1 transitivity fails (EGF.not_transitive_rotSphere_one).", "main.tex:305 on S^2 (the sphere of the experiments, l.496): the printed Theorem 3.6 is false there too (C-31, extending EGF.not_universalitySpherePrinted_one from S^1): the rotations of cosine 3/5 about the third and first axes and their inverses (EGF.so3Witness) meet l.836 (entries 0, 1, 3/5, ±4/5; stable under inverse; dense in SO(3), EGF.so3Witness_dense) and the constant-heads model at them is not epsilon-universal: EGF.not_universalitySpherePrinted_two.", "main.tex:307-308 ('the main Theorem of breuillard2003dense allows to build a dense subgroup of SO_d(R) with two generators and algebraic coefficients. Therefore, EGF are universal on spheres with p=4 ... the two generators and their inverse'): on S^2 the two generators are explicit and need no citation: R_z(theta), R_x(theta) with cos theta = 3/5 generate a dense subgroup of SO(3) (Euler angles EGF.so3_euler, and theta/2pi irrational by Niven), and with their inverses (p = 4) the L2 model is epsilon-universal (EGF.universality_sphere_witness_three). For S^d, d >= 3, the existence of such a pair still rests on breuillard2003dense (not formalized). The index SO_d of l.307 is SO_{d+1} for S^d (C-33).", "Sharpness of d >= 1: on S^0 = {±1} the density form is false, trivially (SO(1) is trivial, so every family is dense, and the identity is not ergodic): EGF.not_universalitySphereDense_zero; EGF.universalitySphereDense_iff: the density form holds on S^d iff d >= 1. The paper's spheres are presumably of positive dimension; recorded for completeness."]

