itLam", "EGF.orbitWeight", "EGF.orbitWeight_ne_zero", "EGF.isFiniteMeasure_orbitLam", "EGF.orbitLam_eq_zero_iff", "EGF.orbitLam_map_ac", "EGF.isTopologicallyErgodic_addLeft", "EGF.isEGFErgodic_not_isEGF", "EGF.idFlowBool", "EGF.isGroupErgodic_dirac", "EGF.FourCycle.rot", "EGF.FourCycle.lam", "EGF.FourCycle.ae_lam_iff", "EGF.FourCycle.lam_apply", "EGF.FourCycle.isGroupErgodic_not_forall", "EGF.IsGroupErgodic"]
bucket = "A"
notes = "T-egf-headline (atlas-team, 2026-11-20), audits AUDIT-1 minor (fixed in round 1) and AUDIT-2 minor (three wording points, fixed at graduation and here). Unmarked: stated with the printed forward-word clause (OQ-48); Lean ≥ paper on the space (a topological measurable space; homeomorphisms for diffeomorphisms); measurability of α a mild added condition, not forced. α measurable with Σᵢ αⁱ = 1 is adopted under DEC-141 (correction C-27); the ergodicity clause still waits on OQ-48 (C-26). T-egf-def-egf (egf-programme, 2026-11-22, AUDIT-1 minor: one REPORT sentence corrected at graduation): def:egf in DEC-146's form is EGF.IsEGFErgodic, marked in EGF/DefEGF.lean (C-27's policy, the moves nonsingular in both directions, ergodicity of the generated group for λ); C-26 adopted under DEC-146. The printed forward-word clause stays EGF.IsEGF with its refutation; AUDIT-1 judges the nonsingular field an honest abstraction of diffeomorphisms (proved for Haar on ℝᵈ, tori and spheres) and the design settled by DEC-146, not a reading."
paper_findings = ["main.tex:219-221: the sentence says the GROUP generated by the Phi_i is topologically ergodic, but its 'That is' clause uses only words in the Phi_i (no inverses). The clause is strictly stronger: on Z (a 0-manifold) the translation by 1 generates a group whose orbits are all of Z, while its forward words never decrease (EGF.shiftZ_group_not_forward). The same can happen for translations of R^d, a state space the paper names (main.tex:155): +1 and +sqrt 2 on R have dense group orbits and forward orbits in [x, infinity), though not every family does (+1, -sqrt 2 has dense forward orbits). Z and R^d carry infinite volume, outside the standing finite lambda of main.tex:161, but the clause compared is purely topological.", "main.tex:219: alpha is declared S -> [0,1]^p; that its coordinates sum to 1 is not written but is forced by pi being a Markov kernel. Measurability of alpha is not forced (a non-measurable split of the weights between two identical maps gives a measurable kernel); IsEGF assumes it, a mild condition, without loss of generality on standard Borel spaces.", "Whether the empty word (t = 0) is allowed is immaterial as soon as p >= 1 (EGF.isTopologicallyErgodic_iff_pos).", "main.tex:219-221 (C-26, proved): topological ergodicity does not give the measure ergodicity of DEC-146, in the generalized setting. A rotation a of infinite order of AddCircle T is topologically ergodic in the printed forward-word sense (EGF.isTopologicallyErgodic_addLeft, from the density of the forward orbit EGF.denseRange_nsmul_of_addOrderOf_eq_zero; Mathlib has only the Z-orbit), so the flow (delta_{a+.}, vol) is an EGF in the printed sense (EGF.IsEGF, hence also the group reading), and its move is nonsingular both ways for the finite measure lambda = vol + sum_n 2^{-e(n)} delta_{n a} (e = Equiv.intEquivNat : Z ≃ N, EGF.orbitWeight); for that lambda the orbit Z a is an invariant set of positive measure (its atoms) and co-measure >= vol(S) > 0, so it is not an EGF in DEC-146's sense (EGF.isEGF_not_isEGFErgodic; instance a = sqrt 2 on R/Z, EGF.isEGF_not_isEGFErgodic_sqrt_two). This lambda is not the volume: for the volume the same rotation is an EGF (EGF.isEGFErgodic_circleRotFlow_iff). In the paper's exact setting (a smooth volume) the witness would be a minimal diffeomorphism not ergodic for the volume (Furstenberg 1961, on T^2), not formalized.", "main.tex:219-221 (C-26, proved, converse): DEC-146's ergodicity does not give topological ergodicity in either printed reading: on Bool with lambda = delta_true the identity flow is an EGF in DEC-146's sense (every group is ergodic for a Dirac mass, EGF.isGroupErgodic_dirac) while the identity is topologically ergodic neither with forward words nor with the group (EGF.isEGFErgodic_not_isEGF). The measure is not of full support, unlike a Riemannian volume; with a full-support lambda an ergodic action still need not have every orbit dense (a fixed point of measure zero), which is not formalized here.", "C-26's corrected text (the 'That is' sentence) states the generator form, lambda(Phi_i^{-1}(A) Δ A) = 0 for all i; it equals ergodicity of the generated group as soon as the moves are nonsingular both ways (EGF.isGroupErgodic_egfGroup_iff, via EGF.ae_invariant_of_mem_closure_of_quasi), automatic for diffeomorphisms and the volume. Without nonsingularity the two differ: the rotation of Fin 4 with lambda = delta_0 + delta_2 generates a group ergodic for lambda while {0, 1} is a.e.-invariant under the rotation with measure 1 and co-measure 1 (EGF.FourCycle.isGroupErgodic_not_forall). The generator form always implies the group form (EGF.isGroupErgodic_egfGroup_of_forall).", "DEC-146's clause is exactly the hypothesis of the universality theorems in their C-29 form: for an EGF policy with positive weights (main.tex:288's softmax head) and nonsingular moves whose kernel has a finite invariant lambda-hat ~ lambda, lambda finite, the flow is an EGF in DEC-146's sense iff its policy is universal (EGF.isEGFErgodic_iff_isUniversalPolicy); with positive weights the clause is the ergodicity of the kernel (EGF.isEGFErgodic_iff_isKernelErgodic). For measure-preserving moves, finite lambda and the uniform policy, a family of uniform-kernel flows with outflows ≪ lambda containing (pi, f lambda) for f in a set dense in the non-negative cone of L2(lambda) is epsilon-universal iff the generated group is ergodic (EGF.universality_of_isEGFErgodic) iff each member is an EGF (EGF.isUniversalFamilyEps_iff_forall_isEGFErgodic); sufficiency needs no restriction on the family (EGF.isUniversalFamilyEps_of_isGroupErgodic). So l.238's 'Ergodicity guarantees ... flow-matching' holds in the epsilon form with DEC-146's ergodicity.", "The nonsingular field also discharges the presupposition F_in ≪ lambda of main.tex:196 for every EGF with F_out ≪ lambda (EGF.IsEGFErgodic.inflowAC, through EGF.InflowAC.of_map_ac, C-6).", "Instances of def:egf in DEC-146's form: the flows of every affine toroidal model and every isometry spherical model are EGFs iff the group of their moves is ergodic (EGF.AffineToroidalModel.isEGFErgodic_flow_iff, EGF.isEGFErgodic_torus_iff, EGF.IsometrySphericalModel.isEGFErgodic_flow_iff, EGF.isEGFErgodic_sphere_iff; the groups are definitionally torusAffineGroup and sphereRotGroup, EGF.egfGroup_torusAffineME, EGF.egfGroup_rotME); concrete inhabitants: the L2-model flows with the rotation of cosine 3/5 of S^1 (EGF.isEGFErgodic_sphere_two_witness), the rotation by sqrt 2 of R/Z (EGF.isEGFErgodic_circleRotFlow_sqrt_two; a rotation of the circle is an EGF iff of infinite order, EGF.isEGFErgodic_circleRotFlow_iff), the swap of two points (EGF.Swap.isEGFErgodic_flow)."]

