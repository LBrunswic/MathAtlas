GF.coe_mem_linearParts_of_mem_closure", "EGF.minimalMoves", "EGF.rlMoves12", "EGF.rlMoves20", "EGF.l2ToroidalModelFree", "EGF.isRichToroidalModel_l2ToroidalModelFree", "EGF.mFourier_comp_torusAffine", "EGF.mFourierCoeff_eq_of_invariant", "EGF.norm_mFourierCoeff_eq_of_invariant", "EGF.ergodic_of_mFourierCoeff"]
