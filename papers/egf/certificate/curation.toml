decls = ["EGF.SpectralGapSphereReformulation", "EGF.HasBGSpectralGap", "EGF.not_spectralGapSphereReformulation_two", "EGF.not_hasBGSpectralGap_sphere_two", "EGF.so2Witness_eigen", "EGF.so2Witness", "EGF.so2Witness_algebraic", "EGF.so2Witness_dense", "EGF.so2Witness_inv", "EGF.irrational_angle35", "EGF.dense_zpowers_rotMat", "EGF.BourgainGamburdTheorem1", "EGF.SU", "EGF.suHaar", "EGF.heckeOp", "EGF.bourgainGamburd_hypotheses_witness", "EGF.bourgainGamburd_witness_gap", "EGF.su2Witness", "EGF.su2Witness_dense", "EGF.su2Witness_algebraic", "EGF.su2_euler", "EGF.exists_meanZero_SU", "EGF.bourgainGamburd_fails_trivial"]
