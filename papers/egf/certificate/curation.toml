bucket = "A"
notes = "T-egf-universality (egf-programme, 2026-11-21), audit AUDIT-1 minor (a docstring bound, the Bool λ, two REPORT phrasings; fixed at graduation). Closed in its corrected form of record by DEC-141, which rules OQ-50 (ε-universality; outflows dense in the non-negative cone): EGF.universality (correction C-20 adopted), marked in EGF/UniversalFamily.lean:11. Lean ≥ paper: any family of generative flows (EGF structure not used), finite λ, D the outflows paired with the summably L²-mixing π. The printed form is kept as EGF.UniversalityPrinted, true only vacuously (EGF.not_dense_L2_of_nonneg)."
paper_findings = ["main.tex:277: 'the set of f_out* is dense in L2(S, lambda)' never holds for non-negative outflow densities on a finite lambda != 0: the constant -1 is at L2 distance at least lambda(S)^{1/2} from every a.e.-non-negative function (EGF.not_dense_L2_of_nonneg, EGF.le_eLpNorm_sub_neg_one); the theorem as printed is vacuous (EGF.universalityPrinted). Corrected to the non-negative cone (C-20).", "main.tex:277: 'the set of f_out*' must be the outflows paired with the mixing pi*. Read as all outflows of the family, even the corrected theorem fails for a family of EGFs: on Bool, {(pi, lambda)} together with {(id, f lambda)} (the identity is the EGF policy of the moves id, not with alpha = (1, 0)) has every member with F_out pi = F_out, so its defect from delta_true to delta_false is TV = 2 (EGF.Coin.allOutflows_reading_fails, which proves >= 1; with the counting measure the same family is a counterexample, by hand).", "No proof of Theorem 3.4 is printed beyond main.tex:774. Its derivation from theo:universality_true needs two facts the paper does not state: the defect is 2-Lipschitz in the outflow in total variation, and the bounded outflows of EGF.main_universality are L1-limits of the family's outflows (EGF.isUniversalFamilyEps_of_policy).", "The EGF structure of the family is never used: EGF.universality holds for any family of generative flows."]

