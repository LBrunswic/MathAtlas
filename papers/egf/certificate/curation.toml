blocked_on = "a cited theorem (Bourgain-Gamburd, arXiv:1108.6264, Theorem 1): stated as the faithful named Prop EGF.BourgainGamburdTheorem1, not proved (DEC-141, as DEC-69 for Troyanov); the printed reformulation is false at SO(2) (C-32, found), and its positive form at d = 3 is T-egf-spectral-gap-so3"
notes = "T-egf-families-sphere (egf-programme, closed 2026-11-21, graduated 2026-11-22), AUDIT-1 minor. DEC-141 is applied as DEC-69 was for Troyanov: Theorem 1 is the named Prop EGF.BourgainGamburdTheorem1, never an axiom, checked by AUDIT-1 against the PDF of arXiv:1108.6264v1 (topological density for Zariski density, their footnote 1; the one-sided bound λ₁(z) < 2k as a Rayleigh-quotient bound); its hypotheses are satisfiable (EGF.bourgainGamburd_hypotheses_witness, a dense pair in SU(2)) and its conclusion is not trivial (EGF.bourgainGamburd_fails_trivial). The printed SO(d) reformulation is EGF.SpectralGapSphereReformulation, refuted at d = 2 (EGF.not_spectralGapSphereReformulation_two)."
paper_findings = ["main.tex:830-833 is false as printed for SO(2) (C-32): the rotation of cosine 3/5 and its inverse have rational entries, generate a dense subgroup of SO(2) (arccos(3/5)/(2π) is irrational by Niven's theorem) and form a set stable under inverse, while the uniform kernel on S^1 has no spectral gap (EGF.not_spectralGapSphereReformulation_two). Its Markov operator has eigenfunctions Re ζ^k in L2_0(sigma) with eigenvalues cos(kθ) accumulating at 1 (EGF.so2Witness_eigen); and no finite set of rotations of S^1 has a one-sided gap at all (EGF.not_hasBGSpectralGap_sphere_two).", "main.tex:830 calls the statement a 'Reformulation of Theorem 1 of bourgain2012spectral'. Read off arXiv:1108.6264v1, Theorem 1 is about SU(d), d >= 2, acting on itself (the Hecke operator z on L2(SU(d))), not about SO(d) acting on S^{d-1}; it is stated here as the named Prop EGF.BourgainGamburdTheorem1 (DEC-141). The positive reformulation at n = 3 from it (through SO(3) = SU(2)/{±1}) is T-egf-spectral-gap-so3, not done here.", "main.tex:830-833 and l.307 use SO(d), while Theorem 3.6 is about S^d and SO_{d+1} (l.297, l.303): the index slips by one (C-32); SpectralGapSphereReformulation n keeps the printed index (SO(n) on S^{n-1})."]

[[row]]
label = "theo:backward_policy"
extra_lean_files = ["EGF/Defs.lean", "EGF/BackwardPolicy.lean", "EGF/InflowNonsingular.lean"]
decls = ["EGF.backward_policy_measurePreserving", "EGF.inflow_eq_withDensity_measurePreserving", "EGF.inflow_ac_of_map_ac", "EGF.InflowAC.of_map_ac", "EGF.inflow_eq_withDensity_of_map_ac", "EGF.IsEGFPolicy.bind_eq_sum_map", "EGF.map_ac_of_measurePreserving", "EGF.map_ac_of_diffeomorph", "EGF.not_map_ac_acMap", "EGF.backward_policy", "EGF.backward_policy_of_map_eq", "EGF.backward_policy_rnDeriv", "EGF.backward_policy_addHaar", "EGF.backward_policy_diffeomorph", "EGF.backward_policy_equiv_addHaar", "EGF.IsBackwardPolicy", "EGF.inflowDensity", "EGF.backwardWeight", "EGF.backwardKernel", "EGF.coordJac", "EGF.printed_backward_policy_false", "EGF.printed_inflow_not_ac"]
bucket = "A"
notes = "Closed in its corrected form of record by DEC-141, which rules OQ-55: the moves are nonsingular, (Φᵢ)#λ ≪ λ, and |J_s Φᵢ⁻¹| is the Jacobian of Φᵢ⁻¹ relative to λ, i.e. EGF.backward_policy_rnDeriv (corrections C-7, C-8, C-9 adopted, papers/egf/programme/corrections.toml); the strict module carries the mark (EGF/BackwardPolicy.lean:11). The printed forms stay as the refutations EGF.printed_inflow_not_ac and EGF.printed_backward_policy_false. T-egf-backward-policy (atlas-team, 2026-11-20), audit AUDIT-1 minor (the counterexamples' non-ergodicity disclosed, a σ-finite qualifier; fixed in the docstring at graduation). The backward star policy is defined (EGF.IsBackwardPolicy, the identity of l.745; its Radon–Nikodym form l.744; Mathlib's posterior gives existence on standard Borel spaces; a.e. unique). EGF.backward_policy holds on any measurable space under Φᵢ₊λ = Jᵢ λ, with corrected forms _rnDeriv, _addHaar, _diffeomorph, _equiv_addHaar, sorry-free. The printed statement is false in the appendix's setting (printed_inflow_not_ac refutes the f_in line only; printed_backward_policy_false the weights under the coordinate Jacobian). EGF.inflow_eq_withDensity serves T-egf-sampling. T-egf-inflow-nonsingular (egf-programme, 2026-11-21, audit AUDIT-1 minor: two checklist rows, the quoted statement, a provenance comment, fixed at graduation) adds EGF/InflowNonsingular.lean: F_in ≪ λ from the diffeomorphism decomposition as soon as the moves are nonsingular (EGF.inflow_ac_of_map_ac, EGF.InflowAC.of_map_ac; correction C-6 adopted under DEC-141), on any measurable space, with no inverse and no Jacobian; the density f_in for σ-finite λ (EGF.inflow_eq_withDensity_of_map_ac); and the printed formula with |J| = 1 for measure-preserving moves (EGF.backward_policy_measurePreserving)."
paper_findings = ["main.tex:735-737 hold as printed, with |J| = 1, when every move preserves lambda (EGF.backward_policy_measurePreserving; |J| = 1 a.e. in both readings of the Jacobian, EGF.rnDeriv_map_ae_eq_one and EGF.coordJac_ae_eq_one). Every experiment of the paper uses such moves: translations and SL_2(Z) maps of the torus (main.tex:440), rotations of the sphere (main.tex:496), translations of R^2 (main.tex:1210), and the families of main.tex:284 and :303 (measure preservation checked by hand; formalized by the family targets), so C-8's discrepancy touches no experiment.", "main.tex:196: the presupposition f_in = dF_in/d lambda holds for every EGF policy whose moves are nonsingular, (Phi_i)_# lambda << lambda, with F_out << lambda, on any measurable space and with no inverse (EGF.InflowAC.of_map_ac); for positive weights nonsingularity is necessary (EGF.bind_ac_iff_map_ac), and the strict counterexample to main.tex:731-732 violates exactly it (EGF.not_map_ac_acMap). Correction C-6.", "main.tex:731-732 (the setting of theo:backward_policy): 'a background measure lambda absolutely continuous with respect to Lebesgue measure' does not make F_in = F_out pi* absolutely continuous with respect to lambda, so f_in = dF_in/d lambda (main.tex:196, :737) need not exist, whatever |J_s Phi_i^{-1}| means. On R with the finite lambda = 1_[0,1) Lebesgue, Phi(x) = x + 1, alpha = 1, f_out = 1, F_in = 1_[1,2) Lebesgue is singular to lambda (EGF.printed_inflow_not_ac). The change of variables of the proof (main.tex:754, d lambda(s) -> |J_u Phi_i^{-1}| d lambda(u)) needs Phi_i_* lambda = |J Phi_i^{-1}| lambda, in particular Phi_i_* lambda << lambda. That holds when lambda is equivalent to Lebesgue (a positive density, EGF.map_ac_of_equiv_addHaar) and for the Riemannian volume of def:egf (main.tex:217).", "main.tex:735-737 with main.tex:230 ('J_s denotes the Jacobian matrix at s'): with |J_s Phi_i^{-1}| the coordinate Jacobian determinant, the formulas for f_in and beta^i are false for a background measure other than Lebesgue, even a finite one equivalent to Lebesgue. On R take lambda with density 1 on [-1,0), 2 on [0,1) and exp(-x^2) elsewhere, Phi_0 = id, Phi_1 = x -> x + 1, alpha = (1/2, 1/2), f_out = 1_[-1,1). Then the printed f_in is not dF_in/d lambda and the printed kernel is not a backward policy (EGF.printed_backward_policy_false): on [0,1) the true weights are (2/3, 1/3) and the printed ones (1/2, 1/2). The formulas hold with |J_s Phi_i^{-1}| read as the Jacobian of Phi_i^{-1} relative to lambda, d(Phi_i_* lambda)/d lambda (s), which for lambda = rho Lebesgue is rho(Phi_i^{-1} s)|det J_s Phi_i^{-1}|/rho(s) (EGF.backward_policy_rnDeriv, EGF.backward_policy_equiv_addHaar; on this example EGF.cx_rnDeriv_reading). They also hold with the coordinate Jacobian when lambda is Lebesgue (or Haar) measure, the body's setting at main.tex:225 (EGF.backward_policy_addHaar, EGF.backward_policy_diffeomorph; on this example EGF.cx_lebesgue). Every application in the paper takes lambda Lebesgue, Haar or a Riemannian volume, where the two readings agree.", "The two counterexamples use translations of R, which are not topologically ergodic. The appendix's definition of an EGF (main.tex:731-732) does not ask for ergodicity, so they meet it. An ergodic counterexample to the coordinate reading exists and is not formalized: on the circle, Phi_0 = id and Phi_1 an irrational rotation (dense forward orbits), lambda with a positive non-constant density, alpha = (1/2, 1/2), f_out = 1. The printed weights are (1/2, 1/2), the true ones rho(s)/(rho(s) + rho(s - theta)) and its complement, and these differ on a set of positive measure unless rho is rotation-invariant, hence constant. (AUDIT-1: both findings survive ergodicity, by examples checked by hand and not formalized: for finding 1, Φ = (x + 1, x − √2), α = (½, ½), λ = 𝟙_[0,1)·Leb, f_out = 1, dense forward orbits, F_in singular to λ; for finding 2, an irrational rotation of the circle. Under a Riemannian volume in place of « λ ≪ Lebesgue » (def:egf, l.217) finding 1 disappears and finding 2 holds only for the coordinate Jacobian.)", "main.tex:736-737 and main.tex:754-764 write |J_s Phi_i^{-1}| for what main.tex:233 writes |det J_s Phi_i^{-1}|, the absolute value of the Jacobian determinant. It is formalized as the determinant (EGF.coordJac).", "main.tex:758: the proof environment closes before the deduction that yields the formula (main.tex:759-766, 'Since this formula is true for any Y ... The result follows.'). The ledger's proof span [740, 758] misses that deduction.", "main.tex:736: beta^i(s) divides by f_in(s), which is undefined where f_in(s) = 0 (and where f_in(s) is infinite). Both sets are F_in-null, and a backward policy is only defined F_in-a.e., since main.tex:744 is a Radon-Nikodym derivative. The formalization sets the quotient to 0 there. The resulting kernel is Markov F_in-a.e. and is the unique backward policy up to F_in-null sets (EGF.backward_policy, conclusions 3-4)."]

