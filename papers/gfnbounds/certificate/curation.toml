paper_findings = ["**Term (i) of the proof invokes `theo:negative_control`, which the paper quotes from `brunswicEGF` and does not prove** (`proofs.tex:52-64`, used at `proofs.tex:213`). Any Lean certificate of item (1) must carry it as an external hypothesis. This is not a defect -- citing is legitimate -- but it means `equ:stable_bound` is not self-contained in the way `equ:mass_floor` is, and the two are displayed side by side as if they were.", "**`equ:normalization_lemma`'s first inequality does not need `a = alpha(S)`.** It holds for any `a > 0` with `b = beta(S) > 0` and `beta >= 0`; the hypothesis is consumed only by the SECOND inequality, through `|a - b| <= ||alpha - beta||_{L^1}`. The Lean splits them accordingly (`tvD_normalization` without it, `tvD_normalization_le` with it). A generalization, not a correction -- nothing in the paper is wrong, but the lemma is stated less generally than it holds.", "**Step 3 is called \\\"two applications of Hoelder\\\" but the second is a plain `L^infty` bound**, and at `q = 1` the stated conjugate pair `(q, q/(q-1))` is degenerate while the display stays true trivially (`nu_B(S)^0 = 1`). The Lean case-splits at `q = 1`. Cosmetic, but a reader following the proof at `q = 1` stalls."]
size = "M"

