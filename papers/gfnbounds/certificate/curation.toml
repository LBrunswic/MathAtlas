paper_findings = ["**APPLIED 2026-09-08 (proofs.tex:817, both occurrences).** Claim 1's number was wrong: the expected backward-trajectory length is `3/(1-p)`, not the printed `(1+2p)/(1-p)`. `sigma_bar` is `E_{x ~ pihat(s_f -> .)} E(sigma | X_0 = x)`; the target row is the point mass at `x_3`, so `sigma_bar = E(sigma | X_0 = x_3) = 3/(1-p)`, while the printed value is `E(sigma | X_0 = x_1)` -- the MINIMUM of the four hitting times, so neither `sigma_bar` nor `sigma_*`. Verified three ways: exact rational arithmetic, 200,000-trajectory Monte-Carlo at three values of `p`, and the Lean (`sigmaBar_eq`). **And it was worse than a wrong number.** With the printed value, `prop:morozov_rate`(1) forces `lambda(x_i) = 1/3` and `lambda(s_0) = (1-p)/3`, total mass `1 + 2(1-p)/3 != 1` -- so `lambda` was not a probability measure, contradicting the proposition's own hypothesis AND the remark's own next sentence. The correction removes an internal contradiction, not just an inaccuracy.", "**Claim 3's `r(s_0) ~ M(1-p)` is on the wrong convention.** On the paper's own `u := d mu / d lambda`, set two lines earlier in prop:no_distant_equilibrium, `r(s_0) = M` **exactly** -- the `(1-p)` cancels because `lambda(s_0)` already carries it. `M(1-p)` is what the *counting*-measure reading gives, and on that reading `r(x_3) = p + 1/M` rather than `p + (1-p)/M`. Both readings are certified in the Lean. Since the remark writes `~` and both give `r(s_0)` linear in `M`, this is a notational slip and not an error -- but the two readings are not interchangeable.", "**Claim 4's transient is `Theta(M^2)`, not `O(M/log M)`** -- wrong by `Theta(M log M)`, and in the optimistic direction. NOT YET APPLIED. The remark names the force as `|g'(r) r| = 2 log r(s_0)` but drops the `d nu / d mu = w/u` factor, which equals 1 only at `t = 0`: at `p = 1/2, M = 100` the speed is `9.2103 = 2 log M` at `u(s_0) = 1` and `0.0277` at `u(s_0) = 50`. Dividing a deficit of order `M` by the INITIAL speed is what produces `M/log M`. A one-line argument using what `prop:no_distant_equilibrium`'s own proof already uses (proofs.tex:813, 'changes the gradient field by the factor 1/m'): the field is homogeneous of degree -1, so the trajectory from `c u_0` runs at speed `c^{-2}`; with `||u_0|| = Theta(M)` and a finite transient for the normalized shape, that is `Theta(M^2)`. Measured `T/M^2` = 0.72003, 0.72025, 0.72018, 0.72015, 0.72013, 0.72013 for `M` = 10..320 (fitted exponent 2.0000); `T log M / M^2` is not constant, so there is no `1/log M` either. **The paper's own certified bound already says so**: proofs.tex:813's `L(mu_0)/c(delta)^2 ~ ||u_0||^2 L(mu_0)` scales as `M^2 log^2 M`, so the remark claims a transient SMALLER than the proposition it illustrates guarantees. Second location, also wrong and not even agreeing with the remark it cites: `proofs.tex:381`, 'a transient linear in the overload'.", "**The closing sentence's 'every rate degenerates' is true only of the CERTIFIED rates.** `rho = g''(1) w_min / B-hat^2 ~ w_min (1-p)^2/2 -> 0` and `kappa ~ lambda_min^{1/2} -> 0`, so as a statement about what the theorems guarantee it is right as written. But the ACTUAL local exponential rate does not degenerate: the true coercivity constant `||sum_n (P^n - Pi)||` rises only to the golden ratio (1.10535, 1.48383, 1.60367, 1.61659, 1.61789, 1.61802 at `p` = 0.5 ... 0.99999), giving `>= 0.7639 w_min` uniformly in `p` against a certified `5e-11 w_min` at `p = 0.99999` -- six orders of magnitude. Note also that `B-hat` blows up at the OTHER endpoint too (722.8 at `p` = 0.01), where the narrative suggests nothing. Costs one line to dismiss; worth dismissing explicitly, because the sentence invites the reading that convergence itself stalls, which is false. Related: the clause is true under `lem:sigma_mixing`'s `B-hat = sum_n beta-hat_n` (sum of norms) but NOT under the headline's `||sum_n (P^n - Pi)||` (norm of the sum), which saturates at 1.618 here -- a pre-existing definitional matter worth one look.", "**The range of `p` is never stated.** The example needs `p` in `(0,1)`: at `p = 1` the backward policy is not positive on `s_0 -> x_1` and the chain is reducible; at `p = 0` not positive on `x_3 -> x_1`. Either way `prop:morozov_rate`'s hypothesis 'a backward policy positive on its edges' fails and the chain becomes periodic, so `B-hat = +inf`."]
