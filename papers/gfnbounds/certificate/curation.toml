label = "cor:gradient_formulas"
bucket = "A"
decls = ["GFNBounds.Balance.hasDerivAt_loss_atStates", "GFNBounds.Balance.hasDerivAt_loss_ipL2_atStates", "GFNBounds.Balance.fmGradDensity_eq", "GFNBounds.Balance.hasDerivAt_fmLoss_ipL2", "GFNBounds.Balance.fmGradDensity_sq_eq", "GFNBounds.Balance.hasDerivAt_fmLoss_sq_ipL2", "GFNBounds.Balance.hasDerivAt_abs_sub_one", "GFNBounds.Balance.hasDerivAt_fmLoss_abs_ipL2", "GFNBounds.Balance.twoState_hasDerivAt_fmLoss", "GFNBounds.Balance.twoState_hasDerivAt_fmLoss_abs", "GFNBounds.Core.General.FirstVariation.cor_gradient_formulas", "GFNBounds.Core.General.FirstVariation.cor_gradient_formulas_sq", "GFNBounds.Core.General.FirstVariation.cor_gradient_formulas_abs", "GFNBounds.Core.General.FirstVariation.funAct_two_mul_sub", "GFNBounds.Core.General.FirstVariation.gradDens_self_ae"]
notes = "Closed in A. The current account of this row -- what is certified, at what generality, and every disclosure -- is its scope notes, which the Lean map owns and dates newest first (`formalization_ledger.py node cor:gradient_formulas` prints them). This field held the row's PARTIAL record of 2026-09-08 and was not refreshed when the row closed; that record survives inside the scope notes, in the wording the map later corrected. Refreshed 2026-09-24."
blocked_on = ""
paper_findings = ["**The `|x-1|` sentence of `cor:gradient_formulas` is not a corollary of the theorem above it.** `proofs.tex:497` says the case is \\\"analogous, with `g'(r)` replaced by the sign of `r-1`\\\", and `:501` that `g'(r) = eps(r)` almost everywhere. But `theo:first_variation_full` hypothesizes `g` continuously differentiable with locally Lipschitz derivative, and `|x-1|` is not differentiable at `1` -- so the corollary's third sentence does not follow from its stated premise. The Lean closes the case under `r(x) != 1` for every `x`, where the sign IS a genuine derivative and the display holds with no reinterpretation. **The restriction is not cosmetic and not removable by better tactics**: the excluded set `{r == 1}` is exactly the BALANCED FLOW (`ratio_eq_one_iff_balanced`) -- the minimiser, and the one point the surrounding theory cares about -- and near it `|r_t(x) - 1| ~ |t . rdot(x)|`, so the non-differentiability is real. The honest general form is a subgradient statement, which needs a non-smooth first variation the library does not have. Either the corollary should carry `r != 1`, or the `|x-1|` case needs its own argument."]
size = "L"

