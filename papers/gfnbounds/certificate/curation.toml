[[row]]
label = "prop:silva_no_uniform"
bucket = "A"
decls = ["GFNBounds.Silva.wMin", "GFNBounds.Silva.wSupport", "GFNBounds.Silva.abs_exp_sub_one_le", "GFNBounds.Silva.tv_le_exp_sqrt_energy", "GFNBounds.Silva.tv_le_exp_sqrt_energy_wmin", "GFNBounds.Silva.Star", "GFNBounds.Silva.starPi", "GFNBounds.Silva.starPF", "GFNBounds.Silva.starPET", "GFNBounds.Silva.star_energy", "GFNBounds.Silva.star_tv", "GFNBounds.Silva.star_Mprime", "GFNBounds.Silva.star_chiSq", "GFNBounds.Silva.exists_star_witness", "GFNBounds.Silva.no_state_space_free_bound", "GFNBounds.Silva.no_three_argument_bound"]
notes = "CLOSED 2026-09-08, sorry-free, axiom-swept, GRADUATED. BOTH items plus the final clause. Item (i), the per-graph model-free bound TV <= (exp(sqrt(E/w_min)) - 1)/2, in a version with an abstract w and one with the paper's own w_min as a Finset.inf'. Item (ii), the star-DAG witness, fully explicit: `exists_star_witness` returns K together with positivity, normalization, chi^2 = 0, M' <= 1, 0 < E <= eps and TV = 1/8 exactly. `(log(3/2))^2 + (log 2)^2 = 0.6449 <= 1` is discharged without decimal arithmetic on log(3/2), so the paper's E <= 1/(K+2) is confirmed. The final 'no such F' clause is formalized twice: `no_state_space_free_bound` for F : R -> R, quantifying instances over Type 0 so the witness Bool + Fin K lives there, and `no_three_argument_bound` in the paper's literal three-argument shape -- the latter had to choose a reading, see the paper findings. Consistency cross-check: item (i) applied to the star family gives 1/w_min = K+2 and a K-independent bound 0.6161 >= 1/8, so the two items agree and the degeneracy is exactly in the constant."
lean_proved_override = "closed"
paper_findings = ["**The parenthetical `M = max_x p_F(s_o -> x) = 3/8` in the proof of item (ii) (`silva_comparison.tex:95`) needs `K >= 2`.** At `K = 1` the filler weight `1/(2K) = 1/2` is the largest forward probability, so `M = 1/2`. This does not touch the proposition: what the statement claims is `M' <= 1`, and that holds for every `K >= 1`. Found while formalizing `star_Mprime`; the Lean carries the correct value at every `K`.", "**The final clause leaves a monotonicity hypothesis implicit** (`silva_comparison.tex:86`): \\\"no bound `TV <= F(E, chi^2, M')` with `F` independent of the state space and `F(E, 0, 1) -> 0` as `E -> 0` can hold\\\". The witness family has `M' = 3/8`, not `1`, so `F(E, 0, 1) -> 0` alone does not contradict it unless `F` is non-decreasing in its third argument. The Lean `no_three_argument_bound` therefore feeds `F`'s third slot any `c` with `M' <= c` (so in particular `c = 1`), which is the reading the paper means; the literal reading needs the monotonicity said out loud. A companion `no_state_space_free_bound` avoids the question by quantifying only over `F : R -> R`."]
extra_lean_files = ["GFNBounds/Silva/Basic.lean"]

