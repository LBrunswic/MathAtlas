notes = "NOT STATED; terminal (bucket T) since 2026-09-13, the reason in `terminal_reason`. The remark argues a NEGATIVE -- the decay carries no log-periodic term -- from the existence of the limit in `eq:doubling_sharp`, which `theo:doubling_sharp` supplies and the Lean carries. What is not formalizable as it stands is the counterfactual half: 'a descent that halved deterministically would leave each block at a single state, the best Doeblin constant would be 0, and every 1-periodic function of `log_2 m` would be admissible'. That reasons about a chain the appendix does not construct. The certifiable content is already elsewhere: the limit exists (`main_rate`), and a limit that exists excludes a log-periodic term with no further argument."
