paper_findings = ["**APPLIED 2026-09-08 (proofs.tex:760).** The hypothesis on `m` was unsatisfiable as literally written: `m == 0` on the open `U^- u U^+` and `m > 0` elsewhere makes the zero set of a continuous function open, hence clopen in the connected `(0, +inf)`, hence everything, contradicting `m(1) = 2`. The proposition was therefore VACUOUS. Repaired to `closure(U^-) subset (0,1)`, `closure(U^+) subset (1,+inf)`, `m == 0` on the closures, `m > 0` elsewhere; 'nonempty bounded open intervals' was retained, because closure containment does NOT bound `U^+` above (`closure((2,+inf)) = [2,+inf) subset (1,+inf)`) and boundedness is consumed twice -- directly at :780 for a finite `C'`, and indirectly in item (1) where `r` band-valued must be essentially bounded to meet theo:first_variation_full's hypothesis. The proof needed no change: every step consumes only `m` in C^inf, `m >= 0`, `m` bounded, `m` continuous with `m(1) = 2`, and `m == 0` on the bands. The clause `m > 0 elsewhere` -- the one the edit weakened -- is consumed nowhere, which is what makes the weakening harmless. Both instantiations (item (2)'s bands, rem:freezing(ii)) satisfy the repaired hypothesis with margin.", "**The existence claim is now POSSIBLE but still not MADE.** NOT YET APPLIED, and this is the residue of the repair rather than a new defect. `prop:nonlinear_freezing` is a 'Let m ... Then ...' statement: it asserts what follows FROM such an `m` and nowhere asserts that such an `m` exists. Before the repair the class was empty and two claims were false; after it the class is nonempty and both are true, but neither the statement nor either proof supplies the witness, so the justification chain for an EXISTENCE claim still ends at a conditional. The two claims: theo:global_dichotomy_full(2) at proofs.tex:824 ('admissible C^inf generators of this kind with g''(1)=2 EXIST', discharged at :829 by citing this proposition) and prop:nonlinear_freezing's own closing sentence at :766 ('In particular, no bound ... can hold'), an impossibility claim that needs a witness. Also now supported where it was previously vacuous: prop:no_distant_equilibrium(1)'s closing prose at :790. WHAT CLOSES IT: one clause, either a typeset witness -- `m = 2 u_- u_+ / (u_-(1) u_+(1))` with `u_pm(t) = chi(a_pm - t) + chi(t - b_pm)`, `chi(s) = e^{-1/s} 1_{s>0}`, verified at 60 digits -- or a named appeal to smooth Urysohn. THE AUTHOR'S CALL: whether 'a smooth function vanishing exactly on two disjoint compact intervals' is standard enough to invoke without typesetting the witness.", "**`closure(U^-) subset (0,1)` is unambiguous only if the closure is taken in R.** NOT APPLIED, low severity. The same sentence names `R_+^*` as the ambient space (`m : R_+^* -> R_+`), and under the RELATIVE closure `U^- = (0,b)` is admissible: its closure in `(0,inf)` is `(0,b] subset (0,1)`, it is bounded, and `m == 0` on `(0,b]` is realizable -- whereupon `r` band-valued is NOT essentially bounded away from 0, which is exactly what theo:first_variation_full consumes and item (1)'s proof invokes at :772. The R-reading is plainly intended and has in-file precedent (`closure(Z^p(I))` at :180, :253), which is why this is low. Closed by writing `U^- = (a^-, b^-)` with `0 < a^- < b^- < 1` and `U^+ = (a^+, b^+)` with `1 < a^+ < b^+ < inf`, or by restating theo:first_variation_full's hypotheses in item (1) -- which is already on the register.", "**`rem:freezing`(ii)'s `delta` is unquantified, and the repair narrowed what it may be.** NOT APPLIED, very low. `U^mp = (1 -+ 2 delta, 1 -+ delta)`: the OLD clause admitted `delta = 1/2` (`U^- = (0, 1/2) subset (0,1)`), the new one does not (`closure = [0, 1/2]` is not a subset of `(0,1)`). The remark's own regime is `delta -> 0`, so nothing it says is touched; the fix is 'for `0 < delta < 1/2`'."]
