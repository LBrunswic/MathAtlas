[[row]]
label = "prop:blur_vs_drop"
bucket = "B"
decls = []
notes = "After prop:floor_exact: uniqueness by strict convexity; z >= t by `Core.Sampling` `sampling_theorem` plus a TV-mixture identity; z < t definitional. Certify 'subject to the term-(i) bound', not 'incurs'. ~350 lines. The prose conclusion after it is false for peaked targets (paper finding). (Review 2026-09-24.)"
paper_findings = ["**The prose conclusion is refuted; the propositions stand.** In the exact setting of `prop:blur_vs_drop` (minimal-loss flow, uniform ν_T), overshoot blurs at a cost ((z−t)/z)·TV(unif‖κ/t), while undershoot past the water level drops only the target mass below it. For a peaked target the drop is cheaper: 10 states, 97% of κ on one — once the level passes the low states, κ̂ is a point mass, the sampler can stop only there, and TV = 0.030 for every s in [0.05, 0.7], against 0.041–0.358 for overshoot (recomputed independently). Below the threshold (s = 0.02) overshoot is marginally better (0.0171 vs 0.0178). A random sweep of 1,500 ergodic chains found undershoot better in 373/375 cases with Dirichlet(0.1) targets and 5/375 with Dirichlet(3). `prop:overshoot` is about the certificate and stands; the sentences crediting the sampled law with the same preference do not. Appendix G's refutation criterion (C1) is met by exact computation. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)", "**Imprecision.** `app_finit.tex:243–245`: equ:term_i is an upper bound, not an incurred error. Also `:173–177` calls B_δ 'the best certified error at mass z', while for z < t theo:RL_CV_bound_full already certifies 2Δ/t, smaller (as `prop:z_bound`'s own remark concedes); `prop:overshoot`'s conclusions survive under the sharper member. And `:153`: with t = 1 the constant is 2, so 'normalized target' should go. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:shape_cost"
bucket = "B"
decls = []
notes = "(1),(3) on the resolvent file of prop:floor_exact and `ConvexOn.sup`; (2) needs an occupation identity under irreducibility and kappa != 0 (`Core.Sampling.Parked.strict` shows it fails without); (4) Mathlib's spectral theorem plus a self-adjoint `densOp` for reversible K. ~700 lines. (Review 2026-09-24.)"
paper_findings = ["**Gap in a proof whose statement is true.** The visit identity of item (2) uses uniqueness of the absorbing-chain solve. The register's retraction (`E(τ) = F*_out(𝒮)/F_init(𝒮) + 1`) is exactly the failure of that step; the Lean has it as `Core.Sampling.Parked.strict`. Under ν_B-ergodicity of π⋆ and κ ≠ 0 there is no closed κ-null set and uniqueness holds; the identity checks to 1e-12 on 600 instances, periodic chains included. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

