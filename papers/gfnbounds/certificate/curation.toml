[[row]]
label = "lem:traj_entropy"
bucket = "B"
decls = []
notes = "The Green-Poisson duality, generalizing `IsGreen.sum_eq_sigmaBar` from 1 to f, with `Real.negMulLog` for the entropy; ~80-150 lines, expectation characterized, not constructed (kb 0038). (Review 2026-09-24.)"

[[row]]
label = "prop:soft_ssp"
bucket = "B"
decls = []
notes = "An elementary Bellman layer (`tendsto_atTop_ciSup`, `InformationTheory.klFun_nonneg`) plus `Graph/Morozov.lean` at pi_mu. Fix (3) first: its displayed floor omits w_min. The optimizer clause is unproved. ~500-800 lines. (Review 2026-09-24.)"
paper_findings = ["**A displayed bound that is false as printed.** The appendix keeps ν_T general (w ≥ w_min > 0 at `app_pbtrain.tex:94`; 'any fixed full-support ν_T' at `:211`), while the floor at `:330–336` carries no w_min. Its numerics ran under adaptive replay, where w ≡ 1 to 1e-14 (`:422`), which is why they could not see it. Counterexample from the review: ν_T(s₀) = ν_T(s_f) = 0.05, uniform elsewhere. Also: 'one soft choice off the hard path' needs 'from a state with N ≥ 1', and 'its optimizer is π_μ' is asserted, not proved (standard; V_μ matches π_μ's value to 5e-15). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)", "**The tightness claim is about a different curve.** Both scripts instantiate N_min = π(b₃|x) ≥ p_min and plot g″(1)p_min/((2+σ̄)σ_*²) — tight to three digits, as printed. The proposition's floor replaces p_min by e^{−Δ_V/μ}/d_max ≤ p_min; its ratio to ϱ_σ is 0.509 at μ = 0.5 and 0.500 for μ ≤ 0.2 (review figures, not re-run here). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)", "**Bounds read as asymptotics.** (4) bounds the excess above by μ·log d_max·σ̄(μ); (3) bounds ϱ_σ below by an e^{−Δ_V/μ} term. Neither is two-sided, and the equal-routes diamond has ϱ_σ ≡ 2.78e-2 for every μ. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "rem:entropic_ot"
bucket = "T"
decls = []
notes = "Taxonomy; its one identity is lem:traj_entropy's parenthetical. (Review 2026-09-24.)"
terminal_reason = "A taxonomy relating the soft-SSP repair to entropic OT; its one identity is lem:traj_entropy's parenthetical, a row of its own. Review 2026-09-24."

[[row]]
label = "prop:interpolation"
bucket = "B"
decls = []
notes = "(1), (2) and (4) are routine on `ratio`, `Aop` and `linHess`. (1) in Frechet form (kb 0035). (2) needs g''(1) > 0 and nu a probability, and an explicit constant for (1 + o(1)). (3) is certifiable on the quadratic model with a finite-sum minibatch operator; the nonlinear (3) needs a localization the paper omits. ~800 lines. (Review 2026-09-24.)"
paper_findings = ["**Missing hypotheses and a proof that proves less.** The proof of (2) expands g′(r)² = g″(1)²(r−1)²(1+o(1)), which is empty when g″(1) = 0. For a finite ν, 'x ∼ ν' samples ν/ν(𝒮) and the bound needs a factor 1/ν(𝒮). In (3), lem:local_pl (`app_pbtrain.tex:92–104`) is a PL inequality for ½⟨h, Hh⟩ in L²(λ), not for the nonlinear loss; the expected-descent line holds only while the iterates stay in the neighbourhood, and nothing confines them; and it needs w_min > 0, though (3) follows 'for every training measure'. What the one-line proof establishes is the quadratic-model statement, where the contraction is global. Naming: a bound of the form Var ≤ c·L is Vaswani et al.'s *weak* growth condition (not checked against the source). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:additive_floor"
bucket = "B"
decls = []
notes = "No named obstruction, so not C. Certify the linear model: the Lyapunov solution, (1/2) tr(HS) = (eps/4b) tr Sigma_perp, the tr S eigen-formula, the discrete S_d with an explicit relative bound (Mathlib's spectral theorem). The SDE/OU framing is disclosed: no stochastic calculus at the pin. Item 3 proves only span(1) in ker H. ~450 lines. (Review 2026-09-24.)"
paper_findings = ["**Overreach.** For the proxy the kernel claim is automatic (its Hessian is positive definite on 1^⊥). The repair: assume the mixed optimum minimizes both terms, ν_T has full support and the chain is irreducible; then H ⪰ g″(1)(P−I)ᵀdiag(ν)(P−I), whose kernel is span(1). Also item (4)'s 'S_d = S + O(ε)' says nothing, both being O(ε/b); the content is relative, |S_d − S|_ij ≤ (εζ_max/2)/(1 − εζ_max/2)·|S_ij| for 0 < εζ_i < 2. The TV clause '≲ C_lip' has no constant. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)", "**The measured law is the discrete recursion's, not the SDE's.** The paragraph titled 'The diffusion presentation is the observed stationary law' compares against ½tr(HS_d) and concludes that equ:sme 'is the measured stationary law'. Exactly, ½tr(HS_d) = (ε/4b)Σ_i Σ̃_ii/(1 − εζ_i/2), which at ε = 0.2/ζ_max differs from the SDE's (ε/4b)tr Σ⊥ by up to ~11% per mode. Same slip at `:180–181` ('verified at 0.03%'). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)", "**A protocol tolerance tighter than a known correction.** Fix: compare against ½tr(HS_d), or run at εζ_max ≤ 0.05, where the discretization effect is about 2%. Figures from the review's instances, not re-run here. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:buffer_robust"
bucket = "B"
decls = []
notes = "A corollary of prop:interpolation(1) plus prop:backward_replay(1)-(2), both elementary; ~60-150 lines. 'Unchanged under sampling' certifies the no-floor reading only, not a rate. (Review 2026-09-24.)"
paper_findings = ["**Worth knowing.** The stronger reading would follow once prop:interpolation(3) has explicit constants: K does not depend on ν, ϱ increases with w_min, Λ ≤ 4g″(1)‖w‖∞, and prop:backward_replay(1) puts all three at their best at λ. Also `app_sgd.tex:71–78`: 'only its mean vanishes' holds at the imitation term's own optimum, not at the mixed one, and 'Σ is the Fisher information' holds in logit coordinates (in network parameters it is the pullback JᵀFJ). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

