blocked_on = ""
paper_findings = ["**The weak-FM loss is `(-inf, +inf]`-valued and is `+inf` exactly when `kappa` charges `{kappa-hat = 0}`; a real-valued formalization cannot see that.** Lean's `Real.log 0 = 0` would read the paper's `+inf` as a finite number and make equ:il_tv_explicit FALSE rather than vacuous there. The Lean therefore adds `kappa << kappa-hat` as an explicit hypothesis and restricts to the finite-loss case. Not an error in the paper -- the extended-real convention makes the statement true as written -- but it is a place where the appendix's `+inf` is doing real work that a reader could miss, and it is the reason this theorem needed a hypothesis its siblings did not.", "**Mathlib v4.31.0 has no Pinsker inequality and no total-variation distance.** It has `InformationTheory.klDiv`, `llr` and Gibbs' inequality, but TV exists only as `SignedMeasure.totalVariation` and `VectorMeasure.variation`, which are measures, not metrics. Both gaps are clean upstream candidates and are the reason theo:IL_CV_bound is the most hypothesis-laden statement in Appendix A."]
