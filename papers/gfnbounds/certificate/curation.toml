[[row]]
label = "prop:dual_floor"
bucket = "B"
decls = []
notes = "No new layer. Hoelder at every conjugate pair is `Core.ILBoundFull.il_holderE`, D_q is `ILBoundFull.rnNorm`, E(S) = z is `Core.RLBound.integral_eFn`; the comparison is an L^1-L^inf interpolation. The equality clause is false at q = inf (D_inf = C_0 always): certify it on (1, inf). ~300 lines. (Review 2026-09-24.)"
paper_findings = ["**Endpoint error.** `app_finit.tex:36–40` says the floors agree at q = 1 and that for q > 1 the comparison is strict unless g is two-valued. At q = ∞, q* = 1 and D_∞ = ∫g dν_T = ν_B(𝒮) = ν_B(𝒮)^{1−0}·‖g‖^0_∞ = C₀, always. The proof's equality case (`:58–59`) uses q* − 1 > 0. Fix: 'agree at q ∈ {1, ∞}; strict for q ∈ (1, ∞) unless …'. Also: `:84–86` asserts that the resolvent S agrees with Σ(Pⁿ − Π) under summable mixing without proof (one line closes it: both solve (I−P)X = I − Π with ΠX = 0). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:floor_exact"
bucket = "B"
decls = []
notes = "Finite, periodic chains included. NOT `Core.Mixing.S`: that S is the series and needs summable mixing, which on a finite irreducible chain is aperiodicity (kb 0058). Needs a ~250-line resolvent file, S = (1 - P + Pi)^(-1) - Pi, kernel = constants via `Balance.UniqueInvariant`; then Hoelder and three explicit extremizers. ~350 lines more. (Review 2026-09-24.)"

[[row]]
label = "cor:separation"
bucket = "B"
decls = []
notes = "Clause 1 is immediate from prop:floor_exact. The footprint clause holds at z >= t (the proof's own restriction) and is false at z < t, where the shape moves the sampled law. Needs prop:shape_cost(1). ~50 lines. (Review 2026-09-24.)"
paper_findings = ["**Overreach.** `app_finit.tex:117–121` states the footprint clause for every z; the proof restricts it to z = t. It holds whenever E⁻ = 0 at the minimizer, which covers z ≥ t; at z < t the sampled law of the minimal-loss flow depends on the shape of F_init. Also: the corollary cites `prop:shape_cost`, which comes after it. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

