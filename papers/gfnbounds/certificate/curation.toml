notes = "Qualitative; 'traps' need a directed cycle among zero-flow states. The 'collapsed planner' pointer at :284 refers to the Appendix E withdrawn on 2026-09-05. (Review 2026-09-24.)"
paper_findings = ["**An orphan pointer.** The retraction register records the old Appendix E (planner collapse) as withdrawn by the author on 2026-09-05; this remark still points at it. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]
