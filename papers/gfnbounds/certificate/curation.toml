paper_findings = ["**Three small gaps in Mathlib v4.31.0 were found and filled locally**, all clean upstream candidates and none of them blocking: `Measure.bind` has no absolute-continuity lemma (`mu << nu -> mu.bind kappa << nu.bind kappa`); binary additivity of `bind` in the measure is absent (only the countable `Measure.bind_sum`); and there is no `SigmaFinite (mu.bind kappa)` instance even for a Markov kernel and a finite `mu`. Not a paper finding -- recorded here because it is what the formalization of `theo:universality_L2_full` cost."]

