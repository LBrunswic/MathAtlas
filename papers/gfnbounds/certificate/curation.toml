[[row]]
label = "lem:coverage"
bucket = "B"
decls = []
notes = "(a) is `forall M, not nu_B <= M * nu_T`, and w_min = 0: trivial. (b) Kac without a chain: a hitting system for x plus invariance, then `lam_eq_visits_div` (~200 lines). (c) per state it is the commute time (2 + sigma-bar)/p_x >= (2 + sigma-bar)/N(x), by linear systems (~150); the all-states cover time needs an i.i.d.-excursion path layer with Wald (D). (Review 2026-09-24.)"
paper_findings = ["**Worth knowing.** Also: 'no finite constant can hold' (`:50–51`) needs a flow in the family with residual inside A and positive TV — free outflow with a finite ergodic star policy supplies one, unsaid; A_∞ = (+∞)⁰ is meaningless at q = ∞ though the conclusion holds; and ν_T means a measure on internal states for the stable bound and on all vertices for the rate, so a ν_T carried by the internal states has w_min = 0 whatever its coverage. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:backward_replay"
bucket = "B"
decls = []
notes = "No calculus layer is inherited: the three constants are closed-form Lean definitions (`rhoSigma`, `kappa`, the step cap). (1) finite sums; (2) inequalities between them, with L_nu(mu_0) >= w_min L_lambda(mu_0), which the printed proof omits; (3) `lam_eq_visits_div` plus a Green system with source mu_buf, renewal reading disclosed. ~300-400 lines. (Review 2026-09-24.)"
paper_findings = ["**The body credits backward replay with more than the appendix proves.** `cv_stable.tex:39–41` reads 'uniform reweighting is optimal for the certificate's constant, … backward replay for the training rate'. `prop:backward_replay` is titled and proved as *guarantee*-optimality: ϱ_σ, κ and the step cap are maximized at λ. Its own numerics (`app_replay.tex:332–341`, Figure A3) report the exact linearized rate peaking at the interior α = 0.45 and, on other graphs, at α = 1. Smallest fix: 'backward replay for the rate guarantee'. The W2 class: a body sentence that outruns its appendix. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)", "**Gap in a true statement, and an imprecise formula.** (2): 0 violations in 60,000 draws on 30 graphs once the repair is made; `audit_replay.py:108–112` fixes loss0 = 1 for every ν, so its evidence for the Łojasiewicz factor tests the incomplete reading. (3): 'the chain killed at s₀ started from μ_buf' never visits s₀ or s_f; the realized measure is (1_{s₀} + 1_{s_f} + G_{μ_buf})/(2 + |G_{μ_buf}|), which is what the audit's `visit_counts` computes; the literal reading gives w = 0 at s₀ and s_f. The renewal–reward theorem behind (3) is not named. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:stable_uniform"
bucket = "B"
decls = []
notes = "(1) essSup >= mean (`Measure.lintegral_rnDeriv`); its equality clause is false at q = inf (A_inf = 1), so restrict to q < inf. (2) is `db_stable_frozen_FM_mixing` at T = the star policy, lambda = nu_B, w = dnu_T/dnu_B, once the quadratic loss's flow is h' = -Hh; nu_B-invariance must be added. ~200 lines finite, ~450 general. (Review 2026-09-24.)"
paper_findings = ["**Endpoint error and a hypothesis by dependency.** At q = ∞, A_∞ = ‖·‖⁰ = 1 = ν_B(𝒮)⁰, so 'the same equality case' fails, and the constant (2/t)ν_B(𝒮) does not depend on ν_T at all; the item is right for q < ∞. In (2), without ν_B-invariance P⋆1 ≠ 1, 'transverse' is undefined and the constant shift that frees the non-negativity constraint fails. Minor: 'gradient descent at rate …' is a statement about the flow; discrete descent needs ε ≤ (8‖dν_T/dν_B‖∞)⁻¹. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "lem:transfer"
bucket = "B"
decls = []
notes = "Finite loop closure: `fmDefectE_eq` on `edgeFlow`, row sums, `phat_snk_of_ne_src`, `ratio_smul`. Carry pihat(s_f -> .) = kappa/t and g''(1) > 0, which the statement omits. ~250-350 lines, low risk. The bridge from balance losses to the TV certificate: the most valuable row of C-F. (Review 2026-09-24.)"
paper_findings = ["**Two hidden hypotheses.** The residual identity holds to 1.8e-15 on 40 graphs when the sink row is frozen at κ/t, and is off by 0.85 on the test family without it; the attribution to `prop:tb_gradient` is, per the 2026-09-18 map ruling, a recall of theo:universality_graphs' closing paragraph. c_g(½) = (2 log 1.5)² for (log x)² is confirmed. The band hypothesis on r is used only by the second inequality. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:alpha_star"
bucket = "D"
decls = []
notes = "The layer is built (`training_speed_full_complete`); the proof is not. As printed the envelope is a model: K and c absorb alpha-dependent factors, w_min = 1 - alpha voids alpha = 1, and q <= 2 is needed. The two measure bounds and the argmin are ~150 lines; B once restated for alpha <= alpha_max < 1 (~600-900 lines). (Review 2026-09-24.)"
paper_findings = ["**Overreach.** `app_replay.tex:237–247` (proof `:260–262`) presents J_T(α) = K(ν_B(𝒮)/α)^{1/q}e^{−c(1−α)T} as the certified error, with K 'collecting the T- and α-independent factors'. The chain through theo:training_speed_full does not give that: the entry time t₁ ≤ T₀(ν_α) has w_min²ε₀⁴ in its denominator, the local rate carries a trajectory-dependent m₁, and ‖w(ν_α)‖∞ and L_{g,ν_α}(μ₀) depend on α. With ν_B carried by the internal states, w_min(ν_α) = 1 − α exactly (at s₀ and s_f), so at α = 1 — where α* sits for small T — the theorem certifies nothing. Using the transfer lemma at q = 2 inside a general-q envelope needs q ≤ 2. Strongest supported form: for q ∈ [1, 2] and α ≤ α_max < 1, TV_T ≤ K(α_max)(ν_B(𝒮)/α)^{1/q}e^{−c(1−α)T}, minimized at min(α_max, 1/(qcT)). The audit's family is λ mixed with `ones(n)/n` over all vertices, s₀ and s_f included, which is also what Figure A3's caption prints ('unif'); per the review, 'the exact-rate optimum can sit at α = 1' holds for that family (13/40 graphs) and for none of the stated one (0/40). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "lem:balanced_min"
bucket = "B"
decls = []
notes = "Part 1 is `IsLocalMin.hasFDerivAt_eq_zero`; the Gauss-Newton Hessian follows by the chain rule at g'(1) = 0. The kernel clause needs nuhat > 0 on every edge (false otherwise) and a proof, in edge-flow coordinates; fix the (F, P_F, P_B) parameterization first. ~150-300 lines. (Review 2026-09-24.)"
paper_findings = ["**An unproved clause with a hidden hypothesis.** In edge-flow coordinates log r = log f^F − log f^B is a submersion, so a direction moving a single residual lies in ker H without being tangent whenever ν̂_e = 0. Also: the variable list omits P_F, which the objective contains; 'exactly' is never used. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "lem:eq10_occupation"
bucket = "B"
decls = []
notes = "Assembly on `Graph/Morozov.lean`: `eq_smul_invProb`, `lam_eq_visits_div`, `IsGreen.sum_visits`, `IsGreen.sum_eq_sigmaBar`, `IsGreen.snk`; ~60-100 lines, N and sigma-bar characterized, not constructed. Paper slip: F(S) = (2 + sigma-bar)Z holds for the full vertex set, not the internal states. (Review 2026-09-24.)"
paper_findings = ["**Notational slip, off by exactly 2Z.** The regularizer identity downstream uses the total, which is right. Unstated hypothesis: κ > 0 on every terminating state. Checked on 300 random graphs to 6e-12. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "lem:local_pl"
bucket = "B"
decls = []
notes = "Quadratic FM model: `hessOp_coercive` fed by `hcoer_of_graph`, then one Cauchy-Schwarz step; it holds for every h, no spectral theorem (kb 0020). ~60-120 lines. The objective it serves is DB, whose constant is g''(1) w_min/(1 + B-hat_sigma)^2. (Review 2026-09-24.)"
paper_findings = ["**Worth knowing.** ⟨h,Hh⟩ = ⟨h − Πh, Hh⟩ ≤ ‖h − Πh‖·‖Hh‖ ≤ (⟨h,Hh⟩/ϱ_σ)^{1/2}‖Hh‖ gives the inequality on all of L²(λ). Across 300 graphs ζ⁺_min − ϱ_σ ≥ 1.6e-2. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:two_timescale"
bucket = "D"
decls = []
notes = "Deterministic, not stochastic approximation. The tracking bound is an abstract Gronwall (`le_gronwallBound_of_liminf_deriv_right_le`, ~150 lines, hypotheses carried, needs a region clause the paper omits). The shadow-ODE clause is unproved ('standard singular perturbation') and Mathlib has no Tikhonov layer. Hypothesis (i) is not what lem:local_pl delivers. (Review 2026-09-24.)"
paper_findings = ["**Conditional as proved; the rest is unproved.** The Young/Grönwall step is correct as a conditional statement. Adding variables adds gradient terms only under a product metric, unstated. In (F, P_B) the constant becomes ≥ ϱ_σ/m² (Euclidean F, m = Z(2+σ̄)) or ≈ λ_min·ϱ_σ (log F). ϱ_min > 0 fails as the drift nears its target (`prop:constants_path`). The argument is deterministic, not stochastic approximation. On slow time scales Tikhonov gives trajectory error O(λ_reg); O(λ_reg²) is the vector-field error (reasoned in the review, not tested). (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "lem:normalization"
bucket = "D"
decls = []
notes = "The fixed-row sentence is an attribution (maksimov2026ot, Thm 3.2) and needs an LP-duality or flow-decomposition layer absent at the pin. The learned-row sentence, the one the objective uses, is shortest-path dynamic programming at B level (~150-250 lines, minimum principle `nonneg_of_superharm_off_src`). (Review 2026-09-24.)"
paper_findings = ["**Worth knowing.** Relatedly, `prop:drift_target`(ii) does not say whether the initial row is fixed or learned, and `:196`'s 'the endpoint' presupposes the convergence (iii) leaves open; interior critical points of σ̄ are global minima (∂σ̄/∂p(u|s) = N(s)h(u)), so a stall happens at the boundary. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:drift_target"
bucket = "D"
decls = []
notes = "(i) is descent along a projected gradient flow; (ii) inherits lem:normalization (attribution for a fixed initial row, dynamic programming for a learned one); (iii) makes no claim. Interior critical points of sigma-bar are global minima, so a stall is at the boundary. (Review 2026-09-24.)"

[[row]]
label = "prop:constants_path"
bucket = "B"
decls = []
notes = "The constants exist in Lean (`sigmaStar`, `sigmaBar`, `BhatSigma`, `rhoSigma`). New: continuity of the Green and hitting solutions in p at a no-trap boundary point (`continuousAt_matrix_inv`). ~300-500 lines. The review reproduced every number of the two-route path. (Review 2026-09-24.)"

[[row]]
label = "rem:replay_rescue"
bucket = "B"
decls = []
notes = "Certifiable: the cap survives, rho_sigma -> 0, and w_min <= 1 (prop:backward_replay(1)); ~50 lines after prop:constants_path. 'The speed loss is intrinsic' holds for the explicit certificates only: along the path the exact gap stays 0.76 -> 0.40. (Review 2026-09-24.)"
paper_findings = ["**Worth knowing.** On an aperiodic variant the mixing sum diverges (> 3.9e3) while the exact gap stays 0.76. 'No training measure can buy it back' amounts to w_min ≤ 1, which is `prop:backward_replay`(1), cited only as 'Appendix D'. (Read-only review of Appendices C–F, 2026-09-24; not yet re-checked by `proof-checker`.)"]

[[row]]
label = "prop:gap_collapse"
bucket = "B"
decls = []
notes = "No spectral-gap layer: a test-vector upper bound (1_C - Pi 1_C) plus H >= 0 (`hessOp`, `meanOp_hessOp`, `linHess_coercive`); define zeta_min^perp as an infimum of Rayleigh quotients. New: continuity of `linHess` in (K, lambda). ~200-350 lines. (Review 2026-09-24.)"

[[row]]
label = "rem:one_leak"
bucket = "T"
decls = []
