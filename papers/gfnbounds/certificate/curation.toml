notes = "Closed in A. The current account of this row -- what is certified, at what generality, and every disclosure -- is its scope notes, which the Lean map owns and dates newest first (`formalization_ledger.py node lem:lift_wellposed` prints them). This field held the row's PARTIAL record of 2026-09-08 and was not refreshed when the row closed; that record survives inside the scope notes. Refreshed 2026-09-24."
blocked_on = ""
paper_findings = ["**The contraction step of `lem:lift_wellposed` names the wrong conditional** (`proofs.tex:521`). The proof says '*since under lambda_2 the conditional law of s given s' is pi_back(s' -> .), the map d mu/d lambda_2 |-> d(m_1 mu)/d lambda is a conditional expectation*'. Both halves are true but they are about different conditionals: averaging against `pi_back(s' -> .)` produces the SECOND marginal `m_2 mu`. The map `eq:muK2_density` actually needs is `d(m_1 mu)/d lambda (x) = sum_w (d mu/d lambda_2)(x,w) pi_forward^lambda(x -> w)` -- the conditional expectation given the FIRST coordinate, against the FORWARD conditional, which the same lemma introduces one sentence later. The conclusion is unaffected: both conditional expectations are L^2 contractions, and 'both marginals of lambda_2 equal lambda', which the paper does state, closes either route. A slip in the proof's citation, not an error in the result -- the formalization takes the forward route."]
size = "L"

