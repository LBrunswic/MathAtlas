paper_findings = ["**Item (3)'s sampler clause is conditional on a theorem the paper cites rather than proves.** \\\"in particular its sampler satisfies `s_tau ~ kappa/Z` by Theorem `theo:sampling_theorem`\\\" rests on `theo:sampling_theorem` (`proofs.tex:28-51`), quoted from `bengio2021flow`. The flow-matching identity itself is finite algebra and is being formalized; the sampler consequence can only ever be carried as a hypothesis in Lean. The same applies to the concluding paragraph at `proofs.tex:981`. Worth a word in the appendix saying which half is self-contained.", "**Bridging the finite-graph result to `Core`'s universality predicates is blocked on a Mathlib gap, not on plumbing.** `GFNBounds.Core.StronglyUniversalAt` lives on a Banach lattice, and Mathlib v4.31.0 has **no `HasSolidNorm` instance for a `Pi` type** -- the only instances in the tree are `R`, `Q`, `Z`, `bounded continuous functions` and `Lp`. Instantiating at `S -> R` would mean declaring a new global order-lattice-norm instance. This is `CLAUDE.md`'s obstruction 2 in its finite-dimensional guise, where nobody expects it. What is proved instead is strictly STRONGER than what the bridge would give: the defect vanishes POINTWISE on the internal state space, which subsumes the paper's 'simultaneously for every p in [1, infinity]'."]
