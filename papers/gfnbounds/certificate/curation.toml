terminal_reason = "A measurement on one instance (the gap stalls at 1.435e-2 when only the escape closes); certifying the instance buys nothing and the figure script is the evidence. Review 2026-09-24."

[[row]]
label = "rem:lp_degeneracy"
bucket = "T"
