# Ledger configuration for bbs: T. Barbot, F. Bonsante, J.-M. Schlenker, Collisions of particles in
# locally AdS spacetimes I (arXiv 1010.3602 v1, Comm. Math. Phys. 2011), an EXTERNAL paper (DEC-132,
# as DEC-34 for Barbot). Its Lean home is `lean-gx/` (GX / GXScaffold), shared with papers/gx, where
# the 3+1 programme's suspension layers live (papers/bbs/REVIEW.md §B); the labels carry bbs-prefixed
# kinds (bbsthm, bbsprop, ...) so that neither ledger reads the other's docstring marks (kb/0024).
# Every statement carries its bbs label first, ahead of the authors' own label when there is one.
[paper]
root = "../legacy/labeled"
document = "colI_v1.tex"
notation = []
files = [["colI_v1.tex", "body", "P"]]
env_alias = { prop = "proposition", cor = "corollary", defi = "definition" }
label_prefixes = ["bbsthm", "bbsprop", "bbslem", "bbscor", "bbsdef", "bbsrem", "bbsex"]
coverage_recursive = false

[paper.titles]
P = "Collisions of particles in locally AdS spacetimes I (one file)"

[lean]
root = "../../../lean-gx"
strict = ["GX"]
scaffold = ["scaffold/GXScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
