# Authored. The curated fields of the bbs ledger (tools/ledger_curate.py --paper papers/bbs).
# BBS I (arXiv 1010.3602 v1) is an EXTERNAL paper (DEC-132, as DEC-34 for Barbot): read and
# formalized, never rewritten. Its Lean home is lean-gx/ (GX, GXScaffold), where the 3+1
# programme's suspension layers live (GX.Suspension.*, keyed to papers/bbs/REVIEW.md §B, not to
# ledger labels): at wave 0 (T-bbs-ledger, 2026-11-20) no row has a Lean anchor and none is marked.
#
# Labels. Every statement environment carries a `bbs<kind>:` label first (bbsthm, bbsprop, bbslem,
# bbscor, bbsdef, bbsrem), ahead of the authors' own label when it has one, whose name it reuses
# (`pro:classising` -> `bbsprop:classising`); otherwise the slug is autolabel's. So neither the gx
# ledger nor this one reads the other's docstring marks (kb/0024).
#
# Edges. The statement DAG has no edges yet: the authors' \ref's point at their own labels, which
# the ledger (tools/texgraph.py) does not resolve once a statement's first label is the bbs one --
# Barbot's ledger has the same gap. Resolving secondary labels is a tool change, left to the planner.
#
# Natural-language status. The ledger reads a proof environment that directly follows a statement.
# BBS often argue in the prose before a statement, or put a remark between the statement and its
# proof; the overrides below record where the proof is (line numbers of legacy/labeled/colI_v1.tex).
# Two theorem-like rows have no proof in the paper and stay `open`.

[[row]]
label = "bbsprop:classising"
nl_status_override = "proved"
nl_reason = "a summary stated at the head of §3 (l.531); the classification it lists is carried out in §3.3-3.5 (the (Gamma_p, l(p))-circles through RP1-circles, l.673 onward), with no proof environment"

[[row]]
label = "bbscor:de_sitter_region_homeomorphic"
nl_status_override = "proved"
nl_reason = "argued in the paragraph before it (l.2025-2033): the isotropic foliations of a de Sitter region and the Poincare-Hopf index formula"

[[row]]
label = "bbscor:Lclosed"
nl_status_override = "proved"
nl_reason = "argued in the paragraph before it (l.2041-2044): no closed causal curve in T and the Poincare-Bendixson theorem"

[[row]]
label = "bbsthm:thierry"
nl_status_override = "proved"
nl_reason = "its proof is the proof environment at l.2212, after the remark bbsrem:theorem_despite_terminology_inspired"

[[row]]
label = "bbslem:closure_closed_edgeless_achronal"
notes = "Stated without proof (l.2362), in the singular-spacetime causality background of §6.1; stays open."

[[row]]
label = "bbscor:hs_sphere_lemma_surgery_key_spacetime"
notes = "Stated without proof (l.3042) as a corollary of Lemma surgery-key (bbslem:surgery_key); the construction that follows uses it. Stays open."
