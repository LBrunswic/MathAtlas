# Authored. The curated fields of the bbs ledger (tools/ledger_curate.py --paper papers/bbs).
# BBS I (arXiv 1010.3602 v1) is an EXTERNAL paper (DEC-132, as DEC-34 for Barbot): read and
# formalized, never rewritten. Its Lean home is lean-gx/ (GX, GXScaffold), where the 3+1
# programme's suspension layers live (GX.Suspension.*, keyed to papers/bbs/REVIEW.md §B, not to
# ledger labels): at wave 0 (T-bbs-ledger, 2026-11-20) no row has a Lean anchor and none is marked.
#
# Labels. Every statement environment carries a `bbs<kind>:` label first (bbsthm, bbsprop, bbslem,
# bbscor, bbsdef, bbsrem), ahead of the authors' own label when it has one, whose name it reuses
# (`pro:classising` -> `bbsprop:classising`); otherwise the slug is autolabel's. So neither the gx
# ledger nor this one reads the other's docstring marks (kb/0024).
#
# Edges. The authors' \ref's to their own (secondary) labels resolve since T-ledger-secondary-labels
# (43c0840): 17 edges.
#
# Triage (T-bbs-triage, 2026-11-20). Every row is bucket D (deferred: its layer is not built), with
# its REVIEW.md §A row, tag, layer (§B: L0–L3) and wave (§E: W0–W5) in its notes. No row needs only
# L0–L1: the link rows need HS² and its pointwise stabilisers (L2, W0–W2), the flat ones the
# scale-equivariant suspension that F2 of REVIEW §I requires (L3b), §5 the 2D topology of W4, and §6
# the singular-spacetime vocabulary of L3b, over causal theory ETT already carries. So nothing here can
# be dispatched before BBS-Q1 (T-bbs-layer-home). GX.Suspension.{Conic,Celestial,Affine} (strict,
# sorry-free) are L0–L1 infrastructure: the corrected conic structure, the celestial suspension, affine
# links and the boost obstruction F2. They anchor no row of this ledger. §7 (AdS global examples) is
# read as out of scope by REVIEW §A row 48; that reading is not a ruling.
#
# Natural-language status. The ledger reads a proof environment that directly follows a statement.
# BBS often argue in the prose before a statement, or put a remark between the statement and its
# proof; the overrides below record where the proof is (line numbers of legacy/labeled/colI_v1.tex).
# Two theorem-like rows have no proof in the paper and stay `open`.

