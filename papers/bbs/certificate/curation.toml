[[row]]
label = "bbsrem:causally_regular_hs_sphere_containing"
lean_stated_override = "scaffold"
lean_proved_override = "partial"
bucket = "D"
blocked_on = "OQ-119 (a) (Θ = 0 without ι'_L) and (b) (the bucket D scope of § 7)"
extra_lean_files = ["scaffold/GXScaffold/Interaction/TheoremMTheta.lean", "GX/BBS/PhotonCircles.lean", "GX/BBS/IPm.lean", "GX/BBS/RP1Circles.lean", "GX/BBS/HSModel.lean"]
decls = ["GX.DSAnnulus.IsIotaPrime", "GX.DSAnnulus.HasIotaPrime", "GX.DSAnnulus.IsIotaPrime.exists_projIso", "GX.DSAnnulus.remark_projIso", "GX.DSAnnulus.remark_projIso_of_pos", "GX.DSAnnulus.IsDevelopment.exists_projIso_of_pos", "GX.exists_projIso_of_lift", "GX.surjective_of_equivariant", "GX.DSTilde", "GX.dsCover", "GX.iotaTilde", "GX.modelAnnulus_isIotaPrime"]
notes = "Triage (T-bbs-triage, 2026-11-20): REVIEW §A row 48 (§7); AdS global examples and surgery; layer §7 (AdS); wave none. REVIEW §A reads §7 as out of the flat scope; not ruled. T-3p1-theorem-m-theta (atlas-team, 2026-11-23), audit AUDIT-1 minor (a checklist row overstated, the « induced by ι'_L » commentary stronger than the statements, a duplicate lemma; the first two fixed in the docstrings): scaffold/GXScaffold/Interaction/TheoremMTheta.lean, sorry-free, kept in the scaffold as 3+1 research. Partial, unmarked. Under the named hypothesis GX.DSAnnulus.IsIotaPrime (ι'_L and the diagram of l.2991–3004; properness and the submersion are not used), ι'_L induces a projective isomorphism ῑ : C₋ ≅ C₊ for every Θ (IsIotaPrime.exists_projIso, remark_projIso); the model dS² ∪ ∂ℍ²± satisfies it (modelAnnulus_isIotaPrime). With no hypothesis, when Θ₋ > 0 (e.g. C₋ elliptic), some projective isomorphism C₋ ≅ C₊ exists (remark_projIso_of_pos); that ι'_L induces it is not stated there. Θ = 0 without ι'_L is open (OQ-119 (a)). Hypotheses: Σ causally regular HS-sphere, weakened (any HS-surface carrying N4's annulus GX.DSAnnulus); only elliptic singularities, weakened (not used); the left foliation, weakened (both ε = ±1)."
paper_findings = ["The remark (l.3013–3016) has no proof, and one step is implicit: for ι'_L : C̃₋ → C̃₊ to induce a map C₋ → C₊ it must commute with the deck transformations, which follows because ι'_L lifts the leaf projection of the closed annulus and fixes C̃₊ (forced by the diagram), plus continuity on the connected strip (GX.DSAnnulus.IsIotaPrime.apply_add_one). One sentence would close it.", "For Θ₋ > 0 (in particular C₋ elliptic) the conclusion needs no ι'_L: the holonomy h of the annulus has no fixed point on ℝP̃¹, so d|C̃₊ is onto ℝP̃¹ (GX.surjective_of_equivariant, the step « d|C̃₊ is a homeomorphism » of l.3006), and (d|C̃₊)⁻¹ ∘ d|C̃₋ induces a projective isomorphism (GX.DSAnnulus.remark_projIso_of_pos).", "Two typos in the diagram of l.2999–3003: its top-left corner reads « \\tilde D\\cup\\tilde C_-\\cup\\tilde C » (l.3000) for D̃ ∪ C̃₋ ∪ C̃₊; its bottom-right corner « \\tilde R_+ » (l.3002) should be R₊, already the line ≅ ℝP̃¹ (l.2980–2981)."]

