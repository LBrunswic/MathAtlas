[[row]]
label = "bbsdef:hs_surface_topological_surface_endowed"
bucket = "D"
blocked_on = "OQ-104 (the reading of « topological surface »: second countability or connectedness)"
notes = "Triage (T-bbs-triage, 2026-11-20): REVIEW §A row 3; link; layer L2; wave W0. T-bbs-hs-model (atlas-team, 2026-11-22), audit AUDIT-1 minor (docstring line citations about 16 lines early, and the findings' line numbers; fixed at graduation): GX/BBS/HSModel.lean, strict, sorry-free. HS² = the rays of ℝ^{1,2} as the unit sphere of Minkowski 2 under Causal.Flat.lorentz 2 (the paper's gloss of SO₀(1,2), l.594–596; generated by rotations and boosts, boostRot_eq_top; « identity component », BBS-Q6, not proved for want of a topology on the group, and not needed: the orbit theorems hold for every subgroup containing them). HS² is an analytical structure homeomorphic to 𝕊²; ℍ²±, dS², ∂ℍ²± partition it, each one orbit; GX.IsHSSurface with isHSSurface_iff. Partial, unmarked: the reading of « topological surface » is OQ-104."

decls = ["GX.IsHSSurface", "GX.IsTopologicalSurface", "GX.isHSSurface_iff", "GX.HS", "GX.hsAction", "GX.analyticStructure_hs2", "GX.isHSSurface_hs2", "GX.IsHSSurface.opens"]
extra_lean_files = ["GX/BBS/HSModel.lean"]
paper_findings = ["Minor, a count (colI_v1.tex:605–606). The hyperbolic clause swaps its counts: a hyperbolic element of SO₀(1,2) fixes two opposite pairs in ∂ℍ²± and one pair in dS², not one and two (the total, 6, is right). Lean, for the standard boost: GX.HS.boost_fixed_deSitter_ncard (2 fixed points in dS²), boost_fixed_deSitter_iff, boost_fixed_bdPlus_iff; that every hyperbolic element is conjugate to one is classical, not formalized.", "Typos (colI_v1.tex): l.595 « the group of of »; l.605 « if and only it admits » (missing « if »); l.609 « admits a fixed in » (missing « point »)."]
