paper_findings = ["Minor, a slip (l.826): « time-like singularities » where light-like is meant (l.828–833 treat p ∈ ∂ℍ²±).", "At a light-like p (l.828–833) the two tangent directions lie on the dS² side (B(p,w) = 0 gives Q(p+sw) = s²Q(w) > 0), so the printed i⁻ is the closed arc {B(p,·) ≥ 0}. Hence l.835–836 is false as printed at every light-like p, and l.844's « open » fails for the regular link at p ∈ ∂ℍ²₊ (proved counterexamples in GX/BBS/IPm.lean). Smallest correction: exclude the tangent directions from the dS² side; then l.835–836 and l.844 hold at every p (the strongest true forms are proved). OQ-116 (b)."]
[[row]]
label = "bbsrem:previous_section_observed_only"
lean_stated_override = "scaffold"
lean_proved_override = "partial"
blocked_on = "OQ-120 (a)–(c) (readings of « isomorphic », « holonomy ⟨g⟩ », positive/negative), OQ-116 (a); the existence half GX.exists_positive_negative is a tagged sorry (the quotient-circle construction)"
extra_lean_files = ["scaffold/GXScaffold/BBS/HSSingularities.lean", "scaffold/GXScaffold/Interaction/FunnelGTilde.lean", "GX/BBS/IPm.lean", "GX/BBS/RP1Circles.lean", "GX/BBS/HSModel.lean"]
decls = ["GX.rp1Iso_of_zpowers_eq", "GX.conj_inv_swaps_timelike_spacelike", "GX.GTilde.lt_apply_iff_of_conj_inv", "GX.not_isIso_of_positive_of_negative", "GX.exists_positive_negative", "GX.GammaLinkCircle.IsIso", "GX.GammaLinkCircle.IsSpacelikePositive", "GX.GammaLinkCircle.IsSpacelikeNegative"]
notes = "Triage (T-bbs-triage, 2026-11-20): REVIEW §A row 13; link; layer L2; wave W2. T-bbs-hs-singularities (atlas-team, 2026-11-23), audits AUDIT-1 major (a false paper finding: the time-like clause of « needs non-trivial holonomy »; fixed in one round) and AUDIT-2 minor (two wordings, fixed at integration). scaffold/GXScaffold/BBS/HSSingularities.lean, ten tagged sorrys (normal forms in PSL(2,ℝ), the existence halves, single-element fixed points at time-like and light-like p, the arc structure of ℓ(p)). Partial, unmarked. (i) Only one hyperbolic ℝP¹-circle of holonomy ⟨g⟩: GX.rp1Iso_of_zpowers_eq, holonomy read in G̃ (OQ-120 (b)). (ii) A conjugacy between g and g⁻¹ swaps time-like and space-like components: GX.conj_inv_swaps_timelike_spacelike, under OQ-116 (a). (iii) Positive and negative are not isomorphic: GX.not_isIso_of_positive_of_negative, isomorphism with the same p (OQ-120 (a)), positive/negative in the l.915 form (OQ-120 (c)); positivity does not depend on the choice of θ, E, D (IsSpacelikePositive.forall) and is an isomorphism invariant (IsIso.isSpacelikePositive), and every space-like circle of degree ≥ 1 is exactly one of the two (spacelike_dichotomy). « Does not extend »: the existence of a positive and a negative circle, GX.exists_positive_negative, is a tagged sorry. The prose of § 3.3 proved on the way: ℝP¹-circles isomorphic iff their oriented lifted holonomies are conjugate in G̃ (GX.rp1Iso_iff_conj; the printed group form only for two equal hyperbolic groups), the developed image falls into exactly one of the three cases (GX.IsLiftedDevPair.exhaust), the (k, [g]) parametrisation for every degree (rp1Iso_iff_of_degree_pos), the degree even at every non-time-like p (even_of_nonneg)."
paper_findings = ["l.794–795 (space-like) and l.797–800 (light-like): « L is a hyperbolic (resp. parabolic) ℝP¹-circle » needs non-trivial holonomy. At p ∈ dS² or on ∂ℍ²±, trivial Γ_p-holonomy gives a central lifted holonomy δ^{2n}, neither hyperbolic nor parabolic (GX.regular_not_isHyperbolic, GX.not_isParabolic_delta_sq, at a regular point; the singular counterexample, the n-fold cyclic cover of ℓ(p) for n ≥ 2, is argued, not built). With non-trivial holonomy the space-like claim is proved (GX.GammaLinkCircle.IsLiftedDev.isHyperbolic_of_deSitter). Smallest correction: « with non-trivial holonomy » in both items. The time-like item (l.788–791) is not affected: central holonomy is elliptic (l.693–694, OQ-113 (d)).", "Minor, a typo (l.878): « L=i^+(L) = i^-(L)=\\emptyset » for « i^+(L) = i^-(L) = \\emptyset ».", "l.927–928 holds only if « holonomy ⟨g⟩ » is the lifted holonomy group in G̃ (OQ-120 (b)); with the holonomy in PSL(2,ℝ) the circles of every degree share ⟨g⟩ and are pairwise non-isomorphic (argued; examples not built).", "l.746–747: the parametrisation by (k, [g]) holds for every degree k, not only k ≥ 1 (GX.rp1Iso_iff_of_degree_pos). Not a defect."]

