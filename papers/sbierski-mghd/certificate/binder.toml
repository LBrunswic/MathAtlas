# Binder of papers/sbierski-mghd (Sbierski, "On the existence of a maximal Cauchy development for
# the Einstein equations — a dezornification", arXiv 1309.7591): every row split into its ETT theorem
# (layer 1), its localisation properties (layer 2, programme/ladder.toml ids) and its geometric lemma
# per model class (layer 3). Format: tools/binder.py's docstring. Written by the programme-planner,
# 2026-11-20 (T-bind-sbierski-mghd); rebound 2026-11-21 (planning run after the waves of 2026-11-20
# 21:35, 22:45, 23:50) to the ladder nodes and the Lean that exist now. It records how Sbierski's
# argument factors, not what Lean has closed: the ledger's curation stays the loop's.
#
# How the paper factors. lean-causal's CBG (Causal.CBG.*, docs/CBG-DESIGN.md, DEC-29/DEC-60) follows
# this paper's order over an abstract geometry `Causal.CBG.Geometry` whose interface fields ARE the
# localisation properties of the argument:
#   A1 `rigid`          structure morphisms agreeing on an open set of a connected open agree (Lemma 3.1, Cor 3.2)
#   A2 causal facts     every admissible spacetime is absolutely minimal, causally arc-connected, push-up,
#                       tarentin (SingularFlatAxioms; with sing = ∅ for a smooth model); GH ones have
#                       `curves_extend`, a `time_function`, compact J⁺(Σ) ∩ J⁻(p), and are second
#                       countable when Σ is (Geroch 1968)
#   A3 `germ_extension` a morphism extends across a corresponding boundary point (Lemma 3.8)
#   A4 `cauchy_slice`   a local Cauchy slice through a spacelike boundary point (Thm 3.6's τ_q level set,
#                       restarted by local well-posedness, Thm 2.6)
# plus, for Sbierski's "initial data" (a Riemannian (M̄, ḡ, k̄), not a spacetime M₀),
#      `local_uniqueness` any two developments of the same data have a common Cauchy sub-development
#                       (Thm 2.6, second half).
# Since T-lad-cbg-geometry-nodes (9f5cfce) `rigid`, `germ_extension`, `cauchy_slice` (sort `geometry`),
# `curves_extend` and `time_function` are ladder nodes and sit in `localisation`; only
# `local_uniqueness` is still in `open_localisation` (T-lad-development-nodes, behind
# T-abs-cbg-initial-data, which defines it).
#
# Models. `smooth-vacuum` is Sbierski's own class (smooth vacuum Einstein): nothing of it is in Lean
# (no Lorentzian manifolds; T-pkg-smooth-lorentz asks the author how they enter). `flat-gx` (the
# (Isom, Minkowski)-manifolds of DEC-29) is the hub's model and is in Lean: Causal.CBG.flatGeometry,
# Causal.CBG.flat_cbg; its A3 and A4 as instances of the ladder definitions are
# Causal.CBG.flat_germExtFuture / flat_germExtPast (LocalModel.GermExtFuture/Past) and
# flat_slice_future / flat_slice_past. E_0 (BTZ lines) is owed by gx through
# Geometry.ofLocalModelOfBTZ and is not bound here; E_α entries (Causal.Model.EAlphaCauchy) wait on
# OQ-58 (T-bind-ealpha-entries).
#
# Findings of this binder (reported to the master):
# * Every theorem row of §3 has its layer-1 theorem in Lean, sorry-free. Of the model-free lemmas
#   kb/0047 found stranded, Causal.Causality.exists_minimal_of_isCompact (Lemma 3.9's core) is now in
#   the ETT-layer Causal.CompactMinimal and inextensible_ordConnectedComponent_of_le (Thm 3.4's
#   "segment in U_α") in Causal.CurveComponents (T-abs-hoist-model-free, 02b43b6); the IsCorrPair/KSide core and
#   Lemmas 3.9, 3.11's cores in Causal.CorrespondingPoints, Causal.CorrespondingSpacelike
#   (T-abs-hoist-cbg-cores). The others still
#   live in modules that import a model: TwoPiece/ManyPiece (T-abs-hoist-cbg-gluing), injOn_of_injOn_cauchy and
#   Causal.CurvesExtend (T-abs-hoist-time-function); the CBG interface itself (Geometry, Dev, cbg)
#   imports Causal.SingularFlat through A2, a layer-1 question for the author (T-abs-hoist-cbg-geometry).
# * Def 3.5, Thm 2.7's Hausdorff criterion and the bare gluing are Causal.GluingHausdorff (pure
#   topology, T-abs-gluing-hausdorff): Sbierski's Def 3.5 notion is Causal.Gluing.IsCorrespondingBoundaryPair,
#   the gluing is Hausdorff iff no pair corresponds (t2Space_iff_forall_not_isCorrespondingBoundaryPair,
#   family form FamilyGlueData.t2Space_iff_forall_not_isCorrespondingBoundaryPair). OQ-40's
#   non-topological facts are not independent localisation properties in the CBG setting: uniqueness
#   of the corresponding point (Prop 3.7) is proved from causal properties
#   (Causal.CBG.IsCorrPair.eq_of_corresponds), though false for a bare gluing
#   (Causal.Gluing.shearGluing_not_unique); openness of C in ∂U (Lemma 3.8) is derived from A3
#   (Causal.CBG.CGHDData.isOpen_correspondingSet), though false for a bare gluing
#   (Causal.Gluing.shearGluing_not_isOpen_in_frontier).
# * Prop 3.7 (i) ⇒ (ii) by timelike curves and strong causality (Sbierski's route) is not in Lean: Lean
#   derives it from A3 (CGHDData.tendsto_comp), while Sbierski proves A3 (Lemma 3.8) from Prop 3.7 (ii).
#   A smooth-vacuum discharge of A3 by Sbierski's proof would be circular: T-abs-sbierski-prop-3-7,
#   now behind T-abs-hoist-cbg-cores (the layer-1 rule).
# * Lemma 3.9 (CGHDData.exists_spacelike_corresponding, Causal/CBG/NoCorresponding.lean:228) uses no A3:
#   CGHDData is only the GH setting of A3's hypotheses; the proof consumes A2 (closed J⁻ and the K⁻
#   calculus through kSide_future, which uses curves_extend; SingularFlatAxioms.K_monotone) and
#   exists_minimal_of_isCompact. The 2026-11-20 binder had germ_extension open on this row; dropped.
# * Lean's CBG takes a GH spacetime M₀ as initial datum; Sbierski's datum is (M̄, ḡ, k̄), and his Thm 2.8
#   needs Thm 2.6's local uniqueness to compare GHDs that share no M₀: T-abs-cbg-initial-data.
# * Routes replaced in Lean (each recorded in the module's checklist): Lemma 3.3 by lifting causal
#   curves along a local homeomorphism (no geodesics); Lemma 3.9 by a ≤-minimal point of a compact set
#   (Zorn, no null geodesics, no openness of C); the GH of the gluings by chains (TwoPiece, ManyPiece),
#   not timelike curves; the cocycle (3.15) through the ppcm, not through an intersection of CGHDs.

