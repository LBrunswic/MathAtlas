note = "Lemma 3.8 (Maximal_GHD2.tex:585, proof 590–611). The extension IS A3, the ladder node germ_extension (Causal.CBG.LocalModel.GermExtFuture/Past), an axiom of the geometry; 'C open in ∂U' is derived from it (isOpen_correspondingSet, the ladder's consequence at germ_extension) and false as topology (Causal.Gluing.shearGluing_not_isOpen_in_frontier, OQ-40). Sbierski's proof (exponential maps in convex neighbourhoods, after Prop 3.7 (ii)) is the smooth-vacuum proof of A3; flat-gx's is one group element on a connected chart."
[[bind.geometric]]
model = "smooth-vacuum"
proves = ["germ_extension"]
by = ["T-loc-vacuum-rigid-germ", "T-abs-sbierski-prop-3-7"]
[[bind.geometric]]
