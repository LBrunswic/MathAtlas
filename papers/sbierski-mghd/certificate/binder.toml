ETT goes beyond the paper (E_0, whose BTZ lines no smooth GHD has). The mark is the master's once the layer-3 discharge exists; until then the label stays unmarked. (i) ⇔ the K⁻ bijection is corresponding_K; (iii) ⇒ (i) corresponds_of_tendsto; uniqueness also eq_of_corresponds — CAUSAL, not topological (Causal.Gluing.shearGluing_not_unique refutes it for bare gluings, OQ-40). The A3 route of before, Causal.CBG.CGHDData.tendsto_comp (Causal.CBG.Corresponding, over the CBG geometry), is no longer this row's ETT theorem. causally_arc_connected enters with the ladder form and the equivalence."
