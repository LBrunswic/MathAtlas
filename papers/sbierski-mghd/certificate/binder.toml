target = "T-lad-cbg-geometry-nodes"
what = "A4: through a boundary point with J⁻(p) ∩ ∂U ∩ J⁺(Σ) = {p}, a local Cauchy slice of a neighbourhood inside closure U (Sbierski Thm 3.6's τ_q level set, Lemma 3.11); past form Causal.CBG.LocalModel.SlicePast"

[[proposed]]
