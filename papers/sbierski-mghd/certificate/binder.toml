[[bind]]
label = "mghdprop:EquivCha"
ett = ["Causal.CBG.sbierski_prop_3_7_i_imp_ii", "Causal.CBG.sbierski_prop_3_7_i_imp_ii_ladder", "Causal.CBG.sbierski_prop_3_7", "Causal.CBG.sbierski_prop_3_7_unique", "Causal.CBG.IsCorrPair.corresponding_K", "Causal.CBG.IsCorrPair.eq_of_corresponds", "Causal.CBG.corresponds_of_tendsto"]
localisation = ["push_up", "tarentin", "causally_arc_connected"]
note = "Prop 3.7 (Maximal_GHD2.tex:544, proof 563–581), rebound 2026-11-21 after T-abs-sbierski-prop-3-7 (48d1cf0). (i) ⇒ (ii) is Causal.CBG.sbierski_prop_3_7_i_imp_ii (Causal.SbierskiProp37, ETT layer): Sbierski's route — the curve's points ≪ the corresponding point by push-up and closed J⁺, strong causality of the target, a causally convex V — for every timelike curve of U ending at p, future or past, from the KSide calculus, with NO A3 (kb/0071); its ladder-only form sbierski_prop_3_7_i_imp_ii_ladder asks push-up, GH and tarentin of both spacetimes and causal arc-connectedness of the target (Hausdorff). Strong causality, which Sbierski uses, follows from GH + tarentin (Causal.Causality.GloballyHyperbolic.stronglyCausal); GH and the KSide facts come from the CGHD setting (CGHDData.isCorrPair, kSide_future, kSide_past), not from a localisation. The equivalence (sbierski_prop_3_7, future and past sides) and 'at most one corresponding point' (sbierski_prop_3_7_unique) add (ii) ⇒ (iii), which needs a timelike curve of U ending at p: M causally arc-connected and p regular; it fails at a BTZ point (Causal.CBG.lightlikeLine_sbierski_prop_3_7_iii_fails), so the label stays unmarked (OQ-65 (a): is arc-connectedness, and regularity, part of the setting? (b): is IsCorrPair + KSide + convexity the paper's CGHD setting abstracted?). (i) ⇔ the K⁻ bijection is corresponding_K; (iii) ⇒ (i) corresponds_of_tendsto; uniqueness also eq_of_corresponds — CAUSAL, not topological (Causal.Gluing.shearGluing_not_unique refutes it for bare gluings, OQ-40). The A3 route of before, Causal.CBG.CGHDData.tendsto_comp (Causal.CBG.Corresponding, over the CBG geometry), is no longer this row's ETT theorem. causally_arc_connected enters with the ladder form and the equivalence; the smooth model has it, and Sing = ∅ there, so every point is regular."
[[bind.geometric]]
model = "smooth-vacuum"
proves = ["push_up", "tarentin", "causally_arc_connected"]
by = ["T-loc-smooth-causal-ladder"]
[[bind.geometric]]
model = "flat-gx"
proves = ["push_up", "tarentin", "causally_arc_connected"]
by = ["Causal.CBG.flat_singularFlatAxioms"]

[[bind]]
label = "mghdlem:ExtendIso"
ett = ["Causal.CBG.CGHDData.isOpen_correspondingSet", "Causal.CBG.CGHDData.exists_isMor_eqOn_correspondingExt", "Causal.CBG.CGHDData.ext_continue"]
localisation = ["germ_extension"]
note = "Lemma 3.8 (Maximal_GHD2.tex:585, proof 590–611). The extension IS A3, the ladder node germ_extension (Causal.CBG.LocalModel.GermExtFuture/Past), an axiom of the geometry; 'C open in ∂U' is derived from it (isOpen_correspondingSet, the ladder's consequence at germ_extension) and false as topology (Causal.Gluing.shearGluing_not_isOpen_in_frontier, OQ-40). Sbierski's proof (exponential maps in convex neighbourhoods, after Prop 3.7 (ii)) is the smooth-vacuum proof of A3; flat-gx's is one group element on a connected chart. Prop 3.7 (ii) is in Lean without A3 since T-abs-sbierski-prop-3-7 (48d1cf0), Causal.CBG.sbierski_prop_3_7_i_imp_ii, so the smooth-vacuum discharge along Sbierski's route is not circular (rebound 2026-11-21; it was, while Lean had (ii) only through A3). The set C and the extension ψ̂ are the model-free definitions Causal.CBG.correspondingSet and correspondingExt, still in Causal.CBG.Corresponding and NoCorresponding (T-abs-hoist-cbg-gluing moves them into the ETT layer)."
[[bind.geometric]]
model = "smooth-vacuum"
proves = ["germ_extension"]
by = ["T-loc-vacuum-rigid-germ", "Causal.CBG.sbierski_prop_3_7_i_imp_ii"]
[[bind.geometric]]
model = "flat-gx"
proves = ["germ_extension"]
by = ["Causal.CBG.flat_germExtFuture", "Causal.CBG.flat_germExtPast", "Causal.CBG.flat_germ_future", "Causal.CBG.flat_germ_past"]

[[bind]]
label = "mghdlem:SpacelikePoint"
ett = ["Causal.CBG.CGHDData.exists_spacelike_corresponding", "Causal.CBG.IsCorrPair.exists_corresponds_of_le", "Causal.Causality.exists_minimal_of_isCompact", "Causal.Causality.exists_minimal_of_isCompact_on", "Causal.Causality.spacelike_iff"]
localisation = ["push_up", "tarentin", "curves_extend"]
note = "Lemma 3.9 (Maximal_GHD2.tex:615, proof 627–642). Null geodesic generators replaced by a ≤-minimal point of the compact ∂U ∩ J⁺(Σ) ∩ J⁻(p₀) (Zorn; exists_minimal_of_isCompact, ETT-layer in Causal.CompactMinimal since T-abs-hoist-model-free, with its open-set form exists_minimal_of_isCompact_on, which ERS's Step 2 uses) and the K⁻ cluster argument: no geodesic, no time function, no A3 (CGHDData is A3's GH setting only; rebound 2026-11-21, the A3 entry dropped). The K⁻ calculus comes from A2 (kSide_future: push-up, closed J±, S acausal by curves_extend and causal arc-connectedness). (3.10) ⇔ ETT's J(Σ, p) ∖ {p} ⊆ U (spacelike_iff); spacelike_iff and IsCorrPair.exists_corresponds_of_le are ETT-layer in Causal.CorrespondingSpacelike since T-abs-hoist-cbg-cores, CGHDData.exists_spacelike_corresponding stays over the CBG geometry. The fixed-background form is ERS's (4.65), Causal.Causality.exists_spacelike_boundary_point."
[[bind.geometric]]
model = "smooth-vacuum"
proves = ["push_up", "tarentin", "curves_extend"]
by = ["T-loc-smooth-causal-ladder"]
[[bind.geometric]]
model = "flat-gx"
proves = ["push_up", "tarentin", "curves_extend"]
by = ["Causal.CBG.flat_singularFlatAxioms", "Causal.CBG.flat_curvesExtend"]

[[bind]]
label = "mghdlem:FuturePoint"
ett = ["Causal.Causality.exists_lt_Jminus_compl_subset", "Causal.CBG.exists_lt_Jminus_compl_subset_of_cauchy"]
localisation = ["tarentin", "push_up"]
note = "Lemma 3.11 (Maximal_GHD2.tex:644, proof 652–658). Model-free: p ∈ Z⁺, closed J±, J⁻(p) ⊆ closure K⁻(p), compact J⁺(S) ∩ J⁻(x), U causally convex — all from A2 at Level A. 'The relation ≤ is closed' replaced by a directed family above p; the past side needs p off the BTZ locus (R4, E_0). It is also ERS Thm 4.64's Step 3, inside the restart SliceRestart of Causal.ErsUniqueness (papers/ers-predictability). exists_lt_Jminus_compl_subset is in the ETT-layer Causal.CorrespondingSpacelike since T-abs-hoist-cbg-cores."
[[bind.geometric]]
model = "smooth-vacuum"
proves = ["tarentin", "push_up"]
by = ["T-loc-smooth-causal-ladder"]
[[bind.geometric]]
model = "flat-gx"
proves = ["tarentin", "push_up"]
by = ["Causal.CBG.flat_singularFlatAxioms"]

