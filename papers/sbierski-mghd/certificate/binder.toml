# Binder of papers/sbierski-mghd (Sbierski, "On the existence of a maximal Cauchy development for
# the Einstein equations — a dezornification", arXiv 1309.7591): every row split into its ETT theorem
# (layer 1), its localisation properties (layer 2, programme/ladder.toml ids) and its geometric lemma
# per model class (layer 3). Format: tools/binder.py's docstring. Written by the programme-planner,
# 2026-11-20 (T-bind-sbierski-mghd). It records how Sbierski's argument factors, not what Lean has
# closed: the ledger's curation stays the loop's.
#
# How the paper factors. lean-causal's CBG (Causal.CBG.*, docs/CBG-DESIGN.md, DEC-29/DEC-60) follows
# this paper's order over an abstract geometry `Causal.CBG.Geometry` whose interface fields ARE the
# localisation properties of the argument:
#   A1 `rigid`          structure morphisms agreeing on an open set of a connected open agree (Lemma 3.1, Cor 3.2)
#   A2 causal facts     every admissible spacetime is absolutely minimal, causally arc-connected, push-up,
#                       tarentin (SingularFlatAxioms; with sing = ∅ for a smooth model); GH ones have
#                       `curves_extend`, a `time_function`, compact J⁺(Σ) ∩ J⁻(p), and are second
#                       countable when Σ is (Geroch 1968)
#   A3 `germ_extension` a morphism extends across a corresponding boundary point (Lemma 3.8)
#   A4 `cauchy_slice`   a local Cauchy slice through a spacelike boundary point (Thm 3.6's τ_q level set,
#                       restarted by local well-posedness, Thm 2.6)
# plus, for Sbierski's "initial data" (a Riemannian (M̄, ḡ, k̄), not a spacetime M₀),
#      `local_uniqueness` any two developments of the same data have a common Cauchy sub-development
#                       (Thm 2.6, second half).
# Of these only the A2 causal facts are ladder nodes today; the others are in `open_localisation`
# (proposed to the keeper: T-lad-cbg-geometry-nodes, T-lad-development-nodes).
#
# Models. `smooth-vacuum` is Sbierski's own class (smooth vacuum Einstein): nothing of it is in Lean
# (no Lorentzian manifolds; T-pkg-smooth-lorentz asks the author how they enter). `flat-gx` (the
# (Isom, Minkowski)-manifolds of DEC-29) is the hub's model and is in Lean: Causal.CBG.flatGeometry,
# Causal.CBG.flat_cbg. E_0 (BTZ lines) is owed by gx through Geometry.ofLocalModelOfBTZ and is not
# bound here (it carries no ladder id yet).
#
# Findings of this binder (reported to the master):
# * Every theorem row of §3 has its layer-1 theorem in Lean, sorry-free. The layer-1 theorems that are
#   model-free (IsCorrPair/KSide, Lemma 3.9 and 3.11 cores, TwoPiece, ManyPiece) live in modules that
#   import Causal.CurvesExtend → Causal.Minkowski, which the layer-1 rule forbids (kb/0047 for four of
#   them): T-abs-hoist-model-free, T-abs-hoist-cbg-cores.
# * OQ-40's three non-topological facts are not independent localisation properties in the CBG
#   setting: uniqueness of the corresponding point (Prop 3.7) is proved from causal properties
#   (Causal.CBG.IsCorrPair.eq_of_corresponds: push-up, closed J±, the K⁻ calculus, compact
#   J⁺(S) ∩ J⁻(x), causal convexity of U and ψ(U)); openness of C in ∂U (Lemma 3.8) is derived from
#   A3 (Causal.CBG.CGHDData.isOpen_correspondingSet); compactness of corresponding points then follows
#   from A3's continuous extension. They are localisation properties only of the bare gluing.
# * Prop 3.7 (i) ⇒ (ii) by timelike curves and strong causality (Sbierski's route) is not in Lean: Lean
#   derives it from A3 (CGHDData.tendsto_comp), while Sbierski proves A3 (Lemma 3.8) from Prop 3.7 (ii).
#   A smooth-vacuum discharge of A3 by Sbierski's proof would be circular: T-abs-sbierski-prop-3-7.
# * Lean's CBG takes a GH spacetime M₀ as initial datum; Sbierski's datum is (M̄, ḡ, k̄), and his Thm 2.8
#   needs Thm 2.6's local uniqueness to compare GHDs that share no M₀: T-abs-cbg-initial-data.
# * Routes replaced in Lean (each recorded in the module's checklist): Lemma 3.3 by lifting causal
#   curves along a local homeomorphism (no geodesics); Lemma 3.9 by a ≤-minimal point of a compact set
#   (Zorn, no null geodesics, no openness of C); the GH of the gluings by chains (TwoPiece, ManyPiece),
#   not timelike curves; the cocycle (3.15) through the ppcm, not through an intersection of CGHDs.

