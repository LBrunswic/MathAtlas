# Ledger configuration for alexandrov: L. Brunswic and F. Fillastre, Alexandrov Theorem for 2+1 flat
# radiant spacetimes, the ATGV2 revision (2023-06-05), ledgered as a paper of its own by DEC-209 (the
# Fuchsian polyhedra draft is included in it and not ledgered separately). Phase 0: ledger and label
# audit only. DEC-209 rules a new package lean-alexandrov (T-alexandrov-package); until it exists the
# Lean root is a placeholder, dyniso's precedent: the namespace Alexandrov is not built.
[paper]
root = "../legacy/labeled"
document = "alexandrov.tex"
notation = []
files = [["alexandrov.tex", "body", "P"]]
env_alias = { theo = "theorem", theon = "theorem", lem = "lemma", prop = "proposition", cor = "corollary", defi = "definition", defiprop = "definition", rem = "remark", example = "example", problem = "remark", claim = "claim" }
label_prefixes = ["thm", "theo", "lem", "prop", "cor", "def", "rem", "ex", "claim", "q"]
coverage_recursive = false

[paper.titles]
P = "Alexandrov Theorem for 2+1 flat radiant spacetimes (one file)"

[lean]
root = "../../../lean"
strict = ["Alexandrov"]
scaffold = ["scaffold/AlexandrovScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
