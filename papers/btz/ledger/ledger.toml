# Ledger configuration for btz: L. Brunswic, Cauchy-compact flat spacetimes with extreme BTZ (Geom. Dedicata;
# arXiv 2108.12631 = bib brunswic2021cauchy), the author's own paper, ledgered on its own by DEC-208 (it
# supersedes arXiv 1605.05530, an archived source only). Its Lean home is `lean-gx/` (GX / GXScaffold),
# shared with papers/gx and papers/bbs, where its Lemmas 2.3–2.18 already live as gx's cited results
# (GX/BTZ/{Spear,Surgery,MixedDiamond,AbsMax}); the labels carry btz-prefixed kinds (btzthm, btzprop, ...)
# so that no two of these ledgers read each other's docstring marks (kb/0024). Every statement carries its
# btz label first, ahead of the author's own label when there is one.
[paper]
root = "../legacy/labeled"
document = "BTZ_1.tex"
notation = []
files = [["BTZ_1.tex", "body", "P"]]
env_alias = { theo = "theorem", lemou = "lemma", propou = "proposition", corou = "corollary", defou = "definition" }
label_prefixes = ["btzthm", "btzprop", "btzlem", "btzcor", "btzdef", "btzrem"]
coverage_recursive = false

[paper.titles]
P = "Cauchy-compact flat spacetimes with extreme BTZ (one file)"

[lean]
root = "../../../lean-gx"
strict = ["GX"]
scaffold = ["scaffold/GXScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
