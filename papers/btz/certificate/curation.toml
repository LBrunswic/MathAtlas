[[row]]
label = "btzprop:reg_complete"
bucket = "C"
lean_proved_override = "partial"
blocked_on = "one tagged sorry of GXScaffold.BTZ.RegComplete (Σ* Cauchy and complete with infinitely many spears; no target yet); T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-142"
extra_lean_files = ["scaffold/GXScaffold/BTZ/RegComplete.lean"]
decls = ["GX.E0RegComplete.prop_reg_complete", "GX.E0RegComplete.prop_reg_complete'", "GX.E0RegComplete.gh_mgh_regM", "GX.E0RegComplete.gh_regM", "GX.E0RegComplete.mgh_regM", "GX.E0RegComplete.regM_isCauchyComplete_of_complete", "GX.E0RegComplete.IsE0C1CompleteCauchy", "GX.E0RegComplete.E0C1CauchyComplete"]
notes = "T-btz-reg-complete (atlas-team, 2026-11-27), audit AUDIT-1 minor (a checklist row and an overstated finding; fixed at integration). For E₀-manifolds, in the scaffold (GXScaffold.BTZ.RegComplete): Reg M is globally hyperbolic (gh_regM) and Cauchy-maximal (mgh_regM, as Causal.Flat.MGH, for every GH Cauchy-maximal E₀-manifold with a Cauchy surface, completeness not needed), sorry-free; Cauchy-completeness of Reg M (regM_isCauchyComplete_of_complete) is one tagged sorry, so prop_reg_complete is partial. Findings: « applies as is » (l.1571) does not — the compact proof uses finitely many BTZ lines (l.1091); the printed Cauchy-extension argument (l.1573–1575) never shows Σ acausal in M̄."
paper_findings = ["l.1571 ('the proof of Cauchy-completeness of Proposition prop:abs_max applies as is'): it does not apply as is. That proof (l.1091) uses that a Cauchy-compact M has finitely many BTZ lines, so finitely many disjoint spears and one surgery each. A Cauchy-complete M may have countably many BTZ lines, and then the completeness of Sigma* with infinitely many spears is not addressed by the paper (a uniform estimate is one route; with locally finite spears a Hopf–Rinow-type argument may avoid it — AUDIT-1). This is a gap in the proof, not a counterexample: I found no counterexample and expect the statement to hold.", "l.1571–1575 (Cauchy-maximality): the paper's route goes through the surgered Sigma* (lem:curve_extension (ii), cor:intersect, l.1574–1575), and it is not needed. Proved here (GX.E0RegComplete.gh_mgh_regM, standard axioms): for EVERY globally hyperbolic Cauchy-maximal E0-manifold M with a Cauchy surface, Reg M is globally hyperbolic and Cauchy-maximal. Cauchy-completeness and smoothness are not used. Route: the push-out M̄ of lem:extension_hausdorff is globally hyperbolic (the proof of prop:abs_max does not use compactness: E0MixedDiamond.globallyHyperbolic_pushout); ι₁(M) is causally convex in M̄; the image of ANY Cauchy surface of M is then a Cauchy surface of M̄, by Sbierski's union argument (Causal.CBG.isCauchySurfaceOn_sup_of_slice).", "l.1573 ('We are left to show M → M̄ is a Cauchy-extension'): the argument printed at l.1574–1575 never shows that Σ stays acausal in M̄, and the Cauchy property needs it. Here it comes from the causal convexity of ι₁(M) in M̄ (causallyConvexIn_range_ι₁), which has three ingredients: the past of a BTZ point is BTZ; an earlier point of a BTZ line is chronologically below every regular point of the later point's future (DEC-64's Iplus_of_lt); and the image of a flat Cauchy embedding is causally convex (causallyConvexIn_range_of_isFlatCauchyEmbedding)."]
