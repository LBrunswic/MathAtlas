notes = "T-btz-reg-complete (atlas-team, 2026-11-27), audit AUDIT-1 minor (a checklist row and an overstated finding; fixed at integration). For E₀-manifolds, in the scaffold (GXScaffold.BTZ.RegComplete): Reg M is globally hyperbolic (gh_regM) and Cauchy-maximal (mgh_regM, as Causal.Flat.MGH, for every GH Cauchy-maximal E₀-manifold with a Cauchy surface, completeness not needed), sorry-free; Cauchy-completeness of Reg M (regM_isCauchyComplete_of_complete) is one tagged sorry, so prop_reg_complete is partial. Findings: « applies as is » (l.1571) does not — the compact proof uses finitely many BTZ lines (l.1091); the printed Cauchy-extension argument (l.1573–1575) never shows Σ acausal in M̄. T-btz-spear-family (atlas-team, 2026-11-27), audit AUDIT-1 minor (three strict lemmas copied with weaker hypotheses; for T-gx-btz-cleanup). Step (1) of the sorry, sorry-free (GXScaffold.BTZ.SpearFamily): a countable, locally finite family of pairwise disjoint closed spears around S ∩ sing₀ M (GX.E0SpearFamily.exists_lfSurgeryData), needing only S Cauchy with the C¹ rim condition. Steps (2) and (3) remain (T-btz-reg-complete-cauchy, T-btz-reg-complete-length). T-btz-reg-complete-cauchy (atlas-team, 2026-11-27), audit AUDIT-1 minor (a stale line reference). Step (2), sorry-free (GXScaffold.BTZ.RegCompleteCauchy): Σ* of a locally finite spear family is a Cauchy surface of Reg M (LFSurgeryData.isCauchySurface_sigmaStar), needing only M GH and S Cauchy; rem:curve_spear proved there rather than carried. Step (3) remains (T-btz-reg-complete-length). T-btz-reg-complete-length (atlas-team, 2026-11-27), audit AUDIT-1 minor (~950 lines copied from strict Surgery.lean, for a cleanup). The import cycle broken (IsE0C1CompleteCauchy moved to GXScaffold.BTZ.CompleteCauchy); in GXScaffold.BTZ.RegCompleteLength, G4, the log r estimate, a compact-tail reduction, summable radii (exists_summable) and the completeness assembly are sorry-free; prop_reg_complete(') rest on one tagged sorry, exists_isCompact_of_cauchySeq. T-btz-length-compare (atlas-team, 2026-11-28), audit AUDIT-1 minor (two docstring slips, fixed): the tool the last sorry needs, sorry-free — the two length systems are the same chart at common points of Σ* and S (chartSys_eq_e0SliceSys), so lengths agree; a rim arc has S-length exactly R|Δφ| (pathLength_rimArc), any two rim points within πR. T-btz-reg-complete-tail (atlas-team, 2026-11-28), audit AUDIT-1 minor (a REPORT field, fixed). The last sorry closed (GXScaffold.BTZ.RegCompleteTail): exists_isCompact_of_cauchySeq, statement unchanged; prop_reg_complete and prop_reg_complete' now rest on no sorry (standard axioms). Two cases: a Cauchy sequence accumulating on one spear stays in a compact annulus by Lemma 2.8's log r estimate; one eventually away from every spear is pushed onto S ∩ Σ* at vanishing cost (summable radii, spear-by-spear surgery along one path, π·ΣRᵢ) and converges by the completeness of S. Partial only for the E₀ scope (T-btz-scope) and the readings of OQ-142."
paper_findings = ["l.1571 ('the proof of Cauchy-completeness of Proposition prop:abs_max applies as is'): it does not apply as is. That proof (l.1091) uses that a Cauchy-compact M has finitely many BTZ lines, so finitely many disjoint spears and one surgery each. A Cauchy-complete M may have countably many BTZ lines, and then the completeness of Sigma* with infinitely many spears is not addressed by the paper (a uniform estimate is one route; with locally finite spears a Hopf–Rinow-type argument may avoid it — AUDIT-1). This is a gap in the proof, not a counterexample: I found no counterexample and expect the statement to hold.", "l.1571–1575 (Cauchy-maximality): the paper's route goes through the surgered Sigma* (lem:curve_extension (ii), cor:intersect, l.1574–1575), and it is not needed. Proved here (GX.E0RegComplete.gh_mgh_regM, standard axioms): for EVERY globally hyperbolic Cauchy-maximal E0-manifold M with a Cauchy surface, Reg M is globally hyperbolic and Cauchy-maximal. Cauchy-completeness and smoothness are not used. Route: the push-out M̄ of lem:extension_hausdorff is globally hyperbolic (the proof of prop:abs_max does not use compactness: E0MixedDiamond.globallyHyperbolic_pushout); ι₁(M) is causally convex in M̄; the image of ANY Cauchy surface of M is then a Cauchy surface of M̄, by Sbierski's union argument (Causal.CBG.isCauchySurfaceOn_sup_of_slice).", "l.1573 ('We are left to show M → M̄ is a Cauchy-extension'): the argument printed at l.1574–1575 never shows that Σ stays acausal in M̄, and the Cauchy property needs it. Here it comes from the causal convexity of ι₁(M) in M̄ (causallyConvexIn_range_ι₁), which has three ingredients: the past of a BTZ point is BTZ; an earlier point of a BTZ line is chronologically below every regular point of the later point's future (DEC-64's Iplus_of_lt); and the image of a flat Cauchy embedding is causally convex (causallyConvexIn_range_of_isFlatCauchyEmbedding).", "BTZ_1.tex l.1091 / l.1574: for a Cauchy-complete M the paper takes « disjoint spear neighborhoods of sing₀(M) » without argument; its only printed justification (l.1091, « Since M is Cauchy-compact, it admits finitely many BTZ-lines and one can take the spear neighborhoods disjoint ») is the finite case. With countably many BTZ points on S, disjointness alone is not what the later steps need: local finiteness of the family is (for an inextensible curve meeting infinitely many spears, and for the closedness of the union of the other spears used in the head argument). Proved here (GX.E0SpearFamily.exists_lfSurgeryData): the family can be chosen countable, locally finite, pairwise disjoint and closed. The argument: the BTZ rays are locally finite (E0LM.e0_sing_nhds_component, distinct points of S on distinct lines); along a compact exhaustion each spear is thinned to miss every K n below the first its ray meets (spears of radius R' -> 0 are closed and decrease to the ray); then each head is thinned to avoid the closed union of the others. This fills a gap; it is not a counterexample.", "Step (1) does not use the completeness of S: a Cauchy surface with the C¹ rim condition suffices (exists_lfSurgeryData_of_rimC1); the compact case is the special case where the family is finite (LFSurgeryData.toSurgeryData).", "BTZ_1.tex l.1574-1575 (« Using Corollary cor:intersect we deduce that Sigma* is a Cauchy surface of M* »), and l.1093 for the compact case. The paper gives no argument for infinitely many spears. The argument goes through, and is proved here (GX.E0SpearFamily.LFSurgeryData.isCauchySurface_sigmaStar), once the spear family is LOCALLY FINITE, a property the paper does not state (it says only « disjoint », l.1574). Local finiteness is used in three places: the union of the spears is closed; the closure of the union of the cusp half-spears is the union of their closures, which makes the two sides of Sigma* closed in Reg M; and near a point of a spear no other spear is met. This fills a gap. It is not a counterexample: I did not show that disjointness alone fails.", "The compact proof (B21 l.1093; strict E0Surgery.SurgeryData.isCauchySurface_sigmaStar) uses the compactness of S twice: J^±(S) closed, and a limit point in S of points of S below a past- or future-trapped curve. A Cauchy surface of a globally hyperbolic E0-manifold needs neither. J^±(S) is closed (E0LM.sfa_isClosed_Jplus_cauchy / _Jminus_cauchy). J^-(p) ∩ S and J^+(p) ∩ S are compact (Causal.Causality.GloballyHyperbolic.isCompact_Jminus_inter_of_isCauchySurface, with the time function E0LM.e0_timeFunction), and the points of S below e(-n) all lie in J^-(e 0) ∩ S. So step (2) holds for every Cauchy surface S, compact or not, with no completeness and no smoothness beyond what the spear data carry.", "« Corollary cor:intersect applied in each spear »: the Lean proof, like the strict one, does not invoke the intersection number (lem_intersect_number_complete) directly. It uses the monotone height of the cusp along ≼ in each spear chart (Lemma 2.7) together with Remark 2.12 (rem:curve_spear, the strict SpearSurgeryDatum.isSpearArc_of_inextensible, applied spear by spear). Remark 2.12 is therefore discharged here, not assumed: the strict theorem carries it as a hypothesis hrem.", "BTZ_1.tex l.1571 (« the proof of Cauchy-completeness of Proposition prop:abs_max applies as is »): B21's completeness of Sigma* (l.1093, no proof printed) uses finitely many spears (l.1091) and a compact Sigma; with countably many spears the part that is not « as is » is exactly the Cauchy sequences crossing infinitely many spears. The multiplicative comparison between the cusp metric and S's (AUDIT-1's « uniform across spears ») is not needed: on the rim r = R the printed metric -2dtau dr + dr^2 + r^2 dtheta^2 restricts to R^2 dtheta^2 whatever tau_Sigma is, so a rim arc has length <= pi R, and choosing spears of summable radii (always possible, LFSurgeryData.exists_summable) turns the comparison into an additive, summable error. The proof should choose the spears' radii; « disjoint spear neighborhoods » (l.1574) alone may not suffice.", "The Hopf–Rinow route of T-btz-reg-complete AUDIT-1 finding 2 was not taken: it needs the DEC-31 length topology of S to equal M's near S (hS.continuous gives one direction only) and a Hopf–Rinow–Cohn-Vossen theorem, neither available; the path-surgery route above needs only completeness of S along one path.", "The tool is not printed in the paper: l.1571 says only that the proof of prop:abs_max « applies as is », and B21 l.1093 asserts Sigma* is metrically complete without comparing the induced length of Sigma* with that of Sigma along their common part. Proved here: on points of Sigma* ∩ S (both in Reg M) the two chart systems are literally the same chart of Reg M, so densities, chart-Lipschitz, lengths and path lengths coincide.", "On the rim r = R of a spear the S-length of the arc from angle phi1 to phi2 is exactly R|phi2 - phi1|, whatever tau_Sigma (the flat-chart velocity of phi -> D(tau(phi), R, phi + k) has Minkowski square R^2); so two rim points are at S-distance and at Sigma*-distance <= pi R. This is the estimate step (b) of the comment of LFSurgeryData.exists_isCompact_of_cauchySeq asks for.", "BTZ_1.tex l.1571 (« applies as is »), completed: with infinitely many BTZ lines the B21 argument needs three additions, all proved here — spears of summable radii, a spear-by-spear surgery of one path paying each spear at most πRᵢ, and the completeness of S for its own length, which B21's compact case never uses. No printed statement changes."]
