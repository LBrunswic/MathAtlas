[[row]]
label = "btzlem:blunt_spear_neighborhood"
lean_proved_override = "partial"
blocked_on = "T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-143"
nl_status_override = "proved"
nl_reason = "proved jointly with btzlem:add_BTZ_param, « Proofs of Lemmas \\ref{lem:add_BTZ_param} and \\ref{lem:blunt_spear_neighborhood} » (l.719), which the ledger attaches to the first"
bucket = "D"
notes = "T-btz-ledger (2026-11-27): no Lean yet. T-btz-blunt-spear (atlas-team, 2026-11-27), audit AUDIT-1 minor (the chart quantifier of lem_blunt_spear and docstring references; fixed in round 1). In the scaffold (GXScaffold.BTZ.BluntSpear), E₀ only. The core lem_blunt_spear_of_inextensible is sorry-free in any GH E₀-manifold, with two added hypotheses the paper uses implicitly at l.738 (no future endpoint for vertical null rays, no past endpoint for in-falling ones); the paper form lem_blunt_spear, for the given chart φ₀, rests on two tagged sorrys proving them in a flat spacetime (flat_vertical_noLimit, flat_infall_noLimit). T-btz-blunt-vertical-ray (atlas-team, 2026-11-27), audit AUDIT-1 clean: flat_vertical_noLimit proved, through GX.BTZ.SectorAtlas (strict: every sector chart lies in BTZE0's maximal a.e. atlas, and rigidity at a regular point); one tagged sorry left, flat_infall_noLimit. T-btz-blunt-infall-ray (atlas-team, 2026-11-27), audit AUDIT-1 minor (the unrestricted auxiliary flat_infall_noLimit was false for R ≤ 0, refuted by not_flat_infall_noLimit, and deleted at integration). flat_infall_noLimit_of_pos (0 < R) proved by one slit sector and the parabolic holonomy across the slit; lem_blunt_spear, the paper form for the given chart, is now sorry-free and strict (GX/BTZ/BluntSpear.lean). Partial only for the E₀ scope."
extra_lean_files = ["GX/BTZ/BluntSpear.lean", "GX/BTZ/SectorAtlas.lean"]
decls = ["GX.E0BluntSpear.lem_blunt_spear", "GX.E0BluntSpear.lem_blunt_spear_of_inextensible", "GX.E0BluntSpear.bvertical_meets", "GX.E0BluntSpear.binfall_meets", "GX.E0BluntSpear.continuousOn_tauS_blunt", "GX.E0BluntSpear.lowerBounds_bspear_iff", "GX.E0BluntSpear.isLowerBound_vertex", "GX.E0BluntSpear.le_vertex_of_lowerBound", "GX.E0BluntSpear.le_of_small_rad", "GX.E0BluntSpear.le_infall", "GX.E0BluntSpear.le_of_mem_bspear", "GX.E0BluntSpear.le_of_le_top_of_mem_bspear", "GX.E0BluntSpear.exists_tendsto_of_antitone", "GX.E0BluntSpear.ce_flatE0_eq", "GX.E0BluntSpear.flat_vertical_noLimit", "GX.E0BluntSpear.flat_infall_noLimit_of_pos"]
paper_findings = ["BTZ_1.tex:721 (« the proof of Lemma lem:blunt_spear_neighborhood is essentially the same ») — it is not: the proof of lem:add_BTZ_param (l.722–741) starts from the vertex p in I^-(Sigma) (« there exists U a neighborhood of w on which inf(tau o Phi(U cap Sigma)) > tau o Phi(p) ») and from the BTZ ray through p, neither of which exists in M* (the vertex is not a point of M*, and the lemma has no hypothesis placing anything below Sigma). A proof is in GX.E0BluntSpear.lem_blunt_spear_of_inextensible: compare in E0 (le_of_small_rad: a point of radius r1 <= r2/2 is below every point of radius r2 whose f-level is 4 pi^2 r1 higher) with ONE point of Sigma found on a far in-falling null ray or above it (binfall_meets / bvertical_meets); it needs that the vertical and in-falling regular null rays of S0 are inextensible in M, which the paper does not state and which is a rigidity/holonomy fact (two tagged sorrys).", "BTZ_1.tex:1601–1604 (theo:BTZ_Cauchy-completness, Step 1): the lemma is applied to Sigma_0, a Cauchy surface of M_0, with S the spear of M_2 given by lem:tube; reg(S) is a blunt spear of M_2^* but is shown to lie in M_0 only afterwards (l.1604, « we deduce that N subset M_0 »), so at l.1601 the lemma's hypothesis « a blunt spear neighborhood in M » (M = M_0) is not yet available. Not formalized; recorded as a possible ordering gap for the author.", "BTZ_1.tex:698: « phi : S -> Reg(E_0) » versus « phi_0 : S_0 -> E_0 »; and l.699 « graph of a smooth function tau_Sigma : D_R^* -> R_+^* » with R the radius of S (not of S_0), which the statement leaves implicit; read so."]

