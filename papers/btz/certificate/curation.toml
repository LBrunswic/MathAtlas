[[row]]
label = "btzprop:pgcd"
bucket = "D"
blocked_on = "T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-146 (a)"
notes = "T-btz-curation-existing (2026-11-27): no Lean yet. T-btz-pgcd (atlas-team, 2026-11-27), audit AUDIT-1 clean. E₀ only, scaffold (GXScaffold.BTZ.Pgcd). Sorry-free: any two BTZ-extensions have a maximal common sub-BTZ-extension (GX.Pgcd.btz_pgcd, the real CommonSubBTZ.IsMaximal), with no global hyperbolicity, on the witness pgcdSub over dom i j; the paper's union ghDom ⊆ dom, GH when M₁ is. One tagged sorry: dom globally hyperbolic (globallyHyperbolicOn_dom), so the title's full form btz_pgcd_gh rests on it. T-btz-ppcm-hausdorff (2026-11-27): the full form, the maximal common sub-extension globally hyperbolic, is sorry-free with fewer hypotheses (GX.PpcmHausdorff.btz_pgcd_gh_of_gh, through globallyHyperbolicOn_maxDom); Pgcd's own tagged sorry stays only because PpcmHausdorff imports Pgcd (T-btz-pgcd-dom-gh can now replace it by a file move). T-btz-pgcd-dom-gh (atlas-team, 2026-11-27), audit AUDIT-1 clean: the chart step moved to GX.BTZ.ExtChart and globallyHyperbolicOn_maxDom into Pgcd, so globallyHyperbolicOn_dom and btz_pgcd_gh are sorry-free (all 60 declarations keep name and type); the whole chain graduated to strict at integration. Partial for the E₀ scope only."
extra_lean_files = ["GX/BTZ/Pgcd.lean", "GX/BTZ/PpcmHausdorff.lean", "GX/BTZ/ExtChart.lean"]
decls = ["GX.Pgcd.btz_pgcd", "GX.Pgcd.pgcdSub", "GX.Pgcd.pgcdSub_isMaximal", "GX.Pgcd.range_pgcdSub_b", "GX.Pgcd.dom", "GX.Pgcd.pgcdMap", "GX.Pgcd.isBTZEmbedding_pgcdMap", "GX.Pgcd.pgcdMap_injective", "GX.Pgcd.ghDom", "GX.Pgcd.IsGHExtDomain", "GX.Pgcd.ghDom_le_dom", "GX.Pgcd.globallyHyperbolicOn_ghDom", "GX.Pgcd.ghDom_eq_dom_of_globallyHyperbolicOn", "GX.Pgcd.globallyHyperbolicOn_dom", "GX.Pgcd.btz_pgcd_gh", "GX.PpcmHausdorff.btz_pgcd_gh_of_gh", "GX.PpcmHausdorff.globallyHyperbolicOn_maxDom"]
paper_findings = ["BTZ_1.tex l.1341–1346: the existence of a maximal common sub-BTZ-extension needs NO global hyperbolicity (for E0-manifolds; the argument does not look E0-specific): GX.Pgcd.btz_pgcd proves it for any two BTZ-extensions with M1 Hausdorff second countable and M2 Hausdorff, by taking the union of ALL extension domains instead of the globally hyperbolic ones. The GH hypotheses are needed only for the global hyperbolicity of M1∧M2, which the later gluing (btzprop:ppcm) uses.", "BTZ_1.tex l.1359–1366: injectivity of φ needs only that M1 is Hausdorff, not strong causality nor prop:FZenon_injectif (GX.Pgcd.pgcdMap_injective): two points with one image have disjoint neighbourhoods whose open images share a regular point of M2, and φ = j∘i⁻¹ is injective on the regular points. The step « I⁺(p) = φ(I⁺(x)) » at l.1363 is itself unproved in the text (it requires lifting timelike curves through φ).", "BTZ_1.tex l.1376: « By construction, M1∧M2 is maximal » is a gap. Common sub-BTZ-extensions (btzdef:common_sub_btz_extension, l.1306–1313) are not required globally hyperbolic, so the image b(X) of an arbitrary one need not lie in a globally hyperbolic domain, and the union over GH domains (the paper's M1∧M2, GX.Pgcd.ghDom) contains it only if the union of all extension domains is itself GH. Here: ghDom ≤ dom always (ghDom_le_dom), ghDom = dom iff dom is GH (ghDom_eq_dom_of_globallyHyperbolicOn), and dom GH is the one sorry (globallyHyperbolicOn_dom). Not refuted: I believe it holds under the paper's hypotheses, by an extension of φ along BTZ lines that the proof does not give.", "BTZ_1.tex l.1368–1374 (second bullet): proved for E0 with M1 GH and connected (GX.Pgcd.globallyHyperbolicOn_ghDom), but by a different route: each GH domain with BTZ complement is causally convex (B21 Lemma 2.13 (b)), so their union is (Lemma 2.13 (a)), and Remark 1. The paper's case split « either q ∈ sing0(M1) and J⁺(p) ∩ J⁻(q) is a BTZ segment, or q ∈ i(M0) » does not show the segment lies in M1∧M2, and q may be a BTZ point inside i(M0).", "BTZ_1.tex:1376 « By construction, M1 ∧ M2 is maximal » is not by construction: the union is over globally hyperbolic domains (l.1352) while common sub-BTZ-extensions are not required globally hyperbolic (l.1306-1313), so maximality needs the maximal extension domain to be globally hyperbolic. That holds, but its proof is the chart step plus first-exit argument of the paper's own btzprop:ppcm third bullet (l.1497-1504), i.e. it is a forward dependency on § 5.2. Now proved: GX.Pgcd.globallyHyperbolicOn_dom, hence ghDom = dom.", "M_0 globally hyperbolic (l.1343) is not needed for btzprop:pgcd's conclusions in the E_0 setting (GX.PpcmHausdorff.btz_pgcd_gh_of_gh)."]

[[row]]
label = "btzprop:ppcm"
lean_proved_override = "partial"
bucket = "D"
blocked_on = "T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-148, OQ-149"
notes = "T-btz-curation-existing (2026-11-27): no Lean yet. T-btz-ppcm-hausdorff (atlas-team, 2026-11-27), audit AUDIT-1 clean. E₀ only, scaffold (GXScaffold.BTZ.PpcmHausdorff), sorry-free: the gluing (M₁ ⊔ M₂)/∼ along the paper's M₁ ∧ M₂ (Pgcd.ghDom) is Hausdorff (t2Space_ghGlue; the paper's C is empty, paperC_eq_empty), with the chart step a reusable lemma (exists_ext_of_graphCluster); added hypothesis M₁ connected. The rest of ppcm (its E₀ structure, GH, minimality) is T-btz-ppcm. T-btz-ppcm (atlas-team, 2026-11-27), audit AUDIT-1 minor (uniqueness under the order-minimal reading added in round 1). Strict, sorry-free (GX.BTZ.Ppcm, assembly GX.Ppcm.btz_ppcm): M₁ ∨ M₂ an E₀-manifold (glueMfd), π₁, π₂ BTZ-embeddings, globally hyperbolic (globallyHyperbolic_of_cover), minimal among all common over-extensions (ppcm_isMinimal), unique up to equivalence under both readings of « minimal ». Partial: E₀ only and M₁ connected added."
extra_lean_files = ["GX/BTZ/PpcmHausdorff.lean", "GX/BTZ/Ppcm.lean", "GX/BTZ/ExtChart.lean", "GX/BTZ/Pgcd.lean"]
decls = ["GX.PpcmHausdorff.t2Space_ghGlue", "GX.PpcmHausdorff.paperC_eq_empty", "GX.PpcmHausdorff.cdist_ghGlue_eq_empty", "GX.PpcmHausdorff.GhGlue", "GX.PpcmHausdorff.ghMap", "GX.PpcmHausdorff.paperC", "GX.PpcmHausdorff.t2Space_glue", "GX.PpcmHausdorff.Glue", "GX.PpcmHausdorff.exists_ext_of_graphCluster", "GX.PpcmHausdorff.mem_dom_of_graphCluster", "GX.PpcmHausdorff.mem_graph_of_mem_closure", "GX.PpcmHausdorff.globallyHyperbolicOn_maxDom", "GX.PpcmHausdorff.ghDom_eq_dom_of_t2Space", "GX.Ppcm.btz_ppcm", "GX.Ppcm.ppcm", "GX.Ppcm.ppcm_carrier", "GX.Ppcm.ppcm_a_b", "GX.Ppcm.globallyHyperbolic_ppcm", "GX.Ppcm.ppcm_isMinimal", "GX.Ppcm.equivalent_ppcm", "GX.Ppcm.IsMinimal", "GX.Ppcm.IsMinimalGH", "GX.Ppcm.equivalent_of_isMinimalGH", "GX.Ppcm.glueMfd", "GX.Ppcm.glueCS", "GX.Ppcm.trans_emb", "GX.Ppcm.isBTZEmbedding_π₁", "GX.Ppcm.isBTZEmbedding_π₂", "GX.Ppcm.globallyHyperbolic_of_cover", "GX.Ppcm.isBTZEmbedding_ghMap", "GX.Ppcm.equivalent_ppcm_of_isOrderMinimalGH", "GX.Ppcm.IsOrderMinimalGH"]
paper_findings = ["BTZ_1.tex l.1430: « the maximality of M1∧M2 will then implies that C ≠ ∅ » is a typo for C = ∅ (l.1511 concludes C = ∅).", "BTZ_1.tex l.1439: « I⁺(p_n) ⊂ j(M0) » should read i(M0) (p_n ∈ M1); the companion « φ(I⁺(p_n)) = I⁺(φ(p_n)) » needs causal convexity of the domain and image, which the text does not invoke. Neither is used by the formalization.", "BTZ_1.tex l.1442–1448: the identity I⁺(p') = Int ∩_N ∪_{n≥N} I⁺(φ(p_n)) for an arbitrary sequence and the « without loss of generality » φ(I⁺(p)∩U_p) = I⁺(p')∩U_{p'} are unproved in the text. Not refuted; the formalization replaces both by B21 Lemma 2.12's shrinking diamonds (GX.PpcmHausdorff.exists_graphCluster_shrink): the decreasing images of a chronological sequence b_n ↘ p cluster at some q', and φ(I⁺(p)∩I⁻(b)) lies in any neighbourhood of q' for suitable b ≫ p. The partner p' is then shown to be φ̄(p) by continuity.", "BTZ_1.tex l.1456–1493: the family of charts over all of C, the connectedness of (M1∧M2) ∪ U_p and of pairwise intersections, and « (M1∧M2) ∪ C = (M1∧M2) ∪ ⋃ U_p » are not needed: one point of C at a time suffices, the extension over one chart neighbourhood making M1∧M2 ∪ U_p an extension domain (GX.PpcmHausdorff.mem_dom_of_graphCluster).", "BTZ_1.tex l.1495 (second bullet): future distinguishing of M2 (prop:FZenon_injectif) is not needed: once p is in the domain of φ̄, an unseparated partner q equals φ̄(p) by continuity of φ̄ and Hausdorffness of M2 (GX.PpcmHausdorff.mem_graph_of_mem_closure).", "BTZ_1.tex l.1415–1416: the Hausdorff half holds without M0 globally hyperbolic, and along the maximal domain (the union of all extension domains) with only M2 globally hyperbolic (GX.PpcmHausdorff.t2Space_glue). M1 globally hyperbolic is used only to identify the paper's M1∧M2 with the maximal domain.", "BTZ_1.tex l.1497–1504 (third bullet), run on the maximal domain dom i j instead of M1∧M2 ∪ C, proves that dom i j is globally hyperbolic when M1 and M2 are (GX.PpcmHausdorff.globallyHyperbolicOn_maxDom). This is exactly the missing argument of btzprop:pgcd l.1376 (« by construction, M1∧M2 is maximal », GX.Pgcd.globallyHyperbolicOn_dom's tagged sorry), with weaker hypotheses than that statement (no M0 globally hyperbolic, M2 neither connected nor second countable): GX.PpcmHausdorff.btz_pgcd_gh_of_gh is GX.Pgcd.btz_pgcd_gh with no sorry. The paper's proof of prop:pgcd (l.1376) needs prop:ppcm's third bullet.", "The paper's gluing along its M1∧M2 is Hausdorff if and only if M1∧M2 is the maximal domain, as soon as M1∧M2 ⊇ i(M0) (GX.PpcmHausdorff.ghDom_eq_dom_of_t2Space with t2Space_ghGlue): the Hausdorff property of prop:ppcm and the maximality of prop:pgcd are one fact.", "BTZ_1.tex l.1417–1419: minimality and uniqueness are asserted but the proof (l.1422–1520) never addresses them; « minimal » is not defined for over-extensions (only « maximal » for sub-extensions, btzdef:maximal_common_sub_btz_extension l.1332–1337). They follow from the universal property of the gluing: a common over-extension (Y, a, b) gives a ∘ π₁⁻¹ and b ∘ π₂⁻¹ agreeing on π₁(M₁∧M₂) by density of i(M₀), the descended map is an E0-morphism, and it is injective because a⁻¹(b(M₂)) is an extension domain of j ∘ i⁻¹ and hence lies in M₁∧M₂ (maximality of the maximal domain, Pgcd.le_dom) with b⁻¹ ∘ a = φ there (GX.Ppcm.ppcm_isMinimal). Uniqueness: two minimal ones are equivalent because morphisms of common over-extensions are unique (GX.Ppcm.equivalent_of_isMinimalGH).", "BTZ_1.tex l.1417: minimality holds among ALL common over-BTZ-extensions, not only the globally hyperbolic ones: the target Y needs neither global hyperbolicity nor connectedness (GX.Ppcm.ppcm_isMinimal).", "BTZ_1.tex l.1512–1518: the last bullet holds for any E0-manifold covered by the images of two BTZ-embeddings of globally hyperbolic manifolds (GX.Ppcm.globallyHyperbolic_of_cover). The case split « if either of p, q is in reg … we thus assume p, q both in sing0 » (l.1516) is not needed: the paper's own step q' ∈ I⁺(q) ⊂ π₁(M₁) shows that each image πᵢ(Mᵢ) is a future set (GX.Ppcm.mem_range_of_le), so any non-empty diamond J(p, q) has both tips in the image containing p.", "BTZ_1.tex l.1415: M₀ globally hyperbolic is not used by any part of the proposition (this file and GX.PpcmHausdorff).", "BTZ_1.tex l.1424–1426 (the E≥0-structure of M₁ ∨ M₂): correct as written; formalized as lean-causal's gluing of atlases (Causal.CBG.gluedChartedSpace) with transitions φ on M₁∧M₂ and φ⁻¹ on φ(M₁∧M₂) (GX.Ppcm.trans_emb)."]

[[row]]
label = "btzthm:BTZ_ext"
lean_proved_override = "partial"
bucket = "C"
blocked_on = "the named cited input GX.BTZLine.CountableLinesInput (Richards MR143186 and the line-to-puncture injectivity, l.1544; equivalent to RichardsInput); T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-150"
notes = "T-btz-curation-existing (2026-11-27): no Lean yet. T-btz-maximal-extension (atlas-team, 2026-11-28), audit AUDIT-1 minor (docstring points, fixed). E₀ only, scaffold (GXScaffold.BTZ.MaxExtension, an instance of Causal.AbstractDev, DEC-208), sorry-free: GX.BTZMax.btz_ext — a globally hyperbolic E₀-manifold M has a globally hyperbolic BTZ-extension that is maximal, inextensible, universal and unique up to equivalence over M, given the named cited input RichardsInput M (Richards MR143186 and two uncited steps of l.1544–1546). M connected added. T-btz-line-structure (atlas-team, 2026-11-28), audit AUDIT-1 minor (REPORT fields fixed; global instances on ↥(S0 M) could be scoped). Sorry-free (GXScaffold.BTZ.LineStructure): in any Hausdorff E₀-manifold, sing₀ is closed, carries an (ℝ,ℝ)-translation structure (chart changes in gxGroupoid (Multiplicative ℝ) ℝ, from e0Loop_localForm), and each BTZ line is Lindelöf and second countable, with no ambient second countability. RichardsInput is proved equivalent to the smaller named input CountableLinesInput (countably many lines): only Richards' theorem and the line-to-puncture injectivity remain cited."
extra_lean_files = ["scaffold/GXScaffold/BTZ/MaxExtension.lean", "scaffold/GXScaffold/BTZ/LineStructure.lean"]
decls = ["GX.BTZMax.btz_ext", "GX.BTZMax.GHExt", "GX.BTZMax.extMor", "GX.BTZMax.Equivalent", "GX.BTZMax.RichardsInput", "GX.BTZMax.morphismsCompose", "GX.BTZMax.uniqueMorphisms", "GX.BTZMax.chainsInherit", "GX.BTZMax.unionExt", "GX.BTZMax.unionMfd", "GX.BTZMax.globallyHyperbolic_of_iCover", "GX.BTZMax.secondCountable_carrier", "GX.BTZMax.isInextensible_of_isMaximal", "GX.BTZMax.isUniversal_of_isMaximal", "GX.BTZMax.equivalent_of_isMaximal", "GX.BTZLine.secondCountable_line", "GX.BTZLine.isLindelof_line", "GX.BTZLine.instChartedSpaceS0", "GX.BTZLine.instHasGroupoidS0", "GX.BTZLine.lineChart", "GX.BTZLine.lineChart_trans", "GX.BTZLine.isLindelof_S0_of_countable", "GX.BTZLine.countable_lines_of_isLindelof_S0", "GX.BTZLine.isLindelof_S0_iff_countable", "GX.BTZLine.CountableLinesInput", "GX.BTZLine.richardsInput_of_countableLines", "GX.BTZLine.richardsInput_iff_countableLines"]
paper_findings = ["l.1541 (first bullet): the claim needs less than the proof says. The union is globally hyperbolic as soon as it is covered by images of BTZ-embeddings of globally hyperbolic manifolds; no member need contain both p and q, since the image of such an embedding is a future set (GX.Ppcm.mem_range_of_le). Proved as GX.BTZMax.globallyHyperbolic_of_iCover.", "l.1536: « the BTZ-extensions of M all have the same cardinality » is not needed. A point of an extension is determined by its germ comap ι (𝓝 x), a filter on M: the extension is Hausdorff and ι(M) is dense. So every union is built inside Filter M, in Type 0.", "l.1536: the paper takes an inductive limit over all BTZ-extensions, right filtered by prop:ppcm. Here, Zorn on chains (exists_isMaximal_of_uniqueMorphisms) gives the existence. Prop:ppcm then gives the universality of the maximal extension, and from it the uniqueness (isUniversal_of_isMaximal). The conclusion is the same: it is the colimit.", "l.1544-1546 (second bullet) is not formalized: Richards' classification is not in mathlib, and neither is the second countability of a BTZ line through its (R,R)-structure. Its consequence is carried as RichardsInput. Given that input, the step from it to the union being second countable is proved (secondCountable_carrier): countably many members cover S0, and one member covers the rest.", "l.1529-1532 vs l.1269-1271: btzthm:maximal_btz_extension says « unique up to isomorphism » where btzthm:BTZ_ext says « up to equivalence ». The Lean proves the stronger one, equivalence over M, which implies the other.", "BTZ_1.tex l.1546 (« admits a Riemannian metric and is thus second countable »): correct for a connected Hausdorff (ℝ,ℝ)-manifold; proved here without a metric, by a unit-speed flow along the translation structure, using Hausdorffness (GX.BTZLine.secondCountable_line).", "BTZ_1.tex l.1545 (« a connected component Δ of sing₀(M) »): read here as sing₀(M̄), the limit manifold of the surrounding sentences, a reading of a likely typo; the Lean holds for every E₀-manifold, so it covers both readings.", "BTZ_1.tex l.1544–1546: what the second bullet cites is equivalent to « the union has countably many BTZ lines » (GX.BTZLine.richardsInput_iff_countableLines); the second countability of each line is proved, not cited."]

