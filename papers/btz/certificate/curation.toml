notes = "T-btz-embeddings (atlas-team, 2026-11-27), audit AUDIT-1 minor (marks on partial rows and line citations; fixed at integration). For E₀-manifolds, sorry-free, strict (GX/BTZ/Embeddings.lean): GX.IsBTZEmbedding, GX.BTZExtension over GX.E0Mfd, the morphism class GX.btzMor (AbstractDev's shape), identity, composition, embedding iff injective, density, the bridge to the open-set form, uniqueness fixed on the image; GX.CommonSubBTZ / CommonOverBTZ with morphisms, equivalence, maximality. Partial: E₀ only, and « a.e. 𝔼-morphism » read as IsE0Mor, stronger than l.359 (OQ-142)."
