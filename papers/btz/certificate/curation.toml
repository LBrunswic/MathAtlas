extra_lean_files = ["GX/BTZ/Embeddings.lean"]
decls = ["GX.CommonSubBTZ.IsMorphism", "GX.CommonSubBTZ.Equivalent", "GX.CommonSubBTZ.isMorphism_id", "GX.CommonSubBTZ.IsMorphism.comp", "GX.CommonSubBTZ.IsMorphism.injective", "GX.CommonSubBTZ.IsMorphism.comp_a", "GX.CommonSubBTZ.IsMorphism.isBTZEmbedding", "GX.CommonSubBTZ.IsMorphism.unique", "GX.CommonSubBTZ.IsMorphism.inv", "GX.CommonSubBTZ.Equivalent.refl", "GX.CommonSubBTZ.Equivalent.symm", "GX.CommonSubBTZ.Equivalent.trans"]
notes = "T-btz-embeddings (atlas-team, 2026-11-27), audit AUDIT-1 minor (marks on partial rows and line citations; fixed at integration). For E₀-manifolds, sorry-free, strict (GX/BTZ/Embeddings.lean): GX.IsBTZEmbedding, GX.BTZExtension over GX.E0Mfd, the morphism class GX.btzMor (AbstractDev's shape), identity, composition, embedding iff injective, density, the bridge to the open-set form, uniqueness fixed on the image; GX.CommonSubBTZ / CommonOverBTZ with morphisms, equivalence, maximality. Partial: E₀ only, and « a.e. 𝔼-morphism » read as IsE0Mor, stronger than l.359 (OQ-142)."
paper_findings = ["The definition can be sharpened, and nothing in it is wrong. A morphism of common sub-BTZ-extensions is automatically injective, a BTZ-embedding, compatible with the extensions of M₀, and unique (GX.CommonSubBTZ.IsMorphism.injective, .isBTZEmbedding, .comp_a, .unique). « Equivalent » (l.1330, a bijective morphism) is an equivalence relation, because the inverse of a bijective 𝔼₀-morphism is an 𝔼₀-morphism (GX.isE0Mor_inv_of_bijective). This differs from lean-causal's abstract ETT reading, where it is directional (kb/0040)."]

