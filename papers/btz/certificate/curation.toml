[[row]]
label = "btzdef:btz_extension_btz_embedding"
bucket = "D"
lean_proved_override = "partial"
blocked_on = "T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-142"
extra_lean_files = ["GX/BTZ/Embeddings.lean"]
decls = ["GX.IsBTZEmbedding", "GX.BTZExtension", "GX.isBTZEmbedding_iff_injective", "GX.IsBTZEmbedding.isOpenEmbedding", "GX.IsBTZEmbedding.dense_range", "GX.IsBTZEmbedding.comp", "GX.isBTZEmbedding_id", "GX.IsBTZEmbedding.ext", "GX.isBTZEmbedding_subtypeVal_iff", "GX.IsBTZEmbedding.rangeOpens", "GX.IsBTZEmbedding.isE0Mor_invFunOn", "GX.IsBTZEmbedding.mem_S0_iff", "GX.btzMor", "GX.E0Mfd"]
notes = "T-btz-embeddings (atlas-team, 2026-11-27), audit AUDIT-1 minor (marks on partial rows and line citations; fixed at integration). For E₀-manifolds, sorry-free, strict (GX/BTZ/Embeddings.lean): GX.IsBTZEmbedding, GX.BTZExtension over GX.E0Mfd, the morphism class GX.btzMor (AbstractDev's shape), identity, composition, embedding iff injective, density, the bridge to the open-set form, uniqueness fixed on the image; GX.CommonSubBTZ / CommonOverBTZ with morphisms, equivalence, maximality. Partial: E₀ only, and « a.e. 𝔼-morphism » read as IsE0Mor, stronger than l.359 (OQ-142)."
paper_findings = ["l.1288 justifies « an a.e. 𝔼-morphism is an embedding iff it is injective » by « any 𝔼≥0-manifold is a 3-manifold » (invariance of domain). Under the local-structomorphism reading of an a.e. morphism the equivalence is elementary (an IsE0Mor is a local homeomorphism, so an injective one is an open embedding: GX.isBTZEmbedding_iff_injective, GX.IsBTZEmbedding.isOpenEmbedding). Under the l.263 definition (continuous, a (G,X)-morphism on dense locally connected opens of the regular parts) invariance of domain gives an open embedding but not, by itself, that BTZ points are not sent to regular points; the paper's l.263 « if such a φ is a local homeomorphism, then φ(reg M) ⊆ reg N » is the forward half only. Not a defect of the definition; a remark on which reading l.1288 needs."]

