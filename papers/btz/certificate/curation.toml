decls = ["GX.BTZCommonReg.common_reg", "GX.BTZCommonReg.equiv_of_isE0Maximal", "GX.BTZCommonReg.isMaximal_regExt", "GX.BTZCommonReg.isMaximal_of_isE0Maximal", "GX.BTZCommonReg.regExt", "GX.BTZCommonReg.connectedSpace_regM"]
paper_findings = ["BTZ_1.tex l.1278: the proof goes through the existence of BTZext(reg(M)) (Theorem theo:BTZ_ext), whose Lean form rests on the named cited input RichardsInput (Richards' theorem, l.1544–1546). Existence is not needed: M (with Reg M ↪ M) and N (with Reg M ≃ Reg N ↪ N) are already two maximal globally hyperbolic BTZ-extensions of Reg M, and the uniqueness half of theo:BTZ_ext alone (GX.BTZMax.equivalent_of_isMaximal, RichardsInput-free) identifies them. The corollary is therefore proved with no cited input.", "BTZ_1.tex l.1278: « by Remark rem:reg_GH, reg(M) and reg(N) are globally hyperbolic » is not used by the Lean proof: GX.BTZMax.GHExt asks the extension, not the extended manifold, to be globally hyperbolic. It is only needed if one wants BTZext(reg(M)) to exist (the theorem's hypothesis l.1269).", "BTZ_1.tex l.1278 « In particular, M and N are BTZ-maximal » is a one-line consequence of E_{≥0}-maximality (GX.BTZCommonReg.isMaximal_of_isE0Maximal) but uses that every globally hyperbolic BTZ-extension of a connected Reg M is connected (density of the image), so that the connected-target maximality of DEC-125 (e) applies.", "The Lean conclusion is stronger than printed: the isomorphism M ≃ N extends the given isomorphism reg(M) ≃ reg(N) (it is the unique such extension, by density). This is what the headline btzthm:princ (l.1650–1655) needs for the injectivity of Reg."]

[[row]]
label = "btzthm:BTZ_Cauchy-completness"
bucket = "D"
blocked_on = "two tagged sorrys of GXScaffold.BTZ.CauchySpear (the regular part of a sub-spear lies in M₀; M₁ ∪ Int(S₁) globally hyperbolic); then Step 2, T-btz-cauchy-conservation; T-btz-scope (E_{≥0} as printed, or E₀ only; needs-ruling); OQ-152"
notes = "T-btz-curation-existing (2026-11-27): no Lean yet. T-btz-cauchy-spear (atlas-team, 2026-11-28), audits AUDIT-1 major (a false finding, reworded in round 1), AUDIT-2 clean. Step 1 assembled (GX.BTZCauchySpear.cauchy_spear): every BTZ point of a maximal extension M₁ of M₀ has a spear neighbourhood on its line, with no RichardsInput; two tagged sorrys (bluntSpear_subset_M0, globallyHyperbolicOn_union). Step 2 is T-btz-cauchy-conservation."
extra_lean_files = ["scaffold/GXScaffold/BTZ/CauchySpear.lean"]
decls = ["GX.BTZCauchySpear.cauchy_spear", "GX.BTZCauchySpear.exists_cauchyMaximalExt", "GX.BTZCauchySpear.bluntSpear_subset_M0", "GX.BTZCauchySpear.spearInt_subset_range", "GX.BTZCauchySpear.globallyHyperbolicOn_union", "GX.BTZCauchySpear.exists_spearNbhd_of_subset", "GX.BTZCauchySpear.causallyConvexIn_range", "GX.BTZCauchySpear.spearIntY"]
paper_findings = ["BTZ_1.tex:1604 ('Notice M_1 u Int(S_1) is a globally hyperbolic BTZ-extension of M_1'): a missing justification, not an error. Global hyperbolicity is asserted without proof. An open subset of the globally hyperbolic M_2 is globally hyperbolic when it is causally convex, and causal convexity here needs the causal past of the BTZ points of Int(S_1) to stay on S_1's axis. Left as a tagged sorry.", "BTZ_1.tex:1604 ('Therefore, every BTZ-line of M_1 admits a spear neighborhood'): Int(S_1) subset M_1 does not by itself give a spear of M_1, since the vertex p' of S_1 is on the boundary of Int(S_1). One shrinks to a spear of higher vertex and smaller radius inside Int(S_1), and checks it is around the same BTZ line of M_1 as p. That last point uses the causal convexity of M_1 in M_2, which the paper does not mention. Proved (exists_spearNbhd_of_subset, causallyConvexIn_range).", "BTZ_1.tex:1601 (with OQ-143 (e), already recorded): lem:blunt_spear_neighborhood is applied to Sigma_0 in M_0 with the spear of M_2 from lem:tube before reg(S) subset M_0 is established (l.1604). Not formalized.", "BTZ_1.tex:1600 vs l.1598, a harmless notational slip: the proof's 'Delta a BTZ-line of M_2' is a line of M_1 read in M_2. Every BTZ line of M_2 meets Sigma_1 (a Cauchy surface of M_1, hence of its Cauchy extension M_2), and M_1 is causally convex in M_2, so the BTZ lines of M_1 and M_2 correspond one to one."]

