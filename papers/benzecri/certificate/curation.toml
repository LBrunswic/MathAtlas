paper_findings = ["The projective example (l.172–179) has the same gap as the affine one: p must be injective on P for (P, H̊, p, z) to be a pocket in the chart reading (see the finding on bzdef:c2s1d1_poche_affine); formalized with that hypothesis as Benzecri.exemple_poche_projective.", "Déf. 1/1′ (l.95–145) as printed admit a constant cote z ≡ 0 (Benzecri.exists_isPocheProj_cote_zero), for which property 7° and Prop. 6 are false as printed (OQ-61). Correction, ruled by DEC-178: « z non-constant » is added to the definition; 7° and Prop. 6 then hold as printed (septieme_propriete_of_ne_zero, ligne_brisee_poche_of_ne_zero). The paper tacitly assumes it (P built from the open half-space z < 1, l.158, 165–166, 174, 186; the proof of 7° uses 0 < z(f), l.346–351)."]

