notes = "T-bz-c2-poches (atlas-team, 2026-11-20), audit AUDIT-1 minor (wording, fixed in round 1). Marked in Benzecri/Chapter2/Poches.lean, sorry-free. The examples' question, OQ-46, is ruled by DEC-180: « p injective sur P » is added to the two examples of § 1 (Benzecri.exemple_poche_affine, exemple_poche_projective carry it). DEC-178 (OQ-61 (a)) adds « z non-constant » to Déf. 1/1′ (T-bz-apply-rulings, 2026-11-22): the Lean keeps the printed definition, which is broader, and carries the non-constant cote as a hypothesis where it is used (∃ y, z y ≠ 0: ligne_brisee_poche_of_ne_zero, septieme_propriete_of_ne_zero); the model witness has z = 0, so a corrected-definition predicate with its own witness is a follow-up. T-bz-poche-nonconstant (atlas-team, 2026-11-22), audit AUDIT-1 minor (near-duplicates with Proprietes.lean, no clash; the printed predicates demoted to « printed form » in Poches.lean at graduation): MARKED in corrected form (DEC-178) in Benzecri/Chapter2/PocheNonConstante.lean, sorry-free, with a witness of non-constant cote (the half-space {x₀ > 0}, z = x₀) and non-vacuity iff n ≥ 1; five readings of « non-constant » proved equivalent on a pocket (nonConstant_tfae)."
paper_findings = ["About the two UNLABELLED examples (l.155–179), not about the definitions: with « carte » an injective chart (the paper's convention: l.559–562, l.723, l.552, l.572–573; Ch. 1, Déf. 13), the conclusion « le triple (P, p, z) définit une poche de W » (l.160, resp. l.176–178) needs p injective on P, which the examples do not assume. Counterexample (affine case, n = 2; argued, NOT formalized): W = ℝ × ]1/10, 1/2[ with the affine structure pulled back by p(θ, r) = (1/2 + r cos θ, r sin θ) (the universal cover of the annulus 1/10 < |q − (1/2, 0)| < 1/2), z(x, y) = x; then p(W) is the annulus, 0 < z < 1 on it with infimum 0, so P = p⁻¹(z < 1) = W is connected and meets every hypothesis of the example, but p is not injective on P. Formalized with the injectivity added: Benzecri.exemple_poche_affine, Benzecri.exemple_poche_projective. Question for the author, on these unlabelled examples only: add « p injective sur P » (as formalized), or read them as describing the univalent situation that § 3, Théorème shows is always the case for a sweepable V?", "Déf. 1/1′ (l.95–145) as printed admit a constant cote z ≡ 0 (Benzecri.exists_isPocheProj_cote_zero), for which property 7° and Prop. 6 are false as printed (OQ-61). Correction, ruled by DEC-178: « z non-constant » is added to the definition; 7° and Prop. 6 then hold as printed (septieme_propriete_of_ne_zero, ligne_brisee_poche_of_ne_zero). The paper tacitly assumes it (P built from the open half-space z < 1, l.158, 165–166, 174, 186; the proof of 7° uses 0 < z(f), l.346–351)."]

