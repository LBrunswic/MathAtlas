paper_findings = ["Prop. 1 (l.270–273) has no printed proof (l.274). It is true and proved here in a stronger form. The proof: the cross-ratio (A', B', B, A) is odds(B')/odds(A') in coordinates on (A, B), and every point of (A', B') has odds between those of A' and B'. Hence |log (v/u)| ≤ |log r| for u, v between 1 and r."]

