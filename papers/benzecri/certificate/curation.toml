paper_findings = ["§ 2 Prop. 2's finding (DEC-122) carried over to the Énoncé: read over all Hausdorff connected cones the printed isomorphism fails for every n ≥ 3 (not_essSurjAsPrinted_dim; true for n ≤ 2, essSurjAsPrinted_of_le_one) because the base of a Hausdorff cone need not be a « variété »; F itself does not fail — every Hausdorff cone is F of its own base (ConeCex.isoFConeBase, iso_FCone_coneBase_and_not_t2Space); the essential image of F is exactly the proper cones (exists_iso_coneObj_iff)"]

