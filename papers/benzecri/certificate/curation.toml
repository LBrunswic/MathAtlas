notes = "T-bz-c2-cas-affin (atlas-team, 2026-11-21), audit AUDIT-1 minor (SCOPE wording, fixed at graduation). Marked: Benzecri.cas_affin, every dimension, sorry-free. The canonical projective structure projOfAff is locally projective, G embeds injectively in its projective automorphisms (GXAut.affToProj, each acting as itself), V stays sweepable for the image with the same compact (IsBalayableFor.affToProj; a step the Remark leaves implicit, a proof note), and (P, H̊, j∘φ, z∘j⁻¹) is a pocket for every affine j onto an open hemisphere; Prop. 7 and its corollary under PreconnectedSpace V. « connexe » is settled by the text: Ch. 1 Déf. 12 defines a « variété localement affine » on a connected V (no OQ); without it the last assertion fails (not_deuxPointsDansPocheAffineSansConnexe, hyperplane complement), kept as a remark. Independent of OQ-45 and OQ-61. Not vacuous: ℝⁿ with its translations, and the half-space {x₀ > 0} with a non-constant cote."

