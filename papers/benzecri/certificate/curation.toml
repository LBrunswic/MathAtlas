[[row]]
label = "bzprop:c2s3p1_projection_non_bornee"
extra_lean_files = ["Benzecri/Chapter2/Projection.lean"]
decls = ["Benzecri.projection_non_bornee", "Benzecri.projection_non_bornee_of_ne_univ", "Benzecri.ProjectionNonBorneePrinted", "Benzecri.projectionNonBorneePrinted_iff", "Benzecri.not_isBounded_range_of_isBalayable", "Benzecri.projection_non_bornee_hypotheses_model", "Benzecri.isCompact_segment_real", "Benzecri.IsAffSegment.symm", "Benzecri.IsDeveloping.exists_eqOn_smul_chart", "Benzecri.IsAffSegment.exists_eqOn_smul", "Benzecri.IsAffSegment.isCompact_injOn_image", "Benzecri.isAffSegment_of_isDeveloping", "Benzecri.isAffSegment_iff_of_isDeveloping", "Benzecri.IsAffSegment.image_smul_aut", "Benzecri.exists_uniform_chart_radius", "Benzecri.isAffSegment_chart_piece", "Benzecri.IsAffSegment.extend", "Benzecri.exists_smul_mem_of_iUnion_eq_univ", "Benzecri.translationAut", "Benzecri.translationAut_smul"]
bucket = "A"
notes = "T-bz-c2-projection (atlas-team, 2026-11-20), audit AUDIT-1 minor (checklist wording: DEC-128 for « variété » nonempty, the dimension row « strengthened », the quoted proof's line range; fixed at graduation). Proved sorry-free in Benzecri/Chapter2/Projection.lean for n ≥ 1, by another route than the printed proof (no case split, no components of p⁻¹(l), no Hausdorffness), over any affine charted space; the printed form holds iff 0 < n (projectionNonBorneePrinted_iff). not_isBounded_range_of_isBalayable is the « projection non bornée » of result B (T-bz-result-b). T-bz-apply-rulings (atlas-team, 2026-11-22): MARKED under DEC-177 (OQ-45 (a): n ≥ 1 is implied throughout Ch. 2; dimension 0 excluded, the dimension-0 finding recorded), on Benzecri.projection_non_bornee, no Lean change."
paper_findings = ["Prop. 1 (l.648–654) is false as printed in dimension 0. Take V = ℝ⁰ (a point), p = id, E = K = ℝ⁰: every hypothesis holds, and no N has p(N) ∉ ℝ⁰. The theorem projectionNonBorneePrinted_iff shows that the printed form ProjectionNonBorneePrinted n (with V nonempty built in) holds iff 0 < n. The printed proof uses a line of ℝⁿ in both cases a (l.657–662) and b, 1° (l.678–680), so it assumes n ≥ 1. This is the question already open as OQ-45 (a) for the pseudo-length's property 1°.", "In the proof of 1° (l.682–683), the condition « fa/fb < k » does not give 1°'s « ma/ab < k » (l.675). The transcription matches the scan, p. 256. With f, a, b in this order, the points m of the segments (M, B) ⊇ (A, B) fill )f, a], so 1° holds for (a, b) iff fa/ab ≤ k. The printed condition gives only fa/ab < k/(1 − k) for k < 1, and nothing for k ≥ 1, since fa < fb always. Read fa/ab < k, or take a close enough to f. The statement is unaffected, and the formalized proof does not go through 1°."]

[[row]]
label = "bzprop:c2s2p2_pseudo_longueur_corps_convexe"
extra_lean_files = ["Benzecri/Chapter2/Hilbert.lean", "Benzecri/Chapter2/Mesure.lean", "Benzecri/Chapter2/Prop2Literal.lean"]
decls = ["Benzecri.pseudo_longueur_corps_convexe", "Benzecri.pseudoLength_eq_projMeasure", "Benzecri.exists_frontier_pair", "Benzecri.continuous_hilbertLength", "Benzecri.continuous_hilbertLength_toReal", "Benzecri.hilbertLength_ne_zero", "Benzecri.hilbertLength_eq_zero_iff", "Benzecri.hilbertLength_lt_top", "Benzecri.hilbertLength", "Benzecri.corpsInterior", "Benzecri.isProjSegment_corpsInterior_iff", "Benzecri.Sphere.lineThrough", "Benzecri.Sphere.isLine_lineThrough", "Benzecri.PseudoLongueurCorpsConvexePrinted", "Benzecri.pseudoLongueurCorpsConvexePrinted_iff", "Benzecri.hilbertLength_self_dim_zero", "Benzecri.isCorpsConvexeS_singleton_S0", "Benzecri.pseudo_longueur_corps_convexe_literal", "Benzecri.PseudoLongueurCorpsConvexeLiteral", "Benzecri.pseudoLongueurCorpsConvexeLiteral_holds", "Benzecri.pseudoLongueurCorpsConvexePrinted_iff_literal", "Benzecri.hilbertLength_eq_zero_iff_and_pos", "Benzecri.hilbertLength_ne_top_iff_pos", "Benzecri.subsingleton_corpsInterior_dim_zero", "Benzecri.exists_ne_corpsInterior_iff"]
bucket = "A"
notes = "T-bz-c2-hilbert (atlas-team, 2026-11-20), audit AUDIT-1 minor (Prop. 2's routing under the literal reading, now OQ-56; VoisinageMajorePrinted omits second countability; two checklist tags; fixed in the docstring at graduation). Proved sorry-free in Benzecri/Chapter2/Hilbert.lean: Benzecri.pseudo_longueur_corps_convexe for n ≥ 1 (unique segment, F ≠ F′ on the frontier, l_V the projective measure relative to FF′, continuous, = 0 iff A = B); the literal reading holds in every dimension by lemmas without [NeZero n] (no assembled theorem). The proof is by two semicontinuities, not the printed one. T-bz-c2-prop2-literal (atlas-team, 2026-11-21), audit AUDIT-1 minor (SCOPE wording, fixed at graduation): Benzecri.pseudo_longueur_corps_convexe_literal assembles Prop. 2 under the literal reading in every dimension (vacuously at n = 0, where the interior is a point); so either answer to OQ-56 is marked with no Lean change: literal → this theorem; « iff » → pseudo_longueur_corps_convexe with OQ-45 (a). T-bz-apply-rulings (atlas-team, 2026-11-22): MARKED under DEC-177 (OQ-45 (a): n ≥ 1 is implied throughout Ch. 2; dimension 0 excluded, the dimension-0 finding recorded), on Benzecri.pseudo_longueur_corps_convexe, no Lean change. DEC-177 also rules OQ-56: for n ≥ 1 the literal and the « iff » readings agree (pseudoLongueurCorpsConvexePrinted_iff_literal)."
paper_findings = ["Prop. 2 (l.306–313) fails as printed in dimension 0, if « ne s'annule que sur la diagonale » is read « vanishes exactly on the diagonal » (as 6°, l.250–251, says « nulle si et seulement si »). A point {x} of S(0) is a convex body (isCorpsConvexeS_singleton_S0), its interior is {x}, and l_V(x, x) = +∞ (hilbertLength_self_dim_zero), because Déf. 1 gives coincident points no measure. PseudoLongueurCorpsConvexePrinted n holds iff 0 < n (pseudoLongueurCorpsConvexePrinted_iff). The other assertions hold in every dimension. This is OQ-45: under (b), a point given measure 0, the statement would hold for n = 0.", "The printed proof of Prop. 2 (l.316, « La proposition résulte de ce que F, F′ dépendent continûment de A, B ») does not reach the diagonal. There the line AB, hence F and F′, is not defined, and continuity at (A, A), that is l_V(A′, B′) → 0, needs a separate estimate. The formalization uses an affine-ball estimate (exists_nhds_projMeasure_lt). The statement is unaffected. The formalized proof uses two semicontinuities rather than the continuity of F, F′.", "Under the literal reading of OQ-56, Prop. 2 (l.306–313) holds at n = 0 only vacuously. The interior of a convex body of S(0) is a single point (subsingleton_corpsInterior_dim_zero), so the clauses about A ≠ B (the frontier points, the projective measure, the zero set) have no instance. Continuity holds because V is a point. These clauses have instances exactly when n ≥ 1: some convex body of S(n) has two distinct interior points iff 0 < n (exists_ne_corpsInterior_iff, with the explicit convex body stdCorpsConvexe n, the rays of |v_i| ≤ v_0). So « holds in every dimension » (OQ-56) means « holds for n ≥ 1, and trivially at n = 0 ».", "At n = 0, l_V is not real-valued: l_V(A, A) = +∞ at the one point of V (hilbertLength_self_dim_zero), and l_V is finite everywhere iff n ≥ 1 (hilbertLength_ne_top_iff_pos). The « fonction continue sur V × V » of l.312 holds at n = 0 only for a function valued in [0, +∞]. If a real-valued function is meant, the literal reading fails at n = 0 as well, for the same cause as the « iff » reading: Déf. 1 gives coincident points no measure (OQ-45).", "The planner's note on the target ([r], unchecked) that the segment clause (0) might need n ≥ 1 is false. isProjSegment_corpsInterior_iff carries no [NeZero n], and all five clauses of the strict n ≥ 1 assembly hold in every dimension except the « ← » half of the last one."]

