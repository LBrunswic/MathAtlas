# since been formalized in lean-benzecri (35 rows closed and marked by 2026-11-08; the p. 238 row by
# T-bz-universal-cover, 2026-11-20).
# T-bz-curation-decls (2026-11-20): every closed row now names its declarations (decls), read off the
# declaration docstrings that cite the label in backticks and, for the six rows whose declarations do
# not, off the label's bullet in the module docstring; every name checked against the compiled
# environment (the Lean overlay's facts, reports/atlas/lean/facts-lean-benzecri.json). The closures
# and marks are unchanged: the ledger computes them from the marks.
# Line numbers are those of papers/benzecri/legacy/labeled/benzecri1960_ch1.tex, or of
# benzecri1960_ch2.tex for the c2 labels (Chapter 2, transcribed by T-bz-chapter2, 2026-11-20, DEC-137).
