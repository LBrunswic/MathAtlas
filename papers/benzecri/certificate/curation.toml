[[row]]
label = "bzprop:c2s3p1_projection_non_bornee"
extra_lean_files = ["Benzecri/Chapter2/Projection.lean"]
decls = ["Benzecri.projection_non_bornee", "Benzecri.projection_non_bornee_of_ne_univ", "Benzecri.ProjectionNonBorneePrinted", "Benzecri.projectionNonBorneePrinted_iff", "Benzecri.not_isBounded_range_of_isBalayable", "Benzecri.projection_non_bornee_hypotheses_model", "Benzecri.isCompact_segment_real", "Benzecri.IsAffSegment.symm", "Benzecri.IsDeveloping.exists_eqOn_smul_chart", "Benzecri.IsAffSegment.exists_eqOn_smul", "Benzecri.IsAffSegment.isCompact_injOn_image", "Benzecri.isAffSegment_of_isDeveloping", "Benzecri.isAffSegment_iff_of_isDeveloping", "Benzecri.IsAffSegment.image_smul_aut", "Benzecri.exists_uniform_chart_radius", "Benzecri.isAffSegment_chart_piece", "Benzecri.IsAffSegment.extend", "Benzecri.exists_smul_mem_of_iUnion_eq_univ", "Benzecri.translationAut", "Benzecri.translationAut_smul"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-45 (a): the row is marked only if n ≥ 1 is ruled implied (the mark then goes on Benzecri.projection_non_bornee with no change to the Lean); under (b) or (c) it stays partial with the dimension-0 finding"
notes = "T-bz-c2-projection (atlas-team, 2026-11-20), audit AUDIT-1 minor (checklist wording: DEC-128 for « variété » nonempty, the dimension row « strengthened », the quoted proof's line range; fixed at graduation). Proved sorry-free in Benzecri/Chapter2/Projection.lean for n ≥ 1, by another route than the printed proof (no case split, no components of p⁻¹(l), no Hausdorffness), over any affine charted space; the printed form holds iff 0 < n (projectionNonBorneePrinted_iff). not_isBounded_range_of_isBalayable is the « projection non bornée » of result B (T-bz-result-b)."
paper_findings = ["Prop. 1 (l.648–654) is false as printed in dimension 0. Take V = ℝ⁰ (a point), p = id, E = K = ℝ⁰: every hypothesis holds, and no N has p(N) ∉ ℝ⁰. The theorem projectionNonBorneePrinted_iff shows that the printed form ProjectionNonBorneePrinted n (with V nonempty built in) holds iff 0 < n. The printed proof uses a line of ℝⁿ in both cases a (l.657–662) and b, 1° (l.678–680), so it assumes n ≥ 1. This is the question already open as OQ-45 (a) for the pseudo-length's property 1°.", "In the proof of 1° (l.682–683), the condition « fa/fb < k » does not give 1°'s « ma/ab < k » (l.675). The transcription matches the scan, p. 256. With f, a, b in this order, the points m of the segments (M, B) ⊇ (A, B) fill )f, a], so 1° holds for (a, b) iff fa/ab ≤ k. The printed condition gives only fa/ab < k/(1 − k) for k < 1, and nothing for k ≥ 1, since fa < fb always. Read fa/ab < k, or take a close enough to f. The statement is unaffected, and the formalized proof does not go through 1°."]

[[row]]
label = "bzprop:c2s2p2_pseudo_longueur_corps_convexe"
extra_lean_files = ["Benzecri/Chapter2/Hilbert.lean", "Benzecri/Chapter2/Mesure.lean"]
decls = ["Benzecri.pseudo_longueur_corps_convexe", "Benzecri.pseudoLength_eq_projMeasure", "Benzecri.exists_frontier_pair", "Benzecri.continuous_hilbertLength", "Benzecri.continuous_hilbertLength_toReal", "Benzecri.hilbertLength_ne_zero", "Benzecri.hilbertLength_eq_zero_iff", "Benzecri.hilbertLength_lt_top", "Benzecri.hilbertLength", "Benzecri.corpsInterior", "Benzecri.isProjSegment_corpsInterior_iff", "Benzecri.Sphere.lineThrough", "Benzecri.Sphere.isLine_lineThrough", "Benzecri.PseudoLongueurCorpsConvexePrinted", "Benzecri.pseudoLongueurCorpsConvexePrinted_iff", "Benzecri.hilbertLength_self_dim_zero", "Benzecri.isCorpsConvexeS_singleton_S0"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-56 (literal « ne s'annule que sur la diagonale », which holds in every dimension, or « iff », which fails at n = 0) and OQ-45 (a) under the « iff » reading"
notes = "T-bz-c2-hilbert (atlas-team, 2026-11-20), audit AUDIT-1 minor (Prop. 2's routing under the literal reading, now OQ-56; VoisinageMajorePrinted omits second countability; two checklist tags; fixed in the docstring at graduation). Proved sorry-free in Benzecri/Chapter2/Hilbert.lean: Benzecri.pseudo_longueur_corps_convexe for n ≥ 1 (unique segment, F ≠ F′ on the frontier, l_V the projective measure relative to FF′, continuous, = 0 iff A = B); the literal reading holds in every dimension by lemmas without [NeZero n] (no assembled theorem). The proof is by two semicontinuities, not the printed one."
paper_findings = ["Prop. 2 (l.306–313) fails as printed in dimension 0, if « ne s'annule que sur la diagonale » is read « vanishes exactly on the diagonal » (as 6°, l.250–251, says « nulle si et seulement si »). A point {x} of S(0) is a convex body (isCorpsConvexeS_singleton_S0), its interior is {x}, and l_V(x, x) = +∞ (hilbertLength_self_dim_zero), because Déf. 1 gives coincident points no measure. PseudoLongueurCorpsConvexePrinted n holds iff 0 < n (pseudoLongueurCorpsConvexePrinted_iff). The other assertions hold in every dimension. This is OQ-45: under (b), a point given measure 0, the statement would hold for n = 0.", "The printed proof of Prop. 2 (l.316, « La proposition résulte de ce que F, F′ dépendent continûment de A, B ») does not reach the diagonal. There the line AB, hence F and F′, is not defined, and continuity at (A, A), that is l_V(A′, B′) → 0, needs a separate estimate. The formalization uses an affine-ball estimate (exists_nhds_projMeasure_lt). The statement is unaffected. The formalized proof uses two semicontinuities rather than the continuity of F, F′."]

[[row]]
label = "bzprop:c2s2p3_voisinage_majore"
extra_lean_files = ["Benzecri/Chapter2/Hilbert.lean", "Benzecri/Chapter2/Mesure.lean"]
decls = ["Benzecri.voisinage_majore", "Benzecri.exists_isOpen_isMajorePart", "Benzecri.VoisinageMajorePrinted", "Benzecri.voisinageMajorePrinted_iff", "Benzecri.not_isMajorePart_dim_zero"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-45 (a): marked only if n ≥ 1 is ruled implied (Benzecri.voisinage_majore, no Lean change); under (b) or (c) it stays partial"
notes = "T-bz-c2-hilbert (atlas-team, 2026-11-20), audit AUDIT-1 minor (Prop. 2's routing under the literal reading, now OQ-56; VoisinageMajorePrinted omits second countability; two checklist tags; fixed in the docstring at graduation). Proved sorry-free for n ≥ 1 on any projective charted space (no Hausdorff, connectedness or countability): Benzecri.voisinage_majore, exists_isOpen_isMajorePart; the printed form holds iff 0 < n. Properties 5° (propriete_cinq, propriete_cinq_limsup, any dimension) and 6° (propriete_six, n ≥ 1) are lemmas here for T-bz-c2-proprietes."
paper_findings = ["Prop. 3 (l.365–368) fails as printed in dimension 0. On every V charted on S(0) every pseudo-length is +∞ (pseudoLength_eq_top_dim_zero), so no part containing a point is majorised (not_isMajorePart_dim_zero). The witness is already the one-point open set {x} of S(0), which is Hausdorff and connected. VoisinageMajorePrinted n (Hausdorff and connected V : Type) holds iff 0 < n (voisinageMajorePrinted_iff). This is the question Mesure's SCOPE already announced for this row (OQ-45). Under (b), a point given measure 0, it would hold for n = 0.", "In the printed proof of Prop. 3 (l.371–372), « une conséquence facile de la sixième propriété » leaves one step implicit. 6° makes l_V small near (M, M), but Déf. 4 also needs the joining segments to lie inside the neighbourhood W, so W must be convex in a chart, for instance a small ball of an affine chart. The statement is unaffected. The formalized proof works in one chart with such a ball (exists_nhds_projMeasure_lt), and needs neither a chart onto the interior of a convex body nor 6° and 4°."]

