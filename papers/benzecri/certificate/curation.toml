decls = ["Benzecri.theoreme2", "Benzecri.algebreBoole", "Benzecri.Distingues", "Benzecri.estDistingue_inf", "Benzecri.conjugue_inf", "Benzecri.estDistingue_sup", "Benzecri.conjugue_sup", "Benzecri.inf_sup_le_of_estDistingue", "Benzecri.conjugue_le_of_sontConjugues", "Benzecri.conjugue_eq_of_disjoint", "Benzecri.conjugue_eq_of_isSommeConvexes", "Benzecri.demiDroite_complement_conjugue", "Benzecri.cube_algebreBoole"]
notes = "T-bz-c3-boole-affine (atlas-team, 2026-11-28), audits AUDIT-1 major (Theorem 2 had been marked on an OQ-163 reading), AUDIT-2 minor. Proved in Benzecri/Chapter3/BooleAffine.lean under the reading in blocked_on, unmarked."
paper_findings = ["No proof is printed (l.524 « De là on déduit aussitôt le »). The derivation is not immediate from Théorème 1 alone: it uses that the projection P_L along the conjugate preserves every distinguished subspace (Théorème 1's proof step, projection_mem_of_mem) three times — for closure under ∩ (conjugate L' + D', De Morgan), under + (conjugate L' ∩ D') and for distributivity.", "« comme sup le produit » (l.531; so printed in the scan, journal p. 267) means the sum L + D: once inf is ∩ the order is inclusion and the sup is forced to be L ⊔ D, which is distinguished (estDistingue_sup)."]

[[row]]
label = "bzcor:c3s2t2c_algebre_parties_affine"
bucket = "C"
lean_proved_override = "partial"
blocked_on = "OQ-165 and OQ-163"
extra_lean_files = ["Benzecri/Chapter3/BooleAffine.lean"]
decls = ["Benzecri.corollaire_algebre_parties", "Benzecri.isoParties", "Benzecri.isoParties_apply", "Benzecri.EstSimple", "Benzecri.simples", "Benzecri.simples_finite_ncard_le", "Benzecri.eq_sSup_simples_le", "Benzecri.le_sSup_iff_mem_of_estSimple", "Benzecri.exists_estSimple_le", "Benzecri.inf_eq_bot_of_estSimple", "Benzecri.estDistingue_sSup", "Benzecri.estDistingue_sSup_simples", "Benzecri.sSup_le_sSup_iff_of_simples", "Benzecri.inf_sSup_eq_bot", "Benzecri.ncard_le_finrank_sSup", "Benzecri.simples_eq_empty_of_finrank_eq_zero", "Benzecri.cube_zero_corollaire", "Benzecri.cube_simples", "Benzecri.cube_simples_ncard", "Benzecri.cube_estSimple_coord", "Benzecri.cube_isoParties", "Benzecri.boule_hyps", "Benzecri.boule_simples", "Benzecri.boule_simples_ncard"]
notes = "T-bz-c3-boole-affine (atlas-team, 2026-11-28), audits AUDIT-1 major (Theorem 2 had been marked on an OQ-163 reading), AUDIT-2 minor. Proved in Benzecri/Chapter3/BooleAffine.lean under the reading in blocked_on, unmarked."
paper_findings = ["« imprecise » (l.537–538): « le cardinal est compris entre 1 et n » fails at n = 0. For E = 0 (e.g. W = [−1,1]⁰) the hypotheses of Théorème 2 hold, there is exactly one distinguished subspace (0 = E) and no simple one, so the Boolean algebra is the algebra of parts of the empty set (cardinal 0), and is not order-isomorphic to the parts of any nonempty set (cube_zero_corollaire, simples_eq_empty_of_finrank_eq_zero). Proved corrected form: card ≤ n always, card ≥ 1 when n ≥ 1 (corollaire_algebre_parties). Compare OQ-45 (a).", "Everything else is proved as printed: the simple distinguished subspaces form a finite set S with |S| ≤ n, T ↦ ∑ T is an order isomorphism Set S ≃o {distinguished subspaces} (isoParties), and every distinguished subspace is the sum of exactly one set of simple ones. The extremes are attained: the cube [−1,1]ⁿ has exactly the n coordinate axes as simple subspaces (cube_simples, cube_simples_ncard), the closed unit ball of a nonzero Euclidean space has the single simple subspace E (boule_simples_ncard)."]

