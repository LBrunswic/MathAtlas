decls = ["Benzecri.Sphere.prop6_facetteDuale", "Benzecri.Sphere.facetteDuale", "Benzecri.Sphere.facetteDuale_spec", "Benzecri.Sphere.prop6_facetteDuale_of_nonempty", "Benzecri.Sphere.facetteDuale_eq_facetteK", "Benzecri.Sphere.existsUnique_facetteKExt_closure", "Benzecri.Sphere.exists_facetteK_closure_eq_D_coneAppui", "Benzecri.Sphere.D_coneAppui_eq_of_fk", "Benzecri.FacetteDualeInstance.prop6_needs_extended_facette"]
notes = "T-bz-c3-facette-duale (atlas-team, 2026-11-28), audit AUDIT-1 minor (a SCOPE sentence; fixed). Proved in Benzecri/Chapter3/FacetteDuale.lean under the reading in blocked_on, unmarked."
paper_findings = ["Prop. 6 (l.1046–1049) is imprecise for the facettes of § 1 Déf. 4, which are nonempty: D(W_a) is empty whenever W_a = S(n), e.g. W = S(n), or W the closed quarter arc of S(1) and a its midpoint (F the open arc, D(W) = W ≠ ∅, D(W_a) = ∅): no facette of D(W) has closure ∅ (FacetteDualeInstance.prop6_needs_extended_facette). It holds in full when « facette » includes the facette ∅ of dimension −1 that l.289–290 introduces when the noyau is empty: D(W_a) = ∅ forces the noyau of D(W) to be empty (noyau_D_subset_D_coneAppui), and then 𝒟(F) = ∅ (prop6_facetteDuale). With genuine facettes it holds exactly when D(W_a) ≠ ∅ (prop6_facetteDuale_of_nonempty).", "The proof's point a′ « intérieur au convexe D(W_a) muni de la topologie induite par celle de son support » exists only when D(W_a) ≠ ∅; it is formalized as an α(D(W_a))-least point (exists_alphaK_least) and 𝒟(F) is its facette (facetteDuale_eq_facetteK), as printed."]

