[[row]]
label = "bzdef:c2s1d1_poche_affine"
extra_lean_files = ["Benzecri/Chapter2/Poches.lean"]
decls = ["Benzecri.IsPocheAff", "Benzecri.IsAffSegment.forall_chart_iff_exists", "Benzecri.isPocheAff_model", "Benzecri.exemple_poche_affine", "Benzecri.exists_isCoqueStricteAff_demiDroite"]
bucket = "A"
notes = "T-bz-c2-poches (atlas-team, 2026-11-20), audit AUDIT-1 minor (wording, fixed in round 1). Marked in Benzecri/Chapter2/Poches.lean, sorry-free. The examples' question is OQ-46."
paper_findings = ["About the two UNLABELLED examples (l.155–179), not about the definitions: with « carte » an injective chart (the paper's convention: l.559–562, l.723, l.552, l.572–573; Ch. 1, Déf. 13), the conclusion « le triple (P, p, z) définit une poche de W » (l.160, resp. l.176–178) needs p injective on P, which the examples do not assume. Counterexample (affine case, n = 2; argued, NOT formalized): W = ℝ × ]1/10, 1/2[ with the affine structure pulled back by p(θ, r) = (1/2 + r cos θ, r sin θ) (the universal cover of the annulus 1/10 < |q − (1/2, 0)| < 1/2), z(x, y) = x; then p(W) is the annulus, 0 < z < 1 on it with infimum 0, so P = p⁻¹(z < 1) = W is connected and meets every hypothesis of the example, but p is not injective on P. Formalized with the injectivity added: Benzecri.exemple_poche_affine, Benzecri.exemple_poche_projective. Question for the author, on these unlabelled examples only: add « p injective sur P » (as formalized), or read them as describing the univalent situation that § 3, Théorème shows is always the case for a sweepable V?"]

