blocked_on = "OQ-164"
extra_lean_files = ["Benzecri/Chapter3/DualiteSn.lean"]
decls = ["Benzecri.Sphere.remark_transposition", "Benzecri.Sphere.Delta", "Benzecri.Sphere.Delta_mk", "Benzecri.Sphere.Delta_Delta", "Benzecri.Sphere.dualRep", "Benzecri.Sphere.dualRepEquiv", "Benzecri.Sphere.dotPairing_dualRep", "Benzecri.Sphere.D_smul", "Benzecri.Sphere.transp", "Benzecri.Sphere.transpose_literal_differs"]
notes = "T-bz-c3-dualite-sn (atlas-team, 2026-11-28), audit AUDIT-1 clean. Proved in Benzecri/Chapter3/DualiteSn.lean under the reading in blocked_on, unmarked."
paper_findings = ["l.864-866 « la représentation duale de GL(n,R) est un automorphisme de GL(n,R) : la transposition » is imprecise: the dual representation for the dot product is g ↦ ᵗg⁻¹ (dotPairing_dualRep: ⟨g x, ᵗg⁻¹ y⟩ = ⟨x, y⟩), an automorphism (dualRepEquiv); the transposition g ↦ ᵗg reverses products (an anti-automorphism of GL(m) for m ≥ 2), and with Δ(g) = ᵗg the formula of l.870 fails: g = diag(2,1), W = {s(1,1)} in S(1) gives ᵗg W = {s(2,1)} ≠ {s(1/2,1)} = D(g(D W)) (transpose_literal_differs). With Δ induced by g ↦ ᵗg⁻¹, every printed assertion is proved: Δ is an involutive automorphism of GS(n,ℝ) and Δ(g) W = D(g(D W)) for every W ∈ C(S(n)) (remark_transposition)."]

[[row]]
