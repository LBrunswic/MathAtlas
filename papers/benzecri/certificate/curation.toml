notes = "T-bz-universal-cover (atlas-team, 2026-11-20), audit AUDIT-1 minor (provenance wording, fixed at graduation). Marked in Benzecri/UniversalCoverRow.lean, sorry-free, standard axioms. The universal cover is Benzecri.Port.UniversalCover, a Mathlib-only port of lean-causal's Causal/Port/UniversalCover.lean (82ee40f, itself gx's e5a1d46), so DEC-112's layering holds without requiring lean-gx. Statement: for V locally projective (or affine), compact, T2 (plan F6's « variété », as DEC-124/127/128; connectedness and second countability dropped, unused) and any base point, the universal cover with the pulled-back structure (the paper's own « l'unique structure ») is divisible (Déf. 15, Mathlib proper discontinuity per DEC-120), G₁ the deck group; every simply connected covering is too. The identification of the deck group with π₁(V, v₀) is stated for the underlying homeomorphisms only (UniversalCover.deckEquiv)."
