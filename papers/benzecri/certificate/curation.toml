bucket = "A"
notes = "T-bz-c2-lignes (atlas-team, 2026-11-21), audit AUDIT-1 minor (evidence for correction (a), the « positive » remark's reading, four line citations; fixed at graduation and in OQ-61). nombreRecouvrement, the least number of open k-majorised parts covering E (sInf over Fin m-indexed coverings), the least element for n ≥ 1, E compact, k > 0. T-bz-apply-rulings (atlas-team, 2026-11-22): MARKED under DEC-177 (OQ-45 (a): n ≥ 1 is implied throughout Ch. 2; dimension 0 excluded, the dimension-0 finding recorded), on Benzecri.nombreRecouvrement (nombreRecouvrement_isLeast for n ≥ 1), no Lean change."
paper_findings = ["Déf. 5 (l.381–385) presupposes that a compact E has a finite covering by open sets majorised by k. For n ≥ 1 this is Prop. 3 plus compactness (exists_isRecouvrementMajore); the paper leaves it implicit. For n = 0 no nonempty part has one, because no part containing a point is majorised (not_isMajorePart_dim_zero), so n(E, k) does not exist for E ≠ ∅. This is OQ-45, not a new question."]

