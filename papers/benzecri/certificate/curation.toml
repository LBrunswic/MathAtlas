[[row]]
label = "bzthm:c1s2_isomorphisme_fonctoriel"
bucket = "A"
notes = "MARKED in corrected form (DEC-127): Benzecri/Cone/Functor.lean carries the mark on coneEquivalence : ConeCat (n+1) ≌ ProjCat n (and baseFunctor_isEquivalence) — V ↦ V/ℝ₊* between connected Hausdorff affine conical manifolds with a proper ℝ₊* action and connected Hausdorff locally projective manifolds, inverse F(B) = FJ(B)/ℛ (Benzecri/Cone/Lift.lean); the in-proof identification « FJ(B) s'identifie avec J₁(F(B)) » is FCone.fjJetHomeomorph (natural in B); l.640 « φ∘j₂ = j₁ » read j₂∘φ = j₁ (misprint, DEC-127)."
paper_findings = ["§ 2 Prop. 2's finding (DEC-122) carried over to the Énoncé: read over all Hausdorff connected cones the printed isomorphism fails for every n ≥ 3 (not_essSurjAsPrinted_dim; true for n ≤ 2, essSurjAsPrinted_of_le_one) because the base of a Hausdorff cone need not be a « variété »; F itself does not fail — every Hausdorff cone is F of its own base (ConeCex.isoFConeBase, iso_FCone_coneBase_and_not_t2Space); the essential image of F is exactly the proper cones (exists_iso_coneObj_iff)"]

