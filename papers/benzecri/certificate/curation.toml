blocked_on = "OQ-71 (full or component form of 1°c; under the component form the row marks on theoremeComposantePrinted with no Lean change, under the full form it waits on ConnexePrinted, now reduced to ConnexeOuvertPrinted), OQ-79"
notes = "T-bz-c2-developpement (atlas-team, 2026-11-21), audit AUDIT-1 minor (a usage note and a docstring line, fixed at graduation). The Theorem's 1° only, unmarked: the row is assembled by T-bz-c2-theoreme (2°–4°), on theoreme_premier with the printed forms premierComposantePrinted and premierPrinted_iff. Every dimension, V only preconnected. 1°a exists_isDeveloping_eqOn_poche (the lifting criterion; chemin_jets_ferme), 1°b injective_of_isDeveloping_of_poche for every developing map, the chart exists_chart_poche (unique), 1°c in component form poche_eq_connectedComponentIn; the full form is equivalent to D ∩ φ̃(V) connected (premierPrinted_iff), holds for z ≡ 0, open otherwise (OQ-71). OQ-46, bearing only: in the Theorem's situation the § 1 example holds without « p injective » (exemple_poche_projective_of_poche, situation_exemple). « sur » in « application de V sur S(n) » (l.538, l.559) is Benzécri's « dans », a usage note. Not vacuous: ℝⁿ with z ≡ 0, and ]0, ∞[ with P = ]0, 1[ ≠ V and a non-constant cote. T-bz-c2-theoreme (atlas-team, 2026-11-21), audit AUDIT-1 minor (the OQ-71 sentence and two finding wordings, fixed at graduation): 2° theoreme_deuxieme, 3° theoreme_troisieme (a strict convex part; neg_notMem_range_of_poche), 4° theoreme_quatrieme, every dimension, no added hypothesis; the demi-droite lemma exists_demiDroite (and _of_ne_univ, its converse eq_interior_corpsConvexe_iff_not_demiDroite), which no library had; the assembly theoreme_poche_balayable, theoremeComposantePrinted (proved for every n) and theoremePrinted_iff (⇔ ConnexePrinted). Closed up to OQ-71; independent of OQ-45 (Props. 3, 4, 6 reached only through compact_dans_poche, deux_points_dans_poche; checked on the proof terms). Not vacuous: ]0, ∞[ with the strict shell ]0, 1[, demiDroite_hemisphere. The [sic] « z(M) » (l.618) read z(gM), a misprint-level note. Follow-up: exists_isCoqueStricteAff_demiDroite_ne_univ is a near-copy of Poches' exists_isCoqueStricteAff_demiDroite (merge it there). T-bz-c2-premier-full-proj (atlas-team, 2026-11-21), audit AUDIT-1 minor (checklist markers, the n = 0 remark, the title; fixed at graduation): the full form of 1°c proved for every shell, every dimension (poche_eq_preimage_of_coque_proj, theoreme_poche_balayable_coque_proj, theoremeCoquePrinted), for every pocket when n ≤ 1 (isCoqueProj_of_le_one_proj: there every pocket is a shell; theoremePrinted_of_le_one_proj, the Theorem as printed; for n = 0 the degenerate z ≡ 0, P = V case), for φ̃(V) ∩ H̊ star-shaped about a point of D, and for P = V; the open case is exactly ConnexeOuvertPrinted (theoremePrinted_iff_ouvert_proj, the story-sized lemma; the case lemmas are never the anchor). OQ-79 records it."
paper_findings = ["1°c, the full form (statement l.523–524; proof l.585–590), not proved for a non-constant cote and not refuted. The proof says at l.588 « on peut construire dans D ∩ φ̃(V) une ligne brisée allant de φ̃(M) à φ̃(N) ». That presumes D ∩ φ̃(V) connected, which the paper does not prove. The forward reference after the examples (l.184–186) claims only that P « n'est autre qu'une composante connexe de l'image réciproque ». Proved here: (i) the component form, for the developing map φ̃ and every point of P (poche_eq_connectedComponentIn), using condition b and a convex neighbourhood in H̊; (ii) the full form is exactly the connectedness the proof presumes, both for one V (poche_eq_preimage_iff: P = φ̃⁻¹(D ∩ φ̃(V)) ↔ IsPreconnected (D ∩ φ̃(V))) and for the printed statement (premierPrinted_iff: PremierPrinted n ↔ ConnexePrinted n); (iii) the full form holds for the constant cote z ≡ 0, where P = V (poche_eq_preimage_of_cote_eq_zero). The open case is therefore a non-constant cote, the case OQ-61 (a) would keep. No counterexample was found or formalised. Argued, not formalised: the planar examples tried all satisfy the full form, namely complements of a closed quadrant and unions of octant triangles of S(2) under the diagonal group, and convex domains. They either admit only the constant cote or are convex.", "1°c, the inclusion P ⊆ φ̃⁻¹(D), which the proof (l.585–590) does not argue, needs z < 1 on φ(P). Condition a of Déf. 1′ (l.137–138) gives only « majorée par 1 ». It holds because φ(P) is open and an affine function reaching its supremum 1 at an interior point is constant, against inf z = 0 (IsPocheProj.cote_lt_one). Statement unaffected.", "Exposition (proof level, statement unaffected): 1°b, the bracket of l.568–570 (proof level, statement unaffected): « puisque GS(n, R) opère transitivement sur la fibre des jets de même source, il existe γ transformant φ̃ en la section φ̃ ∘ g ». Transitivity on fibres gives a γ at each point only. One γ for all of V needs V connected and the rigidity of GS(n, R) (Ch. 1 Prop. 2's uniqueness, IsDeveloping.existsUnique_smul_eq). Both are available, but the bracket names neither.", "Exposition (proof level, statement unaffected): 1°a (l.545–556), proof level, statement unaffected. The paper shows that a path of J(V) over a loop is closed (chemin_jets_ferme here) and concludes « L'assertation a en résulte immédiatement ». That step is the lifting criterion through the covering J(V) → V, for V connected and locally path connected. It is formalised with Mathlib's IsLocalHomeomorph.existsUnique_continuousMap_lifts. Over P the paper composes each jet with g⁻¹. The formalisation reads the lift in the single chart φ ∘ g, whose source g⁻¹P contains both paths by Prop. 7 (jetSMul_eq_of_path). The argument is the same.", "Exposition (proof level, statement unaffected), 4°, l.605–607. The proof uses « Si V n'est pas l'intérieur d'un corps convexe, on peut trouver dans V une demi-droite L, c'est-à-dire une portion de droite limitée à deux points diamétralement opposés de la frontière de V ». It is stated without proof, and it is false for V = S(n). S(n) is an open convex part (Déf. 8) and not the interior of a convex body, and its frontier is empty, so no such portion of line exists (univ_not_demiDroite). In S(0) it contains no half-line at all. The fact holds exactly for the nonempty open convex parts other than S(n) (Déf. 8 in the ∪ reading, DEC-120; in the Minkowski reading S(n) is not a convex part): an open convex part other than S(n) is strict (Sphere.isStrictConvexPart_of_isOpen), and the fact is proved for those (exists_demiDroite_of_ne_univ, exists_demiDroite), together with its converse (eq_interior_corpsConvexe_iff_not_demiDroite). The paper does not say why φ̃(V) ≠ S(n). It holds for every pocket: two antipodal points of φ̃(V) would be moved by one γ ∈ GS(n, R) into φ(P) ⊆ H̊ (neg_notMem_range_of_poche), the 1°b argument again.", "Exposition (proof level, statement unaffected), 4°, l.609–612. The paper takes an arbitrary demi-droite L and moves one of its points into P by an automorphism g. The demi-droite can be taken through any point of V, because p + ℝx ⊆ F(V) for every p ∈ F(V) (demiDroite_of_not_salient). The proof here takes it through a point of φ(P), so this step needs no g. Prop. 7's corollary is still used, through 3°. The paper also leaves implicit the step « il résulte de la condition b … que gL est une demi-droite incluse dans H̊ ». It applies condition b to every sub-segment (gM, X) of gL, and these are segments of V since they lie on gL ⊆ V. The formalisation makes this explicit, building each sub-segment as a segment of V with the chart φ̃ (isProjSegment_of_chart); it goes through 3°'s strict convexity, which this step does not need.", "1°c, full form (statement l.523–524; proof l.585–590): it holds for every shell (Déf. 2, l.188–190), in every dimension. By 3° (l.528–529, proof l.600–603), φ̃(V) is a convex part of S(n). For M ∈ φ̃⁻¹(D ∩ φ̃(V)) and N ∈ P, both images lie in H̊, so the segment between them lies in H̊ and in the convex D, and it lies in φ̃(V): the « ligne brisée » of l.588 can be one segment, and the printed argument closes. The paper proves 3° after 1°c, but 3°'s proof uses only Prop. 7's corollary and the chart, never 1°c, so there is no circularity (poche_eq_preimage_of_coque_proj; with 2°–4°, theoreme_poche_balayable_coque_proj; printed, theoremeCoquePrinted n for every n).", "1°c, full form, in dimension n ≤ 1: the Theorem holds as printed, the full form included (theoremePrinted_of_le_one_proj; premierPrinted_of_le_one_proj; connexePrinted_of_le_one_proj). Every pocket is then a shell (isCoqueProj_of_le_one_proj): H̊ is an affine line or a point, and φ(P), connected, is convex. So the shell case applies. Neither the transcription (l.181–190, l.517–533) nor the proof makes this observation.", "1°c, full form, for P = V: trivially true, since P ⊆ φ̃⁻¹(D) always (poche_eq_preimage_of_eq_univ_proj). This contains the constant cote z ≡ 0 (poche_eq_preimage_of_cote_eq_zero, which gives P = V); conversely P ≠ V forces a non-constant cote (not_cote_eq_zero_of_ne_univ_proj).", "1°c, full form, when φ̃(V) ∩ H̊ is star-shaped, in the affine space H̊ (Déf. 6), about a point c of D (z(c) < 1): D ∩ φ̃(V) is then star-shaped about c, so connected, which is what l.588 presumes (poche_eq_preimage_of_starConvex_proj). Special cases: φ̃(V) ∩ H̊ convex in H̊ (poche_eq_preimage_of_isAffConvex_proj) and φ̃(V) a convex part of S(n) (poche_eq_preimage_of_isConvexPart_proj). This is the projective twin of the affine poche_eq_preimage_of_starConvex_affine.", "OQ-71 sharpened (not ruled): the printed full form is equivalent to its open case, ConnexePrinted n ↔ ConnexeOuvertPrinted n (connexePrinted_iff_ouvert_proj), and TheoremePrinted n ↔ ConnexeOuvertPrinted n (theoremePrinted_iff_ouvert_proj). ConnexeOuvertPrinted n asks that D ∩ φ̃(V) be connected for the pockets that are not shells, are not all of V (so have a non-constant cote), and for whose chart φ̃(V) ∩ H̊ is star-shaped about no point of D. It holds vacuously for n ≤ 1 (connexeOuvertPrinted_of_le_one_proj). So the full form is open only for a non-shell pocket with a non-constant cote, in dimension n ≥ 2, and more sharply only for a pocket P ≠ V that is not a shell and whose φ̃(V) ∩ H̊ is star-shaped about no point of D. It is neither proved nor refuted there; no counterexample was found or formalised."]

