# papers/benzecri/ledger/ledger.json by tools/ledger_curate.py --paper papers/benzecri.
# Authored. The curated fields of the benzecri ledger (DEC-112).
#
# Nothing is formalized yet: no row carries decls, extra_lean_files, a bucket A/B/C/D or a Lean
# override, and no row is closed. What is curated at wave 0 is only what the parser cannot read off
# the transcription:
#   * the natural-language status of the statements Benzécri proves in running prose, or states
#     without proof (the ledger reads `open` for every statement with no `proof` environment);
#   * the two results of the introduction that belong to later chapters (B: Ch. 2 § 3; C: Ch. 5 § 3),
#     terminal for THIS ledger because their proofs are not in the transcription (Ch. 1 only). When a
#     later chapter is transcribed and its statements labelled, the row leaves bucket T.
# Line numbers are those of papers/benzecri/legacy/labeled/benzecri1960_ch1.tex.
#
# Bucket rules: barbot's (kb/0006, kb/0011, kb/0015 of lean-causal); A = marked ``**`label`**`` in a
# strict module docstring with no sorry beneath; T = terminal, with a terminal_reason.
#
# No [[findings_triage]] yet: findings are what formalizing turns up about the paper. The misprints
# met while transcribing are flagged `% [sic]` in the transcription itself, not here.

