bucket = "A"
notes = "T-bz-c2-pseudo-boules (atlas-team, 2026-11-21), audits AUDIT-1 major (the r ≤ 0 « finding » rested on reading « positif » as ≥ 0; withdrawn, now OQ-62; fixed in round 1) and AUDIT-2 minor (one headline made conditional at graduation). Marked in Benzecri/Chapter2/PseudoBoules.lean: Benzecri.pseudoBoule, the printed definition (on the same footing as Déf. 2–4: at n = 0 every pseudo-ball is empty, a consequence of Déf. 1's convention, OQ-45). The two unlabelled sentences after it are lemmas: pseudoBoule_ouvert_connexe (every dimension), hasBasis_pseudoBoule (n ≥ 1, OQ-45)."
paper_findings = ["Unlabelled sentence after Déf. 6 (l.417–418), « La pseudo-boule … est un ouvert connexe (cf. 3°, 5°) ». The statement holds in every dimension and for every r (pseudoBoule_ouvert_connexe), with « connexe » read as in the question below. The justification « cf. 5° » leaves one step implicit. 5° bounds the pseudo-length of segments near (M, N), but it does not produce a segment from M to each point N′ near N, and openness needs one. The formalized proof gets it from the chart of a segment majorising (M, N), with the estimate behind 5° (eventually_exists_projMeasure_lt, in isOpen_pseudoBoule). Connectedness follows 3° as printed: each pseudo-ball is the union of majorised segments from its centre, by sub-segments and pseudoLength_mono.", "Unlabelled sentence after Déf. 6 (l.420–423, [sic] « lcs »), « il résulte du 6° que les pseudo-boules … forment une base de voisinages ». 6° by itself does not give this. Continuity, and vanishing exactly on the diagonal, do not make small balls small: a continuous function vanishing only at M may tend to 0 far from M. The formalized proof (hasBasis_pseudoBoule) adds two facts. The pseudo-balls are connected (the preceding sentence), and V is locally compact. Then l_V(M, ·) ≥ r > 0 on the frontier of a compact neighbourhood C, and the connected ball B(M, r) contains M and misses that frontier, so it lies in C. The statement is unaffected for n ≥ 1.", "The neighbourhood-basis sentence (l.420–423) fails in dimension 0. {x} is a convex body of S(0), and its pseudo-balls are empty (pseudoBoule_dim_zero), so they are not neighbourhoods. BaseVoisinagesPrinted n holds iff 0 < n (baseVoisinagesPrinted_iff). This is OQ-45: under (b), a point given measure 0, the balls of radius r > 0 would be {x} and the sentence would hold. OQ-56 does not bear on it."]

