notes = "T-bz-c3-cone-appui-alpha (atlas-team, 2026-11-28), audits AUDIT-1 major (Prop. 1 marked under a half-line reading conflicting with OQ-162 (a); unmarked in round 1), AUDIT-2 minor. Proved in Benzecri/Chapter3/ConeAppuiAlpha.lean under the reading in blocked_on, unmarked."
paper_findings = ["Prop. 1 (l.907–922) against Déf. 1′ (l.889–892): no single convention for « demi-droite » makes both printed statements true. With closed half-lines (the reading OQ-162 (a) records for Déf. 1′), (2) is always true (both closed half-lines contain a ∈ W) and (1) ⇔ (2) fails: prop1_instance_end (S(1), W the quarter arc, a, b its ends: ¬ a α(W) b, b′ ∉ W_a, both closed half-lines meet W). With (2) read « chacune des deux demi-droites … rencontre W en un point distinct de a et a′ » (ends excluded) Prop. 1 holds in full: prop1_coneAppui; Déf. 1′ is then the one that fails at a, a′ (coneAppui_ne_demiDroitesW)."]

