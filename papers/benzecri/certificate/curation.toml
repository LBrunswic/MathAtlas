notes = "T-bz-c2-pseudo-boules (atlas-team, 2026-11-21), audits AUDIT-1 major (the r ≤ 0 « finding » rested on reading « positif » as ≥ 0; withdrawn, now OQ-62; fixed in round 1) and AUDIT-2 minor (one headline made conditional at graduation). ouvert_plein (r > 0, every dimension) by a clopen argument through Prop. 3, no broken line; eq_univ_of_forall_pseudoBoule_subset (U open is redundant)."
paper_findings = ["Once r > 0, the hypothesis « U ouvert » of Prop. 5 (l.426) is redundant. U contains the pseudo-ball of each of its points, and for n ≥ 1 a pseudo-ball of radius r > 0 is open and contains its centre (isOpen_of_forall_pseudoBoule_subset). In dimension 0 a connected V is a point (subsingleton_dim_zero). eq_univ_of_forall_pseudoBoule_subset proves Prop. 5 without this hypothesis."]

[[row]]
label = "bzprop:c2s2p7_compact_dans_poche"
extra_lean_files = ["Benzecri/Chapter2/Compact.lean", "Benzecri/Chapter2/Lignes.lean", "Benzecri/Chapter2/Poches.lean"]
decls = ["Benzecri.compact_dans_poche", "Benzecri.CompactDansPochePrinted", "Benzecri.compactDansPochePrinted", "Benzecri.exists_domaineGenerateur_proj", "Benzecri.exists_domaineGenerateur_proj_isConnected", "Benzecri.IsBalayableFor.exists_domaineGenerateur", "Benzecri.IsLigneBrisee.smul"]
bucket = "A"
notes = "T-bz-c2-compact (atlas-team, 2026-11-21), audit AUDIT-1 minor (a REPORT sentence on non-vacuity corrected: no transfer lemma is needed; the dimension-0 remark made conditional on Déf. 1's convention at graduation). Marked in Benzecri/Chapter2/Compact.lean, every dimension, sorry-free: Benzecri.compact_dans_poche (weaker hypotheses: preconnected V, no Hausdorff or countability), compactDansPochePrinted n for every n. Independent of OQ-45 and OQ-61 (uses only B ∈ P from Prop. 6). Not vacuous: the audit's probe built ℝⁿ with its translations and the model pocket. The first paragraph's lemma: exists_domaineGenerateur_proj."
paper_findings = ["Proof of Prop. 7, first paragraph (l.466–468), statement unaffected: « il suffit, pour obtenir E'', d'ajouter à E' un nombre fini de lignes brisées reliant les composantes connexes de E' » presupposes that two points of a connected V are joined by a broken line. The paper does not prove this before Prop. 7. The proof of Prop. 5 (l.432–434) asserts the same fact, while Prop. 4 covers only a compact connected E. The formalization joins the pieces topologically instead: the points lying with a fixed x₀ in some compact connected set form a clopen set (exists_isCompact_isPreconnected_superset). This needs no broken line and covers n = 0, where no broken line of majorised segments exists.", "Proof of Prop. 7, l.477–479, statement unaffected: « Il résulte de la proposition 6 que gN ∈ P » applies Prop. 6 to the image gL, a broken line from gN⁰ = M⁰ to gN, not to L. Two steps are left implicit. (a) A projective automorphism carries a segment majorised by k to a segment majorised by k (2°; IsMajoreSeg.smul, and IsLigneBrisee.smul here). (b) p ≤ n(E, k) and K > 1 give 1/K^{n(E,k)} ≤ 1/K^p, the hypothesis Prop. 6 needs.", "Prop. 7 uses only « B ∈ P » from Prop. 6 (l.479). So the Prop. 6 finding (false as printed for a pocket of cote z ≡ 0, T-bz-c2-lignes) does not reach Prop. 7. The corrected IsPocheProj.ligne_brisee_poche gives B ∈ P for every pocket.", "Dimension 0 (the planner's [r], checked): the printed proof does not run for n = 0, because n(E, k) is undefined and Prop. 4 fails (OQ-45). The statement still holds: a connected V charted on S(0) has at most one point, and the pocket is nonempty. Prop. 7 and its corollary hold as printed in every dimension (compactDansPochePrinted, deuxPointsDansPochePrinted), so these rows do not depend on OQ-45."]

