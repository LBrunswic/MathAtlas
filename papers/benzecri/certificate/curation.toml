paper_findings = ["Prop. 8 (l.1323) is imprecise in dimension 0: in E = 0 (Lean: Fin 0 → ℝ), V = W = {0} satisfies every printed hypothesis and I(V, W), but there is no open half-space at all, so II(V, W) fails (proprietes_I_II_dimZero). This is the only failure: the equivalence holds in every Hausdorff locally convex E ≠ 0 (proprietes_I_II), and in every E when V ≠ W (proprietes_I_II_of_ne). The printed proof uses E ≠ 0 silently in the case W ⊆ O (then H must be any open half-space containing W).", "II ⇒ I (l.1341–1350) needs neither compactness nor local convexity: only T1 and W, V convex (proprieteI_of_proprieteII)."]

