notes = "T-bz-c2-lignes (atlas-team, 2026-11-21), audit AUDIT-1 minor (evidence for correction (a), the « positive » remark's reading, four line citations; fixed at graduation and in OQ-61). nombreRecouvrement, the least number of open k-majorised parts covering E (sInf over Fin m-indexed coverings), the least element for n ≥ 1, E compact, k > 0."
paper_findings = ["Déf. 5 (l.381–385) presupposes that a compact E has a finite covering by open sets majorised by k. For n ≥ 1 this is Prop. 3 plus compactness (exists_isRecouvrementMajore); the paper leaves it implicit. For n = 0 no nonempty part has one, because no part containing a point is majorised (not_isMajorePart_dim_zero), so n(E, k) does not exist for E ≠ ∅. This is OQ-45, not a new question."]

[[row]]
label = "bzprop:c2s2p4_ligne_brisee"
extra_lean_files = ["Benzecri/Chapter2/Lignes.lean", "Benzecri/Chapter2/Hilbert.lean", "Benzecri/Chapter2/Mesure.lean", "Benzecri/Chapter2/Poches.lean"]
decls = ["Benzecri.ligne_brisee", "Benzecri.ligne_brisee_of_recouvrement", "Benzecri.ligne_brisee_of_finset", "Benzecri.IsLigneBrisee", "Benzecri.isLigneBrisee_iff", "Benzecri.IsMajorePart.isPreconnected", "Benzecri.LigneBriseePrinted", "Benzecri.ligneBriseePrinted_iff", "Benzecri.not_isLigneBrisee_dim_zero"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-45 (a): ligne_brisee for n ≥ 1; the printed form holds iff n > 0 (ligneBriseePrinted_iff)"
notes = "T-bz-c2-lignes (atlas-team, 2026-11-21), audit AUDIT-1 minor (evidence for correction (a), the « positive » remark's reading, four line citations; fixed at graduation and in OQ-61). ligne_brisee (n ≥ 1), and in every dimension for any finite covering (ligne_brisee_of_finset, ligne_brisee_of_recouvrement); broken lines IsLigneBrisee (isLigneBrisee_iff). The printed induction on n(O_Q, k) is run on the number of sets of a covering (O_Q is not compact)."
paper_findings = ["Proof of Prop. 4 (l.393–409), statement unaffected: the induction is « sur n(E, k) », but the induction hypothesis is applied to O_Q (l.400–402), a connected open set, not compact, for which Déf. 5 defines no n(O_Q, k). The induction has to be run on the number of open majorised sets covering a connected part, which needs no compactness. That is how it is formalized (ligne_brisee_of_finset), and Prop. 4 follows (ligne_brisee).", "Proof of Prop. 4, l.403–404: « un tel ouvert est inclus dans O_Q, ou a avec O_Q une intersection vide » uses that each O_i is connected. This holds because a majorised part is connected (any two of its points lie on a segment inside it, Déf. 4; IsMajorePart.isPreconnected), but the text does not say so. It is also what makes O_Q a union of members of the covering, hence open, which the separation argument « E étant connexe … O_Q ∩ O_j n'est pas vide » needs.", "Proof of Prop. 4, l.399: the letter k names both the bound and an index (« N ∈ O_k »). This is notation only.", "Dimension 0 (OQ-45): Prop. 4 fails as printed for n = 0, on any nonempty E, because no broken line of majorised segments exists (ligneBriseePrinted_iff, witness the one-point open set {x} of S(0), Hausdorff, connected, second countable). It holds for every n ≥ 1."]

[[row]]
label = "bzprop:c2s2p6_ligne_brisee_poche"
extra_lean_files = ["Benzecri/Chapter2/Lignes.lean", "Benzecri/Chapter2/Hilbert.lean", "Benzecri/Chapter2/Mesure.lean", "Benzecri/Chapter2/Poches.lean"]
decls = ["Benzecri.IsPocheProj.ligne_brisee_poche", "Benzecri.IsPocheProj.ligne_brisee_poche_of_ne_zero", "Benzecri.IsPocheProj.ligne_brisee_poche_of_pos", "Benzecri.IsPocheProj.ligne_brisee_poche_aux", "Benzecri.IsPocheProj.cote_pos_of_ne_zero", "Benzecri.LigneBriseePochePrinted", "Benzecri.ligneBriseePochePrinted_iff", "Benzecri.exists_isPocheProj_cote_zero", "Benzecri.IsPocheProj.septieme_majore"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-61 (false as printed for a pocket with cote z ≡ 0: a non-constant cote in Déf. 1/1′, or « ≤ »)"
notes = "T-bz-c2-lignes (atlas-team, 2026-11-21), audit AUDIT-1 minor (evidence for correction (a), the « positive » remark's reading, four line citations; fixed at graduation and in OQ-61). IsPocheProj.ligne_brisee_poche (≤, every pocket) and ligne_brisee_poche_of_ne_zero (the printed < when z ≢ 0). Property 7° is proved here as lemmas for T-bz-c2-proprietes: septieme_propriete (≤, with (M, N) ⊆ P), septieme_propriete_of_ne_zero, septieme_majore."
paper_findings = ["Prop. 6 (l.437–443) is false as printed, and so is property 7° (l.253–256), which is its case p = 1. Déf. 1′ (l.119–145) admits a pocket whose cote is identically 0: condition a (inf 0, bounded by 1) holds, and the strict library already records that constant cotes are allowed (Poches, isPocheAff_model). For such a pocket z(φ(A)) = 0, and the conclusion z(φ(B)) < K^p z(φ(A)) reads 0 < 0. Formal counterexample for every n ≥ 1: ℝⁿ with its canonical projective structure, the pocket (ℝⁿ, H₀, j, 0) (the Remarque's image of (ℝⁿ, id, 0); exists_isPocheProj_cote_zero), A = B = 0, the one-segment line {0} majorised by log 2 (n ≥ 1), K = 2. Result: LigneBriseePochePrinted n ↔ n = 0 and SeptiemeProprietePrinted n ↔ n = 0 (for n = 0 both hold vacuously: no broken line, no finite pseudo-length). ℝⁿ is Hausdorff, connected and second countable, and any segment, not only the point segment, gives the same failure.", "The failure is exactly the cote 0. If z is not identically 0, then z > 0 on φ(P) (IsPocheProj.cote_pos_of_ne_zero: φ(P) is open, z ≥ 0 on it, and an affine function with an interior minimum 0 vanishes identically), and Prop. 6 and 7° hold as printed (ligne_brisee_poche_of_ne_zero, septieme_propriete_of_ne_zero). For every pocket the non-strict forms hold, with L ⊆ P (resp. (M, N) ⊆ P) (ligne_brisee_poche, septieme_propriete). So downstream uses that only need B ∈ P (Prop. 7, l.476–478) are unaffected.", "Proof of 7° (l.334–357), beyond the counterexample: « les quatre points a, b, f, f′ ont une cote z positive » (l.342) is asserted without argument and fails for z ≡ 0. In the case z(b) > z(a), what the computation needs is z(f) ≥ 0. That follows from condition b of the pocket applied to every sub-segment (M, X), X ∈ (M, F), where z < z(a) < 1, together with φ̃ = φ on (M, F) ⊆ P (same germ at M, (M, F) connected). The text leaves this implicit. The case z(b) ≤ z(a) (l.346–347) concludes B ∈ P only; z(b) < K z(a) needs z(a) > 0, which is where the counterexample sits. The conclusion is about z(φ(N)), while the computation gives z(φ̃(N)) = z(b), where φ̃ is « l'extension à un voisinage de (F, F′) de la carte φ de P » (l.338), that is a chart with the germ of φ at M. The two agree because (M, N) ⊆ P, again implicit. The formalization does all three steps (IsPocheProj.septieme_majore).", "Proof of Prop. 6 (l.445–449): « pour p = 1, c'est la septième propriété » applies 7°, which assumes l_V(M, N) < log K, to a segment majorised by log K. This is fine: the measure witnessing Déf. 2 is < log K, so l_V < log K (exists_isMajoreSeg_of_pseudoLength_lt goes the other way, and septieme_majore takes the majorised form directly). « le passage de p à p+1 est immédiat » is formalized as written (z(φ(A)) < 1/K^{p+1} ≤ 1/K, then z(φ(X)) ≤ K z(φ(A)) < 1/K^p)."]

[[row]]
label = "bzdef:c2s2d6_pseudo_boule"
extra_lean_files = ["Benzecri/Chapter2/PseudoBoules.lean", "Benzecri/Chapter2/Hilbert.lean", "Benzecri/Chapter2/Mesure.lean", "Benzecri/Chapter2/Poches.lean"]
