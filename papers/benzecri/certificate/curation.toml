[[row]]
label = "bzprop:c2s3p2_hemisphere_corps_convexe"
extra_lean_files = ["Benzecri/Chapter2/Hemisphere.lean", "Benzecri/Chapter2/PseudoBoules.lean", "Benzecri/Chapter2/Hilbert.lean"]
decls = ["Benzecri.hemisphere_corps_convexe", "Benzecri.HemisphereCorpsConvexePrinted", "Benzecri.hemisphereCorpsConvexePrinted", "Benzecri.enveloppeConvexe", "Benzecri.enveloppeConvexe_isLeast", "Benzecri.enveloppeConvexe_subset_hemisphere", "Benzecri.isCorpsConvexeS_closure_enveloppeConvexe", "Benzecri.smul_enveloppeConvexe_subset", "Benzecri.IsFeuille", "Benzecri.HasFeuille", "Benzecri.exists_hasFeuille", "Benzecri.exists_hasFeuille_of_isCompact", "Benzecri.HasFeuille.smul", "Benzecri.exists_hasFeuille_uniform", "Benzecri.range_eq_interior", "Benzecri.isCoveringMapOn_interior", "Benzecri.injective_of_isCoveringMapOn"]
bucket = "A"
notes = "T-bz-c2-hemisphere (atlas-team, 2026-11-21), audit AUDIT-1 minor (a checklist marker, a scan citation; fixed at graduation). Marked: Benzecri.hemisphere_corps_convexe, every dimension, sorry-free: p is a compatible chart of V onto the interior of a convex body, the least convex part of H̊ containing p(V) (enveloppeConvexe). « variété » read Hausdorff, the standing reading (DEC-122, plan F6), and necessary (a non-Hausdorff counterexample, argued). Independent of OQ-45 and OQ-62. Not vacuous: the audit's probe used the open simplex swept by positive diagonal matrices."
paper_findings = ["Proof of Prop. 2, 3° (l.759–762), statement unaffected. « cela résulte de 2°, de la continuité de la pseudo-longueur sur W, et de la compacité de E » does not give r(E) as printed. For points M' near M, the pseudo-balls of one fixed radius centred at p(M') must lie inside the pseudo-ball of 2° at p(M). A triangle inequality for l_W would give this, but it is not among properties 1°–7° (l.229–259). Continuity of l_W on W × W controls l_W(p(M'), ·) near p(M), but not uniformly towards the frontier of W. The formalization supplies the missing step (exists_pos_eventually_pseudoBoule_subset). By continuity, l_W ≥ s > 0 on D × frontier C for compact neighbourhoods D ⊆ int C of p(M), and a pseudo-ball of radius s centred in D is connected, so it cannot cross frontier C. This is the argument of hasBasis_pseudoBoule, made uniform. It is the same kind of gap the PseudoBoules SCOPE records for the sentence after Déf. 6 (« il résulte du 6° »).", "Proof of Prop. 2, 2° (l.751–756) and 5° (l.786–789), statement unaffected. The uniqueness of the lift of (m, n) in O_M (2°) and « deux sections d'un ouvert étalé au-dessus d'une même partie connexe de la base sont identiques ou d'intersection vide » (5°) hold only for a Hausdorff V. On the line with two origins over ℝ, two sections over ℝ agree everywhere but at one point. The formalization proves the section lemma for a Hausdorff space (mem_of_injOn_of_isPreconnected) and carries T2 as part of « variété » (question).", "The misprints flagged [sic] in the transcription are formalized as read, not reported as findings: « cf. § 2, déf. 5 » (l.750) is read déf. 6, the pseudo-ball, and « d'après 4° » (l.796) is read 3°, the uniform radius.", "Dimension 0 and OQ-45: Prop. 2 holds as printed in every dimension (hemisphereCorpsConvexePrinted n for every n), so OQ-45 does not reach this row. The proof's 2° uses the neighbourhood basis of pseudo-balls (hasBasis_pseudoBoule, n ≥ 1) only for n ≥ 1. For n = 0, V is a point.", "OQ-62 does not matter for this row. Prop. 5 is applied in 4° with the radius r of 3°, which is > 0 by construction: a radius-0 pseudo-ball is empty and could not be the neighbourhood of 2°. Benzecri.ouvert_plein is proved for every r > 0, so either answer to OQ-62 leaves this row unchanged."]

