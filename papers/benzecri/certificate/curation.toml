notes = "T-bz-result-b-proj (atlas-team, 2026-11-21), audit AUDIT-1 minor (a path, the S(0) witness's disconnectedness, fixed at graduation). Unmarked, partial: result B for every simply connected covering of a compact Hausdorff V, specialised to UniversalCover V v₀ (resultB_revetement_proj/_aff, resultB_revetementUniversel_*); sentence 1's projective half (resultB_poche_proj, resultB_premiere_proj), sentence 2 (resultB_coque_stricte, resultB_hemisphere, resultB_deuxieme), sentence 3 for n ≥ 1 (resultB_troisieme; resultBTroisiemePrinted_iff: holds iff 0 < n); ResultBProjPrinted n for every n. Checked on the proof terms (closer and audit): nothing reaches 1°'s second sentence or OQ-61's strict forms; Props. 3, 4, 5 are reached only as proved lemmas; so the mark waits on T-bz-result-b's affine half (its own proof terms to check against OQ-75) and OQ-45 (a). The gloss at l.100–104 is explanatory. W Hausdorff: resultB_t2Space_of_isCoveringMap (a cited copy of lean-gx's lemma). Not vacuous: the Hopf circle ]0, ∞[/2^ℤ (resultB_nonVacuite_hopf, n = 1, connected); S(0) is a degenerate, disconnected witness. T-bz-result-b (atlas-team, 2026-11-21), audit AUDIT-1 minor (a line citation, a checklist marker; fixed at graduation): the affine half of sentence 1 (resultB_poche_aff, resultB_premiere_aff), the assembly Benzecri.theoremB beside theoremA (sentences 1–2 every n, sentence 3 under 0 < n), printed ResultBPrinted n with resultBPrinted (0 < n) and resultBPrinted_iff (↔ 0 < n). Proof-term walk (closer and audit, 67 watched names): no 1°c name (OQ-71, OQ-75, OQ-79) and no strict OQ-61 form is reached, so the row is closed up to OQ-45 (a) alone. Not vacuous: the Hopf circle as an affine manifold (n = 1, strict shell ]0, 1[ ≠ W); ℝ⁰ is a degenerate witness (constant cote 0; it would break if OQ-61 (a) redefined Déf. 1 in place). T-bz-apply-rulings (atlas-team, 2026-11-22): MARKED under DEC-177 (OQ-45 (a): n ≥ 1 is implied throughout Ch. 2; dimension 0 excluded, the dimension-0 finding recorded), on Benzecri.theoremB / Benzecri.resultBPrinted (0 < n), no Lean change."
paper_findings = ["Sentence 3 of résumé B (benzecri1960_ch1.tex l.96–98) is false as printed in dimension 0: « Le revêtement universel d'une variété localement affine compacte, considérée comme ouvert étalé au-dessus de l'espace affin, a une projection non bornée ». A compact locally affine 0-manifold is finite and its universal cover is a point. Every subset of ℝ⁰ is bounded, so no projection is unbounded (resultB_isBounded_dim_zero). Formalized: ResultBTroisiemePrinted n ↔ 0 < n (resultBTroisiemePrinted_iff), with the witness V = ℝ⁰ (compact, Hausdorff, connected, second countable, charted on itself); for n ≥ 1 it is proved (resultB_troisieme, resultB_projection_non_bornee). The cited Ch. 2 § 3 Prop. 1 (benzecri1960_ch2.tex l.648–654) fails in dimension 0 in the same way (projectionNonBorneePrinted_iff, T-bz-c2-projection). This is OQ-45 (a)'s question (is n ≥ 1 implied throughout?). No new OQ is opened, per the dispatch."]
