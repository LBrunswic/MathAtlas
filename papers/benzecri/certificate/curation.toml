notes = "T-bz-c2-premier-affine (atlas-team, 2026-11-21), audit AUDIT-1 minor (« induisant φ sur P » made a SCOPE note settled by l.184–185 and l.644–645; a docstring word and two citations; fixed at graduation). The affine Theorem's 1°, unmarked (assembled by T-bz-c2-theoreme-affine): 1°a and 1°b written once for any (G, X) (namespace Benzecri.PremierGX) and instantiated at GA(n) through Prop. 7′; exists_isDeveloping_eqOn_poche_affine, injective_of_isDeveloping_of_poche_affine (every developing map), exists_chart_poche_affine (unique); 1°c in component form poche_eq_connectedComponentIn_affine; the full form ⇔ ConnexeAffinePrinted (premierAffinePrinted_iff), proved for z ≡ 0 (the only constant cote), star-shaped φ̃(V), and n ≤ 1; theoreme_premier_affine. « sur » read « dans » (usage). Not vacuous: ℝⁿ with its translations, and the half-space with P ≠ V and a non-constant cote. T-bz-c2-theoreme-affine (atlas-team, 2026-11-21), audit AUDIT-1 minor (a docstring narrowing and REPORT wording, fixed at graduation): 2° theoreme_deuxieme_affine, 3° theoreme_troisieme_affine (and exists_isAffSegment_of_coque_affine), 4° theoreme_quatrieme_affine, every dimension, no added hypothesis, re-run directly over GA(n); the assembly theoreme_poche_balayable_affine, theoremeComposanteAffinePrinted (every n), theoremeAffinePrinted_iff (⇔ ConnexeAffinePrinted), TheoremeAffinePrinted.literal. Closed up to OQ-75. The full form holds for every affine shell (poche_eq_preimage_of_coque_affine). Not vacuous: the half-space (1°–3°) and the half-line with the strict shell ]0, 1[ (1°–4°). T-bz-apply-rulings (atlas-team, 2026-11-22): MARKED under DEC-181 (OQ-75, OQ-79: the component form is the statement of record) on Benzecri.theoremeComposanteAffinePrinted, no Lean change. The full form stays an open problem with its proved cases (shells, n ≤ 1, star-shaped; open for a non-shell pocket with a non-constant cote, n ≥ 2)."
paper_findings = ["1°c, the full form (statement l.632–633), is not proved for a non-constant cote in dimension n ≥ 2, and it is not refuted. This is the affine twin of OQ-71. The proof is « comme le précédent » (l.644–645), so its 1°c is the projective l.585–590. There, l.588 (« on peut construire dans D ∩ φ̃(V) une ligne brisée ») presumes D ∩ φ̃(V) connected. The forward reference (l.184–186, « resp. affine ») claims only « une composante connexe ». What is proved: (i) the component form; (ii) the full form is exactly the connectedness of {z < 1} ∩ φ̃(V), for one V (poche_eq_preimage_iff_affine) and for the printed statement (premierAffinePrinted_iff : PremierAffinePrinted n ↔ ConnexeAffinePrinted n); (iii) the full form for z ≡ 0, which is the only constant cote (IsPocheAff.cote_eq_zero_of_linear_eq_zero); (iv) the full form when φ̃(V) is star-shaped about a point of cote < 1, in particular when it is convex (poche_eq_preimage_of_starConvex_affine, poche_eq_preimage_of_convex_affine); 3° gives convexity for a shell; (v) the printed full form in every dimension n ≤ 1, where φ̃(V) is an interval or a point (premierAffinePrinted_of_le_one); (vi) a witness with a non-constant cote and P ≠ V, the half-space {x₀ > 0} ⊂ ℝⁿ⁺¹ (theoreme_premier_affine_demiEspace). Argued, not formalised: the full form also holds when φ̃(V) is a cone, that is, invariant under the positive homotheties h_t of one centre c, with c ∉ φ̃(V) allowed. Suppose z(c) ≥ 1. Then for x ∈ P, the ray h_t(x), t ≥ 1, stays in φ̃(V) ∩ {z < 1} and so in P, while z → −∞ along it, against inf z = 0. So z(c) < 1. Then any path of φ̃(V) between two points of {z < 1}, contracted towards c, joins them inside {z < 1}. A counterexample therefore needs n ≥ 2, and φ̃(V) can be neither a cone nor star-shaped about a point of cote < 1.", "1°c, the inclusion P ⊆ φ̃⁻¹{z < 1}. This is proof level; the statement is unaffected. The proof, « comme le précédent », i.e. l.585–590, does not argue it. Condition a of Déf. 1 (l.108–109) gives only « majorée par 1 ». The inclusion holds because φ(P) is open, and an affine function reaching its supremum 1 at an interior point is constant, which contradicts inf z = 0 (IsPocheAff.cote_lt_one).", "Exposition (proof level, statement unaffected): 1°b, inherited from the projective proof (l.568–570, the bracket « puisque GS(n, R) opère transitivement sur la fibre des jets de même source, il existe γ … »). This is proof level; the statement is unaffected. With GA(n, ℝ) in place of GS(n, ℝ), transitivity on fibres gives γ at each point only. A single γ for all of V needs V connected and the rigidity of GA(n, ℝ) (IsDeveloping.existsUnique_smul_eq). The bracket names neither.", "Bearing on OQ-75 (1°, second sentence, l.632–633): the printed full form P = φ̃⁻¹({z < 1} ∩ φ̃(V)) holds for every shell. 3° makes φ̃(V) convex, and then {z < 1} ∩ φ̃(V) is convex, hence preconnected (isPreconnected_inter_range_of_coque_affine, poche_eq_preimage_of_coque_affine; the assembly theoreme_poche_balayable_affine records it). With T-bz-c2-premier-affine's results (z ≡ 0, φ̃(V) star-shaped about a point of cote < 1, n ≤ 1), OQ-75 is now open only for a pocket that is not a shell, with a non-constant cote, in dimension n ≥ 2. No counterexample was sought beyond that.", "Not in the paper, a strengthening; the statement is unaffected. 3° and 4° (l.637, l.639–640) are characterisations, for every pocket of a connected sweepable V. The paper's 4° argument (l.609–619 « comme le précédent ») never uses that φ(P) is convex. So φ̃(V) contains a line iff φ(P) does (containsAffLine_range_iff_affine). The pocket is a shell iff φ̃(V) is convex (isCoqueAff_iff_convex_range_affine). The converse direction goes through 1°'s full form for a convex φ̃(V): φ(P) = {z < 1} ∩ φ̃(V). The pocket is a strict shell iff φ̃(V) is convex and contains no line (isCoqueStricteAff_iff_range_affine).", "Exposition (proof level, statement unaffected). In 4°, « remplacer S(n) ou H̊ par ℝⁿ » (l.644–645) removes the two steps of the projective 4° that carry the projective row's exposition findings. The first is the demi-droite lemma (l.605–607), false for S(n) and applied without saying why φ̃(V) ≠ S(n). The affine hypothesis to refute is already a line L ⊆ φ̃(V), so the lemma is not needed. The second is « gL est une demi-droite incluse dans H̊ » (l.609–612): condition b of Déf. 1 has no hemisphere clause, so this step is empty. The two projective exposition findings do not transfer as such to the affine row. Two steps stay implicit, as in the projective proof. First, gL is a line of φ̃(V) because φ̃ ∘ g = A ∘ φ̃ with A ∈ GA(n, ℝ), the rigidity of 1°b (IsDeveloping.existsUnique_smul_eq). The convention φ̃ = id (l.593–594) hides this. Second, condition b is applied to each sub-segment (gM, X) of gL (l.615–616). These are segments of V because they lie on gL ⊆ φ̃(V); here they are built with the chart φ̃ (isAffSegment_of_chart)."]

