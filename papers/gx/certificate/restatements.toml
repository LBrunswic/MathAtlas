[[entry]]
label = "ex:following_example_skeletal_itemize"
status = "checked"
kind = "false"
printed = "RamcovGX.tex:367-374"
printed_sha256 = "435c5fbf6d406600fdcd61ddbec9872a5ffae2af94792924e1fb1954f6f8be98"
finding = "Item 3 is false as written: the bow-tie (two triangles sharing one vertex) is a finite pure 2-dimensional complex whose 0-skeleton is not skeletal (GX.bowtie_counterexample). Items 1, 2 and 4 hold once surface, tame knot and n are made explicit."
refutation = ["GX.bowtie_counterexample"]
anchor = ["GX.isSkeletal_of_finite_surface", "GX.isSkeletal_of_tameKnot", "GX.isSkeletal_skeletonSpace", "GX.isSkeletal_of_isTotallyDisconnected"]
basis = ["DEC-27"]
reading = "Item 2: 'a tame knot S in a 3-manifold' is read as 'a closed, locally flat subset' (the hypothesis the anchor GX.isSkeletal_of_tameKnot uses). That a tame knot is locally flat is classical but not proved in Lean, and no DEC row rules it (DEC-68 (c) reads 'tame knot = locally polygonal' at l.1563 only)."
rewritten = '''
The following examples of $S$ are skeletal in $X$. Here an $n$-manifold is any topological space locally homeomorphic to $\RR^n$; no separation or countability axiom is used except where stated.
\begin{itemize}
 \item $S$ finite and $X$ a Hausdorff surface;
 \item $S$ a closed subset of a $3$-manifold $X$ which is locally flat: every point of $S$ has an open neighbourhood $\W$ in $X$ and a homeomorphism $h$ of $\W$ onto an open subset of $\RR\times\RR^2$ such that $S\cap \W = h^{-1}(\RR\times\{0\})$;
 \item $S$ the $k$-skeleton of a finite pure $n$-dimensional simplicial complex $X$ (realised in some $\RR^N$) with $k\leq n-2$, provided $X$ is locally strongly connected in codimension $\geq 2$: for every face $\sigma$ of dimension at most $n-2$, any two $n$-faces containing $\sigma$ are joined by a chain of $n$-faces containing $\sigma$, any two consecutive ones sharing an $(n-1)$-face (two triangles sharing only a vertex are thus excluded);
 \item $S$ a closed totally disconnected subset (for instance a Cantor set closed in $X$, tamely or wildly embedded) of an $n$-manifold $X$ with $n\geq 2$.
\end{itemize}
'''
changes = ["+ hypothesis (item 3): X finite and locally strongly connected in codimension >= 2 (DEC-27); without it the item fails (GX.bowtie_counterexample: two triangles sharing a vertex, which violate it, GX.not_isLocallyStronglyConnected_bowtie)", "+ hypothesis (item 3): the complex is finite and realised in a finite-dimensional real vector space, as the anchor requires", "~ reading (item 1): a surface is a Hausdorff space locally homeomorphic to R^2 (no second countability)", "~ reading (item 2): a tame knot is replaced by the property the anchor uses, a closed locally flat subset; the knot (circle) structure is not used. That a tame (locally polygonal, the reading DEC-68 (c) gives at l.1563) knot is locally flat is a classical fact the anchor does not prove; this reading has no DEC row of its own", "~ hypothesis (item 4): wildly embedded dropped and n >= 2 made explicit; the anchor proves the item for every closed totally disconnected subset of a manifold of dimension >= 2 (stronger); in dimension 1 no non-empty subset of R is skeletal (GX.eq_empty_of_isSkeletal_real)", "~ notation: n-manifold means locally homeomorphic to R^n; skeletal is read by its definition (complement open, dense, locally connected in X) without the Hausdorff locally connected ambient of def:portly_skeletal_subset"]
check = "CHECK-ex_following_example_skeletal_itemize-1.json"

[[entry]]
label = "lem:GX_atlas_union"
status = "checked"
kind = "false"
printed = "RamcovGX.tex:412-418"
printed_sha256 = "b5fe75153556919ed4a87b95aa26278c0f4a39734631a7c0a3e4258714719e21"
finding = "False for an empty family on a non-empty N: the union is then the empty atlas, whose support is not dense, so not portly (GX.not_isAEAtlas_iUnion_empty). The hypothesis that N is locally connected is not needed."
refutation = ["GX.not_isAEAtlas_iUnion_empty"]
anchor = ["GX.isAEAtlas_iUnion"]
basis = ["DEC-46"]
rewritten = '''
Let $N$ be a topological space.
Let $(\B_k)_{k\in K}$ be a non-empty family of a.e.$(G,X)$-atlases on $N$. Assume for all $(k,k')\in K^2$, there exists an a.e $(G,X)$-atlas $\A$ such that $\A$ is thinner than both $\B_{k}$ and $\B_{k'}$.

Then the union $\bigcup_{k\in K} \B_k$ is an a.e.$(G,X)$-atlas.
'''
changes = ["+ hypothesis: the family is non-empty (DEC-46 (a)); for K empty the union is the empty atlas, whose support is not portly in a non-empty N (GX.not_isAEAtlas_iUnion_empty)", "- hypothesis: N locally connected, which the anchor does not use (the charts make the supports locally connected through X); portly is read by its definition (open, dense, locally connected in N) in any space", "~ standing: (G,X) is the analytical structure of Section sec:GXsing (l.341); the anchor uses only X locally connected and Hausdorff, G acting by homeomorphisms, and rigidity, not X connected nor the action faithful"]
check = "CHECK-lem_GX_atlas_union-1.json"

