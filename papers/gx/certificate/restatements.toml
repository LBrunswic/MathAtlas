[[entry]]
label = "theo:local_virt_tame"
status = "checked"
kind = "false"
printed = "RamcovGX.tex:1974-1981"
printed_sha256 = "53c788c5c94a8aee76bf9ba881b275c2a68965575e86120bd28f72d56b26bcbc"
finding = "(ii) does not imply (i): GX.ThinCex is an analytical family of one locally Galoisian model (a cone over a torus) with an Aut-continuous tamifying topology, hence (ii), and an X_A-manifold V, an open subset of the model, which is not virtually tame (GX.not_localVirtTameStatement). The implication holds for X_A-manifolds whose charts at singular points descend from the maximal coverings of the models."
refutation = ["GX.not_localVirtTameStatement", "GX.ThinCex.local_virt_tame_counterexample"]
anchor = ["GX.local_virt_tame_descending"]
basis = ["DEC-109", "DEC-86", "DEC-66", "DEC-67"]
rewritten = '''
Let $(X_\alpha)_{\alpha\in A}$ be an analytical family of locally Galoisian model spaces, each $X_\alpha$ connected, locally path-connected and first countable.
If for every $\alpha\in A$, there exists a tamifying topology $\T_\alpha$ on $\widetilde X_\alpha$ such that the group $\Aut(\widetilde X_\alpha)$ acts $\T_\alpha$-continuously,
 then the following are equivalent:
\begin{enumerate}[(i)]
 \item every connected, locally path-connected, first countable $X_A$-manifold $M$ such that every $x\in\sing(M)$ is the centre of an $X_A$-chart descending from the maximal covering of its model is virtually tame;
 \item for every $\alpha \in A$, $X_\alpha$ is virtually tame.
\end{enumerate}
Here an $X_\alpha$-chart $(\U,\V,\phi)$ of $M$ descends from the maximal covering of its model if, for every choice of base points of the maximal coverings $\widetilde M\xrightarrow{p} M$ and $\widetilde X_\alpha\xrightarrow{q} X_\alpha$ possibly branched over $\sing(M)$ and $\sing(X_\alpha)$, for every $e\in p^{-1}(\U)$ and every $f\in q^{-1}(\phi(p(e)))$, there is a map $\Psi:\widehat\V\rightarrow\widetilde M$ on the connected component $\widehat\V$ of $q^{-1}(\V)$ containing $f$, continuous for the natural topologies, such that $p(\Psi(\widehat\V))\subset\U$, $\phi\circ p\circ\Psi = q$ on $\widehat\V$ and $\Psi(f)=e$.
'''
changes = ["+ hypothesis (in (i)): every singular point of M is the centre of an X_A-chart descending from the maximal covering of its model, the form of record (DEC-109); without it (ii) does not imply (i) (GX.not_localVirtTameStatement, counterexample GX.ThinCex.local_virt_tame_counterexample), and no hypothesis on the models repairs it under DEC-86", "~ conclusion: (i) now quantifies only over the X_A-manifolds with descending charts at their singular points (weaker: (i) no longer claims every X_A-manifold is virtually tame). The counterexample is excluded: its X_A-manifold V is not virtually tame while its model is, so by the anchor its chart at the singular point does not descend", "+ hypothesis: the models X_alpha and the manifolds M of (i) are connected, locally path-connected and first countable (DEC-66 (a)-(c): the standing assumption of l.810 and M connected and locally path-connected wherever the maximal covering is used; l.1703)", "~ reading: an X_A-manifold has a chart centred at every singular point (DEC-67 (e)); in (i) this is implied by the descending hypothesis", "~ notation: the tamifying topology T_alpha lives on the maximal covering of X_alpha, as in def:singular_manifold_virtually_tame; a chart descending from the maximal covering of its model is defined in the statement, the paper having no name for it", "~ standing: (G,X) is an analytical structure with X locally unloopable (the standing assumption of the section, l.1660); the anchor does not use X connected, nor the second countability of singular (G,X)-manifolds (def:singular_manifold_locally_connected)", "~ other corrected forms, proved but not of record (DEC-109): r an isomorphism (GX.isVirtuallyTame_of_hasMaximalLifts), models of finite local degree (GX.isVirtuallyTame_of_isXAManifold_of_hasFiniteLocalDegree), liftable charts (GX.local_virt_tame_liftable); (i) implies (ii) holds as printed (GX.local_virt_tame_forward)"]
check = "CHECK-theo_local_virt_tame-1.json"

