notes = "WP-26f, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: 'X∖U is a codimension at least 2 submanifold' is read as LOCALLY FLAT: every point of X has an open chart V ≃ₜ E which is either contained in U or carries V∖U onto a closed proper linear subspace (GX.isSLSCIn_of_locally_linear). Topological codimension-≥2 submanifolds which are not locally flat (wild arcs in ℝ³, e.g. Fox–Artin) are NOT stated in Lean: whether the claim holds for them is not known to us (radial contraction is unavailable at a wild point), so stating it with a sorry would risk a false theorem. Is local flatness intended? | 'X is a simplicial complex and X∖U is a union of facets' is read as: X = |K| for a LOCALLY FINITE geometric simplicial complex K (subspace topology of a real normed space), X∖U a union of closed FACES of K (not facets = maximal faces, which in a pure complex would make U non-dense, contradicting the proviso). Complexes that are not locally finite (weak topology) are not stated. Accept the reading? | 'almost trivial' (def:almost_trivial_loop, l.1212: 'the connected component of γ in Ω(x,x,U) meets Ω(x,x,V∩U)') is read as GX.AlmostTrivial, the HOMOTOPY reading of GXScaffold.Branched.Paths (WP-26e SCOPE (a), the paper's 'or, equivalently', l.1201), which awaits a ruling; only homotopic ⇒ same component is proved (GX.AlmostTrivial.almostTrivialCC), so IsSLSCAt/IsSLSCIn are at least as strong as the literal notions. Same question as WP-26e's def:almost_trivial_loop: rule the homotopy reading? This row is unmarked until it is ruled and closes (or, for partial rows, keeps only its other reasons) once it is."
