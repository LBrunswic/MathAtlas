notes = "WP-24d, audited clean (wave 1, WP-24). Partial: paper statement corrected (DEC-27) Readings taken: l.877: 'the coarsest topology making the natural injection X → Y a spread' — such a coarsest topology is not obviously well defined (spreadness depends on components, which depend on the topology). Which topology is meant: the one generated by the subspace-topology components of X ∩ U?"
paper_findings = ["Item 1 holds and is proved as a theorem (GX.notMem_ordX_of_notMem_interior).", "Item 2, l.880: 'ord(Y) = ∅' is false as written: p(X) avoids the open unit disc (‖p(x)‖ ≥ 1), so the disc is (vacuously) ordinary whatever topology X carries (GX.ball_subset_ordY_portlyInv). The intended claim is ord(Y) ∩ p(X) = ∅.", "Item 2's own space (X ⊆ ℝ² with 'the coarsest topology making the injection a spread') is not built. A counterexample with every property the paper lists (X = ℝ connected, Hausdorff, second countable, locally path-connected; p = x ↦ ||x|-1| a spread; X₁ = (1,∞) open and locally connected in X but not dense; Y₁ = (0,∞) open; X₁ → Y₁ a homeomorphism) is GX.cex_portlyness: 1 ∉ ord(Y), 2 ∈ X₁ ∖ ord(X), and p^{-1}(Y₁) ∋ -2 so p^{-1}(Y₁) ≠ X₁."]

