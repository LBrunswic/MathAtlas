label = "cex:portlyness"
decls = ["GX.not_injOn_of_notMem_interior", "GX.notMem_ordX_of_notMem_interior", "GX.notMem_ordY_of_forall_not_injOn", "GX.zigzag", "GX.cex_portlyness", "GX.isSpread_zigzag", "GX.isCoveringMap_zigzag_restrict", "GX.portlyX", "GX.portlyInv", "GX.ball_subset_ordY_portlyInv", "GX.ordY_portlyInv_nonempty"]
