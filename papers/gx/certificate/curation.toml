notes = "WP-27f, audited clean. Partial: tagged sorry: Antoine's theorem for the explicit necklace (whose Cantor property, nesting and the pairwise disjointness of the 64 links of each generation are PROVED). Missing: (1) the essential loop — a meridian of a link L of generation n is not null-homotopic in S^3 minus (C ∩ L). No abelian invariant can detect it (H^1 of the complement of a closed subset of a Cantor set vanishes by Alexander duality, so winding/linking numbers, maps to S^1 and abelian covers all give 0); by compactness of a null-homotopy it suffices to detect it in the complement of each finite stage C_m ∩ L (64^(m-n) solid tori), which needs for every m a non-abelian covering/representation of π₁ of that complement (an iterated lift, the depth-2 instance of which is the dihedral invariant of ex:consider_denote_absolute_galois, or Antoine's van Kampen computation); mathlib has neither van Kampen nor π₁ of a solid-torus complement. (2) Accessibility: a path from each x ∈ C to the meridian meeting C only at x. (3) Wildness: a Cantor set carried into a great circle has a semi-locally simply connected complement, which needs the simple connectivity of S^3 minus a compact subset of a circle (again van Kampen-type). Readings/questions: The claim is stated for one explicit Antoine necklace (square rings, 64 links per chain, ratio 7/80). Antoine necklaces are not all ambient-equivalent (Sher 1968), though Antoine's theorem holds for each; is the explicit necklace an acceptable reading of DEC-58, or is a statement over every Antoine necklace (a predicate on nested chains of linked tame solid tori) wanted?"
paper_findings = ["Under DEC-58 the example is about Antoine's necklace, now constructed (GX.antoineNecklace) and the statement made about it; the general wild-Cantor reading (refuted in WP-26h modulo Kirkor's existence) is only a side remark (GX.wild_cantor_claim_false_of_exists, proved).", "The geometry of the construction is checked mechanically: all 64×64 pairs of first-generation links are box-separated except the 64 cyclically consecutive pairs (GX.antoine_sep_or_adj, GX.antoine_adj_succ, by decide), and consecutive ones are disjoint (GX.antoine_link_aux); that consecutive links are genuinely LINKED is read off the coordinates and is used only inside the citation."]

