paper_findings = ["l.1184 'We see that S is skeletal' is FALSE: since (r_n, theta_n) is dense in Y0 = {theta in ]0,1[}, r_n takes arbitrarily small values, so the apex of D_inf is in the closure of S = (r_n, theta_n + n) but not in S; S is not closed, hence not skeletal (GX.cexS_not_isSkeletal), and prop:universality does not apply to it. 'Y minus S is semi-locally simply connected' also fails at the apex (every neighbourhood {r < eps} contains points of S around which a small loop is not null-homotopic) - not formalized. Correction: use S' = S union {apex}; then S' is skeletal, D_inf minus S' is semilocally simply connected, the maximal covering p possibly branched over S' is branched at every point of S (GX.logChart_mem_branchingLocus), q(S) is dense in D (GX.dense_qDisc_image_cexS), and q o p is not a branched covering (GX.cex_branched_covering_composition, via the corrected (i) => (ii)).", "The disc D = Gamma_alpha \\ D_inf is identified with C (GX.discHomeomorph); the 'theta_n + n' of the construction requires alpha = 1, which is taken (q(r, theta) = r exp(2 pi i theta)); q is proved a branched covering (GX.isBranchedCovering_qDisc), branched over {0} only."]

