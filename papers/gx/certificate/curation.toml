notes = "WP-24d, audited clean (wave 1, WP-24). Readings taken: Is the vacuous case intended (U with p^{-1}(U) = ∅ evenly covered)? The formalization follows the text. If not, the definition should add p^{-1}(U) ≠ ∅ or restrict to y ∈ closure p(X)."
