notes = "WP-35h, audited clean. Partial: tagged sorry: Antoine's lemma proper, exactly GX.AntoineMeridianEssential: for n <= m the meridian GX.antoineMeridian of a generation-n link L (carried by antoineComp v n, then into S^3) is not null-homotopic in S^3 minus (C_m ∩ L), the 64^(m-n) linked square solid tori of generation m inside L. No abelian invariant detects it for m > n (H_1 of the complement is free on the meridians of the sublinks, each sublink is null-homologous in L, so the meridian of L is 0 in H_1, a product of commutators); it needs Antoine's van Kampen computation for a chain of linked solid tori or a non-abelian covering tower. mathlib has no van Kampen theorem, no pi_1 of a solid-torus complement, no PL solid-torus theory. Everything around it is built: compactness reduction (GX.antoine_homotopicIn_stage, stages compact GX.antoineStage_isCompact), link selection (GX.antoineComp_diam, GX.antoineP0_not_mem_word_link), accessibility (GX.antoineVert_not_mem_necklace), the based loop (GX.antoineLoop0, GX.antoineLoop0_memOmega) and conjugation (GX.antoine_homotopicIn_conj). Readings/questions: The row's hypothesis 'S wild' is a property of the necklace the conclusion does not use; it is derived here only under the named tame-Cantor fact GX.TameCantorSLSC. Should the row require the necklace's wildness to be certified (a further general-position result: S^3 minus a Cantor subset of a great circle is simply connected), or is the conclusion for the ruled necklace (DEC-58/68 (f)) the whole row?"
paper_findings = ["Under DEC-58/DEC-68 (f) the example is about one explicit Antoine necklace, constructed and proved a Cantor set; the general wild-Cantor reading fails as soon as some wild Cantor set has simply connected, locally non-separating complement (GX.wild_cantor_claim_false_of_exists, proved).", "l.1578: the conclusion does not depend on wildness; for the necklace it reduces (proved) to Antoine's lemma that the meridian of a link is essential in the complement of the finite stages inside it, at ONE point of S (the fixed point of g_0)."]

