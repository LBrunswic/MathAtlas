notes = "WP-25c, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: Is 'injective open' meant as 'a homeomorphism onto its image' (proved) rather than 'an open map into the limit' (false, comb)? | Is 'connected neighbourhood basis' meant to allow non-open connected neighbourhoods? The comparison with ends is stated for open ones (IsCNbhd); the embedding is proved for any neighbourhood basis (fiberMapNhds)."
paper_findings = ["l.928 'injective open': injective and an embedding (open onto its image) is proved (GX.isEmbedding_fiberMap); the literal 'open map into the inverse limit' is equivalent to the image being open (GX.isOpenMap_fiberMap_iff) and is FALSE, proved by GX.not_isOpenMap_fiberMap_comb: X = GX.combSet ⊆ ℝ², the x-axis with the arms {(t, r_n − t) : 0 < t ≤ r_n}, r_n = 2⁻ⁿ (Hausdorff, second countable, locally path-connected — instance), p = first projection (a spread, GX.isSpread_combProj), b = 0, 𝓤 = {(−ρ, ρ)}: p⁻¹(0) is the origin, and the arm-n thread (GX.combThread) agrees with the origin's on every (−ρ, ρ) with ρ > r_n (combThread_eq_of_lt) but is unrealised (combThread_ne), so every cylinder around φ(origin) leaves the image. The proof's identity φ(V ∩ p⁻¹(b)) = π_U⁻¹(V) (l.940) holds only when every thread through V is realised.", "l.929 'homeomorphism iff complete' is false for a fixed b: exp : ℝ → ℝ at b = 1 has the natural map a homeomorphism for every basis while exp is not complete (GX.fiberMap_exp_bijective_not_complete). True forms: for fixed b, onto iff every thread (equivalently every end at b) has a point (surjective_fiberMap_iff_threads, surjective_fiberMap_iff_ends); complete iff onto for every b and every basis (GX.isCompleteSpread_iff_forall_surjective_fiberMap), equivalently for one basis at each b (GX.isCompleteSpread_iff_forall_exists_surjective_fiberMap), and then a homeomorphism (GX.fiberHomeomorph)."]

