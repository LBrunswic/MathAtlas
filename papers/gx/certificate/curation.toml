paper_findings = ["l.1184 'S is skeletal' is false: the apex is in the closure of S (GX.cexS_not_isSkeletal); with S ∪ {apex} (DEC-53) the counterexample holds in full (GX.cex_branched_covering_composition). The row closes under DEC-53, the correction recorded. 'Y∖S semilocally simply connected' for the printed S (also false at the apex) is not formalized; it is superseded by the ruled S ∪ {apex}.", "l.1186: 'q(Y∖ord_p(Y)) = q(S)' is false as printed. The branching locus Y∖ord_p(Y) is closed (ord_p open) and contains S, hence the apex (in the closure of S); with branchingLocus ⊆ S ∪ {apex} it is exactly S ∪ {apex}, so q(Y∖ord_p(Y)) = q(S) ∪ {0} ≠ q(S) (0 ∉ q(S) since r_n > 0). The equality holds with S ∪ {apex} in place of S (DEC-53); the density argument and the conclusion are unaffected. Proved in GX.cex_branched_covering_composition (conjuncts branchingLocus = insert apex S, q-image = insert 0 (q '' S), q-image ≠ q '' S)."]

