notes = "WP-25f, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: The later counterexample (l.1181) uses '𝔻' and 'the quotient map q : D_inf → 𝔻' without defining 𝔻 in ex:quotient_base; read as 𝔻 = Γ_α\\D_inf (GX.Disc α, GX.discQuot α, homeomorphic to C by GX.discHomeomorph), presumably α = 1 since Y_0 = {θ ∈ ]0,1[}. | ex:quotient_base l.673: which developing map is intended for the massive particle of mass 1 − α/2π — (r cos θ, r sin θ), giving angle α, or the printed (r cos(θ/α), r sin(θ/α)), giving angle 1? | l.678: was the extreme BTZ black hole meant to use a past lightlike u (or a time reversal of X) rather than t ↦ −t on the cylinder, which yields a structure isomorphic to the white hole? | l.679: should the Misner/BTZ variations require v outside the span of u and a null eigenvector of the boosts (v_a v_b ≠ 0 in null coordinates)? 'v spacelike' alone allows a degenerate D."
paper_findings = ["l.667 'Its singular locus is sing(M) = {r=0}' is false in general: GX.quotientBase_counterexample (alpha = 2π, X = C, G = translations, D(r,θ) = r e^{iθ}, every hypothesis of the example) has EMPTY singular locus while {r=0} is the apex. True: sing(M) ⊆ π{r=0} (GX.quotientBase_sing_subset).", "l.664–667 dimension slip: cyl{n} := D_inf × R^n is (n+2)-dimensional and is said to have a local homeomorphism {r>0} → X ⊆ R^n and a quotient homeomorphic to R^n; read cyl{n} = D_inf × R^{n-2} (the Minkowski case uses (r,θ,z), z ∈ R, X = R^3), or the quotient as R^{n+2}. Formalized for D_inf × Z, with M ≅ C × Z (GX.cylHomeomorph).", "l.673 (massive particle): with D(r,θ,z) = (z+σθ/α, r cos(θ/α), r sin(θ/α)) the deck generator θ ↦ θ+α of Γ_α acts by D ↦ (time translation by σ) ∘ (rotation of angle 1 radian), whatever α (GX.massiveDev_smul with c = 1/α: angle cα = 1). The cone angle is therefore 1 and the mass 1 − 1/2π, not the stated m = 1 − α/2π, unless α = 1. The stated mass needs D = (z+σθ/α, r cos θ, r sin θ) (c = 1, angle α). Both are formalized (GX.massive_particle for every angular speed c ≠ 0).", "l.674–678 (extreme BTZ white hole): formalized in the paper's generality (GX.btz_whitehole_isom0: every x0, future lightlike u, <v|u> < 0, G = Isom_0); D is even a homeomorphism of {r>0} onto a half-space, holonomy P_α.", "l.678 'Choosing D'(r,θ,t) = D(r,θ,−t) gives an extreme BTZ blackhole instead': D' = D ∘ T with T(r,θ,t) = (r,θ,−t) a Γ_α-equivariant homeomorphism of the cylinder, so T descends to an isomorphism of singular (G,X)-manifolds between the 'black hole' M' and the white hole M (GX.btz_blackhole_iso_whitehole, GX.btz_blackhole_isom0). As printed, the black hole is the white hole. A genuine black hole should reverse the time orientation of X (e.g. u past lightlike, or D composed with a time reversal of Minkowski space, which is not in Isom_0).", "l.679 (Misner/BTZ variations, u spacelike): 'v spacelike' does not suffice: for u = (0,0,1) and the spacelike v = (1,0,1) (null coordinates, Q(v) = 1) the image of D lies in a plane, so D is not a local homeomorphism (GX.misnerDev_spacelike_counterexample). Needed: v not in the plane spanned by u and one null eigendirection of the boosts (v_a v_b ≠ 0), automatic for timelike v. Formalized with that condition (GX.misner_btz, GX.misner_isom0).", "SCOPE: tachyons and photons (l.682–683, no formula in the paper) and the polyhedral gluings are not formalized; the variations are formalized for the coordinate spacelike u only."]

