paper_findings = ["Surjectivity of the covering is used for Y₁ ⊆ ord(Y): for a covering map in mathlib's sense (possibly non-surjective) one gets p(X₁) ⊆ ord(Y), X₁ ⊆ ord(X), p⁻¹(Y₁) = X₁ (GX.spread_partial_covering'), and Y₁ ⊆ ord(Y) fails for unitTrue : Unit → Bool, X₁ = Unit, Y₁ = Bool (GX.spread_partial_covering_surjective_needed). Consistent with DEC-40's 'covering = surjective covering map'.", "Necessity of portlyness (density) is now witnessed with every other hypothesis of the Lean statement, including T2Space and LocallyConnectedSpace X (even LocPathConnectedSpace, second countable) and X₁ locally connected in X: GX.cex_portlyness_paper."]

