paper_findings = ["l.2006: read literally, 'p^*T is the coarsest topology on M such that (M,p^*T) → (N,T) is a spread' is false — p^*T need not be a spread at all (GX.not_isSpread_strongPullTop_ratTop: p = id on ℝ, T generated by the usual topology and ℚ; p^*T is not locally connected at √2). The true content: every spread topology finer than T_M is finer than p^*T, and p^*T is the coarsest one exactly when it is locally connected (GX.isSpread_strongPullTop_iff, GX.isGreatest_strongPullTop). The remark's own 'However' sentence is GX.cex_component_not_strongPull_connected (ℝ cut at 0). The proof block following the remark (l.2010–2061) is the proof of lem:spread_top, formalized under that label."]

