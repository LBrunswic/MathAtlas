[[row]]
label = "rem:definition_semi_locally_simply_connected"
decls = ["GX.isSLSCInCC_univ_of_semilocallySimplyConnected", "GX.isSLSCIn_univ_of_semilocallySimplyConnected", "GX.harmonicArchipelago_counterexample", "GX.not_semilocallySimplyConnected_of_isSLSCInCC_univ", "GX.HarmonicArchipelago", "GX.harmonicArchipelago_isSLSCInCC", "GX.harmonicArchipelago_isSLSCIn", "GX.harmonicArchipelago_isSLSCAt_base", "GX.harmonicArchipelago_isSLSCAt_pt", "GX.harmonicArchipelago_not_semilocallySimplyConnected", "GX.archLoop_not_homotopic", "GX.archLoop", "GX.archPush", "GX.archF", "GX.continuousOn_archF", "GX.isOpenEmbedding_archPt", "GX.arch_compact_bound"]
bucket = "C"
extra_lean_files = ["GX/Branched/Galois.lean"]
lean_proved_override = "partial"
notes = "WP-35b, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: Is the non-compact archipelago acceptable as the recorded counterexample, or is a compact (Peano continuum) one wanted? The remark's standing hypotheses do not ask for compactness."
paper_findings = ["RamcovGX.tex:1455-1457: 'X is semi-locally simply connected iff it is semi-locally simply connected in itself' holds only in the direction slsc ⇒ slsc in itself (GX.isSLSCInCC_univ_of_semilocallySimplyConnected, literal DEC-55 form; the corrected statement). The converse is false, now FORMALIZED (DEC-27): GX.not_semilocallySimplyConnected_of_isSLSCInCC_univ refutes the printed 'iff' over all Hausdorff, connected, locally path-connected X, with witness GX.harmonicArchipelago_counterexample.", "The harmonic archipelago is built as the graph over the open half-plane Re z > 0 (coordinate w = 1/z; the Hawaiian-earring circles Re w = k/2 pass through the base point 0) of h(w) = sin²(2π Re w)/(1 + (Im w)²), plus the base point. Slsc in itself: every loop at the base point is homotopic rel ends into any neighbourhood (GX.archPush pushes the hills Re w < n onto the circle Re w = n; a compact loop climbs no far hill, GX.arch_compact_bound); off the base point the space is a surface (radial contraction through the chart GX.isOpenEmbedding_archPt). Not slsc: the loops Re w = N/2 (GX.archLoop, inside the 2/N-ball) are not null-homotopic (GX.archLoop_not_homotopic): a null-homotopy has compact image, misses the summit (1/c, 1), c = M/2 + 1/4, of a far hill, and off that summit GX.archF : 𝔸 → ℂ ∖ {0} is continuous and carries the loop to a loop of winding number 1 (GX.cWinding of GX.Branched.Paths).", "The space formalized is NOT compact (the summits accumulate at the missing point (0,1)), so it is not a 'Peano continuum' as WP-27e's report and the WP-35b dispatch call it; compactness is not needed for the counterexample, and the remark's hypotheses (Hausdorff, connected, locally path-connected) are all proved. No compact variant is formalized. The row stays partial as a corrected statement (no ruling accepts the one-directional form)."]

