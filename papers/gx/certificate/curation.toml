bucket = "A"
notes = "WP-24a, audited clean (wave 1, WP-24). Readings taken: l.362 'W ∩ U is connected': read with IsPreconnected (empty set allowed). For open dense U it is equivalent to the IsConnected reading (GX.isLocallyConnectedIn_iff_isConnected), so IsPortly is unaffected; the reading only matters for 'locally connected in X' applied to non-dense sets."

[[row]]
label = "ex:following_example_skeletal_itemize"
decls = ["GX.isSkeletal_of_finite_surface", "GX.isSkeletal_of_countable", "GX.isSkeletal_of_tameKnot", "GX.isSkeletal_of_locallyFlat", "GX.bowtie_counterexample", "GX.isSkeletal_skeletonSpace", "GX.isSkeletal_skeletonSpace_codim_two", "GX.not_isLocallyStronglyConnected_bowtie", "GX.isSkeletal_of_isTotallyDisconnected", "GX.isPreconnected_compl_of_isTotallyDisconnected", "GX.eq_empty_of_isSkeletal_real"]
bucket = "C"
extra_lean_files = ["scaffold/GXScaffold/Topology/PortlyExamples.lean"]
lean_proved_override = "partial"
notes = "WP-24a, audited clean (wave 1, WP-24). Partial: tagged sorry: dimension theory: a closed totally disconnected subset of R^n is zero-dimensional and a subset of dimension <= n-2 does not separate R^n (Hurewicz-Wallman Thm IV 4 / Alexander duality / Borsuk separation). Not in mathlib; mathlib's countable-complement argument does not reach uncountable K, and straight-line general position fails (a Cantor set can meet every ray from a point). Everything else of item 4 (chart localisation, transfer of total disconnectedness through univBall, density) is proved.; local structure theory of geometric simplicial complexes, absent from mathlib (carrier of a point, open stars as a neighbourhood basis of K.space, star of a point as the cone on its link, connectedness of an open simplex with its open codimension-one faces, and the general-position step that a path avoiding the (n-2)-skeleton crosses facets only through open (n-1)-faces). The reduction k < n-2 to k = n-2 is proved (GX.isSkeletal_skeletonSpace). Readings taken: 'surface' read as a Hausdorff space charted on R^2 (no second countability, no smoothness). | 'tame knot' read as a closed locally flat subset (charts onto open subsets of R x R^2 sending the knot to R x {0}); the circle structure is unused. | 'Cantor wildly embedded' read as a closed totally disconnected subset (compactness and perfectness unused). | 'pure n-dimensional simplicial complex' read as a finite geometric complex (mathlib Geometry.SimplicialComplex) in a finite-dimensional real normed space with the subspace topology; pure = every face has <= n+1 vertices and lies in a face with n+1 vertices."
paper_findings = ["Item 3 (l.372) is false as written: the bow-tie (two closed triangles of R^2 sharing only the vertex 0) is a finite pure 2-dimensional simplicial complex whose 0-skeleton is not skeletal: a small open star of 0 is connected, removing 0 disconnects it (GX.bowtie_counterexample, built as a mathlib Geometry.SimplicialComplex). The item needs local strong connectivity in codimension >= 2 (every two n-simplices containing a simplex of dimension <= n-2 are joined through (n-1)-faces containing it), as for normal pseudomanifolds; the bow-tie fails exactly this (GX.not_isLocallyStronglyConnected_bowtie). The same caveat applies to l.625 ('gluings of projective polyhedra ... complement of the (n-2)-skeleton ... skeletal'), which is true for gluings that are pseudomanifolds but not for arbitrary face gluings.", "Item 4 (l.373) needs n >= 2: in R no nonempty subset is skeletal (GX.eq_empty_of_isSkeletal_real), so a Cantor set in a 1-manifold is not skeletal. 'Wildly' presupposes n >= 3 anyway, so this is a precision rather than an error; the statement holds for tame and wild embeddings alike.", "The closure properties l.383-390 never use Hausdorff; the two map items (l.389, l.390) need only the SOURCE locally connected; 'U portly in X, U ⊆ V implies U portly in V' (l.385) holds for an arbitrary subset V, not only open ones, when X is locally connected."]

