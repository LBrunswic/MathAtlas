paper_findings = ["l.1990–2004: lem:spread_top is false as printed. Counterexample (formal, GX.cex_spread_top_halfCut / GX.not_spreadTopPrinted): M = N = ℂ, S = ∅, q = id, p: M̃^∅ → ℂ the universal covering, R = {Im ≠ 0}, T = the topology of ℂ generated by the usual one and {Im ≥ 0}. All hypotheses hold; p⁻¹{Im ≥ 0} and p⁻¹{Im < 0} are p^*T-open, so p^*T is disconnected and (a), (e) fail. The proof uses 'N strongly connected' (l.2018) and 'R̂ weakly connected' (l.2047), neither of which is a hypothesis.", "l.2047: 'R̂ is weakly connected' does not follow even when T is connected (informal, not formalized; the formal correction only needs the half-cut counterexample): M = N = ℂ*, S = ∅, p the universal covering (log), T cutting ℂ* along the positive real ray with the ray glued to the upper bank; p^*T splits M̃ into strips. Corrected form: assume p⁻¹(R) connected (true when R is portly for the natural topology, as in the application l.2096).", "l.2029/2034: the Claim's 'We may assume that Ô ∩ R̂ is connected' is unproved (the argument lifts a path from x̂ to some point over z, not to ẑ) and is exactly (c): GX.isPortly_strongPullTop_iff_local. It fails (FORMAL, GX.cex_spread_top_sector, GX.not_spreadTopConnCE): M = N = ℂ, S = {0}, M̃^{0} ≅ 𝔻_∞ the logarithmic covering completed at 0 (GX.exists_homeomorph_maxBranched_qDisc), q = id, R = ℂ∖{0} (portly for both topologies, p⁻¹R connected), T = usual ⊓ generateFrom{{0} ∪ {Re > 0}} (first countable, LPC, agreeing with the usual topology on R). The preimage of the sector is p^*T-open and p^*T-connected through the branch point, its regular part p⁻¹{Re > 0} is not connected: (c), (e) and the Claim's local hypothesis all fail. theo:local_virt_tame uses (c)/(e) through (D) and the strong branched covering; its proof inherits the gap.", "l.2025: 'M̃^S → M is Galoisian and thus so is M̃^S → N' is asserted without argument; it is true (GX.isGaloisian_of_comp: deck transitivity over q⁻¹(M∖S) by uniqueness of lifts, dense orbits, discrete fibres from M∖S slsc in M), using N Hausdorff, LPC, first countable and M∖S ⊆ ord_q (GX.compl_subset_ordY_of_comp).", "l.2017–2018 'lem:path_covering' is applied relative to an open connected O (GX.exists_path_of_isPortly_of_isOpen), and the Claim's second part needs fibres of p discrete (from M∖S slsc in M) to pick Ô ∩ p⁻¹(y) = {ŷ}."]

