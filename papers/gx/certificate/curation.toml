paper_findings = ["(i) => (ii) is FALSE as printed (l.1093, l.1129): the proof shows q(Y minus ord_p(Y)) is contained in Z minus ord_{q o p}(Z) (formalized in full, GX.preimage_ordY_comp_subset) and then concludes 'the latter is skeletal, thus so is the former', but a subset of a skeletal set is skeletal only if it is closed, and q(Y minus ord_p(Y)) need not be closed since q is not a closed map. Counterexample formalized: GX.not_isSkeletal_of_isBranchedCovering_comp (p the maximal covering of D_inf branched over {apex} and b_n = (1+e_n, n+e_n), e_n = 1/(|n|+2); q : D_inf -> D; q o p IS a branched covering, but q(branching locus) = {(1+e)exp(2 pi i e)} (plus possibly 0) accumulates at 1 and misses it, so it is not closed). The true statement: (i) <=> the CLOSURE of q(Y minus ord_p(Y)) is skeletal.", "(ii) => (i), l.1137: '(q o p)|X1 -> Z1 is a composition of covering hence a covering' uses that a composite of coverings is a covering, which is false in general (GX.Topology.UniversalCover SCOPE 2). The proof is completed under either standard hypothesis: q of finite fibres (GX.isBranchedCovering_comp_of_finite) or Z1 semilocally simply connected (GX.isBranchedCovering_comp_of_semilocallySimplyConnected); GX.isBranchedCovering_comp_of_isCoveringMap isolates the step. Whether the statement fails without such a hypothesis is not formalized.", "l.1116: 'An argumentation alike the one of Lemma lem:spread_partial_covering yields a contradiction' is replaced by a direct clopen argument (GX.subset_of_injOn_image_subset: two images p(U_i), p(U_j) meeting are equal, Y Hausdorff, q open and injective on each, U connected)."]

