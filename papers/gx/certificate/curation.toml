notes = "WP-25c, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: The paper's 'completion of spread is a functor from Spread to itself' needs a locally connected base for the space of ends to be a spread; the functor is formalized on the full subcategory LocallyConnectedSpace Y ∧ T2Space Y ∧ T0Space X (the §3 standing assumptions imply it). Is that the intended domain?"
paper_findings = ["l.915 existence is false as written: the inclusion of ℂ ∖ {1/(n+1)} into ℂ is a spread (Hausdorff, second countable, locally path-connected source, GX.locPathConnectedSpace_compl_countable) with NO completion in the paper's sense (GX.not_exists_isSpreadCompletion_foxSeq; in every universe: GX.not_isSpreadCompletion_foxSeq, and in general GX.not_isSpreadCompletion_of_not_isOpen): by uniqueness every completion is id_ℂ, and the image ℂ ∖ {1/(n+1)} is not open (0 is a limit of removed points). What is true: Fox's completion (space of ends) always exists with a dense, locally-connected-in image (Fox's own notion; IsFoxCompletion), and it is a completion in the paper's sense iff that image is open (GX.exists_isSpreadCompletion_iff) — e.g. when p lands in an open subset of its ordinary locus (the completion of a covering of a portly subset, the case l.1147/l.1170/l.1439 use).", "l.915 uniqueness holds, in the strong form: any two completions (even in Fox's sense) are isomorphic by a UNIQUE homeomorphism over Y and under X (GX.IsFoxCompletion.existsUnique_homeomorph).", "l.915 'fully faithful' is false (as the 2021 draft): the completion functor is faithful but not full (GX.not_full_foxCompletionFunctor: ℂ∖{0} and ℂ∖{1} both complete to ℂ, and the identity between the completions extends no morphism ℂ∖{0} → ℂ∖{1}; also GX.completion_not_full for the paper's completions id_ℂ). What l.1170 and l.1439 actually use is true and proved: every spread morphism (f, g) extends uniquely and continuously to the completions (GX.SpreadEnd.map, GX.SpreadEnd.eq_map), functorially (map_id, map_comp), and the extension determines g (map_injective); the same holds between ARBITRARY completions (Fox's or the paper's), as l.1170/l.1439 use it (GX.IsFoxCompletion.existsUnique_extend: a unique continuous ḡ with p₂'∘ḡ = f∘p₁' and ḡ∘ι₁ = ι₂∘g).", "Local path-connectedness of the completion (needed for 'completion is a functor from Spread to itself' under the §3 standing assumptions, and used by lem:complete_path_carac l.1033 via lem:path_covering on the completion) is proved: GX.SpreadEnd.locPathConnectedSpace (paths to an end are infinite concatenations through e(W_n), W_n a decreasing basis at the base)."]

