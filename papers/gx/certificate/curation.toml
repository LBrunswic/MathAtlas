notes = "WP-35g, audited clean. Partial: paper statement corrected (DEC-27) Readings/questions: Is 'M̃ → M Galoisian' meant to be part of 'virtually tamely singular' (e.g. via locally Galoisian), or should the remark carry it? And does 'isomorphic' mean as singular (G,X)-manifolds (needs prop:aeGXquotient's structure on Γ\\D(N))? | Twin of rem:tamely_singular_manifold_admits (l.1869), for which DEC-71 ruled 'N Galoisian'. Does DEC-71 extend to l.2154? Note: the proved form needs Γ(M̃/M) transitive on fibres (or reg M slsc in M); 'N → M Galoisian' alone would additionally need the deck transformations of N to be continuous for the quotient of T (a lift of Γ(N/M) to Γ(M̃/M), not built)."
paper_findings = ["l.2154: the remark's identification uses that the fibres of N → M are Γ(N/M)-orbits; this follows (descend_mem_deckMapsOf, quotient_virtually_tame_cover) from injectivity of D when M̃ → M is Galoisian, which the remark does not state. The previous round's claim that the remark is false for non-Galoisian N is WITHDRAWN (no counterexample; for an injective developing map every γ ∈ Γ(M̃/M) descends). Recorded as a narrowing."]
