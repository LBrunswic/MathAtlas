paper_findings = ["RamcovGX.tex:1455-1457: 'X is semi-locally simply connected iff it is semi-locally simply connected in itself' holds only in the direction slsc ⇒ slsc in itself (GX.isSLSCIn_univ_of_semilocallySimplyConnected). The converse is false: the harmonic archipelago (a Peano continuum in ℝ³, locally contractible off its base point) has every loop at the base point homotopic to loops in arbitrarily small neighbourhoods, so it is slsc in itself in the sense of def:semi_locally_simple_connectedness, but π₁ ≠ 1 and it is not semi-locally simply connected. 'Almost trivial' differs from 'trivial' exactly for spaces which are not homotopically Hausdorff. The counterexample is not formalized.", "Counterexample not formalized (DEC-27): the harmonic archipelago is not built in Lean; the master session may schedule it or ask the author for a waiver."]

