[[row]]
label = "rem:ordinary_locii_open_but"
decls = ["GX.ordinary_locii_open_but", "GX.isOpen_ordY", "GX.isOpen_ordX", "GX.isCoveringMap_restrict_ordX", "GX.surjective_restrict_ordX", "GX.isCoveringMap_surjective_restrict_ordX", "GX.isCoveringMap_restrict_ordX_connected_iff", "GX.not_isPreconnected_ordY_nFold", "GX.not_isPreconnected_ordX_nFold", "GX.not_isPreconnected_ordX_abs", "GX.abs_ordX_not_isPreconnected_covering"]
extra_lean_files = ["GX/Spread/Basic.lean"]
bucket = "A"
notes = "WP-25a, audited clean. Readings/questions: Does 'covering' in rem:ordinary_locii_open_but (l.844) include a connected total space? If yes, the remark is exactly GX.isCoveringMap_restrict_ordX_connected_iff. If no (DEC-40 as written), the restriction is always a covering and the sentence could read 'the restriction ord(X) → ord(Y) is a covering; it is connected iff ord(X) is'. The row is kept closed because the unconditional statement is stronger than the positive reading; the master may mark it partial until the author answers."
paper_findings = ["Under DEC-40 the restriction ord(X) → ord(Y) is ALWAYS a surjective covering map over a locally connected source (GX.isCoveringMap_surjective_restrict_ordX), connected or not. This proves the positive reading of 'the only obstruction ... is the connectedness of ord(X)' (connected ord(X) ⇒ covering) in a stronger form. The negative reading (a disconnected ord(X) prevents a covering) is FALSE under DEC-40: GX.abs_ordX_not_isPreconnected_covering (x ↦ |x|, ord(X) = ℝ ∖ 0 disconnected, restriction still a surjective covering map). GX.isCoveringMap_restrict_ordX_connected_iff only restates the remark for a connected total space; its docstring now says so."]

