[[row]]
label = "cex:portlyness"
decls = ["GX.notMem_ordX_of_notMem_interior", "GX.not_injOn_of_notMem_interior", "GX.cex_portlyness_fst", "GX.fstLineHomeo", "GX.zero_notMem_interior_fstLine", "GX.cex_portlyness_paper", "GX.PortlySpace", "GX.portlyTop", "GX.isSpread_portlyι", "GX.le_portlyTop_of_isSpread", "GX.isSpread_portlyP", "GX.exists_isPathConnected_subset", "GX.nonempty_inner_homeomorph_sigma", "GX.isLocallyConnectedIn_portlyX₁", "GX.not_dense_portlyX₁", "GX.not_isPortly_portlyX₁", "GX.portlyHomeo", "GX.ordY_portlyP", "GX.ordX_portlyP", "GX.ordY_portlyInv_eq_empty", "GX.ordX_portlyInv_eq_empty", "GX.cex_portlyness"]
extra_lean_files = ["GX/Spread/Basic.lean"]
bucket = "A"
notes = "WP-25a, audited clean."
paper_findings = ["Item 2 is proved as written for the paper's own space, with every listed property (GX.cex_portlyness_paper): the topology generated by the subspace components of X ∩ U (GX.portlyTop) makes the injection a spread (GX.isSpread_portlyι) and is the coarsest such topology (GX.le_portlyTop_of_isSpread: every topology making the injection a spread is finer), so the paper's 'coarsest topology' exists and is this one; X is Hausdorff, second countable, locally path-connected; the inner rays are homeomorphic to ∐_ℕ (0,1); p is a spread; X₁ = Y₁ open, X₁ locally connected in X (GX.IsLocallyConnectedIn), X₁ → Y₁ a homeomorphism; ord(Y) = ord(X) = ∅. Since LocallyConnectedSpace and T2Space hold, the example refutes the density-free form of the Lean lem:spread_partial_covering exactly as the paper intends.", "The read-only audit's suggested route (subspace components of X ∩ U are portlyTop-connected) is FALSE for this X: for U = ℝ² ∖ {μu} (u a rational unit vector, 0 < μ < 1) the segment (0,μ)u lies in the subspace closure of the rest of X ∩ U, so X ∩ U is subspace-connected, but the segment is clopen for portlyTop. The proofs avoid this: local path-connectedness from explicit bases (Euclidean balls off the disc, ray segments, truncated cones GX.portlyCone at circle points), then 'spread' from local connectedness. The counterexample to the audit's route is recorded in SCOPE as prose, not formalized.", "Item 1 now has a cheap inhabitant (GX.cex_portlyness_fst): p = Prod.fst : ℝ² → ℝ, X₁ = ℝ × {0} (not open), Y₁ = ℝ; X₁ → Y₁ a homeomorphism (surjective covering map) and (0,0) ∉ ord(X), 0 ∉ ord(Y)."]

