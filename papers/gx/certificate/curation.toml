notes = "WP-26h, audited clean. Partial: tagged sorry: Antoine's theorem (cited general_antoine) is not built: (1) the construction in S³ of nested chains of linked solid tori with diameters → 0 and a homeomorphism of their intersection with cantorSet; (2) the π₁ computation that a meridian of a link L is essential in S³ ∖ (C ∩ L) (no meridian disc of L misses C ∩ L; needs van Kampen and the linking of the chain — mathlib has neither π₁ of link complements nor van Kampen); (3) accessibility of each x ∈ C by an arc meeting C only at x; (4) wildness (a Cantor set in a great circle up to homeomorphism has simply connected complement). Used by GX.exists_wild_cantor_not_isSLSCIn.; existence of a wild Cantor set in S³ with simply connected complement (Kirkor 1958, Skora 1986: explicit construction plus a limit van Kampen argument for π₁ = 1, wildness via Bing's 1-ULC criterion) and the local non-separation of a closed 0-dimensional set in a 3-manifold (dimension theory / Alexander duality); none in mathlib. Used by GX.wild_cantor_claim_false. Readings/questions: l.1578: is 'a wild Cantor [general_antoine]' meant to be Antoine's / Blankinship's necklaces (the cited class)? For arbitrary wild Cantor sets the claim is false (wild Cantor sets with simply connected complement). Proposed correction: 'If S is an Antoine (or Blankinship) necklace in S^3'."
paper_findings = ["l.1578 is FALSE for an arbitrary wild Cantor set: wild Cantor sets in S^3 with simply connected complement exist (Kirkor, Fund. Math. 1958; Skora, Topology Appl. 24 (1986) 181-188; Garity-Repovs-Zeljko, Proc. AMS 134 (2006)), and for any C with dense, simply connected, locally non-separating complement, S^3 minus C IS semi-locally simply connected in S^3 (GX.isSLSCIn_compl_of_simplyConnected, proved: cut short end arcs off a loop of Omega(x,x,C^c), join their ends inside a small neighbourhood off C, conclude by simple connectivity). Density of the complement of any Cantor set of S³ is proved (GX.dense_compl_of_isCantorSubset). The refutation GX.wild_cantor_claim_false is unconditional modulo the cited existence GX.kirkor_wild_cantor_exists (tagged sorry). Holds in both the homotopy and the literal compact-open reading of 'almost trivial'.", "Corrected statement, for the cited class: Antoine's necklace is a wild Cantor set whose complement is not semi-locally simply connected in S³ (GX.exists_wild_cantor_not_isSLSCIn). It is REDUCED to Antoine's theorem, stated precisely as GX.antoine_necklace_essential (tagged sorry), not proved: the reduction (the essential-loop criterion GX.wild_cantor_not_isSLSCIn and its S³ form GX.sphere3_not_isSLSCIn_of_essential, with the small-loop triviality proved by radial contraction of a spherical cap) is proved. Note the loop to use at x ∈ C is a meridian of a SIBLING link (not containing x), essential in the complement of that sibling's sub-necklace; a meridian of a link containing x does not work, since removing any piece around x makes the enclosing meridians inessential."]
