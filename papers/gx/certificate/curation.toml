paper_findings = ["RamcovGX.tex:1551-1553: the statement omits 'Y ∖ S semi-locally simply connected', the hypothesis of prop:universality under which the maximal covering Ỹ^S exists. Carried under DEC-70 (the row closes); the omission stays recorded. 'Y ∖ S semi-locally simply connected in Y' does not imply it, now formally: GX.harmonicArchipelago_compl_empty (Y = GX.HarmonicArchipelago: connected, LPC, T2, first countable; S = ∅ skeletal; Y ∖ S slsc in Y in both forms; Y ∖ S not semi-locally simply connected).", "RamcovGX.tex:1548: 'a direct consequence of Propositions prop:Galoisian_semilocal and prop:universality' silently drops second countability, which prop:Galoisian_semilocal assumes. The theorem holds without it: (ii) ⇒ (i) of prop:Galoisian_semilocal does not use countability (discrete fibres + dense orbits give transitivity, GX.maxBranched_isGaloisian). The second and third assertions need an argument the paper does not give: H is the automorphism group of the universal map Φ : Ỹ^S → X, which acts transitively on the Φ-fibres because they are discrete (subsets of the discrete fibres of Ỹ^S) and its orbits are dense (Φ is quasi-Galoisian through the ordinary part); normality ⇔ X Galoisian uses the uniqueness of maps over Y agreeing at one ordinary point (GX.eq_of_comp_eq_of_mem_portly). The normality equivalence is proved for every H with H\\\\Ỹ^S ≃ X over Y."]

