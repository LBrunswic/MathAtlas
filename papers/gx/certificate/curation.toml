notes = "WP-35f, audited clean. Partial: tagged sorry: piece (2) for the NON-descending charts only (IsDescendingChartMap fails: V̂ → V does not dominate Û → U, so r : Ṽ → V̂ is not an isomorphism). For every descending chart it is built and proved with ℓ arbitrary (GX.descTop, GX.isLocalTamifying_descTop, GX.nhds_descTop_le_of_aut, 0 sorry), so the ℓ-quotient is not the obstruction. MATHEMATICAL obstruction on the r side: for a non-descending chart the paper's T_{U,V,φ} is the ℓ-quotient of r^*T_α, and its (D) (l.2128–2133) needs r⁻¹(R) portly for r^*T_α, i.e. lem:spread_top (c) for r, false in general (WP-27k GX.not_spreadTopConnCE on GX.cex_spread_top_sector) and equivalent to GX.StrongLocallyConnectedOrd, not known to follow from 'T_α tamifying, Aut-continuous, X_α locally Galoisian'. Informal mechanism (not formalized): a local loop around the singular stratum dying in π₁(reg X_α) but not in π₁(reg V), at a singular point of infinite local deck group (at finite local degree (A)+(C) force T_α natural), e.g. two crossing singular planes in dimension 4. The case would also need the maximal covering Ṽ of V̂ and r^*T_α on it (infrastructure, not built since its (D) fails in general). No counterexample to the theorem is known. sorryAx reaches only exists_isLocalTamifying_charts, isVirtuallyTame_of_isXAManifold, local_virt_tame (axiom sweep over all 202 declarations). Readings/questions: theo:local_virt_tame: the proved form adds 'every singular point is the centre of a chart descending from the maximal covering of its model' (GX.IsDescendingChartMap, which covers r : Ṽ → V̂ an isomorphism with ℓ arbitrary). Does the author accept this as the ruled form (row closed under a ruling), or require the general statement, whose proof's (D) step rests on lem:spread_top (c) for r (false in general)? A possible model-side repair to rule on: assume of the models that T_α satisfies GX.StrongLocallyConnectedOrd for the sub-coverings r : Ṽ → V̂ of its connected open subsets (then the paper's construction goes through, but r^*T_α on Ṽ would still have to be built). | theo:local_virt_tame: the implication 'r : Ṽ → V̂ an isomorphism (a condition on the model alone) ⇒ IsDescendingChartMap' is informal here (prop:universality applied to Û → U read over V through φ). Formalizing it needs one missing lemma — a branched covering postcomposed with a homeomorphism of the base is a branched covering (only precomposition, IsBranchedCovering.comp_homeomorph, exists) — plus GX.maxBranched_universal and the Galoisianity of the maximal covering of V (local Galoisianity at V). Should a later package state the hypothesis model-side? | theo:local_virt_tame: is the intended content 'every X_A-manifold is virtually tame' (the (i) ⇒ (ii) direction being degenerate)?"
paper_findings = ["l.2128–2133 ((D) of the proof): 'r⁻¹(R) is strongly portly' is lem:spread_top (c) for r : Ṽ → V̂, which is false in general (WP-27k's sector counterexample, GX.cex_spread_top_sector) and equivalent to the local condition GX.StrongLocallyConnectedOrd; the tamifying hypotheses on T_α are not shown to give it. The proof is complete whenever r^*T_α is not needed, i.e. when V̂ → V dominates Û → U (in particular r an isomorphism, ℓ arbitrary): formalized, GX.isVirtuallyTame_of_descending, 0 sorry, with ALL the theorem's hypotheses including local Galoisianity. In general the theorem is neither proved nor refuted here.", "l.2096 ('consider the quotient topology on Û'): built, as the quotient of T_α by a descent V̂ → Û (GX.descTop, neighbourhoods GX.nhds_descTop); it does not depend on the descent (GX.descNhds_eq), which is the paper's 'does not depend on r, φ̃ or ℓ' (l.2097) for the descending charts.", "l.2101: the gluing ('the topology generated by … all X_A-charts') uses that T_{U,V,φ} restricts to T_{W,φ(W),φ|W} on p⁻¹(W) for W ⊆ U, which the paper neither states nor proves (only independence of (V,φ) for fixed U, l.2104–2107); proved for descending charts (GX.nhds_descTop_le_of_aut) and for liftable ones (GX.nhds_chartTop_le_of_aut), any open W, no connectedness needed.", "l.2025, l.2093: the Galoisianity of the sub-coverings M̃^S → N, Ũ → Û, Ṽ → V̂ is asserted without argument; WP-27k proves it (GX.isGaloisian_of_comp, SpreadTop) under reg U slsc in U; for the descents V̂ → Û used here it is GX.IsChartDescent.exists_deck (two descents taking the same value differ by a deck transformation of X̃_α), from the discreteness of the fibres of X̃_α → X_α (the model's local Galoisianity).", "l.2101–2103: under the printed def:atlas the gluing has a gap at singular points centring no chart (no counterexample known); DEC-67 (e) removes it, and the proved forms use only charts centred at singular points.", "l.1974: (i) ⇒ (ii) holds trivially — the hypothesis (a tamifying T_α) already makes each model virtually tame — and under DEC-67 (e) a model need not be an X_A-manifold; the equivalence is degenerate (GX.local_virt_tame, GX.local_virt_tame_descending, GX.local_virt_tame_liftable)."]

