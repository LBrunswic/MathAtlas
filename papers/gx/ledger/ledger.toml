# Ledger configuration for gx. Phase 0: ledger and label audit only; the Lean namespace is not built yet.
[paper]
root = "../legacy/labeled"
document = "RamcovGX.tex"
notation = []
files = [["RamcovGX.tex", "body", "P"]]
env_alias = { defi = "definition", thm = "theorem", prop = "proposition", lem = "lemma", cor = "corollary", rem = "remark" }
label_prefixes = ["thm", "theo", "lem", "prop", "cor", "def", "defi", "rem", "ex"]
coverage_recursive = false

[lean]
root = "../../../lean"
strict = ["GX"]
scaffold = ["scaffold/GXScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
