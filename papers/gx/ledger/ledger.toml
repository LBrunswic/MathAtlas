# Ledger configuration for gx. The snapshot is the accepted Geom. Dedicata version (2023-05-27),
# re-snapshotted 2026-10-31 over the 2021 draft (kept in ../legacy-2021). The Lean library is `GX`
# (strict) and `GXScaffold` (scaffold), in `lean-gx/` (`lean/` is the read-only submodule, OQ-1).
[paper]
root = "../legacy/labeled"
document = "RamcovGX.tex"
notation = []
files = [["RamcovGX.tex", "body", "P"]]
env_alias = { defi = "definition", thm = "theorem", prop = "proposition", lem = "lemma", cor = "corollary", rem = "remark", ex = "example", cex = "counterexample" }
label_prefixes = ["thm", "theo", "lem", "prop", "cor", "def", "defi", "rem", "ex", "cex"]
coverage_recursive = false

[lean]
root = "../../../lean-gx"
strict = ["GX"]
scaffold = ["scaffold/GXScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
