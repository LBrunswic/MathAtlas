# Ledger configuration for ers-predictability: F. C. Eperon, H. S. Reall, J. J. Sbierski,
# Predictability of subluminal and superluminal wave equations (arXiv 1802.03020 v2, Commun. Math.
# Phys. 2019), an EXTERNAL paper ledgered for the ETT programme (programme/roadmap.toml
# T-pkg-ers-predictability), as DEC-34 for Barbot. Its Lean home is `lean-causal/` (Causal /
# CausalScaffold), shared with papers/ett, papers/barbot and papers/sbierski-mghd; the labels carry
# ers-prefixed kinds (ersthm, erslem, ...) so that no other ledger rooted in lean-causal reads this
# one's docstring marks (kb/0024). Every statement carries its ers label first, ahead of the
# authors' own label, whose name it reuses.
[paper]
root = "../legacy/labeled"
document = "ghd_02_19.tex"
notation = []
files = [["ghd_02_19.tex", "body", "P"]]
env_alias = {}
label_prefixes = ["ersthm", "ersprop", "erslem", "erscor", "ersrem", "ersconj"]
coverage_recursive = false

[paper.titles]
P = "Predictability of subluminal and superluminal wave equations (one file)"

[lean]
root = "../../../lean-causal"
strict = ["Causal"]
scaffold = ["scaffold/CausalScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
