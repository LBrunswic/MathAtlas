# Binder of papers/ers-predictability (Eperon–Reall–Sbierski, "Predictability of subluminal and
# superluminal wave equations", arXiv 1802.03020): every row split into its ETT theorem (layer 1), its
# localisation properties (layer 2, programme/ladder.toml ids) and its geometric lemma per model class
# (layer 3). Format: tools/binder.py's docstring. Written by the programme-planner, 2026-11-20
# (T-bind-ers-predictability). It records how the argument factors, not what Lean has closed.
#
# How the paper factors (SYNTHESIS Q3; KB note eperon2018predictability). A GHD u : U → ℝ of a
# quasilinear equation on the FIXED background ℝ^{d+1} carries two causalities: C_g of g(u, du) and
# C_m of Minkowski. Sub-/superluminality is a NESTING of causalities (Causal.NestedCausalities):
# subluminal = CurveNestedOn C_g C_m (4.72); (4.62) = InextensibleNestedOn Cτ C_g for the causality Cτ
# of the integral curves of T (4.70). The global arguments of §4 are causal-topological
# (T-abs-nested-causalities, done, readings in OQ-41); their analytic inputs are local uniqueness
# (Prop 4.63), local existence (Thm 4.75) and the slice restart (Steps 3–5 of Thm 4.64), the same
# `local_uniqueness` and `cauchy_slice` as Sbierski's CBG (papers/sbierski-mghd), but WITHOUT A3: on a
# fixed background the identity identifies the slice in both developments, and the extension of u₁
# across a boundary point is false in general.
#
# Models. `quasilinear` is the paper's class (smooth g(u, du) on open subsets of ℝ^{d+1}): nothing of
# it is in Lean (T-pkg-smooth-lorentz asks how smooth Lorentzian metrics enter). The Born–Infeld
# scalar of §3 is a quasilinear model whose solutions are causally flat: (U, g) is the transport of
# 1+1 Minkowski (V, m̂) by the hodograph map Ψ (Lemmas 3.27, 3.31). `minkowski` is the background m,
# in Lean (Causal.minkowski_*).
#
# Findings of this binder (reported to the master):
# * The layer-1 skeletons of 4.70, 4.72, 4.77, 4.82 are in Lean (Causal.Causality.ers_*), each with
#   its layer-3 inputs as named hypotheses; Thm 4.64 itself (the fixed-background global uniqueness
#   on a connected overlap, used by 4.68, 4.69, 4.71, 4.73, 4.75, 4.80) is NOT: only its Step 2
#   (exists_spacelike_boundary_point) is, and Steps 3–5 + Prop 4.63 are 4.82's `hstep`.
#   T-abs-ers-thm-4-64.
# * The nesting nodes are what OQ-41 (b) asks about: InextensibleNestedOn is not implied by
#   ≤-nesting (cutLine 1) and holds on M from `no_causal_endpoint` (J^±(x) ≠ {x}) + GH + tarentin +
#   causal arc-connectedness (GloballyHyperbolic.inextensibleNestedOn_top). Rows 4.70, 4.71, 4.77
#   depend on that ruling (T-lad-nested-inextensible, blocked on OQ-41).
# * ERS §3's non-uniqueness (Thm 3.45) is, causally, two flat 1+1 developments whose developing maps
#   Ψ_a, Ψ_b overlap on a disconnected set — the fixed-background failure of the Einstein gluing
#   (§4.2; Sbierski Cor 3.2 needs U₁ ∩ U₂ connected). T-abs-ers-etale-mghd states it.
# * Rows not bound: Remarks 3.55 and 3.57 (observations, no argument), Remark 3.58 (modification of
#   the principal symbol outside the solution's range: PDE, no causal content), Conjecture 4.81 (open
#   by nature, nothing to factor).

