# nodes of sort `pair`): subluminal = CurveNestedOn C_g C_m (`curve_nested`, 4.72); (4.62) =
# InextensibleNestedOn Cτ C_g for the causality Cτ of the integral curves of T (`inextensible_nested`,
# 4.70; the nesting of record, DEC-161 (b), a node since T-lad-nested-inextensible, 7b16a43). The global
