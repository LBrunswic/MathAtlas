edge_note = "(4.83) enters through its topological content Causal.Causality.OneSidedBoundary U₁ (closure S) (`honesided`), an edge hypothesis only and no node (DEC-166 (b)), named in the `under` of the ladder's consequence ERS Thm 4.82 at is_causal (witness ers_theorem_4_82_of_oneSidedBoundary; T-lad-one-sided-node, 0ea179a). At the quasilinear model Lemma 4.86 supplies it in Lean from curve_nested and a Cauchy slice: Causal.ers_theorem_4_82_of_slopeCone (T-loc-quasilinear-one-sided). `hstep` is SliceRestart definitionally (ers_theorem_4_82_of_sliceRestart), an edge hypothesis (DEC-162), and contains Prop 4.63 (local_uniqueness). The three are the ladder's [[edge_hypothesis]] ids (programme/ladder.toml, T-lad-edge-hypotheses, 1b8e26a1), cited by id since T-bind-edge-hypotheses (2026-11-27); the quasilinear entry proves one_sided_boundary in Lean (Causal.ers_lemma_4_86_oneSidedBoundary) and slice_restart, local_uniqueness by T-loc-quasilinear-slice. OQ-41 (e), DEC-161: ∂S read as closure(S) ∖ S. The solution form (Causal/Ers482Solution.lean, T-abs-ers-4-82-solution-form, 24dc97f9; rebound 2026-11-28, T-bind-ers-4-82-solution) keeps the ids. Its slice_restart is Causal.Causality.SliceRestart (cau u₂) U₂ S A U₂ Q with the geometric Q = Causal.GluedRestartAt (an open O in each one-sided neighbourhood V ⊆ U₂ of p, not inside U₁, with S a Cauchy surface of U₁ ∪ O for the glued solution Causal.glueSolutions U₁ u₁ u₂), not 'a strictly larger development'; in the uniform forms it is asked of every pair of developments (U₀, u₀), (U₂, u₂) and names no maximal development. one_sided_boundary is unchanged. frontier_stays_in and local_uniqueness enter only through the two forms that derive Remark 4.67's variation (ers_theorem_4_82_solution_of_ers_theorem_4_64, _secondCountable: Thm 4.64's hstay and hlocal for the pair (U₁, A)); the uniform forms and the restart step take neither, the agreement on A being named (hagree), and the 4.82 restart is located in all of U₂. The quasilinear entry proves frontier_stays_in by T-loc-quasilinear-frontier; T-loc-quasilinear-slice states the restart in the GluedRestartAt shape too (Steps 3–4 in U₂, DΣ_V, U₁ ∪ DΣ_V Cauchy for g(u₃)) and supplies SolutionRestricts at the model (u₂ solves on DΣ_V ⊆ U₂), a PDE fact named as DEC-162 has them."
note = "Thm 4.82 (ghd_02_19.tex:1100, proof 1114–1139). The component A of U₁ ∩ U₂ through S has boundary points in U₂ on ∂U₁ (4.84); a spacelike one (4.85) without null geodesics; one-sidedness puts a neighbourhood's trace on U₁ inside A; the restart extends the MGHD: contradiction. With each development GH and tarentin (ladder nodes read on dom i), hcaus, hJm, hJp are derived (ers_theorem_4_82_of_globallyHyperbolicOn). In DEC-162's reading (u₁ an MGHD and u a GHD, each read 'S Cauchy in dom i'), ers_theorem_4_82_of_isCauchySurfaceOn_secondCountable (Causal.Ers464SecondCountable, a restatement) trades hsplit for S Cauchy in each dom i on a T2, second countable background (rebound 2026-11-23, T-bind-curves-ers-4-64). Witnesses (Causal.ErsWitnesses, T-abs-ers-witnesses, 913bbbf2): Causal.timelikeLine_ers_theorem_4_82 and its _of_oneSidedBoundary, _of_sliceRestart, _of_globallyHyperbolicOn and _of_isCauchySurfaceOn_secondCountable forms; they never exercise hstep, which given the rest is equivalent to the conclusion (Causal.Causality.ers_theorem_4_82_hstep_iff). Over a solution predicate (Causal/Ers482Solution.lean, T-abs-ers-4-82-solution-form, 24dc97f9; rebound 2026-11-28, T-bind-ers-4-82-solution), as Thms 4.79 and 4.80: sol with SolutionLocal, SolutionsGlue and the new SolutionRestricts (CausalityFollows not used: the restart names the glued solution's causality itself). Forms of record (the closer's and the auditor's, a reading for the master's OQ row): the uniform forms Causal.ers_theorem_4_82_solution_of_restarts (globally_hyperbolic, tarentin) and _of_restarts_isCausal (is_causal), whose restart is asked of every pair of developments and names no maximal development, and the restart step at any development Causal.ers_theorem_4_82_restart. The restart step glues u₁ on U₁ and u₂ on O (Causal.glueSolutions), well defined because V ∩ U₁ ⊆ A, where u₁ = u₂: Remark 4.67's variation, named (hagree) or derived from Thm 4.64 for (U₁, A); the glued function solves by SolutionLocal, SolutionsGlue and SolutionRestricts. Witness Causal.Ers482Witness: the restart step exercised at the non-maximal ]-1/2, 1/2[ in ]-1, 1[ (p = ±1/2; timelikeLine_ers_theorem_4_82_restart, restart_exercised) and the uniform restart proved at every pair of developments (restarts82). The paper's shape, Causal.ers_theorem_4_82_solution (with _unique, _of_globallyHyperbolicOn, _of_ers_theorem_4_64, _secondCountable): (U₁, u₁) maximal in ERS's l. 117 sense (Causal.IsMaximalDevelopment, identified with l. 1094 by ERS at :1094), every development contained and agreeing. At the maximal U₁ its fixed-U₁ hstep is equivalent to the conclusion given the rest (Causal.ers_theorem_4_82_solution_hstep_iff), necessarily. The uniform forms are its specialisation at U₀ = U₁, so logically weaker as theorems. The uniform restart is not implied by the conclusion and the other hypotheses of the uniform forms, in Lean (T-abs-ers-4-82-restart-separation, bdc22114): Causal.Ers482Separation.restart_separation, on the line with S = {0}, sol82 and a solution-dependent causality (the timelike line at id and at the markers, the spacelike line elsewhere), proves the sixteen other hypotheses of _of_restarts and _of_restarts_isCausal, their conclusion and ¬ hrestart at one datum; hrestart fails at the non-maximal pair (]-1/2, 1/10[, ]-1/5, 1/5[), p = 1/10 (Causal.Ers482Separation.not_gluedRestartAt_pair). The model lacks CausalityFollows (Causal.Ers482Separation.not_causalityFollows_cauSep), which the forms do not assume; with it, on the line with S = {0}, the gap is argued to close, not proved. Whether the uniform forms should assume CausalityFollows is OQ-157 (OPEN, extending OQ-156); nothing here depends on its answer. The paper's shape ers_theorem_4_82_solution applies to the model (Causal.Ers482Separation.cauSep_ers_theorem_4_82_solution). The separation is evidence about the forms, not a form of the statement, so it is not in `ett`. The original skeleton over dom, cau (the Causal.Causality.ers_theorem_4_82 forms above) stays, a sibling."
