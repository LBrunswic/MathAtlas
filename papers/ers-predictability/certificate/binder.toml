note = "Thm 3.45 (ghd_02_19.tex:560, proof 564–724). Layer 4 (classification): two GHDs of one datum with a disconnected overlap on which they differ — the criterion separating 4.70 (superluminal: inextensible nesting of Cτ) and 4.72 (m-GH) from the general subluminal case; subluminal nesting (curve_nested) alone gives neither connected overlaps nor global uniqueness. Causally: two flat 1+1 developments with overlapping developing maps (T-abs-ers-etale-mghd). Rebound 2026-11-28 (T-bind-ers-etale-gluing): the topological half of T-abs-ers-etale-mghd is in Lean, as T-abs-ers-etale-gluing (Causal.EtaleGluing, 5dbd01bf). Glue U_a and U_b along an open A on which Φ_a = Φ_b. The result E projects onto U_a ∪ U_b by an étale map π (Causal.EtaleGluing.isLocalHomeomorph_proj). π is injective iff U_a ∩ U_b ⊆ A (Causal.EtaleGluing.injective_proj_iff). On a Hausdorff background with A open, E is Hausdorff iff A is closed in U_a ∩ U_b (Causal.EtaleGluing.t2Space_iff, t2Space_iff_isClosed). So E is Hausdorff when A is a connected component of U_a ∩ U_b in a locally connected background (Causal.EtaleGluing.t2Space_connectedComponentIn). Thm 3.45's conclusion says exactly that the glued solution fails to descend to the background (Causal.EtaleGluing.exists_glue_eq_comp_proj_iff): the point x with Φ_a(x) ≠ Φ_b(x) lies outside A and is covered twice (Causal.EtaleGluing.not_injective_and_not_descends). Injectivity and agreement are kept apart. π injective gives Φ_a = Φ_b on U_a ∩ U_b, but the converse fails as topology (Causal.EtaleGluing.punctured_witness, whose A is a component chosen by hand). Whether two GHDs can agree on all of a disconnected overlap is open, and T-abs-ers-etale-mghd is to report on it. The causal half, the lifted S a Cauchy surface of E, stays with T-abs-ers-etale-mghd. `ett` is unchanged: the row's statement, the existence of two Born–Infeld GHDs, is layer 3."
