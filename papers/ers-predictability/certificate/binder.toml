# Binder of papers/ers-predictability (Eperon–Reall–Sbierski, "Predictability of subluminal and
# superluminal wave equations", arXiv 1802.03020): every row split into its ETT theorem (layer 1), its
# localisation properties (layer 2, programme/ladder.toml ids) and its geometric lemma per model class
# (layer 3). Format: tools/binder.py's docstring. Written by the programme-planner, 2026-11-20
# (T-bind-ers-predictability); rebound 2026-11-21 (planning run after the waves of 2026-11-20 21:35,
# 22:45, 23:50) to Causal.ErsUniqueness, Causal.CausalIsoInvariance, Causal.LadderLocal and the
# ladder's pair-sort nodes; notes refreshed later that day after T-abs-hoist-time-function (7eff58c),
# and again after T-abs-nested-converse (8044439) and T-abs-nested-transfer (f868749): Remark 4.74 bound
# to CurveNestedOn.trans, notes of 3.29 and 4.72. It records how the argument factors, not what Lean
# has closed.
#
# How the paper factors (SYNTHESIS Q3; KB note eperon2018predictability). A GHD u : U → ℝ of a
# quasilinear equation on the FIXED background ℝ^{d+1} carries two causalities: C_g of g(u, du) and
# C_m of Minkowski. Sub-/superluminality is a NESTING of causalities (Causal.NestedCausalities; ladder
# nodes `le_nested`, `curve_nested` of sort `pair` since T-lad-nested-nodes, c02c8c8): subluminal =
# CurveNestedOn C_g C_m (4.72); (4.62) = InextensibleNestedOn Cτ C_g for the causality Cτ of the
# integral curves of T (4.70). The global arguments of §4 are causal-topological
# (T-abs-nested-causalities, T-abs-ers-thm-4-64, done); their analytic inputs are named hypotheses:
#   `hlocal`  Prop 4.63's Step-1 use: some common development exists (proposed id local_uniqueness)
#   `hstay`   Thm 4.64 Step 2's "γ([0,1]) ⊆ U₂" (Causal.Causality.FrontierStaysIn; proposed id frontier_stays_in)
#   `hstep`   Steps 3–5 + Prop 4.63, the slice restart (Causal.Causality.SliceRestart; proposed id
#             slice_restart), which is ers_theorem_4_82's `hstep` definitionally
#   GH, tarentin of each development, read on the open set (GloballyHyperbolicOn, TarentinOn), and the
#   Cauchy facts SplitBy, CompactSlabs, IsAcausalOn, InextensibleThrough, FollowsSolution — the
#   quasilinear model's causal ladder (T-loc-quasilinear-causal-ladder).
# The restart is NOT the ladder node `cauchy_slice` (the A4 field of a CBG local model,
# Causal.CBG.LocalModel.SliceFuture): on a fixed background there is no A3 and no geometry, and the
# layer-1 theorems consume SliceRestart. The 2026-11-20 binder had proposed `cauchy_slice` for it; it
# is replaced by `slice_restart` (not a node: OQ-57 (b), T-lad-ers-restart-nodes).
#
# Readings. As taken in OQ-41 (S acausal; two-sided domains; ∂S = closure(S) ∖ S) and in OQ-57 (one
# causality in Thm 4.64; FrontierStaysIn apart from the restart; common developments with S Cauchy,
# GH not concluded; 3.29's "stably causal" as IsCausal from a function strictly increasing along ≤).
# OQ-57 names the binder rows of §3–4 in its blocks column: the rows below are rebound with these
# readings and their curation waits on the ruling; OQ-57 (d) asks whether erslem:lemma_orientation
# should name the node `time_function` — it does not here until ruled.
#
# Models. `quasilinear` is the paper's class (smooth g(u, du) on open subsets of ℝ^{d+1}): nothing of
# it is in Lean (T-pkg-smooth-lorentz asks how smooth Lorentzian metrics enter). The Born–Infeld
# scalar of §3 is a quasilinear model whose solutions are causally flat: (U, g) is the transport of
# 1+1 Minkowski (V, m̂) by the hodograph map Ψ (Lemmas 3.27, 3.31), i.e. IsCausalIso C_m̂ C_g Ψ
# (Causal.CausalIsoInvariance). `minkowski` is the background m, in Lean (Causal.minkowski_*;
# Causal.minkowski_curvesExtend in Causal.Model.CurvesExtendModels since T-abs-hoist-time-function).
#
# Findings of this binder (reported to the master):
# * Thm 4.64 with Rem 4.67, Cors 4.68, 4.69, 4.71, 4.73 are in Lean as skeletons (Causal.ErsUniqueness,
#   nothing marked, OQ-57), and §3's causal transport (Lemmas 3.27, 3.29, 3.31, 3.39) is
#   Causal.CausalIsoInvariance. What stays open is layer 3 and three non-node hypotheses:
#   local_uniqueness, slice_restart, frontier_stays_in (the last owned by T-loc-quasilinear-frontier,
#   blocked on OQ-57 (b)).
# * The nesting nodes are what OQ-41 (b) asks about: InextensibleNestedOn is not implied by
#   ≤-nesting (cutLine 1) and holds on M from Causal.Causality.NoCausalEndpoint (J^±(x) ≠ {x}, defined
#   in Causal.LadderLocal) + GH + tarentin + causal arc-connectedness
#   (GloballyHyperbolic.inextensibleNestedOn_top_of_noCausalEndpoint). Rows 4.70, 4.71, 4.77 depend on
#   that ruling (T-lad-nested-inextensible, blocked on OQ-41).
# * The two nestings meet in Lean since T-abs-nested-converse and T-abs-nested-transfer: curve nesting is
#   ≤-nesting when the narrower causality is causally arc-connected (CurveNestedOn.leNested_of_causallyArcConnected;
#   not without, the pointed line), curve nesting is transitive (CurveNestedOn.trans: Remark 4.74), and a
#   ≤-nesting carries is_causal, strong causality (both forms) and a time function to the narrower
#   causality, tarentin to the wider only (the spacelike line, the first GH model that is not tarentin).
#   So where C_g is causally arc-connected, the ladder's [[transfer]] entries along le_nested apply to
#   subluminality, which the quasilinear layer-3 targets can use.
# * (4.83)'s topological content is Causal.Causality.OneSidedBoundary (Causal.LadderLocal), consumed by
#   ers_theorem_4_82_of_oneSidedBoundary; its node waits on OQ-52 (b) (it involves no causality:
#   T-lad-one-sided-node).
# * ERS §3's non-uniqueness (Thm 3.45) is, causally, two flat 1+1 developments whose developing maps
#   Ψ_a, Ψ_b overlap on a disconnected set — the fixed-background failure of the Einstein gluing
#   (§4.2; Sbierski Cor 3.2 needs U₁ ∩ U₂ connected). T-abs-ers-etale-mghd states it.
# * Rows not bound: Remarks 3.55 and 3.57 (observations, no argument), Remark 3.58 (modification of
#   the principal symbol outside the solution's range: PDE, no causal content), Conjecture 4.81 (open
#   by nature, nothing to factor).

