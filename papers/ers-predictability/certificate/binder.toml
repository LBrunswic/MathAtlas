edge_note = "Its output (4.83) is one_sided_boundary, Causal.Causality.OneSidedBoundary U₁ (closure S), an edge hypothesis only and no node (DEC-166 (b)), the ladder's [[edge_hypothesis]] of that id (programme/ladder.toml, T-lad-edge-hypotheses, 1b8e26a1), cited by id since T-bind-edge-hypotheses (2026-11-27). The layer-3 proof is in Lean, so the quasilinear entry proves it: Causal.ers_lemma_4_86_oneSidedBoundary (and ers_lemma_4_86, the graph form), from curve_nested of the slope-δ cone and a Cauchy slice, readings disclosed (OQ-73, DEC-162), unmarked (T-loc-quasilinear-one-sided)."
note = "Lemma 4.86 (ghd_02_19.tex:1143, proof 1159–1169). A layer-3 lemma (coordinates of ℝ^{d+1}): if the cone of slope δ around ∂₀ is g-timelike ((4.87), read as the nesting curve_nested of the static slope-δ causality in C_g), a C_δ-past-inextensible curve from a point above the graph would miss S, so ∂U₁ is the graph of the continuous f⁺; it supplies (4.83) to 4.82 as the `honesided` of ers_theorem_4_82_of_oneSidedBoundary (Causal.ers_theorem_4_82_of_slopeCone). Its proof is causal once the narrow cone is a nested causality: T-loc-quasilinear-one-sided."
[[bind.geometric]]
