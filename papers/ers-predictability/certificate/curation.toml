# Authored. The curated fields of the ers-predictability ledger
# (tools/ledger_curate.py --paper papers/ers-predictability).
# Eperon, Reall, Sbierski, Predictability of subluminal and superluminal wave equations (arXiv
# 1802.03020 v2) is an EXTERNAL paper, ledgered for the ETT programme (programme/roadmap.toml
# T-pkg-ers-predictability, 2026-11-20), as DEC-34 for Barbot: read and formalized, never
# rewritten. Its Lean home is lean-causal/ (Causal, CausalScaffold). At wave 0 no row has a Lean
# anchor and none is marked. Its §4 is, in the programme's reading (references/sbierski/SYNTHESIS.md
# Q3), a set of statements about two nested causalities (the light cone of g(u, du) and that of the
# Minkowski metric, or a cone family containing both); the layer-1 target
# T-abs-nested-causalities states that skeleton, and the binder (certificate/binder.toml,
# T-bind-ers-predictability) maps each row onto it.
#
# Labels. Every statement environment carries an `ers<kind>:` label first (ersthm, ersprop, erslem,
# erscor, ersrem, ersconj), ahead of the authors' own label, whose name it reuses
# (`ThmUnique` -> `ersthm:ThmUnique`; a lemma whose first inner label is an equation's reuses that
# name); otherwise the slug is autolabel's. So no other ledger rooted in lean-causal reads this
# one's marks (kb/0024). The authors' \ref's resolve through the secondary labels.
#
# Natural-language status. The ledger reads a proof environment that directly follows a statement.
# Four rows argue in the sentence before them; the overrides record where (line numbers of
# legacy/labeled/ghd_02_19.tex). The conjecture ersconj:ConUni stays open by nature.

