paper_findings = ["ETT.tex:1990 the relation ∼ is not reflexive (p ∼ p only for p in the image of M1∧M2), so it is not an equivalence relation; the quotient is meant by the equivalence relation it generates, which is 'p = q or p ∼ q' when both maps are injective (Gluing.mk_eq_mk_iff). Suggest: 'the equivalence relation generated by …', or add 'p = q or'.", "ETT.tex:1953-1960 (prop:Cauchy_pgcd, not this package): condition (b) of ℰ asks φ_M only to be a 𝕄≥0-morphism, not injective nor a Cauchy embedding, so (M1∧M2, φ) ∈ ℰ does not by itself make M1∧M2 a common sub-extension. defi:ppcm needs φ injective: if φ is not, M1 → M1∨M2 is not injective (Gluing.injective_j₂_of_injective_ι₁: ι₁ injective and j₁ injective force j₂ injective)."]

[[row]]
label = "rem:non_separe_cas"
extra_lean_files = ["Causal/Pushout.lean"]
lean_proved_override = "partial"
decls = ["Causal.Gluing.nonSeparated_cases", "Causal.Gluing.BoundaryPair", "Causal.Gluing.t2Space_iff_frontier", "Causal.Gluing.t2Space_iff_Cdist_eq_empty", "Causal.Gluing.C", "Causal.Gluing.Cdist", "Causal.Gluing.graph", "Causal.Gluing.C_eq_closure", "Causal.Gluing.Cdist_eq", "Causal.Gluing.Cdist_subset_frontier", "Causal.Gluing.graph_subset_C", "Causal.Gluing.C_nonempty", "Causal.Gluing.t2Space_and_C_nonempty", "Causal.Gluing.t2Space_iff", "Causal.Gluing.disjoint_nhds_ι₁_ι₂_iff", "Causal.Gluing.LineTwoOrigins", "Causal.Gluing.lineTwoOrigins_mem_Cdist", "Causal.Gluing.lineTwoOrigins_not_t2Space"]
bucket = "B"
size = "S"
blocked_on = "OQ-14: the set C of rem:non_separe_cas"
notes = "No `sorry`. The trichotomy and 'only the last case obstructs' are proved; the last sentence is false for the literal C (which contains the graph) and proved for the pairs with distinct images (Gluing.Cdist). WP-4, audited."
paper_findings = ["ETT.tex:2011 C is defined as the pairs (p,q) ∈ M1×M2 with π(p), π(q) not separated. Two equal points are never separated, so C contains every (j₁(x), j₂(x)) (Gluing.graph_subset_C) and C ≠ ∅ as soon as N ≠ ∅, even when the quotient is Hausdorff (Gluing.t2Space_and_C_nonempty). The last sentence of rem:non_separe_cas ('it is the case C ≠ ∅') is therefore false as written, and so is prop:Cauchy_point_min's hypothesis 'C ≠ ∅' in its literal reading. Every use of C (lem:corresponding_K, cor:model_corresponding, prop:C_connexe 'C is closed', prop:Cauchy_point_min, proof of prop:ppcm_Cauchy at l.2320-2324) needs the pairs with DISTINCT non-separated images. Suggest: add 'distinct' (or π(p) ≠ π(q)) to the definition of C. With that reading (Gluing.Cdist) the remark is proved: Cdist = closure(graph) ∖ graph ⊆ ∂j₁(N) × ∂j₂(N), and the quotient is Hausdorff iff Cdist = ∅.", "The literal C is exactly the closure in M1×M2 of the graph {(j₁(x), j₂(x))} (Gluing.C_eq_closure, no separation axiom): this is the neighbourhood form of the sentence 'a sequence (a_n) with j₁(a_n) → p and j₂(a_n) → q exists because π(p) and π(q) are not separated' in the proof of lem:corresponding_K (l.2111). A cleaner statement of the whole remark: the gluing is Hausdorff iff M1, M2 are and the graph of f = j₂∘j₁⁻¹ is closed in M1×M2 (Gluing.t2Space_iff).", "The remark is a necessary condition only: a pair in ∂j₁(N)×∂j₂(N) need not be non-separated; 'only the last case obstructs' is proved as: for Hausdorff M1, M2 the quotient is Hausdorff iff every pair of ∂j₁(N)×∂j₂(N) has separated images (Gluing.t2Space_iff_frontier). The line with two origins (two copies of ℝ glued along ℝ∖{0}) is the example: (0,0) ∈ Cdist and the gluing is not Hausdorff."]

[[row]]
label = "prop:mesure_dieckmann_topo"
decls = ["Causal.Causality.mesure_dieckmann_topo_past", "Causal.Causality.mesure_dieckmann_topo_future", "Causal.Causality.exists_admissiblePast_of_local", "Causal.Causality.exists_admissibleFuture_of_local", "Causal.Causality.AdmissiblePastOn", "Causal.Causality.AdmissibleFutureOn"]
bucket = "A"
notes = "No `sorry`. Past and future, with the paper's hypotheses; strong causality carried unused, and `exists_admissible*_of_local` needs only Lindelöf and R1. WP-5, audited."
paper_findings = ["ETT.tex:1094: 'strongly causal' is not used by the proof (l.1103-1139); hypothesis (i) already provides causally convex neighbourhoods. It can be dropped from the statement.", "ETT.tex:1104: 'Since M is second countable' — only the Lindelöf property is used (a countable subcover of (U_p)).", "ETT.tex:1106-1107: 'normalised so that mu_n(U_n)=1' is not always possible: a measure admissible in the past on U_n may be the zero measure (when U_n contains no pair p <_{U_n} q, property 3 is vacuous). Weights 2^{-n-1}/(1+mu_n(U_n)), or simply dropping zero terms, repair it.", "ETT.tex:1110: 'Since each mu_n is a normalised regular Borel measure, mu is a regular Borel measure' is true but not immediate: outer regularity is not stable under the countable intersection of open sets the termwise argument would produce. It holds because the total mass is finite: inner regularity by closed sets passes to the sum (finite unions), and for a finite measure that gives outer regularity; this uses Hausdorff (R1). Proved as Causal.regular_sum.", "ETT.tex:1111-1113: the existence of n_0, q' with p in U_{n_0}, p <_{U_{n_0}} q', q' <= q is correct: take the first link of the chain given by cor:causalement_connexe_minimal that leaves p (Causal.transGen_exists_first_ne).", "Hypothesis (i) is necessary (admissiblePast_local_of_admissiblePast: U_p = M), so the proposition says that, under (ii), admissibility in the past is a local property for causally convex covers."]
