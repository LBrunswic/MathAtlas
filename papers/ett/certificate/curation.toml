# Authored. The curated fields of the ett ledger: which declarations carry each label, how far
# the rest is, and what formalizing found in the paper. `tools/ledger_curate.py --paper papers/ett`
# writes them into ledger/ledger.json and rebuilds the ledger; nothing here is computed.
#
# The Lean library is `Causal` (strict) and `CausalScaffold` (scaffold), in `lean-causal/`.
# A row is `closed` in the ledger when a strict module announces its label and compiles without
# `sorry`; the overrides below are there to say LESS than that default, never more.

