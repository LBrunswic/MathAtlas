notes = "DEC-22: compact ⇒ complete under T2, tarentin and causal (fewer than DEC-22 lists); not conversely, by ℝ × (ℕ →ᵇ ℝ), local but not locally compact. (WP-6, WP-6b, audited) Related, not anchors (the curve reading (b), superseded for completeness by DEC-21's order reading; in the strict Causal/ChainsCurves.lean since its graduation; moved out of decls by T-ett-curation-decls, 2026-11-20): Causal.Causality.Inextensible.not_forall_le_of_causallyCompact, Causal.Causality.Inextensible.not_forall_ge_of_causallyCompact, Causal.Causality.causallyCompleteCurves_of_causallyCompact, Causal.bump, Causal.bump_apply, Causal.bcfStatic_not_causallyCompact, Causal.not_causallyCompleteCurves_imp_causallyCompact, Causal.halfPlane_hypotheses, Causal.minkowski_causallyCompleteCurves'."
paper_findings = ["ETT.tex:357 'slightly weaker' asserts two things: (i) causally compact ⇒ causally complete, and (ii) not conversely. Half (ii) is CONFIRMED (not_causallyComplete_imp_causallyCompact): the fan, ℕ discrete with 0 below and 1 above every other event, is causal, T2, second countable, causally complete, and J(0,1) = ℕ is not compact. The fan is non-local (ofRelation).", "Half (i) is refuted only for NON-LOCAL causalities (not_causallyCompact_imp_causallyComplete): the bowtie, four discrete events a1,a2 < b1,b2 with the restrictions of a global order (ofRelation), is causal, T2, second countable, causally compact (finite diamonds), and {a1,a2} is bounded above with no least upper bound. The refutation rests on non-locality: on a discrete space an absolutely minimal causality has ≤ the diagonal (AbsolutelyMinimalOn.eq_of_discrete), hence is causally compact and causally complete (AbsolutelyMinimalOn.causallyCompact_of_discrete, …causallyComplete_of_discrete). Correction to the audit's wording: ≪ is then contained in the diagonal but need NOT be empty — diagonalCausality (≤ = ≪ = diagonal) is absolutely minimal with x ≪ x (diagonalCausality_absolutelyMinimalOn, diagonalCausality_lt). Compactness and completeness depend on ≤ only, so the conclusion stands.", "A LOCAL witness against (i), in prose only (not formalized: not cheap — it needs the induced causality on a subtype of ℝ², the comparability case analysis inside its diamonds for transitivity, absolute minimality via a subdivision along the two branches, and compactness of diamonds as images of segments; estimated several hundred lines). X = the two null lines |x| = |t| of 1+1 Minkowski space through the origin o, with x ≤_U y iff y is in the Minkowski causal future of x and the diamond {z ∈ X : x ≤ z ≤ y} — a segment, or two half-segments through o — lies in U. This is absolutely minimal (relations are generated along segments), causal, T2, second countable, and its diamonds are compact. X minus o is a chain; o cannot be added (every neighbourhood of o meets both future branches, which are ≤-incomparable), and any other missing point can, so X \\ {o} is the unique maximal chain. One past branch is bounded above by every point of both future branches and has no least upper bound in X \\ {o}. If this is accepted, (i) fails for local causalities too: compactness fills a gap with a point of M, but nothing forces that point into the chain, and the chain need not be linearly ordered.", "totalLine (any two points related, ofRelation) is kept only as a NON-CAUSAL sanity example and is not a witness for the remark.", "Under DEC-21 and DEC-22 the remark is proved in both halves for second countable Hausdorff spacetimes. 'Compact ⇒ complete' needs only T2, tarentin and causal. The witness of strictness is local and second countable but not locally compact; a locally compact one is not known (the half-plane fails both properties).", "Audit correction: the first witness ℝ × (ℕ →ᵇ ℝ) is not second countable (indicators of subsets of ℕ form an uncountable 1-separated set); replaced by ℝ × C([0,1], ℝ) in both not_causallyCompleteOrder_imp_causallyCompact and not_causallyCompleteCurves_imp_causallyCompact, whose quantified class now includes [SecondCountableTopology N]."]

