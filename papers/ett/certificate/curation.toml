paper_findings = ["Under DEC-10 a time function must be an OPEN map. The Geroch sketch ETT.tex:1272-1276 shows only that t^± = ±μ_±(J^±(x)) are continuous ('time functions (hence continuous)') and never argues that t^±, or T = log(-t^-/t^+), is open; nor, under the within-components reading (b), that [T x, T y] ⊆ U whenever x ≤_{T⁻¹U} y. The second point is automatic there, because Geroch assumes causal arc-connectedness (isTimeFunction_iff_order); the openness is a gap in (i)⇒(ii) of theo:geroch.", "Notation: ETT.tex:267 calls the timelike line '(ℝ,≤,≤)' while ETT.tex:1029 calls the target of a time function '(ℝ,≤,<)'; the relations defined at l.267-268 are ≤ and <, so l.267 should read (ℝ,≤,<)."]

[[row]]
label = "ex:open_subset"
extra_lean_files = ["scaffold/CausalScaffold/Morphism.lean"]
lean_proved_override = "partial"
decls = ["Causal.LocalCausality.InclusionStrong", "Causal.Causality.restrict_inclusionStrong", "Causal.LocalCausality.InclusionStrong.le_restrict", "Causal.LocalCausality.InclusionStrong.eq_restrict", "Causal.LocalCausality.diagonal", "Causal.LocalCausality.diagonal_inclusionStrong", "Causal.openSubset_not_unique", "Causal.LocalCausality.toSubtype", "Causal.LocalCausality.inclusionStrong_iff", "Causal.LocalIsomorphism", "Causal.Causality.pullback", "Causal.Causality.pullback_localIsomorphism", "Causal.LocalIsomorphism.le_of_absolutelyMinimal", "Causal.LocalIsomorphism.unique", "Causal.timelikeLineTop", "Causal.localIsomorphism_not_unique", "Causal.timelikeLineTop_not_isCausal", "Causal.timelikeLineTop_not_absolutelyMinimal"]
bucket = "B"
