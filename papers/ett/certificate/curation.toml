notes = "No `sorry`. In the scaffold. Both uniqueness claims are false as written and proved in corrected forms: the restriction is the greatest causality making the inclusion a strong morphism, and the unique one if the inclusion reflects the relations; the pull-back along a local homeomorphism exists with no hypothesis and is unique among absolutely minimal causalities. WP-1, audited."
paper_findings = ["ETT.tex:260 uniqueness is false as written: the diagonal causality (≤_V equality on V, ≪_V empty) also makes the inclusion of any open W a strong morphism, since a strong morphism only asks the relations of W to imply those of M (openSubset_not_unique, on the timelike line). What is true: the restriction is the GREATEST such causality, and the unique one for which the inclusion also reflects the relations (an isomorphism onto W). Suggested wording: 'a unique structure for which the inclusion is an isomorphism onto its image' or 'the largest structure for which ...'.", "ETT.tex:262 uniqueness fails without a gluing property; among absolutely minimal causalities it holds (LocalIsomorphism.unique). Witness (localIsomorphism_not_unique): id : ℝ → ℝ is a local isomorphism to the timelike line both from the timelike line and from timelikeLineTop, which relates every pair of ℝ in ℝ itself. timelikeLineTop is a causality only because the library, like the paper's 'equivalently' form, has no gluing axiom: it is not causal (timelikeLineTop_not_isCausal), not absolutely minimal (timelikeLineTop_not_absolutelyMinimal), and not local in the sheaf sense. The paper's own use at ETT.tex:599 (X causally arc-connected, hence absolutely minimal) supplies the hypothesis under which uniqueness holds.", "ETT.tex:262 'local isomorphism of topological spacetimes' needs N second countable and Hausdorff, and the paper says nothing about N: the line with two origins mapping to ℝ is a local homeomorphism from a non-Hausdorff space. The formalization asks nothing of N (the pull-back exists regardless), so N is a topological spacetime only if those hypotheses are added.", "ETT.tex:262 existence holds for every local homeomorphism with no hypothesis on M (Causality.pullback, pullback_localIsomorphism): chains of relations read through φ in open sets on which φ is injective.", "ETT.tex:262 'local isomorphism of topological spacetimes' is not defined in the paper."]

