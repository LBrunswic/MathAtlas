blocked_on = "OQ-10: which separation does the statement of theo:causalite_engendre assume?"
notes = "Proved for a T1 space M, without hypothesis (C) and without countability. The statement says 'topological space'; its proof says 'since M is second countable'. For a Hausdorff M, which is what a topological spacetime is, the Lean statement has fewer hypotheses than the paper's. 'Is an absolutely minimal causality' needs no separation and no (B); the plainness clause uses T1 and (B)."
paper_findings = ["Hypothesis (C), M is a Baire space, is not needed, nor is the reduction to a countable index set.", "The Baire argument does not go through as written. The sets J^+_{U_i}(A_{i,n}) are neither open nor closed in general, and the boundary of such a set may have non-empty interior, so the union of the boundaries is not a countable union of closed sets with empty interior.", "The identity closure(union I^+_{U_i}(A_{i,n})) = closure(I^+_U(A)) is asserted with the sets A_{i,n} of the decomposition of J^+_U(A), which are causal iterates: a point of I^+_{U_i}(A_{i,n}) is reached by a causal chain followed by one chronological step, and is not in I^+_U(A) without push-up.", "Another route proves the clause: J^+_U(A) cap U_i is its own causal future in U cap U_i, so local plainness applies to it directly; and the chronological future of a causal future lies in the closure of the chronological future, by absolute minimality of the charts, (B), and the fact that points are closed.", "The statement takes M a topological space, and the proof uses that M is second countable: the hypothesis on M should be stated."]

