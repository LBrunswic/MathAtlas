notes = "No `sorry` beneath the strict part. (i)⇒(ii) and (ii)⇒(iii) proved in the strict library with no sorry, (ii) strict as ruled by DEC-15, the Geroch time function shown open; the equivalence (`geroch`, scaffold) rests on the cited (iii)⇒(i) alone. The hypotheses are jointly satisfiable (the timelike line with a Gaussian measure). WP-7, audited twice."
paper_findings = ["ETT.tex:1300 (ii)⇒(iii) 'take S = T⁻¹(0)' is false for a Cauchy time function in the sense of DEC-10 alone (≤ ↦ ≤, ≪ ↦ <): on 1+1 Minkowski space T(t,x) = t − g(x), with g smooth bounded, |g'| ≤ 1 and g(x) = x on [0,1], is continuous, open, non-decreasing along ≤, increasing along ≪, and tends to ±∞ along every inextensible causal curve, yet T⁻¹(0) contains the null segment from (0,0) to (1,1), which the inextensible null line t = x meets infinitely often. Not formalized (no Minkowski plane in the library). This is why the author ruled DEC-15 ((ii) asks T strictly increasing along ≤); with it the step is proved (geroch_ii_imp_iii), and the T of (i)⇒(ii) is strict (gerochTime_lt). The DEC-10-only form of (ii)⇒(iii) and its sorry were removed.", "The open-map gap WP-1 found in (i)⇒(ii) is closed (isOpenMap_gerochTime), with no added hypothesis: in a causally arc-connected causal T1 spacetime with J^-(x) ≠ {x}, J^+(x) is never a neighbourhood of x (Jplus_not_mem_nhds), so the tarentin diamond J(p,q) ⊂ V around x (V causally convex, from strong causality) has p ≠ x ≠ q, T(p) < T(x) < T(q), and [T p, T q] ⊂ T(V) by the intermediate value theorem along a causal curve from p to q. The same lemma gives chronology, x ≪ y ⇒ x ≠ y (ne_of_lt_top), which ≪ ↦ < needs.", "ETT.tex:1274 't⁺ : x ↦ μ₊(J⁺(x)) and t⁻ : x ↦ −μ₋(J⁻(x)) are time functions': both are non-increasing along ≤ (J⁺(x) shrinks and J⁻(x) grows as x moves to the future), so neither is a time function as stated. T = log(−t⁻/t⁺) has the right sign and is the one formalized; the time-function property of −t^± is not proved here.", "ETT.tex:1291 'If I = ]0,1] then c is extensible by setting c(0) = p' needs two repairs, both available in the sketch: (a) the adjoined point must be causally related to the curve inside small open sets, which is proved from closed causal pasts, strong causality and causal arc-connectedness (causalCurveIn_insert); in a general spacetime it fails; (b) if c is constant near 0 then p is already on the curve and nothing is extended; prepending a curve from q' ∈ J⁻(p) ∖ {p} (the I = [0,1] step) repairs it (extensible_of_tendsto).", "ETT.tex:1287–1290 the uniqueness-of-the-accumulation-point step needs neither Hausdorffness nor a second accumulation point: one causally convex neighbourhood of an accumulation point that the curve visits arbitrarily far in the past contains the whole tail (tendsto_of_mapClusterPt). T2 is still used upstream in (i)⇒(ii), for strong causality (prop:GH_fortement_causal) and for the closedness of J⁻(x) (prop:GH_Jferme); only this step avoids it.", "(i)⇒(ii) uses neither local compactness nor strong causality as a hypothesis (strong causality follows from global hyperbolicity, prop:GH_fortement_causal); (ii)⇒(iii) uses neither the measures, nor tarentin, nor local compactness, and only T1.", "The sketch takes 'a decreasing sequence (x_n) converging to 0' for curves over I = [0,1] or ]0,1], while def:cauchy_time_function is about curves over ℝ; formalized over ℝ with x_n = −n and a log reparametrisation onto ]0, ∞[.", "The hypotheses of theo:geroch are jointly satisfiable: on the timelike line the standard Gaussian measure is admissible in the past and in the future (timelikeLine_admissible_past_and_future; K⁻(a) ⊇ ]−∞,a[, so J⁻(A)∖K⁻(A) has at most one point and is null, the argument of lightlikeLine_admissible_past_and_future in Causal/MeasureRemarks.lean). geroch_i_imp_ii then gives a strict Cauchy time function (timelikeLine_exists_strict_isCauchyTimeFunction), and timelikeLine_geroch_tfae instantiates geroch_tfae. The construction is due to the WP-7 audit; the earlier claim that no admissible measure exists in the library was wrong.", "(i)⇒(ii) is proved in the one-sided form of the sketch (ETT.tex:1295–1296, DEC-13): T → −∞ along every past-inextensible causal curve over ℝ (tendsto_atBot_gerochTime_of_pastInextensible) and T → +∞ along every future-inextensible one (tendsto_atTop_gerochTime_of_futureInextensible); the extension built is at the past end (pastExtensible_of_forall_le)."]

[[row]]
label = "prop:GX_espace_temps_topo"
extra_lean_files = ["Causal/GXStructure.lean"]
lean_proved_override = "partial"
decls = ["Causal.existsUnique_causality_GX_maximal", "Causal.chartIso_of_mem_maximalAtlas", "Causal.existsUnique_causality_GX_of_covering_chart", "Causal.eq_of_chartIso_of_source_eq_univ", "Causal.GX_maximal_not_unique", "Causal.existsUnique_causality_GX", "Causal.gxPregroupoid", "Causal.gxGroupoid", "Causal.ChartIso", "Causal.chartIso_iff_strongMorphism", "Causal.Causality.chartTransport", "Causal.Causality.chartTransport_chartIso", "Causal.ChartIso.absolutelyMinimalOn", "Causal.ChartIso.agreeOn_of_smul", "Causal.exists_smul_eq_of_mem_gxGroupoid", "Causal.smul_rel_iff", "Causal.existsUnique_absolutelyMinimal_of_agree_locally", "Causal.causality_GX_self", "Causal.GX_not_unique_without_minimality", "Causal.eq_of_chartIso_refl"]
bucket = "B"
size = "M"
blocked_on = "OQ-18: the uniqueness of prop:GX_espace_temps_topo"
notes = "No `sorry` beneath the strict part. Existence and the chart condition over the maximal atlas (DEC-16), uniqueness among absolutely minimal causalities, and outright when a chart covers M; uniqueness as stated fails on ℝ ⊔ ℝ in the library's gluing-free reading (kb/0014). WP-8, audited twice."
paper_findings = ["ETT.tex:592-594, uniqueness, under DEC-16's maximal atlas: FALSE as stated in the library's reading, TRUE outright when some chart of the maximal atlas covers M. Counterexample (GX_maximal_not_unique): M = ℝ ⊔ ℝ, X = ℝ with the timelike line, G = translations. Every chart of the maximal atlas is, along each copy, a single translation onto ℝ, so none is injective on all of M (twoLines_source_ne_univ). The absolutely minimal causality C has ¬ (inl 1 ≤_M inl 0) (twoLines_not_le), and C.topEnlarge (≤_M enlarged to all pairs, non-local by kb/0014) still makes every chart of the maximal atlas an isomorphism, since no chart sees M itself. The defect is in the claimed equivalence of the 'Equivalently' form of defi:causalite (ETT.tex:237, implemented without gluing) with the sheaf form, not in the proposition: under gluing (≤ generated by covers, i.e. absolute minimality) uniqueness holds, which is what the proof's last sentence ('minimality gives uniqueness', ETT.tex:613) establishes (existsUnique_causality_GX_maximal). The earlier interval witness (GX_not_unique_without_minimality) used a non-maximal atlas and disappears under DEC-16, the identity of ℝ forcing timelikeLine (eq_of_chartIso_refl). Not settled: connected M covered by no chart (e.g. a cylinder); on the timelike circle ≤_M is already total, so the enlargement there changes nothing.", "ETT.tex:606-608, hypothesis (B): 'transition maps are restrictions of elements of G, hence the transported causalities agree on overlaps' is immediate only if each transition is the restriction of ONE element of G on the whole overlap. In the usual definition the element is constant only on components (or, in the groupoid reading, only locally), and then agreement on an open subset of the overlap needs a relation there to be a chain of local relations: absolute minimality of the model on every open subset, which (A)'s argument (rem:cac_local + cor:causalement_connexe_minimal) supplies. Lean: compatible_of_agree_locally.", "ETT.tex:609-611, (C): the Baire property of X and its locality are not needed (OQ-10).", "Analyticity of (G,X) is used nowhere in the proof.", "The produced causality is, by construction, the one generated by the transported chart causalities (Causality.generated); cor:massA_cac (ETT.tex:1408-1416) relies on this, and it is what the Lean existence witness is."]

