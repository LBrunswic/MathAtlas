notes = "No `sorry` beneath the strict part. Proved for abstracted data (model spaces as hypotheses, local isomorphisms between them), over the given atlas; the hypotheses are instantiated on a line with two models. WP-8, audited twice."
paper_findings = ["ETT.tex:628-632: the second half of (b) ('extends the natural causality of reg(X_α)') is needed at (B) and not cited there. The proof cites (a) and (b) for (A), where causal arc-connectedness of X_α suffices, and cites only 'restrictions of elements of G and of isomorphisms of the model spaces' for (B). The transitions between a chart into X and a chart into X_α are neither; they are (G,X)-charts of reg(X_α) composed with elements of G, and agreement across them is exactly (b)'s second half (Lean: agreeOn_of_regular).", "Uniqueness: as for prop:GX_espace_temps_topo, false in the gluing-free 'Equivalently' form, true under the gluing reading (absolute minimality).", "(C) Baire not needed (OQ-10); analyticity not used.", "'Analytic singular structure', '(G,X,X_A)-manifold', reg(X_α) and its (G,X)-structure are used but not defined in this paper (cited to the thesis).", "Non-vacuity: causality_singularGX_line states the hypotheses of existsUnique_causality_singularGX, instantiated, as conjuncts, for M = ℝ with two model spaces, a regular chart with target ]0,∞[ ≠ X, one X-chart on ]0,∞[ and two Y-charts on ]-∞,1[ (overlaps ]0,1[ and ]-∞,1[), and proves the produced causality is the timelike line."]

