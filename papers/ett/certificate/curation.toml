# ------------------------------------- scaffold: the layer of the curves ----

[[row]]
label = "def:causal_chronological_curve"
extra_lean_files = ["Causal/Curves.lean"]
decls = ["Causal.Causality.CausalCurveOn", "Causal.Causality.ChronalCurveOn", "Causal.CurveOn"]
bucket = "A"
notes = "No `sorry`. The definition is the one ruled by DEC-6 (OQ-7): a map locally non-decreasing at every scale, the weak morphism of def:category_topological_spacetimes, not asked to be an embedding. Continuity is a consequence."
paper_findings = ["A causal curve is 'a connected causal chain', and a causal chain is an embedding. An embedding is injective, so no causal curve joins a point to itself; but the proof of lem:restriction_convexe takes a future causal curve from y to x for y <= x, equality allowed, and that of lem:pushup_local considers 'y = z' if s = 0'. def:causal_arc_connectedness, read with embeddings, fails at p = q.", "'Causal morphism' is not defined; def:category_topological_spacetimes defines strong and weak morphisms."]

