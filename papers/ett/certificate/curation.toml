label = "def:causally_connected"
extra_lean_files = ["Causal/Chains.lean", "Causal/ChainsCurves.lean"]
decls = ["Causal.Causality.CausallyConnected", "Causal.Causality.dual_causallyConnected", "Causal.timelikeLine_causallyConnected", "Causal.spacelikeLine_not_causallyConnected", "Causal.Causality.CausallyConnectedCurves", "Causal.Causality.CausallyConnectedCurves.dual", "Causal.Causality.dual_causallyConnectedCurves", "Causal.Causality.CausalCurveIn.isConnected_image", "Causal.Causality.causallyConnectedCurves_iff_of_isCausal", "Causal.staticCausality.exists_inextensible_graph", "Causal.staticCausality.causallyConnectedCurves", "Causal.timelikeLine_causallyConnectedCurves", "Causal.minkowski_causallyConnectedCurves", "Causal.Causality.causallyConnectedCurves_of_curvesExtend", "Causal.rat_causalCurveIn_subsingleton", "Causal.rat_not_causallyConnectedCurves", "Causal.rat_not_causallyArcConnected", "Causal.rat_not_absolutelyMinimal"]
bucket = "A"
notes = "DEC-20: for p ≤ q an inextensible causal curve meets p, then q (the order is immaterial in a causal spacetime). Minkowski space and every static spacetime over a geodesic space are causally connected; ℚ (non-local) is not. OQ-20 asks whether it should read with maximal chains of (M, ≤) instead. (WP-6, WP-6b, audited)"
paper_findings = ["ETT.tex:339 as written (maximal among all subset chains), causal connectedness fails in every spacetime with no maximal chain, Minkowski space of dimension ≥ 2 included (see def:maximal_chain); the condition holds for the timelike line only because its unique maximal chain is the whole line.", "Under DEC-20 Minkowski space ℝ^{1,n} is causally connected for every n (minkowski_causallyConnectedCurves), where the literal definition fails for n ≥ 1 (minkowski_not_causallyConnected, CausalScaffold.Minkowski). More generally every static spacetime ℝ × X over a geodesic metric space is: through p ≤ q passes the graph of a 1-Lipschitz map — the geodesic segment from p to q prolonged by the vertical lines through p and q — which is inextensible because time is unbounded along it (staticCausality.exists_inextensible_graph).", "Negative example (audit): ℚ with the causality of its order (linearCausality ℚ) is not causally connected: ℚ is totally disconnected, so every causal curve is constant (rat_not_causallyConnectedCurves). It is non-local and not causally arc-connected, both proved: rat_not_absolutelyMinimal (the cover by the two sides of √2), rat_not_causallyArcConnected (kb/0019). Under causal arc-connectedness and causality, connectedness follows from CurvesExtend (CauchyExtension.lean:82), here as a hypothesis (causallyConnectedCurves_of_curvesExtend)."]

