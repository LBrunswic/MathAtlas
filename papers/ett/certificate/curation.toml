paper_findings = ["ETT.tex:592-594, uniqueness, under DEC-16's maximal atlas: FALSE as stated in the library's reading, TRUE outright when some chart of the maximal atlas covers M. Counterexample (GX_maximal_not_unique): M = ℝ ⊔ ℝ, X = ℝ with the timelike line, G = translations. Every chart of the maximal atlas is, along each copy, a single translation onto ℝ, so none is injective on all of M (twoLines_source_ne_univ). The absolutely minimal causality C has ¬ (inl 1 ≤_M inl 0) (twoLines_not_le), and C.topEnlarge (≤_M enlarged to all pairs, non-local by kb/0014) still makes every chart of the maximal atlas an isomorphism, since no chart sees M itself. The defect is in the claimed equivalence of the 'Equivalently' form of defi:causalite (ETT.tex:237, implemented without gluing) with the sheaf form, not in the proposition: under gluing (≤ generated by covers, i.e. absolute minimality) uniqueness holds, which is what the proof's last sentence ('minimality gives uniqueness', ETT.tex:613) establishes (existsUnique_causality_GX_maximal). The earlier interval witness (GX_not_unique_without_minimality) used a non-maximal atlas and disappears under DEC-16, the identity of ℝ forcing timelikeLine (eq_of_chartIso_refl). Not settled: connected M covered by no chart (e.g. a cylinder); on the timelike circle ≤_M is already total, so the enlargement there changes nothing.", "ETT.tex:606-608, hypothesis (B): 'transition maps are restrictions of elements of G, hence the transported causalities agree on overlaps' is immediate only if each transition is the restriction of ONE element of G on the whole overlap. In the usual definition the element is constant only on components (or, in the groupoid reading, only locally), and then agreement on an open subset of the overlap needs a relation there to be a chain of local relations: absolute minimality of the model on every open subset, which (A)'s argument (rem:cac_local + cor:causalement_connexe_minimal) supplies. Lean: compatible_of_agree_locally.", "ETT.tex:609-611, (C): the Baire property of X and its locality are not needed (OQ-10).", "Analyticity of (G,X) is used nowhere in the proof.", "The produced causality is, by construction, the one generated by the transported chart causalities (Causality.generated); cor:massA_cac (ETT.tex:1408-1416) relies on this, and it is what the Lean existence witness is."]

