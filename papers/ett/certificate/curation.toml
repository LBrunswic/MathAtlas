paper_findings = ["ETT.tex:833-834: 'a countable union of sets open in J^±(p), hence a Borel subset of M' needs J^-(p) Borel: a relatively open subset of a non-Borel set need not be Borel. Proved: K^-(p) = J^-(p) ∩ O with O open (the countable union is itself open in J^-(p)), hence Borel whenever J^-(p) is, in particular in the setting of prop:cont_ext_cont where J^-(p) is closed. 'open in J^±(p)' should read J^-(p).", "The library's prop:cont_ext_cont (Causal/Measure.lean) does not need this remark at all: it applies inner regularity to a measurable subset of K^-(p) of full measure.", "ETT.tex:833-834, 'a countable union of sets open in J^±(p), hence a Borel subset of M': false. There is a tarentin topological spacetime, with a local (absolutely minimal) and causal causality, in which K^-(p) is not Borel (not_kBorelienAsPrinted, with locality recorded in spokes_counterexample). The future form is refuted the same way (not_kBorelienPlusAsPrinted): the time-reversed witness is tarentin, causal and absolutely minimal, and K^+(p) is not Borel (spokes_counterexample_future). Both printed-form Props quantify over every library causality, so the claim that the refutation holds for local causal spacetimes rests on these two companion theorems. The witness is 'Minkowski space with spokes' on R x C: ≪ is Minkowski's, and ≤ adds, in the slice t = 0, the spacelike radial steps (0,z) ≤ (0,cz) for z in a cone A and c in [0,1]. At p = (1,0), K^-(p) restricted to the slice outside the unit ball is exactly A (spokes_Kminus_slice); with A the cone over {x + i : x ∈ T} for a non-Borel T ⊆ R, neither K^-(p) nor J^-(p) is Borel (spokes_counterexample).", "Strongest true forms: K^-(p) is Borel whenever J^-(p) is (existing measurableSet_Kminus), which covers prop:cont_ext_cont, the one place the remark is used (ETT.tex:1219: tarentin and globally hyperbolic, so J^-(p) is closed; existing measurableSet_K_of_globallyHyperbolic). With no hypothesis on J^-(p), K^-(p) is Borel when M is causally plain or has push-up and p ∈ Z^-(M), because K^-(p) = I^-(p) is then open (measurableSet_Kminus_of_causallyPlain, measurableSet_Kminus_of_pushUp, new). The witness is necessarily neither causally plain nor push-up, and this is proved in spokes_counterexample. A repair the author may consider: '... hence Borel as soon as J^-(p) is, for instance when M is globally hyperbolic (Proposition prop:GH_Jferme)'."]

