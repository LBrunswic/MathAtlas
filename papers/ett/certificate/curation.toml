paper_findings = ["ETT.tex:2011 C is defined as the pairs (p,q) ∈ M1×M2 with π(p), π(q) not separated. Two equal points are never separated, so C contains every (j₁(x), j₂(x)) (Gluing.graph_subset_C) and C ≠ ∅ as soon as N ≠ ∅, even when the quotient is Hausdorff (Gluing.t2Space_and_C_nonempty). The last sentence of rem:non_separe_cas ('it is the case C ≠ ∅') is therefore false as written, and so is prop:Cauchy_point_min's hypothesis 'C ≠ ∅' in its literal reading. Every use of C (lem:corresponding_K, cor:model_corresponding, prop:C_connexe 'C is closed', prop:Cauchy_point_min, proof of prop:ppcm_Cauchy at l.2320-2324) needs the pairs with DISTINCT non-separated images. Suggest: add 'distinct' (or π(p) ≠ π(q)) to the definition of C. With that reading (Gluing.Cdist) the remark is proved: Cdist = closure(graph) ∖ graph ⊆ ∂j₁(N) × ∂j₂(N), and the quotient is Hausdorff iff Cdist = ∅.", "The literal C is exactly the closure in M1×M2 of the graph {(j₁(x), j₂(x))} (Gluing.C_eq_closure, no separation axiom): this is the neighbourhood form of the sentence 'a sequence (a_n) with j₁(a_n) → p and j₂(a_n) → q exists because π(p) and π(q) are not separated' in the proof of lem:corresponding_K (l.2111). A cleaner statement of the whole remark: the gluing is Hausdorff iff M1, M2 are and the graph of f = j₂∘j₁⁻¹ is closed in M1×M2 (Gluing.t2Space_iff).", "The remark is a necessary condition only: a pair in ∂j₁(N)×∂j₂(N) need not be non-separated; 'only the last case obstructs' is proved as: for Hausdorff M1, M2 the quotient is Hausdorff iff every pair of ∂j₁(N)×∂j₂(N) has separated images (Gluing.t2Space_iff_frontier). The line with two origins (two copies of ℝ glued along ℝ∖{0}) is the example: (0,0) ∈ Cdist and the gluing is not Hausdorff."]

