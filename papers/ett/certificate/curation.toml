decls = ["Causal.Causality.BTZAxioms", "Causal.E0.causal_E0", "Causal.E0.btzAxioms", "Causal.E0.causality", "Causal.E0.Iminus_axis", "Causal.E0.Jminus_axis", "Causal.E0.mem_Zplus_not_mem_Zminus", "Causal.E0.axis_causalCurveOn", "Causal.E0.not_chronalCurveOn_axisLine", "Causal.E0.not_pastDistinguishing", "Causal.Causality.SingularFlatAxioms.not_pastDistinguishing", "Causal.E0.Iplus_ne_Jplus_diff", "Causal.E0.not_btzIplusAsPrinted", "Causal.E0.Iplus_axis_eq_interior_diff", "Causal.E0.Jplus_axis", "Causal.E0.Iplus_axis"]
