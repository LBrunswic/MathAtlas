notes = "With strong causality assumed (DEC-18), a singular flat spacetime satisfies the hypotheses of theo:geroch. (WP-11, audited)"
paper_findings = ["The reason for DEC-18. As printed (no strong causality), the remark overclaims: theo:geroch asks local causal convexity and a pair of admissible measures, and prop:mesure_admissible gives the measures only for strongly causal M; nothing in Section 3 makes a singular flat spacetime strongly causal (l.1216 reads 'locally causally convex => strongly causal'). By hand, not formalized (no E_alpha in the library): for alpha > 0, E_alpha modulo a translation along its timelike singular line is a connected singular flat spacetime with a non-empty singular locus (so the example does not depend on whether A = R_+ allows an empty one); its singular line closes into a closed timelike curve, it is totally vicious (J^-(q) = M for every q), and it carries no measure admissible in the past (property 3 fails). E^{1,2} modulo a timelike translation is the same example if an empty singular locus is allowed. None of (i)-(iii) holds there, so theo:geroch_sing without strong causality is not refuted, but its proof (l.1781-1785) needs strong causality for (ii)=>(iii) and (iii)=>(i). The example is local (not a kb/0014 artefact). Since line/massive_line ask the closed embedding only when M is causal, the structure does not exclude such a quotient. Under DEC-18 the remark and theo:geroch_sing assume M strongly causal.", "J^±(p) ≠ {p} (l.1783-1785) follows abstractly: I^±(p) is non-empty and open (or J^-(p) accumulates at p at a BTZ point) and M has no isolated point; the '3-dimensional J^+(p)' is not needed."]

