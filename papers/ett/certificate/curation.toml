notes = "The rest of the proof is sorry-free given that step as a hypothesis (c_ext_connexe_of_isCauchySurfaceOn); the statement rests on a tagged sorry. (WP-12, audited) T-ett-subextension (atlas-team, 2026-11-20), audits AUDIT-1 and AUDIT-2 minor (wording, fixed in two rounds): anchored over the CBG Geometry (DEC-60) in the strict Causal.CBG.ETTSubExtension, sorry-free, unmarked; partial until the E₀ instance of the geometry (T-ett-cbg-e0). The scaffold forms (CausalScaffold.SubExtension) are kept; the paper's argument still has the gaps recorded below, which over the geometry rest on the interface fields (curvesExtend, timeFunction) whose E₀ discharge is owed."
paper_findings = ["ETT.tex:1940-1941: 'The map M → A∩B is a Cauchy embedding, so φ(Σ) is a Cauchy surface of A∩B' is asserted without argument. That φ(Σ) meets each causal curve of A∩B at most once is proved (eq_of_mem_image_inter); that it meets every inextensible curve of A∩B is the open step. In the Lorentzian case it holds by an end-point argument (the future end points of the two extensions coincide and would lie in (A∖B) ∩ (B∖A)).", "ETT.tex:1941-1942: 'every point of A∩B lies on an inextensible causal curve' — the existence of inextensible causal curves through every point is proved nowhere (GerochEquiv's SCOPE notes the same gap); carried as a model fact.", "ETT.tex:1939-1940: the appeal to theo:geroch_sing (M homeomorphic to Sigma x R, to make Sigma connected) is not needed. A ∩ B contains the connected set phi(M), and every point of A ∩ B lies on an inextensible causal curve of A ∩ B meeting phi(Sigma) ⊆ phi(M) (ett_c_ext_connexe_curves, ETT.tex:1941-1942), so A ∩ B is connected for any Cauchy surface Sigma (c_ext_connexe_of_connectedSpace). Suggest: 'every point of A ∩ B is joined inside A ∩ B to the connected set phi(M)'.", "ETT.tex:1940-1941: 'the map M -> A ∩ B is a Cauchy embedding, so phi(Sigma) is a Cauchy surface of A ∩ B' is not needed for the conclusion, and it stays unproved even over the geometry. Proved: phi(Sigma) meets every causal curve at most once (ett_c_ext_connexe_curves), and A ∩ B is causally convex in N and globally hyperbolic (ett_c_ext_connexe_convex). The existence half needs an inextensible curve of A ∩ B to lie, through a reparametrisation, on inextensible curves of A and of B. The abstract form (exists_mem_image_inf) is neither proved nor refuted (SubExtensionAbstract SCOPE)."]

