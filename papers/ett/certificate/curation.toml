paper_findings = ["The reason for DEC-19. By hand, not formalized (no E_0 in the library): in E_0 minus a point w of the BTZ line below p, with z on that line below w, z << p_n for regular p_n -> p with p ∉ J^-(p_n) (a chronal curve from a BTZ point leaves the line at once and avoids w), while J^-(p) = ]w,p]; so lem:cup_cap_BTZ as printed (strongly causal) fails for this strongly causal singular flat spacetime, granted that E_0 is strongly causal and p ∈ Int J^+(z) (the fact the proof of prop:K_calcul (c) uses). Its only use (l.2122) is in a globally hyperbolic setting, where it holds. The proof 'as for lem:J_int' (l.1831) does not reduce to a chart: z may lie outside it. Under DEC-19 the lemma is stated for globally hyperbolic M and its certificate is cupCapBTZAsPrinted_of_globallyHyperbolic; the printed strongly causal form stays the Prop Causal.Causality.CupCapBTZAsPrinted, not asserted, with this finding. SingularFlatAxioms.cup_cap_BTZ has no witness at a BTZ point (the full structure has none); the certificate is instantiated on the timelike line only vacuously (sing 0 = ∅)."]

