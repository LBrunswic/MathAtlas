notes = "ℰ and the gluing step proved under rigidity and connected overlaps; the proposition is a tagged sorry. (WP-12, audited) T-ett-subextension (atlas-team, 2026-11-20), audits AUDIT-1 and AUDIT-2 minor (wording, fixed in two rounds): anchored over the CBG Geometry (DEC-60) in the strict Causal.CBG.ETTSubExtension, sorry-free, unmarked; partial until the E₀ instance of the geometry (T-ett-cbg-e0). The scaffold forms (CausalScaffold.SubExtension) are kept; the paper's argument still has the gaps recorded below, which over the geometry rest on the interface fields (curvesExtend, timeFunction) whose E₀ discharge is owed. The abstract scaffold form (causal IsRigid) is false for non-local causalities under every reading of 'equivalent' that asks for a morphism between the two (Causal.not_cauchyPgcdAbstract, cauchyPgcdAbstract_counterexample_symm); the equivalence generated by bijective morphisms is not refuted."
paper_findings = ["ETT.tex:1953-1960 (confirms WP-4): ℰ's condition (b) does not ask φ_M injective, so the step '(∧, φ) ∈ ℰ, hence ∧ is a common sub-extension' does not show ∧ → M₂ injective. A gap in the argument, not a refutation: no counterexample is known, and injectivity is plausibly recoverable.", "ETT.tex:1960-1961: 'Thus (∧, φ) ∈ ℰ' needs that the inclusion of i₁(M₀) into the union ∧ is a Cauchy embedding (global hyperbolicity of ∧ and the Cauchy property of i₁(Σ₀) in ∧), which does not follow from the same facts for each M; it is not argued.", "ETT.tex:1960-1965: the proof gives more than the statement, and it is proved: the maximal common sub-extension receives a unique morphism from every common sub-extension (ett_cauchy_pgcd), and every maximal one has image the union of ℰ in M1 (ett_cauchy_pgcd_range). Suggest stating it as 'a greatest common sub-extension', which makes 'unique up to equivalence' immediate. The two gaps already recorded for this row are about the paper's text, which still argues neither point: φ is not shown injective (ETT.tex:1953-1960), and the union is not shown Cauchy-included (ETT.tex:1960-1961). Over the geometry both are proved from interface fields: A2 timeFunction (Sbierski Lemma 3.3) gives IsCGHD.injOn, and A2 curvesExtend with causal arc-connectedness gives isCGHD_mcghd. Their E₀ discharge is owed (T-ett-cbg-e0). The recorded paper_findings stay.", "ETT.tex:1945-1949, abstract reading (not the paper's setting, DEC-60): the scaffold's abstract statement (CausalScaffold.SubExtension.cauchy_pgcd: abstract 𝕄≥0-morphisms, rigidity as the causal IsRigid) is false for non-local causalities. (a) not_cauchyPgcdAbstract refutes it as formalized. The witness on ℝ has two causalities that agree on every open set of diameter < 1 and are not absolutely minimal (not_absolutelyMinimalOn_witness), and rigidity holds (bigCausality_isRigid). Of two maximal common sub-extensions, bigSub is not Equivalent to the base. The converse DOES hold (base_equivalent_bigSub: a bijective morphism whose inverse is not one). So (a) rests on the library's Equivalent being directional, and under the paper's symmetric 'equivalent' (ETT.tex:1927-1928) those two ARE equivalent. (b) cauchyPgcdAbstract_counterexample_symm refutes it under every reading of 'equivalent' that asks for a morphism between the two: directional, one-step symmetric, isomorphism. In the same setting, two maximal common sub-extensions (ℝ, C', id, id, id) and (ℝ, C'', id, id, id), with C', C'' incomparable between C₀ and C₁, admit no morphism in either direction. (c) NOT refuted: the equivalence relation generated by bijective morphisms. Here i₁ = id is bijective, so the base maps bijectively onto every common sub-extension (via Y.a), and the two witnesses are equivalent through the base (kernel-checked by the AUDIT-2 probe, not stated in the files). Abstractly the one-step symmetric relation is not transitive, and this witness shows it: base ~ C', base ~ C'', C' ≁ C''. So in the abstract setting 'unique up to equivalence' (ETT.tex:1948) needs its reading fixed. Whether the generated reading is refutable is open; it would need i₁ not bijective. Over the geometry all readings coincide (isMor_inv). What this shows: the abstract statement fails without a locality hypothesis, because a carrier's causality is not determined by local isomorphisms. Whether a hypothesis such as absolute minimality (which is not a gluing axiom, kb/0014) suffices is open. It says nothing about the paper's singular flat spacetimes, where the statement holds over the geometry (ett_cauchy_pgcd)."]

[[row]]
label = "theo:geroch"
extra_lean_files = ["scaffold/CausalScaffold/GerochEquiv.lean", "Causal/Geroch.lean"]
lean_proved_override = "partial"
decls = ["Causal.Causality.geroch", "Causal.Causality.geroch_i_imp_ii", "Causal.Causality.GloballyHyperbolic.isCauchyTimeFunction_gerochTime", "Causal.Causality.gerochTime", "Causal.Causality.isTimeFunction_gerochTime", "Causal.Causality.isOpenMap_gerochTime", "Causal.Causality.continuous_gerochTime", "Causal.Causality.gerochTime_lt", "Causal.Causality.gerochTime_le", "Causal.Causality.gerochTime_dual", "Causal.Causality.exists_le_of_bddBelow", "Causal.Causality.tendsto_atBot_gerochTime", "Causal.Causality.tendsto_atTop_gerochTime", "Causal.Causality.extensible_of_forall_le", "Causal.Causality.extensible_of_forall_ge", "Causal.Causality.IsCauchyTimeFunction.exists_mem_zero", "Causal.Causality.IsCauchyTimeFunction.isCauchySurface", "Causal.Causality.geroch_ii_imp_iii", "Causal.Causality.geroch_i_imp_iii", "Causal.Causality.geroch_iii_imp_i", "Causal.Causality.geroch_tfae_strict", "Causal.timelikeLine_admissible_past_and_future", "Causal.timelikeLine_exists_strict_isCauchyTimeFunction", "Causal.timelikeLine_geroch_tfae", "Causal.Causality.pastExtensible_of_forall_le", "Causal.Causality.futureExtensible_of_forall_ge", "Causal.Causality.tendsto_atBot_gerochTime_of_pastInextensible", "Causal.Causality.tendsto_atTop_gerochTime_of_futureInextensible"]
bucket = "D"
size = "L"
blocked_on = "OQ-32: (iii)⇒(i) is false as printed (chronological Minkowski space); which repair, and does its compactness lemma hold"
notes = "(i)⇒(ii) and (ii)⇒(iii) proved in the strict library with no sorry, (ii) strict as ruled by DEC-15, the Geroch time function shown open; the equivalence (`geroch`, scaffold) rests on the cited (iii)⇒(i) alone. The hypotheses are jointly satisfiable (the timelike line with a Gaussian measure). DEC-15's counterexample is a Lean theorem on Minkowski space (minkowski2_dec15). (WP-7, WP-9, audited) T-ett-geroch-iii-i (atlas-team, 2026-11-20), audit AUDIT-1 minor (wording, fixed in round 1). (iii)⇒(i) is REFUTED, not cited: chronological Minkowski space satisfies every hypothesis with (ii) and (iii) and not (i) (Causal.not_gerochIIIImpIAsPrinted, Causal.not_geroch_tfae, CausalScaffold.GerochCauchy, sorry-free); GerochEquiv's geroch_iii_imp_i and geroch state false propositions, so their sorry cannot be discharged. A conjectured repair adding '≤ closed' (geroch_of_isClosed_le) rests on one sorry, the compactness of J⁻(q) ∩ J⁺(S), whose truth in this setting is open (OQ-32). Infrastructure in Causal.LimitCurves (strict). The refutations and the repaired form are not anchors of this row."
paper_findings = ["ETT.tex:1300 (ii)⇒(iii) 'take S = T⁻¹(0)' is false for a Cauchy time function in the sense of DEC-10 alone (≤ ↦ ≤, ≪ ↦ <): on 1+1 Minkowski space T(t,x) = t − g(x), with g smooth bounded, |g'| ≤ 1 and g(x) = x on [0,1], is continuous, open, non-decreasing along ≤, increasing along ≪, and tends to ±∞ along every inextensible causal curve, yet T⁻¹(0) contains the null segment from (0,0) to (1,1), which the inextensible null line t = x meets infinitely often. Not formalized (no Minkowski plane in the library). This is why the author ruled DEC-15 ((ii) asks T strictly increasing along ≤); with it the step is proved (geroch_ii_imp_iii), and the T of (i)⇒(ii) is strict (gerochTime_lt). The DEC-10-only form of (ii)⇒(iii) and its sorry were removed.", "The open-map gap WP-1 found in (i)⇒(ii) is closed (isOpenMap_gerochTime), with no added hypothesis: in a causally arc-connected causal T1 spacetime with J^-(x) ≠ {x}, J^+(x) is never a neighbourhood of x (Jplus_not_mem_nhds), so the tarentin diamond J(p,q) ⊂ V around x (V causally convex, from strong causality) has p ≠ x ≠ q, T(p) < T(x) < T(q), and [T p, T q] ⊂ T(V) by the intermediate value theorem along a causal curve from p to q. The same lemma gives chronology, x ≪ y ⇒ x ≠ y (ne_of_lt_top), which ≪ ↦ < needs.", "ETT.tex:1274 't⁺ : x ↦ μ₊(J⁺(x)) and t⁻ : x ↦ −μ₋(J⁻(x)) are time functions': both are non-increasing along ≤ (J⁺(x) shrinks and J⁻(x) grows as x moves to the future), so neither is a time function as stated. T = log(−t⁻/t⁺) has the right sign and is the one formalized; the time-function property of −t^± is not proved here.", "ETT.tex:1291 'If I = ]0,1] then c is extensible by setting c(0) = p' needs two repairs, both available in the sketch: (a) the adjoined point must be causally related to the curve inside small open sets, which is proved from closed causal pasts, strong causality and causal arc-connectedness (causalCurveIn_insert); in a general spacetime it fails; (b) if c is constant near 0 then p is already on the curve and nothing is extended; prepending a curve from q' ∈ J⁻(p) ∖ {p} (the I = [0,1] step) repairs it (extensible_of_tendsto).", "ETT.tex:1287–1290 the uniqueness-of-the-accumulation-point step needs neither Hausdorffness nor a second accumulation point: one causally convex neighbourhood of an accumulation point that the curve visits arbitrarily far in the past contains the whole tail (tendsto_of_mapClusterPt). T2 is still used upstream in (i)⇒(ii), for strong causality (prop:GH_fortement_causal) and for the closedness of J⁻(x) (prop:GH_Jferme); only this step avoids it.", "(i)⇒(ii) uses neither local compactness nor strong causality as a hypothesis (strong causality follows from global hyperbolicity, prop:GH_fortement_causal); (ii)⇒(iii) uses neither the measures, nor tarentin, nor local compactness, and only T1.", "The sketch takes 'a decreasing sequence (x_n) converging to 0' for curves over I = [0,1] or ]0,1], while def:cauchy_time_function is about curves over ℝ; formalized over ℝ with x_n = −n and a log reparametrisation onto ]0, ∞[.", "The hypotheses of theo:geroch are jointly satisfiable: on the timelike line the standard Gaussian measure is admissible in the past and in the future (timelikeLine_admissible_past_and_future; K⁻(a) ⊇ ]−∞,a[, so J⁻(A)∖K⁻(A) has at most one point and is null, the argument of lightlikeLine_admissible_past_and_future in Causal/MeasureRemarks.lean). geroch_i_imp_ii then gives a strict Cauchy time function (timelikeLine_exists_strict_isCauchyTimeFunction), and timelikeLine_geroch_tfae instantiates geroch_tfae. The construction is due to the WP-7 audit; the earlier claim that no admissible measure exists in the library was wrong.", "(i)⇒(ii) is proved in the one-sided form of the sketch (ETT.tex:1295–1296, DEC-13): T → −∞ along every past-inextensible causal curve over ℝ (tendsto_atBot_gerochTime_of_pastInextensible) and T → +∞ along every future-inextensible one (tendsto_atTop_gerochTime_of_futureInextensible); the extension built is at the past end (pastExtensible_of_forall_le).", "Witness only (the theorem is WP-7's). DEC-15's counterexample is now a Lean theorem, with a LOCAL (absolutely minimal) causality, not Causality.ofRelation: on R^{1,n}, n >= 1 (n = 1: minkowski2_dec15), T(t,x) = t - g(x) with g(x) = max(0, min(<x,e>, 1)) (bounded, 1-Lipschitz, g(tau e) = tau on [0,1]) is a Cauchy time function in the DEC-10 sense, is not strictly increasing along <= ((0,0) <= (1,e), same T), and T^{-1}(0) contains the null segment {(tau, tau e)} and is not a Cauchy surface (DEC-14): the null line tau -> (tau, tau e), inextensible, meets it at least twice. This confirms why l.1300 'it suffices to take S = T^{-1}(0)' needs DEC-15. The time coordinate is a strictly increasing Cauchy time function (minkowski_time_strict), so (ii) as ruled is satisfiable there.", "Lean declarations of this witness (not row decls, so as not to overwrite WP-7's theo:geroch row): Causal.minkowski_dec15, Causal.minkowski2_dec15, Causal.staticCausality.not_strict_and_not_isCauchySurface, Causal.staticCausality.isCauchyTimeFunction_sub, Causal.staticCausality.isTimeFunction_sub, Causal.staticCausality.tendsto_time_atTop, Causal.staticCausality.tendsto_time_atBot, Causal.staticCausality.inextensible_nullLine, Causal.minkowski_inextensible_nullLine, Causal.minkowski_time_strict, Causal.Causality.Inextensible.not_tendsto_atBot, Causal.Causality.Inextensible.not_tendsto_atTop, Causal.Causality.inextensible_of_unbounded.", "ETT.tex:1256–1267 with 1301–1306 (and the abstract, l.142–146): (iii)⇒(i) of theo:geroch is FALSE as printed. Lean, sorry-free: Causal.not_gerochIIIImpIAsPrinted. Witness: chronological Minkowski space ℝ^{1,n}, n ≥ 1 (Causal.chronoMinkowski n). Its causal relation is x ≤_U y iff x = y ∈ U or x ≪_U y, with ≪_U that of Minkowski space unchanged, so the null directions are removed. It is metrizable, locally compact, second countable and Hausdorff. It is tarentin, causally arc-connected, strongly causal in both readings, with J^±(p) ≠ {p}, and carries one measure admissible in the past and in the future. The time t is a Cauchy time function strictly increasing along ≤ (ii), and {t = 0} is a Cauchy surface (iii). But J((0,x),(2L,x)) is I⁺ ∩ I⁻ plus its two vertices: not closed, not compact, so (i) fails (Causal.chronoMinkowski_counterexample).", "The counterexample is not an artefact of the library's reading. It is absolutely minimal (a local causality, kb/0014), causally plain, causally open (DEC-8) and has push-up (Causal.chronoMinkowski_robust). Hence none of these properties, used elsewhere in the paper, rescues the step.", "ETT.tex:1304–1306 says O'Neill's proof 'carries over verbatim under the hypotheses of metrizability and local compactness'. It does not: a quasi-limit of causal curves is causal because a Lorentzian causal relation is closed near every point. A topological spacetime's causal relation need not be closed, even locally, and the counterexample is exactly that failure.", "Consequently the equivalence theo:geroch is false as printed (Causal.not_geroch_tfae). (ii)⇒(i) fails too: (ii) and (iii) hold on the counterexample and (i) does not. In the scaffold, GerochEquiv's geroch_iii_imp_i, geroch_tfae_strict and geroch all state false propositions. A throwaway check (/tmp, not committed) derived False from each of geroch_iii_imp_i and geroch with these refutations. The scaffold sorry can never be discharged.", "The SCOPE worry of CausalScaffold.GerochEquiv (a vacuous Cauchy surface S = ∅) is not what fails here: on the counterexample every inextensible causal curve crosses {t = 0}. With the causal relation closed and one measure admissible in the past, a vacuous Cauchy surface cannot occur. Every point then lies on an inextensible causal curve, every point is in J^+(S) ∪ J^-(S), and S is acausal (LimitCurves: exists_inextensible_mem_of_isClosed_le, IsCauchySurface.exists_le_or_le_of_isClosed_le, IsCauchySurface.isAcausal_of_isClosed_le)."]

[[row]]
label = "def:maximal_chain"
bucket = "T"
terminal_reason = "Superseded by the author's rulings DEC-20 and DEC-21: as written, a maximal chain is dense (IsMaximalChain.dense) and none exists in Minkowski space of dimension ≥ 2 (a Lean theorem, minkowski_not_isMaximalChain); causal connectedness is read with inextensible causal curves and causal completeness with maximal chains of the ordered set (M, ≤)."
notes = "The literal definition stays in Causal.Chains as the record of the finding. (WP-6, WP-6b, WP-9, audited)"
paper_findings = ["ETT.tex:335 with the subset notion (2), a maximal chain of a T1 space is DENSE (IsMaximalChain.dense): any point outside the closure of a chain can be added to it.", "Abstract consequence, proved (not_isMaximalChain_of_hasUnrelatedOpensIn): in a nonempty T1 space, if every point has an open neighbourhood U such that every non-empty open O ⊆ U contains two non-empty open sets with no ≤_U relation between their points, there is no maximal chain. Proof: the dense maximal chain S meets both unrelated sets inside the V ⊆ U where S ∩ V is totally ordered for ≤_V, and ≤_V ⊆ ≤_U by axiom (b). The global form (U = ⊤) is not_isMaximalChain_of_hasUnrelatedOpensIn_top; the spacelike line satisfies it (spacelikeLine_hasUnrelatedOpensIn_top), which re-derives spacelikeLine_not_isMaximalChain.", "Application to Lorentzian manifolds (prose; no Lorentzian manifold is in the library): let M have dimension ≥ 2, chronology and causality conditions arbitrary (vicious spacetimes included). Take at each x a convex normal neighbourhood U, with ≤_U the relation 'joined by a causal curve in U'. Every non-empty open O ⊆ U contains two points spacelike-separated in U (e.g. on a short spacelike geodesic), and since J_U is closed in U × U for a convex normal U, small balls around them are ≤_U-unrelated. So the hypothesis holds with local U, and there is NO maximal causal chain. Because only ≤_U for small U is used, no global causality condition is needed. Consequently, as written, causal completeness holds vacuously in every Lorentzian manifold of dimension ≥ 2 and causal connectedness fails there. The paper presumably means maximal among CONNECTED chains, or among chain maps / curves maximal under extension (DEC-11).", "Superseded by DEC-20: Causal.Chains keeps the literal definition (IsMaximalChain) as the record of the finding (a maximal chain is dense; none exists in Minkowski space). Relation proved here: the image of an inextensible causal curve over ℝ which is an embedding is a subset causal chain (CausalCurveIn.isCausalChain_range), and in ℝ^{1,n}, n ≥ 1, through every p ≤ q passes such a curve whose image is a chain and is not maximal (minkowski_curveChain_not_maximal).", "Witness only (the definition is Causal/Chains.lean's, OQ-17). As written, Minkowski space R^{1,n}, n >= 1 (indeed every static R x X with X geodesic with two points), has NO maximal causal chain: every open set contains two small balls at one time, spatially apart, with no causal relation between them (hasUnrelatedOpensIn), and not_isMaximalChain_of_hasUnrelatedOpensIn applies. Hence def:causally_connected fails in Minkowski space and def:causally_complete holds vacuously there (minkowski_not_causallyConnected, minkowski_causallyComplete). This is with the local causality of curves, so it is not an artefact of non-local causalities (kb/0019).", "Lean declarations of this witness (not row decls, so as not to overwrite Causal/Chains.lean's def:maximal_chain row): Causal.minkowski_not_isMaximalChain, Causal.minkowski_not_causallyConnected, Causal.minkowski_causallyComplete, Causal.staticCausality.not_isMaximalChain, Causal.staticCausality.hasUnrelatedOpensIn."]

