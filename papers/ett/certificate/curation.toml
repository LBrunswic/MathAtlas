paper_findings = ["ETT.tex:331 'causal morphism' is not defined; it is read as the weak morphism of def:category_topological_spacetimes (DEC-6), with (X,≤) given the lightlike causality of its order (no ≪). Then a chain map from ℝ is exactly an injective DEC-6 causal curve which is an embedding (isCausalChainMap_real_iff).", "ETT.tex:330-332 the paper gives two notions under one name and never relates them. Image ⇒ subset chain holds when X is conditionally complete and densely ordered (isCausalChain_range); for a general linearly ordered X (e.g. ℚ) the proof needs to chain local relations of ≤_V across [y,z], which needs compact connected intervals, and I could not exclude a counterexample built from a non-local causality. Subset chain ⇒ image of a chain map holds when S carries a linear order reflected by ≤_M whose order topology is the subspace topology; without that hypothesis S need not even be globally comparable (two disjoint timelike lines, or X minus its vertex below).", "Every subset of the timelike line is a causal chain (timelikeLine_isCausalChain): def (2) is a purely local condition, so discrete sets, Cantor sets etc. are chains. In the spacelike line exactly the subsets whose points are all isolated are chains."]

