[[row]]
label = "rem:deux_pushup"
extra_lean_files = ["Causal/Lines.lean", "Causal/DeuxPushup.lean"]
decls = ["Causal.lightlikeLine_pushUp", "Causal.lightlikeLine_not_causallyPlain", "Causal.deux_pushup", "Causal.deux_pushup_neither", "Causal.deux_pushup_absolutelyMinimal", "Causal.deuxPushup", "Causal.deuxPushup_causallyPlain", "Causal.deuxPushup_not_pushUp", "Causal.deuxPushup_isCausal", "Causal.Causality.pushUp_of_causallyPlain_of_absolutelyMinimal", "Causal.lightlikeLine_absolutelyMinimal"]
lean_proved_override = "partial"
bucket = "B"
blocked_on = "OQ-39 (the converse half needs a non-local causality; under a gluing reading, OQ-18, it is false)"
notes = "First half: the lightlike line has the push-up property and is not causally plain. The converse independence is argued in the remark, not exhibited. T-ett-deux-pushup (atlas-team, 2026-11-20), audit AUDIT-1 minor (a bold mark on a partial label, wording; fixed at integration): both halves proved in the library's reading, sorry-free, in Causal.DeuxPushup (graduated 2026-11-20 by T-ett-deux-pushup-graduate; no statement changed) — push-up without plainness: the lightlike line, now also absolutely minimal; plainness without push-up: Causal.deuxPushup on ℝ (ofRelation, NON-local: no absolutely minimal witness can exist, Causality.pushUp_of_causallyPlain_of_absolutelyMinimal on T1 spaces)."

paper_findings = ["ETT.tex:316 (and 303-304, 'logically independent'): 'neither implies the other' holds in the 'equivalently' form of defi:causalite (ETT.tex:245-251) only through a causality that is not absolutely minimal. On a T1 (a fortiori Hausdorff) space, an absolutely minimal causally plain causality has the push-up property of defi:pushup (Lean: Causality.pushUp_of_causallyPlain_of_absolutelyMinimal; on an open subset, pushUpOn_of_causallyPlainOn_of_absolutelyMinimalOn). Proof: absolute minimality against the cover {M∖{y}, M∖{z}} makes y ≪_U z factor as y ≪_U w ≪_U z (interpolatesOn_of_absolutelyMinimalOn); given x ≤_U y ≪_U z, the open set I^+_U(y) ∩ I^-_U(z) ∋ w lies in Int J^+_U(x) ⊂ closure I^+_U(x) by plainness, so some v has x ≪_U v ≪_U z (pushUpOn_of_causallyPlainOn_of_interpolatesOn). The paper's examples (Minkowski space, the static spacetimes and E_alpha, every causality generated from local ones by theo:causalite_engendre, hence the singular flat spacetimes) are absolutely minimal, so on all of them causal plainness implies push-up. If 'sheaf' (ETT.tex:238) carries a gluing condition, which for these covariant (extension-map) data means the relations on U are generated by those on any open cover of U, i.e. absolute minimality of every open subset, then the converse half of the remark is false for every topological spacetime. Witness of the true half in the gluing-free reading: deuxPushup on ℝ, causal, causally plain, -2 ≤ -1 ≪ 1 and not -2 ≪ 1 (deuxPushup_causallyPlain, deuxPushup_not_pushUp, deuxPushup_isCausal, deuxPushup_not_absolutelyMinimal).", "ETT.tex:318-320 ('silent at a point whose causal future or past has empty interior'): this is not the mechanism and does not yield an example. At a point x with Int J^+_U(x) = ∅ the future clauses of defi:pushup at x hold too, vacuously (I^+_U(x) = ∅ = I^+_U(J^+_U(x)); Causality.pushUp_future_of_interior_Jplus_eq_empty, past: pushUp_past_of_interior_Jminus_eq_empty). Any failure x ≤_U y ≪_U z, not x ≪_U z, has z ∈ Int J^+_U(x) and y ∈ Int J^-_U(z) (mem_interior_Jplus_of_le_of_lt, mem_interior_Jminus_of_lt_of_le). What plainness leaves open is the gap between I^+_U(x) and its closure (it gives z ∈ closure I^+_U(x), mem_closure_Iplus_of_le_of_lt_of_causallyPlain), and only a chronological relation without interpolation (y ≪ z with I^+(y) ∩ I^-(z) = ∅) reaches into it. Suggested wording: exhibit the example, or say 'causal plainness only places I^+(J^+(x)) in the closure of I^+(x)'."]
