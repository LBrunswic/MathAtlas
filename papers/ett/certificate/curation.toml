blocked_on = "OQ-34 (which metric on E₀: the printed one makes the line timelike) and OQ-35 (the undefined 'lightlike', 'past distinguishing', 'extreme BTZ white hole'); l.1353–1355 is false as printed (DEC-64)"
notes = "Not formalized; its causal facts are fields of BTZAxioms (SingularFlat). (WP-11, audited) DEC-64 (2026-11-02): the field Iplus_eq (I^+(p) = J^+(p) \\ sing_0, the sentence of l.1352-1355) is false in E_0 and was replaced in the strict library by Iplus_of_lt (p ≤ p', p ≠ p', both BTZ ⇒ J^+(p') \\ sing_0 ⊂ I^+(p)), true in E_0; lt_of_le_of_not_mem (false at the same pair) is deleted for lt_of_lt_of_le_of_not_mem; K_monotone, K_densite_sing and K_ordre are re-proved; mesure_admissible is unchanged (it takes the re-proved K_monotone) from the corrected field with their statements unchanged; Causality.K_monotone (PushUp) takes the corresponding weaker BTZ hypothesis. CBG/Geometry's copy SingularFlatAxiomsCorr is deleted, CBG asks the library bundle. T-ett-port-e0 (atlas-team, 2026-11-20), audit AUDIT-1 minor (wording, fixed in round 1): E₀ = ℝ × ℂ and its curve causality ported verbatim from lean-gx GX/BTZ/Causality.lean l.116–1646 at c48aa45 into the strict Causal.Port.E0Model / E0Causality / E0Axioms (160 declarations, no GX import); Causal.E0.btzAxioms is the BTZAxioms instance at the paper's model (DEC-64's Iplus_of_lt form); assembly Causal.E0.causal_E0. Every assertion of the row except l.1353–1355 is proved at the model under the readings of OQ-34/OQ-35; DEC-64's finding now has a Lean witness in the ETT library (Iplus_ne_Jplus_diff, not_btzIplusAsPrinted) and the repair I⁺(p) = Int J⁺(p) ∖ sing₀ (Iplus_axis_eq_interior_diff), true at the BTZ model. Unmarked: readings."
paper_findings = ["l.1329-1331 (the sentence before the definition; the audit cited l.1327) give E_0 the metric −dτ² + dρ² + ρ²dθ² and call its singular locus {ρ = 0} a lightlike line. With that metric ∂_τ has norm −1 on {ρ = 0}, so the line is timelike, contradicting 'lightlike' (and defi:causal_E0's I^-(p) = ∅). Most likely a transcription error: the flat extreme-BTZ metric has the form −2 dτ dρ + ρ² dθ², for which {ρ = 0} is lightlike. (Auditor's side observation, by hand; nothing in WP-11 depends on the metric.)", "The sentence I^+(p) = J^+(p) \\ sing_0 (l.1352-1355) is flagged in the source at l.1351 as quoted from the thesis where it is asserted without proof; WP-11's field Iplus_eq assumes it, globally, and lt_of_le_of_not_mem, K_monotone, K_densite_sing, K_ordre and mesure_admissible rest on it.", "DEC-64 (2026-11-02), the l.1351 'verify' answered: the sentence I^+(p) = J^+(p) \\ sing_0 is FALSE in E_0 (gx review of the CBG geometry interface, C1; by hand, not formalized: the library has no E_0). For the metric −2dτdr + dr² + r²dθ² a future causal vector has r' ≥ 0 and 2τ'r' ≥ r'² + r²θ'², so f = τ − r/2 is non-decreasing along causal and strictly increasing along timelike curves; the radial null ray t ↦ (t/2, t, θ₀) from p = (0,0) reaches x = (s/2, s, θ₀), s > 0, so x ∈ J^+(p) \\ sing_0 while f(x) = f(p) gives x ∉ I^+(p) (locally I^+(p) = {r > 0, τ − τ(p) > r/2}). 'Every non-BTZ point of the causal future of p lies in its chronological future' fails along the null ray. The true statement, now the field Iplus_of_lt of BTZAxioms: for p < p' on the BTZ line, J^+(p') \\ sing_0 ⊂ I^+(p) (a regular y ≥ p' has r(y) > 0 and f(y) ≥ f(p') > f(p)). Every use the paper makes of the sentence (prop:K_monotone l.1630, prop:K_densite_sing) needs only that form, at a point strictly below a BTZ point; the statements of those propositions are unaffected. The thesis states the sentence the same way.", "ETT.tex:1348-1349: 'In particular a BTZ point is strongly tarentin in the future' does not follow from the displayed facts, which are about the past (I^-(p) = ∅, J^-(p) the half-line). It needs I^+(p) ∩ U ≠ ∅ for every neighbourhood U, i.e. the shape of the future cone of p ({r > 0, f > τ_p}, Causal.E0.Iplus_axis), which the definition only states afterwards (l.1353-1355), and wrongly. The claim itself is true (Causal.E0.mem_Zplus); only 'in particular' overstates the derivation for the future half."]

