notes = "Strongly causal (DEC-18). The equivalence rests only on theo:geroch's cited step; the Σ × ℝ splitting is proved from the flow of lem:vecteur as a named hypothesis (its openness is asserted, not argued, by the paper). (WP-11, audited) T-ett-geroch-iii-i (atlas-team, 2026-11-20), audit AUDIT-1 minor (wording, fixed in round 1). The formalized statement (SingularGeroch.geroch_sing_of_stronglyCausal) is false: chronological Minkowski space with an empty singular locus satisfies SingularFlatAxioms, strong causality and ModelMeasures (Causal.not_geroch_sing_of_stronglyCausal, sorry-free); the paper's theorem is not refuted (OQ-33). Not an anchor of this row."
paper_findings = ["See rem:singular_flat_spacetime_therefore: the proof's 'direct consequence of theo:geroch and prop:mesure_admissible' needs strong causality, which, without DEC-18, is available only in direction (i)=>(ii)/(iii). The E_alpha-modulo-a-translation example is the reason for DEC-18. The former paper-form geroch_sing and its tagged sorry stronglyCausal_of_ii_or_iii are removed; no form without strong causality is stated.", "The formalized statement of theo:geroch_sing is false: CausalScaffold.SingularGeroch's geroch_sing_of_stronglyCausal (SingularFlatAxioms, strong causality, ModelMeasures ⇒ TFAE[(i),(ii),(iii)]). Witness: chronological Minkowski space with an empty singular locus (Causal.not_geroch_sing_of_stronglyCausal, sorry-free). A throwaway check derived False from geroch_sing_of_stronglyCausal with it. This refutes the abstraction, not the paper. ETT.tex:1781 'a direct consequence of Theorem theo:geroch' inherits the gap of theo:geroch's (iii)⇒(i). A true singular flat spacetime may still satisfy the theorem through the local closedness of its model relations (lem:densite_modele, ETT.tex:1464), which SingularFlatAxioms does not carry."]

