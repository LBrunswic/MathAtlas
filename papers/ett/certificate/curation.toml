notes = "DEC-21: every maximal chain of the ordered set (M, ≤) is Dedekind-complete (equivalently, every cut has its bound in the chain). Minkowski space and every static spacetime over a complete geodesic space are causally complete; the half-plane ℝ × ]0,∞[ is not (a local example). The curve reading (b) of DEC-20 is kept, unmarked, as a related notion. (WP-6, WP-6b, audited) Related, not anchors (the curve reading (b), superseded for completeness by DEC-21's order reading; in the strict Causal/ChainsCurves.lean since its graduation; moved out of decls by T-ett-curation-decls, 2026-11-20): Causal.Causality.IsLUBOn, Causal.Causality.SupCompleteIn, Causal.Causality.AmbientDedekindComplete, Causal.Causality.CausallyCompleteCurves, Causal.Causality.dual_ambientDedekindComplete, Causal.Causality.CausallyCompleteCurves.dual, Causal.Causality.dual_causallyCompleteCurves, Causal.Causality.CausalCurveIn.exists_isLUBOn, Causal.Causality.CausalCurveIn.supCompleteIn_image, Causal.Causality.CausalCurveIn.ambientDedekindComplete_image, Causal.Causality.causallyCompleteCurves_of_unbounded, Causal.Causality.CausallyCompleteCurves.not_forall_le, Causal.Causality.causallyCompleteCurves_iff_unbounded, Causal.Causality.dedekindComplete_of_isLUBOn, Causal.Causality.AmbientDedekindComplete.dedekindComplete, Causal.Causality.CausalCurveIn.dedekindComplete_image, Causal.staticCausality.Inextensible.not_forall_le, Causal.staticCausality.Inextensible.not_forall_ge, Causal.staticCausality.causallyCompleteCurves, Causal.geodesicSpace_Ioi_zero, Causal.nullRay, Causal.nullRay_snd, Causal.nullRay_causalCurveIn, Causal.nullRay_inextensible, Causal.halfPlane_not_causallyCompleteCurves, Causal.halfPlane_nullRay_dedekindComplete, Causal.timelikeLine_causallyCompleteCurves, Causal.minkowski_causallyCompleteCurves."
paper_findings = ["ETT.tex:354 a maximal chain is only locally totally ordered, so 'Dedekind-complete' (a notion for linear orders) needs an order on a set which need not be linear. Read for the preorder ≤_M induced on S: every non-empty subset bounded above has an IsLUB (mathlib vocabulary). The IsGLB half then follows in any preorder (DedekindComplete.exists_isGLB), so the reading is time-symmetric (dual_dedekindComplete).", "The master's reading of DEC-21 and the author's literal sentence agree on causal spacetimes: requiring every 'author-chain' (totally ordered; a point cutting S into two NON-EMPTY pieces, strictly below and strictly above, lies in S) to be Dedekind-complete is equivalent to CausallyCompleteOrder (causallyCompleteOrder_iff_author, due to the WP-6b audit).", "Under DEC-21 the notion is neither vacuous nor trivial. Maximal chains of (M, ≤) exist through every chain (Zorn, exists_isMaxChain_le) and are not dense. Every maximal chain of Minkowski space ℝ^{1,n} (every n) and of the timelike line is Dedekind-complete (minkowski_causallyCompleteOrder, timelikeLine_causallyCompleteOrder), as is every static spacetime over a complete geodesic space, proper or not (staticCausality.causallyCompleteOrder).", "LOCAL negative example: the half-plane ℝ × ]0,∞[ (an open subset of 1+1 Minkowski, its causality of curves; causal, tarentin, strongly causal, causally arc-connected, absolutely minimal). The two null rays t + x = 1 and t − x = 1 form a maximal chain of (M, ≤) (halfPlaneWedge_isMaxChain) whose cut at the missing corner (1, 0) has no bound (halfPlane_not_causallyCompleteOrder).", "Relation with the curve reading (b) (CausallyCompleteCurves, ChainsCurves): reading (b) does NOT imply the DEC-21 notion — ℚ with its order is complete for curves (all causal curves constant, rat_causallyCompleteCurves) and not order-complete (ℚ is its own maximal chain, cut at √2, rat_not_causallyCompleteOrder); the witness is non-local and not causally arc-connected (rat_not_absolutelyMinimal, rat_not_causallyArcConnected). Whether the DEC-21 notion implies (b), in general or under DEC-22's hypotheses, is open: both follow from causal compactness under them, both fail on the half-plane, both hold over ℝ × C([0,1], ℝ)."]

