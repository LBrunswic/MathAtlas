notes = "No `sorry` beneath the strict part. As written (maximal among subset chains) a maximal chain of a T1 spacetime is dense, so none exists in a spacetime with locally unrelated open sets (Minkowski space of dimension ≥ 2, in prose); the definition is degenerate. WP-6, audited twice."
paper_findings = ["ETT.tex:335 with the subset notion (2), a maximal chain of a T1 space is DENSE (IsMaximalChain.dense): any point outside the closure of a chain can be added to it.", "Abstract consequence, proved (not_isMaximalChain_of_hasUnrelatedOpensIn): in a nonempty T1 space, if every point has an open neighbourhood U such that every non-empty open O ⊆ U contains two non-empty open sets with no ≤_U relation between their points, there is no maximal chain. Proof: the dense maximal chain S meets both unrelated sets inside the V ⊆ U where S ∩ V is totally ordered for ≤_V, and ≤_V ⊆ ≤_U by axiom (b). The global form (U = ⊤) is not_isMaximalChain_of_hasUnrelatedOpensIn_top; the spacelike line satisfies it (spacelikeLine_hasUnrelatedOpensIn_top), which re-derives spacelikeLine_not_isMaximalChain.", "Application to Lorentzian manifolds (prose; no Lorentzian manifold is in the library): let M have dimension ≥ 2, chronology and causality conditions arbitrary (vicious spacetimes included). Take at each x a convex normal neighbourhood U, with ≤_U the relation 'joined by a causal curve in U'. Every non-empty open O ⊆ U contains two points spacelike-separated in U (e.g. on a short spacelike geodesic), and since J_U is closed in U × U for a convex normal U, small balls around them are ≤_U-unrelated. So the hypothesis holds with local U, and there is NO maximal causal chain. Because only ≤_U for small U is used, no global causality condition is needed. Consequently, as written, causal completeness holds vacuously in every Lorentzian manifold of dimension ≥ 2 and causal connectedness fails there. The paper presumably means maximal among CONNECTED chains, or among chain maps / curves maximal under extension (DEC-11)."]

