[[entry]]
label = "rem:pas_plat"
status = "checked"
kind = "false"
printed = "ETT.tex:289-298"
printed_sha256 = "a691b7d01183ce3d34351c9c7b667167a6665857a2af17d590b28e46f953825e"
finding = "Item (ii) and the claim that causal plainness 'fails in the two families' are false: every E≥0-manifold (absolutely minimal, an isomorphic chart at each point) is causally plain, since J⁻ of a set of BTZ points has empty interior. Only (i), the causal bubble, violates Definition defi:causalement_plat."
refutation = ["Causal.SingularRowsLocal.causallyPlain"]
anchor = ["Causal.Causality.IsCausalBubble.not_causallyPlain", "Causal.Causality.IsCausalBubble.not_causallyPlain_past", "Causal.SingularRowsLocal.pas_plat_ii"]
basis = ["DEC-25", "DEC-150", "DEC-151", "DEC-152", "DEC-167", "DEC-168"]
rewritten = '''
This is the topological form of push-up. It fails in low regularity; at the BTZ points of a $\mass{\geq0}$-manifold a degenerate relative of the defect appears, which causal plainness does not detect.

\begin{enumerate}[label=(\roman*)]
\item \emph{Low regularity.} Let $\U$ be an open subset of a topological spacetime $M$ and $A\subset M$. A \emph{causal bubble} of $J^+_\U(A)$ is a non-empty open subset of $J^+_\U(A)$ disjoint from $I^+_\U(A)$, and dually for $J^-_\U(A)$ and $I^-_\U(A)$. If some $J^+_\U(A)$ or some $J^-_\U(A)$ has a causal bubble, then $M$ is not causally plain (Definition \ref{defi:causalement_plat}). For the causal bubbles of metrics below Lipschitz regularity, see Chru\'sciel and Grant \cite{MR2949547}, S\"amann \cite{MR3500220} and the survey \cite{samann2024nonregular}.
\item \emph{Singularities.} Let $M$ be a Hausdorff $\mass{\geq0}$-manifold endowed with an absolutely minimal causality such that every point of $M$ lies in the domain of a chart of its $\mass{\geq0}$-structure (a $(G,X)$-chart or a chart into a model space $\mass{\kappa}$) which is an isomorphism of topological spacetimes onto its image. Then:
  \begin{enumerate}[label=(\alph*)]
  \item $I^-(p)=\emptyset$ for every BTZ point $p\in\sing_0(M)$;
  \item if $M$ is causal, then for every $p\in\sing_0(M)$ there is a closed embedding $\gamma:\RR\to M$ with $\gamma(0)=p$, whose image is the connected component of $\sing_0(M)$ containing $p$, such that $J^-(p)=\gamma(]-\infty,0])$, the singular half-line below $p$;
  \item $\mathrm{Int}\left(J^-_\U(A)\right)=\emptyset$ for every open subset $\U$ of $M$ and every $A\subset \sing_0(M)$;
  \item $M$ is causally plain.
  \end{enumerate}
  The defect at a BTZ point, causal past without chronological past, is therefore not a violation of Definition \ref{defi:causalement_plat}: the causal past has empty interior.
\end{enumerate}

Imposing causal plainness as an axiom would therefore exclude the spacetimes of (i) which have a causal bubble, but not the $\mass{\geq0}$-manifolds of (ii).
'''
changes = ["~ conclusion: 'This is the push-up property, and it fails in the two families … the same phenomenon' becomes 'the topological form of push-up; it fails in low regularity' (the relational push-up of defi:pushup holds on E≥0-manifolds, cor:pushup_sing); the singular family is refuted by Causal.SingularRowsLocal.causallyPlain", "~ conclusion (i): the causal bubble is defined for every open U and every A (and in the past), and the statement is the implication 'a bubble ⇒ not causally plain'; the bubbles of the cited C⁰ metrics are not built, so the citations are kept as pointers only and the Lipschitz-threshold sentence is dropped", "+ hypothesis (ii): M Hausdorff, its causality absolutely minimal (DEC-167) with an isomorphic chart at each point (the natural causality of cor:massA_causalite and prop:GX_sing_espace_temps_topo is of this kind); the E≥0-structure read as DEC-25 with Isom = SO₀(1,2) ⋉ ℝ³ (DEC-152), E₀ as DEC-150, BTZ point = point of sing₀(M) (DEC-151)", "+ hypothesis (ii)(b): M causal, needed for J⁻(p) to be the half-line (without it the anchor gives only γ(]−∞,0]) ⊆ J⁻(p) ⊆ range γ)", "+ conclusion (ii)(c),(d): Int J⁻_U(A) = ∅ for A ⊆ sing₀(M), and M is causally plain (DEC-168 keeps causal plainness and asks it proved for the models)", "- conclusion: 'This is the degenerate case of the same defect' and 'would exclude precisely the objects announced in the introduction', both refuted by (ii)(d)", "- exposition: the closing sentence on K± (agreement with I± under push-up, prop:tarentin_fort_K, and Geroch's Theorem) points to other statements and is not part of this remark's anchor; the abstract (l.131–134) and the introduction (l.214–216) repeat the refuted claim and need the same change"]
check = "CHECK-rem_pas_plat-1.json"

[[entry]]
label = "rem:causal_completeness_slightly_weaker"
status = "checked"
kind = "underspecified"
printed = "ETT.tex:356-358"
printed_sha256 = "f463c3e529928646378a06a92c77f601f3c7e85cd6c62b1123286471ba5fc282"
finding = "Without hypotheses 'causally compact ⇒ causally complete' fails: the bowtie (four discrete events, a non-local causality) is causal, Hausdorff, second countable, causally compact and not causally complete. The remark holds, in both halves, under the hypotheses DEC-22 adds and the reading of DEC-21."
refutation = ["Causal.not_causallyCompact_imp_causallyComplete"]
anchor = ["Causal.Causality.causallyCompleteOrder_of_causallyCompact", "Causal.not_causallyCompleteOrder_imp_causallyCompact"]
basis = ["DEC-21", "DEC-22"]
rewritten = '''
Here a maximal causal chain of $M$ is a subset of $M$ totally ordered by $\leq_M$ and maximal for inclusion among such subsets, and it is Dedekind-complete if every non-empty subset of it which is bounded above in it has a least upper bound in it (for $\leq_M$).
\begin{enumerate}
\item Let $M$ be a Hausdorff, tarentin, causal topological spacetime. If $M$ is causally compact, then $M$ is causally complete.
\item The converse fails: there is a second countable, Hausdorff, tarentin, causal, causally arc-connected, absolutely minimal and strongly causal topological spacetime $M$ with $J^+(p)\neq\{p\}$ and $J^-(p)\neq\{p\}$ for every $p\in M$, which is causally complete and not causally compact.
\end{enumerate}
'''
changes = ["~ reading: a maximal causal chain is a maximal totally ordered subset of (M, ≤_M), and Dedekind-complete means every non-empty subset bounded above has a least upper bound in the chain (DEC-21)", "+ hypothesis (1): M Hausdorff, tarentin and causal (DEC-22); without them the implication fails (Causal.not_causallyCompact_imp_causallyComplete, the bowtie, non-local). DEC-22 lists also causal arc-connectedness and J±(p) ≠ {p}, which (1) does not use", "~ conclusion: 'slightly weaker' split into its two halves, the implication (1) and the strictness (2)", "+ conclusion (2): the strictness witness carries every hypothesis of DEC-22 and is moreover second countable, absolutely minimal and strongly causal (a static spacetime over C([0,1], ℝ); it is not locally compact)"]
check = "CHECK-rem_causal_completeness_slightly_weaker-1.json"

