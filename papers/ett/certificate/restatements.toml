[[entry]]
label = "rem:K_borelien"
status = "checked"
kind = "false"
printed = "ETT.tex:829-835"
printed_sha256 = "a6bed38a8be4019b5d77e51b1c110f6ff6868f117a5a79a3631b973c62b6713e"
finding = "'A countable union of sets open in J^±(p), hence a Borel subset of M' is false: a relatively open subset of a non-Borel J⁻(p) need not be Borel. Minkowski space with spokes is second countable, Hausdorff, tarentin, causal and absolutely minimal, and K⁻(p) is not Borel (K⁺ likewise by time reversal)."
refutation = ["Causal.not_kBorelienAsPrinted", "Causal.not_kBorelienPlusAsPrinted", "Causal.spokes_counterexample", "Causal.spokes_counterexample_future"]
anchor = ["Causal.Causality.exists_seq_mem_interior_Jplus", "Causal.Causality.Kminus_eq_inter_isOpen", "Causal.Causality.measurableSet_Kminus", "Causal.Causality.measurableSet_Kplus", "Causal.Causality.measurableSet_K_of_globallyHyperbolic", "Causal.not_kBorelienAsPrinted", "Causal.not_kBorelienPlusAsPrinted"]
rewritten = '''
Definition \ref{defi:futur_continue} presents $K^\pm(p)$ as an intersection over the \emph{uncountable}
family of sequences converging to $p$, so its measurability is not immediate --- yet inner regularity
is applied to it in Proposition \ref{prop:cont_ext_cont}. Let $M$ be a tarentin topological spacetime in which every point has a countable basis of neighbourhoods, and let $p\in M$. Then one may choose a single sequence $(p_n)$ converging to $p$ with $p\in \ring J^+(p_n)$ for every $n$, and Lemma \ref{lem:K_facile} shows that $K^-(p)=J^-(p)\cap O$ for some open subset $O$ of $M$. Hence:
\begin{enumerate}
\item $K^-(p)$ is a Borel subset of $M$ as soon as $J^-(p)$ is, and $K^+(p)$ is Borel as soon as $J^+(p)$ is;
\item if moreover $M$ is Hausdorff and globally hyperbolic, as in Proposition \ref{prop:cont_ext_cont}, then $K^-(p)$ and $K^+(p)$ are Borel subsets of $M$.
\end{enumerate}
The hypothesis on $J^\pm(p)$ in (1) cannot be dropped: there is a second countable, Hausdorff, tarentin topological spacetime $M$ and a point $p\in M$ such that $K^-(p)$ is not a Borel subset of $M$, and likewise one, with a point $p$, such that $K^+(p)$ is not a Borel subset of $M$.
'''
changes = ["+ hypothesis: every point has a countable basis of neighbourhoods (used to pick the single sequence; the paper's Remark rem:suite_croissante uses it too)", "~ conclusion: 'a countable union of sets open in J^±(p), hence a Borel subset of M' becomes K⁻(p) = J⁻(p) ∩ O with O open, hence Borel as soon as J⁻(p) is (and dually for K⁺); refuted as printed by Causal.not_kBorelienAsPrinted and Causal.not_kBorelienPlusAsPrinted (Minkowski space with spokes, Causal.spokes_counterexample, which is moreover causal and absolutely minimal)", "+ conclusion (2): in the setting of prop:cont_ext_cont (Hausdorff, globally hyperbolic), the one place the remark is used, K±(p) is Borel", "~ notation: 'open in J^±(p)' read as open in J⁻(p) for K⁻(p)", "+ conclusion: the counterexample sentence, which excludes the refuting instance", "~ the further true forms (K⁻(p) Borel when M is causally plain or has push-up and p ∈ Z⁻(M); measurableSet_Kminus_of_causallyPlain, measurableSet_Kminus_of_pushUp) are not stated; they may be added as a third item"]
check = "CHECK-rem_K_borelien-1.json"

[[entry]]
label = "rem:K_neq_I"
status = "checked"
kind = "false"
printed = "ETT.tex:871-882"
printed_sha256 = "fb07eac24e2b4f52c5ec9f23156a5c0d0a173be14248775219ce9269b6321742"
finding = "The bubble sentence is false: under every hypothesis of prop:tarentin_fort_K except causal plainness, a causal bubble B of J⁺(p) may miss K⁺(p), with K⁺(p) = I⁺(p) (Minkowski plane with one spoke). The BTZ point does not show again that causal plainness cannot be dropped: E₀ is causally plain, and what fails there is p ∈ Z⁻."
refutation = ["Causal.not_bubbleKplusAsPrinted", "Causal.not_bubbleKplusNeAsPrinted"]
anchor = ["Causal.E0.K_neq_I", "Causal.E0.Zminus_cannot_be_dropped", "Causal.Causality.inter_Kplus_nonempty_iff", "Causal.Causality.Kplus_ne_Iplus_of_bubble", "Causal.not_bubbleKplusNeAsPrinted"]
basis = ["DEC-150", "DEC-151"]
rewritten = '''
Causal plainness cannot be dropped from Proposition \ref{prop:tarentin_fort_K}. Let $\RR$ carry the causal relation of the timelike line ($x\leq_\U y$ if and only if $x\leq y$ and $[x,y]\subset\U$) and the chronological relation $x\ll_\U y$ if and only if $-1<x<y$ and $[x,y]\subset \U$. This topological spacetime is tarentin, absolutely minimal and causal, $0$ is strongly tarentin in the past, it is not causally plain, and $K^-(0)\neq I^-(0)$.

A causal bubble alone does not separate $K^\pm$ from $I^\pm$. Let $M$ be a topological spacetime, $p\in M$, $(p_n)$ a sequence converging to $p$ with $p\in \mathrm{Int}\left(J^-(p_n)\right)$ for every $n$, and $B$ an open subset of $M$ contained in $J^+(p)$. Then $B$ meets $K^+(p)$ if and only if there exist $N\in\N$ and a non-empty open set $W\subset B$ with $W\subset J^+(p_n)$ for every $n\geq N$. If $B$ meets $K^+(p)$ and $B\cap I^+(p)=\emptyset$, then $K^+(p)\neq I^+(p)$. A causal bubble that does not meet $K^+(p)$ does not force this: there is a second countable, Hausdorff, absolutely minimal, tarentin topological spacetime $M$, a point $p\in M$ strongly tarentin in the future, and a non-empty open set $B\subset J^+(p)$ disjoint from $I^+(p)$, with $K^+(p)=I^+(p)$.

A separation of another kind occurs at a BTZ point. In $\mass{0}$ (Definition \ref{defi:causal_E0}) the singular line $\sing(\mass{0})$ is non-empty and every $p\in\sing(\mass{0})$ satisfies $I^-(p)=\emptyset$ and $K^-(p)=J^-(p)\setminus\{p\}\neq\emptyset$, so $K^-(p)\neq I^-(p)$. Here $\mass{0}$ is causally plain, absolutely minimal, tarentin, causal, Hausdorff and second countable, and the hypothesis of Proposition \ref{prop:tarentin_fort_K} which fails is that $p$ be strongly tarentin in the past: $p\notin Z^-(\mass{0})$.
'''
changes = ["~ conclusion: 'causal plainness cannot be dropped' is kept and given its witness, the half-chronological line", "- conclusion: 'if B is a causal bubble of J⁺(p) … then B meets K⁺(p), so K⁺(p) ≠ I⁺(p)' is false under the hypotheses of prop:tarentin_fort_K without causal plainness (Causal.not_bubbleKplusAsPrinted, Causal.not_bubbleKplusNeAsPrinted: Minkowski plane with one spoke)", "+ conclusion: the true form from lem:K_facile, a bubble meets K⁺(p) iff a non-empty open part of it lies in J⁺(pₙ) for all large n, and then K⁺(p) ≠ I⁺(p); stated in M (the anchor holds in every open U)", "~ conclusion: the BTZ sentence is stated at E₀ (DEC-150, DEC-151), which is causal as prop:K_calcul (c) requires, and placed as a failure of p ∈ Z⁻ rather than a second failure of causal plainness (E₀ is causally plain)", "- exposition: the closing paragraph (everything that follows is built on K±) is a forward pointer with no statement of its own and is not restated", "- citation: the low-regularity citations of the bubble sentence are dropped with the sentence they supported"]
check = "CHECK-rem_K_neq_I-1.json"

[[entry]]
label = "def:cauchy_surface"
status = "checked"
kind = "underspecified"
printed = "ETT.tex:999-1001"
printed_sha256 = "c94036f2cd50f6ba2c7d880411617493374123cd6f0b66a73f70c3f5c655ffc7"
finding = "Read literally ('every causal curve'), the definition admits no Cauchy surface as soon as some causal curve is non-constant: constant curves are causal (DEC-6), forcing S = M, and a non-constant curve then meets S twice. DEC-14 rules 'every inextensible causal curve'."
refutation = ["Causal.Causality.not_isCauchySurfaceLiteral"]
anchor = ["Causal.Causality.IsCauchySurface", "Causal.Causality.IsCauchySurfaceOn"]
basis = ["DEC-6", "DEC-14"]
rewritten = '''
Let $M$ be a topological spacetime. A Cauchy surface in $M$ is a subset
$S\subset M$ such that every inextensible causal curve of $M$ meets $S$ exactly once: for every inextensible causal curve $c:I\to M$, there is exactly one point of $S$ in $c(I)$.
'''
changes = ["+ hypothesis: 'inextensible' (DEC-14); with every causal curve, constant curves included (DEC-6), no subset is a Cauchy surface once some causal curve is non-constant (Causal.Causality.not_isCauchySurfaceLiteral)", "~ notation: 'meets S exactly once' read on the image, one point of S in c(I) (a non-injective curve may pass through it at several parameters)"]
check = "CHECK-def_cauchy_surface-1.json"

[[entry]]
label = "rem:mesure_unilaterale_ptr"
status = "checked"
kind = "false"
printed = "ETT.tex:1045-1052"
printed_sha256 = "19d373d9a40b9196032775fca041a02f7f550062e4464155862a7b305af6ff71"
finding = "False in the generality stated: the lightlike line is a causal chain along which every chronological past is empty, and the standard Gaussian measure on it is admissible in the past and in the future. The obstruction needs K⁺(p) ⊆ I⁺(p) at the lower end, which holds at every point of an E≥0-manifold."
refutation = ["Causal.lightlikeLine_admissible_past_and_future", "Causal.lightlikeLine_chain"]
anchor = ["Causal.Causality.not_admissiblePast_and_admissibleFuture", "Causal.SingularRowsGeroch.not_admissible_both_of_chain", "Causal.SingularRowsGeroch.chain_subset_sing", "Causal.lightlikeLine_admissible_past_and_future", "Causal.lightlikeLine_chain"]
basis = ["DEC-25", "DEC-150", "DEC-151", "DEC-152", "DEC-167"]
rewritten = '''
The one-sided formulation is not a stylistic choice. Let $M$ be a topological spacetime and let $p,q\in M$ with $p\leq q$ and $p\neq q$, such that $J^-(q)\setminus J^-(p)\subset J^+(p)$ and $I^-(r)=\emptyset$ for every $r\in J^-(q)\setminus J^-(p)$ (the analogue of a segment of a BTZ line).
\begin{enumerate}
\item If $K^+(p)\subset I^+(p)$, then no measure on $M$ is admissible in the past and in the future at once, property $4$ being the obstruction; the computation is carried out in Remark \ref{rem:mesure_unilaterale} of Section \ref{subsec:geroch_sing}.
\item If $M$ is a $\mass{\geq0}$-manifold endowed with an absolutely minimal causality such that every point lies in the domain of a chart of its $\mass{\geq0}$-structure which is an isomorphism of topological spacetimes onto its image, then no measure on $M$ is admissible in the past and in the future at once, and $J^-(q)\setminus J^-(p)\subset \sing_0(M)$.
\item The hypothesis $K^+(p)\subset I^+(p)$ of (1) cannot be dropped: on the lightlike line (Example \ref{ex:causalities_lines}, item 2), every $p<q$ satisfies $J^-(q)\setminus J^-(p)\subset J^+(p)$, every chronological past is empty, $K^+(p)\not\subset I^+(p)$, and the standard Gaussian measure is admissible in the past and in the future.
\end{enumerate}
Geroch's Theorem \ref{theo:geroch} is accordingly fed a \emph{pair} of measures.
'''
changes = ["~ hypothesis: 'carries the analogue of a BTZ line, a causal chain along which chronological pasts are empty' made explicit as p ≤ q, p ≠ q, J⁻(q) ∖ J⁻(p) ⊆ J⁺(p) and I⁻(r) = ∅ on J⁻(q) ∖ J⁻(p) (WP-3's reading of the chain)", "+ hypothesis (1): K⁺(p) ⊆ I⁺(p), which the computation of rem:mesure_unilaterale uses (prop:K_calcul (b)); without it the claim is refuted on the lightlike line (Causal.lightlikeLine_admissible_past_and_future, Causal.lightlikeLine_chain)", "+ conclusion (2): at E≥0-manifolds the extra hypothesis is discharged and the remark holds as printed, with no Hausdorff, countability or causality hypothesis; the natural causality of cor:massA_causalite is absolutely minimal (DEC-167) with every chart an isomorphism (prop:GX_sing_espace_temps_topo); E≥0-structure read as DEC-25, DEC-152, E₀ and BTZ point as DEC-150, DEC-151; such a chain lies in sing₀(M), so it is a segment of BTZ points", "+ conclusion (3): the counterexample, which excludes the refuting instance", "~ notation: a measure on M is admissible in the sense of defi:mesure_dieckmann; the anchor allows any σ-algebra"]
check = "CHECK-rem_mesure_unilaterale_ptr-1.json"

