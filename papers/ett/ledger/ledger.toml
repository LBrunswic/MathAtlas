# Ledger configuration for ett. Phase 0: ledger and label audit only; the Lean namespace is not built yet.
[paper]
root = "../legacy/labeled"
document = "ETT.tex"
notation = ["alias.tex", "definition.tex"]
files = [["ETT.tex", "body", "P"]]
env_alias = { defi = "definition", theo = "theorem", prop = "proposition", lem = "lemma", cor = "corollary", rem = "remark", propri = "property", exemple = "example", cexemple = "counterexample", conj = "conjecture" }
label_prefixes = ["theo", "lem", "prop", "cor", "def", "defi", "rem", "propri", "ex", "cex"]
coverage_recursive = false

[lean]
root = "../../../lean"
strict = ["Causal"]
scaffold = ["scaffold/CausalScaffold"]
scope = ["*"]

[output]
dir = "."
json = "ledger.json"
markdown = "LEDGER.md"
dot = "dag.dot"
tool_name = "tools/ledger.py"
